ているため法人であっても合同会社の社員になることができる。"},{"l":7,"m":"設立","sb":"","i":"A","r":"","q":"持分会社は，社員の氏名または名称および住所を登記しなければならない。","a":false,"c":"912条5号,913条5号,914条各号参照。","e":"合名会社および合資会社は，社員の氏名または名称および住所を登記しなければならないが（912 条５号，913 条５号），合同会社には，当該事項を登記することは求められていない（914 条各号参照）。これは，合同会社の社員の責任は間接有限責任であり，社員となった時点で出資の履行が済んでいるため（578 条），社員全員の氏名等を公示する必要がないからである。"},{"l":8,"m":"設立","sb":"","i":"A","r":"","q":"持分会社の定款には，社員が無限責任社員または有限責任社員のいずれかの別を記載しなければならない。","a":true,"c":"576条1項5号。","e":"社員の責任を明らかにするためである。"},{"l":9,"m":"設立","sb":"","i":"A","r":"(平21問題16ウ類)","q":"持分会社の定款には，社員の出資の目的およびその価額または評価の標準を記載しなければならない。","a":true,"c":"576条1項6号。","e":""},{"l":10,"m":"設立","sb":"","i":"A","r":"(平25II問題14ア)","q":"合資会社は，１人の社員で設立することができる。","a":false,"c":"576条3項。","e":"設立しようとする持分会社が合資会社である場合には，その社員の一部を無限責任社員とし，その他の社員を有限責任社員とする旨を記載し，または記録しなければならない。すなわち，合資会社は，直接無限責任社員および直接有限責任社員からなる会社である。したがって，合資会社は，１人の社員で設立することができず，最低でも２人の社員が必要である。"},{"l":11,"m":"設立","sb":"","i":"C","r":"","q":"持分会社の定款には，会社法で記載しなければならないとされているもの以外の事項を記載してはならない。","a":false,"c":"577条。","e":"持分会社の定款には，絶対的記載事項のほか，相対的記載事項および任意的記載事項を記載することができる。"},{"l":12,"m":"設立","sb":"","i":"A","r":"(平29I問題17ア・平23I問題15ウ類)","q":"合同会社の社員は，金銭その他の財産に限り出資することができる。","a":true,"c":"576条1項6号かっこ書。","e":"合同会社の社員は有限責任社員である（576 条４項）。ここで，有限責任社員の出資は，財産出資に限られる。なぜなら，有限責任社員は，定款で定めた出資の価額の範囲内で会社の債務について責任を負うため，出資の価額について評価可能である必要がある。そのため，評価不能な労務出資および信用出資は認められないのである。"},{"l":13,"m":"設立","sb":"","i":"A","r":"(平30II問題16ア類・平29II問題15ア類・平26II問題12ア類)","q":"有限責任社員になろうとする者は，労務または自己に対する信用を出資の目的とすることができない。","a":true,"c":"576条1項6号かっこ書。","e":"上記問題12の解説参照。有限責任社員の出資は，財産出資に限られることとなる。"},{"l":14,"m":"設立","sb":"","i":"B","r":"(平27II問題14ア)","q":"合同会社の社員になろうとする者全員の同意があるときは，設立時の出資の履行に関する登記，登録その他権利の設定または移転を第三者に対抗するために必要な行為は，合同会社の成立後にすることができる。","a":true,"c":"578条ただし書。","e":"合同会社の社員になろうとする者は，定款の作成後，合同会社の設立の登記をする時までに，その出資に係る金銭の全額の払い込み，または，その出資に係る金銭以外の財産の全部を給付しなければならない（578 条本文）。このように，合同会社においては，全額払込制および全部給付制が採用されている。ただし，合同会社の社員になろうとする者全員の同意があるときは，登記，登録その他権利の設定または移転を第三者に対抗するために必要な行為は，合同会社の成立後にすることを妨げない。"},{"l":15,"m":"設立","sb":"","i":"B","r":"","q":"設立しようとする持分会社が合同会社である場合において，当該合同会社の社員になろうとする者が現物出資をする場合には，裁判所選任の検査役の調査を受けなければならない。","a":false,"c":"","e":"持分会社においては，株式会社と異なり，現物出資に関する検査役の調査や填補責任は要求されていない。"},{"l":16,"m":"設立","sb":"","i":"C","r":"","q":"合名会社および合資会社は，定款を作成することによって成立する。","a":false,"c":"579条。","e":"持分会社は，その本店の所在地において設立の登記をすることによって成立する。"},{"l":17,"m":"設立","sb":"","i":"C","r":"","q":"持分会社の設立においては，設立無効の訴えにより当該設立の無効を主張することができない。","a":false,"c":"828条1項1号。","e":"持分会社の設立においても，設立無効の訴えによる設立の無効の主張が認められる。"},{"l":18,"m":"設立","sb":"","i":"C","r":"","q":"持分会社の設立においては，ある社員の心神喪失を理由として，設立無効の訴えを提起することができる。","a":true,"c":"828条1項1号。","e":"持分会社については，客観的瑕疵のみならず，主観的瑕疵に基づく設立無効の訴えも認められる。このように，持分会社において，主観的瑕疵に基づく設立無効の訴えが認められる理由は，持分会社の社員間には人的信頼関係が存在し，その個性が重視されるところ，１人の設立の意思表示が無効となるものである限り，それ以外の者のみによる会社の設立を認めるべきではないためである。"},{"l":19,"m":"設立","sb":"","i":"B","r":"","q":"持分会社において，ある社員が民法その他の法律により設立に係る意思表示を取り消すことができるときは，当該持分会社のすべての社員は，設立の取消しの訴えを提起することができる。","a":false,"c":"832条1号。","e":"持分会社において，ある社員が民法その他の法律により設立に係る意思表示を取り消すことができるときは，当該社員は，設立の取消しの訴えを提起することができる。また，社員が債権者を害することを知って持分会社を設立した場合において，設立取消しの訴えを提起することができるのは当該債権者に限られる（832条２号）。"},{"l":20,"m":"設立","sb":"","i":"C","r":"","q":"持分会社の設立の無効または取消しの訴えに係る請求を認容する判決が確定した場合において，その無効または取消しの原因が一部の社員のみにあるときは，他の社員の全員の同意によって，当該持分会社を継続することができる。","a":true,"c":"845条。","e":"持分会社の社員間には人的信頼関係が存在し，その個性が重視されるため，１人の設立の意思表示が無効・取り消しうるものである限り，それ以外の者のみによる会社の設立を認めるべきではないが，他の社員が会社の継続を欲している場合には，社員の意思を尊重し，会社の継続を認めても問題はないため，他の社員全員の同意により会社を継続することが認められている。"},{"l":1,"m":"社員","sb":"社員の責任","i":"B","r":"(令2I問題15ア・平28II問題18ア)","q":"有限責任社員が持分会社の債務を弁済する責任を負う場合には，その責任は未履行の出資の価額を限度とする。","a":true,"c":"580条2項。","e":"有限責任社員は，その出資の価額（既に持分会社に対し履行した出資の価額を除く）を限度として，持分会社の債務を弁済する責任を負う。合資会社においては，社員の出資の履行時期は法定されていないため，出資の未履行分がある場合には，その未履行部分につき会社債権者に対して直接責任を負担する。これに対して，合同会社の社員には出資の未履行部分はないはずであるので，会社債権者に対して直接責任を負担することはない。"},{"l":2,"m":"社員","sb":"社員の責任","i":"B","r":"(令2I問題15イ・平25II問題14イ類)","q":"社員が持分会社の債務を弁済する責任を負う場合，当該社員は，持分会社が主張することができる抗弁をもって当該持分会社の債権者に対抗することができない。","a":false,"c":"581条1項。","e":"社員が持分会社の債務を弁済する責任を負う場合，当該社員は，持分会社が主張することができる抗弁をもって当該持分会社の債権者に対抗することができる。また，持分会社が当該債権者に対して相殺権，取消権または解除権を有するときは，社員は，当該債権者に対して債務の履行を拒むことができる（581条２項）。"},{"l":3,"m":"社員","sb":"社員の責任","i":"B","r":"(令2I問題15ウ・平23II問題17ア)","q":"社員が金銭を出資の目的とした場合において，その出資をすることを怠ったときは，当該社員は，その利息を支払うほか，損害の賠償をしなければならない。","a":true,"c":"582条1項。","e":"合同会社においては，全額払込制（578 条本文）がとられているため，当該規定は，合名会社および合資会社の社員に適用されるものである。"},{"l":4,"m":"社員","sb":"社員の責任","i":"A","r":"(平28I問題18ウ類)","q":"有限責任社員が無限責任社員となった場合には，当該無限責任社員となった者は，その者が無限責任社員となる前に生じた持分会社の債務についても，無限責任社員としてこれを弁済する責任を負う。","a":true,"c":"583条1項。","e":"有限責任社員が無限責任社員になることを，実質的には無限責任社員の加入（605 条）と同様であると捉えているのである。"},{"l":5,"m":"社員","sb":"社員の責任","i":"B","r":"(令6I問題15イ類)","q":"合資会社の有限責任社員が出資の価額を減少した場合，当該有限責任社員は，その旨の登記をする前に生じた持分会社の債務について，登記後の出資の価額の範囲内でこれを弁済する責任を負う。","a":false,"c":"583条2項。","e":"合資会社の有限責任社員が出資の価額を減少した場合であっても，当該有限責任社員は，その旨の登記をする前に生じた持分会社の債務については，従前の責任の範囲内でこれを弁済する責任を負う。従前の出資額を信頼した会社債権者を保護する趣旨である。なお，合同会社の社員は有限責任社員であるが，583 条２項は適用されない。合同会社の社員の責任は間接有限責任であり，出資の価額を減少する以前からも当該社員は会社債権者に対して直接責任を負っているわけではないからである。"},{"l":6,"m":"社員","sb":"社員の責任","i":"B","r":"(平30II問題16ウ・平26II問題12イ)","q":"無限責任社員が有限責任社員となった場合には，当該有限責任社員となった者は，その旨の登記をする前に生じた持分会社の債務について，無限責任社員としてこれを弁済する責任を負わない。","a":false,"c":"583条3項。","e":"無限責任社員が有限責任社員となった場合であっても，当該有限責任社員となった者は，その旨の登記をする前に生じた持分会社の債務については，無限責任社員として当該債務を弁済する責任を負う。これは，無限責任社員が有限責任社員になることを，実質的には無限責任社員の退社（612 条１項）と同様と捉えているのである。"},{"l":1,"m":"社員","sb":"誤認行為の責任","i":"B","r":"(平27I問題12イ)","q":"合資会社の有限責任社員が自己を無限責任社員であると誤認させる行為をしたときは，当該有限責任社員は，その誤認に基づいて当該合資会社と取引をした者に対し，自己の出資の価額を限度として責任を負う。","a":false,"c":"588条1項。","e":"合資会社の有限責任社員が自己を無限責任社員であると誤認させる行為をしたときは，当該有限責任社員は，その誤認に基づいて合資会社と取引をした者に対し，無限責任社員と同一の責任を負う。誤認した相手方を保護するための規定である。"},{"l":2,"m":"社員","sb":"誤認行為の責任","i":"B","r":"(令2II問題15エ)","q":"合名会社の社員でない者が自己を当該合名会社の社員であると誤認させる行為をしたときは，当該社員でない者は，その誤認に基づいて当該合名会社と取引をした者に対し，当該合名会社の社員と同一の責任を負う。","a":true,"c":"589条1項。","e":""},{"l":1,"m":"定款の変更","sb":"","i":"A","r":"(平30II問題16エ・平24I問題15ウ類)","q":"持分会社は，定款に別段の定めがある場合を除き，総社員の同意によって，定款の変更をすることができる。","a":true,"c":"637条。","e":"持分会社は社員間に人的信頼関係があるため，持分会社の根本規則である定款の変更をするためには，慎重を期して，総社員の同意を要求している。"},{"l":2,"m":"定款の変更","sb":"","i":"A","r":"(平24II問題16ウ)","q":"持分会社は，総社員の４分の３以上に当たる多数をもって定款を変更することができる旨を定款で定めることができる。","a":true,"c":"637条。","e":"持分会社における定款の変更は，原則として総社員の同意によらなければならないが，定款で別段の定めを設けることができる。したがって，持分会社は，総社員の４分の３以上に当たる多数をもって定款を変更することができる旨を定款で定めることができる。"},{"l":3,"m":"定款の変更","sb":"","i":"B","r":"","q":"合資会社がその社員の全部を有限責任社員とする定款の変更をする場合において，当該定款の変更をする持分会社の社員が当該定款の変更後の合同会社に対する出資に係る払込みまたは給付の全部または一部を履行していないときは，当該定款の変更は，当該払込みおよび給付が完了した日に，その効力を生ずる。","a":true,"c":"638条2項2号,640条1項。","e":""},{"l":4,"m":"定款の変更","sb":"","i":"B","r":"(平24II問題16エ)","q":"合同会社は，その社員の全部を無限責任社員とする定款の変更をして，合名会社となることはできない。","a":false,"c":"638条3項1号。","e":"合同会社は，その社員の全部を無限責任社員とする定款の変更をすることにより，合名会社となる。"},{"l":5,"m":"定款の変更","sb":"","i":"B","r":"(令4I問題16ア類・平23II問題17ウ)","q":"合資会社の有限責任社員が退社したことにより当該合資会社の社員が無限責任社員のみとなった場合には，当該合資会社は，合名会社となる定款の変更をしたものとみなされる。","a":true,"c":"639条1項。","e":"合資会社は，有限責任社員と無限責任社員から構成される持分会社であるため，社員が無限責任社員のみとなった場合は，合資会社には該当しないこととなる。したがって，合資会社の有限責任社員が退社したことによって社員が無限責任社員のみとなった場合には，合名会社となる定款の変更をしたものとみなされる。"},{"l":6,"m":"定款の変更","sb":"","i":"B","r":"(平29II問題15エ)","q":"無限責任社員が退社したことにより合資会社の社員が有限責任社員のみとなった場合には，当該合資会社は，合同会社となる定款の変更をしたものとみなされる。","a":true,"c":"639条2項。","e":"なお，当該規定により合同会社となる定款の変更をしたものとみなされた場合において，社員がその出資に係る払込みまたは給付の全部または一部を履行していないときは，当該定款の変更をしたものとみなされた日から１か月以内に，当該払込みまたは給付を完了しなければならない。ただし，当該期間内に，合名会社または合資会社となる定款の変更をした場合は，この限りでない（640条２項）。"},{"l":1,"m":"管理","sb":"持分会社の業務執行","i":"B","r":"(平23I問題15イ)","q":"合同会社は，定款によっても，一部の社員のみを業務を執行する社員と定めることはできない。","a":false,"c":"590条1項。","e":"持分会社の社員は，定款に別段の定めがある場合を除き，当該持分会社の業務を執行する。つまり，持分会社の社員は全員が業務執行権限を有するのが原則であるが，定款により，一部の社員のみを業務を執行する社員と定めることは可能である。"},{"l":2,"m":"管理","sb":"持分会社の業務執行","i":"B","r":"(令2II問題15イ・平28I問題18ア)","q":"持分会社は，社員が２人以上ある場合には，当該持分会社の業務を執行する社員を定款で定めなければならない。","a":false,"c":"590条1項。","e":"持分会社の社員は，定款に別段の定めがある場合を除き，当該持分会社の業務を執行する。つまり，持分会社の社員は全員が業務執行権限を有するのが原則であるが，業務を執行する社員を定款で定めることができ，その場合は当該社員が業務執行権を有することになる。"},{"l":3,"m":"管理","sb":"持分会社の業務執行","i":"B","r":"(平27II問題14エ・平20問題16ウ)","q":"合資会社の有限責任社員は，定款に別段の定めがある場合を除き，当該合資会社の業務を執行する権限を有しない。","a":false,"c":"590条1項。","e":"持分会社の社員は，定款に別段の定めがある場合を除き，当該持分会社の業務を執行する。ここで，当該業務執行権を与えるか否かと社員の責任とは無関係なので，合資会社の有限責任社員であっても，原則として業務執行権限がある。"},{"l":4,"m":"管理","sb":"持分会社の業務執行","i":"B","r":"","q":"持分会社の社員が２人以上ある場合には，持分会社の業務は，定款に別段の定めがある場合を除き，社員全員の同意をもって決定する。","a":false,"c":"590条2項。","e":"持分会社の社員が２人以上ある場合には，持分会社の業務は，定款に別段の定めがある場合を除き，社員の過半数をもって決定する。なお，定款で業務執行社員を定めた場合において，業務執行社員が２人以上あるときは，持分会社の業務は，定款に別段の定めがある場合を除き，当該業務執行社員の過半数をもって決定する（591条１項）。"},{"l":5,"m":"管理","sb":"持分会社の業務執行","i":"C","r":"","q":"持分会社の常務は，その完了前に他の社員が異議を述べた場合を除き，持分会社の社員が２人以上ある場合であっても，各社員が単独で行うことができる。","a":true,"c":"590条3項。","e":""},{"l":6,"m":"管理","sb":"持分会社の業務執行","i":"A","r":"(令6II問題15エ・平31I問題15ウ類・平22I問題17ウ類)","q":"業務執行社員を定款で定めた場合，支配人の選任および解任は，定款で別段の定めがある場合を除き，業務執行社員の過半数をもって決定する。","a":false,"c":"591条2項本文。","e":"業務執行社員を定款で定めた場合であっても，支配人の選任および解任は，社員の過半数をもって決定する（591条２項本文）。ただし，定款で別段の定めを設けることができる（591条２項ただし書）。"},{"l":7,"m":"管理","sb":"持分会社の業務執行","i":"B","r":"(平23II問題17エ類)","q":"業務執行社員を定款で定めた場合，当該業務執行社員は，定款に別段の定めがある場合を除き，いつでも辞任することができる。","a":false,"c":"591条4項。","e":"業務執行社員を定款で定めた場合には，当該業務執行社員は，正当な事由がなければ，辞任することができない。なぜなら，業務執行社員を定款で定めている場合については，当該業務執行社員のみが業務を執行する権限を有しているため，安易な辞任を認めると，業務活動に重大な影響を与えることになるからである。なお，定款で別段の定めを設けることができる（591条６項）。"},{"l":8,"m":"管理","sb":"持分会社の業務執行","i":"B","r":"","q":"業務執行社員を定款で定めた場合，当該業務執行社員は，定款に別段の定めがある場合を除き，正当な事由がある場合に限って，他の社員の一致によって解任することができる。","a":true,"c":"591条5項6項。","e":""},{"l":9,"m":"管理","sb":"持分会社の業務執行","i":"C","r":"(平31II問題15イ類)","q":"業務執行社員を定款で定めた場合には，業務執行権を有しない社員は，会社の業務および財産の状況を調査する権限が与えられるが，当該調査権は，定款によって制限を加えることは認められない。","a":false,"c":"592条。","e":"業務執行社員を定款で定めた場合，業務執行権を有しない社員は業務執行に関与することができないが，会社の業務および財産の状況を調査する権限が与えられる（592 条１項）。これは，業務執行権を有しない社員に対して，業務執行社員による業務執行の適正性を調査する権限を与えることで，業務執行権を有しない社員の利益を保護するためである。なお，当該調査権は，定款によって異なる定めをすることが可能であるが，定款によっても，事業年度の終了時または重要な事由がある場合には，調査権の行使を制限することは許されない（592条２項）。"},{"l":1,"m":"管理","sb":"業務執行社員","i":"C","r":"(平31I問題15エ類)","q":"業務執行社員は，定款に別段の定めがある場合を除き，持分会社または他の社員の請求があるときは，いつでもその職務の執行の状況を報告し，その職務が終了した後は，遅滞なくその経過および結果を報告しなければならない。","a":true,"c":"593条3項5項。","e":""},{"l":2,"m":"管理","sb":"業務執行社員","i":"A","r":"(平28II問題18ウ類・平24I問題15ア類)","q":"業務執行社員は，定款に別段の定めがある場合を除き，当該社員以外の社員の過半数の承認を受けなければ，自己または第三者のために持分会社の事業の部類に属する取引をしてはならない。","a":false,"c":"594条1項1号。","e":"業務執行社員は，当該社員以外の社員の全員の承認を受けなければ，自己または第三者のために持分会社の事業の部類に属する取引をしてはならない。"},{"l":3,"m":"管理","sb":"業務執行社員","i":"A","r":"(平31I問題15ア類・平20問題16イ類)","q":"業務執行社員は，定款に別段の定めがある場合を除き，持分会社の事業と同種の事業を目的とする会社の取締役，執行役または業務執行社員となることは一切認められない。","a":false,"c":"594条1項2号。","e":"業務執行社員は，当該社員以外の社員の全員の承認を受ければ，持分会社の事業と同種の事業を目的とする会社の取締役，執行役または業務執行社員となることができる。このように，持分会社の競業の制限については，株式会社における取締役の競業避止義務（356条１項１号）の範囲よりも広い範囲に渡って制限がなされている。"},{"l":4,"m":"管理","sb":"業務執行社員","i":"A","r":"(平27I問題12ア)","q":"合同会社の業務を執行する社員以外の社員が，当該合同会社の事業と同種の事業を目的とする株式会社の取締役となるためには，定款に別段の定めがある場合を除き，当該社員以外の社員の全員の承認が必要である。","a":false,"c":"594条1項柱書本文。","e":"持分会社の業務を執行する社員以外の社員については，競業避止義務は課せられていない。"},{"l":5,"m":"管理","sb":"業務執行社員","i":"B","r":"","q":"業務執行社員は，当該社員以外の社員の全員の承認を受けずに自己または第三者のために持分会社の事業の部類に属する取引をしたときは，当該行為によって当該業務執行社員または第三者が得た利益の額は，持分会社に生じた損害の額と推定する。","a":true,"c":"594条2項。","e":"当該趣旨は，損害額の立証を容易にすることにある。"},{"l":6,"m":"管理","sb":"業務執行社員","i":"A","r":"(平31I問題15イ・平28I問題18イ・平25I問題15ア)","q":"持分会社の業務を執行する社員が自己または第三者のために当該持分会社と取引をしようとするときは，定款に別段の定めがある場合を除き，当該社員以外の社員の過半数の承認を受けなければならない。","a":true,"c":"595条1項1号。","e":""},{"l":7,"m":"管理","sb":"業務執行社員","i":"B","r":"(平25I問題15イ)","q":"業務執行社員は，その任務を怠ったときは，持分会社に対し，連帯して，これによって生じた損害を賠償する責任を負う。","a":true,"c":"596条。","e":"当該規定は，株式会社における役員等の会社に対する損害賠償責任（423 条１項）と同様の趣旨から設けられている。"},{"l":8,"m":"管理","sb":"業務執行社員","i":"C","r":"","q":"合同会社の業務執行社員がその職務を行うについて悪意または重大な過失があったときは，当該社員は，連帯して，これによって第三者に生じた損害を賠償する責任を負う。","a":true,"c":"597条。","e":"業務を執行する有限責任社員がその職務を行うについて悪意または重過失があったときは，当該有限責任社員は，連帯して，これによって第三者に生じた損害を賠償する責任を負う。当該規定は，株式会社における役員等の第三者に対する損害賠償責任（429条１項）と同様の趣旨から設けられている。"},{"l":9,"m":"管理","sb":"業務執行社員","i":"A","r":"(令2II問題15ア・平28II問題18イ・平25I問題15エ類・平24I問題15イ・平22I問題17イ類)","q":"持分会社は，法人を業務執行社員として定めることができない。","a":false,"c":"","e":"業務執行社員は自然人に限られず，法人であってもよい。法人が業務執行社員である場合には，当該法人は，当該業務を執行する社員の職務を行うべき者を選任し，その者の氏名および住所を他の社員に通知しなければならない（598条１項）。"},{"l":1,"m":"管理","sb":"持分会社の代表","i":"B","r":"","q":"業務執行社員を定款で定めた場合であっても，原則として，すべての社員が持分会社を代表する。","a":false,"c":"599条1項2項。","e":"業務執行社員は持分会社を代表し（599 条１項），業務執行社員が２人以上ある場合には，定款または定款の定めに基づく社員の互選によって業務執行社員の中から持分会社を代表する社員を定めた場合を除き，業務執行社員は各自，持分会社を代表する（599 条２項３項）。したがって，業務を執行しない社員は，持分会社を代表することはない。"},{"l":2,"m":"管理","sb":"持分会社の代表","i":"B","r":"","q":"業務執行社員が２人以上いる場合は，業務執行社員は各自，持分会社を代表し，業務執行社員の中から持分会社を代表する社員を定めることは認められない。","a":false,"c":"599条3項。","e":"持分会社は，定款または定款の定めに基づく業務執行社員の互選によって，業務執行社員の中から持分会社を代表する社員を定めることができる（599 条３項）。すなわち，この場合は当該業務執行社員以外の業務執行社員は，会社の代表権を有しない（599条１項ただし書）。"},{"l":3,"m":"管理","sb":"持分会社の代表","i":"C","r":"","q":"持分会社を代表する社員は，持分会社の業務に関する一切の裁判上または裁判外の行為をする権限を有する。","a":true,"c":"599条4項。","e":"持分会社を代表する業務執行社員の代表権についても，株式会社の代表取締役と同様に，包括性（599 条４項）および不可制限性（599条５項）が規定されている。"},{"l":4,"m":"管理","sb":"持分会社の代表","i":"B","r":"(平22I問題18ア)","q":"持分会社は，持分会社を代表する社員がその職務を行うについて第三者に加えた損害を賠償する責任を負う。","a":true,"c":"600条。","e":"持分会社の代表者が，その職務を行うにつき，不法行為によって第三者に損害を加えた場合，持分会社は損害を賠償する責任を負う。"},{"l":5,"m":"管理","sb":"持分会社の代表","i":"C","r":"","q":"持分会社が社員に対し，または社員が持分会社に対して訴えを提起する場合，当該社員以外の社員の過半数をもって，当該訴えについて持分会社を代表する者を定めなければならない。","a":false,"c":"601条。","e":"持分会社が社員に対し，または社員が持分会社に対して訴えを提起する場合において，当該社員以外に当該訴えについて持分会社を代表する者が存在しないときは，当該社員以外の社員の過半数をもって，当該訴えについて持分会社を代表する者を定めることができる。"},{"l":6,"m":"管理","sb":"持分会社の代表","i":"C","r":"","q":"社員が持分会社に対して社員の責任を追及する訴えの提起を請求した場合において，持分会社が当該請求の日から60日以内に当該訴えを提起しないときは，当該請求をした社員は，当該訴えが当該社員もしくは第三者の不正な利益を図りまたは当該持分会社に損害を与えることを目的とする場合を除き，当該訴えについて持分会社を代表することができる。","a":true,"c":"602条。","e":"当該制度は，株式会社における株主代表訴訟（847条）に該当する制度である。"},{"l":1,"m":"持分の譲渡等","sb":"","i":"A","r":"","q":"持分会社の社員は，原則として，他の社員の全員の承諾がなければ，その持分の全部または一部を他人に譲渡することができない。","a":true,"c":"585条1項。","e":"持分を譲渡するにあたって，原則として，他の社員の全員の承諾が要求される趣旨は，持分会社の社員間には人的信頼関係が存在し，その個性が重視されるためである。すなわち，持分会社の社員は，原則として業務執行権を有するので，業務執行者の変更を伴う持分の譲渡は社員全員に影響を及ぼす可能性があり，また，個々の社員にとって好ましくない者が社員になるのを防止する必要があるためである。なお，定款で別段の定めを設けることが認められる（585条４項）。"},{"l":2,"m":"持分の譲渡等","sb":"","i":"A","r":"(平22I問題17エ類)","q":"持分会社の有限責任社員は，業務執行社員の全員の同意があるときは，その持分の全部または一部を他人に譲渡することができる。","a":false,"c":"585条2項。","e":"持分会社の業務を執行しない有限責任社員は，業務執行社員の全員の同意があるときは，その持分の全部または一部を他人に譲渡することができる。業務を執行しない有限責任社員の持分譲渡の要件が緩和されている理由は，業務を執行せず，有限責任しか負わない社員の個性を重視する必要性に乏しいためである。また，業務を執行しない有限責任社員の持分の譲渡に伴い定款の変更を生ずるときは，その持分の譲渡による定款の変更は，業務執行社員の全員の同意によってすることができる（585条３項）。"},{"l":3,"m":"持分の譲渡等","sb":"","i":"A","r":"(平26II問題12ウ)","q":"特定の社員が業務を執行する旨の定款の定めのある合名会社において，当該特定の社員の承諾を得なければ持分の全部または一部を譲渡することができない旨の定款の定めは，有効である。","a":true,"c":"585条1項4項。","e":"持分会社の社員は，原則として，他の社員の全員の承諾がなければ，その持分の全部または一部を他人に譲渡することができない。これは，持分会社の社員間には人的信頼関係が存在し，その個性が重視されるためである。ただし，持分の譲渡については，定款で自由に定めることが認められているため，本肢は正しい。"},{"l":4,"m":"持分の譲渡等","sb":"","i":"C","r":"(令6II問題15ア)","q":"業務を執行しない有限責任社員の持分の譲渡に伴い定款の変更を生ずるときは，定款に別段の定めがない限り，その持分の譲渡による定款の変更は，他の社員の全員の同意によらなければならない。","a":false,"c":"585条3項。","e":"業務を執行しない有限責任社員の持分の譲渡に伴い定款の変更が必要となるときは，その持分の譲渡による定款の変更は，業務を執行する社員の全員の同意によってすることができる。このように，持分譲渡の要件と定款変更の要件を一致させているのである。"},{"l":5,"m":"持分の譲渡等","sb":"","i":"A","r":"(令2II問題15ウ・平28I問題18エ)","q":"持分の全部を他人に譲渡した社員は，その旨の登記をする前に生じた持分会社の債務について，従前の責任の範囲内でこれを弁済する責任を負う。","a":true,"c":"586条1項。","e":"持分会社においては，社員の人的信用を基礎としているため，持分の全部を譲渡した社員が持分会社の社員であることを信頼して取引を行った会社債権者を保護する趣旨である。なお，当該責任は，登記後２年以内に請求または請求の予告をしない持分会社の債権者に対しては，当該登記後２年を経過した時に消滅する（586条２項）。"},{"l":6,"m":"持分の譲渡等","sb":"","i":"A","r":"(令2I問題15エ・平26II問題12エ類・平23II問題17イ)","q":"持分会社は，社員全員の同意により，その持分の全部または一部を譲り受けることができる。","a":false,"c":"587条1項。","e":"持分会社は，その持分の全部または一部を譲り受けることができない（587 条１項）。また，合併など譲渡以外の方法により持分を取得した場合には，当該持分は，当該持分会社がこれを取得したときに消滅する（587条２項）。"},{"l":7,"m":"持分の譲渡等","sb":"","i":"A","r":"(令6I問題15ウ・平29I問題17イ・平27II問題14ウ類)","q":"合同会社が当該合同会社の持分を取得した場合，当該合同会社は相当な時期にこれを処分しなければならない。","a":false,"c":"587条2項。","e":"上記問題６の解説参照。"},{"l":1,"m":"社員の加入および退社","sb":"社員の加入","i":"A","r":"(平29II問題15イ・平25II問題14ウ類)","q":"合資会社の有限責任社員の加入は，当該社員に係る定款の変更をした時に，その効力を生ずる。","a":true,"c":"604条2項。","e":"合名会社および合資会社の社員の責任は直接責任とされているため，社員となる段階では出資の履行が義務付けられていない。そのため，合名会社および合資会社の社員の加入は，当該社員に係る定款の変更をしたときに，その効力を生ずる。"},{"l":2,"m":"社員の加入および退社","sb":"社員の加入","i":"A","r":"(令6I問題15エ類・平27I問題12ウ類)","q":"合同会社の社員の加入は，当該社員に係る定款の変更をした時に，その効力を生じる。","a":false,"c":"604条3項。","e":"合同会社において，定款の変更時に新たに社員になろうとする者がその出資に係る払込みまたは給付の全部または一部を履行していないときは，当該払込みまたは給付を完了したときに当該社員の加入の効力が生じる（604条３項）。これは，合同会社においては，会社債権者を保護するために，全額払込制，全部給付制を採用しているためである。"},{"l":3,"m":"社員の加入および退社","sb":"社員の加入","i":"B","r":"(平25I問題15ウ類)","q":"持分会社の成立後に加入した社員は，その加入前に生じた持分会社の債務についても，これを弁済する責任を負う。","a":true,"c":"605条。","e":""},{"l":1,"m":"社員の加入および退社","sb":"社員の退社","i":"C","r":"","q":"持分会社の存続期間を定款で定めなかった場合には，定款で別段の定めがある場合を除き，各社員は，いつでも退社することができる。","a":false,"c":"606条1項。","e":"持分会社の存続期間を定款で定めなかった場合，または，ある社員の終身の間持分会社が存続することを定款で定めた場合には，各社員は，事業年度の終了の時において退社をすることができる。この場合においては，各社員は，６か月前までに持分会社に退社の予告をしなければならない（606条１項）。"},{"l":2,"m":"社員の加入および退社","sb":"社員の退社","i":"C","r":"","q":"持分会社の各社員は，やむを得ない事由があるときは，いつでも退社することができる。","a":true,"c":"606条3項。","e":""},{"l":3,"m":"社員の加入および退社","sb":"社員の退社","i":"B","r":"(令3問題15イ類・平24II問題14イ)","q":"合資会社は，当該合資会社の社員が出資義務を履行しない場合には，その出資義務を履行しない対象社員以外の社員の過半数の決議に基づき，訴えをもって対象社員の除名を請求することができる。","a":true,"c":"859条1号。","e":"除名とは，重要な義務違反などの法定の事由がある場合に，対象社員以外の社員の過半数の決議に基づき，訴えを起こして強制的に社員としての資格を剥奪することをいう（859条）。持分会社において除名が認められているのは，持分会社の社員間には人的信頼関係が存在するので，その信頼を裏切る行為をする社員が存在する場合には，その社員を会社から排除する必要があるためである。なお，除名事由は，① 出資の義務を履行しないこと，② 競業禁止の規定（594条１項）に違反したこと，③ 業務を執行するに当たって不正の行為をし，または業務を執行する権利がないのに業務の執行に関与したこと，④ 持分会社を代表するに当たって不正の行為をし，または代表権がないのに持分会社を代表して行為をしたこと，⑤ ①～④に掲げるもののほか，重要な義務を尽くさないことである。"},{"l":4,"m":"社員の加入および退社","sb":"社員の退社","i":"B","r":"(令3問題15ア)","q":"持分会社の社員は，総社員の同意によって退社する。","a":true,"c":"607条1項2号。","e":"持分会社のある社員の退社に係る総社員の同意は，法定の退社事由とされている。"},{"l":5,"m":"社員の加入および退社","sb":"社員の退社","i":"B","r":"(令3問題15エ類・平31II問題15エ)","q":"持分会社の社員が保佐開始の審判を受けたことは，法定の退社事由である。","a":false,"c":"607条1項各号参照。","e":"持分会社の社員が後見開始の審判を受けたことは，法定の退社事由とされているが（607 条１項７号），後見ほど判断能力が低下しているとはいえない保佐開始の審判を受けたことは，法定の退社事由とされていない。"},{"l":6,"m":"社員の加入および退社","sb":"社員の退社","i":"B","r":"(平24II問題14ウ)","q":"持分会社は，当該持分会社の社員が破産手続開始の決定という事由によっては退社しない旨を定めることができる。","a":true,"c":"607条2項。","e":""},{"l":7,"m":"社員の加入および退社","sb":"社員の退社","i":"A","r":"(令6II問題15ウ類・平30II問題16イ・平24I問題15エ・平22I問題18エ)","q":"持分会社の社員が死亡した場合には，定款で別段の定めがある場合を除き，当該社員の相続人が当該持分会社の社員となる。","a":false,"c":"607条1項3号。","e":"持分会社の社員は，死亡や合併による消滅によって当然に退社する。しかし，持分会社は，社員が死亡した場合，または合併により消滅した場合における当該社員の相続人その他の一般承継人が当該社員の持分を承継する旨を定款で定めることができる（608条１項）。"},{"l":8,"m":"社員の加入および退社","sb":"社員の退社","i":"B","r":"(令3問題15ウ類・平25II問題14エ)","q":"社員の持分を差し押さえた債権者は，事業年度の終了の６か月前までに持分会社および当該社員に退社の予告をすることで，当該事業年度の終了時において当該社員を退社させることができる。","a":true,"c":"609条1項。","e":"この結果，当該社員の有していた持分の金額の支払いを持分会社から受けることで，債権者は金銭等を回収できる。"},{"l":9,"m":"社員の加入および退社","sb":"社員の退社","i":"B","r":"","q":"退社した社員は，金銭等を出資していた場合に限って，その持分の払戻しを受けることができる。","a":false,"c":"611条1項本文。","e":"退社した社員は，その出資の種類を問わず，その持分の払戻しを受けることができる。"},{"l":10,"m":"社員の加入および退社","sb":"社員の退社","i":"B","r":"","q":"退社した社員の持分は，その出資の種類を問わず，金銭で払い戻すことができる。","a":true,"c":"611条3項。","e":""},{"l":11,"m":"社員の加入および退社","sb":"社員の退社","i":"B","r":"","q":"退社した社員は，その登記があった日から３か月以内に生じた持分会社の債務についても，従前の責任の範囲内でこれを弁済する責任を負う。","a":false,"c":"612条1項。","e":"退社した社員は，その登記をする前に生じた持分会社の債務について，従前の責任の範囲内でこれを弁済する責任を負う。当該規定は，持分の全部の譲渡をした社員の責任と同趣旨である。すなわち，持分会社は，社員の人的信用を基礎としているため，退社する社員が持分会社の社員であることを信頼して取引を行った会社債権者を保護する必要があるのである。"},{"l":12,"m":"社員の加入および退社","sb":"社員の退社","i":"B","r":"(令7I問題15エ)","q":"合同会社が持分の払戻しにより社員に対して交付する持分払戻額が当該持分の払戻しをする日における剰余金額を超える場合には，当該合同会社の債権者は，常に，当該合同会社に対して，持分の払戻しについて異議を述べることができる。","a":true,"c":"635条1項。","e":"合同会社は，有限責任社員のみで構成されているので，会社債権者を保護する必要があるためである。"},{"l":13,"m":"社員の加入および退社","sb":"社員の退社","i":"B","r":"","q":"合同会社が債権者異議手続をとらないで持分の払戻しをした場合には，当該持分の払戻しを受けた社員は，当該合同会社に対し，当該持分払戻額に相当する金銭を支払う義務を負う。","a":true,"c":"636条1項本文。","e":""},{"l":14,"m":"社員の加入および退社","sb":"社員の退社","i":"B","r":"","q":"合同会社が債権者異議手続をとらないで持分の払戻しをした場合には，当該持分の払戻しに関する業務を執行した社員は，当該合同会社に対し，当該持分の払戻しを受けた社員と連帯して，当該持分払戻額に相当する金銭の支払義務を負う。当該責任は，無過失責任である。","a":false,"c":"636条1項。","e":"合同会社が債権者異議手続をとらないで持分の払戻しをした場合には，当該持分の払戻しに関する業務を執行した社員は，当該合同会社に対し，当該持分の払戻しを受けた社員と連帯して，当該持分払戻額に相当する金銭を支払う義務を負う（636 条１項本文）。ただし，持分の払戻しに関する業務を執行した社員がその職務を行うについて注意を怠らなかったことを証明した場合は，この限りでない（636 条１項ただし書）。すなわち，当該責任は，立証責任の転換された過失責任である。"},{"l":15,"m":"社員の加入および退社","sb":"社員の退社","i":"B","r":"","q":"合同会社が債権者異議手続をとらないで持分の払戻しをした場合の当該持分の払戻しに関する業務を執行した社員の責任は，総社員の同意があれば全額免除することができる。","a":false,"c":"636条2項。","e":"業務執行社員の責任は免除することができない（636 条２項本文）。ただし，当該義務を免除することについて総社員の同意がある場合は，持分の払戻しをした時における剰余金額を限度として免除することができる（636 条２項ただし書）。"},{"l":1,"m":"計算等","sb":"会計帳簿","i":"C","r":"","q":"持分会社は，会計帳簿の閉鎖の時から 10 年間，その会計帳簿およびその事業に関する重要な資料を保存しなければならない。","a":true,"c":"615条2項。","e":""},{"l":1,"m":"計算等","sb":"計算書類","i":"B","r":"(平22I問題18イ類)","q":"合資会社は，各事業年度に係る計算書類を作成する必要はない。","a":false,"c":"617条2項。","e":"持分会社は，各事業年度に係る計算書類を作成しなければならない。したがって，合資会社であっても計算書類の作成義務があるため，本肢は誤りである。"},{"l":2,"m":"計算等","sb":"計算書類","i":"B","r":"(平26I問題14ア)","q":"持分会社は，各事業年度に係る計算書類に係る附属明細書を作成しなければならない。","a":false,"c":"617条2項参照。","e":"持分会社には，計算書類に係る附属明細書の作成義務は課せられていない。"},{"l":3,"m":"計算等","sb":"計算書類","i":"B","r":"(平26I問題14エ)","q":"合同会社は，貸借対照表の作成後遅滞なく，貸借対照表を公告しなければならない。","a":false,"c":"","e":"持分会社には，計算書類の公告義務はない。"},{"l":4,"m":"計算等","sb":"計算書類","i":"B","r":"","q":"持分会社の社員は，定款で別段の定めがある場合を除き，持分会社の営業時間内は，いつでも，計算書類の閲覧を請求することができる。","a":true,"c":"618条。","e":"なお，当該規定について定款で別段の定めを設けた場合であったとしても，社員が事業年度の終了時に閲覧謄写を請求することを制限する旨は定めることができない。"},{"l":5,"m":"計算等","sb":"計算書類","i":"A","r":"(令7I問題15イ類・令5I問題15ウ類・平29I問題17エ・平20問題16エ)","q":"合同会社の債権者は，当該合同会社の事業年度の終了時または重要な事由があるときに限り，当該合同会社の計算書類の閲覧または謄写を請求することができる。","a":false,"c":"625条参照。","e":"合同会社の債権者は，当該合同会社の営業時間内は，いつでも，計算書類の閲覧謄写を請求することができる。合同会社の社員は間接有限責任しか負わないため，株式会社の場合（442 条３項３号）と同じく，会社債権者に計算書類を開示させる必要があるからである。なお，合同会社の債権者の計算書類の閲覧謄写請求権は，定款で別段の定めを設けることができない。"},{"l":1,"m":"計算等","sb":"利益の配当","i":"B","r":"","q":"持分会社の社員は，持分会社に対し，利益の配当を請求することができる。","a":true,"c":"621条1項。","e":"持分会社の社員には，利益配当請求権が認められている。"},{"l":2,"m":"計算等","sb":"利益の配当","i":"A","r":"(平26I問題14ウ類・平23I問題15エ類)","q":"持分会社においては，損益分配の割合を定款で定めることができず，その割合は，各社員の出資の価額に応じて定める。","a":false,"c":"622条1項。","e":"損益分配の割合について定款の定めがないときは，その割合は，各社員の出資の価額に応じて定める。"},{"l":3,"m":"計算等","sb":"利益の配当","i":"A","r":"(令5I問題15イ類)","q":"持分会社の社員の損益分配の割合に関し，利益または損失の一方についてのみ分配の割合についての定めを定款で定めたときは，その割合は，利益および損失の分配に共通であるものと推定する。","a":true,"c":"622条2項。","e":""},{"l":4,"m":"計算等","sb":"利益の配当","i":"A","r":"(令5I問題15エ)","q":"合資会社および合同会社は，利益の配当により社員に対して交付する金銭等の帳簿価額が当該利益の配当をする日における利益額を超える場合には，当該利益の配当をすることができない。","a":false,"c":"628条前段。","e":"合同会社は，利益の配当により社員に対して交付する金銭等の帳簿価額が当該利益の配当をする日における利益額を超える場合には，当該利益の配当をすることができない（628 条前段）。合同会社は有限責任社員のみで構成されているので，利益の配当に特別な制限を課して会社債権者を保護する必要があるためである。この場合，合同会社は，社員による利益配当の請求を拒むことができる（628条後段）。"},{"l":5,"m":"計算等","sb":"利益の配当","i":"B","r":"","q":"合同会社が利益の配当により社員に対して交付した金銭等の帳簿価額が当該利益の配当をする日における利益額を超える場合であっても，当該利益の配当を受けた社員は，当該合同会社に対し，当該配当額に相当する金銭を支払う義務を負わない。","a":false,"c":"623条1項。","e":"合同会社が利益の配当により社員に対して交付した金銭等の帳簿価額が当該利益の配当をする日における利益額を超える場合，当該利益の配当を受けた社員は，当該合同会社に対し，当該配当額に相当する金銭を支払う義務を負う。これは，合資会社の有限責任社員に対する利益配当の場合も同様である。"},{"l":6,"m":"計算等","sb":"利益の配当","i":"C","r":"","q":"合資会社が利益の配当により有限責任社員に対して利益額を超えた配当をした場合において，当該利益の配当を受けた有限責任社員が当該配当額に相当する金銭を当該合資会社に支払わないときは，当該有限責任社員は，既に当該合資会社に対し履行した出資の価額を除いた出資の価額および当該配当額が当該利益額を超過する額の合計額を限度として，合資会社の債務を弁済する責任を負う。","a":true,"c":"623条2項。","e":"当該規定は，合同会社の社員には適用されない（630 条３項）。なぜなら，違法配当が行われた場合，合同会社の債権者は，利益の配当を受けた社員に対し，配当額または合同会社に対して有する債権額に相当する金銭を支払わせることができるためである（630条２項）。"},{"l":7,"m":"計算等","sb":"利益の配当","i":"C","r":"","q":"合同会社が利益額を超えた配当をした場合，当該利益の配当に関する業務を執行した社員は，その職務を行うについて注意を怠らなかったことを証明した場合であっても，当該合同会社に対し，当該利益の配当を受けた社員と連帯して，当該配当額に相当する金銭を支払う義務を負う。","a":false,"c":"629条1項。","e":"合同会社が利益の配当により社員に対して交付した金銭等の帳簿価額が当該利益の配当をする日における利益額を超える場合には，当該利益の配当に関する業務を執行した社員は，当該合同会社に対し，当該利益の配当を受けた社員と連帯して，当該配当額に相当する金銭を支払う義務を負う（629 条１項本文）。ただし，当該業務を執行した社員がその職務を行うについて注意を怠らなかったことを証明した場合は，この限りでない（629条１項ただし書）。すなわち，当該責任は，立証責任の転換された過失責任である。なお，当該責任は総社員の同意により，利益配当をした日における利益額を限度として免除することができる（629条２項）。"},{"l":8,"m":"計算等","sb":"利益の配当","i":"C","r":"","q":"合同会社が利益額を超えた配当をした場合において，利益の配当を受けた社員は，当該配当額について，当該利益の配当に関する業務を執行した社員からの求償の請求に応ずる義務を負わない。","a":false,"c":"630条1項。","e":"合同会社が利益額を超えた配当をした場合において，利益の配当を受けた社員は，配当額が利益の配当をした日における利益額を超えることにつき善意であるときは，当該配当額について，当該利益の配当に関する業務を執行した社員からの求償の請求に応ずる義務を負わない。なお，合同会社における出資の払戻しの制限に違反した場合も，同様の規定が設けられている（634条１項）。"},{"l":9,"m":"計算等","sb":"利益の配当","i":"C","r":"","q":"合同会社が利益額を超えた配当をした場合において，合同会社の債権者は，利益の配当を受けた社員に対し，配当額（当該配当額が債権者の合同会社に対して有する債権額を超える場合は，当該債権額）に相当する金銭を支払わせることができる。","a":true,"c":"630条2項。","e":"なお，合同会社における出資の払戻しの制限に違反した場合も，同様の規定が設けられている（634条２項）。"},{"l":10,"m":"計算等","sb":"利益の配当","i":"C","r":"","q":"合同会社が利益の配当をした場合において，当該利益の配当をした日の属する事業年度の末日に欠損額が生じたときは，当該利益の配当に関する業務を執行した社員は，職務を行うについて注意を怠らなかったことを証明した場合を除き，当該合同会社に対し，当該利益の配当を受けた社員と連帯して，当該配当額に相当する金銭を支払う義務を負う。","a":false,"c":"631条1項。","e":"合同会社が利益の配当をした場合において，当該利益の配当をした日の属する事業年度の末日に欠損額が生じたときは，当該利益の配当に関する業務を執行した社員は，職務を行うについて注意を怠らなかったことを証明した場合を除き，当該合同会社に対し，当該利益の配当を受けた社員と連帯して，その欠損額（当該欠損額が配当額を超えるときは，当該配当額）を支払う義務を負う。"},{"l":11,"m":"計算等","sb":"利益の配当","i":"C","r":"","q":"合同会社が利益の配当をした日の属する事業年度の末日に欠損額が生じたときにおける当該利益の配当に関する業務を執行した社員，および，当該利益の配当を受けた社員の責任は，総社員の同意があれば，当該利益の配当をした日における利益額を限度として免除することができる。","a":false,"c":"631条2項。","e":"合同会社が利益の配当をした日の属する事業年度の末日に欠損額が生じたときにおける当該利益の配当に関する業務を執行した社員，および，当該利益の配当を受けた社員の責任は，総社員の同意があれば免除することができる。「当該利益の配当をした日における利益額を限度として」という制限はない。"},{"l":1,"m":"計算等","sb":"出資の払戻し","i":"B","r":"(平20問題16ア)","q":"合資会社の有限責任社員は，定款に別段の定めがある場合を除き，既に出資として払込みまたは給付をした金銭等の払戻しをいつでも請求することができる。","a":true,"c":"624条1項。","e":"合名会社および合資会社の社員については，いつでも，出資の払戻しを請求することができる。一方で，合同会社の社員は，定款を変更してその出資の価額を減少する場合にのみ，出資の払戻しの請求をすることが認められる（632条１項）。"},{"l":2,"m":"計算等","sb":"出資の払戻し","i":"B","r":"(平27I問題12エ)","q":"金銭以外の財産を出資した合名会社の社員が，当該合名会社に対し出資の払戻しを請求する場合には，当該社員は，出資した当該財産の返還または当該財産の価額に相当する金銭の払戻しを請求することができる。","a":true,"c":"624条1項。","e":"合名会社および合資会社の社員については，いつでも，出資の払戻しを請求することができる。この場合において，出資財産が金銭以外の財産であるときは，当該財産の価額に相当する金銭の払戻しを請求することが認められる。"},{"l":3,"m":"計算等","sb":"出資の払戻し","i":"C","r":"","q":"合同会社が出資の払戻しにより社員に対して交付する出資払戻額が，定款を変更して出資の価額を減少した額を超えない場合は，当該出資の払戻しをすることができる。","a":false,"c":"632条2項前段。","e":"合同会社が出資の払戻しにより社員に対して交付する出資払戻額が，出資の払戻しを請求した日における剰余金額（資本金の減少をした場合にあっては，その減少後の剰余金額）または，定款を変更して出資の価額を減少した額のいずれか少ない額を超えない場合には，当該出資の払戻しをすることができる。"},{"l":4,"m":"計算等","sb":"出資の払戻し","i":"C","r":"","q":"合同会社が出資の払戻しの制限に違反して出資の払戻しをした場合，当該出資の払戻しに関する業務を執行した社員は，その職務を行うについて注意を怠らなかったことを証明した場合を除き，当該合同会社に対し，当該出資の払戻しを受けた社員と連帯して，当該出資払戻額に相当する金銭を支払う義務を負う。","a":true,"c":"633条1項。","e":""},{"l":1,"m":"計算等","sb":"資本金の額の減少","i":"C","r":"","q":"持分会社は，その目的に関わらず，資本金の額を減少することができる。","a":false,"c":"620条1項,626条1項。","e":"合名会社および合資会社において，資本金の額の減少は，損失の填補のためという目的に限定されている（620 条１項）。また，合同会社においては，損失の填補のほか，出資の払戻しまたは持分の払戻しのために，その資本金の額を減少することができる（626条１項）。"},{"l":2,"m":"計算等","sb":"資本金の額の減少","i":"C","r":"","q":"合同会社が持分の払戻しをする場合，当該持分払戻額を超えない範囲で資本金の額を減少することができる。","a":false,"c":"626条3項。","e":"合同会社が持分の払戻しをする場合，持分の払戻しのために減少する資本金の額は，持分払戻額から持分の払戻しをする日における剰余金額を控除して得た額を超えてはならない（626 条３項）。これは，出資の払戻しに伴う資本金の額の減少も同様である（626条２項）。"},{"l":3,"m":"計算等","sb":"資本金の額の減少","i":"B","r":"(令7I問題15ウ類・平29I問題17ウ)","q":"合同会社が資本金の額を減少する場合には，当該合同会社の債権者は，当該合同会社に対し，資本金の額の減少について異議を述べることができる。","a":true,"c":"627条1項。","e":"合同会社は有限責任社員のみで構成されているので，会社債権者を保護する必要があるためである。"}]},{"n":8,"name":"組織再編行為等","qs":[{"l":1,"m":"組織再編行為総論","sb":"合併","i":"A","r":"","q":"新設合併とは，２以上の会社がする合併であって，合併により消滅する会社の権利義務の全部を合併により設立する会社に承継させるものをいう。","a":true,"c":"2条28号。","e":""},{"l":2,"m":"組織再編行為総論","sb":"合併","i":"C","r":"","q":"会社は，外国会社と合併することができる。","a":false,"c":"2条1号,748条参照。","e":"合併は内国会社間でしか行うことができない。"},{"l":3,"m":"組織再編行為総論","sb":"合併","i":"A","r":"(平25I問題17イ類・平23I問題18ア類)","q":"吸収合併消滅会社には，すべての会社がなることができるが，吸収合併存続会社となることができるのは，株式会社のみである。","a":false,"c":"748条前段。","e":"会社は，他の会社と合併することができる（748条前段）。会社とは，２条１号において，「株式会社，合名会社，合資会社または合同会社」と定義されている。したがって，合併は会社の種類を問わず自由に行うことができ，また，株式会社と持分会社のいずれが存続会社となることも認められ（749条，751条），設立会社の種類も自由である（753条，755条）。"},{"l":4,"m":"組織再編行為総論","sb":"合併","i":"B","r":"(令5II問題17イ)","q":"株式会社が吸収合併消滅会社となる吸収合併の効力が生じた場合には，当該株式会社は清算をしなければならない。","a":false,"c":"471条4号,641条5号。","e":"合併により，合併当事会社のうち，消滅会社（吸収合併の場合には吸収合併消滅会社，新設合併の場合には新設合併消滅会社）が解散することになる（471条４号，641条５号）。しかし，いずれの場合においても，通常の解散の場合と異なり清算手続は不要である（475条１号かっこ書，644条１号かっこ書）。したがって，合併により解散した会社は，清算手続を経ることなく消滅することになる。"},{"l":5,"m":"組織再編行為総論","sb":"合併","i":"B","r":"(令2I問題18イ)","q":"吸収合併存続株式会社は，吸収合併消滅株式会社の株主に対して，株式等以外の財産を合併対価として交付することはできない。","a":false,"c":"749条1項2号。","e":"吸収合併は吸収型再編に分類される。したがって，対価の柔軟化が認められており，吸収合併存続会社の株式または持分を交付しなくてもよいし，株式等（株式，新株予約権および社債）以外の財産を交付することも認められる（749条１項２号，751条１項２号３号）。つまり，金銭や親会社株式などを交付することも認められる。"},{"l":6,"m":"組織再編行為総論","sb":"合併","i":"B","r":"","q":"吸収合併存続株式会社は，吸収合併消滅株式会社の株主に対して，存続会社の親会社株式を合併対価として交付することができる。","a":true,"c":"749条1項2号。","e":"対価を親会社株式とすることにより，三角合併が可能となる。なお，吸収合併消滅会社の株主または社員に対して交付する金銭等の全部または一部が存続会社の親会社株式である場合には，当該存続会社は，吸収合併に際して消滅会社の株主または社員に対して交付する当該親会社株式の総数を超えない範囲において当該親会社株式を例外的に取得することができる（800条１項）。これは，吸収分割，株式交換でも同様である。"},{"l":7,"m":"組織再編行為総論","sb":"合併","i":"A","r":"(令6I問題17ア類・令5I問題18エ類・平29II問題18ア)","q":"吸収合併契約において，吸収合併消滅株式会社の株主全員に対してその有する株式に代わる対価を吸収合併存続株式会社が交付しないことを定めることができる。","a":true,"c":"749条1項2号参照。","e":"吸収型再編においては，認められる対価について制限はない。したがって，対価の柔軟化が図られているといえ，対価のない吸収型再編も認められる。なお，消滅会社のある種類の株式の株主に対し，合併対価を交付しないこととすることも可能である。"},{"l":8,"m":"組織再編行為総論","sb":"合併","i":"A","r":"(平29II問題18イ)","q":"吸収合併存続株式会社は，吸収合併消滅株式会社からの承継債務額が承継資産額を超える場合でも，法定の手続に従って，当該吸収合併消滅株式会社の株主に対して，その有する株式に代わる対価として金銭等を交付することができる。","a":true,"c":"749条1項2号参照。","e":"合併差損が生じる場合でも，対価としてその有する株式に代わる金銭等を交付することができる。"},{"l":9,"m":"組織再編行為総論","sb":"合併","i":"A","r":"","q":"新設合併設立株式会社は，新設合併消滅株式会社の株主に対して，新設会社の社債を交付することはできない。","a":false,"c":"753条1項6号8号。","e":"新設合併は新設型再編に分類される。したがって，対価の柔軟化は認められておらず，新設合併設立会社の株式または持分を，必ず対価に含めなければならないが，設立会社の社債や新株予約権を対価として交付することも認められる。ただし，株式等以外の財産を交付することは認められていない（753条１項６号８号，755条１項６号）。"},{"l":10,"m":"組織再編行為総論","sb":"合併","i":"A","r":"(平26II問題15イ類)","q":"新設合併設立株式会社は，新設合併消滅株式会社の株主に対して，金銭を交付することはできない。","a":true,"c":"753条1項6号8号。","e":"問題９の解説参照。"},{"l":1,"m":"組織再編行為総論","sb":"会社分割","i":"A","r":"(令5II問題18イ類・平28I問題16ア類・平21問題18ア類)","q":"会社分割において，分割会社となることができるのは，株式会社および合同会社のみである。","a":true,"c":"757条前段,762条1項前段,2条29号30号。","e":"合名会社および合資会社を分割会社とすることが認められない理由は，合名会社および合資会社には無限責任社員が存在し，当該無限責任社員が会社債務につき責任を負うことから，会社分割によって会社債務を他社に承継させることを認めると，会社債権者が大きな不利益を受ける可能性があるためである。"},{"l":2,"m":"組織再編行為総論","sb":"会社分割","i":"A","r":"(平31II問題18ア類)","q":"吸収分割において，吸収分割承継会社となることができるのは，株式会社および合同会社のみである。","a":false,"c":"2条29号。","e":"吸収分割において，吸収分割承継会社となることができるのは，すべての会社である。"},{"l":3,"m":"組織再編行為総論","sb":"会社分割","i":"A","r":"(平21問題18イ)","q":"２以上の株式会社は，共同して新設分割をすることができる。","a":true,"c":"762条2項。","e":""},{"l":4,"m":"組織再編行為総論","sb":"会社分割","i":"A","r":"(平25I問題17ウ類)","q":"新設分割において，新設分割設立会社とすることができる会社の種類に制限はない。","a":true,"c":"2条30号。","e":""},{"l":5,"m":"組織再編行為総論","sb":"会社分割","i":"B","r":"","q":"吸収分割によって，事業に関して有する権利義務の全部を他の会社に承継させる場合は，吸収分割会社は解散することになる。","a":false,"c":"471条各号参照。","e":"合併とは異なり，会社分割により分割会社の事業に関して有する権利義務の全部が分割されたとしても，分割会社は当然に解散することはない。"},{"l":6,"m":"組織再編行為総論","sb":"会社分割","i":"B","r":"","q":"吸収分割承継株式会社は，吸収分割株式会社の株主に分割対価を交付する。","a":false,"c":"","e":"会社法の下では，人的分割は認められていない。すなわち，会社分割といったら物的分割を意味する。したがって，分割対価を分割会社の株主に交付することは認められない。"},{"l":7,"m":"組織再編行為総論","sb":"会社分割","i":"A","r":"","q":"吸収分割承継株式会社は，吸収分割株式会社に対して，金銭を分割対価として交付することができる。","a":true,"c":"758条4号。","e":"吸収分割は吸収型再編に分類される。したがって，対価の柔軟化が認められており，吸収分割承継会社の株式または持分を交付しなくてもよいし，株式等（株式・新株予約権・社債）以外の財産を交付することも認められる（758条４号，760条４号５号）。"},{"l":8,"m":"組織再編行為総論","sb":"会社分割","i":"A","r":"(平31I問題17イ)","q":"新設分割設立株式会社は，新設分割株式会社に対して，金銭を分割対価として交付することができる。","a":false,"c":"763条6号8号。","e":"新設分割は新設型再編に分類される。したがって，対価の柔軟化は認められておらず，新設分割会社の株式または持分を，必ず対価に含めなければならない。また，株式等以外の財産を交付することは認められていない（763 条６号８号，765条１項６号）。"},{"l":9,"m":"組織再編行為総論","sb":"会社分割","i":"C","r":"(平29II問題13イ)","q":"新設分割株式会社は，新設分割計画に定めを置くことにより，新設分割設立株式会社の成立の日において，当該設立会社から交付された当該設立会社の株式の全部を配当財産とする剰余金の配当を行うことができる。","a":true,"c":"763条1項12号。","e":"会社法の下では，会社分割は分割の対価が分割会社に交付される物的分割のみ認められているが，分割の対価が分割会社の社員に交付される人的分割と同様の効果を実現することは可能である（人的分割類似行為）。"},{"l":10,"m":"組織再編行為総論","sb":"会社分割","i":"C","r":"","q":"新設分割設立株式会社の成立の日に，新設分割株式会社が株主総会の特別決議によりその発行する全部取得条項付種類株式の取得をし，その取得の対価として当該分割により新設分割設立株式会社から交付を受けた当該設立会社の株式を当該分割会社の株主に交付する場合，当該株式の総額は分割会社における分配可能額を超えてもよい。","a":true,"c":"763条12号イ,812条。","e":"この場合，純資産額が300万円を下回る場合についての剰余金配当規制（458条）も適用されない。なお，吸収分割会社においても同様である（758条８号イ，792条）。"},{"l":11,"m":"組織再編行為総論","sb":"会社分割","i":"B","r":"","q":"吸収分割会社が残存債権者を害することを知って吸収分割をした場合であっても，残存債権者は，吸収分割承継会社に対して債務の履行を請求することができない。","a":false,"c":"759条4項本文,761条4項本文。","e":"吸収分割会社または新設分割会社が残存債権者を害することを知って吸収分割または新設分割をした場合には，残存債権者は，吸収分割承継会社または新設分割設立会社に対して，承継した財産の価額を限度として，当該債務の履行を請求することができる（759条４項本文，761条４項本文，764条４項，766条４項）。また，事業譲渡においても同様の規定を設けている（23条の２第１項本文）。ただし，分割会社が人的分割類似行為（758条８号，760条７号）をする場合には，当該規定は，適用されない（759条５項，761 条５項）。人的分割類似行為が行われる場合には，承継されない残存債権者であっても債権者異議手続の対象とされ，会社分割について異議を述べることができるので（789 条１項２号かっこ書等），これに加えて残存債権者を保護する規定を認める必要がないのである。"},{"l":12,"m":"組織再編行為総論","sb":"会社分割","i":"C","r":"","q":"吸収分割会社が残存債権者を害することを知って吸収分割をした場合であっても，吸収分割承継会社が吸収分割の効力が生じた時において残存債権者を害することを知らなかったときは，残存債権者は，吸収分割承継会社に対して債務の履行を請求することができない。","a":true,"c":"759条4項ただし書,761条4項ただし書。","e":"本来，吸収分割承継会社に対しては債務の履行を請求することができない残存債権者が，常に吸収分割承継会社に対して債務の履行を請求することができることとすると，吸収分割承継会社に不測の損害を与えることになりかねないためである。また，事業譲渡においても同様の規定を設けている（23条の２第１項ただし書）。これに対して，新設分割の場合における詐害的な会社分割においては，新設分割設立会社の主観は要件とされていない（764条４項，766条４項参照）。なぜなら，新設分割設立会社は新設分割の効力が生じたときまでは存在せず，かつ，残存債権者を害することを知って新設分割を行う新設分割会社が設立するものであるから，新設分割の効力が生じたときにおいて，残存債権者を害することを知らなかったという状態を想定することができないためである。"},{"l":1,"m":"組織再編行為総論","sb":"株式交換・株式移転","i":"A","r":"(令5II問題18ウ類・平25I問題17エ類・平22I問題18ウ類)","q":"株式交換において，株式交換完全親会社となることができるのは，株式会社のみである。","a":false,"c":"767条,2条31号。","e":"株式交換において，株式交換完全親会社となることができるのは，株式会社および合同会社である。"},{"l":2,"m":"組織再編行為総論","sb":"株式交換・株式移転","i":"A","r":"(平27I問題14ウ類)","q":"株式交換において，株式交換完全子会社となることができるのは，株式会社のみである。","a":true,"c":"2条31号。","e":"株式交換は，既存の株式会社を完全子会社とすることを目的としているので当然である。"},{"l":3,"m":"組織再編行為総論","sb":"株式交換・株式移転","i":"A","r":"(令5II問題18エ類・平31II問題18エ・平28I問題17ウ・平23I問題17イ)","q":"株式移転において，株式移転設立完全親会社となることができるのは，株式会社および合同会社である。","a":false,"c":"772条1項前段,2条32号。","e":"株式移転において，株式移転設立完全親会社となることができるのは，株式会社のみである。合同会社を完全親会社とすることが認められないのは，それを認めたとしても，総株主が持株を現物出資して合同会社を設立するのと実質的には同一であるし，現物出資による合同会社の設立には検査役の調査を要しないことから，あえて制度を設ける意義が乏しいからである。"},{"l":4,"m":"組織再編行為総論","sb":"株式交換・株式移転","i":"A","r":"","q":"株式移転において，株式移転完全子会社となることができるのは，株式会社および合同会社である。","a":false,"c":"2条32号。","e":"株式移転において，株式移転完全子会社となることができるのは，株式会社のみである。株式移転は，既存の株式会社を完全子会社とすることを目的としているので当然である。"},{"l":5,"m":"組織再編行為総論","sb":"株式交換・株式移転","i":"A","r":"(平23I問題17ア)","q":"株式移転は，２以上の株式会社が共同してすることができる。","a":true,"c":"772条2項。","e":""},{"l":6,"m":"組織再編行為総論","sb":"株式交換・株式移転","i":"B","r":"","q":"株式交換完全親株式会社は，株式交換完全子会社の株主に対して交付する対価には，必ず，当該完全親会社の株式を含めなければならない。","a":false,"c":"768条1項2号。","e":"株式交換は吸収型再編に分類される。したがって，対価の柔軟化が認められており，株式交換完全親会社の株式または持分を交付しなくてもよいし，株式等（株式・新株予約権・社債）以外の財産を交付することも認められる（768条１項２号，770条１項３号）。"},{"l":7,"m":"組織再編行為総論","sb":"株式交換・株式移転","i":"B","r":"","q":"株式移転設立完全親会社は，株式移転完全子会社の株主に対して，株式等以外の財産を対価として交付することができる。","a":false,"c":"773条1項5号7号。","e":"株式移転は新設型再編に分類される。したがって，対価の柔軟化は認められておらず，株式移転設立完全親会社の株式を，必ず対価に含めなければならない。また，株式等以外の財産を交付することは認められていない。"},{"l":8,"m":"組織再編行為総論","sb":"株式交換・株式移転","i":"B","r":"(平25II問題17ウ)","q":"株式移転設立完全親会社は，株式移転に際して，株式移転完全子会社の株主に対して，当該株式移転設立完全親会社の株式の全部に代えてその社債を交付することができる。","a":false,"c":"773条1項5号7号。","e":"株式移転は新設型再編に分類される。したがって，対価の柔軟化は認められておらず，株式移転設立完全親会社の株式を，必ず対価に含めなければならない。そのため，株式の全部に代えてその社債を交付することはできない。"},{"l":1,"m":"組織再編行為総論","sb":"株式交付","i":"A","r":"","q":"株式交付において，親会社となることができるのは，株式会社のみである。","a":true,"c":"774条の2,2条32号の2。","e":""},{"l":2,"m":"組織再編行為総論","sb":"株式交付","i":"A","r":"","q":"株式交付において，株式交付子会社となることができるのは，株式会社のみである。","a":true,"c":"2条32号の2。","e":"株式交付は，既存の株式会社を子会社とすることを目的としているので，当然である。"},{"l":3,"m":"組織再編行為総論","sb":"株式交付","i":"A","r":"","q":"株式交付親会社は，株式交付に際して，株式交付親会社の株式と併せてそれ以外の金銭等を対価として交付することはできない。","a":false,"c":"774条の3第1項5号,8号ロ~ホ。","e":"株式交付は，株式交付親会社の株式を対価として株式交付子会社を買収するための制度であり，株式交付親会社の株式を全く交付しないことは想定されていないため，対価として必ず株式交付親会社の株式を交付する必要がある（774条の３第1項３号）。しかし，株式交付親会社は，株式交付に際して，株式交付親会社の株式と併せてそれ以外の金銭等を対価として交付することは可能である。"},{"l":1,"m":"組織再編行為総論","sb":"組織変更","i":"A","r":"(平25I問題17ア類)","q":"組織変更とは，会社の組織を変更することにより，株式会社が持分会社に変わること，または，持分会社が株式会社に変わることをいう。","a":true,"c":"2条26号。","e":""},{"l":2,"m":"組織再編行為総論","sb":"組織変更","i":"A","r":"(平30I問題17ア・平22I問題16ア類)","q":"合名会社を合資会社とする会社の種類の変更は，会社法上の組織変更に当たる。","a":false,"c":"2条26号。","e":"組織変更とは，会社の組織を変更することにより，株式会社が持分会社に変わること，または，持分会社が株式会社に変わることをいう。したがって，合名会社を合資会社とする会社の種類の変更は，持分会社間の会社の種類の変更であるため，会社法上の組織変更に該当しない。"},{"l":1,"m":"吸収型再編における消滅会社等の手続","sb":"吸収合併契約等の締結","i":"A","r":"(平25II問題16ア)","q":"吸収合併契約においては，吸収合併消滅会社の商号および住所を定める必要がある。","a":true,"c":"749条1項1号。","e":"合併当事会社を特定するために，吸収合併契約には，吸収合併存続会社および吸収合併消滅会社の商号および住所を定めなければならない。"},{"l":2,"m":"吸収型再編における消滅会社等の手続","sb":"吸収合併契約等の締結","i":"A","r":"(平25II問題16エ)","q":"吸収合併契約においては，吸収合併がその効力を生ずる日を定める必要がある。","a":true,"c":"749条1項6号。","e":"吸収合併存続株式会社は，効力発生日に，吸収合併消滅会社の権利義務を承継するため（750 条１項），吸収合併契約には，この効力発生日を定めなければならない。"},{"l":3,"m":"吸収型再編における消滅会社等の手続","sb":"吸収合併契約等の締結","i":"A","r":"(平25II問題16イウ)","q":"吸収合併契約においては，吸収合併存続会社の発行可能株式総数および吸収合併存続会社の取締役の氏名は定める必要がない。","a":true,"c":"749条1項各号参照。","e":""},{"l":1,"m":"吸収型再編における消滅会社等の手続","sb":"事前開示","i":"A","r":"(平28I問題15ウ・平21問題18ウ)","q":"吸収分割株式会社が，吸収分割契約の内容その他法務省令で定める事項を記載した書面を，その本店に備え置かなければならないのは，所定の備置開始日から吸収分割の効力発生日までの間である。","a":false,"c":"782条1項。","e":"消滅株式会社等は，吸収合併契約等備置開始日から効力発生日後６か月を経過する日（吸収合併消滅株式会社にあっては効力発生日）までの間，吸収合併契約等の内容その他法務省令で定める事項を記載または記録した書面または電磁的記録をその本店に備え置かなければならない。"},{"l":2,"m":"吸収型再編における消滅会社等の手続","sb":"事前開示","i":"C","r":"","q":"吸収分割株式会社の債権者は，当該分割会社に対して，吸収分割契約の内容等を記載した書面の閲覧を請求することはできない。","a":false,"c":"782条3項本文。","e":"吸収分割株式会社の株主および債権者は，分割会社に対して，吸収分割契約の内容等を記載した書面等の閲覧または謄抄本の交付請求をすることができる。"},{"l":3,"m":"吸収型再編における消滅会社等の手続","sb":"事前開示","i":"C","r":"","q":"株式交換完全子会社において，株式交換契約の内容等を記載した書面等の閲覧をすることができるのは，当該完全子会社の株主のみである。","a":false,"c":"782条3項本文かっこ書。","e":"株式交換完全子会社の株主および新株予約権者は，当該完全子会社に対して，営業時間内は，いつでも，株式交換契約の内容等を記載した書面等の閲覧または謄抄本の交付請求をすることができる。"},{"l":1,"m":"吸収型再編における消滅会社等の手続","sb":"吸収合併契約等の承認","i":"A","r":"(平27II問題15ア類)","q":"吸収合併消滅株式会社は，必ず，効力発生日の前日までに，株主総会の特別決議によって，吸収合併契約の承認を受けなければならない。","a":false,"c":"784条1項。","e":"吸収合併消滅会社である株式会社は，原則として，効力発生日の前日までに，株主総会の特別決議によって，吸収合併契約の承認を受けなければならない。しかし，略式吸収合併に該当する場合は，例外的に株主総会の決議を要しない。"},{"l":2,"m":"吸収型再編における消滅会社等の手続","sb":"吸収合併契約等の承認","i":"B","r":"(平25I問題18イ)","q":"合併により消滅する株式会社が種類株式発行会社でない公開会社であり，かつ，当該株式会社の株主に対して交付する株式の全部が譲渡制限株式である場合には，当該株式会社は，株主総会の特別決議によって，合併契約の承認を受けなければならない。","a":false,"c":"783条1項,309条3項2号。","e":"吸収合併消滅株式会社または株式交換完全子会社が種類株式発行会社でない公開会社である場合において，吸収合併または株式交換における合併等の対価の全部または一部が譲渡制限株式等であるときは，株主総会の特殊決議を要する。譲渡制限が付されていない株式を保有していた株主が，吸収合併または株式交換によって譲渡制限株式を有することとなるため，非公開会社化する場合と同様の要件を求めているのである。"},{"l":3,"m":"吸収型再編における消滅会社等の手続","sb":"吸収合併契約等の承認","i":"B","r":"(平31II問題18イ)","q":"吸収合併によって，種類株式発行会社でない吸収合併消滅会社の株主に持分会社の持分が交付される場合は，当該消滅会社の総株主の同意を得なければならない。","a":true,"c":"783条2項。","e":"吸収合併消滅会社の株主に持分会社の持分等が交付される場合は，消滅会社の総株主の同意（種類株式発行会社では，持分等の割当てを受ける種類株主の全員の同意）を得なければならない（783 条２項４項）。これは，譲渡性の低い持分会社の持分を取得することとなる消滅会社の株主を保護する趣旨である。"},{"l":4,"m":"吸収型再編における消滅会社等の手続","sb":"吸収合併契約等の承認","i":"B","r":"(平31II問題18ウ)","q":"合同会社である吸収分割承継会社が，吸収分割に際して，種類株式発行会社でない吸収分割株式会社に対してその事業に関する権利義務に代わる金銭等を交付する場合において，当該金銭等が当該吸収分割承継会社の持分であるときは，当該吸収分割株式会社では，吸収分割契約について総株主の同意を得なければならない。","a":false,"c":"783条2項参照。","e":"吸収分割承継会社は，分割会社に対して分割対価を交付する（物的分割）。したがって，対価が分割会社の株主に交付されるわけではなく，対価の種類によって株主の保護規制を変更する必要はないため，総株主の同意は不要である。"},{"l":5,"m":"吸収型再編における消滅会社等の手続","sb":"吸収合併契約等の承認","i":"B","r":"(平27II問題15イ・平22II問題18ア)","q":"吸収合併存続会社が吸収合併消滅会社の特別支配会社である場合には，当該消滅会社は，当該消滅会社の株主総会の決議による吸収合併契約の承認を受ける必要はない。なお，合併当事会社は，両会社とも種類株式発行会社でない公開会社であるものとする。","a":true,"c":"784条1項本文。","e":"略式組織再編行為が認められるのは，支配従属関係のある会社間で組織再編行為を行う場合には，当該組織再編行為に係る承認決議の成立が確実視されるためであり，その場合には，株主総会招集の費用と時間を節約するため，その省略を認めることが合理的だからである。"},{"l":6,"m":"吸収型再編における消滅会社等の手続","sb":"吸収合併契約等の承認","i":"B","r":"(平22II問題18エ)","q":"吸収合併消滅会社が吸収合併存続会社の特別支配会社である場合には，当該消滅会社は，当該消滅会社の株主総会の決議による吸収合併契約の承認を受ける必要はない。なお，合併当事会社は，両会社とも種類株式発行会社でない公開会社であるものとする。","a":false,"c":"783条1項,784条1項参照。","e":"略式組織再編行為として株主総会の決議を省略することができるのは，被支配会社における株主総会の決議のみである。そのため，被支配会社（子会社）が特別支配会社（親会社）を吸収合併するようなケースであっても，株主総会の決議を省略できるのは被支配会社（子会社）のみである。したがって，本問の場合は，特別支配会社である消滅会社の株主総会の決議が必要となる。"},{"l":7,"m":"吸収型再編における消滅会社等の手続","sb":"吸収合併契約等の承認","i":"B","r":"","q":"吸収合併消滅会社が種類株式発行会社でない公開会社であり，当該消滅会社の株主に対して交付する金銭等の全部または一部が譲渡制限株式である場合の当該消滅会社における合併契約の承認は，吸収合併存続会社が当該消滅会社の特別支配会社であっても，株主総会の決議によらなければならない。","a":true,"c":"784条1項ただし書。","e":"この場合，吸収合併消滅会社において，株主総会の特殊決議（309条３項２号）が必要となる。309条３項の特殊決議においては，議決権を行使することができる株主の半数以上であって，かつ，議決権を行使することのできる株主の議決権の３分の２以上の多数による賛成がなければ可決されない。ここで，特別支配会社である存続会社が消滅会社の議決権の90％以上を保有していたとしても，議決権を行使することができる株主の半数以上という要件を満たすことができない場合もあることから，略式吸収合併をすることができないのである。"},{"l":8,"m":"吸収型再編における消滅会社等の手続","sb":"吸収合併契約等の承認","i":"C","r":"","q":"吸収合併存続会社が種類株式発行会社である吸収合併消滅会社の特別支配会社である場合において，当該消滅会社のある種類株主に持分会社の持分を交付するときは，当該消滅会社の当該種類株主全員の同意を得る必要はない。","a":false,"c":"783条2項4項。","e":"略式吸収合併が認められる場合であっても，被支配会社が省略できるのは，株主総会の特別決議だけである（783条１項，795条１項）。したがって，株主または種類株主全員の同意（783条２項４項），種類株主総会の特殊決議（783条３項，324条３項２号），種類株主総会の特別決議（795条４項１号，324条２項６号）が必要な場合は，当該同意または決議は省略できず，当該同意または決議がなければ合併の効力が生じないこととなる。"},{"l":9,"m":"吸収型再編における消滅会社等の手続","sb":"吸収合併契約等の承認","i":"B","r":"","q":"吸収合併が法令に違反する場合において，吸収合併消滅株式会社の株主が不利益を受けるおそれがあるときは，当該消滅会社の株主は，当該消滅会社に対し，吸収合併をやめることを請求することができる。","a":true,"c":"784条の2第1号。","e":"吸収合併等の無効を争う手段としては，吸収合併等の無効の訴えがあるが，事後的に吸収合併等の効力が否定されると法律関係を不安定にするおそれがある。そうであれば，株主が，吸収合併等の効力発生前にその差止めを請求することができることとするのが相当である。そこで，会社法は，株主に吸収合併等の差止請求を認めたのである。ただし，当該吸収合併等が簡易吸収分割に該当する場合は，当該請求をすることができない（784条の２柱書ただし書）。"},{"l":10,"m":"吸収型再編における消滅会社等の手続","sb":"吸収合併契約等の承認","i":"B","r":"","q":"吸収合併存続株式会社が，吸収合併消滅株式会社の特別支配会社である場合でも，合併の条件が当該合併当事会社の財産の状況その他の事情に照らして著しく不当であり，当該消滅会社の株主が不利益を受ける場合には，消滅会社の株主は，消滅会社に対して，合併の差止めを請求することができる。当該差止請求をすることができるのは，消滅会社の総株主の議決権の100分の３以上の議決権を有する株主である。","a":false,"c":"784条の2第2号。","e":"略式吸収合併が認められる場合であっても，被支配会社の株主が不利益を受けるおそれがある場合で，① 当該合併契約に法令または定款の違反がある場合，または，② 合併の条件が当事会社の財産の状況その他の事情に照らして著しく不当である場合，被支配会社の株主は，当該被支配会社に対して，合併の差止めを請求することができる（784条の２，796条の２）。当該差止請求権は，単独株主権である。なお，事業譲渡等については，吸収合併等や新設合併等の場合（784条の２，796条の２，805条の２）と異なり，差止請求の規定は設けられていない。"},{"l":1,"m":"吸収型再編における消滅会社等の手続","sb":"反対株主の株式買取請求権","i":"C","r":"","q":"吸収合併消滅株式会社の株主は，常に，反対株主の株式買取請求権を行使することができる。","a":false,"c":"785条1項1号。","e":"消滅会社の株主に持分会社の持分等が交付されるため，消滅会社の総株主の同意を要する場合（783条２項），は，消滅会社の株主に当該請求権は認められない（785条１項１号）。この場合は，反対株主が存在しないためである。"},{"l":2,"m":"吸収型再編における消滅会社等の手続","sb":"反対株主の株式買取請求権","i":"B","r":"","q":"吸収分割株式会社が吸収分割承継会社に承継させる資産の額が，分割会社の総資産額の５分の１を超えない場合は，分割会社の株主は，反対株主の株式買取請求権を行使することができない。","a":true,"c":"785条1項2号。","e":"これは，分割会社における簡易分割については，分割対象となる資産が分割会社の総資産額の５分の１以下であることから，事業の重要な一部の譲渡に該当しない場合（467 条１項２号かっこ書）に類似しており，分割会社の株主に与える影響が軽微であるとされるためである。"},{"l":3,"m":"吸収型再編における消滅会社等の手続","sb":"反対株主の株式買取請求権","i":"A","r":"(平30II問題18ア)","q":"吸収分割をするために株主総会の決議を要する場合において，当該株主総会で議決権を行使できる株主が株式買取請求をするためには，当該株主総会に先立って当該吸収分割に反対する旨を会社に通知し，かつ，当該株主総会において当該吸収分割に反対することを要する。","a":true,"c":"785条2項1号イ。","e":""},{"l":4,"m":"吸収型再編における消滅会社等の手続","sb":"反対株主の株式買取請求権","i":"A","r":"(令7I問題17エ類・平28I問題17イ類・平27II問題15ウ)","q":"吸収合併契約の承認を受けなければならない消滅会社の株主総会において，議決権を行使することができない株主は，当該消滅会社に対し，自己の有する株式を公正な価格で買い取ることを請求することができない。","a":false,"c":"785条2項1号ロ。","e":"吸収合併をするために株主総会の決議を要する場合，当該株主総会において議決権を行使することができない株主は反対株主に該当し，当該消滅会社に対し，自己の有する株式を公正な価格で買い取ることを請求することができる。"},{"l":5,"m":"吸収型再編における消滅会社等の手続","sb":"反対株主の株式買取請求権","i":"A","r":"(令7I問題17ア類・平31I問題17エ類)","q":"株式交換において，完全親会社となる株式会社が完全子会社となる株式会社の特別支配会社である場合，完全子会社となる株式会社においては，すべての株主が株式買取請求権を有する。","a":false,"c":"785条2項2号。","e":"組織再編行為等をするために株主総会（種類株主総会を含む）の決議を要しない場合の反対株主は，略式組織再編行為（784条１項本文）における特別支配会社を除いて，すべての株主である（785条２項２号，797条２項２号かっこ書，469 条２項２号かっこ書）。略式組織再編行為等の場合に株主総会の決議が不要とされているのは，仮に株主総会を開催したとしても，当該承認決議の成立が確実視されるためである。このことからすれば，特別支配会社に株式買取請求を認めるべきではないため，反対株主から特別支配会社を除くこととしている。"},{"l":6,"m":"吸収型再編における消滅会社等の手続","sb":"反対株主の株式買取請求権","i":"A","r":"(令7I問題17イ類・4II問題17エ類・令3問題18ウ類・平30II問題18イ)","q":"最高裁判所の判例によれば，吸収分割により企業価値の増加が生じない場合，株式買取請求に係る株式の買取価格である「公正な価格」とは，原則として，吸収分割契約に定められていた吸収分割の対価が公正なものであったならばその株式が有していると認められる価格をいう。","a":false,"c":"最決平23年4月19日。","e":"最高裁判所の判例によれば，吸収分割により企業価値の増加（シナジー）が生じない場合には，増加した企業価値の適切な配分を考慮する必要はないから，株式買取請求に係る株式の買取価格である「公正な価格」とは，吸収分割契約を承認する旨の株主総会の決議がされることがなければその株式が有したであろう価格（いわゆる，「ナカリセバ価格」）をいう。これに対して，企業価値の増加（シナジー）が生じる場合には，公正な価格は，組織再編行為等が公正な条件で行われ，それにより当該企業価値の増加分が各当事会社の株主に公正に分配されたとすれば，株式買取請求がされた日においてその株式が有していると認められる価格をいう（最決平24年２月29日）。"},{"l":7,"m":"吸収型再編における消滅会社等の手続","sb":"反対株主の株式買取請求権","i":"B","r":"(令7I問題17イ・令4II問題17ウ類)","q":"最高裁判所の判例によれば，組織再編行為における反対株主の株式買取請求に係る株式の買取価格である「公正な価格」は，組織再編行為の効力発生日を価格算定の基準日としている。","a":false,"c":"最決平23年4月19日。","e":"最高裁判所の判例によれば，組織再編行為における反対株主の株式買取請求の場合，公正な価格は，買取請求によって売買契約が成立したのと同様の法律関係が生じることを理由に，買取請求の日を価格算定の基準日としている。"},{"l":1,"m":"吸収型再編における消滅会社等の手続","sb":"新株予約権買取請求権","i":"B","r":"(平20問題6イ類)","q":"吸収合併消滅株式会社の新株予約権者は，当該新株予約権の内容として合併をする際に合併後存続する株式会社の新株予約権を交付することとする旨の定めがない場合，当該消滅会社に対し，自己の有する新株予約権を公正な価格で買い取ることを請求することができる。","a":true,"c":"787条1項1号。","e":""},{"l":2,"m":"吸収型再編における消滅会社等の手続","sb":"新株予約権買取請求権","i":"C","r":"(令5I問題18ウ)","q":"吸収合併存続株式会社は，吸収合併消滅株式会社の新株予約権の新株予約権者に対し，その有する新株予約権に代えて当該吸収合併存続株式会社の株式を交付することができる。","a":false,"c":"749条1項4号5号,750条5項。","e":"吸収合併の場合，効力発生日において吸収合併消滅株式会社は消滅することとなるため，吸収合併消滅株式会社の新株予約権が存続することはなく，効力発生日をもって消滅することとなる（750 条４項）。そして，吸収合併消滅株式会社の新株予約権者に対しては，吸収合併契約に従い，吸収合併存続株式会社の新株予約権または金銭が対価として交付される。"},{"l":3,"m":"吸収型再編における消滅会社等の手続","sb":"新株予約権買取請求権","i":"B","r":"(平26I問題16ウ類)","q":"新設合併消滅株式会社の新株予約権者は，当該新株予約権の内容として合併をする際に合併後存続する株式会社の新株予約権を交付することとする旨の定めがある場合は，当該消滅会社に対し，自己の有する新株予約権を公正な価格で買い取ることを請求することができない。","a":false,"c":"808条1項1号。","e":"新設合併消滅株式会社の新株予約権者は，当該新株予約権の内容として合併をする際に合併後存続する株式会社の新株予約権を交付することとする定め（236 条１項８号イ）があり，その定めによる条件と新設合併契約における取扱い（753条１項10号11号）が異なる場合には，当該消滅会社に対し，自己の有する新株予約権を公正な価格で買い取ることを請求することができる。"},{"l":4,"m":"吸収型再編における消滅会社等の手続","sb":"新株予約権買取請求権","i":"C","r":"","q":"吸収合併消滅株式会社は，新株予約権買取請求権を行使することができる新株予約権者に対してのみ，吸収合併をする旨等を通知すれば足りる。","a":false,"c":"787条3項1号。","e":"吸収合併においては，消滅会社の新株予約権の取扱い（749 条１項４号５号）が当該新株予約権の内容で定められた条件（236 条１項８号イ）と合致しているかが争いとなるため，消滅会社による通知はすべての新株予約権者に対して行う必要がある。"},{"l":5,"m":"吸収型再編における消滅会社等の手続","sb":"新株予約権買取請求権","i":"C","r":"","q":"吸収分割株式会社の新株予約権者は，当該新株予約権の内容として吸収分割をする際に吸収分割承継株式会社の新株予約権を交付することとする旨の定めがない場合，当該分割会社に対し，自己の有する新株予約権を公正な価格で買い取ることを請求することができる。","a":false,"c":"787条1項2号。","e":"吸収分割株式会社の新株予約権者は，当該新株予約権の内容として吸収分割をする際に吸収分割承継株式会社の新株予約権を交付することとする旨の定め（236 条１項８号ロ）がなく，吸収分割において承継会社の新株予約権が交付される場合は，当該分割会社に対し，自己の有する新株予約権を公正な価格で買い取ることを請求することができる。"},{"l":6,"m":"吸収型再編における消滅会社等の手続","sb":"新株予約権買取請求権","i":"C","r":"","q":"吸収分割株式会社は，すべての新株予約権者に対して，吸収分割をする旨等を通知しなければならない。","a":false,"c":"787条3項2号。","e":"吸収分割において，新株予約権買取請求に関する通知を要する新株予約権者は，① 吸収分割契約新株予約権の新株予約権者（787条３項２号イ），および，②新株予約権の内容（236条１項８号ロ）として吸収分割の際に承継会社の新株予約権が交付されることが定められている分割会社の新株予約権者（787条３項２号ロ）である。このように通知を要する新株予約権者の範囲が広くなっている理由は，新株予約権の内容（236条１項８号ロ）と，吸収分割契約で定められた内容が合致するかどうかが争いになり得るためである。"},{"l":7,"m":"吸収型再編における消滅会社等の手続","sb":"新株予約権買取請求権","i":"C","r":"(平29II問題18ウ)","q":"株式交換完全子会社が新株予約権を発行している場合，株式交換契約において当該新株予約権の対価として交付する金銭等に関する定めがないときには，当該株式交換の効力発生により当該新株予約権は消滅する。","a":false,"c":"","e":"株式交換の場合は効力発生日以降においても株式交換完全子会社が存続するため，株式交換完全子会社の新株予約権は当然には消滅しない。したがって，株式交換契約において，株式交換完全親株式会社の新株予約権を交付する旨（768 条１項４号）を定めない限り，株式交換完全子会社の新株予約権者には何も交付されることはなく，株式交換完全子会社の新株予約権者のまま残る。"},{"l":1,"m":"吸収型再編における消滅会社等の手続","sb":"債権者異議手続","i":"A","r":"(平24II問題17ア)","q":"吸収合併存続株式会社および吸収合併消滅株式会社のすべての債権者は，当該吸収合併について異議を述べることができる。","a":true,"c":"789条1項1号,799条1項1号。","e":""},{"l":2,"m":"吸収型再編における消滅会社等の手続","sb":"債権者異議手続","i":"A","r":"(令2II問題17ア類・平30I問題18ウ・平28I問題15イ類)","q":"株式会社が吸収分割をする場合において，当該吸収分割後に吸収分割株式会社に対して債務の履行を請求することができない吸収分割株式会社の債権者は，当該吸収分割株式会社に対し，当該吸収分割について異議を述べることができない。","a":false,"c":"789条1項2号。","e":"吸収分割後に吸収分割株式会社に対して債務の履行（当該債務の保証人として吸収分割承継会社と連帯して負担する保証債務の履行を含む）を請求することができない吸収分割株式会社の債権者は，吸収分割株式会社に対して，吸収分割について異議を述べることができる。当該債権者にとっては，債務者が分割会社から承継会社に交代することとなるためである。これに対して，吸収分割後も吸収分割株式会社に対して債務の履行を請求することができる吸収分割株式会社の債権者については，異議を述べることができない。なぜなら，分割会社は，承継会社から吸収分割による対価の交付を受けているため，分割の前後では，分割会社の資産状態には実質的な変動がなく，当該債権者が不利益を受けるおそれがないといえるからである（例外として，人的分割類似行為をする場合は異議を述べることができる）。"},{"l":3,"m":"吸収型再編における消滅会社等の手続","sb":"債権者異議手続","i":"C","r":"","q":"吸収分割の効力発生日に，吸収分割株式会社が，吸収分割承継株式会社から交付を受けた当該承継会社の株式を剰余金の配当として当該分割会社の株主に交付する場合に，当該吸収分割に異議を述べることができるのは，当該吸収分割後に分割会社に対して債務の履行を請求することができなくなる債権者に限られる。","a":false,"c":"789条1項2号かっこ書。","e":"吸収分割株式会社が人的分割類似行為（758 条８号）を行う場合には，分割会社のすべての債権者が異議を述べることができる。この理由としては，人的分割類似行為をする場合，分割会社の財産が減少することとなるので，吸収分割後も分割会社に対して債務の履行を請求することができる分割会社の債権者であっても不利益を受けることとなるためである。また，財源規制（461条）も課されないためである（792条）。"},{"l":4,"m":"吸収型再編における消滅会社等の手続","sb":"債権者異議手続","i":"A","r":"(平31II問題17エ類・平24II問題17ウ類)","q":"株式交換契約新株予約権が新株予約権付社債に付された新株予約権である場合，株式交換完全子会社のすべての債権者は，当該株式交換について異議を述べることができる。","a":false,"c":"789条1項3号。","e":"株式交換契約新株予約権が新株予約権付社債に付された新株予約権である場合，株式交換完全子会社の当該新株予約権付社債の社債権者は，当該株式交換について異議を述べることができる。この場合に債権者異議手続が必要になるのは，当該新株予約権付社債の社債権者の地位が，完全子会社の債権者の地位から，完全親会社の債権者の地位に変更されるためである。"},{"l":5,"m":"吸収型再編における消滅会社等の手続","sb":"債権者異議手続","i":"B","r":"(平26II問題15ウ)","q":"吸収合併消滅株式会社の債権者が，異議を述べることができる一定の期間内に異議を述べなかったときは，当該債権者は，当該吸収合併について承認をしたものとみなされる。","a":true,"c":"789条4項。","e":""},{"l":1,"m":"吸収型再編における消滅会社等の手続","sb":"事後開示","i":"C","r":"","q":"株式交換完全子会社は，効力発生日後遅滞なく，株式交換完全親会社と共同して，株式交換により当該完全親会社が取得した完全子会社の株式の数その他の株式交換に関する事項を記載または記録した書面または電磁的記録を作成しなければならない。","a":true,"c":"791条1項2号。","e":"また，完全親会社および完全子会社は，効力発生日から６か月間，事後開示事項を記載または記録した書面または電磁的記録をその本店に備え置かなければならない（791条２項，801条３項３号）。"},{"l":2,"m":"吸収型再編における消滅会社等の手続","sb":"事後開示","i":"C","r":"","q":"株式交換の効力発生日に株式交換完全子会社の新株予約権者であった者は，株式交換により株式交換完全親会社が取得した完全子会社の株式の数その他の株式交換に関する事項を記載した事後開示書類を閲覧することができる。","a":true,"c":"791条3項4項。","e":""},{"l":1,"m":"吸収型再編における存続会社等の手続","sb":"事前開示","i":"A","r":"(令6I問題17エ類・令2I問題18ア)","q":"吸収合併存続株式会社は，吸収合併契約備置開始日から効力発生日後６か月を経過する日までの間，吸収合併契約の内容等を記載し，記録した書面または電磁的記録をその本店に備え置かなければならない。","a":true,"c":"794条1項。","e":"なお，吸収合併消滅会社である株式会社は，吸収合併契約備置開始日から効力発生日までの間，吸収合併契約の内容等を記載した書面等をその本店に備え置かなければならない（782条１項）。"},{"l":2,"m":"吸収型再編における存続会社等の手続","sb":"事前開示","i":"C","r":"","q":"株式交換完全親株式会社の株主および債権者は，当該完全親会社に対して，営業時間内は，いつでも，株式交換契約の内容等を記載した書面等の閲覧を請求することができる。","a":false,"c":"794条3項本文。","e":"株式交換完全親会社の株主は，完全親会社に対して，営業時間内は，いつでも，株式交換契約の内容等を記載した書面等の閲覧または謄抄本の交付請求をすることができる（794 条３項）。完全親会社の債権者に株式交換契約の内容等の閲覧請求が認められる場合は，① 完全親会社の株式以外のものを対価として完全子会社の株主に交付した場合（株式交換交付金の交付は可），または，②株式交換契約新株予約権が新株予約権付社債に付された新株予約権である場合（768条１項４号ハ）である（794条３項かっこ書）。"},{"l":1,"m":"吸収型再編における存続会社等の手続","sb":"吸収合併契約等の承認","i":"A","r":"","q":"指名委員会等設置会社の取締役会は，その決議によって，指名委員会等設置会社の株主総会の決議による承認を要しない合併契約の決定を執行役に委任することができる。","a":true,"c":"416条4項9号。","e":"指名委員会等設置会社の取締役会は，その決議によって，簡易合併等の株主総会の決議による承認を要しない合併契約の決定を執行役に委任することができる。"},{"l":2,"m":"吸収型再編における存続会社等の手続","sb":"吸収合併契約等の承認","i":"C","r":"","q":"吸収合併存続株式会社が種類株式発行会社である場合において，吸収合併消滅会社に存続会社の株式が交付される場合は，当該交付される種類の株式を有する種類株主を構成員とする種類株主総会の決議がなければその効力を生じない。","a":false,"c":"795条4項1号,324条2項6号。","e":"吸収合併存続会社が種類株式発行会社である場合において，吸収合併消滅会社に交付される対価が譲渡制限株式である場合には，当該譲渡制限株式の種類株主を構成員とする種類株主総会の特別決議がなければ，その効力を生じない。これは，種類株式発行会社において譲渡制限株式を発行する場合には，当該譲渡制限株式の種類株主総会が要求されているため，同様の要件を求めているのである。"},{"l":3,"m":"吸収型再編における存続会社等の手続","sb":"吸収合併契約等の承認","i":"B","r":"(平25I問題18ウ類)","q":"吸収合併存続株式会社が承継する吸収合併消滅株式会社の債務額が，承継する資産額を超える場合，消滅会社における吸収合併契約を承認する株主総会において，取締役は，その旨を説明しなければならない。","a":false,"c":"","e":"合併差損が生じる場合には，吸収合併存続株式会社の取締役は承認決議において，その旨を説明しなければならない（795条２項１号２号）。"},{"l":4,"m":"吸収型再編における存続会社等の手続","sb":"吸収合併契約等の承認","i":"B","r":"(平25I問題18エ)","q":"吸収合併消滅会社から承継する資産に吸収合併存続会社の株式が含まれている場合，存続会社における吸収合併契約を承認する株主総会において，取締役は，当該株式に関する事項を説明しなければならない。","a":true,"c":"795条3項。","e":""},{"l":5,"m":"吸収型再編における存続会社等の手続","sb":"吸収合併契約等の承認","i":"B","r":"(平22II問題18イ類・平20問題15ア)","q":"吸収合併消滅会社が吸収合併存続会社の特別支配会社である場合には，吸収合併存続会社では吸収合併契約を承認する株主総会決議を要しない。なお，合併当事会社は，両会社とも種類株式発行会社でない公開会社であるものとする。","a":true,"c":"796条1項。","e":""},{"l":6,"m":"吸収型再編における存続会社等の手続","sb":"吸収合併契約等の承認","i":"B","r":"(平22II問題18ウ・平20問題15イ・平20問題15ウ類)","q":"吸収分割承継会社が吸収分割会社の特別支配会社である場合には，吸収分割承継会社では吸収分割契約を承認する株主総会決議を要しない。なお，吸収分割当事会社は，両会社とも種類株式発行会社でない公開会社であるものとする。","a":false,"c":"795条1項,796条1項参照。","e":"略式組織再編行為として株主総会の決議を省略することができるのは，被支配会社における株主総会の決議のみである。したがって，本問の場合は，特別支配会社である吸収分割承継会社の株主総会の決議が必要となる。"},{"l":7,"m":"吸収型再編における存続会社等の手続","sb":"吸収合併契約等の承認","i":"B","r":"","q":"吸収合併消滅株式会社の株主に対して公開会社である吸収合併存続株式会社の株式を交付するときは，当該消滅会社が当該存続会社の特別支配会社であっても，存続会社における株主総会の決議により吸収合併契約の承認を受けなければならない。","a":false,"c":"796条1項ただし書。","e":"吸収合併存続株式会社が非公開会社であり，吸収合併消滅株式会社の株主に対して当該存続会社の株式を交付するときは，消滅会社が当該存続会社の特別支配会社であっても，当該存続会社における株主総会の決議により吸収合併契約の承認を受けなければならない。この場合は，株主総会の特別決議を要する。なぜなら，非公開会社においては，募集株式の発行等につき株主総会の特別決議が要求されているためである（199条２項）。"},{"l":8,"m":"吸収型再編における存続会社等の手続","sb":"吸収合併契約等の承認","i":"B","r":"","q":"吸収合併消滅株式会社の株主に対して交付する対価の額が，吸収合併存続株式会社の純資産額の５分の１を超えない場合であっても，当該存続会社において株主総会の決議により吸収合併契約の承認を受けなければならない場合がある。","a":true,"c":"796条1項ただし書,796条2項柱書ただし書,796条3項。","e":"吸収合併存続会社が非公開会社であり吸収合併消滅会社の株主または社員に株式を交付する場合（796 条１項ただし書）や， 合併差損が生じる場合（796条２項柱書ただし書）には，簡易吸収合併によることができない。また，一定の数の株主の反対がある場合も，簡易手続きをとることができない（796条３項）。"},{"l":9,"m":"吸収型再編における存続会社等の手続","sb":"吸収合併契約等の承認","i":"C","r":"","q":"吸収分割承継会社が種類株式発行会社である場合において，吸収分割株式会社に交付される対価が譲渡制限株式である場合，当該譲渡制限株式の種類株主を構成員とする種類株主総会の特別決議がなければ，その効力を生じない。","a":true,"c":"795条4項2号,324条2項6号。","e":"これは，種類株式発行会社において譲渡制限株式を発行する場合には，当該譲渡制限株式の種類株主総会が要求されているため，同様の要件を求めているのである。"},{"l":10,"m":"吸収型再編における存続会社等の手続","sb":"吸収合併契約等の承認","i":"B","r":"","q":"吸収分割株式会社から承継する資産に吸収分割承継株式会社の株式が含まれている場合には，当該承継会社の取締役は，吸収分割契約を承認する株主総会において，当該株式に関する事項を説明しなければならない。","a":true,"c":"795条3項。","e":"分割差損が生じる場合にも，同様に，取締役に説明義務が課せられている（795条２項１号２号）。"},{"l":11,"m":"吸収型再編における存続会社等の手続","sb":"吸収合併契約等の承認","i":"B","r":"","q":"株式交換契約に定められた対価に関する事項が株式交換完全親株式会社または株式交換完全子会社の財産の状況その他の事情に照らして著しく不当である場合において，株式交換完全親株式会社の株主が不利益を受けるおそれがあるときは，当該完全親会社の株主は，当該完全親会社に対し，株式交換をやめることを請求することができる。","a":false,"c":"796条の2。","e":"略式吸収合併等以外の吸収合併等において，対価の不当性は差止事由とされていない。これは，略式吸収合併等以外の吸収合併等においては，多くの株主が株主総会において，吸収合併等の対価も含めて承認しているため，一部の株主が対価に不満があるとしても，その株主は反対株主の株式買取請求を通じて保護を受けるべきであって，吸収合併等自体の差止請求まで認めるべきではないという考え方によるものである。この点については，消滅株式会社等においても同様である（784条の２）。"},{"l":12,"m":"吸収型再編における存続会社等の手続","sb":"吸収合併契約等の承認","i":"B","r":"","q":"吸収分割が法令に違反する場合において，吸収分割承継株式会社の株主が不利益を受けるおそれがあるときは，吸収分割の対価の額にかかわらず，当該承継会社の株主は，当該承継会社に対し，吸収分割をやめることを請求することができる。","a":false,"c":"796条の2柱書ただし書。","e":"簡易組織再編行為等に該当する場合については，株主に及ぼす影響が小さいとして株主総会の決議が不要とされていることに鑑み，株主は，当該組織再編行為等の差止めを請求することができない。"},{"l":1,"m":"吸収型再編における存続会社等の手続","sb":"反対株主の株式買取請求権","i":"B","r":"(平23I問題18イ類)","q":"吸収合併存続株式会社における反対株主は，常に，当該吸収合併存続株式会社に対し，自己の有する株式を公正な価格で買い取ることを請求することができる。","a":false,"c":"797条1項ただし書。","e":"吸収合併等における存続株式会社等において簡易組織再編行為等の要件を満たす場合（796 条２項本文）には，当該存続株式会社等の株主に株式買取請求権は認められない。簡易組織再編行為等の場合に株主総会の決議が不要とされているのは，簡易組織再編行為が株主に与える影響が小さいと予想されるためであり，このことからすれば，存続株式会社等において簡易組織再編行為の要件を満たす場合には，株主は株式買取請求権を有しないこととするのが相当であるからである。また，他の会社の事業の全部の譲受けをする譲受会社において簡易事業譲受けの要件を満たす場合も同様に，当該譲受会社の株主に買取請求権は認められない（469条１項２号）。"},{"l":1,"m":"吸収型再編における存続会社等の手続","sb":"債権者異議手続","i":"A","r":"(平31II問題17イ)","q":"吸収合併において吸収合併存続株式会社が吸収合併消滅株式会社から承継する資産の額が，当該吸収合併存続株式会社が当該吸収合併消滅株式会社から承継する債務の額を超える場合は，当該吸収合併存続株式会社の債権者は，当該吸収合併について異議を述べることができない。","a":false,"c":"799条1項1号。","e":"吸収合併をする場合，吸収合併存続株式会社のすべての債権者は，吸収合併存続株式会社に対し，当該吸収合併について異議を述べることができる。吸収合併存続株式会社の債権者については，合併により，消滅会社の権利義務を包括的に承継することになるため，当該存続会社の債務が増加することとなるし，消滅会社の財政状態が悪い場合は，合併後に当該存続会社の財政状態が悪化することも考えられるため，債権の回収が困難となる可能性があるためである。"},{"l":2,"m":"吸収型再編における存続会社等の手続","sb":"債権者異議手続","i":"A","r":"(平31II問題17ウ・平28I問題15エ)","q":"吸収分割承継株式会社のすべての債権者は，当該吸収分割について異議を述べることができる。","a":true,"c":"799条1項2号。","e":""},{"l":3,"m":"吸収型再編における存続会社等の手続","sb":"債権者異議手続","i":"B","r":"(令2II問題17イ類)","q":"株式交換完全親株式会社のすべての債権者は，当該株式交換について異議を述べることができる。","a":false,"c":"799条1項3号参照。","e":"株式交換完全親株式会社については，株式交換により取得する完全子会社株式が無価値であったとしても，完全親会社の株式または持分のみが対価として交付されている限りは，会社財産の変動が生じることはないため，会社債権者を害することはない。したがって，一定の場合を除き，債権者異議手続は設けられていない。"},{"l":4,"m":"吸収型再編における存続会社等の手続","sb":"債権者異議手続","i":"B","r":"","q":"株式交換完全親株式会社が，株式交換完全子会社の株主に対して金銭のみを交付する場合，当該完全親会社の債権者は，当該株式交換について異議を述べることができる。","a":true,"c":"799条1項3号。","e":"株式交換をする場合において，株式交換完全子会社の株主に対して完全親会社の株式以外の財産を交付する場合であり，かつ，当該財産の額が株式交換の対価総額の20分の１を超えるときは，完全親会社の債権者は，株式交換完全親会社に対し，株式交換について異議を述べることができる。完全親会社の株式以外を対価とする場合については，会社財産が変動することになるので，取得する完全子会社の株式の価値よりも高い不当な対価を完全子会社の株主に交付してしまうと，債権者に重大な影響を与えるからである。本肢においては，対価として完全親会社の株式以外の財産（金銭）を交付しており，かつ，その額は株式交換の対価総額の100％であり，20分の１（５％）を超えていることから，完全親会社の債権者は，株式交換完全親会社に対し，株式交換について異議を述べることができる。"},{"l":5,"m":"吸収型再編における存続会社等の手続","sb":"債権者異議手続","i":"A","r":"","q":"株式交換契約新株予約権がある場合，株式交換完全親株式会社の債権者は，当該株式交換について異議を述べることができる。","a":false,"c":"799条1項3号。","e":"株式交換契約新株予約権が新株予約権付社債に付された新株予約権である場合（768 条１項４号ハ），株式交換完全親株式会社の債権者は，当該株式交換について異議を述べることができる。この場合は，完全子会社の社債が完全親会社に承継されることになるので，完全親会社の金銭債務が増加し，債権者に重大な影響を与えるからである。"},{"l":1,"m":"吸収型再編における存続会社等の手続","sb":"効力発生","i":"A","r":"(平26II問題15エ・平22II問題17ア)","q":"吸収合併は，吸収合併の登記によって，その効力を生ずる。","a":false,"c":"750条1項。","e":"吸収合併存続株式会社は，吸収合併契約において定められた効力発生日に吸収合併消滅会社の権利義務を承継する。"},{"l":2,"m":"吸収型再編における存続会社等の手続","sb":"効力発生","i":"A","r":"(令5I問題17ウ・平23I問題18ウ類)","q":"吸収合併消滅会社の吸収合併による解散は，吸収合併の登記の後でなければ，これをもって第三者に対抗することができない。","a":true,"c":"750条2項。","e":""},{"l":3,"m":"吸収型再編における存続会社等の手続","sb":"効力発生","i":"A","r":"(平29I問題18イ・平28I問題15ア)","q":"吸収分割承継株式会社は，法定の全ての手続が終了している場合には，吸収分割契約において定められた効力発生日に吸収分割会社の権利義務を承継する。","a":true,"c":"759条1項。","e":"吸収分割は吸収型再編に分類されるので，吸収分割契約で定めた効力発生日に，その効力が生じる。"},{"l":4,"m":"吸収型再編における存続会社等の手続","sb":"効力発生","i":"A","r":"(平29I問題18ウ類・平22II問題17ウ類)","q":"株式交換完全親株式会社は，法定の全ての手続が終了している場合には，株式交換契約において定められた効力発生日に株式交換完全子会社の権利義務を承継する。","a":false,"c":"769条1項。","e":"株式交換完全親株式会社は，株式交換契約において定められた効力発生日（768 条６号）に株式交換完全子会社の発行済株式の全部を取得する。"},{"l":1,"m":"吸収型再編における存続会社等の手続","sb":"事後開示","i":"C","r":"","q":"吸収合併消滅株式会社の株主は，合併により吸収合併存続会社が承継した消滅会社の権利義務等を記載した事後開示書類の閲覧を請求することはできない。","a":false,"c":"801条4項。","e":"吸収合併消滅株式会社の株主は，吸収合併存続株式会社から株式の交付を受けた場合は存続会社の株主の資格で，社債等の交付を受けた場合は存続会社の債権者の資格で事後開示の閲覧を請求することができる。"},{"l":1,"m":"新設型再編における消滅会社等の手続","sb":"事前開示","i":"A","r":"(令4I問題18ア類・平31I問題17ア)","q":"２以上の株式会社が共同して株式移転をする場合には，当該２以上の株式会社は株式移転契約を締結しなければならない。","a":false,"c":"772条2項。","e":"２以上の株式会社が共同して株式移転をする場合には，当該２以上の株式会社は，共同して株式移転計画を作成しなければならない。なお，新設分割についても同様である（762条２項）。"},{"l":2,"m":"新設型再編における消滅会社等の手続","sb":"事前開示","i":"C","r":"","q":"新設合併消滅株式会社の株主は，裁判所の許可を得て，消滅会社に対して，新設合併契約の内容等を記載した書面の閲覧を請求することができる。","a":false,"c":"803条3項本文。","e":"新設合併消滅会社である株式会社の株主および債権者は，当該消滅会社に対して，その営業時間内は，いつでも，新設合併契約の内容等を記載した書面の閲覧または謄抄本の交付を請求することができる（803条３項本文）。事前開示によって提供される情報は，株主にとっては株主総会による合併承認決議に賛成するか否か，あるいは，株式買取請求権を行使するか否かを判断する資料となる。また，債権者にとっては，異議を述べるか否かを判断する資料となる。そして，新株予約権者にとっては，新株予約権買取請求権を行使するか否かを判断する資料となる。"},{"l":3,"m":"新設型再編における消滅会社等の手続","sb":"事前開示","i":"C","r":"","q":"新設分割株式会社の株主および債権者は，分割会社に対して，その営業時間内は，いつでも，新設分割計画の内容等を記載した書面の閲覧を請求することができる。","a":true,"c":"803条3項本文。","e":""},{"l":4,"m":"新設型再編における消滅会社等の手続","sb":"事前開示","i":"C","r":"","q":"株式移転完全子会社の株主および新株予約権者は，当該完全子会社に対して，営業時間内は，いつでも，株式移転計画の内容等を記載した書面等の閲覧を請求することができる。","a":true,"c":"803条3項本文かっこ書。","e":""},{"l":1,"m":"新設型再編における消滅会社等の手続","sb":"新設合併契約等の承認","i":"C","r":"(平25I問題18ア)","q":"新設合併において，各当事会社が株主総会の決議によって新設合併契約の承認を受ける日は，新設合併の登記前の同一の日でなければならない。","a":false,"c":"","e":"このような規定はない。"},{"l":2,"m":"新設型再編における消滅会社等の手続","sb":"新設合併契約等の承認","i":"C","r":"(令4I問題18イ)","q":"新設分割において，新設分割株式会社は，新設分割設立会社の定款の記載または記録事項を調査させるために，裁判所に対し，検査役の選任の申立てをしなければならない。","a":false,"c":"","e":"新設型再編において新たに会社を設立する場合は，裁判所選任の検査役による調査は要求されていない。"},{"l":3,"m":"新設型再編における消滅会社等の手続","sb":"新設合併契約等の承認","i":"B","r":"","q":"新設合併により，種類株式発行会社である新設合併消滅会社の譲渡制限株式を有していない種類株主に対して，新設合併設立会社の譲渡制限株式が交付される場合は，当該種類株主を構成員とする種類株主総会の特別決議がなければ，その効力を生じない。","a":false,"c":"804条3項本文,324条3項2号。","e":"新設合併消滅会社が種類株式発行会社であり，譲渡制限株式でない種類株主に対して譲渡制限株式が交付される場合は，当該種類株主を構成員とする種類株主総会の特殊決議がなければ，その効力を生じない。これは，譲渡制限が付されていない種類株式を保有していた種類株主が，新設合併によって譲渡制限株式を有することとなるため，株式譲渡制限の定款の定めをする場合と同様の要件を求めているのである。"},{"l":4,"m":"新設型再編における消滅会社等の手続","sb":"新設合併契約等の承認","i":"A","r":"(平28I問題16イ)","q":"新設分割により新設分割設立会社に承継させる資産の帳簿価額の合計額が，新設分割株式会社の総資産額として法務省令で定める方法により算定される額の５分の１を超えない場合には，当該新設分割株式会社は，株主総会の決議による新設分割計画の承認を受ける必要がない。","a":true,"c":"805条。","e":"簡易新設分割に該当する場合には，新設分割株式会社において，株主総会決議は不要である。簡易新設分割は，株主に与える影響が小さいと予想され，株主総会による承認を要求しなくとも株主保護に欠けることはないと考えられるためであり，その場合には，株主総会招集の費用と時間を節約するため，その省略を認めることが合理的だからである。"},{"l":5,"m":"新設型再編における消滅会社等の手続","sb":"新設合併契約等の承認","i":"B","r":"(令3問題17エ類・平28I問題16ウ)","q":"新設分割計画が新設分割株式会社の株主総会の決議による承認を受ける必要がある場合において，当該計画に基づく新設分割が法令または定款に違反し，当該株式会社の株主が不利益を受けるおそれがあるときは，当該株式会社の株主は，当該株式会社に対し，当該新設分割をやめることを請求することができる。","a":true,"c":"805条の2。","e":"新設分割が法令または定款に違反する場合において，新設分割会社の株主が不利益を受けるおそれがあるときは，新設分割会社の株主は，新設分割会社に対し，当該新設分割をやめることを請求することができる。ただし，当該新設分割が簡易新設分割に該当する場合は，当該請求をすることができない。新設分割の無効を争う手段としては，新設分割の無効の訴えがあるが，事後的に取得の効力が否定されると法律関係を不安定にするおそれがある。そうであれば，株主が，新設分割の効力発生前にその差止めを請求することができることとするのが相当である。そこで，会社法は，株主に新設分割の差止請求を認めたのである。"},{"l":1,"m":"新設型再編における消滅会社等の手続","sb":"反対株主の株式買取請求権","i":"A","r":"","q":"新設合併をする場合に，新設合併消滅株式会社の株主総会において議決権を行使することができる株主が反対株主の株式買取請求権を行使することができるのは，当該株主総会に先立って当該新設合併に反対する旨を通知した株主，または，当該株主総会において当該新設合併に反対した株主である。","a":false,"c":"806条2項1号。","e":"新設合併消滅株式会社の株主総会において議決権を行使することができる株主が反対株主の株式買取請求権を行使することができるのは，当該株主総会に先立って当該新設合併に反対する旨を通知し，かつ，当該株主総会において当該新設合併に反対した株主である。"},{"l":2,"m":"新設型再編における消滅会社等の手続","sb":"反対株主の株式買取請求権","i":"B","r":"(平23II問題18ウ)","q":"新設合併をする場合に，新設合併消滅株式会社に対して株式買取請求をすることができる株主には，新設合併契約を承認する株主総会において，議決権を行使することができない株主が含まれる。","a":true,"c":"806条2項2号。","e":""},{"l":3,"m":"新設型再編における消滅会社等の手続","sb":"反対株主の株式買取請求権","i":"B","r":"(平26I問題16エ類)","q":"新設分割株式会社の株主は，常に，反対株主の株式買取請求権を行使することができる。","a":false,"c":"806条1項2号。","e":"新設分割株式会社が新設分割設立会社に承継させる資産の額が，分割会社の総資産額の５分の１を超えない場合は，分割会社の株主は，反対株主の株式買取請求権を行使することができない。"},{"l":1,"m":"新設型再編における消滅会社等の手続","sb":"新株予約権買取請求権","i":"C","r":"","q":"新設分割株式会社の新株予約権者は，当該新株予約権の内容として新設分割をする際に新設分割設立株式会社の新株予約権を交付することとする旨の定めがあり，その定めによる条件と新設分割計画における取扱いが異なる場合は，当該分割会社に対し，自己の有する新株予約権を公正な価格で買い取ることを請求することができる。","a":true,"c":"808条1項2号。","e":""},{"l":2,"m":"新設型再編における消滅会社等の手続","sb":"新株予約権買取請求権","i":"C","r":"(平26II問題15ア)","q":"新設合併消滅株式会社の新株予約権は，新設合併設立株式会社の成立の日に，消滅する。","a":true,"c":"754条4項。","e":"新設合併の場合，新設合併設立会社の成立の日において新設合併消滅株式会社は消滅することとなるため，新設合併消滅株式会社の新株予約権が存続することはなく，新設合併設立会社の成立をもって消滅することとなる。そして，新設合併消滅株式会社の新株予約権者に対しては，新設合併契約に従い，新設合併設立株式会社の新株予約権または金銭が対価として交付される（753条１項10号11号，754条５項）。"},{"l":3,"m":"新設型再編における消滅会社等の手続","sb":"新株予約権買取請求権","i":"C","r":"","q":"株式移転完全子会社における新株予約権買取請求は，新株予約権買取請求に関する通知または公告をした日から20日以内に，その新株予約権買取請求に係る新株予約権の内容および数を明らかにしてしなければならない。","a":true,"c":"808条5項。","e":"なお，新株予約権買取請求をした新株予約権者は，完全子会社の承諾を得た場合に限り，新株予約権買取請求を撤回することができる（808条８項）。"},{"l":1,"m":"新設型再編における消滅会社等の手続","sb":"債権者異議手続","i":"B","r":"","q":"新設合併消滅会社は，いかなる場合であっても，新設合併をする旨等を官報に公告し，かつ，知れている債権者には各別にこれを催告しなければならない。","a":false,"c":"810条3項。","e":"新設合併消滅株式会社は，原則として，新設合併をする旨等を官報に公告し，かつ，知れている債権者には，各別にこれを催告しなければならないが，公告を官報に加え，定款の定め（939 条１項）による日刊新聞紙または電子公告によってもする場合には，知れている債権者への各別の催告は必要ない（810 条３項）。この場合は，各別の催告を省略しても，会社債権者に対する公示の機能は十分であると考えられるからである。"},{"l":2,"m":"新設型再編における消滅会社等の手続","sb":"債権者異議手続","i":"A","r":"(平24II問題17イ類)","q":"新設分割後に新設分割設立株式会社に対して債務の履行を請求することができない分割会社の債権者は，当該新設分割について異議を述べることができる。","a":false,"c":"810条1項2号。","e":"新設分割後に新設分割株式会社に対して債務の履行を請求することができない分割会社の債権者は，当該新設分割について異議を述べることができる。これは，当該債権者にとっては，債務者が分割会社から設立会社に交代することとなるためである。"},{"l":3,"m":"新設型再編における消滅会社等の手続","sb":"債権者異議手続","i":"A","r":"(令2II問題17ウ)","q":"株式会社が新設分割をする場合，新設分割後に新設分割株式会社に対して債務の履行を請求することができる新設分割株式会社の全ての債権者は，当該新設分割株式会社に対し，当該新設分割について異議を述べることができない。","a":false,"c":"810条1項2号かっこ書。","e":"新設分割後に新設分割株式会社に対して債務の履行（当該債務の保証人として新設分割設立会社と連帯して負担する保証債務の履行を含む）を請求することができない新設分割株式会社の債権者は，新設分割株式会社に対して，新設分割について異議を述べることができる（810 条１項２号）。当該債権者にとっては，債務者が分割会社から設立会社に交代することとなるためである。これに対して，新設分割後も新設分割株式会社に対して債務の履行を請求することができる新設分割株式会社の債権者については，異議を述べることができない。なぜなら，分割会社は，設立会社から新設分割による対価の交付を受けているため，分割の前後では，分割会社の資産状態には実質的な変動がなく，当該債権者が不利益を受けるおそれがないといえるからである。ただし，新設分割後も新設分割株式会社に対して債務の履行を請求することができる新設分割株式会社の債権者であっても，新設分割株式会社が人的分割類似行為（763条１項12号）をする場合については，当該債権者は新設分割株式会社に対して異議を述べることができる。すなわち，分割会社が人的分割類似行為をする場合は，分割会社の全債権者が異議を述べることができるのである。人的分割類似行為をする場合，分割会社の財産が減少することとなるし，財源規制もないことから，新設分割後も分割会社に対して債務の履行を請求することができる分割会社の債権者であっても不利益を受けることとなるためである。"},{"l":4,"m":"新設型再編における消滅会社等の手続","sb":"債権者異議手続","i":"A","r":"(令6I問題18ウ・令2II問題17エ・平24II問題17エ類)","q":"株式移転計画新株予約権が新株予約権付社債に付された新株予約権である場合，株式移転完全子会社の当該新株予約権付社債の社債権者は，当該株式移転について異議を述べることができる。","a":true,"c":"810条1項3号。","e":"この場合に債権者異議手続が必要になるのは，当該新株予約権付社債の社債権者の地位が，完全子会社の債権者の地位から，設立完全親会社の地位に変更されるためである。"},{"l":5,"m":"新設型再編における消滅会社等の手続","sb":"債権者異議手続","i":"C","r":"","q":"新設分割会社が一定の期間内に異議を述べることができる旨等の公告を官報のほか，公告方法に関する定款の定めに従い電子公告によりする場合においては，新設分割会社に対して異議を述べることができる当該分割会社の債権者であって各別の催告を受けなかったものは，新設分割計画において新設分割後に新設分割設立株式会社に対して債務の履行を請求することができないものとされているときであっても，当該設立会社に対して，承継した財産の価額を限度として債務の履行を請求することができる。","a":false,"c":"764条3項。","e":"新設分割会社に対して異議を述べることができる当該分割会社の債権者であって各別の催告を受けなかったもの（二重公告をする場合は不法行為債権者に限る）は，新設分割計画において債務の履行を請求することができないものとされているときであっても，①分割会社に対しては，効力発生日に有していた財産の価額，② 設立会社に対しては，承継した財産の価額を限度として債務の履行を請求することができる（764条２項３項）。"},{"l":1,"m":"新設型再編における消滅会社等の手続","sb":"事後開示","i":"C","r":"","q":"株式移転完全親会社の成立の日に株式移転完全子会社の株主であった者は，当該完全子会社に対して，株式移転により当該完全親会社が取得した完全子会社の株式の数その他の株式移転に関する事項を記載した事後開示書類を閲覧することはできない。","a":false,"c":"811条4項。","e":"株式移転完全親会社の成立の日に株式移転完全子会社の株主および新株予約権者であった者は，完全子会社に対して，株式移転により完全親会社が取得した完全子会社の株式の数その他の株式移転に関する事項を記載した事後開示書類の閲覧を請求することができる（811条４項）。"},{"l":1,"m":"新設型再編における設立会社等の手続","sb":"効力発生","i":"A","r":"(令5I問題17ア類・平29I問題18ア)","q":"新設合併設立株式会社は，法定の全ての手続が終了している場合には，新設合併契約において定められた効力発生日に新設合併消滅会社の権利義務を承継する。","a":false,"c":"754条1項。","e":"新設合併は新設型再編に分類されるので，設立の登記の日に，その効力が生じる。なお，新設合併設立株式会社は，設立会社の成立の日（設立登記の日（922条））に，消滅会社の権利義務を承継する（754条１項）。"},{"l":2,"m":"新設型再編における設立会社等の手続","sb":"効力発生","i":"A","r":"(平28I問題16エ類・平22II問題17イ)","q":"新設分割は，新設分割の登記によって，その効力を生ずる。","a":true,"c":"764条1項。","e":"なお，新設分割設立株式会社は，新設分割設立株式会社の成立の日（設立登記の日（924 条））に新設分割会社の権利義務を承継する。"},{"l":3,"m":"新設型再編における設立会社等の手続","sb":"効力発生","i":"A","r":"(令6I問題18イ・平29I問題18エ・平23I問題17ウ・平22II問題17エ類)","q":"株式移転は，法定の全ての手続が終了している場合には，株式移転計画に記載された効力発生日にその効力を生ずる。","a":false,"c":"774条1項。","e":"株式移転は新設型再編に分類されるので，設立の登記の日に，その効力が生じる。なお，株式移転設立完全親会社は，その成立の日（設立登記の日（924条））に，株式移転完全子会社の発行済株式の全部を取得する。"},{"l":1,"m":"新設型再編における設立会社等の手続","sb":"事後開示","i":"C","r":"","q":"新設分割設立株式会社の株主および債権者以外の利害関係人も，新設分割により設立会社が承継した新設分割会社の権利義務等を記載した事後開示書類を閲覧することができる。","a":true,"c":"815条4項5項。","e":"新設分割においては，その他利害関係人についても事後開示の閲覧請求権が認められている（811 条３項，815 条４項５項）。これは，分割会社の労働者など，新設分割により契約関係に影響を受ける者をも事後開示の閲覧請求権の対象に含める趣旨である。なお，吸収分割の場合も同様である（791条３項，801条４項５項）。"},{"l":2,"m":"新設型再編における設立会社等の手続","sb":"事後開示","i":"C","r":"(平27I問題14エ)","q":"新設分割において，新設分割設立株式会社は，定款の記載事項または記録事項を調査させるために，裁判所に対し，検査役の選任の申立てをしなければならない。","a":false,"c":"814条1項。","e":"このような規定はない。新設型再編により設立される株式会社に対しては，設立に際し定款の記載事項または記録事項を調査させるために，裁判所に対し，検査役の選任の申立てをしなければならないという規定（33条１項）は適用されない。"},{"l":1,"m":"株式交付の手続","sb":"株式交付計画","i":"A","r":"","q":"株式会社が株式交付をする場合には，株式交付計画において，株式交付親会社が株式交付に際して譲り受ける株式交付子会社の株式の数（株式交付子会社が種類株式発行会社である場合にあっては，株式の種類および種類ごとの数）の下限を定めなければならない。","a":true,"c":"774条の3第1項2号。","e":""},{"l":2,"m":"株式交付の手続","sb":"株式交付計画","i":"B","r":"(令4II問題18ア)","q":"株式交付計画に定める事項のうち，株式交付親会社が株式交付に際して譲り受ける株式交付子会社の株式の数の下限については，効力発生日において，株式交付子会社の議決権の総数に対する株式交付親会社並びにその子会社及び子法人等の計算において所有している議決権の数の割合が100 分の50 を超えることとなる数を内容としなければならない。","a":true,"c":"774条の3第2項。","e":"株式交付制度は，株式交付親会社と株式交付子会社との間に親子会社関係が創設されることを目的とした制度である。したがって，その目的を達成できる数の株式を取得することが必要とされるのである。"},{"l":1,"m":"株式交付の手続","sb":"事前開示","i":"B","r":"","q":"株式交付親会社は，株式交付計画備置開始日から効力発生日後６か月を経過する日までの間，株式交付計画の内容その他法務省令で定める事項を記載または記録した書面または電磁的記録をその本店に備え置かなければならない。","a":true,"c":"816条の2第1項。","e":""},{"l":2,"m":"株式交付の手続","sb":"事前開示","i":"C","r":"","q":"株式交付親会社の株主および債権者は，当該株式交付親会社に対して，その営業時間内は，いつでも，株式交付計画の内容等を記載または記録した書面または電磁的記録の閲覧もしくは謄本または抄本の交付を請求することができる。","a":false,"c":"816条の2第3項柱書本文。","e":"株式交付親会社の株主は，株式交付親会社に対して，その営業時間内は，いつでも，株式交付計画の内容等を記載または記録した書面または電磁的記録の閲覧もしくは謄本または抄本の交付を請求することができる（816 条の２第３項柱書本文）。一方で，株式交付親会社の債権者に株式交付計画の内容等の閲覧請求が認められる場合は，株式交付に際して株式交付子会社の株式および新株予約権等の譲渡人に対して株式交付親会社の株式以外の財産を交付する場合であり，かつ，当該財産の額が対価総額の20分の１を超えるとき（816条の２第３項柱書かっこ書，会社法施行規則213条の３）である。"},{"l":1,"m":"株式交付の手続","sb":"株式交付計画の承認","i":"B","r":"","q":"株式交付親会社は，必ず，効力発生日の前日までに，株主総会の特別決議によって，株式交付計画の承認を受けなければならない。","a":false,"c":"816条の3第1項","e":"株式交付親会社は，原則として，効力発生日の前日までに，株主総会の特別決議によって株式交付計画の承認を受けなければならないが（816条の３第１項，309条２項12号），簡易株式交付に該当する場合（816条の４第1項）は，株主総会の決議を要しない。"},{"l":2,"m":"株式交付の手続","sb":"株式交付計画の承認","i":"B","r":"(令4II問題18イ類)","q":"株式交付子会社は，効力発生日の前日までに，株主総会の特別決議によって，株式交付計画の承認を受けなければならない。","a":false,"c":"","e":"株式交付子会社は株式交付当事会社ではないため，組織再編行為としての手続は存在しない。したがって，株式交付子会社においては，株式交付計画の承認は不要である。"},{"l":3,"m":"株式交付の手続","sb":"株式交付計画の承認","i":"B","r":"","q":"株式交付親会社が株式交付子会社の株主および新株予約権等の譲渡人に対して交付する金銭等（株式交付親会社の株式等を除く）の帳簿価額が株式交付親会社の取得する株式交付子会社の株式および新株予約権等の額として法務省令で定める額を超える場合，当該株式交付親会社の取締役は，株式交付計画を承認する株主総会において，その旨を説明しなければならない。","a":true,"c":"816条の3第2項。","e":""},{"l":4,"m":"株式交付の手続","sb":"株式交付計画の承認","i":"B","r":"(令4II問題18ウ類)","q":"株式交付が法令または定款に違反する場合において，株式交付親会社の株主が不利益を受けるおそれがあるときは，株式交付の対価の額にかかわらず，当該株式交付親会社の株主は，当該株式交付親会社に対し，株式交付をやめることを請求することができる。","a":false,"c":"816条の5ただし書。","e":"簡易株式交付に該当する場合については，株主に及ぼす影響が小さいとして株主総会の決議が不要とされていることに鑑み，株主は，当該株式交付の差止を請求することができない。"},{"l":1,"m":"株式交付の手続","sb":"反対株主の株式買取請求権","i":"B","r":"","q":"株式交付が簡易株式交付の要件を満たす場合には，株式交付親会社の株主に株式買取請求権は認められない。","a":true,"c":"816条の6第1項ただし書。","e":"簡易株式交付の場合に株主総会の決議が不要とされているのは，簡易株式交付が株主に与える影響が小さいと予想されるためであり，このことからすれば，株式交付親会社において簡易株式交付の要件を満たす場合には，株主は株式買取請求権を有しないこととするのが相当であるからである。"},{"l":1,"m":"株式交付の手続","sb":"債権者異議手続","i":"B","r":"","q":"株式交付親会社のすべての債権者は，当該株式交付親会社に対し，株式交付について異議を述べることができる。","a":false,"c":"816条の8第1項,会社法施行規則213条の7。","e":"株式交付に際して株式交付子会社の株式および新株予約権等の譲渡人に対して株式交付親会社の株式以外の財産を交付する場合であり，かつ，当該財産の額が対価総額の20分の１を超えるときは，株式交付親会社の債権者は，株式交付親会社に対し，株式交付について異議を述べることができる。なぜなら，株式交付親会社の株式以外を対価とする場合については，会社財産が変動することになるので，取得する株式交付子会社の株式の価値よりも高い不当な対価を株式交付子会社の株主に交付してしまうと，債権者に重大な影響を与えるからである。"},{"l":1,"m":"株式交付の手続","sb":"株式交付子会社の株式の譲渡しの申込み","i":"B","r":"","q":"株式交付親会社は，株式交付子会社の株式の譲渡しの申込みをしようとする者に対し，株式交付計画の内容を通知しなければならない。","a":true,"c":"774条の4第1項2号。","e":"株式交付親会社は，株式交付子会社の株式の譲渡しの申込みをしようとする者に対し，① 株式交付親会社の商号，② 株式交付計画の内容，③ その他法務省令で定める事項を通知しなければならない（774条の４第１項各号）。"},{"l":1,"m":"株式交付の手続","sb":"株式交付の効力発生","i":"A","r":"","q":"株式交付親会社は，株式交付計画において定められた効力発生日に，株式交付子会社の発行済株式の全部を取得する。","a":false,"c":"774条の11第1項。","e":"株式交付親会社は，株式交付計画において定められた効力発生日に，株式交付子会社の株式および新株予約権等を譲り受けることとなるが，株式交付は株式交換とは違い，完全親子会社関係を創設する制度ではないため，株式交付子会社の発行済株式の全部を取得するわけではない。"},{"l":2,"m":"株式交付の手続","sb":"株式交付の効力発生","i":"C","r":"(令4II問題18エ)","q":"株式交付親会社は，株式交付子会社の同意を得た場合に限り，株式交付計画において定めた当初の効力発生日から３か月以内の日をもって，新たな効力発生日とすることができる。","a":false,"c":"","e":"株式交付親会社は，効力発生日を変更することができる（816 条の９第１項）。当該規定による変更後の効力発生日は，株式交付計画において定めた当初の効力発生日から３か月以内の日でなければならないとされているが（同条２項），株式交付子会社は株式交付当事会社ではないため，効力発生日の変更の際には株式交付子会社の同意は必要とされていない。"},{"l":1,"m":"組織変更","sb":"総論","i":"C","r":"","q":"株式会社が持分会社に組織変更する場合に，株式会社の株主に対して金銭を交付することは認められない。","a":false,"c":"744条1項5号ロ。","e":"株式会社から持分会社に組織変更をする場合には，効力発生日に，組織変更計画の定めにしたがって，株式会社の株主に組織変更後の持分会社の持分を交付することが原則である（745 条３項）。しかし，組織変更対価として，持分会社の持分以外の金銭その他の財産を交付することを組織変更計画に定めることもできる（744 条１項５号）。なお，社員が１人もいなくなってしまうことを防止するため，組織変更前の株式会社の株主のうち少なくとも１人は組織変更後の持分会社の社員となる必要がある。"},{"l":2,"m":"組織変更","sb":"総論","i":"C","r":"","q":"持分会社が株式会社に組織変更する場合に，持分会社の社員に対して，組織変更後株式会社の新株予約権を交付することができる。","a":true,"c":"746条7号ロ。","e":"持分会社から株式会社に組織変更をする場合には，効力発生日に，組織変更計画の定めにしたがって，持分会社の社員に組織変更後の株式会社の株式を交付することが原則である（747 条３項）。しかし，組織変更対価として，株式会社の株式以外の金銭その他の財産を交付することを組織変更計画に定めることもできる（746 条７号）。なお，株主が１人もいなくなってしまうことを防止するため，組織変更前の持分会社の社員のうち少なくとも１人は組織変更後の株式会社の株主となる必要がある。"},{"l":1,"m":"組織変更","sb":"事前開示","i":"A","r":"(令6II問題17イ・令2I問題17ウ類・平26II問題14イ類)","q":"組織変更をする株式会社は，組織変更計画備置開始日から効力発生日までの間，組織変更計画の内容等を記載または記録した書面または電磁的記録をその本店に備え置かなければならない。","a":true,"c":"775条1項。","e":"組織変更計画などの備置・開示が行われる期間は，組織変更の効力発生日までとされ，合併等と異なり，効力が生じた日から６か月を経過する日までとされていない。また，事後開示に相当する手続もない。その理由は，① 持分会社には手続の簡素化の必要性から書類の備置・開示義務を課すことが適当ではないこと，② 株式会社から持分会社への組織変更が会社債権者の利害に与える影響は小さいこととされている。"},{"l":2,"m":"組織変更","sb":"事前開示","i":"C","r":"","q":"組織変更をする株式会社の債権者は，当該会社に対して，組織変更計画の内容等を記載した書面等の閲覧を請求することはできない。","a":false,"c":"775条3項本文。","e":"組織変更をする株式会社の株主および債権者は，当該会社に対して，営業時間内は，いつでも，組織変更計画の内容等を記載した書面等の閲覧・交付請求をすることができる。"},{"l":1,"m":"組織変更","sb":"組織変更計画の承認等","i":"A","r":"(平30I問題17イ類・平26II問題14ウ・平22I問題16ウ類)","q":"組織変更をする株式会社は，効力発生日の前日までに，組織変更計画について，総株主の同意を得なければならない。","a":true,"c":"776条1項。","e":"組織変更が行われると，社員の責任の態様，持分の譲渡性，業務執行権限などの点において変化が生じることとなる。このように，組織変更によって株主に重大な影響を与えることになるので，総株主の同意を得る必要がある。なお，株式会社の組織変更計画の承認については，定款に別段の定めをすることは認められていない。"},{"l":2,"m":"組織変更","sb":"組織変更計画の承認等","i":"C","r":"(令2I問題17ア)","q":"持分会社は，定款に別段の定めがある場合は，総社員の同意を得ることなく，組織変更をすることができる。","a":true,"c":"781条1項。","e":"株式会社が持分会社に組織変更を行う場合（776条１項）と異なり，持分会社の定款に別段の定めがある場合には，総社員の同意を得る必要はない。"},{"l":3,"m":"組織変更","sb":"組織変更計画の承認等","i":"A","r":"(令6II問題17ウ類・令2I問題17イ)","q":"株式会社が組織変更をする場合には，反対株主は，当該株式会社に対し，自己の有する株式を公正な価格で買い取ることを請求することができる。","a":false,"c":"776条1項。","e":"組織変更をする株式会社は，効力発生日の前日までに，組織変更計画について，総株主の同意を得なければならない（776 条１項）。したがって，株式会社が組織変更することを決定した場合には，反対株主は存在し得ないことから，このような規定はない。"},{"l":1,"m":"組織変更","sb":"新株予約権買取請求権","i":"A","r":"(令6II問題17エ・平30I問題17ウ・平26II問題14エ)","q":"株式会社が組織変更する場合，すべての新株予約権者は，当該株式会社に対し，自己の有する新株予約権を公正な価格で買取ることを請求することができる。","a":true,"c":"777条1項。","e":"株式会社の組織変更の効力が発生すると，当該会社が発行していた新株予約権は消滅する（745条５項）。そして，新株予約権者には組織変更による対価が交付されることになるが，当該対価が不当である場合も考えられるため，交付される対価に反対する新株予約権者への救済策として新株予約権買取請求権が規定されている。"},{"l":1,"m":"組織変更","sb":"債権者異議手続","i":"A","r":"(平22I問題16イ類)","q":"組織変更をする株式会社の債権者は，組織変更について異議を述べることができない。","a":false,"c":"779条1項。","e":"組織変更をする株式会社の債権者は，組織変更について異議を述べることができる。組織変更が行われると，社員の責任の態様に変更が生じることとなる。また，株式会社が合同会社に組織変更をすると，計算書類の公告義務（440条），大会社における会計監査人の設置義務（328 条）がなくなるため，債権者にとって不利な事態が生じる。このように，債権者に重大な影響を与えることとなるから，すべての債権者が異議を述べることができるとしている。"},{"l":2,"m":"組織変更","sb":"債権者異議手続","i":"C","r":"(平30I問題17エ類)","q":"組織変更をする持分会社の債権者は，組織変更について異議を述べることができる。","a":true,"c":"781条2項,779条。","e":""},{"l":3,"m":"組織変更","sb":"債権者異議手続","i":"C","r":"","q":"組織変更をする持分会社が，当該持分会社の債権者に対して，組織変更をする旨等の公告を官報のほか，定款の定めによる日刊新聞紙または電子公告によっても行う場合には，知れている債権者への各別の催告を省略することができる。","a":false,"c":"781条2項,779条3項。","e":"二重公告による各別の催告を省略することができるのは，組織変更をする持分会社が合同会社である場合に限定されている。"},{"l":1,"m":"組織変更","sb":"効力発生","i":"B","r":"","q":"組織変更をする株式会社は，効力発生日に持分会社となる。","a":true,"c":"745条1項。","e":"組織変更する持分会社も同様に，効力発生日（746条１項９号）に，株式会社となる（747条１項）。"},{"l":2,"m":"組織変更","sb":"効力発生","i":"C","r":"(令5II問題17ア)","q":"株式会社の組織変更の効力が生じた場合には，当該株式会社は清算をしなければならない。","a":false,"c":"475条各号参照。","e":"株式会社の組織変更の効力が生じた場合には，当該株式会社は持分会社にその組織が変更されるのであって，清算することにはならない。"},{"l":1,"m":"組織再編行為の瑕疵","sb":"","i":"A","r":"","q":"株式会社が事業の全部を譲渡する場合，当該株式会社の株主は，当該事業譲渡の効力が生じた日から６か月以内に限って，事業譲渡無効の訴えを提起することができる。","a":false,"c":"","e":"事業譲渡等は，会社分割などの組織法上の行為と異なり，取引法上の行為であるから，会社法上特別の訴えの制度は設けられていない。したがって，民法の一般原則によってその無効を主張することができる。"},{"l":2,"m":"組織再編行為の瑕疵","sb":"","i":"A","r":"(令2II問題18エ類・平28I問題17エ類・平23I問題18エ・平21問題18エ類)","q":"吸収合併の無効は，吸収合併の効力発生日から６か月以内に限り，訴えをもってのみ主張することができる。","a":true,"c":"828条1項7号。","e":""},{"l":3,"m":"組織再編行為の瑕疵","sb":"","i":"A","r":"(令7I問題18ア類・令2II問題18ア)","q":"吸収合併の無効は，吸収合併消滅株式会社または吸収合併存続株式会社が公開会社でない場合は，当該吸収合併の効力が生じた日から１年以内に，訴えをもってのみ主張することができる。","a":false,"c":"828条1項7号。","e":"非公開会社であっても，吸収合併の無効は，吸収合併の効力が生じた日から６か月以内に限り，主張することができる。"},{"l":4,"m":"組織再編行為の瑕疵","sb":"","i":"A","r":"(平29II問題18エ)","q":"株式移転の手続が法令に違反する場合，当該株式移転により設立する会社について設立の無効の訴えを提起することができる。","a":false,"c":"828条1項12号。","e":"株式移転の無効は，株式移転無効の訴えによってのみ主張することができる。"},{"l":5,"m":"組織再編行為の瑕疵","sb":"","i":"A","r":"","q":"吸収合併無効の訴えは，吸収合併後存続する会社のすべての債権者が訴えをもって主張することができる。","a":false,"c":"828条2項7号。","e":"吸収合併無効の訴えは，吸収合併について承認をしなかった債権者が訴えをもって主張することができる。"},{"l":6,"m":"組織再編行為の瑕疵","sb":"","i":"A","r":"(令2I問題17エ)","q":"組織変更について承認をしなかった債権者は，当該組織変更の効力が生じた日から６か月以内に当該組織変更の無効の訴えを提起することができる。","a":true,"c":"828条2項6号。","e":""},{"l":7,"m":"組織再編行為の瑕疵","sb":"","i":"A","r":"(平24II問題18ア)","q":"吸収合併後存続する会社の破産管財人は，会社の吸収合併の無効の訴えを提起することができない。","a":false,"c":"828条2項7号。","e":"吸収合併後存続する会社の破産管財人は，会社の吸収合併の無効の訴えを提起することができる。"},{"l":8,"m":"組織再編行為の瑕疵","sb":"","i":"A","r":"(平25II問題17エ)","q":"株式移転設立完全親会社の株主は，株式移転無効の訴えを提起することができない。","a":false,"c":"828条2項12号。","e":"株式移転無効の訴えは，① 株式移転の効力が生じた日において株式移転をする株式会社の株主等であった者，②株式移転により設立する株式会社の株主等または破産管財人，③ 株式移転について承認をしなかった債権者は，提起することができる。したがって，株式移転設立完全親会社の株主は，株式移転無効の訴えを提起することができる。"},{"l":9,"m":"組織再編行為の瑕疵","sb":"","i":"A","r":"(令7I問題18イ)","q":"吸収合併の効力が生じた日において吸収合併消滅会社の株主であった者は， 吸収合併の無効の訴えを提起することはできない。","a":false,"c":"828条2項7号。","e":"吸収合併の効力が生じた日において吸収合併消滅会社の株主であった者は，吸収合併の無効の訴えを提起することができる。"},{"l":10,"m":"組織再編行為の瑕疵","sb":"","i":"C","r":"(平24II問題18イ・平24I問題18イ)","q":"会社の新設分割の無効の訴えの被告は，新設分割をする会社および新設分割により設立する会社である。","a":true,"c":"834条10号。","e":""},{"l":11,"m":"組織再編行為の瑕疵","sb":"","i":"C","r":"(平30I問題18エ)","q":"吸収分割株式会社の株主が吸収分割の無効の訴えを提起するとき，被告となるのは当該吸収分割株式会社のみである。","a":false,"c":"834条9号。","e":"会社の吸収分割の無効の訴えについては，吸収分割株式会社と吸収分割承継会社の双方がそれぞれ被告となる。"},{"l":12,"m":"組織再編行為の瑕疵","sb":"","i":"A","r":"(令6II問題18ウ・平30I問題18ア・平24I問題18ウ類)","q":"新設合併の無効の訴えに係る請求を認容する確定判決は，第三者に対してもその効力を有する。","a":true,"c":"838条。","e":"法律関係の画一的確定の観点から，組織再編行為の無効判決には対世的効力が認められている。"},{"l":13,"m":"組織再編行為の瑕疵","sb":"","i":"A","r":"(令7I問題18エ類・平24II問題18ウ)","q":"会社の吸収合併の無効の訴えに係る請求を認容する判決が確定したときは，当該判決において無効とされた吸収合併は，当該吸収合併の効力発生時に遡ってその効力を失う。","a":false,"c":"839条。","e":"組織再編行為の無効の訴えに係る請求を認容する判決は，取引の安全を図るために遡及効が阻止され，将来に向かってその効力を失う（将来効）。"},{"l":14,"m":"組織再編行為の瑕疵","sb":"","i":"C","r":"(平30I問題18イ)","q":"新設合併の無効の訴えに係る請求を認容する判決が確定したときは，新設合併設立会社は解散する。","a":true,"c":"","e":"新設合併の無効の訴えに係る請求を認容する判決が確定すると，新設合併の設立会社は解散し，消滅会社が復活する。設立会社については解散の登記，復活する消滅会社については回復の登記がなされる（937条３項３号）。"},{"l":15,"m":"組織再編行為の瑕疵","sb":"","i":"B","r":"(令6II問題18エ類・令2I問題18エ)","q":"吸収合併の無効の訴えに係る請求を認容する判決が確定したときは，吸収合併をした会社は，当該吸収合併の効力が生じた日後に吸収合併後存続する会社が負担した債務について，連帯して弁済する責任を負う。","a":true,"c":"843条1項1号。","e":"また，吸収合併の効力が生じた日後に吸収合併存続株式会社が取得した財産は，当該吸収合併をした会社の共有に属する（843条２項本文）。"},{"l":16,"m":"組織再編行為の瑕疵","sb":"","i":"B","r":"(令4I問題18エ・平24II問題18エ)","q":"会社の新設分割の無効の訴えに係る請求を認容する判決が確定したときは，新設分割会社は，当該新設分割の効力が生じた日後に新設分割設立会社が負担した債務について，連帯して弁済する責任を負う。","a":true,"c":"843条1項4号。","e":""},{"l":17,"m":"組織再編行為の瑕疵","sb":"","i":"B","r":"(令7I問題18ウ)","q":"吸収合併の無効の訴えに係る請求を認容する判決が確定したときは，当該吸収合併の効力が生じた日後に吸収合併後存続する会社が取得した財産は，当該吸収合併をした会社の共有に属する。","a":true,"c":"843条2項本文。","e":""},{"l":1,"m":"事業譲渡等","sb":"事業譲渡の意義","i":"C","r":"","q":"判例によると，株主総会の特別決議が必要となる事業譲渡は，単なる事業用財産の譲渡ではなく，一定の事業目的に組織化された有機的一体として機能する財産の全部または重要な一部の譲渡である必要があるとしている。","a":true,"c":"最判昭40年9月22日。","e":"判例によると，株主総会の特別決議が必要となる事業譲渡（467条１項１号２号）は，21条以下の事業譲渡と同義に解すことができ，単なる事業用財産の譲渡ではなく，① 一定の事業目的に組織化された有機的一体として機能する財産の全部または重要な一部の譲渡であって，② 譲受会社が事業活動を承継し，③ その結果，譲渡会社が法律上当然に競業避止義務（21条）を負担することになる場合をいう。"},{"l":2,"m":"事業譲渡等","sb":"事業譲渡の意義","i":"B","r":"(平30II問題17ア類)","q":"判例は，株主総会の特別決議が必要となる事業譲渡の要件として，譲渡会社がその事業によって営んでいた事業活動を譲受会社が承継することは求めていない。","a":false,"c":"最判昭40年9月22日。","e":"判例は，株主総会の特別決議が必要となる事業譲渡の要件として，譲渡会社がその事業によって営んでいた事業活動を譲受会社が承継することを求めている。"},{"l":1,"m":"事業譲渡等","sb":"事業譲渡の法的性質","i":"A","r":"(平31II問題17ア類・平28II問題17ウ・平24I問題17ア)","q":"株式会社がその事業の全部を譲渡する場合，当該株式会社は，債権者に異議を述べる機会を与える手続をとらなければならない。","a":false,"c":"","e":"会社分割の場合と比較して説明する。会社分割には，吸収分割契約または新設分割計画の内容に従い分割会社の債務が承継会社または設立会社に移転されるので，債務の移転について債権者の個別の同意は不要であるが，会社法上，債権者異議手続を要する。これに対して，事業譲渡においては，譲渡会社の債務を債権者との関係において譲受会社が引き受けるためには，債務引受けの手続（債権者の承諾）が必要であることから，会社法上，会社分割で要求されるような債権者異議手続は設けられていない。"},{"l":2,"m":"事業譲渡等","sb":"事業譲渡の法的性質","i":"B","r":"(平30II問題17イ)","q":"株式会社がその事業の全部を譲渡する場合，譲渡会社は，当該譲渡の効力発生日に清算手続を経ることなく当然に消滅する。","a":false,"c":"","e":"このような規定はない。すなわち，株式会社がその事業の全部を譲渡する場合であっても，譲渡対価を受け取ることとなるため，当然に譲渡会社は解散し，消滅することはない。"},{"l":3,"m":"事業譲渡等","sb":"事業譲渡の法的性質","i":"A","r":"(令4II問題16エ類・令2II問題18ウ類・平30II問題17ウ)","q":"事業譲渡の無効は，訴えによらずに主張することができる。","a":true,"c":"","e":"すなわち，事業譲渡は，会社分割などの組織法上の行為と異なり，取引法上の行為であるから，会社法上特別の訴えの制度は設けられていない。したがって，民法の一般原則により，いつでも，誰でも，どのような方法でもその無効を主張することができる。"},{"l":4,"m":"事業譲渡等","sb":"事業譲渡の法的性質","i":"B","r":"(平29II問題17イ)","q":"株式会社が事業譲渡を行った場合，会社法上，当該事業譲渡をした旨の登記は不要である。","a":true,"c":"","e":"事業譲渡は取引法上の行為であるため，登記は求められていない。"},{"l":1,"m":"事業譲渡等","sb":"事業譲渡等の承認等の手続","i":"B","r":"","q":"事業の重要な一部の譲渡をする株式会社は，事業譲渡等契約備置開始日から効力発生日後６か月を経過する日までの間，事業譲渡契約の内容を記載した書面をその本店に備え置かなければならない。","a":false,"c":"","e":"事業譲渡等については，合併等の組織再編行為と異なり，事前開示は求められていない。"},{"l":2,"m":"事業譲渡等","sb":"事業譲渡等の承認等の手続","i":"A","r":"","q":"株式会社は，事業の全部の譲渡をする場合には，原則として，その効力発生日の前日までに，株主総会の特別決議によってその承認を受けなければならない。","a":true,"c":"467条1項1号,309条2項11号。","e":""},{"l":3,"m":"事業譲渡等","sb":"事業譲渡等の承認等の手続","i":"A","r":"(平29II問題17ウ)","q":"株式会社がその事業の全部を他の株式会社に譲渡する場合，譲受会社は，譲渡会社の資本金および準備金に相当する額をそれぞれ貸借対照表の純資産の部に計上しなければならない。","a":false,"c":"","e":"このような規定はない。"},{"l":4,"m":"事業譲渡等","sb":"事業譲渡等の承認等の手続","i":"A","r":"(平29I問題16エ)","q":"株式会社が会社以外の商人にその事業の全部を譲渡する場合には，株主総会の特別決議による承認を要しない。","a":false,"c":"467条1項1号,309条2項11号。","e":"株式会社は，事業の全部の譲渡をする場合には，原則として，その効力発生日の前日までに，株主総会の特別決議を要する。これは，会社以外の商人に対する譲渡においても同様である。"},{"l":5,"m":"事業譲渡等","sb":"事業譲渡等の承認等の手続","i":"B","r":"","q":"株主総会の特別決議により承認を受けなければならない事業の重要な一部の譲渡には，譲渡する資産の帳簿価額が，当該株式会社の総資産額として法務省令で定める方法により算定される額の５分の１を超えないものは含まれない。","a":true,"c":"467条1項2号かっこ書。","e":"事業の重要な一部の譲渡には，当該譲渡により譲り渡す資産の帳簿価額が当該株式会社の総資産額の５分の１を超えないものは含まれない。"},{"l":6,"m":"事業譲渡等","sb":"事業譲渡等の承認等の手続","i":"A","r":"(平29I問題16イ類・平24I問題17ウ類)","q":"株式会社は，他の会社の事業の重要な一部の譲受けをする場合には，原則として，その効力発生日の前日までに，株主総会の特別決議によってその承認を受けなければならない。","a":false,"c":"467条1項3号,309条2項11号。","e":"株式会社は，他の会社の事業の全部の譲受けをする場合には，その効力発生日の前日までに，株主総会の特別決議によってその承認を受けなければならない。ここで，他の会社の事業の全部の譲受けについて株主総会の特別決議が要求されるのは，譲受会社が吸収合併の存続会社に近い立場に立つためである。"},{"l":7,"m":"事業譲渡等","sb":"事業譲渡等の承認等の手続","i":"C","r":"(平28II問題17ア)","q":"事業の一部の譲渡において，譲渡する資産の帳簿価額が株式会社の総資産額として法務省令で定める方法により算定される額の５分の１を超える場合は，当該事業の一部が重要でないときも，当該株式会社では当該事業の譲渡に係る契約を承認する株主総会の決議を要する。","a":false,"c":"467条1項2号。","e":"株式会社は，事業の重要な一部の譲渡をする場合には，当該譲渡の効力発生日の前日までに，株主総会の決議によって，当該行為に係る契約の承認を受けなければならない。重要な一部であるかは，譲渡対象となる事業の量的側面および質的側面から決定される。会社法は，譲渡する資産の帳簿価額が当該株式会社の総資産額の５分の１を超えないもの
