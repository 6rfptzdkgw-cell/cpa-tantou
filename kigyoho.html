無効にすることはできず，新株発行に関する決議無効確認の訴えは確認の利益を欠き提起することはできない。なお，決議取消しの訴えについても同様の判例がある（最判昭37年１月19日）。"},{"l":26,"m":"株主総会","sb":"株主総会の瑕疵","i":"A","r":"(平29II問題10ウ)","q":"株主総会決議の方法が法令または定款に違反する場合には，訴えをもって当該決議が無効であることの確認を請求することができる。","a":false,"c":"831条1項1号。","e":"株主総会の決議の方法が法令または定款に違反する場合は，決議取消事由に該当する。したがって，本肢は誤りである。"},{"l":27,"m":"株主総会","sb":"株主総会の瑕疵","i":"A","r":"(平30II問題11ウ)","q":"株主総会決議の内容が法令に違反する場合，当該株主総会決議には無効原因が認められる。","a":true,"c":"830条2項。","e":"なお，株主総会の決議の内容が定款に違反する場合は，決議取消事由に該当する（831条１項２号）。"},{"l":28,"m":"株主総会","sb":"株主総会の瑕疵","i":"B","r":"(平29II問題10イ)","q":"株主総会決議の無効確認の訴えは，確認の利益を有する限り，誰でも提起することができる。","a":true,"c":"830条2項。","e":"株主総会決議の無効確認の訴えは，確認の利益を有する限り，誰でも提起することができる。"},{"l":29,"m":"株主総会","sb":"株主総会の瑕疵","i":"B","r":"(平29II問題10ア)","q":"株主総会決議の無効確認の訴えについては，提訴期間は法定されていない。","a":true,"c":"830条2項。","e":"決議の内容が法令に違反するときは，瑕疵が重大であり，当該決議は当然に無効となる。そして，その無効は民法の一般原則により，いつでも，だれでも，どのような方法でも，主張することができるが，判決によって画一的に決議が無効であることを確認する必要があれば，決議無効確認の訴えを提起することができる。株主総会決議の無効確認の訴えは，瑕疵が重大であることから，提訴期間は法定されていない。"},{"l":30,"m":"株主総会","sb":"株主総会の瑕疵","i":"B","r":"","q":"株主総会の決議無効確認の訴えに係る請求を認容する確定判決は，当該訴えの当事者に対してのみその効力を有する。","a":false,"c":"834条16号,838条。","e":"株主総会の決議無効の主張方法には制限はない。したがって，訴えによらず訴訟外で決議の無効を主張することができる。ただし，当該判決に対世的効力を与えたい場合には，株主総会の決議無効確認の訴えによらなければならない。したがって，株主総会の決議無効確認の訴えに係る請求を認容する確定判決は，第三者に対してもその効力を有するため，本肢は誤りである。これは，株主総会の決議不存在確認の訴えについても同様である。"},{"l":31,"m":"株主総会","sb":"株主総会の瑕疵","i":"B","r":"(平30II問題11エ)","q":"株主総会決議が無効であることの確認の訴えにおいて，請求を認容する判決が確定したときは，当該株主総会決議は将来に向かってその効力を失う。","a":false,"c":"","e":"決議の内容が法令に違反する場合は瑕疵が重大であるため，そもそもはじめから当該決議は無効である。"},{"l":32,"m":"株主総会","sb":"株主総会の瑕疵","i":"B","r":"(平29II問題10エ)","q":"株主総会決議の無効確認の訴えの提起があった場合において，裁判所は，法令または定款に違反する事実が重大でなく，かつ，決議に影響を及ぼさないものであると認めるときは，当該無効確認の請求を棄却することができる。","a":false,"c":"","e":"決議の内容が法令に違反する場合は，瑕疵が重大であることから，株主総会の決議取消しの訴えの場合（831 条２項）と異なり，裁量棄却の規定は設けられていない。"},{"l":33,"m":"株主総会","sb":"株主総会の瑕疵","i":"B","r":"(令6I問題10ア)","q":"株主総会決議の不存在の確認の訴えは，確認の利益を有する限り，誰でも提起することができる。","a":true,"c":"830条1項。","e":"株主総会決議の不存在確認の訴えは，無効確認の訴えと同様に，確認の利益を有する限り，誰でも提起することができる。"},{"l":34,"m":"株主総会","sb":"株主総会の瑕疵","i":"B","r":"","q":"株主総会の決議不存在確認の訴えについては，提訴期間の制限はない。","a":true,"c":"","e":"株主総会の決議不存在確認の訴えについては，提訴権者，提訴期間に制限はない。"},{"l":35,"m":"株主総会","sb":"株主総会の瑕疵","i":"B","r":"(平28I問題8エ)","q":"招集手続の瑕疵が著しいために，株主の集まりを株主総会と評価することができない場合には，誰でも株主総会の決議が存在しないことを前提とした法律上の主張をすることができる。","a":true,"c":"830条1項。","e":"株主総会の決議の事実自体が存在しない場合，または決議らしき事実はあるが法的に決議として評価することができない場合は，決議不存在となる。決議不存在は，瑕疵が重大であるため，民法の一般原則により，いつでも，だれでも，どのような方法でも，主張することができるが，判決によって画一的に決議が不存在であることを確認する必要があれば，決議不存在確認の訴えを提起することができる。"},{"l":1,"m":"株主総会","sb":"種類株主総会","i":"C","r":"","q":"種類株主総会は，会社法に規定する事項および株式会社の組織，運営，管理その他株式会社に関する一切の事項について決議をすることができる。","a":false,"c":"321条。","e":"種類株主総会は，会社法に規定する事項および定款で定めた事項に限り，決議をすることができる。"},{"l":2,"m":"株主総会","sb":"種類株主総会","i":"B","r":"(平23II問題7イ)","q":"種類株式発行会社が株式の分割をする場合において，ある種類の株式の種類株主に損害を及ぼすおそれがあるときは，当該種類の種類株主を構成員とする種類株主総会において議決権を行使することができる種類株主が存しない場合を除き，当該種類株主総会の決議がなければ，当該株式の分割は効力を生じない。ただし，定款に別段の定めはないものとする。","a":true,"c":"322条1項柱書,2号。","e":"種類株式発行会社が株式の分割をする場合において，ある種類株主に損害を及ぼすおそれがあるときは，当該行為は，当該種類株主を構成員とする種類株主総会の決議がなければその効力を生じない。当該種類株主総会の決議は，特別決議である（324条２項４号）。"},{"l":3,"m":"株主総会","sb":"種類株主総会","i":"B","r":"(平30II問題10ウ)","q":"種類株式発行会社は，ある種類の株式の内容として，株式の分割が当該種類の株式の種類株主に損害を及ぼすおそれがあるときに，当該種類の株式の種類株主を構成員とする種類株主総会の決議を要しない旨を定款で定めることができる。","a":true,"c":"322条2項。","e":"株式の分割を円滑に行うことを可能とするために，定款による種類株主総会決議の排除が認められている。"},{"l":4,"m":"株主総会","sb":"種類株主総会","i":"C","r":"","q":"種類株式発行会社が単元株式数についての定款の変更をする場合は，ある種類株主に損害を及ぼすおそれがある場合に種類株主総会を要しない旨の定款の定めが設けられている場合であっても，当該種類株主を構成員とする種類株主総会の決議がなければ，当該定款の変更の効力は生じない。","a":false,"c":"322条3項ただし書かっこ書。","e":"322条１項１号に規定されている，（ⅰ） 株式の種類の追加，（ⅱ） 株式の内容の変更，（ⅲ） 発行可能株式総数または発行可能種類株式総数の増加に関する定款変更は，単元株式数に関する変更を除き，定款によっても種類株主総会の決議を排除することができない（322 条３項）。これらの定款変更は，種類株主の利益を損なうおそれが高いと考えられるためである。単元株式数の変更は，その実質が，株式の併合および株式の分割に等しい。そして，株式の併合または株式の分割は，定款によって種類株主総会の決議を排除することができるため（同条１項２号，２項，３項ただし書参照），それと実質を同じにする単元株式数の変更決議も同様に定款による決議の排除を認めているのである。"},{"l":5,"m":"株主総会","sb":"種類株主総会","i":"B","r":"","q":"種類株式発行会社が株式の種類の追加をする場合において，ある種類株主に損害を及ぼすおそれがあるときは，当該行為は，当該種類株主の全員の同意がなければ，その効力を生じない。","a":false,"c":"322条1項1号イ,324条2項4号。","e":"種類株式発行会社が株式の種類の追加をする場合において，ある種類株主に損害を及ぼすおそれがあるときは，当該行為は，当該種類株主を構成員とする種類株主総会の特別決議がなければその効力を生じない。"},{"l":6,"m":"株主総会","sb":"種類株主総会","i":"B","r":"","q":"種類株式発行会社が，ある種類株式の発行後に定款を変更して，当該種類株主に損害を及ぼすおそれがある場合の種類株主総会を要しない旨の定めを設けようとするときは，当該種類の種類株主全員の同意を得なければならない。","a":true,"c":"322条2項4項。","e":"定款による種類株主総会の排除の定めは，種類株主の利益に重大な影響を及ぼすものであるため，種類株主全員が当該定款の定めについて同意していることが求められるのである。"},{"l":7,"m":"株主総会","sb":"種類株主総会","i":"B","r":"","q":"種類株式発行会社において，株式の分割をすることによりある種類株主に損害を及ぼすおそれがあるときは，定款に別段の定めがなくとも，反対株主は，株式会社に対し，自己が有する当該種類株式を公正な価格で買取ることを請求することができる。","a":false,"c":"116条1項3号イ。","e":"株式会社が，① 株式の併合または株式の分割，② 株式無償割当て，③ 単元株式数についての定款の変更，④ 株主割当ての方法による募集株式の発行等，⑤ 株主割当ての方法による新株予約権の発行，⑥ 新株予約権無償割当てをする場合（要は322条１項２号～６号までの行為または単元株式数に関する定款の変更をする場合）において，ある種類株式（定款による種類株主総会の排除の定め（322 条２項）があるものに限る）を有する種類株主に損害を及ぼすおそれがある場合には，反対株主は，株式会社に対し，自己の有する当該種類株式を公正な価格で買い取ることを請求することができる。当該株式買取請求権は，定款により種類株主総会が排除されることへの代償として株主に付与されるものである。"},{"l":8,"m":"株主総会","sb":"種類株主総会","i":"B","r":"(平31II問題10エ)","q":"種類株式発行会社は，種類株主総会の決議要件を定款の定めにより加重することができる。","a":true,"c":"324条各項参照。","e":"種類株主総会の決議についても，通常の株主総会の決議と同様に，定款により会社法によって定められた要件を加重することが認められている。"},{"l":9,"m":"株主総会","sb":"種類株主総会","i":"C","r":"(平20問題9エ)","q":"種類株主総会の決議には，株主総会の決議とは異なり，決議の省略の制度は存在しない。","a":false,"c":"325条参照。","e":"種類株主総会においては，株主総会の権限，株主総会の招集および株主総会の決議に関する規定を除いて，株主総会に関する規定が準用されるため，決議の省略制度（書面決議）を採用することができる。"},{"l":1,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の資格","i":"A","r":"(平25I問題12エ類)","q":"公開会社では，取締役が株主でなければならない旨を定款で定めることができる。","a":false,"c":"331条2項。","e":"公開会社は，取締役が株主でなければならない旨を定款で定めることができない（331条２項本文）。公開会社は，株主が頻繁に変動することが想定されるため，株主以外の者からも広く有能な人材を取締役として選任できることが適切だからである。これに対して，非公開会社においては，取締役が株主でなければならない旨を定款で定めることも認められている（331条２項ただし書）。なお，監査役および執行役においても同様に，定款による資格制限の規定が設けられている（335条１項，402条５項）。"},{"l":2,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の資格","i":"A","r":"(令6II問題11ア・平29II問題8ア)","q":"公開会社でない株式会社は，取締役が株主でなければならない旨を定款で定めることができる。","a":true,"c":"331条2項ただし書。","e":"問題１の解説参照。"},{"l":3,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の資格","i":"B","r":"(平20問題11ア)","q":"自然人だけでなく，法人も取締役になることができる。","a":false,"c":"331条1項1号。","e":"法人は取締役の欠格事由に含まれているため，法人は取締役となることはできない。"},{"l":4,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の資格","i":"B","r":"(令2II問題10ア・平25I問題12イ)","q":"未成年者は取締役となることができない。","a":false,"c":"331条1項。","e":"取締役の欠格事由に未成年者は含まれていないため，未成年者は取締役となることができる。"},{"l":5,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の資格","i":"B","r":"(令6II問題11イ類)","q":"成年被後見人は，取締役になることができない。","a":false,"c":"331条の2第1項。","e":"成年被後見人が取締役に就任するには，その成年後見人が，成年被後見人の同意（後見監督人がある場合にあっては，成年被後見人および後見監督人の同意）を得たうえで，成年被後見人に代わって就任の承諾をしなければならない。すなわち，当該同意があれば，成年被後見人であっても取締役になることができる。なお，被保佐人が取締役に就任するには，その保佐人の同意を得なければならない（331条の２第２項）。"},{"l":6,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の資格","i":"B","r":"(令2II問題10イ)","q":"破産者であって復権を得ていない者も，取締役となることができる。","a":true,"c":"","e":"破産者であって復権を得ていない者は，331 条１項各号の欠格事由に定められていないので，取締役となることができる。"},{"l":7,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の資格","i":"B","r":"(平28II問題11ア)","q":"日本国内に住所を有しない外国人が株式会社の取締役となる場合，日本国内に住所を有する代理人を指定しなければならない。","a":false,"c":"","e":"このような規定は存在しない。"},{"l":8,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の資格","i":"A","r":"(平26II問題8ア類)","q":"株式会社の取締役であって，過去に当該株式会社またはその子会社の業務執行取締役となったことがあるものは，当該株式会社の社外取締役になることができない。","a":false,"c":"2条15号イ。","e":"過去に当該株式会社またはその子会社の業務執行取締役等（業務執行取締役もしくは執行役または支配人その他の使用人）となったことがあるものであっても，その後 10 年が経過している場合は，経営者との関係が希薄となるから社外取締役の要件を満たす。すなわち，株式会社の取締役であって，その就任の前 10 年間当該株式会社またはその子会社の業務執行取締役等であったことがないものは，当該株式会社の社外取締役となることができる場合があるのである。"},{"l":9,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の資格","i":"A","r":"(平30II問題13ア)","q":"株式会社の取締役であって，その就任の前 10 年間当該株式会社またはその子会社の業務執行取締役等であったことがある者は，当該株式会社の社外取締役となることができない。","a":true,"c":"2条15号イ。","e":""},{"l":10,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の資格","i":"A","r":"(平30II問題13エ・平28II問題11イ類)","q":"株式会社の取締役のうち，当該株式会社の親会社の取締役である者は，当該株式会社の社外取締役には該当しない。","a":true,"c":"2条15号ハ。","e":"当該株式会社の親会社等（自然人であるものに限る）または親会社等の取締役もしくは執行役もしくは支配人その他の使用人であるものは，社外取締役となることができない。これらのものは，子会社の株主総会決議における議決権行使を通じて当該子会社の経営者に対し影響を及ぼすことができる立場にあるため，子会社の経営者が子会社の利益を犠牲にして，親会社等の利益を図るおそれがある。したがって，親会社等とその関係者については，その子会社と利益相反の関係に立つことがあり，社外取締役に期待される監督機能を実効的に果たすことが期待できないことから，社外取締役の要件において除外されているのである。"},{"l":11,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の資格","i":"B","r":"","q":"株式会社の取締役であって，その就任の前 10 年内のいずれかの時において当該株式会社の親会社等の取締役であったことがあるものは，社外取締役となることができない。","a":false,"c":"2条15号ハ。","e":"社外取締役に就任する以前の期間において，親会社等とその関係者であったことがないことまでは要件とされておらず，あくまで就任時点において親会社等とその関係者でなければ足りる点に注意をしてほしい。"},{"l":12,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の資格","i":"B","r":"","q":"株式会社の取締役であって，当該株式会社の親会社等の子会社等（当該株式会社およびその子会社を除く）の業務執行取締役等であるものは，社外取締役になることができない。","a":true,"c":"2条15号ニ。","e":"当該株式会社の親会社等の子会社等（当該株式会社およびその子会社を除く）の業務執行取締役等であるものは，社外取締役となることができない。すなわち，兄弟会社の業務執行取締役等については，社外取締役の要件から除外しているのである。親会社等は，兄弟会社の業務執行取締役等に対しても影響を及ぼすことができる立場にある。そこで，株式会社とその親会社等との間で利益が相反する場合に，兄弟会社の業務執行取締役等に対しても社外取締役に期待される監督機能を実効的に果たすことが期待できないことから，社外取締役の要件において除外されているのである。"},{"l":13,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の資格","i":"B","r":"","q":"株式会社の取締役であって，当該株式会社の親会社等の子会社等（当該株式会社およびその子会社を除く）の業務執行取締役以外の取締役であるものは，社外取締役になることができない。","a":false,"c":"2条15号ニ。","e":"兄弟会社の場合は，その業務執行取締役等でないことが要件とされているため，業務執行取締役等でない取締役（例えば兄弟会社の社外取締役）は，株式会社の社外取締役の要件を満たす。また，あくまで就任時点において兄弟会社の業務執行取締役等でなければ足りる点に注意をしてほしい。"},{"l":14,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の資格","i":"A","r":"","q":"株式会社の取締役であって，当該株式会社の取締役の配偶者であるものは，社外取締役となることができる。","a":false,"c":"2条15号ホ。","e":"当該株式会社の取締役もしくは執行役もしくは支配人その他の重要な使用人または親会社等（自然人であるものに限る）の配偶者または２親等内の親族であるものは，社外取締役となることができない。すなわち，株式会社の関係者の近親者については，社外取締役の要件から除外しているのである。"},{"l":15,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の資格","i":"A","r":"(令5II問題11ウ類)","q":"監査役会設置会社（公開大会社であるものに限る）であって，金融商品取引法第 24 条１項の規定によりその発行する株式について有価証券報告書を内閣総理大臣に提出しなければならないものは，社外取締役を置かなければならない。","a":true,"c":"327条の2。","e":"公開会社の株主は，頻繁に変動することが想定されるため，株主による監督が期待できず，大会社においては，多数の株主や債権者等の利害関係者の存在が想定されるため，社会に与える影響が大きいと考えられる。また，発行する株式について有価証券報告書提出義務がある会社の株式は，流通性を有すると考えられることから，コーポレート・ガバナンスをより強化する必要がある。そのため，社外取締役の設置を義務付けることで，業務執行者に対する監督の実効性を確保しようとしているのである。なお，あくまで株式について有価証券報告書を提出している株式会社が対象であるので，発行する社債についてのみ有価証券報告書提出義務のある株式会社は，対象ではない。"},{"l":16,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の資格","i":"A","r":"(平29II問題8イ類・平22II問題8ア)","q":"大会社である取締役会設置会社においては，取締役は，３人以上で，そのうち１人以上は，社外取締役でなければならない。","a":false,"c":"331条5項。","e":"取締役会設置会社においては，取締役は３人以上でなければならないが，大会社だからといって，そのうち１人以上が社外取締役である必要はない。"},{"l":17,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の資格","i":"A","r":"","q":"株式会社（指名委員会等設置会社を除く）が社外取締役を置いている場合において，当該株式会社と取締役との利益が相反する状況にあるとき，その他取締役が当該株式会社の業務を執行することにより株主の利益を損なうおそれがあるときは，当該株式会社は，当該株式会社の業務を執行することを社外取締役に委託することができるが，この場合には，株主総会の決議による承認を受ける必要がある。","a":false,"c":"348条の2第1項。","e":"株式会社（指名委員会等設置会社を除く）が社外取締役を置いている場合において，当該株式会社と取締役との利益が相反する状況にあるとき，その他取締役が当該株式会社の業務を執行することにより株主の利益を損なうおそれがあるときは，当該株式会社は，その都度，取締役の決定（取締役会設置会社にあっては，取締役会の決議）によって，当該株式会社の業務を執行することを社外取締役に委託することができる。"},{"l":18,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の資格","i":"A","r":"(令5II問題11エ)","q":"指名委員会等設置会社において，執行役が当該指名委員会等設置会社の業務を執行することにより株主の利益を損なうおそれがあるときは，当該指名委員会等設置会社は，その都度，取締役会の決議によって，当該指名委員会等設置会社の業務を執行することを社外取締役に委託することができる。","a":true,"c":"348条の2第2項。","e":""},{"l":1,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の資格","i":"A","r":"(令6II問題13イ類・平31I問題11ア・平22II問題10ア)","q":"会計参与は，弁護士もしくは弁護士法人または公認会計士もしくは監査法人でなければならない。","a":false,"c":"333条1項。","e":"会計参与は，公認会計士もしくは監査法人または税理士もしくは税理士法人でなければならない。会計参与制度の趣旨は，会計に関する専門的知識を有する者が，取締役または執行役と共同して計算書類等を作成することにより計算書類等の適正性を確保することにあるため，会計参与となることができるのは，会計に関する専門資格を有する者に限定されている。"},{"l":2,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の資格","i":"A","r":"","q":"株式会社の取締役は，会計参与を兼ねることができない。","a":true,"c":"333条3項1号。","e":"株式会社またはその子会社の取締役，監査役，執行役または支配人その他の使用人は，会計参与となることができない（333条３項１号）。まず，株式会社またはその子会社の取締役，執行役または使用人との兼任が認められないのは，計算書類の適正性を担保するという機能を失わないようにするために，会計参与には，業務執行からの独立性が求められるからである。また，株式会社の監査役との兼任が認められないのは，自己監査となるため適当でなく，取締役または執行役と共同して計算書類を作成するという会計参与の職務からして当然である。なお，子会社の監査役が会計参与となることができないとされている趣旨は，必ずしも明らかではない。"},{"l":3,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の資格","i":"A","r":"(平22II問題10イ)","q":"株式会社の支配人は，当該会社の会計参与となることができない。","a":true,"c":"333条3項1号。","e":"問題２の解説参照。"},{"l":4,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の資格","i":"A","r":"(平27II問題9ア類・平24I問題11ア)","q":"株式会社の取締役は，その親会社の会計参与となることができる。","a":false,"c":"333条3項1号。","e":"株式会社の取締役は，その親会社の会計参与となることができない。計算書類の適正性を担保するという機能を失わないようにするために，会計参与には，業務執行からの独立性が求められるからである。"},{"l":5,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の資格","i":"A","r":"(平31I問題8イ)","q":"監査等委員である取締役は，監査等委員会設置会社の子会社の会計参与を兼ねることができない。","a":true,"c":"331条3項。","e":"監査等委員である取締役は，監査等委員会設置会社もしくはその子会社の業務執行取締役もしくは支配人その他の使用人または当該子会社の会計参与（会計参与が法人であるときは，その職務を行うべき社員）もしくは執行役を兼ねることができない。監査等委員である取締役の兼任禁止規定の趣旨は，自己監査の防止と独立性の確保である。監査する者と監査される者が同一の者であるという状況では監査の実が上がらないためである。"},{"l":6,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の資格","i":"A","r":"(平31I問題11イ)","q":"株式会社またはその子会社の監査役は，当該株式会社の会計参与となることができない。","a":true,"c":"333条3項1号。","e":"問題２の解説参照。なお，子会社の監査役が会計参与となることができないとされている趣旨は，必ずしも明らかではない。"},{"l":7,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の資格","i":"A","r":"(平25I問題12ウ)","q":"子会社の会計参与は，親会社の会計参与を兼任することができない。","a":false,"c":"333条3項1号。","e":"株式会社またはその子会社の取締役，監査役もしくは執行役または支配人その他の使用人は，会計参与となることができない。しかし，子会社の会計参与との兼任は禁止されていない。"},{"l":8,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の資格","i":"C","r":"","q":"会計参与は，その職務を行うに当たっては，公認会計士法の規定により業務の停止の処分を受け，その停止の期間を経過しない者を使用してはならない。","a":true,"c":"374条5項。","e":"この他，税理士法の規定により業務の停止の処分を受け，その停止の期間を経過しない者や，税理士が，弁護士，司法書士など，他の一定の専門資格を有している場合に，他の専門業務について業務停止処分を受けていることにより税理士業務を行うことができない者も同様である。"},{"l":1,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の資格","i":"A","r":"(平27I問題10ア類)","q":"公開会社でない株式会社において，監査役の資格を株主に限定する旨の定款の定めは，無効である。","a":false,"c":"335条1項,331条2項ただし書。","e":"非公開会社は，監査役が株主でなければならない旨を定款で定めることができる。一方，公開会社は，監査役が株主でなければならない旨を定款で定めることができない（335条１項，331条２項本文）。"},{"l":2,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の資格","i":"B","r":"(平22II問題11ア類)","q":"監査法人は監査役となることができない。","a":true,"c":"335条1項,331条1項1号。","e":"法人は監査役となることができない。これは，取締役も同様である。"},{"l":3,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の資格","i":"A","r":"(平28I問題10イ類・平24II問題11イ・平21問題11イ類)","q":"株式会社の監査役は，当該株式会社の親会社の取締役を兼任することができる。","a":true,"c":"335条2項参照。","e":"監査役の独立性が損なわれることはないため，株式会社の監査役は，当該株式会社の親会社の取締役を兼任することができる。"},{"l":4,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の資格","i":"A","r":"(平30I問題12エ類・平21問題11ア)","q":"株式会社の監査役は，当該株式会社の子会社の監査役を兼ねることができない。","a":false,"c":"335条2項参照。","e":"監査役の独立性が損なわれることはないため，株式会社の監査役は，当該株式会社の子会社の監査役を兼ねることができる。"},{"l":5,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の資格","i":"A","r":"(平28I問題10ア・平21問題11エ類)","q":"株式会社の監査役は，当該株式会社の子会社の支配人を兼ねることができない。","a":true,"c":"335条2項。","e":"監査役は，株式会社またはその子会社の取締役，支配人その他の使用人を兼ねることができない。また，株式会社の子会社の会計参与（会計参与が法人であるときは，その職務を行うべき社員）または執行役も兼ねることができない（335 条２項）。監査役の兼任禁止規定の趣旨は，自己監査の防止と独立性の確保である。監査する者と監査される者が同一の者である，または，監査する者が監査される者に従属しているという状況では監査の実が上がらないためである。"},{"l":6,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の資格","i":"A","r":"(令6II問題11ウ・平25II問題9イ類・平21問題11ウ)","q":"株式会社の監査役は，当該株式会社の子会社の取締役を兼ねることができない。","a":true,"c":"335条2項。","e":"問題５の解説参照。"},{"l":7,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の資格","i":"A","r":"(平27II問題10ア類・平24II問題11ア)","q":"株式会社の監査役は，当該株式会社の子会社の会計参与を兼任することができない。","a":true,"c":"335条2項。","e":"問題５の解説参照。"},{"l":8,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の資格","i":"C","r":"(平22II問題11イ)","q":"任期満了により会社の取締役を退任した者が，その後当該会社の監査役となることはできるが，任期満了により会社の監査役を退任した者が，その後当該会社の取締役となることはできない。","a":false,"c":"","e":"任期満了により会社の取締役を退任した者は，その後当該会社の監査役となることができる。同様に，任期満了により会社の監査役を退任した者は，その後当該会社の取締役となることができる。"},{"l":9,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の資格","i":"B","r":"","q":"最高裁判所の判例によれば，取締役の地位にある者を監査役に選任した株主総会の決議は，無効である。","a":false,"c":"最判平元年9月19日。","e":"最高裁判所の判例によれば，取締役の地位にある者等，兼任が禁止されている者が監査役に選任された株主総会決議の効力は有効である。監査役への就任は，株主総会の選任決議のみでは生じず，被選任者の就任承諾があって生じるところ，監査役への就任前に被選任者が前職の取締役等を辞任していれば，兼任禁止には抵触しない。そして，被選任者が就任を承諾したときは，前職の辞任をしたものと解すべきであり，たとえこの者が事実上前職を継続していたとしても，そのことは監査役としての任務懈怠責任の原因となり得るが，選任決議の効力に影響を及ぼすものではないとしている。"},{"l":10,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の資格","i":"B","r":"","q":"最高裁判所の判例によれば，弁護士の資格を有する株式会社の監査役が，特定の訴訟事件につき会社から委任を受けてその訴訟代理人となることは禁止される。","a":false,"c":"最判昭61年2月18日。","e":"最高裁判所の判例によれば，株式会社の監査役である弁護士が，訴訟事件において会社の代理人となることを禁止していない。"},{"l":11,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の資格","i":"A","r":"(平25II問題9ウ類)","q":"株式会社の監査役であって，過去に当該株式会社またはその子会社の取締役となったことがあるものは，当該株式会社の社外監査役になることができない。","a":false,"c":"2条16号イ。","e":"過去に当該株式会社またはその子会社の取締役となったことがあるものであっても，その後 10 年が経過している場合は，経営者との関係が希薄となるから社外監査役の要件を満たす。すなわち，株式会社の監査役であって，その就任の前 10 年間当該株式会社またはその子会社の取締役，会計参与（会計参与が法人であるときは，その職務を行うべき社員）もしくは執行役または支配人その他の使用人であったことがないものは，当該株式会社の社外監査役となることができる場合があるのである。"},{"l":12,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の資格","i":"A","r":"(平28I問題10エ)","q":"株式会社の監査役は，当該株式会社の子会社の社外監査役となることができる。","a":false,"c":"2条16号ハ。","e":"株式会社の親会社等（自然人であるものに限る）または親会社等の取締役，監査役もしくは執行役もしくは支配人その他の使用人であるものは，当該株式会社の社外監査役となることができない。"},{"l":13,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の資格","i":"A","r":"(平28I問題10ウ)","q":"株式会社の取締役の二親等内の親族は，当該株式会社の社外監査役となることができない。","a":true,"c":"2条16号ホ。","e":"株式会社の取締役もしくは支配人その他の重要な使用人または親会社等（自然人であるものに限る）の配偶者または二親等内の親族であるものは，当該株式会社の社外監査役となることができない。"},{"l":14,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の資格","i":"C","r":"","q":"株式会社の監査役であって，当該株式会社の重要な取引先の関係者であるものは，社外監査役となることができない。","a":false,"c":"","e":"社外取締役および社外監査役の要件として，重要な取引先の関係者でないことを追加すべきか否かが議論されたが，重要な取引先は株式会社に重大な利害関係を有しており，むしろ注意深い監督等を期待することができるという指摘や，重要な取引先に関する客観的な形式的基準を会社法上設置することは困難であることから，当該要件を追加することは見送られた。"},{"l":1,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の資格","i":"B","r":"","q":"会計監査人は，公認会計士または監査法人でなければならない。","a":true,"c":"337条1項。","e":"会計監査人は，専門家として計算書類等の監査を行う者であるため，会計監査人となるためには，その専門資格が要求される。"},{"l":2,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の資格","i":"C","r":"","q":"株式会社の取締役は，当該株式会社の会計監査人となることができる。","a":false,"c":"337条3項1号,公認会計士法24条1項1号。","e":"公認会計士法 24 条１項１号によれば，公認会計士が役員，これに準ずるものである会社の財務書類を監査することができないとされているため，公認会計士である者が役員，これに準ずるもの（取締役，会計参与，監査役または執行役）に選任されている場合には，その者は当該株式会社の会計監査人となることができない。また，公認会計士法の規定により株式会社の計算書類について監査をすることができない者は，会計監査人となることができないとされている（337条３項１号）。"},{"l":3,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の資格","i":"B","r":"","q":"株式会社の子会社もしくはその取締役，会計参与，監査役もしくは執行役から公認会計士もしくは監査法人の業務以外の業務により継続的な報酬を受けている者またはその配偶者は，会計監査人となることができない。","a":true,"c":"337条3項2号。","e":""},{"l":4,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の資格","i":"B","r":"(平25I問題12ア)","q":"監査法人の社員の半数以上が，株式会社の子会社から当該監査法人の業務以外の業務により継続的な報酬を受けている者であるときは，当該監査法人は，当該株式会社の会計監査人となることができない。","a":true,"c":"337条3項2号3号。","e":""},{"l":5,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の資格","i":"C","r":"","q":"会計監査人は，その職務を行うに当たっては，会計監査人設置会社の子会社から公認会計士の業務以外の業務により継続的な報酬を受けている者を使用してはならない。","a":true,"c":"396条5項3号。","e":"会計監査人は，その職務を行うに当たっては，① 公認会計士法の規定により会社の計算書類について監査することができない者，② 子会社もしくはその取締役，会計参与，監査役もしくは執行役から公認会計士もしくは監査法人の業務以外の業務により継続的な報酬を受けている者またはその配偶者，③ 会計監査人設置会社またはその子会社の取締役，会計参与，監査役もしくは執行役または支配人その他の使用人である者，④ 会計監査人設置会社またはその子会社から公認会計士または監査法人の業務以外の業務により継続的な報酬を受けている者を使用してはならない。"},{"l":6,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の資格","i":"C","r":"(平25I問題10エ)","q":"株式会社の会計監査人は，その職務を行うに当たって，当該株式会社の子会社の使用人を使用することができる。","a":false,"c":"396条5項2号。","e":"補助者として不適任な者が会計監査に関わることを排除し，監査の公正を確保するために，株式会社の会計監査人は，その職務を行うに当たっては，会計監査人設置会社の子会社の使用人を使用することができない。"},{"l":1,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の員数","i":"A","r":"","q":"取締役会設置会社においては，取締役は３人以上でなければならない。","a":true,"c":"331条5項。","e":""},{"l":2,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の員数","i":"A","r":"(令2II問題8ア)","q":"監査役会設置会社の取締役は，３人以上でなければならない。","a":true,"c":"327条1項2号,331条5項。","e":"監査役会設置会社は，取締役会を置かなければならない。業務執行について取締役会を置かないという簡易な機関設計を採用したにも関わらず，監査について監査役会という複雑な仕組みを置く需要は想定しにくいため，これを認める必要はないからである。そして，取締役会設置会社では，取締役は３人以上でなければならないことから，本肢は正しい。"},{"l":3,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の員数","i":"A","r":"(平22I問題8ウ)","q":"監査役会設置会社においては，監査役は，３人以上で，そのうち半数以上は社外監査役でなければならない。","a":true,"c":"335条3項。","e":"監査役会設置会社では，監査役は３人以上で，そのうち半数以上は社外監査役でなければならない。過半数ではなく半数以上であることに注意する必要がある。"},{"l":1,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の選任","i":"A","r":"","q":"監査役を選任する株主総会の決議は，定款の定めをもってしても，定足数について議決権を行使することができる株主の議決権の３分の１未満と定めることはできない。","a":true,"c":"329条1項,341条。","e":"役員（取締役，会計参与および監査役）は，株主総会の普通決議によって選任する（329 条１項）。ただし，役員の選任決議は，定款の定めをもってしても，定足数について議決権を行使することができる株主の議決権の３分の１未満に引き下げることはできない。これは，株式会社の機関としての役員の地位の重要性から，できるだけ多くの株主の意思を反映させるために，その特則を定めたものである。"},{"l":2,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の選任","i":"B","r":"(平28II問題11ウ)","q":"株式会社の株主総会において取締役の選任決議を行う場合，当該株式会社は，あらかじめ取締役就任につき候補者の承諾を得ておかなければならない。","a":false,"c":"","e":"取締役の選任決議を行う場合，当該株式会社は，あらかじめ取締役就任につき候補者の承諾を得ておく必要はない。"},{"l":3,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の選任","i":"A","r":"(平31I問題8ウ類)","q":"監査等委員会設置会社においては，取締役の選任は，株主総会において監査等委員である取締役とそれ以外の取締役とを区別してしなければならない。","a":true,"c":"329条2項。","e":"監査等委員の独立性を確保するためである。このように，監査等委員は，株主総会の決議により取締役の地位と一体となって選任されるのである。この点，指名委員会等設置会社の監査委員が取締役会で選任されることと異なるため（400条２項），監査等委員会設置会社における監査等委員の身分は，監査役に近いものと考えられる。"},{"l":4,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の選任","i":"A","r":"(平29II問題8ウ)","q":"指名委員会等設置会社においては，取締役の選任は，各委員会の委員である取締役とそれ以外の取締役とを区別してしなければならない。","a":false,"c":"400条2項。","e":"各委員会の委員は，取締役の中から，取締役会の決議によって選定する。これに対して，監査等委員会設置会社においては，取締役の選任は，監査等委員である取締役とそれ以外の取締役とを区別してしなければならない（329 条２項）。"},{"l":5,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の選任","i":"B","r":"(平22II問題11ウ類)","q":"株主総会において会計参与の選任の決議をする場合には，会計参与が欠けた場合に備えて補欠の会計参与を選任しなければならない。","a":false,"c":"329条3項。","e":"役員の選任決議をする場合には，役員が欠けた場合または会社法もしくは定款で定めた役員の員数を欠くこととなるときに備えて補欠の役員を選任することができる。なお，役員等ではなく役員であるため会計監査人は含まれないことに留意してほしい。"},{"l":6,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の選任","i":"B","r":"(平22I問題9ウ)","q":"累積投票による取締役の選任の決議については，株主はその有する1株につき，当該株主総会において選任する取締役の数と同数の議決権を有する。","a":true,"c":"342条3項。","e":"累積投票による取締役選任の請求があった場合には，取締役の選任の決議については，株主は，その有する株式１株（単元株式数を定款で定めている場合にあっては，１単元の株式）につき，当該株主総会において選任する取締役の数と同数の議決権を有する。この場合においては，株主は，１人のみに投票し，または２人以上に投票して，その議決権を行使することができる。"},{"l":7,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の選任","i":"B","r":"","q":"株主総会の目的である事項が２人以上の監査役の選任である場合には，株主は，株式会社に対し，累積投票制度により監査役を選任すべきことを請求することができる。","a":false,"c":"342条。","e":"累積投票制度は，株主総会の目的である事項が２人以上の取締役（監査等委員会設置会社にあっては，監査等委員である取締役またはそれ以外の取締役）の選任である場合に限って認められており，累積投票による監査役の選任の制度は設けられていない。"},{"l":8,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の選任","i":"C","r":"","q":"累積投票による取締役の選任の請求は，株主総会の当日にすることで足りる。","a":false,"c":"342条2項。","e":"累積投票による取締役の選任の請求は，当該株主総会の日の５日前までにしなければならない。"},{"l":9,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の選任","i":"B","r":"","q":"株式会社は，定款の定めをもって，累積投票制度を全面的に排除することができる。","a":true,"c":"342条1項。","e":"累積投票制度は，取締役会内部に利害の対立を持ち込み，迅速かつ効率的な会社運営を阻害する危険が大きいため，定款の定めをもって累積投票制度を全面的に排除することができる。"},{"l":10,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の選任","i":"A","r":"(平27I問題11ア類・平25II問題9エ類)","q":"会計監査人の選任は，株主総会の普通決議によって行うが，定足数の定めを完全に排除することは認められない。","a":false,"c":"329条,309条1項。","e":"株主総会の普通決議の特則（341 条）が設けられているのは，役員の選任および解任についてであるため，役員に該当しない会計監査人の選任および解任には当該特則が適用されない。したがって，会計監査人の選任および解任については，定足数の定めを完全に排除することが認められる。"},{"l":11,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の選任","i":"A","r":"","q":"会計監査人の選任決議をする場合には，会計監査人が欠けた場合または定款で定めた会計監査人の員数を欠くこととなるときに備えて補欠の会計監査人を選任することができる。","a":false,"c":"329条3項。","e":"補欠の選任が認められているのは役員のみであり，補欠会計監査人の選任は認められていない。"},{"l":1,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の任期","i":"A","r":"","q":"監査等委員会設置会社または指名委員会等設置会社以外の株式会社において，取締役の任期は，選任後２年以内に終了する事業年度のうち最終のものに関する定時株主総会の終結の時までとされるが，定款または株主総会の決議によって，その任期を短縮することができる。","a":true,"c":"332条1項。","e":""},{"l":2,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の任期","i":"A","r":"(平24I問題9ア)","q":"公開会社でなく，監査等委員会設置会社または指名委員会等設置会社でもない株式会社の取締役の任期は，定款によって，選任後１年以内に終了する事業年度のうち最終のものに関する定時株主総会の終結の時までとすることができる。","a":true,"c":"332条2項。","e":"非公開会社では，株主の変動が頻繁には生じることはなく，株主間の関係が緊密であるため，頻繁に株主総会において取締役の適否につき株主の信任を問う必要がない。したがって，取締役の任期を，定款の定めによって，選任後10年以内に終了する事業年度のうち最終のものに関する定時株主総会の終結の時までとすることができるが，本問のように任期を短縮することも認められる。"},{"l":3,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の任期","i":"A","r":"(令5I問題11ア類)","q":"監査等委員会設置会社において，監査等委員である取締役以外の取締役の任期は，選任後１年以内に終了する事業年度のうち最終のものに関する定時株主総会の終結の時までとし，定款または株主総会の決議によって短縮することができる。","a":true,"c":"332条1項本文,3項。","e":"監査等委員会設置会社では，剰余金の配当を取締役会が決定する旨を定款に定めることができるので（459 条１項４号），毎年の定時株主総会において取締役の適否につき株主の信任を問う必要があるためである。"},{"l":4,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の任期","i":"A","r":"(令7I問題11ア類)","q":"監査等委員である取締役の任期は，選任後１年以内に終了する事業年度のうち最終のものに関する定時株主総会の終結の時までとする。","a":false,"c":"332条1項本文。","e":"監査等委員会設置会社における監査等委員である取締役の任期は，選任後２年以内に終了する事業年度のうち最終のものに関する定時株主総会の終結の時までとする。任期を監査等委員以外の取締役よりも長くしているのは，監査等委員である取締役の地位を強化し，独立性を確保するためである。"},{"l":5,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の任期","i":"A","r":"(平28II問題13イ)","q":"監査等委員である取締役の任期は，定款の定めにより法定の任期よりも短縮することができる。","a":false,"c":"332条4項。","e":"監査等委員会設置会社における監査等委員である取締役の任期は，選任後２年以内に終了する事業年度のうち最終のものに関する定時株主総会の終結の時までとする（332 条１項本文）。監査等委員である取締役の任期は，監査等委員以外の取締役の任期の規定と異なり，定款または株主総会の決議によって，その任期を短縮することができない。任期を監査等委員以外の取締役よりも長くし，また，短縮することができないとしている理由は，監査等委員である取締役の地位を強化し，独立性を確保するためである。"},{"l":6,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の任期","i":"A","r":"(令7I問題11エ)","q":"任期の満了前に退任した監査等委員である取締役の補欠として選任された監査等委員である取締役の任期は，定款の定めによって，退任した監査等委員である取締役の任期の満了する時までとすることができる。","a":true,"c":"332条5項。","e":"監査等委員である取締役の改選の時期を揃えるためには，補欠として選任された監査等委員である取締役の任期の満了する日を他の監査等委員と合わせることが必要となる。しかし，監査等委員である取締役の任期の短縮は認められていないため（332 条４項），補欠として選任された監査等委員である取締役の任期の例外が規定されているのである。"},{"l":7,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の任期","i":"A","r":"(平24I問題9イ)","q":"指名委員会等設置会社の取締役の任期は，選任後２年以内に終了する事業年度のうち最終のものに関する定時株主総会の終結の時までである。","a":false,"c":"332条1項6項。","e":"指名委員会等設置会社では，剰余金の配当の決定を，定款の定めによって株主総会ではなく取締役会の決議事項とすることができるため（459 条１項４号），毎年の定時株主総会において取締役の適否につき株主の信任を問う必要がある。したがって，指名委員会等設置会社における取締役の任期は，選任後１年以内に終了する事業年度のうち最終のものに関する定時株主総会の終結の時までとされる。また，この場合であっても，定款または株主総会の決議によって，当該任期を短縮することができる（332条１項ただし書，６項）。"},{"l":8,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の任期","i":"A","r":"(平27I問題8ア)","q":"指名委員会等設置会社でない株式会社が指名委員会等を置く旨の定款の変更を行った場合には，当該株式会社の取締役の任期は，当該定款の変更を行った事業年度の終結の時に満了する。","a":false,"c":"332条7項1号。","e":"株式会社が指名委員会等を置く旨の定款の変更をした場合には，取締役の任期は，当該定款の変更の効力が生じた時に満了する。指名委員会等設置会社と指名委員会等設置会社以外の会社では，取締役の権限や役割が大きく異なるためである。"},{"l":9,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の任期","i":"A","r":"(令7I問題11イ)","q":"株式会社において，監査等委員会を置く旨の定款の定めを廃止する定款の変更をした場合には，当該株式会社の取締役の任期は，当該定款の変更を行った事業年度の終了の時に満了する。","a":false,"c":"332条7項2号。","e":"監査等委員会または指名委員会等を置く旨の定款の定めを廃止する定款の変更をした場合には，取締役の任期は，当該定款変更の効力が生じた時に満了する。"},{"l":10,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の任期","i":"A","r":"(令7I問題11ウ類・平27I問題8イ)","q":"指名委員会等設置会社において，その発行する株式の全部の内容として，譲渡による当該株式の取得について当該指名委員会等設置会社の承認を要する旨の定款の定めを廃止する定款の変更を行った場合には，当該指名委員会等設置会社の取締役の任期は当該定款の変更が効力を生じた時に満了する。","a":false,"c":"332条7項3号。","e":"監査等委員会設置会社または指名委員会等設置会社以外の株式会社において，その発行する株式の全部の内容として譲渡による当該株式の取得について会社の承認を要する旨の定款の定めを廃止する定款の変更をした場合，取締役の任期は，当該定款の変更の効力が生じた時に満了する。これは，取締役の任期を伸長している非公開会社が，公開会社となる場合にその伸長された任期が維持されるのでは，公開会社の取締役の任期を原則として２年とした趣旨が没却されてしまうためである。しかし，監査等委員会設置会社および指名委員会等設置会社においては，公開会社か否かを問わず，取締役の任期を伸長することができないため，非公開会社が公開会社となる場合であっても，定款の変更により取締役の任期を満了させる必要はない。"},{"l":11,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の任期","i":"B","r":"(平31I問題11ウ類)","q":"監査役設置会社における会計参与の法定の任期は，選任後４年以内に終了する事業年度のうち最終のものに関する定時株主総会の終結の時までである。","a":false,"c":"334条1項,332条1項本文。","e":"会計参与の任期は，原則として，選任後２年以内に終了する事業年度のうち最終のものに関する定時株主総会の終結の時までとする。会計参与の任期については，取締役の任期の規定が準用される。"},{"l":12,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の任期","i":"A","r":"","q":"監査役（任期の満了前に退任した監査役の補欠として選任された監査役を除く）の任期は，選任後４年以内に終了する事業年度のうち最終のものに関する定時株主総会の終結の時までとするが，定款によって，任期を短縮することが認められている。","a":false,"c":"336条1項。","e":"監査役の任期は，選任後４年以内に終了する事業年度のうち最終のものに関する定時株主総会の終結の時までとする。取締役のように，定款または株主総会の決議によって，その任期を短縮することは認められない。このように任期を取締役と比して長くし，短縮することができないとしている理由は，監査役の地位を強化し，独立性を確保するためである。なお，定款によって，任期の満了前に辞任した監査役の補欠として選任された監査役の任期を，退任した監査役の任期が満了する時までとすることが認められる（336条３項）。"},{"l":13,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の任期","i":"A","r":"","q":"公開会社でない株式会社では，監査役の任期を，定款によって，選任後 10 年以内に終了する事業年度のうち最終のものに関する定時株主総会の終結の時まで伸長することができる。","a":true,"c":"336条2項。","e":"非公開会社に限って任期の伸長が認められるのは，非公開会社では株主が頻繁に変動することは想定しにくく，株主間の関係が緊密であると考えられることから，頻繁に株主総会において監査役の適否につき株主の信任を問う必要がないためである。"},{"l":14,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の任期","i":"A","r":"(令5I問題11ウ類・平27I問題8ウ・平24I問題9ウ類)","q":"任期の満了前に退任した監査役の補欠として選任された監査役の任期は，定款により，退任した監査役の任期の満了する時までとすることができる。","a":true,"c":"336条3項。","e":"監査役が複数いる場合において，監査役の改選の時期を揃えるためには，補欠として選任された監査役の任期の満了する日を他の監査役と合わせることが必要となる。しかし，監査役の任期の短縮は認められていないため（336 条１項参照），補欠として選任された監査役の任期の例外が規定されているのである。"},{"l":15,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の任期","i":"A","r":"(平29I問題13ア)","q":"監査役の監査の範囲を会計に関するものに限定する旨を定款で定めている株式会社において，監査役の監査の範囲を会計に関するものに限定する旨の定款の定めを廃止する定款の変更をした場合には，監査役の任期は当該定款の変更の効力が生じた時に満了する。","a":true,"c":"336条4項3号。","e":"監査役の監査の範囲を会計に関するものに限定する旨の定款の定めを廃止する定款の変更をする場合は，監査役の監査の範囲が拡大するため，監査役を改めて選任する必要があるからである。"},{"l":16,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の任期","i":"A","r":"","q":"監査役設置会社において，その発行する株式の全部の内容として，譲渡による当該株式の取得について当該監査役設置会社の承認を要する旨の定款の定めを廃止する定款の変更を行った場合には，当該監査役設置会社の監査役の任期は当該定款の変更が効力を生じた時に満了する。","a":true,"c":"336条4項4号。","e":"監査役設置会社において，その発行する株式の全部の内容として譲渡による当該株式の取得について会社の承認を要する旨の定款の定めを廃止する定款の変更をした場合，監査役の任期は，当該定款の変更の効力が生じた時に満了する。これは，監査役の任期を伸長している非公開会社が，公開会社となる場合にその伸長された任期が維持されるのでは，公開会社の監査役の任期を原則として４年とした趣旨が没却されてしまうためである。"},{"l":17,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の任期","i":"A","r":"(平24I問題9エ類)","q":"会計監査人の任期は，選任後２年以内に終了する事業年度のうち最終のものに関する定時株主総会の終結の時までとする。","a":false,"c":"338条1項。","e":"会計監査人の任期は，選任後１年以内に終了する事業年度のうち最終のものに関する定時株主総会の終結の時までとする。会計監査人の職務は会計監査であって，対象となる株式会社の事業年度は１年であるのが通常であることから，会計監査人の任期についても１年程度が適当であると考えられたことによる。"},{"l":18,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の任期","i":"A","r":"(平29II問題12ア・平24II問題11エ)","q":"監査役設置会社では，監査役の全員の同意により，会計監査人の法定の任期を伸長することができる。","a":false,"c":"338条1項。","e":"会計監査人の任期は，選任後１年以内に終了する事業年度のうち最終のものに関する定時株主総会の終結の時までとする（338 条１項）。会計監査人の任期は伸長することも短縮することもできない。会計監査人の職務は会計監査であって，対象となる株式会社の事業年度は１年であるのが通常であることから，会計監査人の任期についても１年程度が適当であると考えられたことによる。"},{"l":19,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の任期","i":"A","r":"(令5I問題11エ類・平27I問題8エ)","q":"会計監査人は，会計監査人を選任する定時株主総会において別段の決議がなされなかったときは，当該定時株主総会において再任されたものとみなす。","a":true,"c":"338条2項。","e":"会計監査人の選任決議を定時株主総会で毎年行うこととすると，会計監査人が地位の継続を考えるあまり公正な監査を行うことができなくなる可能性が生じる。そこで，独立性を確保するために，再任の擬制がなされているのである。"},{"l":20,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の任期","i":"B","r":"","q":"会計監査人設置会社において，その発行する株式の全部の内容として，譲渡による当該株式の取得について当該会計監査人設置会社の承認を要する旨の定款の定めを廃止する定款の変更を行った場合には，当該会計監査人設置会社の会計監査人の任期は当該定款の変更が効力を生じた時に満了する。","a":false,"c":"338条3項。","e":"会計監査人設置会社において，定款の変更による任期の満了は，会計監査人を置く旨の定款の定めを廃止する定款の変更をした場合のみである。"},{"l":1,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の解任","i":"A","r":"(令2I問題8ウ類・平24II問題9イ類・平22II問題11エ類・平20問題11ウ類)","q":"役員および会計監査人は，正当な理由がある場合に限って，株主総会の決議によって解任することができる。","a":false,"c":"339条1項。","e":"役員および会計監査人は，いつでも，株主総会の決議によって解任することができる。したがって，解任するために正当な理由は不要である。"},{"l":2,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の解任","i":"A","r":"(平27II問題8ア・平20問題13ウ)","q":"役員または会計監査人が正当な理由なくして解任された場合には，当該役員または会計監査人は当該解任によって生じた損害の賠償を株式会社に請求することができる。","a":true,"c":"339条2項。","e":"役員および会計監査人は，いつでも，株主総会の決議によって解任することができるが（339 条１項），役員および会計監査人が株式会社に対して損害賠償を請求することができるのは，正当な理由がない場合に限られる。"},{"l":3,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の解任","i":"A","r":"(令2II問題9エ類・平23II問題12ウ類)","q":"会計参与を解任する株主総会の決議について，定足数の定めを完全に排除することは認められない。","a":true,"c":"341条,344条の2第3項,309条2項7号。","e":"取締役（監査等委員である取締役を除く）または会計参与の解任については，定款の定めをもってしても，定足数について議決権を行使することができる株主の議決権の３分の１未満に引き下げることはできない（普通決議の特則）。株式会社の機関としての役員の地位の重要性から，できるだけ多くの株主の意思を反映させるためである。"},{"l":4,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の解任","i":"A","r":"(令5II問題11ア類・平30II問題13ウ)","q":"監査役設置会社の社外取締役の解任は，株主総会の特殊決議によらなければならない。","a":false,"c":"","e":"社外取締役の解任については，特別な規定が設けられているわけではないことから，その解任は，普通決議の特則による（341条）。したがって，本肢は誤りである。"},{"l":5,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の解任","i":"A","r":"(令6II問題10ウ類・平29II問題11エ)","q":"監査等委員会設置会社の監査等委員である取締役の解任は，株主総会の普通決議によって行う。","a":false,"c":"344条の2第3項,309条2項7号。","e":"監査等委員である取締役を解任する株主総会の決議は，特別決議を要する。監査等委員である取締役または監査役の解任に特別決議を要求した趣旨は，決議要件を加重することによって，監査等委員である取締役または監査役の地位の強化を図ることにある。"},{"l":6,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の解任","i":"A","r":"(令4I問題13ア類・平24II問題9エ・平20問題11イ類)","q":"株式会社が，株主総会の決議により監査役を解任するには，特別決議によらなければならない。","a":true,"c":"343条4項,309条2項7号。","e":"監査役の解任に特別決議を要求した趣旨は，決議要件を加重することによって，監査役の地位の強化を図ることにある。"},{"l":7,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の解任","i":"B","r":"(平25II問題9ア・平23II問題12イ)","q":"累積投票によって選任された取締役を株主総会の決議により解任するには，株主総会の特別決議によらなければならない。","a":true,"c":"309条2項7号。","e":"累積投票で選ばれた取締役の解任は，特別決議によらなければならない。特別決議が要求された理由は，普通決議による解任を認めてしまうと，少数派株主により選任された取締役が多数派株主により容易に解任されてしまうためである。"},{"l":8,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の解任","i":"B","r":"(平20問題11エ)","q":"取締役は，株主総会の決議によらなければ解任されることはない。","a":false,"c":"854条。","e":"役員（会計監査人は含まれない）については，株主総会の決議のほか，一定の場合には役員解任の訴え（854 条）によっても解任される。"},{"l":9,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の解任","i":"B","r":"(令4I問題13イ類・平23II問題12ア)","q":"公開会社において，総株主の議決権の100分の３以上の議決権を有する公開会社の株主は，その株式の保有期間にかかわらず，取締役を解任する旨の議案が株主総会において否決された日から 30 日以内に，訴えをもって当該取締役の解任を請求することができる。","a":false,"c":"854条1項1号2号。","e":"公開会社にあっては，役員解任の訴えを提訴する株主には，６か月の継続保有要件がある。なお，役員解任の訴えは，役員の職務の執行に関し不正の行為または法令もしくは定款に違反する重大な事実があったにもかかわらず，①当該役員を解任する旨の議案が株主総会において否決されたとき，または，②当該役員を解任する旨の株主総会の決議が，323 条の規定によりその効力を生じないとき（拒否権付種類株式を有する種類株主を構成員とする種類株主総会での承認が得られないとき）に，一定の株主が，当該株主総会の日から30日以内に，訴えをもって当該役員の解任を請求することができる制度である。ここで，一定の株主とは，総株主の議決権の100分の３（定款で緩和可）以上の議決権，または，発行済株式の100分の３（定款で緩和可）以上の数の株式を保有する株主である（少数株主権）。"},{"l":10,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の解任","i":"A","r":"(令7I問題10ウ類・平27I問題11イ)","q":"株主総会の決議により会計監査人を解任するには，特別決議によらなければならない。","a":false,"c":"339条1項,309条1項。","e":"会計監査人は，いつでも，株主総会の普通決議によって解任することができる。なお，会計監査人は役員でないため，解任決議について341条の適用はない。したがって，会計監査人の解任決議については，定款によって定足数の要件を完全に排除することができる。"},{"l":11,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の解任","i":"A","r":"","q":"会計監査人は，必ず，株主総会の決議によって解任しなければならず，その他の方法によって解任することは認められない。","a":false,"c":"340条。","e":"会計監査人は，株主総会の決議によって解任される他，一定の場合における監査役または監査委員の全員の同意によっても解任される。会計監査人の解任は，原則として株主総会の決議によらなければならない（339 条１項）。しかし，会計監査人による監査を受けるような大会社では，会計監査人の解任のためだけに臨時株主総会を招集することは，実際上コストがかかり過ぎる。そこで，信頼関係を喪失するほどの重大な事由がある場合に限って，例外的に監査役等の全員の同意によって会計監査人を解任することができることとしたのである。"},{"l":12,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の解任","i":"A","r":"(令6I問題13ウ類・平23II問題12エ類)","q":"監査役会設置会社でない監査役設置会社において，会計監査人が職務上の義務に違反し，または職務を怠ったときは，監査役（監査役が２人以上ある場合にあっては，その過半数）の同意によって，会計監査人を解任することができる。","a":false,"c":"340条1項1号2項。","e":"会計監査人が，① 職務上の義務に違反し，または職務を怠ったとき，② 会計監査人としてふさわしくない非行があったとき，③ 心身の故障のため，職務の執行に支障があり，またはこれに堪えないときは，監査役（監査役会設置会社では監査役会，監査等委員会設置会社では監査等委員会，指名委員会等設置会社では監査委員会）は，その会計監査人を解任することができる。当該解任は，監査役が２人以上ある場合には監査役全員の同意（監査役会設置会社であっても監査役全員の同意，監査等委員会設置会社では監査等委員全員の同意，指名委員会等設置会社では監査委員全員の同意）によって行われなければならない（340条１項２項４項５項６項）。また，この場合，監査役（監査役が２人以上いる場合は監査役の互選によって定めた監査役，監査役会設置会社では監査役会が選定した監査役，監査等委員会設置会社では監査等委員会が選定した監査等委員，指名委員会等設置会社においては監査委員会が選定した監査委員会の委員）は，解任した旨およびその理由を解任後最初に招集される株主総会に報告しなければならない（340条３項４項５項６項）。これは，会計監査人の独立性の確保を図ると同時に，株主に解任事由を伝達することを目的とする。"},{"l":13,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の解任","i":"A","r":"(平29II問題12イ・平26I問題11ア・平24II問題12ア類)","q":"監査役会設置会社において，会計監査人としてふさわしくない非行があったときは，監査役の全員の同意によって，会計監査人を解任することができる。","a":true,"c":"340条1項2号2項4項。","e":"問題12の解説参照。"},{"l":14,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の解任","i":"A","r":"","q":"監査役の全員の同意により会計監査人を解任したときは，監査役（監査役が２人以上ある場合は監査役の互選によって定めた監査役，監査役会設置会社では監査役会が選定した監査役）は，解任した旨およびその理由を解任後最初に招集される株主総会に報告しなければならない。","a":true,"c":"340条3項4項。","e":"監査役等の全員の同意により会計監査人を解任したときは，監査役（監査役が２人以上いる場合は監査役の互選によって定めた監査役，監査役会設置会社では監査役会が選定した監査役，監査等委員会設置会社では監査等委員会が選定した監査等委員，指名委員会等設置会社においては監査委員会が選定した監査委員会の委員）は，解任した旨およびその理由を解任後最初に招集される株主総会に報告しなければならない（340 条３項４項５項６項）。これは，会計監査人の独立性の確保を図ると同時に，株主に解任事由を伝達することを目的とする。"},{"l":15,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の解任","i":"A","r":"(平24II問題12ウ類・平24I問題11イ)","q":"監査役会設置会社において，会計参与が職務上の義務に違反し，または職務を怠ったときは，監査役会は，その決議によって当該会計参与を解任することができる。","a":false,"c":"","e":"会計監査人と異なり，会計参与に関しては，監査役等による解任の規定は設けられていない（340条参照）。"},{"l":16,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の解任","i":"A","r":"(平26I問題11イ)","q":"指名委員会等設置会社において，会計監査人が職務上の義務に違反した場合には，監査委員会の委員の過半数の同意によって，その会計監査人を解任することができる。","a":false,"c":"340条1項2項6項。","e":"指名委員会等設置会社において，監査委員会による会計監査人の解任は，監査委員会の委員の全員の同意によって行わなければならない。"},{"l":17,"m":"役員および会計監査人の選任および解任","sb":"役員および会計監査人の解任","i":"A","r":"(平27II問題9イ)","q":"指名委員会等設置会社の取締役会は，その決議によって当該指名委員会等設置会社の会計参与を解任することができる。","a":false,"c":"","e":"指名委員会等設置会社の取締役会に会計参与を解任する権限はない。会計参与は，いつでも，株主総会の決議により解任することができる（339条１項）。"},{"l":1,"m":"役員および会計監査人の選任および解任","sb":"その他選任および解任に関する規定","i":"A","r":"(平24II問題9ア・平23II問題10イ)","q":"監査役設置会社において，取締役は，監査役の選任に関する議案を株主総会に提出するには，監査役全員の同意を得なければならない。","a":false,"c":"343条1項3項。","e":"取締役は，監査役がある場合において，監査役の選任に関する議案を株主総会に提出する場合には，監査役（監査役が２人以上ある場合はその過半数，監査役会設置会社では監査役会）の同意を得なければならない（343 条１項３項）。これは，取締役が株主総会に提出する監査役の選任議案に対して，監査役（監査役会）に拒否権を与えたものである。"},{"l":2,"m":"役員および会計監査人の選任および解任","sb":"その他選任および解任に関する規定","i":"A","r":"(令5I問題13エ)","q":"取締役は，監査等委員会がある場合において，監査等委員である取締役の選任に関する議案を株主総会に提出するには，監査等委員会の同意を得なければならない。","a":true,"c":"344条の2第1項。","e":"取締役が株主総会に提出する監査等委員である取締役の選任議案に対して，監査等委員会に同意権（拒否権）を与えることで，監査等委員である取締役の地位を強化している。"},{"l":3,"m":"役員および会計監査人の選任および解任","sb":"その他選任および解任に関する規定","i":"B","r":"","q":"監査役会設置会社において，監査役会は，取締役に対し，監査役の選任を株主総会の目的とすることを請求することができない。","a":false,"c":"343条2項3項。","e":"監査役（監査役会設置会社では監査役会）は，取締役に対し，監査役の選任を株主総会の目的とすること，または，監査役の選任に関する議案を株主総会に提出することを請求することができる。監査役の選任に関して，監査役の意見を反映させることで，監査役の地位を強化する趣旨である。なお，監査等委員会設置会社においても，同様の趣旨で，監査等委員である取締役に対し，同様の権限を与えている（344条の２第２項）。"},{"l":4,"m":"役員および会計監査人の選任および解任","sb":"その他選任および解任に関する規定","i":"A","r":"(令3問題7エ類・平28I問題11ウ類・平26I問題11ウ類・平26I問題11エ・平24II問題12イ類)","q":"監査役会設置会社においては，株主総会に提出する会計監査人の選任および解任ならびに会計監査人を再任しないことに関する議案の内容は，監査役会が決定する。","a":true,"c":"344条1項3項。","e":"監査役設置会社においては，株主総会に提出する会計監査人の選任および解任ならびに会計監査人を再任しないことに関する議案の内容は，監査役（監査役が２人以上ある場合はその過半数をもって，監査役会設置会社では監査役会）が決定する（344 条）。当該規定の趣旨は，会計監査人の独立性を確保すると同時に，監査役と会計監査人との職務上の密接な関係に鑑みて，その選任等につき監査役の意思を反映させることである。また，監査等委員会設置会社または指名委員会等設置会社においても同様に，監査等委員会設置会社では監査等委員会，指名委員会等設置会社では監査委員会が決定する（399条の２第３項２号，404条２項２号）。"},{"l":5,"m":"役員および会計監査人の選任および解任","sb":"その他選任および解任に関する規定","i":"A","r":"(令5I問題13ア類・令4I問題13エ類・平24II問題9ウ)","q":"会計参与，監査役，会計監査人および監査等委員である取締役は，株主総会において，それぞれ会計参与，監査役，会計監査人および監査等委員である取締役の解任または辞任について意見を述べることができるが，選任について意見を述べることができない。","a":false,"c":"345条,342条の2。","e":"会計参与，監査役，会計監査人および監査等委員である取締役には，その地位の独立性を確保するために，選任，解任，不再任（会計監査人の場合）または辞任に関する意見陳述権が認められている。"},{"l":6,"m":"役員および会計監査人の選任および解任","sb":"その他選任および解任に関する規定","i":"B","r":"(令5I問題13ウ類・平30I問題11ウ類)","q":"監査等委員である取締役は，株主総会において，監査等委員である取締役以外の取締役の選任もしくは解任または辞任について監査等委員会の意見を述べることができない。","a":false,"c":"342条の2第4項。","e":"監査等委員会が選定する監査等委員は，株主総会において，監査等委員である取締役以外の取締役の選任もしくは解任または辞任について監査等委員会の意見を述べることができる。このように，監査等委員会には，指名委員会等設置会社における指名委員会に準ずる経営評価の役割が期待されているのである。"},{"l":7,"m":"役員および会計監査人の選任および解任","sb":"その他選任および解任に関する規定","i":"A","r":"(平22II問題10エ)","q":"監査役設置会社においては，取締役は，会計参与の解任を株主総会の目的とするときは，監査役（監査役が２人以上ある場合にあっては，その過半数）の同意を得なければならない。","a":false,"c":"","e":"このような規定はない。"},{"l":8,"m":"役員および会計監査人の選任および解任","sb":"その他選任および解任に関する規定","i":"B","r":"","q":"取締役が欠けた場合または会社法もしくは定款で定めた取締役の員数が欠けた場合には，解任により退任した取締役は，新たに選任された取締役が就任するまで，なお取締役としての権利義務を有する。","a":false,"c":"346条1項。","e":"役員（監査等委員会設置会社では，監査等委員である取締役もしくはそれ以外の取締役または会計参与）が欠けた場合または会社法もしくは定款で定めた役員の員数が欠けた場合には，任期の満了または辞任により退任した取締役は，新たに選任された取締役が就任するまで，なお取締役としての権利義務を有する。したがって，解任された役員には留任義務はない。留任義務が課せられる役員が任期の満了または辞任により退任した役員に限定されているのは，解任，欠格事由の発生，定款所定の資格喪失の場合に権利義務を継続させることは不適当であり，役員の死亡や会社解散の場合には継続させることが不可能だからである。"},{"l":9,"m":"役員および会計監査人の選任および解任","sb":"その他選任および解任に関する規定","i":"B","r":"","q":"会計監査人が欠けた場合または会社法もしくは定款で定めた会計監査人の員数が欠けた場合には，任期の満了または辞任により退任した会計監査人は，新たに選任された会計監査人が就任するまで，なお会計監査人としての権利義務を有する。","a":false,"c":"","e":"会計監査人に欠員が生じた場合は，役員の場合と異なり，留任義務の規定（346条１項）が設けられていない。"},{"l":10,"m":"役員および会計監査人の選任および解任","sb":"その他選任および解任に関する規定","i":"A","r":"(令4I問題13ウ類・平22I問題14ア・平22I問題14ウ類)","q":"役員が欠けた場合または会社法もしくは定款で定めた役員の員数が欠けた場合において，裁判所は，必要があると認めるときは，利害関係人の申立てにより，一時役員の職務を行うべき者を選任することができる。","a":true,"c":"346条2項。","e":"役員が解任等の事由で退任した場合には留任義務を負う役員が存在しないし，また，任期の満了または辞任により退任した役員であっても，健康上の問題等様々な理由で権利義務を継続させることが不適当な場合があるためである。"},{"l":11,"m":"役員および会計監査人の選任および解任","sb":"その他選任および解任に関する規定","i":"A","r":"(平22I問題14エ)","q":"会計監査人が欠けた場合または定款で定めた会計監査人の員数が欠けた場合において，裁判所は，必要があると認めるときは，利害関係人の申立てにより，一時会計監査人の職務を行うべき者を選任することができる。","a":false,"c":"346条4項6項7項8項。","e":"会計監査人が欠けた場合または定款で定めた会計監査人の員数が欠けた場合において，遅滞なく会計監査人が選任されないときは，監査役（監査役会設置会社では監査役会，監査等委員会設置会社では監査等委員会，指名委員会等設置会社では監査委員会）は，一時会計監査人の職務を行うべき者を選任しなければならない。"},{"l":12,"m":"役員および会計監査人の選任および解任","sb":"その他選任および解任に関する規定","i":"A","r":"(平28II問題11エ)","q":"裁判所が利害関係人の申立てにより一時取締役の職務を行うべき者を選任した場合，裁判所は，株式会社がその者に対して支払う報酬の額を定めることができる。","a":true,"c":"346条3項。","e":""},{"l":1,"m":"取締役","sb":"","i":"B","r":"","q":"取締役会設置会社以外の株式会社においては，定款で株式会社の業務を執行する取締役を定めなければならない。","a":false,"c":"348条1項。","e":"取締役会非設置会社においては，各取締役が会社の業務を執行するのが原則である。ただし，定款で別段の定めを設けることが認められる。"},{"l":2,"m":"取締役","sb":"","i":"B","r":"","q":"取締役会設置会社以外の株式会社において，取締役が２人以上ある場合には，当該株式会社の業務は，定款に別段の定めがある場合を除き，業務を執行する権限を有する取締役の過半数をもって決定する。","a":false,"c":"348条2項。","e":"取締役会非設置会社において，取締役が２人以上ある場合には，当該株式会社の業務は，定款に別段の定めがある場合を除き，取締役の過半数をもって決定する。すなわち，定款により業務を執行しない取締役を定めた場合であっても，当該取締役は業務の決定に関与するのが原則である。"},{"l":3,"m":"取締役","sb":"","i":"A","r":"","q":"取締役会設置会社以外の株式会社において，取締役は，多額の借財についての決定を各取締役に委任することができない。","a":false,"c":"348条3項。","e":"取締役会非設置会社において，取締役は，多額の借財についての決定を各取締役に委任することができる。これは，重要な財産の処分および讓受けについても同様である。一方，取締役会設置会社において，取締役会は，重要な財産の処分および譲受け，多額の借財についての決定を取締役に委任することはできない（362条４項１号２号）。"},{"l":4,"m":"取締役","sb":"","i":"A","r":"","q":"取締役会設置会社以外の株式会社において，取締役は，支配人の選任および解任についての決定を各取締役に委任することができる。","a":false,"c":"348条3項。","e":"取締役会非設置会社において，取締役は，① 支配人の選任および解任，② 支店の設置，移転および廃止，③ 株主総会（種類株主総会）の招集の決定，④ 内部統制システムの整備，⑤ 426 条１項の規定による定款の定めに基づく役員等の株式会社に対する損害賠償責任の一部免除についての決定を各取締役に委任することはできない。"},{"l":5,"m":"取締役","sb":"","i":"A","r":"(平30II問題12ウ類・平25I問題11ア)","q":"取締役会設置会社でない大会社において，取締役は，その過半数をもって，株式会社の業務の適正を確保するための体制の整備を決定しなければならない。ただし，定款に別段の定めはないものとする。","a":true,"c":"348条4項。","e":"大会社であれば，取締役会設置会社であるか否かを問わず，内部統制システムの整備義務があり（348条４項，362条５項），その決定は，各取締役に委任することができない（348条３項４号，362条４項６号）。ある程度以上の規模の株式会社には，その業務の適正を確保するための組織体制の構築が必要であるという考え方に基づくものである。また，監査等委員会設置会社および指名委員会等設置会社においては，大会社か否かを問わず，内部統制システムの整備義務がある（399条の13第１項１号ロハ，２項，416条１項１号ロホ，２項）。"},{"l":6,"m":"取締役","sb":"","i":"A","r":"","q":"取締役会設置会社においては，原則として，取締役会の決議によって業務執行の決定を行う。","a":true,"c":"362条2項1号。","e":"なお，取締役会は，取締役会の定める規則または取締役会の決議により，業務執行の決定を代表取締役または代表取締役以外の業務執行取締役に委任することができる。また，日常の業務の決定は，代表取締役に当然に委任されていると解されている。"},{"l":7,"m":"取締役","sb":"","i":"A","r":"","q":"指名委員会等設置会社以外の取締役会設置会社においては，代表取締役以外の取締役が当該取締役会設置会社の業務を執行することはない。","a":false,"c":"363条1項。","e":"指名委員会等設置会社以外の取締役会設置会社においては，① 代表取締役，② 代表取締役以外の取締役であって，取締役会の決議によって取締役会設置会社の業務を執行する取締役として選定された者が業務を執行する。"},{"l":1,"m":"取締役会","sb":"総論","i":"A","r":"(平25I問題2エ)","q":"定款の定めによって取締役会を任意に設置した公開会社でない株式会社は，取締役会設置会社ではない。","a":false,"c":"2条7号。","e":"取締役会設置会社とは，取締役会を置く株式会社または会社法の規定により取締役会を置かなければならない株式会社をいう。前半の「取締役会を置く株式会社」とは，現に取締役会を置いている株式会社のことを指す。これに対して，後半の「会社法の規定により取締役会を置かなければならない株式会社」とは，会社法の規定（327 条１項）により本来は取締役会を置かなければならない株式会社が取締役会を置いてない場合の当該株式会社のことを指す。"},{"l":2,"m":"取締役会","sb":"総論","i":"A","r":"","q":"取締役会はすべての取締役で組織する。","a":true,"c":"362条1項。","e":""},{"l":3,"m":"取締役会","sb":"総論","i":"A","r":"(令2I問題10ウ・平25I問題9ウ)","q":"監査等委員会設置会社または指名委員会等設置会社以外の取締役会設置会社において，取締役会は，支配人その他の重要な使用人の選任および解任の決定を代表取締役に委任することができる。","a":false,"c":"362条4項3号。","e":"監査等委員会設置会社または指名委員会等設置会社以外の取締役会設置会社において，取締役会は，支配人その他の重要な使用人の選任および解任を取締役に委任することができない。"},{"l":4,"m":"取締役会","sb":"総論","i":"A","r":"(平28I問題9イ)","q":"監査役設置会社である取締役会設置会社において，取締役会は，その決議により，支店その他の重要な組織の設置の決定を取締役に委任することができる。","a":false,"c":"362条4項4号。","e":"監査役設置会社である取締役会設置会社であっても，取締役会は，支店その他の重要な組織の設置の決定を取締役に委任することができない。"},{"l":5,"m":"取締役会","sb":"総論","i":"A","r":"(平30II問題12イ)","q":"大会社である取締役会設置会社において，取締役会は，内部統制システムの整備について決定しなければならない。","a":true,"c":"362条5項。","e":"大会社は一定以上の規模の株式会社であるため，その業務の適正を確保するための組織体制の整備についての決定が必要となるのである。"},{"l":6,"m":"取締役会","sb":"総論","i":"A","r":"(平30II問題12ア)","q":"大会社でなく，かつ，監査等委員会設置会社または指名委員会等設置会社以外の取締役会設置会社において，取締役会は，内部統制システムの整備の決定につき，取締役に委任することができる。","a":false,"c":"362条4項6号。","e":"大会社に該当しない場合であっても，内部統制システムの整備の決定については，取締役に委任することはできない。"},{"l":7,"m":"取締役会","sb":"総論","i":"A","r":"(平29II問題11ア・平24II問題10イ)","q":"指名委員会等設置会社でない株式会社においては，代表取締役以外の取締役であって，取締役会の決議によって選定された業務執行取締役は，３か月に１回以上，自己の職務の執行の状況を取締役会に報告しなければならない。","a":true,"c":"363条2項。","e":"指名委員会等設置会社でない株式会社においては，① 代表取締役，および，②代表取締役以外の取締役であって，取締役会の決議によって取締役会設置会社の業務を執行する取締役として選定された取締役は，３か月に１回以上，自己の職務の執行の状況を取締役会に報告しなければならない（363 条２項）。取締役会の監督機能の実効性を確保するためである。"},{"l":1,"m":"取締役会","sb":"取締役会の招集","i":"A","r":"(平30I問題13エ・平26I問題8ア類)","q":"取締役会は，取締役会を招集する取締役を定めなければならない。","a":false,"c":"366条1項。","e":"取締役会は，原則として各取締役が招集する。ただし，定款または取締役会によって，取締役会を招集する取締役（招集権者）を定めることができる。"},{"l":2,"m":"取締役会","sb":"取締役会の招集","i":"B","r":"","q":"定款または取締役会で取締役会の招集権者である取締役を定めた場合であっても，当該招集権者以外の取締役は，招集権者に対し，取締役会の目的である事項を示して，取締役会の招集を請求することができる。","a":true,"c":"366条2項。","e":"招集権者を定款または取締役会で定めた場合，招集権者以外の取締役は，招集権者に対し，取締役会の目的である事項を示して，取締役会の招集を請求することができる。なお，請求があった日から５日以内に，当該請求があった日から２週間以内の日を取締役会の日とする取締役会の招集の通知が発せられない場合は，その請求をした取締役は，取締役会を招集することができる（366 条３項）。これは，招集権者が請求に応じて取締役会の招集手続を行わない場合に備えた規定である。"},{"l":3,"m":"取締役会","sb":"取締役会の招集","i":"A","r":"(令5II問題13ア・平23II問題9ア)","q":"監査役設置会社における株主は，取締役が当該会社の目的の範囲外の行為もしくは定款に違反する行為をし，またはこれらの行為をするおそれがあると認めるときは，取締役会の招集を請求することができる。","a":false,"c":"367条1項。","e":"取締役会設置会社（監査役設置会社，監査等委員会設置会社および指名委員会等設置会社を除く）の株主は，取締役が取締役会設置会社の目的の範囲外の行為その他法令もしくは定款に違反する行為をし，またはこれらの行為をするおそれがあると認めるときは，取締役会の招集を請求することができる。当該請求は，取締役会に対し，取締役会の目的である事項を示して行わなければならない（367 条２項）。そして，請求があった日から５日以内に，当該請求があった日から２週間以内の日を取締役会の日とする取締役会の招集の通知が発せられない場合は，その請求をした株主は，取締役会を招集することができる（同条３項）。監査役設置会社，監査等委員会設置会社または指名委員会等設置会社以外の取締役会設置会社では，取締役の職務の執行を監督する権限を有するものは取締役会を除いて存在しない。そのような株式会社において，取締役が取締役会設置会社の目的の範囲外の行為その他法令もしくは定款に違反する行為をし，またはこれらの行為をするおそれがある場合には，これを防止する必要がある。そこで，株主に対して取締役会の招集請求権および招集権を認めたのである。"},{"l":4,"m":"取締役会","sb":"取締役会の招集","i":"B","r":"(令4II問題4ア類)","q":"株主による取締役会の招集請求に基づいて招集された取締役会であっても，当該株主は，当該取締役会に出席することは認められない。","a":false,"c":"367条4項。","e":"取締役会の招集請求を行った株主は，当該請求に基づき招集された取締役会，または，自ら招集した取締役会に出席し，意見を述べることができる。"},{"l":5,"m":"取締役会","sb":"取締役会の招集","i":"B","r":"","q":"監査役は，著しく不当な事実があると認める場合において，必要があると認めるときは，取締役会を招集することができる。","a":false,"c":"383条2項。","e":"監査役は，取締役が不正の行為をし，もしくは当該行為をするおそれがあると認めるとき，または法令もしくは定款に違反する事実もしくは著しく不当な事実があると認める場合において，必要があると認めるときは，取締役に対し，取締役会の招集を請求することができる。そして，請求があった日から５日以内に，当該請求があった日から２週間以内の日を取締役会の日とする取締役会の招集の通知が発せられない場合は，その請求をした監査役は，取締役会を招集することができる（383条３項）。"},{"l":6,"m":"取締役会","sb":"取締役会の招集","i":"B","r":"(令4I問題12ア)","q":"指名委員会等設置会社においては，取締役会の招集権者の定めがある場合であっても，指名委員会等がその委員の中から選定する者は，取締役会を招集することができる。","a":true,"c":"417条1項。","e":"指名委員会等の職務の執行にあたって取締役会の決議を要する場合に備えた規定である。なお，監査等委員会設置会社においても同様に，招集権者の定めがある場合であっても，監査等委員会がその委員の中から選定する監査等委員は，取締役会を招集することができる（399条の14）。"},{"l":7,"m":"取締役会","sb":"取締役会の招集","i":"B","r":"","q":"執行役は，いつでも，取締役会の招集をすることができ，自ら招集した取締役会に出席し，意見を述べることができる。","a":false,"c":"417条2項前段。","e":"執行役は，取締役会の招集請求を受けるものとして定められた取締役（416 条１項１号ニ）に対し，取締役会の目的である事項を示して，取締役会の招集を請求することができる。この場合において，執行役による招集の請求があった日から５日以内に，当該請求があった日から２週間以内の日を取締役会の日とする取締役会の招集の通知が発せられないときは，当該執行役は，取締役会を招集することができる（417 条２項後段）。なお，執行役には，取締役会への出席権および発言権は与えられていない点に注意する必要がある。"},{"l":8,"m":"取締役会","sb":"取締役会の招集","i":"A","r":"","q":"取締役会の招集通知には，期限の制約がない。","a":false,"c":"368条1項。","e":"取締役会の招集通知の期限は，取締役会の日の１週間（定款で短縮可）前までとされる。"},{"l":9,"m":"取締役会","sb":"取締役会の招集","i":"A","r":"(平31II問題11イ)","q":"監査役会設置会社において，取締役会を招集する者が招集の通知を発する場合には，取締役会の日の１週間前までに，各取締役および各監査役に対してその通知を発しなければならない。ただし，定款に別段の定めはないものとする。","a":true,"c":"368条1項。","e":"取締役会を招集する者は，取締役会の日の１週間（定款で短縮可）前までに，各取締役（監査役設置会社では各取締役および各監査役）に対してその通知を発しなければならない。監査役は，取締役会に出席し，必要があると認めるときは，意見を述べなければならないため（383 条１項前段），監査役設置会社では，各監査役に対しても取締役会の招集通知を発しなければならない。"},{"l":10,"m":"取締役会","sb":"取締役会の招集","i":"A","r":"(平23II問題9エ)","q":"会計監査人設置会社は，取締役会の招集通知を，会計監査人にも発しなければならない。","a":false,"c":"368条1項。","e":"会計監査人には，取締役会への出席義務はないため，招集通知の発信も不要である。"},{"l":11,"m":"取締役会","sb":"取締役会の招集","i":"A","r":"(令6I問題12ア類・平29II問題11イ・平28I問題9エ類・平23II問題9イ類)","q":"取締役会の招集通知は，書面または電磁的方法によらなければならない。","a":false,"c":"","e":"取締役会の招集通知の方法に制限はなく ，口頭（電話を含む），書面またはメールなど， 何でもよい。また，招集通知には取締役会の目的である事項（議題）を示す必要はない。なぜなら，会議中に業務の執行に必要な事項が議題に追加されるのは当然のことだからである。なお，取締役会の招集通知の方法を定款または取締役会で定めることも認められる。"},{"l":12,"m":"取締役会","sb":"取締役会の招集","i":"A","r":"(平30I問題13ウ)","q":"取締役会は，取締役会の招集通知に記載された会議の目的事項以外の事項について決議をすることができる。","a":true,"c":"","e":"取締役会は，会社から経営を委任された受任者である取締役で構成されているため，当然に日々の経営に関与していることから，招集通知に記載された会議の目的事項以外の事項について決定することができる。"},{"l":13,"m":"取締役会","sb":"取締役会の招集","i":"A","r":"(令5II問題13イ類・平29II問題11ウ類・平26I問題8イ類・平23II問題9ウ類)","q":"監査役設置会社において，取締役会は，取締役全員の同意があるときは，招集の手続を経ることなく開催することができる。","a":false,"c":"368条2項。","e":"取締役会は，取締役（監査役設置会社にあっては取締役および監査役）の全員の同意があるときは，招集の手続を経ることなく開催することができる。取締役会の招集手続の省略は，会社経営の機動性および迅速性を確保するために認められる。"},{"l":14,"m":"取締役会","sb":"取締役会の招集","i":"A","r":"(平26II問題9ア)","q":"取締役会の招集の手続を省略するには，定款の定めが必要である。","a":false,"c":"368条2項。","e":"取締役会は，取締役（監査役設置会社では取締役および監査役）の全員の同意があるときは，招集の手続を経ることなく開催することができる。これは会社経営の機動性および迅速性を確保するためであり，定款の定めは不要である。"},{"l":1,"m":"取締役会","sb":"取締役会の決議・報告の省略","i":"A","r":"","q":"取締役会の決議は，議決に加わることができる取締役全員が出席し，その過半数をもって行う。","a":false,"c":"369条1項。","e":"取締役会の決議は，議決に加わることができる取締役の過半数（定款で加重可）が出席し，その過半数（定款で加重可）をもって行う。"},{"l":2,"m":"取締役会","sb":"取締役会の決議・報告の省略","i":"A","r":"(平26II問題9イ)","q":"取締役会の決議の定足数の要件を加重するには，定款の定めが必要である。","a":true,"c":"369条1項かっこ書。","e":"取締役会の決議は，議決に加わることができる取締役の過半数（定款で加重可）が出席し，その過半数（定款で加重可）をもって行う。"},{"l":3,"m":"取締役会","sb":"取締役会の決議・報告の省略","i":"B","r":"","q":"取締役は，取締役会において，代理人によってその議決権を行使することができる。","a":false,"c":"","e":"取締役会においては，経営の専門家である取締役が集まって，協議し，意見を交換して，業務執行について最善の結論を出すことが期待される。したがって，代理人による議決権の行使，書面投票，電子投票などは認められない。"},{"l":4,"m":"取締役会","sb":"取締役会の決議・報告の省略","i":"A","r":"(平28I問題9ウ)","q":"取締役会の決議について特別の利害関係を有する取締役は，議決に加わることができない。","a":true,"c":"369条2項。","e":"株主の議決権が，実質的所有者たる株主の個人的利益のために与えられているのと異なり，株式会社と委任関係にある取締役の取締役会における議決権は，もっぱら株式会社の利益を図るためにのみ議決権を行使しなければならない（355 条）。そこで，忠実義務違反を予防し，決議の公正を図るため，特別利害関係取締役は取締役会の議決に加わることができないとされている。"},{"l":5,"m":"取締役会","sb":"取締役会の決議・報告の省略","i":"B","r":"(令6I問題12ウ)","q":"最高裁判所の判例によれば，代表取締役の解職を決定する取締役会決議において，当該解職決議の対象となる代表取締役は，特別利害関係を有する者に該当するとしている。","a":true,"c":"最判昭44年3月28日。","e":"本人の意思に反して代表取締役を解職する決議がなされる場合は，当該代表取締役に対し，一切の私心を捨て去り，会社に対する忠実義務に従い，公正に議決権を行使することは期待できず，かえって自己の利益を図って議決権を行使することが考えられるためである。"},{"l":6,"m":"取締役会","sb":"取締役会の決議・報告の省略","i":"A","r":"(平26II問題9ウ)","q":"取締役会の決議を省略するには，定款の定めが必要である。","a":true,"c":"370条。","e":"取締役会設置会社は，取締役が取締役会の決議の目的である事項について提案をした場合において，当該提案につき取締役（当該事項について議決に加わることができるものに限る）の全員が書面または電磁的記録により同意の意思表示をしたとき（監査役設置会社では監査役が当該提案について異議を述べたときを除く）は，当該提案を可決する旨の取締役会の決議があったものとみなす旨を定款で定めることができる。取締役会の決議省略制度において定款の定めが必要とされているのは，取締役がどのような方法によって経営上の意思決定を行うかは，株主にとって重大な関心事であり，会社経営の基本的事項であると考えられるからである。"},{"l":7,"m":"取締役会","sb":"取締役会の決議・報告の省略","i":"A","r":"(令5II問題13ウ・平31II問題11ウ類)","q":"監査役設置会社の取締役が取締役会の決議の目的である事項について提案をした場合において，当該提案につき取締役の全員が書面または電磁的記録により同意の意思表示をしたとき（監査役が当該提案について異議を述べたときを除く）は，当該提案を可決する旨の取締役会の決議があったものとみなされる。","a":false,"c":"370条。","e":"取締役会設置会社は，取締役が取締役会の決議の目的である事項について提案をした場合において，当該提案につき取締役（当該事項について議決に加わることができるものに限る）の全員が書面または電磁的記録により同意の意思表示をしたとき（監査役設置会社では監査役が当該提案について異議を述べたときを除く）は，当該提案を可決する旨の取締役会の決議があったものとみなす旨を定款で定めることができる。取締役会の決議省略制度において定款の定めが必要とされているのは，取締役がどのような方法によって経営上の意思決定を行うかは，株主にとって重大な関心事であり，会社経営の基本的事項であると考えられるからである。"},{"l":8,"m":"取締役会","sb":"取締役会の決議・報告の省略","i":"A","r":"(平26II問題9エ)","q":"監査役が取締役会に報告すべき事項の報告を省略するには，定款の定めが必要である。","a":false,"c":"372条1項。","e":"取締役，会計参与，監査役または会計監査人が取締役（監査役設置会社では取締役および監査役）の全員に対して取締役会に報告すべき事項を通知したときは，当該事項を取締役会へ報告することを要しない。この報告の省略については，定款の定めは不要である。"},{"l":9,"m":"取締役会","sb":"取締役会の決議・報告の省略","i":"B","r":"(平27I問題9ア)","q":"取締役会は，３か月に１回以上開催されなければならない。","a":true,"c":"372条2項,363条2項。","e":"代表取締役等が行う３か月に１回以上の職務執行状況の定例報告（363条２項，417条４項）は，省略することができない（372 条２項３項）。370 条の取締役会の決議の省略の規定と当該報告の省略の規定を過度に併用することにより，取締役会の監督機能が低下してしまうのを防ぐためである。したがって，取締役会は，少なくとも３か月に１回は開催することが義務づけられる。"},{"l":10,"m":"取締役会","sb":"取締役会の決議・報告の省略","i":"B","r":"(平31II問題11エ)","q":"監査役設置会社における代表取締役は，３か月に１回以上，自己の職務の執行の状況を取締役会に報告しなければならないが，これを取締役および監査役の全員に対して通知したときは，当該事項を取締役会へ報告することを要しない。","a":false,"c":"372条2項,363条2項。","e":"代表取締役が行う３か月に１回以上の職務執行状況の定例報告（363条２項）は，省略することができない（372条２項３項）。370 条の取締役会の決議の省略の規定と当該報告の省略の規定を過度に併用することにより，取締役会の監督機能が低下してしまうのを防ぐためである。したがって，取締役会は，少なくとも３か月に１回は開催することが義務づけられる。"},{"l":1,"m":"取締役会","sb":"特別取締役による取締役会の決議","i":"A","r":"(平29I問題11エ)","q":"特別取締役による取締役会の決議で決定することができるのは，重要な財産の処分および譲受け，多額の借財，支配人その他の使用人の選任および解任についてである。","a":false,"c":"373条1項柱書。","e":"特別取締役による取締役会の決議で決定することができるのは，① 重要な財産の処分および譲受け（362条４項１号，399条の13第４項１号），② 多額の借財（362条４項２号，399条の13第４項２号）についてである。したがって，支配人その他の使用人の選任および解任について決定することは認められない。"},{"l":2,"m":"取締役会","sb":"特別取締役による取締役会の決議","i":"A","r":"(平22II問題9イ)","q":"特別取締役による取締役会は，支店その他の重要な組織の設置を決議することができる。","a":false,"c":"373条1項柱書。","e":"支店その他の重要な組織の設置については，特別取締役による取締役会の決議で決定することができない。"},{"l":3,"m":"取締役会","sb":"特別取締役による取締役会の決議","i":"A","r":"(平27I問題9イ)","q":"特別取締役による取締役会は，その決議により代表取締役を解職することができる。","a":false,"c":"373条1項柱書。","e":"代表取締役の解職については，特別取締役による取締役会の決議で決定することができない。"},{"l":4,"m":"取締役会","sb":"特別取締役による取締役会の決議","i":"A","r":"(令4II問題11ア類・平29I問題11イ・平22II問題9ア)","q":"指名委員会等設置会社においては，特別取締役による取締役会の決議を行うことができない。","a":true,"c":"373条1項柱書。","e":"特別取締役による取締役会の決議の趣旨は，重要な財産の処分および譲受けおよび多額の借財について迅速な意思決定を可能にすることにある。ここで，指名委員会等設置会社において特別取締役による取締役会の決議の制度を採用することができないのは，執行役に業務執行の決定権限を大幅に委ねることで迅速な意思決定が可能なためである。"},{"l":5,"m":"取締役会","sb":"特別取締役による取締役会の決議","i":"A","r":"","q":"監査等委員会設置会社においては，特別取締役による取締役会の決議の制度を採用することができない。","a":false,"c":"373条1項柱書かっこ書。","e":"監査等委員会設置会社においては，① 取締役の過半数が社外取締役である場合（399条の13第５項），または，② 取締役会の決議によって重要な財産の処分および讓受けならびに多額の借財を取締役に委任することができる旨の定款の定めがある場合（399条の13第６項）は，特別取締役による取締役会の決議の制度を採用することができない（373 条１項柱書かっこ書）。この場合は，取締役会の決議によって，重要な財産の処分および譲受け等の決定を代表取締役等に委任することにより迅速な意思決定が可能なためである。"},{"l":6,"m":"取締役会","sb":"特別取締役による取締役会の決議","i":"A","r":"(令6II問題11エ・平29I問題11ア)","q":"監査役設置会社が特別取締役による取締役会決議を行うには，当該会社が取締役会設置会社であって，取締役の数が６人以上であり，かつ，取締役のうち１人以上が社外取締役であることを要する。","a":true,"c":"373条1項柱書1号2号。","e":"特別取締役による取締役会の決議の制度は，取締役の数が多く機動的に取締役会を開催できない大規模な会社が利用することを前提としているためである。すなわち，取締役が少人数の取締役会設置会社においては，取締役会を機動的かつ頻繁に招集することができるため，特別取締役による取締役会の決議の制度を認める必要がないのである。また，取締役のうち１人以上が社外取締役でなければならないのは，特別取締役による取締役会の制度を採用するためには，取締役会の監督機能が適切に働く株式会社であることが求められるためである。"},{"l":7,"m":"取締役会","sb":"特別取締役による取締役会の決議","i":"A","r":"","q":"取締役の過半数が社外取締役でない株式会社は，特別取締役による取締役会の決議を行うことができない。","a":false,"c":"373条1項2号。","e":"特別取締役による取締役会を置くためには，取締役のうち１人以上が社外取締役でなければならない。なぜなら，特別取締役による取締役会の制度を採用するためには，取締役会の監督機能が適切に働く株式会社であることが求められるためである。"},{"l":8,"m":"取締役会","sb":"特別取締役による取締役会の決議","i":"A","r":"(平27II問題8ウ類・平22II問題9ウ)","q":"特別取締役のうち少なくとも１人は，社外取締役でなければならない。","a":false,"c":"","e":"取締役のうち１人以上が社外取締役であることが特別取締役による取締役会の決議を採用するための要件とされているが（373 条１項２号），社外取締役が特別取締役に選定される必要はない。社外取締役が特別取締役として選定されていた方が監督機能を強化する点では望ましいが，別に本務を抱える多忙な社外取締役を特別取締役に選定してしまうと，迅速な意思決定を可能にするという趣旨を達成できなくなってしまうためである。"},{"l":9,"m":"取締役会","sb":"特別取締役による取締役会の決議","i":"A","r":"","q":"特別取締役による取締役会を置くためには，定款でその旨を定めなければならない。","a":false,"c":"373条1項柱書。","e":"特別取締役による取締役会の制度の採用は，取締役会の決議をもって決定するため，定款で定める必要はない。取締役会の専決事項の一部について，迅速な意思決定ができるように設けられた制度であるため，取締役会の決議のみで定めることができるのである。"},{"l":10,"m":"取締役会","sb":"特別取締役による取締役会の決議","i":"B","r":"","q":"特別取締役による取締役会の決議については，あらかじめ選定した３人以上の特別取締役のうち，議決に加わることができるものの過半数（取締役会で加重可）が出席し，その過半数（取締役会で加重可）をもって行う。","a":true,"c":"373条1項柱書。","e":"特別取締役による取締役会の制度の採用が取締役会の決議のみで可能なことから，定足数および決議要件の加重は，取締役会の決議によってすることができる。なお，緩和は認められない。"},{"l":11,"m":"取締役会","sb":"特別取締役による取締役会の決議","i":"B","r":"","q":"特別取締役による取締役会を置く旨の定めがある場合には，特別取締役以外の取締役は，当該特別取締役による取締役会に出席することを要しない。","a":true,"c":"373条2項。","e":""},{"l":12,"m":"取締役会","sb":"特別取締役による取締役会の決議","i":"A","r":"(令4II問題11ウ・平27II問題8エ・平24II問題10ア類・平22II問題9エ)","q":"特別取締役の互選によって定められた者は，特別取締役による取締役会の決議後，遅滞なく，当該決議の内容を特別取締役以外の取締役に報告しなければならない。","a":true,"c":"373条3項。","e":"特別取締役の互選によって定められた者は，特別取締役による取締役会の決議後，遅滞なく，当該決議の内容を特別取締役以外の取締役に報告しなければならない。なお，当該報告については，別途取締役会を招集する必要はない。"},{"l":13,"m":"取締役会","sb":"特別取締役による取締役会の決議","i":"B","r":"","q":"特別取締役による取締役会は，各特別取締役が招集するが，取締役会の決議によって，特別取締役による取締役会を招集する特別取締役を定めることができる。","a":false,"c":"373条2項4項。","e":"特別取締役による取締役会には，取締役会を招集することができる取締役を限定することができる規定は適用されない（373条４項，366条１項ただし書）。したがって，特別取締役による取締役会の招集権者は各特別取締役（373条２項，366条１項本文）であり，招集することができる特別取締役を限定することはできない。"},{"l":14,"m":"取締役会","sb":"特別取締役による取締役会の決議","i":"B","r":"(令4II問題11イ類)","q":"特別取締役による取締役会については，株主による招集請求は認められない。","a":true,"c":"373条4項。","e":"機動的な開催が期待される特別取締役による取締役会の決議の制度趣旨に合致しないためである。同様に，特別取締役による取締役会には，株主による招集請求の規定，監査役による招集請求の規定，および，監査等委員会が選定する監査等委員による招集の規定は適用されない（373条４項，367条，383条４項，399条の14）。"},{"l":15,"m":"取締役会","sb":"特別取締役による取締役会の決議","i":"B","r":"","q":"特別取締役による取締役会については，特別取締役が当該特別取締役による取締役会の目的である事項について提案した場合において，当該提案につき特別取締役の全員が書面または電磁的記録により同意の意思表示をしたときは，当該提案を可決する旨の特別取締役による取締役会の決議があったものとみなされる。","a":false,"c":"373条4項,370条。","e":"機動的に会議を開催するのに適した取締役が特別取締役として選定されているはずなので，取締役会の決議の省略の規定は適用されない（373条４項，370条）。"},{"l":16,"m":"取締役会","sb":"特別取締役による取締役会の決議","i":"B","r":"","q":"特別取締役による取締役会の招集の通知は，当該取締役会の日の１週間前までに発する必要があり，これを下回る期間を定めることはできない。","a":false,"c":"373条2項後段,368条1項。","e":"特別取締役による取締役会の招集の通知は，原則として，会日の１週間前までに発する必要があるが，取締役会の決議によってこれを下回る期間を定めることができる。"},{"l":17,"m":"取締役会","sb":"特別取締役による取締役会の決議","i":"B","r":"","q":"監査役設置会社において，特別取締役による取締役会の招集の通知は，各特別取締役および各監査役に対して発しなければならない。","a":true,"c":"373条2項後段,368条1項。","e":"特別取締役による取締役会の招集の通知を発出する対象は，各特別取締役（監査役設置会社では各特別取締役および各監査役）である（373条２項後段，368条１項）。また，特別取締役による取締役会についても招集手続の省略の規定（368 条２項）が適用されるが，その場合には，特別取締役（監査役設置会社では特別取締役および監査役）の全員の同意が必要である。"},{"l":18,"m":"取締役会","sb":"特別取締役による取締役会の決議","i":"B","r":"(令4II問題11エ類・令2II問題11イ類・平29I問題11ウ)","q":"監査役設置会社において，特別取締役による取締役会決議が行われる取締役会には，監査役は出席することを要しない。","a":false,"c":"383条1項。","e":"監査役は，特別取締役による取締役会決議が行われる取締役会に出席し，必要があると認めるときは，意見を述べなければならない。ただし，監査役が２人以上ある場合において，監査役の互選によって，監査役の中から特に当該取締役会に出席する監査役を定めることができる。"},{"l":1,"m":"取締役会","sb":"取締役会の議事録","i":"B","r":"","q":"取締役会の議事録について，取締役の署名は求められていない。","a":false,"c":"369条3項。","e":"取締役会の議事については，法務省令で定めるところにより，議事録を作成し，議事録が書面をもって作成されているときは，出席した取締役および監査役は，これに署名し，または記名押印しなければならない。議事録は，決議事項に関する賛否の意思表示の重要な証拠資料となるためである。"},{"l":2,"m":"取締役会","sb":"取締役会の議事録","i":"A","r":"(令2II問題10ウ・平26I問題8ウ類)","q":"取締役会の決議に参加した取締役であって，当該取締役会の議事録に異議をとどめない者は，その決議に賛成したものとみなされる。","a":false,"c":"369条5項。","e":"取締役会の決議に参加した取締役であって，当該取締役会の議事録に異議をとどめない者は，その決議に賛成したものと推定される。議事録の記載または記録から取締役等の責任の範囲を明らかにすることは困難であるため，その立証を容易にするために当該推定規定が設けられている。"},{"l":3,"m":"取締役会","sb":"取締役会の議事録","i":"B","r":"","q":"指名委員会等設置会社の株主は，その権利を行使するため必要があるときは，株式会社の営業時間内はいつでも，取締役会の議事録の閲覧を請求することができる。","a":false,"c":"371条2項3項。","e":"株主は，その権利を行使するために必要があるときは，会社の営業時間内はいつでも，議事録等の閲覧または謄写を請求することができる。ただし，監査役設置会社，監査等委員会設置会社または指名委員会等設置会社においては，裁判所の許可が必要となる。これは，業務執行機関としての取締役会の議事録は株式会社の機密が詰まっているため，株主に強い権限を与える必要がある株式会社以外については，裁判所の許可を必要としたものである。"},{"l":4,"m":"取締役会","sb":"取締役会の議事録","i":"B","r":"(令6I問題12エ・平26I問題8エ)","q":"取締役会設置会社の親会社の債権者は，当該取締役会設置会社の役員または執行役の責任を追及するため必要があるときは，裁判所の許可を得て，当該取締役会設置会社の取締役会の議事録の閲覧または謄写の請求をすることができる。","a":false,"c":"371条4項。","e":"取締役会設置会社の債権者は，役員または執行役の責任を追及するために必要があるときは，裁判所の許可を得て，議事録等の閲覧または謄写を請求することができる。また，取締役会設置会社の親会社社員がその権利を行使するため必要がある場合も，同様に，裁判所の許可を得て，議事録等の閲覧または謄写を請求することができる。しかし，親会社の債権者にはそのような権利は認められていない。"},{"l":5,"m":"取締役会","sb":"取締役会の議事録","i":"B","r":"","q":"裁判所は，取締役会設置会社の親会社社員の請求による取締役会の議事録の閲覧をすることにより，当該取締役会設置会社またはその親会社もしくは子会社に著しい損害を及ぼすおそれがあると認めるときは，当該閲覧の請求を許可することができない。","a":true,"c":"371条6項。","e":""},{"l":1,"m":"代表取締役","sb":"","i":"B","r":"(令2I問題10ア類・平21問題10ア類)","q":"取締役会設置会社以外の株式会社において，取締役が２人以上ある場合には，定款，定款の定めに基づく取締役の互選または株主総会の決議による定めがある場合を除き，取締役は，各自，株式会社を代表する。","a":true,"c":"349条1項。","e":"取締役会非設置会社における，各自代表の原則である。"},{"l":2,"m":"代表取締役","sb":"","i":"C","r":"(平26II問題8イ)","q":"取締役会設置会社以外の株式会社において，代表取締役その他株式会社を代表する取締役を定めた場合には，それ以外の取締役は当該株式会社を代表する権限を有しない。","a":true,"c":"349条1項ただし書。","e":"取締役会非設置会社では，定款，定款の定めに基づく取締役の互選または株主総会の決議によって，取締役の中から代表取締役を定めることができる（349 条３項）。すなわち，この場合は当該代表取締役以外の取締役は代表権を有しない（349条１項ただし書）。"},{"l":3,"m":"代表取締役","sb":"","i":"B","r":"","q":"取締役会設置会社以外の株式会社において，定款により取締役の中から代表取締役を定めた場合は，当該取締役以外の取締役は当該株式会社の業務を執行する権限を失う。","a":false,"c":"","e":"代表権のない取締役であっても，定款で業務執行権の制約がなされていない限り業務を執行する権限を有する（348条１項）ため，本肢は誤りである。"},{"l":4,"m":"代表取締役","sb":"","i":"A","r":"","q":"指名委員会等設置会社以外の取締役会設置会社においては，株主総会の決議によって，取締役（監査等委員会設置会社では監査等委員である取締役を除く）の中から代表取締役を選定しなければならない。","a":false,"c":"362条2項3号3項,399条の13第1項3号3項。","e":"指名委員会等設置会社以外の取締役会設置会社においては，取締役会の決議によって，取締役（監査等委員会設置会社では監査等委員である取締役を除く）の中から代表取締役を選定しなければならない。なお，取締役会は，その決議によって，いつでも，代表取締役を解職する権限を有する（362条２項３号，399条の13第１項３号）。"},{"l":5,"m":"代表取締役","sb":"","i":"A","r":"(平30I問題13イ)","q":"指名委員会等設置会社以外の取締役会設置会社においては，代表取締役の解職は，取締役会の決議によって行われる。","a":true,"c":"362条2項3号,399条の13第1項3号。","e":"取締役会は，その決議によって，いつでも，代表取締役を解職する権限を有する（362 条２項３号）。代表取締役の選定および解職権限は，取締役会の重要な監督権限の一つである。"},{"l":6,"m":"代表取締役","sb":"","i":"B","r":"(令2I問題10イ・平25I問題9イ)","q":"株式会社は，代表取締役その他の代表者がその職務を行うについて第三者に加えた損害を賠償する責任を負う。","a":true,"c":"350条。","e":"350 条は，代表者の不法行為（故意または過失によって他人の権利を侵害する行為）によって他人に加えた損害についても株式会社が責任を負う旨を定めているのである。"},{"l":7,"m":"代表取締役","sb":"","i":"C","r":"","q":"代表取締役の職務代行者選任の仮処分命令により選任された代表取締役の職務を代行する者は，株式会社の常務に属しない行為を一切することができない。","a":false,"c":"352条1項。","e":"代表取締役の職務代行者選任の仮処分命令により選任された代表取締役の職務を代行する者は，仮処分命令に別段の定めがある場合を除き，株式会社の常務に属しない行為をするには，裁判所の許可を得なければならない。ここで，常務に属しない行為について裁判所の許可を得なかった場合，職務執行者の行為は無効である（352 条２項本文）。ただし，株式会社は，これをもって善意の第三者に対抗することができない（352条２項ただし書）。"},{"l":8,"m":"代表取締役","sb":"","i":"A","r":"(令6I問題11ア類・令2I問題10エ・平25I問題9エ)","q":"代表取締役の解職により，株式会社の代表取締役が欠けた場合には，新たに選定された代表取締役が就任するまで，解職された当該代表取締役は，なお代表取締役としての権利義務を有する。","a":false,"c":"351条1項。","e":"代表取締役が欠けた場合または定款で定めた代表取締役の員数が欠けた場合には，任期の満了または辞任により退任した代表取締役は，新たに選定された代表取締役が就任するまで，なお代表取締役としての権利義務を有する。なお，代表執行役の場合にも留任義務がある（420条３項，401条２項）。この留任義務は，解職された代表取締役には適用されない。"},{"l":9,"m":"代表取締役","sb":"","i":"B","r":"","q":"代表取締役が欠けた場合または定款で定めた代表取締役の員数が欠けた場合において，裁判所は，必要があると認めるときは，利害関係人の申立てにより，一時代表取締役の職務を行うべき者を選任することができる。","a":true,"c":"351条2項。","e":"また，裁判所は，一時代表取締役の職務を行うべき者を選任した場合には，株式会社がその者に対して支払う報酬の額を定めることができる（351条３項）。"},{"l":10,"m":"代表取締役","sb":"","i":"B","r":"(平30I問題13ア類)","q":"指名委員会等設置会社以外の取締役会設置会社において，代表取締役の氏名および住所は登記しなければならない。","a":true,"c":"911条3項14号。","e":"代表取締役の氏名および住所は絶対的登記事項である。"},{"l":11,"m":"代表取締役","sb":"","i":"A","r":"","q":"指名委員会等設置会社以外の取締役会設置会社において，当該取締役会設置会社の業務を執行する取締役は，株式会社の業務に関する一切の裁判上または裁判外の行為をする権限を有する。","a":false,"c":"349条4項参照。","e":"指名委員会等設置会社以外の株式会社において，代表取締役は，株式会社の業務に関する一切の裁判上または裁判外の行為をする権限を有する。代表権の包括性についての規定である。また，指名委員会等設置会社の代表執行役の代表権についても同様に，包括的な代表権が付与されている（420条３項）。"},{"l":12,"m":"代表取締役","sb":"","i":"A","r":"(平25I問題9ア)","q":"株式会社は，定款により代表取締役の代表権に制限を加えた場合には，そのような制限を知らない第三者には，当該制限を対抗することはできない。","a":true,"c":"349条5項。","e":"代表権の不可制限性である。また，指名委員会等設置会社の代表執行役の代表権についても同様に，包括的な代表権が付与されている（420条３項）。"},{"l":13,"m":"代表取締役","sb":"","i":"A","r":"(令6I問題11イ・平26II問題8ウ)","q":"取締役会設置会社以外の株式会社の業務に関する裁判外の行為をする代表取締役の権限につき，その一部を制限する旨の定款の定めは，無効である。","a":false,"c":"349条5項。","e":"代表取締役の代表権に加えた制限は，善意の第三者に対抗することができないとされており，無効となるわけではない。"},{"l":14,"m":"代表取締役","sb":"","i":"B","r":"","q":"最高裁判所の判例によれば，代表取締役が取締役会の決議を経てすることを要する対外的取引を取締役会の決議なしでした場合は，当該取引の効力は無効となる。","a":false,"c":"最判昭40年9月22日。","e":"最高裁判所の判例によれば，取締役会の決議を経ずになされた「重要な財産の処分および譲受け」や「多額の借財」等の行為は，原則として有効であるが，相手方が悪意または有過失の場合に限り無効となる。"},{"l":15,"m":"代表取締役","sb":"","i":"B","r":"","q":"最高裁判所の判例によれば，株式会社の代表取締役が取締役会の決議を経ないで重要な業務執行に該当する取引をした場合に，取締役会の決議を経ていないことを理由とする当該取引の無効は，特段の事情がない限り，当該株式会社以外の者も主張することができる。","a":false,"c":"最判平21年4月17日。","e":"最高裁判所の判例によれば，代表取締役が362条４項に違反し，取締役会の決議を経ないで重要な業務執行に当たる取引をした場合，取締役会の決議を経ていないことを理由とする当該取引の無効は，原則として株式会社のみが主張できるとしている。例外として，当該株式会社の取締役会が当該無効を主張する旨の決議をしているなどの特段の事情がある場合は，当該株式会社以外の者もその無効を主張することができる。"},{"l":16,"m":"代表取締役","sb":"","i":"A","r":"(令2II問題10エ・平24II問題11ウ類)","q":"監査役が監査役設置会社に対して負う損害賠償責任について，当該会社が当該監査役に対して訴えを提起する場合，当該会社を代表するのは，代表取締役である。","a":true,"c":"349条4項。","e":"代表取締役は，株式会社の業務に関する一切の裁判上または裁判外の行為をする権限を有する。したがって，会社を当事者とする訴訟において，会社を代表するのは代表取締役である。ただし，監査役設置会社と取締役との間の訴えにおいては，馴れ合い訴訟を防止するために，当該訴えについては，監査役が監査役設置会社を代表する（386 条１項）。"},{"l":17,"m":"代表取締役","sb":"","i":"B","r":"(平26II問題8エ)","q":"監査役設置会社でない取締役会設置会社以外の株式会社において，代表取締役が当該株式会社に対して訴えを提起する場合には，株主総会は，当該訴えについて当該株式会社を代表する者を定めることができる。","a":true,"c":"353条。","e":"代表取締役は株式会社の業務に関する一切の裁判上または裁判外の行為をする権限を有する（349 条４項）。したがって，株式会社が訴訟の当事者となる場合には，原則として代表取締役が当該訴訟について株式会社を代表する。しかし，株式会社と取締役の間の訴えの場面では，馴れ合いによる訴訟が行われるという弊害が生じるため，会社法は，この馴れ合い訴訟を防止するために，株式会社と取締役の間の訴えにおける会社代表者についての特例を設けている。"},{"l":18,"m":"代表取締役","sb":"","i":"B","r":"(平21問題10イ)","q":"取締役会設置会社（監査等委員会設置会社および指名委員会等設置会社を除く）であって，監査役設置会社でない株式会社が取締役に対して訴えを提起する場合において，取締役会は会社を代表する者を定めなければならない。","a":false,"c":"353条,364条。","e":"この場合においては，まず，① 株主総会が定めた代表者が株式会社を代表するが，当該会社代表者の定めがないときは，② 取締役会が定めた代表者が株式会社を代表する。そして取締役会においても定めがないときは，③ 代表取締役が当該株式会社を代表する。株式会社と取締役の間の訴えの場面では，馴れ合いによる訴訟が行われるという弊害が生じるため，会社法は，この馴れ合い訴訟を防止するために，株式会社と取締役の間の訴えにおける会社代表者についての特例を設けている。"},{"l":19,"m":"代表取締役","sb":"","i":"A","r":"(平23I問題9ア類・平21問題10ウ類)","q":"監査役設置会社が取締役に対して訴えを提起する場合には，株主総会および取締役会による会社代表者の定めがない場合に限り ，監査役が当該株式会社を代表する。","a":false,"c":"386条1項1号。","e":"監査役設置会社と取締役との間の訴訟については，いかなる場合であっても監査役が監査役設置会社を代表する。"},{"l":20,"m":"代表取締役","sb":"","i":"A","r":"(平23I問題9イ)","q":"監査役設置会社と取締役であった者との間の訴えについては，代表取締役が会社を代表する。","a":false,"c":"386条1項1号かっこ書。","e":"監査役設置会社と取締役であった者との間の訴えについても，監査役が会社を代表する。"},{"l":21,"m":"代表取締役","sb":"","i":"A","r":"(平23I問題9ウ)","q":"監査役設置会社と会計監査人との間の訴えについては，監査役が会社を代表する。","a":false,"c":"349条4項。","e":"会社と会計監査人との間の訴えは，代表取締役が会社を代表する。"},{"l":22,"m":"代表取締役","sb":"","i":"B","r":"","q":"株式会社は，代表取締役以外の取締役に社長，副社長その他株式会社を代表する権限を有するものと認められる名称を付した場合には，当該取締役がした行為について，善意の第三者に対してその責任を負う。","a":true,"c":"354条。","e":"表見代表取締役の規定である。当該規定の趣旨は，外観法理に基づき，取引の安全を図ることにある。なお，代表執行役にも同様に，表見代表執行役の規定がある（421条）。"},{"l":23,"m":"代表取締役","sb":"","i":"C","r":"","q":"最高裁判所の判例によれば，第三者が善意であっても重大な過失があるときは，表見代表取締役の規定は適用しないとしている。","a":true,"c":"最判昭52年10月14日。","e":"354 条の目的は第三者の正当な信頼を保護しようとする点にあり，相手方の重過失は悪意と同等に評価すべきだからである。"},{"l":24,"m":"代表取締役","sb":"","i":"B","r":"","q":"最高裁判所の判例によれば，株式会社の使用人が代表権を有するものと認められる名称でなした行為について，当該株式会社は，表見代表取締役の規定による責任を負うことはない。","a":false,"c":"最判昭35年10月14日。","e":"判例によると，株式会社の使用人が，当該株式会社の了解を得て代表権を有するものと認められる名称でなした行為について，当該株式会社は，表見代表取締役（354 条）の規定を類推適用することにより，善意の第三者に対してその責任を負うとしている。"},{"l":1,"m":"取締役の義務と報酬","sb":"競業避止義務と利益相反取引の制限","i":"A","r":"","q":"取締役が自己のために株式会社の事業の部類に属する取引をしようとするときは，当該取引について重要な事実を開示し，株式会社の承認を得なければならないが，第三者のために株式会社の事業の部類に属する取引をしようとするときは，株式会社の承認を得る必要はない。","a":false,"c":"356条1項1号。","e":"取締役が自己だけでなく第三者のために株式会社の事業の部類に属する取引をしようとする場合も，競業避止義務の対象となる。なお，指名委員会等設置会社における執行役についても，同様に競業避止義務が課されている（419条２項）。"},{"l":2,"m":"取締役の義務と報酬","sb":"競業避止義務と利益相反取引の制限","i":"A","r":"","q":"取締役会設置会社の取締役は，自己または第三者のために株式会社の事業の部類に属する取引をしようとするときは，株主総会の普通決議において，当該取引につき重要な事実を開示し，その承認を受けなければならない。","a":false,"c":"356条1項1号,365条1項。","e":"取締役会設置会社において，取締役が競業取引を行う場合は，取締役会において，当該取引につき重要な事実を開示し，その承認を得なければならない。ここで，承認機関を取締役会としているのは，取締役会による相互牽制による監督が期待できるほか，430 条により連帯責任を負う取締役によって構成される取締役会で，株式会社の利益保護を図れるのかを判断させるためであり，株主総会の承認機関としないのは，承認の適時性を確保するためである。これに対して，取締役会非設置会社における承認機関は，株主総会（普通決議）である（356条１項）。なお，承認機関は，利益相反取引（356条１項２号３号）についても同様である。"},{"l":3,"m":"取締役の義務と報酬","sb":"競業避止義務と利益相反取引の制限","i":"A","r":"(令6I問題12イ)","q":"取締役会設置会社においては，自己または第三者のために株式会社の事業の部類に属する取引をした取締役は，当該取引後，遅滞なく，当該取引についての重要な事実を取締役会に報告しなければならない。","a":true,"c":"365条2項。","e":"取締役会設置会社における事後報告は，実際に行われた競業取引が事前に承認された範囲内かどうか，取締役に善管注意義務または忠実義務違反がなかったかどうかを取締役会が事後的に確認し，会社に損害が生じる可能性がある場合は事後措置を適切に講じることができるようにするためのものである。なお，取締役会非設置会社においては，事後報告は必要ない。"},{"l":4,"m":"取締役の義務と報酬","sb":"競業避止義務と利益相反取引の制限","i":"A","r":"(平24I問題10ア)","q":"取締役会設置会社以外の株式会社において，取締役が，自己または第三者のために株式会社の事業の部類に属する取引をしようとするときは，株主総会において，当該取引につき重要な事実を開示し，その承認を受けなければならない。","a":true,"c":"356条1項1号。","e":"当該株主総会の決議は普通決議（309条１項）である。"},{"l":5,"m":"取締役の義務と報酬","sb":"競業避止義務と利益相反取引の制限","i":"A","r":"(平31II問題12ア)","q":"監査等委員である取締役が，自己のために株式会社の事業の部類に属する取引をしようとするときは，当該取引につき取締役会の承認を受けることを要しない。","a":false,"c":"356条1項1号,365条1項。","e":"監査等委員である取締役にも競業避止義務は課されるため，本肢は誤りである。"},{"l":6,"m":"取締役の義務と報酬","sb":"競業避止義務と利益相反取引の制限","i":"C","r":"(令4I問題11ア)","q":"取締役が取締役会の承認を受けずに競業取引を行った場合，当該取引は無効である。","a":false,"c":"","e":"会社の承認を得ないで競業取引が行われたとしても，当該取引は相手方の善意・悪意を問わず有効である。なぜなら，競業取引自体は取締役と第三者との取引であり，第三者は規制対象外なのでその保護を図る必要があるからである。"},{"l":7,"m":"取締役の義務と報酬","sb":"競業避止義務と利益相反取引の制限","i":"A","r":"(令4I問題11イ類・平28II問題12ア・平24I問題10イ類)","q":"取締役が，自己のために競業取引をすることについて当該取引につき重要な事実を開示して取締役会の承認を受けた場合，当該取締役の株式会社に対する任務懈怠責任の追及において，当該取引によって当該取締役が得た利益の額は，当該取締役の任務懈怠によって当該株式会社に生じた損害の額と推定される。","a":false,"c":"423条2項。","e":"取締役が，会社の承認を得ることなく，自己または第三者のために株式会社の事業の部類に属する取引をしたときは，当該取引によって取締役または第三者が得た利益の額は，株式会社に生じた損害の額と推定する。競業取引における損害額の推定規定の趣旨は，競業取引によって会社が被った損害の額の立証が困難な場合に，その立証を容易にすることである。これに対して，会社の承認を得ている場合は，当該推定規定は適用されない。"},{"l":8,"m":"取締役の義務と報酬","sb":"競業避止義務と利益相反取引の制限","i":"A","r":"(平24I問題10ウ)","q":"取締役が，自己または第三者のために株式会社の事業の部類に属する取引をしたことによって会社に損害が生じたときは，株主総会の承認の有無を問わず，その任務を怠ったものと推定される。","a":false,"c":"","e":"競業取引については，利益相反取引のような任務懈怠の推定規定（423条３項）は設けられていない。"},{"l":9,"m":"取締役の義務と報酬","sb":"競業避止義務と利益相反取引の制限","i":"B","r":"","q":"取締役会設置会社において，取締役が利益相反取引をしようとするときには，株主総会の普通決議において，当該取引につき重要な事実を開示し，その承認を受けなければならない。","a":false,"c":"356条1項2号3号,365条1項。","e":"取締役会設置会社において，取締役が利益相反取引をしようとする場合は，取締役会において，当該取引につき重要な事実を開示し，その承認を得なければならない。ここで，承認機関を取締役会としているのは，取締役会による相互牽制による監督が期待できるほか，430 条により連帯責任を負う取締役によって構成される取締役会で，株式会社の利益保護を図れるのかを判断させるためであり，株主総会の承認機関としないのは，承認の適時性を確保するためである。これに対して，取締役会非設置会社における承認機関は，株主総会（普通決議）である（356条１項）。"},{"l":10,"m":"取締役の義務と報酬","sb":"競業避止義務と利益相反取引の制限","i":"B","r":"","q":"取締役会設置会社においては，自己または第三者のために株式会社と取引をした取締役は，当該取引後，遅滞なく，当該取引についての重要な事実を取締役会に報告しなければならない。","a":true,"c":"365条2項。","e":"取締役会設置会社における事後報告は，実際に行われた利益相反取引が事前に承認された範囲内かどうか，取締役に善管注意義務または忠実義務違反がなかったかどうかを取締役会が事後的に確認し，会社に損害が生じる可能性がある場合は事後措置を適切に講じることができるようにするためのものである。一方，取締役会非設置会社において，事後報告は必要ない。"},{"l":11,"m":"取締役の義務と報酬","sb":"競業避止義務と利益相反取引の制限","i":"B","r":"(平28II問題12イ)","q":"取締役会設置会社である甲株式会社の代表権のない取締役Ａが，第三者のために甲株式会社と取引をする場合，Ａ以外の者が甲株式会社を代表して当該取引をするときには，当該取引については甲株式会社の取締役会による承認が必要である。","a":true,"c":"356条1項2号,365条1項。","e":"取締役が自己だけでなく第三者のために株式会社と取引をしようとする場合も，利益相反取引の規制の対象となる。"},{"l":12,"m":"取締役の義務と報酬","sb":"競業避止義務と利益相反取引の制限","i":"B","r":"","q":"株式会社が取締役の債務を保証する場合，当該取締役は，株主総会（取締役会設置会社にあっては，取締役会）において，当該取引につき重要な事実を開示し，その承認を受けなければならない。","a":true,"c":"356条1項3号,365条1項。","e":"利益相反取引の規制の対象となるのは，直接取引と間接取引である。間接取引とは，形式的には会社と第三者との間の取引であるが，実質的には会社と取締役との利益が相反する取引である。なお，指名委員会等設置会社における執行役についても，同様に利益相反取引の制限がなされている（419条２項）。"},{"l":13,"m":"取締役の義務と報酬","sb":"競業避止義務と利益相反取引の制限","i":"A","r":"(平26II問題10ア)","q":"取締役会設置会社の会計参与が自己のために当該取締役会設置会社と取引をしようとするときは，当該会計参与は，取締役会において，その承認を受けなければならない。","a":false,"c":"","e":"会計参与には，競業避止義務や利益相反取引の制限の規定（356 条）といった利益衝突を防止するための規定は設けられていない。また，忠実義務についても課せられていない（355条参照）。"},{"l":14,"m":"取締役の義務と報酬","sb":"競業避止義務と利益相反取引の制限","i":"C","r":"(平28II問題12ウ)","q":"最高裁判所の判例によれば，取締役会設置会社である株式会社に対し取締役が無利息，無担保で金銭を貸し付ける行為は，取締役会による承認を必要としない。","a":true,"c":"最判昭38年12月6日。","e":"株式会社の利益が害されないためである。"},{"l":15,"m":"取締役の義務と報酬","sb":"競業避止義務と利益相反取引の制限","i":"B","r":"(平28II問題12エ)","q":"最高裁判所の判例によれば，取締役を債務者とし，株式会社を債権者とする金銭消費貸借契約が取締役会の承認を受けていない場合，当該取締役は当該取引が無効であることを当該株式会社に対して主張することができる。","a":false,"c":"最判昭48年12月11日。","e":"取締役を債務者とし，株式会社を債権者とする金銭消費貸借契約が取締役会の承認を受けていない場合，当該取引は無効であるが，取締役や第三者が株式会社に対して無効を主張することは許されない。これは，利益相反取引の規制の趣旨が会社の利益を保護するという点にあるからである。"},{"l":16,"m":"取締役の義務と報酬","sb":"競業避止義務と利益相反取引の制限","i":"B","r":"","q":"最高裁判所の判例によれば，株式会社の株式全部を取締役が所有しているような一人会社において，当該取締役が利益相反取引を行う場合は，当該株式会社の承認を得る必要はない。","a":true,"c":"最判昭45年8月20日。","e":""},{"l":17,"m":"取締役の義務と報酬","sb":"競業避止義務と利益相反取引の制限","i":"B","r":"","q":"最高裁判所の判例によれば，取締役会設置会社において，利益相反取引に関して株主全員の同意がある場合には，取締役会の承認を得る必要はない。","a":true,"c":"最判昭49年9月26日。","e":"なお，判例によれば，この場合であっても，取引の効力は有効であるとしている。"},{"l":18,"m":"取締役の義務と報酬","sb":"競業避止義務と利益相反取引の制限","i":"A","r":"","q":"利益相反取引によって会社に損害が生じたときであっても，会社の承認を得ていた場合，会社が利益相反取引をすることを決定した取締役は，その任務を怠ったものと推定されることはない。","a":false,"c":"423条3項。","e":"利益相反取引は会社に損害を及ぼすおそれの大きい行為であることから，利益相反取引によって会社に損害が生じたときは，会社の承認の有無にかかわらず，取締役に任務を怠らなかったことの立証責任を転換することで会社の利益の保護を図っているのである。"},{"l":19,"m":"取締役の義務と報酬","sb":"競業避止義務と利益相反取引の制限","i":"A","r":"","q":"自己のために直接取引をした取締役の株式会社に対する損害賠償責任は，任務を怠ったことが当該取締役の責めに帰することができない事由によるものであることをもって免れることができない。","a":true,"c":"428条1項。","e":"自己のための直接取引は，利益相反性が著しく高いため，会社に対して無過失の損害賠償責任を負うこととされている。"},{"l":20,"m":"取締役の義務と報酬","sb":"競業避止義務と利益相反取引の制限","i":"A","r":"(平24I問題10エ)","q":"取締役が，自己のために株式会社の事業の部類に属する取引をした場合，株主総会の承認を受けていたときであっても，当該取引によって会社に生じた損害についての会社に対する賠償責任は，任務を怠ったことが当該取締役の責めに帰することができない事由によるものであることをもって免れることができない。","a":false,"c":"","e":"競業取引については，利益相反取引のような自己のために直接取引をした取締役の無過失責任の規定（428条１項）は設けられていない。"},{"l":21,"m":"取締役の義務と報酬","sb":"競業避止義務と利益相反取引の制限","i":"A","r":"(令4I問題11エ)","q":"第三者のために取締役会設置会社と取引をした取締役の当該取締役会設置会社に対する任務懈怠責任は，任務を怠ったことが当該取締役の責めに帰することができない事由によるものであることをもって，免れることができない。","a":false,"c":"428条1項。","e":"自己のために直接取引をした取締役の株式会社に対する損害賠償責任は，任務を怠ったことが当該取締役の責めに帰することができない事由によるものであることをもって免れることができない。すなわち，自己のために直接取引をした取締役は，株式会社に対して無過失の損害賠償責任を負う。利益相反取引の中でも，自己のための直接取引は，利益相反性が著しく高いためである。"},{"l":1,"m":"取締役の義務と報酬","sb":"取締役の報酬等","i":"A","r":"","q":"指名委員会等設置会社以外の株式会社の取締役の報酬等のうち額が確定しているものについては，定款にその額を定めていないときは，株主総会の普通決議によって定める。","a":true,"c":"361条1項1号。","e":"取締役の報酬規制の趣旨は，お手盛りを防止することにある。本来，報酬等の決定は業務執行に関する決定として取締役会等の業務執行機関の権限に属するはずである。しかし，報酬等の決定を取締役会等に委ねると，不当に高額の報酬を定めるというお手盛りが生じるため，取締役の報酬等については定款または株主総会の決議によって定めることを要求し，会社の利益の保護を図っているのである。"},{"l":2,"m":"取締役の義務と報酬","sb":"取締役の報酬等","i":"A","r":"","q":"指名委員会等設置会社以外の株式会社の取締役の報酬等のうち額が確定しているものについて株主総会の普通決議でその額を定める場合，当該議案を株主総会に提出した取締役は，当該株主総会において，当該事項を相当とする理由を説明しなければならない。","a":true,"c":"361条4項。","e":"取締役の報酬等に関する事項を定め，またはこれを改定する議案を提出する場合に取締役の説明を要求したのは，株主が当該報酬の妥当性を判断できるようにするためである。"},{"l":3,"m":"取締役の義務と報酬","sb":"取締役の報酬等","i":"A","r":"","q":"指名委員会等設置会社以外の株式会社の取締役の報酬等のうち当該株式会社の募集株式については，定款または株主総会の決議によって，募集株式の数の上限を定めなければならない。","a":true,"c":"361条1項3号。","e":"なお，種類株式発行会社にあっては，募集株式の種類および種類ごとの数の上限を定める必要がある。"},{"l":4,"m":"取締役の義務と報酬","sb":"取締役の報酬等","i":"A","r":"(平27II問題8イ)","q":"指名委員会等設置会社以外の株式会社の取締役は，定款に別段の定めがない場合であっても，株主総会の決議を経ずに，株式会社から賞与を受けることができる。","a":false,"c":"361条1項。","e":"取締役の報酬，賞与その他の職務執行の対価として株式会社から受ける財産上の利益（報酬等）については，定款に定めがないときは，株主総会の決議により定める。"},{"l":5,"m":"取締役の義務と報酬","sb":"取締役の報酬等","i":"B","r":"(令4II問題10ア)","q":"監査等委員会設置会社においては，報酬等に関する事項は，監査等委員である取締役とそれ以外の取締役とを区別して定めなければならない。","a":true,"c":"361条2項。","e":"また，監査等委員である各取締役の報酬等について定款の定めまたは株主総会の決議がないときは，当該報酬等は，定款または株主総会により決定した報酬等の範囲内において，監査等委員である取締役の協議によって定める（361条３項）。さらに，監査等委員である取締役は，株主総会において，監査等委員である取締役の報酬等について意見を述べることができる（361 条５項）。監査等委員である取締役の報酬規制の趣旨は，監査等委員である取締役の独立性を確保することである。"},{"l":6,"m":"取締役の義務と報酬","sb":"取締役の報酬等","i":"B","r":"(令4II問題10ウ類・平31II問題13エ類)","q":"監査等委員である取締役以外の取締役の報酬等については，監査等委員会が選定する監査等委員であっても，株主総会において監査等委員会の意見を述べることができない。","a":false,"c":"361条6項。","e":"監査等委員会が選定する監査等委員は，株主総会において，監査等委員である取締役以外の取締役の報酬等について監査等委員会の意見を述べることができる。このように，監査等委員会には，指名委員会等設置会社における報酬委員会に準ずる経営評価の役割が期待されているのである。"},{"l":7,"m":"取締役の義務と報酬","sb":"取締役の報酬等","i":"A","r":"(平23II問題11ア)","q":"指名委員会等設置会社または監査等委員会設置会社を除く株式会社において，取締役は，株主総会において，取締役の報酬等について意見を述べることが認められている。","a":false,"c":"361条参照。","e":"取締役（監査等委員である取締役を除く）には，報酬に関する意見陳述権は認められていない。"},{"l":8,"m":"取締役の義務と報酬","sb":"取締役の報酬等","i":"B","r":"(平31II問題13ア)","q":"監査等委員会設置会社における取締役の報酬等のうち額が確定しているものについては，定款または株主総会の決議によって取締役全員に支給する報酬等の総額のみを定め，各取締役の報酬等の決定を取締役会に委ねることが認められる。","a":false,"c":"361条2項。","e":"監査等委員会設置会社においては，取締役の報酬等に関する事項は，監査等委員である取締役とそれ以外の取締役とを区別して定めなければならない 。監査等委員である取締役の独立性を確保するためである。したがって，取締役全員に支給する報酬等の総額のみを定めることはできないため，本肢は誤りである。"},{"l":9,"m":"取締役の義務と報酬","sb":"取締役の報酬等","i":"A","r":"","q":"監査役会設置会社（公開大会社であるものに限る）であって，金融商品取引法第 24 条１項の規定によりその発行する株式について有価証券報告書を内閣総理大臣に提出しなければならない株式会社の取締役会は，取締役の報酬等の内容として定款または株主総会の決議による定めがある場合（取締役の個人別の報酬等の内容が定められている場合を除く）には，当該定めに基づく取締役の個人別の報酬等の内容についての決定に関する方針として法務省令で定める事項を決定しなければならない。","a":true,"c":"361条7項1号。","e":"「報酬等の決定方針」の決定が求められるのは，取締役の報酬等が取締役に対して職務を適切に執行するインセンティブを付与するための重要な手段であることに鑑み，取締役に対してどのような内容の報酬等を支払い，どのようなインセンティブを付与するかという取締役の報酬等に関する方針が重要なものであると考えられるためである。"},{"l":10,"m":"取締役の義務と報酬","sb":"取締役の報酬等","i":"B","r":"","q":"最高裁判所の判例によれば，使用人兼取締役の使用人としての給与は，使用人の受ける給与体系が明確に確立されており，かつ，それによって給与が支給されている場合であっても，取締役としての報酬額に含めて，定款または株主総会で定めなければならない。","a":false,"c":"最判昭60年3月26日。","e":"判例によると，使用人兼取締役の使用人としての給与は，使用人の受ける給与体系が明確に確立しており，かつ，それによって給与が支給されている限り，361 条１項の報酬等には該当しないとしている。したがって，この場合には使用人としての給与を定款または株主総会で定める必要はない。"},{"l":11,"m":"取締役の義務と報酬","sb":"取締役の報酬等","i":"B","r":"(平20問題13ア)","q":"最高裁判所の判例によれば，取締役に対する退職慰労金は，定款または株主総会で定めなければならない報酬等に該当しない。","a":false,"c":"最判昭39年12月11日。","e":"判例によると，退職慰労金は，361 条１項の報酬等に該当するとしている。退任した取締役の在職中の功労金としての性質の他に，取締役の在任中における職務執行の対価の後払いという性質を有するし，退職慰労金を決める取締役会において，退任した取締役に多くの退職慰労金を支給しておけば，自己が退職するときに多くの退職慰労金を支給してもらえるという期待が生じることは否定できないため，お手盛りの弊害があるからである。"},{"l":12,"m":"取締役の義務と報酬","sb":"取締役の報酬等","i":"B","r":"(平20問題13イ類)","q":"最高裁判所の判例によれば，指名委員会等設置会社および監査等委員会設置会社を除く取締役会設置会社（監査役会設置会社ではないものとする）において，株主総会は，その決議により取締役報酬の総額を定めれば足り，各取締役に対する配分の決定を取締役会の決議に委ねてもよい。","a":true,"c":"最判昭60年3月26日。","e":"取締役の報酬等の規制の趣旨は，お手盛りを防止することで会社の利益の保護を図ることにあるが，株主総会で取締役全員の報酬等の総額または総額の上限が定められていれば，お手盛りは生じないためである。"},{"l":13,"m":"取締役の義務と報酬","sb":"取締役の報酬等","i":"B","r":"","q":"最高裁判所の判例によれば，取締役の報酬については，株主総会の決議により，取締役全員の報酬の総額の最高限度額を定め，各取締役に対する配分の決定を取締役会の決定に委任することができ，その委任を受けた取締役会は，その決議によって，各取締役の報酬の額の決定を代表取締役に再委任することができる。","a":true,"c":"最判昭31年10月5日。","e":"判例によると，株主総会で取締役全員の報酬等の総額または総額の上限を定めた上で，個々の取締役への具体的な配分の決定が取締役会に一任された場合，当該具体的な配分の決定を代表取締役に再一任することができる。個々の取締役への報酬の具体的な配分の決定は，取締役会の専決事項ではなく，総額または総額の上限が定められていればお手盛りは生じないためである。"},{"l":14,"m":"取締役の義務と報酬","sb":"取締役の報酬等","i":"B","r":"","q":"最高裁判所の判例によれば，株主総会が取締役に対する退職慰労金の金額，支払時期，支払方法を取締役会に一任する旨の決議は，いかなる場合であっても無効としている。","a":false,"c":"最判昭39年12月11日。","e":"判例によると，① 会社の業績，退任取締役の勤続年数，担当業務，功績の軽重などから算定した一定の基準による決定方法が慣例となっており，② その基準の存在を株主が知ることができる状況であって，③ 当該基準の範囲内において定めることを明示または黙示して決議がなされた場合には，取締役会に一任することも許されるとしている。なぜなら，この場合は，実質的にお手盛りの弊害がないといえるからである。"},{"l":15,"m":"取締役の義務と報酬","sb":"取締役の報酬等","i":"A","r":"","q":"指名委員会等設置会社以外の株式会社の取締役の報酬等のうち金銭でないもの（当該株式会社の募集株式および募集新株予約権を除く）については，その具体的な内容を定款または株主総会によって定めることを要する。","a":true,"c":"361条1項6号。","e":""},{"l":16,"m":"取締役の義務と報酬","sb":"取締役の報酬等","i":"B","r":"(平20問題13エ)","q":"最高裁判所の判例によれば，定款または株主総会決議によって取締役の報酬額が具体的に定められた後でも，株主総会が当該取締役につき無報酬とする決議をした場合には，当該取締役は当然に報酬請求権を失う。","a":false,"c":"最判平4年12月18日。","e":"361 条に基づき取締役の報酬等の額が具体的に定められた場合，その報酬額は株式会社と取締役間の委任契約の内容となるので，その後に当該取締役の職務内容に著しい変更があっても，当該取締役が同意しない限り，報酬額を変更することができない。"},{"l":17,"m":"取締役の義務と報酬","sb":"取締役の報酬等","i":"B","r":"","q":"最高裁判所の判例によれば，株主総会の決議を経ずに支払われた取締役の報酬について事後的に株主総会の決議を経た場合には，当該株主総会の決議の内容等に照らして，取締役の報酬等の規制の趣旨目的を没却するような特段の事情があると認められない限り，取締役の報酬の支払いは株主総会の決議に基づく有効なものとなる。","a":true,"c":"最判平17年2月15日。","e":"株主総会の決議を経ずに取締役に報酬が支払われた場合であっても，その後株主総会の決議を経ることにより，事後的ではあるもののお手盛りの弊害を防止するという取締役の報酬等の規制の趣旨は達せられる。そのため，株主総会の決議の内容等に照らして，当該趣旨目的を没却するような特段の事情があると認められない限り，取締役の報酬の支払いは株主総会の決議に基づく有効なものになる。"},{"l":1,"m":"取締役の義務と報酬","sb":"取締役の報告義務","i":"A","r":"(平25II問題10ア・平23I問題12イ)","q":"監査役設置会社の取締役は，株式会社に著しい損害を及ぼすおそれがある事実があることを発見したときは，直ちに，当該事実を株主に報告しなければならない。","a":false,"c":"357条。","e":"取締役は，株式会社に著しい損害を及ぼすおそれのある事実があることを発見したときは，直ちに，当該事実を株主（監査役設置会社では監査役，監査役会設置会社では監査役会，監査等委員会設置会社では監査等委員会）に報告しなければならない。当該趣旨は，会社の損害を未然に防止することにある。なお，当該規定は，指名委員会等設置会社においては適用されず（419 条３項），同趣旨の報告は，執行役から監査委員に対してなされるべきものとされている（419条１項）。"},{"l":2,"m":"取締役の義務と報酬","sb":"取締役の報告義務","i":"A","r":"(平23I問題12ア)","q":"取締役会設置会社ではなく監査役設置会社でもない会社の取締役は，会社に著しい損害を及ぼすおそれのある事実があることを発見したときは，直ちに，当該事実を株主に報告しなければならない。","a":true,"c":"357条1項。","e":""},{"l":3,"m":"取締役の義務と報酬","sb":"取締役の報告義務","i":"A","r":"(平23I問題12ウ・平22I問題13ア)","q":"監査役会設置会社の取締役は，会社に著しい損害を及ぼすおそれのある事実があることを発見したときは，直ちに，当該事実を監査役会に報告しなければならない。","a":true,"c":"357条1項","e":""},{"l":4,"m":"取締役の義務と報酬","sb":"取締役の報告義務","i":"A","r":"(平30II問題12ウ・平25I問題11ア)","q":"取締役会設置会社でない大会社において，取締役は，定款に別段の定めがある場合を除き，その過半数をもって，株式会社の業務の適正を確保するための体制の整備を決定しなければならない。","a":true,"c":"348条4項。","e":"大会社であれば，取締役会設置会社であるか否かを問わず，内部統制システムの整備義務があり（348条４項，362条５項），その決定は，各取締役に委任することができない（348条３項４号，362条４項６号）。ある程度以上の規模の株式会社には，その業務の適正を確保するための組織体制の構築が必要であるという考え方に基づくものである。また，監査等委員会設置会社および指名委員会等設置会社においては，大会社か否かを問わず，内部統制システムの整備義務がある（399条の13第１項１号ロハ，２項，416条１項１号ロホ，２項）。"},{"l":5,"m":"取締役の義務と報酬","sb":"取締役の報告義務","i":"C","r":"(平25I問題11ウ)","q":"取締役会設置会社である監査役設置会社において，取締役会は，取締役が株主に報告すべき事項の報告をするための体制の整備を決定しなければならない。","a":false,"c":"362条4項6号,会社法施行規則100条2項。","e":"監査役設置会社以外の取締役会設置会社が，取締役の職務の執行が法令および定款に適合することを確保するための体制その他株式会社の業務の適正を確保するために必要なものとして法務省令で定める体制の整備を決定する場合は，当該体制には，取締役が株主に報告すべき事項の報告をするための体制を含むものとする。なぜなら，監査役設置会社以外の株式会社（指名委員会等設置会社および監査等委員会設置会社を除く）において，取締役は，株式会社に著しい損害を及ぼすおそれのあることを発見したときは，直ちに，当該事実を株主に報告しなければならないとされているからである（357条１項）。"},{"l":6,"m":"取締役の義務と報酬","sb":"取締役の報告義務","i":"B","r":"(平30II問題12エ・平25I問題11エ類)","q":"監査役設置会社は，内部統制システムの整備について決定したときは，その決定の内容の概要および当該内部統制システムの運用状況の概要について，事業報告に記載しなければならない。","a":true,"c":"会社法施行規則118条2号。","e":""},{"l":1,"m":"監査役","sb":"監査役の権限","i":"A","r":"","q":"会計参与設置会社の監査役は，取締役だけでなく，会計参与の職務執行も監査する。","a":true,"c":"381条1項。","e":""},{"l":2,"m":"監査役","sb":"監査役の権限","i":"A","r":"(令2II問題11ウ)","q":"監査役会設置会社でない監査役設置会社において，監査役が２人以上ある場合，監査役は，全員が共同して監査報告を作成しなければならない。","a":false,"c":"381条1項後段,会社法施行規則129条,会社計算規則122条,127条。","e":"監査役設置会社においては，監査役が２人以上ある場合であっても，各監査役が監査報告を作成する。これは，監査役会設置会社においても同様であり，各監査役が作成した監査報告に基づき，監査役会の決議によって，監査役会としての監査報告（監査役会監査報告）を作成しなければならないとされている（390 条２項１号，会社法施行規則130条１項，会社計算規則128条１項）。"},{"l":3,"m":"監査役","sb":"監査役の権限","i":"A","r":"","q":"監査役は，いつでも，取締役および会計参与ならびに支配人その他の使用人に対して事業の報告を求めることができる。","a":true,"c":"381条2項。","e":""},{"l":4,"m":"監査役","sb":"監査役の権限","i":"A","r":"","q":"監査役は，その職務を行うため必要があるときに限り，監査役設置会社の業務および財産の状況の調査をすることができる。","a":false,"c":"381条2項。","e":"監査役は，いつでも，監査役設置会社の業務および財産の状況の調査をすることができる。"},{"l":5,"m":"監査役","sb":"監査役の権限","i":"A","r":"","q":"監査役は，いつでも，監査役設置会社の子会社に対して事業の報告を求め，またはその子会社の業務および財産の状況の調査をすることができる。","a":false,"c":"381条3項。","e":"監査役は，その職務を行うため必要があるときは，監査役設置会社の子会社に対して事業の報告を求め，またはその子会社の業務および財産の状況の調査をすることができる。"},{"l":6,"m":"監査役","sb":"監査役の権限","i":"A","r":"(平31II問題11ア・平25II問題10ウ・平22I問題13ウ)","q":"取締役会設置会社において，監査役は，取締役が不正の行為をし，もしくは当該行為をするおそれがあると認めるとき，または法令もしくは定款に違反する事実もしくは著しく不当な事実があると認めるときは，遅滞なく，その旨を取締役会に報告しなければならない。","a":true,"c":"382条。","e":"監査役は，取締役が不正の行為をし，もしくは当該行為をするおそれがあると認めるとき，または法令もしくは定款に違反する事実もしくは著しく不当な事実があると認めるときは，遅滞なく，その旨を取締役（取締役会設置会社では取締役会）に報告しなければならない。なお，当該報告義務に会社の損害の発生可能性は要件とされていない。この報告に基づき，取締役会の業務執行の監督権限が適切に発揮されることが期待されている。また，「遅滞なく」という要件は，「直ちに」という要件よりは若干の時間的余裕が認められるが，可能な限り迅速に報告す
