である場合には，株主総会の決議は不要であるという基準を設けた。したがって，譲渡する資産の帳簿価額が当該株式会社の総資産額の５分の１を超えない場合，重要な一部であるか否かを問うまでもなく，取締役会等の決定で事業の一部の譲渡をすることができる。これに対して，譲渡する資産の帳簿価額が当該株式会社の総資産額の５分の１を超えるものについては，さらに他の要素を勘案したうえで重要な一部であるかどうかを決定すべきこととなる。"},{"l":8,"m":"事業譲渡等","sb":"事業譲渡等の承認等の手続","i":"A","r":"(平29I問題16ウ・平25I問題16ウ類)","q":"株式会社が外国会社からその事業の全部を譲り受ける場合には，株主総会の特別決議による承認を要しない。","a":false,"c":"467条1項3号,309条2項11号。","e":"株式会社は，他の会社（外国会社その他の法人も含む）の事業の全部の譲受けをする場合には，その効力発生日の前日までに，原則として，株主総会の特別決議によってその承認を受けなければならない。"},{"l":9,"m":"事業譲渡等","sb":"事業譲渡等の承認等の手続","i":"A","r":"(令4II問題16イ)","q":"株式会社が他の株式会社からその事業の重要な一部を譲り受ける場合には，当該事業の譲受けに係る契約を承認する株主総会の決議を要しない。","a":true,"c":"467条1項3号参照。","e":"467条１項において，事業譲渡等として会社法上の手続規制が置かれているのは事業の「全部の」譲受け（467条１項３号）である。よって，事業の「一部の」譲受けは，事業譲渡等に該当しないため，株主総会の決議を要しない。"},{"l":10,"m":"事業譲渡等","sb":"事業譲渡等の承認等の手続","i":"B","r":"(平27I問題14ア)","q":"株式会社が個人商人の営業の全部を譲り受ける場合には，株主総会の特別決議を必要としない。","a":true,"c":"467条1項各号参照。","e":"株式会社が他の会社（外国会社その他の法人を含む）の事業の全部の譲受けをする場合には，株主総会の特別決議が必要となるが（467条１項３号，309条２項11号），個人商人の営業の全部を譲り受ける場合には株主総会の特別決議は不要である。"},{"l":11,"m":"事業譲渡等","sb":"事業譲渡等の承認等の手続","i":"B","r":"(平25I問題16ア類)","q":"株式会社は，事業の全部の賃貸をする場合には，原則として，その効力発生日の前日までに，株主総会の特別決議によってその承認を受けなければならない。","a":true,"c":"467条1項4号,309条2項11号。","e":""},{"l":12,"m":"事業譲渡等","sb":"事業譲渡等の承認等の手続","i":"B","r":"(平29I問題16ア)","q":"株式会社がその事業の重要な一部を賃貸する場合には，株主総会の特別決議による承認を要しない。","a":true,"c":"467条1項4号,309条2項11号。","e":"株式会社は，事業の全部の賃貸をする場合には，原則として，株主総会の特別決議を要するが，その事業の一部を賃貸する場合は，株主総会の決議を要しない。"},{"l":13,"m":"事業譲渡等","sb":"事業譲渡等の承認等の手続","i":"A","r":"","q":"株式会社は，他の会社の事業の全部の譲受けをする場合において，譲り受ける資産に当該株式会社の株式が含まれるときは，取締役は，その承認を行う株主総会において，当該株式に関する事項を説明しなければならない。","a":true,"c":"467条2項。","e":"他の会社の事業の全部の譲受けによる自己株式の取得（155条10号）は，やむを得ない取得であるため認められるが，その際，取締役に説明義務が課せられている。"},{"l":14,"m":"事業譲渡等","sb":"事業譲渡等の承認等の手続","i":"B","r":"(令3問題18エ・平30II問題17エ)","q":"最高裁判所の判例によれば，事業譲渡について譲渡会社の株主総会決議の手続が必要であるのにそれを経ないまま事業譲渡が行われた場合，そのことは当該事業譲渡の無効原因であるが，譲受会社がそのことについて善意かつ無重過失であったときは，当該譲渡会社は当該事業譲渡の無効を主張することができない。","a":false,"c":"最判昭61年9月11日。","e":"最高裁判所の判例によれば，株主総会の決議を欠いた事業譲渡（467 条１項１号２号）は無効である。なぜなら，事業譲渡は株式会社および株主にとって重要事項であるし，譲受会社も当該事業譲渡について株主総会の決議が必要であることを当然知るべきだからである。また，信義則に反して認められない場合を除いて，その無効は誰でも主張できるとし，譲受会社からの無効主張も認められる。これを認めないと，譲渡会社が無効を主張するまで譲受会社が当該事業譲渡を有効なものとして扱うことを余儀なくされるなど，著しく不安定な立場に置かれることになるためである。"},{"l":15,"m":"事業譲渡等","sb":"事業譲渡等の承認等の手続","i":"B","r":"(令3問題17ア類・平29II問題17エ)","q":"事業譲渡により譲渡会社の株主が不利益を被るおそれがあるとき，当該譲渡会社の株主は，会社法に基づき，当該事業譲渡をやめることを当該譲渡会社に対して請求することができる。","a":false,"c":"","e":"事業譲渡等については，吸収合併等や新設合併等の場合（784条の２，796条の２，805条の２）と異なり，差止請求の規定は設けられていない。"},{"l":16,"m":"事業譲渡等","sb":"事業譲渡等の承認等の手続","i":"A","r":"(令4II問題16ウ類・平28II問題17エ類)","q":"株式会社が事業の全部の譲渡をしようとする場合において，譲受会社が譲渡会社の議決権の過半数に相当する株式を有しているときは，当該譲渡会社の株主総会の決議によって事業譲渡の承認を受ける必要はない。","a":false,"c":"468条1項。","e":"事業譲渡等に係る契約の相手方が事業譲渡等をする株式会社の特別支配会社である場合には，被支配会社は，株主総会の決議による承認が不要となる。これを略式事業譲渡等という。ここで，特別支配会社とは，ある株式会社の総株主の議決権の 10 分の９以上を他の会社および当該他の会社が発行済株式の全部を有する株式会社その他これに準ずるものとして法務省令で定める法人が有している場合における当該他の会社をいう（468条１項かっこ書）。"},{"l":17,"m":"事業譲渡等","sb":"事業譲渡等の承認等の手続","i":"B","r":"(平20問題15エ)","q":"事業の重要な一部の譲渡につき，譲受会社が譲渡会社の特別支配会社である場合には，譲渡会社では事業譲渡契約を承認する株主総会決議を要しない。","a":true,"c":"468条1項。","e":"問題16の解説参照。"},{"l":18,"m":"事業譲渡等","sb":"事業譲渡等の承認等の手続","i":"B","r":"","q":"株式会社が事業の一部を譲渡する場合において，当該譲渡により譲り渡す資産の帳簿価額が当該株式会社の総資産額の５分の１を超えない場合については，株主総会の決議によって事業譲渡の承認を受ける必要はない。","a":true,"c":"467条1項2号かっこ書。","e":"当該事業の譲渡は，事業の重要な一部の譲渡に該当しない。したがって，株主総会の特別決議によって承認を受ける必要はない。"},{"l":19,"m":"事業譲渡等","sb":"事業譲渡等の承認等の手続","i":"B","r":"","q":"株式会社が他の会社の事業の全部を譲り受ける場合において，当該他の会社の事業の全部の対価として交付する財産の帳簿価額の総額が，当該株式会社の純資産額の５分の１を超えない場合は，当該株式会社において株主総会の決議による承認を受ける必要はない。","a":true,"c":"468条2項。","e":"簡易事業譲受けである。"},{"l":20,"m":"事業譲渡等","sb":"事業譲渡等の承認等の手続","i":"C","r":"","q":"株式会社が他の会社の事業の全部を譲り受ける場合に，当該対価の額が当該株式会社の純資産額の５分の１を超えない場合であっても，事業全部の譲受けをする旨の通知を行った日から２週間以内に，１株以上を有する株主が当該事業の全部の譲受けに反対する旨を当該株式会社に通知したときは，効力発生日の前日までに，株主総会の決議によって承認を受けなければならない。","a":false,"c":"468条3項。","e":"株式会社が他の会社の事業の全部を譲り受ける場合に，当該対価の額が当該株式会社の純資産額の５分の１を超えない場合であっても，事業全部の譲受けをする旨の通知を行った日から２週間以内に，一定の数の株式を有する株主が当該事業の全部の譲受けに反対する旨を当該株式会社に通知したときは，効力発生日の前日までに，株主総会の決議によって承認を受けなければならない。なお，簡易事業譲受けを阻止することができる一定の数とは，① 特別決議の成立を阻止できる数（会社法施行規則138条１号～３号），または，② 定款で定めた数（会社法施行規則138条４号）である。"},{"l":21,"m":"事業譲渡等","sb":"事業譲渡等の承認等の手続","i":"B","r":"(令4II問題16ア類・平28II問題17イ類)","q":"株式会社がその子会社の株式の一部を譲渡することにより，当該株式会社が効力発生日において当該子会社の議決権の総数の過半数の議決権を有しない場合には，その効力発生日の前日までに，株主総会の決議によって，当該譲渡契約の承認を受けなければならない。","a":false,"c":"467条1項2号の2。","e":"株主総会による承認が必要となる親会社による子会社の株式等の譲渡とは，株式会社の子会社の株式または持分の全部または一部の譲渡であって，① 当該譲渡により譲り渡す株式または持分の帳簿価額が当該株式会社の総資産額として法務省令で定める方法により算定される額の５分の１（定款で厳格にすることが可能）を超え，かつ，② 当該株式会社が効力発生日において当該子会社の議決権の総数の過半数の議決権を有しない場合である。親会社による子会社の株式等の譲渡は，事業譲渡等に該当する。"},{"l":22,"m":"事業譲渡等","sb":"事業譲渡等の承認等の手続","i":"A","r":"(平24I問題17エ類)","q":"株式会社が事業の全部の譲渡をする場合は，必ず，反対株主の株式買取請求が認められる。","a":false,"c":"469条1項1号。","e":"事業の全部の譲渡をする場合において，譲渡会社が，承認決議と同時に解散の決議（471 条１項３号）がされたときは，反対株主の株式買取請求権は認められない。この場合は，清算手続によって残余財産の分配（504 条）がなされるためである。"},{"l":23,"m":"事業譲渡等","sb":"事業譲渡等の承認等の手続","i":"A","r":"","q":"事業譲渡等をするために株主総会の決議を要する場合，当該株主総会において議決権を行使することができる株主が反対株主の株式買取請求権を行使することができるのは，当該株主総会において当該株主が議決権を行使しなかったときである。","a":false,"c":"469条2項1号イ。","e":"事業譲渡等をする場合に株主総会の決議を要する場合の反対株主は，①当該株主総会に先立って当該事業譲渡等に反対する旨を当該株式会社に対し通知し，かつ，当該株主総会において当該事業譲渡等に反対した株主，② 当該株主総会において議決権を行使することができない株主（469条２項１号ロ）である。"},{"l":24,"m":"事業譲渡等","sb":"事業譲渡等の承認等の手続","i":"A","r":"","q":"事業譲渡等の契約の相手方が当該事業譲渡等をする株式会社の特別支配会社である場合において，株主総会の決議を要しない場合は，すべての株主に反対株主の株式買取請求権が与えられる。","a":false,"c":"469条2項2号。","e":"事業譲渡等をするために株主総会（種類株主総会を含む）の決議を要しない場合の反対株主は，略式事業譲渡等（468条１項）における特別支配会社を除いて，すべての株主である。"},{"l":1,"m":"事業譲渡等","sb":"事後設立","i":"C","r":"","q":"株式会社の成立後２年以内に，その成立する前から存在する財産で，その事業のために継続して使用するものを当該株式会社の純資産額の５分の１を超える対価で取得する契約は，その効力発生日の前日までに，株主総会の特別決議によってその承認を受けなければならない。","a":true,"c":"467条1項5号。","e":"事後設立である。事後設立を行う場合は，株主総会の特別決議が必要である（309条２項11号）。この事後設立は，発起設立および募集設立で会社が設立された場合に限られる。つまり，新設合併，新設分割，株式移転により会社が設立された場合は除かれる（467 条１項５号ただし書き）。また，定款をもって，純資産額の５分の１という基準を加重（例えば，10分の１など）することもできる。なお，事後設立は変態設立事項（28条）ではないので，検査役の調査は不要である。"},{"l":2,"m":"事業譲渡等","sb":"事後設立","i":"C","r":"","q":"株式会社の成立後２年以内に，その成立する前から存在する財産で，その事業のために継続して使用するものを当該株式会社の純資産額の５分の１を超える対価で取得する契約を締結する場合，当該契約を承認する株主総会において議決権を行使することができない株主は，反対株主の株式買取請求権を行使することができる。","a":false,"c":"","e":"事後設立は，467 条１項５号に規定されているものであるが，468 条１項が規定している事業譲渡等には含まれていない。ここで，事業譲渡等に含まれない理由であるが，事後設立の規制は，現物出資，財産引受の規制の潜脱防止を目的としているものであり，467条１項１～４号の事業譲渡等とは性質が異なるためである。したがって，事後設立には株主総会の特別決議が要求されるのみであり，反対株主の株式買取請求権の規定は適用されない。"},{"l":1,"m":"事業譲渡等","sb":"競業避止義務","i":"B","r":"(令2I問題1ア類)","q":"事業を譲渡した会社は，当事者が別段の意思表示をしても，同一の市町村の区域内およびこれに隣接する市町村の区域内においては，その事業を譲渡した日から20年間は，同一の事業を行ってはならない。","a":false,"c":"21条1項。","e":"事業を譲渡した会社は，当事者の別段の意思表示がない限り，同一の市町村の区域内およびこれに隣接する市町村の区域内においては，その事業を譲渡した日から 20 年間は，同一の事業を行ってはならない。譲渡会社に競業避止義務を課した趣旨は，事業譲渡の実効性を確保することにある。なお，会社が個人商人に事業を譲渡した場合であっても，同様の扱いとされる（24条1項，以下，問題４まで同じ）。"},{"l":2,"m":"事業譲渡等","sb":"競業避止義務","i":"B","r":"(令2I問題1イ類・平28II問題1ウ類)","q":"事業を譲渡した会社が負う競業避止義務は，譲受会社との間の特約で排除することができない。","a":false,"c":"21条1項。","e":"21条１項は任意規定であり，当事者の別段の意思表示（特約）によって，競業避止義務を軽減または排除したり，加重することが可能である。"},{"l":3,"m":"事業譲渡等","sb":"競業避止義務","i":"A","r":"(平30I問題1ウ類・平24I問題17イ類・平22II問題1ア類)","q":"事業を譲渡した会社は，譲受会社との間の特約により競業禁止期間について 20 年よりも長い期間を定めることができるが，当該期間に限度は設けられていない。","a":false,"c":"21条2項。","e":"譲渡会社が同一の事業を行わない旨の特約をした場合，当該特約は，その事業を譲渡した日から 30 年の期間内に限り，その効力を有するとされている。事業の自由を過度に制限するのは妥当ではないためである。"},{"l":4,"m":"事業譲渡等","sb":"競業避止義務","i":"B","r":"","q":"事業を譲渡した会社が競業避止義務を負わない場合であっても，不正の競争の目的をもって同一の事業を行ってはならない。","a":true,"c":"21条3項。","e":"不正競争目的の競業は，地域や時期を問わず一切禁止されている。"},{"l":1,"m":"事業譲渡等","sb":"譲渡会社の商号を使用した譲受会社の責任等","i":"A","r":"(平22II問題1エ類)","q":"事業を譲り受けた会社は，譲渡会社の事業によって生じた債務を弁済する責任を負う。","a":false,"c":"22条1項。","e":"事業を譲り受けた会社が譲渡会社の商号を引き続き使用する場合には，その譲受会社も，譲渡会社の事業によって生じた債務を弁済する責任を負う。当該規定の趣旨は，債権者の信頼を保護することにある。なお，会社が個人商人に事業を譲渡した場合であっても，同様の扱いとされる（24条1項，以下，問題４まで同じ）。"},{"l":2,"m":"事業譲渡等","sb":"譲渡会社の商号を使用した譲受会社の責任等","i":"A","r":"(平26I問題1エ類・平22II問題1イ類)","q":"事業を譲り受けた会社が譲渡会社の商号を引き続き使用する場合であっても，事業を譲り受けた後，遅滞なく，譲受会社がその本店の所在地において譲渡会社の債務を弁済する責任を負わない旨を登記した場合，譲受会社は，譲渡会社の事業によって生じた債務を弁済する責任を負わない。","a":true,"c":"22条2項前段。","e":"また，事業を譲り受けた後，遅滞なく，譲受会社および譲渡会社から第三者に対しその旨の通知をした場合において，その通知を受けた第三者についても同様である（22条２項後段）。"},{"l":3,"m":"事業譲渡等","sb":"譲渡会社の商号を使用した譲受会社の責任等","i":"B","r":"","q":"譲受会社が商号を続用することにより譲渡会社の債務を弁済する責任を負う場合，当該譲渡会社の責任は，消滅することはない。","a":false,"c":"22条3項。","e":"譲受会社が商号を続用することにより譲渡会社の債務を弁済する責任を負う場合には，譲渡会社の責任は，事業を譲渡した日後２年以内に請求または請求の予告をしない債権者に対しては，その期間を経過した時に消滅する。その後は，譲受会社のみが責任を負うことになる。"},{"l":4,"m":"事業譲渡等","sb":"譲渡会社の商号を使用した譲受会社の責任等","i":"A","r":"(令6I問題1ウ類・平28II問題1エ類・平25I問題16イ類)","q":"譲受会社が商号を続用することにより譲渡会社の債務を弁済する責任を負う場合において，譲渡会社の事業によって生じた債権について，譲受会社にした弁済は，その効力を有しない。","a":false,"c":"22条4項。","e":"譲受会社が商号を続用することにより譲渡会社の債務を弁済する責任を負う場合において，譲渡会社の事業によって生じた債権について，譲受会社にした弁済は，弁済者が善意でかつ重大な過失がないときは，その効力を有する。当該規定の趣旨は，債務者の信頼を保護することにある。"},{"l":5,"m":"事業譲渡等","sb":"譲渡会社の商号を使用した譲受会社の責任等","i":"C","r":"(令3問題18イ)","q":"預託金会員制のゴルフクラブの名称がゴルフ場の事業主体を表示するものとして用いられている場合において，ゴルフ場の事業の譲渡がされ，譲渡会社が用いていたゴルフクラブの名称を譲受会社が継続して使用しているときには，当該譲受会社が譲受後遅滞なく当該ゴルフクラブの会員によるゴルフ場施設の優先的利用を拒否したなどの特段の事情がない限り，当該譲受会社は，会員が当該譲渡会社に交付した預託金の返還義務を負う。","a":true,"c":"最判平20年6月10日。","e":"判例は，分割会社がゴルフ場の事業主体を表すものとして用いていたゴルフクラブの名称を承継会社が引き続き使用しているときは，会社分割後遅滞なく，会員によるゴルフ場施設の優先的利用を拒否したなどの特段の事情がない限り，承継会社は，会社法22 条１項の類推適用により，当該ゴルフクラブの会員が分割会社に交付した預託金の返還義務を負うとしている。"},{"l":1,"m":"事業譲渡等","sb":"譲受会社の債務の引受け","i":"A","r":"(令2I問題1エ類)","q":"譲受会社が譲渡会社の商号を引き続き使用しない場合においても，譲渡会社の事業によって生じた債務を引き受ける旨の広告をしたときは，譲渡会社の債権者は，その譲受会社に対して弁済の請求をすることができる。","a":true,"c":"23条1項。","e":"この結果，譲渡会社および譲受会社の両社が責任を負う。これは，債権者の信頼を保護する趣旨である。債権者との関係において，債務引受けの手続がなければ，譲受会社は当然には債務者とはならないのが原則であるが，会社が債務を引き受ける旨の広告をしたときは，当該広告を債権者が信頼する可能性があるためである。なお，会社が個人商人の営業を譲り受けた場合であっても，同様の扱いとされる（24条２項，以下，問題２まで同じ）。"},{"l":2,"m":"事業譲渡等","sb":"譲受会社の債務の引受け","i":"A","r":"(平31I問題1イ類・平22II問題1ウ)","q":"譲受会社が，譲渡会社の事業によって生じた債務を引き受ける旨の広告をしたことにより，譲渡会社の債務を弁済する責任を負う場合，譲渡会社の責任は，当該広告があった日後２年以内に請求または請求の予告をしない債権者に対しては，その期間を経過した時に消滅する。","a":true,"c":"23条2項。","e":"なお，その後は，譲受会社のみが責任を負うことになる。"},{"l":1,"m":"事業譲渡等","sb":"詐害事業譲渡に係る譲受会社に対する債務の履行の請求","i":"B","r":"(令2I問題1ウ類)","q":"譲渡会社が譲受会社に承継されない債務の債権者を害することを知って事業を譲渡した場合であっても，当該債権者は，その譲受会社に対して，当該債務の履行を請求することができない。","a":false,"c":"23条の2第1項本文。","e":"譲渡会社が譲受会社に承継されない債務の債権者（残存債権者）を害することを知って事業を譲渡した場合には，残存債権者は，その譲受会社に対して，承継した財産の価額を限度として，当該債務の履行を請求することができる。ただし，その譲受会社が事業の譲渡の効力が生じた時において残存債権者を害することを知らなかったときは，この限りでない（23 条の２第１項ただし書)。事業譲渡においても，譲受会社に承継されない残存債権者を害する詐害的な事業譲渡が行われるおそれがあるため，会社分割の場合と同様に，残存債権者を保護する規定を設けている。なお，会社が個人商人の営業を譲り受けた場合であっても，同様の扱いとされる（24条２項）。"}]},{"n":9,"name":"解散・清算","qs":[{"l":1,"m":"解散","sb":"解散事由","i":"B","r":"","q":"株式会社は，定款によって存続期間を定めることができない。","a":false,"c":"471条1号。","e":"株式会社は，定款で任意に存続期間を定めることができる。したがって，株式会社が定款に存続期間を定めたときは，株式会社はその存続期間の満了によって当然に解散する。"},{"l":2,"m":"解散","sb":"解散事由","i":"B","r":"","q":"株式会社は，定款によって解散事由を定めることができる。","a":true,"c":"471条2号。","e":"株式会社は，定款で任意に解散事由を定めることができる。したがって，株式会社が定款に解散事由を定めたときは，株式会社はその解散事由の発生によって当然に解散する。"},{"l":3,"m":"解散","sb":"解散事由","i":"B","r":"(平27I問題16ア・平25II問題18ア類)","q":"事業の全部を譲渡した株式会社が解散するには，解散する旨の株主総会決議が必要である。","a":true,"c":"471条3号,309条2項11号。","e":"株式会社が事業の全部を譲渡したことは解散事由とされていない（471 条各号）。株式会社は，株主総会の特別決議によって解散する。"},{"l":4,"m":"解散","sb":"解散事由","i":"B","r":"","q":"株式会社の解散の訴えの判決が確定した場合，当該株式会社は解散する。","a":true,"c":"471条6号。","e":""},{"l":5,"m":"解散","sb":"解散事由","i":"B","r":"(平25II問題18イ)","q":"株式会社は，事業に関して有する権利義務の全部を対象として吸収分割をした場合には，当該吸収分割によって解散する。","a":false,"c":"471条各号参照。","e":"吸収分割により分割会社の事業に関して有する権利および義務の全部が分割されたとしても，分割会社は承継会社より対価の交付を受けるため，分割会社は解散しない。"},{"l":6,"m":"解散","sb":"解散事由","i":"B","r":"(平24I問題18エ)","q":"吸収合併の無効の訴えに係る請求を認容する判決が確定したときは，当該吸収合併後存続する会社は解散する。","a":false,"c":"471条各号参照。","e":"吸収合併無効判決の確定により合併は将来に向かって無効となり（839 条），存続会社については，解散せず，変更の登記がなされる（937条３項２号）。"},{"l":1,"m":"解散","sb":"休眠会社のみなし解散","i":"C","r":"","q":"休眠会社とは，株式会社であって，当該株式会社に関する登記が最後にあった日から，10年を経過したものをいう。","a":false,"c":"472条1項かっこ書。","e":"休眠会社とは，株式会社であって，当該株式会社に関する登記が最後にあった日から，12年を経過したものをいう。非公開会社（監査等委員会設置会社および指名委員会等設置会社を除く）の取締役の任期は，定款によって 10 年まで伸長することができることとされているため（332条２項），株式会社は，少なくとも10年に一度は取締役の改選に伴う変更登記の必要が生じることから，多少余裕をみて，最後の登記後 12 年を経過した会社を休眠会社としたのである。"},{"l":2,"m":"解散","sb":"休眠会社のみなし解散","i":"C","r":"","q":"株式会社は，休眠会社となった日から１か月後に，解散したものとみなす。","a":false,"c":"472条1項。","e":"休眠会社は，法務大臣が休眠会社に対し２か月以内に法務省令で定めるところによりその本店の所在地を管轄する登記所に事業を廃止していない旨の届出をすべき旨を官報に公告した場合において，その届出をしないときは，その２か月の期間の満了の時に，解散したものとみなす。ただし，当該期間内に当該休眠会社に関する登記があった場合は，この限りではない（472 条１項ただし書）。また，登記所は，当該公告があったときは，休眠会社に対して公告の内容を通知しなければならない（472条２項）。"},{"l":1,"m":"解散","sb":"株式会社の継続","i":"B","r":"(平25II問題18ウ類)","q":"株式会社は，定款で定めた解散の事由の発生によって解散した場合には，清算が結了するまで，株主総会の特別決議によって，株式会社を継続することができる。","a":true,"c":"473条,309条2項11号。","e":"株式会社は，① 定款で定めた存続期間の満了，② 定款で定めた解散の事由の発生，③ 株主総会の決議（特別決議）によって解散した場合には，清算が結了するまで，株主総会の特別決議によって，株式会社を継続することができる。"},{"l":2,"m":"解散","sb":"株式会社の継続","i":"B","r":"","q":"株式会社は，解散命令により解散した場合には，清算が結了するまで，株主総会の特別決議によって，株式会社を継続することができる。","a":false,"c":"473条参照。","e":"株式会社は，解散命令により解散した場合には，清算が結了するまで，株主総会の特別決議によっても，株式会社を継続することはできない。"},{"l":1,"m":"解散","sb":"解散した株式会社の合併等の制限","i":"B","r":"","q":"株式会社が解散した場合には，当該株式会社は，当該株式会社を存続会社とする合併をすることができない。","a":true,"c":"474条1号。","e":"株式会社が解散した場合，当該解散した株式会社は，① 当該会社を存続会社とする合併，② 吸収分割による他の会社がその事業に関して有する権利義務の全部または一部の承継をすることはできない（474 条）。なぜなら，これらの行為は，解散して清算の目的の範囲内で存続するものとされている会社の行為として馴染まない行為だからである。"},{"l":2,"m":"解散","sb":"解散した株式会社の合併等の制限","i":"B","r":"(平25II問題18エ)","q":"株式会社は，株主総会の決議によって解散した場合には，他の会社がその事業に関して有する権利義務の一部を，吸収分割によって承継することができない。","a":true,"c":"474条2号。","e":"上記問題１の解説参照。解散して清算の目的の範囲内で存続するものとされている会社の行為として馴染まない行為だからである。"},{"l":3,"m":"解散","sb":"解散した株式会社の合併等の制限","i":"B","r":"","q":"株式会社が解散した場合には，当該株式会社は，吸収分割株式会社となることができない。","a":false,"c":"474条参照。","e":"解散した株式会社は分割会社になることはできる。"},{"l":1,"m":"清算","sb":"総則","i":"B","r":"","q":"株式会社は，解散した場合，必ず清算をしなければならない。","a":false,"c":"475条1号かっこ書。","e":"株式会社は，解散した場合であっても，合併により解散した場合，および，破産手続開始の決定により解散した場合であって当該破産手続が終了していない場合は清算の対象とならない。"},{"l":2,"m":"清算","sb":"総則","i":"B","r":"(平31I問題18エ)","q":"新設合併の無効の訴えに係る請求を認容する判決が確定したことは，新設合併設立株式会社の清算の開始原因となる。","a":false,"c":"475条各号参照。","e":"新設合併の無効判決が確定した場合は，新設合併は将来に向かって無効となる（839 条）。新設合併の場合には，設立会社は清算手続を経ることなく解散・消滅し，消滅会社は将来に向かって復活する。また，新設合併の効力発生後に設立会社が負担した債務は，当事会社が連帯して責任を負い（843 条１項２号），設立会社が取得した財産は，当事会社の共有に属する（同条２項本文）。"},{"l":3,"m":"清算","sb":"総則","i":"B","r":"(令5II問題17ウ・平30II問題3エ)","q":"株式会社は，設立の無効の訴えに係る請求を認容する判決が確定した場合は，清算をしなければならない。","a":true,"c":"475条2号。","e":"会社の設立無効判決が確定した場合には，会社の設立の効力は将来に向かって失われるため（839 条），すでに発生した権利関係の整理が必要であることから，清算開始原因とされている。"},{"l":4,"m":"清算","sb":"総則","i":"B","r":"(平31I問題18イ)","q":"新設分割の無効の訴えに係る請求を認容する判決が確定したことは，新設分割設立株式会社の清算の開始原因となる。","a":false,"c":"475条各号参照。","e":"新設分割の無効判決が確定した場合は，新設分割は将来に向かって無効となる（839 条）。新設分割の場合には，設立会社は清算手続を経ることなく解散・消滅し，会社分割の対象とされた権利義務は将来に向かって分割会社に復帰する。また，新設分割の効力発生後に設立会社が負担した債務や取得した財産は分割会社に帰属し（843 条１項４号，２項ただし書），共同新設分割の場合には債務は各当事会社の連帯債務（同条１項４号），財産は各当事会社の共有となる（同条２項本文）。"},{"l":5,"m":"清算","sb":"総則","i":"B","r":"(令5II問題17エ・平31I問題18ア)","q":"株式移転の無効の訴えに係る請求を認容する判決が確定したことは，株式移転設立完全親会社の清算の開始原因となる。","a":true,"c":"475条3号。","e":"株式移転の無効判決が確定した場合は，株式移転は将来に向かって無効となる（839 条）。そのため，既に発生した権利関係の整理が必要であることから，株式移転の無効の訴えに係る請求を認容する判決が確定したことは，株式移転設立完全親会社の清算の開始原因となる。"},{"l":6,"m":"清算","sb":"総則","i":"C","r":"","q":"清算株式会社は，募集株式の発行等を行うことができない。","a":false,"c":"487条2項1号参照。","e":"清算株式会社は，募集株式の発行等，および，社債の発行を行うことができる（489 条６項５号参照）。募集株式の発行等は，子会社の清算を円滑に進めるために親会社が資金提供を行う場合等，実際のニーズがあり，社債の発行も，清算過程において現金の調達等のために必要なことがあるからである。"},{"l":7,"m":"清算","sb":"総則","i":"C","r":"","q":"清算株式会社は，清算の目的の範囲内において，清算が結了するまでは，なお存続するものとみなす。","a":true,"c":"476条。","e":"清算株式会社は，法人格としては従前の会社と全く同一であるが，その権利能力の範囲は清算の目的の範囲内に縮減される。したがって，営業取引をなす能力は，清算の目的のために行われる場合を除き，認められない。"},{"l":1,"m":"清算","sb":"清算株式会社の機関","i":"C","r":"","q":"清算株式会社は，１人または２人以上の取締役を置かなければならない。","a":false,"c":"477条1項。","e":"清算株式会社には，１人または２人以上の清算人を置かなければならない。清算人は，清算中の株式会社において，現務の完了，債権の取立て，債務の弁済，残余財産の分配等の清算事務を行う機関であり，清算株式会社は必ず清算人を置かなければならない。すなわち，清算株式会社では，取締役に代わって１人または２人以上の清算人が清算に係る業務を執行するのである（482条１項）。"},{"l":2,"m":"清算","sb":"清算株式会社の機関","i":"C","r":"","q":"清算株式会社は，定款の定めによって，清算人会，監査役または監査役会を置くことができる。","a":true,"c":"477条2項。","e":""},{"l":3,"m":"清算","sb":"清算株式会社の機関","i":"C","r":"","q":"監査役を置く旨の定款の定めがある清算株式会社は，清算人会を置かなければならない。","a":false,"c":"477条3項。","e":"監査役会を置く旨の定款の定めがある清算株式会社は，清算人会を置かなければならない。"},{"l":4,"m":"清算","sb":"清算株式会社の機関","i":"C","r":"","q":"株式会社は，清算の開始原因に該当することとなった時において，公開会社または大会社であった清算株式会社は，監査役を置かなければならない。","a":true,"c":"477条4項。","e":"清算開始時に公開会社または大会社であった株式会社は，会社をめぐる利害関係者が類型的に多数に上るものと考えられることから，清算人を監査する機関の設置が必要であると考えられるためである。"},{"l":5,"m":"清算","sb":"清算株式会社の機関","i":"C","r":"(平27I問題16ウ)","q":"解散の時に監査役会設置会社であった清算株式会社は，監査役会を廃止する旨の定款変更をすることができない。","a":false,"c":"477条参照。","e":"清算株式会社においては，監査役会の設置義務はない。"},{"l":6,"m":"清算","sb":"清算株式会社の機関","i":"C","r":"","q":"清算の開始原因に該当することとなった時において指名委員会等設置会社であった清算株式会社において，監査役の設置義務がある場合は，監査委員が監査役となる。","a":true,"c":"477条6項。","e":"清算株式会社には，解散前の株式会社に係る機関設置の規定は適用されないため（477 条７項），指名委員会等を置くことはできない。"},{"l":7,"m":"清算","sb":"清算株式会社の機関","i":"C","r":"","q":"清算株式会社は，会計監査人を置くことができる。","a":false,"c":"477条7項。","e":"清算株式会社には，解散前の株式会社に係る機関設置の規定は適用されないため（477 条７項），取締役，取締役会，会計参与，会計監査人，監査等委員会および指名委員会等を置くことができない。"},{"l":8,"m":"清算","sb":"清算株式会社の機関","i":"C","r":"","q":"清算株式会社は，株主総会の決議により清算人を選任しなければならない。","a":false,"c":"478条1項。","e":"定款に別段の定めがある場合，または，株主総会において取締役以外の者を清算人に選任した場合を除き，取締役が清算人となる。したがって，株主総会の決議によって，清算人を選任しなければならないわけではない。そして，これらの方法によっても清算人となる者がいないときは，利害関係人の申立てにより，裁判所が清算人を選任することになる（478条２項）。"},{"l":9,"m":"清算","sb":"清算株式会社の機関","i":"C","r":"(平27I問題16イ)","q":"清算人は，その職務を行うに際して，清算株式会社に対し忠実義務を負わない。","a":false,"c":"482条4項,355条。","e":"清算人は，清算株式会社に対し，忠実義務を負う。"},{"l":1,"m":"清算","sb":"財産目録等","i":"C","r":"","q":"清算人会設置会社において，財産目録等は，清算人会の承認を受けなければならない。","a":true,"c":"492条2項。","e":"なお，清算開始時の財産目録等には監査役の監査が不要とされている。これは，清算手続の開始および開始時の株主総会の開催をなるべく早く行い，清算手続にかかる時間の節約を重視する趣旨であると考えられる。"},{"l":2,"m":"清算","sb":"財産目録等","i":"C","r":"","q":"財産目録等は，株主総会の承認を受ける必要はない。","a":false,"c":"492条3項。","e":"清算人は，財産目録等を株主総会に提出または提供し，その承認を受けなければならない。"},{"l":1,"m":"清算","sb":"残余財産の分配","i":"C","r":"","q":"清算株式会社は，存否または額について争いのある債権に係る債務についてその弁済をするために必要と認められる財産を留保した場合を除き，当該清算株式会社の債務を弁済した後でなければ，その財産を株主に分配することができない。","a":true,"c":"502条。","e":"清算株式会社は，当該清算株式会社の債務を弁済した後でなければ，その財産を株主に分配することができない。ただし，清算手続の迅速性を担保するために，存否または額について争いのある債権に係る債務についてその弁済をするために必要と認められる財産を留保した場合は，残余財産を分配することが認められる。"},{"l":2,"m":"清算","sb":"残余財産の分配","i":"B","r":"(平26I問題13ア)","q":"清算株式会社は，残余財産の分配をしようとするときは，株主総会の決議によって，残余財産の分配に関する事項を定めなければならない。","a":false,"c":"504条1項柱書。","e":"清算株式会社は，残余財産の分配をしようとするときは，清算人の決定（清算人会設置会社にあっては，清算人会の決議）によって，残余財産の分配に関する事項を定めなければならない。"},{"l":3,"m":"清算","sb":"残余財産の分配","i":"B","r":"(平27I問題16エ類)","q":"清算人会設置会社は，金銭以外の財産を残余財産として株主に分配することができる。この場合において，清算人会は，株主に金銭分配請求権の行使を認めるか否かを決定しなければならない。","a":false,"c":"504条1項1号,505条1項柱書。","e":"剰余金の配当において現物配当が認められる（454 条４項）のと同様に，残余財産の分配も金銭以外の財産による現物分配が認められる。しかし，剰余金の配当の場合と異なり，残余財産の分配の場面では，常に，株主に金銭分配請求権が与えられている点に相違がある（454条４項１号）。"},{"l":1,"m":"清算","sb":"清算事務の結了","i":"B","r":"(平26I問題13エ)","q":"清算株式会社は，清算事務が終了したときは，遅滞なく，決算報告を作成しなければならない。","a":true,"c":"507条1項。","e":""},{"l":2,"m":"清算","sb":"清算事務の結了","i":"B","r":"(令2II問題1エ)","q":"会社は，その本店の所在地における清算結了の登記によって消滅する。","a":false,"c":"","e":"清算事務の終了および株主総会による決算報告の承認により，清算は結了する。清算株式会社は，清算の目的の範囲内において，清算が結了するまでなお存続すると規定されているので（476 条），清算が結了すれば，会社の法人格は消滅する。清算を結了した場合は，決算報告承認の株主総会の日（507 条３項）から２週間以内に清算結了の登記をしなくてはならないが（929条１号），法人格の消滅の効力発生は登記ではなく，清算の結了自体である。"},{"l":1,"m":"清算","sb":"適用除外等","i":"B","r":"","q":"清算株式会社は，原則として，自己株式を取得することができない。","a":true,"c":"509条1項1号。","e":"なお，清算株式会社は，無償で取得する場合，その他法務省令で定める場合に限り，自己株式を取得することができる（509条３項）。"},{"l":2,"m":"清算","sb":"適用除外等","i":"B","r":"(平26I問題13イ)","q":"清算株式会社は，その株主に対し，剰余金の配当をすることができる。","a":false,"c":"509条1項2号。","e":"清算株式会社は，債権者に対する債務の弁済が優先され，株主は残余財産分配請求権を有するという地位にあるため，株主に対して行う払戻しは，残余財産の分配に限定されるべきである。したがって，清算株式会社は，その株主に対し，剰余金の配当をすることができない。"},{"l":3,"m":"清算","sb":"適用除外等","i":"B","r":"(平28I問題17ア)","q":"清算株式会社は，株式交換をすることができない。","a":true,"c":"509条1項3号。","e":""},{"l":4,"m":"清算","sb":"適用除外等","i":"B","r":"(平26I問題13ウ)","q":"清算株式会社は，その発行済株式の全部を他の株式会社に取得させる株式交換をすることができない。","a":true,"c":"509条1項3号。","e":""},{"l":5,"m":"清算","sb":"適用除外等","i":"B","r":"(平29II問題17ア)","q":"清算株式会社は，その事業の全部を他の会社に譲渡することができる。","a":true,"c":"509条1項各号参照。","e":"事業譲渡は清算手続として合理性があるという理由から禁止されていない。"},{"l":6,"m":"清算","sb":"適用除外等","i":"C","r":"","q":"清算株式会社が株式会社の特別支配株主である場合には，当該清算株式会社は，当該株式会社の株主に対して株式売渡請求をすることができない。","a":false,"c":"509条2項。","e":"特別支配株主の株式等売渡請求の規定（179条～179条の10）は，対象会社（売渡しの対象となる株式を発行している株式会社）が清算株式会社である場合には，適用しない。清算株式会社を対象会社とする株式等売渡請求については，清算手段としての合理性を欠き，必要性が乏しいことから，これを認めないこととしている。これは，清算株式会社が株式交換をすることにより他の会社の完全子会社となることが認められていないこと（509 条１項３号）を踏まえたものである。これに対して，清算株式会社が他の株式会社の特別支配株主である場合に，当該清算株式会社が株式等売渡請求をすることは禁止されていない。これは，清算株式会社が他の株式会社を対象会社とする株式等売渡請求を行って完全子会社としたうえで，当該他の株式会社の発行済株式のすべてを一括して第三者に売却することにより売却価格を高めることには，清算株式会社による財産の処分方法として一定の合理性があることによる。"}]},{"n":10,"name":"会社法総則","qs":[{"l":1,"m":"通則","sb":"","i":"B","r":"(平23I問題2ウ)","q":"会社の住所は，その本店の所在地にあるものとする。","a":true,"c":"4条。","e":""},{"l":2,"m":"通則","sb":"","i":"B","r":"","q":"会社がその事業としてする行為およびその事業のためにする行為は，商行為とする。","a":true,"c":"5条。","e":""},{"l":3,"m":"通則","sb":"","i":"B","r":"(平27II問題16ア・平22II問題15エ)","q":"外国会社がその事業としてする行為およびその事業のためにする行為は，商行為とはならない。","a":false,"c":"5条かっこ書。","e":"会社（外国会社を含む）がその事業としてする行為およびその事業のためにする行為は，商行為とする。"},{"l":1,"m":"会社の商号","sb":"","i":"B","r":"","q":"会社は，その名称以外のものを商号とすることができる。","a":false,"c":"6条1項。","e":"会社は，その名称を商号とする。会社が事業活動をする際には，自己を示す名称が必要であり，その名称を商号という。"},{"l":2,"m":"会社の商号","sb":"","i":"B","r":"","q":"株式会社は，その商号中に，株式会社という文字を用いなければならないが，合名会社，合資会社または合同会社は，その商号中に，それぞれの種類に対応した合名会社，合資会社または合同会社という文字を用いることは要求されていない。","a":false,"c":"6条2項。","e":"会社は，株式会社，合名会社，合資会社または合同会社の種類に従い，それぞれその商号中に株式会社，合名会社，合資会社または合同会社という文字を用いなければならない。また，その商号中に，他の種類の会社であると誤認されるおそれのある文字を用いてはならない（６条３項）。"},{"l":3,"m":"会社の商号","sb":"","i":"A","r":"","q":"会社は，事業の種類または内容と全く関係のない名称を商号として選定することはできない。","a":false,"c":"","e":"商号自由の原則により，会社は，原則として商号を自由に選定することができる。すなわち，事業の種類・内容と全く関係のない名称を商号として選定することも可能である。"},{"l":4,"m":"会社の商号","sb":"","i":"C","r":"","q":"会社でない者は，その名称または商号中に，会社であると誤認されるおそれのある文字を用いてはならない。","a":true,"c":"7条。","e":"会社について，その商号に自己の会社の種類を明示させて，取引の相手方に誤認させないようにしているが（６条２項），会社でない者が，その名称または商号中に，会社であると誤認されるおそれのある文字を用いることができるとした場合，やはり取引の相手方の利益が害されるため，会社でない者の名称または商号中に，会社であると誤認されるおそれのある文字を用いることは禁止されている。"},{"l":5,"m":"会社の商号","sb":"","i":"A","r":"(令6II問題1イ)","q":"何人も，不正の目的をもって，他の会社であると誤認されるおそれのある名称または商号を使用してはならない。","a":true,"c":"8条1項。","e":"これは，無断で商号等を使用された他の会社や一般公衆の利益の保護を図るためである。"},{"l":6,"m":"会社の商号","sb":"","i":"B","r":"(平23I問題2エ)","q":"会社は，一つの商号のみを用いることができる。","a":true,"c":"","e":"個人商人の場合は，営業の種類ごとに１個の商号を用いることが可能であるが，会社の商号は１個の商号しか用いることができない。会社にとってその商号は，当該会社の名称であるため，会社の法人格が１個である以上，商号は１個に限られるのが当然だからである。"},{"l":7,"m":"会社の商号","sb":"","i":"A","r":"(平28II問題1ア類)","q":"自己の商号を使用して事業または営業を行うことを他人に許諾した会社は，当該会社が当該事業を行うものと誤認して当該他人と取引をした者に対し，当該他人に代わって，当該取引によって生じた債務を弁済する責任を負う。","a":false,"c":"9条。","e":"会社が自己の商号を使用して事業または営業を行うことを他人に許諾した場合は，当該会社が当該事業を行うものと誤認して当該他人と取引をした者に対し，当該他人と連帯して，当該取引によって生じた債務を弁済する責任を負う。これを，名板貸人の責任という。名板貸人の責任の趣旨は，外観法理に基づき，取引の安全を図ることにある。"},{"l":8,"m":"会社の商号","sb":"","i":"B","r":"(令4II問題1ウ類・平27I問題1ア)","q":"最高裁判所の判例によれば，名板貸人としての責任が認められるためには，商号使用の許諾が明示的になされることを要し，黙示の許諾では不十分である。","a":false,"c":"最判昭30年9月9日。","e":"判例は，商号使用の許諾については，必ずしも明示の許諾であることを要せず，黙示の許諾でもよいとしている。黙示的許諾とは，他人が自己の商号を使用して事業または営業を行っていることを知っていながら黙認していた場合をいう。"},{"l":9,"m":"会社の商号","sb":"","i":"B","r":"","q":"最高裁判所の判例によれば，スーパーマーケットを経営している会社が，店舗の一部を個人商人に対しテナントとして賃貸し，営業させていた場合において，当該個人商人より購入した商品により相手方が損害を被った場合は，商号の使用を許諾した場合でなくとも，名板貸人の責任を負うとしている。","a":true,"c":"最判平7年11月30日。","e":"当該スーパーマーケットは，個人商人に営業をすることについて，商号の使用を許諾したわけではないが，個人商人の店舗の外観等から顧客は営業主体を誤認するおそれがあったため，類推適用を認めたものである。"},{"l":10,"m":"会社の商号","sb":"","i":"B","r":"(令4II問題1ア類・平31II問題1ウ・平27I問題1イ)","q":"最高裁判所の判例によれば名板貸人は，名板借人が当該名板貸人と業種の異なる営業を行うときは，特段の事情がない限り，名板貸人としての責任を負わない。","a":true,"c":"最判昭43年6月13日。","e":""},{"l":11,"m":"会社の商号","sb":"","i":"B","r":"(令4II問題1イ類・平27I問題1ウ)","q":"最高裁判所の判例によれば，名板貸人が営業を行うものと誤認して名板借人と取引をした者にその誤認について重大な過失があるときは，当該名板貸人は，当該取引によって生じた当該名板借人の債務につき，当該名板借人と取引をした者に対して責任を負わない。","a":true,"c":"最判昭41年1月27日。","e":"名板貸人の責任の規定が適用されるためには，名板貸人が取引主体であるという外観に対する取引の相手方の保護すべき信頼が必要である。この点，条文上は，「誤認」とされており過失については言及していないが，相手方には，「善意・無重過失」を必要と解するのが判例の見解である。なぜなら，名板貸人の責任の規定の目的は第三者の正当な信頼を保護しようとする点にあり，相手方の重過失は悪意と同等に評価すべきだからである。"},{"l":12,"m":"会社の商号","sb":"","i":"B","r":"(平27I問題1エ)","q":"最高裁判所の判例によれば，名板貸人は，名板借人が営業活動の際に交通事故に起因して負担した不法行為債務について，当該名板借人と連帯して弁済する責任を負う。","a":false,"c":"最判昭52年12月23日。","e":"判例は，名板借人が交通事故その他の不法行為に起因して負担するに至った損害賠償債務について，交通事故その他の不法行為が名板貸人と同種の事業活動を行うについてなされた場合であっても，当該行為は取引行為でなく，取引主体の誤認ということはないから，取引によって生じた債務に該当しないとしている。一方で，取引の外形をもつ不法行為，例えば，名板借人の詐欺的取引行為より発生した損害賠償債務については，取引主体の誤認の問題となるので，取引によって生じた債務に含まれるとしている（最判昭58年１月25日）。"},{"l":13,"m":"会社の商号","sb":"","i":"B","r":"(令4II問題1エ類)","q":"最高裁判所の判例によれば，名板貸人は，名板借人がした取引行為の外形をもつ不法行為により負担した損害賠償債務について，当該名板借人と連帯して弁済する責任を負う。","a":true,"c":"最判昭58年1月25日。","e":"上記問題12の解説参照。"},{"l":1,"m":"会社の使用人","sb":"支配人","i":"B","r":"(令3問題1ウ類・平21問題2イ)","q":"会社が支店の支配人を選任したときは，当該支店の所在地において，その登記をしなければならない。","a":false,"c":"918条。","e":"支配人の登記は，会社の本店の所在地においてしなければならない。"},{"l":2,"m":"会社の使用人","sb":"支配人","i":"B","r":"(平27II問題1イ類)","q":"会社が支配人に対して与える代理権は，当該会社が支配人の選任登記をすることにより発生する。","a":false,"c":"10条。","e":"会社が支配人を選任したときは，その登記をしなければならないが（918 条），この登記は対抗要件を具備するためのものである。支配人の代理権が発生するのは，当該支配人を選任したときである。"},{"l":3,"m":"会社の使用人","sb":"支配人","i":"B","r":"","q":"会社は，本店には支配人を置くことができない。","a":false,"c":"10条。","e":"会社は，支配人を選任し，その本店または支店において，その事業を行わせることができる。"},{"l":4,"m":"会社の使用人","sb":"支配人","i":"B","r":"(令3問題1ア類・平29II問題1ウ類・平22II問題2ア類)","q":"支配人は，会社に代わってその事業に関する一切の裁判外の行為をする権限を有するが，裁判上の行為をする権限は有していない。","a":false,"c":"11条1項。","e":"支配人は，会社に代わってその事業に関する一切の裁判上または裁判外の行為をする権限を有する。また，支配人の代理権に加えた制限は，善意の第三者に対抗することができない（11条３項）。"},{"l":5,"m":"会社の使用人","sb":"支配人","i":"A","r":"(平27II問題1ア類)","q":"支配人は，他の支配人を選任する権限は有していない。","a":true,"c":"11条2項参照。","e":"支配人は，他の使用人を選任し，または解任することができるが，他の支配人の選解任権は有していない。支配人の選任および解任は，取締役会設置会社（一定の要件を満たす監査等委員会設置会社および指名委員会等設置会社を除く）では，取締役会の専決事項である（362 条４項３号）。指名委員会等設置会社においては，取締役会の決議によって，支配人の選任および解任を執行役に委任することができる（416 条４項各号参照）。一定の要件を満たす監査等委員会設置会社においても，取締役会の決議によって，支配人の選任および解任を取締役に委任することができる（399条の13第５項６項）。また，取締役会非設置会社であれば取締役の過半数で決定（348条３項１号），持分会社であれば社員の過半数で決定（591条２項）される。"},{"l":6,"m":"会社の使用人","sb":"支配人","i":"B","r":"(平21問題2エ)","q":"会社は，支配人の代理権に制限を加えても，その制限を善意の第三者に対抗することができない。","a":true,"c":"11条3項。","e":"支配人の代理権は包括的であり，内部的に制限しても善意の第三者に対抗できない。"},{"l":7,"m":"会社の使用人","sb":"支配人","i":"A","r":"(令3問題1エ類・平24II問題1ア類)","q":"支配人は，当該支配人を選任した会社が許可した場合には，他の会社の使用人となることができる。","a":true,"c":"12条1項3号。","e":"支配人の精力分散防止義務である。精力分散防止義務の趣旨は，雇用契約に基づき支配人が職務に専念することを担保することである。ここで，支配人は，包括的な代理権を有し，事業の機密も熟知している。したがって，会社との間には高度の信頼関係が必要となるため，会社の職務に専念させることで，忠実な職務を遂行することを保障する必要があるのである。"},{"l":8,"m":"会社の使用人","sb":"支配人","i":"A","r":"(平21問題2ウ)","q":"Ａ社の支配人は，Ａ社と同種の事業を行わないＢ社の取締役になる場合，Ａ社の許可を受ける必要はない。","a":false,"c":"12条1項4号。","e":"支配人が他の会社の取締役になるには，会社の許可を受けなければならない。"},{"l":9,"m":"会社の使用人","sb":"支配人","i":"A","r":"(平30II問題2ア)","q":"支配人は，会社の許可を受けなくても，他の会社の監査役になることができる。","a":true,"c":"12条1項4号参照。","e":"支配人は，会社の許可を受けなければ，他の会社の取締役，執行役または業務を執行する社員となることができないとされているが，他の会社の監査役になることはできるため，本肢は正しい。"},{"l":10,"m":"会社の使用人","sb":"支配人","i":"A","r":"","q":"支配人は，会社の事業の部類に属する取引をしないのであれば，会社の許可を受けることなく自ら営業を行うことができる。","a":false,"c":"12条1項1号。","e":"支配人は，会社の許可を受けなければ，自ら営業を行うことができない。これを，精力分散防止義務という。精力分散防止義務の趣旨は，雇用契約に基づき支配人が職務に専念することを担保することである。ここで，支配人は，包括的な代理権を有し，事業の機密も熟知している。したがって，会社との間には高度の信頼関係が必要となるため，会社の職務に専念させることで，忠実な職務を遂行することを保障する必要があるのである。"},{"l":11,"m":"会社の使用人","sb":"支配人","i":"B","r":"(平31II問題1エ類)","q":"支配人が，自ら営業を行うことにつき会社の許可を受けなかった場合，当該営業によって当該支配人が得た利益の額は，当該会社に生じた損害の額と推定される。","a":false,"c":"12条2項。","e":"支配人が，会社の許可を受けずに，自己または第三者のためにその会社の事業の部類に属する取引をしたときは，当該取引によって支配人または第三者が得た利益の額は，会社に生じた損害の額と推定されるが，自ら営業を行った場合は会社の許可の有無に関わらず，当該損害額の推定規定は働かない。"},{"l":12,"m":"会社の使用人","sb":"支配人","i":"B","r":"(平25II問題1エ類)","q":"会社が支配人を選任する場合には，自ら営業を行う者以外の者から選任しなければならない。","a":false,"c":"12条1項1号参照。","e":"会社は，支配人を選任し，その本店または支店において，その事業を行わせることができる（10条）。ここで，支配人には，自ら営業を行う場合には，会社の許可を受けなければならないという精力分散防止義務が課されているが，会社の許可を受ければ自ら営業を行うことも可能である。"},{"l":13,"m":"会社の使用人","sb":"支配人","i":"B","r":"(令3問題1イ類・平24II問題1ウ類)","q":"会社の本店または支店の事業の主任者であることを示す名称を付した使用人は，相手方が悪意でない限り，当該本店または支店の事業に関し，一切の裁判上または裁判外の行為をする権限を有するものとみなす。","a":false,"c":"13条。","e":"会社の本店または支店の事業の主任者であることを示す名称を付した使用人は，相手方が悪意でない限り，当該本店または支店の事業に関し，一切の裁判外の行為をする権限を有するものとみなす。すなわち，表見支配人が有するものとみなされる代理権の範囲には，裁判上の行為は含まれない。"},{"l":1,"m":"会社の使用人","sb":"ある種類または特定の事項の委任を受けた使用人","i":"A","r":"(平27II問題1エ類・平24II問題1エ類)","q":"事業に関するある種類または特定の事項の委任を受けた使用人は，当該事項に関する一切の裁判上または裁判外の行為をする権限を有する。","a":false,"c":"14条1項。","e":"事業に関するある種類または特定の事項の委任を受けた使用人は，当該事項に関する一切の裁判外の行為をする権限を有する。すなわち，裁判上の行為をする権限はない。"},{"l":2,"m":"会社の使用人","sb":"ある種類または特定の事項の委任を受けた使用人","i":"B","r":"(平30II問題2イ・平24II問題1イ類)","q":"会社は，その使用人に対し，当該会社の事業に関するある種類または特定の事項を委任したときは，その旨を登記しなければならない。","a":false,"c":"","e":"支配人の場合（918 条）と異なり，事業に関するある種類または特定の事項の委任を受けた使用人の登記は要求されない。"},{"l":1,"m":"会社の使用人","sb":"物品の販売等を目的とする店舗の使用人","i":"B","r":"(平31I問題1ウ類・平27II問題1ウ類)","q":"物品の販売等を目的とする店舗の使用人は，相手方が悪意でない限り，その店舗に在る物品の販売等をする権限を有するものとみなす。","a":true,"c":"15条。","e":"物品の販売等を目的とする店舗の使用人は，その店舗についての販売等の権限が当然にあるものと顧客が考えるのが普通である。そこで，物品の販売を目的とする店舗の使用人は，代理権が与えられていなくても，その店舗にある物品の販売等をする権限があるものとみなし，取引の安全を図っているのである。"},{"l":1,"m":"会社の代理商","sb":"","i":"B","r":"(平23II問題1ア類)","q":"代理商とは，会社のためにその平常の事業の部類に属する取引の代理または媒介をする者で，その会社の使用人であるものをいう。","a":false,"c":"16条かっこ書。","e":"代理商とは，会社のためにその平常の事業の部類に属する取引の代理または媒介をする者で，その会社の使用人でないものをいう。代理商は独立の商人であり，会社の外部で会社を補助するものである。したがって，会社の指揮命令下にある使用人とは異なるものである。"},{"l":2,"m":"会社の代理商","sb":"","i":"B","r":"(平30II問題2エ)","q":"代理商は，取引の代理または媒介をしたときは，遅滞なく，会社に対して，その旨の通知を発しなければならない。","a":true,"c":"16条。","e":"商取引については迅速性が要求されるため，代理商は，会社の請求がなくとも，取引の代理または媒介をしたときは，遅滞なく，会社に通知することとされている。"},{"l":3,"m":"会社の代理商","sb":"","i":"A","r":"(平30I問題1イ類・平22II問題2エ類)","q":"代理商は，会社の許可を受けた場合であっても，自己または第三者のためにその会社の事業の部類に属する取引をすることができない。","a":false,"c":"17条1項1号。","e":"代理商は，会社の許可を受けなければ，自己または第三者のためにその会社の事業の部類に属する取引をしてはならない。しかし，会社の許可を受ければ，当該行為をすることができる。"},{"l":4,"m":"会社の代理商","sb":"","i":"A","r":"","q":"代理商は，その会社の事業と同種の事業を行う会社の取締役となる場合は，当該会社の許可を受ける必要はない。","a":false,"c":"17条1項2号。","e":"代理商は，会社の許可を受けなければ，その会社の事業と同種の事業を行う会社の取締役，執行役または業務を執行する社員となることができない。代理商の競業避止義務は，会社の許可を得なければ，会社の事業と同種の事業を行う他の会社の取締役，執行役または業務を執行する社員となることまで禁止している点で，取締役の競業避止義務（356条１項１号参照）の範囲よりも拡大されている。"},{"l":5,"m":"会社の代理商","sb":"","i":"A","r":"(令4I問題1ア・平30II問題2ウ・平23II問題1イ)","q":"代理商は，会社の許可を受けなければ，他の会社の使用人となることはできない。","a":false,"c":"17条1項各号参照。","e":"代理商は，会社の許可を受けなければ，① 自己または第三者のために会社の事業の部類に属する取引をすること，② 会社の事業と同種の事業を行う他の会社の取締役，執行役または業務を執行する社員となることができない（17条１項１号２号）。しかし，代理商は，独立した商人であるため，支配人の場合と異なり，他の会社の使用人となることは禁止されていない。"},{"l":6,"m":"会社の代理商","sb":"","i":"C","r":"(令4I問題1イ・平22II問題2ウ類)","q":"物品の販売の媒介の委託を受けた代理商は，買主から，売買の目的物が種類，品質または数量に関して契約の内容に適合しないことの通知を受ける権限を有する。","a":true,"c":"18条。","e":""},{"l":7,"m":"会社の代理商","sb":"","i":"B","r":"(平29II問題1ア類)","q":"会社および代理商は，契約の期間を定めなかったときは，２か月前までに予告し，その契約を解除することができる。","a":true,"c":"19条1項。","e":""},{"l":8,"m":"会社の代理商","sb":"","i":"B","r":"(令4I問題1エ・平23II問題1ウ)","q":"会社および代理商は，やむを得ない事由があるときは，いつでも代理商契約を解除することができる。","a":true,"c":"19条2項。","e":""},{"l":1,"m":"公告","sb":"","i":"A","r":"","q":"会社は，公告方法として，官報に掲載する方法，または，電子公告による方法のいずれかを定款に定めることができる。","a":false,"c":"939条1項。","e":"会社は，公告方法として，官報に掲載する方法，時事に関する事項を掲載する日刊新聞紙に掲載する方法もしくは電子公告による方法のいずれかを定款に定めることができる。"},{"l":2,"m":"公告","sb":"","i":"C","r":"","q":"外国会社の公告は，官報に掲載する方法でなければならない。","a":false,"c":"939条2項。","e":"外国会社も，公告方法として，官報に掲載する方法，時事に関する事項を掲載する日刊新聞紙に掲載する方法もしくは電子公告による方法のいずれかを定めることができる。"},{"l":3,"m":"公告","sb":"","i":"C","r":"","q":"会社は，公告方法を電子公告と定めた場合においては，事故その他やむを得ない事由によって電子公告による公告をすることができない場合の公告方法として，官報に掲載する方法または時事に関する事項を掲載する日刊新聞紙に掲載する方法のいずれかを定めることができる。","a":true,"c":"939条3項。","e":""},{"l":4,"m":"公告","sb":"","i":"B","r":"","q":"公告方法を定款で定めていない会社の公告方法は，官報に掲載する方法とする。","a":true,"c":"939条4項。","e":""},{"l":1,"m":"登記","sb":"","i":"B","r":"(平31II問題1ア類・平28I問題1ア類・平23I問題1ウ類)","q":"登記された事項に変更が生じたときは，当事者は，変更の登記をしなければならない。","a":true,"c":"909条。","e":"登記した事項に変更が生じ，または，その事項が消滅したときは，当事者は，遅滞なく，変更の登記または消滅の登記をしなければならない。"},{"l":2,"m":"登記","sb":"","i":"B","r":"(平30I問題1エ)","q":"株式会社の代表取締役が退任した場合において，その退任の登記の後でなければ，当該株式会社は，当該代表取締役の退任を善意の第三者に対抗することができない。","a":true,"c":"908条1項前段。","e":"指名委員会等設置会社である場合を除き，株式会社は，代表取締役の氏名および住所を登記しなければならない（911条３項14号）。そして，会社法の規定により登記すべき事項は，登記の後でなければ，これをもって善意の第三者に対抗することができない。これを登記の消極的公示力という。したがって，株式会社の代表取締役が退任した場合において，その退任の登記の後でなければ，当該株式会社は，当該代表取締役の退任を善意の第三者に対抗することができない。"},{"l":3,"m":"登記","sb":"","i":"B","r":"(令2II問題1ウ)","q":"会社法の規定により登記すべき事項は，登記の後であっても，正当な事由によってその登記があることを知らなかった第三者に対抗することができない。","a":true,"c":"908条1項後段。","e":"会社法の規定により登記すべき事項は，登記の後であれば，善意の第三者に対しても登記事項を対抗することができる（908 条１項前段の反対解釈）。これを登記の積極的公示力という。ただし，登記後であっても，第三者が正当な事由によってこれを知らなかった場合は，善意の第三者に対抗することができない。正当な事由とは，登記されている事項を知ろうとしても知ることができない客観的障害をいう。客観的障害の例としては，交通または通信の途絶，登記簿の滅失または汚損が挙げられる。すなわち，病気や長期の旅行などの主観的障害は正当な事由に含まれない。"},{"l":4,"m":"登記","sb":"","i":"B","r":"(令7I問題1ア・平29II問題1イ)","q":"故意または過失によって不実の事項を登記した者は，その事項が不実であることをもって善意の第三者に対抗することができない。","a":true,"c":"908条2項。","e":"不実登記の効力である。不実登記の効力の趣旨は，外観法理に基づき，取引の安全を図ることにある。"},{"l":5,"m":"登記","sb":"","i":"C","r":"(平28I問題1イ)","q":"登記すべき事項は，登記をすることにより事実と推定される。","a":false,"c":"","e":"商業登記の効力は登記された事実が有効に存在することを前提とし，登記の基礎にある事実が存在しなければ登記がなされても何の効果も生じないのが原則である。しかし，この原則を貫くと登記を信頼したものが不測の損害を受けるおそれがあるため，不実登記の効力（908 条２項）が認められている。すなわち，故意または過失によって不実の事項を登記した者は，その事項が不実であることをもって善意の第三者に対抗することができない。"},{"l":6,"m":"登記","sb":"","i":"C","r":"(平23I問題1エ)","q":"登記した事項は，登記所において，遅滞なく公告しなければならない。","a":false,"c":"","e":"登記事項は公告をする必要はない。"},{"l":7,"m":"登記","sb":"","i":"B","r":"(令5I問題14イ・平30I問題14ア・平25II問題13イ類)","q":"株式会社は，資本金および準備金の額を登記しなければならない。","a":false,"c":"911条3項5号。","e":"株式会社の資本金の額は登記事項であるが，準備金の額は登記事項ではない。"},{"l":8,"m":"登記","sb":"","i":"B","r":"","q":"監査役の監査の範囲を会計に関するものに限定する旨の定款の定めがある株式会社は，監査役設置会社である旨，監査役の監査の範囲を会計に関するものに限定する旨の定款の定めがある株式会社である旨，および，監査役の氏名を登記しなければならない。","a":true,"c":"911条3項17号。","e":"２条９号の監査役設置会社に該当するか否かによって，会社法の規律が異なる場合があるため，登記上は「監査役設置会社」とされていても，監査役の監査の範囲を会計に関するものに限定する旨の定款の定めがあることを登記上も明らかにするのが適切であると考えられる。そこで，監査役の監査の範囲を会計に関するものに限定する旨の定款の定めがある株式会社は，その旨についても登記することとしている。"},{"l":9,"m":"登記","sb":"","i":"B","r":"(平21問題16イ類)","q":"合資会社および合同会社においては，有限責任社員の出資の目的およびその価額ならびに既に履行した出資の価額を，登記しなければならない。","a":false,"c":"913条7号,914条各号参照。","e":"合資会社においては，有限責任社員の出資の目的（金銭等に限る）およびその価額ならびに既に履行した出資の価額を登記しなければならない。これは，合資会社の有限責任社員は，未履行の出資の価額を限度として会社債権者に対して直接に責任を負うためである。これに対して，社員全員の責任が間接有限責任である合同会社においては，当該事項を登記することは求められていない。"},{"l":10,"m":"登記","sb":"","i":"B","r":"(令6I問題15ア類・令5II問題2イ類・平22I問題17ア類)","q":"持分会社は，資本金の額を登記しなければならない。","a":false,"c":"912条各号,913条各号参照,914条5号。","e":"合同会社においては，資本金の額を登記する。合同会社では，有限責任社員しかいないため，株式会社の場合と同様に会社債権者にとって会社財産のみが責任財産であり，資本金額は有益な情報となる。これに対して，合名会社および合資会社においては，資本金の額を登記することは求められていない。"},{"l":11,"m":"登記","sb":"","i":"B","r":"(平21I問題16アエ類)","q":"持分会社においては，社員の出資の目的およびその価額または評価の標準を，登記しなければならない。","a":false,"c":"912条各号,913条各号,914条各号参照。","e":"社員の出資の目的およびその価額または評価の標準は，持分会社の定款の絶対的記載事項であるが（576 条１項６号），登記事項とされていない。"},{"l":12,"m":"登記","sb":"","i":"B","r":"(令5II問題2ア)","q":"合資会社の設立の登記では，社員の住所の登記は要しない。","a":false,"c":"913条5号。","e":"合資会社は，社員の責任が直接責任であるため，社員の氏名または名称および住所を登記しなければならない。"}]},{"n":11,"name":"商法総則","qs":[{"l":1,"m":"商行為概念","sb":"","i":"A","r":"(平29I問題2イ類)","q":"利益を得て譲渡する意思をもってする動産，不動産もしくは有価証券の有償取得を目的とする行為は，商人が行う場合に限って，商行為とする。","a":false,"c":"501条1号。","e":"投機購買は絶対的商行為である。絶対的商行為は，行為の客観的性質から強度の営利性があるため，営業として行われるか否かを問わず，商人でない者が１回限り行った場合でも商行為とされる行為である。"},{"l":2,"m":"商行為概念","sb":"","i":"A","r":"(令7I問題2ア類・令2II問題2ア類・平31I問題2ア類・平21問題1ア類)","q":"他人から取得する動産，不動産もしくは有価証券の供給契約およびその履行のためにする有償取得を目的とする行為は，商行為とする。","a":false,"c":"501条2号参照。","e":"不動産は投機売却とその実行行為の目的物に含まれない。投機購買と比較して投機売却の目的物に不動産が含まれない理由は，不動産には個性が認められるためである。すなわち，先に他人が有する土地を売却する約束をしておき，その後当該土地を有する者から土地を購入するという取引は考えにくいため，不動産は投機売却の目的物から除外されているのである。"},{"l":3,"m":"商行為概念","sb":"","i":"B","r":"(平28I問題2ウ)","q":"取引所においてする取引は，営業として行われなければ商行為とはならない。","a":false,"c":"501条3号。","e":"取引所においてする取引は絶対的商行為である。そのため，営業として行われるか否かを問わず，１回限り行った場合でも商行為とされる行為である。"},{"l":4,"m":"商行為概念","sb":"","i":"B","r":"","q":"賃貸する意思をもってする動産もしくは不動産の有償取得もしくは賃借またはその取得しもしくは賃借したものの賃貸を目的とする行為は，営業としてなされない場合でも，商行為とする。","a":false,"c":"502条1号。","e":"投機賃借とその実行行為は，営業としてなされる場合に商行為となる営業的商行為である。ここで，営業としてなされる場合とは，営利の目的をもって，反復継続して行うことをいう。"},{"l":5,"m":"商行為概念","sb":"","i":"C","r":"","q":"内職として行う割り箸を箸袋に入れる行為は，営業的商行為である。","a":false,"c":"502条柱書ただし書。","e":"営業的商行為として列挙されている行為であっても，もっぱら賃金を得る目的で物を製造し，または労務を提供する者の行為は商行為ではない。このような小規模な賃金労働には，商法を適用するまでのことはないと考えられるためである。"},{"l":6,"m":"商行為概念","sb":"","i":"B","r":"(平30II問題1エ)","q":"最高裁判所の判例によれば，土を買い入れてこれで瓦を製造販売する行為は，絶対的商行為ではない。","a":false,"c":"大判昭4年9月28日。","e":"投機購買とその実行行為は，絶対的商行為である（商法501条１号）。投機購買における取得行為とは，必ずしも取得したものをそのまま譲渡することのみを意味するものではなく，製造加工して譲渡する場合も含む。したがって，原材料を購入して，製造加工をして販売するメーカーの行為も当該取得行為に該当することになる。以上のことから，土を買い入れてこれで瓦を製造販売する行為は絶対的商行為である。"},{"l":7,"m":"商行為概念","sb":"","i":"B","r":"(令5II問題1ア)","q":"鉱業を営む自然人が自ら採掘して取得した鉱物の譲渡を目的とする行為は，絶対的商行為である。","a":false,"c":"","e":"農業・漁業・鉱業などによって原始取得した生産物や採取物を売却する行為は，「他人から有償で取得したものの譲渡」に該当しないので，投機購買とその実行行為（商法501条１号）に該当せず，絶対的商行為とならない。なお，鉱業営業者は，商行為を行うことを業としない者であっても，これを商人とみなす（擬制商人，商法４条２項）。なぜなら，鉱業は，通常，大規模な資本・設備を必要とするものであるため，特に店舗を備えていなくても，鉱業営業者は商人とみなすのが妥当だからである。"},{"l":8,"m":"商行為概念","sb":"","i":"B","r":"","q":"他人のためにする製造または加工に関する行為は，営業的商行為に該当する。","a":true,"c":"502条2号。","e":"「他人のために」とは，他人の計算においてという意味である。他人のためにする製造または加工に関する行為とは，顧客からの依頼に基づき，顧客の提供する原材料に製造または加工を行うことを引受け，それに対して報酬を受けることをいう。クリーニング業者や自動車修理業者がこれに該当する。"},{"l":9,"m":"商行為概念","sb":"","i":"B","r":"","q":"客の来集を目的とする場屋における取引は，営業的商行為に該当する。","a":true,"c":"502条7号。","e":"客の来集を目的とする場屋における取引（場屋取引）とは，多数の人が来集するのに適した人的・物的設備を置いて，来集する客の需要に応じて設備を利用させる行為をいう。ホテル・映画館・遊園地・パチンコ屋・ゴルフ場・浴場などがこれに該当する。"},{"l":10,"m":"商行為概念","sb":"","i":"B","r":"(平30II問題1ウ類・平21問題1イ類)","q":"最高裁判所の判例によれば，質屋営業は銀行取引に該当する。","a":false,"c":"最判昭50年6月27日。","e":"銀行取引は，金銭または有価証券を受け入れる行為である受信行為と，これによって取得した資金を需要者に貸し付ける与信行為の両方が存在しなければならない。最高裁判所の判例によれば，自己資金のみをもって貸付けを行う貸金業者の貸付行為や，質屋営業者の行為は，受信行為がないので，銀行取引に該当しない。"},{"l":11,"m":"商行為概念","sb":"","i":"C","r":"","q":"営業的商行為に該当する保険には，社会保険や相互保険は含まれない。","a":true,"c":"502条9号。","e":"営業的商行為に該当する保険には，営利保険のみが該当するため，営利を目的としない社会保険や相互保険は含まれない。"},{"l":12,"m":"商行為概念","sb":"","i":"B","r":"(令5I問題1ウ)","q":"商人のためにその平常の営業の部類に属する取引の媒介をすることを営業としてする者であって，その商人の使用人でないものは，商人ではない。","a":false,"c":"4条1項,502条11号12号。","e":"商人のためにその平常の営業の部類に属する取引の代理または媒介をする者で，その商人の使用人でないものは，代理商である（27条）。代理商は，商行為の代理または媒介を引き受けることを業とする者であるから，商人である。"},{"l":13,"m":"商行為概念","sb":"","i":"B","r":"","q":"衣料品の販売を業とする個人商人が，営業資金を銀行から借り入れる行為は，当該個人商人にとって商行為とはならない。","a":false,"c":"503条1項。","e":"商人がその営業のためにする行為は，商行為とする（附属的商行為）。したがって，衣料品の販売を業とする個人商人が営業資金を銀行から借り入れる行為は，営業のためにする行為であるので，附属的商行為に該当する。"},{"l":14,"m":"商行為概念","sb":"","i":"A","r":"(令6I問題1イ類・平28I問題2ア)","q":"商人の行為は，商行為と推定される。","a":true,"c":"503条2項。","e":"商人の行為は，その営業のためにするものと推定する。そして，商人がその営業のためにする行為は，商行為とされるため（附属的商行為，503条１項），商人の行為は，商行為と推定される。"},{"l":15,"m":"商行為概念","sb":"","i":"A","r":"(平29I問題1ア類・平26I問題1イ)","q":"個人商人が自宅購入のために金銭を借り入れる行為は，営業のために借り入れたものと推定する。","a":true,"c":"503条2項。","e":"商人の行為は，その営業のためにするものと推定する。個人商人の場合，私生活のための行為もあるため，その者のある行為が営業のための行為なのか，個人の私生活のための行為なのか明らかでない場合が生じうる。そのため，取引の安全を図る趣旨で，商人の行為は附属的商行為であると推定している。"},{"l":16,"m":"商行為概念","sb":"","i":"C","r":"","q":"地方公共団体が市営バスを運営する場合，当該行為が営業的商行為であっても，商法が適用されることはない。","a":false,"c":"2条。","e":"公法人が行う商行為については，法令に別段の定めがある場合を除き，商法が適用される。したがって，本肢は誤りである。"},{"l":17,"m":"商行為概念","sb":"","i":"C","r":"(平30I問題1ア)","q":"最高裁判所の判例によれば，会社の行為は商行為と推定される。","a":true,"c":"最判平20年2月22日。","e":"会社がその事業としてする行為およびその事業のためにする行為は，商行為とされる（会社法５条）。そして，会社は，自己の名をもって商行為をすることを業とする者であることから，商法上の商人に該当する（商法４条１項）。また，商人の行為はその事業のためにするものと推定されることから（商法503条２項の「営業」とは，会社については，「事業」と同義と解される），会社の行為は商行為と推定され，当該行為が当該会社の事業のためにするものでないこと，すなわち当該会社の事業と無関係であることの主張立証責任は，これを争う者が負う。"},{"l":1,"m":"一方的商行為","sb":"","i":"C","r":"","q":"当事者の一方のために商行為となる行為については，商法をその双方に適用する。","a":true,"c":"3条1項。","e":"ある行為が当事者の一方にとってだけ商行為となる場合に，当事者の一方に民法が適用され，他方に商法が適用されるとなると法律の適用関係が複雑になる。したがって，一方的商行為の場合であっても双方に商法を適用することで，法律の適用関係の統一を図っているのである。また，同趣旨で，当事者の一方が２人以上ある場合において，そのうち１人にとって商行為となる行為については，その全員に商法が適用される（３条２項）。"},{"l":1,"m":"商人","sb":"","i":"B","r":"","q":"商人とは，商行為をする者をいう。","a":false,"c":"4条1項。","e":"商人とは，自己の名をもって商行為をすることを業とする者をいう。"},{"l":2,"m":"商人","sb":"","i":"A","r":"(令5I問題1イ・平20問題1ア類)","q":"店舗その他これに類似する設備によって物品を販売することを業とする者は，商行為を行うことを業としない者であっても，商人とみなされる。","a":true,"c":"4条2項。","e":"農業や漁業により原始取得した物を店舗等で販売する行為がこれに該当する（擬制商人）。このような店舗営業者は，商行為を行うことを業とする者ではないが，商人とみなされる。商法では，投機購買とその実行行為（501 条１号）を絶対的商行為としているが，自分で生産・収穫した農産物や水産物を販売しても，「他人から有償で取得したものの譲渡」に該当しないので商行為には該当しない。しかし，同じ農産物や水産物を販売する者であっても，これを他人から取得して販売する場合には商人となり，原始取得して販売する場合には商人とならないのでは不均衡である。そこで，商行為ではないが，店舗その他これに類似する設備によって販売している場合には，商人とみなされているのである。"},{"l":3,"m":"商人","sb":"","i":"A","r":"(平26I問題1ア)","q":"自分の畑でとれた野菜を，店舗を用いて自ら販売する者は，商人とはみなされない。","a":false,"c":"4条2項。","e":"このような店舗営業者は，商行為を行うことを業とする者ではないが，商人とみなされる。問題２の解説を参照すること。"},{"l":4,"m":"商人","sb":"","i":"A","r":"(令6I問題1エ類・平31I問題1ア類)","q":"鉱業を営む者は，商人とはみなされない。","a":false,"c":"4条2項。","e":"鉱業営業者は，商行為を行うことを業としない者であっても，これを商人とみなす（擬制商人）。なぜなら，鉱業は，通常，大規模な資本・設備を必要とするものであるため，特に店舗を備えていなくても，鉱業営業者は商人とみなすのが妥当だからである。"},{"l":5,"m":"商人","sb":"","i":"B","r":"(平29I問題1エ)","q":"未成年者は，商人となることができない。","a":false,"c":"5条参照。","e":"未成年者も商人となることができる。"},{"l":6,"m":"商人","sb":"","i":"B","r":"(平28I問題1エ)","q":"未成年者が自己の名をもって商行為をすることを業として行うときは，その登記をしなければならない。","a":true,"c":"5条。","e":"未成年者が自己の名をもって営業を行うときは，その登記（未成年者登記）をしなければならない。これは，未成年者と取引をする第三者を保護するためである。"},{"l":7,"m":"商人","sb":"","i":"C","r":"(令7I問題1イ)","q":"未成年者の後見人が未成年者のために営業を行うときは，その登記をしなければならない。","a":true,"c":"6条1項。","e":"後見人が被後見人のために商法４条の営業を行うときは，その登記をしなければならない。すなわち，未成年者の法定代理人である後見人は，被後見人である未成年者のために営業をなすことができるが，その場合にはその旨の登記が必要となる。"},{"l":8,"m":"商人","sb":"","i":"B","r":"(平20問題1ウ)","q":"会社は，定款所定の目的のいかんにかかわらず，商人である。","a":true,"c":"","e":"会社（外国会社を含む）がその事業としてする行為およびその事業のためにする行為は，商行為とされる（会社法５条）。したがって，会社および外国会社は，自己の名をもって商行為をすることを業とする者であるから，その定款所定の目的のいかんにかかわらず，固有の商人である。"},{"l":9,"m":"商人","sb":"","i":"C","r":"(平30II問題1ア)","q":"中小企業等協同組合法に基づいて設立された信用協同組合は，商人ではない。","a":true,"c":"最判昭48年10月5日。","e":"最高裁判所の判例によれば，中小企業等協同組合法に基づいて設立された信用協同組合は，その事業の範囲はかなり拡張されてきているとはいえ，組合員の事業や家計の助成を図ることを目的とする共同組織であるとの性格に基本的な変更はなく，その業務は営利を目的とするものではないというべきであるから，商法上の商人ではない。"},{"l":10,"m":"商人","sb":"","i":"C","r":"(令5I問題1ア)","q":"最高裁判所の判例によれば，信用金庫は商人ではない。","a":true,"c":"最判昭63年10月18日。","e":"最高裁判所の判例によれば，信用金庫法に基づいて設立された信用金庫は，国民大衆のために金融の円滑を図り，その貯蓄の増強に資するために設けられた協同組織による金融機関であり，信用金庫の行う業務は営利を目的とするものではないというべきであるから，商法上の商人には該当しないとしている。"},{"l":11,"m":"商人","sb":"","i":"C","r":"(平29I問題1イ)","q":"最高裁判所の判例によれば，商人でない者が営業を開始するために，相手方はもとより，それ以外の者にも，客観的に開業準備行為と認められる行為を行ったときは，これにより商人たる資格を有する。","a":true,"c":"最判昭33年6月19日。","e":"自然人の場合，商人資格は，営業の開始時に取得されると考えられる。しかし，基本的商行為（絶対的商行為および営業的商行為）を行う以前の開業準備の段階で，開業準備行為を附属的商行為であると捉えて，商人資格を取得できると考えるのが通説である。判例は，営業の準備行為は，相手方はもとより，それ以外の者にも客観的に開業準備行為と認めることができるものであることを要するとし，単に金銭を借り入れる行為は特段の事情がない限り開業準備行為であるとすることはできないが，取引の相手方がこの事情を知っているときは，開業準備行為として商行為性が認められるとしている。つまり，個人商人の資格取得時点は，営業の意思を相手方が認識し，または，営業の意思が客観的に認識可能となった時点であると解される。"},{"l":12,"m":"商人","sb":"","i":"B","r":"","q":"小商人とは，商人のうち，営業のために使用する財産の価額が50万円を超えない者をいう。","a":true,"c":"7条かっこ書,商法施行規則3条。","e":""},{"l":13,"m":"商人","sb":"","i":"B","r":"(令5I問題1エ)","q":"小商人は商人ではない。","a":false,"c":"7条かっこ書,商法施行規則3条。","e":"小商人とは，商人のうち，営業のために使用する財産の価額が50万円を超えない者をいう。小商人には，登記および商業帳簿に関する規定が適用されないが（７条），商人であるため，本肢は誤りである。"},{"l":14,"m":"商人","sb":"","i":"A","r":"(平29I問題1ウ類・平22I問題1ア)","q":"小商人は，その商号を登記することができない。","a":true,"c":"7条。","e":"小商人には，登記に関する規定が適用されないため（７条），小商人は，商号を登記することができない。"},{"l":15,"m":"商人","sb":"","i":"B","r":"","q":"小商人は，その営業のために使用する財産について，適時に，正確な商業帳簿を作成しなければならない。","a":false,"c":"7条。","e":"小商人には，商業帳簿の作成義務（19条２項）は課せられていない。これは，事務負担が重くなり酷だからである。"},{"l":16,"m":"商人","sb":"","i":"B","r":"(令2II問題2ウ)","q":"小商人間において金銭の消費貸借をしたときは，貸主は，法定利息を請求することができる。","a":true,"c":"7条参照,513条1項。","e":"商人間において金銭の消費貸借をしたときは，貸主は，特に約定しなくても，法定利息を請求することができる。商人である貸主は，営利を目的として活動しているし，貸主としては，貸付けをしていなければ，金銭を他で有利に運用できたはずである。そこで，特に約定しなくても，商人である貸主は，法定利率による利息を請求することができるとされている。この規定は，小商人にも適用されるので，本肢は正しい。"},{"l":1,"m":"商号","sb":"","i":"A","r":"","q":"個人商人は，氏名や営業の種類または内容と全く関係のない名称を商号とすることはできない。","a":false,"c":"11条1項。","e":"個人商人はその氏，氏名その他の名称をもってその商号とすることができる。つまり，商人は，その氏や氏名を称号にできることはもちろん，氏名や営業の種類・内容とまったく関係のない名称を商号とすることも可能である。"},{"l":2,"m":"商号","sb":"","i":"C","r":"","q":"個人商人は，その商号中に会社という文字を用いることができる。","a":false,"c":"会社法7条。","e":"会社でない者は，その名称または商号中に，会社であると誤認されるおそれのある文字を用いてはならない。したがって，個人商人は，その商号中に会社という文字を用いることができない。"},{"l":3,"m":"商号","sb":"","i":"B","r":"(令6II問題1ア・平22I問題1イ)","q":"個人商人は，複数の営業を営むことができるが，各営業につき異なる商号を有することは認められない。","a":false,"c":"","e":"個人商人は複数の営業を営むことができ，１つの営業については１つの商号しか有することができない。商号は，営業の同一性の認識の標準となるものであるため，１つの営業について複数の商号を用いることができるとすれば，一般公衆に誤解を与えるおそれがあるためである。しかし，各営業につき異なる商号を有することは認められる。"},{"l":4,"m":"商号","sb":"","i":"A","r":"(令6II問題1エ類・令2II問題1ア・平28II問題1イ・平25II問題1ア・平23I問題1ア)","q":"個人商人は，その商号を登記しなければならない。","a":false,"c":"11条2項。","e":"個人商人は，その商号を登記することができる。"},{"l":5,"m":"商号","sb":"","i":"A","r":"(平31II問題1イ類・平26I問題1ウ類)","q":"個人商人Ａが不正の目的をもって，個人商人Ｂであると誤認されるおそれのある商号を使用した場合において，これにより営業上の利益を侵害されたＢは，自己の商号を登記していないときには，営業上の利益を侵害したＡに対し，当該侵害の停止を請求することができない。","a":false,"c":"12条2項。","e":"不正の目的をもって，他の商人であると誤認されるおそれのある名称または商号を使用することによって営業上の利益を侵害され，または侵害されるおそれがある商人は，その営業上の利益を侵害する者または侵害するおそれがある者に対し，その侵害の停止または予防を請求することができる。ここで，本規定は商号の登記の有無に関わらず適用されることとなる。"},{"l":6,"m":"商号","sb":"","i":"A","r":"(平25II問題1イ類・平22I問題1ウ類)","q":"個人商人は，商号を自由に譲渡することができる。","a":false,"c":"15条1項。","e":"個人商人の商号は，営業とともにする場合，または，営業を廃止する場合に限って譲渡することができるとされている（15条１項）。これは，商人の営業と切り離して商号だけが譲渡されるとすれば，その商号が表す営業主の同一性について，取引相手や一般公衆に誤解や混乱が生じるおそれがあるためである。"},{"l":7,"m":"商号","sb":"","i":"A","r":"(令6II問題1ウ・令2II問題1イ・平28I問題1ウ・平23I問題1イ)","q":"個人商人の商号の譲渡は，登記をしなければ，第三者に対抗することができない。","a":true,"c":"15条2項。","e":"なお，登記をしなければ，相手方の善意・悪意を問わず対抗できない。"},{"l":8,"m":"商号","sb":"","i":"C","r":"(平22I問題1エ)","q":"商号の登記をした個人商人が，正当な事由なく２年間その商号を使用しないときは，商号を廃止したものとみなされる。","a":false,"c":"商業登記法33条1項2号。","e":"商号を登記した者が正当な事由なく２年間当該商号を使用しない場合には，同一の商号を使用する者は当該商号の登記の抹消請求ができる。しかし，商号が廃止されたものとみなされるわけではない。"},{"l":1,"m":"商業帳簿","sb":"","i":"B","r":"(平26II問題1ア)","q":"個人商人の会計は，一般に公正妥当と認められる会計の慣行に従うものとされている。","a":true,"c":"19条1項。","e":""},{"l":2,"m":"商業帳簿","sb":"","i":"B","r":"(平29II問題1エ類・平25II問題1ウ類)","q":"個人商人が商業帳簿を作成するか否かは，当該個人商人の任意である。","a":false,"c":"19条2項。","e":"個人商人（小商人を除く）は，その営業のために使用する財産について，適時に，正確な商業帳簿を作成しなければならない。"},{"l":3,"m":"商業帳簿","sb":"","i":"B","r":"(平26II問題1エ)","q":"個人商人は，営業年度の終了後，貸借対照表を公告しなければならない。","a":false,"c":"","e":"個人商人には貸借対照表の公告義務は課されていない。"},{"l":4,"m":"商業帳簿","sb":"","i":"B","r":"(平26II問題1イ)","q":"裁判所は，申立てによりまたは職権で，訴訟の当事者に対し，商業帳簿の全部または一部の提出を命ずることができる。","a":true,"c":"19条4項。","e":""},{"l":5,"m":"商業帳簿","sb":"","i":"B","r":"(平26II問題1ウ)","q":"個人商人は，債権者から請求を受けたときは，貸借対照表の謄本を交付しなければならない。","a":false,"c":"","e":"個人商人に対する債権者の貸借対照表の閲覧または謄抄本の交付請求に関する規定は存在しない。"}]},{"n":12,"name":"商行為法","qs":[{"l":1,"m":"商行為の営利性に基づく規定","sb":"","i":"A","r":"(令6II問題2ウ類・令6I問題2ウ類・令2I問題2ア類・平28II問題2エ)","q":"商人がその営業の範囲内において他人のために行為をしたときは，当該他人との間の契約において報酬を定めていなくとも，相当な報酬を請求することができる。","a":true,"c":"512条。","e":"商人は，営利を目的として活動する者であるから，商人の行為は通常，営利の目的のためになされたものと考えられる。そこで，商人がその営業の範囲内において他人のために行為をしたときは，相当な報酬を請求することができるとしている。"},{"l":2,"m":"商行為の営利性に基づく規定","sb":"","i":"C","r":"(令7I問題2ウ)","q":"商人間において金銭の消費貸借をしたときは，貸主は，法定利息を請求することができる。","a":true,"c":"513条1項。","e":"商人間において金銭の消費貸借をしたときは，貸主は，特に約定しなくても，法定利息を請求することができる。"},{"l":3,"m":"商行為の営利性に基づく規定","sb":"","i":"C","r":"","q":"商人間において金銭の立替えをした場合に限って，その立替えの日以後の法定利息を請求することができる。","a":false,"c":"513条2項。","e":"商人がその営業の範囲内において他人のために金銭の立替えをしたときは，その立替えの日以後の法定利息を請求することができる。すなわち，商人間であることまでは求められていないので，本肢は誤りである。"},{"l":1,"m":"商行為の代理および委任","sb":"","i":"B","r":"(平26I問題2イ類)","q":"商行為の代理人が本人のためにすることを示さないでこれをした場合，当該行為は，本人に対してその効力を生じない。","a":false,"c":"504条。","e":"商法では，商行為の代理の方式として，非顕名主義を採用している。したがって，商行為の代理人が本人のためにすることを示さないでこれをした場合であっても，その行為は，本人に対してその効力を生ずる（504 条本文）。ただし，相手方が，代理人が本人のためにすることを知らなかったときは，代理人に対して履行の請求をすることができる（同条ただし書）。"},{"l":2,"m":"商行為の代理および委任","sb":"","i":"A","r":"(平29I問題2ア・平26I問題2ウ・平23II問題2エ)","q":"商行為の受任者は，委任の本旨に反しない範囲内において，委任を受けていない行為をすることができる。","a":true,"c":"505条。","e":"委任の趣旨を合理的に解釈していれば，特に明示の委任がなくとも，当該委任の趣旨に反しない範囲において事情の変更に応じた適切な処理を認めるべきだからである。"},{"l":3,"m":"商行為の代理および委任","sb":"","i":"B","r":"(令6I問題2イ・平30I問題2ア)","q":"最高裁判所の判例によれば，商行為の代理人が本人のためにすることを示さないで代理行為をした場合において，相手方が，代理人が本人のためにすることを過失なく知らなかったときは，相手方は本人との法律関係を主張するか，代理人との法律関係を主張するかを選択することができる。","a":true,"c":"最判昭43年4月24日。","e":"商法では，商行為の代理の方式として，非顕名主義を採用している。よって，商行為の代理人が本人のためにすることを示さないでこれをした場合であっても，その行為は，本人に対してその効力を生ずる（504条本文）。ただし，相手方が，代理人が本人のためにすることを知らなかったときは，代理人に対して履行の請求をすることができる（同条ただし書）。ここで，最高裁判所の判例によれば，相手方が本人のためにすることを知らなかったことにつき過失がある場合には，保護する必要はないとしている。すなわち，代理人が本人のためにすることを相手方が過失なく知らなかったときは，相手方は本人との法律関係を主張するか，代理人との法律関係を主張するかを選択することができる。"},{"l":4,"m":"商行為の代理および委任","sb":"","i":"A","r":"(平28II問題2ア・平26I問題2ア類・平23II問題2ウ類・平22II問題2イ類)","q":"商行為の委任による代理権は，本人の死亡によって消滅する。","a":false,"c":"506条。","e":"商行為の委任による代理権は，本人の死亡によっては消滅しない。すなわち，代理人は本人の死亡によって，当然に相続人の代理人となるのである。"},{"l":1,"m":"契約の成立に関する規定","sb":"","i":"C","r":"","q":"商人である隔地者間において，承諾の期間を定めないで契約の申込みを受けた者が相当の期間内に承諾の通知を発しなかったときは，当該申込みを撤回することができる。","a":false,"c":"508条1項。","e":"商人である隔地者間において，承諾の期間を定めないで契約の申込みを受けた者が相当の期間内に承諾の通知を発しなかったときは，その効力を失う。当該規定は，商取引の迅速性の要請に基づくものである。"},{"l":2,"m":"契約の成立に関する規定","sb":"","i":"C","r":"","q":"商人である隔地者間において，承諾の期間を定めないで契約の申込みを受けた者が相当の期間を過ぎて承諾の通知を発しても契約は成立しないが，新たな申込みとみなすことができる。","a":true,"c":"508条2項。","e":""},{"l":3,"m":"契約の成立に関する規定","sb":"","i":"B","r":"(平28II問題2ウ)","q":"商人が平常取引をする者からその営業の部類に属する契約の申込みを受けたときは，遅滞なく，契約の申込みに対する諾否の通知を発しなければならず，当該商人がその通知を発することを怠ったときは，当該契約の申込みを承諾したものとみなされる。","a":true,"c":"509条。","e":"当該規定は，取引の相手方を保護する趣旨である。すなわち，反復継続的に取引が行われていた場合，その申込みにつき遅滞なく承諾をしない旨の通知がないのであれば，契約の成立が当然に予想され，申込者は承諾がなされたと信頼することから，当該信頼を保護する必要があるのである。"},{"l":4,"m":"契約の成立に関する規定","sb":"","i":"B","r":"(令6I問題2ア・令2II問題2イ)","q":"商人がその営業の部類に属する契約の申込みを受けた場合において，その申込みとともに受け取った物品があるときは，その申込みを拒絶したときであっても，当該商人の費用をもってその物品を保管しなければならない。","a":false,"c":"510条。","e":"商人がその営業の部類に属する契約の申込みを受けた場合において，その申込みとともに受け取った物品があるときは，その申込みを拒絶したときであっても，申込者の費用をもってその物品を保管しなければならない（510 条本文）。ただし，その物品の価額がその費用を償うのに足りないとき，または商人がその保管によって損害を受けるときは，この限りでない（510 条ただし書）。当該規定は，商取引の迅速性を高めると同時に，商人に対する申込者の信頼を保護する趣旨である。"},{"l":1,"m":"商事債権担保に関する規定","sb":"多数債務者間の債務・保証人の連帯","i":"B","r":"(平31I問題2イ類・平26I問題2エ)","q":"数人の者がその１人または全員のために商行為となる行為によって債務を負担したときは，その債務は，各自が連帯して負担する。","a":true,"c":"511条1項。","e":"当該趣旨は，商取引における債務の履行を確実にして債権者の保護を強化し，これによって取引の安全を図ることにある。"},{"l":2,"m":"商事債権担保に関する規定","sb":"多数債務者間の債務・保証人の連帯","i":"C","r":"","q":"判例によると，数人の者がその１人または全員のために商行為となる行為によって連帯して債務を負担することとされるのは，債権者にとってのみ商行為となる場合に限られる。","a":false,"c":"大判明45年2月29日。","e":"判例によると，511条１項が適用されるためには，債務者の１人または全員にとって商行為となる場合に限られる。すなわち，債権者にとってのみ商行為である場合は，511 条１項は適用されない。これは，債権者にとって商行為であるからといって，商人ではない債務者の責任を強化させるのは妥当でないためである。"},{"l":3,"m":"商事債権担保に関する規定","sb":"多数債務者間の債務・保証人の連帯","i":"B","r":"(平21問題1ウ)","q":"保証人がある場合において，債務が主たる債務者の商行為によって生じたものであるときは，主たる債務者および保証人が各別の行為によって債務を負担したときであっても，その債務は各自が連帯して負担する。","a":true,"c":"511条2項。","e":"当該趣旨は，多数債務者間の債務の連帯（511 条１項）と同様に，債権者の保護を強化し，これによって取引の安全を図ることにある。"},{"l":1,"m":"商事債権担保に関する規定","sb":"流質契約","i":"B","r":"(令7I問題2イ・令2II問題2エ・平28I問題2イ類)","q":"商行為によって生じた債権を担保するために質権を設定するに際して，質権設定者は，質権者に弁済として質物の所有権を取得させることを約することができる。","a":true,"c":"515条。","e":"流質契約とは，債務不履行の場合に，質権者が質物の所有権を取得すること，または，質物を任意の方法により売却し優先弁済にあてることを契約することをいう。商行為によって生じた債権を担保するために設定した質権については，流質契約を締結することが認められる。商人は，自己の利害を慎重に計算して合理的に判断することができ，自衛能力を有するため，民法のように質権設定者を保護する必要がないから，商行為によって生じた債権を担保するために設定した質権に流質契約が認められている。"},{"l":1,"m":"商事債権担保に関する規定","sb":"債務の履行場所・時期","i":"B","r":"","q":"商行為によって生じた債務の履行をすべき場所が，その行為の性質または当事者の意思表示によって定まらないときは，特定物の引渡しは債権者の現在の営業所（営業所がない場合にあっては，債権者の住所）においてしなければならない。","a":false,"c":"516条。","e":"商行為によって生じた債務の履行をすべき場所が，その行為の性質または当事者の意思表示によって定まらないときは，特定物の引渡しはその行為の時にその物が存在した場所においてしなければならない。その他の債務の履行は，債権者の現在の営業所（営業所がない場合にあっては，債権者の住所）においてしなければならない。"},{"l":2,"m":"商事債権担保に関する規定","sb":"債務の履行場所・時期","i":"B","r":"(令5II問題1エ)","q":"商行為によって生じた債務の内容が特定物の引渡しでなく，その履行をすべき場所がその行為の性質または当事者の意思表示によって定まらないときは，当該債務の履行は，債務者の現在の営業所（営業所がない場合にあっては，その住所）においてしなければならない。","a":false,"c":"516条。","e":"商行為によって生じた債務の履行をすべき場所が，その行為の性質または当事者の意思表示によって定まらないときは，特定物の引渡しはその行為の時にその物が存在した場所において，その他の債務の履行は債権者の現在の営業所（営業所がない場合は，債権者の住所）において，それぞれしなければならない。"},{"l":1,"m":"商事債権担保に関する規定","sb":"商事留置権","i":"B","r":"(平29I問題2ウ)","q":"商人間においてその双方のために商行為となる行為によって生じた債権が弁済期にあるときは，債権者は，その債権の弁済を受けるまで，その債務者との間における商行為によって自己の占有に属した債務者の所有する物または有価証券を留置することができ，これを特約により排除することはできない。","a":false,"c":"521条ただし書。","e":"商人間においてその双方のために商行為となる行為によって生じた債権が弁済期にあるときは，債権者は，その債権の弁済を受けるまで，その債務者との間における商行為によって自己の占有に属した債務者の所有する物または有価証券を留置することができる（521 条本文）。ただし，当事者の別段の意思表示があるときは，この限りでないため，本肢は誤りである。"},{"l":2,"m":"商事債権担保に関する規定","sb":"商事留置権","i":"B","r":"","q":"商人間の留置権の目的物は，債務者の所有に属する必要はない。","a":false,"c":"521条本文。","e":"商人間の留置権の目的物は，債務者の所有に属することが求められている。"},{"l":3,"m":"商事債権担保に関する規定","sb":"商事留置権","i":"B","r":"(平28I問題2エ類)","q":"商人間の留置権については，その双方のために商行為となる行為によって生じた債権と留置する目的物に牽連性が必要となる。","a":false,"c":"521条本文。","e":"商人間の留置権については，その双方のために商行為となる行為によって生じた債権と留置する目的物に牽連性は必要ない。商人間の留置権の趣旨は，商人間の信用取引の迅速性，安全性を確保することである。継続的な商取引が行われている商人間においては，互いの債権を保全するために，流動的に担保を相互に取得させるのが便利である。しかし，商人間において個別に担保権を設定しなければならないとすると，迅速性が害される。また，取引にあたり担保権の設定を求めることによって，相手方との信頼関係を壊してしまうことも考えられる。そこで，債権者である商人を保護するために，広範囲に渡って成立する（牽連性が要求されない）留置権を認めたのである。"},{"l":4,"m":"商事債権担保に関する規定","sb":"商事留置権","i":"B","r":"(平31II問題2ア)","q":"最高裁判所の判例によれば，不動産は，商法521条が商人間の留置権の目的物として定める「物」に当たる。","a":true,"c":"最判平29年12月14日。","e":""},{"l":5,"m":"商事債権担保に関する規定","sb":"商事留置権","i":"B","r":"","q":"代理商の留置権については，取引の代理または媒介により生じた債権と留置する目的物に牽連性が必要となる。","a":false,"c":"31条。","e":"代理商の留置権については，取引の代理または媒介により生じた債権と留置する目的物に牽連性は必要ない。"},{"l":6,"m":"商事債権担保に関する規定","sb":"商事留置権","i":"B","r":"(平31I問題1エ類・平23II問題1エ類)","q":"代理商は，取引の代理または媒介をしたことによって生じた債権の弁済期が到来しているときは，その弁済を受けるまでは，商人のために当該代理商が占有している物を留置することができるが，有価証券を留置することはできない。","a":false,"c":"31条。","e":"代理商は，取引の代理または媒介をしたことによって生じた債権の弁済期が到来しているときは，その弁済を受けるまでは，商人のために当該代理商が占有する物または有価証券を留置することができる。ただし，当事者が別段の意思表示をしたときは，この限りでない。"},{"l":1,"m":"寄託を受けた商人の善管注意義務","sb":"","i":"B","r":"(令4I問題2ア)","q":"商人が，その営業の範囲内において寄託を受けたときは，報酬を受けていない場合であっても，善良なる管理者の注意をもって寄託品を保管しなければならない。","a":true,"c":"595条。","e":"寄託を受けた商人に善管注意義務が課せられている趣旨は，商人の信用を維持し，取引の円滑を図るためである。"},{"l":1,"m":"商事売買","sb":"","i":"B","r":"","q":"商人間の売買において，買主がその目的物の受領を拒み，またはこれを受領することができないときは，売主は，相当の期間を定めて催告をした後に，裁判所の許可を得て，競売に付することができる。","a":false,"c":"524条1項前段。","e":"商人間の売買において，買主がその目的物の受領を拒み，またはこれを受領することができないときは，売主は，その物を供託し，または，相当の期間を定めて催告をした後に競売に付することができる。ここで，競売に付する場合であっても裁判所の許可を得る必要はないため，本肢は誤りである。また，この場合において，売主がその物を供託し，または競売に付したときは，遅滞なく，買主に対してその旨の通知を発しなければならない（524条１項後段）。"},{"l":2,"m":"商事売買","sb":"","i":"B","r":"(令7I問題2エ・令3問題2ア)","q":"買主が売買の目的物の受領を拒み，かつ，その物に損傷による価格の低落のおそれがある場合には，売主は，催告をしないでその物を競売に付することができる。","a":true,"c":"524条2項。","e":""},{"l":3,"m":"商事売買","sb":"","i":"A","r":"(令6I問題2エ・令3問題2エ類・平29II問題2エ類)","q":"商人間の売買において，売買の性質または当事者の意思表示により，特定の日時または一定の期間内に履行をしなければ契約をした目的を達することができない場合において，当事者の一方が履行をしないでその時期を経過したときは，相手方は，直ちにその履行の請求をした場合を除き，契約の解除をしたものとみなす。","a":true,"c":"525条。","e":"確定期売買の解除の趣旨は，商取引の迅速性の要請に応え，売主を保護することにある。すなわち，迅速性を要する商取引において，契約解除の手間を省略させ，売主を不安定な状況に置くのを防いでいるのである。"},{"l":4,"m":"商事売買","sb":"","i":"B","r":"(令3問題2イ)","q":"商人間の売買において，買主は，その売買の目的物を受領したときは，遅滞なく，その物を検査しなければならない。","a":true,"c":"526条1項。","e":""},{"l":5,"m":"商事売買","sb":"","i":"B","r":"(令3問題2ウ類)","q":"商人間の売買における買主の検査により売買の目的物が種類，品質または数量に関して契約の内容に適合しないことを発見したときは，売主がその不適合について悪意であった場合でも，直ちに売主に対してその旨の通知を発しなければ，その不適合を理由として履行の追完の請求，契約の解除，代金減額および損害賠償の請求をすることができない。","a":false,"c":"526条2項前段,3項。","e":"当該規定は，売主がその不適合について悪意であった場合には適用されない。"},{"l":6,"m":"商事売買","sb":"","i":"B","r":"","q":"商人間の売買において，売買の目的物が種類または品質に関して契約の内容に適合しないことを直ちに発見することができない場合において，買主が６か月以内にその不適合を発見したときは，売主が悪意である場合を除き，直ちに売主に対してその旨の通知を発しなければ，その不適合を理由として履行の追完の請求，契約の解除，代金減額および損害賠償の請求をすることができない。","a":true,"c":"526条2項後段,3項。","e":""},{"l":7,"m":"商事売買","sb":"","i":"B","r":"","q":"商人間の売買において，買主がその売買の目的物を受領した場合には，買主は，契約の解除をしたときであっても，原則として，売主の費用をもって売買の目的物を保管し，または供託しなければならない。","a":true,"c":"527条1項本文。","e":"ただし，目的物に滅失または損傷のおそれがあるときは，裁判所の許可を得てその物を競売に付し，その代価を保管し，または，供託しなければならない（527 条１項ただし書）。この場合は，遅滞なく，売主に対してその旨の通知を発しなければならない（527条３項）。"},{"l":1,"m":"交互計算","sb":"","i":"B","r":"(平31II問題2イ類・平25II問題2ア類)","q":"交互計算契約は，商人間においてのみ認められている。","a":false,"c":"529条。","e":"交互計算は，商人間または商人と非商人との間で平常取引をする場合において，一定の期間内の取引から生ずる債権および債務の総額について相殺をし，その残額の支払をすることを約定する契約をいう。"},{"l":2,"m":"交互計算","sb":"","i":"B","r":"(平25II問題2イ)","q":"交互計算の期間を当事者が定めなかったときは，その期間は，６か月とする。","a":true,"c":"531条。","e":""},{"l":3,"m":"交互計算","sb":"","i":"B","r":"","q":"交互計算において，当事者は，債権および債務の各項目を記載した計算書の承認をしたときは，当該計算書の記載に錯誤または脱漏があった場合を除き，当該各項目について異議を述べることができない。","a":true,"c":"532条。","e":""},{"l":4,"m":"交互計算","sb":"","i":"B","r":"(平25II問題2ウ類)","q":"交互計算において，相殺によって生じた残額については，債権者は，利息を請求することができない。","a":false,"c":"533条1項。","e":"残額債権の債権者は，計算閉鎖の日以後の法定利息を請求することができる。また，当事者の特約によって，交互計算に組み入れた債権債務の各項目について，交互計算に組み入れた日より利息を付すことが認められる（533 条２項）。"},{"l":5,"m":"交互計算","sb":"","i":"B","r":"(平25II問題2エ類)","q":"交互計算契約において，各当事者は，交互計算期間が終了するまでは交互計算契約を解除することができない。","a":false,"c":"534条。","e":"各当事者は，いつでも交互計算の解除をすることができる。この場合において，交互計算の解除をしたときは，直ちに，計算を閉鎖して，残額債権の支払を請求することができる。"},{"l":1,"m":"匿名組合","sb":"","i":"B","r":"(平30I問題2イ)","q":"匿名組合契約は，当事者の一方が相手方の営業のために出資をし，その営業から生ずる利益を分配することを約することによって，その効力を生ずる。","a":true,"c":"535条。","e":"匿名組合における出資者を匿名組合員といい，営業する者を営業者という。匿名組合においては，営業上の取引を行ったとしても，直接第三者に匿名組合員の名前は開示されない。すなわち，第三者が匿名組合と取引をするときには，営業者と取引をしているのであって，匿名組合員の名前は知らないことになる。この意味で，「匿名」組合といわれるのである。"},{"l":2,"m":"匿名組合","sb":"","i":"B","r":"(平24I問題1ア類)","q":"匿名組合員が出資した財産は，匿名組合員が共有することになる。","a":false,"c":"536条1項。","e":"出資した財産は，営業者の財産に属する。すなわち，出資された財産は匿名組合員が共有することにはならない。"},{"l":3,"m":"匿名組合","sb":"","i":"B","r":"(令5I問題2ア類・平24I問題1イ類)","q":"匿名組合員は，財産出資のみならず，労務出資および信用出資をすることが認められる。","a":false,"c":"536条2項。","e":"匿名組合員は，財産出資のみが認められ，労務出資および信用出資は認められない。"},{"l":4,"m":"匿名組合","sb":"","i":"B","r":"(平24I問題1ウ)","q":"匿名組合員は，営業者の業務を執行し，または営業者を代表することができない。","a":true,"c":"536条3項。","e":"匿名組合員は，営業者の営業に出資するのみであるため，営業者の業務執行権および代表権を有しない。"},{"l":5,"m":"匿名組合","sb":"","i":"B","r":"(平26II問題2ア類)","q":"匿名組合員は，営業者の行為について，第三者に対して権利および義務を有する。","a":false,"c":"536条4項。","e":"匿名組合員は，営業者の営業に出資するのみであるため，第三者とは無関係であり，営業者の行為について，匿名組合員は第三者に対して権利を有さず，義務も負わないのが原則である。すなわち，匿名組合員は，営業者に対して出資義務を負うが，対外的には直接責任を負わないため，株式会社における株主と同様に，間接有限責任を負うのと事実上同じ効果が生じる。"},{"l":6,"m":"匿名組合","sb":"","i":"B","r":"(令5I問題2イ類・平24I問題1エ類)","q":"匿名組合員は，自己の氏または氏名を営業者の商号中に用いること，または自己の商号を営業者の商号として使用することを許諾したときは，その使用以後に生じた債務については，営業者と連帯してこれを弁済する責任を負う。","a":true,"c":"537条。","e":"当該趣旨は，名板貸人の責任と同様であり，外観法理に基づき，取引の安全を図ることにある。"},{"l":7,"m":"匿名組合","sb":"","i":"B","r":"(平26II問題2イ類)","q":"匿名組合員は，いつでも，利益の配当を請求することができる。","a":false,"c":"538条。","e":"出資が損失によって減少したときは，その損失を填補した後でなければ，匿名組合員は，利益の配当を請求することができない。"},{"l":8,"m":"匿名組合","sb":"","i":"B","r":"","q":"匿名組合員は，営業年度の終了時において，営業者の営業時間内に，営業者の貸借対照表の閲覧を請求することができる。","a":true,"c":"539条1項。","e":"匿名組合員は，営業者の営業に出資するのみであるため，営業者の業務執行権および代表権を有しない（536 条３項）。そのため，匿名組合員には，営業者の業務に対する監視権が与えられているのである。"},{"l":9,"m":"匿名組合","sb":"","i":"B","r":"(令5I問題2ウ類・令4II問題2ア・平26II問題2ウ類)","q":"匿名組合員は，営業者の営業時間内は，いつでも，営業者の業務および財産の状況を調査することができる。","a":false,"c":"539条1項柱書,2項。","e":"匿名組合員は，営業年度の終了時において，営業者の業務および財産の状況を検査することができる。また，重要な事由があるときは，いつでも，裁判所の許可を得て，営業者の業務および財産の状況の検査をすることができる。したがって，いつでも検査をすることができるわけではないので，本肢は誤りである。"},{"l":10,"m":"匿名組合","sb":"","i":"B","r":"(令5I問題2エ)","q":"最高裁判所の判例によれば，営業者は匿名組合員に対して善管注意義務を負わない。","a":false,"c":"最判平28年9月6日。","e":"最高裁判所の判例の趣旨によれば，営業者は匿名組合員に対して善管注意義務を負う。"},{"l":11,"m":"匿名組合","sb":"","i":"B","r":"","q":"匿名組合契約において，匿名組合の存続期間を定めなかったとき，または，ある当事者の終身の間は匿名組合が存続することを定めたときは，各当事者は，６か月前にその予告をして，営業年度の終了時において匿名組合契約の解除をすることができる。","a":true,"c":"540条1項。","e":"また，やむを得ない事由があるときは，存続期間の定めの有無にかかわらず，いつでも匿名組合契約を解除することができる（540条２項）。"},{"l":12,"m":"匿名組合","sb":"","i":"B","r":"(平31I問題2ウ・平26II問題2エ類)","q":"匿名組合契約は，匿名組合員と営業者との間に特約がない限り，当該匿名組合員の死亡によって終了する。","a":false,"c":"541条各号参照。","e":"匿名組合契約は，当事者の意思にかかわらず，① 匿名組合の目的である事業の成功またはその成功の不能，②営業者の死亡または営業者が後見開始の審判を受けたこと，③ 営業者または匿名組合員が破産手続開始の決定を受けたことによって終了する（541 条）。なお，匿名組合契約の終了事由として，匿名組合員の死亡は定められていないため，本肢は誤りである。"},{"l":13,"m":"匿名組合","sb":"","i":"B","r":"","q":"匿名組合員は，匿名組合契約が終了したときは，その出資の価額の返還を請求することができるが，出資が損失によって減少した場合は，その残額の返還しか受けることができない。","a":true,"c":"542条。","e":""},{"l":1,"m":"仲介営業","sb":"仲立人","i":"A","r":"(平25I問題1ウ類)","q":"仲立人とは，特定の商人のために商行為の媒介をすることを業とする者をいう。","a":false,"c":"543条。","e":"仲立人は，他人間の商行為を媒介することを業とする者をいう。仲立人は，商人のために取引の成立に尽力するという点については，媒介代理商と共通の機能を有するが，媒介代理商が特定の商人のために継続して尽力するのに対して，仲立人は不特定多数の者のために尽力する点で本質的に異なる。"},{"l":2,"m":"仲介営業","sb":"仲立人","i":"B","r":"(平22I問題2ア)","q":"旅館営業者と客との間で，宿泊契約が成立するよう尽力することを営業とするものは，仲立人である。","a":true,"c":"543条。","e":"仲立人の具体例としては，宿泊契約の締結を媒介する旅行斡旋業や，不動産取引を仲介する不動産仲介業などがある。"},{"l":3,"m":"仲介営業","sb":"仲立人","i":"C","r":"(平30II問題1イ)","q":"宅地建物取引業者は民事仲立人であるから，商人ではない。","a":false,"c":"最判昭44年6月26日。","e":"最高裁判所の判例によれば，商行為でない不動産取引を媒介する宅地建物取引業者は，他人間の商行為の媒介を業とする者ではないことから，商事仲立人（543条）ではなく，民事仲立人ではあるが，502条11号にいう「仲立人に関する行為」を営業とする者であるので，商人である。"},{"l":4,"m":"仲介営業","sb":"仲立人","i":"C","r":"(令4II問題2イ)","q":"仲立人は，その媒介した売買契約の目的物を自ら売主に引き渡したときは，買主に対し，当該売買契約の代金の支払を請求することができる","a":false,"c":"544条。","e":"仲立人は，契約の当事者ではなく，契約の成立に尽力するという媒介行為を行うだけであるため，別段の意思表示や慣習がない限り，媒介により成立させた行為について，当事者のために支払いやその他の給付を受けることができない。"},{"l":5,"m":"仲介営業","sb":"仲立人","i":"B","r":"(平25I問題1ア)","q":"仲立人は，その媒介に係る行為について見本を受け取ったときは，その行為が完了するまでは，当該見本を保管しなければならない。","a":true,"c":"545条。","e":"見本売買の契約当事者間で，目的物をめぐって紛争が生じた場合のために，当該証拠を仲立人に保全させるためである。"},{"l":6,"m":"仲介営業","sb":"仲立人","i":"C","r":"","q":"仲立人が作成する結約書には，必ず，仲立人および各当事者の署名または記名押印が必要となる。","a":false,"c":"546条1項2項。","e":"当事者間において契約が成立した場合は，仲立人は遅滞なく，各当事者の氏名または名称，行為の年月日およびその要領を記載した結約書を作成し，これに署名または記名押印した後，これを各当事者に交付しなければならない（546 条１項）。なお，契約が直ちに履行するものでない場合（契約が期限付や条件付である結果，契約の履行が後日になる場合）は，仲立人は各当事者にも結約書に署名または記名押印させたうえで，各当事者に交付することが求められている（同条２項）。すなわち，仲立人の署名または記名押印は必ず必要であるが，各当事者の署名または記名押印は契約が直ちに履行するものでない場合にのみ必要であるため，本肢は誤りである。"},{"l":7,"m":"仲介営業","sb":"仲立人","i":"C","r":"","q":"当事者のうち一方が，結約書の受領や署名または記名押印を拒否した場合については，仲立人は遅滞なく，他方の当事者にその旨を通知しなければならない。","a":true,"c":"546条3項。","e":"なぜなら，このような場合には，その当事者に契約の成立や内容に関して何らかの異議があるためである。"},{"l":8,"m":"仲介営業","sb":"仲立人","i":"B","r":"(平25I問題1イ類)","q":"仲立人は帳簿を作成し，これに契約の各当事者の氏名または名称，行為の年月日およびその要領を記載しなければならず，当事者は，いつでも，この謄本の交付を請求することができる。","a":true,"c":"547条。","e":"仲立人日記帳は，仲立人に証拠を保存させるために作成が義務づけられている。"},{"l":9,"m":"仲介営業","sb":"仲立人","i":"C","r":"","q":"当事者がその氏名または名称を相手方に示してはならない旨を仲立人に命じた場合であっても，仲立人は，当事者に交付する結約書，および，仲立人が作成する帳簿の謄本にその氏名または名称を記載しなければならない。","a":false,"c":"548条。","e":"仲立人は，当事者がその氏名または名称を相手方に示してはならない旨を仲立人に命じたときは，当事者に交付する結約書，および，仲立人日記帳の謄本にその氏名または名称を記載してはならない。なぜなら，当事者はその相手方に自己の氏名または名称を知られない方が有利な場合があり得るし，相手方としても当事者を知る必要がない場合が少なくないためである。ただし，原本である仲立人日記帳には，必ず，当事者の氏名または名称を記載しなければならない。"},{"l":10,"m":"仲介営業","sb":"仲立人","i":"B","r":"(平29II問題2ウ類)","q":"仲立人は，当事者の一方の氏名または名称をその相手方に示さなかった場合であっても，当該相手方に対して自ら履行をする責任を負わない。","a":false,"c":"549条。","e":"仲立人は，当事者の一方の氏名または名称をその相手方に示さなかったときは，当該相手方に対して自ら履行する責任を負う。仲立人が当事者の氏名・名称の黙秘義務を履行した場合，相手方は仲立人を信頼して契約を締結することになるため，当該信頼した相手方を保護する必要があるためである。"},{"l":11,"m":"仲介営業","sb":"仲立人","i":"B","r":"(平29II問題2イ類・平25I問題1エ類)","q":"仲立人は，特約がない限り，報酬を当事者双方に請求することができない。","a":false,"c":"512条,550条2項。","e":"仲立人は商人であるため，特約がなくても報酬を当事者双方に等しい割合で請求することができる。"},{"l":12,"m":"仲介営業","sb":"仲立人","i":"B","r":"(平27I問題2ア類)","q":"仲立人は，結約書の交付を終えた後でなければ，報酬を請求することができない。","a":true,"c":"550条1項。","e":""},{"l":13,"m":"仲介営業","sb":"仲立人","i":"B","r":"(令6II問題2ア類・令2I問題2イ)","q":"宅地建物取引業者の媒介により，店舗の所有者と小売業者との間で当該店舗の賃貸借契約が成立した場合，当該宅地建物取引業者は当該賃貸借契約の当事者双方に報酬を半額ずつ請求することができる。","a":true,"c":"550条2項。","e":"本問における宅地建物取引業者は，店舗の所有者と小売業者との間で当該店舗の賃貸借契約の成立を媒介していることから，他人間の商行為の媒介を業とする仲立人である（543 条）。そして，仲立人の報酬は，当事者双方が等しい割合で負担することとされている。"},{"l":1,"m":"仲介営業","sb":"問屋","i":"A","r":"(平27I問題2イ類)","q":"問屋とは，他人の名をもって他人のために物品の売買をすることを業とする者をいう。","a":false,"c":"551条。","e":"問屋とは，自己の名をもって他人のために物品の売買をすることを業とする者をいう。"},{"l":2,"m":"仲介営業","sb":"問屋","i":"B","r":"(平29II問題2ア類)","q":"問屋は，他人のために売買契約をしたときは，問屋自身が売主または買主として，相手方に対して権利を取得し，義務を負う。","a":true,"c":"552条1項。","e":"問屋は，他人のために売買契約をしたときは，問屋自身が売主または買主として，相手方に対して権利を取得し，義務を負う。すなわち，相手方との関係では，通常の売買契約における売主・買主の関係と異ならないのである。"},{"l":3,"m":"仲介営業","sb":"問屋","i":"B","r":"","q":"問屋と委託者との関係については，商法の規定のほか，委任および代理に関する規定を準用する。","a":true,"c":"552条2項。","e":""},{"l":4,"m":"仲介営業","sb":"問屋","i":"B","r":"(平27II問題2イ)","q":"問屋が委託者のために物品の売買契約をしたが，相手方が当該契約上の債務を履行しない場合には，別段の意思表示または慣習がない限り，委託者に対して自ら履行する責任を負う。","a":true,"c":"553条。","e":"これは，委託者を保護するとともに，問屋制度の信用を維持する趣旨である。"},{"l":5,"m":"仲介営業","sb":"問屋","i":"B","r":"(令4II問題2ウ類・平30I問題2ウ類)","q":"問屋が，委託者の指定した価格よりも安く物品を売ったり，委託者の指定した価格よりも高く物品を買ったりした場合であっても，当該売買の効果は委託者に対して効力を有する。","a":false,"c":"554条。","e":"問屋は指値に従わなければならない。したがって，問屋が指値よりも安く販売したり，指値よりも高く買い入れたりしたならば，委託者としては，当該売買の効果を自己に帰属させることを拒否することができる。しかし，この場合において，問屋が指定した額との差額について支払う旨の意思表示をした場合については，当該売買の効果は委託者に対して効力を有する（554 条）。すなわち，この場合は，委託者は自己への帰属を拒否することができないのである。"},{"l":6,"m":"仲介営業","sb":"問屋","i":"B","r":"(平31II問題2エ類・平27II問題2ア類)","q":"問屋は，いかなる場合であっても，自ら買主または売主となることができない。","a":false,"c":"555条1項。","e":"問屋が取引所の相場のある物品の売買の委託を受けたときは，自ら買主または売主となることができる。この場合，委託を受けた問屋自身が同時に売買契約の相手方の地位に立つことになる。本来，このような契約は，委託者と問屋との間の利益相反を招き，委託者の利益が害されるおそれがあるが，物品に取引所の相場のような客観的な基準があるときには，当該弊害を排除することができるし，かえって問屋および委託者の双方にとって有利なこともあるため，問屋には介入権が認められている。"},{"l":7,"m":"仲介営業","sb":"問屋","i":"B","r":"(令6II問題2イ)","q":"問屋が，取引所の相場がある物品の販売または買入れの委託を受けた場合において，自ら売主または買主となったときは，委託者に対して報酬を請求することができない。","a":false,"c":"555条2項。","e":"介入権を行使した場合でも，委託を実行したことになるので，問屋は委託者に対して報酬を請求することができる。"},{"l":8,"m":"仲介営業","sb":"問屋","i":"C","r":"","q":"問屋が物品の買入れを委託された場合において，委託者が買い入れた物品の受領を拒み，またはこれを受領することができないときは，当該委託者が商人である場合に限って，その物を供託することができ，また，相当の期間を定めて催告をした後に競売に付すことができる。","a":false,"c":"556条,524条。","e":"問屋が物品の買入れを委託された場合において，委託者が買い入れた物品の受領を拒み，またはこれを受領することができないときは，その物を供託することができ，また，相当の期間を定めて催告をした後に競売に付すことができる。この場合，委託者が商人である必要はない。"},{"l":9,"m":"仲介営業","sb":"問屋","i":"B","r":"(平27II問題2エ類)","q":"問屋は，委託者のために物品の売買を行ったときには，遅滞なく，委託者に対して，その旨の通知を発しなければならない。","a":true,"c":"557条,27条。","e":""},{"l":10,"m":"仲介営業","sb":"問屋","i":"B","r":"(平27II問題2ウ・平22I問題2イ類)","q":"問屋は，物品の販売または買入の取次ぎをしたことによって生じた債権の弁済期が到来しているときは，その弁済を受けるまでは，委託者のために当該問屋が占有する物または有価証券を留置することができる。","a":true,"c":"557条,31条。","e":"問屋の留置権である。"},{"l":11,"m":"仲介営業","sb":"問屋","i":"B","r":"","q":"問屋の留置権については，物品の販売または買入れによって生じた債権と留置する目的物に牽連性は必要とされない。","a":true,"c":"557条,31条。","e":""},{"l":12,"m":"仲介営業","sb":"問屋","i":"B","r":"","q":"問屋の留置権の目的物は，債務者の所有に属する必要がある。","a":false,"c":"557条,31条。","e":"問屋の留置権の目的物は，債務者の所有に属する必要はない。問屋の性質上，物品の占有を第三者から取得することが多く，この場合には，目的物の所有権の帰属や占有取得の原因を問題とせずに留置権を認めるのが妥当であるからである。"},{"l":1,"m":"仲介営業","sb":"準問屋","i":"C","r":"","q":"準問屋とは，自己の名をもって他人のために物品の売買以外の行為をすることを業とする者をいい，準問屋には問屋の規定が準用される。","a":true,"c":"558条。","e":"準問屋には問屋に関する規定が準用される。準問屋の具体例としては，広告，旅客運送，宿泊の取次業者などである。"},{"l":1,"m":"運送営業","sb":"総則","i":"B","r":"(平24II問題2ア)","q":"運送人とは，自己の名をもって物品運送の取次ぎをなすことを業とする者をいう。","a":false,"c":"569条1号。","e":"運送人とは，陸上運送，海上運送または航空運送の引受けをすることを業とする者をいう。自己の名をもって物品運送の取次ぎをなすことを業とする者については，運送取扱人（559条１項）に該当するので，本肢は誤りである。"},{"l":2,"m":"運送営業","sb":"総則","i":"B","r":"(平29I問題2エ)","q":"運送に関する行為は，絶対的商行為である。","a":false,"c":"501条各号参照。","e":"運送に関する行為は，営業的商行為である（502条４号）。"},{"l":1,"m":"運送営業","sb":"物品運送","i":"B","r":"","q":"物品運送契約は，運送人が荷送人からある物品を受け取りこれを運送して荷受人に引き渡すことを約し，荷送人がその結果に対してその運送賃を支払うことを約することによって，その効力を生ずる。","a":true,"c":"570条。","e":"物品運送契約は，運送という仕事の完成を目的とするものであり，請負契約の一種である。なお，物品運送契約は，荷送人と運送人を契約の当事者とするものであるが，運送品が目的に到着し，または運送品の全部が滅失したときは，荷受人は荷送人と同様の権利を取得する（581条）。"},{"l":2,"m":"運送営業","sb":"物品運送","i":"B","r":"","q":"荷送人は，運送品が引火性，爆発性その他の危険性を有するものであるときは，その引渡しの前に，運送人に対し，その旨および当該運送品の品名，性質その他の当該運送品の安全な運送に必要な情報を通知しなければならない。","a":true,"c":"572条。","e":"危険物とは，物理的に危険な運送品を指し，例えば，ガソリン，灯油，火薬類，高圧ガス，アルコール濃度の高い化粧品等が該当する。危険物の適切な取扱いによる運送の安全確保を図るための規定である。"},{"l":3,"m":"運送営業","sb":"物品運送","i":"C","r":"","q":"荷送人は，運送人に対し，運送の中止を請求することができない。","a":false,"c":"580条前段。","e":"荷送人は，運送人に対して，運送の中止，荷受人の変更その他の処分を請求することができる（580 条前段）。したがって，運送人は，その請求に従った処分をなす義務を負う。なぜなら，運送には時間を要することがあり，運送中の市場の動向や買主の信用状態の変化に対応することができるようにする必要があるためである。また，荷送人が処分権を行使した場合，運送人は，既になした運送の割合に応ずる運送賃，付随の費用，立替金，およびその処分によって生じた費用の弁済を荷送人等に対して請求することができる（同条後段）。これは，運送人の利益を保護する趣旨である。"},{"l":4,"m":"運送営業","sb":"物品運送","i":"C","r":"","q":"運送品が到達地に到達した後，荷受人がその引渡しを請求した場合であっても，荷送人は，運送人に対し，荷受人の変更を請求することができる。","a":false,"c":"581条2項。","e":"運送品が到達地に到達した後，荷受人がその引渡しを請求した場合，または，運送品の全部滅失について荷受人が損害賠償の請求をした場合は，荷送人は処分権（580条前段）を行使することができない。"},{"l":5,"m":"運送営業","sb":"物品運送","i":"B","r":"(平24II問題2イ類)","q":"荷送人は，運送人の請求により，送り状を交付しなければならない。","a":true,"c":"571条1項。","e":"送り状は，運送品や荷受人など，運送契約の内容を運送人に知らせるために必要となる。送り状は書面で作成するのが原則であるが，運送人の承諾があれば，電磁的方法により提供することができる（571条２項）。"},{"l":6,"m":"運送営業","sb":"物品運送","i":"B","r":"","q":"運送賃は，到達地における運送品の引渡しと同時に，支払わなければならない。","a":true,"c":"573条1項。","e":""},{"l":7,"m":"運送営業","sb":"物品運送","i":"B","r":"","q":"運送品がその性質または瑕疵によって滅失し，または損傷したときは，荷送人は，運送賃の支払いを拒むことができない。","a":true,"c":"573条2項。","e":""},{"l":8,"m":"運送営業","sb":"物品運送","i":"B","r":"","q":"運送人の留置権については，被担保債権と留置する目的物に牽連性が必要となる。","a":true,"c":"574条。","e":"運送取扱人の留置権も同様である（562 条）。運送取扱人および運送人の留置権において，牽連性が要求される趣旨は，荷受人の利益の保護である。運送取扱契約や運送契約においては，委託者と運送品の荷受人が同一でない場合があり，その場合に，当該運送品と牽連性のない債権について留置権が認められてしまうと，荷受人の利益を害することになる。したがって，商人間の留置権（521条）や代理商および問屋の留置権（31条，557条）では要求されない目的物と債権の牽連性が，運送取扱人および運送人の留置権には要求されているのである。"},{"l":9,"m":"運送営業","sb":"物品運送","i":"A","r":"(平31II問題2ウ・平24II問題2エ)","q":"荷受人は，運送品が到達地に到着したときは，物品運送契約によって生じた荷送人の権利と同一の権利を取得する。","a":true,"c":"581条1項。","e":"荷受人は，運送契約の当事者ではないが，運送品が到達地に達し，または運送品の全部が滅失したときは，物品運送契約により生じた荷送人の権利を取得する。荷受人が取得する，運送契約により生じた荷送人の権利とは，① 運送品の引渡しを受ける権利，② 運送品の処分権（580条），③ 運送人への損害賠償請求権（575条）である。"},{"l":10,"m":"運送営業","sb":"物品運送","i":"B","r":"(令6II問題2エ類・令2I問題2ウ類・平27I問題2ウ)","q":"運送人は，荷送人と荷受人が同一である場合を除き，荷受人に対して運送賃を請求することができない。","a":false,"c":"581条3項。","e":"荷受人が運送品を受け取った場合には，荷受人は，運送人に対し，運送賃その他の費用を支払う義務を負う。この場合，荷受人は荷送人と連帯して運送賃等を支払う義務を負うこととなる。"},{"l":11,"m":"運送営業","sb":"物品運送","i":"B","r":"","q":"運送人は，運送品の受取から引渡しまでの間にその運送品が滅失しもしくは損傷し，もしくはその滅失もしくは損傷の原因が生じ，または運送品が延着したときは，運送人が，その運送品の受取，運送，保管および引渡しに関して注意を怠らなかったことを証明した場合であっても，これによって生じた損害を賠償する責任を負う。","a":false,"c":"575条。","e":"運送人は，運送品の受取から引渡しまでの間にその運送品が滅失しもしくは損傷し，もしくはその滅失もしくは損傷の原因が生じ，または運送品が延着したときは，これによって生じた損害を賠償する責任を負う。ただし，運送人が，その運送品の受取，運送，保管および引渡しに関して注意を怠らなかったことを証明したときは，この限りではない。すなわち，立証責任が運送人に転換された過失責任である。"},{"l":12,"m":"運送営業","sb":"物品運送","i":"B","r":"","q":"市場価格のある運送品について，滅失または損傷があった場合における運送人の損害賠償額は，運送人に故意または重過失がある場合を除いて，その引渡しがされるべき地および時における運送品の市場価格によって定める。","a":true,"c":"576条1項,3項。","e":"損害賠償額の定型化の趣旨は，運送人の保護と大量の運送を頻繁に行う運送取引の法律関係の画一的処理を図ったものである。すなわち，運送人の損害賠償額を一定限度に定型化することで，膨大な損害賠償額の請求から運送人を保護すると同時に，損害賠償額に関する紛争を防止することができるのである。ただし，運送人が故意・重過失のときには，運送人の保護の必要性はないので，損害賠償額の定型化の規定は適用されない。また，運送品に市場価格がないときは，その地および時における同種類で同一の品質の物品の正常な価格によって定めることとされている。"},{"l":13,"m":"運送営業","sb":"物品運送","i":"B","r":"","q":"市場価格のある運送品について，滅失または損傷もなく延着した場合における運送人の損害賠償額は，運送人に故意または重過失がある場合を除いて，その引渡しがされるべき地および時における運送品の市場価格によって定める。","a":false,"c":"576条参照。","e":"滅失または損傷がなく単に延着した場合の損害賠償額については，商法上，特に規定がなされていないため，民法の原則（民法415条，416条）に戻り，債務不履行と相当因果関係のある損害を賠償しなければならない。"},{"l":14,"m":"運送営業","sb":"物品運送","i":"B","r":"","q":"貨幣，有価証券その他の高価品については，荷送人が運送を委託するにあたってその種類および価格を明告しなければ，運送人が損害賠償責任を負うことはない。","a":false,"c":"577条。","e":"荷送人が運送を委託するにあたってその種類および価格を明告しない場合であっても，①物品運送契約の締結の当時，運送品が高価品であることを知っていたとき，②運送人の故意または重過失によって，高価品の滅失，損傷または延着が生じたときは，損害賠償責任を負う。"},{"l":15,"m":"運送営業","sb":"物品運送","i":"C","r":"","q":"運送人の損害賠償責任は，荷受人が異議をとどめないで運送品を受取ったときは，原則として消滅する。","a":true,"c":"584条1項本文。","e":"ただし，荷受人が異議をとどめないで運送品を受け取った場合であっても，運送品の引渡時に，運送人がその運送品に損傷または一部滅失があることを知っていたときは，運送人の責任は消滅しない（584条２項）。"},{"l":16,"m":"運送営業","sb":"物品運送","i":"C","r":"","q":"運送人が運送品の全部を滅失させた場合の運送人の責任は，運送品の引渡しがされるべき日から１年以内に裁判上の請求がされないときに，時効により消滅する。","a":true,"c":"585条1項。","e":"運送人の責任は，運送品の引渡しがされた日（全部滅失の場合は引渡されるべき日）から１年以内に裁判上の請求がされないときに，時効により消滅する。"},{"l":17,"m":"運送営業","sb":"物品運送","i":"C","r":"","q":"運送品が滅失した場合の運送人の責任に対する高価品の特則は，物品運送契約に基づく損害賠償責任のみに適用されるものであり，不法行為責任に対しては準用されない。","a":false,"c":"587条。","e":"運送人の契約責任の損害賠償責任に関する減免規定を不法行為責任に準用することとされている（587 条本文）。準用される減免規定としては，① 損害賠償額の定型化（576条），② 高価品の特則（577条），③ 運送人の損害賠償責任の消滅（584条，585条）がある。"},{"l":1,"m":"運送営業","sb":"旅客運送","i":"C","r":"","q":"旅客の生命または身体の侵害による運送人の損害賠償の責任を免除し，または軽減する特約は，有効である。","a":false,"c":"591条1項。","e":"旅客の生命または身体の侵害による運送人の損害賠償の責任を免除し，または軽減する特約は，無効である。旅客運送契約は，車両等に旅客を乗せて高速度で場所を移動するという点で，とりわけ人の生命または身体に対する危険性が高いものであるから，運送人の損害賠償責任について免責を認めないとしたものである。なお，免責特約のうち運送の遅延を主たる原因とするものは，一律無効とされずに免責特約の余地が残されている。また，① 大規模な火災，震災その他の災害が発生し，または発生するおそれがある場合に運送を行うとき，② 運送に伴い通常生ずる振動その他の事情により生命または身体に重大な危険が及ぶおそれがある者の運送を行うときも，免責特約の余地が残されている（591条２項）。"},{"l":2,"m":"運送営業","sb":"旅客運送","i":"C","r":"","q":"運送人は，旅客から引渡しを受けた手荷物については，運送賃を請求した場合に限って，物品運送契約における運送人と同一の責任を負う。","a":false,"c":"592条1項。","e":"運送人は，旅客から引渡しを受けた手荷物については，運送賃を請求しないときであっても，物品運送契約における運送人と同一の責任を負う。具体的には，損害賠償額の定型化（576条）や高価品の特則（577条）などの規定が適用されることになる。"},{"l":3,"m":"運送営業","sb":"旅客運送","i":"C","r":"","q":"運送人は，旅客から引渡しを受けていない手荷物（身の回り品を含む。）の滅失または損傷については，一切，損害賠償責任を負わない。","a":false,"c":"593条1項。","e":"運送人は，旅客から引渡しを受けていない手荷物（身の回り品を含む。）の滅失または損傷については，故意または過失がある場合を除き，損害賠償責任を負わない。"},{"l":1,"m":"運送取扱人","sb":"","i":"C","r":"","q":"運送取扱人とは，自己の名をもって物品運送または旅客運送の取次ぎをすることを業とする者をいう。","a":false,"c":"559条1項。","e":"運送取扱人とは，自己の名をもって物品運送の取次ぎをすることを業とする者をいう。ここで，旅客運送の取次ぎを業とする者は，準問屋に該当するため，本肢は誤りである。"},{"l":2,"m":"運送取扱人","sb":"","i":"C","r":"","q":"運送取扱人は，運送品の受取から荷受人への引渡しまでの間におけるその運送品の滅失については，運送取扱人がその運送品の受取，保管および引渡し，運送人の選択その他の運送の取次ぎについて注意を怠らなかったことを証明した場合であっても，損害賠償責任を免れることができない。","a":false,"c":"560条。","e":"運送取扱人は，運送品の受取から荷受人への引渡しまでの間にその運送品が滅失しもしくは損傷し，もしくはその滅失もしくは損傷の原因が生じ，または運送品が延着したときは，運送取扱人がその運送品の受取，保管および引渡し，運送人の選択その他の運送の取次ぎについて注意を怠らなかったことを証明した場合を除き，これによって生じた損害を賠償する責任を負う。すなわち，立証責任が運送取扱人に転換された過失責任である。運送取扱人の損害賠償額については，運送人の場合のような損害額を定型化する規定（576条）は存在しないため，民法の原則に戻り，債務不履行と相当因果関係のある損害を賠償しなければならない。ただし，高価品の特則については，運送人の規定が準用される（564条，577条）。"},{"l":3,"m":"運送取扱人","sb":"","i":"C","r":"","q":"運送取扱人は，運送品を運送人に引渡したときは，直ちに，その報酬を請求することができる。","a":true,"c":"561条1項。","e":"運送取扱人は，運送品を運送人に引渡したときは，直ちに，その報酬を請求することができる。なぜなら，運送取扱人は，運送契約を成立させて，運送品を運送人に引渡したときに委任された事務が完了することになるためである。"},{"l":4,"m":"運送取扱人","sb":"","i":"C","r":"","q":"運送取扱契約において運送賃の額を定めた場合は，特約のない限り，別に報酬を請求することはできない。","a":true,"c":"561条2項。","e":"この場合は，確定運送賃から実際に要した運送賃を差し引いた額が運送取扱人の報酬となると考えられるためである。"},{"l":5,"m":"運送取扱人","sb":"","i":"C","r":"","q":"運送取扱人は，自ら運送をなすことができない。","a":false,"c":"563条1項前段。","e":"運送取扱人は，特約がない限り，自ら運送をなすことができる。この場合には，運送取扱人は，運送人と同一の権利義務を有する（563 条１項後段）。運送取扱人は運送営業を兼ねていることがあり，運送取扱人が運送人を兼ねることが，運送取扱契約の当事者双方にとって便宜な場合もあることから，運送取扱人の介入権が認められているのである。なお，運送の場合には，問屋の介入権のような制限（取引所の相場がある物品に限ること）は規定されていない。これは，運送賃や運送方法は一般に定型化されているため，問屋のような要件を特に置かなくても弊害がないと考えられるからである。"},{"l":6,"m":"運送取扱人","sb":"","i":"C","r":"","q":"運送取扱人の責任は，荷受人に対する運送品の引渡しがされた日（全部滅失の場合は引渡しがされるべき日）から１年以内に裁判上の請求がされないときは，消滅する。","a":true,"c":"564条,585条。","e":"運送取扱人の責任に関する短期消滅時効については，物品運送契約における運送人の責任に関する短期消滅時効（585条）が準用される。"},{"l":7,"m":"運送取扱人","sb":"","i":"C","r":"","q":"荷受人が運送品を受け取った場合には，荷受人は，運送取扱人に対し，運送賃その他の費用を支払う義務を負う。","a":true,"c":"564条,581条。","e":"この場合，荷受人は委託者と連帯して運送賃等を支払う義務を負うこととなる。"},{"l":1,"m":"倉庫営業・場屋営業","sb":"倉庫営業","i":"C","r":"","q":"倉庫営業者とは，他人のために物品を倉庫に保管することを業とする者をいう。","a":true,"c":"599条。","e":""},{"l":2,"m":"倉庫営業・場屋営業","sb":"倉庫営業","i":"C","r":"","q":"倉荷証券は，倉荷証券を交付することにより譲渡することができる。","a":false,"c":"606条。","e":"倉荷証券は，法律上当然の指図証券であるため，譲渡する際に裏書を要する。"},{"l":3,"m":"倉庫営業・場屋営業","sb":"倉庫営業","i":"C","r":"","q":"倉庫営業者は，その営業の範囲内において寄託を受けたときは，報酬を受けないときでも，善良な管理者の注意をもって寄託物を保管する義務を負う。","a":true,"c":"595条。","e":""},{"l":4,"m":"倉庫営業・場屋営業","sb":"倉庫営業","i":"C","r":"","q":"当事者が寄託物の保管期間を定めなかったときは，倉庫営業者は，いつでも，寄託物の返還をすることができる。","a":false,"c":"612条。","e":"当事者が寄託物の保管期間を定めなかったときは，倉庫営業者は，寄託物の入庫の日から６か月を経過した後でなければ，その返還をすることができない（612 条本文）。ただし，やむを得ない事由がある場合は，いつでも返還することが認められる（612条ただし書）。当該返還の制限規定は，寄託者の保護のために設けられている。すなわち，倉庫営業者に寄託をしようとする者は，ある程度の期間について保管してもらうことを期待していたはずであり，いつでも返還されてしまうとなると，倉庫を利用する経済的意義を失うこととなってしまうためである。"},{"l":5,"m":"倉庫営業・場屋営業","sb":"倉庫営業","i":"B","r":"(令4I問題2ウ・平31I問題2エ)","q":"倉庫営業者が寄託物について倉荷証券を発行した場合は，倉庫営業者は，倉荷証券の所持人に対してこれと引換えでなければ，寄託物の返還をすることを要しない。","a":true,"c":"613条。","e":""},{"l":6,"m":"倉庫営業・場屋営業","sb":"倉庫営業","i":"C","r":"","q":"倉荷証券の所持人は，営業時間内であれば，いつでも，倉庫営業者に対して，寄託物の点検や見本の提供を求め，またはその保存に必要な処分をすることができる。","a":true,"c":"609条。","e":""},{"l":7,"m":"倉庫営業・場屋営業","sb":"倉庫営業","i":"C","r":"(令2I問題2エ)","q":"受寄物の一部が出庫された場合，倉庫営業者は，出庫された割合に応じて保管料を請求することができる。","a":true,"c":"611条ただし書。","e":"倉庫営業者は，寄託物を出庫した時に，保管料および立替金その他受寄物に関する費用の支払を請求することができる（611条本文）。また，受寄物の一部が出庫された場合は，出庫された割合に応じた請求をすることができる（611条ただし書）。"},{"l":8,"m":"倉庫営業・場屋営業","sb":"倉庫営業","i":"C","r":"","q":"倉庫営業者は，寄託物の保管に関して注意を怠らなかったことを証明しなければ，その滅失または損傷について損害賠償責任を免れることができない。","a":true,"c":"610条。","e":"倉庫営業者は，寄託物の保管に関して注意を怠らなかったことを証明しなければ，その滅失または損傷について損害賠償責任を免れることができない。すなわち，立証責任が倉庫営業者に転換された過失責任である。当該責任は，民法の債務不履行責任に関する原則（民法415条）を注意的に規定したにすぎないと解されている。"},{"l":9,"m":"倉庫営業・場屋営業","sb":"倉庫営業","i":"C","r":"(令4I問題2エ)","q":"貨幣，有価証券その他の高価品については，寄託者が倉庫営業者に寄託するにあたってその種類および価格を明告しなければ，倉庫営業者は，その物品の滅失または損傷によって生じた損害賠償責任を負わない。","a":false,"c":"","e":"倉庫営業者については，高価品の特則の規定はない。"},{"l":1,"m":"倉庫営業・場屋営業","sb":"場屋営業","i":"A","r":"(平30I問題2エ類・平27I問題2エ類・平22I問題2エ類)","q":"場屋営業者は，客から寄託を受けた物品の滅失または損傷について，その保管に関し，注意を怠らなかったことを証明しなければ，客から受けた物品の滅失または損傷について損害賠償責任を負う。","a":false,"c":"596条1項。","e":"場屋営業者は，客から受けた物品の滅失または損傷については，不可抗力によることを証明しなければ，損害賠償責任を免れることができない。当該趣旨は，場屋に来集する客を保護することにある。すなわち，場屋には多数の人数が頻繁に出入りをし，客自身がその所持品の安全を守ることは困難であるので，場屋営業者に厳格な責任を負わせたのである。"},{"l":2,"m":"倉庫営業・場屋営業","sb":"場屋営業","i":"B","r":"","q":"場屋営業者は，客が寄託していない物品であっても，場屋の中に携帯した物品が，場屋営業者が注意を怠ったことによって滅失または損傷した場合には，損害賠償責任を負う。","a":true,"c":"596条2項。","e":"本来，場屋営業者は，寄託を受けていない以上，契約上の責任を負わないはずであるが，場屋に来集する客の保護を図るために，場屋営業者の責任を厳格にしたのである。"},{"l":3,"m":"倉庫営業・場屋営業","sb":"場屋営業","i":"B","r":"(令4I問題2イ)","q":"場屋営業者は，客が場屋の中に携帯した物品について責任を負わない旨を表示した場合は，損害賠償責任を免れることができる。","a":false,"c":"596条3項。","e":"場屋営業者は，客が場屋の中に携帯した物品について責任を負わない旨を表示した場合であっても，損害賠償責任を免れることができない。すなわち，一方的な表示では，責任は軽減されないことが規定されているのである。"},{"l":4,"m":"倉庫営業・場屋営業","sb":"場屋営業","i":"B","r":"","q":"貨幣，有価証券その他の高価品については，客がその種類および価額を通知してこれを場屋営業者に寄託した場合を除き，場屋営業者は，その滅失または損傷によって生じた損害賠償責任を負わない。","a":true,"c":"597条。","e":"高価品の特則の趣旨は，場屋営業者が予想外に巨額の損害賠償責任を負う結果となることを防止することにある。"}]},{"n":13,"name":"金融商品取引法","qs":[{"l":1,"m":"総論","sb":"有価証券","i":"A","r":"","q":"国債証券および地方債証券は，金融商品取引法上の有価証券に該当する。","a":true,"c":"2条1項1号2号。","e":""},{"l":2,"m":"総論","sb":"有価証券","i":"A","r":"","q":"証券が発行されていない株式，新株予約権および社債は，金融商品取引法上の有価証券とみなされる。","a":true,"c":"2条1項5号9号,2項柱書前段。","e":"証券が発行されていない権利であっても，２条１項各号の有価証券に表示されるべき権利で有価証券が発行されていないものは，有価証券表示権利として，金融商品取引法上の有価証券とみなされる。"},{"l":3,"m":"総論","sb":"有価証券","i":"B","r":"","q":"小切手や倉荷証券は，金融商品取引法上の有価証券に該当しない。","a":true,"c":"2条1項各号参照。","e":"券面額の支払請求権を表章する証券である小切手や物品の引渡請求権を表章する証券である倉荷証券は，投資性がないため，金融商品取引法上の有価証券に該当しない。"},{"l":4,"m":"総論","sb":"有価証券","i":"B","r":"(平21問題19イウ)","q":"資産流動化法に規定する優先出資証券や抵当証券法に規定する抵当証券は，金融商品取引法上の有価証券に該当するが，特定有価証券には該当しない。","a":false,"c":"2条1項8号16号,5条1項,施行令2条の13第1号8号。","e":"資産流動化法に規定する優先出資証券や抵当証券法に規定する抵当証券は，金融商品取引法の有価証券に該当するため，前段は正しいが，特定有価証券に該当するため，本肢は誤りである。特定有価証券は，資産金融型証券にあたるものであり，その投資者の投資判断に重要な影響を及ぼす情報がその発行者が行う資産の運用その他これに類似する事業に関する情報である有価証券をいう（５条１項）。この他，特定有価証券に該当するものとされているものは，資産流動化に規定する特定社債券や優先出資証券等，投信法上の投資信託の受益証券，有価証券投資事業権利等が挙げられる（施行令２条の13）。このような特定有価証券は，開示情報の内容などについて特定有価証券以外の有価証券とは異なる制度が設けられており，発行者自身の情報よりも，その資産の価値の裏づけとなっている資産の内容やその管理運用の状況，あるいはそれらを証券化するためにいかなる仕組みが用いられているかといった情報の開示が求められる（５条５項，24条５項等）。"},{"l":5,"m":"総論","sb":"有価証券","i":"B","r":"(平21問題19アエ)","q":"社債券や新株予約権証券は，金融商品取引法上の有価証券に該当するが，特定有価証券には該当しない。","a":true,"c":"2条1項5号9号,5条1項,施行令2条の13各号参照。","e":""},{"l":6,"m":"総論","sb":"有価証券","i":"B","r":"","q":"コマーシャル・ペーパーは，金融商品取引法上の有価証券に該当する。","a":true,"c":"2条1項15号。","e":""},{"l":7,"m":"総論","sb":"有価証券","i":"B","r":"(平31II問題19エ・平25II問題19イ)","q":"募集社債の募集事項として社債券を発行する旨を定めた会社において，社債券が発行される前の社債権者の権利は，金融商品取引法上の有価証券とみなされる。","a":true,"c":"2条2項柱書前段。","e":"２条１項の有価証券に表示されるべき権利で有価証券が発行されていないものは，有価証券表示権利として，有価証券とみなされる。"},{"l":8,"m":"総論","sb":"有価証券","i":"B","r":"(平31II問題19ウ類)","q":"信託の受益権は，金融商品取引法上の有価証券とみなされる。","a":true,"c":"2条2項1号。","e":""},{"l":9,"m":"総論","sb":"有価証券","i":"A","r":"(平22II問題19ア)","q":"その社員の過半数が個人である合名会社の社員権は，金融商品取引法上の有価証券とみなされる。","a":false,"c":"2条2項3号,施行令1条の2第1号。","e":"合名会社の社員権については，その社員のすべてが株式会社または合同会社に該当するものが有価証券とみなされる。"},{"l":10,"m":"総論","sb":"有価証券","i":"A","r":"(平25II問題19ア類・平22II問題19イ類・平22II問題19ウ)","q":"その無限責任社員のすべてが株式会社であり，かつ有限責任社員の半数が個人である合資会社の社員権は，金融商品取引法上の有価証券とみなされる。","a":true,"c":"2条2項3号,施行令1条の2第2号。","e":"合資会社の社員権については，その無限責任社員のすべてが株式会社または合同会社に該当するものが有価証券とみなされる。"},{"l":11,"m":"総論","sb":"有価証券","i":"A","r":"(平31II問題19ア・平22II問題19エ類)","q":"合同会社の社員権は，金融商品取引法上の有価証券とみなされることはない。","a":false,"c":"2条2項3号。","e":"合同会社の社員権については，すべて有価証券とみなされる。"},{"l":12,"m":"総論","sb":"有価証券","i":"C","r":"","q":"商法上の匿名組合契約に基づく権利は，金融商品取引法上の有価証券とみなされることはない。","a":false,"c":"2条2項5号。","e":"① 民法上の組合契約に基づく権利，② 商法上の匿名組合契約に基づく権利，③ 投資事業有限責任組合契約に基づく権利（日本版ＬＰＳ），④ 有限責任事業組合契約に基づく権利（日本版ＬＬＰ），⑤ 社団法人の社員権その他の権利のうち，当該権利を有する者（出資者）が出資または拠出した金銭を充てて行う事業から生ずる収益の配当または当該出資対象事業に係る財産の分配を受けることができる権利は，投資者保護を図る必要性が低いと考えられるもの（２条２項５号イ～ニ）を除き，有価証券とみなされる。これを，集団投資スキーム持分という。"},{"l":1,"m":"総論","sb":"開示対象有価証券","i":"A","r":"","q":"金融商品取引法上の有価証券に該当すれば，企業内容等の開示に関する規制が必ず適用される。","a":false,"c":"3条参照。","e":"金融商品取引法上の有価証券に該当しても，企業内容等の開示に関する規制が適用されない場合がある。"},{"l":2,"m":"総論","sb":"開示対象有価証券","i":"A","r":"(令3問題19ウ・平27II問題17ア・平23II問題19ア)","q":"国債証券および地方債証券については，企業内容等の開示に関する規制は適用されない。","a":true,"c":"3条1号。","e":"これは，債務不履行の懸念がないためである。"},{"l":3,"m":"総論","sb":"開示対象有価証券","i":"B","r":"","q":"医療法に規定される社会医療法人債券については，企業内容等の開示に関する規制は適用されない。","a":false,"c":"3条2号かっこ書,施行令2条の8。","e":"特別の法律により法人の発行する債券等のうち，企業内容等の開示を行わせることが公益または投資者保護のため必要かつ適当なものとして政令で定めるものは，開示規制が免除されない。ここで，政令では，医療法に規定する社会医療法人債券がこれに規定されている。これは，会社法上の社債に類似するためと説明される。"},{"l":4,"m":"総論","sb":"開示対象有価証券","i":"A","r":"(平31II問題19イ・平27II問題17イ・平23II問題19エ)","q":"貸付信託の受益証券については，企業内容等の開示に関する規制は適用されない。","a":true,"c":"3条2号。","e":"貸付信託の受益証券の募集に関しては，貸付信託法のもと，貸付信託に係る信託契約の締結に関する公告によって開示がなされるためである。"},{"l":5,"m":"総論","sb":"開示対象有価証券","i":"C","r":"(令3問題19エ類・平27II問題17ウ類)","q":"集団投資スキーム持分については，企業内容等の開示に関する規制が適用される。","a":false,"c":"3条3号イ。","e":"集団投資スキーム持分は，原則として，企業内容の開示に関す
