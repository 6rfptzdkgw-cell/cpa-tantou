る規制は適用されないが，有価証券投資事業権利等に該当する場合には，企業内容の開示規制が適用される。なぜなら，有価証券投資事業権利等の情報は，直接の投資者だけでなく，証券市場における他の投資者の投資判断にとっても重要な情報であるためである。ここで，集団投資スキーム持分の権利に係る出資対象事業が，主として有価証券に対する投資を行う事業である場合（集団投資スキーム持分の権利を有する者が出資または拠出した金銭その他の財産の価額の合計額の 50％超が有価証券に対する投資を行う事業に充てられている場合）は，有価証券投資事業権利等とされる。"},{"l":1,"m":"発行開示","sb":"投資者の属性","i":"B","r":"(平27I問題17エ)","q":"保険会社は，金融商品取引法上の適格機関投資家に当たらない。","a":false,"c":"2条3項1号かっこ書,定義府令10条1項5号。","e":"金融商品取引法は，投資に関する専門的知識を有する特定投資家（プロ投資家）と，それ以外の一般投資家（法律上の用語は特定投資家以外の顧客）を区分して，プロである特定投資家向けの市場において取引される有価証券については開示規制を緩和している。そして，特定投資家の中で，さらに有価証券に対する投資に係る専門的知識および経験を有する者として，適格機関投資家という属性を置いている。具体的には，証券会社，銀行，保険会社等の金融機関のほか，有価証券残高が10億円以上の法人で届出を行った者や有価証券保有残高が10億円以上かつ取引経験１年以上の個人で届出を行った者は適格機関投資家に該当する。"},{"l":2,"m":"発行開示","sb":"投資者の属性","i":"B","r":"(平27I問題17イ)","q":"銀行は，金融商品取引法上の適格機関投資家に該当する。","a":true,"c":"2条3項1号かっこ書,定義府令10条1項4号。","e":"上記問題１の解説参照。"},{"l":3,"m":"発行開示","sb":"投資者の属性","i":"B","r":"(平27I問題17アウ)","q":"国および日本銀行は，金融商品取引法上の適格機関投資家に該当する。","a":false,"c":"2条3項1号かっこ書,定義府令10条1項各号参照。","e":"国および日本銀行は，特定投資家に分類されるが（２条31項２号３号），適格機関投資家ではない。"},{"l":1,"m":"発行開示","sb":"募集と売出し","i":"B","r":"(令2I問題16ア類)","q":"新たに発行される有価証券の取得勧誘のうち，50名以上の者を相手方とするものは，常に，有価証券の募集に該当する。","a":false,"c":"2条3項1号2号。","e":"多数の者（50名以上）を相手方とする新たに発行する有価証券の取得勧誘であっても，適格機関投資家私募（２条３項２号イ）および特定投資家私募（２条３項２号ロ）に該当する場合は，募集に該当しない。"},{"l":2,"m":"発行開示","sb":"募集と売出し","i":"B","r":"","q":"新たに発行される有価証券の取得勧誘の相手方に適格機関投資家が含まれている場合で，当該適格機関投資家から一般投資家に勧誘対象の有価証券が譲渡されるおそれが少ないときは，有価証券の募集に該当するかを判断するにあたっては，当該適格機関投資家を除外して多数の者を相手方として行うものであるかを計算する。","a":true,"c":"2条3項1号かっこ書。","e":""},{"l":3,"m":"発行開示","sb":"募集と売出し","i":"B","r":"","q":"新たに発行される有価証券の取得勧誘のうち，勧誘対象者が適格機関投資家に限定され，当該有価証券が当該適格機関投資家から適格機関投資家以外の者に譲渡されるおそれが少ないものは，適格機関投資家私募に該当する。","a":true,"c":"2条3項2号イ。","e":""},{"l":4,"m":"発行開示","sb":"募集と売出し","i":"B","r":"","q":"新たに発行される有価証券の取得勧誘のうち，勧誘対象者が国，日本銀行，適格機関投資家以外の特定投資家に限定され，当該有価証券が当該特定投資家から特定投資家以外の者に譲渡されるおそれが少ないものは，特定投資家私募に該当する。","a":false,"c":"2条3項2号ロ(1)。","e":"勧誘対象者が国，日本銀行，適格機関投資家以外の特定投資家に限定されている場合においては，金融商品取引業者等が顧客からの委託によりまたは自己のために当該取得勧誘を行うことも特定投資家私募に該当するための要件となる。勧誘の相手方が国，日本銀行または適格機関投資家以外の特定投資家である場合に，金融商品取引業者等に委託して行わせることを要件としているのは，勧誘の相手方が特定投資家であることの確認を容易にするためである。すなわち，国，日本銀行または適格機関投資家以外の特定投資家は，金融商品取引業者との契約により特定投資家に該当するか否かが定まる。よって，発行者自身は取得勧誘の相手方が特定投資家であるか否かを確認することが困難な場合が想定されることから，勧誘の相手方の属性に関する実効性を確保する必要があるため，当該要件が設けられている。"},{"l":5,"m":"発行開示","sb":"募集と売出し","i":"B","r":"","q":"新たに発行される有価証券の取得勧誘のうち，適格機関投資家私募および特定投資家私募以外で，勧誘の相手方が50名未満であり，過去３か月以内に当該有価証券と同一種類の有価証券について別の少人数私募が行われておらず，当該有価証券がその取得者から多数の者に譲渡されるおそれが少ないものは，少人数私募に該当する。","a":true,"c":"2条3項2号ハ。","e":"有価証券の発行を何回かに分割して行う（１回当たりの勧誘対象者の人数を 50 名未満にする）ことにより，少人数私募として開示義務を回避することができてしまうため，このような脱法行為を防ぐために，勧誘対象者の人数を期間通算する必要がある。すなわち，新たに発行する有価証券の取得勧誘が少人数私募に該当する場合であっても，過去３か月以内に当該有価証券と同一種類の有価証券について別の少人数私募が行われており，その勧誘対象者の人数と今回の勧誘対象者の人数との合計が 50 名以上となる場合には，今回に係る勧誘は，少人数私募とは認められない（２条３項２号ハかっこ書，施行令１条の６）。"},{"l":6,"m":"発行開示","sb":"募集と売出し","i":"B","r":"(平29I問題20エ類)","q":"株式会社が自己株式の処分を，50 名以上の特定投資家以外の者に対して行う場合は，有価証券の売出しに該当する。","a":false,"c":"2条3項柱書かっこ書。","e":"金融商品取引法２条３項柱書かっこ書に規定される「取得勧誘類似行為」についても，新たに発行する有価証券の取得の申込みの勧誘に該当する。ここで，取得勧誘類似行為に該当するものとして，自己株式を処分する場合が挙げられる（定義府令９条１号）。自己株式の処分は既発行の有価証券を会社が売出す行為であるが，実質的には新株発行と変わらないため，取得勧誘類似行為として，新たに発行する有価証券の取得の申込みの勧誘に該当するものとしているのである。すなわち，株式会社が自己株式の処分を，50名以上の特定投資家以外の者に対して行う場合は，有価証券の募集に該当する。"},{"l":7,"m":"発行開示","sb":"募集と売出し","i":"A","r":"(平29I問題20イ・平24I問題19ウ)","q":"株式会社が，株主に対して新たに払込みをさせないで当該株式会社の株式の割当てをすることにより，株式を発行する場合は，有価証券の募集に該当することがある。","a":false,"c":"企業内容等開示ガイドライン2-4。","e":"株式無償割当てにより株式を発行する場合は，発行者に開示義務を課さなくとも投資者保護に欠けることがないため，有価証券の募集に該当することはない。"},{"l":8,"m":"発行開示","sb":"募集と売出し","i":"A","r":"(平24I問題19イ)","q":"株式会社が，株主に株式の割当てを受ける権利を与えることにより，株式を発行する場合は，有価証券の募集に該当することがある。","a":true,"c":"2条3項1号,企業内容等開示ガイドライン2-4参照。","e":"株主割当ての方法により募集株式を発行する場合であっても，勧誘対象者数基準と属性基準によって私募に分類されなければ，有価証券の募集に該当することになる。"},{"l":9,"m":"発行開示","sb":"募集と売出し","i":"A","r":"(平24I問題19ア)","q":"株式会社が，取得請求権付株式について当該株式の株主による取得の請求により，新株予約権を発行する場合は，有価証券の募集に該当することがある。","a":false,"c":"企業内容等開示ガイドライン2-4。","e":"取得請求権付株式について当該株式の株主による取得の請求により有価証券を発行する場合は，発行者に開示義務を課さなくとも投資者保護に欠けることがないため，有価証券の募集に該当することはない。"},{"l":10,"m":"発行開示","sb":"募集と売出し","i":"A","r":"(令2I問題16ア類・平29I問題20ウ類・平24I問題19エ)","q":"株式会社が，社債の発行の決定において，当該決定に基づき発行する社債の全部について｢社債，株式等の振替に関する法律｣の規定の適用を受けることとする旨を定めることにより，社債を発行する場合は，有価証券の募集に該当することがある。","a":true,"c":"2条3項1号,企業内容等開示ガイドライン2-4参照。","e":"株式会社が，社債の発行の決定において，当該決定に基づき発行する社債の全部について｢社債，株式等の振替に関する法律｣の規定の適用を受けることとする旨を定めることにより，社債を発行する場合であっても，勧誘対象者数基準と属性基準によって私募に分類されなければ，有価証券の募集に該当することになる。"},{"l":11,"m":"発行開示","sb":"募集と売出し","i":"A","r":"(平29I問題20ア)","q":"株式会社が，株式の分割を行うことで株式の数が増加する場合は，有価証券の募集に該当することがある。","a":false,"c":"企業内容等開示ガイドライン2-4。","e":"株式の分割により株式の数が増加する場合は，発行者に開示義務を課さなくとも投資者保護に欠けることがないため，有価証券の募集に該当することはない。"},{"l":1,"m":"発行開示","sb":"募集と売出し","i":"C","r":"(令5II問題20ア類)","q":"新たに発行される有価証券投資事業権利等の取得勧誘のうち，その取得勧誘に応じることにより，50名以上の者が当該取得勧誘に係る有価証券を所有することとなる場合は，有価証券の募集に該当する。","a":false,"c":"2条3項3号,施行令1条の7の2","e":"新たに発行される有価証券投資事業権利等の取得勧誘のうち，その取得勧誘に応じることにより，500 名以上の者が当該取得勧誘に係る有価証券を所有することとなる場合は，有価証券の募集に該当する。第２項有価証券の場合には，所有者の人数を基準とする「所有者数基準」により，募集であるか私募であるかを分類する。"},{"l":1,"m":"発行開示","sb":"有価証券届出書","i":"A","r":"","q":"有価証券の募集または売出しを行う場合には，原則として，内閣総理大臣に有価証券届出書を提出しなければならない。","a":true,"c":"5条1項。","e":""},{"l":2,"m":"発行開示","sb":"有価証券届出書","i":"A","r":"","q":"有価証券届出書の提出義務者は，募集の場合は有価証券の発行者であり，売出しの場合は売出しをしようとする者である。","a":false,"c":"4条1項。","e":"有価証券の届出義務を負うのは，募集または売出しをしようとする有価証券の発行者である。ここで，募集の場合は募集をする者と届出義務を負う者は同一の者であるが，売出しの場合には，売出しをしようとする者は大株主のような発行者以外の第三者であることが通常であることから，売出しをしようとする者は，有価証券の発行者に対して売出しについて届出をするように要請することで発行者が届出をすることとなる。"},{"l":3,"m":"発行開示","sb":"有価証券届出書","i":"A","r":"(平27II問題18ア)","q":"ストック・オプションとして利用するために，新株予約権証券の発行者である株式会社が，当該株式会社の取締役を相手方として，当該株式会社の発行する新株予約権証券の取得勧誘を行う場合には，当該新株予約権証券に係る募集は，内閣総理大臣に募集に関する届出をしていなくてもすることができる。","a":true,"c":"4条1項1号,施行令2条の12第2号。","e":"有価証券の募集または売出しの相手方が，当該有価証券に係る情報（５条１項各号）をすでに取得し，または，容易に取得することができる場合として政令で定める場合は，届出義務が免除される（４条１項１号）。この場合，有価証券届出書等による情報開示を求めなくても投資者保護に欠けることがないためである。ここで，発行会社が当該会社またはその完全子会社の取締役，会計参与，監査役，執行役または使用人に対してストック・オプションを付与する場合が，この場合に該当する。"},{"l":4,"m":"発行開示","sb":"有価証券届出書","i":"B","r":"(平21問題20ウ類)","q":"特定組織再編成発行手続のうち，組織再編成対象会社が発行者である株券に関して開示が行われている場合に該当しない場合は，有価証券届出書の届出義務が免除される。","a":true,"c":"4条1項2号イ。","e":"また，特定組織再編成発行手続のうち，組織再編成発行手続にかかる新たに発行される有価証券に関して開示が行われている場合も，同様に届出義務が免除される（４条１項２号ロ）。"},{"l":5,"m":"発行開示","sb":"有価証券届出書","i":"B","r":"","q":"有価証券の売出しをしようとする場合に，当該有価証券に関してすでに開示が行われている場合には，有価証券届出書の届出義務が免除される。","a":true,"c":"4条1項3号。","e":"ここで，すでに開示が行われている場合とは，売出されようとしている有価証券についてすでに募集または売出しが行われて届出の効力が生じている場合や，当該有価証券は募集または売出しの届出の対象ではなかったが，その後に上場がなされ，有価証券報告書が提出されている場合などである。"},{"l":6,"m":"発行開示","sb":"有価証券届出書","i":"A","r":"(平27II問題18イ類)","q":"発行価額または売出価額の総額が１億円未満の有価証券の募集または売出しに関しては，原則として，有価証券届出書の届出義務が免除される。","a":true,"c":"4条1項5号。","e":"ただし，１億円以上の募集または売出しであるにもかかわらず，１億円未満の募集または売出しに分割して届出義務を回避することなどが考えられるほか，少額の場合であっても届出義務を免除することが妥当でない場合もある。そこで，１億円未満の募集または売出しであっても，一定のものは届出を要することとされている（企業内容等開示府令２条５項各号）。"},{"l":1,"m":"発行開示","sb":"有価証券届出書","i":"B","r":"","q":"有価証券届出書には，募集または売出しがなされる証券に関する情報が記載され，当該発行者に関する情報は記載されない。","a":false,"c":"5条1項各号。","e":"有価証券届出書には，証券情報だけでなく，企業情報も記載される。"},{"l":2,"m":"発行開示","sb":"有価証券届出書","i":"B","r":"(平25I問題19ア)","q":"有価証券の募集における届出書の提出は，発行価格の決定後でなければすることができない。","a":false,"c":"5条1項柱書ただし書,企業内容等開示府令9条。","e":"有価証券の発行価格の決定前に募集をする必要がある場合その他の内閣府令で定める場合には，発行価格その他の内閣府令で定める事項を記載しないで有価証券届出書を提出することができる。これは，市場の投資家の動向に即して発行価格を決定することを認める趣旨である。この場合は，具体的な発行価格が決定した時点で訂正届出書を提出する必要がある（７条１項前段）。"},{"l":3,"m":"発行開示","sb":"有価証券届出書","i":"B","r":"(平27II問題18エ)","q":"時価発行の新株発行において，払込期日の決定前に募集を行う必要がある場合には，募集に関する事項のうち払込期日を記載しないで有価証券届出書を提出することができる。","a":false,"c":"5条1項柱書ただし書,企業内容等開示府令9条。","e":"上記問題２の解説に記載の通り，有価証券の発行価格の決定前に募集をする必要がある場合その他の内閣府令で定める場合には，発行価格その他の内閣府令で定める事項を記載しないで有価証券届出書を提出することができる。ここで，払込期日は有価証券届出書に記載しないことが認められている事項に該当しないことから，本肢は誤りである。"},{"l":1,"m":"発行開示","sb":"有価証券届出書","i":"B","r":"","q":"すでに１年間継続して有価証券報告書を提出している者は，組込方式によって有価証券届出書を提出することが認められる。","a":true,"c":"5条3項,企業内容等開示府令9条の3第1項。","e":"継続開示が行われている状態で有価証券届出書を提出する場合には，当該有価証券届出書に記載すべき企業情報が有価証券報告書等により既に開示されている。このような場合には，発行者の負担を軽減すべきであり，これにより迅速な資金調達を可能としているのである。"},{"l":2,"m":"発行開示","sb":"有価証券届出書","i":"B","r":"","q":"組込方式により有価証券届出書を提出する場合は，当該有価証券届出書に直近の有価証券報告書およびその添付資料ならびにその提出以後に提出される半期報告書，臨時報告書ならびにこれらの訂正報告書の写しをとじ込み，かつ，当該有価証券報告書提出後に生じた一定の事実を記載することにより，企業情報の記載に代えることができる。","a":false,"c":"5条3項。","e":"組込方式による有価証券届出書には，臨時報告書をとじ込む必要はない。その代わり，当該有価証券報告書提出後に生じた一定の事実を記載すること（追完情報の記載）が求められる。"},{"l":3,"m":"発行開示","sb":"有価証券届出書","i":"B","r":"","q":"組込方式によって有価証券届出書を提出することが認められる者は，参照方式によって有価証券届出書を提出することも認められる。","a":false,"c":"5条4項,企業内容等開示府令9条の4第2項3項5項。","e":"参照方式を利用することができる者は，１年間継続して有価証券報告書を提出している者であり，かつ，周知性の高い企業であることが要件とされる。ここでいう「周知性の高い企業」とは，上場株式の発行者であって，かつ，株式の年間売買金額や時価総額が一定額以上の発行者をいう（開示府令９条の４第５項）。"},{"l":4,"m":"発行開示","sb":"有価証券届出書","i":"B","r":"","q":"参照方式により有価証券届出書を提出する場合は，当該有価証券届出書に企業情報についての記載は必要ない。","a":false,"c":"5条4項。","e":"参照方式による有価証券届出書において企業情報の記載を省略するには，企業情報についてすでに開示されている有価証券報告書等を参照すべき旨の記載が必要である。"},{"l":1,"m":"発行開示","sb":"有価証券届出書","i":"B","r":"(令5II問題20エ類)","q":"有価証券の募集または売出しに関する届出は，常に，有価証券届出書を内閣総理大臣が受理した日から 15 日を経過した日に効力が生じる。","a":false,"c":"8条1項3項。","e":"有価証券の募集または売出しに関する届出は，原則として，有価証券届出書を内閣総理大臣が受理した日から15日を経過した日に効力が生じる（８条１項）。ただし，届出書類の内容が公衆に容易に理解されると内閣総理大臣が認める場合，または，その届出者の企業情報がすでに公衆に広範に提供されていると内閣総理大臣が認める場合には，待機期間を15日に満たない期間に短縮することも認められる。ここで，組込方式および参照方式を利用する場合には，企業情報について広く投資者に知られていると考えられることから，届出から届出の効力発生日までの期間は，おおむね７日間に短縮することができる。"},{"l":2,"m":"発行開示","sb":"有価証券届出書","i":"A","r":"(令2II問題19ア・平23II問題20ア類・平21問題20ア)","q":"有価証券届出書の提出後，その届出の効力が生じていなければ，目論見書の交付の有無にかかわらず，募集または売出しに係る有価証券を募集または売出しにより取得させ，または売り付けてはならないが，取得や売付けの勧誘行為を行うことは認められる。","a":true,"c":"15条1項。","e":"有価証券の発行者，売出人，引受人，証券会社等は，届出の効力が生じていなければ，有価証券を募集または売出しにより取得させ，または売り付けてはならない。したがって，有価証券届出書を提出した段階では，有価証券についての勧誘行為を行えるのみであり，投資者へ有価証券を取得させ，または売り付けることはできないのである。"},{"l":1,"m":"発行開示","sb":"有価証券届出書","i":"B","r":"","q":"有価証券の募集または売出しの届出の効力発生前において，有価証券届出書に記載すべき重要な事項の変更その他法定事由があるときは，当該届出者は，訂正届出書を内閣総理大臣に提出しなければならない。これらの事由以外において，訂正届出書の提出は求められていない。","a":false,"c":"7条1項。","e":"有価証券の募集または売出しの届出の効力発生前において，有価証券届出書に記載すべき重要な事項の変更その他法定事由があるときは，届出者は，訂正届出書を内閣総理大臣に提出しなければならない（７条１項前段）。また，これらの事由がない場合において，届出者が訂正を必要とするものがあると認めたときも，訂正届出書を提出しなければならない（７条１項後段）。"},{"l":2,"m":"発行開示","sb":"有価証券届出書","i":"B","r":"","q":"内閣総理大臣は，有価証券届出書の重要な事項について虚偽の記載があり，または記載すべき重要な事項もしくは誤解を生じさせないために必要な重要な事実の記載が欠けていることを発見したときは，いつでも，届出者に対して訂正届出書の提出を命じ，必要があると認めるときは有価証券届出書の効力の停止を命ずることができる。","a":true,"c":"10条1項。","e":"また，内閣総理大臣は，虚偽記載等による訂正命令だけでなく，形式不備による訂正命令もすることができる。すなわち，有価証券届出書に形式上の不備があり，またはその書類に記載すべき重要な事項の記載が不十分であると認めるときは，届出者に対して，訂正届出書の提出を命ずることができる（９条１項）。"},{"l":1,"m":"発行開示","sb":"有価証券通知書","i":"B","r":"(平23II問題20ウ)","q":"有価証券通知書を内閣総理大臣に提出する手続を行う者は，政令で定めるところにより，開示用電子情報処理組織を使用して行わなければならない。","a":false,"c":"27条の30の3第2項,4条6項。","e":"有価証券通知書は，監督規制のために求められるものであり，有価証券届出書と異なり開示書類ではないため，開示用電子情報処理組織（EDINET）によることを要さず，公衆縦覧に供されない。"},{"l":2,"m":"発行開示","sb":"有価証券通知書","i":"C","r":"","q":"発行価額または売出価額の総額が１億円未満の募集または売出しの場合，有価証券届出書の提出は不要となるが，有価証券通知書の提出義務が常に課せられる。","a":false,"c":"4条6項ただし書。","e":"発行価額または売出価額の総額が１億円未満の募集または売出しであっても，1,000 万円以下の場合は，有価証券通知書の提出義務は課せられない。"},{"l":3,"m":"発行開示","sb":"有価証券通知書","i":"C","r":"","q":"すでに開示が行われている有価証券の売出しでその売出価額の総額が１億円以上の売出しについては，有価証券届出書の提出は不要となるが，有価証券通知書の提出義務が課せられる。","a":true,"c":"4条6項。","e":""},{"l":4,"m":"発行開示","sb":"有価証券通知書","i":"C","r":"","q":"有価証券通知書には，企業情報として発行者の経理の状況を記載しなければならない。","a":false,"c":"","e":"有価証券通知書には，新規発行または売出し有価証券の情報や，募集または売出しの方法および条件といったものが記載される。つまり，有価証券通知書の提出義務は，届出義務の回避を防止することを目的とした監督規制のために求められるものであるため，投資情報としての経理の状況などは記載されない。"},{"l":1,"m":"発行開示","sb":"発行登録制度","i":"A","r":"","q":"有価証券届出書を組込方式によって提出することができる発行者であって，発行または売出しの予定額が１億円以上の有価証券の募集または売出しを予定している者は，発行登録制度を採用することができる。","a":false,"c":"23条の3第1項。","e":"有価証券届出書を参照方式によって提出することができる発行者であって，発行または売出しの予定額が１億円以上の有価証券の募集または売出しを予定している者は，発行登録制度を採用することができる。"},{"l":2,"m":"発行開示","sb":"発行登録制度","i":"B","r":"(令2I問題20ウ類・平25I問題19エ類)","q":"発行登録に係る有価証券の発行予定期間は，コマーシャル・ペーパーの募集または売出しの登録を除き，発行登録の効力が生じた日から起算して１年または２年とされている。","a":true,"c":"23条の6第1項。","e":"発行登録に係る有価証券の発行予定期間は，発行登録の効力が生じた日から起算して２年を超えない範囲において，内閣府令で定める期間（発行登録をしようとする者の選択により，１年間または２年間。ただし，コマーシャル・ペーパーの募集または売出しの登録の場合にあっては１年間）とする。"},{"l":3,"m":"発行開示","sb":"発行登録制度","i":"B","r":"","q":"発行登録書は，原則として，内閣総理大臣が受理した日から７日を経過した日に，その効力を生じる。","a":false,"c":"23条の5,8条1項。","e":"発行登録書は，原則として内閣総理大臣が受理した日から15日を経過した日に，その効力が生じる（23条の５第１項，８条１項）。なお，発行登録制度を利用できる者は，周知性要件を満たしているので，効力発生までの期間は，参照方式と同様におおむね７日間に短縮することができる（23条の５第１項，８条３項）。"},{"l":4,"m":"発行開示","sb":"発行登録制度","i":"B","r":"","q":"発行登録書の効力が発生した後は，募集または売出しの都度，内閣総理大臣に発行条件等の証券情報を記載した発行登録追補書類を提出することにより，直ちに有価証券を取得させ，または売り付けることができる。","a":true,"c":"23条の8第1項。","e":""},{"l":5,"m":"発行開示","sb":"発行登録制度","i":"A","r":"(令5II問題19イ類・平30I問題20ウ)","q":"発行登録書および発行登録追補書類は，発行登録が効力を失うまでの期間において，公衆縦覧に供される。","a":false,"c":"25条1項2号。","e":"発行登録書および発行登録追補書類は，公衆縦覧に供される。なお，公衆縦覧に供される期間は５年間である。"},{"l":1,"m":"発行開示","sb":"目論見書","i":"A","r":"(令2II問題19ウ・平30I問題20エ・平29I問題19イ・平24II問題19イ)","q":"目論見書は，間接開示書類であり，公衆縦覧に供される。","a":false,"c":"2条10項,25条参照。","e":"目論見書は，直接開示書類であるため，公衆縦覧には供されない。"},{"l":2,"m":"発行開示","sb":"目論見書","i":"C","r":"","q":"目論見書には，有価証券届出書の記載事項のうち投資者の投資判断に極めて重要な影響を及ぼす一定の事項に加え，特記事項が記載される。","a":true,"c":"13条2項1号。","e":"目論見書には有価証券届出書の記載事項のうち投資者の投資判断に極めて重要な影響を及ぼす一定の事項に加え，特記事項が記載される（13条２項１号）。特記事項には，届出の効力が発生している旨などが記載される（企業内容等開示府令13条１項，14条１項）。"},{"l":3,"m":"発行開示","sb":"目論見書","i":"C","r":"","q":"すでに開示が行われている有価証券の売出しは，有価証券届出書の提出義務が免除されるため，目論見書の作成義務も免除される。","a":false,"c":"13条1項後段。","e":"すでに開示がなされている有価証券の売出しで，① 発行者またはその関係者が所有する株券等の売出しに該当しないもの，② 売出価額の総額が１億円未満のものは，目論見書の作成義務は免除される（13 条１項柱書本文後段，企業内容等開示府令11条の４）。"},{"l":4,"m":"発行開示","sb":"目論見書","i":"B","r":"(平26II問題17イ類)","q":"有価証券を募集または売出しにより取得させ，または売り付ける場合は，目論見書をあらかじめ交付しなければならない。","a":false,"c":"15条2項。","e":"有価証券を募集または売出しにより取得させ，または売り付ける場合には，目論見書をあらかじめまたは同時に交付しなければならない。"},{"l":5,"m":"発行開示","sb":"目論見書","i":"C","r":"(令2II問題19イ)","q":"有価証券を適格機関投資家に取得させ，または売付ける場合は，目論見書の交付請求があった場合を除き，目論見書の交付義務が免除される。","a":true,"c":"15条2項柱書ただし書。","e":"① 有価証券を適格機関投資家に取得させまたは売り付ける場合，② 当該目論見書の交付を受けないことについて同意した「当該有価証券と同一の銘柄を所有する者」，または，「その同居者が既にその目論見書を受け，または確実に交付を受けると見込まれる者」に当該有価証券を取得させ，または売り付ける場合は，目論見書の交付の請求があった場合を除き，目論見書の交付義務が免除される（15条２項柱書ただし書）。"},{"l":6,"m":"発行開示","sb":"目論見書","i":"C","r":"(平25I問題19ウ)","q":"同居者がすでに目論見書の交付を受けている者に対しては，その者の同意があれば，当該目論見書を交付する必要はない。","a":true,"c":"15条2項2号ロ。","e":"上記問題５の解説参照。"},{"l":7,"m":"発行開示","sb":"目論見書","i":"C","r":"(令6I問題20ウ)","q":"発行者および有価証券の売出しをする者は，有価証券の募集または売出しのために目論見書以外の文書，図画，音声その他の資料を使用してはならない。","a":false,"c":"13条5項。","e":"有価証券の募集または売出しのために目論見書以外の文書，図画，音声その他の資料を使用することができるが，当該資料を使用する場合には，虚偽の表示または誤解を生じさせる表示をしてはならない。"},{"l":1,"m":"継続開示","sb":"有価証券報告書","i":"A","r":"(令2I問題19ウ・平26I問題18ウ)","q":"有価証券報告書には，有価証券の募集または売出しに関する事項を記載しなければならない。","a":false,"c":"24条1項柱書本文,企業内容開示府令15条1号。","e":"有価証券報告書には，証券情報は記載されないことから，有価証券の募集または売出しに関する事項は記載されない。"},{"l":2,"m":"継続開示","sb":"有価証券報告書","i":"A","r":"(令7I問題19ア類・令2I問題19ア類・平26I問題18イ類)","q":"金融商品取引所に上場されている有価証券（特定上場有価証券を除く）の発行者は，有価証券報告書の提出義務が課せられる。","a":true,"c":"24条1項1号。","e":"特定上場有価証券とは，特定取引所金融商品市場のみに上場された有価証券である（２条33項）。ここで，特定取引所金融商品市場とは，特定投資家向けに設立された市場，すなわちプロ向けの市場であるため，開示義務の免除が認められている。"},{"l":3,"m":"継続開示","sb":"有価証券報告書","i":"A","r":"","q":"有価証券届出書または発行登録追補書類を提出した会社（上場会社および店頭登録会社を除く）は，常に有価証券報告書の提出義務が課せられる。","a":false,"c":"24条1項3号,施行令3条の5第2項等。","e":"有価証券届出書または発行登録追補書類を提出した会社は，原則として，有価証券報告書の提出義務が課せられるが，①５年間継続して有価証券の所有者が 300 名未満であって内閣総理大臣の承認を受けた場合 （施行令３条の５第２項）， ②有価証券の所有者が25名未満であって内閣総理大臣の承認を受けた場合（施行令４条２項３号，企業内容等開示府令16条２項），③清算中の会社，相当の期間事業を休止している会社，会社更生法に基づく更生手続開始決定があった場合であって，いずれも内閣総理大臣の承認を受けた場合（施行令４条２項１号２号，４項）は，有価証券報告書の提出義務が免除される。"},{"l":4,"m":"継続開示","sb":"有価証券報告書","i":"B","r":"","q":"最近５事業年度末のいずれかにおいて株主数が1,000名以上である株式会社（上場会社，店頭登録会社および有価証券届出書等提出会社を除く）は，任意に，有価証券報告書を提出することができる。","a":false,"c":"24条1項4号。","e":"最近５事業年度末のいずれかにおいて株主数が1,000名以上である株式会社（上場会社，店頭登録会社および有価証券届出書等提出会社を除く）は，原則として，有価証券報告書の提出義務が課せられる。これを，外形基準該当会社という。ただし，外形基準該当会社であっても，①事業年度末において資本金が５億円未満，または，有価証券の所有者が300名未満である場合 （施行令３条の６第１項）， ②清算中の会社，相当の期間事業を休止している会社，会社更生法に基づく更生手続開始決定があった場合であって，いずれも内閣総理大臣の承認を受けた場合 （施行令４条２項１号２号，４項） は，有価証券報告書の提出義務が免除される。なお，②については，有価証券届出書等提出会社の場合と共通の免除規定となっている（問題３の解説③参照）。"},{"l":5,"m":"継続開示","sb":"有価証券報告書","i":"B","r":"(令2I問題19イ・平26I問題18ア)","q":"内閣総理大臣は，有価証券の発行者である会社の資本金の額が有価証券報告書を提出しなくても公益または投資者保護に欠けることがないと認めたときは，当該会社の有価証券報告書の提出義務を免除することができる。","a":false,"c":"24条1項柱書ただし書。","e":"資本金の額を基準に有価証券報告書の提出義務が免除されるのは，外形基準に該当する会社（金商法24 条１項４号）の事業年度の末日における資本金の額が５億円未満である場合のみである。また，その際は内閣総理大臣の承認は不要である。"},{"l":6,"m":"継続開示","sb":"有価証券報告書","i":"A","r":"","q":"有価証券届出書を提出した会社（上場会社および店頭登録会社を除く）であっても，清算中の会社であり，内閣総理大臣の承認を受けた場合は，有価証券報告書の提出義務が免除される。","a":true,"c":"24条1項3号,施行令4条2項1号。","e":"上記問題３の解説③参照。"},{"l":7,"m":"継続開示","sb":"有価証券報告書","i":"B","r":"","q":"有価証券報告書の提出義務者は，有価証券報告書を事業年度終了後３か月以内に内閣総理大臣に提出しなければならない。","a":true,"c":"24条1項柱書。","e":""},{"l":8,"m":"継続開示","sb":"有価証券報告書","i":"B","r":"(平28I問題20アエ)","q":"有価証券報告書には，定款，および定時株主総会に報告し承認を受けた計算書類および事業報告を添付しなければならない。","a":true,"c":"24条6項。","e":"有価証券報告書には，定款その他の書類で公益または投資者保護のため必要かつ適当なものとして内閣府令で定めるものを添付しなければならない。企業内容等開示府令17条においては，定款のほか，定時株主総会に報告し，承認を受けた計算書類および事業報告を添付すべきとされている。"},{"l":9,"m":"継続開示","sb":"有価証券報告書","i":"C","r":"","q":"有価証券報告書提出会社において，企業内容等に関して重要な事実等が発生した場合は，有価証券報告書の訂正報告書を内閣総理大臣に提出しなければならない。","a":false,"c":"24条の5第4項。","e":"有価証券報告書提出会社は，企業内容等に関して重要な事実等が臨時的に発生した場合に，その内容を記載した臨時報告書を内閣総理大臣に提出しなければならない。このように，有価証券報告書提出後の重要な事項の発生については，訂正報告書ではなく臨時報告書を提出することで対応するのである。"},{"l":10,"m":"継続開示","sb":"有価証券報告書","i":"B","r":"","q":"有価証券報告書の記載事項のうち，重要なものについて訂正報告書を提出したときは，遅滞なく，その旨を公告しなければならない。","a":true,"c":"24条の2第2項。","e":"有価証券報告書の重要な事項に訂正があった場合，訂正前の有価証券報告書により投資判断を行った投資者に対し注意を促す趣旨から規定されている。なお，当該公告は，EDINETによる電子公告，または，日刊新聞紙によらなければならない（施行令４条の２の４第１項）。"},{"l":1,"m":"継続開示","sb":"半期報告書","i":"B","r":"(平31II問題20ア類・平29II問題19ア類・平26I問題18エ類・平20問題19イ類)","q":"上場会社は，半期報告書の提出義務を負う。","a":true,"c":"24条の5第1項。","e":"半期報告書の提出義務者は，有価証券報告書の提出義務がある会社である。"},{"l":2,"m":"継続開示","sb":"半期報告書","i":"B","r":"","q":"すべての半期報告書の提出義務者は，事業年度開始から６か月間経過後 45 日以内に半期報告書を内閣総理大臣に提出しなければならない。","a":false,"c":"24条の5第1項。","e":"半期報告書の提出義務者は，半期報告書を，内閣総理大臣に提出しなければならない。半期報告書の提出時期は，上場会社等においては，事業年度開始から６か月間経過後 45 日以内，非上場会社においては，事業年度開始から６か月間経過後３か月以内とされている。"},{"l":1,"m":"継続開示","sb":"確認書","i":"A","r":"(平25I問題20ア類・平23I問題19ア類)","q":"有価証券報告書の記載内容に係る確認書を提出しなければならない会社は，上場会社および店頭登録会社である。","a":true,"c":"24条の4の2第1項。","e":"また，有価証券報告書提出会社は，上場会社等以外の会社であっても，任意に有価証券報告書の記載内容に係る確認書を提出することができる（24条の４の２第２項）。"},{"l":2,"m":"継続開示","sb":"確認書","i":"B","r":"","q":"上場会社が半期報告書を提出する場合，当該半期報告書の記載内容に係る確認書を任意に提出することができる。","a":false,"c":"24条の4の8。","e":"有価証券報告書の記載内容に係る確認書の規定は，半期報告書についても適用される，半期報告書についても適用される（24条の５の２）。ここで，上場会社および店頭登録会社には，確認書の提出義務が課せられる（24条の４の２第１項）。したがって，上場会社が半期報告書を提出する場合，当該半期報告書の記載内容に係る確認書を提出しなければならない。"},{"l":3,"m":"継続開示","sb":"確認書","i":"A","r":"(令7I問題19ウ・令4II問題19イ・平23II問題20イ)","q":"確認書を有価証券報告書と併せて内閣総理大臣に提出しなければならない会社は，訂正報告書を提出する場合，当該訂正報告書の記載内容に係る確認書を当該訂正報告書と併せて内閣総理大臣に提出しなければならない。","a":true,"c":"24条の4の2第4項。","e":"有価証券報告書のほか，半期報告書について訂正報告書を提出する場合においても，当該訂正報告書について，併せて確認書の提出が必要となる（24条の５の２第１項）。"},{"l":1,"m":"継続開示","sb":"内部統制報告書","i":"A","r":"(平23I問題19イ類・平21問題20エ)","q":"有価証券の募集または売出しを行ったすべての会社は，内部統制報告書を提出しなければならない。","a":false,"c":"24条の4の4第1項。","e":"内部統制報告書の提出義務者は，有価証券報告書提出会社のうち，上場会社および店頭登録会社である。ただし，上場会社等以外の有価証券報告書提出会社であっても，任意に内部統制報告書を提出することができる（24条の４の４第２項）。また，内部統制報告書は，原則として，公認会計士または監査法人の監査証明を受けなければならない（193 条の２第２項）。ただし，新規上場企業においては，上場後３年以内に提出する内部統制報告書ついては，一定の場合を除き，監査を受ける義務が免除される（193条の２第２項４号）。"},{"l":2,"m":"継続開示","sb":"内部統制報告書","i":"B","r":"","q":"金融商品取引所に上場されている有価証券の発行者である会社が半期報告書を提出する際には，内部統制報告書を当該半期報告書と併せて内閣総理大臣に提出しなければならない。","a":false,"c":"24条の4の4第1項。","e":"内部統制報告書の提出義務者は，財務報告に係る内部統制の有効性に関する経営者の評価が記載された内部統制報告書を，有価証券報告書と併せて内閣総理大臣に提出しなければならない。"},{"l":1,"m":"継続開示","sb":"臨時報告書","i":"B","r":"(平29II問題19イ類)","q":"上場会社および店頭登録会社以外の有価証券報告書提出会社は，当該会社の企業内容等に関して重要な事実が臨時的に発生した場合であっても，臨時報告書を提出する必要はない。","a":false,"c":"24条の5第4項。","e":"上場会社および店頭登録会社以外の有価証券報告書提出会社（有価証券届出書等提出会社および外形基準該当会社）であっても，当該会社の企業内容等に関して重要な事実が臨時的に発生した場合は，臨時報告書を提出しなければならない。"},{"l":2,"m":"継続開示","sb":"臨時報告書","i":"A","r":"(令2I問題19エ)","q":"有価証券報告書を提出しなければならない会社は，その会社が発行者である総額が１億円以上の有価証券の募集または売出しが外国において行われるとき，その内容を記載した臨時報告書を，遅滞なく，内閣総理大臣に提出しなければならない。","a":true,"c":"24条の5第4項。","e":"外国で有価証券が発行される場合には，わが国の金融商品取引法が及ばないので，届出による発行開示がなされないためである。"},{"l":3,"m":"継続開示","sb":"臨時報告書","i":"A","r":"(平28II問題19ア)","q":"有価証券報告書を提出しなければならない会社において，当該会社の主要株主の異動があった場合，当該会社は臨時報告書を提出しなければならない。","a":true,"c":"24条の5第4項,企業内容等開示府令19条2項4号。","e":""},{"l":4,"m":"継続開示","sb":"臨時報告書","i":"A","r":"(平30II問題20イ)","q":"有価証券報告書を提出しなければならない会社において，当該会社の親会社の異動があった場合，当該会社は臨時報告書を提出しなければならない。","a":true,"c":"24条の5第4項,企業内容等開示府令19条2項3号。","e":"親会社または特定子会社（提出会社に対する売上高等が一定の水準以上の子会社）の異動は，臨時報告書提出事由に該当する。"},{"l":5,"m":"継続開示","sb":"臨時報告書","i":"A","r":"(平30II問題20ウ・平28II問題19イ)","q":"有価証券報告書を提出しなければならない会社において，当該会社の社外取締役の異動があった場合，当該会社は臨時報告書を提出しなければならない。","a":false,"c":"24条の5第4項,企業内容等開示府令19条2項各号参照。","e":"社外取締役の異動は，臨時報告書提出事由ではない。なお，提出会社の代表取締役（代表執行役）に異動があった場合は，当該提出会社は臨時報告書を提出しなければならない（24条の５第４項，開示府令19条２項９号）。"},{"l":6,"m":"継続開示","sb":"臨時報告書","i":"A","r":"(平30II問題20ア類・平28II問題19エ)","q":"有価証券報告書を提出しなければならない会社において，当該会社の株主総会において決議事項が決議された場合，当該会社は臨時報告書を提出しなければならない。","a":true,"c":"24条の5第4項,企業内容等開示府令19条2項9号の2。","e":"この場合は，当該決議での議決権の行使の結果についても，臨時報告書に記載する。"},{"l":7,"m":"継続開示","sb":"臨時報告書","i":"A","r":"(平28II問題19ウ)","q":"有価証券報告書を提出しなければならない会社において，当該会社の親会社に重要な災害が発生した場合，当該会社は臨時報告書を提出しなければならない。","a":false,"c":"24条の5第4項,企業内容等開示府令19条2項各号参照。","e":"提出会社または連結子会社に係る重要な災害の発生は，臨時報告書提出事由であるが，提出会社の親会社に係る重要な災害の発生は臨時報告書提出事由ではない。"},{"l":8,"m":"継続開示","sb":"臨時報告書","i":"A","r":"(平31II問題20イ)","q":"有価証券報告書を提出しなければならない会社において，株式移転をすることを決定した場合，当該会社は臨時報告書を提出しなければならない。","a":true,"c":"24条の5第4項,企業内容等開示府令19条2項6号の3。","e":"提出会社または連結子会社において，一定の組織再編行為，事業の譲渡または譲受け，子会社取得が業務執行機関により決定された場合は，臨時報告書提出事由に該当する。"},{"l":9,"m":"継続開示","sb":"臨時報告書","i":"A","r":"(令4II問題19エ)","q":"臨時報告書を提出しなければならない会社は，当該臨時報告書と併せて，その記載内容に係る確認書を内閣総理大臣に提出しなければならない。","a":false,"c":"","e":"臨時報告書は，提出会社の企業内容等に関して重要な事実が臨時的に発生した場合，その内容が記載される継続開示書類であるが（24 条の５第４項），臨時報告書に係る確認書を併せて提出する必要はない。"},{"l":1,"m":"継続開示","sb":"自己株券買付状況報告書","i":"B","r":"(令6II問題20ア類・平29II問題19エ類)","q":"上場会社は，自己株式を取得した場合は必ず，当該取得した月の翌月 15 日までに，自己株券買付状況報告書を内閣総理大臣に提出しなければならない。","a":false,"c":"24条の6第1項。","e":"会社が自己株券買付状況報告書を提出しなければならない場合は，当該会社が上場株券等の発行会社であって，株主との合意に基づく自己株式取得の決定についての株主総会または取締役会の決議（会社法156条１項，165条３項）があった場合である。したがって，単に上場会社が自己株式を取得しただけでは，必ずしも自己株券買付状況報告書を提出しなければならないわけではないため，本肢は誤りである。"},{"l":2,"m":"継続開示","sb":"自己株券買付状況報告書","i":"B","r":"(平31II問題20ウ類・平26I問題17ア類)","q":"自己株券買付状況報告書の提出義務者は，株主との合意に基づく自己株式の取得に係る株主総会等の決議が終結した日の属する月から，当該決議で定められた自己株式を取得することができる期間の満了する日の属する月までの各月について，自己株券買付状況報告書を提出することが義務づけられる。","a":true,"c":"24条の6第1項。","e":"会社が自己株券買付状況報告書を提出しなければならない場合は，当該会社が上場株券等の発行会社であって，株主との合意に基づく自己株式取得の決定についての株主総会または取締役会の決議（会社法156条１項，165条３項）があった場合である。そして，自己株券買付状況報告書の提出時期は，自己株式取得についての株主総会または取締役会の決議が終結した日の属する月から，当該決議で定められた自己株式取得をすることができる期間（会社法 156条１項３号）の満了する日の属する月までの各月である。"},{"l":3,"m":"継続開示","sb":"自己株券買付状況報告書","i":"B","r":"(平26I問題17イ類)","q":"自己株券買付状況報告書の提出義務者は，実際に自己株式を取得した場合に限って，その翌月の 15 日までに自己株券買付状況報告書を提出すればよい。","a":false,"c":"24条の6第1項。","e":"自己株券買付状況報告書の提出義務者は，株主との合意に基づく自己株式の取得に係る株主総会等の決議が終結した日の属する月から，当該決議で定められた自己株式を取得することができる期間の満了する日の属する月までの間，実際に買付けを行わなくても，自己株券買付状況報告書を提出し続けなければならない。"},{"l":4,"m":"継続開示","sb":"自己株券買付状況報告書","i":"B","r":"(平23I問題19ウ)","q":"自己株券買付状況報告書を提出しなければならない会社は，当該自己株券買付状況報告書と併せて，その記載内容に係る確認書を内閣総理大臣に提出しなければならない。","a":false,"c":"","e":"自己株券買付状況報告書の提出には，併せて確認書の提出は求められていない。"},{"l":5,"m":"継続開示","sb":"自己株券買付状況報告書","i":"B","r":"(令6II問題20イ)","q":"上場会社は，株主総会の決議または取締役会の決議に基づいて上場株券を取得した場合において，臨時報告書を内閣総理大臣に提出したときは，自己株券買付状況報告書を内閣総理大臣に提出することを要しない。","a":false,"c":"","e":"上場会社が，株主総会または取締役会の決議に基づいて自己株式を取得した場合において，臨時報告書を提出した場合であっても，自己株券買付状況報告書の提出が免除されるといった規定はない。"},{"l":6,"m":"継続開示","sb":"自己株券買付状況報告書","i":"B","r":"(令6II問題20ウ)","q":"上場会社は，その発行する上場株券を金融商品取引法の定める公開買付けの方法により適法に買い付けた場合において，公開買付報告書を内閣総理大臣に提出したときは，自己株券買付状況報告書を内閣総理大臣に提出することを要しない。","a":false,"c":"","e":"上場会社が，公開買付けの方法により自己株式を取得した場合において，公開買付報告書を提出した場合であっても，自己株券買付状況報告書の提出が免除されるといった規定はない。"},{"l":1,"m":"継続開示","sb":"親会社等状況報告書","i":"B","r":"(令5I問題20ア類・平31II問題20エ類・平29II問題19ウ類・平21問題20イ類)","q":"上場会社であるＡ社の親会社であるＢ社が有価証券報告書提出会社でない場合，Ａ社は，親会社等状況報告書を提出しなければならない。","a":false,"c":"24条の7第1項。","e":"上場会社および店頭登録会社である会社に親会社等がいる場合で，当該親会社等が有価証券報告書提出会社でない場合，当該親会社は親会社等状況報告書を提出しなければならない。したがって，上場会社であるＡ社の親会社であるＢ社が有価証券報告書提出会社でない場合，Ｂ社（親会社）は，親会社等状況報告書を提出しなければならない。"},{"l":2,"m":"継続開示","sb":"親会社等状況報告書","i":"B","r":"(令5I問題20イ)","q":"親会社等状況報告書の提出義務者は，子会社の事業年度終了後３か月以内に，親会社等状況報告書を内閣総理大臣に提出しなければならない。","a":false,"c":"24条の7第1項。","e":"親会社等状況報告書の提出義務者は，親会社等の事業年度終了後３か月以内に，親会社等状況報告書を内閣総理大臣に提出しなければならない。"},{"l":1,"m":"電子開示","sb":"","i":"B","r":"","q":"有価証券報告書を内閣総理大臣に提出する場合は，開示用電子情報処理組織を使用して行わなければならない。","a":true,"c":"27条の30の3第1項。","e":"有価証券届出書や有価証券報告書を提出する電子開示手続は，EDINETを使用して行わなければならない。"},{"l":2,"m":"電子開示","sb":"","i":"B","r":"","q":"有価証券通知書を内閣総理大臣に提出する場合は，開示用電子情報処理組織を使用して行わなければならない。","a":false,"c":"27条30の3第2項。","e":"有価証券通知書を提出する手続は，任意電子開示手続とされ，EDINETを使用して行うことができる。"},{"l":3,"m":"電子開示","sb":"","i":"A","r":"","q":"参照方式により提出した有価証券届出書およびその訂正届出書の公衆縦覧期間は，１年間とされている。","a":false,"c":"25条1項1号。","e":"従来は，有価証券届出書を参照方式により提出する場合における公衆縦覧期間は１年間とされていたが，金商法改正により，参照方式による場合であったとしても，公衆縦覧期間が５年間に統一されることとなった。"},{"l":4,"m":"電子開示","sb":"","i":"A","r":"(令5II問題19ア類)","q":"有価証券報告書およびその訂正報告書の公衆縦覧期間は，５年間とされている。","a":true,"c":"25条1項3号。","e":"有価証券報告書の記載内容に係る確認書についても，同様に，公衆縦覧期間は５年間とされている（25 条１項４号）。"},{"l":5,"m":"電子開示","sb":"","i":"A","r":"(令5II問題19ウ類・平31I問題19ウ類・平22I問題19ウ類)","q":"内部統制報告書およびその訂正報告書の公衆縦覧期間は，１年間とされている。","a":false,"c":"25条1項5号。","e":"内部統制報告書およびその訂正報告書の公衆縦覧期間は５年間とされている。"},{"l":6,"m":"電子開示","sb":"","i":"A","r":"","q":"半期報告書およびその訂正報告書の公衆縦覧期間は，３年間とされている。","a":false,"c":"25条1項6号。","e":"半期報告書およびその訂正報告書の公衆縦覧期間は５年間とされている。従来は，半期報告書およびその訂正報告書の公衆縦覧期間は３年間とされていたが，半期報告書の不提出または虚偽記載による課徴金納付命令の権利が消滅する除斥期間に合わせるため，５年間に延長された。"},{"l":7,"m":"電子開示","sb":"","i":"A","r":"(令5II問題19エ類・平31I問題19イ類・平23I問題19エ)","q":"半期報告書の記載内容に係る確認書の公衆縦覧期間は，５年間とされている。","a":true,"c":"25条1項7号。","e":"有価証券報告書または半期報告書の記載内容に係る確認書の公衆縦覧期間は５年間とされている。"},{"l":8,"m":"電子開示","sb":"","i":"A","r":"","q":"臨時報告書およびその訂正報告書の公衆縦覧期間は，１年間とされている。","a":false,"c":"25条1項8号。","e":"臨時報告書およびその訂正報告書の公衆縦覧期間は，５年間とされている。従来は，臨時報告書およびその訂正届出書の公衆縦覧期間は１年間とされていたが，臨時報告書の不提出または虚偽記載による課徴金納付命令の権利が消滅する除斥期間に合わせるため，５年間に延長された。"},{"l":9,"m":"電子開示","sb":"","i":"A","r":"(平30I問題20ア類・平26I問題17ウ類)","q":"自己株券買付状況報告書およびその訂正報告書の公衆縦覧期間は，１年間とされている。","a":true,"c":"25条1項9号。","e":"自己株券買付状況報告書については，その記載内容の投資情報としての価値は一定期間を経過すると低減するし，また，１年以内には別の縦覧書類に吸収され，開示の機能を終えるため，公衆縦覧期間は１年間と定められている。"},{"l":10,"m":"電子開示","sb":"","i":"A","r":"(令5I問題20エ)","q":"親会社等状況報告書およびその訂正報告書の公衆縦覧期間は，５年間とされている。","a":true,"c":"25条1項10号。","e":"親会社等状況報告書についても，有価証券届出書や有価証券報告書と同様に，合理的な投資判断を行う投資者にとってみれば，発行会社の証券分析を行うのに過去５年程度のデータは必要とされるためである。"},{"l":1,"m":"公開買付け","sb":"対象株券等","i":"B","r":"","q":"公開買付規制は，上場会社が発行する株券等のみに適用される。","a":false,"c":"27条の2第1項柱書。","e":"公開買付規制の対象となる株券等は，有価証券報告書提出会社（24条１項各号）が発行する株券等および特定上場有価証券である。"},{"l":2,"m":"公開買付け","sb":"対象株券等","i":"B","r":"(令2II問題20ウエ・平27I問題18ウ)","q":"公開買付規制の対象となる株券等には，新株予約権証券は含まれない。","a":false,"c":"27条の2第1項柱書。","e":"株券等とは，株券の他に，新株予約権証券，新株予約権付社債券その他政令で定めるものが含まれる（27条の２第１項柱書，施行令６条１項１号）。"},{"l":3,"m":"公開買付け","sb":"対象株券等","i":"B","r":"(令2II問題20アイ・平27I問題18イエ類・平24II問題20ア)","q":"上場会社が発行する完全無議決権株式（当該株式と引換えに議決権のある株式を交付する旨の定款の定めがある株式を除く）のほか，社債券や国債証券，特定電子記録債権は，公開買付規制の対象外となる。","a":true,"c":"27条の2第1項柱書,施行令6条1項。","e":"公開買付規制は，会社の支配権の移転を伴う株券等の買付けを規制するものであるから，議決権のない株券等は公開買付規制の対象となる株券等から除外される。すなわち，① 完全無議決権株式（当該株式と引換えに議決権のある株式を交付する旨の定款の定めがある株式を除く）や，② 新株予約権の目的が①の株式のみである新株予約権および新株予約権付社債を買付ける場合には，公開買付規制の対象外となるのである。"},{"l":1,"m":"公開買付け","sb":"公開買付けが強制される場合","i":"B","r":"","q":"取引所金融商品市場外における株券等の買付け等で，買付け等の後の株券等所有割合が５％を超える場合は，必ず，当該買付けは公開買付けによらなければならない。","a":false,"c":"27条の2第1項1号。","e":"市場外における株券等の買付け等で，買付け等の後の株券等所有割合が５％を超える場合であっても，買付け等を行う日およびその前60日間で10名以下の者からの買付けは，著しく少数の者からの買付けとして，公開買付けの規制の対象から除かれている。"},{"l":2,"m":"公開買付け","sb":"公開買付けが強制される場合","i":"B","r":"","q":"公開買付けが強制されるか否かの判定において，株券等の買付者に特別関係者がある場合であっても，当該買付者の株券等所有割合に当該特別関係者の株券等所有割合を加算する必要はない。","a":false,"c":"27条の2第8項。","e":"株券等の買付者に特別関係者がある場合は，当該買付者の株券等所有割合に当該特別関係者の株券等所有割合を加算する。"},{"l":3,"m":"公開買付け","sb":"公開買付けが強制される場合","i":"B","r":"","q":"公開買付けが強制されるか否かの判定において，特別関係者に該当するか否かは，買付者の親族や買付者と資本関係にあるという形式基準によってのみ判断される。","a":false,"c":"27条の2第7項。","e":"特別関係者に該当するか否かは，買付者の親族や買付者と資本関係にある者という形式基準と，買付者との間で株券等の共同買付けや共同の議決権行使の合意がある者という実質基準により判断される。"},{"l":4,"m":"公開買付け","sb":"公開買付けが強制される場合","i":"B","r":"(平28II問題20イ類)","q":"取引所金融商品市場外における株券等の買付け等であっても，買付け等を行う日およびその前60日間で10名以下の者から買い付ける場合は，公開買付規制が適用されることはない。","a":false,"c":"27条の2第1項2号。","e":"著しく少数の者（買付け等を行う日およびその前60日間で10名以下の者）から市場外において株券等を買い付ける場合であっても，当該買付け等の後の株券等所有割合が３分の１を超える場合は，公開買付けによらなければならない。"},{"l":5,"m":"公開買付け","sb":"公開買付けが強制される場合","i":"B","r":"(平28II問題20ア類)","q":"株券等の買付者が市場取引によって株券等を買い付ける限りは，公開買付規制が適用されることはない。","a":false,"c":"27条の2第1項3号。","e":"特定売買等による株券等の買付けで，買付け等の後の株券等所有割合が３分の１を超える場合は，公開買付けによらなければならない。特定売買等は，市場取引ではあるが，相対取引に類似した取引が可能であるため，公開買付規制の適用対象とされる。ただし，市場取引であることに鑑みて，過度の規制とならないように支配権が移転する重大なものに関するもののみが規制の対象とされている。"},{"l":6,"m":"公開買付け","sb":"公開買付けが強制される場合","i":"B","r":"(平28II問題20ウ)","q":"３か月以内に，市場取引と市場外取引を組み合せて10％を超える買付けを行う場合であって，そのうち５％超が市場外取引（特定売買等を含み，公開買付けによるものおよび適用除外買付け等を除く）による買付け等であり，買付け等の後の株券等所有割合が３分の１を超える場合は，公開買付けによらなければならない。","a":true,"c":"27条の2第1項4号。","e":"当該規定は，３か月以内という比較的短期間において，公開買付けによらない市場外取引と市場取引を組み合せることによって，市場外取引における当事者以外の株主や発行会社にとって不意打ちとなる支配権獲得が可能となってしまう。そこで，このような急速的な不意打ちによる支配権獲得を防止するために，公開買付けが強制されているのである。"},{"l":7,"m":"公開買付け","sb":"公開買付けが強制される場合","i":"B","r":"(平28II問題20エ)","q":"他者によって公開買付けが行われている期間中に，すでに株券等所有割合が３分の１を超えている公開買付者以外の者が，５％を超える買付けを行う場合は，公開買付けによらなければならない。","a":true,"c":"27条の2第1項5号。","e":"当該規定は，① 買付者間の不公平を解消すること，② 投資者が十分な情報の下で会社支配者として相当な者を判断できるようにすることの２つを目的としている。すなわち，公開買付者は，別途買付けの禁止の規定（27条の５）により，公開買付け以外の方法によってその株券等を取得することができないのに対して，当該公開買付者以外の者は買付方法に制限がないのは不公平である。また，いずれの者によって会社を支配される方が相当かを投資者が十分な情報のもとで判断できるようにするべきである。そこで，一定の要件を満たす競合する買付者がいる場合には，公開買付けが強制されているのである。"},{"l":8,"m":"公開買付け","sb":"公開買付けが強制される場合","i":"C","r":"","q":"新株予約権者が当該新株予約権（コミットメント型ライツ・オファリングにより割り当てられたものを除く）を行使することによって行う株券等の買付け等については，公開買付規制は適用されない。","a":true,"c":"27条の2第1項ただし書。","e":"これは，新株予約権の取得の際に公開買付規制が適用される以上，当該新株予約権を行使する際に重ねて公開買付けの規制を及ぼす必要がないためである。また，支配権に実質的な移転が生じないことから，１年間継続して，形式基準による特別関係者に該当する者からの買付け等も，公開買付けによる必要はない。"},{"l":1,"m":"公開買付け","sb":"公開買付けの手続","i":"B","r":"","q":"公開買付けを行おうとする場合には，公開買付者は，公開買付開始公告を行わなければならない。","a":true,"c":"27条の3第1項。","e":"公開買付開始公告は，公開買付けに関する最低限の情報を投資者に対して提供することで，対象会社の株主に公開買付けが行われる旨を周知させ，公開買付けに応じる機会を全株主に平等に与えることを目的としている。"},{"l":2,"m":"公開買付け","sb":"公開買付けの手続","i":"B","r":"(平30II問題20エ)","q":"上場会社の株券等につき，当該上場会社以外の者が公開買付けを行うことを公告したときには，当該上場会社は公開買付届出書を提出しなければならない。","a":false,"c":"27条の3第2項。","e":"公開買付届出書を提出しなければならないのは，公開買付者である。"},{"l":3,"m":"公開買付け","sb":"公開買付けの手続","i":"B","r":"(令7I問題20ア類)","q":"公開買付者は，公開買付開始公告をすることによって，公開買付けに係る勧誘行為をすることができる。","a":false,"c":"27条の3第3項。","e":"公開買付者は，公開買付開始公告を行った日に，公開買付届出書を提出しなければならない（27条の３第２項）。公開買付者は，公開買付届出書を提出しなければ，公開買付けに係る勧誘行為をすることができない。"},{"l":4,"m":"公開買付け","sb":"公開買付けの手続","i":"A","r":"(平29I問題19ウ類・平24II問題19エ)","q":"公開買付説明書は，間接開示書類であるため，公衆縦覧に供される。","a":false,"c":"","e":"公開買付説明書とは，公開買付届出書の内容等を記載した書類である（27条の９第１項）。公開買付説明書は，発行開示における目論見書に相当するものである。すなわち，公開買付届出書が間接開示書類であるのと異なり，直接開示書類であるため，公衆縦覧には供されない。"},{"l":5,"m":"公開買付け","sb":"公開買付けの手続","i":"B","r":"","q":"公開買付者は，公開買付説明書を作成し，公開買付けに応じる株主に対して，買付け等に先立って，または買付等と同時に当該公開買付説明書を交付しなければならない。","a":true,"c":"27条の9第2項。","e":""},{"l":6,"m":"公開買付け","sb":"公開買付けの手続","i":"B","r":"(平22II問題20ア類)","q":"公開買付者は，公開買付開始公告が行われた日から 10 営業日以内に，意見表明報告書を内閣総理大臣に提出しなければならない。","a":false,"c":"27条の10第1項。","e":"公開買付けの対象会社は，公開買付開始公告が行われた日から 10 営業日以内に，意見表明報告書を内閣総理大臣に提出しなければならない。すなわち，意見表明報告書は，他の公開買付けに関する書類と異なり，対象会社が作成する書類である。"},{"l":7,"m":"公開買付け","sb":"公開買付けの手続","i":"B","r":"(平24I問題20ウ類)","q":"公開買付けの対象会社は，意見表明報告書に，当該公開買付けに関する意見のほか，公開買付者に対する質問を記載しなければならない。","a":false,"c":"27条の10第2項1号。","e":"意見表明報告書には，当該公開買付けに関する意見のほか，公開買付者に対する質問を記載することができる。"},{"l":8,"m":"公開買付け","sb":"公開買付けの手続","i":"B","r":"(令7I問題20ウ・平31I問題20ア)","q":"公開買付けの対象会社は，意見表明報告書において，公開買付けに応募することを勧めるか否かを明らかにしなければならない。","a":false,"c":"27条の10第2項,公開買付府令25条1項2号。","e":"意見表明報告書に記載する意見の内容については，例えば，「公開買付けに応募することを勧める」，「公開買付けに応募しないことを勧める」，「公開買付けに対し中立の立場をとる」，「意見の表明を留保する」等，わかりやすく記載することとされている。つまり，公開買付けに応募することを勧めるか否かを明らかにしなければならないわけではない。"},{"l":9,"m":"公開買付け","sb":"公開買付けの手続","i":"C","r":"(平22II問題20ウ)","q":"公開買付けの対象会社は，意見表明報告書を提出した後，直ちに，当該意見表明報告書の写しを，公開買付者，他の競合する公開買付者，金融商品取引所または認可金融商品取引業協会に対して送付しなければならない。","a":true,"c":"27条の10第9項。","e":"意見表明報告書の写しの送付が義務づけられているのは，対象会社の意見表明の内容に対する公開買付者および他の競合する公開買付者の対応は，投資者が公開買付けに応じるべきかを判断する際の重要な投資情報となるためである。"},{"l":10,"m":"公開買付け","sb":"公開買付けの手続","i":"B","r":"(平22II問題20エ)","q":"意見表明報告書に公開買付者に対する質問が記載されている場合には，当該意見表明報告書の写しの送付を受けた公開買付者は，内閣府令で定めるところにより，対質問回答報告書を内閣総理大臣に提出しなければならないが，当該公開買付者が当該質問に対して回答する必要がないと認め，その理由を記載した書類を公開買付対象者に送付した場合には，この限りでない。","a":false,"c":"27条の10第11項かっこ書。","e":"公開買付者が質問に対して回答する必要がないと判断した場合であっても，回答する必要がないと判断した理由を，対質問回答報告書に記載し，内閣総理大臣に提出しなければならない。"},{"l":11,"m":"公開買付け","sb":"公開買付けの手続","i":"B","r":"(平23II問題20エ)","q":"公開買付者は，公開買付期間の末日の翌日に，公開買付けの結果を公告または公表し，同日に当該公告または公表の内容等を記載した公開買付報告書を内閣総理大臣に対して提出しなければならない。","a":true,"c":"27条の13第1項2項。","e":""},{"l":12,"m":"公開買付け","sb":"公開買付けの手続","i":"A","r":"(平24I問題20イ類)","q":"公開買付届出書およびその訂正届出書の公衆縦覧期間は，１年間とされている。","a":false,"c":"27条の14第1項。","e":"公開買付届出書およびその訂正届出書の公衆縦覧期間は，５年間とされている。"},{"l":13,"m":"公開買付け","sb":"公開買付けの手続","i":"A","r":"(平29I問題19エ)","q":"意見表明報告書は公衆の縦覧に供されず，公開買付けに応じる株主に対して，直接交付されるものである。","a":false,"c":"27条の14第1項。","e":"意見表明報告書とは，対象会社による公開買付けに関する意見などを記載した書類である（27条の10第１項）。ここで，意見表明報告書は，公開買付けの対象会社が，公開買付開始公告が行われた日から10営業日以内に，内閣総理大臣に提出しなければならないものであって，意見表明報告書とその訂正報告書は，これらの書類が受理された日から，公開買付期間の末日の翌日以降５年を経過する日までの間，公衆縦覧に供されることとなる。よって，本肢は誤りである。"},{"l":1,"m":"公開買付け","sb":"公開買付けの方法に関する規制","i":"A","r":"","q":"公開買付期間は，公開買付公告を行った日から 60 営業日以内とされており，その期間内であれば，公開買付者は自由に設定することができる。","a":false,"c":"27条の2第2項,施行令8条1項。","e":"公開買付期間は，公開買付者が公開買付開始公告を行った日から20営業日以上60営業日以内とされる。公開買付期間が短いと，株主が熟慮する期間を確保することができない。したがって，公開買付期間はどんなに短くても20営業日以上でなければならない。これに対して，公開買付期間があまりに長期間に及ぶと，それだけ長い期間応募株主が不安定な状態に置かれることとなる。したがって，公開買付期間は原則60営業日以内でなければならない。"},{"l":2,"m":"公開買付け","sb":"公開買付けの方法に関する規制","i":"A","r":"(平22II問題20イ類)","q":"公開買付開始公告に記載された買付け等の期間が，30営業日未満である場合，意見表明報告書には，当該公開買付けに関する意見のほか，当該買付け等の期間を 60 営業日に延長することを請求する旨およびその理由を記載することができる。","a":false,"c":"27条の10第2項2号かっこ書,施行令9条の3第6項。","e":"敵対的な公開買付者により公開買付期間が短く設定された場合には，対象会社が対抗提案等を株主等に提示する時間的余裕が乏しくなる。その結果として，株主等が対抗提案等を適切に判断することができず，投資者保護に欠けるおそれがあるため，公開買付期間が 30 営業日未満に設定された場合は，対象会社による公開買付期間の延長請求が認められている。なお，この場合，公開買付者の意思にかかわらず，公開買付期間は30営業日まで延長されることとなる。"},{"l":3,"m":"公開買付け","sb":"公開買付けの方法に関する規制","i":"A","r":"(平22I問題20ア)","q":"公開買付けを行う場合は，その買付価格は均一の条件でなければならない。","a":true,"c":"27条の2第3項。","e":"買付価格の均一が求められているのは，公開買付けに応じる株主を平等に取扱うためである。また，金銭以外のものを買付けの対価とすることも認められるが，その場合の交換比率や差金についても，すべての応募株主に対して常に均一でなければならない（施行令８条２項）。"},{"l":4,"m":"公開買付け","sb":"公開買付けの方法に関する規制","i":"A","r":"","q":"公開買付者は，公開買付けの条件の変更をすることができない。","a":false,"c":"27条の6第2項。","e":"公開買付者が買付条件等の変更を行おうとすることは，原則として自由である。公開買付けを開始するにあたり，公開買付者は，目的やその当時の状況に応じて合理的な買付条件を設定することとなるが，その後の状況の変化によっては，当初の買付条件では目的達成が困難になる場合もあるため，公開買付者は原則として自由に買付条件等の変更をすることができるとされている。"},{"l":5,"m":"公開買付け","sb":"公開買付けの方法に関する規制","i":"A","r":"","q":"公開買付者は，公開買付けに係る条件の変更として，買付価格の引上げをすることはできない。","a":false,"c":"27条の6第2項。","e":"公開買付者は，公開買付けに係る条件の変更として，買付価格の引上げをすることができる。しかし，買付価格の引下げ等の変更（27条の６第１項各号）は，株主に不利益となるし，相場操縦にも利用されるおそれがあるため一定の場合を除き，認められない。"},{"l":6,"m":"公開買付け","sb":"公開買付けの方法に関する規制","i":"B","r":"","q":"公開買付者以外の者が，対象会社の発行する株券等について，対抗公開買付けの開始公告または公開買付期間の延長をする買付条件等の変更の公告を行った場合，当該公開買付者は，法定最長期間である 60 日を超える場合であっても，当該対抗者の公開買付期間の末日まで公開買付期間を延長することが認められる。","a":true,"c":"27条の6第1項4号,施行令13条2項2号ロ。","e":"公開買付期間の最長期間は 60 営業日以内とされているが，例えば，公開買付期間終了直前に条件の良い対抗公開買付けがかけられた場合には，それと競争するために公開買付期間の延長を行うことが認められないと，既存の公開買付者は打つ手がなくなってしまい，公開買付者間で不公平が生じてしまう。したがって，このような場合には，例外的に公開買付期間の延長を認めることで，既存の公開買付者を保護しているのである。"},{"l":7,"m":"公開買付け","sb":"公開買付けの方法に関する規制","i":"A","r":"(平31I問題20エ類・平24I問題20エ)","q":"公開買付者は，公開買付期間中に，買付予定の株券等の数を減少することはできるが，これを増加することはできない。","a":false,"c":"27条の6第1項2号,第2項。","e":"公開買付者は，買付予定の株券等の数を増加することは自由であるが，買付予定の株券等の数を減少することは禁止されている。"},{"l":8,"m":"公開買付け","sb":"公開買付けの方法に関する規制","i":"B","r":"","q":"公開買付者は，いかなる場合であっても，買付価格の引下げをすることができない。","a":false,"c":"27条の6第1項1号かっこ書,施行令13条1項。","e":"公開買付者が，公開買付開始公告および公開買付届出書において，「公開買付期間中に公開買付けの対象会社が株式分割や株式または新株予約権の無償割当てを実施したときは，買付価格の引下げを行うことがある旨」の条件を付した場合であって，実際に対象会社が株式分割等を実施したときは，買付価格の引下げが認められる。公開買付開始後に，対象会社が買収防衛策として株式分割等を行ったことにより株券等の価値が希釈化された場合などにおいては，公開買付者に不利益を強いる結果となってしまう。したがって，このような場合は例外的に買付価格の引下げが認められているのである。ただし，当該希釈分に対応した引下げのみが認められる。"},{"l":9,"m":"公開買付け","sb":"公開買付けの方法に関する規制","i":"B","r":"(平24I問題20ア)","q":"公開買付者は，公開買付期間中においても，取引所金融商品市場における競売買の方法により，当該公開買付けに係る株券等の発行者の株券等の買付けを行うことができる。","a":false,"c":"27条の5第1項。","e":"公開買付者は，公開買付期間中は，原則として対象株券等を公開買付けによらないで取得することが禁止されている。これを，別途買付けの禁止という。この趣旨は，公開買付けをしている最中に，公開買付者が対象としている株券等について，公開買付けの条件と異なる条件で取得するならば，株券等を売り付ける株主の間で不公正な結果が生じることになることを防止することにある。"},{"l":10,"m":"公開買付け","sb":"公開買付けの方法に関する規制","i":"B","r":"","q":"公開買付開始公告を行う前に対象株券等の取得を公開買付けによらないで行う旨の契約を締結しており，かつ，当該契約が公開買付届出書において開示されている場合は，公開買付期間中であっても，公開買付者は，対象株券等を公開買付けによらないで取得することができる。","a":true,"c":"27条の5第1号。","e":"また，形式基準による特別関係者が実質基準の特別関係者に該当しない旨の申出を内閣総理大臣に行ったとき（27条の５第２号）も，別途買付けの禁止の規定は適用されない。"},{"l":11,"m":"公開買付け","sb":"公開買付けの方法に関する規制","i":"B","r":"(平31I問題20ウ類・平22I問題20イ類)","q":"公開買付者は，公開買付開始公告をした後は，公開買付者自身に関し破産手続開始の決定等の重要な事情の変更が生じた場合に限って，公開買付けの撤回が認められる。","a":false,"c":"27条の11第1項ただし書。","e":"公開買付者は，公開買付開始公告をした後は，原則として，公開買付けの撤回をすることができない（27 条の 11第１項本文）。ただし，① 公開買付者自身に関し破産手続開始の決定等の重要な事情の変更が生じた場合，②公開買付公告および公開買付届出書において，公開買付けの対象会社もしくはその子会社の業務または財産に関する重要な変更その他公開買付けの目的の達成に重大な支障となる事情が生じたときは公開買付けの撤回をすることがある旨の条件を付した場合には，公開買付けの撤回が認められている（27条の11第１項ただし書）。"},{"l":12,"m":"公開買付け","sb":"公開買付けの方法に関する規制","i":"A","r":"(平31I問題20イ)","q":"公開買付けに応募した株主等は，公開買付期間中は，いつでも当該公開買付けに係る契約の解除をすることができる。","a":true,"c":"27条の12第1項","e":"株主が，公開買付けにいったん応募したが，検討した結果，公開買付けに応じるのをやめることを決定した場合や，対抗的な公開買付けがなされたときにそちらに乗り換える対応をとることができるようにするため，応募株主には契約解除権が認められている。"},{"l":13,"m":"公開買付け","sb":"公開買付けの方法に関する規制","i":"A","r":"(令7I問題20エ・平24II問題20イ)","q":"公開買付期間中に，応募株主等による契約の解除があった場合には，公開買付者は，当該契約の解除に伴う違約金の支払を請求することができる。","a":false,"c":"27条の12第3項。","e":"公開買付けに応募した株主は，公開買付期間中は，いつでも契約を解除することができる（27条の12第１項）。また，当該解除の自由を保障するために，公開買付者が当該契約の解除に伴う損害賠償または違約金の支払を請求することはできないものとしている。"},{"l":14,"m":"公開買付け","sb":"公開買付けの方法に関する規制","i":"B","r":"","q":"公開買付者は，原則として，買付予定数を超えて応募された株券等を買い付ける義務を負わない。","a":false,"c":"27条の13第4項。","e":"公開買付者は，原則として，期間中に応募された株券等の全部について買い付ける義務を負う。"},{"l":15,"m":"公開買付け","sb":"公開買付けの方法に関する規制","i":"B","r":"","q":"公開買付者は，公開買付開始公告および公開買付届出書において，応募総数が買付予定数としてあらかじめ記載された数に達しないときは，応募された株券等の全部の買付けを行わない旨の条件を付すことができる。","a":true,"c":"27条の13第4項1号。","e":"応募総数が公開買付者の目的を達成するために必要となる株券等の数に満たなかった場合にまで全部買付けを強制するのは，公開買付者に過度なリスクを負担させる結果となるためである。"},{"l":16,"m":"公開買付け","sb":"公開買付けの方法に関する規制","i":"B","r":"","q":"公開買付開始公告および公開買付届出書において，応募総数が買付予定数を超えるときはその超える部分の全部または一部の買付けを行わない旨の条件を付した場合であっても，公開買付期間中に応募された株券等の全部について買い付ける義務を負うことがある。","a":true,"c":"27条の13第4項,施行令14条の2の2。","e":"応募総数が買付予定数を超えるときは，その超える部分の全部または一部の買付け等を行わない旨の条件を付した場合（27条の13第４項２号）であっても，公開買付け後における株券等所有割合が３分の２を超える場合については，原則通り公開買付者に全部買付義務が課せられる（27条の13第４項，施行令14条の２の２）。これは，公開買付けの結果，上場廃止に至るような局面においては，買い付けられなかった株式をもつ零細株主は，株式の処分ができなくなるという著しく不安定な地位に置かれることとなるため，それを防止する趣旨である。"},{"l":17,"m":"公開買付け","sb":"公開買付けの方法に関する規制","i":"C","r":"","q":"公開買付開始公告および公開買付届出書において，応募総数が買付予定数を超えるときはその超える部分の全部または一部の買付け等を行わない旨の条件を付した場合において，買付予定数を超える応募株券等の数の全部または一部の買付け等をしない場合は，按分比例方式によって買い付けることとされている。","a":true,"c":"27条の13第5項。","e":""},{"l":1,"m":"公開買付け","sb":"自己株公開買付け","i":"C","r":"","q":"上場会社が行う株主との合意に基づく自己株式の取得であって，株主全員から譲渡しの申込みを受ける場合の当該自己株式の買付けは，公開買付けによらなければならない。","a":true,"c":"27条の22の2第1項1号。","e":"自己株公開買付けの対象となるのは，上場株券等（24条の６第１項参照）である。発行会社が自己株式を取得しても議決権を行使することができないため（会社法308条２項），支配権の移動は生じないことから，市場外で取得する場合に公開買付けを強制する必要はないとも思える。しかし，発行会社が自己株式を取得する場合には，株主平等原則違反やインサイダー取引，相場操縦などの弊害が生じる可能性があるため，上場株券等の発行者による市場外における買付けのうち，一定の場合について公開買付規制を適用することとしたのである。ただし，会社法160条１項に規定する特定の株主から自己株式を取得する場合は自己株公開買付けの対象外とされている（27条の22の２第１項１号かっこ書）。"},{"l":2,"m":"公開買付け","sb":"自己株公開買付け","i":"C","r":"(令4II問題20ア)","q":"発行者による上場株券等の公開買付けの対象となる上場株券等には，新株予約権証券および新株予約権付社債券が含まれる。","a":false,"c":"","e":"発行者以外の者による公開買付規制の対象となる株券等とは，株券の他に，新株予約権証券，新株予約権付社債券その他政令で定めるものが含まれる（27条の２第１項柱書，施行令６条１項）が，自社株公開買付規制の対象となる上場株券等には，新株予約権証券および新株予約権付社債券は含まれない。自社株公開買付けは，発行会社の支配権変動と直接の関連性を有さず，自己株式の取得についての規制を置くことが目的となるためである。"},{"l":3,"m":"公開買付け","sb":"自己株公開買付け","i":"C","r":"(令4II問題20イ)","q":"発行者による上場株券等の公開買付けにおいて，発行者である公開買付者は，公開買付開始公告が行われた日から政令で定める期間内に，意見表明報告書を内閣総理大臣に提出しなければならない。","a":false,"c":"","e":"自社株公開買付けには，他社株公開買付けの規定が多く準用されている（27条の22の２）。したがって，公開買付期間についても，他社株公開買付けの規定と同様の制限（27条の２第２項）が及ぶ。しかし，自社株公開買付けは会社支配権の獲得が目的ではないため，公開買付けが強制される場合の規定（27条の２第１項）は準用されない。また，自社株公開買付けでは，公開買付者と対象会社が同一であるので，意見表明報告書および買付者による対質問回答報告書に関する規定（27条の10）も準用されない。"},{"l":1,"m":"大量保有報告制度","sb":"対象有価証券","i":"B","r":"","q":"大量保有報告制度の対象となる有価証券の発行会社は，有価証券報告書提出会社である。","a":false,"c":"27条の23第1項本文,施行令14条の4第2項。","e":"大量保有報告制度の対象となる有価証券の発行会社は，上場会社および店頭登録会社である。大量保有報告制度の対象会社の範囲は，公開買付制度の対象会社よりも狭くなっている。すなわち，大量保有報告制度の対象には，有価証券届出書等提出会社，外形基準該当会社は含まれない。これは，公開買付制度は，対象会社の既存株主を平等に取扱う観点から，対象会社を上場会社および店頭登録会社に限らず，広く捉える必要があるのに対し，大量保有報告書制度では，一般投資家が参加する株式市場の公正性と透明性を高めるのが趣旨であるので，対象を市場で取引される流通性の高い有価証券の発行会社に限定しているのである。"},{"l":2,"m":"大量保有報告制度","sb":"対象有価証券","i":"B","r":"(平29II問題20ア)","q":"上場株券を発行済株式総数の５％を超えて保有する者が現れた場合，当該上場株券の発行者は大量保有報告書の提出義務を負う。","a":false,"c":"27条の23第1項本文。","e":"大量保有報告書の提出義務者は，大量保有者である。"},{"l":3,"m":"大量保有報告制度","sb":"対象有価証券","i":"B","r":"","q":"上場会社が発行する完全無議決権株式（当該株式と引換えに議決権のある株式を交付する旨の定款の定めがある株式を除く）は，大量保有報告制度の対象外である。","a":true,"c":"27条の23第1項2項,施行令14条の5の2第1項。","e":"大量保有報告制度は，会社の支配権に関する情報を開示させるものであるため，議決権のない有価証券は大量保有報告制度の対象となる有価証券から除外される。すなわち，① 完全無議決権株式（当該株式と引換えに議決権のある株式を交付する旨の定款の定めがある株式を除く）や，② 新株予約権の目的が①の株式のみである新株予約権および新株予約権付社債は，大量保有報告制度の対象外となるのである。"},{"l":4,"m":"大量保有報告制度","sb":"対象有価証券","i":"B","r":"(平20問題20ア)","q":"新株予約権付社債券は大量保有報告制度の適用対象となることがあるが，国債証券や抵当証券はその適用対象とならない。","a":true,"c":"27条の23第1項2項,施行令14条の5の2。","e":"上記問題３の解説参照。"},{"l":1,"m":"大量保有報告制度","sb":"大量保有報告書","i":"A","r":"","q":"大量保有者とは，大量保有報告書制度の対象有価証券の株券等保有割合が５％を超える者をいう。","a":true,"c":"27条の23第1項本文。","e":"株券等保有割合が５％を超える者を大量保有者とすることから，大量保有報告制度は，５％ルールとよばれることもある。"},{"l":2,"m":"大量保有報告制度","sb":"大量保有報告書","i":"B","r":"","q":"大量保有者となった者は，原則として，大量保有者となった日に，大量保有報告書を内閣総理大臣に提出しなければならない。","a":false,"c":"27条の23第1項本文。","e":"大量保有者となった者は，原則として，大量保有者となった日から５営業日以内に，大量保有報告書を内閣総理大臣に提出しなければならない。"},{"l":3,"m":"大量保有報告制度","sb":"大量保有報告書","i":"B","r":"","q":"株式会社が自己株式を消却したことにより，発行済株式総数が減少した結果として大量保有者となった者は，原則として，大量保有者となった日から５営業日以内に，大量保有報告書を内閣総理大臣に提出しなければならない。","a":false,"c":"27条の23第1項ただし書。","e":"大量保有者となった者であっても，保有株券等の総数に増加がない場合（自己株式消却により発行済株式総数が減少し，株券等保有割合が５％を超えた場合などがこれに該当する）には，大量保有報告書を提出する必要はない。"},{"l":4,"m":"大量保有報告制度","sb":"大量保有報告書","i":"A","r":"(令3問題20イ)","q":"大量保有報告書が提出された場合には，当該大量保有報告書に係る株券等の発行者は，意見表明報告書を内閣総理大臣に提出しなければならない。","a":false,"c":"27 条の10 第1項。","e":"意見表明報告書は，公開買付けにおける開示書類であるため，提出する必要はない。"},{"l":5,"m":"大量保有報告制度","sb":"大量保有報告書","i":"C","r":"(平22I問題20エ類)","q":"金融商品取引所に上場されている株券等の保有者は，大量保有報告書を内閣総理大臣に提出した場合には，その写しを当該株券等の発行者に送付しなければならない。","a":true,"c":"27条の27。","e":""},{"l":6,"m":"大量保有報告制度","sb":"大量保有報告書","i":"B","r":"(令3問題20ア・平29II問題20イ・平26II問題18イエ)","q":"大量保有報告書には，株券等保有割合に関する事項，取得資金に関する事項および保有の目的に関する事項を記載しなければならない。","a":true,"c":"大量保有府令第1号様式参照。","e":"大量保有報告書には，提出者（大量保有者）に関する事項として，① 提出者の概要，② 保有目的，③ 重要提案行為等，④ 提出者の保有株券等の内訳，⑤ 株券等の発行者の発行する株券等に関する最近 60 日間の取得または処分の状況，⑥ 株券等に関する担保契約等重要な契約，⑦ 保有株券等の取得資金 等を記載する必要がある。"},{"l":7,"m":"大量保有報告制度","sb":"大量保有報告書","i":"B","r":"(平26II問題18ウ)","q":"大量保有報告書には，大量保有者の総資産の額を記載しなければならない。","a":false,"c":"大量保有府令第1号様式参照。","e":"上記問題６の解説参照。大量保有者の総資産の額は，大量保有報告書の記載事項とされていない。"},{"l":8,"m":"大量保有報告制度","sb":"大量保有報告書","i":"B","r":"(平24II問題20ウ)","q":"大量保有報告書の縦覧書類に記載された取得資金が，銀行からの借入れによる場合（内閣府令で定める場合を除く）には，当該銀行の名称は公衆の縦覧に供されない。","a":true,"c":"27条の28第3項。","e":"取得資金の貸付けを行った銀行の名称が公衆縦覧に供されないのは，金融機関が一般的な運転資金として貸し付けた資金が株券等の取得に使用されたような場合についてまで借入先名の開示を行った場合，当該銀行の通常の融資業務に支障をきたすおそれがあるためである。"},{"l":9,"m":"大量保有報告制度","sb":"大量保有報告書","i":"A","r":"(平29II問題20ウ類)","q":"大量保有報告書およびその訂正報告書の公衆縦覧期間は，１年間とされている。","a":false,"c":"27条の28第1項。","e":"大量保有報告書およびその訂正報告書の公衆縦覧期間は，５年間とされている。"},{"l":1,"m":"大量保有報告制度","sb":"変更報告書","i":"A","r":"(令3問題20エ類・平20問題20ウ類)","q":"大量保有報告書を提出した者は，その後，株券等保有割合が１％以上増減した場合その他の大量保有報告書に記載すべき重要な事項の変更があった場合は，原則として，変更があった日から５営業日以内に，変更報告書を内閣総理大臣に提出しなければならない。","a":true,"c":"27条の25第1項本文。","e":""},{"l":2,"m":"大量保有報告制度","sb":"変更報告書","i":"A","r":"(平22I問題20ウ)","q":"株券等保有割合が５％以下となった旨の変更報告書をすでに提出している者は，その後，大量保有者とならない限り，変更報告書を提出する必要はない。","a":true,"c":"27条の25第1項ただし書。","e":""},{"l":1,"m":"大量保有報告制度","sb":"短期大量譲渡の開示","i":"B","r":"(平24II問題20エ類)","q":"株券等保有割合が減少したことにより変更報告書を提出する者であって，60日間に，株券等保有割合の５％超を譲渡したときは，当該変更報告書に，原則として，譲渡の相手方およびその対価を記載しなければならない。","a":false,"c":"27条の25第2項。","e":"株券等保有割合が減少したことにより変更報告書を提出する者であって，60日間に，株券等保有割合の５％超，かつ，自己の保有株券等の過半数を譲渡したときは，原則として，当該変更報告書に，譲渡の相手方およびその対価を記載することとされている。短期大量譲渡の開示制度は，いわゆる肩代わりが行われたかどうかを一般投資家が判断できるようにしたものである。短期間に大量の譲渡がなされる場合，それまで高騰していた株価が急激に下落し，そのような事実を知らない一般投資者は不測の損害を被るおそれがある。そのような場合に，変更報告書において譲渡の相手方およびその対価という特別な事項を記載させることで，一般投資家は肩代わりが行われた事実を知ることができ，さらに，肩代わり等の短期大量譲渡を抑制させる効果が期待されるのである。"},{"l":1,"m":"大量保有報告制度","sb":"訂正報告書","i":"C","r":"(令3問題20ウ)","q":"大量保有報告書を提出した者は，当該大量保有報告書に記載すべき重要な事項または誤解を生じさせないために必要な重要な事実の記載が不十分であると認めるときは，訂正報告書を内閣総理大臣に提出しなければならない。","a":true,"c":"27条の25第3項。","e":"大量保有報告書または変更報告書に記載された内容が事実と相違し，または記載すべき重要な事項もしくは誤解を生じさせないために重要な事実の記載が不十分であり，もしくは欠けていると認められるときは，訂正報告書を内閣総理大臣に提出しなければならない。"},{"l":1,"m":"大量保有報告制度","sb":"特例報告","i":"B","r":"","q":"あらかじめ内閣総理大臣に特例報告のための基準日の届出をすれば，何人も，特例報告制度を利用することができる。","a":false,"c":"27条の26第1項。","e":"特例報告対象者は限定されており，証券会社，銀行，信託会社，保険会社，国，地方公共団体等である。証券会社などは，日常業務を通じて継続反復的に株券等の売買を行っているため，その都度，大量保有報告書または変更報告書を提出することを義務づけると，事務負担が過大となる。そのため，証券会社などには一般報告と比べて開示の頻度を緩和した特例報告制度の利用を認めることで，事務負担を軽減しているのである。"},{"l":2,"m":"大量保有報告制度","sb":"特例報告","i":"C","r":"","q":"特例報告の利用が認められる者（国および地方公共団体を除く）であっても，重要提案行為等を保有の目的とする場合は，特例報告を利用することができない。","a":true,"c":"27条の26第1項。","e":"重要提案行為等を保有の目的とする者は，経営に影響を及ぼす可能性が大きいと考えられるので，投資者に経営支配権に関する情報を迅速に知らせる必要があるためである。"},{"l":3,"m":"大量保有報告制度","sb":"特例報告","i":"C","r":"","q":"特例報告の利用が認められる者（国および地方公共団体を除く）であっても，株券等保有割合が10％を超える者は，特例報告を利用することができない。","a":true,"c":"27条の26第1項かっこ書。","e":"株券等保有割合が10％を超える場合，仮に支配目的がなくても，発行者の経営に対して大きな影響を及ぼすことが可能な立場にあるといえるし，大量保有の情報は，株券等の需給情報として有用であるためである。"},{"l":4,"m":"大量保有報告制度","sb":"特例報告","i":"B","r":"","q":"特例報告制度を利用できる者は，株券等保有割合が５％を超えることとなった基準日から５営業日以内に，大量保有報告書を内閣総理大臣に提出することで足りる。なお，重要提案行為等は行わないものとする。","a":true,"c":"27条の26第1項。","e":""},{"l":5,"m":"大量保有報告制度","sb":"特例報告","i":"B","r":"(平20問題20イ)","q":"特例報告対象者が，対象有価証券を５％を超えて保有することとなった日以降最初に到来する基準日の５営業日後までの間に重要提案行為等を行う場合は，その重要提案行為等を行う５営業日前までに大量保有報告書を内閣総理大臣に提出しなければならない。","a":true,"c":"27条の26第4項,施行令14条の8の2第3項。","e":"また，変更報告書についても同様に，株券等保有割合が１％以上増加した場合であって，当該増加した日以降最初に到来する基準日の５営業日後までの間に重要提案行為等を行う場合には，その重要提案行為等を行う５営業日前までに変更報告書を内閣総理大臣に提出しなければならない（27条の26第５項，施行令14条の８の２第３項）。重要提案行為等を行う場合の事前開示の趣旨は，重要提案行為等を行う者の保有情報は投資者にとって重要な情報であるにもかかわらず，重要提案行為等を行う際に株券等保有割合を大量保有報告書でまだ開示していない，または，株券等保有割合に重要な増加があったことを変更報告書で開示していないという状況を生じさせないことにある。"},{"l":1,"m":"開示規制違反と責任","sb":"発行開示書類に虚偽記載があった場合の⺠事責任","i":"A","r":"(平30II問題19ア類・平28I問題19ア類・平23I問題20イ類)","q":"発行者は，有価証券届出書に重要な虚偽記載等がある場合，募集または売出しに応じて有価証券を取得した善意者に対して，無過失の損害賠償責任を負う。","a":true,"c":"18条1項。","e":"当該責任の趣旨は，有価証券届出書の虚偽記載等によって損害を被った投資者を救済すること，そして，事後的に損害賠償請求される可能性を明示することで，有価証券の発行者が真実を開示することを促すことである。ここで，有価証券の発行者は，その発行する有価証券について主たる開示義務を負うため，無過失責任という厳格な責任が課せられている。しかし，有価証券の取得者が悪意である場合には，有価証券届出書の虚偽記載等と取得者の損害との間に因果関係が存在しなくなるため，発行者が取得者の悪意を立証した場合には責任を免れる。"},{"l":2,"m":"開示規制違反と責任","sb":"発行開示書類に虚偽記載があった場合の⺠事責任","i":"A","r":"","q":"有価証券届出書に重要な虚偽記載等がある場合において，発行者が募集または売出しに応じて有価証券を取得した者に賠償すべき金額は法定されていない。","a":false,"c":"19条1項。","e":"有価証券届出書に重要な虚偽記載等がある場合において，発行者が募集または売出しに応じて有価証券を取得した者に賠償すべき金額は法定されている。これは，損害を被った投資者の立証負担を軽減し，損害賠償請求権の実効性を確保するためである。発行者が有価証券の取得者に賠償すべき額は，有価証券を取得するために支払った額から，① 損害賠償請求時の市場価額（市場価額がない場合は，その時の処分推定価額），② 損害賠償請求時においてすでに当該有価証券を処分しているときは，その処分価額を控除した額とされている。"},{"l":3,"m":"開示規制違反と責任","sb":"発行開示書類に虚偽記載があった場合の⺠事責任","i":"B","r":"(平30II問題19ウ類・平28I問題19ウ類)","q":"有価証券届出書に重要な虚偽記載等がある場合において，発行者が募集または売出しに応じて有価証券を取得した者に賠償すべきと法定された金額の中に，有価証券届出書の虚偽記載等と因果関係が存在しないものが含まれることを立証すれば，損害賠償額を減少することができる。","a":true,"c":"19条2項。","e":"虚偽記載等と無関係の損害については，損害賠償責任から免れることを認めるべきであるためである。"},{"l":4,"m":"開示規制違反と責任","sb":"発行開示書類に虚偽記載があった場合の⺠事責任","i":"A","r":"","q":"有価証券届出書の提出時における役員は，有価証券届出書に重要な虚偽記載等がある場合，募集または売出しに応じて有価証券を取得した善意者に対して，無過失の損害賠償責任を負う。","a":false,"c":"21条1項2項。","e":"有価証券届出書の提出時における役員（取締役，会計参与，監査役，執行役またはこれらに準ずる者），売出人，公認会計士または監査法人，証券会社等の引受人は，有価証券届出書に重要な虚偽記載がある場合，募集または売出しに応じて有価証券を取得した善意者に対して，損害賠償責任を負う（21条１項）。当該責任は，過失責任であるが，無過失の立証責任は役員等にある（21条２項）。すなわち，立証責任の転換された過失責任である。"},{"l":5,"m":"開示規制違反と責任","sb":"発行開示書類に虚偽記載があった場合の⺠事責任","i":"B","r":"(平30II問題19イ)","q":"有価証券届出書に係る監査証明において，当該監査証明に係る書類について記載が虚偽でない旨の監査証明をした公認会計士または監査法人は，当該監査証明をしたことについて故意または過失がなかったことを証明したときは，募集または売出しに応じて有価証券を取得した善意者に対して，損害賠償責任を負わない。","a":true,"c":"21条1項2項。","e":"上記問題４の解説参照。"},{"l":6,"m":"開示規制違反と責任","sb":"発行開示書類に虚偽記載があった場合の⺠事責任","i":"B","r":"","q":"有価証券届出書の提出時における役員は，有価証券届出書に重要な虚偽記載等がある場合，募集または売出しによらないで有価証券を取得した善意者に対して，損害賠償責任を負わない。","a":false,"c":"22条1項。","e":"有価証券届出書に虚偽記載がある場合，発行者，発行者の役員，公認会計士または監査法人は，募集または売出しによらないで有価証券を取得した者に対しても損害賠償責任を負う（21条の２第１項，22条１項）。発行開示書類である有価証券届出書の虚偽記載等に関して，流通市場での責任が課せられる理由であるが，有価証券届出書が公衆縦覧に供されるためである。すなわち，虚偽記載等のある有価証券届出書が公衆縦覧に供されると，公衆縦覧を通じて流通市場では当該虚偽記載等の影響を受けた価格が形成されてしまうため，投資者が不測の損害を被る可能性があるのである。"},{"l":7,"m":"開示規制違反と責任","sb":"発行開示書類に虚偽記載があった場合の⺠事責任","i":"C","r":"(平30II問題19エ類・平28I問題19エ)","q":"有価証券届出書のうちに重要な事項について虚偽の記載がある場合に，当該有価証券届出書の届出者である会社およびその役員等が当該有価証券を当該募集に応じて取得した者に対して負う金融商品取引法上の損害賠償責任に係る請求権は，虚偽記載を知った時または相当な注意をもって知ることができる時から３年間これを行使しないときは消滅する。","a":true,"c":"20条1号。","e":""},{"l":1,"m":"開示規制違反と責任","sb":"流通開示書類に虚偽記載があった場合の⺠事責任","i":"A","r":"(平30I問題19イ・平25II問題20イ)","q":"発行者は，重要な虚偽記載のある有価証券報告書が公衆縦覧に供されている間に，募集または売出しによらないで有価証券を取得または処分した善意者に対して，無過失の損害賠償責任を負う。","a":false,"c":"21条の2第1項2項。","e":"流通市場における虚偽開示書類の提出者の損害賠償責任は，過失責任である。無過失の立証責任は，提出者にあるため，当該責任は，立証責任の転換された過失責任である。"},{"l":2,"m":"開示規制違反と責任","sb":"流通開示書類に虚偽記載があった場合の⺠事責任","i":"B","r":"(平31I問題19エ)","q":"重要な事項について虚偽の記載がある内部統制報告書の提出会社の役員等の損害賠償責任については，金融商品取引法に規定されていない。","a":false,"c":"24条の4の6,22条。","e":"流通市場における提出者の責任の対象書類は，有価証券報告書，内部統制報告書などの継続開示書類（確認書を除く）のほか，有価証券届出書といった発行開示書類も含まれる（21条の２第１項，25条１項各号）。"},{"l":3,"m":"開示規制違反と責任","sb":"流通開示書類に虚偽記載があった場合の⺠事責任","i":"B","r":"(平23I問題20ウ)","q":"有価証券報告書の記載内容に係る確認書に重要な虚偽記載等があったときは，金融商品取引法上，損害賠償責任は定められていない。","a":true,"c":"21条の2第1項柱書かっこ書。","e":"公衆縦覧に供される書類であっても，確認書（24条の４の２等）は，流通市場における民事責任の対象書類には含まれない。確認書は，それによって有価証券報告書等の適正性を確認する書類であり，確認書に虚偽記載があるということは，その確認の対象である有価証券報告書等に虚偽記載があるということであるので，有価証券報告書等についての民事責任を課すことで足りるのである。"},{"l":4,"m":"開示規制違反と責任","sb":"流通開示書類に虚偽記載があった場合の⺠事責任","i":"A","r":"(令7I問題19イ・平25II問題20ア・平23I問題20ア)","q":"有価証券報告書に重要な虚偽記載等がある場合において，発行者が，募集または売出しによらないで有価証券を取得した者に賠償すべき金額には，上限が設けられている。","a":true,"c":"21条の2第1項,19条1項。","e":"損害の限度額が置かれている趣旨は，有価証券報告書等に虚偽記載等があった場合に，有価証券届出書に虚偽記載等があった場合よりも多額の責任を発行会社に負わせるのは不当であると考えられたためである。"},{"l":5,"m":"開示規制違反と責任","sb":"流通開示書類に虚偽記載があった場合の⺠事責任","i":"B","r":"(平30I問題19ア)","q":"有価証券報告書の提出者が負担する損害賠償責任については，金融商品取引法上，有価証券の取得または処分の際に当該記載が虚偽であることを知らなかった投資者の損害額の推定規定が置かれている。","a":true,"c":"21条の2第3項。","e":"虚偽記載等の事実の公表がされたときは，当該虚偽記載等の事実が公表される前１年以内に当該有価証券を取得し，かつ，当該公表日において引き続き当該有価証券を所有する者は，当該公表日前１か月間の当該有価証券の市場価額（市場価額がないときは，処分推定価額）の平均額から当該公表日後１か月間の当該有価証券の市場価額の平均額を控除した額を，当該書類の虚偽記載等により生じた損害の額とすることができる。ただし，責任限度額（19条１項）を超えることはできない。投資家が当該責任を追及するためには，虚偽記載等と因果関係のある損害の額について責任を追及する側（投資家側）が立証する必要がある。しかし，投資家がこれらの立証を行うのは困難であるため，その立証を容易にする趣旨で当該推定の規定は設けられている。"},{"l":6,"m":"開示規制違反と責任","sb":"流通開示書類に虚偽記載があった場合の⺠事責任","i":"A","r":"(平30I問題19ウ)","q":"有価証券報告書に係る財務書類について虚偽記載がない旨の監査証明をした公認会計士または監査法人が負担する損害賠償責任については，金融商品取引法上，有価証券の取得または処分の際に当該記載が虚偽であることを知らなかった投資者の損害額の推定規定が置かれている。","a":false,"c":"24条の4参照。","e":"有価証券報告書に係る財務書類について虚偽記載がない旨の監査証明をした公認会計士または監査法人が負担する損害賠償責任については，発行者の責任とは異なり，金融商品取引法上，投資者の損害額の推定規定が置かれていない。"},{"l":7,"m":"開示規制違反と責任","sb":"流通開示書類に虚偽記載があった場合の⺠事責任","i":"A","r":"","q":"有価証券報告書の提出時における役員は，有価証券報告書に重要な虚偽記載等がある場合，有価証券を取得または処分した善意者に対して，損害賠償責任を負う。ただし，当該役員が当該虚偽記載について無過失であることを証明した場合は，当該責任を負わない。","a":true,"c":"24条の4,22条,21条2項1号。","e":"有価証券報告書の提出時における役員のほか，公認会計士または監査法人も同様の責任を負う（24条の４，22条，21条２項２号）。"},{"l":8,"m":"開示規制違反と責任","sb":"流通開示書類に虚偽記載があった場合の⺠事責任","i":"A","r":"(平25II問題20ウ)","q":"有価証券報告書を提出した株式会社の社外取締役が負担する賠償責任については，賠償責任額の限度が法定されている。","a":false,"c":"24条の4,22条1項。","e":"提出会社の役員等の賠償責任については，提出者の責任と異なり，賠償責任額の限度が法定されていない。"},{"l":9,"m":"開示規制違反と責任","sb":"流通開示書類に虚偽記載があった場合の⺠事責任","i":"A","r":"(平30I問題19エ類・平25II問題20エ)","q":"有価証券報告書を提出した株式会社の監査証明に係る書類について，虚偽でない旨の監査証明をした公認会計士は，故意または過失がないことを証明した場合であっても賠償責任を負う。","a":false,"c":"24条の4,22条2項,21条2項2号。","e":"有価証券報告書を提出した株式会社の監査証明に係る書類について，記載が虚偽でありまたは欠けているものを虚偽でなくまたは欠けていないものとして証明した公認会計士または監査法人は，当該証明をしたことについて故意または過失がないことを証明したときは，賠償責任を負わない。"},{"l":1,"m":"開示規制違反と責任","sb":"課徴金","i":"A","r":"(平29II問題20エ類)","q":"大量保有報告書の不提出や重要事項の虚偽記載について，金融商品取引法上，課徴金の納付が求められることがある。","a":true,"c":"","e":"課徴金の対象となるのは，以下のような，市場の公平性と投資者による市場への信頼を直接的に害する金融商品取引法違反の中でも特に悪質であり，その抑制の必要性が特別に高いものである。① 発行開示書類の不提出または虚偽記載（172条，172条の２）② 継続開示書類（※）の不提出または虚偽記載（172条の３，172条の４）③ 公開買付開始公告の不実施または虚偽記載（172条の５，172条の６）④ 大量保有報告書の不提出または虚偽記載（172条の７，172条の８）（※）有価証券報告書，半期報告書，臨時報告書およびこれらの訂正報告書のみが対象"},{"l":2,"m":"開示規制違反と責任","sb":"課徴金","i":"B","r":"(平26I問題17エ類)","q":"自己株券買付状況報告書の提出義務を負う上場株券等を発行する会社による自己株券買付状況報告書の不提出は，当該上場株券等を発行する会社に課徴金の納付が求められる事由に該当しない。","a":true,"c":"172条以下参照。","e":"自己株券買付状況報告書の不提出は，刑事罰の対象となっているが（200条５号，207条１項５号）課徴金の対象とはなっていない。"}]},{"n":14,"name":"外国会社","qs":[{"l":1,"m":"総論","sb":"","i":"C","r":"","q":"外国会社は，外国の法令に準拠して設立された外国の法人であって，会社と同種のものまたは会社に類似するものをいう。","a":false,"c":"2条2号。","e":"外国会社は，外国の法令に準拠して設立された法人その他の外国の団体であって，会社と同種のものまたは会社に類似するものをいう。諸外国では，会社でありながら法人格がないものが少なくない。したがって，日本の会社と同種，または，それに類似するものであれば，法人格があるか否かは問われない。"},{"l":2,"m":"総論","sb":"","i":"C","r":"(平27II問題16イ類・平22II問題15イ類)","q":"外国会社が日本において取引を継続してしようとするときは，日本における代表者を定めなければならず，その日本における代表者のうち１人以上は，日本に国籍を有する者でなければならない。","a":false,"c":"817条1項。","e":"外国会社は，日本において取引を継続してしようとするときは，日本における代表者を定めなければならない。この場合において，その日本における代表者のうち１人以上は，日本に住所を有する者でなければならない。すなわち，日本における代表者のうち１人以上は日本に住所を有する必要があるが，日本国籍を有する者である必要はない。日本国内の債権者を保護するためには，日本国内において取引上の紛争の処理等に応じる者の選任を義務づける必要があるからである。"},{"l":3,"m":"総論","sb":"","i":"C","r":"","q":"外国会社の日本における代表者は，当該外国会社の日本における業務に関する一切の裁判上または裁判外の行為をする権限を有する。","a":true,"c":"817条2項。","e":"また，当該権限に加えた制限は，善意の第三者に対抗することができない（817条３項）。"},{"l":4,"m":"総論","sb":"","i":"C","r":"","q":"外国会社の登記をした外国会社は，日本における代表者（日本に住所を有するものに限る）の全員が退任しようとするときは，当該外国会社の債権者に対し異議があれば一定の期間内にこれを述べることができる旨を官報に公告し，かつ，知れている債権者には，各別にこれを催告しなければならない。","a":true,"c":"820条1項本文。","e":"なお，異議を述べることができる期間は，１か月以上であることが求められている（820 条１項ただし書）。この場合は厳重な債権者異議手続がとられており，各別の催告を省略することはできない。"},{"l":1,"m":"登記前の継続取引の禁止","sb":"","i":"C","r":"(平27II問題16ウ・平22II問題15ア)","q":"外国会社は，外国会社の登記をするまでは，日本において取引を継続してすることができない。","a":true,"c":"818条1項。","e":"これに違反して取引をした者は，相手方に対し，外国会社と連帯して，当該取引によって生じた債務を弁済する責任を負う（818条２項）。日本における取引の安全を図る趣旨である。"},{"l":2,"m":"登記前の継続取引の禁止","sb":"","i":"C","r":"","q":"外国会社が日本において取引を継続してしようとする場合は，日本に営業所を設けなければならない。","a":false,"c":"933条1項。","e":"外国会社が日本において取引を継続してしようとする場合であっても，日本に営業所を設置する義務はない。"},{"l":3,"m":"登記前の継続取引の禁止","sb":"","i":"C","r":"(平27II問題16エ・平22II問題15ウ)","q":"外国会社の登記においては，その設立の準拠法を登記しなければならない。","a":true,"c":"933条2項1号。","e":""},{"l":1,"m":"貸借対照表に相当するものの公告","sb":"","i":"C","r":"","q":"外国会社の登記をした外国会社は，定時株主総会における承認と同種の手続，または，これに類似する手続の終結後遅滞なく，貸借対照表に相当するものを日本において公告しなければならない。","a":false,"c":"819条1項。","e":"外国会社の登記をした外国会社（日本における同種の会社または最も類似する会社が株式会社であるものに限る）は，法務省令で定めるところにより，定時株主総会における承認（438 条２項）と同種の手続，または，これに類似する手続の終結後遅滞なく，貸借対照表に相当するものを日本において公告しなければならない。"},{"l":1,"m":"擬似外国会社","sb":"","i":"C","r":"","q":"日本に本店を置き，または日本において事業を行うことを主たる目的とする外国会社は，日本において取引を継続してすることができない。","a":true,"c":"821条1項。","e":"日本に本店を置き，または日本において事業を行うことを主たる目的とする外国会社を擬似外国会社という。擬似外国会社は，日本において取引を継続してすることができない。当該規定に違反して取引をした者は，相手方に対し，外国会社と連帯して，当該取引によって生じた債務を弁済する責任を負う（821条２項）。"},{"l":2,"m":"擬似外国会社","sb":"","i":"C","r":"","q":"日本に本店を置き，または日本において事業を行うことを主たる目的とする外国会社は，外国会社の登記をするまでは，日本において取引を継続することができない。","a":false,"c":"821条1項。","e":"擬似外国会社は，登記の有無に関わらず，日本において取引を継続してすることができない。これは，もっぱら日本に事業の拠点を置く意図を持ちながら，日本の会社法の適用を回避するために，外国法を準拠法として設立された外国会社を規制する趣旨である。"},{"l":1,"m":"他の法律の適用関係","sb":"","i":"C","r":"","q":"外国会社は，会社法以外の法律の適用については，別段の定めがない限り，日本における同種の会社または最も類似する会社とみなす。","a":true,"c":"823条。","e":""}]},{"n":15,"name":"特例有限会社","qs":[{"l":1,"m":"意義","sb":"","i":"C","r":"","q":"特例有限会社とは，旧有限会社であって，会社法施行後もその商号中に有限会社という文字を用いることで，会社法の規定より存続する有限会社をいう。","a":false,"c":"整備法3条2項。","e":"特例有限会社とは，旧有限会社であって，会社法施行後もその商号中に有限会社という文字を用いることで，会社法の規定より存続する株式会社をいう。"},{"l":2,"m":"意義","sb":"","i":"C","r":"(平21問題3ウ)","q":"特例有限会社は，社債を発行することができる。","a":true,"c":"整備法2条1項,会社法676条。","e":"特例有限会社は株式会社として存続しており，社債を発行できる。"},{"l":1,"m":"特例有限会社における特則","sb":"","i":"C","r":"(平21問題3ア)","q":"特例有限会社は，その商号中に有限会社という文字を用いなければならない。","a":true,"c":"整備法3条1項。","e":""},{"l":2,"m":"特例有限会社における特則","sb":"","i":"C","r":"","q":"特例有限会社の定款には，その発行する全部の株式の内容として当該株式を譲渡により取得することについて当該特例有限会社の承認を要する旨の定めがあるものとみなす。","a":true,"c":"整備法9条1項。","e":"特例有限会社の定款には，その発行する全部の株式の内容として当該株式を譲渡により取得することについて当該特例有限会社の承認を要する旨，および，当該特例有限会社の株主が当該株式を譲渡により取得する場合においては当該特例有限会社が譲渡等の承認をしたものとみなす旨の定めがあるものとみなす。特例有限会社は，閉鎖的な会社であるという前提の下，定款には，その発行する全部の株式の内容として当該株式を譲渡により取得することについて当該特例有限会社の承認を要する旨の定めがあるものとみなされる。したがって，当然に非公開会社に該当する。また，旧有限会社法の規定を引き継いで，会社の閉鎖性を維持しながらも，株主の投下資本回収の要請に応えるために，株主間の譲渡については自由とされている。"},{"l":3,"m":"特例有限会社における特則","sb":"","i":"C","r":"","q":"特例有限会社は，その発行する一部の株式の内容として当該株式を譲渡により取得することについて当該特例有限会社の承認を要しない旨の定めを設ける定款の変更をすることができる。","a":false,"c":"整備法9条2項。","e":"特例有限会社は，その発行する全部または一部の株式の内容として，その発行する全部の株式の内容として当該株式を譲渡により取得することについて当該特例有限会社の承認を要する旨，および，当該特例有限会社の株主が当該株式を譲渡により取得する場合においては当該特例有限会社が譲渡等の承認をしたものとみなす旨と異なる内容の定めを設ける定款の変更をすることができない。"},{"l":4,"m":"特例有限会社における特則","sb":"","i":"C","r":"","q":"特例有限会社の総株主の議決権の100分の３以上を有する株主は，定款に別段の定めがある場合を除き，取締役に対し，株主総会の目的である事項および招集の理由を示して，株主総会の招集を請求することができる。","a":false,"c":"整備法14条1項。","e":"特例有限会社の総株主の議決権の 10 分の１以上を有する株主は，取締役に対し，株主総会の目的である事項および招集の理由を示して，株主総会の招集を請求することができる。ただし，定款に別段の定めがある場合は，この限りでない。このように，特例有限会社の株主による株主総会招集請求権についての要件は，通常の株式会社の株主による株主総会招集請求権の場合よりも（総株主の議決権の100分の３以上）厳しくなっている。"},{"l":5,"m":"特例有限会社における特則","sb":"","i":"C","r":"","q":"特例有限会社の株主総会の特別決議については，当該株主総会において議決権を行使することができる株主の議決権の過半数（３分の１以上の割合を定款で定めた場合にあっては，その割合以上）を有する株主が出席し，出席した当該株主の議決権の３分の２（これを上回る割合を定款で定めた場合にあっては，その割合）以上に当たる多数をもって行わなければならない。","a":false,"c":"整備法14条3項。","e":"特例有限会社の株主総会の特別決議については，総株主の半数以上（定款で加重可，頭数要件）であって，当該株主の議決権の４分の３（定款で加重可）以上に当たる多数をもって行わなければならない。すなわち，通常の株式会社における309条４項の特殊決議と同様の決議要件が定められている。"},{"l":6,"m":"特例有限会社における特則","sb":"","i":"C","r":"(平21問題3イ)","q":"特例有限会社は，定款の定めによって，会計監査人を置く旨を定めることができる。","a":false,"c":"整備法17条1項。","e":"特例有限会社においても，通常の株式会社と同様に，株主総会と取締役を必ず置かなければならないが（会社法295条，326 条１項），その他の機関については，監査役のみ定款によって任意に設置することができるものとされている。すなわち，取締役会，会計参与，監査役会，会計監査人，監査等委員会または指名委員会等を置くことはできない。"},{"l":7,"m":"特例有限会社における特則","sb":"","i":"C","r":"","q":"特例有限会社における取締役の任期は，選任後 10 年以内に終了する事業年度のうち最終のものに関する定時株主総会の終結の時までとするが，定款または株主総会の決議によって，その任期を伸長することができる。","a":false,"c":"整備法18条。","e":"特例有限会社については，取締役および監査役の任期に制限はない。これにより株主総会での再任や再任の登記手続をする必要がなくなるため，再任の事務負担等のコストが不要となるのである。"},{"l":8,"m":"特例有限会社における特則","sb":"","i":"C","r":"","q":"監査役を置く旨の定款の定めのある特例有限会社の定款には，監査役の監査の範囲を会計に関するものに限定する旨の定めがあるものとみなす。","a":true,"c":"整備法24条。","e":"すなわち，特例有限会社は，監査役を置く旨の定款の定めがある場合であっても，監査役設置会社（会社法２条９号）には該当しない。"},{"l":9,"m":"特例有限会社における特則","sb":"","i":"C","r":"(平21問題3エ)","q":"特例有限会社は，法務省令で定めるところにより，定時株主総会の終結後遅滞なく，貸借対照表を公告しなければならない。","a":false,"c":"整備法28条。","e":"特例有限会社には，計算書類の公告義務（会社法440条）は課せられていない。また，計算書類の支店における備置義務（会社法442条２項）もないので，計算書類等の備置は本店のみでよい（会社法442条１項）。"},{"l":1,"m":"合併等の制限","sb":"","i":"C","r":"","q":"特例有限会社は，吸収合併存続会社となることができない。","a":true,"c":"整備法37条。","e":"特例有限会社は，吸収合併存続会社または吸収分割承継会社となることができない。また，株式交換における完全親会社または完全子会社，株式移転完全子会社となることができない（整備法38条）。なぜなら，特例有限会社は，有限会社の商号を用いることによって特例として存続する株式会社であるので，新たに設立することや，事業を大きく発展させるような吸収合併存続会社等となることを認めることができないからである。"},{"l":1,"m":"商号変更による通常の株式会社への移行","sb":"","i":"C","r":"","q":"特例有限会社は，定款を変更してその商号中に株式会社という文字を用いる商号の変更をすることができる。","a":true,"c":"整備法45条1項。","e":"特例有限会社がその商号中に株式会社という文字を用いる定款の変更をする株主総会の決議をしたときは，特例有限会社の解散登記，定款変更後の株式会社についての設立登記（整備法46条）をすることにより，特例有限会社ではない通常の株式会社となる。"}]}]</script>
<script>
const CHAPTERS = JSON.parse(document.getElementById('quiz-data').textContent);

let ALL_Q=[], BY_CHAPTER={}, MAJORS_BY_CHAPTER={};
let customQs=[]; // user-added questions, persisted separately

function rebuildIndexes(){
  ALL_Q=[];
  CHAPTERS.forEach((ch,ci)=>{
    ch.qs.forEach((q,qi)=>{
      ALL_Q.push({
        id: ci+'_'+qi, chNum: ch.n, chName: ch.name,
        major: q.m||'', sub: q.sb||'', importance: q.i||'',
        label: q.l, refs: q.r||'', statement: q.q, answer: q.a,
        citation: q.c||'', explanation: q.e||'', custom:false
      });
    });
  });
  customQs.forEach(q=>{
    const ch = CHAPTERS.find(c=>c.n===q.chNum);
    ALL_Q.push({
      id: q.id, chNum: q.chNum, chName: ch?ch.name:'追加した問題',
      major: q.major||'', sub:'', importance: q.importance||'',
      label:'', refs:'', statement:q.statement, answer:q.answer,
      citation:q.citation||'', explanation:q.explanation||'', custom:true
    });
  });
  BY_CHAPTER={};
  CHAPTERS.forEach(ch=>{ BY_CHAPTER[ch.n]=ALL_Q.filter(q=>q.chNum===ch.n); });
  MAJORS_BY_CHAPTER={};
  CHAPTERS.forEach(ch=>{
    const order=[],counts={};
    BY_CHAPTER[ch.n].forEach(q=>{ const k=q.major||''; if(!(k in counts)){counts[k]=0;order.push(k);} counts[k]++; });
    MAJORS_BY_CHAPTER[ch.n]=order.map(name=>({name,count:counts[name]}));
  });
}
function majorKey(chNum,major){ return chNum+'::'+major; }

/* ---------- persisted state ---------- */
let status={};   // id -> 0|1|2  (0=未,1=あいまい,2=覚えた)
let notes={};    // id -> memo text
let noteSaveTimer=null;
let localUpdatedAt=0;

const SUBJECT_KEY='kigyoho';
const LS_STATUS_KEY='kigyoho_status_v1';
const LS_NOTES_KEY='kigyoho_notes_v1';
const LS_CUSTOM_KEY='kigyoho_custom_v1';
const LS_UPDATED_KEY='kigyoho_updated_v1';
const SYNC_URL_KEY='qsync_dburl_v1';
const SYNC_CODE_KEY='qsync_code_v1';

function storageAvailable(){
  try{
    const k='__t__'; localStorage.setItem(k,'1'); localStorage.removeItem(k);
    return true;
  }catch(e){ return false; }
}
const HAS_LS = storageAvailable();

async function loadStorage(){
  if(HAS_LS){
    try{
      const s=localStorage.getItem(LS_STATUS_KEY);
      if(s) status=JSON.parse(s);
    }catch(e){ status={}; }
    try{
      const n=localStorage.getItem(LS_NOTES_KEY);
      if(n) notes=JSON.parse(n);
    }catch(e){ notes={}; }
    try{
      const c=localStorage.getItem(LS_CUSTOM_KEY);
      if(c) customQs=JSON.parse(c);
    }catch(e){ customQs=[]; }
    try{
      const u=localStorage.getItem(LS_UPDATED_KEY);
      localUpdatedAt = u? (parseInt(u,10)||0) : 0;
    }catch(e){ localUpdatedAt=0; }
  }
  rebuildIndexes();
}
async function saveStatus(){
  if(!HAS_LS) return;
  try{ localStorage.setItem(LS_STATUS_KEY,JSON.stringify(status)); }catch(e){}
  touchUpdated();
}
function saveCustomQs(){
  if(!HAS_LS) return;
  try{ localStorage.setItem(LS_CUSTOM_KEY,JSON.stringify(customQs)); }catch(e){}
  touchUpdated();
}
function scheduleSaveNote(id,text){
  notes[id]=text;
  if(noteSaveTimer) clearTimeout(noteSaveTimer);
  noteSaveTimer=setTimeout(()=>{
    if(HAS_LS){ try{ localStorage.setItem(LS_NOTES_KEY,JSON.stringify(notes)); }catch(e){} }
    touchUpdated();
    const el=document.getElementById('memo-saved-indicator');
    if(el){ el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),1200); }
  },500);
}

/* ---------- CLOUD SYNC (optional, Firebase Realtime Database via REST) ---------- */
function touchUpdated(){
  localUpdatedAt = Date.now();
  if(HAS_LS){ try{ localStorage.setItem(LS_UPDATED_KEY, String(localUpdatedAt)); }catch(e){} }
  scheduleCloudPush();
}
function getSyncConfig(){
  if(!HAS_LS) return null;
  const url=(localStorage.getItem(SYNC_URL_KEY)||'').trim();
  const code=(localStorage.getItem(SYNC_CODE_KEY)||'').trim();
  if(!url||!code) return null;
  return {url,code};
}
function cloudPath(cfg){
  return cfg.url.replace(/\/+$/,'') + '/quizSync/' + encodeURIComponent(cfg.code) + '/' + SUBJECT_KEY + '.json';
}
let cloudPushTimer=null;
function scheduleCloudPush(){
  const cfg=getSyncConfig(); if(!cfg) return;
  if(cloudPushTimer) clearTimeout(cloudPushTimer);
  cloudPushTimer=setTimeout(()=>{ pushToCloud(cfg); },1500);
}
async function pushToCloud(cfg){
  cfg = cfg||getSyncConfig(); if(!cfg) return false;
  try{
    await fetch(cloudPath(cfg), {
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({status,notes,customQs,updatedAt:localUpdatedAt})
    });
    return true;
  }catch(e){ return false; }
}
async function pullFromCloud(showToast){
  const cfg=getSyncConfig(); if(!cfg) return false;
  try{
    const res=await fetch(cloudPath(cfg));
    if(!res.ok) return false;
    const data=await res.json();
    if(!data || !data.updatedAt || data.updatedAt<=localUpdatedAt) return false;
    status=data.status||{};
    notes=data.notes||{};
    customQs=data.customQs||[];
    localUpdatedAt=data.updatedAt||0;
    if(HAS_LS){
      try{
        localStorage.setItem(LS_STATUS_KEY,JSON.stringify(status));
        localStorage.setItem(LS_NOTES_KEY,JSON.stringify(notes));
        localStorage.setItem(LS_CUSTOM_KEY,JSON.stringify(customQs));
        localStorage.setItem(LS_UPDATED_KEY,String(localUpdatedAt));
      }catch(e){}
    }
    rebuildIndexes();
    meter();
    if(S.view!=='quiz') render();
    if(showToast) toast('他の端末の学習記録を読み込みました');
    return true;
  }catch(e){ return false; }
}
function randomSyncCode(){
  const chars='abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  let s=''; for(let i=0;i<20;i++) s+=chars[Math.floor(Math.random()*chars.length)];
  return s;
}
function syncSettingsHTML(){
  if(!HAS_LS) return '<div class="mini">このブラウザでは同期機能を使えません。</div>';
  const url=(localStorage.getItem(SYNC_URL_KEY)||'').trim();
  const code=(localStorage.getItem(SYNC_CODE_KEY)||'').trim();
  if(!url){
    return `<div class="flabel">データベースURL（Firebaseコンソールで確認）</div>
      <input id="cloudUrlInput" placeholder="https://xxxx-default-rtdb.firebaseio.com">
      <div class="act"><button id="cloudUrlSave" class="btn-main">保存</button></div>`;
  }
  if(!code){
    return `<div class="mini">データベースURL：<code style="font-size:11px">${esc(url)}</code> <button id="cloudUrlEdit" style="font-size:11px;text-decoration:underline;color:var(--blue)">変更</button></div>
      <div class="act" style="margin-top:10px"><button id="cloudGenBtn" class="btn-main">この端末を1台目にして同期コードを発行</button></div>
      <div class="flabel" style="margin-top:16px">他の端末で発行したコードをお持ちの場合</div>
      <input id="cloudCodeInput" placeholder="同期コードを貼り付け">
      <div class="act"><button id="cloudJoinBtn">このコードで同期を開始</button></div>`;
  }
  const lastSync = localUpdatedAt? new Date(localUpdatedAt).toLocaleString('ja-JP') : '未同期';
  return `<div class="mini">データベースURL：<code style="font-size:11px">${esc(url)}</code></div>
    <div class="flabel">同期コード（他の端末にも入力してください）</div>
    <input id="cloudCodeShow" readonly value="${esc(code)}" style="font-family:monospace;font-size:15px;letter-spacing:.05em">
    <div class="act">
      <button id="cloudCopyCode">コピー</button>
      <button id="cloudNowBtn">🔄 今すぐ同期</button>
    </div>
    <div class="mini" style="margin-top:8px">最終同期：${lastSync}</div>
    <div class="act" style="margin-top:12px"><button id="cloudUnlink" style="color:var(--red);border-color:var(--red)">この端末の同期を解除</button></div>`;
}
function bindSyncSettings(){
  const us=$('#cloudUrlSave');
  if(us) us.onclick=()=>{
    const v=$('#cloudUrlInput').value.trim();
    if(!v){ toast('URLを入力してください'); return; }
    try{ localStorage.setItem(SYNC_URL_KEY,v); }catch(e){}
    renderSyncSettings();
  };
  const ue=$('#cloudUrlEdit');
  if(ue) ue.onclick=()=>{
    if(confirm('データベースURLを変更しますか？（同期コードも解除されます）')){
      try{ localStorage.removeItem(SYNC_URL_KEY); localStorage.removeItem(SYNC_CODE_KEY); }catch(e){}
      renderSyncSettings();
    }
  };
  const gen=$('#cloudGenBtn');
  if(gen) gen.onclick=async()=>{
    const code=randomSyncCode();
    try{ localStorage.setItem(SYNC_CODE_KEY,code); }catch(e){}
    touchUpdated();
    await pushToCloud();
    toast('同期コードを発行しました');
    renderSyncSettings();
  };
  const jo=$('#cloudJoinBtn');
  if(jo) jo.onclick=async()=>{
    const v=$('#cloudCodeInput').value.trim();
    if(!v){ toast('コードを入力してください'); return; }
    try{ localStorage.setItem(SYNC_CODE_KEY,v); }catch(e){}
    const got=await pullFromCloud(true);
    if(!got) toast('コードを保存しました（クラウドにまだデータがありません）');
    renderSyncSettings();
  };
  const cc=$('#cloudCopyCode');
  if(cc) cc.onclick=async()=>{
    const el=$('#cloudCodeShow'); el.select();
    try{ await navigator.clipboard.writeText(el.value); toast('コピーしました'); }
    catch(e){ document.execCommand('copy'); toast('コピーしました'); }
  };
  const nb=$('#cloudNowBtn');
  if(nb) nb.onclick=async()=>{
    await pushToCloud();
    await pullFromCloud(true);
    renderSyncSettings();
    toast('同期しました');
  };
  const ul=$('#cloudUnlink');
  if(ul) ul.onclick=()=>{
    if(confirm('この端末の同期を解除しますか？（データは削除されません）')){
      try{ localStorage.removeItem(SYNC_CODE_KEY); }catch(e){}
      renderSyncSettings();
    }
  };
}
function renderSyncSettings(){
  const el=$('#cloudSyncBox'); if(!el) return;
  el.innerHTML=syncSettingsHTML();
  bindSyncSettings();
}
function setStatus(id,val){ status[id]=val; saveStatus(); }
function cycleStatus(id){
  const cur=status[id]||0;
  const next=(cur+1)%3;
  setStatus(id,next);
  return next;
}

/* ---------- app state ---------- */
const S={
  view:'list',
  search:'',
  statusFilter:'all',
  selectedChapters:new Set(CHAPTERS.map(c=>c.n)),
  selectedImportance:new Set(['A','B','C']),
  excludedMajors:new Set(),
  expandedChapters:new Set(),
  sheet:false,
  shuffle:true,
  quizCount:'all',
  quiz:null
};
try{ const t=localStorage; }catch(e){}

const $=s=>document.querySelector(s);
const app=$('#app');
function esc(s){ if(!s) return ''; return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1500); }
function shuffled(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; }

function counts(list){ const c=[0,0,0]; list.forEach(q=>c[status[q.id]||0]++); return c; }
function markClass(s){ return s===2?'ok':(s===1?'warn':''); }
function meter(){
  const c=counts(ALL_Q), t=ALL_Q.length||1;
  $('#meter').innerHTML=`<i class="m3" style="width:${c[2]/t*100}%"></i><i class="m2" style="width:${c[1]/t*100}%"></i>`;
}

function listFiltered(){
  const q=S.search.trim().toLowerCase();
  return ALL_Q.filter(w=>{
    if(!S.selectedChapters.has(w.chNum)) return false;
    if(w.importance && !S.selectedImportance.has(w.importance)) return false;
    if(S.excludedMajors.has(majorKey(w.chNum,w.major))) return false;
    const st=status[w.id]||0;
    if(S.statusFilter!=='all' && String(st)!==S.statusFilter) return false;
    if(q && !((w.statement||'').toLowerCase().includes(q) || (w.explanation||'').toLowerCase().includes(q) || (w.citation||'').toLowerCase().includes(q))) return false;
    return true;
  });
}

/* ---------- shared filter bar (list + quiz-intro) ---------- */
function controls(){
  return `<div class="filters">
    <div class="row">
      <label class="search">🔍<input id="q" type="search" placeholder="条文・キーワードで検索" value="${esc(S.search)}"></label>
      <select id="statusSel">
        <option value="all">状態：すべて</option>
        <option value="0">未学習</option>
        <option value="1">ダメ</option>
        <option value="2">覚えた</option>
      </select>
    </div>
    <div class="chsel-head">
      <span class="lbl">重要度（${S.selectedImportance.size} / 3 選択中）</span>
    </div>
    <div class="imp-row" id="impRow">
      ${['A','B','C'].map(k=>{
        const checked=S.selectedImportance.has(k);
        const cnt=ALL_Q.filter(q=>S.selectedChapters.has(q.chNum) && q.importance===k).length;
        return `<div class="imp-box ${checked?'checked':''}" data-imp="${k}">
          <div class="check">${checked?'✓':''}</div>
          <div class="ilabel">重要度${k}</div>
          <div class="icnt">${cnt}問</div>
        </div>`;
      }).join('')}
    </div>
    <div class="chsel-head">
      <span class="lbl">章を選択（${S.selectedChapters.size} / ${CHAPTERS.length}章 選択中）</span>
      <span class="links"><button id="selAllCh">全選択</button><button id="selNoneCh">全解除</button></span>
    </div>
    <div class="chapter-list" id="chapterList">
      ${CHAPTERS.map(c=>{
        const checked=S.selectedChapters.has(c.n);
        const majors=MAJORS_BY_CHAPTER[c.n].filter(m=>m.name!=='');
        const canExpand = checked && majors.length>0;
        const expanded = S.expandedChapters.has(c.n);
        const majorBlock = (canExpand && expanded) ? `<div class="major-list">
          ${majors.map(m=>{
            const key=majorKey(c.n,m.name);
            const on=!S.excludedMajors.has(key);
            return `<div class="major-chip ${on?'on':''}" data-majorkey="${key}">${on?'✓ ':''}${esc(m.name)} <span class="mcnt">${m.count}</span></div>`;
          }).join('')}
        </div>` : '';
        return `<div>
          <div class="chapter-row ${checked?'checked':''}" data-ch="${c.n}">
            <div class="check">${checked?'✓':''}</div>
            <div class="cname">第${c.n}章　${esc(c.name)}</div>
            <div class="ccnt">${(BY_CHAPTER[c.n]||c.qs).length}問</div>
            ${canExpand?`<div class="caret" data-caret="${c.n}">${expanded?'節 ▾':'節 ▸'}</div>`:''}
          </div>
          ${majorBlock}
        </div>`;
      }).join('')}
    </div>
  </div>`;
}
function bindControls(){
  const q=$('#q'); if(q) q.oninput=e=>{ S.search=e.target.value; if(S.view==='list') renderListBody(); };
  const st=$('#statusSel'); if(st){ st.value=S.statusFilter; st.onchange=e=>{ S.statusFilter=e.target.value; render(); }; }
  document.querySelectorAll('#chapterList .chapter-row').forEach(b=>b.onclick=(e)=>{
    if(e.target.closest('[data-caret]')) return;
    const n=parseInt(b.dataset.ch);
    if(S.selectedChapters.has(n)) S.selectedChapters.delete(n); else S.selectedChapters.add(n);
    render();
  });
  document.querySelectorAll('[data-caret]').forEach(el=>el.addEventListener('click',(ev)=>{
    ev.stopPropagation();
    const n=parseInt(el.dataset.caret);
    if(S.expandedChapters.has(n)) S.expandedChapters.delete(n); else S.expandedChapters.add(n);
    render();
  }));
  document.querySelectorAll('#impRow .imp-box').forEach(b=>b.onclick=()=>{
    const k=b.dataset.imp;
    if(S.selectedImportance.has(k)){ if(S.selectedImportance.size>1) S.selectedImportance.delete(k); }
    else S.selectedImportance.add(k);
    render();
  });
  document.querySelectorAll('.major-chip').forEach(el=>el.addEventListener('click',(ev)=>{
    ev.stopPropagation();
    const key=el.dataset.majorkey;
    if(S.excludedMajors.has(key)) S.excludedMajors.delete(key); else S.excludedMajors.add(key);
    render();
  }));
  const sa=$('#selAllCh'); if(sa) sa.onclick=()=>{ S.selectedChapters=new Set(CHAPTERS.map(c=>c.n)); render(); };
  const sn=$('#selNoneCh'); if(sn) sn.onclick=()=>{ S.selectedChapters=new Set(); render(); };
}

/* ---------- LIST VIEW ---------- */
function statusLabel(s){ return ['未','ダメ','覚えた'][s]||'未'; }
function itemHTML(w){
  const s=status[w.id]||0;
  const hasMemo = notes[w.id] && notes[w.id].trim();
  let noteText = (w.citation? w.citation+'　':'') + (w.explanation||'');
  if(hasMemo) noteText += '\n📝 '+notes[w.id];
  return `<li class="item" data-id="${w.id}">
    <div class="tools">
      <div class="no">${String(w.label!==undefined?w.label:'')}</div>
      <button class="mark ${markClass(s)}" data-cycle="${w.id}">${statusLabel(s)}</button>
      ${w.custom?`<button class="mark edit-btn" data-edit="${w.id}">✎編集</button>`:''}
    </div>
    <div>
      <div class="en">${w.custom?'<span class="badge-custom">自作</span>':''}${esc(w.statement)}</div>
      <div class="ja">正解：${w.answer?'○（正しい）':'✕（誤り）'}</div>
      <div class="note">${esc(noteText)}</div>
    </div>
    <div class="tools"></div>
  </li>`;
}
function listBodyHTML(){
  const list=listFiltered();
  if(!list.length) return `<div class="empty">条件に合う問題がありません。<br>絞り込みや検索語を見直してください。</div>`;
  let out='', cur='';
  list.forEach(w=>{
    const key=w.chNum+'|'+w.major;
    if(key!==cur){
      if(cur) out+='</ol>';
      cur=key;
      const n=list.filter(x=>(x.chNum+'|'+x.major)===key).length;
      const label = w.major? `第${w.chNum}章 ${w.chName}／${w.major}` : `第${w.chNum}章 ${w.chName}`;
      out+=`<div class="sec"><h2>${esc(label)}</h2><span></span><b>${n}問</b></div><ol class="list">`;
    }
    out+=itemHTML(w);
  });
  return out+'</ol>';
}
function renderListBody(){
  const c=$('#listBody'); if(!c) return;
  c.innerHTML=listBodyHTML();
  bindListBody();
  $('#cnt').textContent=`${listFiltered().length} 問を表示中`;
}
function bindListBody(){
  document.querySelectorAll('#listBody .item').forEach(li=>{
    li.addEventListener('click',e=>{
      const id=li.dataset.id;
      const ed=e.target.closest('[data-edit]');
      if(ed){ e.stopPropagation(); openAddForm(ed.dataset.edit); return; }
      const cy=e.target.closest('[data-cycle]');
      if(cy){ e.stopPropagation(); const v=cycleStatus(id); meter();
        cy.className='mark '+markClass(v); cy.textContent=statusLabel(v); return; }
      if(S.sheet) li.classList.toggle('revealed');
    });
  });
}
function viewList(){
  app.innerHTML=controls()+`<div class="count" id="cnt"></div><div id="listBody"></div>`;
  bindControls(); renderListBody();
}

/* ---------- ADD / EDIT CUSTOM QUESTION ---------- */
let addAnswerVal=null, editingId=null;
function addFormHTML(edit){
  const chOptions = CHAPTERS.map(c=>`<option value="${c.n}" ${edit&&edit.chNum===c.n?'selected':''}>第${c.n}章 ${esc(c.name)}</option>`).join('');
  const impOptions = ['','A','B','C'].map(k=>`<option value="${k}" ${edit&&(edit.importance||'')===k?'selected':''}>${k?('重要度'+k):'（指定なし）'}</option>`).join('');
  return `<div class="add-modal">
    <div class="add-head">
      <div class="add-title">${edit?'問題を編集':'問題を追加'}</div>
      <button id="addClose" class="iconbtn" title="閉じる">✕</button>
    </div>
    <div class="add-body">
      <div class="flabel">章</div>
      <select id="fChapter">${chOptions}</select>
      <div class="flabel">見出し（節・任意）</div>
      <input id="fMajor" type="text" value="${edit?esc(edit.major):''}" placeholder="例：総論">
      <div class="flabel">重要度（任意）</div>
      <select id="fImportance">${impOptions}</select>
      <div class="flabel">問題文</div>
      <textarea id="fStatement" rows="4" placeholder="設問の文章を入力してください">${edit?esc(edit.statement):''}</textarea>
      <div class="flabel">正誤</div>
      <div class="oxbtns small">
        <button type="button" class="oxbtn maru" data-v="true">○</button>
        <button type="button" class="oxbtn batsu" data-v="false">✕</button>
      </div>
      <div class="flabel">出典（任意）</div>
      <input id="fCitation" type="text" value="${edit?esc(edit.citation):''}" placeholder="例：条文番号など">
      <div class="flabel">解説（任意）</div>
      <textarea id="fExplanation" rows="4" placeholder="解説を入力してください">${edit?esc(edit.explanation):''}</textarea>
    </div>
    <div class="add-foot">
      ${edit?'<button id="fDelete" class="danger">削除</button>':'<span></span>'}
      <button id="fSave" class="btn-main">保存</button>
    </div>
  </div>`;
}
function openAddForm(id){
  editingId = id || null;
  const edit = id ? customQs.find(q=>q.id===id) : null;
  addAnswerVal = edit ? edit.answer : null;
  const ov=$('#addOverlay');
  ov.innerHTML = addFormHTML(edit);
  ov.style.display='flex';
  document.querySelectorAll('#addOverlay .oxbtn').forEach(b=>{
    if((b.dataset.v==='true')===addAnswerVal) b.classList.add('sel');
    b.onclick=()=>{
      addAnswerVal = b.dataset.v==='true';
      document.querySelectorAll('#addOverlay .oxbtn').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel');
    };
  });
  $('#addClose').onclick=closeAddForm;
  $('#fSave').onclick=saveAddForm;
  const del=$('#fDelete');
  if(del) del.onclick=()=>{
    if(confirm('この問題を削除しますか？')){
      customQs=customQs.filter(q=>q.id!==editingId);
      saveCustomQs(); rebuildIndexes(); closeAddForm(); render();
      toast('削除しました');
    }
  };
}
function closeAddForm(){
  const ov=$('#addOverlay');
  ov.style.display='none'; ov.innerHTML='';
}
function saveAddForm(){
  const chNum=parseInt($('#fChapter').value);
  const major=$('#fMajor').value.trim();
  const importance=$('#fImportance').value;
  const statement=$('#fStatement').value.trim();
  const citation=$('#fCitation').value.trim();
  const explanation=$('#fExplanation').value.trim();
  if(!statement){ toast('問題文を入力してください'); return; }
  if(addAnswerVal===null){ toast('正誤を選んでください'); return; }
  if(editingId){
    const q=customQs.find(x=>x.id===editingId);
    Object.assign(q,{chNum,major,importance,statement,answer:addAnswerVal,citation,explanation});
  }else{
