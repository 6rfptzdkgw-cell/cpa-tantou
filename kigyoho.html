て適正な対価が交付されることを確保するため，反対株主に株式買取請求権を与えたのである。"},{"l":1,"m":"株式の消却・併合・分割・無償割当て・1株に満たない端数の処理・単元株制度","sb":"株式の分割","i":"A","r":"(平29I問題5イ類・平22I問題4ウ類)","q":"取締役会設置会社において，株式の分割をしようとするときは，その都度，取締役会の決議によって，分割の割合等を決定しなければならない。","a":true,"c":"183条2項。","e":"株式の分割は株式の併合と異なり，株式の単位が小さくなるため株式の処分がしやすくなる。また，株式の分割によって端数が生じても，株式の併合のように従来株主であった者の株主の地位が失われるということはない。したがって，基本的には株主に不利益はないため，株主総会の特別決議は要求されていないのである。"},{"l":2,"m":"株式の消却・併合・分割・無償割当て・1株に満たない端数の処理・単元株制度","sb":"株式の分割","i":"A","r":"(平25I問題5イ類)","q":"取締役会設置会社でない株式会社において，株式の分割をしようとするときは，株主総会の特別決議によって，分割の割合等を決定しなければならない。","a":false,"c":"183条2項。","e":"取締役会設置会社でない株式会社において，株式の分割をしようとするときは，株主総会の普通決議によって，分割の割合等を決定しなければならない。株式の併合と異なり株主総会の特別決議が要求されない理由については，問題１の解説を参照すること。"},{"l":3,"m":"株式の消却・併合・分割・無償割当て・1株に満たない端数の処理・単元株制度","sb":"株式の分割","i":"A","r":"(令5II問題5イ類・平22I問題4ア)","q":"株主は，株式の分割により，分割する株式と異なる種類の株式を取得することはできない。","a":true,"c":"","e":"株式分割は株式の細分化であるので，株主が，株式分割によって分割する株式と異なる種類の株式を取得することはない。"},{"l":4,"m":"株式の消却・併合・分割・無償割当て・1株に満たない端数の処理・単元株制度","sb":"株式の分割","i":"A","r":"(平31I問題6イ)","q":"自己株式は，株式の分割の対象となる。","a":true,"c":"","e":"自己株式の価値を維持することができなくなってしまうため，株式の分割の効果は自己株式にまで及ぶ。"},{"l":5,"m":"株式の消却・併合・分割・無償割当て・1株に満たない端数の処理・単元株制度","sb":"株式の分割","i":"B","r":"","q":"株式の分割によって発行済株式の数が増加しても，資本金の額は増加しない。","a":true,"c":"","e":"株式の分割によって，発行済株式総数は増加するが，会社財産に変動がないため，１株あたりの純資産額は減少するが，資本金の額に変動はない。"},{"l":6,"m":"株式の消却・併合・分割・無償割当て・1株に満たない端数の処理・単元株制度","sb":"株式の分割","i":"B","r":"","q":"株式会社は，株式の分割に係る基準日を決定し，当該基準日の２週間前までに当該基準日および株式の分割に係る事項を公告しなければならない。","a":true,"c":"183条2項1号,124条3項。","e":"株式の分割においては，基準日の設定が義務づけられている。基準日において株主名簿に記載・記録されている株主は，効力発生日に基準日に有する株式の数に株式分割割合を乗じて得た数の株式を取得する（184条１項）。"},{"l":7,"m":"株式の消却・併合・分割・無償割当て・1株に満たない端数の処理・単元株制度","sb":"株式の分割","i":"A","r":"(平22I問題4イ・平21問題6ア類)","q":"種類株式発行会社が株式の分割をする場合，分割する株式の種類ごとに分割の割合を定めなければならない。","a":true,"c":"183条2項3号。","e":"なお，現に複数の種類の株式を発行している種類株式発行会社であっても，その一部の種類の株式のみ分割することができる。"},{"l":8,"m":"株式の消却・併合・分割・無償割当て・1株に満たない端数の処理・単元株制度","sb":"株式の分割","i":"B","r":"","q":"株券発行会社が株式の分割をする場合，株式の分割に係る株券を効力発生日までに提出しなければならない旨を効力発生日の１か月前までに公告し，かつ，当該株式の株主およびその登録株式質権者に対し通知しなければならない。","a":false,"c":"","e":"株式の分割の場合には，株券を追加的に発行するだけでよいため，株式の併合の場合（219 条１項本文２号）のような株券提出手続は設けられていない。なお，株券発行会社は，株式分割の効力発生後遅滞なく，株券を発行しなければならないとされている（215条３項）。"},{"l":9,"m":"株式の消却・併合・分割・無償割当て・1株に満たない端数の処理・単元株制度","sb":"株式の分割","i":"B","r":"(平23II問題7ウ)","q":"種類株式発行会社でない株式会社が株式の分割をする場合，当該株式の分割に係る基準日において株主名簿に記載され，または記録されている株主は，当該株式の分割がその効力を生ずる日に，基準日に有する株式の数に分割の割合を乗じて得た数の株式を取得する。","a":true,"c":"184条1項。","e":""},{"l":10,"m":"株式の消却・併合・分割・無償割当て・1株に満たない端数の処理・単元株制度","sb":"株式の分割","i":"A","r":"(令3問題4エ類・平22I問題4エ類)","q":"株式の分割によって発行済株式総数が発行可能株式総数を超えることになる場合には，発行可能株式総数を増加させる定款の変更があったものとみなされる。","a":false,"c":"184条2項。","e":"株式会社（現に２以上の種類株式を発行している株式会社を除く）は，株主総会の特別決議によることなく，株式の分割の効力発生日における発行可能株式総数を，その日の前日の発行可能株式総数に株式の分割割合を乗じて得た数の範囲内で増加する定款の変更をすることができる。株主総会の決議によらない発行可能株式総数に関する定款の変更が認められているのは，発行可能株式総数の変更について株主総会の決議が必要であるとすると，取締役会設置会社において株式の分割自体を取締役会の決議で行うことができることとした趣旨が活かされないためである。ただし，現に２以上の種類株式を発行している会社については，発行可能株式総数の変更は既存株主に損害を及ぼす可能性があるため（322条１項１号ハ参照），株主総会で株主の意思を確認する必要があると考えられることから，当該手続による定款変更は認められない。"},{"l":11,"m":"株式の消却・併合・分割・無償割当て・1株に満たない端数の処理・単元株制度","sb":"株式の分割","i":"C","r":"(平26II問題4ウ)","q":"振替株式の発行者は，その振替株式について株式の分割をしようとする場合には，当該分割がその効力を生ずる日の２週間前までに，当該分割に係る振替株式の株主または登録株式質権者に対し，当該分割に関する法定の事項を通知しなければならない。","a":false,"c":"振替法137条1項。","e":"特定の銘柄の振替株式について，株式の分割をしようとする場合には，当該振替株式の発行者は，株式の分割がその効力を生ずる日の２週間前までに，振替機関に対し，当該分割に関する法定の事項を通知しなければならない。"},{"l":1,"m":"株式の消却・併合・分割・無償割当て・1株に満たない端数の処理・単元株制度","sb":"株式無償割当て","i":"A","r":"(令5II問題5イ類・平28I問題5イ・平21問題6ウ類)","q":"種類株式発行会社である株式会社が行う株式無償割当てにおいて，ある種類の株式を有する株主に割り当てることができるのは，当該種類の株式に限られる。","a":false,"c":"186条1項1号3号。","e":"種類株式発行会社が株式無償割当てをする場合，ある種類の種類株主に対して，他の種類株式を割り当てることが認められる。これに対して，株式の分割の場合は，同一種類の株式が増加するのみである。また，株主割当ての方法による募集株式の発行等の場合は，種類株主の有する種類の株式と同一のものしか割り当てることができない（202条１項１号かっこ書）。"},{"l":2,"m":"株式の消却・併合・分割・無償割当て・1株に満たない端数の処理・単元株制度","sb":"株式無償割当て","i":"A","r":"(令5II問題5ウ類・平31I問題6ウ類・平21問題6イ)","q":"株式会社が株式無償割当てをしようとするときは，当該株式会社が有する自己株式についても株式を割り当てなければならない。","a":false,"c":"186条2項。","e":"株式無償割当ての場合，自己株式に株式が割り当てられることはない。これに対して，株式の分割の場合は，自己株式の数も増加する。"},{"l":3,"m":"株式の消却・併合・分割・無償割当て・1株に満たない端数の処理・単元株制度","sb":"株式無償割当て","i":"A","r":"","q":"株式会社が株式無償割当てをする場合，自己株式を交付することができる。","a":true,"c":"","e":"これに対して，株式の分割の場合は，自己株式の交付は認められない。"},{"l":4,"m":"株式の消却・併合・分割・無償割当て・1株に満たない端数の処理・単元株制度","sb":"株式無償割当て","i":"B","r":"(平31I問題6エ)","q":"株式の分割または株式無償割当てによって発行済株式の数が増加しても，資本金の額は増加しない。","a":true,"c":"","e":"株式の分割または株式無償割当てによって，発行済株式総数は増加するが，会社財産に変動がないため，資本金の額に変動はない。"},{"l":5,"m":"株式の消却・併合・分割・無償割当て・1株に満たない端数の処理・単元株制度","sb":"株式無償割当て","i":"A","r":"(平29I問題5ウ類・平25I問題5ウ)","q":"取締役会設置会社において，株式無償割当てをしようとするときは，定款に別段の定めがある場合を除き，その都度，取締役会の決議によって，株主に割り当てる株式の数等を決定しなければならない。","a":true,"c":"186条3項かっこ書。","e":"株式会社は，株式無償割当てをしようとするときは，その都度，株主に割り当てる株式の数などの法定の事項を株主総会の普通決議（取締役会設置会社では取締役会の決議）によって定めなければならない。なお，株式無償割当ての決定機関については，定款で別段の定めを置くことが認められているが（186 条３項ただし書），株式の分割の場合にはこれが認められないため，対比しておさえるようにしてほしい。"},{"l":6,"m":"株式の消却・併合・分割・無償割当て・1株に満たない端数の処理・単元株制度","sb":"株式無償割当て","i":"B","r":"(令5II問題5エ類)","q":"株式会社が株式無償割当てをする場合，株式無償割当てに係る基準日を決定しなければならない。","a":false,"c":"","e":"株式無償割当てについては，株式の分割の場合（183 条２項１号）と異なり，基準日の設定が義務づけられていない。"},{"l":7,"m":"株式の消却・併合・分割・無償割当て・1株に満たない端数の処理・単元株制度","sb":"株式無償割当て","i":"B","r":"","q":"株式会社は株式無償割当ての効力発生日後遅滞なく，株主（種類株式発行会社では割当てを受ける種類の種類株主）およびその登録株式質権者に対し，当該株主が割当てを受けた株式の数（種類株式発行会社では株式の種類および種類ごとの数）を通知しなければならない。","a":true,"c":"187条2項。","e":"株式無償割当てについては，株式の分割の場合と異なり，効力発生日後の通知義務が課されている。"},{"l":8,"m":"株式の消却・併合・分割・無償割当て・1株に満たない端数の処理・単元株制度","sb":"株式無償割当て","i":"A","r":"(平23II問題7エ)","q":"種類株式発行会社でない株式会社が１株に対して２株を割り当てる旨の株式無償割当てをする場合，当該株式会社は，株主総会の決議によらないで，株式無償割当てがその効力を生ずる日における発行可能株式総数を，その日の前日の発行可能株式総数に３を乗じて得た数の範囲内で増加する定款の変更をすることができる。","a":false,"c":"184条2項。","e":"株式会社（現に２以上の種類株式を発行しているものを除く）は，通常の定款変更の方法である株主総会の特別決議（466条，309条２項11号）によることなく，効力発生日の発行可能株式総数を，その日の前日の発行可能株式総数に株式分割の割合を乗じて得た数の範囲内で増加する定款の変更をすることができる（184 条２項）。しかし，株式無償割当てに関しては同様の規定は設けられていない。"},{"l":1,"m":"株式の消却・併合・分割・無償割当て・1株に満たない端数の処理・単元株制度","sb":"1株に満たない端数の処理","i":"B","r":"(令5II問題5ア・平31I問題6ア)","q":"株式の分割によって１株に満たない端数が生じることはあるが，株式無償割当てによって１株に満たない端数が生じることはない。","a":false,"c":"235条1項,234条1項3号。","e":"株式の分割および株式無償割当ては，ともに当該行為によって１株に満たない端数が生じることがある。"},{"l":2,"m":"株式の消却・併合・分割・無償割当て・1株に満たない端数の処理・単元株制度","sb":"1株に満たない端数の処理","i":"C","r":"","q":"株式会社が株式無償割当てをするに際して，株主に交付しなければならない当該株式会社の株式の数に１株に満たない端数がある場合は， 当該株式会社は，その端数の合計数（当該合計数に１に満たない端数がある場合はこれを切り捨てるものとする）に相当する数の株式を買い取らなければならない。","a":false,"c":"234条1項柱書,235条1項。","e":"株式会社が株式無償割当て等（234 条１項各号，株式の分割，株式の併合）をするに際して，株主に交付しなければならない当該株式会社の株式の数に１株に満たない端数がある場合は，その端数の合計数（当該合計数に１に満たない端数がある場合はこれを切り捨てるものとする）に相当する数の株式を競売し，かつ，その端数に応じてその競売により得られた代金を当該株主に交付しなければならない。しかし，株式会社は，競売に代えて，市場価格のある株式については，市場価格として法務省令で定める方法により算定される額をもって，市場価格のない株式については，裁判所の許可を得て競売以外の方法により株式を売却することができる。この場合による裁判所許可の申立ては，取締役が２人以上あるときは，その全員の同意によってしなければならない（234条２項，235条２項）。さらに，株式会社が，当該端数に相当する株式の全部または一部を買い取ることができる（234 条４項，235 条２項）。"},{"l":3,"m":"株式の消却・併合・分割・無償割当て・1株に満たない端数の処理・単元株制度","sb":"1株に満たない端数の処理","i":"C","r":"","q":"取締役会設置会社が株式の分割をすることにより株式の数に１株に満たない端数が生じる場合において，その端数の合計数（当該合計数に１に満たない端数がある場合はこれを切り捨てるものとする）に相当する数の株式の全部または一部を買い取る決定は，株主総会の決議によらなければならない。","a":false,"c":"234条5項,235条2項。","e":"当該決定は，取締役会設置会社では取締役会の決議によらなければならない（234条５項，235条２項）。なお，当該取得には，財源規制がある（461条１条７号）。"},{"l":4,"m":"株式の消却・併合・分割・無償割当て・1株に満たない端数の処理・単元株制度","sb":"1株に満たない端数の処理","i":"A","r":"(令6II問題14ウ)","q":"１株に満たない端数の処理手続における自己株式の取得により株主に対して交付する金銭等の帳簿価額の総額は，その効力が発生する日における分配可能額を超えてはならない。","a":true,"c":"461条1項7号。","e":""},{"l":1,"m":"株式の消却・併合・分割・無償割当て・1株に満たない端数の処理・単元株制度","sb":"単元株制度","i":"A","r":"(平29I問題5エ)","q":"株式会社が，単元株制度を採用するには，定款にその旨を定めなければならない。","a":true,"c":"188条1項。","e":"単元株制度を採用するためには，定款にその旨を定めなければならない。すなわち，単元株式数の定めは，定款の相対的記載事項である。"},{"l":2,"m":"株式の消却・併合・分割・無償割当て・1株に満たない端数の処理・単元株制度","sb":"単元株制度","i":"A","r":"(平23I問題7エ類)","q":"種類株式発行会社において，株式の種類ごとに単元株式数を定めることは認められない。","a":false,"c":"188条3項。","e":"種類株式発行会社においては，単元株式数は，株式の種類ごとに定めなければならない。"},{"l":3,"m":"株式の消却・併合・分割・無償割当て・1株に満たない端数の処理・単元株制度","sb":"単元株制度","i":"A","r":"(平23I問題7ア類)","q":"１単元の株式の数は，1,000以下であれば自由に設定することができる。","a":false,"c":"188条2項,会社法施行規則34条。","e":"１単元の株式の数は，1,000および発行済株式総数の200分の１に当たる数を超えることができない。したがって，1,000以下であっても，発行済株式総数の200分の１に当たる数を超えている場合は，当該数を単元株式数として設定することは認められないため，本肢は誤りである。"},{"l":4,"m":"株式の消却・併合・分割・無償割当て・1株に満たない端数の処理・単元株制度","sb":"単元株制度","i":"A","r":"(令4II問題5イ・平23I問題7イ)","q":"株式会社が単元株式数を定める場合には，取締役は，当該単元株式数を定める定款の変更を目的とする株主総会において，当該単元株式数を定めることを必要とする理由を説明しなければならない。","a":true,"c":"466条,309条2項11号,190条。","e":"単元株制度の採用や単元株式数の増加がなされると，議決権を有していた株主が，単元未満株主となることで議決権を失う可能性が生じ，株主に重大な不利益が発生するおそれがある。そのため，定款の相対的記載事項とされており，採用するためには株主総会の特別決議が要求されているのである。また，株主総会における取締役の理由説明義務については，株式の併合の場合（180条４項）と同様の趣旨である。"},{"l":5,"m":"株式の消却・併合・分割・無償割当て・1株に満たない端数の処理・単元株制度","sb":"単元株制度","i":"A","r":"(平31II問題6ア類・平25I問題5エ類・平23I問題7ウ)","q":"株式会社が，定款を変更して単元株式数を減少し，または単元株式数についての定款の定めを廃止する場合には，株主総会の特別決議を要する。","a":false,"c":"195条1項。","e":"単元株制度を廃止または単元株式数を減少する場合は，取締役の決定（取締役会設置会社では取締役会の決定）により定款を変更することができる。なぜなら，当該定款変更により株主にとって不利益が生じるおそれはないからである。当該定款変更をした場合は，株式会社は，定款の変更の効力が生じた日以後遅滞なく，その株主（種類株式発行会社にあっては，単元株式数を変更した種類の種類株主）に対し，当該定款の変更をした旨を通知または公告しなければならない（195条２項３項）。"},{"l":6,"m":"株式の消却・併合・分割・無償割当て・1株に満たない端数の処理・単元株制度","sb":"単元株制度","i":"B","r":"(令4II問題5ア)","q":"株式会社は，株式の分割を行うと同時に単元株式数を増加し，または単元株式数についての定款の定めを設ける場合は，株主総会の決議によらないで定款の変更をすることができる。","a":false,"c":"191条。","e":"株式会社は，株式の分割を行うと同時に単元株式数を増加し，または単元株式数についての定款の定めを設ける場合であって，その結果として株主の有する議決権の数が定款の変更前において有する議決権の数を下回らない場合は，株主総会の決議によらないで定款の変更をすることができる。この場合は，株主に不利益が生じるおそれがないためである。"},{"l":7,"m":"株式の消却・併合・分割・無償割当て・1株に満たない端数の処理・単元株制度","sb":"単元株制度","i":"A","r":"(平23I問題4イ類)","q":"単元未満株主は，その有する単元未満株式について，株主総会および種類株主総会において議決権を行使することができない。","a":true,"c":"189条1項。","e":"したがって，議決権を基準とした少数株主権や単独株主権も有しないと解される。"},{"l":8,"m":"株式の消却・併合・分割・無償割当て・1株に満たない端数の処理・単元株制度","sb":"単元株制度","i":"A","r":"(平24II問題6ウ)","q":"株式会社は，単元未満株主が株式無償割当てを受ける権利の全部または一部を行使することができない旨を定款で定めることができる。","a":false,"c":"189条2項3号。","e":"株式会社は，単元未満株主が株式無償割当てを受ける権利の全部または一部を行使することができない旨を定款で定めることは認められない。"},{"l":9,"m":"株式の消却・併合・分割・無償割当て・1株に満たない端数の処理・単元株制度","sb":"単元株制度","i":"A","r":"(平24II問題6イ)","q":"株式会社は，単元未満株主が剰余金の配当を受ける権利の全部または一部を行使することができない旨を定款で定めることができる。","a":false,"c":"189条2項6号,会社法施行規則35条1項7号ニ。","e":"株式会社は，単元未満株主が剰余金の配当を受ける権利の全部または一部を行使することができない旨を定款で定めることは認められない。"},{"l":10,"m":"株式の消却・併合・分割・無償割当て・1株に満たない端数の処理・単元株制度","sb":"単元株制度","i":"C","r":"(平31II問題6イ類)","q":"株式会社は，単元未満株主が株主代表訴訟を提起することができない旨を定款で定めることができる。","a":true,"c":"189条2項各号,会社法施行規則35条1項各号参照。","e":""},{"l":11,"m":"株式の消却・併合・分割・無償割当て・1株に満たない端数の処理・単元株制度","sb":"単元株制度","i":"C","r":"(平24II問題6ア類)","q":"株券発行会社でない株式会社は，単元未満株式を譲渡により取得した者が株主名簿の名義書換請求権を行使することができない旨を定款で定めることができる。","a":true,"c":"189条2項各号,会社法施行規則35条1項各号参照。","e":""},{"l":12,"m":"株式の消却・併合・分割・無償割当て・1株に満たない端数の処理・単元株制度","sb":"単元株制度","i":"B","r":"(平30II問題6イ類・平24II問題6エ類)","q":"株券発行会社は，単元未満株式に係る株券を発行してはならない。","a":false,"c":"189条3項。","e":"株券発行会社は，単元未満株式に係る株券を発行しないことができる旨を定款で定めることができる。単元未満株式に係る株券を発行しないことにより，株式会社は，わずかの数の株式について株券を発行するコストを節減するとともに，株券発行会社では株券がなければ株式譲渡ができないことになるため（128 条１項本文），単元未満株式の譲渡そのものを阻止し，譲渡に伴う名義書換のコストを節減することができるのである。"},{"l":13,"m":"株式の消却・併合・分割・無償割当て・1株に満たない端数の処理・単元株制度","sb":"単元株制度","i":"B","r":"(令4II問題5ウ類・平31II問題6エ)","q":"単元未満株主が単元未満株式の買取請求をすることができる旨の定款の定めがない限り，単元未満株主は，株式会社に対して，自己の有する単元未満株式を買い取ることを請求することができない。","a":false,"c":"192条1項。","e":"単元未満株主の投下資本回収の手段を保障するために，単元未満株主には，単元未満株式の買取請求権が認められている。単元未満株式の買取請求権は，単元未満株主に投下資本の回収手段を確保させるために不可欠の制度であるため，定款に定めることは求められていない。また，定款によっても単元未満株式買取請求権を制限することはできない。"},{"l":14,"m":"株式の消却・併合・分割・無償割当て・1株に満たない端数の処理・単元株制度","sb":"単元株制度","i":"B","r":"","q":"単元未満株式の売渡請求は，株式会社の定款に当該請求をすることができる旨の定めがある場合に限り，請求することができる。","a":true,"c":"194条1項。","e":"単元未満株式の売渡請求権は，単元未満株主の保護に不可欠の制度であるとまでは言えず，また，採用すれば会社は手間などのコストを負担しなければならなくなるため，会社が単元未満株主の保護と当該コストを比べた上で，定款によって採用するかどうかを選択することができるとしたのである。"},{"l":15,"m":"株式の消却・併合・分割・無償割当て・1株に満たない端数の処理・単元株制度","sb":"単元株制度","i":"A","r":"(令6II問題14イ)","q":"単元未満株式の株式買取請求権による自己株式の取得により株主に対して交付する金銭等の帳簿価額の総額は，その効力が発生する日における分配可能額を超えてはならない。","a":false,"c":"461条1項参照。","e":"単元未満株式の株式買取請求権による取得は，一般的に買取代金がさほど高額にならないし，株主の投下資本回収を保障する必要性が高いので，財源規制は課せられていない。"},{"l":16,"m":"株式の消却・併合・分割・無償割当て・1株に満たない端数の処理・単元株制度","sb":"単元株制度","i":"B","r":"(平31II問題6ウ)","q":"単元未満株主が単元未満株式売渡請求をすることができる旨の定款の定めがない限り，単元未満株主は，株式会社に対して，自己の有する単元未満株式の数と併せて単元株式数となる数の株式を売り渡すことを請求することができない。","a":true,"c":"194条1項。","e":"単元未満株主が単元未満株式売渡請求をすることができる旨の定款の定めがない限り，単元未満株主は，株式会社に対して，自己の有する単元未満株式の数と併せて単元株式数となる数の株式を売り渡すことを請求することができない。"},{"l":17,"m":"株式の消却・併合・分割・無償割当て・1株に満たない端数の処理・単元株制度","sb":"単元株制度","i":"C","r":"","q":"単元未満株式の売渡請求を受けた株式会社は，当該単元未満株式売渡請求を受けたときに売り渡す単元未満株式の数に相当する数の株式を有しない場合を除いて，自己株式を当該単元未満株主に売り渡さなければならない。","a":true,"c":"194条3項。","e":""}]},{"n":4,"name":"設立","qs":[{"l":1,"m":"定款","sb":"","i":"B","r":"(平27II問題3ア)","q":"株式会社を設立するには，発起人が定款を作成し，定款が書面をもって作成されているときは，その全員がこれに署名し，または記名押印をしなければならない。","a":true,"c":"26条1項。","e":"設立手続の最初の重要な行為として，発起人は定款を作成しなければならない。"},{"l":2,"m":"定款","sb":"","i":"B","r":"","q":"電磁的記録をもって定款を作成することは認められない。","a":false,"c":"26条2項。","e":"定款は，電磁的記録をもって作成することもできる。この場合において，当該電磁的記録に記録された情報については，法務省令で定める署名または記名押印に代わる措置をとらなければならない。"},{"l":3,"m":"定款","sb":"","i":"A","r":"(令2I問題3ア類・平29I問題4ア・平23I問題3ア類)","q":"株式会社の定款は，書面をもって作成されているときには，発起人の全員が署名し，または記名押印することにより効力を生じる。","a":false,"c":"30条1項。","e":"定款は，公証人の認証を受けなければその効力を生じない。公証人の認証は，定款が真正に作成され，かつ内容が適法であることを確保するために行われる。公証人の認証により，定款の内容を明確にして後日の紛争と不正行為を防止することができ，認証を欠く定款は無効となる。"},{"l":4,"m":"定款","sb":"","i":"A","r":"(令2II問題4ア・平30I問題4ウ・平25II問題3ア)","q":"株式会社の目的および商号は，定款に記載し，または記録しなければならない。","a":true,"c":"27条1号2号","e":"株式会社の目的および商号は，絶対的記載事項である。"},{"l":5,"m":"定款","sb":"","i":"A","r":"(令2II問題4イ類・平25II問題13ア)","q":"株式会社の資本金の額は，定款に記載または記録しなければならず，登記もしなければならない。","a":false,"c":"911条3項5号,27条各号参照。","e":"資本金の額は登記事項であるが，定款の絶対的記載事項ではない。なお，設立に際して出資される財産の価額またはその最低額が，絶対的記載事項とされている（27条４号）。"},{"l":6,"m":"定款","sb":"","i":"A","r":"(平30I問題4ア・平24II問題3ア・平24I問題3ア)","q":"設立に際して出資される財産の価額またはその最低額は，定款に記載または記録しなければならない。","a":true,"c":"27条4号","e":"設立時における会社の資産規模を明示させるために，設立に際して出資される財産の価額またはその最低額は定款の絶対的記載事項とされている。"},{"l":7,"m":"定款","sb":"","i":"A","r":"(平24II問題3イ)","q":"設立に際して発行する株式の数は，定款に記載または記録しなければならない。","a":false,"c":"27条各号参照。","e":"設立に際して発行する株式の数は，定款の絶対的記載事項ではない。"},{"l":8,"m":"定款","sb":"","i":"A","r":"(平24II問題3ウ)","q":"発起人の氏名または名称および住所は，定款に記載または記録しなければならない。","a":true,"c":"27条5号。","e":"なお，発起人の氏名または名称および住所は，登記事項ではない（911条３項各号参照）。"},{"l":9,"m":"定款","sb":"","i":"A","r":"(令2II問題4ウ類・平25II問題3イ)","q":"株式会社の支店の所在地は，定款に記載または記録しなければならない。","a":false,"c":"27条各号参照。","e":"株式会社の本店の所在地は，定款の絶対的記載事項であるが，株式会社の支店の所在地は，定款の絶対的記載事項ではない。"},{"l":10,"m":"定款","sb":"","i":"A","r":"(平31I問題4エ・平26I問題3ウ・平24II問題3エ)","q":"株式会社の公告方法は，定款に記載または記録しなければならない。","a":false,"c":"27条各号参照。","e":"会社は，公告方法として，① 官報に掲載する方法，② 時事に関する事項を掲載する日刊新聞紙に掲載する方法，③ 電子公告のいずれかを定款で定めることができる（939条１項）。ここで，定款に定めがない場合の公告方法は，① 官報に掲載する方法によることとなるが，公告方法は，定款の絶対的記載事項ではない。"},{"l":11,"m":"定款","sb":"","i":"A","r":"(平30I問題4イ類)","q":"取締役の氏名および員数は，定款に記載または記録しなければならない。","a":false,"c":"27条各号参照。","e":"取締役の氏名および員数は絶対的記載事項ではなく，任意的記載事項である。"},{"l":12,"m":"定款","sb":"","i":"A","r":"(令2II問題4エ)","q":"株式会社の設立時発行株式の数は，定款に記載または記録しなければならない。","a":false,"c":"27条各号参照。","e":"株式会社の設立時発行株式の数は，定款の絶対的記載事項ではない。なお，発行済株式総数は，絶対的登記事項とされている（911条３項９号）。"},{"l":13,"m":"定款","sb":"","i":"A","r":"(平29I問題4イ類)","q":"株式会社の定款には，会社法の規定により定款の定めがなければその効力を生じない事項，および，その他の事項で会社法の規定に違反しないものを記載することができる。","a":true,"c":"29条。","e":"定款には，絶対的記載事項のほかに，相対的記載事項および任意的記載事項を記載することができる。ここで，相対的記載事項とは，記載を欠いても定款全体の効力に影響はないが，定款に記載してはじめてその効力が認められ，記載を欠くときはその効力が認められない事項である。また，任意的記載事項とは，定款の記載の有無は，その事項や定款自体の効力に影響を与えない事項である。"},{"l":14,"m":"定款","sb":"","i":"A","r":"(平31I問題4ウ)","q":"株式会社の存続期間は，定款に記載しまたは記録することができる。","a":true,"c":"29条。","e":"なお，定款で存続期間を定めた場合，その満了によって株式会社は解散する（471条１号） 。"},{"l":15,"m":"定款","sb":"","i":"C","r":"","q":"会社成立前において，発起人は，定款を発起人の代表者の住所に備え置かなければならない。","a":false,"c":"31条1項。","e":"会社成立前において，発起人は，定款を発起人が定めた場所に備え置かなければならない。なお，会社成立後にあっては，その本店および支店に備え置かなければならない。"},{"l":16,"m":"定款","sb":"","i":"B","r":"(平26I問題3イ)","q":"株式会社の成立前において，発起人および設立時募集株式の引受人は，発起人が定めた時間内は，いつでも，発起人の定めた費用を支払うことにより，書面をもって作成された定款の謄本の交付を請求することができる。","a":true,"c":"31条2項2号,102条1項。","e":""},{"l":17,"m":"定款","sb":"","i":"B","r":"(令7I問題3イ)","q":"株式会社の成立後において，当該株式会社の親会社債権者がその権利を行使するため必要があるときは，当該親会社債権者は，裁判所の許可を得て，当該株式会社の定めた費用を支払うことにより，書面をもって作成されている当該株式会社の定款の謄本の交付の請求をすることができる。","a":false,"c":"31条3項。","e":"株式会社の成立後において，当該株式会社の親会社社員がその権利を行使するため必要があるときは，当該親会社社員は，裁判所の許可を得て，当該株式会社の定款の閲覧もしくは謄本または抄本の交付を請求することができる。"},{"l":1,"m":"変態設立事項","sb":"","i":"A","r":"","q":"変態設立事項は，定款に記載または記録しなければその効力を生じない。","a":true,"c":"28条柱書。","e":"変態設立事項は，相対的記載事項であるので，定款に記載または記録しなければその効力を生じない。"},{"l":2,"m":"変態設立事項","sb":"","i":"A","r":"(令6I問題4ウ)","q":"発起設立の場合において，定款について公証人の認証を受けた後，発起人から，金銭の出資に代えて自己が所有する不動産を出資したい旨の申出があったときに，発起人の全員の同意をもって当該定款を変更して，当該発起人の出資の目的を金銭ではなく当該不動産にすることはできない。","a":true,"c":"28条1号,30条1項。","e":"現物出資は変態設立事項として規定されており，変態設立事項は公証人の認証を受ける原始定款に記載し，または記録しなければ，その効力を生じない。そのため，公証人の認証を受けた後は，原則として定款の変更は制限されるため，発起人の全員の同意があっても，現物出資に関する事項を新たに定款に定めることはできない（30 条２項参照）。"},{"l":3,"m":"変態設立事項","sb":"","i":"A","r":"(令7I問題3ウ・令2II問題3イ類・平29I問題3ア・平24I問題2ア)","q":"募集設立において，発起人および設立時募集株式の引受人は，その引き受けた設立時募集株式につき，金銭以外の財産を出資することができる。","a":false,"c":"34条1項,63条1項対比。","e":"株式会社の設立時において，現物出資は重い責任が課せられている発起人のみに認められている出資方法であるため，設立時募集株式引受人は，金銭出資のみが認められており，現物出資は認められていない。"},{"l":4,"m":"変態設立事項","sb":"","i":"A","r":"(平24I問題2ウ)","q":"現物出資は，当該現物出資をする者の氏名または名称，出資の目的である財産およびその価額ならびにその者に対して割り当てる設立時発行株式の数を定款に記載し，または記録しなければ，その効力を生じない。","a":true,"c":"28条1号。","e":"現物出資等の変態設立事項は，相対的記載事項である。"},{"l":5,"m":"変態設立事項","sb":"","i":"A","r":"","q":"財産引受けにより財産の譲渡をすることができるのは，発起人のみである。","a":false,"c":"","e":"財産引受けを行うことができる者に制限はない。"},{"l":6,"m":"変態設立事項","sb":"","i":"A","r":"(令2I問題3イ類・平29I問題3ウ・平25II問題3ウ)","q":"株式会社の成立により発起人が受ける報酬は，定款に法定の事項を記載し，または記録しなければ，その効力を生じない。","a":true,"c":"28条3号。","e":"株式会社の成立により発起人が受ける報酬は，変態設立事項であるため，定款の相対的記載事項である。"},{"l":7,"m":"変態設立事項","sb":"","i":"A","r":"(平30II問題3イ・平25II問題3エ)","q":"定款の認証手数料は，株式会社の負担する設立に関する費用とされ，原則として裁判所選任の検査役の調査を受けなければならない。","a":false,"c":"28条4号かっこ書。","e":"① 定款の認証手数料，② 定款に係る印紙税，③ 払込取扱機関に支払うべき手数料および報酬，④ 検査役の報酬，⑤ 設立登記のための登録免許税は，会社設立に必要不可欠な費用であり，また，その金額算定には客観性があることから，発起人の恣意性が介入するおそれがないので，変態設立事項の規制の対象外とされている。"},{"l":8,"m":"変態設立事項","sb":"","i":"A","r":"(令7I問題3ア・平30I問題4エ)","q":"会社が当該会社の設立登記の登録免許税を負担するためには，定款に当該事項についての記載または記録がなければならない。","a":false,"c":"28条4号かっこ書,会社法施行規則5条4号。","e":"上記問題７の解説参照。設立登記の登録免許税は，定款に記載または記録がなくても会社が負担することになる。"},{"l":9,"m":"変態設立事項","sb":"","i":"A","r":"(平26I問題3エ)","q":"定款に記載し，または記録した現物出資に関する事項を調査するために裁判所により選任された検査役の報酬は，当該定款に記載し，または記録しなければ，その効力を生じない。","a":false,"c":"28条4号かっこ書,会社法施行規則5条3号。","e":"上記問題７の解説参照。検査役の報酬は，定款に記載または記録がなくても会社が負担することになる。"},{"l":10,"m":"変態設立事項","sb":"","i":"B","r":"","q":"設立費用として定款で定めた価額の総額が，500万円を超えない場合，検査役の調査が免除される。","a":false,"c":"33条10項1号参照。","e":"現物出資および財産引受の目的たる財産について定款に記載・記録された価額の総額が，500 万円を超えない場合は，検査役の調査が免除される。しかし，設立費用には，このような少額財産の免除の特例はないので，本肢は誤りである。なお，当該少額財産の特例の要件は，個々の現物出資財産の価格ではなくて，現物出資財産等の価格の総額が 500万円を超えない場合であることに注意すること。"},{"l":11,"m":"変態設立事項","sb":"","i":"B","r":"(令6I問題6イ類)","q":"現物出資または財産引受けの目的たる財産が市場価格のある有価証券である場合，検査役の調査が免除される。","a":false,"c":"33条10項2号。","e":"現物出資または財産引受の目的たる財産が市場価格のある有価証券で，かつ，定款で定めた価額が当該有価証券の市場価格として法務省令で定める方法により算定されるものを超えない場合，検査役の調査が免除される。"},{"l":12,"m":"変態設立事項","sb":"","i":"B","r":"(令6I問題6ウ類・平24I問題2エ類)","q":"現物出資または財産引受けの目的たる財産が不動産である場合において，当該財産の定款で定めた価額が相当であることにつき，不動産鑑定士の証明を受けた場合，検査役の調査が免除となる。","a":false,"c":"33条10項3号かっこ書。","e":"現物出資または財産引受けの目的たる財産の価額として定款で定めた価額が相当であることについて，弁護士，弁護士法人，公認会計士，監査法人，税理士または税理士法人の証明（目的物たる財産が不動産であるときは，当該証明および不動産鑑定士の鑑定評価）を受けた場合，検査役の調査が免除となる（33条10項３号）。"},{"l":13,"m":"変態設立事項","sb":"","i":"B","r":"","q":"現物出資財産について定款に記載され，または記録された価額が相当であることについて専門家の証明（目的物たる財産が不動産であるときは，当該証明および不動産鑑定士の鑑定評価）を受けることで裁判所選任の検査役の調査が免除となる場合において，設立時取締役となる者は，当該専門家としての資格を有しない。","a":true,"c":"33条11項3号。","e":"① 発起人，② 財産引受財産の譲渡人，③ 設立時取締役または設立時監査役，④ 業務の停止の処分を受け，その停止の期間を経過しない者，⑤ 弁護士法人，監査法人または税理士法人であって，その社員の半数以上が①～③のいずれかに該当するものは，現物出資財産等について定款に記載され，または記録された価額が相当であることについての専門家の証明をすることができない。"},{"l":14,"m":"変態設立事項","sb":"","i":"B","r":"(令6II問題3イ)","q":"その社員の半数以上が設立しようとする株式会社の設立時取締役又は設立時監査役である監査法人は，当該設立しようとする株式会社の現物出資財産等について定款に記載され，又は記録された価額が相当であることについて証明をすることはできない。","a":true,"c":"33条11項5号。","e":"監査法人であって，その社員の半数以上が設立しようとする株式会社の設立時取締役または設立時監査役である場合，現物出資または財産引受財産について専門家の証明をすることができない。証明の公正性を確保するためである。"},{"l":15,"m":"変態設立事項","sb":"","i":"B","r":"","q":"現物出資財産について定款に記載された価額が相当であることについて証明をした者がいる場合には，発起人はその者の氏名または名称を定款に記載しなければならない。","a":false,"c":"","e":"現物出資財産等についての専門家の証明（33 条10 項３号）がある場合であっても，当該専門家の氏名等の定款への記載は求められていない。"},{"l":16,"m":"変態設立事項","sb":"","i":"C","r":"","q":"株式会社（発起設立および募集設立の方法により設立したものに限る）の成立後２年以内に，その成立する前から存在する財産で，その事業のために継続して使用するものを，当該株式会社の純資産額として法務省令で定める方法により算定される額の５分の１を超える対価で取得する契約を締結する場合には，株主総会の特別決議のほか，裁判所選任の検査役の調査が必要となる。","a":false,"c":"467条1項柱書,309条2項11号。","e":"事後設立を行う場合は，株主総会の特別決議が必要である。ただし，事後設立は変態設立事項ではないので，検査役の調査は不要である。事後設立は，財産引受けの規制を潜脱する手段として利用されるおそれがある。そのため，株主総会の特別決議を要求して，財産引受けの規制潜脱を防いでいるのである。また，純資産額の５分の１という基準が設けられているのは，少額な取引まで規制してしまうと，会社の事業活動に支障が生じてしまうからである。"},{"l":1,"m":"発起人","sb":"","i":"B","r":"(令5II問題3ア)","q":"発起人は，設立しようとする株式会社が公開会社である場合には，３人以上でなければならない。","a":false,"c":"","e":"発起人の人数については制限がない。すなわち，発起人の人数は，１人でも複数人でもよい。そのため，株式会社については，発起人１人による会社設立が認められる。"},{"l":2,"m":"発起人","sb":"","i":"A","r":"(令2II問題3ア・平28II問題4エ・平23I問題2イ)","q":"発起人は，自然人でなければならないため，会社は発起人となることができない。","a":false,"c":"","e":"発起人の資格については制限がない。すなわち，自然人だけでなく，法人も発起人となることができる。"},{"l":1,"m":"発起人の権限の範囲","sb":"","i":"C","r":"","q":"最高裁判所の判例によれば，会社成立後未払いの設立費用債務は，全額成立後の会社に帰属し，発起人に帰属することはないとされる。","a":false,"c":"大判昭2年7月4日。","e":"会社成立後未払いの設立費用債務は，定款に記載され，かつ検査役の調査を通った金額の範囲内で成立後の会社に帰属し，これらの要件を満たさない部分は発起人に帰属するとしている。"},{"l":2,"m":"発起人の権限の範囲","sb":"","i":"B","r":"(令5I問題3ウ類・平28II問題4イ)","q":"最高裁判所の判例によれば，発起人が株式会社の成立後に特定の財産を譲り受けることを約する契約を締結した場合，定款に法定の事項の記載がなければ，当該契約は無効であるが，成立後の当該株式会社は当該契約を追認することができる。","a":false,"c":"最判昭和42年9月26日。","e":"定款に記載のない財産引受けを，成立後の会社が追認することはできない。"},{"l":3,"m":"発起人の権限の範囲","sb":"","i":"B","r":"(平31II問題3イ)","q":"最高裁判所の判例によれば，定款に記載のない財産引受けが行われた場合，株式会社のみがその無効を主張でき，財産の譲渡人である相手方は主張できない。","a":false,"c":"最判昭28年12月3日。","e":"最高裁判所の判例によれば，定款に記載のない財産引受けは，何人との関係においても無効であり，その無効は会社側だけでなく譲渡人からも主張することができるとしている。"},{"l":1,"m":"社員の確定","sb":"","i":"A","r":"(令6II問題3ア・平29II問題3ア・平29II問題3ウ・平26I問題4エ)","q":"発起設立において，発起人は，株式会社の設立に際して発起人が割当てを受ける設立時発行株式の数および発起人が設立時発行株式と引換えに払い込む金銭の額（定款に定めがある場合を除く）を定めようとするときは，その全員の同意を得なければならない。","a":true,"c":"32条1項1号2号。","e":"設立時発行株式に関する事項は重要な事項であるため，発起人全員の同意によって定めなければならない。"},{"l":2,"m":"社員の確定","sb":"","i":"A","r":"(平27II問題3イ・平23II問題3ア類)","q":"成立後の株式会社の資本金および準備金の額に関する事項が定款に定められていない場合には，発起人は，株式会社の成立の時までに，当該事項を定款に記載しなければならない。","a":false,"c":"32条1項3号。","e":"成立後の株式会社の資本金および準備金の額に関する事項は，定款の絶対的記載事項とはされていない。なお，当該事項（定款に定めがある場合を除く）について定めようとするときは，発起人全員の同意を得なければならない。"},{"l":3,"m":"社員の確定","sb":"","i":"A","r":"(令5I問題4ア)","q":"発起人が，株式会社の設立に際して，成立後の株式会社の資本金および資本準備金の額に関する事項を定めようとする場合は，当該事項について定款に定めがあるときを除き，発起人の全員の同意を得なければならない。","a":true,"c":"32条1項3号。","e":"発起人が，株式会社の設立に際して，① 発起人が割当てを受ける設立時発行株式の数，② 発起人が割当てを受ける設立時発行株式と引換えに払い込む金銭の額，③成立後の株式会社の資本金および資本準備金の額に関する事項を定めようとするときは，当該事項について定款に定めがある場合を除き，発起人の全員の同意を得なければならない。"},{"l":4,"m":"社員の確定","sb":"","i":"A","r":"(平28I問題3ア・平24II問題16ア類)","q":"発起設立において，発起人は，発行可能株式総数を定款で定めていない場合には，株式会社の成立の時までに，発起人の議決権の３分の２以上に当たる多数をもって，定款を変更して発行可能株式総数の定めを設けなければならない。","a":false,"c":"37条1項。","e":"発起設立において，発起人は，発行可能株式総数を定款で定めていない場合には，株式会社の成立の時までに，その全員の同意によって，定款を変更して発行可能株式総数の定めを設けなければならない。また，発起人は，発行可能株式総数を定款で定めている場合には，株式会社の成立の時までに，その全員の同意によって，発行可能株式総数についての定款の変更をすることができる（37条２項）。"},{"l":5,"m":"社員の確定","sb":"","i":"A","r":"(令5II問題3イ類・平31I問題4ア・平26I問題4イ・平22II問題3エ類)","q":"発起設立において，発起人は，発行可能株式総数を定款で定めている場合には，株式会社の成立の時までに，その過半数の同意によって，当該発行可能株式総数についての定款の変更をすることができる。","a":false,"c":"37条2項。","e":"発起人は，発行可能株式総数を定款で定めている場合には，株式会社の成立の時までに，その全員の同意によって，発行可能株式総数についての定款の変更をすることができる。"},{"l":6,"m":"社員の確定","sb":"","i":"B","r":"(平24I問題3イ)","q":"募集設立において，発行可能株式総数を定款に定めていないときは，株式会社の成立の時までに，創立総会の決議によって，定款を変更して発行可能株式総数の定めを設けなければならない。","a":true,"c":"98条。","e":""},{"l":7,"m":"社員の確定","sb":"","i":"A","r":"(令4I問題3ア・平29I問題3エ類・平23I問題3イ)","q":"発起設立と募集設立のいずれの場合においても，発起人は，設立時発行株式を１株以上引き受けなければならない。","a":true,"c":"25条2項参照。","e":"発起設立，募集設立問わず，各発起人は，設立時発行株式を１株以上引き受けなければならない。"},{"l":8,"m":"社員の確定","sb":"","i":"C","r":"","q":"株式会社の設立において，設立時発行株式を引き受ける者を募集する場合には，公証人による定款の認証を受ける前までに，発起人の全員の同意を得なければならない。","a":false,"c":"57条。","e":"発起人は，発起人の全員の同意により，設立時発行株式を引き受ける者を募集することを決定することができる。ただし，公証人の認証を受ける前という制限はないため，本肢は誤りである。すなわち，発起設立の方法で株式会社の設立手続を開始した後に，発起人全員の同意を得て募集設立の手続をとることもできる。"},{"l":9,"m":"社員の確定","sb":"","i":"C","r":"","q":"発起人は，設立時発行株式を引き受ける者の募集をするときは，その都度，その過半数の同意によって，設立時募集株式の数等の法定の事項を定めなければならない。","a":false,"c":"58条1項2項。","e":"発起人は，設立時発行株式を引き受ける者の募集をするときは，その都度，その全員の同意によって，設立時募集株式について次に掲げる事項を定めなければならない。① 設立時募集株式の数（設立しようとする株式会社が種類株式発行会社である場合にあっては，その種類および種類ごとの数）"},{"l":10,"m":"社員の確定","sb":"","i":"C","r":"(令6I問題4ア)","q":"募集設立の場合において，設立時募集株式の数を超える引受けの申込みがあるときは，発起人は，各申込者に対し，申込みに係る数に応じて，設立時募集株式を割り当てなければならない。","a":false,"c":"60条1項。","e":"発起人は，申込者の中から設立時募集株式の割当てを受ける者を定め，かつ，その者に割り当てる設立時募集株式の数を定めなければならない。この場合において，発起人は，当該申込者に割り当てる設立時募集株式の数を，当該申込者が引き受けようとする設立時募集株式の数よりも減少することができる。すなわち，設立時募集株式の割当ては，発起人が自由に決定することができる。これを，割当て自由の原則という。"},{"l":11,"m":"社員の確定","sb":"","i":"A","r":"","q":"心裡留保の相手方が悪意または有過失の場合の無効や，虚偽表示による無効は，発起人による設立時発行株式の引受けに係る意思表示については適用されない。","a":true,"c":"51条1項。","e":"これは，多数の利害関係者が存在する会社設立の基礎の安定を図る必要があるためである。なお，募集設立における設立時募集株式引受人に関しても，同様の規定が置かれている（102条５項）。"},{"l":12,"m":"社員の確定","sb":"","i":"A","r":"(令7I問題3エ・平26II問題3エ・平23II問題3エ・平22I問題3エ)","q":"発起人は，株式会社の成立後は，錯誤，詐欺または強迫を理由として設立時発行株式の引受けの取消しをすることができない。","a":true,"c":"51条2項。","e":"発起人は，株式会社の成立後は，錯誤（民法95条），詐欺または強迫（民法96条）を理由として設立時発行株式の引受けの取消しをすることができない。これは，会社が一旦成立してしまった後は，発起人の株式引受けに至った個人的理由よりは，会社の利益を優先すべきであると考えられるためである。"},{"l":13,"m":"社員の確定","sb":"","i":"A","r":"(令4II問題3エ類・平31I問題3エ類・平28I問題4ウ類)","q":"設立時募集株式の引受人は，創立総会において議決権を行使した後であっても，株式会社の成立前であれば，錯誤を理由とした設立時発行株式の引受けの取消しをすることができる。","a":false,"c":"102条6項。","e":"設立時募集株式の引受人は，株式会社の成立後，または，創立総会等においてその議決権を行使した後は，錯誤を理由として設立時発行株式の引受けの取消しをすることができない。すなわち，株式会社の成立前であっても，創立総会等において議決権を行使した後は，錯誤を理由として設立時発行株式の引受けの取消しをすることができない。また，詐欺または強迫を理由として，設立時発行株式の引受けの取消しをすることも同様に認められない。"},{"l":14,"m":"社員の確定","sb":"","i":"C","r":"(令4I問題4ア)","q":"設立時募集株式の引受人は，創立総会で議決権を行使した後は，引受けの当時，制限行為能力者であったことを理由として設立時発行株式の引受けの取消しを主張することができない。","a":false,"c":"102条6項。","e":"設立時募集株式の引受人は，株式会社の成立後または創立総会もしくは種類創立総会においてその議決権を行使した後は，錯誤，詐欺または強迫を理由として設立時発行株式の引受けの取消しをすることができない。これに対して，制限行為能力者の保護は，取引の安全に優先するのが原則であることから，行為能力の制限を理由とする引受けの取消しは制限されていない。"},{"l":1,"m":"会社財産の確定","sb":"","i":"A","r":"(平28II問題4ア)","q":"発起人は，株式会社の成立の時までに，その引き受けた設立時発行株式につき，その出資に係る金銭の全額を払い込み，またはその出資に係る金銭以外の財産の全部を給付しなければならない。","a":false,"c":"34条1項本文。","e":"発起人は，設立時発行株式の引受後遅滞なく，払込金額の全額を払込み，または現物出資財産の全部を給付することを要する。"},{"l":2,"m":"会社財産の確定","sb":"","i":"A","r":"(令6II問題4ア・令2I問題3ウ・平26I問題4ウ・平24I問題2イ)","q":"現物出資をする者は，設立時発行株式の引受け後遅滞なく，その現物出資に係る財産の全部を給付しなければならないが，発起人全員の同意があるときは，登記等の権利の設定または移転を第三者に対抗するために必要な行為は，株式会社の設立後にすることを妨げない。","a":true,"c":"34条1項ただし書。","e":"不動産のように登記を必要とし，あるいは，特許権のように登録を必要とするものについて，発起人の全員の同意がある場合には，会社成立後にこれらをすることができる。これは，会社成立前の登記や登録においては，会社名義を使用することができず，会社成立後に登記や登録を再び行うことの手続の重複を避けるためである。"},{"l":3,"m":"会社財産の確定","sb":"","i":"A","r":"","q":"発起人および設立時募集株式引受人が，その出資にかかる金銭の払込みをする場合は，発起人が定めた払込取扱機関においてすることを要する。","a":true,"c":"34条2項,63条1項。","e":"これは，第三者機関において金銭の払込みをなすことにより，払込みの確実性を確保するためである。"},{"l":4,"m":"会社財産の確定","sb":"","i":"B","r":"","q":"発起人は，労務を出資の目的とすることはできない。","a":true,"c":"34条2項,63条1項。","e":"株式会社の社員たる株主は有限責任を負うにすぎないから（104 条），出資の価額について評価可能である必要があるため，評価不可能な労務出資および信用出資は認められない。"},{"l":5,"m":"会社財産の確定","sb":"","i":"A","r":"(令6I問題3イ類・平29I問題4エ)","q":"発起人が，出資の履行をしていない発起人に対して，一定の期日までに当該出資の履行をしなければならない旨の通知を法定の期間に行った場合において，当該通知を受けた発起人は，当該期日までに当該出資の履行をしないときには，当該出資の履行をすることにより設立時発行株式の株主となる権利を失う。","a":true,"c":"36条1項3項。","e":"発起人を当然に失権させてしまうと設立手続に支障が生じるため，設立の迅速性を確保するために発起人については失権手続が設けられている。そして，一定の期日までに当該出資の履行をしなければならない旨の通知を受けた発起人が期日までに出資を履行しないときは，当該発起人は設立時発行株式の株主となる権利を失う。なお，当該通知は，期日の２週間前までにしなければならない（36条２項）。"},{"l":6,"m":"会社財産の確定","sb":"","i":"B","r":"(平22I問題3ウ)","q":"発起人および設立時取締役は，会社成立後もなお払込みがない株式につき，連帯して払込みをなす責任を負う。","a":false,"c":"","e":"このような規定はない。最終的に払込みのない株式の引受人は，株主となる権利を失うことになるが，発起人等が失権した権利の払込みをなす責任を負うことはない。"},{"l":7,"m":"会社財産の確定","sb":"","i":"B","r":"(令4II問題3ア類・令2II問題3ウ)","q":"設立時募集株式の引受人は，設立時募集株式の払込金額の払込みをしないときは，当該払込みをすることにより設立時募集株式の株主となる権利を失う。","a":true,"c":"63条3項。","e":"設立時募集株式引受人には，発起人のような失権手続は設けられていない。"},{"l":8,"m":"会社財産の確定","sb":"","i":"A","r":"(令4I問題3イ・平25I問題3エ類・平23I問題3ウ)","q":"発起設立と募集設立のいずれの場合においても，払込みの取扱いをした銀行等は，発起人から請求を受けたときは，払い込まれた金額に相当する金銭の保管に関する証明書を交付しなければならない。","a":false,"c":"34条2項,64条1項。","e":"募集設立の場合，発起人は，払込取扱機関に対し，払込金保管証明書の交付を請求することができる。募集設立においては，払込金保管証明書がないと設立登記の申請をすることができないため，必ず交付を受ける必要がある。この払込金保管証明制度は，募集設立の場合のみ採用されている。なぜなら，募集設立の場合には，設立時募集株式引受人が存在するので，財産の保管状況を明らかにすることにより，その保護を図る必要があるからである。なお，払込取扱機関に保管証明書の交付が求められるのは，募集設立の場合のみである。"},{"l":1,"m":"機関の具備","sb":"","i":"A","r":"(令4I問題3ウ類・平29II問題3イ類・平25II問題4ア類・平23II問題3イ類・平22II問題3ア類)","q":"発起設立において，設立時取締役の選任は，発起人全員の同意によって決定する。","a":false,"c":"40条1項。","e":"発起設立において，設立時役員等の選任は，発起人が発起人としての資格においてではなく，「設立中の会社」の構成員である株式引受人としての地位においてなすものである。したがって，発起設立において，設立時取締役の選任は，発起人の議決権の過半数によって決定される。その際，各発起人は，出資の履行をした設立時発行株式１株につき１個の議決権（単元株式数を定款で定めている場合は，１単元につき１個の議決権）を有する（40条２項）。なお，設立時取締役（設立しようとする株式会社が監査等委員会設置会社である場合は，設立時監査等委員である設立時取締役またはそれ以外の設立時取締役），設立時会計参与，設立時監査役または設立時会計監査人を合わせて設立時役員等といい，これらの者も同様の要件で選任される。"},{"l":2,"m":"機関の具備","sb":"","i":"A","r":"(平30I問題3ア・平26II問題3ア)","q":"設立時取締役は，発起人の中から選任しなければならない。","a":false,"c":"","e":"発起人の中から設立時取締役を選任しなければならないという規定は存在しない。"},{"l":3,"m":"機関の具備","sb":"","i":"B","r":"","q":"設立しようとする株式会社が監査等委員会設置会社である場合は，設立時取締役の選任は，設立時監査等委員である設立時取締役とそれ以外の設立時取締役とを区別してしなければならない。","a":true,"c":"38条2項。","e":"設立時監査等委員の独立性を確保するためである。なお，募集設立の場合も同様である（88条２項）。"},{"l":4,"m":"機関の具備","sb":"","i":"A","r":"(令5II問題4ア類・平31II問題3ア類・平25I問題3ア類)","q":"発起設立において，公証人の認証を受けた定款で設立時監査役として定められた者は，会社が成立をしたときに，設立時監査役に選任されたものとみなされる。","a":false,"c":"38条4項。","e":"発起設立における設立時役員等は，発起人による選任の方法（38条１項）のほかに，原始定款により選任することができる。そして，定款で設立時役員等として定められた者は，出資の履行が完了したときに，設立時役員等に選任されたものとみなされる。"},{"l":5,"m":"機関の具備","sb":"","i":"A","r":"(平29II問題4イ類・平25II問題4ウ・平23II問題3イ類)","q":"募集設立の場合における設立時取締役の選任は，創立総会において議決権を行使することができる設立時株主の議決権の過半数であって，出席した当該設立時株主の議決権の過半数を要件とする創立総会の決議によって行われなければならない。","a":false,"c":"88条,73条1項。","e":"募集設立の場合，設立時取締役の選任は，創立総会の決議によって行わなければならない。ここで，創立総会の決議は，当該創立総会において議決権を行使することができる設立時株主の議決権の過半数であって，出席した当該設立時株主の議決権の３分の２以上に当たる多数をもって行う。したがって，本肢は誤りである。"},{"l":6,"m":"機関の具備","sb":"","i":"A","r":"(令6II問題4ウ類・平25I問題3イ)","q":"発起設立において発起人は，公証人の認証を受けた定款で定められて選任されたものとみなされた設立時取締役を，株式会社の成立の時までの間，解任することができない。","a":false,"c":"42条。","e":"発起設立において，発起人は，株式会社の成立の時までの間，その選任した設立時役員等を解任することができる。なお，公証人の認証を受けた定款で定められて選任されたものとみなされた設立時取締役であっても，当該解任することができる設立時役員等に含まれるため，本肢は誤りである。"},{"l":7,"m":"機関の具備","sb":"","i":"A","r":"(令5I問題4ウ類・平29II問題3エ・平26II問題3ウ類・平25II問題4イ類・平22II問題3イ)","q":"発起設立において，設立時監査役の解任は，発起人の議決権の過半数をもって決定する。","a":false,"c":"43条1項。","e":"発起設立において，設立時監査役の解任は，発起人の議決権の３分の２以上に当たる多数をもって決定する。会社成立後の監査役の解任決議は，その地位の強化を図る趣旨から，特別決議事項とされており（339 条１項，341 条，309条２項７号，343条４項），これとの整合性を図った規定である。また，設立時監査等委員である設立時取締役の解任も同様に，発起人の議決権の３分の２以上に当たる多数をもって決定する。なお，設立時監査等委員以外の設立時取締役，設立時会計参与，設立時会計監査人の解任は，発起人の議決権の過半数をもって決定する。"},{"l":8,"m":"機関の具備","sb":"","i":"A","r":"(平28I問題3ウ)","q":"発起設立において，設立時会計監査人の解任は，発起人の議決権の過半数をもって決定する。","a":true,"c":"43条1項。","e":""},{"l":9,"m":"機関の具備","sb":"","i":"A","r":"(平25II問題4エ)","q":"募集設立において，創立総会の決議によって選任された設立時取締役は，株式会社の成立の時までの間，創立総会の決議によって解任することができる。","a":true,"c":"91条。","e":""},{"l":10,"m":"機関の具備","sb":"","i":"B","r":"(平28I問題4イ類・平22II問題3ウ類)","q":"設立しようとする株式会社が指名委員会等設置会社以外の取締役会設置会社である場合には，設立時取締役（設立しようとする株式会社が監査等委員会設置会社である場合には，設立時監査等委員である設立時取締役を除く）の中から設立時代表取締役を選定しなければならず，当該選定は，発起設立の場合は発起人の議決権の過半数をもって，募集設立の場合は創立総会の決議によって行う。","a":false,"c":"47条1項3項。","e":"設立時代表取締役の選定は，設立時取締役の過半数をもって決定する。これは，発起設立，募集設立に共通した規定となっている。なお，解職についても同様に，設立時取締役の過半数をもって決定する（47条２項３項）。"},{"l":11,"m":"機関の具備","sb":"","i":"B","r":"","q":"設立しようとする株式会社が指名委員会等設置会社である場合については，設立時取締役は，設立時委員および設立時執行役を選定および選任しなければならず，当該選定および選任は，設立時取締役の過半数をもって決定する。","a":true,"c":"48条1項3項。","e":"また，設立時取締役は，設立時執行役の中から設立時代表執行役を選定しなければならない。ただし，設立時執行役が１人であるときは，その者が設立時代表執行役に選定されたものとする（48条１項３号ただし書）。なお，解任および解職についても同様に，設立時取締役の過半数をもって決定する（48条２項３項）。"},{"l":1,"m":"設立過程の調査","sb":"","i":"A","r":"(平31II問題3ウ)","q":"定款に現物出資の記載がある場合，設立時取締役は，原則として，裁判所に対し，検査役の選任の申立てをしなければならない。","a":false,"c":"33条1項。","e":"変態設立事項は「危険なる約束」ともいわれ，これを発起人に自由に認めると，発起人の権限濫用により会社の財産的基礎を害するおそれがある。したがって，発起人は，定款に変態設立事項についての記載または記録があるときは，公証人の定款認証後遅滞なく，変態設立事項（28 条各号）を調査させるため，原則として，裁判所に対し，検査役の選任の申立てをしなければならない。"},{"l":2,"m":"設立過程の調査","sb":"","i":"C","r":"(平30II問題3ウ)","q":"現物出資に関する事項を調査するために裁判所により選任された検査役は，必要な調査を行い，当該調査の結果を記載した書面等を裁判所に提供して報告をしなければならない。","a":true,"c":"33条4項","e":"また，裁判所は，当該報告について，その内容を明瞭にし，またはその根拠を確認するため必要があると認めるときは，検査役に対し，さらに調査結果の報告を求めることができる（33条５項）。"},{"l":3,"m":"設立過程の調査","sb":"","i":"A","r":"(平26I問題3ア類)","q":"裁判所選任の検査役は，必要な調査を行った結果，変態設立事項を不当と認めたときは，これを変更する決定をしなければならない。","a":false,"c":"33条7項。","e":"変態設立事項についての変更の決定をするのは，検査役ではなく，裁判所である。まず，裁判所選任の検査役は，必要な調査を行い，当該調査の結果を記載した書面を裁判所に提供して報告する（33条４項）。そして，裁判所は，当該報告を受けて，変態設立事項を不当と認めたときは，これを変更する決定をしなければならない（33条７項）。"},{"l":4,"m":"設立過程の調査","sb":"","i":"B","r":"(令5II問題4イ類)","q":"発起人は，裁判所の決定により変態設立事項の全部または一部が変更された場合には，当該決定の確定後１週間以内に限り，裁判所の許可を得て，その設立時発行株式の引受けに係る意思表示を取り消すことができる。","a":false,"c":"33条8項。","e":"発起人は，裁判所の決定により変態設立事項の全部または一部が変更された場合には，当該決定の確定後１週間以内に限り，その設立時発行株式の引受けに係る意思表示を取り消すことができるが，その際に，裁判所の許可を得る必要はない。"},{"l":5,"m":"設立過程の調査","sb":"","i":"B","r":"","q":"発起設立において，裁判所の決定により変態設立事項の全部または一部が変更された場合，発起人は，その全員の同意によって，裁判所の決定の確定後１週間以内に限り，当該決定により変更された事項についての定めを廃止する定款の変更をすることができる。","a":true,"c":"33条9項。","e":"なお，募集設立の場合は，設立時募集株式の払込期日または払込期間の初日のうち最も早い日以後は，発起人全員の同意による定款の変更（33条９項，37条１項２項）が禁止されている（95条）。"},{"l":6,"m":"設立過程の調査","sb":"","i":"A","r":"","q":"発起設立において，公証人の認証を受けた定款は，株式会社の成立前は変更することができない。","a":false,"c":"30条2項。","e":"発起設立の場合，公証人の認証を受けた定款は，株式会社の成立前は，① 変態設立事項について検査役から報告を受けた裁判所が不当と認めた場合（33 条７項），② 裁判所に変更された事項について，発起人の全員の同意により廃止する場合（33 条９項），③ 発行可能株式総数を定款に定めていないときに，発起人の全員の同意により発行可能株式総数を定める場合（37 条１項），④ 発行可能株式総数を定款に定めているときに，発起人の全員の同意により発行可能株式総数を変更する場合（37条２項）にのみ，発起人の全員の同意をもって，定款を変更することが認められる。"},{"l":7,"m":"設立過程の調査","sb":"","i":"A","r":"(平26II問題3イ)","q":"発起設立においては，発起人全員の同意によって，公証人の認証を受けた定款を変更して，新たな変態設立事項を定めることができる。","a":false,"c":"30条2項。","e":"上記問題６の解説参照。①～④の事項に該当しないため，発起人の全員の同意によっても，定款を変更することはできない。"},{"l":8,"m":"設立過程の調査","sb":"","i":"A","r":"(令3問題3エ・平29II問題4ウ・平27II問題3エ)","q":"募集設立の場合，公証人の認証を受けた定款は，創立総会の決議により変更することができる。","a":true,"c":"96条。","e":"募集設立の場合，発起設立において定款の変更が認められる場合に加え，創立総会の決議によって定款を変更することができる。"},{"l":9,"m":"設立過程の調査","sb":"","i":"A","r":"(平27I問題3ア)","q":"募集設立の場合において，公証人による定款の認証を受けた後に，創立総会の決議により定款を変更した場合には，改めて公証人の認証を受ける必要がある。","a":false,"c":"","e":"募集設立の場合において，創立総会の決議により定款を変更した場合であっても，改めて公証人の認証を受ける必要はない。"},{"l":10,"m":"設立過程の調査","sb":"","i":"C","r":"(平31I問題4イ)","q":"募集設立の場合において，設立時募集株式と引換えにする金銭の出資の払込みの期日以後の定款の変更は，創立総会の決議によらなければならない。","a":true,"c":"95条,96条。","e":"募集設立の場合，発起設立において定款の変更が認められる場合に加え，創立総会の決議によって定款を変更することができる。また，設立時募集株式の払込期日または払込期間の初日のうち最も早い日以後は，発起人全員の同意による定款の変更（33条９項，37条１項２項）が禁止されている。"},{"l":11,"m":"設立過程の調査","sb":"","i":"A","r":"(令7I問題4エ・平28I問題4ア)","q":"募集設立の創立総会において，現物出資に関する定款所定の事項を変更する決議をした場合には，当該創立総会においてその変更に反対した設立時株主は，当該決議後２週間以内に限り，その設立時発行株式の引受けに係る意思表示を取り消すことができる。","a":true,"c":"97条。","e":""},{"l":12,"m":"設立過程の調査","sb":"","i":"A","r":"","q":"発行可能株式総数は，定款の絶対的記載事項であるため，公証人の認証を受ける定款には，発行可能株式総数が記載されていなければならない。","a":false,"c":"37条1項,27条各号参照。","e":"発行可能株式総数は，絶対的記載事項であるという記述は正しい（37条１項）。ただし，発行可能株式総数は，公証人の認証の対象となる原始定款に定められている必要はない（27条各号参照）。発行可能株式総数については，設立過程における株式の引受状況を勘案して，柔軟に定めることができるようにされているのである。"},{"l":13,"m":"設立過程の調査","sb":"","i":"A","r":"","q":"定款に記載された価額の総額が500万円を超えないことにより裁判所選任の検査役の調査が不要となる現物出資財産が存在する場合，発起人は，定款に記載された当該財産の価額が相当であることを調査しなければならない。","a":false,"c":"46条1項1号,93条1項1号。","e":"設立時取締役（設立しようとする株式会社が監査役設置会社である場合にあっては，設立時取締役および設立時監査役）は，その選任後遅滞なく，① 現物出資または財産引受の対象財産が，検査役の調査の省略が認められる少額免除または市場価格のある有価証券にあたる場合に，定款に記載された財産の価額が相当であること，② 現物出資および財産引受の対象たる財産について，弁護士等の証明により検査役の調査が免除される場合に，その証明が相当であること，③ 発起人による出資の履行が完了していること（募集設立においては発起人による出資の履行および設立時募集株式引受人による払込みが完了していること），④ 株式会社の設立の手続が法令・定款に違反していないことを調査しなければならない（46条１項，93条１項）。"},{"l":14,"m":"設立過程の調査","sb":"","i":"A","r":"(平28II問題3イ・平25I問題3ウ)","q":"発起設立において設立時取締役は，その選任後遅滞なく，設立の手続が法令または定款に違反していないことを調査しなければならない。","a":true,"c":"46条1項4号,93条1項4号。","e":"設立時取締役（設立しようとする株式会社が監査役設置会社である場合にあっては，設立時取締役および設立時監査役）は，その選任後，遅滞なく，株式会社の設立の手続が法令または定款に違反していないことを調査しなければならない。"},{"l":15,"m":"設立過程の調査","sb":"","i":"A","r":"(令4I問題3エ)","q":"発起設立と募集設立のいずれの場合においても，設立時取締役は，その選任後遅滞なく，出資の履行が完了していることを調査しなければならない。","a":true,"c":"46条1項3号,93条1項3号。","e":"設立時取締役（設立しようとする株式会社が監査役設置会社である場合にあっては，設立時取締役および設立時監査役）は，その選任後，遅滞なく，発起人による出資の履行（募集設立においては発起人による出資の履行および設立時募集株式引受人による払込みが完了していること）を調査しなければならない。"},{"l":16,"m":"設立過程の調査","sb":"","i":"A","r":"(令6II問題3ウ類・平30I問題3イ)","q":"設立時取締役および設立時監査役は，発起人が法令もしくは定款に違反する行為をし，またはこれらの行為をするおそれがある場合には，会社法に基づき，当該発起人に対し，当該行為をやめることを請求することができる。","a":false,"c":"","e":"発起設立において，設立時取締役（設立しようとする株式会社が監査役設置会社である場合にあっては，設立時取締役および設立時監査役）は，その選任後，遅滞なく，株式会社の設立の手続が法令または定款に違反していないことを調査しなければならず（46条１項４号），法令または定款に違反する事項や不当な事項があると認めるときは，発起人にその旨を通知しなければならない（同条２項）。しかし，本肢のような規定はない。"},{"l":17,"m":"設立過程の調査","sb":"","i":"B","r":"","q":"発起設立において，設立時取締役は，選任後の調査により，法令または定款に違反する事項や不当な事項があると認めるときは，発起人にその旨を通知しなければならない。","a":true,"c":"46条2項。","e":"なお，設立時監査役にも同様の報告義務が課されている。"},{"l":18,"m":"設立過程の調査","sb":"","i":"B","r":"","q":"募集設立において，設立時取締役は，出資の履行等の調査結果を，発起人に報告しなければならない。","a":false,"c":"93条2項。","e":"募集設立において，設立時取締役は，選任後の調査の結果を，創立総会に報告しなければならない。なお，設立時監査役にも同様の報告義務が課されている。"},{"l":19,"m":"設立過程の調査","sb":"","i":"C","r":"","q":"設立時取締役の全員が発起人である場合に限り，創立総会の決議によって，設立時取締役が調査すべき事項を調査する者を選任することができる。","a":false,"c":"94条1項。","e":"募集設立において，設立時取締役（設立しようとする株式会社が監査役設置会社である場合にあっては，設立時取締役および設立時監査役）の全部または一部が発起人である場合には，創立総会の決議によって，設立時取締役が調査すべき事項を調査する者を選任することができる。これは，発起人間の馴れ合いによる調査を防ぐためである。そして，選任された者は，必要な調査を行い，当該調査の結果を創立総会に報告しなければならない（94条２項）。"},{"l":1,"m":"設立の登記","sb":"","i":"A","r":"","q":"株式会社は，その本店の所在地において設立の登記をすることによって成立する。","a":true,"c":"49条。","e":"設立の登記がなされることによって，株式会社が成立し，法人格を取得することとなる。"},{"l":2,"m":"設立の登記","sb":"","i":"A","r":"(平28I問題3エ類・平23I問題3エ)","q":"発起人および設立時募集株式の引受人は，出資の履行をした日に，設立時発行株式の株主となる。","a":false,"c":"50条1項,102条2項。","e":"株式会社は，その本店の所在地において設立の登記をすることによって成立する（49条）。そして，発起人および設立時募集株式の引受人は，株式会社の成立の時に，出資の履行をした設立時発行株式の株主となる。"},{"l":3,"m":"設立の登記","sb":"","i":"A","r":"(令4II問題3イ類・平30II問題4ア類・平26I問題4ア類・平23II問題3ウ)","q":"発起人が出資の履行をすることにより設立時発行株式の株主となる権利の譲渡は，成立後の株式会社に対して，その効力を生じない。","a":false,"c":"35条。","e":"発起人が出資の履行をすることにより設立時発行株式の株主となる権利の譲渡は，成立後の株式会社に対抗することができない。これは，会社側の事務処理が煩雑になることを防止する趣旨である。なお，出資の履行後における権利株の譲渡も，同様に成立後の株式会社に対抗できないとされる（50条２項）。当該規定と同様の規定が，設立時募集株式の引受人に対しても設けられている（63条２項）。"},{"l":1,"m":"創立総会","sb":"","i":"C","r":"(平29II問題4エ)","q":"創立総会は，会社法に規定する事項および株式会社の設立その他株式会社に関する一切の事項について決議をすることができる。","a":false,"c":"66条。","e":"創立総会は，募集設立にだけ適用される規定（57条～103条）および株式会社の設立の廃止，創立総会の終結その他株式会社の設立に関する事項に限り，決議することができる。"},{"l":2,"m":"創立総会","sb":"","i":"B","r":"(令5II問題4ウ類・平31I問題3ア類)","q":"創立総会は，創立総会の目的である事項とされていなければ，株式会社の設立の廃止について決議をすることができない。","a":false,"c":"73条4項ただし書。","e":"創立総会は，原則として，創立総会の目的である事項以外の事項については決議することができない。ただし，定款の変更または株式会社の設立の廃止については，創立総会の目的である事項とされていなくても，決議することができる。なぜなら，これらの事項は，設立時株主にとって重大な影響を与えるものであり，創立総会において常に議決を認める必要があるからである。"},{"l":3,"m":"創立総会","sb":"","i":"B","r":"","q":"募集設立において，発起人は，設立時募集株式と引換えにする金銭の払込期日または払込期間の末日のうち最も遅い日以後，遅滞なく，創立総会を招集しなければならない。","a":true,"c":"65条1項。","e":"なお，発起人は必要があると認めるときは，いつでも，創立総会を招集することができる（65条２項）。"},{"l":4,"m":"創立総会","sb":"","i":"B","r":"(平29II問題4ア)","q":"設立時株主は，必要があると認めるときは，いつでも，創立総会を招集することができる。","a":false,"c":"65条参照。","e":"創立総会の招集権者は，設立中の会社の執行機関である発起人であり，問題文のような規定は存在しない。臨時創立総会（65条２項）の招集権者も発起人である。"},{"l":5,"m":"創立総会","sb":"","i":"B","r":"(令6I問題4イ)","q":"募集設立の場合において，設立時株主は，設立時取締役に対し，発行可能株式総数の変更を創立総会の目的とすることを請求することができる。","a":false,"c":"","e":"設立中の会社の執行機関は発起人であり，問題文のような規定は存在しない。そのため，設立時株主に創立総会の招集権や議題提案権等は認められていない。"},{"l":6,"m":"創立総会","sb":"","i":"B","r":"(令3問題3イ・平27I問題3イ)","q":"創立総会で設立の廃止を決議する場合には，その引き受けた設立時発行株式が議決権制限株式である設立時株主も，議決権を行使することができる。","a":true,"c":"72条3項。","e":"株式会社の設立に際し議決権制限株式（108 条１項３号）を発行する場合においては，設立時株主は，株主総会の場合に準じて，創立総会においても議決権が制限される（72条２項）。ただし，この場合であっても，株式会社の設立の廃止については，設立時株主は，その引き受けた設立時発行株式について議決権を行使することができる。株式会社の設立廃止は，すべての設立時株主にとって極めて重要な事項だからである。"},{"l":7,"m":"創立総会","sb":"","i":"B","r":"(令6II問題4エ類・平31I問題3イ・平24I問題3エ類)","q":"創立総会の決議は，当該創立総会において議決権を行使することができる設立時株主の議決権の過半数であって，出席した当該設立時株主の議決権の過半数をもって行う。","a":false,"c":"73条1項。","e":"創立総会の普通決議は，当該創立総会において議決権を行使することができる設立時株主の議決権の過半数であって，出席した当該設立時株主の議決権の３分の２以上に当たる多数をもって行う。これは，会社の設立に関して重要な事項を決定する創立総会の地位に鑑みて，その決議の慎重を期する趣旨から，このような厳格な要件となっている。"},{"l":8,"m":"創立総会","sb":"","i":"B","r":"(令3問題3ア類・平27I問題3エ)","q":"設立しようとする株式会社が種類株式発行会社である場合を除き，その発行する全部の株式を譲渡制限株式とする定款の変更についての創立総会の決議は，当該創立総会において議決権を行使することができる設立時株主の半数以上であって，当該設立時株主の議決権の３分の２以上に当たる多数をもって行う。","a":true,"c":"73条2項。","e":""},{"l":9,"m":"創立総会","sb":"","i":"B","r":"","q":"設立しようとする株式会社が種類株式発行会社である場合を除き，その発行する全部の株式を取得条項付株式とする定款の変更についての創立総会の決議は，当該創立総会において議決権を行使することができる設立時株主の半数以上であって，当該設立時株主の議決権の４分の３以上に当たる多数をもって行う。","a":false,"c":"73条3項。","e":"設立しようとする株式会社が種類株式発行会社である場合を除き，その発行する全部の株式を取得条項付株式とする定款の変更をしようとする場合には，設立時株主全員の同意を得なければならない。"},{"l":10,"m":"創立総会","sb":"","i":"A","r":"","q":"発起人は，創立総会において，設立時株主から特定の事項について説明を求められた場合であっても，当該事項が創立総会の目的である事項に関しないものである場合は，当該事項について必要な説明を拒むことができる。","a":true,"c":"78条。","e":"発起人は，創立総会において，設立時株主から特定の事項について説明を求められた場合には，当該事項について必要な説明をしなければならない。ただし，当該事項が創立総会の目的である事項に関しないものである場合，その説明をすることにより設立時株主の共同の利益を著しく害する場合として法務省令で定める場合は，当該事項の説明を拒むことができる。"},{"l":11,"m":"創立総会","sb":"","i":"A","r":"(令3問題3ウ・平30II問題4イ・平27I問題3ウ)","q":"創立総会において，設立時株主は，その有する議決権について，不統一行使する旨を発起人に請求することができない。","a":false,"c":"77条1項。","e":"創立総会の議決権の行使に関する規定は，株主総会に関する規定との対応が図られており，代理人による議決権行使（74条），書面投票制度・電子投票制度（75条，76条），議決権の不統一行使（77条）が認められている。"},{"l":12,"m":"創立総会","sb":"","i":"A","r":"(令7I問題4イ)","q":"創立総会においてその延期について決議があった場合には，発起人は，後日開催される創立総会について招集通知を発しなければならない。","a":false,"c":"80条,68条。","e":"創立総会においてその延期または続行について決議があった場合の規定は，株主総会に関する規定との対応が図られている。したがって，改めて創立総会の招集通知を発する必要はない。"},{"l":13,"m":"創立総会","sb":"","i":"A","r":"(平31I問題3ウ)","q":"設立時株主が創立総会の決議の取消しを求める訴えは，当該決議の日から３か月以内に提起しなければならない。","a":true,"c":"831条1項柱書かっこ書。","e":"創立総会の決議の瑕疵に関する規定は，株主総会に関する規定との対応が図られている。すなわち，株主等，設立時株主，設立時取締役または設立時監査役は，創立総会の決議取消しの訴えを，当該創立総会の決議の日から３か月以内に限り，提起することができる。"},{"l":1,"m":"設立の瑕疵","sb":"","i":"A","r":"(平30II問題4ウ類)","q":"株式会社の株主は，当該株式会社の設立取消しの訴えを提起することはできない。","a":true,"c":"832条参照。","e":"設立取消しの訴えは，持分会社にのみ認められている。"},{"l":2,"m":"設立の瑕疵","sb":"","i":"A","r":"","q":"会社の設立無効の訴えは，会社の成立の日から２年以内に，訴えをもってのみ主張することができる。","a":true,"c":"828条1項1号。","e":"法的安定性を確保するため，会社法は，設立無効の主張期間，主張権者，主張方法を制限することにより，無効の主張を可及的に制限している。"},{"l":3,"m":"設立の瑕疵","sb":"","i":"A","r":"(平29I問題7ウ)","q":"会社設立の無効の訴えを提起する権利は，少数株主権である。","a":false,"c":"828条2項1号。","e":"会社設立の無効の訴えを提起する権利は，単独株主権である。"},{"l":4,"m":"設立の瑕疵","sb":"","i":"A","r":"(令5II問題3ウ)","q":"発起人は，株式会社の成立後に株主の地位を失った場合であっても，株式会社の成立の日から２年以内に，当該株式会社の設立の無効の訴えを提起することができる。","a":false,"c":"828条2項1号。","e":"会社設立の無効の訴えの主張権者については，設立の無効を主張できるのは，設立する株式会社の株主等に限られる。ここで，条文の「設立する株式会社の株主」とは，提訴時に当該会社の株主であることを意味する。よって，株主の地位を失った場合は訴えを提起できない。"},{"l":5,"m":"設立の瑕疵","sb":"","i":"A","r":"(平28II問題3エ・平24II問題4イ・平22I問題3ア類)","q":"株式会社の債権者は，当該株式会社の成立の日から２年以内に，当該株式会社の設立の無効の訴えを提起することができる。","a":false,"c":"828条2項1号。","e":"設立無効の訴えを提起することができる主張権者は，株主等（株主，取締役または清算人（監査役設置会社では株主，取締役，監査役または清算人，指名委員会等設置会社では株主，取締役，執行役または清算人）をいう）に限られ，会社債権者は含まれない。"},{"l":6,"m":"設立の瑕疵","sb":"","i":"A","r":"(令2I問題3エ・平24II問題4エ)","q":"発起人がその債権者を害することを知って株式会社を設立した場合には，当該債権者は，当該株式会社の成立の日から２年以内に，当該株式会社の設立の取消しの訴えを提起することができる。","a":false,"c":"832条参照。","e":"設立取消しの訴えは，持分会社のみ規定されている。"},{"l":7,"m":"設立の瑕疵","sb":"","i":"A","r":"(平28II問題3ウ・平24II問題4ウ類)","q":"株式会社の設立の無効の訴えに係る請求を認容する確定判決は，第三者に対してその効力を有しない。","a":false,"c":"838条","e":"法律関係の画一的確定の観点から，設立無効判決は，第三者に対してもその効力を有する。すなわち，設立無効判決には対世的効力が認められているのである。"},{"l":8,"m":"設立の瑕疵","sb":"","i":"A","r":"(令2II問題3エ)","q":"株式会社の設立の無効の訴えに係る請求を認容する判決が確定したときは，当該株式会社の設立は，当該株式会社の成立の時に遡ってその効力を失う。","a":false,"c":"839条。","e":"株式会社の設立の無効の訴えに係る請求を認容する判決が確定したときは，法的安定性を確保するために判決の遡及効は阻止され，当該株式会社の設立は，将来に向かってその効力を失う（将来効）。"},{"l":9,"m":"設立の瑕疵","sb":"","i":"C","r":"(令5I問題4エ)","q":"株式会社の設立の無効の訴えに係る請求を認容する判決が確定した場合において，その無効の原因が一部の株主のみにあるときは，他の株主の全員の同意によって，当該株式会社を継続することができる。","a":false,"c":"845条参照。","e":"株式会社においては，相互に信頼関係のない無個性な株主を前提としているため，持分会社のような会社継続の規定（845 条）は設けられていない。なお，持分会社の社員間には人的信頼関係が存在し，その個性が重視されるため，１人の設立の意思表示が無効・取り消しうるものである限り，それ以外の者のみによる会社の設立を認めるべきではないが，他の社員が会社の継続を欲している場合には，社員の意思を尊重し，会社の継続を認めても問題はないため，他の社員全員の同意により会社を継続することが認められている。"},{"l":1,"m":"設立関係者の責任","sb":"","i":"A","r":"","q":"会社成立時における現物出資財産（裁判所選任の検査役の調査を経ていないものとする）の価額が定款記載額に著しく不足する場合は，発起人，設立時取締役および設立時監査役は，当該会社に対し，連帯して，当該不足額を支払う義務を負う。","a":false,"c":"52条1項参照。","e":"設立時監査役には，現物出資財産等の不足額填補責任は課せられていない。"},{"l":2,"m":"設立関係者の責任","sb":"","i":"A","r":"(平24I問題3ウ・平20問題2ア類)","q":"現物出資をした発起人は，裁判所が選任した検査役による調査を受けた場合であっても，株式会社の成立の時における当該現物出資に係る財産の価額が，定款に記載された価額に著しく不足するときは，その職務を怠らなかったことを証明した場合を除き，その不足額を支払う義務を負う。","a":false,"c":"52条2項柱書かっこ書。","e":"発起設立，募集設立を問わず，現物出資者である発起人，財産引受けにおける譲渡人である発起人は，いわば売主の地位にあり不当な利益を得ていることになるため，どんな場合においても無過失責任である。"},{"l":3,"m":"設立関係者の責任","sb":"","i":"A","r":"(令4I問題4ウ類・平28I問題4エ)","q":"募集設立において，株式会社の成立の時における現物出資財産の価額が定款所定の価額に著しく不足するときは，現物出資者以外の発起人および設立時取締役は，裁判所選任の検査役の調査を経た場合またはその職務を行うについて注意を怠らなかったことを証明した場合のいずれかに該当する場合を除き，当該株式会社に対し当該不足額を支払う義務を負う。","a":false,"c":"103条1項,52条2項2号。","e":"発起設立，募集設立を問わず，現物出資者である発起人，財産引受けにおける譲渡人である発起人以外の発起人および設立時取締役は，検査役の調査を経た場合を除き，発起設立においては，立証責任が転換された過失責任，募集設立においては無過失責任とされている。したがって，募集設立の場合は，その職務を行うについて注意を怠らなかったことを証明した場合であっても，裁判所選任の検査役の調査を経ていない場合は不足額填補責任を負うこととなるため，本肢は誤りである。"},{"l":4,"m":"設立関係者の責任","sb":"","i":"A","r":"(平20問題2ウ)","q":"発起設立において，現物出資を行った者以外の発起人は，検査役の調査を経ていないと，職務を行うについて注意を怠らなかったことを証明した場合でも，不足額の支払義務を免れることができない。","a":false,"c":"52条2項2号。","e":"発起設立の場合は，現物出資者である発起人および財産引受けにおける譲渡人である発起人以外の者の責任は，立証責任の転換された過失責任とされている。したがって，その職務を行うについて注意を怠らなかったことを証明した場合は，当該責任を負わない。"},{"l":5,"m":"設立関係者の責任","sb":"","i":"A","r":"(平20問題2イ類)","q":"募集設立において，発起人が出資した現物出資財産の価額が著しく不足する場合であっても，当該発起人以外の設立時取締役がその職務を行うについて注意を怠らなかったことを証明した場合は，当該設立時取締役は会社に対して，当該不足額を支払う義務を負わない。","a":false,"c":"103条1項,52条2項2号。","e":"募集設立の場合は，現物出資者である発起人および財産引受けにおける譲渡人である発起人以外の発起人および設立時取締役であっても，裁判所選任の検査役の調査を受けている場合を除き，無過失責任とされている。これは，十分な調査の機会が与えられることのない設立時募集株主を保護するためである。"},{"l":6,"m":"設立関係者の責任","sb":"","i":"B","r":"(平20問題2エ類)","q":"会社成立時における現物出資財産の価額が定款記載額に著しく不足する場合の発起人および設立時取締役に課せられる不足額填補責任は，総株主の同意があっても免除することができない。","a":false,"c":"55条。","e":"会社成立時における現物出資財産の価額が定款記載額に著しく不足する場合の発起人および設立時取締役に課せられる不足額填補責任は，総株主の同意があれば免除することができる。"},{"l":7,"m":"設立関係者の責任","sb":"","i":"B","r":"(平28I問題3イ)","q":"発起人は，自己が引き受けた設立時発行株式の出資に係る金銭の払込みを仮装した場合，株式会社に対し，払込みを仮装した出資に係る金銭の全額を支払う義務を負う。","a":true,"c":"52条の2第1項1号。","e":"株式会社の設立に際して出資の履行が仮装される場合には，本来拠出されるべき財産が拠出されていないにもかかわらず，外観上は出資の履行がされたものとして株式会社の設立が行われるため，出資の履行を仮装していない設立時株式引受人から出資の履行を仮装した者に対する不当な価値の移転が生じる。そのため，出資の履行を仮装した発起人等には，株式会社に対して，本来拠出すべきであった財産を拠出させ，他の設立時株式引受人から不当に移転を受けた価値を実質的に返還させることが相当である。そこで，会社法は，出資の履行を仮装した場合の責任を定めている。"},{"l":8,"m":"設立関係者の責任","sb":"","i":"B","r":"","q":"株式会社は，設立時発行株式の出資に係る金銭以外の財産の給付を仮装した発起人に対し，当該給付に代わる当該財産の価額に相当する金銭の支払を請求することができない。","a":false,"c":"52条の2第1項2号。","e":"発起人は，金銭以外の財産の給付を仮装した場合には，株式会社に対し，給付を仮装した出資に係る金銭以外の財産の全部の給付（株式会社が当該給付に代えて当該財産の価額に相当する金銭の支払を請求した場合は，当該金銭の全額の支払）をする義務を負う。現物出資が仮装された場合，株式会社の選択により，仮装した現物出資財産の給付か，金銭による支払いを請求することができることとしたのは，いったん現物出資財産の給付が仮装された場合には，株式会社として当該現物出資財産を給付させるのではなく，拠出されるはずだった価値を金銭で補償させることを望む場合もあると考えられるところ，そのような金銭補償の選択を認めることは，引受人が不当に移転を受けた価値の返還という目的との関係でも合理的であるからである。"},{"l":9,"m":"設立関係者の責任","sb":"","i":"B","r":"(令6II問題4イ)","q":"発起人が設立時発行株式の出資に係る金銭の払込みを仮装した場合，その出資の履行を仮装することに関与した発起人は，その職務を行うについて注意を怠らなかったことを証明した場合であっても，株式会社に対し，払込みを仮装した出資に係る金銭の全額の支払をする義務を負う。","a":false,"c":"52条の2第2項ただし書。","e":"発起人が金銭出資または金銭以外の財産の出資を仮装した場合には，その出資の履行を仮装することに関与した発起人は，株式会社に対し，出資の履行を仮装した発起人と同額の支払をする義務を負う。ただし，当該発起人（当該出資の履行を仮装したものを除く）がその職務を行うについて注意を怠らなかったことを証明した場合は，当該義務を負わない。"},{"l":10,"m":"設立関係者の責任","sb":"","i":"B","r":"","q":"発起人が設立時発行株式の出資に係る金銭の払込みを仮装した場合，その出資の履行を仮装することに関与した設立時取締役は，株式会社に対し，払込みを仮装した出資に係る金銭の全額の支払をする義務を負わない。","a":false,"c":"52条の2第2項。","e":"発起人が金銭出資または金銭以外の財産の出資を仮装した場合には，その出資の履行を仮装することに関与した設立時取締役として法務省令で定める者も，株式会社に対し， 出資の履行を仮装した発起人と同額の支払をする義務を負う。ただし，その者（当該出資の履行を仮装したものを除く）がその職務を行うについて注意を怠らなかったことを証明した場合は，当該義務を負わない。"},{"l":11,"m":"設立関係者の責任","sb":"","i":"B","r":"","q":"発起人は，設立時発行株式の出資に係る金銭の払込みを仮装した場合には，払込みを仮装した出資に係る金銭の全額の支払がされた後でなければ，出資の履行を仮装した設立時株式について，設立時株主および株主の権利を行使することができない。","a":true,"c":"52条の2第4項。","e":"仮装した発起人による支払義務等が履行されない間は，本来拠出されるべき財産が拠出されていない以上，当該発起人に株主の権利の行使を認めるのは相当でないためである。"},{"l":12,"m":"設立関係者の責任","sb":"","i":"B","r":"(平28II問題4ウ類)","q":"発起人により出資の履行が仮装された設立時発行株式を譲り受けた者は，その者に悪意または重大な過失がある場合を除き，当該設立時発行株式についての設立時株主および株主の権利を行使することができる。","a":true,"c":"52条の2第5項。","e":"発起人が出資の履行を仮装した場合において，出資の履行が仮装された当該設立時発行株式またはその株主となる権利を譲り受けた者は，その者が出資の履行の仮装について悪意または重大な過失がない限り，当該設立時発行株式についての設立時株主および株主の権利を行使することができる。出資の履行が仮装されたことを知らずに株式を譲り受けた者についてまで株主の権利の行使を認めないこととすると，株式取引の安全を害するためである。"},{"l":13,"m":"設立関係者の責任","sb":"","i":"B","r":"(令4I問題4エ)","q":"設立時発行株式の払込みを仮装した設立時募集株式の引受人は，株式会社に対し，払込みを仮装した払込金額の全額の支払をする義務を負う。","a":true,"c":"102条の2第1項。","e":"当該責任は，無過失責任である。また，払込みを仮装することに関与した発起人または設立時取締役についても，発起人が出資の履行を仮装した場合と同様の責任（52条の２第２項）を負う（103条２項）。"},{"l":14,"m":"設立関係者の責任","sb":"","i":"B","r":"","q":"設立時募集株式引受人が設立時募集株式の払込金額の払込みを仮装したことによる支払義務を免除するためには，総株主の同意は不要である。","a":false,"c":"102条の2第2項。","e":"設立時募集株式引受人が設立時募集株式の払込金額の払込みを仮装したことによる支払義務を免除するためには，総株主の同意を要する。これは，払込みを仮装することに関与した発起人または設立時取締役の支払義務を免除する際も同様である（103条３項）。さらに，発起人が出資の履行を仮装した場合の当該発起人および出資の履行を仮装することに関与した発起人または設立時取締役の支払義務を免除する場合も総株主の同意が必要である（55条）。"},{"l":15,"m":"設立関係者の責任","sb":"","i":"B","r":"(令4II問題3ウ類)","q":"設立時募集株式引受人は，設立時募集株式の出資に係る払込みを仮装した場合には，当該設立時募集株式引受人の支払，または，払込みを仮装することに関与した発起人または設立時取締役の支払がされた後でなければ，払込みを仮装した設立時発行株式について，設立時株主および株主の権利を行使することができない。","a":true,"c":"102条3項。","e":""},{"l":16,"m":"設立関係者の責任","sb":"","i":"B","r":"(平28II問題4ウ類)","q":"設立時募集株式引受人により払込みが仮装された設立時発行株式の株主となる権利を譲り受けた者は，当該設立時発行株式についての設立時株主および株主の権利を行使することができる。","a":false,"c":"102条4項。","e":"設立時募集株式引受人により払込みが仮装された設立時発行株式の株主となる権利を譲り受けた者は，その者が払込みの仮装について悪意または重大な過失がない限り，当該設立時発行株式についての設立時株主および株主の権利を行使することができる。"},{"l":17,"m":"設立関係者の責任","sb":"","i":"A","r":"","q":"発起人は，株式会社の設立についてその任務を怠ったときは，当該株式会社に対して，これによって生じた損害を賠償する責任を負う。","a":true,"c":"53条1項。","e":"会社の成立を前提とした，発起人等の会社に対する損害賠償責任であり，成立後の役員等の会社に対する損害賠償責任（423 条）と同趣旨の規定である。なお，設立時取締役および設立時監査役も，会社に対して，同様の責任を負う。"},{"l":18,"m":"設立関係者の責任","sb":"","i":"A","r":"(平30I問題3ウ類・平29I問題4ウ類・平22I問題3イ類)","q":"設立時取締役は，株式会社の設立についてその任務を怠ったときは，これによって第三者に生じた損害を賠償する責任を負う。","a":false,"c":"53条2項。","e":"設立時取締役がその職務を行うについて悪意または重大な過失があったときは，当該設立時取締役は，これによって第三者に生じた損害を賠償する責任を負う。これは，会社の成立を前提とした，発起人等の第三者に対する損害賠償責任であり，成立後の役員等の第三者に対する損害賠償責任（429 条）と同趣旨の規定である。なお，発起人および設立時監査役も，第三者に対して，同様の責任を負う。"},{"l":19,"m":"設立関係者の責任","sb":"","i":"A","r":"(令6I問題3エ類・平30I問題3エ)","q":"設立時取締役の任務懈怠に基づく会社に対する損害賠償責任は，総株主の同意がなければ免除することができない。","a":true,"c":"53条1項,55条。","e":"発起人，設立時取締役または設立時監査役は，株式会社の設立についてその任務を怠ったときは，当該株式会社に対して，連帯して，損害賠償責任を負う（53条１項，54条）。当該責任は，総株主の同意がなければ免除することができない。"},{"l":20,"m":"設立関係者の責任","sb":"","i":"A","r":"","q":"発起人，設立時取締役または設立時監査役が第三者に生じた損害を賠償する責任を負う場合において，他の発起人，設立時取締役または設立時監査役も当該損害を賠償する責任を負うときは，これらの者は，連帯債務者とする。","a":true,"c":"54条。","e":""},{"l":21,"m":"設立関係者の責任","sb":"","i":"A","r":"(令6II問題3エ類・平30II問題4エ類・平24II問題4ア類)","q":"株式会社が成立しなかったときは，発起人および設立時取締役は，連帯して，株式会社の設立に関してした行為についてその責任を負い，株式会社の設立に関して支出した費用を負担する。","a":false,"c":"56条。","e":"会社不成立の場合，発起人は，連帯して，株式会社の設立に関してした行為についてその責任を負い，株式会社の設立に関して支出した費用を負担する。すなわち，設立時取締役は，会社不成立の場合の責任を負わない。本来，会社不成立の場合には，設立中の会社が目的の不到達により解散したと評価できるため，清算をして残余財産があるならば，構成員に分配すれば足りるはずである。しかし，それでは設立時募集株式引受人の保護が不十分である。したがって，多数説は，本条を，設立時募集株式引受人保護のため，会社の設立に関してなした行為から生じた債務について，発起人に全責任を負わせる政策的規定であると解している（政策説）。"},{"l":22,"m":"設立関係者の責任","sb":"","i":"A","r":"(平29I問題3イ)","q":"募集設立において，出資に係る金銭の払込みの取扱いをした銀行が，発起人の請求に基づき，出資として払い込まれた金額に相当する金銭の保管に関する証明書を交付した場合には，当該銀行は，出資として払い込まれた金銭の返還に関する制限の特約があるときも，成立後の株式会社にそのことを対抗することができない。","a":true,"c":"64条2項。","e":"募集設立の場合には，財産の保管状況を明らかにすることにより，設立時募集株式引受人の保護を図る必要があるため，払込取扱機関には保管証明責任が課せられている。また，預合いなどによる会社設立の弊害を防止するとともに，払込取扱機関が証明した払込金を成立後の会社が完全に引き出せることができるようにすることで，成立後の会社の財産的基礎の確保を図る必要がある。"},{"l":23,"m":"設立関係者の責任","sb":"","i":"C","r":"","q":"募集設立において，払込取扱機関は，会社成立前に発起人または設立時取締役から払込金の返還の請求があった場合は，当該払込金の返還に応じなければならない。","a":false,"c":"最判昭37年3月2日。","e":"判例によると，保管証明書を交付した払込取扱機関は，会社成立の時まで払込金額を保管してこれを会社に引渡すべきものであって，会社成立前に発起人または設立時取締役に払込金を返還しても，その後成立した会社に対し払込金返還をもって対抗できないとしている。これに対して，発起設立の場合には，払込金保管証明制度がないため，会社成立前に払込取扱機関に対し，払込金の返還請求をすることが認められている。つまり，設立登記の申請時においても，預金通帳等により払込みがされた事実を証明することができればよく，発起人が成立前に払込金を引き出して設立費用の支払いに用いることは可能である。"},{"l":24,"m":"設立関係者の責任","sb":"","i":"B","r":"(令4I問題4イ類・平28II問題3ア)","q":"発起人でない者は，設立時募集株式の募集の広告に自己の氏名および株式会社の設立を賛助する旨を記載することを承諾した場合には，会社法上の発起人としての責任を負う。","a":true,"c":"103条4項。","e":"擬似発起人の責任である。その趣旨は，外観を信頼した設立時募集株式引受人を保護することにあるため，募集設立の場合にのみ発生する責任となっている。ここで，擬似発起人の責任の範囲は，発起人と同一の責任である。すなわち，目的物不足額填補責任（52条），出資の履行を仮装した場合の責任（52条の２），任務懈怠に基づく会社に対する責任（53条１項），任務懈怠に基づく第三者に対する責任（53条２項）および会社不成立の場合の責任（56条）である。この場合，責任の内容，過失の有無，免除の取扱いなどは発起人と同様である。"},{"l":25,"m":"設立関係者の責任","sb":"","i":"A","r":"(平31II問題3エ)","q":"株式会社の成立の時における現物出資財産等の価額が当該現物出資財産等について定款に記載された価額に著しく不足する場合の責任は，株主による責任追及等の訴えの対象となる。","a":true,"c":"847条1項本文。","e":"株式会社の成立時における現物出資財産および財産引受財産の価額が，定款記載額に著しく不足するときは，発起人および設立時取締役は，株式会社に対し，連帯して，当該不足額を支払う義務を負う（52 条１項）。ここで，当該不足額填補責任を負う発起人および設立時取締役の責任を追及する訴えは，責任追及等の訴えの対象となる。"}]},{"n":5,"name":"資金調達","qs":[{"l":1,"m":"募集株式の発行等","sb":"公開会社における授権限度の法定","i":"B","r":"(令5I問題3エ類・平30II問題3ア・平25I問題4ア類)","q":"設立しようとする株式会社が公開会社である場合には，設立時発行株式の総数は，発行可能株式総数の２分の１を下ることができない。","a":false,"c":"37条3項本文。","e":"公開会社においては，機動的な資金調達を重視して，授権資本制度により募集株式の発行等の決定を取締役会が決定することとしている。しかし，発行可能株式総数が多すぎると，取締役会の権限が強大になり，その権限を濫用するおそれがある。そこで，会社法は，授権限度を法定することにより，そのような権限濫用の危険性を回避しているのである。また，授権限度を定めることにより，既存株主が受ける持株比率の低下の限界を既存株主に示すこともできる。したがって，設立しようとする株式会社が公開会社である場合には，設立時発行株式の総数は，発行可能株式総数の４分の１を下ることができない。"},{"l":2,"m":"募集株式の発行等","sb":"公開会社における授権限度の法定","i":"B","r":"","q":"公開会社でない株式会社が定款を変更して公開会社となる場合には，当該定款の変更後の発行可能株式総数は，当該定款の変更が効力を生じた時における発行済株式総数の４倍を超えることができない。","a":true,"c":"113条3項2号。","e":"非公開会社が定款を変更して公開会社となる場合には，当該定款の変更後の発行可能株式総数は，当該定款の変更が効力を生じた時における発行済株式総数の４倍を超えることができない。また，公開会社が定款を変更して発行可能株式総数を増加する場合には，当該定款の変更後の発行可能株式総数は，当該定款の変更が効力を生じた時における発行済株式総数の４倍を超えることができない（113条３項１号）。"},{"l":3,"m":"募集株式の発行等","sb":"公開会社における授権限度の法定","i":"B","r":"","q":"株式の併合の効力発生日における発行可能株式総数は，効力発生日における発行済株式総数の４倍を超えることができない。","a":false,"c":"180条3項。","e":"公開会社において，株式の併合の効力発生日における発行可能株式総数は，効力発生日における発行済株式総数の４倍を超えることができない。"},{"l":1,"m":"募集株式の発行等","sb":"募集事項の決定","i":"A","r":"","q":"株式会社が募集株式の発行等をしようとする場合において，金銭以外の財産を出資の目的とするときは，その旨ならびに当該財産の内容および価額を定款で定めなければならない。","a":false,"c":"199条1項3号。","e":"株式会社が募集株式の発行等をしようとする場合，金銭以外の財産を出資の目的とするときは，その旨ならびに当該財産の内容および価額を募集事項で定める。株式会社の設立時のように定款で定めることは求められていない。"},{"l":2,"m":"募集株式の発行等","sb":"募集事項の決定","i":"A","r":"(平22II問題6イ)","q":"募集株式の発行等において，現物出資が認められるのは，株主割当ての方法による場合に限られる。","a":false,"c":"199条1項3号。","e":"募集株式の発行等において，現物出資が認められるのは，株主割当ての方法による場合に限られない。"},{"l":3,"m":"募集株式の発行等","sb":"募集事項の決定","i":"A","r":"","q":"募集事項は，募集ごとに均等に定めなければならない。","a":true,"c":"199条5項。","e":""},{"l":4,"m":"募集株式の発行等","sb":"募集事項の決定","i":"A","r":"","q":"会社法は，株式会社が自己株式の処分をしようとする場合に規制を課していない。","a":false,"c":"","e":"募集株式の発行等とは，募集株式の発行と自己株式の処分の両方を含んだ概念である。会社法は，この募集株式の発行と自己株式の処分について，同様の手続規制を設けている（199条～213条の３）。"},{"l":5,"m":"募集株式の発行等","sb":"募集事項の決定","i":"A","r":"(平25II問題13ウ・平23II問題6ウ)","q":"株式会社は，その処分する自己株式を引き受ける者の募集をしようとするときは，増加する資本金および資本準備金に関する事項を定めなければならない。","a":false,"c":"199条1項5号。","e":"株式会社は，その発行する株式を引き受ける者の募集をしようとするときは，増加する資本金および資本準備金に関する事項を定めなければならない。株式会社が自己株式を処分しても，それによって資本金および資本準備金は増加しない。"},{"l":6,"m":"募集株式の発行等","sb":"募集事項の決定","i":"B","r":"(平27II問題4ア類)","q":"株式会社が募集株式の発行等を行う場合には，いかなる場合であっても，募集事項において，募集株式の払込みを要しないこととすることは認められない。","a":false,"c":"202条の2第1項柱書前段,199条1項2号4号。","e":"募集株式の発行等の場合は，上場会社において取締役の報酬等として株式報酬を付与する場合を除き，募集事項において，募集株式の払込みを要しないこととすることは認められない。"},{"l":1,"m":"募集株式の発行等","sb":"株主割当て以外の方法による募集株式の発行等の決定","i":"A","r":"(平28II問題5ア類)","q":"公開会社において，株主割当て以外の方法による募集株式の発行等の決定は，原則として，取締役会の決議によらなければならない。","a":true,"c":"199条2項,201条1項。","e":"公開会社では，資金調達の機動性が重視されるとともに，株主は市場から株式を買うことにより持株比率を回復することができることから，会社の資金調達の利益を優先しているのである。"},{"l":2,"m":"募集株式の発行等","sb":"株主割当て以外の方法による募集株式の発行等の決定","i":"A","r":"","q":"公開会社でない株式会社において，株主割当て以外の方法による募集株式の発行等の決定は，原則として，株主総会の普通決議によらなければならない。","a":false,"c":"199条2項,200条1項,309条2項5号。","e":"非公開会社において，株主割当て以外の方法による募集株式の発行等の決定は，原則として，株主総会の特別決議によらなければならない。非公開会社では，機動的な資金調達の必要性が低く，株主間の緊密な信頼関係を維持する必要がある。また，株主は持株比率を維持するために市場から株式を調達することが困難であることから，募集株式の発行等の決定は株主総会の特別決議を必要とし，既存株主を強く保護しているのである。"},{"l":3,"m":"募集株式の発行等","sb":"株主割当て以外の方法による募集株式の発行等の決定","i":"B","r":"","q":"種類株式発行会社である公開会社が株主割当て以外の方法により譲渡制限株式を募集する場合，募集事項の決定は，株主総会の特別決議が必要である。","a":false,"c":"199条4項,324条2項2号。","e":"種類株式発行会社である公開会社が株主割当て以外の方法により譲渡制限株式を募集する場合，募集事項の決定は，有利発行の場合を除いて，取締役会の決議のほか，当該譲渡制限株式の株主を構成員とする種類株主総会の特別決議が必要とされる。なぜなら，当該譲渡制限株主は持株比率の維持に関心を有していると考えられるため，会社支配的不利益を受けることを保護する必要があるためである。ただし，当該種類株主総会の決議を要しない旨の定款の定めがある場合，または，当該種類株主総会において議決権を行使することができる種類株主が存在しない場合には，種類株主総会の特別決議は不要である（199条４項）。"},{"l":4,"m":"募集株式の発行等","sb":"株主割当て以外の方法による募集株式の発行等の決定","i":"B","r":"(平23II問題6イ)","q":"公開会社において市場価格のある株式を引き受ける者を募集するときは，募集株式の払込金額またはその算定方法に代えて，公正な価額による払込みを実現するために適当な払込金額の決定方法を定めることができる。","a":true,"c":"201条2項。","e":"公開会社においてこの特例が認められるのは，市場価格のある株式の株価は日々変動しているため，市場の投資家の動向に即して募集株式の払込金額を決定する必要があるからである。"},{"l":5,"m":"募集株式の発行等","sb":"株主割当て以外の方法による募集株式の発行等の決定","i":"B","r":"","q":"金融商品取引法第２条 16 項に規定する金融商品取引所に上場されている株式を発行している株式会社は，取締役の報酬等として当該株式会社の募集株式を株式報酬として付与するときは，募集株式を割り当てる日を募集事項として定めなければならない。","a":true,"c":"202条の2第1項2号。","e":"金融商品取引法第２条16項に規定する金融商品取引所に上場されている株式を発行している株式会社（上場会社）は，取締役の報酬等として当該株式会社の募集株式を株式報酬（361 条１項３号）として付与するときは，募集株式の払込金額またはその算定方法（199 条１項２号），および募集株式と引換えにする金銭の払込みまたは現物出資財産の給付の期日またはその期間（同条項４号）を定めることを要しない（202条の２第１項前段）。この場合においては，以下の事項を募集事項として追加で定めなければならない（同条項後段）。(ⅰ) 取締役の報酬等として募集株式の発行等をするものであり，募集株式と引換えにする金銭の払込みまたは現物出資財産の給付を要しない旨(ⅱ) 募集株式を割り当てる日（割当日）"},{"l":6,"m":"募集株式の発行等","sb":"株主割当て以外の方法による募集株式の発行等の決定","i":"B","r":"(令5I問題5イ)","q":"金融商品取引法第２条 16 項に規定する金融商品取引所に上場されている株式を発行している株式会社は，取締役の報酬等として自己株式を処分することはできない。","a":false,"c":"361条1項3号,199条1項。","e":"取締役に報酬等として株式を付与する場合，自己株式を処分して取締役の報酬等とすることも可能である。"},{"l":7,"m":"募集株式の発行等","sb":"株主割当て以外の方法による募集株式の発行等の決定","i":"B","r":"","q":"公開会社において，株主割当て以外の方法により募集株式の発行等を行う場合に，募集株式の払込金額が募集株式を引き受ける者に特に有利な金額であるときは，当該決定は株主総会の特別決議を要し，取締役は当該株主総会において特に有利な金額での発行を必要とする理由を説明しなければならない。","a":true,"c":"199条3項,201条1項,199条2項,309条2項5号。","e":"業務提携や資金調達の目的を達成するためには，有利発行が必要な場合もあるため，会社法は，株主総会の特別決議において取締役が有利発行する理由を説明することを要求することで，有利発行をすることを認めているのである。"},{"l":8,"m":"募集株式の発行等","sb":"株主割当て以外の方法による募集株式の発行等の決定","i":"B","r":"","q":"公開会社でない株式会社において，株主割当て以外の方法による募集株式の発行等を行う場合に，募集株式の払込金額が募集株式を引き受ける者に特に有利な金額であるときは，当該決定は株主総会の特別決議を要するが，取締役には特に有利な金額での発行を必要とする理由の説明義務は課せられてない。","a":false,"c":"199条3項,201条1項。","e":"公開会社であるか否かにかかわらず，有利発行が行われる場合は，取締役の株主総会における説明義務が課せられる。"},{"l":9,"m":"募集株式の発行等","sb":"株主割当て以外の方法による募集株式の発行等の決定","i":"B","r":"(平22I問題7ア類)","q":"公開会社でない株式会社において，株主割当て以外の方法による募集株式の発行等を行う際に，募集事項を決定した場合は，払込期日または払込期間の初日の２週間前までに，株主に対して募集事項を通知しなければならない。","a":false,"c":"","e":"公開会社において，募集事項を定めた場合（有利発行を除く）は，払込期日または払込期間の初日の２週間前までに，株主に対して募集事項を通知または公告しなければならない（201 条３項４項）。この趣旨は，株主に募集株式発行等の差止請求権（210 条）の行使の機会を与えるためである。これに対して，非公開会社においては，募集事項の決定については株主総会の特別決議が要求されているため（取締役・取締役会に委任される場合も特別決議が必要），募集事項の詳細を株主は知っていることから，株主への通知または公告は不要とされている。"},{"l":10,"m":"募集株式の発行等","sb":"株主割当て以外の方法による募集株式の発行等の決定","i":"C","r":"","q":"公開会社が募集事項について，払込期日または払込期間の初日の２週間前までに，有価証券届出書を提出している場合は，募集事項を公告することで足りる。","a":false,"c":"201条5項。","e":"公開会社が募集事項において，払込期日または払込期間の初日の２週間前までに，有価証券届出書を提出している場合は，募集事項の通知または公告は不要である。"},{"l":11,"m":"募集株式の発行等","sb":"株主割当て以外の方法による募集株式の発行等の決定","i":"B","r":"(平23II問題6ア類)","q":"公開会社でない取締役会設置会社において，株主割当て以外の募集株式の発行等の決定を，株主総会の特別決議によって取締役会に委任することができる。","a":true,"c":"200条1項前段,309条2項5号。","e":"この場合には，株主総会の特別決議によって，その委任に基づいて募集事項の決定をすることができる募集株式の数の上限および払込金額の下限を定めなければならない（200条１項後段）。"},{"l":12,"m":"募集株式の発行等","sb":"株主割当て以外の方法による募集株式の発行等の決定","i":"B","r":"","q":"公開会社において，株主割当て以外の方法による募集株式の発行等を行う際に，募集株式を引き受ける者に特に有利な金額である募集株式の発行等の決定を，株主総会の特別決議によって取締役会に委任することは認められない。","a":false,"c":"200条1項。","e":"公開会社であるか否かを問わず，株式会社は，募集株式を引き受ける者に特に有利な金額である募集株式の発行等を，株主総会の特別決議によって取締役（取締役会設置会社では取締役会）に委任することができる。委任に基づいて決定することができる払込金額の下限が募集株式を引き受ける者に特に有利である場合には，取締役は，募集事項の決定を取締役（取締役会設置会社では取締役会）に委任をする株主総会の特別決議において，当該払込金額でその者の募集をすることを必要とする理由を説明しなければならない（200条２項）。"},{"l":13,"m":"募集株式の発行等","sb":"株主割当て以外の方法による募集株式の発行等の決定","i":"C","r":"","q":"株主割当て以外の方法による募集株式の発行等を行う際に，募集事項の決定を取締役または取締役会に委任する株主総会の特別決議は，払込期日または払込期間の末日が当該決議の日から１年以内の日である募集事項についてのみその効力を有する。","a":true,"c":"200条3項。","e":""},{"l":1,"m":"募集株式の発行等","sb":"株主割当ての方法による募集株式の発行等の決定","i":"A","r":"","q":"指名委員会等設置会社および監査等委員会設置会社を除く公開会社における株主割当ての方法による募集株式の発行等の決定は，取締役会の決議によって，取締役に委任することができる。","a":false,"c":"202条3項3号。","e":"指名委員会等設置会社および監査等委員会設置会社を除く公開会社における株主割当ての方法による募集株式の発行等の決定は，取締役会の決議によっても，取締役に委任することができない。"},{"l":2,"m":"募集株式の発行等","sb":"株主割当ての方法による募集株式の発行等の決定","i":"A","r":"(令6II問題6ウ・平31I問題7エ類・平26II問題6イ類)","q":"公開会社でない株式会社における株主割当ての方法による募集株式の発行等の決定は，定款に別段の定めがある場合を除き，株主総会の特別決議によらなければならない。","a":true,"c":"202条3項4号,309条2項5号。","e":"非公開会社では，株主間の緊密な信頼関係を維持する必要があり，既存株主は通常，持株比率の維持に関心を有しているところ，募集株式の引受けの申込みおよび払込みをしなければ持株比率の低下による会社支配的不利益を受けるおそれがあるため，株主割当てとはいえども，株主総会の特別決議を要求しているのである。ただし，募集事項その他の決定を取締役の決定（取締役会設置会社では取締役会の決議）によって定めることができる旨の定款の定めがある場合は，当該募集事項その他の決定は取締役の決定（取締役会設置会社では取締役会の決議）によって定めなければならない（202条３項１号２号）。"},{"l":3,"m":"募集株式の発行等","sb":"株主割当ての方法による募集株式の発行等の決定","i":"B","r":"(平23II問題6エ)","q":"取締役会設置会社でない株式会社が，株主に株式の割当てを受ける権利を与える方法で募集株式の発行等をする場合，募集事項を取締役の決定によって定めることができる旨を定款に定めることができる。","a":true,"c":"202条3項1号。","e":"なお，公開会社でない取締役会設置会社においては，株主割当ての方法による募集株式の発行等を取締役会の決議によって定めることができる旨の定款の定めを設けることができる（202条３項２号）。"},{"l":4,"m":"募集株式の発行等","sb":"株主割当ての方法による募集株式の発行等の決定","i":"B","r":"","q":"株主割当ての方法による募集株式の発行等の際に，ある種類株式を有する種類株主に対して，他の種類の株式を割り当てることを定めることができる。","a":false,"c":"202条1項1号かっこ書。","e":"種類株式発行会社において，株主割当ての方法による募集株式の発行等の際に，ある種類株式を有する種類株主に対して，他の種類の株式を割り当てることを定めることができない。すなわち，種類株主が有する種類の株式と同一種類の株式を割当てなければならないのである。"},{"l":5,"m":"募集株式の発行等","sb":"株主割当ての方法による募集株式の発行等の決定","i":"B","r":"(平26II問題6ア)","q":"株式会社が自己株式を有するときは，株主である当該株式会社は，募集株式の割当てを受ける権利を有しない。","a":true,"c":"202条2項本文かっこ書。","e":""},{"l":6,"m":"募集株式の発行等","sb":"株主割当ての方法による募集株式の発行等の決定","i":"C","r":"","q":"株主割当ての方法による募集株式の発行等において，株主が割当てを受ける募集株式の数に１株に満たない端数があるときは，これを切り捨てるものとする。","a":true,"c":"202条2項ただし書。","e":""},{"l":7,"m":"募集株式の発行等","sb":"株主割当ての方法による募集株式の発行等の決定","i":"A","r":"(令6II問題6イ・令3問題6ア類・平28II問題5イ類・平26II問題6ウ類)","q":"株式会社は，募集事項その他の決定事項を定めた場合には，引受けの申込期日の２週間前までに，割当てを受ける権利を与える株主に対して，募集事項等を通知または公告しなければならない。","a":false,"c":"202条4項。","e":"株式会社は，募集事項その他の決定事項を定めた場合には，引受けの申込期日の２週間前までに，割当てを受ける権利を与える株主に対して，募集事項を必ず通知しなければならない。これは，株主の募集株式の引受けの申込みの機会を確保する趣旨である。したがって，公告によることは認められないため，本肢は誤りである。"},{"l":8,"m":"募集株式の発行等","sb":"株主割当ての方法による募集株式の発行等の決定","i":"A","r":"(令6II問題6ア)","q":"公開会社は，募集事項のほか，募集株式の割当てに係る基準日を定めることを要し，かつ，基準日の２週間前までに，当該基準日および基準日株主が行使することができる権利の内容を公告しなければならない。","a":false,"c":"199条1項各号,202条1項各号参照。","e":"募集株式の発行等を行う株式会社が公開会社であるか否かに関わらず，募集事項の決定の際に，募集株式の割当てに係る基準日を定める必要はない。なお，任意で募集株式の割当てに係る基準日を定めた場合において，定款に当該基準日および基準日株主が行使することができる権利の内容についての定めがないときは，当該基準日および基準日株主が行使することができる権利の内容を公告しなければならない（124条３項）。"},{"l":1,"m":"募集株式の発行等","sb":"募集株式の申込み","i":"C","r":"","q":"株式会社が金融商品取引法における目論見書を募集株式を引き受けようとする者に交付している場合であっても，会社法で求められている申込みをしようとする者に対しての募集事項等の通知が必要となる。","a":false,"c":"203条4項。","e":"株式会社が金融商品取引法における目論見書を募集株式を引き受けようとする者に交付している場合は，会社法で求められている申込みをしようとする者に対しての募集事項等の通知が不要となる。"},{"l":2,"m":"募集株式の発行等","sb":"募集株式の申込み","i":"C","r":"","q":"募集株式を引き受けようとする者がその総数の引き受けを行う契約を締結する場合であっても，申込みをしようとする者に対しての募集事項等の通知が必要となる。","a":false,"c":"205条1項。","e":"総数引受けの場合，申込みの規制（203 条）は適用されない。なぜなら，総数を引き受ける契約を締結する場合には，当該引受人に対して必要な情報が契約の段階で提供されていると考えられるためである。"},{"l":3,"m":"募集株式の発行等","sb":"募集株式の申込み","i":"B","r":"","q":"金融商品取引法第２条 16 項に規定する金融商品取引所に上場されている株式を発行している株式会社において取締役の報酬等として株式報酬を付与する場合，当該株式報酬を受ける取締役（取締役であった者を含む）以外の者は，申込みをすることはできない。","a":true,"c":"205条3項。","e":"上場会社において取締役の報酬等として株式報酬を付与する場合，当該株式報酬を受ける取締役（取締役であった者を含む）以外の者は，申込みをすることはできない。"},{"l":1,"m":"募集株式の発行等","sb":"募集株式の割当て","i":"B","r":"","q":"株式会社は，株主割当て以外の方法による募集株式の発行等をする場合において，総数引受契約を締結する場合を除き，申込者の中から募集株式の割当てを受ける者を定め，かつ，その者に割り当てる募集株式の数を定めなければならない。この場合において，当該申込者に割り当てる募集株式の数を申込者が引き受けようとする募集株式の数よりも減少することができる。","a":true,"c":"204条1項。","e":"割当自由の原則である。"},{"l":2,"m":"募集株式の発行等","sb":"募集株式の割当て","i":"B","r":"","q":"取締役会設置会社において，株主割当て以外の方法による募集株式の発行等をする場合において，募集株式が譲渡制限株式である場合は，割当先の決定は，定款に別段の定めがある場合を除き，株主総会の特別決議によらなければならない。","a":false,"c":"204条2項。","e":"募集株式が譲渡制限株式である場合，割当先の決定は，株主総会の特別決議（取締役会設置会社では取締役会の決議）によらなければならない（204条２項本文，309条２項５号）。ただし，定款で別段の定めを置くことが認められている（204条２項ただし書）。"},{"l":3,"m":"募集株式の発行等","sb":"募集株式の割当て","i":"C","r":"(令3問題6イ類)","q":"募集株式を引き受けようとする者がその総数の引き受けを行う契約を取締役会設置会社と締結する場合において，募集株式が譲渡制限株式であるときは，当該株式会社は，定款に別段の定めがある場合を除き，取締役会の決議によって，総数引受契約の承認を受けなければならない。","a":true,"c":"205条2項。","e":"募集株式を引き受けようとする者がその総数の引き受けを行う契約を締結する場合において，募集株式が譲渡制限株式であるときは，株式会社は，定款に別段の定めがある場合を除き，株主総会の特別決議（取締役会設置会社では取締役会の決議）によって，総数引受契約の承認を受けなければならない（205条２項，309条２項５号）。"},{"l":4,"m":"募集株式の発行等","sb":"募集株式の割当て","i":"B","r":"(令6II問題6エ類・平26II問題6エ類)","q":"株主割当ての方法により募集株式の発行等を行う場合で，株主が募集株式の引受けの申込みの期日までに申込みをしないときは，株式会社は，当該申込みをしない者に対して，期日を定め，その期日までに申し込まなければならない旨を通知しなければならない。","a":false,"c":"204条4項。","e":"株主割当ての方法により募集株式の発行等を行う場合で，株主が募集株式の引受けの申込みの期日までに申込みをしないときは，当該株主は，募集株式の割当てを受ける権利を失う。"},{"l":1,"m":"募集株式の発行等","sb":"公開会社における支配株主の異動を伴う募集株式の発行等","i":"C","r":"","q":"特定引受人とは，募集株式の引受人（その子会社等を含む）がその引き受けた募集株式の株主となった場合に有することとなる議決権の数の当該募集株式の引受人の全員がその引き受けた募集株式の株主となった場合における総株主の議決権の数に対する割合が２分の１を超える場合の当該引受人をいう。","a":true,"c":"206条の2第1項。","e":"【分子について】分子となる引受人の保有議決権の数には，引受人が自ら保有する議決権数に，その子会社等（２条３号の２）が保有する議決権数を合算することとしている。これは，引受人による公開会社に対する支配の有無は，当該引受人が自ら直接に保有する議決権数のみならず，その子会社等を通じて間接的に保有する議決権をも合算して考慮することが相当と考えられることによるものである。また，この議決権の数は，引受人が募集株式の株主となった場合に，結果として有することとなるものを基準としており，当該引受人が募集株式の発行等により新たに取得する株式の議決権のみならず，その前から有する議決権も含めて計算されることになる。【分母について】分母となる総株主の議決権数は，当該募集株式の引受人の全員がその引き受けた募集株式の株主となったと仮定して計算される。すなわち，当該募集株式の発行等がすべて予定通り完了したと考えて計算するのである。"},{"l":2,"m":"募集株式の発行等","sb":"公開会社における支配株主の異動を伴う募集株式の発行等","i":"B","r":"","q":"株式会社は，募集株式引受人が特定引受人に該当する場合には，募集事項において定めた払込期日または払込期間の初日の２週間前までに，株主に対して特定引受人の氏名または名称および住所，当該特定引受人が有することとなる議決権数その他の法務省令で定める事項を通知または公告しなければならない。","a":false,"c":"206条の2第1項柱書。","e":"公開会社は，募集株式引受人が特定引受人に該当する場合には，原則として，募集事項において定めた払込期日または払込期間の初日の２週間前までに，株主に対して特定引受人の氏名または名称および住所，当該特定引受人が有することとなる議決権数その他の法務省令で定める事項を通知または公告しなければならない。"},{"l":3,"m":"募集株式の発行等","sb":"公開会社における支配株主の異動を伴う募集株式の発行等","i":"B","r":"","q":"公開会社において募集株式引受人が特定引受人に該当する場合であっても，当該特定引受人が当該公開会社の親会社等である場合は，株主に対して特定引受人の氏名等を通知または公告しなくてよい。","a":true,"c":"206条の2第1項柱書ただし書。","e":"特定引受人が当該公開会社の親会社等（２条４号の２）である場合は，公開会社における募集株式の割当て等の特則は適用されない。この場合は，募集株式の発行等の前から当該特定引受人が当該公開会社を支配しており，募集株式の発行等によって支配株主の異動が生じるわけではないからである。また，同様に，募集株式の発行等が株主割当ての方法（202 条）による場合は，公開会社における募集株式の割当て等の特則は適用されない。この場合は，既存の株主の持株数に応じて，募集株式の割当てを受ける権利が与えられるためである。"},{"l":4,"m":"募集株式の発行等","sb":"公開会社における支配株主の異動を伴う募集株式の発行等","i":"C","r":"","q":"公開会社において募集株式引受人が特定引受人に該当する場合であっても，当該公開会社が特定引受人の氏名等について記載した有価証券届出書を募集事項において定めた払込期日または払込期間の初日の２週間前までに提出している場合には，当該特定引受人に関する通知または公告が不要となる。","a":true,"c":"206条の2第3項。","e":"この場合，重ねて会社法上の開示をする必要が乏しいためである。"},{"l":5,"m":"募集株式の発行等","sb":"公開会社における支配株主の異動を伴う募集株式の発行等","i":"B","r":"","q":"公開会社において募集株式引受人が特定引受人に該当する場合には，払込期日または払込期間の初日の前日までに，株主総会の決議によって，当該特定引受人に対する募集株式の割当て，または，当該特定引受人との間の総数引受契約の承認を受けなければならない。","a":false,"c":"206条の2第4項本文。","e":"特定引受人に関する通知等の日から２週間以内に，総株主（承認決議において議決権を行使することができない株主を除く）の議決権の10分の１（定款で厳格にすることが可能）以上の議決権を有する株主が特定引受人（その子会社等を含む）による募集株式の引受けに反対する旨を公開会社に対して通知したときは，当該公開会社は，払込期日（払込期間を定めた場合は払込期間の初日）の前日までに，株主総会の決議によって，当該特定引受人に対する募集株式の割当て，または，当該特定引受人との間の総数引受契約の承認を受けなければならない。"},{"l":6,"m":"募集株式の発行等","sb":"公開会社における支配株主の異動を伴う募集株式の発行等","i":"B","r":"","q":"株主が特定引受人に関する通知または公告の日から２週間以内に，特定引受人（その子会社等を含む）による募集株式の引受けに反対する旨を公開会社に対して通知したときは，当該公開会社は，払込期日（払込期間を定めた場合は払込期間の初日）の前日までに，株主総会の決議によって，当該特定引受人に対する募集株式の割当て，または，当該特定引受人との間の総数引受契約の承認を受けなければならない。","a":false,"c":"206条の2第4項本文。","e":"特定引受人に関する通知等の日から２週間以内に，総株主（承認決議において議決権を行使することができない株主を除く）の議決権の10分の１（定款で厳格にすることが可能）以上の議決権を有する株主が特定引受人（その子会社等を含む）による募集株式の引受けに反対する旨を公開会社に対して通知したときは，当該公開会社は，払込期日（払込期間を定めた場合は払込期間の初日）の前日までに，株主総会の決議によって，当該特定引受人に対する募集株式の割当て，または，当該特定引受人との間の総数引受契約の承認を受けなければならない。総株主の議決権の 10 分の１以上の議決権を有する株主が反対の通知をした場合に限って株主総会の決議による承認を要することとしたのは，大多数の株主が特定引受人による募集株式の引受けに反対していない場合には，あえて株主総会の決議を要することとする必要はなく，また，そのような場合にまで一律に株主総会の決議を要することとするのは，資金調達の機動性を害するおそれがあるほか，株主総会の開催のための無用なコストを生じさせ，かえって株主の利益を害する結果となりかねないためである。"},{"l":7,"m":"募集株式の発行等","sb":"公開会社における支配株主の異動を伴う募集株式の発行等","i":"B","r":"(令5I問題7ア類)","q":"特定引受人に対する募集株式の割当ての承認をする株主総会の決議は，特別決議を要する。","a":false,"c":"206条の2第5項。","e":"特定引受人に対する募集株式の割当て等の承認をする株主総会の決議は，役員の選解任決議の特則（341 条）と同様の要件とされている。特定引受人に対する募集株式の割当て等の承認をする株主総会の決議は，会社の経営を支配する者を決定するという点で，取締役の選任の決議と類似する面があることから，役員の選解任決議の特則と同様の要件とされたのである。すなわち，当該決議は普通決議であるが，定款の定めによっても，定足数について議決権を行使することができる株主の議決権の３分の１未満に引き下げることができない。また，決議要件については引上げしかできない旨を明文で規定している。"},{"l":8,"m":"募集株式の発行等","sb":"公開会社における支配株主の異動を伴う募集株式の発行等","i":"C","r":"","q":"公開会社の財産の状況が著しく悪化している場合において，当該公開会社の事業の継続のため緊急の必要があるときは，総株主の議決権の 10 分の１以上の議決権を有する株主が特定引受人による募集株式の引受けに反対する旨を当該公開会社に対して通知したとしても，株主総会の決議による承認を要しない。","a":true,"c":"206条の2第4項ただし書。","e":"株主総会の開催には相当の期間を要するため，株主からこのような反対通知があった場合に常に株主総会の決議を要することとすると，公開会社が事業体としての存立を維持するために必要な資金調達が間に合わず，かえって株主の利益を害する結果となるおそれがあるからである。"},{"l":1,"m":"募集株式の発行等","sb":"出資の履行","i":"A","r":"","q":"金銭出資をする募集株式の引受人は，払込期日または払込期間内に，払込取扱機関において，募集株式の払込金額の全額を払い込まなければならない。","a":true,"c":"208条1項。","e":"また，現物出資をする募集株式引受人は，払込期日または払込期間内に，それぞれの募集株式の払込金額の全額に相当する現物出資財産を給付しなければならない（208条２項）。"},{"l":2,"m":"募集株式の発行等","sb":"出資の履行","i":"A","r":"(令2I問題6イ類・平29II問題6ア類・平22II問題6ア)","q":"募集株式を発行する株式会社は，募集株式引受人に対する出資の払込みを受ける債権と当該募集株式引受人に対する債務とを相殺することはできない。","a":false,"c":"208条3項。","e":"募集株式引受人は，金銭の払込みをする債務または現物出資財産を給付する債務と，会社に対する債権とを相殺することができない。208 条３項は，募集株式引受人の側から相殺を主張することを禁止している。したがって，会社側から相殺を主張すること（会社の側から相殺を主張することや会社と募集株式引受人の合意により相殺すること）は禁止していないのである。"},{"l":3,"m":"募集株式の発行等","sb":"出資の履行","i":"A","r":"(平30I問題7ア類)","q":"出資の履行をすることにより募集株式の株主となる権利の譲渡は，その効力を有しない。","a":false,"c":"208条4項。","e":"出資の履行をすることにより募集株式の株主となる権利の譲渡は，株式会社に対抗することができない。"},{"l":1,"m":"募集株式の発行等","sb":"株主となる時期","i":"A","r":"(平31I問題7ア類・平29II問題6イ類・平22II問題6エ類・平22I問題7イ類)","q":"募集株式引受人は，募集事項に払込期日を定めた場合は払込期日に，募集事項に払込期間を定めた場合は払込期間の末日に，出資の履行をした募集株式の株主となる。","a":false,"c":"209条1項。","e":"募集株式引受人は，募集事項に払込期日を定めた場合は払込期日に，募集事項に払込期間を定めた場合は出資の履行をした日に，募集株式の発行等の効力が生じ，出資の履行をした募集株式の株主となる。"},{"l":2,"m":"募集株式の発行等","sb":"株主となる時期","i":"B","r":"","q":"金融商品取引法第２条 16 項に規定する金融商品取引所に上場されている株式を発行している株式会社において，取締役の報酬等として株式報酬を付与する場合，募集株式引受人は，募集事項で定めた割当日に，その引き受けた募集株式の株主となる。","a":true,"c":"209条4項。","e":"上場会社において取締役の報酬等として株式報酬を付与する場合，募集株式引受人は，当該株式報酬を受ける取締役ということになるが，当該取締役は出資を要しないため，募集事項で定めた割当日（202 条の２第１項２号）に，その引き受けた募集株式の株主となる。"},{"l":3,"m":"募集株式の発行等","sb":"株主となる時期","i":"B","r":"(令3問題6ウ)","q":"最高裁判所の判例の趣旨によれば，他人の承諾を得てその名義を用いて募集株式を引き受けた場合，名義借用者でなく，名義貸与者がその株主となる。","a":false,"c":"最判昭42年11月17日。","e":"最高裁判所の判例によれば，他人の承諾を得てその名義で株式を引き受けた場合には，名義貸与者ではなく，実質上の引受人，すなわち名義借用者がその株主となるとしている。"},{"l":1,"m":"募集株式の発行等","sb":"現物出資","i":"B","r":"","q":"株式会社は，金銭以外の財産を出資の目的として定めた場合は，当該現物出資財産が給付された後遅滞なく，現物出資財産の価額を調査させるため，裁判所に対し，検査役の選任の申立てをしなければならない。","a":false,"c":"207条1項。","e":"株式会社は，金銭以外の財産を出資の目的として定めた場合は，募集事項の決定後遅滞なく，現物出資財産の価額を調査させるため，裁判所に対し，検査役の選任の申立てをしなければならない。"},{"l":2,"m":"募集株式の発行等","sb":"現物出資","i":"B","r":"(令2I問題6ア)","q":"株式会社が金銭以外の財産を出資の目的として定めた場合であっても，当該募集株式引受人に割り当てる株式の総数が発行済株式の総数の 10 分の１を超えないときは，当該募集株式引受人が給付する現物出資財産について，裁判所選任の検査役の調査は要しない。","a":true,"c":"207条9項1号。","e":""},{"l":3,"m":"募集株式の発行等","sb":"現物出資","i":"B","r":"(令6I問題6エ類・平22II問題6ウ類)","q":"現物出資財産が株式会社に対する金銭債権であって，当該金銭債権の弁済期が到来している場合は，当該現物出資財産について，裁判所選任の検査役の調査は要しない。","a":false,"c":"207条9項5号。","e":"現物出資財産が株式会社に対する金銭債権であって，当該金銭債権の弁済期が到来しており，当該金銭債権について募集事項で定められた価額が当該金銭債権に係る負債の帳簿価額を超えない場合は，例外的に検査役の調査は不要となる。"},{"l":4,"m":"募集株式の発行等","sb":"現物出資","i":"B","r":"","q":"募集株式の発行等の場面によって，現物出資をすることができる者に制限はない。","a":true,"c":"","e":"設立時に現物出資をすることができるのは，重い責任が課せられている発起人だけであるが（34 条１項，63 条対比），募集株式の発行等の場合には，現物出資者について制限はない（208条２項参照）。"},{"l":1,"m":"募集株式の発行等","sb":"引受けの無効または取消しの制限","i":"B","r":"(平31I問題7ウ類)","q":"募集株式の引受人は，株主となった後は，錯誤，詐欺または強迫を理由として募集株式の引受けの取消しをすることができない。","a":false,"c":"211条2項。","e":"募集株式の引受人は，株主となった日から１年を経過した後または当該株式について権利を行使した後は，錯誤（民法95条），詐欺または強迫（民法96条）を理由として募集株式の引受けの取消しをすることができない。ここで，設立に関する同趣旨の規定の51条２項と102条６項では，１年間の猶予は設けず会社成立後は無効または取消しの主張を認めていないが，これは，会社の成立では財産的基礎の確立の要請が強く，引受けの無効または取消しが会社に及ぼす影響が大きいためである。また，心裡留保の相手方が悪意または有過失の場合の無効（民法93条１項ただし書）や，虚偽表示による無効（民法94条１項）は，募集株式の引受けの申込みおよび割当や総数引受けの契約には適用されない（211条１項）。"},{"l":1,"m":"募集株式の発行等","sb":"不公正な払込金額で株式を引き受けた者等の責任","i":"B","r":"","q":"著しく不公正な払込金額で募集株式を引き受けた募集株式引受人は，当該払込金額と当該募集株式の公正な価額との差額に相当する金額を株式会社に対し支払う義務を負う。","a":false,"c":"212条1項1号。","e":"取締役（指名委員会等設置会社では取締役または執行役）と通じて著しく不公正な払込金額で募集株式を引き受けた募集株式引受人は，株式会社に対し，当該払込金額と当該募集株式の公正な価額との差額に相当する金額を支払う義務を負う。"},{"l":2,"m":"募集株式の発行等","sb":"不公正な払込金額で株式を引き受けた者等の責任","i":"B","r":"","q":"募集株式引受人が募集株式の株主となった時におけるその給付した現物出資財産の価額が，募集事項で定められた価額に著しく不足する場合には，当該募集株式引受人は，会社に対し，当該不足額を支払う責任を負う。当該責任は無過失責任である。","a":true,"c":"212条1項2号。","e":"現物出資財産が過大に評価された場合，または，募集株式の発行等の効力発生時に現物出資財産の価額が下落していた場合には，既存株主は株価下落による経済的不利益を被ることになり，また資本充実を損なうため会社債権者を害する。そこで，本来出資すべきである価額を出資していない現物出資者に責任を負わせたのである。"},{"l":3,"m":"募集株式の発行等","sb":"不公正な払込金額で株式を引き受けた者等の責任","i":"B","r":"(平30I問題7イ)","q":"取締役と通じて著しく不公正な払込金額で募集株式の発行を受けた者は，当該払込金額と当該募集株式の公正な価額との差額に相当する金額を支払った後でなければ，当該募集株式について株主の権利を行使することができない。","a":false,"c":"212条1項1号。","e":"著しく不公正な払込金額で募集株式の発行が行われると，既存株主は株価下落による経済的不利益を被るため，既存株主の経済的損失の回復を図る必要がある。そこで，取締役（指名委員会等設置会社では取締役または執行役）と通じて著しく不公正な払込金額で募集株式を引き受けた募集株式引受人は，株式会社に対し，当該払込金額と当該募集株式との差額に相当する金額を支払う義務を負うこととされている（212条１項１号）。しかし，この場合，当該支払責任が生じるのみで，当該募集株式についての株主の権利は制限されない。"},{"l":4,"m":"募集株式の発行等","sb":"不公正な払込金額で株式を引き受けた者等の責任","i":"C","r":"(令3問題6エ)","q":"現物出資をした募集株式引受人は，当該現物出資財産の価額が募集事項に定められた価額に著しく不足することにつき善意・無重過失の場合は，募集株式の引受けの申込みまたは総数引受けの契約を取り消すことができる。","a":true,"c":"212条2項。","e":""},{"l":1,"m":"募集株式の発行等","sb":"出資の履行を仮装した場合の責任","i":"B","r":"","q":"募集株式引受人は，募集株式の出資に係る金銭の払込みを仮装した場合には，株式会社に対し，払込みを仮装した払込金額の全額の支払をする義務を負う。","a":true,"c":"213条の2第1項1号。","e":"なお，募集株式引受人が現物出資財産の給付を仮装した場合も同様に，株式会社に対し，給付を仮装した現物出資財産の給付（株式会社が当該給付に代えて当該現物出資財産の価額に相当する金銭の支払を請求した場合は，当該金銭の全額の支払）をする義務を負う（213条の２第１項２号）。"},{"l":2,"m":"募集株式の発行等","sb":"出資の履行を仮装した場合の責任","i":"B","r":"(令2I問題6ウ)","q":"募集株式の払込金額の払込みを仮装した引受人から当該募集株式を善意でかつ重大な過失なく譲り受けた者は，当該引受人が仮装した払込金額につき支払がされた後でなければ，当該募集株式についての株主の権利を行使することができない。","a":false,"c":"209条3項。","e":"募集株式引受人が出資の履行を仮装した場合において，出資の履行が仮装された当該募集株式を譲り受けた者は，その者が出資の履行の仮装について悪意または重大な過失がない限り，当該募集株式についての株主の権利を行使することができる。出資の履行が仮装されたことを知らずに株式を譲り受けた者についてまで株主の権利の行使を認めないこととすると，株式取引の安全を害するためである。"},{"l":3,"m":"募集株式の発行等","sb":"出資の履行を仮装した場合の責任","i":"B","r":"(平30I問題7エ)","q":"募集株式の払込金額の払込みを仮装した引受人から当該募集株式を譲り受けた者は，悪意または重大な過失があるときは，当該引受人と連帯して，株式会社に対し払込みを仮装した払込金額を支払う義務を負う。","a":false,"c":"209条3項。","e":"募集株式引受人が出資の履行を仮装した場合において，出資の履行が仮装された当該募集株式を譲り受けた者が出資の履行の仮装について悪意または重大な過失があるときは，当該募集株式についての株主の権利を行使することができない。しかし，この場合であっても，当該譲受人は払込みを仮装した払込金額を支払う義務を負わないため，本肢は誤りである。"},{"l":4,"m":"募集株式の発行等","sb":"出資の履行を仮装した場合の責任","i":"B","r":"","q":"出資の履行を仮装した募集株式引受人の責任を追及する訴えは，責任追及等の訴えに該当しない。","a":false,"c":"847条1項本文。","e":"出資の履行等を仮装した者に支払等を求める訴え（102条の２第１項，213条の２第１項，286条の２第１項各号）は，責任追及等の訴えに該当する。すなわち，払込みを仮装した設立時募集株式引受人の責任を追及する訴えや新株予約権に係る払込み等を仮装した新株予約権者等の責任を追及する訴えも同様に，責任追及等の訴えに該当する。"},{"l":5,"m":"募集株式の発行等","sb":"出資の履行を仮装した場合の責任","i":"B","r":"(平30I問題7ウ)","q":"募集株式の引受人が払込金額の払込みを仮装したことによって株式会社に対して払込みを仮装した払込金額の支払義務を負う場合，当該支払義務は総株主の同意がなければ免除することができない。","a":true,"c":"213条の2第2項。","e":"なお，出資の履行を仮装することに関与した取締役等も立証責任が転換された過失責任を負っていくが，出資の履行の仮装によって自らが利益を得るわけではないこと等を踏まえ，責任の免除については，総株主の同意を要しないこととされている。これに対して，株式会社の設立に際して出資の履行が仮装された場合については，出資の履行の仮装によって自らが利益を得ることとなる発起人等の責任だけでなく，出資の履行を仮装することに関与した他の発起人または設立時取締役の責任の免除についても総株主の同意を要することとしている（55条，103条３項）。これは，株式会社の設立時の現物出資財産の不足額填補責任については，当該財産を給付した者以外の発起人および設立時取締役の責任を含めて，その免除に総株主の同意が必要とされていることを踏まえたものである（52条１項，55条参照）。"},{"l":6,"m":"募集株式の発行等","sb":"出資の履行を仮装した場合の責任","i":"B","r":"","q":"募集株式引受人が出資の履行を仮装した場合において，その出資を履行することに関与した取締役が株式会社に対して仮装した払込金額の全額の支払いをした場合は，当該取締役は，出資の履行を仮装した募集株式を取得する。","a":false,"c":"209条2項。","e":"募集株式引受人は，出資の履行を仮装した場合には，当該募集株式引受人の支払もしくは給付（213 条の２第１項各号），または，出資の履行を仮装することに関与した取締役等の支払（213 条の３第１項本文）がされた後でなければ，出資の履行を仮装した募集株式について，株主の権利を行使することができない。すなわち，取締役が213条の３第１項の義務を履行した場合でも，当該取締役が募集株式を取得するわけではない。"},{"l":1,"m":"募集株式の発行等","sb":"現物出資財産の価額が著しく不足する場合の取締役等の責任","i":"B","r":"","q":"募集株式引受人が募集株式の株主となった時におけるその給付した現物出資財産の価額が，募集事項で定められた価額に著しく不足する場合には，当該募集株式引受人の募集に関する職務を行った業務執行取締役は，会社に対し，当該不足額を支払う責任を負う。当該責任は無過失責任である。","a":false,"c":"213条1項1号2項。","e":"現物出資財産の価額が著しく不足する場合の取締役等の責任は，過失責任である。したがって，検査役の調査を受けていた場合，または，無過失を立証した場合は当該責任を負わない。"},{"l":2,"m":"募集株式の発行等","sb":"現物出資財産の価額が著しく不足する場合の取締役等の責任","i":"C","r":"","q":"募集株式引受人が募集株式の株主となった時におけるその給付した現物出資財産の価額が，募集事項で定められた価額に著しく不足する場合においても，当該価額の相当性につき専門家として証明した者が当該証明をするについて注意を怠らなかったことを証明したときは，当該専門家は，会社に対し当該不足額を支払う責任を負わない。","a":true,"c":"213条1項3項。","e":""},{"l":1,"m":"募集株式の発行等","sb":"募集株式の発行等の差止請求権","i":"B","r":"","q":"募集株式の発行が著しく不公正な方法により行われる場合で，株主が不利益を受けるおそれがあるときは，当該株主は，株式会社に対し，募集に係る株式の発行をやめることを請求することができる。","a":true,"c":"210条。","e":"募集株式の発行等が法令または定款に違反する場合，または，著しく不公正な方法により行われる場合において，株主が不利益を受けるおそれがある場合には，株主は，会社に対して，募集株式の発行等の差止めを請求することができる。"},{"l":1,"m":"募集株式の発行等","sb":"新株発行無効・不存在確認の訴え・自己株式処分無効・不存在確認の訴え","i":"A","r":"(平29II問題6エ類・平25I問題7ア類・平22I問題7エ類)","q":"公開会社でない株式会社において，新株発行無効の訴えは，新株発行の効力が生じた日から６か月以内に限り，提起することができる。","a":false,"c":"828条1項2号。","e":"新株発行または自己株式処分無効の訴えは，新株発行または自己株式の処分の効力が生じた日から６か月以内（非公開会社では１年以内）に限り，提起することができる（828 条１項２号３号）。非公開会社において，主張期間が１年以内と伸長されている理由は，非公開会社で株主総会が開催されずに新株の発行が行われた場合，次の定時株主総会の開催までは株主がその事実を知る機会はほとんどなく，その結果，株主が当該新株発行の事実を知らないまま６か月の提訴期間を過ぎてしまうという問題が生じるためである。"},{"l":2,"m":"募集株式の発行等","sb":"新株発行無効・不存在確認の訴え・自己株式処分無効・不存在確認の訴え","i":"A","r":"(平30II問題8ア・平25I問題7イ類)","q":"公開会社において新株発行の募集事項を決定する取締役会決議に賛成した取締役は，当該新株発行の無効の訴えを提起することができない。","a":false,"c":"828条2項1号2号。","e":"新株発行無効の訴えの主張権者は，株主等（株主，取締役または清算人（監査役設置会社にあっては株主，取締役，監査役または清算人，指名委員会等設置会社にあっては株主，取締役，執行役または清算人））である。ここで，募集事項を決定する取締役会の決議に賛成した取締役は主張権者から除外されていないため，本肢は誤りである。"},{"l":3,"m":"募集株式の発行等","sb":"新株発行無効・不存在確認の訴え・自己株式処分無効・不存在確認の訴え","i":"A","r":"(平31II問題4ア)","q":"新株発行の無効の訴えを提起する権利は，少数株主権である。","a":false,"c":"828条2項2号。","e":"新株発行の無効の訴えを提起する権利は，単独株主権である。"},{"l":4,"m":"募集株式の発行等","sb":"新株発行無効・不存在確認の訴え・自己株式処分無効・不存在確認の訴え","i":"A","r":"(平22II問題7エ)","q":"新株発行の無効の訴えに係る請求を認容する確定判決は，第三者に対してもその効力を有する。","a":true,"c":"838条。","e":"法律関係の画一的確定の観点から，新株発行または自己株式処分の無効判決には対世的効力が認められている。"},{"l":5,"m":"募集株式の発行等","sb":"新株発行無効・不存在確認の訴え・自己株式処分無効・不存在確認の訴え","i":"A","r":"(令7I問題7イ・平30II問題8エ・平25I問題7ウ類)","q":"新株発行の無効の訴えに係る請求を認容する判決が確定したときは，当該判決において無効とされた新株発行は，当該新株発行が効力を生じた日に遡って，その効力を失う。","a":false,"c":"839条。","e":"法的安定性を確保するために新株発行の無効判決の遡及効は阻止され，その新株発行は将来に向かってその効力を失う（将来効）。"},{"l":6,"m":"募集株式の発行等","sb":"新株発行無効・不存在確認の訴え・自己株式処分無効・不存在確認の訴え","i":"B","r":"(平25I問題7エ)","q":"株式会社は，新株発行の無効の訴えに係る請求を認容する判決が確定したときは，当該判決の確定時における当該株式の株主に対し，払込みを受けた金額に相当する金銭を支払い，または給付を受けた財産を引き渡さなければならない。","a":false,"c":"840条1項。","e":"新株発行または自己株式処分の無効判決が確定したときは，株式会社は，その判決の確定時における株主に対し，払込みを受けた金額または給付を受けた現物出資財産の給付の時における価額に相当する金銭を支払わなければならない（840条１項，841条１項）。"},{"l":7,"m":"募集株式の発行等","sb":"新株発行無効・不存在確認の訴え・自己株式処分無効・不存在確認の訴え","i":"B","r":"(平22I問題7ウ)","q":"新株発行の無効判決が確定したときであっても，当該株式に係る株主は判決確定までに剰余金の配当として受けた金銭を会社に返還する必要はない。","a":true,"c":"839条。","e":"新株発行の無効判決が確定した場合，当該判決は遡及して無効になるわけでないため，判決確定までに剰余金の配当として受けた金銭を会社に返還する必要はない。"},{"l":8,"m":"募集株式の発行等","sb":"新株発行無効・不存在確認の訴え・自己株式処分無効・不存在確認の訴え","i":"A","r":"(平28II問題5ウ・平21問題7エ類)","q":"最高裁判所の判例によれば，公開会社における取締役会の決議を欠く募集株式の発行は，新株発行の無効原因とはならず，有効である。","a":true,"c":"最判昭36年3月31日。","e":""},{"l":9,"m":"募集株式の発行等","sb":"新株発行無効・不存在確認の訴え・自己株式処分無効・不存在確認の訴え","i":"B","r":"(平21問題7ウ)","q":"最高裁判所の判例によれば，新株発行の無効の訴えが提起された場合，出訴期間の経過後に，新たな無効事由を追加して主張することも許される。","a":false,"c":"最判平6年7月18日。","e":"判例によると，新株発行無効の訴えにおいて，主張期間経過後に新たな無効事由を追加することは許されない。これが許されると，法律関係の早期確定のために主張期間を制限した趣旨が没却されてしまうためである。"},{"l":10,"m":"募集株式の発行等","sb":"新株発行無効・不存在確認の訴え・自己株式処分無効・不存在確認の訴え","i":"A","r":"(令2I問題6エ類・平28II問題5エ)","q":"最高裁判所の判例によれば，公開会社の募集株式の発行において，払込金額が募集株式の引受人に特に有利な金額であるために株主総会決議が必要である場合に，代表取締役が株主総会決議を経ずに募集事項を決定して募集株式の発行を行うことは，当該募集株式の発行の無効原因となる。","a":false,"c":"最判昭46年7月16日。","e":"判例によると，公開会社における株主総会の特別決議を欠く有利発行は，新株発行の無効原因とはならず，有効である。"},{"l":11,"m":"募集株式の発行等","sb":"新株発行無効・不存在確認の訴え・自己株式処分無効・不存在確認の訴え","i":"A","r":"(令5I問題7イ・平30II問題8ウ)","q":"最高裁判所の判例によれば，公開会社でない株式会社において，株主総会の特別決議を経ずに株主割当て以外の方法による新株発行がされたことは，当該新株発行の無効原因となる。","a":true,"c":"最判平24年4月24日。","e":"判例によると，非公開会社において，株主総会の特別決議を経ずに株主割当て以外の方法による新株発行がされたことは，当該新株発行の無効原因となる。株主総会の特別決議によって募集事項を決定することを要し，また，株式発行無効の訴えの主張期間も，非公開会社の場合には１年と伸長されている点（828 条１項２号）に鑑みると，非公開会社では，会社の支配権に関わる持株比率の維持に係る既存株主の利益の保護を重視し，その意思に反する株式の発行は株式発行無効の訴えにより救済するというのが会社法の趣旨と解されるためである。"},{"l":12,"m":"募集株式の発行等","sb":"新株発行無効・不存在確認の訴え・自己株式処分無効・不存在確認の訴え","i":"B","r":"","q":"最高裁判所の判例によれば，特定の株主の議決権割合を低下させることで会社の支配権を維持することを目的とした著しく不公正な方法による募集株式の発行は，新株発行の無効原因となる。","a":false,"c":"最判平6年7月14日。","e":"判例によると，特定の株主の議決権割合を低下させることで会社の支配権を維持することを目的とした著しく不公正な方法による募集株式の発行は，新株発行の無効原因とはならず，有効である。"},{"l":13,"m":"募集株式の発行等","sb":"新株発行無効・不存在確認の訴え・自己株式処分無効・不存在確認の訴え","i":"A","r":"(令7I問題7エ・平30II問題8イ・平28I問題5ウ・平21問題7イ類)","q":"最高裁判所の判例によれば，新株発行において募集事項の公示をしなければならないにもかかわらず，これを行わないことは，当該公示をしないこと以外に当該新株発行の差止めの事由がない場合を除き，当該新株発行の無効原因となる。","a":true,"c":"最判平9年1月28日。","e":"判例によると，募集事項の公示を欠く募集株式の発行等は，原則として無効原因となる。ただし，会社が当該公示を欠いた事以外に瑕疵がなく，差止事由が存在しなかったことを証明した場合には，無効原因とならないとしている。"},{"l":14,"m":"募集株式の発行等","sb":"新株発行無効・不存在確認の訴え・自己株式処分無効・不存在確認の訴え","i":"A","r":"(平29II問題6ウ類・平21問題7ア)","q":"最高裁判所の判例によれば，株主による募集株式の発行等の差止めの仮処分に反して募集株式の発行がなされたときは，新株発行の無効原因となる。","a":true,"c":"最判平5年12月16日。","e":"判例によると，株主から口頭または書面で差止請求がなされた場合，これを無視した募集株式の発行等は，無効原因とはならないが，差止めの仮処分または判決に反して募集株式の発行等がなされたときは，無効原因となる。"},{"l":15,"m":"募集
