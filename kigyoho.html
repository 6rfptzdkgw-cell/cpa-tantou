ることが求められる。"},{"l":7,"m":"監査役","sb":"監査役の権限","i":"A","r":"","q":"監査役は，取締役会に出席し，必要があると認めるときは，意見を述べなければならない。","a":true,"c":"383条1項。","e":"監査役は取締役の職務の執行の状況を把握する必要があり，また，取締役会に上程された議案の内容に法令違反等がある場合は，意見を述べて是正することが求められているのである。"},{"l":8,"m":"監査役","sb":"監査役の権限","i":"B","r":"(令2II問題11イ類・平29I問題11ウ)","q":"監査役設置会社において，特別取締役による取締役会決議が行われる取締役会には，監査役は出席することを要しない。","a":false,"c":"383条1項。","e":"監査役は，特別取締役による取締役会決議が行われる取締役会に出席し，必要があると認めるときは，意見を述べなければならない。ただし，監査役が２人以上ある場合において，監査役の互選によって，監査役の中から特に当該取締役会に出席する監査役を定めることができる（383条１項ただし書）。"},{"l":9,"m":"監査役","sb":"監査役の権限","i":"A","r":"(平25II問題10エ)","q":"監査役設置会社における監査役は，取締役が株主総会に提出しようとする議案，書類その他法務省令で定めるものを調査し，法令もしくは定款に違反し，または著しく不当な事項があると認めるときは，その調査の結果を株主総会に報告しなければならない。","a":true,"c":"384条。","e":""},{"l":10,"m":"監査役","sb":"監査役の権限","i":"B","r":"(平20問題12エ)","q":"監査役は，取締役が監査役設置会社の目的の範囲外の行為その他法令もしくは定款に違反する行為をし，または，これらの行為をするおそれがある場合において，当該行為によって会社に回復することができない損害が生ずるおそれがある場合に限り，当該取締役に対し，当該行為をやめることを請求することができる。","a":false,"c":"385条1項。","e":"監査役は，取締役が監査役設置会社の目的の範囲外の行為その他法令もしくは定款に違反する行為をし，または，これらの行為をするおそれがある場合において，当該行為によって会社に著しい損害が生ずるおそれがあるときは，当該取締役に対し，当該行為をやめることを請求することができる。この場合において，裁判所が仮処分をもって当該取締役に対し，その行為をやめることを命ずるときは，監査役に担保を立てさせないものとする（385条２項）。"},{"l":11,"m":"監査役","sb":"監査役の権限","i":"B","r":"(平29I問題13イ)","q":"株式会社がその監査役の債務を保証する契約を第三者との間で締結する場合，当該監査役は，株主総会において当該契約について重要な事実を開示し，株主総会の承認を受けなければならない。","a":false,"c":"","e":"監査役には業務執行権限がないため，利益相反取引の規制は設けられていない。"},{"l":12,"m":"監査役","sb":"監査役の権限","i":"A","r":"(平30I問題12ウ・平20問題12ウ類)","q":"監査役会設置会社における監査役が，取締役の法令違反行為をやめることを請求するには，その旨の監査役会の決議が必要である。","a":false,"c":"385条参照。","e":"監査役が取締役の違法行為差止請求権を行使する場合に，監査役会の決議は不要である。"},{"l":1,"m":"監査役","sb":"定款の定めによる監査範囲の限定","i":"A","r":"(令6I問題8ア・平30I問題12ア)","q":"公開会社でない監査役会設置会社は，その監査役の監査の範囲を会計に関するものに限定する旨を定款で定めることができない。","a":true,"c":"389条1項かっこ書。","e":"非公開会社（監査役会設置会社および会計監査人設置会社を除く）では，監査役の監査の範囲を会計に関するものに限定する旨を定款で定めることができる。非公開非大会社の中には，業務監査を行うことのできる適切な人材を確保することが困難な株式会社が存在すると考えられるため，そのような会社の負担を減らすことが，定款の定めによる監査範囲の限定規定の趣旨である。非公開会社に限定している理由は，公開会社の株主は頻繁に変動することが想定されるため，株主による監督を期待することができないからである。また，監査役会設置会社が除かれる理由は，監査役会をわざわざ置く以上は監査役に業務監査権限を与えることがふさわしいからである。そして，会計監査人設置会社が除かれる理由は，会計監査人設置会社に，会計の専門的知識や経験を有しない会計監査権のみを有する監査役を置く意義は乏しいし，監査役が会計監査人の監査の方法および結果の相当性を判断するためには業務監査権を有する必要性があると考えられたためである。"},{"l":2,"m":"監査役","sb":"定款の定めによる監査範囲の限定","i":"A","r":"(平28I問題7エ・平20問題7ア)","q":"公開会社は，定款の定めによっても，監査役の監査の範囲を会計に関するものに限定することができない。","a":true,"c":"389条1項。","e":"問題１の解説参照。"},{"l":3,"m":"監査役","sb":"定款の定めによる監査範囲の限定","i":"B","r":"(平27I問題10ア)","q":"監査の範囲を会計に関するものに限定する旨の定款の定めがある株式会社の監査役の資格を株主に限定する旨の定款の定めは，無効である。","a":false,"c":"389条1項,335条1項,331条2項ただし書き。","e":"会計限定監査役は非公開会社（監査役会設置会社および会計監査人設置会社を除く）にのみ設置が許容され，非公開会社においては，監査役が株主でなければならない旨を定款で定めることができる。"},{"l":4,"m":"監査役","sb":"定款の定めによる監査範囲の限定","i":"B","r":"(令7I問題13ウ類)","q":"監査役の監査の範囲を会計に関するものに限定する旨の定款の定めがある株式会社は，その旨を登記しなければならない。","a":true,"c":"911条3項17号イ。","e":""},{"l":5,"m":"監査役","sb":"定款の定めによる監査範囲の限定","i":"B","r":"","q":"監査役の監査の範囲を会計に関するものに限定する旨の定款の定めがある株式会社は，監査役設置会社である。","a":false,"c":"2条9号。","e":"監査役設置会社とは，監査役を置く株式会社（その監査役の監査の範囲を会計に関するものに限定する旨の定款の定めがあるものを除く）または会社法の規定により監査役を置かなければならない株式会社をいう。"},{"l":6,"m":"監査役","sb":"定款の定めによる監査範囲の限定","i":"B","r":"(平27II問題10ウ)","q":"監査の範囲を会計に関するものに限定された監査役は，いつでも，会計帳簿またはこれに関する資料の閲覧および謄写をすることができる。","a":true,"c":"389条4項。","e":"取締役および会計参与ならびに支配人その他の使用人に対して会計に関する報告を求める場合も同様である。"},{"l":7,"m":"監査役","sb":"定款の定めによる監査範囲の限定","i":"B","r":"(令7I問題13エ類)","q":"監査の範囲を会計に関するものに限定された監査役は，いつでも，株式会社の業務および財産の状況の調査をすることができる。","a":false,"c":"389条5項。","e":"監査の範囲を会計に関するものに限定された監査役は，その職務を行うため必要があるときは，株式会社の業務および財産の状況の調査をすることができる。また，株式会社の子会社に会計に関する報告を求めること，または，その子会社の業務および財産の状況の調査をする場合も同様である。"},{"l":8,"m":"監査役","sb":"定款の定めによる監査範囲の限定","i":"B","r":"(平29I問題13エ)","q":"監査の範囲を会計に関するものに限定された監査役は，取締役が株主総会に提出しようとするすべての議案，書類等を調査し，その調査の結果を株主総会に報告しなければならない。","a":false,"c":"389条3項。","e":"監査の範囲を会計に関するものに限定された監査役は，取締役が株主総会に提出しようとする会計に関する議案，書類等を調査し，その調査の結果を株主総会に報告しなければならない。監査の範囲を限定していない監査役の調査結果報告義務（384条後段）と異なり，株主総会に対する報告を常に要求している。"},{"l":9,"m":"監査役","sb":"定款の定めによる監査範囲の限定","i":"B","r":"(平27II問題10イ)","q":"株式会社の定款の定めにより監査の範囲を会計監査に限定された監査役は，当該株式会社の株主が取締役の責任追及の訴えを提起する前に，当該株式会社に対して行う当該責任追及に係る提訴請求を適法に受けることができる。","a":false,"c":"389条7項。","e":"386 条の規定（会社と取締役との間の訴えにおいて，馴れ合い訴訟を防止するために，監査役が会社を代表する規定）は，監査役設置会社に適用されるものであるため，監査の範囲を会計に関するものに限定する旨の定款の定めがある株式会社には適用されない。したがって，株式会社が監査役の監査の範囲を会計に関するものに限定する旨を定款で定めた場合，株式会社と取締役との間の訴えにおいては，監査役がいない株式会社と同様に，株主総会または取締役会での定めがない場合は，代表取締役が株式会社を代表することとなる（353条，364条，349条４項）。"},{"l":10,"m":"監査役","sb":"定款の定めによる監査範囲の限定","i":"B","r":"(平27I問題10イ)","q":"取締役会設置会社において，監査役の監査の範囲を会計に関するものに限定する旨の定款の定めがある監査役は，取締役会に出席しなければならない。","a":false,"c":"389条7項,383条。","e":"定款の定めにより監査役の監査の範囲を会計に関するものに限定した株式会社については，取締役会出席義務および意見陳述義務に関する規定は適用されない。"},{"l":11,"m":"監査役","sb":"定款の定めによる監査範囲の限定","i":"B","r":"(平27I問題10ウ)","q":"監査役の監査の範囲を会計に関するものに限定する旨の定款の定めがある監査役は，取締役に対して事業の報告を求める権限を有しない。","a":true,"c":"389条7項,381条2項。","e":"定款の定めにより監査役の監査の範囲を会計に関するものに限定した株式会社については，事業報告要求権に関する規定は適用されない。"},{"l":1,"m":"監査役","sb":"監査役の報酬等","i":"A","r":"","q":"監査役の報酬等は，定款にその額を定めていないときは，株主総会の普通決議によって定める。","a":true,"c":"387条1項。","e":"監査役の報酬規制の趣旨は，監査役の独立性を確保することである。また，同趣旨で，監査役は，株主総会において，監査役の報酬等について意見を述べることができる（387条３項）。"},{"l":2,"m":"監査役","sb":"監査役の報酬等","i":"A","r":"(平23II問題11ウ)","q":"監査役は，株主総会において，監査役の報酬等について意見を述べることができる。","a":true,"c":"387条3項。","e":""},{"l":3,"m":"監査役","sb":"監査役の報酬等","i":"A","r":"","q":"監査役が２人以上いる場合においては，各監査役の報酬について定款または株主総会の決議によって定めなければならない。","a":false,"c":"387条2項。","e":"監査役が２人以上いる場合において，各監査役の報酬等について定款の定めまたは株主総会の決議がない場合は，当該報酬等は，定款または株主総会により決定した報酬等の範囲内において，監査役の協議によって定めることとされている。"},{"l":1,"m":"監査役","sb":"費用等の請求","i":"A","r":"(令2II問題11ア)","q":"監査役が費用の前払を株式会社に請求する場合には，当該監査役は，当該費用が監査に必要な費用であることを証明する必要はない。","a":true,"c":"388条1号。","e":"監査役がその職務の執行について会社に対して費用の前払の請求をしたときは，当該会社は，当該請求に係る費用が当該監査役の職務の執行に必要でないことを証明した場合を除き，当該請求を拒むことができない。監査役の監査費用等の請求規定の趣旨は，監査役の独立性を確保することである。監査役に監査費用が職務の執行に必要であるという証明責任を負わせてしまうと，監査費用の支出に躊躇し，十分な監査を行うことができない危険性がある。そこで，会社法は，証明責任を会社側に転換することにより監査の充実を図っているのである。"},{"l":2,"m":"監査役","sb":"費用等の請求","i":"A","r":"(平29I問題13ウ)","q":"監査役の監査の範囲を会計に関するものに限定する旨を定款で定めている株式会社において，監査役は，その職務の執行について当該株式会社に対して費用の前払の請求をすることができない。","a":false,"c":"388条1号。","e":"監査役がその職務の執行について監査役設置会社（監査役の監査の範囲を会計に関するものに限定する旨の定めがある株式会社を含む）に対して費用の前払の請求をしたときは，当該会社は，当該請求に係る費用または債務が当該監査役の職務の執行に必要でないことを証明した場合を除き，当該請求を拒むことができない。この規定は，監査役の監査の範囲を会計に関するものに限定する旨の定めがある株式会社にも適用されるため，本肢は誤りである。"},{"l":1,"m":"監査役会","sb":"監査役会の構成","i":"A","r":"(令6I問題10ウ・令3問題10ウ類・平28I問題7ウ・平23I問題10ア)","q":"監査役会設置会社においては，監査役は，３人以上で，そのうち過半数は，社外監査役でなければならない。","a":false,"c":"335条3項。","e":"監査役会設置会社において，監査役は，３人以上で，そのうち半数以上は，社外監査役でなければならない。ここで，監査役会設置会社において社外監査役の員数が監査役の半数以上とされたのは，監査役就任前に株式会社または子会社の取締役や使用人であったために社内情報に通じた者と，社外監査役として株式会社の過去のしがらみにとらわれず判断し，かつ，代表取締役にも直言できる独立性の高い者とが協力して監査を実施することが期待されているからである。"},{"l":2,"m":"監査役会","sb":"監査役会の構成","i":"A","r":"(令3問題10エ類・平23I問題10イ類・平23II問題10ア・平22II問題8エ類)","q":"監査役会は，社外監査役以外の監査役の中から，常勤の監査役を選定しなければならない。","a":false,"c":"390条3項。","e":"監査役会は，監査役の中から常勤の監査役を選定しなければならない。したがって，社外監査役を常勤監査役として選定することも認められる。"},{"l":3,"m":"監査役会","sb":"監査役会の構成","i":"A","r":"(平21問題8エ)","q":"大会社でない監査役会設置会社は，常勤の監査役を選定しなくてもよい。","a":false,"c":"390条2項2号。","e":"監査役会の職務として，常勤の監査役の選定および解職が定められており，大会社か否かにかかわらず，常勤の監査役を設置する必要がある。"},{"l":4,"m":"監査役会","sb":"監査役会の構成","i":"A","r":"(平30I問題8ウ)","q":"監査役会設置会社は，常勤の監査役を選定する旨を，定款によって定めなければならない。","a":false,"c":"","e":"監査役会設置会社は，常勤の監査役を選定する必要があるが（390条３項），その旨を定款に定める必要はない。"},{"l":1,"m":"監査役会","sb":"監査役会の権限等","i":"A","r":"(平24II問題12エ類・平23I問題10ウ)","q":"監査役会は，監査の方針，監査役会設置会社の業務および財産の状況の調査の方法その他の監査役の職務の執行に関する事項の決定をするが，当該決定は，監査役の権限の行使を妨げることはできない。","a":true,"c":"390条2項柱書ただし書3号。","e":"監査の方針等の決定は，監査役の権限の行使を妨げることはできないとされている。すなわち，監査役会において役割分担等を決定したとしても，各監査役の監査権限を制限することはできないのである。このように，監査役会を設置した場合であっても，各監査役は独任制の機関である。"},{"l":2,"m":"監査役会","sb":"監査役会の権限等","i":"B","r":"","q":"監査役は，監査役会の要請があるときは，いつでも，その職務の状況を監査役会に報告しなければならない。","a":true,"c":"390条4項。","e":"各監査役の監査機関としての活動について連絡・調整を行い，連携協力することで，監査の実効性を高めるためである。"},{"l":1,"m":"監査役会","sb":"監査役会の招集","i":"A","r":"(平23II問題10ウ)","q":"定款で監査役会を招集する監査役を定めたときは，他の監査役は，監査役会を招集することができない。","a":false,"c":"391条。","e":"監査役会は，各監査役が招集する。監査役会の招集権者は，取締役会の場合（366条１項ただし書参照）と異なり，招集権者を限定することは認められない。これは，監査役が独任制の機関だからである。"},{"l":2,"m":"監査役会","sb":"監査役会の招集","i":"B","r":"(平22I問題12イ類)","q":"監査役会は，監査役の同意があっても，招集の手続を省略することができない。","a":false,"c":"392条2項。","e":"監査役会は，監査役の全員の同意がある場合は，招集の手続を経ることなく開催することができる。"},{"l":1,"m":"監査役会","sb":"監査役会の決議","i":"B","r":"","q":"監査役会の決議は，議決に加わることができる監査役の過半数が出席し，その過半数をもって行う。","a":false,"c":"393条1項。","e":"監査役会の決議は，監査役の過半数をもって行う。すなわち，監査役会の決議は，取締役会の場合（369 条１項参照）と異なり，定足数は設けられていない。また，決議の省略の制度（370条参照）も認められない。"},{"l":2,"m":"監査役会","sb":"監査役会の決議","i":"A","r":"(平30I問題12イ・平23I問題10エ)","q":"監査役会設置会社は，監査役の全員が書面または電磁的記録により同意の意思表示をしたときは，当該議案を可決する旨の監査役会の決議があったものとみなす旨を定款で定めることができる。","a":false,"c":"319条参照。","e":"監査役会制度の趣旨は，大規模な株式会社において，監査役が集まって監査の方針やそれぞれの役割分担を取り決め，互いに連携協力をすることにより，監査の重複等を避けた組織的かつ効率的な監査を可能とすることにある。したがって，決議の省略を認めてしまうと当該趣旨を達成することができないため，監査役会の決議には，取締役会の場合（370条参照）と異なり，決議の省略の制度は設けられていない。"},{"l":1,"m":"監査役会","sb":"監査役会の議事録","i":"B","r":"","q":"監査役会の議事については，議事録を作成し，議事録が書面をもって作成されているときは，出席した監査役は当該議事録に署名または記名押印しなければならない。","a":true,"c":"393条2項。","e":"監査役会の決議に参加した監査役であって，議事録に異議をとどめない者は，その決議に賛成したものと推定される（393条４項）。"},{"l":2,"m":"監査役会","sb":"監査役会の議事録","i":"A","r":"(平22I問題12エ)","q":"監査役会の決議に参加した監査役であって，監査役会の議事録に異議をとどめないものは，その決議に賛成したものと推定される。","a":true,"c":"393条4項。","e":""},{"l":3,"m":"監査役会","sb":"監査役会の議事録","i":"B","r":"(平23II問題10エ類)","q":"株主は，その権利を行使するため必要があるときは，株式会社の営業時間内はいつでも，監査役会議事録の閲覧を請求することができる。","a":false,"c":"394条2項。","e":"株主は，その権利を行使するために必要があるときは，裁判所の許可を得て，監査役会議事録の閲覧または謄写を請求することができる。また，債権者が役員の責任を追及するため必要があるとき，および，親会社社員がその権利を行使するため必要があるときも，裁判所の許可を得て，議事録の閲覧または謄写を請求することができる（394 条３項）。ただし，裁判所は，監査役設置会社の株主の請求，もしくは，監査役会設置会社の債権者または親会社社員の請求に係る議事録の閲覧または謄写をすることにより，当該監査役会設置会社またはその親会社もしくは子会社に著しい損害を及ぼすおそれがあると認めるときは，当該請求を許可することができない（394条４項）。"},{"l":1,"m":"監査役会","sb":"監査役会への報告の省略","i":"C","r":"(令3問題10イ類)","q":"取締役，会計参与，監査役または会計監査人が監査役の全員に対して監査役会に報告すべき事項を通知したときは，当該事項を監査役会へ報告することを要しない。","a":true,"c":"395条。","e":""},{"l":1,"m":"会計参与","sb":"会計参与の権限","i":"A","r":"","q":"会計参与は，取締役（指名委員会等設置会社では執行役）の代わりに，計算書類およびその附属明細書，臨時計算書類ならびに連結計算書類を作成する。","a":false,"c":"374条1項前段6項。","e":"会計参与は，取締役（指名委員会等設置会社では執行役）と共同して，計算書類およびその附属明細書，臨時計算書類ならびに連結計算書類を作成する。この場合において，会計参与は，法務省令で定めるところにより，会計参与報告を作成しなければならない（374条１項後段）。"},{"l":2,"m":"会計参与","sb":"会計参与の権限","i":"B","r":"","q":"会計参与は，いつでも，会計帳簿またはこれに関する資料の閲覧および謄写をすることができる。","a":true,"c":"374条2項。","e":"また，会計参与は，いつでも，取締役（指名委員会等設置会社では取締役および執行役）および支配人その他の使用人に対して会計に関する報告を求めることができる（374条２項柱書）。"},{"l":3,"m":"会計参与","sb":"会計参与の権限","i":"B","r":"(令4II問題12ア)","q":"会計参与は，いつでも，取締役および支配人その他の使用人に対して会計に関する報告を求めることができる。","a":true,"c":"374条2項柱書,6項。","e":""},{"l":4,"m":"会計参与","sb":"会計参与の権限","i":"B","r":"(令4II問題12イ)","q":"会計参与は，いつでも，会計参与設置会社の業務および財産の状況の調査をすることができる。","a":false,"c":"374条3項。","e":"会計参与は，その職務を行うため必要があるときは，会計参与設置会社の業務および財産の状況の調査をすることができる。これは，会計参与設置会社の子会社に対して会計に関する報告を求め，または，業務および財産の状況を調査する場合も同様である。"},{"l":5,"m":"会計参与","sb":"会計参与の権限","i":"B","r":"(平24I問題11エ類)","q":"会計参与は，その職務を行うため必要があるときは，会計参与設置会社の子会社に対して会計に関する報告を求めることができるが，当該子会社は，正当な理由があるときは，当該報告を拒むことができる。","a":true,"c":"374条3項4項。","e":""},{"l":6,"m":"会計参与","sb":"会計参与の権限","i":"B","r":"(令4II問題12エ類)","q":"会計参与は，株主総会において，計算書類等の作成に関して株主から質問がなされた場合に限り，意見を述べることができる。","a":false,"c":"377条1項。","e":"計算書類等の作成に関する事項について会計参与が取締役（指名委員会等設置会社では執行役）と意見を異にするときは，会計参与は，株主総会において意見を述べることができる（377 条）。すなわち，会計参与は自発的に意見を述べることが認められている。"},{"l":7,"m":"会計参与","sb":"会計参与の権限","i":"A","r":"(令2I問題11イ類・平27II問題9ウ・平25II問題10イ類・平22I問題13イ類)","q":"監査役設置会社の会計参与は，その職務を行うに際して取締役の職務の執行に関し不正の行為または法令もしくは定款に違反する重大な事実があることを発見したときは，遅滞なく，これを株主に報告しなければならない。","a":false,"c":"375条1項。","e":"会計参与は，その職務を行うに際して取締役（指名委員会等設置会社では執行役または取締役）の職務執行に関し不正の行為または法令もしくは定款に違反する重大な事実があることを発見したときは，遅滞なく，これを株主（監査役設置会社では監査役，監査役会設置会社では監査役会，監査等委員会設置会社では監査等委員会，指名委員会等設置会社では監査委員会）に報告しなければならない（375条）。"},{"l":8,"m":"会計参与","sb":"会計参与の権限","i":"A","r":"(平22II問題10ウ)","q":"指名委員会等設置会社の会計参与は，その職務を行うに際して執行役または取締役の職務執行に関し不正の行為を発見したときは，遅滞なく，監査委員会に報告しなければならない。","a":true,"c":"375条1項4項。","e":""},{"l":9,"m":"会計参与","sb":"会計参与の権限","i":"A","r":"(平26II問題10イ)","q":"取締役会設置会社の会計参与が税理士法人である場合には，その職務を行うべき社員は，臨時計算書類の承認をする取締役会に出席しなければならない。","a":true,"c":"376条1項前段。","e":"取締役会設置会社の会計参与（会計参与が監査法人または税理士法人である場合にはその職務を行うべき社員）は，計算書類，臨時計算書類または連結計算書類の承認をする取締役会に出席しなければならない。この場合において，会計参与は，必要があると認めるときは，意見を述べなければならない（376条１項後段）。"},{"l":10,"m":"会計参与","sb":"会計参与の権限","i":"A","r":"(令4II問題12ウ)","q":"取締役会設置会社の会計参与は，必要があると認めるときは，各事業年度に係る計算書類および事業報告ならびにこれらの附属明細書，臨時計算書類または連結計算書類を承認する取締役会の招集を請求することができる。","a":false,"c":"","e":"取締役会設置会社の会計参与は，計算書類，臨時計算書類または連結計算書類の承認をする取締役会に出席しなければならない（376 条１項前段）。この場合において，会計参与は，必要があると認めるときは，意見を述べなければならない（同条項後段）。このような取締役会出席義務や意見陳述義務は法定されているが，取締役会の招集請求権は会計参与には認められていないため，本肢は誤りである。"},{"l":1,"m":"会計参与","sb":"会計参与の報酬等","i":"A","r":"(平31I問題11エ・平24I問題11ウ類)","q":"指名委員会等設置会社以外の取締役会設置会社における会計参与の報酬等は，定款にその額を定めていないときは，取締役会の決議によって定める。","a":false,"c":"379条1項。","e":"指名委員会等設置会社以外の株式会社における会計参与の報酬等については，定款または株主総会（普通決議）によって定める（379条１項）。この趣旨は，会計参与の独立性を確保することにある。また，会計参与が２人以上ある場合において，各会計参与の報酬等について定款の定めまたは株主総会の決議がない場合は，当該報酬等は，定款または株主総会により決定した報酬等の範囲内において，会計参与の協議によって定めることとされている（379条２項）。"},{"l":2,"m":"会計参与","sb":"会計参与の報酬等","i":"A","r":"(平23II問題11イ)","q":"会計参与は，株主総会において，会計参与の報酬等について意見を述べることができる。","a":true,"c":"379条3項。","e":"会計参与の独立性を確保するためである。"},{"l":3,"m":"会計参与","sb":"会計参与の報酬等","i":"B","r":"","q":"会計参与がその職務の執行について会計参与設置会社に対して費用の前払の請求をする場合は，当該会計参与設置会社に対して，当該請求に係る費用が当該会計参与の職務の執行に必要であることを証明しなければならない。","a":false,"c":"380条1号。","e":"会計参与がその職務の執行について会社に対して費用の前払の請求をしたときは，当該会社は，当該請求に係る費用が当該会計参与の職務の執行に必要でないことを証明した場合を除き，当該請求を拒むことができない。監査役の監査費用等の請求規定と同様である。"},{"l":1,"m":"会計監査人","sb":"","i":"A","r":"","q":"会計監査人は，いつでも，会計帳簿またはこれに関する資料の閲覧または謄写をすることができる。","a":true,"c":"396条2項。","e":""},{"l":2,"m":"会計監査人","sb":"","i":"A","r":"(令3問題12ア類・平26II問題11ア)","q":"会計監査人は，いつでも，支配人その他の使用人に対し，会計に関する報告を求めることができる。","a":true,"c":"396条2項柱書。","e":"会計監査人の職務は会計監査であるので，会計監査人は，いつでも，取締役（指名委員会等設置会社では執行役および取締役），会計参与ならびに支配人その他の使用人に対し，会計に関する報告を求めることができる。"},{"l":3,"m":"会計監査人","sb":"","i":"A","r":"","q":"会計監査人は，いつでも，会計監査人設置会社の業務および財産の状況の調査をすることができる。","a":false,"c":"396条3項。","e":"会計監査人の職務および権限は，計算書類等の監査，すなわち会計監査に限定されており，業務監査権限はない。したがって，会計監査人設置会社の業務および財産の状況の調査をするためには，職務を行うため必要であることが要件となる。なお，裁判所の許可は不要である。また，会計監査人の監査対象会社は，会計監査人設置会社であるため，その子会社に対して会計に関する報告を求めること，または，子会社の業務および財産の状況の調査をする場合も同様に，職務を行うため必要であることが要件となる。"},{"l":4,"m":"会計監査人","sb":"","i":"A","r":"(平26II問題11イ)","q":"会計監査人は，その職務を行うために必要があるときは，会計監査人設置会社の親会社に対して会計に関する報告を求めることができる。","a":false,"c":"","e":"このような規定はない。会計監査人は，その職務を行うために必要があるときは，その子会社に対して会計に関する報告を求め，または会計監査人設置会社の子会社の業務および財産の状況の調査をすることができる（396条３項）。"},{"l":5,"m":"会計監査人","sb":"","i":"A","r":"(令3問題12イ類・平25I問題10ア)","q":"株式会社の会計監査人は，裁判所の許可を得なければ，当該株式会社の子会社の業務および財産の状況の調査をすることができない。","a":false,"c":"396条3項。","e":"会計監査人は，その職務を行うため必要があるときは，会計監査人設置会社の子会社の業務および財産の状況の調査をすることができる。なお，会計監査人の子会社調査権の行使については，裁判所の許可は不要である。"},{"l":6,"m":"会計監査人","sb":"","i":"A","r":"(平29II問題12エ)","q":"会計監査人が，会計監査人設置会社の子会社に対して会計に関する報告を求める場合において，当該子会社は，正当な理由があるときは，当該報告を拒むことができる。","a":true,"c":"396条4項。","e":"子会社調査権は，親会社が子会社を利用して粉飾決算を行う等の事例が少なくないことなどから，会計監査人に対して付与されている。"},{"l":7,"m":"会計監査人","sb":"","i":"A","r":"(平26II問題11ウエ類)","q":"計算書類が法令に適合するかどうかについて監査役会設置会社の会計監査人が監査役会と意見を異にするときは，当該会計監査人は，監査役会に出席して意見を述べることができる。","a":false,"c":"398 条1項3項。","e":"計算書類が法令または定款に適合するかどうかについて会計監査人が監査役（監査役会設置会社では監査役会または監査役，監査等委員会設置会社では監査等委員会またはその委員，指名委員会等設置会社では監査委員会またはその委員）と意見を異にするときは，会計監査人（会計監査人が監査法人である場合にはその職務を行うべき社員）は，定時株主総会に出席して意見を述べることができる（398条１項３項４項５項）。"},{"l":8,"m":"会計監査人","sb":"","i":"A","r":"(令3問題12ウ類・令2I問題11アエ類・平27I問題11ウ・平22I問題13エ)","q":"監査役会設置会社において，会計監査人は，その職務を行うに際して取締役の職務の執行に関し不正の行為があることを発見したときは，遅滞なく，これを取締役会に報告しなければならない。","a":false,"c":"397条1項3項。","e":"会計監査人は業務監査権を有しないが，会計監査人が行う会計監査の過程において取締役の不正な行為等について発見することがあり得る。そこで，そのような場合に適切な是正措置をとることができるようにするため，会計監査人には，当該事実を監査役（監査役会設置会社では監査役会，監査等委員会設置会社では監査等委員会，指名委員会等設置会社では監査委員会）へ報告することが義務づけられている。これは，会計参与に課せられている報告義務（375条）と同趣旨の規定である。"},{"l":9,"m":"会計監査人","sb":"","i":"A","r":"(令2II問題11エ・平27II問題10エ)","q":"監査役は，その職務を行うため必要があるときは，会計監査人に対し，その監査に関する報告を求めることができる。","a":true,"c":"397条2項。","e":"監査役の会計監査人に対する報告請求権は，監査役と会計監査人が連携し，効率的な監査を進めるためのものである。なお，監査等委員会設置会社においては監査等委員会が選定した監査等委員，指名委員会等設置会社においては監査委員会が選定した監査委員も同様の報告を求めることができる（397条２項４項５項）。"},{"l":10,"m":"会計監査人","sb":"","i":"A","r":"(平25I問題10ウ類)","q":"定時株主総会において会計監査人の出席を求める決議は，計算書類等が法令または定款に適合するか否かについて会計監査人が監査役と意見を異にする場合に限ってすることができる。","a":false,"c":"398条2項。","e":"定時株主総会において，会計監査人の出席を求める決議があったときは，会計監査人は，定時株主総会に出席して意見を述べなければならない。したがって，定時株主総会における出席要求決議に関しては，計算書類等の法令または定款の適合性について会計監査人と監査役とが意見を異にする必要はない。これに対して，会計監査人の株主総会における意見陳述権（398 条１項）については，計算書類等の法令または定款の適合性について会計監査人と監査役とが意見を異にすることが要件となっている。"},{"l":11,"m":"会計監査人","sb":"","i":"B","r":"(平22I問題12ウ)","q":"会計監査人は，監査役が作成した監査報告を受領した後でなければ，会計監査報告を作成することができない。","a":false,"c":"会社計算規則128条。","e":"会計監査については，監査役と会計監査人の権限の無意味な重複を避けるため，まず，会計監査人が会計監査を行い（会社計算規則126条），監査役は，その会計監査人の監査を前提として，会計監査人の監査の方法または結果についての各監査役の報告に基づき，会計監査人の監査の方法または結果を相当でないと認めた場合に，その旨および理由を監査報告に記載するという構造をとっている。"},{"l":12,"m":"会計監査人","sb":"","i":"B","r":"(平22I問題12ア)","q":"会計監査人は，監査役に対し，監査役会の目的である事項を示して，監査役会の招集を請求することができる。","a":false,"c":"","e":"このような規定はない。"},{"l":13,"m":"会計監査人","sb":"","i":"A","r":"(令6I問題13ア類・平28II問題13エ)","q":"監査等委員会設置会社において，会計監査人の報酬等の内容は監査等委員会が決定する。","a":false,"c":"","e":"会計監査人の報酬等については，会計監査人と株式会社との間で締結される監査契約において定められるため，一般の取引契約と同様に，通常の業務執行に関する事項として決定される。すなわち，取締役会等によって会計監査人の報酬等は決定される。ただし，会計監査人の独立性を確保するために，取締役は，会計監査人または一時会計監査人の職務を行うべき者の報酬等を定める場合には，監査役（監査役が２人以上ある場合はその過半数，監査役会設置会社では監査役会，監査等委員会設置会社では監査等委員会，指名委員会等設置会社では監査委員会）の同意を得なければならない（399条）。"},{"l":14,"m":"会計監査人","sb":"","i":"A","r":"(平29II問題12ウ)","q":"指名委員会等設置会社以外の取締役会設置会社において，定款に会計監査人の報酬等の額を定めていないときは，株主総会の決議によってこれを定める。","a":false,"c":"","e":"このような規定はない。問題13の解説参照。"},{"l":15,"m":"会計監査人","sb":"","i":"A","r":"(平23II問題11エ)","q":"会計監査人の報酬等は株主総会の決議によって定められ，会計監査人は，株主総会において，会計監査人の報酬等について意見を述べることが認められている。","a":false,"c":"399条参照。","e":"会計監査人の報酬等は監査契約で定められるため，株主総会で決定されるものではなく，会計監査人には，報酬に関する意見陳述権は認められていない。"},{"l":16,"m":"会計監査人","sb":"","i":"A","r":"(平27I問題11エ)","q":"指名委員会等設置会社における会計監査人の報酬の決定は，取締役会，または取締役会の決議によって委任を受けた執行役が行う。","a":true,"c":"","e":"会計監査人の報酬等は，通常の業務執行に関する事項として決定される。また，指名委員会等設置会社において執行役に委任することができない事項（416 条４項各号参照）に含まれていないため，取締役会の決議によってその決定を執行役に委任することができる。"},{"l":17,"m":"会計監査人","sb":"","i":"A","r":"(平31II問題13イ・平25I問題10イ)","q":"監査役会設置会社において，取締役が会計監査人の報酬を定める場合には，監査役会の同意を得なければならない。","a":true,"c":"399条1項2項。","e":"会計監査人の報酬等の決定に関する監査役等の同意が要求されている趣旨は，会計監査人の独立性を確保することにある。会計監査人の報酬等は，通常の業務執行に関する事項として決定されるが，多額の報酬等を与えることにより会計監査に手を加えてもらう，あるいは，少額の報酬等しか与えないことによって適切な監査の質および量を確保できなくなるといった事態が生じるのを防止するため，監査役等に対して同意権を与えて報酬等の適正さを確保し，もって，会計監査人の独立性を保持しようとしているのである。"},{"l":1,"m":"指名委員会等設置会社","sb":"委員の選定および解職等","i":"A","r":"(令2II問題8エ)","q":"指名委員会等設置会社は，定款に，指名委員会，監査委員会および報酬委員会を置く旨を定めなければならない。","a":true,"c":"2条12号,326条2項。","e":"指名委員会等設置会社とは，指名委員会，監査委員会および報酬委員会（指名委員会等）を置く株式会社をいう。株式会社は，定款の定めによって，取締役会，会計参与，監査役，監査役会，会計監査人，監査等委員会または指名委員会等を置くことができる。つまり，株式会社において必ず設置が義務づけられている機関（株主総会および取締役）以外の機関を置く場合には，定款にその旨を定めなければならない。"},{"l":2,"m":"指名委員会等設置会社","sb":"委員の選定および解職等","i":"A","r":"(令6I問題8イ類・平30II問題13イ類)","q":"指名委員会等設置会社において，各委員会は，委員３人以上で組織し，そのうち１人以上は，社外取締役でなければならない。","a":false,"c":"400条1項3項。","e":"各委員会の委員の過半数は，社外取締役でなければならない。業務執行の監督機能を強化するために，各委員会の委員の構成については，独立性の高い社外取締役が過半数を占めることが要請されているのである。"},{"l":3,"m":"指名委員会等設置会社","sb":"委員の選定および解職等","i":"A","r":"(平21問題13エ)","q":"監査役会は，その半数の監査役が社外監査役であればよいが，監査委員会は，その過半数の委員が社外取締役でなければならない。","a":true,"c":"335条3項,400条3項。","e":""},{"l":4,"m":"指名委員会等設置会社","sb":"委員の選定および解職等","i":"A","r":"(令7I問題12ア類・令6II問題8エ)","q":"指名委員会等設置会社において，各委員会の委員は，取締役の中から，取締役会の決議によって選定する。","a":true,"c":"400条2項。","e":""},{"l":5,"m":"指名委員会等設置会社","sb":"委員の選定および解職等","i":"A","r":"(平29II問題8ウ)","q":"指名委員会等設置会社においては，取締役の選任は，各委員会の委員である取締役とそれ以外の取締役とを区別してしなければならない。","a":false,"c":"400条2項。","e":"各委員会の委員は，取締役の中から，取締役会の決議によって選定する。これに対して，監査等委員会設置会社においては，取締役の選任は，監査等委員である取締役とそれ以外の取締役とを区別してしなければならない（329 条２項）。監査等委員の独立性を確保するためである。このように，監査等委員は，株主総会の決議により取締役の地位と一体となって選任されるのである。この点，指名委員会等設置会社の監査委員が取締役会で選定されることと異なるため（400条２項），監査等委員会設置会社における監査等委員の身分は，監査役に近いものと考えられる。"},{"l":6,"m":"指名委員会等設置会社","sb":"委員の選定および解職等","i":"A","r":"(平24I問題12ウ)","q":"執行役でない取締役は，取締役会において，各委員会のいずれかの委員に選定されなければならない。","a":false,"c":"","e":"指名委員会等設置会社の取締役は各委員会の委員にならなくてもよい。"},{"l":7,"m":"指名委員会等設置会社","sb":"委員の選定および解職等","i":"B","r":"(令7I問題12ウ類・平23I問題11イ)","q":"取締役会は，監査委員会の決議がなければ，指名委員会の委員を解職することができない。","a":false,"c":"401条1項。","e":"各委員会の委員は，いつでも，取締役会の決議によって解職することができる。なお，監査委員会には，指名委員会の委員を解職する権限はない。"},{"l":8,"m":"指名委員会等設置会社","sb":"委員の選定および解職等","i":"B","r":"","q":"取締役会の決議によって解職された各委員会の委員は，その解職について正当な理由がある場合を除き，指名委員会等設置会社に対して，解職によって生じた損害の賠償を請求することができる。","a":false,"c":"","e":"各委員会の委員の解職については，役員等のような正当な理由なく任期途中で解任された場合の損害賠償請求に関する規定（339条２項，403条２項）はない。"},{"l":1,"m":"指名委員会等設置会社","sb":"指名委員会","i":"A","r":"(平29I問題12イ)","q":"指名委員会等設置会社の指名委員会の委員は，社外取締役である者を除いて，当該会社の執行役を兼ねることができる。","a":true,"c":"","e":"指名委員会および報酬委員会の委員については，監査委員のような兼任禁止の規定（400 条４項）は設けられていない。"},{"l":2,"m":"指名委員会等設置会社","sb":"指名委員会","i":"A","r":"(平25II問題12ア類・平22II問題12ウ類・平21問題12ア類・平20問題14エ)","q":"指名委員会は，株主総会に提出する取締役および執行役の選任および解任に関する議案の内容を決定する。","a":false,"c":"404条1項。","e":"指名委員会は，株主総会に提出する取締役（会計参与設置会社では，取締役および会計参与）の選任および解任に関する議案の内容を決定する。執行役の選任および解任は取締役会の決議によってなされ（402条２項，403条１項），指名委員会には，執行役の選任および解任に関する権限は一切与えられていない。その理由は，指名委員会等設置会社における取締役会は，執行役の職務の分掌，指揮命令関係その他の執行役相互の関係に関する事項を定めなければならないため（416 条１項１号ハ），当該事項の決定と密接に関係する執行役の選任および解任についても，執行役に対する監督権限の一部として取締役会の権限とする必要があるからである。"},{"l":3,"m":"指名委員会等設置会社","sb":"指名委員会","i":"B","r":"","q":"指名委員会は，取締役（会計参与設置会社では，取締役および会計参与）の選任および解任を決定する。","a":false,"c":"","e":"指名委員会の権限は，あくまで，株主総会に提出する取締役（会計参与設置会社では，取締役および会計参与）の選任および解任に関する議案の内容の決定であるため（404 条１項），取締役の選任および解任権限は有していないことに注意する必要がある。すなわち，指名委員会等設置会社においても，取締役の選任および解任は，指名委員会によって決定された議案を基に，株主総会の決議によってなされるのである（329条１項，339条１項，341条）。"},{"l":4,"m":"指名委員会等設置会社","sb":"指名委員会","i":"A","r":"(令2I問題12イ)","q":"指名委員会は，株主総会に提出する会計監査人の選任および解任ならびに会計監査人を再任しないことに関する議案の内容を決定する。","a":false,"c":"404条2項2号。","e":"株主総会に提出する会計監査人の選任および解任ならびに会計監査人を再任しないことに関する議案の内容は，監査委員会が決定する。会計監査人の独立性を確保すると同時に，監査委員会と会計監査人との職務上の密接な関係に鑑みて，その選任等につき監査委員会の意思を反映させるためである。"},{"l":5,"m":"指名委員会等設置会社","sb":"指名委員会","i":"A","r":"(平26I問題11エ)","q":"指名委員会等設置会社において，取締役が会計監査人の解任を株主総会の目的とする場合には，指名委員会の同意を得なければならない。","a":false,"c":"","e":"指名委員会等設置会社においては，株主総会に提出する会計監査人の選任および解任ならびに会計監査人を再任しないことに関する議案の内容の決定は監査委員会が行う（404 条２項２号）。なお，問題文のような規定は設けられていない。"},{"l":1,"m":"指名委員会等設置会社","sb":"監査委員会","i":"A","r":"(平25II問題12イ・平21問題13ウ類)","q":"株主総会に提出する会計監査人の選任および解任ならびに会計監査人を再任しないことに関する議案の内容は，監査委員会によって決定される。","a":true,"c":"404条2項2号。","e":"会計監査人の業務執行者からの独立性を確保すると同時に，会計監査業務の面で密接に関係するため，会計監査人の人事について監査委員会の意見を反映させることに合理性があるためである。なお，株主総会に提出する取締役（会計参与設置会社では，取締役および会計参与）の選任および解任に関する議案の内容の決定は指名委員会の職務であるため，区別しておさえてほしい。"},{"l":2,"m":"指名委員会等設置会社","sb":"監査委員会","i":"A","r":"(令2I問題7エ類・平28I問題11ア)","q":"監査役会設置会社は常勤の監査役を置かなければならないが，指名委員会等設置会社は常勤の監査委員を置かなくてもよい。","a":true,"c":"","e":"監査役の場合，自らが業務および財産の調査等を行うのが通常であるのに対し，監査委員は，取締役会が設ける内部統制部門を通じて監査を行う。すなわち，監査委員会の職務は，内部統制システムが適切に整備および運用されているかを監視し，必要に応じて内部統制部門に対し具体的指示をすることである。こうした監査方法の違いを反映して，監査委員の中に監査役会設置会社における常勤監査役（390 条３項）に相当する者を定めることは義務づけられていない。"},{"l":3,"m":"指名委員会等設置会社","sb":"監査委員会","i":"A","r":"(平23I問題11ウ)","q":"執行役を兼ねる取締役は，監査委員となることができない。","a":true,"c":"400条4項。","e":"自己監査の防止と独立性の確保の趣旨から，監査委員は指名委員会等設置会社もしくはその子会社の執行役を兼ねることができない。"},{"l":4,"m":"指名委員会等設置会社","sb":"監査委員会","i":"A","r":"(平24I問題12ア)","q":"監査委員会の委員は，当該指名委員会等設置会社の子会社の業務執行取締役を兼ねることができない。","a":true,"c":"400条4項。","e":"監査対象者からの独立性を確保するため，監査委員会の委員は，当該指名委員会等設置会社の子会社の業務執行取締役を兼ねることができない。"},{"l":5,"m":"指名委員会等設置会社","sb":"監査委員会","i":"A","r":"","q":"監査委員会の委員は，子会社の会計参与を兼ねることができる。","a":false,"c":"400条4項。","e":"監査委員は，指名委員会等設置会社もしくはその子会社の執行役もしくは業務執行取締役または指名委員会等設置会社の子会社の会計参与（会計参与が法人であるとき，その職務を行うべき社員）もしくは支配人その他の使用人を兼ねることができない。"},{"l":6,"m":"指名委員会等設置会社","sb":"監査委員会","i":"A","r":"(平29I問題12ウ)","q":"指名委員会等設置会社においては，監査委員のうち，監査委員会が選定する者に限り，当該会社の業務および財産の状況の調査をすることができる。","a":true,"c":"405条1項。","e":"指名委員会等設置会社においては，監査委員会が選定する監査委員が監査権限を行使するのが原則である。監査委員の場合，監査役のように自らが業務および財産の調査等を行うことは想定されておらず，調査等は，必要があれば内部統制部門に対し指示をする形で行われるため，その指示が複数の者からなされることになると組織に混乱をもたらしてしまうことになるからである。したがって，監査委員は，監査役と異なり独任制の機関ではない。"},{"l":7,"m":"指名委員会等設置会社","sb":"監査委員会","i":"B","r":"(平28I問題11イ・平21問題13イ類)","q":"監査役会設置会社の監査役は，監査役会が作成した監査報告に自己が作成した監査報告の内容を付記することができるが，指名委員会等設置会社の監査委員は，監査委員会が作成した監査報告に異なる意見を付記することができない。","a":false,"c":"会社法施行規則130条2項後段,会社計算規則128条2項後段,会社法施行規則131条1項","e":"後段，会社計算規則129条１項後段。監査委員は独任制の機関ではないが，監査役設置会社における監査役の独任制の長所とされる部分について，例外的に監査委員に対しても認めているのである。"},{"l":8,"m":"指名委員会等設置会社","sb":"監査委員会","i":"A","r":"(平28I問題11エ・平21問題13ア)","q":"株式会社の業務および財産の状況の調査につき，監査役会設置会社の監査役は監査役会が定めた調査の方法とは異なる方法で調査を行うことができるが，指名委員会等設置会社の監査委員は調査に関する監査委員会の決議に従わなければならない。","a":true,"c":"405条4項。","e":"指名委員会等設置会社における監査委員は，監査役と異なり独任制の機関ではないため，事業報告要求権，業務財産調査権または子会社調査権（405 条１項２項）について，監査委員会の決議があるときは，監査委員会が選定する監査委員は，これに従わなければならない。このように監査委員会が選定する監査委員は，監査委員会としての意思決定に従い，統一のとれた調査活動を行うことが求められている。"},{"l":9,"m":"指名委員会等設置会社","sb":"監査委員会","i":"A","r":"","q":"監査委員会から選定された監査委員は，業務および財産の状況の調査に関する事項についての監査委員会の決議がある場合であっても，その権限の行使が妨げられることはない。","a":false,"c":"405条4項。","e":"監査委員会から選定された監査委員は，事業報告の徴収や業務財産の調査に関する事項についての監査委員会の決議があるときは，これに従わなければならない。監査委員会が選定する監査委員は，監査委員会としての意思決定に従い，統一のとれた調査活動を行うことが求められる。"},{"l":10,"m":"指名委員会等設置会社","sb":"監査委員会","i":"C","r":"","q":"すべての監査委員は，執行役または取締役が不正の行為をするおそれがあると認めるときは，遅滞なく，その旨を取締役会に報告しなければならない。","a":true,"c":"406条。","e":"① 取締役会への報告義務（406条），② 執行役または取締役の違法行為差止請求権（407条１項）といった迅速な対応が期待されるものについては，各監査委員が単独で行使することができることとされている。"},{"l":11,"m":"指名委員会等設置会社","sb":"監査委員会","i":"B","r":"","q":"監査委員会が選定する監査委員以外の監査委員は，執行役または取締役が法令または定款に違反する行為をするおそれがある場合において，当該行為によって当該指名委員会等設置会社に著しい損害が生じるおそれがあるときであっても，当該執行役または取締役に対し，当該行為をやめさせることを請求することができない。","a":false,"c":"407条1項。","e":"監査委員会が選定する監査委員以外の監査委員であっても，執行役または取締役の違法行為差止請求権を行使することができる。"},{"l":12,"m":"指名委員会等設置会社","sb":"監査委員会","i":"C","r":"(令2II問題12エ)","q":"指名委員会等設置会社において，監査委員は，取締役が株主総会に提出しようとする議案が法令または定款に違反すると認めるときは，その旨を株主総会に報告しなければならない。","a":false,"c":"","e":"監査役設置会社において，監査役は，取締役が株主総会に提出しようとする議案，書類その他法務省令で定めるものを調査しなければならない。この場合において，法令もしくは定款に違反し，または著しく不当な事項があると認めるときは，その調査の結果を株主総会に報告しなければならない（384 条）。また，監査等委員会設置会社において，監査等委員は，取締役が株主総会に提出しようとする議案，書類その他法務省令で定めるものについて法令もしくは定款に違反し，または著しく不当な事項があると認めるときは，その旨を株主総会に報告しなければならない（399 条の５）。これに対して，指名委員会等設置会社における監査委員には，これに対応する義務はない。監査委員は，取締役として株主総会の議案等を検討し，これに法令違反等があると認めるときは，取締役会への報告（406条）により対応することが想定されているためである。"},{"l":1,"m":"指名委員会等設置会社","sb":"報酬委員会","i":"A","r":"(平24I問題12イ)","q":"報酬委員会の委員は，指名委員会の委員を兼ねることができない。","a":false,"c":"","e":"各委員会の委員間の兼任禁止規定は存在しない。"},{"l":2,"m":"指名委員会等設置会社","sb":"報酬委員会","i":"A","r":"","q":"報酬委員会は，株主総会に提出する執行役等の報酬等の議案の内容の決定をする。","a":false,"c":"404条3項前段。","e":"報酬委員会は，執行役等（執行役および取締役（会計参与設置会社では執行役，取締役および会計参与））の個人別の報酬等の内容を決定する。したがって，指名委員会等設置会社では，指名委員会等設置会社以外の株式会社のように取締役の報酬等について定款または株主総会で定める必要はなく，それゆえ取締役の報酬等が株主総会の議案となることもない。"},{"l":3,"m":"指名委員会等設置会社","sb":"報酬委員会","i":"A","r":"(令7I問題12イ類・平31II問題13ウ)","q":"指名委員会等設置会社の報酬委員会の委員である取締役の報酬等の内容は，定款または株主総会の決議によって定めなければならない。","a":false,"c":"404条3項前段。","e":"指名委員会等設置会社においては，報酬委員会が執行役等（執行役および取締役（会計参与設置会社では執行役，取締役および会計参与））の個人別の報酬等の内容を決定する。この規定は，報酬委員会の委員である取締役についても適用される。"},{"l":4,"m":"指名委員会等設置会社","sb":"報酬委員会","i":"A","r":"(令2I問題12ウ)","q":"報酬委員会は，執行役の個人別の報酬の内容を決定するに際し，執行役が当該指名委員会等設置会社の支配人その他の使用人を兼ねているときは，使用人分の報酬についても決定する。","a":true,"c":"404条3項後段。","e":"報酬委員会が使用人兼務執行役の使用人部分の報酬等の内容も決定するのは，使用人部分の報酬等を通じた規制の回避を防止するためである。"},{"l":5,"m":"指名委員会等設置会社","sb":"報酬委員会","i":"A","r":"(平23I問題11エ)","q":"報酬委員会は，代表執行役に執行役の個人別の報酬内容の決定を委任することができない。","a":true,"c":"404条3項。","e":"報酬委員会を設置する趣旨は，業務執行に対する監督機能を執行役等の報酬等を通じて強化することにあるため，その権限を代表執行役に委任することはできない。"},{"l":6,"m":"指名委員会等設置会社","sb":"報酬委員会","i":"A","r":"(平25II問題12ウ)","q":"報酬委員会の委員の報酬等については，報酬委員会がその内容を決定することはできない。","a":false,"c":"404条3項前段。","e":"報酬委員会は，執行役等（執行役および取締役（会計参与設置会社では執行役，取締役および会計参与））の個人別の報酬等の内容を決定する。ここで，報酬委員会の委員は取締役であるので，報酬委員会がその個人別の報酬等の内容を決定することになる。"},{"l":7,"m":"指名委員会等設置会社","sb":"報酬委員会","i":"A","r":"","q":"報酬委員会は，執行役等の個人別の報酬等の内容に係る決定に関する方針を定めなければならず，報酬等の内容を決定するには，当該方針に従わなければならない。","a":true,"c":"409条1項2項。","e":""},{"l":8,"m":"指名委員会等設置会社","sb":"報酬委員会","i":"A","r":"(令6II問題13エ)","q":"指名委員会等設置会社の場合には，会計参与の報酬等の内容は，報酬委員会が決定する。","a":true,"c":"409条1項。","e":"報酬委員会は，執行役等（会計参与設置会社では執行役，取締役および会計参与）の個人別の報酬等の内容に係る決定に関する方針を定めなければならない。また，報酬委員会は，執行役等の個人別の報酬等の内容を決定するには，当該方針に従わなければならない（同条２項）。"},{"l":9,"m":"指名委員会等設置会社","sb":"報酬委員会","i":"A","r":"(平27II問題9エ類)","q":"報酬委員会は，会計参与の報酬等として業績連動型報酬を定めることができる。","a":false,"c":"409条3項柱書ただし書。","e":"報酬委員会が決定する会計参与の報酬等は，額が確定しているものでなければならない。"},{"l":1,"m":"指名委員会等設置会社","sb":"委員会の運営","i":"C","r":"(令4I問題12イ類)","q":"指名委員会等は，当該指名委員会等の各委員が招集するが，定款または当該委員会で定めることにより，当該指名委員会等を招集することができる委員を限定することができる。","a":false,"c":"410条。","e":"指名委員会等は，当該指名委員会等の各委員が招集する。招集権者を限定することができないのは，社外取締役である委員の招集権を確保するためである。"},{"l":2,"m":"指名委員会等設置会社","sb":"委員会の運営","i":"C","r":"","q":"指名委員会等は，当該委員会の委員の全員の同意があるときは，招集の手続を経ることなく開催することができる。","a":true,"c":"411条2項。","e":"指名委員会等を招集するには，その委員は，指名委員会等の日の１週間（取締役会で短縮可）前までに当該指名委員会等の各委員に対してその通知を発しなければならない（411 条１項）。しかし，当該指名委員会等の委員の全員の同意があれば，招集の手続を経ることなく開催することができる。"},{"l":3,"m":"指名委員会等設置会社","sb":"委員会の運営","i":"C","r":"","q":"執行役は，その職務を行うため必要があるときは，指名委員会等に出席することができる。","a":false,"c":"411条3項。","e":"執行役は，委員会の要求があったときは，当該委員会に出席し，当該委員会が求めた事項について説明をしなければならない。すなわち，指名委員会等に求められたときに出席義務があるだけで，出席権はない。なお，当該委員会の委員でない者や会計参与も同様である。"},{"l":4,"m":"指名委員会等設置会社","sb":"委員会の運営","i":"C","r":"","q":"ある委員会の委員でない取締役であっても，当該委員会の要求があったときは，当該委員会に出席し，当該委員会が求めた事項について説明しなければならない。","a":true,"c":"411条3項。","e":""},{"l":5,"m":"指名委員会等設置会社","sb":"委員会の運営","i":"C","r":"","q":"指名委員会等の決議は，議決に加わることができるその委員の過半数（取締役会で加重可）が出席し，その過半数（取締役会で加重可）をもって行う。","a":true,"c":"412条1項。","e":"指名委員会等は取締役会の内部機関としての性質を有するため，定足数および決議要件の加重は，取締役会の決議によってすることができる。なお，緩和は認められない。また，指名委員会等については，取締役会と異なり，定款の定めによっても決議の省略制度（書面決議）を採用することができない（370条対比）。"},{"l":6,"m":"指名委員会等設置会社","sb":"委員会の運営","i":"C","r":"","q":"指名委員会等の議事については，議事録を作成し，議事録が書面をもって作成されているときは，出席した委員は当該議事録に署名または記名押印しなければならない。","a":true,"c":"412条3項。","e":""},{"l":7,"m":"指名委員会等設置会社","sb":"委員会の運営","i":"A","r":"(令7I問題12エ・令4I問題12エ類・平31I問題13エ)","q":"執行役，取締役，会計参与または会計監査人が委員の全員に対して指名委員会等に報告すべき事項を通知したときは，当該事項を指名委員会等へ報告することを要しない。","a":true,"c":"414条。","e":"委員会への報告義務は，委員に情報を与えることを目的としているから，各委員に情報が通知により到達していれば，委員会への報告を省略しても問題はないのである。"},{"l":1,"m":"指名委員会等設置会社","sb":"執行役","i":"A","r":"(平22II問題12ア)","q":"公開会社である指名委員会等設置会社は，執行役が株主でなければならない旨を定款で定めることができない。","a":true,"c":"402条5項本文。","e":"公開会社は，株主が頻繁に変動することが想定されるため，株主以外の者からも広く有能な人材を執行役として選任できることが適切だからである。一方，非公開会社である指名委員会等設置会社にあっては，株主に限る旨を定款で定めることができる。"},{"l":2,"m":"指名委員会等設置会社","sb":"執行役","i":"B","r":"(令2I問題12エ類)","q":"執行役は，取締役を兼ねることができる。","a":true,"c":"402条6項。","e":"当該規定は，執行役による業務の執行と取締役会による業務執行の監督を区別することにより，業務執行の監督機能を強化するという趣旨に反するとも考えられるが，執行役と取締役の兼任を禁止してしまうと人材確保が困難となってしまうため，取締役との兼任が認められている。また，取締役会の監督機能の実行性を確保するためには，むしろ執行役兼務取締役を通じた情報提供が有用な場合もあり得るとされ，取締役と執行役の兼任自体は株式会社ごとに決定すべき事項であると捉え，その兼任を法律で禁止するまでもないとされたのである。"},{"l":3,"m":"指名委員会等設置会社","sb":"執行役","i":"B","r":"","q":"法人は執行役となることができる。","a":false,"c":"402条4項。","e":"取締役の資格の規定（331条１項）は，執行役について準用されるため，法人は執行役となることができない。"},{"l":4,"m":"指名委員会等設置会社","sb":"執行役","i":"A","r":"","q":"執行役は，支配人その他の使用人を兼ねることはできない。","a":false,"c":"","e":"指名委員会等設置会社の執行役は，当該指名委員会等設置会社の支配人その他の使用人を兼ねることができる。ただし，執行役は取締役を兼任することが認められているため，その場合は，支配人その他の使用人を兼ねることはできない（331条４項）。"},{"l":5,"m":"指名委員会等設置会社","sb":"執行役","i":"A","r":"(平20問題14ウ)","q":"執行役でもある取締役は，いずれの委員会の委員にもなることができない。","a":false,"c":"","e":"自己監査の防止と独立性の確保の趣旨から，監査委員は執行役を兼ねることができないが，指名委員および報酬委員については執行役を兼ねることができる。"},{"l":6,"m":"指名委員会等設置会社","sb":"執行役","i":"B","r":"","q":"執行役の任期は，選任後１年以内に終了する事業年度のうち最終のものに関する定時株主総会の終結の時までとする。","a":false,"c":"402条7項本文。","e":"執行役の任期は，選任後１年以内に終了する事業年度のうち最終のものに関する定時株主総会の終結後最初に招集される取締役会の終結の時までとする。執行役は，取締役会によって選任されるため（402 条２項），定時株主総会で選任された取締役によって組織される取締役会で，新執行役が選任されるまでが任期となっているのである。また，取締役会で選任されるという関係上，取締役の任期との連動がなされている。"},{"l":7,"m":"指名委員会等設置会社","sb":"執行役","i":"B","r":"","q":"執行役の任期は，定款または取締役会の決議によって，その任期を法定の任期よりも短縮することができる。","a":false,"c":"402条7項ただし書。","e":"執行役の任期は定款により短縮することが認められているが，決議による任期の短縮は認められていない。この点，取締役の場合は，株主総会の決議による短縮が認められていることと対比しておさえるようにしてほしい。また，執行役の任期の伸長は認められていない。"},{"l":8,"m":"指名委員会等設置会社","sb":"執行役","i":"A","r":"(令3問題11イ類・平22II問題12ウ類)","q":"執行役は，株主総会の決議により選任する。","a":false,"c":"402条2項。","e":"執行役は，取締役会の決議によって選任される。また，執行役は，いつでも，取締役会の決議によって解任することができる（403条１項）。"},{"l":9,"m":"指名委員会等設置会社","sb":"執行役","i":"A","r":"(平22I問題11ア)","q":"取締役会の決議によって解任された執行役は，その解任について正当な理由がある場合を除き，指名委員会等設置会社に対して，解任によって生じた損害の賠償を請求することができる。","a":true,"c":"403条2項。","e":""},{"l":10,"m":"指名委員会等設置会社","sb":"執行役","i":"B","r":"(令2II問題12イ・平22I問題14イ)","q":"執行役が欠けた場合または定款で定めた執行役の員数が欠けた場合において，裁判所は，必要があると認めるときは，利害関係人の申立てにより，一時執行役の職務を行うべき者を選任することができる。","a":true,"c":"403条3項,401条3項。","e":"委員の留任義務および一時委員の選任の規定は，執行役が欠けた場合，または，定款で定めた執行役の員数が欠けた場合について準用される。"},{"l":11,"m":"指名委員会等設置会社","sb":"執行役","i":"A","r":"","q":"執行役は，取締役会の決議によって委任を受けていなくても，指名委員会等設置会社が行う株式の分割の決定をすることができる。","a":false,"c":"418条1号。","e":"執行役の権限は，① 取締役会の決議によって委任を受けた指名委員会等設置会社の業務執行の決定，および，②指名委員会等設置会社の業務の執行である。すなわち，執行役は，取締役会の決議によって委任された範囲で業務執行の決定権限を有するのである。"},{"l":12,"m":"指名委員会等設置会社","sb":"執行役","i":"B","r":"(平22II問題12イ)","q":"執行役は，株式会社に対して善管注意義務を負うが，取締役とは異なり競業避止義務は負わない。","a":false,"c":"402条3項,419条2項,356条1項1号。","e":"執行役についても，競業避止義務（356 条１項１号）や利益相反取引の制限（356 条１項２号３号）については，取締役の場合と同様の規制がなされている。"},{"l":13,"m":"指名委員会等設置会社","sb":"執行役","i":"A","r":"(平31I問題13ウ類・平23I問題12エ類)","q":"執行役は，指名委員会等設置会社に著しい損害を及ぼすおそれのある事実を発見したときは，直ちに，当該事実を監査委員会に報告しなければならない。","a":false,"c":"419条1項。","e":"執行役は，指名委員会等設置会社に著しい損害を及ぼすおそれのある事実を発見したときは，直ちに，当該事実を監査委員に報告しなければならない。当該報告義務の趣旨は，会社の損害を未然に防止することである。ここで，執行役の報告の相手方を監査委員会とせず，監査委員にしているのは，執行役に報告義務が生じたときは，最寄りの監査委員に直ちに報告させることによって，当該監査委員に迅速に対応させるためである。"},{"l":1,"m":"指名委員会等設置会社","sb":"代表執行役","i":"A","r":"(平21問題10エ)","q":"指名委員会等設置会社において執行役が２人以上いる場合，その互選によって代表執行役を選定しなければならない。","a":false,"c":"420条1項。","e":"指名委員会等設置会社において，取締役会は，執行役の中から代表執行役を選定しなければならない。この場合において，執行役が１人のときは，その者が代表執行役に選定されたものとする。また，いつでも，取締役会の決議によって解職することができる（420条２項）。"},{"l":2,"m":"指名委員会等設置会社","sb":"代表執行役","i":"A","r":"(平25II問題12エ・平23I問題9エ類)","q":"指名委員会等設置会社がその執行役に対して訴えを提起する場合には，当該訴えについて指名委員会等設置会社を代表する監査委員は，取締役会によって選定される。","a":false,"c":"408条1項2号。","e":"指名委員会等設置会社において，株式会社と取締役または執行役との間の訴えについては，① 監査委員が当該訴えに係る訴訟の当事者である場合は，取締役会が定める者（株主総会が当該訴えについて会社を代表する者を定めた場合はその者），②監査委員が当該訴えに係る訴訟の当事者でない場合は，監査委員会が選定する監査委員が指名委員会等設置会社を代表する。"},{"l":3,"m":"指名委員会等設置会社","sb":"代表執行役","i":"A","r":"(令2I問題12ア)","q":"指名委員会等設置会社において，取締役会は，代表取締役を選定することができない。","a":true,"c":"","e":"指名委員会等設置会社においては，代表執行役が指名委員会等設置会社を代表するため（420条３項，349条４項），代表取締役が選定されることはない。"},{"l":1,"m":"指名委員会等設置会社","sb":"指名委員会等設置会社の取締役および取締役会の権限","i":"A","r":"(平29I問題12ア・平24I問題12エ類)","q":"指名委員会等設置会社の取締役は，各委員会の委員である者を除いて，当該会社の使用人を兼ねることができる。","a":false,"c":"331条4項。","e":"指名委員会等設置会社の取締役は，当該指名委員会等設置会社の支配人その他の使用人を兼ねることができない。指名委員会等設置会社における取締役会は，執行役等の業務執行の監督が中心であり，取締役会を構成する取締役が監督対象である執行役に従属する使用人となれば，実効的な監督をすることができないと考えられるからである。"},{"l":2,"m":"指名委員会等設置会社","sb":"指名委員会等設置会社の取締役および取締役会の権限","i":"B","r":"","q":"指名委員会等設置会社の取締役は，会社法または会社法に基づく命令に別段の定めがある場合を除き，指名委員会等設置会社の業務を執行することができない。","a":true,"c":"415条。","e":"これは，執行役による業務の執行と取締役会による業務執行の監督を区別することにより，業務執行の監督機能を強化するという趣旨から規定されている。"},{"l":3,"m":"指名委員会等設置会社","sb":"指名委員会等設置会社の取締役および取締役会の権限","i":"A","r":"(平25I問題11イ・平20問題14イ類)","q":"指名委員会等設置会社において，取締役会は，取締役の職務の執行が効率的に行われることを確保するための体制の整備を決定しなければならない。","a":false,"c":"416条1項1号ホ,会社法施行規則112条2項3号。","e":"指名委員会等設置会社の取締役会は，執行役の職務の執行が法令および定款に適合することを確保するための体制その他株式会社の業務の適正を確保するために必要なものとして法務省令で定める体制の整備の決定をしなければならない。そして，法務省令では，執行役の職務の執行が効率的に行われることを確保するための体制の整備を求めているが，取締役の職務の執行が効率的に行われることを確保するための体制については求められていない。したがって，本肢は誤りである。"},{"l":4,"m":"指名委員会等設置会社","sb":"指名委員会等設置会社の取締役および取締役会の権限","i":"A","r":"(平23II問題13ア)","q":"指名委員会等設置会社の取締役会は，経営の基本方針の決定を，執行役に委任することができる。","a":false,"c":"416条1項1号イ。","e":"指名委員会等設置会社の取締役会は，会社経営の基本方針，会社の業務執行の決定，執行役等の職務執行の監督を行う。したがって，執行役に委任することも認められない。"},{"l":5,"m":"指名委員会等設置会社","sb":"指名委員会等設置会社の取締役および取締役会の権限","i":"A","r":"(令3問題11ウ類・平29I問題12エ)","q":"指名委員会等設置会社において執行役が２人以上いる場合，執行役の職務の分掌に関する事項は，執行役の協議によって定める。","a":false,"c":"416条1項1号ハ,2項。","e":"指名委員会等設置会社の取締役会は，執行役が２人以上いる場合における執行役の職務の分掌および指揮命令の関係その他の執行役相互の関係に関する事項を決定しなければならず，当該決定を取締役や執行役に委任することができない（416条３項）。"},{"l":6,"m":"指名委員会等設置会社","sb":"指名委員会等設置会社の取締役および取締役会の権限","i":"A","r":"(平23I問題11ア)","q":"監査委員ではない取締役は，執行役の職務執行を監督する義務を負わない。","a":false,"c":"416条1項2号。","e":"指名委員会等設置会社の取締役会は執行役の職務執行の監督をする義務があるため，監査委員ではなくてもその構成員である取締役は当該義務を負うこととなる。"},{"l":7,"m":"指名委員会等設置会社","sb":"指名委員会等設置会社の取締役および取締役会の権限","i":"A","r":"(平26I問題10ア)","q":"指名委員会等設置会社の取締役会は，その決議によって，譲渡制限株式の譲渡等承認の決定および指定買取人の指定を執行役に委任することができる。","a":false,"c":"416条4項1号。","e":"指名委員会等設置会社の取締役会は，その決議によって，譲渡制限株式の譲渡等承認の決定および指定買取人の指定を執行役に委任することができない。"},{"l":8,"m":"指名委員会等設置会社","sb":"指名委員会等設置会社の取締役および取締役会の権限","i":"A","r":"(平30II問題10エ・平26I問題7イ類・平23II問題8イ類)","q":"指名委員会等設置会社の取締役会は，その決議によって，株主総会の日時および場所等の株主総会の招集に関する事項の決定を執行役に委任することができない。","a":true,"c":"416条4項4号。","e":"指名委員会等設置会社の取締役会は，その決議によって，株主総会の招集事項の決定を執行役に委任することができない。"},{"l":9,"m":"指名委員会等設置会社","sb":"指名委員会等設置会社の取締役および取締役会の権限","i":"A","r":"(令7I問題8ア類・平27I問題9エ・平26I問題10イ類・平21問題12イ)","q":"指名委員会等設置会社の取締役会は，その決議によって，重要な財産の処分および譲受けならびに多額の借財の決定を執行役に委任することができる。","a":true,"c":"416条4項各号参照。","e":"監査等委員会設置会社または指名委員会等設置会社以外の取締役会設置会社において，取締役会は，重要な財産の処分および譲受け，多額の借財を取締役に委任することはできない（362 条４項）。また，監査等委員会設置会社においても，原則として，当該事項を取締役に委任することができないが（399条の13第４項１号２号），一定の要件を満たした場合に限り，取締役会の決議によって，取締役に委任することができるとされている（同条５項６項）。これに対して，指名委員会等設置会社においては，特段の要件を求めることなく，取締役会の決議によって，当該事項を執行役に委任することができる。"},{"l":10,"m":"指名委員会等設置会社","sb":"指名委員会等設置会社の取締役および取締役会の権限","i":"A","r":"(平26I問題10ウ類・平23II問題13イ)","q":"指名委員会等設置会社の取締役会は，その決議によって，支配人その他の重要な使用人の選任および解任の決定を，執行役に委任することができる。","a":true,"c":"416条4項各号参照。","e":""},{"l":11,"m":"指名委員会等設置会社","sb":"指名委員会等設置会社の取締役および取締役会の権限","i":"A","r":"(平21問題12ウ類)","q":"指名委員会等設置会社の取締役会は，その決議によって，会社と取締役との間の取引の承認を執行役に委任することができる。","a":false,"c":"416条4項7号。","e":"競業取引および利益相反取引の承認については，執行役への委任が認められていない。"},{"l":12,"m":"指名委員会等設置会社","sb":"指名委員会等設置会社の取締役および取締役会の権限","i":"A","r":"(令6II問題16ア・令2II問題12ウ・平21問題12エ)","q":"指名委員会等設置会社における取締役会は，社債を引き受ける者の募集に関する重要な事項の決定を執行役に委任することができる。","a":true,"c":"416条4項各号参照。","e":"指名委員会等設置会社は，取締役会の決議により執行役を選任し，その執行役に業務執行の決定権限を大幅に委任することによって，迅速な業務執行の決定を可能にしている。ここで，社債を引き受ける者の募集に関する重要な事項の決定は執行役に委任できない事項に含まれていないことから，取締役会の決議によって，その決定を執行役に委任することができる。"},{"l":13,"m":"指名委員会等設置会社","sb":"指名委員会等設置会社の取締役および取締役会の権限","i":"A","r":"","q":"指名委員会等設置会社の取締役会は，その決議によって，補償契約の内容の決定を執行役に委任することができる。","a":false,"c":"416条4項14号。","e":"指名委員会等設置会社の取締役会は，その決議によって，補償契約の内容の決定を執行役に委任することができない。"},{"l":14,"m":"指名委員会等設置会社","sb":"指名委員会等設置会社の取締役および取締役会の権限","i":"A","r":"(平23II問題13ウ)","q":"指名委員会等設置会社の取締役会は，その決議によって，当該指名委員会等設置会社の株主総会の決議による承認を要しない略式吸収合併契約の内容の決定を，執行役に委任することができる。","a":true,"c":"416条4項19号かっこ書。","e":"略式吸収合併をする場合は，株主総会の特別決議を要しないため，執行役に当該契約の内容の決定を委任することができる。"},{"l":15,"m":"指名委員会等設置会社","sb":"指名委員会等設置会社の取締役および取締役会の権限","i":"A","r":"(令6I問題18ア・平26I問題10エ・平23II問題13エ)","q":"指名委員会等設置会社の取締役会は，その決議によって，株式移転計画の内容の決定を，執行役に委任することができる。","a":false,"c":"416条4項23号。","e":"株式移転契約の内容の決定は株式会社の運命を左右する重要事項であるので，執行役に当該契約の内容の決定を委任することができない。"},{"l":1,"m":"指名委員会等設置会社","sb":"指名委員会等設置会社の取締役会の運営","i":"A","r":"(令4I問題12イ類・平31I問題13イ・平24II問題10ウ類)","q":"指名委員会等の委員は，各自，遅滞なく，自己の職務の執行の状況を取締役会に報告しなければならない。","a":false,"c":"417条3項。","e":"指名委員会等がその委員の中から選定する者は，遅滞なく，当該指名委員会等の職務の執行の状況を取締役会に報告しなければならない。各委員会の活動に関して取締役会が情報を得ることにより，経営の基本方針（416 条１項１号イ）を確認しつつ，委員である取締役の職務執行の監督を実行するためである。"},{"l":2,"m":"指名委員会等設置会社","sb":"指名委員会等設置会社の取締役会の運営","i":"A","r":"(平31I問題13ア類・平27I問題9ウ類・平24II問題10エ・平22II問題12エ・平22I問題11エ類)","q":"執行役は，３か月に１回以上，自己の職務の執行状況を取締役会に報告しなければならない。この場合において，執行役は，代理人により報告をすることができない。","a":false,"c":"417条4項。","e":"執行役は，３か月に１回以上，自己の職務執行の状況を取締役会に報告しなければならない。この場合において，執行役は，他の執行役を代理人として当該報告をすることが認められている。これは，報告の効率性を考慮したものである。これに対して，指名委員会等設置会社以外の株式会社における代表取締役等の職務執行状況の定例報告（363条２項）については，代理人による報告は認められていない。また，執行役は，取締役会の要求があったときは，取締役会に出席し，取締役会が求めた事項について説明しなければならない（417条５項）。"},{"l":3,"m":"指名委員会等設置会社","sb":"指名委員会等設置会社の取締役会の運営","i":"A","r":"(令3問題11エ類・平22I問題11イ)","q":"執行役は，取締役会に出席する義務を負っており，必要があると認めるときは，意見を述べなければならない。","a":false,"c":"417条5項。","e":"執行役は，取締役会の要求があった場合に，取締役会の出席義務および説明義務を負う。"},{"l":1,"m":"監査等委員会設置会社","sb":"総論","i":"B","r":"","q":"監査等委員会設置会社とは，監査等委員会を置く株式会社をいう。","a":true,"c":"2条11号の2。","e":"監査等委員会設置会社の制度趣旨は，社外取締役の普及を図ることにある。"},{"l":2,"m":"監査等委員会設置会社","sb":"総論","i":"A","r":"(平31I問題8エ)","q":"監査等委員会設置会社には，１人または２人以上の執行役を置かなければならない。","a":false,"c":"","e":"監査等委員会設置会社は，指名委員会等設置会社と異なり，執行役が置かれず，指名委員会等設置会社以外の取締役会設置会社と同様，① 取締役の中から選定される代表取締役，および，② 代表取締役以外の取締役であって，取締役会の決議によって取締役会設置会社の業務を執行する取締役として選定されたものが業務を執行する（363 条１項）。"},{"l":1,"m":"監査等委員会設置会社","sb":"監査等委員会","i":"A","r":"(令5II問題11イ類・令2II問題8ウ・平29II問題8エ類)","q":"監査等委員会設置会社は，取締役の過半数が社外取締役でなければならない。","a":false,"c":"331条6項。","e":"監査等委員会の構成員である監査等委員は，３人以上で，その過半数は，社外取締役でなければならないとされている（331 条６項）。しかし，監査等委員以外の取締役を含めた全体の取締役の過半数が社外取締役であることは求められていない。なお，取締役の過半数が社外取締役である場合は，監査等委員会設置会社の取締役会は，その決議によって，重要な業務執行の決定を取締役に委任することができる（399条の13第５項）。"},{"l":2,"m":"監査等委員会設置会社","sb":"監査等委員会","i":"A","r":"(平31I問題8ウ)","q":"監査等委員は，取締役の中から，取締役会の決議によって選定する。","a":false,"c":"329条2項。","e":"監査等委員会設置会社においては，取締役の選任は，株主総会の決議において，監査等委員である取締役とそれ以外の取締役とを区別してしなければならない。このように，監査等委員は，株主総会の決議により取締役の地位と一体となって選任されるのである。"},{"l":3,"m":"監査等委員会設置会社","sb":"監査等委員会","i":"B","r":"","q":"監査等委員がその職務の執行について監査等委員会設置会社に対して費用の前払の請求をしたときは，当該監査等委員会設置会社は，当該請求に係る費用または債務が当該監査等委員の職務の執行に必要でないことを証明した場合を除き，これを拒むことができない。","a":true,"c":"399条の2第4項。","e":"監査役と同様の規定である。"},{"l":4,"m":"監査等委員会設置会社","sb":"監査等委員会","i":"A","r":"","q":"監査等委員会は，株主総会に提出する会計監査人の選任および解任ならびに会計監査人を再任しないことに関する議案の内容の決定を行う。","a":true,"c":"399条の2第3項2号。","e":"会計監査人の独立性を確保すると同時に，監査等委員会と会計監査人との職務上の密接な関係に鑑みて，その選任等につき監査等委員会の意思を反映させるためである。"},{"l":5,"m":"監査等委員会設置会社","sb":"監査等委員会","i":"B","r":"(令6I問題8エ・平30I問題11ア)","q":"監査等委員会は，監査等委員の中から常勤の監査等委員を選定しなければならない。","a":false,"c":"","e":"監査等委員会による取締役の職務の執行に対する監査の方法は，指名委員会等設置会社における監査委員会の監査の方法と同様である。すなわち，監査等委員は，取締役会が設ける内部統制部門を通じて監査を行う。すなわち，監査等委員会の職務は，内部統制システムが適切に整備および運用されているかを監視し，必要に応じて内部統制部門に対し具体的指示をすることである。こうした監査方法の違いを反映して，監査等委員の中に監査役会設置会社における常勤監査役（390条３項）に相当する者を定めることは義務づけられていない。"},{"l":6,"m":"監査等委員会設置会社","sb":"監査等委員会","i":"A","r":"(平31I問題8イ類)","q":"監査等委員である取締役は，監査等委員会設置会社の子会社の会計参与を兼ねることができる。","a":false,"c":"331条3項。","e":"監査等委員である取締役は，監査等委員会設置会社もしくはその子会社の業務執行取締役もしくは支配人その他の使用人または当該子会社の会計参与（会計参与が法人であるときは，その職務を行うべき社員）もしくは執行役を兼ねることができない。監査等委員である取締役の兼任禁止規定の趣旨は，監査役の兼任禁止規定の趣旨と同じである。すなわち，自己監査の防止と独立性の確保である。"},{"l":7,"m":"監査等委員会設置会社","sb":"監査等委員会","i":"A","r":"","q":"監査等委員である取締役は，監査等委員会設置会社の親会社の会計参与を兼ねることができる。","a":false,"c":"333条3項1号。","e":"会計参与の兼任禁止の規定（333 条３項１号）により，株式会社またはその子会社の取締役は会計参与となることができないため，監査等委員である取締役は株式会社またはその親会社の会計参与を兼ねることができない。"},{"l":8,"m":"監査等委員会設置会社","sb":"監査等委員会","i":"A","r":"","q":"監査等委員である取締役は，監査等委員会設置会社の親会社の監査役を兼ねることができる。","a":false,"c":"335条2項。","e":"監査役の兼任禁止の規定（335 条２項）により，監査役は株式会社の子会社の取締役を兼ねることができないため，監査等委員である取締役はその親会社の監査役を兼ねることができない。"},{"l":9,"m":"監査等委員会設置会社","sb":"監査等委員会","i":"A","r":"","q":"監査等委員は，いつでも，取締役に対して，その職務の執行に関する事項の報告を求めることができる。","a":false,"c":"399条の3第1項。","e":"監査等委員会が選定する監査等委員は，いつでも，取締役に対して，その職務の執行に関する事項の報告を求めることができる。監査等委員の場合，監査役のように自らが業務および財産の調査等を行うことは想定されておらず，調査等は，必要があれば内部統制部門に対し指示をする形で行われるため，その指示が複数の者からなされることになると組織に混乱をもたらしてしまうことになるからである。したがって，監査等委員は，監査役と異なり独任制の機関ではない。ただし，例外的に，① 取締役会または株主総会への報告義務（399条の４，399条の５），② 取締役の違法行為差止請求権（399 条の６）といった迅速な対応が期待されるものについては，各監査等委員が単独で行使することができることとされている。"},{"l":10,"m":"監査等委員会設置会社","sb":"監査等委員会","i":"A","r":"","q":"監査等委員会が選定する監査等委員は，監査等委員会設置会社の業務および財産の状況の調査に関する事項について，監査等委員会の決議があるときは，これに従わなければならない。","a":true,"c":"399条の3第4項。","e":"事業報告要求権，業務財産調査権または子会社調査権（399 条の３第１項第２項）について，監査等委員会の決議があるときは，監査等委員会が選定する監査等委員は，これに従わなければならない。監査等委員会が選定する監査等委員は，監査等委員会としての意思決定に従い，統一のとれた調査活動を行うことが求められる。"},{"l":11,"m":"監査等委員会設置会社","sb":"監査等委員会","i":"B","r":"(平30I問題11イ)","q":"監査等委員は，取締役が株主総会に提出しようとする議案について法令もしくは定款に違反し，または著しく不当な事項があると認めるとき，その旨を株主総会に報告する義務を負う。","a":true,"c":"399条の5。","e":"監査等委員の株主総会に対する報告義務は，指名委員会等設置会社の監査委員にはない義務であるが，監査役の義務にならって盛り込まれた（384 条参照）。指名委員会等設置会社における監査委員に当該義務がないのは，取締役として議案等を検討し，これに法令違反等があると認めるときは，取締役会への報告（406 条）により対応することが想定されるためである。ここで，監査等委員会設置会社の監査等委員も取締役であるので，議案等を検討し，これに法令違反等があると認めるときに，取締役会への報告をしなければならないことは，監査委員と同じであるが（399条の４），監査等委員会設置会社には，指名委員会等設置会社と異なり指名委員会および報酬委員会が置かれないことに鑑みれば，監査等委員には，取締役会だけでなく株主総会にも報告義務を課すことが適切と考えられるため，監査役と同様に（384条後段参照），株主総会への報告義務を課すこととしたのである。"},{"l":12,"m":"監査等委員会設置会社","sb":"監査等委員会","i":"A","r":"","q":"監査等委員会設置会社と取締役（取締役であった者を含む）との間の訴えにおいては，監査等委員会が選定する監査等委員が監査等委員会設置会社を代表する。","a":false,"c":"399条の7第1項。","e":"監査等委員会設置会社と取締役（取締役であった者を含む）との間の訴えにおいては，① 監査等委員が当該訴えに係る訴訟の当事者である場合は，取締役会が定める者（株主総会が当該訴えについて監査等委員会設置会社を代表する者を定めた場合にあっては，その者），② 監査等委員が当該訴えに係る訴訟の当事者でない場合は，監査等委員会が選定する監査等委員が監査等委員会設置会社を代表する。馴れ合い訴訟を防止する趣旨である。"},{"l":13,"m":"監査等委員会設置会社","sb":"監査等委員会","i":"B","r":"(令6I問題13イ)","q":"監査等委員会を招集する監査等委員（招集権者）を監査等委員会で定めた場合には，招集権者以外の監査等委員は，招集権者に対して監査等委員会の招集を請求し，当該請求の日から５日以内に，当該請求の日から２週間以内に開催される監査等委員会の招集の通知が発せられないときに限り，監査等委員会を招集することができる。","a":false,"c":"399条の8。","e":"監査等委員会は，各監査等委員が招集するものとされ，招集権者を限定することはできない。招集権者を限定することができないのは，社外取締役である監査等委員の招集権を確保するためである。"},{"l":14,"m":"監査等委員会設置会社","sb":"監査等委員会","i":"C","r":"","q":"監査等委員会を招集するには，監査等委員は，監査等委員会の日の１週間（これを下回る期間を取締役会で定めた場合にあっては，その期間）前までに，各監査等委員に対してその通知を発しなければならない。","a":false,"c":"399条の9第1項。","e":"指名委員会等設置会社の指名委員会等と異なり（411条１項参照），監査等委員会における招集通知期限の短縮は，取締役会の決議ではなく，定款の定めによることとしている。これは，監査等委員会が取締役会から一定程度独立したものとして位置づけられることを考慮して，監査役会と同様の規律（392条１項参照）としたものである。"},{"l":15,"m":"監査等委員会設置会社","sb":"監査等委員会","i":"B","r":"","q":"監査等委員会の決議は，監査等委員の過半数をもって行う。","a":false,"c":"399条の10第1項。","e":"監査等委員会の決議は，議決に加わることができる監査等委員の過半数が出席し，その過半数をもって行う。指名委員会等設置会社の指名委員会等と異なり（412 条１項参照），監査等委員会の定足数および決議要件については，取締役会の決議によって加重することはできない。これは，監査等委員会が取締役会から一定程度独立したものとして位置づけられることを考慮して，監査役会と同様の規律（393条１項参照）としたものである。"},{"l":16,"m":"監査等委員会設置会社","sb":"監査等委員会","i":"C","r":"","q":"監査等委員会設置会社の取締役は，監査等委員会の議事録の閲覧または謄写をすることができる。","a":false,"c":"399条の11参照。","e":"監査等委員会設置会社の監査等委員会は，取締役会の構成員である取締役から構成されるものの，取締役会の内部機関であるとはいえず，むしろ，取締役会から一定程度独立したものとして位置づけられる。そこで，監査役会設置会社における監査役会の議事録に関する規律（394 条参照）と同様に，監査等委員である取締役以外の取締役には監査等委員会の議事録の閲覧または謄写を認めないこととしている。これに対して，指名委員会等設置会社の取締役は，指名委員会等の委員でない場合であっても，指名委員会等の議事録の閲覧または謄写が認められている（413条２項）。"},{"l":17,"m":"監査等委員会設置会社","sb":"監査等委員会","i":"C","r":"","q":"監査等委員会設置会社の債権者は，取締役または会計参与の責任を追及する必要があるときは，裁判所の許可を得て，監査等委員会の議事録の閲覧または謄写の請求をすることができる。","a":true,"c":"399条の11第3項。","e":"指名委員会等設置会社の債権者は「委員」の責任を追及するため必要があるときは，裁判所の許可を得て，指名委員会等の議事録の閲覧または謄写の請求をすることができることとされている（413 条４項）。これは，指名委員会等は，あくまでも取締役会の内部機関として位置づけられることによるものである。これに対して，監査等委員会設置会社においては，監査役会設置会社における監査役会の議事録に関する規律（394 条参照）と同様に，監査等委員である取締役だけでなく，監査等委員である取締役以外の取締役または会計参与の責任を追及するため必要がある場合であっても，議事録の閲覧または謄写の請求をすることができる。"},{"l":18,"m":"監査等委員会設置会社","sb":"監査等委員会","i":"C","r":"(令2I問題11ウ)","q":"取締役，会計参与または会計監査人が監査等委員の全員に対して監査等委員会に報告すべき事項を通知したときは，当該事項を監査等委員会へ報告することを要しない。","a":true,"c":"399条の12。","e":""},{"l":1,"m":"監査等委員会設置会社","sb":"監査等委員会設置会社の取締役会","i":"A","r":"","q":"監査等委員会設置会社の取締役会は，経営の基本方針の決定を行う。","a":true,"c":"399条の13第1項1号イ。","e":"監査等委員会設置会社の取締役会は，① 経営の基本方針，② 監査等委員会の職務の執行のため必要なものとして法務省令で定める事項，③ 取締役の職務の執行が法令および定款に適合することを確保するための体制その他株式会社の業務ならびに当該株式会社およびその子会社から成る企業集団の業務の適正を確保するために必要なものとして法務省令で定める体制の整備（内部統制システムの整備），④ その他監査等委員会設置会社の業務執行の決定を行う（399条の13第１項１号）。なお，監査等委員会設置会社の取締役会は，①～③の事項を決定しなければならない（同条２項）。"},{"l":2,"m":"監査等委員会設置会社","sb":"監査等委員会設置会社の取締役会","i":"A","r":"(令6II問題8イ類・平28II問題13ア類)","q":"監査等委員会設置会社の取締役会は，取締役の中から代表取締役を選定しなければならない。","a":false,"c":"399条の13第1項3号3項。","e":"監査等委員会設置会社の取締役会は，取締役（監査等委員である取締役を除く）の中から代表取締役を選定しなければならない。また，代表取締役を解職する権限も有する。"},{"l":3,"m":"監査等委員会設置会社","sb":"監査等委員会設置会社の取締役会","i":"A","r":"","q":"監査等委員会設置会社の取締役会は，その決議によって，重要な財産の処分および譲受けの決定を取締役に委任することができる。","a":false,"c":"399条の13第4項1号。","e":"監査等委員会設置会社の取締役会は，重要な財産の処分および譲受けの決定を取締役に委任することができない。ただし，一定の要件を満たす場合は，この限りではない。"},{"l":4,"m":"監査等委員会設置会社","sb":"監査等委員会設置会社の取締役会","i":"A","r":"","q":"監査等委員会設置会社において，監査等委員会の承認を受けたときは，多額の借財の決定を取締役に委任することができる。","a":false,"c":"399条の13第4項2号。","e":"監査等委員会設置会社の取締役会は，一定の要件を満たす場合は，その決議によって多額の借財の決定を取締役に委任することができるが，監査等委員会の承認を受けても委任することができない。"},{"l":5,"m":"監査等委員会設置会社","sb":"監査等委員会設置会社の取締役会","i":"A","r":"(令6I問題13エ類)","q":"監査等委員会設置会社の取締役の過半数が社外取締役である場合には，当該監査等委員会設置会社の取締役会は，その決議によって，支配人その他の重要な使用人の選任および解任の決定を取締役に委任することができる。","a":true,"c":"399条の13第5項柱書本文。","e":"監査等委員会設置会社の取締役の過半数が社外取締役である場合には，業務執行者からの独立性が制度的に担保された監査等委員会が取締役の選解任や報酬等について意見陳述権を有していることと相まって，指名委員会や報酬委員会がなくても取締役会の業務執行者からの独立性がその構成上担保されているということができる。そこで，この場合には，監査等委員会設置会社の取締役会は，その決議によって，重要な業務執行の決定を取締役に委任することができることとしている。"},{"l":6,"m":"監査等委員会設置会社","sb":"監査等委員会設置会社の取締役会","i":"A","r":"(令3問題7ア類・平28I問題9ア類)","q":"監査等委員会設置会社の取締役の過半数が社外取締役である場合には，当該監査等委員会設置会社の取締役会は，その決議によって，株主総会に提出する議案の内容の決定を取締役に委任することができる。","a":false,"c":"399条の13第5項5号。","e":"監査等委員会設置会社において取締役に委任できる事項の範囲と指名委員会等設置会社において執行役に委任できる事項の範囲は実質的に等しい。したがって，監査等委員会設置会社の取締役の過半数が社外取締役である場合であっても，株主総会に提出する議案の内容の決定を取締役に委任することはできない。"},{"l":7,"m":"監査等委員会設置会社","sb":"監査等委員会設置会社の取締役会","i":"A","r":"(平28II問題13ウ)","q":"監査等委員会設置会社は，その定款において，支店その他重要な組織の設置，変更および廃止に係る決定を，取締役会の決議によって取締役に委任することができる旨を定めることができる。","a":true,"c":"399条の13第6項。","e":"監査等委員会設置会社においては，① 取締役の過半数が社外取締役である場合，または，② 定款の定めがある場合は，取締役会の決議によって，取締役に重要な業務執行の決定を委任することができる。ここで，監査等委員会設置会社において取締役に委任できる事項の範囲と指名委員会等設置会社において執行役に委任できる事項の範囲は実質的に等しい。したがって，監査等委員会設置会社において，①または②の要件を満たした場合は，取締役会の決議によって，支店その他重要な組織の設置，変更および廃止に係る決定を取締役に委任することができる。"},{"l":8,"m":"監査等委員会設置会社","sb":"監査等委員会設置会社の取締役会","i":"A","r":"","q":"監査等委員会設置会社は，特別取締役による取締役会の決議の制度を採用することができない。","a":false,"c":"373条1項柱書かっこ書。","e":"監査等委員会設置会社においては，① 取締役の過半数が社外取締役である場合（399条の13第５項），または，② 取締役会の決議によって重要な財産の処分および讓受けならびに多額の借財を取締役に委任することができる旨の定款の定めがある場合（399条の13第６項）は，特別取締役による取締役会の決議の制度を採用することができない（373 条１項柱書かっこ書）。この場合は，取締役会の決議によって，重要な財産の処分および譲受け等の決定を代表取締役等に委任することにより迅速な意思決定が可能なためである。"},{"l":9,"m":"監査等委員会設置会社","sb":"監査等委員会設置会社の取締役会","i":"B","r":"","q":"監査等委員会設置会社においては，招集権者の定めがある場合であっても，監査等委員会が選定する監査等委員は，取締役会を招集することができる。","a":true,"c":"399条の14。","e":"監査等委員会の職務の執行にあたって取締役会の決議を要する場合に備えた規定である。"},{"l":10,"m":"監査等委員会設置会社","sb":"監査等委員会設置会社の取締役会","i":"C","r":"","q":"監査等委員会がその委員の中から選定する者は，遅滞なく，当該監査等委員会の職務の執行の状況を取締役会に報告しなければならない。","a":false,"c":"","e":"監査等委員会設置会社においては，指名委員会等設置会社における監査委員会が選定する監査委員の委員会の職務執行の状況を取締役会に報告する義務（417 条３項）に対応するものは規定されていない。これは，監査等委員会が取締役会から一定程度独立したものとして位置づけられることを考慮して，監査役会と同様の規律としたものである。"},{"l":1,"m":"役員等の損害賠償責任","sb":"役員等の会社に対する損害賠償責任","i":"A","r":"(平31II問題12イ類・平28II問題12ア・平24I問題10イ類)","q":"取締役が，自己のために競業取引をすることについて当該取引につき重要な事実を開示して取締役会の承認を受けた場合，当該取締役の株式会社に対する任務懈怠責任の追及において，当該取引によって当該取締役が得た利益の額は，当該取締役の任務懈怠によって当該株式会社に生じた損害の額と推定される。","a":false,"c":"423条2項。","e":"取締役が，会社の承認を得ることなく，自己または第三者のために株式会社の事業の部類に属する取引をしたときは，当該取引によって取締役または第三者が得た利益の額は，株式会社に生じた損害の額と推定する。競業取引における損害額の推定規定の趣旨は，競業取引（356 条１項１号）によって会社が被った損害の額の立証を容易にすることである。また，執行役も同様に責任を負う。"},{"l":2,"m":"役員等の損害賠償責任","sb":"役員等の会社に対する損害賠償責任","i":"A","r":"(令4I問題11ウ類)","q":"取締役会設置会社の取締役が自己または第三者のために会社とした取引によって当該会社に損害が生じたときは，事前に取締役会で承認を得なかった場合に限り，会社と直接取引をした取締役に任務懈怠が推定される。","a":false,"c":"423条3項1号。","e":"取締役会設置会社の取締役が自己または第三者のために会社とした取引によって当該会社に損害が生じたときは，事前に取締役会で承認を得ていたか否かにかかわらず，会社と直接取引をした取締役に任務懈怠が推定される。利益相反取引（356 条１項２号３号）における任務懈怠の推定規定が設けられている趣旨は，利益相反取引は会社に損害を及ぼすおそれの大きい行為であることから，取締役または執行役に任務を怠らなかったことの立証責任を転換することで会社の利益の保護を図っているのである。また，執行役も同様に責任を負う。さらに，利益相反取引をすることを決定した取締役または執行役（423 条３項２号），利益相反取引に関する取締役会の承認決議に賛成した取締役（指名委員会等設置会社では，当該取引が会社と取締役との間の取引または会社と取締役との利益が相反する取引に限る）（423条３項３号）も同様である。"},{"l":3,"m":"役員等の損害賠償責任","sb":"役員等の会社に対する損害賠償責任","i":"A","r":"(令2II問題12 ア・平22I問題11ウ)","q":"指名委員会等設置会社において，取締役を兼ねていない執行役と指名委員会等設置会社との間の取引によって当該指名委員会等設置会社に損害が生じたときは，当該取引を承認する取締役会の決議に賛成した取締役は，任務を懈怠したものと推定される。","a":false,"c":"423条3項3号かっこ書。","e":"会社と執行役間の利益相反取引によって会社に損害が生じても，当該取引に関する取締役会決議に賛成した取締役は任務懈怠を推定されない。会社取締役間の利益相反取引ならば，同じ取締役という情実が入る余地があるので，損害が生じた場合に承認決議に賛成した取締役の任務懈怠が推定されるが，会社執行役間ではそのような事情がないからである。"},{"l":4,"m":"役員等の損害賠償責任","sb":"役員等の会社に対する損害賠償責任","i":"A","r":"(平31II問題12ウ・平30I問題11エ)","q":"監査等委員でない取締役が自己のために株式会社とする取引につき，当該取締役が監査等委員会の承認を受けたときでも，当該取引によって当該株式会社に損害が生じた場合には，当該取締役はその任務を怠ったものと推定される。","a":false,"c":"423条4項。","e":"取締役の利益相反取引（356 条１項２号３号）によって株式会社に損害が生じたときは，当該取引を行った取締役等はその任務を怠ったものと推定される（423 条３項）。しかし，監査等委員会設置会社において，取締役（監査等委員であるものを除く）が利益相反取引につき監査等委員会の承認を受けたときは，当該任務懈怠の推定規定が適用されない。これは，社外取締役に期待される利益相反の監督機能を前提に，監査等委員会制度の利用を促進するという政策的観点から認められたものである。"},{"l":5,"m":"役員等の損害賠償責任","sb":"役員等の会社に対する損害賠償責任","i":"B","r":"","q":"監査等委員会設置会社においては，取締役（監査等委員であるものを除く）の利益相反取引によって株式会社に損害が生じた場合であっても，当該取締役が事後的に当該取引につき監査等委員会の承認を受けたときはその任務懈怠が推定されない。","a":false,"c":"423条4項。","e":"423条４項は，「356条１項２号３号に掲げる場合において，取締役（監査等委員であるものを除く）が当該取引につき監査等委員会の承認を受けたとき」に，取締役の任務懈怠の推定規定を適用しないと定めている。ここで，356条１項２号３号に掲げる場合とは，取締役が利益相反取引を「しようとするとき」であることから，423 条４項は，監査等委員会が利益相反取引を事前に承認した場合の規定ということである。"},{"l":6,"m":"役員等の損害賠償責任","sb":"役員等の会社に対する損害賠償責任","i":"A","r":"(平31II問題12エ類)","q":"自己または第三者のために株式会社と取引をした取締役の，会社に対する損害賠償責任は，無過失責任であり，当該取締役が任務を怠らなかったことを証明しても免れることができない。","a":false,"c":"428条1項。","e":"自己のために株式会社と取引をした取締役の，会社に対する損害賠償責任は，無過失責任である。当該責任が無過失責任とされている理由は，自己のための直接取引は，利益相反性が著しく高いためである。"},{"l":7,"m":"役員等の損害賠償責任","sb":"役員等の会社に対する損害賠償責任","i":"A","r":"(平25II問題11ウ)","q":"指名委員会等設置会社において，執行役が自己のためにした利益相反取引により株式会社に損害が生じた場合には，総株主の同意により，当該執行役の当該株式会社に対する損害賠償責任を免除することができる。","a":true,"c":"424条。","e":"自己のために直接取引をした取締役または執行役の株式会社に対する損害賠償責任には，一部免除の規定（425条，426条，427条）を適用することができない（428条２項）。しかし，424条の規定による総株主の同意による免除の規定は適用される。"},{"l":8,"m":"役員等の損害賠償責任","sb":"役員等の会社に対する損害賠償責任","i":"B","r":"","q":"役員等が株式会社に生じた損害を賠償する責任を負う場合において，他の役員等も当該損害を賠償する責任を負うときは，これらの者は，連帯債務者とする。","a":true,"c":"430条。","e":""},{"l":9,"m":"役員等の損害賠償責任","sb":"役員等の会社に対する損害賠償責任","i":"A","r":"(令7I問題10イ類)","q":"役員等の株式会社に対する損害賠償責任を全額免除するためには，株主総会の特殊決議を要する。","a":false,"c":"424条。","e":"役員等の責任を追及する株主の代表訴訟提起権（847 条）が単独株主権であることから，責任免除には，総株主の同意が要求されている。なお，総株主が同意すればよいと規定されているため，株主総会を開催することまでは要求されていない。"},{"l":10,"m":"役員等の損害賠償責任","sb":"役員等の会社に対する損害賠償責任","i":"A","r":"(平31I問題12ア)","q":"取締役が自己のために株式会社と取引をした場合に，当該取引から生じた当該取締役の任務懈怠責任は，株主総会の特別決議による一部免除の対象とはならない。","a":true,"c":"428条2項。","e":"自己のために株式会社と取引をした取締役の株式会社に対する損害賠償責任は，総株主の同意があれば免除することができる（424条）が，責任の一部免除の規定（425条，426条，427条）は適用されない。"},{"l":11,"m":"役員等の損害賠償責任","sb":"役員等の会社に対する損害賠償責任","i":"A","r":"(平24I問題13ア)","q":"役員等の株式会社に対する損害賠償責任は，当該役員等が職務を行うについて善意無重過失である場合は，賠償の責任を負う額から最低責任限度額を控除して得た額を限度として，株主総会の特別決議により免除することができる。なお，当該株式会社に最終完全親会社等はないものとする。","a":true,"c":"425条1項,309条2項8号。","e":"この場合には，取締役は，当該株主総会において責任の原因となった事実および賠償の責任を負う額，免除可能限度額とその算定根拠，責任を免除すべき理由および免除額を開示しなければならない。"},{"l":12,"m":"役員等の損害賠償責任","sb":"役員等の会社に対する損害賠償責任","i":"A","r":"(平31I問題12ウ)","q":"指名委員会等設置会社の執行役の任務懈怠責任（自己のために直接取引をした執行役の責任は除く）は，株主総会の特別決議による一部免除の対象となる。","a":true,"c":"423条1項,425条。","e":"「役員等」には執行役も含まれる。株主総会の特別決議による一部免除の対象となる役員等に制限はないため，本肢は正しい。"},{"l":13,"m":"役員等の損害賠償責任","sb":"役員等の会社に対する損害賠償責任","i":"A","r":"(平31I問題12エ)","q":"会計監査人の任務懈怠責任は，株主総会の特別決議による一部免除の対象とはならない。","a":false,"c":"423条1項,425条。","e":"「役員等」には会計監査人も含まれる。株主総会の特別決議による一部免除の対象となる役員等に制限はないため，会計監査人の任務懈怠責任は，株主総会の特別決議による一部免除の対象となる。"},{"l":14,"m":"役員等の損害賠償責任","sb":"役員等の会社に対する損害賠償責任","i":"B","r":"","q":"代表取締役以外の取締役の株式会社に対する損害賠償責任に係る最低責任限度額の算定に際して，職務執行の対価として受ける財産上の利益の額に乗じる数は，社外取締役を除き，「４」である。","a":false,"c":"425条1項1号。","e":"最低責任限度額は，次の①と②の合計額により算出する。① 当該役員等がその在職中に会社から職務執行の対価として受け，または受けるべき財産上の利益の１年間あたりの額に相当する額として法務省令で定める方法により算定される額の，代表取締役または代表執行役は６年分，代表取締役以外の取締役（業務執行取締役等であるものに限る）または代表執行役以外の執行役は４年分，取締役（代表取締役および業務執行取締役等を除く），監査役，会計参与または会計監査人は２年分に相当する額，② 当該役員等が当該株式会社の新株予約権を有利な条件または金額で引き受けた場合（238条３項各号）で，当該役員等が就任後に新株予約権を行使または譲渡した場合の利益の額（会社法施行規則114条）。代表取締役以外の取締役の責任についての最低責任限度額を区別する基準は，社外取締役であるか否かではなく，業務執行取締役等であるか否かによる。"},{"l":15,"m":"役員等の損害賠償責任","sb":"役員等の会社に対する損害賠償責任","i":"B","r":"(平25II問題11イ)","q":"監査役会設置会社において，監査役の株式会社に対する損害賠償責任の一部免除に関する議案を株主総会に提出するには，他の監査役全員の同意を得なければならない。","a":false,"c":"425条3項。","e":"監査役会設置会社においては，取締役は，役員等の株式会社に対する損害賠償責任の一部免除（取締役の責任の免除に限る）に関する議案を株主総会に提出するには，各監査役の同意を得なければならない（425条３項）。"},{"l":16,"m":"役員等の損害賠償責任","sb":"役員等の会社に対する損害賠償責任","i":"B","r":"(平25II問題11ア)","q":"取締役の株式会社に対する損害賠償責任の一部を免除する株主総会の決議があった場合において，当該株式会社が当該決議後に当該取締役に対し退職慰労金を与えるときは，株主総会の特別決議による承認を受けなければならない。","a":false,"c":"425条4項前段,309条1項。","e":"役員等の責任を一部免除する株主総会の決議があった場合において，株式会社が当該決議後にその役員等に対して，退職慰労金その他の法務省令で定める財産上の利益を与えるときは，株主総会の承認を受けなければならない。当該決議は，普通決議で足りる。"},{"l":17,"m":"役員等の損害賠償責任","sb":"役員等の会社に対する損害賠償責任","i":"C","r":"","q":"指名委員会等設置会社では，役員等の会社に対する損害賠償責任は，当該役員等が職務を行うにつき善意無重過失である場合は，賠償の責任を負う額から最低責任限度額を控除して得た額を限度として，取締役会の決議によって一部免除することができる旨を定款で定めることができる。","a":false,"c":"426条1項。","e":"監査役設置会社（取締役が２人以上ある場合に限る），監査等委員会設置会社または指名委員会等設置会社は，役員等の株式会社に対する損害賠償責任（423 条１項）について，当該役員等が職務を行うにつき善意・無重過失であり，特に必要であると認められるときは，賠償の責任を負う額から最低責任限度額を控除して得た額を限度として，取締役（当該責任を負う取締役を除く）の過半数の同意（取締役会設置会社では取締役会の決議）によって免除することができる旨を定款で定めることができる。株主総会の特別決議による一部免除と異なり，特に必要と認められる場合に限定されるのは，取締役の過半数の同意・取締役会の決議による一部免除の場合は，一度定款が変更されてしまえば，その後，株主は責任免除に一切関与できないことになるため，免除することができる要件を厳格にしているのである。"},{"l":18,"m":"役員等の損害賠償責任","sb":"役員等の会社に対する損害賠償責任","i":"B","r":"(令5I問題12ア類)","q":"株式会社は，取締役（業務執行取締役等を除く）の株式会社に対する損害賠償責任について，当該取締役が職務を行うにつき善意でかつ重大な過失がないときは，定款で定めた額の範囲内であらかじめ株式会社が定めた額と最低責任限度額とのいずれか高い額を限度とする旨の契約を当該取締役と締結することができる旨を定款で定めることができる。","a":true,"c":"427条1項。","e":"株式会社は，非業務執行取締役等（取締役（業務執行取締役等であるものを除く），会計参与，監査役または会計監査人）の株式会社に対する損害賠償責任（423 条１項）について，当該非業務執行取締役等が職務を行うにつき善意・無重過失である場合には，定款で定めた額の範囲内であらかじめ株式会社が定めた額と最低責任限度額とのいずれか高い額を限度とする旨の契約を非業務執行取締役等と締結することができる旨を定款で定めることができる。すなわち，責任限定契約を締結することができる者を業務執行を行うかどうかで区別することとしているのである。責任限定契約の趣旨は，賠償責任に関する不安を除去し，非業務執行取締役等の人材を確保しやすくすることにある。"},{"l":19,"m":"役員等の損害賠償責任","sb":"役員等の会社に対する損害賠償責任","i":"B","r":"(平25II問題11エ)","q":"会計参与設置会社は，会計参与の株式会社に対する損害賠償責任について，責任限定契約を会計参与と締結することができる旨を定款で定めることができる。","a":true,"c":"427条1項。","e":"株式会社は，非業務執行取締役等（取締役（業務執行取締役等であるものを除く），会計参与，監査役または会計監査人）の株式会社に対する損害賠償責任（423 条１項）について，責任限定契約を非業務執行取締役等と締結することができる旨を定款で定めることができる。非業務執行取締役等との責任限定契約の趣旨は，賠償責任に関する不安を除去し，非業務執行取締役等の人材を確保しやすくすることにある。"},{"l":20,"m":"役員等の損害賠償責任","sb":"役員等の会社に対する損害賠償責任","i":"B","r":"(令5I問題12イ・平24I問題13イ)","q":"株式会社が，社外取締役との間で責任限定契約を締結した場合において，当該社外取締役が当該株式会社の業務執行取締役に就任したときは，当該契約は，その締結時に遡って，その効力を失う。","a":false,"c":"427条2項。","e":"責任限定契約を締結した非業務執行取締役等である社外取締役が社外性を喪失した場合，当該契約は将来に向かってその効力を失う。"},{"l":21,"m":"役員等の損害賠償責任","sb":"役員等の会社に対する損害賠償責任","i":"B","r":"(平24I問題13エ)","q":"株式会社は，社外取締役との間で責任限定契約を締結することができる旨を定款で定めた場合には，当該定款の定めについて登記しなければならない。","a":true,"c":"911条3項25号。","e":""},{"l":1,"m":"役員等の損害賠償責任","sb":"役員等の第三者に対する損害賠償責任","i":"A","r":"(平26II問題10ウ)","q":"会計参与がその職務を行うについて悪意または重大な過失があったときは，当該会計参与は，これによって第三者に生じた損害を賠償する責任を負う。","a":true,"c":"429条1項。","e":"役員等（取締役，会計参与，監査役，執行役または会計監査人）がその職務を行うについて悪意または重過失があったときは，当該役員等は，これによって第三者に生じた損害を賠償する責任を負う。"},{"l":2,"m":"役員等の損害賠償責任","sb":"役員等の第三者に対する損害賠償責任","i":"A","r":"","q":"会計監査人は，その職務を行うについて悪意重過失があったとしても，これによって第三者に生じた損害を賠償する責任を負わない。","a":false,"c":"429条1項。","e":"会計監査人も役員等に該当するので，第三者に対して損害賠償責任を負う。"},{"l":3,"m":"役員等の損害賠償責任","sb":"役員等の第三者に対する損害賠償責任","i":"B","r":"(平24I問題13ウ)","q":"役員等の第三者に対する損害賠償責任は，総株主の同意によって免除することができる。","a":false,"c":"","e":"役員等の第三者に対する損害賠償責任（429条）は，会社に対する損害賠償責任（423条１項）と異なり，総株主の同意による免除は認められない。"},{"l":4,"m":"役員等の損害賠償責任","sb":"役員等の第三者に対する損害賠償責任","i":"C","r":"","q":"最高裁判所の判例によれば，役員等の第三者に対する損害賠償責任は，役員等の保護を図るために責任を軽減することとした民法上の不法行為責任の特則であると解している。","a":false,"c":"最判昭44年11月26日。","e":"判例によると，役員等の任務懈怠によって損害を受けた第三者を保護するために，民法上の不法行為責任（民法709条）とは別に，会社法が定めた特別の法定責任であると解している。"},{"l":5,"m":"役員等の損害賠償責任","sb":"役員等の第三者に対する損害賠償責任","i":"B","r":"","q":"最高裁判所の判例によれば，役員等の第三者に対する損害賠償責任の対象となる損害は，直接損害のみならず，間接損害も含むとされる。","a":true,"c":"最判昭44年11月26日。","e":""},{"l":6,"m":"役員等の損害賠償責任","sb":"役員等の第三者に対する損害賠償責任","i":"B","r":"","q":"役員等が第三者に生じた損害を賠償する責任を負う場合において，他の役員等も当該損害を賠償する責任を負うときは，これらの者は，連帯債務者とする。","a":true,"c":"430条。","e":"なお，役員等の株式会社に対する損害賠償責任も同様に，役員等は連帯責任とされている。"},{"l":7,"m":"役員等の損害賠償責任","sb":"役員等の第三者に対する損害賠償責任","i":"B","r":"","q":"最高裁判所の判例によれば，取締役会設置会社において，代表取締役でない平取締役は，取締役会に上程されていない事項について監視義務を負わないとしている。","a":false,"c":"最判昭48年5月22日。","e":"判例によると，取締役会設置会社において，代表取締役でない平取締役が取締役会に上程されていない事項についても監視義務を負うとしている。なぜなら，各取締役には取締役会の招集権や招集請求権（366 条）が認められているため，取締役会決議に至っていない事項においても，取締役会を招集して，取締役会による取締役の職務執行の監督機能（362条２項２号）を発揮させることが可能であるし，期待されているからである。"},{"l":8,"m":"役員等の損害賠償責任","sb":"役員等の第三者に対する損害賠償責任","i":"B","r":"","q":"最高裁判所の判例によれば，名目的取締役であっても取締役であることには変わりはなく，職務として監視義務を負っているため，監視義務を怠った場合は任務懈怠があるとされる。","a":true,"c":"最判昭55年3月18日。","e":""},{"l":9,"m":"役員等の損害賠償責任","sb":"役員等の第三者に対する損害賠償責任","i":"C","r":"","q":"最高裁判所の判例によれば，株主総会において取締役として選任されていないにも関わらず，取締役として登記がなされている者は，役員等の第三者に対する損害賠償責任を負うことはない。","a":false,"c":"最判昭47年6月15日。","e":"判例によると，表見的取締役が，登記がなされることに承諾するなど，不実登記の作出に帰責性が認められる場合は，908 条２項の類推適用によって，自己が取締役でないことを善意の第三者に対抗することができず，429 条１項の責任を負うとしている。"},{"l":10,"m":"役員等の損害賠償責任","sb":"役員等の第三者に対する損害賠償責任","i":"C","r":"","q":"最高裁判所の判例によれば，取締役を退任しているにも関わらず，取締役の退任登記が未了で，取締役としての登記が残存している者は，退任後に生じた会社の損害について，役員等の第三者に対する損害賠償責任を負うことはない。","a":false,"c":"最判昭62年4月16日。","e":"退任登記未了の取締役が，不実登記を残存させることについて明示的に承諾を与えていたなどの特段の事情がある場合は，908 条２項の類推適用によって，自己が取締役でないことを善意の第三者に対抗することができず，429 条１項の責任を負うとしている。"},{"l":11,"m":"役員等の損害賠償責任","sb":"役員等の第三者に対する損害賠償責任","i":"B","r":"","q":"取締役が計算書類に記載すべき重要な事項についての虚偽の記載をしたときは，当該取締役が当該記載をすることについて注意を怠らなかったことを証明しない限り，当該取締役は，第三者に対して損害賠償責任を負う。","a":true,"c":"429条2項1号ロ。","e":"計算書類等に重要な虚偽記載が行われた場合，それを用いて取引を行った結果として損害を受けた第三者を保護する必要がある。そして，情報開示の重要性から，第三者の保護を強化する必要があるため，429 条１項の責任と異なり，立証責任が転換された過失責任とされているのである。"},{"l":1,"m":"役員等の損害賠償責任","sb":"株主代表訴訟","i":"B","r":"(平31I問題5イ類)","q":"株主代表訴訟は，株主の権利の行使に関して利益供与を受けた者に対して，その利益の返還を求める訴えについても対象とする。","a":true,"c":"847条1項本文。","e":"株主代表訴訟の対象となる訴えを責任追及等の訴えという。具体的には，① 発起人，設立時取締役，設立時監査役，役員等または清算人（発起人等）の責任を追及する訴え，② 株主等の権利の行使に関して利益供与を受けた者から利益の返還を求める訴え（120条３項），③ 出資の履行等を仮装した者に支払等を求める訴え（102条の２第１項，213条の２第１項，286条の２第１項），④ 不公正な払込金額等で株式または新株予約権を引き受けた者に差額の支払を求める訴え（212条１項，285条１項）である。"},{"l":2,"m":"役員等の損害賠償責任","sb":"株主代表訴訟","i":"A","r":"(平29I問題7エ)","q":"株式会社に対して取締役の責任を追及する訴えの提起を請求する権利は，単独株主権である。","a":true,"c":"847条1項本文。","e":""},{"l":3,"m":"役員等の損害賠償責任","sb":"株主代表訴訟","i":"A","r":"(平26I問題9ア)","q":"公開会社でない株式会社において，当該株式会社に対し，責任追及等の訴えの提起を請求しようとする株主は，６か月前から引き続き当該株式会社の株式を有していなければならない。","a":false,"c":"847条2項。","e":"株主が頻繁に変動する公開会社では，株式を取得した直後から株主提案権（303条～305条）や監督是正権（360条等）などの行使を認めてしまうと，当該権利を濫用的に行使されてしまう危険性がある。したがって，６か月の保有期間要件を要求し，権利が濫用されるのを防いでいるのである。これに対して，非公開会社においては，そのような保有期間要件は要求されていない。"},{"l":4,"m":"役員等の損害賠償責任","sb":"株主代表訴訟","i":"A","r":"","q":"６か月前から継続して株式を有する株主は，会社による役員等に対する責任追及がなされない場合に，会社のために，会社に代わって役員等の会社に対する責任を追及する訴えを，直ちに提起することができる。","a":false,"c":"847条1項3項。","e":"株式会社が役員等の責任を追及しない場合でも，株主は直ちに責任追及等の訴えを提起することができるわけではない。まず，会社に対して役員等の責任を追及する訴えの提起を請求し，その請求から 60 日間経過しても会社が責任追及等の訴えをしない場合に，当該請求をした株主は責任追及等の訴えを提起することができるのである。"},{"l":5,"m":"役員等の損害賠償責任","sb":"株主代表訴訟","i":"B","r":"","q":"株主が会社に対して役員等の会社に対する責任を追及する訴えを請求してから 60 日を経過した後に訴えを提起したのでは会社に回復することができない損害が生ずるおそれがある場合には，当該株主は，会社のために，直ちに責任追及等の訴えを提起することができる。","a":true,"c":"847条5項本文。","e":""},{"l":6,"m":"役員等の損害賠償責任","sb":"株主代表訴訟","i":"B","r":"","q":"株式会社は，株主の会社に対する役員等の責任を追及する訴えの提起の請求の日から，60日以内に責任追及等の訴えを提起しない場合は，当該請求をした株主に対し，遅滞なく，責任追及等の訴えを提起しない理由を書面その他の法務省令で定める方法により通知しなければならない。","a":false,"c":"847条4項。","e":"株式会社は，株主の会社に対する役員等の責任を追及する訴えの提起の請求の日から，60日以内に責任追及等の訴えを提起しない場合は，当該請求をした株主または責任追及等の対象とされている者から請求を受けたときは，当該請求をした者に対し，遅滞なく，責任追及等の訴えを提起しない理由を書面等により通知しなければならない。"},{"l":1,"m":"役員等の損害賠償責任","sb":"旧株主による責任追及等の訴え","i":"C","r":"","q":"旧株主とは，株式会社の株式交換または株式移転，もしくは，株式会社が吸収合併により消滅する会社となる吸収合併の効力発生日の６か月前から当該効力発生日まで引き続き株式会社の総株主（株主総会において決議をすることができる事項の全部につき議決権を行使することができない株主を除く）の議決権の100分の１以上の議決権を有する株主または発行済株式（自己株式を除く）の100分の１以上の数の株式を有する株主であった者をいう。","a":false,"c":"847条の2第1項柱書。","e":"旧株主による責任追及等の訴えは，単独株主権である。旧株主とは，株式会社の株式交換または株式移転，もしくは，株式会社が吸収合併により消滅する会社となる吸収合併の効力発生日の６か月（定款で短縮可）前から当該効力発生日まで引き続き株式会社の株主であった者をいう。なお，単元未満株主の権利を制限する定款の定め（189 条２項）で旧株主による責任追及等の訴えの提起を請求することができない単元未満株主は，旧株主に該当しない。また，非公開会社においては，６か月の保有期間要件は不要とされている（847条の２第２項）。"},{"l":2,"m":"役員等の損害賠償責任","sb":"旧株主による責任追及等の訴え","i":"C","r":"","q":"旧株主は，当該株式会社の株主でなくなった場合であっても，株式移転により当該株式会社の完全親会社の株式を取得し，引き続き当該株式を有するときは，株式移転完全子会社に対し，責任追及等の訴え（訴えを提起する時までにその原因となった事実が生じた責任または義務に係るものを含む）の提起を請求することができる。","a":false,"c":"847条の2第1項本文。","e":"旧株主は，当該株式会社の株主でなくなった場合であっても，次に掲げるときは，株式交換等完全子会社に対し，書面その他の法務省令で定める方法により，責任追及等の訴え（効力発生時までにその原因となった事実が生じた責任または義務に係るものに限る）の提起を請求することができる。ただし，責任追及等の訴えが当該旧株主もしくは第三者の不正な利益を図り，または，当該株式交換等完全子会社もしくはその完全親会社に損害を加えることを目的とする場合は，当該請求をすることができない（847条の２第１項ただし書）。旧株主による責任追及等の訴えの制度は，旧株主の意思によらずに責任追及等の訴えを提起し得る地位を失ったことから，株式交換等完全子会社に対して，責任追及等の訴えの提起を請求することができることとするものである。そのため，旧株主が責任追及等の訴えの提起を請求することができる責任または義務は，株式交換等の効力が生じた時点で旧株主が当該株式会社に対してその提起を請求することができたものとするのが相当である。そこで，旧株主は，当該株式交換等の効力が生じた時までにその原因となった事実が生じた責任または義務に係る責任追及等の訴えに限って，その提起を請求することができることとしている。"},{"l":3,"m":"役員等の損害賠償責任","sb":"旧株主による責任追及等の訴え","i":"C","r":"","q":"株式交換等完全子会社が旧株主による責任追及等の訴えの提訴請求の日から 60 日以内に責任追及等の訴えを提起しないときは，当該提訴請求をした旧株主は，株式交換等完全子会社のために，責任追及等の訴えを提起することができる。","a":true,"c":"847条の2第6項。","e":""},{"l":4,"m":"役員等の損害賠償責任","sb":"旧株主による責任追及等の訴え","i":"C","r":"","q":"株式交換等完全子会社に係る適格旧株主がある場合において，提訴請求の対象とすることができる責任（その免除について総株主の同意が必要とされているものに限る）は，株式交換等完全子会社の総株主の同意に加えて，適格旧株主の全員の同意がなければ，免除することができない。","a":true,"c":"847条の2第9項。","e":"株式交換等完全子会社の総株主の同意のみで責任を免除することができてしまうと，旧株主に原告適格を認めた意味がなくなってしまうからである。"},{"l":1,"m":"役員等の損害賠償責任","sb":"最終完全親会社等の株主による特定責任追及等の訴え(多重代表訴訟)","i":"B","r":"","q":"最終完全親会社等とは，株式会社の親会社等であって，その完全親会社等がないものをいう。","a":false,"c":"847条の3第1項柱書本文かっこ書。","e":"最終完全親会社等とは，株式会社の完全親会社等であって，その完全親会社等がないものをいう。完全親会社等ではない親会社，つまり子会社に少数株主がいる場合は，当該少数株主が株主代表訴訟を提起し，子会社の取締役等に対して責任を追及することで当該子会社の損害を回復することができる。この場合は，親会社の役員等には提訴懈怠の可能性があるとしても，当該少数株主にはそのような提訴懈怠の可能性はないと考えられるため，当該少数株主に子会社の取締役等の責任追及を委ねることが合理的であると考えられたのである。そこで，特定責任追及の訴えの提起を請求することができる株主を「完全」親会社等の株主に限定しているのである。"},{"l":2,"m":"役員等の損害賠償責任","sb":"最終完全親会社等の株主による特定責任追及等の訴え(多重代表訴訟)","i":"B","r":"","q":"特定責任とは，株式会社に最終完全親会社等がある場合の当該株式会社の発起人等の責任である。","a":false,"c":"847条の3第4項。","e":"特定責任とは，最終完全親会社等のある株式会社の取締役等の責任の原因となった事実が生じた日において最終完全親会社等およびその完全子会社等における当該株式会社の株式の帳簿価額が当該最終完全親会社等の総資産額として法務省令で定める方法により算定される額の５分の１（定款で緩和可）を超える場合における当該発起人等の責任をいう。企業集団にとって重要性の乏しい子会社については，親会社株主に与える影響も小さいと考えられ，そのような場合にまで特定責任追及の訴えの提訴請求の対象とするのは適切ではないことから，その対象を企業集団にとって一定程度の重要性を有する子会社に限定しているのである。"},{"l":3,"m":"役員等の損害賠償責任","sb":"最終完全親会社等の株主による特定責任追及等の訴え(多重代表訴訟)","i":"B","r":"","q":"６か月前から引き続き株式会社の最終完全親会社等の株式を有する株主は，当該株式会社に対し，特定責任追及の訴えの提起を請求することができる。","a":false,"c":"847条の3第1項柱書本文。","e":"６か月（定款で短縮可）前から引き続き株式会社の最終完全親会社等の総株主（株主総会において決議をすることができる事項の全部につき議決権を行使することができない株主を除く）の議決権の100分の１（定款で緩和可）以上の議決権を有する株主またはその発行済株式（自己株式を除く）の100分の１（定款で緩和可）以上の数の株式を有する株主は，当該株式会社に対して，特定責任追及の訴えの提起を請求することができる。なお，最終完全親会社等が非公開会社である場合は，６か月の保有期間要件は不要とされている（847 条の３第６項）。すなわち，特定責任追及の訴えの提訴請求は少数株主権である。責任追及等の訴えの提訴請求（847 条１項）と異なり，特定責任追及の訴えの提訴請求が少数株主権とされたのは，最終完全親会社等の株主と子会社との関係は，最終完全親会社等を通じた間接的なものにすぎないためである。"},{"l":4,"m":"役員等の損害賠償責任","sb":"最終完全親会社等の株主による特定責任追及等の訴え(多重代表訴訟)","i":"B","r":"","q":"６か月前から引き続き株式会社の最終完全親会社等の発行済株式（自己株式を除く）の100分の１以上の数の株式を有する株主は，当該株式会社に対し，特定責任追及の訴えの提起を請求することができる場合がある。","a":true,"c":"847条の3第1項柱書本文。","e":"なお，特定責任追及の訴えの提訴請求をすることができる要件を満たした株主であっても，① 特定責任追及の訴えが当該株主もしくは第三者の不正な利益を図り，または，当該株式会社もしくは当該最終完全親会社等に損害を加えることを目的とする場合，② 当該特定責任の原因となった事実によって当該最終完全親会社等に損害が生じていない場合は，特定責任追及の訴えの提訴請求をすることができない（847条の３第１項各号）。"},{"l":5,"m":"役員等の損害賠償責任","sb":"最終完全親会社等の株主による特定責任追及等の訴え(多重代表訴訟)","i":"B","r":"","q":"株式会社が特定責任追及の訴えの提訴請求の日から 60 日以内に特定責任追及の訴えを提起しないときは，当該請求をした最終完全親会社等の株主は，株式会社のために，特定責任追及の訴えを提起することができる。","a":true,"c":"847条の3第7項。","e":"60日間という期間の経過により株式会社に回復することができない損害が生ずるおそれがある場合には，提訴請求をすることができる最終完全親会社等の株主は，株式会社のために，直ちに特定責任追及の訴えを提起することができる（847 条の３第９項）。ただし，不提訴事由（同条１項各号）に該当する場合は，当該提起をすることができない（同条９項ただし書）。"},{"l":6,"m":"役員等の損害賠償責任","sb":"最終完全親会社等の株主による特定責任追及等の訴え(多重代表訴訟)","i":"B","r":"","q":"株式会社に最終完全親会社等がある場合において，特定責任（その免除について総株主の同意が必要とされているものに限る）を免除する場合は，株式会社の総株主の同意に加えて，当該株式会社の最終完全親会社等の総株主の全員の同意がなければ，免除することができない。","a":true,"c":"847条の3第10項。","e":"株式会社の総株主の同意のみで責任を免除することができてしまうと，多重代表訴訟制度を認めた意味がなくなってしまうからである。"},{"l":7,"m":"役員等の損害賠償責任","sb":"最終完全親会社等の株主による特定責任追及等の訴え(多重代表訴訟)","i":"B","r":"","q":"株式会社において，財産上の利益の供与（当該株式会社またはその子会社の計算においてするものに限る）が禁止されるのは，当該株式会社の株主の権利の行使に関するものに限られる。","a":false,"c":"120条1項。","e":"120 条１項は，株主の権利の行使に関してのみならず，当該株式会社に係る適格旧株主の権利，または，当該株式会社の最終完全親会社等の株主の権利に関する利益供与も禁止している。株式会社の取締役等が，適格旧株主または最終完全親会社等の株主から責任追及等の訴えを提起されないようにするために，当該責任追及等の訴えに関して利益の供与をするおそれがあること，また，株式会社が当該責任追及等の訴えの提起等に関して利益の供与をした場合に，当該権利の行使が害されるおそれがあることは，株式会社が株主による責任追及等の訴えの提起に関し財産上の利益の供与をする場合と同様だからである。"},{"l":1,"m":"役員等の損害賠償責任","sb":"その他の規定","i":"C","r":"(平26I問題9イ)","q":"株主が提起した責任追及等の訴えの被告が担保提供の申立てをするには，当該被告は，当該訴えの提起が悪意によるものであることを証明しなければならない。","a":false,"c":"847条の4第2項。","e":"株主等（株主，適格旧株主または最終完全親会社等の株主）が責任追及等の訴えを提起したときは，裁判所は，被告の申立てにより，当該株主等に対し，相当の担保を立てるべきことを命ずることができる。この場合，被告は，責任追及等の訴えの提起が悪意によるものであることを疎明しなければならない（847 条の４第３項）。疎明とは，一応確からしいということを示すことであり，証明よりも確からしいという水準が低いものである。"},{"l":2,"m":"役員等の損害賠償責任","sb":"その他の規定","i":"C","r":"","q":"株主は，責任追及等の訴えに係る訴訟に参加することは認められていない。","a":false,"c":"849条1項本文。","e":"株主等または株式会社等（株式会社または株式交換等完全子会社）は，共同訴訟人として，または当事者の一方を補助するため，責任追及等の訴え（適格旧株主にあっては株式交換等の行為の効力が生じた時までにその原因となった事実が生じた責任または義務に係るものに限り，最終完全親会社等の株主にあっては特定責任追及の訴えに限る）に係る訴訟に参加することができる。ただし，不当に訴訟手続を遅延させることとなるとき，または，裁判所に対し過大な事務負担を及ぼすこととなるときは，訴訟参加をすることができない（849条１項ただし書）。"},{"l":3,"m":"役員等の損害賠償責任","sb":"その他の規定","i":"B","r":"(平26I問題9ウ)","q":"株主は，責任追及等の訴えを提起したときは，遅滞なく，株式会社に対し，訴訟告知をしなければならない。","a":true,"c":"849条4項。","e":"株式会社に訴訟参加をする機会を与えるためである。"},{"l":4,"m":"役員等の損害賠償責任","sb":"その他の規定","i":"C","r":"","q":"会社により役員等に係る責任追及等の訴えが提起された場合において，会社および役員等が共謀して訴訟の目的である会社の権利を害する目的で判決を確定させたときは，株主は，確定判決に対して，再審の訴えをもって，不服を申し立てることができる。","a":true,"c":"853条1項。","e":""},{"l":5,"m":"役員等の損害賠償責任","sb":"その他の規定","i":"B","r":"(平26I問題9エ)","q":"責任追及等の訴えを提起した株主が敗訴した場合であっても，悪意があったときを除き，当該株主は，株式会社に対し，これによって生じた損害を賠償する義務を負わない。","a":true,"c":"852条2項。","e":"株主に責任追求等の訴えを認める制度趣旨から考えれば，過失により敗訴した場合にまで会社に対する損害賠償責任を負わせることは提訴株主に酷であるし，会社は訴訟参加により牽制が可能であり，提訴株主が嫌がらせや不適切な訴訟追行をすることを抑止する手段をもっている。したがって，株主が悪意であった場合を除き，会社に損害賠償責任を負わないこととしたのである。"},{"l":1,"m":"補償契約および役員等のために締結される保険契約","sb":"補償契約","i":"B","r":"","q":"取締役会設置会社が，補償契約の内容を決定するには，株主総会の普通決議によらなければならない。","a":false,"c":"430条の2第1項柱書,309条1項。","e":"株式会社が，補償契約の内容を決定するには，株主総会の普通決議（取締役会設置会社にあっては取締役会の決議）によらなければならない。なお，補償契約とは，株式会社が，役員等に対して次に掲げる費用等の全部または一部を当該株式会社が補償することを約する契約をいう。① 当該役員等が，その職務の執行に関し，法令の規定に違反したことが疑われ，または責任の追及に係る請求を受けたことに対処するために支出する費用② 当該役員等が，その職務の執行に関し，第三者に生じた損害を賠償する責任を負う場合における次に掲げる損失１ 損害を役員等が賠償することにより生ずる損失（損害賠償金）２ 損害の賠償に関する紛争について当事者間に和解が成立したときは，役員等が当該和解に基づく金銭を支払うことにより生ずる損失（和解金）"},{"l":2,"m":"補償契約および役員等のために締結される保険契約","sb":"補償契約","i":"B","r":"(令6II問題12ア類)","q":"株式会社は，補償契約を締結している場合であっても，役員等が，その職務の執行に関し，責任の追及に係る請求を受けたことに対処するために支出する費用のうち通常要する費用の額を超える部分は，当該補償契約に基づき，補償することができない。","a":true,"c":"430条の2第2項1号。","e":"過大な費用支出については，株式会社ひいては株主にとって不利益となるためである。"},{"l":3,"m":"補償契約および役員等のために締結される保険契約","sb":"補償契約","i":"B","r":"(令6II問題12エ)","q":"株式会社は，補償契約を締結している場合であっても，取締役がその職務を行うにつき悪意または重過失があるときは，当該取締役に対して補償契約に基づき防御費用を補償することができない。","a":false,"c":"430条の2第2項3号参照。","e":"防御費用については役員等がその職務を行うにつき悪意または重大な過失があったか否かにかかわらず，補償契約に基づく補償を行うことができる。"},{"l":4,"m":"補償契約および役員等のために締結される保険契約","sb":"補償契約","i":"B","r":"(令6II問題12ウ)","q":"取締役に対して補償契約に基づき防御費用を補償した株式会社は，当該取締役が自己もしくは第三者の不正な利益を図り，または当該株式会社に損害を加える目的でその職務を執行したことを知ったときは，当該取締役に対し，補償した金額に相当する金銭を返還することを請求することができる。","a":true,"c":"430条の2第3項。","e":""},{"l":5,"m":"補償契約および役員等のために締結される保険契約","sb":"補償契約","i":"B","r":"","q":"取締役会設置会社が補償契約に基づき補償を実行し，金銭を役員等に対して実際に支払う場合には，取締役会の承認を受けなければならない。","a":false,"c":"","e":"株式会社が補償契約に基づき補償を実行し，金銭を役員等に対して実際に支払う場合には，株主総会の決議や取締役会の決議は必要とされていない。しかし，補償契約に基づき補償する旨の決定が重要な業務執行の決定（362 条４項）に該当することもあると解されており，この場合は，取締役会設置会社においては，取締役会の決議が必要となる。"},{"l":6,"m":"補償契約および役員等のために締結される保険契約","sb":"補償契約","i":"B","r":"","q":"取締役会設置会社においては，補償契約に基づき補償をした取締役および当該補償を受けた取締役は，遅滞なく，当該補償についての重要な事実を取締役会に報告しなければならない。","a":true,"c":"430条の2第4項。","e":""},{"l":1,"m":"補償契約および役員等のために締結される保険契約","sb":"役員等のために締結される保険契約","i":"B","r":"","q":"取締役会設置会社が，役員等賠償責任保険契約の内容を決定するには，取締役会の決議によらなければならない。","a":true,"c":"430条の3第1項。","e":"株式会社が，役員等賠償責任保険契約の内容を決定するには，株主総会の普通決議（取締役会設置会社にあっては取締役会の決議）によらなければならない。なお，役員等賠償責任保険契約とは，株式会社が，保険者との間で締結する保険契約のうち役員等がその職務の執行に関し責任を負うことまたは当該責任の追及に係る請求を受けることによって生ずることのある損害を保険者が塡補することを約するものであって，役員等を被保険者とするもの（当該保険契約を締結することにより被保険者である役員等の職務の執行の適正性が著しく損なわれるおそれがないものとして法務省令で定めるものを除く）をいう。"},{"l":2,"m":"補償契約および役員等のために締結される保険契約","sb":"役員等のために締結される保険契約","i":"C","r":"","q":"自動車賠償責任保険は役員等賠償責任保険契約の対象に含まれる。","a":false,"c":"430条の3第1項かっこ書。","e":"罰金や過料，生産物賠償責任保険（ＰＬ保険），企業総合賠償責任保険（ＣＧＬ保険），自動車賠償責任保険，海外旅行保険等は，被保険者である役員等の職務の執行の適正性が著しく損なわれるおそれがないものとして，役員等賠償責任保険契約の対象から除外される。"},{"l":3,"m":"補償契約および役員等のために締結される保険契約","sb":"役員等のために締結される保険契約","i":"B","r":"","q":"指名委員会等設置会社において，取締役会は，役員等賠償責任保険契約の内容の決定を執行役に委任することができる。","a":false,"c":"416条4項15号。","e":"指名委員会等設置会社の取締役会は，その決議によって，役員等賠償責任保険契約の内容の決定を執行役に委任することができない。"},{"l":1,"m":"株主の違法行為差止請求権","sb":"","i":"B","r":"(令4II問題4イ類・平21問題14エ類・平20問題12ア類)","q":"公開会社である監査役設置会社において，６か月前から引き続き株式を有する株主は，取締役が法令または定款に違反するおそれがある場合において，当該行為によって当該株式会社に著しい損害が生ずるおそれがあるときは，当該取締役に対し，当該行為をやめることを請求することができる。","a":false,"c":"360条。","e":"公開会社である監査役設置会社において，６か月前から引き続き株式を有する株主は，取締役が株式会社の目的の範囲外の行為その他法令もしくは定款に違反する行為をし，またはこれらの行為をするおそれがある場合において，当該行為によって当該株式会社に回復することができない損害が生ずるおそれがあるときは，当該取締役に対し，当該行為をやめることを請求することができる。監査役設置会社，監査等委員会設置会社または指名委員会等設置会社である場合は，著しい損害ではなく回復することができない損害が生ずるおそれがある必要がある。なお，当該違法行為差止請求権は単独株主権である。"},{"l":2,"m":"株主の違法行為差止請求権","sb":"","i":"B","r":"(平20問題12イ類)","q":"公開会社である指名委員会等設置会社において，６か月前から引き続き株式を有する株主は，執行役が指名委員会等設置会社の定款に違反する行為をする場合において，当該行為によって当該指名委員会等設置会社に回復することができない損害が生じるおそれがある場合は，当該執行役に対し，当該行為をやめることを請求することができる。","a":true,"c":"422条1項。","e":"なお，非公開会社では，６か月の継続保有要件は課されない（422条２項）。"}]},{"n":3,"name":"株式","qs":[{"l":1,"m":"総則","sb":"","i":"A","r":"(平30I問題5ア類・平29I問題6ア類・平27I問題5ア・平23I問題4ウ類・平20問題4イ類)","q":"株式会社が，株主に剰余金の配当を受ける権利または残余財産の分配を受ける権利のいずれかを与えない旨の定款の定めを置いた場合には，当該定めは無効である。","a":false,"c":"105条2項。","e":"株主に剰余金配当請求権および残余財産分配請求権の全部を与えない旨の定款の定めは，その効力を有しない。これは，株式会社の営利性に反するためである。したがって，剰余金配当請求権または残余財産分配請求権のいずれかの全部を与えない旨を定款に定めることは認められるので，本肢は誤りである。"},{"l":2,"m":"総則","sb":"","i":"B","r":"","q":"株式が２以上の者の共有に属するとき，共有者は，当該株式について権利を行使する者１人を定め，株式会社に対し，その者の氏名または名称を通知しなければ，当該株式会社が当該権利を行使することに同意していたとしても，当該株式についての権利を行使することができない。","a":false,"c":"106条。","e":"株式が２以上の者の共有に属するとき，共有者は，当該株式について権利を行使する者１人を定め，株式会社に対し，その者の氏名または名称を通知しなければ，当該株式についての権利を行使することができない。ただし，当該規定は，会社の事務処理の便宜を図る趣旨であるので，株式会社が当該権利を行使することに同意した場合は，会社に対して通知をしていなくても，共有株式についての権利を行使することができる。"},{"l":3,"m":"総則","sb":"","i":"B","r":"(令7I問題5ア類・令3問題5エ類・平30I問題5イ)","q":"最高裁判所の判例によれば，株式の共有者間において，当該株式についての権利を行使する者を定めるに当たっては，各共有者の持分の価格に従い，その過半数をもってこれを決定することができる。","a":true,"c":"最判平9年1月28日。","e":"最高裁判所の判例によれば，共有株式の権利行使者を定めるにあたっては，各共有株主の持分の価格に従って，その過半数で決定することができるとしている。なお，共有株式の権利行使者を選定し，会社に届け出たときは，当該権利行使者は他の共有者の意思に拘束されず，自己の判断で当該株式についての権利を行使することができる（最判昭53年４月14日）。"},{"l":4,"m":"総則","sb":"","i":"B","r":"","q":"最高裁判所の判例によれば，権利行使者としての指定および通知を欠く共有株式の議決権行使は，各共有者の持分の価格に従って，その過半数で決定される。","a":true,"c":"最判平27年2月19日。","e":"なお，権利行使者としての指定および通知を欠く場合であっても，株式会社が権利行使に同意した場合は，共有者は，共有株式についての権利を行使することができるが（106 条ただし書），当該規定は，株式の共有者が，民法の共有に関する規定（民法252条本文）に従って権利行使の方法を決定していることが前提であるため，その前提を欠く場合は，たとえ株式会社が同意をしたとしても，権利行使の方法が適法となるものではないと考えられる。そして，共有株式の議決権行使は，特段の事情のない限り，株式の管理に関する行為として，民法の規定により，各共有者の持分の価格に従い，その過半数で決せられることになる。"},{"l":5,"m":"総則","sb":"","i":"B","r":"","q":"最高裁判所の判例によれば，共同相続人が株主総会の決議の不存在の確認の訴えを提起する場合において，権利行使者としての指定を受けてその旨を通知していないときであっても，特段の事情がない限り，原告適格を有する。","a":false,"c":"最判平2年12月4日。","e":"最高裁判所の判例によれば，共同相続人が株主総会決議不存在確認の訴えを提起する場合も，権利行使者としての指定を受けてその旨を通知していないときは，特段の事情がない限り，原告適格を有しないとしている。"},{"l":6,"m":"総則","sb":"","i":"B","r":"(平22II問題4ウ)","q":"最高裁判所の判例によれば，株主は，その権利のうち議決権のみを譲渡することができる。","a":false,"c":"","e":"このような規定はない。株主権は，包括的な権利であることから，株主権に含まれる権利（剰余金配当請求権や議決権等）の一部を切り離して譲渡することはできない。ただし，株主総会の決議により具体的に確定した配当金の支払請求権のように具体的な権利となったものは，株主の権利とは別個独立のものとして譲渡することができる。"},{"l":7,"m":"総則","sb":"","i":"B","r":"(平22II問題4イ)","q":"株主は，株主総会決議によって具体的に発生した剰余金配当請求権を，譲渡することができる。","a":true,"c":"","e":"株主総会決議によって確定した剰余金配当請求権は，総会決議時の株主を債権者として具体化された金銭債権であるので，株式とは別個独立に処分することができる。したがって，債権譲渡の方法で第三者に譲渡することができる。"},{"l":8,"m":"総則","sb":"","i":"B","r":"(令3問題5イ)","q":"最高裁判所の判例によれば，株主総会の決議の取消しの訴えを提起した株主が，その係属中に死亡した場合は，相続により株式を取得した相続人は，その訴訟の原告たる地位を承継しない。","a":false,"c":"最判昭45年7月15日。","e":"最高裁判所の判例によれば，株主の提起した会社解散の訴え（833条），株主総会の決議取消しの訴え（831条），決議無効確認の訴え（830 条２項）の係属中に，当該株主が死亡した場合には，相続により株式を取得した相続人がその訴訟の原告たる地位を承継するとしている。相続等の一般承継によって株式が移転された場合，株式の取得者は，従前の株主の法律上の地位を包括的に承継することになるためである。これに対して，株式が譲渡された場合には，譲渡人は原告としての地位を失うとともに，譲受人はその地位を承継するわけではない。"},{"l":1,"m":"株式の内容","sb":"全部の株式の内容とすることができる事項","i":"A","r":"","q":"株式会社は，その発行する全部の株式の内容として，譲渡制限株式を発行することができる。","a":true,"c":"107条1項1号。","e":"株式会社がその発行する全部の株式の内容として定めることができるのは，譲渡制限株式，取得請求権付株式または取得条項付株式である（107条１項各号参照）。また，これらの株式は種類株式として発行することもできる（108条１項４号～６号）。"},{"l":2,"m":"株式の内容","sb":"全部の株式の内容とすることができる事項","i":"A","r":"","q":"株式会社は，その発行する全部の株式の内容として，議決権制限株式を発行することができる。","a":false,"c":"107条1項各号参照。","e":"株式会社は，その発行する全部の株式の内容として，議決権制限株式を発行することはできない。"},{"l":1,"m":"株式の内容","sb":"種類株式総論","i":"A","r":"","q":"種類株式発行会社とは，剰余金の配当その他の一定の事項について内容の異なる２以上の種類の株式を現に発行している株式会社をいう。","a":false,"c":"2条13号。","e":"種類株式発行会社とは，剰余金の配当その他一定の事項について内容の異なる２以上の種類の株式を発行する株式会社をいう。つまり，実際に２種類以上の株式を発行していなくても，定款において108条１項各号に掲げる事項について２種類以上の異なる定めをした場合は種類株式発行会社となる。"},{"l":2,"m":"株式の内容","sb":"種類株式総論","i":"A","r":"","q":"株式会社は，一定の事項について内容の異なる２以上の種類の株式を発行する場合には，発行可能種類株式総数を定款で定めなければならない。","a":true,"c":"108条2項柱書。","e":""},{"l":1,"m":"株式の内容","sb":"譲渡制限株式","i":"B","r":"(平30I問題9エ)","q":"発行する全部の株式を譲渡制限株式とする旨の定款の定めを設ける定款の変更を行う株主総会（種類株式発行会社の株主総会を除く）は，特別決議によって行わなければならない。","a":false,"c":"107条2項1号,309条3項1号。","e":"発行する全部の株式を譲渡制限株式とする旨の定款の定めを設ける定款の変更を行う株主総会（種類株式発行会社の株主総会を除く）は，309 条３項の特殊決議によって行わなければならない。譲渡制限株式については，株式の譲渡，すなわち投下資本回収の機会が制限されることになり，株主に対して重大な影響を及ぼすことになるため，定款変更に必要な要件を厳格にしており，309条３項の特殊決議を求めている。"},{"l":2,"m":"株式の内容","sb":"譲渡制限株式","i":"B","r":"(平24II問題5イ)","q":"公開会社でない株式会社は，株主総会の特別決議により，株式の内容として，譲渡による当該株式の取得について当該株式会社の承認を要する旨の定款の定めを廃止することができる。","a":true,"c":"466条,309条2項11号。","e":"新たに譲渡制限を設ける定款変更と違い，株主にとっては投下資本回収の機会に関する制限が緩和されることとなるため，通常の定款変更と同様に株主総会の特別決議によって定款変更をすることができる。"},{"l":3,"m":"株式の内容","sb":"譲渡制限株式","i":"B","r":"(令2II問題5ア)","q":"株式会社は，譲渡制限株式の内容として，一定の場合において当該株式会社が譲渡等承認請求に対して承認をしたものとみなす旨を定款に定めることができる。","a":true,"c":"107条2項1号ロ,108条2項4号参照。","e":"ここでいう一定の場合とは，例えば，特定の者への譲渡（株主間の譲渡や従業員への譲渡等）である。このような定めが認められるのは，取得者の属性（株主や従業員等）による区別は，会社の閉鎖性の基準を定款に明示したに過ぎず，譲渡制限を緩和するものであり，現在の株主を区別するものではなく株主平等原則に反しないからである。"},{"l":4,"m":"株式の内容","sb":"譲渡制限株式","i":"B","r":"","q":"発行する全部の株式を譲渡制限株式とする定款の変更をする場合，反対株主は，株式会社に対して，自己の有する株式を公正な価格で買い取ることを請求することができる。","a":true,"c":"107条1項1号,116条1項1号。","e":"反対株主の投下資本の回収を保障するためである。また，新株予約権者にも新株予約権買取請求権が認められる（118 条１項１号）。なお，種類株式発行会社がある種類株式について譲渡制限を設ける定款の変更をする場合も同様に，株式買取請求権および新株予約権買取請求権が認められる（116条１項２号，118条１項２号）。"},{"l":5,"m":"株式の内容","sb":"譲渡制限株式","i":"A","r":"(平29I問題6エ・平24II問題5ウ)","q":"種類株式発行会社である公開会社は，譲渡制限株式の数が発行済株式の総数の２分の１を超えるに至ったときは，直ちに，譲渡制限株式の数を発行済株式の総数の２分の１以下にするための必要な措置をとらなければならない。","a":false,"c":"115条。","e":"種類株式発行会社が公開会社である場合において，議決権制限株式の数が発行済株式総数の２分の１を超えるに至ったときは，株式会社は，直ちに，議決権制限株式の数を発行済株式総数の２分の１以下にするための必要な措置をとらなければならない。"},{"l":1,"m":"株式の内容","sb":"取得請求権付株式","i":"B","r":"","q":"取得請求権付株式とは，株式会社がその発行する全部または一部の株式の内容として当該株式会社が当該株式を有する株主に対して，当該株式を譲り渡すよう請求することができる旨の定めを設けている場合における当該株式をいう。","a":false,"c":"2条18号。","e":"取得請求権付株式とは，株式会社がその発行する全部または一部の株式の内容として，株主が当該株式会社に対して当該株式の取得を請求することができる旨の定めを設けている場合における当該株式をいう。"},{"l":2,"m":"株式の内容","sb":"取得請求権付株式","i":"C","r":"","q":"発行する全部の株式を取得請求権付株式とする旨の定款の定めを設ける定款の変更を行う株主総会は，特別決議によって行わなければならない。","a":true,"c":"466条,107条2項2号,309条2項11号。","e":"発行する全部の株式を取得請求権付株式とする旨の定款の定めを設ける定款の変更を行う株主総会は，株主に有利となるものであるので，原則通り特別決議で足りる。"},{"l":3,"m":"株式の内容","sb":"取得請求権付株式","i":"B","r":"","q":"発行する全部の株式を取得請求権付株式とする定款の変更をする場合，反対株主は，株式会社に対して，自己の有する株式を公正な価格で買い取ることを請求することができる。","a":false,"c":"116条1項参照。","e":"発行する全部の株式を取得請求権付株式とする旨の定款の定めを設ける定款の変更を行う場合，反対株主には株式買取請求権が認められていない。なぜなら，当該定款変更によって株主が望むときに投下資本の回収が可能となるので，反対株主の株式買取請求権を認めて投下資本回収手段を確保する必要がないからである。"},{"l":4,"m":"株式の内容","sb":"取得請求権付株式","i":"B","r":"(平30II問題5イ)","q":"種類株式発行会社は，取得請求権付株式を発行する場合に，取得の対価を当該株式会社の他の種類の株式とすることができる。","a":true,"c":"108条2項5号ロ。","e":"対価を他の種類株式とすることによって，株主の請求により株式の種類を変更することができる。"},{"l":5,"m":"株式の内容","sb":"取得請求権付株式","i":"B","r":"","q":"株式会社は，その発行する全部の株式を取得請求権付株式とする場合，当該株式の取得の対価を当該株式会社の社債とすることを定款で定めることができる。","a":true,"c":"107条2項2号,309条2項11号。","e":"取得請求権付株式の取得対価として交付される財産の内容は，特に限定はされていない（107条２項２号ロ～ホ）。つまり，取得の対価として，①社債・②新株予約権・③新株予約権付社債・④株式等以外の財産（金銭等）を交付することができる。ただし，種類株式発行会社でない株式会社の株式の内容はすべて同一であるため，対価として株式が交付されることはない。なお，取得請求権付株式の取得については財源規制が設けられている（166 条１項ただし書）。"},{"l":1,"m":"株式の内容","sb":"取得条項付株式","i":"B","r":"","q":"取得条項付株式とは，株式会社がその発行する全部または一部の株式の内容として，当該株式会社が一定の事由が生じたことを条件として当該株式を取得することができる旨の定めを設けている場合における当該株式をいう。","a":true,"c":"2条19号。","e":""},{"l":2,"m":"株式の内容","sb":"取得条項付株式","i":"B","r":"(令7I問題5イ類・平31II問題10ア)","q":"定款を変更して，その発行する全部の株式の内容として株式会社が一定の事由が生じたことを条件としてこれを取得することができる旨の定款の定めを設けようとする場合の株主総会決議は，当該株主総会において議決権を行使することができる株主の半数以上であって，当該株主の議決権の３分の２以上に当たる多数をもって行なわなければならない。","a":false,"c":"110条。","e":"定款を変更して，その発行する全部の株式を取得条項付株式とする場合，一定の事由の発生により株式会社に株式が取得されることとなるため，定款変更に必要な要件をさらに厳格にし，株主全員の同意を求めている。"},{"l":3,"m":"株式の内容","sb":"取得条項付株式","i":"C","r":"","q":"株式会社は，取得条項付株式の内容として，取得事由が生じた日にその一部を取得することとする旨を定款に定めることはできない。","a":false,"c":"107条2項3号ハ,108条2項6号イ。","e":"株式会社は，取得条項付株式の内容として，取得事由が生じた日にその一部を取得することとする旨を定款に定めることはできる。"},{"l":4,"m":"株式の内容","sb":"取得条項付株式","i":"B","r":"","q":"株式会社は，その発行する全部の株式を取得条項付株式とする場合，当該株式の取得の対価を当該株式会社の社債とすることを定款で定めることができる。","a":true,"c":"107条2項3号ニ。","e":"取得条項付株式の取得対価として交付される財産の内容は，特に限定はされていない（107 条２項３号ニ～ト）。つまり，取得の対価として，① 社債・② 新株予約権・③ 新株予約権付社債・④ 株式等以外の財産（金銭等）を交付することができる。ここで，対価として株式が交付されることがない理由は，発行する全部の株式の内容として取得条項付株式を発行している場合は，株式の内容がすべて同一であるためである。また，取得対価については，取得請求権付株式の場合も同様である（107条２項２号ロ～ホ）。"},{"l":5,"m":"株式の内容","sb":"取得条項付株式","i":"B","r":"","q":"種類株式発行会社がある種類株式を取得条項付株式とする場合，当該株式の取得の対価を当該株式会社の他の種類株式とすることを定款で定めることはできない。","a":false,"c":"108条2項6号ロ。","e":"種類株式発行会社がある種類株式を取得条項付株式とする場合，取得の対価を当該株式会社の他の種類株式とすることを定款で定めることができる。これは，取得請求権付株式の場合も同様である（108条２項５号ロ）。また，取得条項付株式の取得については，他の種類の株式を対価とする場合を除き，財源規制が設けられている（170条５項）。"},{"l":6,"m":"株式の内容","sb":"取得条項付株式","i":"B","r":"","q":"株式会社（種類株式発行会社を除く）が定款を変更してその発行する全部の株式を取得条項付株式とする定款の定めを設けようとする場合には，株主全員の同意を得なければならない。","a":true,"c":"110条。","e":"一定の事由の発生により株式会社に株式が
