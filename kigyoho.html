<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="企業法チェック">
<title>企業法 短答対策問題集</title>
<style>
:root{
  --paper:#F4F5F1;
  --panel:#FFFFFF;
  --ink:#1B2229;
  --ink-2:#4A555F;
  --ink-3:#7E8A94;
  --rule:#D9DDD5;
  --rule-2:#E9ECE6;
  --red:#D62839;
  --red-soft:#FBE7E9;
  --blue:#1F5673;
  --ok:#2F7A4F;
  --ok-soft:#E5F1E9;
  --warn:#B26A00;
  --sheet:#8A4B12;
  --warn-soft:#FBEEDD;
  --shade:rgba(27,34,41,.06);
  --grid:rgba(31,86,115,.055);
  --radius:3px;
  --sans:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic Medium","Yu Gothic","Meiryo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Hiragino Mincho ProN","Yu Mincho",Georgia,serif;
}
[data-theme="dark"]{
  --paper:#14181C;
  --panel:#1B2126;
  --ink:#E7EAE5;
  --ink-2:#AEB8BF;
  --ink-3:#7A858D;
  --rule:#2C343A;
  --rule-2:#232A30;
  --red:#FF5C6B;
  --red-soft:#3A1E22;
  --blue:#7FB4D0;
  --ok:#6FC28E;
  --ok-soft:#1E2E24;
  --warn:#E0A14A;
  --sheet:#C97A2E;
  --warn-soft:#332616;
  --shade:rgba(0,0,0,.3);
  --grid:rgba(127,180,208,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.6;
  -webkit-text-size-adjust:100%;
  padding-bottom:env(safe-area-inset-bottom);
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:0 14px}

header{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid var(--rule)}
.hd{display:flex;align-items:center;gap:10px;padding:10px 0 8px}
.brand{font-family:var(--serif);font-size:19px;letter-spacing:.01em;line-height:1.2}
.brand small{display:block;font-family:var(--sans);font-size:10.5px;color:var(--ink-3);letter-spacing:.1em}
.hd-sp{flex:1}
.iconbtn{width:38px;height:38px;border:1px solid var(--rule);border-radius:var(--radius);display:grid;place-items:center;font-size:15px;background:var(--panel)}
.iconbtn[aria-pressed="true"]{background:var(--sheet);border-color:var(--sheet);color:#fff}
.tabs{display:flex;gap:0;border:1px solid var(--rule);border-bottom:none;background:var(--panel)}
.tabs button{flex:1;padding:9px 4px;font-size:13.5px;color:var(--ink-2);border-right:1px solid var(--rule);position:relative}
.tabs button:last-child{border-right:none}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:700;background:var(--paper)}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--red)}
.meter{height:3px;background:var(--rule-2);display:flex}
.meter i{display:block;height:100%}
.meter .m3{background:var(--ok)} .meter .m2{background:var(--warn)} .meter .m1{background:var(--red)}

.filters{padding:10px 0 6px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search{flex:1;min-width:180px;display:flex;align-items:center;gap:8px;border:1px solid var(--rule);background:var(--panel);padding:0 10px;border-radius:var(--radius)}
.search input{flex:1;border:none;background:none;padding:9px 0;outline:none;min-width:0}
select{border:1px solid var(--rule);background:var(--panel);padding:9px 8px;border-radius:var(--radius);max-width:100%}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--rule);background:var(--panel);padding:5px 11px;border-radius:99px;font-size:12.5px;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.count{font-size:12px;color:var(--ink-3);padding:4px 0 8px}

.chsel-head{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding:0 2px}
.chsel-head .lbl{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.chsel-head .links button{font-size:11.5px;color:var(--blue);text-decoration:underline;font-weight:400;margin-left:10px}
.chapter-list{background:var(--panel);border:1px solid var(--rule);margin-top:6px}
.chapter-row{display:flex;align-items:center;gap:10px;padding:10px 10px;border-bottom:1px solid var(--rule-2);cursor:pointer}
.chapter-row:last-child{border-bottom:none}
.chapter-row:active{background:var(--shade)}
.chapter-row .check{width:20px;height:20px;border-radius:4px;border:2px solid var(--ink-3);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
.chapter-row.checked{background:color-mix(in srgb, var(--blue) 7%, var(--panel))}
.chapter-row.checked .check{background:var(--blue);border-color:var(--blue)}
.chapter-row .cname{flex:1;font-size:13.5px;color:var(--ink-3)}
.chapter-row.checked .cname{color:var(--ink);font-weight:700}
.chapter-row .ccnt{font-size:11.5px;color:var(--ink-3);flex-shrink:0}
.chapter-row .caret{font-size:11px;color:var(--blue);margin-left:8px;flex-shrink:0;padding:4px 2px}
.major-list{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px 10px 40px;background:var(--rule-2);border-bottom:1px solid var(--rule-2)}
.major-chip{font-size:12px;padding:5px 10px;border-radius:99px;border:1px solid var(--rule);background:var(--panel);color:var(--ink-3);cursor:pointer;white-space:nowrap}
.major-chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.major-chip .mcnt{opacity:.7;font-size:10.5px}
.imp-row{display:flex;gap:8px;margin-top:6px}
.imp-box{flex:1;border:1px solid var(--rule);background:var(--panel);border-radius:var(--radius);padding:10px 8px;text-align:center;cursor:pointer}
.imp-box .check{width:20px;height:20px;border-radius:4px;border:2px solid var(--ink-3);margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
.imp-box.checked{background:color-mix(in srgb, var(--blue) 7%, var(--panel));border-color:var(--blue)}
.imp-box.checked .check{background:var(--blue);border-color:var(--blue)}
.imp-box .ilabel{font-size:13px;color:var(--ink-3)}
.imp-box.checked .ilabel{color:var(--ink);font-weight:700}
.imp-box .icnt{font-size:11px;color:var(--ink-3);margin-top:2px}

.sec{margin:18px 0 6px;display:flex;align-items:baseline;gap:10px}
.sec h2{font-size:13px;margin:0;letter-spacing:.03em;font-weight:700}
.sec span{flex:1;border-bottom:1px dashed var(--rule)}
.sec b{font-size:11px;color:var(--ink-3);font-weight:400}
ol.list{list-style:none;margin:0;padding:0;background:var(--panel);border:1px solid var(--rule)}
li.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:0 12px;padding:9px 10px;border-bottom:1px solid var(--rule-2);align-items:start}
li.item:last-child{border-bottom:none}
.no{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums;padding-top:4px;text-align:center}
.en{font-family:var(--serif);font-size:16px;line-height:1.5;word-break:break-word}
.ja{font-size:13.5px;color:var(--ink-2);margin-top:5px;font-weight:700}
.note{font-size:12px;color:var(--ink-3);margin-top:4px;white-space:pre-line;border-left:2px solid var(--rule);padding-left:7px;line-height:1.7}
.memoline{font-size:11.5px;color:var(--warn);margin-top:5px}
.tools{display:flex;flex-direction:column;align-items:center;gap:6px}
.mark{font-size:10px;padding:3px 7px;border:1px solid var(--rule);border-radius:99px;color:var(--ink-3);white-space:nowrap}
.mark.warn{color:var(--warn);border-color:var(--warn);background:var(--warn-soft)}
.mark.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.memo-dot{font-size:12px}

.hide .ja, .hide .note{position:relative;color:transparent}
.hide .ja::before,.hide .note::before{content:"";position:absolute;left:-2px;right:-2px;top:1px;bottom:1px;background:var(--sheet);opacity:.9;border-radius:1px}
.hide .note::before{left:5px}
.hide .revealed .ja,.hide .revealed .note{color:inherit}
.hide .revealed .ja::before,.hide .revealed .note::before{display:none}
.hide li.item{cursor:pointer}

.q-head{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3);margin-top:14px}
.q-stem{background:var(--panel);border:1px solid var(--rule);padding:26px 18px;text-align:left;margin-top:6px}
.q-stem .qt{font-family:var(--serif);font-size:clamp(17px,4.6vw,21px);line-height:1.7;word-break:break-word}
.q-stem .refs{font-size:11px;color:var(--ink-3);margin-top:10px;text-align:right}
.oxbtns{display:flex;gap:10px;margin-top:12px}
.oxbtn{flex:1;aspect-ratio:2;border-radius:var(--radius);border:2px solid var(--rule);background:var(--panel);font-size:34px;font-weight:700;font-family:var(--serif)}
.oxbtn.maru{color:var(--ok)}
.oxbtn.batsu{color:var(--red)}
.result-banner{border-radius:var(--radius);padding:14px 16px;margin-top:12px;display:flex;align-items:center;gap:12px;border:1px solid var(--rule)}
.result-banner.ok{background:var(--ok-soft);border-color:var(--ok)}
.result-banner.ng{background:var(--red-soft);border-color:var(--red)}
.result-banner .rmark{font-size:26px;font-family:var(--serif);font-weight:700}
.result-banner.ok .rmark{color:var(--ok)}
.result-banner.ng .rmark{color:var(--red)}
.result-banner .rtxt{font-size:13.5px;font-weight:700}
.q-result{margin-top:10px;background:var(--panel);border:1px solid var(--rule);padding:14px}
.q-result .r-cite{font-size:12px;font-weight:700;color:var(--warn);margin-bottom:6px}
.q-result .r-note{font-size:13px;color:var(--ink);white-space:pre-line;line-height:1.75}
.memo-box{margin-top:12px}
.memo-box label{font-size:11.5px;color:var(--ink-3);display:flex;align-items:center;gap:6px;margin-bottom:5px}
.memo-box textarea{width:100%;min-height:52px;border:1px solid var(--rule);background:var(--panel);padding:8px 10px;font-size:13px;border-radius:var(--radius);resize:vertical}
.memo-saved{font-size:10.5px;color:var(--ok);opacity:0;transition:opacity .3s}
.memo-saved.show{opacity:1}
.grade{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.grade button{border:1px solid var(--rule);background:var(--panel);padding:13px 4px;border-radius:var(--radius);font-size:14px}
.grade button b{display:block;font-size:11px;font-weight:400;color:var(--ink-3);margin-top:2px}
.g2{color:var(--warn)} .g3{color:var(--ok)}
.navrow{display:flex;gap:8px;margin-top:10px}
.navrow button{flex:1;border:1px solid var(--rule);background:var(--panel);padding:11px;border-radius:var(--radius);font-size:14px}
.btn-main{background:var(--ink)!important;color:var(--paper)!important;border-color:var(--ink)!important}
.score{text-align:center;padding:40px 16px;background:var(--panel);border:1px solid var(--rule);margin-top:14px}
.score .big{font-family:var(--serif);font-size:52px;line-height:1}

.stat-card{background:var(--panel);border:1px solid var(--rule);padding:14px;margin-top:12px}
.stat-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--rule-2)}
.stat-row:last-child{border-bottom:none}
.stat-row .nm{width:110px;font-size:12px;flex:none}
.bar{flex:1;height:9px;background:var(--rule-2);display:flex;overflow:hidden}
.bar i{height:100%}
.pc{width:52px;text-align:right;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;flex:none}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--ink-3);margin-top:10px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;margin-right:5px;vertical-align:-1px}
.lg3::before{background:var(--ok)} .lg2::before{background:var(--warn)} .lg0::before{background:var(--rule-2)}
.mini{font-size:12.5px;color:var(--ink-2);line-height:1.75}
.act{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.act button{border:1px solid var(--rule);background:var(--panel);padding:9px 13px;border-radius:var(--radius);font-size:13px}
.act .danger{color:var(--red);border-color:var(--red)}
.empty{text-align:center;color:var(--ink-3);padding:48px 16px;font-size:14px}
footer{text-align:center;font-size:11px;color:var(--ink-3);padding:26px 0 34px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:99px;font-size:13px;z-index:60;opacity:0;pointer-events:none;transition:opacity .18s}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:520px){
  li.item{gap:0 9px;padding:8px}
  .en{font-size:15px}
}

.add-overlay{position:fixed;inset:0;background:rgba(20,20,20,.5);z-index:80;display:none;align-items:flex-end;justify-content:center}
.add-modal{background:var(--panel);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:14px 14px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));box-sizing:border-box}
.add-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.add-title{font-family:var(--serif);font-size:17px;font-weight:700}
.add-body{display:flex;flex-direction:column}
.flabel{font-size:11.5px;color:var(--ink-3);margin-top:12px;margin-bottom:4px;font-weight:700}
.add-body input,.add-body select,.add-body textarea{width:100%;border:1px solid var(--rule);background:var(--paper);color:var(--ink);padding:9px 10px;border-radius:var(--radius);font-size:14px;resize:vertical;font-family:inherit}
.oxbtns.small{display:flex;gap:8px;margin-top:2px}
.oxbtns.small .oxbtn{aspect-ratio:auto;padding:10px;font-size:22px}
.oxbtn.sel.maru{background:var(--ok);border-color:var(--ok);color:#fff}
.oxbtn.sel.batsu{background:var(--red);border-color:var(--red);color:#fff}
.add-foot{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:8px}
.add-foot .danger{color:var(--red);border:1px solid var(--red);background:none;padding:10px 14px;border-radius:var(--radius);font-size:13px}
.badge-custom{display:inline-block;font-size:10px;background:var(--blue);color:#fff;padding:1px 6px;border-radius:99px;margin-right:6px;vertical-align:middle}
.edit-btn{margin-top:6px;font-size:10px}
.stat-card input{width:100%;border:1px solid var(--rule);background:var(--paper);color:var(--ink);padding:9px 10px;border-radius:var(--radius);font-size:13px;margin-top:4px}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="hd">
      <div class="brand">企業法 短答対策問題集<small>公認会計士試験</small></div>
      <div class="hd-sp"></div>
      <button class="iconbtn" id="btnAdd" title="問題を追加">＋</button>
      <button class="iconbtn" id="btnSheet" aria-pressed="false" title="赤シート（答えを隠す）">赤</button>
      <button class="iconbtn" id="btnTheme" title="表示切替">◐</button>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-view="list">一覧</button>
      <button role="tab" aria-selected="false" data-view="quiz">テスト</button>
      <button role="tab" aria-selected="false" data-view="record">記録</button>
    </div>
  </div>
  <div class="meter" id="meter"></div>
</header>
<main class="wrap" id="app"></main>
<div class="add-overlay" id="addOverlay"></div>
<footer>企業法 短答対策問題集①②（全15章・2313問）</footer>
<div class="toast" id="toast"></div>

<script id="quiz-data" type="application/json">[{"n":1,"name":"会社法総論","qs":[{"l":1,"m":"","sb":"","i":"A","r":"","q":"会社とは，株式会社，合名会社，合資会社または合同会社をいう。","a":true,"c":"2条1号。","e":""},{"l":2,"m":"","sb":"","i":"A","r":"","q":"合名会社は，直接無限責任社員のみからなる会社である。","a":true,"c":"576条2項。","e":""},{"l":3,"m":"","sb":"","i":"A","r":"","q":"合資会社は，直接有限責任社員のみからなる会社である。","a":false,"c":"576条3項。","e":"合資会社は，直接無限責任社員および直接有限責任社員からなる会社である。"},{"l":4,"m":"","sb":"","i":"A","r":"","q":"合同会社は，直接有限責任社員のみからなる会社である。","a":false,"c":"576条4項。","e":"合同会社は，間接有限責任社員のみからなる会社である。"},{"l":5,"m":"","sb":"","i":"A","r":"","q":"株式会社は，間接有限責任社員のみからなる会社である。","a":true,"c":"104条。","e":""},{"l":6,"m":"","sb":"","i":"A","r":"(平23I問題4ア)","q":"株主の責任は，その有する株式の引受価額を限度とする。","a":true,"c":"104条。","e":"株主の有限責任である。株式の引受価額を限度に出資義務を負担する有限責任とすることで，出資に伴って被る可能性のあるリスクを限定し，一般投資家が安心して出資を行うことができるようにしている。"},{"l":7,"m":"","sb":"","i":"A","r":"(平29II問題5ア・平23I問題5イ類)","q":"譲渡制限株式でない種類の株式と譲渡制限株式をともに発行する種類株式発行会社は，公開会社ではない。","a":false,"c":"2条5号。","e":"公開会社とは，その発行する全部または一部の株式の内容として譲渡による当該株式の取得について株式会社の承認を要する旨の定款の定めを設けていない株式会社をいう。すなわち，その発行する一部の株式の内容として譲渡による当該株式の取得について株式会社の承認を要する旨の定款の定めを設けていない株式会社も公開会社であるため，譲渡制限株式でない種類の株式と譲渡制限株式をともに発行する種類株式発行会社は，公開会社である。例えば，定款で２種類の株式（Ａ種類株式・Ｂ種類株式）を定めている種類株式発行会社において，Ａ種類株式については譲渡制限があるが，Ｂ種類株式については譲渡制限がない場合，当該株式会社は公開会社となる。"},{"l":8,"m":"","sb":"","i":"A","r":"(平25I問題2ウ)","q":"発行済株式の全部が譲渡制限株式であり，定款で譲渡制限株式以外の株式を発行する旨を定めている株式会社は，公開会社である。","a":true,"c":"2条5号。","e":"公開会社とは，その発行する全部または一部の株式の内容として譲渡による当該株式の取得について株式会社の承認を要する旨の定款の定めを設けていない株式会社をいう。したがって，発行済株式の全部が譲渡制限株式であっても，定款で譲渡制限株式以外の株式を発行する旨を定めている株式会社は，公開会社である。"},{"l":9,"m":"","sb":"","i":"A","r":"(平31II問題8イ)","q":"取締役会設置会社は，常に，公開会社である。","a":false,"c":"","e":"公開会社とは，その発行する全部または一部の株式の内容として譲渡による当該株式の取得について株式会社の承認を要する旨の定款の定めを設けていない株式会社である（２条５号）。そのため，取締役会設置会社であってもその発行する全部の株式の内容として譲渡による当該株式の取得について株式会社の承認を要する旨の定款の定めを設けた場合は非公開会社となる。したがって，本肢は誤りである。"},{"l":10,"m":"","sb":"","i":"A","r":"(平25I問題2イ類)","q":"大会社とは，最終事業年度にかかる貸借対照表に資本金として計上した額が５億円以上であり，かつ，負債の部に計上した額の合計額が200億円以上である株式会社をいう。","a":false,"c":"2条6号。","e":"大会社とは，最終事業年度にかかる貸借対照表に資本金として計上した額が５億円以上である株式会社，または，最終事業年度にかかる貸借対照表の負債の部に計上した額の合計額が200億円以上である株式会社をいう。"},{"l":11,"m":"","sb":"","i":"C","r":"","q":"法人格否認の法理が要請される場合とは，法人格が法律の適用を回避するために濫用されるような場合，または，法人格が全くの形骸化にすぎない場合である。","a":true,"c":"最判昭44年2月27日。","e":""},{"l":12,"m":"","sb":"","i":"C","r":"","q":"法人格否認の法理が適用される場合には，会社の法人格という存在自体が全面的に否定されることとなる。","a":false,"c":"","e":"法人格否認の法理が適用された場合，特定の事案の解決に必要な範囲で，会社がその社員から独立した権利義務の帰属主体であることが否定される。すなわち，法人格否認の法理は，会社解散命令(824条1項)，設立無効の訴え（828条1項1号）等の制度のような会社の法人格という存在自体を全面的に否定するものではなく，当該特定の事例に限り社員と会社を同一視することを認めるものである。"},{"l":13,"m":"","sb":"","i":"C","r":"","q":"株式会社において，株主が一人である一人会社は認められない。","a":false,"c":"","e":"株式会社は，株主が一人となったことを解散事由としていない（471 条参照）ため，株主が一人である一人会社は認められる。また，持分会社も同様であるが（641 条参照），合資会社については直接無限責任社員および直接有限責任社員からなるため，社員が一人である一人会社はあり得ない。"},{"l":14,"m":"","sb":"","i":"C","r":"","q":"判例によると，定款所定の目的の範囲内の行為とは，定款に記載された目的自体だけでなく，目的遂行に直接的または間接的に必要な行為も包含され，目的遂行のために必要な行為か否かは，当該行為の客観的性質に即して，抽象的に判断されなければならないとされる。","a":true,"c":"最判昭45年6月24日。","e":"取引の安全の観点から，定款所定の目的を広く解釈し，定款に記載された目的自体だけでなく，目的遂行に直接的または間接的に必要な行為も包含され，目的遂行のために必要な行為か否かは，当該行為の客観的性質に即して，抽象的に判断される。結果として，目的外行為と判断される取引行為はほとんどなく，実質的には定款所定の目的による制限はないと考えられる。"},{"l":15,"m":"","sb":"","i":"C","r":"","q":"判例によると，会社による政治資金の寄付は，客観的，抽象的に観察して会社の社会的役割を果たすためになされたものと認められるものであっても，会社の定款所定の目的の範囲内の行為であるとは認められない。","a":false,"c":"最判昭45年6月24日。","e":"行為の客観的性質に即して判断すると，定款所定の目的たる行為の遂行に間接的ながら必要ないし有益な行為と考えられるため，会社の定款所定の目的の範囲内の行為であると認められる。"}]},{"n":2,"name":"機関","qs":[{"l":1,"m":"機関設計","sb":"","i":"A","r":"(令2I問題7ア・平27I問題6ア)","q":"株式会社は，２人以上の取締役を置かなければならない。","a":false,"c":"326条1項。","e":"すべての株式会社は株主総会および取締役を置かなければならない（295条，326条１項）ため，株式会社には，１人または２人以上の取締役を置かなければならない。なお，取締役会設置会社においては，取締役は，３人以上でなければならない（331条５項）。"},{"l":2,"m":"機関設計","sb":"","i":"A","r":"","q":"会社法の規定により取締役会を設置しなければならない株式会社は，定款において取締役会を置く旨を定める必要はない。","a":false,"c":"326条2項。","e":"株式会社において必ず設置が義務づけられている株主総会および取締役以外の機関を置く場合には，定款にその旨を定める必要がある。株式会社の機関設計は，株主総会を含む各機関の権限に大きな影響を与えるため（295条，362条等），株主にとって重要な関心事となる。そのため，会社法では，機関設計の選択に株主の意思が反映されるように定款にその旨を定めることを要求しているのである。"},{"l":3,"m":"機関設計","sb":"","i":"A","r":"","q":"大会社は，取締役会を置かなければならない。","a":false,"c":"327条1項各号参照。","e":"327 条１項各号に掲げられている株式会社（公開会社，監査役会設置会社，監査等委員会設置会社および指名委員会等設置会社）に該当しなければ，取締役会の設置義務は課せられない。したがって，大会社であっても，監査役会設置会社，監査等委員会設置会社または指名委員会等設置会社以外の非公開会社は，取締役会の設置義務は課されていない。"},{"l":4,"m":"機関設計","sb":"","i":"A","r":"(令6II問題8ウ・平30II問題9エ・平27I問題6イ・平25I問題8ア類・平20問題7イ)","q":"監査役会設置会社は，取締役会を置かなければならない。","a":true,"c":"327条1項2号。","e":"業務執行について取締役会を置かないという簡易な機関設計を採用したにも関わらず，監査について監査役会という複雑な仕組みを置く需要は想定しにくいためである。"},{"l":5,"m":"機関設計","sb":"","i":"A","r":"(平31II問題8ア・平25II問題7ウ類・平25I問題8エ)","q":"指名委員会等設置会社および監査等委員会設置会社は，常に，取締役会設置会社である。","a":true,"c":"327条1項3号4号。","e":"指名委員会等設置会社の委員の選定および解職の権限は取締役会にあるなど，各委員会に関する会社法の規定は取締役会の存在を前提としているからである（400条２項，401条１項等）。また，監査等委員会設置会社は，取締役会の業務執行者に対する監督機能の強化を目的とする機関設計の株式会社制度であるためである。"},{"l":6,"m":"機関設計","sb":"","i":"A","r":"(平31II問題8エ・平25I問題8イ)","q":"会計参与設置会社は，常に，取締役会設置会社である。","a":false,"c":"","e":"327 条１項各号に掲げられている株式会社（公開会社，監査役会設置会社，監査等委員会設置会社および指名委員会等設置会社）に該当しなければ，取締役会の設置義務は課せられないため，本肢は誤りである。なお，会計参与は，いずれの機関設計においても任意に設置可能な機関である。"},{"l":7,"m":"機関設計","sb":"","i":"A","r":"(令7I問題8イ類・平25II問題7ア類・平22II問題8イ・平21問題8ア類)","q":"取締役会設置会社（監査等委員会設置会社および指名委員会等設置会社を除く）は，必ず監査役を置かなければならない。","a":false,"c":"327条2項ただし書。","e":"取締役会設置会社（監査等委員会設置会社および指名委員会等設置会社を除く）は，監査役を置かなければならない（327 条２項本文）。取締役会設置会社においては，株主総会の権限が制限され（295 条２項，362 条２項２号参照），株主の代わりに取締役を監督する仕組みが必要となるが，取締役会では，取締役同士の密接な結び付きにより監督機能を十分に果たすことができないからである。ただし，非公開会社である会計参与設置会社においては，取締役会設置会社であっても監査役を置かなくてよい。非公開会社の場合，株主が頻繁に変動することは想定しにくく，株主による監督をある程度期待することができ，公認会計士や税理士といった資格を有する会計参与が取締役と共同して作成した計算書類等について，重ねて監査役の監査を要求する必要は少ないからである。ただし，大会社は，会計監査人の設置義務を負い（328 条），会計監査人設置会社（監査等委員会設置会社および指名委員会等設置会社を除く）は，監査役の設置義務を負う（327条３項）ことになるため，注意してほしい。"},{"l":8,"m":"機関設計","sb":"","i":"A","r":"(平30II問題9ア・平22I問題8イ)","q":"公開会社（監査等委員会設置会社および指名委員会等設置会社を除く）は，監査役を置かないことができる。","a":false,"c":"327条1項1号,2項。","e":"非公開会社である会計参与設置会社においては，取締役会設置会社（監査等委員会設置会社および指名委員会等設置会社を除く）であっても監査役を置かなくてよいが（327 条２項ただし書），公開会社である場合はこの例外規定が適用されないことから，公開会社（監査等委員会設置会社および指名委員会等設置会社を除く）は，監査役を置かなければならない。"},{"l":9,"m":"機関設計","sb":"","i":"A","r":"(平30II問題9イ類)","q":"会計監査人設置会社（監査等委員会設置会社および指名委員会等設置会社を除く）は，監査役会を置かなければならない。","a":false,"c":"327条3項。","e":"会計監査人設置会社（監査等委員会設置会社および指名委員会等設置会社を除く）は，監査役を置かなければならない。なぜなら，会計監査人と監査役は会計監査業務の面で密接に関係するためである（398 条参照）。また，業務執行機関からの会計監査人の独立性を確保するためには，監査役が必要不可欠だからである（344条，399条等）。しかし，監査役会の設置までは求められていないため，本肢は誤りである。"},{"l":10,"m":"機関設計","sb":"","i":"A","r":"(平25I問題8ウ)","q":"会計監査人設置会社は，常に，取締役会設置会社である。","a":false,"c":"","e":"327 条１項各号に掲げられている株式会社（公開会社，監査役会設置会社，監査等委員会設置会社および指名委員会等設置会社）に該当しなければ，取締役会の設置義務は課せられないため，本肢は誤りである。"},{"l":11,"m":"機関設計","sb":"","i":"A","r":"(令2I問題7ウ・平30I問題8ア・平29I問題8ウ類・平28I問題7イ・平21問題8イ類)","q":"監査等委員会設置会社および指名委員会等設置会社は，定款の定めによっても，監査役を置くことができない。","a":true,"c":"327条4項。","e":"監査等委員会設置会社は監査等委員会に，指名委員会等設置会社は監査委員会に取締役等の職務執行の監査権限を付与しており（399 条の２第３項１号，404 条２項１号），監査役が存在すると監査権限が重複してしまうからである。"},{"l":12,"m":"機関設計","sb":"","i":"A","r":"(平22II問題8ウ類・平21問題8ウ類)","q":"公開会社は，会計監査人を置かなければならない。","a":false,"c":"","e":"会計監査人の設置が義務づけられているのは，監査等委員会設置会社，指名委員会等設置会社または大会社である（327条５項，328条）。したがって，本肢は誤りである。"},{"l":13,"m":"機関設計","sb":"","i":"A","r":"(令7I問題8ウ・平31II問題8ウ・平31I問題8ア・平30II問題9ウ類・平28I問題7ア類・平20問題14ア)","q":"監査等委員会設置会社および指名委員会等設置会社は，常に，会計監査人設置会社である。","a":true,"c":"327条5項。","e":"指名委員会等は，内部統制システムを利用して会社の業務執行に対する監督等を行うものであるところ，会計監査人が置かれないと，企業の財務報告の信頼性を確保する仕組みの構築が難しく，監督等を十分に行うことができないと考えられるからである。なお，監査等委員会についても同様である。"},{"l":14,"m":"機関設計","sb":"","i":"A","r":"(令6II問題8ア類・令2II問題8イ・平27I問題6エ類・平25II問題7イ類)","q":"会計参与を置く大会社（公開会社，監査役会設置会社，監査等委員会設置会社および指名委員会等設置会社を除く）は，会計監査人を置かないことができる。","a":false,"c":"328条。","e":"大会社は会計監査人を置かなければならない。大会社は規模が大きいことから，多数の株主や債権者等の利害関係者の存在が想定されるため，当該利害関係人の保護を図る趣旨で，会社の計算書類等の適正性の確保が必要となるのである。会計参与を任意で設置した場合でも，大会社は会計監査人の設置義務を免れることができないことから，本肢は誤りである。"},{"l":15,"m":"機関設計","sb":"","i":"A","r":"(令3問題10ア類・平27I問題6ウ・平22I問題8エ類・平20問題7ウ)","q":"大会社（監査等委員会設置会社および指名委員会等設置会社を除く）は，監査役会を置かなければならない。","a":false,"c":"328条1項。","e":"公開大会社（監査等委員会設置会社および指名委員会等設置会社を除く）は，監査役会を置かなければならない。公開大会社は，多数の株主や債権者等の利害関係者が存在すること，および，株主が頻繁に変動することが想定されるため，監査役会の設置を義務づけることで，監査体制の強化を図っているのである。"},{"l":16,"m":"機関設計","sb":"","i":"A","r":"(平29I問題8ア・平22I問題8ア)","q":"公開会社でない株式会社は，指名委員会等を置いて指名委員会等設置会社となることができない。","a":false,"c":"326条2項。","e":"公開会社であるか否か，大会社であるか否かに関係なく，指名委員会等（指名委員会，監査委員会および報酬委員会）を設置して，指名委員会等設置会社となることができる。なお，同様に，株式会社は，公開会社であるか否か，大会社であるか否かに関係なく，監査等委員会を設置して，監査等委員会設置会社となることができる。"},{"l":17,"m":"機関設計","sb":"","i":"A","r":"(平29I問題8エ)","q":"指名委員会等設置会社は，監査等委員会を置いてはならない。","a":true,"c":"327条6項。","e":"監査等委員会は，指名委員会等と機能が重複するからである。"},{"l":18,"m":"機関設計","sb":"","i":"A","r":"(令2I問題7イ)","q":"会計監査人設置会社は，定款の定めによって会計参与を置くことができる。","a":true,"c":"326条2項。","e":"会計参与は，いずれの機関設計においても任意に設置可能である。"},{"l":19,"m":"機関設計","sb":"","i":"A","r":"(平30I問題8イ類・平25II問題7エ類・平20問題7エ)","q":"監査等委員会設置会社および指名委員会等設置会社は，会計参与を置いてはならない。","a":false,"c":"326条2項。","e":"会計参与は，いずれの機関設計においても任意に設置可能である。"},{"l":20,"m":"機関設計","sb":"","i":"A","r":"(平29I問題8イ)","q":"公開会社でない大会社は，会計参与を置いてはならない。","a":false,"c":"326条2項。","e":"会計参与は，いずれの機関設計においても任意に設置可能である。"},{"l":21,"m":"機関設計","sb":"","i":"A","r":"(平30I問題8エ)","q":"公開会社でない監査役設置会社は，定款の定めによっても，会計参与を置くことができない。","a":false,"c":"326条2項。","e":"会計参与は，いずれの機関設計においても任意に設置可能である。"},{"l":1,"m":"株主総会","sb":"株主総会の権限","i":"A","r":"(令4II問題7ア類・平31I問題10ア類)","q":"取締役会設置会社以外の株式会社の株主総会は，会社法に規定する事項および定款で定めた事項に限り，決議することができる。","a":false,"c":"295条1項。","e":"取締役会非設置会社の株主総会は，会社法に規定する事項および株式会社の組織，運営，管理その他株式会社に関する一切の事項について決議することができる（295 条１項）。すなわち，取締役会非設置会社においては，株主総会を万能の意思決定機関としているのである。"},{"l":2,"m":"株主総会","sb":"株主総会の権限","i":"A","r":"(平28II問題9ア類・平27I問題7ア・平23II問題8ア)","q":"取締役会設置会社においては，株主総会は，会社法に規定する事項および株式会社の組織，運営，管理その他株式会社に関する一切の事項について決議することができる。","a":false,"c":"295条2項。","e":"取締役会設置会社では，株主総会は，会社法に規定する事項および定款で定めた事項に限り，決議をすることができる。すなわち基本的重要事項を決定する権限を有する。これは，取締役会による会社経営の適切かつ適時性のある意思決定を確保するためである。"},{"l":3,"m":"株主総会","sb":"株主総会の権限","i":"A","r":"(平27I問題7イ)","q":"会社法の規定により株主総会の決議を必要とする事項について，取締役，執行役，取締役会その他の株主総会以外の機関が決定することができることを内容とする定款の定めは，その効力を有しない。","a":true,"c":"295条3項。","e":"会社法で定められた株主総会の決議事項は，定款をもってしても，他の機関にその決定を委ねることができない。これらは，株主の利益に重大な影響があるために株主総会の権限とされたものだからである。"},{"l":4,"m":"株主総会","sb":"株主総会の権限","i":"B","r":"(令4I問題9ア類・平31I問題9ア)","q":"公開会社でない取締役会設置会社において，取締役会の決議によるほか，株主総会の決議によっても代表取締役を定めることができる旨の定款の定めは無効である。","a":false,"c":"最決平29年2月21日。","e":"公開会社でない取締役会設置会社において，取締役会の決議によるほか，株主総会の決議によっても代表取締役を定めることができる旨の定款の定めは有効である。取締役会設置会社の株主総会は，会社法が規定する事項および定款が定める事項，すなわち，基本的重要事項に限り決議することができる（295 条２項）。ここで，会社法において定款で定める事項の内容を制限する明文の規定はない。会社法は取締役会をもって代表取締役の職務執行を監督する機関と位置付けていると解されるが，取締役会設置会社である非公開会社において，取締役会の決議によるほか株主総会の決議によっても代表取締役を定めることができることとしても，代表取締役の選定および解職に関する取締役会の権限（362条２項３号）が否定されるものではなく，取締役会の監督権限の実効性を失わせるとはいえない。"},{"l":1,"m":"株主総会","sb":"株主提案権","i":"A","r":"(令3問題7ウ類・平28II問題9ウ類)","q":"公開会社においては，総株主の議決権の100分の１以上の議決権，または，発行済株式（自己株式を除く）の100分の１以上の数の株式を６か月前から引き続き有する株主に限り，取締役に対して，一定の事項（当該株主が議決権を行使することができる事項に限る）を株主総会の目的とすることを請求することができる。","a":false,"c":"303条2項前段。","e":"取締役会設置会社においては，総株主の議決権の100分の１（定款で緩和可）以上の議決権，または，300個（定款で緩和可）以上の議決権を有する株主に限り，取締役に対して，一定の事項を株主総会の目的とすることを請求することができる。さらに，公開会社においては，６か月の保有期間要件が求められる。議題提案権は議決権に関する共益権であるため，議決権基準のみ設けられており，株式数基準は設けられていない。ここで，議決権割合の要件と個数要件が併存している趣旨は，大規模会社においては個数基準を満たす方が容易であり，より広い層の株主が株主提案権を行使することができるようにすることにある。"},{"l":2,"m":"株主総会","sb":"株主提案権","i":"A","r":"","q":"取締役会設置会社において，株主が取締役に対して一定の事項（当該株主が議決権を行使することができる事項に限る）を株主総会の目的とすることを請求する場合，その請求は，株主総会の日の８週間前までにしなければならない。","a":true,"c":"303条2項後段。","e":"取締役会設置会社において株主が議題提案権を行使するには，株主総会の日の８週間前までに請求する必要がある。当該要件が定められている理由としては，公開会社では株主総会の日の２週間前（非公開会社では１週間前）までに招集通知を発しなければならないため，株主の提案した議題を当該招集通知に記載する準備の機会を会社に与えるためである。"},{"l":3,"m":"株主総会","sb":"株主提案権","i":"A","r":"(平31I問題10ウ類・平24I問題8エ)","q":"取締役会設置会社以外の株式会社において，１個以上の議決権を有する株主は，取締役に対し，当該株主が議決権を行使することができる事項を株主総会の目的とすることを請求することができる。","a":true,"c":"303条1項。","e":"取締役会非設置会社における議題提案権は，単独株主権である。また，８週間前に請求しなければならないという要件もない。"},{"l":4,"m":"株主総会","sb":"株主提案権","i":"A","r":"(令2II問題9イ類・平27II問題6ウ類)","q":"公開会社においては，総株主の議決権の100分の１以上の議決権，または，300個以上の議決権を６か月前から引き続き有する株主に限り，株主総会の目的である事項（当該株主が議決権を行使することができる事項）につき議案を提出することができる。","a":false,"c":"304条本文。","e":"議案提案権は，取締役会を設置しているか否かを問わず，すべての株式会社において単独株主権とされている。株主総会の会場で，ある議題について議案を提出することは，会議の一般原則から可能であり，その意味で304条本文は確認的な規定である。"},{"l":5,"m":"株主総会","sb":"株主提案権","i":"A","r":"(平27II問題6エ類)","q":"株主は，株主総会において，株主総会の目的である事項（当該株主が議決権を行使することができる事項に限る）につき議案を提出することができるが，当該議案が実質的に同一の議案につき株主総会において総株主（当該議案について議決権を行使することができない株主を除く）の議決権の 10 分の１以上の賛成を得られなかった日から３年を経過していない場合は，当該議案の提案は認められない。","a":true,"c":"304条ただし書。","e":"株主総会の円滑な運営の観点から，その議案が法令もしくは定款に違反する場合または実質的に同一の議案につき株主総会において総株主（その議案について議決権を行使することができない株主を除く）の議決権の 10 分の１以上の賛成を得られなかった日から３年を経過していない場合には，議案提案権を行使することができない。"},{"l":6,"m":"株主総会","sb":"株主提案権","i":"B","r":"(平30I問題9ウ)","q":"株主は，株主総会において，当該株主総会の目的である事項について自らが議決権を行使することができない場合には，当該事項について議案を提出することができない。","a":true,"c":"304条本文かっこ書。","e":""},{"l":7,"m":"株主総会","sb":"株主提案権","i":"A","r":"(平28II問題9エ類)","q":"取締役会設置会社以外の株式会社において，株主は，取締役に対し，株主総会の日の２週間前までに，株主総会の目的である事項（当該株主が議決権を行使することができる事項に限る）につき当該株主が提出しようとする議案の要領を株主に通知することを請求することができる。","a":false,"c":"305条1項本文。","e":"議案通知請求権は事前に議案の要領を株主に通知することを請求するものであるという性質から，取締役会を設置しているか否かを問わず，すべての株式会社において，株主総会の日から８週間（定款で短縮可）前までに請求することが要求されている。なお，当該議案通知請求権を行使することができる株主の要件は，議題提案権（303条）と同様である（305条１項２項）。また，通知請求することができない議案の内容は，議案提案権（304 条ただし書）と同様である（305 条４項）。"},{"l":8,"m":"株主総会","sb":"株主提案権","i":"B","r":"(平27II問題6イ)","q":"一定の事項を株主総会の会議の目的とすることを株式会社に適法に請求した株主が当該株主総会に出席しなかった場合には，当該株主総会において，当該事項を会議の目的とすることができない。","a":false,"c":"","e":"このような規定はない。"},{"l":9,"m":"株主総会","sb":"株主提案権","i":"B","r":"","q":"取締役会設置会社以外の株式会社において，株主は，取締役に対し，株主総会の目的である事項（当該株主が議決権を行使することができる事項に限る）につき当該株主が提出しようとする議案の要領を株主に通知することを請求する場合において，当該取締役会設置会社以外の株式会社は，10を超える数に相当することとなる数の議案については当該株主の請求を拒むことができる。","a":false,"c":"305条4項前段。","e":"取締役会設置会社の株主が，議案通知請求権を行使する場合において，当該株主が提出しようとする議案の数が10を超えるときは，会社は 10 を超える数に相当することとなる数の議案については，当該株主の請求を拒むことができる。この場合において，当該株主が提出しようとする以下の議案の数については，当該議案の数にかかわらず，これを１個の議案とみなす（305条４項）。(ⅰ) 役員等の選任に関する議案，(ⅱ) 役員等の解任に関する議案，(ⅲ) 会計監査人を再任しないことに関する議案，(ⅳ) 定款の変更に関する２以上の議案（当該２以上の議案について異なる議決がされたとすれば当該議決の内容が相互に矛盾する可能性がある場合に限る）"},{"l":10,"m":"株主総会","sb":"株主提案権","i":"B","r":"(令5I問題9ア)","q":"取締役会設置会社において，株主が，10を超える数の議案について，その要領を株主総会の招集通知に記載するように請求した場合には，取締役は，当該株主の意向にかかわらず，10を超える数に相当することとなる数の議案を定め，その記載を拒むことができる。","a":false,"c":"305条5項。","e":"取締役会設置会社の株主が，議案通知請求権を行使する場合において，当該株主が提出しようとする議案の数が10を超えるときは，会社は 10 を超える数に相当することとなる数の議案については，当該株主の請求を拒むことができる（305条４項柱書前段）。なお，10を超える数に相当することとなる数の議案（請求を拒む議案）については，原則として取締役が定めるが，当該請求をした株主が，あらかじめ提出しようとする２以上の議案の全部または一部につき議案相互間の優先順位を定めている場合には，取締役は，当該優先順位に従い，これを定める。"},{"l":11,"m":"株主総会","sb":"株主提案権","i":"B","r":"(令5I問題9イ)","q":"取締役会設置会社において，10を超える数に相当する議案であることを理由に，その要領を株主総会の招集通知に記載することを取締役が拒むことができるかを判断する場合において，指名委員会等を設置する旨の定款の定めを廃止する議案および監査等委員会を設置する旨の定款の定めを設ける議案は，１個の議案とみなされる。","a":true,"c":"305条4項4号。","e":"取締役会設置会社における議案通知請求権において，10を超える数に相当する議案であることを理由に，その要領を株主総会の招集通知に記載することを取締役が拒むことができるかを判断する場合，定款の変更に関する２以上の議案について，異なる議決がされたとすれば当該議決の内容が相互に矛盾する可能性がある場合には，それらの議案はまとめて１個の議案とみなされる。ここで，「指名委員会等を設置する旨の定款の定めを廃止する議案」と「監査等委員会を設置する旨の定款の定めを設ける議案」が提案された場合，前者の議案が否決，後者の議案が可決されると相互に矛盾が生じてしまう。指名委員会等設置会社は，監査等委員会を置いてはならないためである（327条６項）。したがって，これらの議案は，１個の議案とみなされる。"},{"l":12,"m":"株主総会","sb":"株主提案権","i":"B","r":"(令5I問題9ウ)","q":"取締役会設置会社において，10を超える数に相当する議案であることを理由に，その要領を株主総会の招集通知に記載することを取締役が拒むことができるかを判断する場合において，２人の会計監査人を再任しないことに関する議案は，２個の議案とみなされる。","a":false,"c":"305条4項3号。","e":"取締役会設置会社における議案通知請求権において，10を超える数に相当する議案であることを理由に，その要領を株主総会の招集通知に記載することを取締役が拒むことができるかを判断する場合，会計監査人を再任しないことに関する議案が複数提案される場合は，まとめて１個の議案とみなされる。"},{"l":13,"m":"株主総会","sb":"株主提案権","i":"B","r":"(令5I問題9エ)","q":"株主が提出しようとする議案と実質的に同一の議案が株主総会において総株主の議決権の 10 分の１以上の賛成を得られなかった日から３年を経過していない場合には，取締役は，その要領を株主総会の招集通知に記載することの請求を拒むことができる。","a":true,"c":"305条6項。","e":""},{"l":1,"m":"株主総会","sb":"株主総会の招集","i":"A","r":"","q":"株式会社は，毎事業年度の終了後一定の時期に株主総会を招集しなければならない。","a":true,"c":"296条1項。","e":"定時株主総会についての記述である。なお，株主総会は，必要がある場合には，いつでも，招集することができる（臨時株主総会）（296条２項）。"},{"l":2,"m":"株主総会","sb":"株主総会の招集","i":"B","r":"(平27I問題7エ)","q":"公開会社が定時株主総会の招集の通知を書面でする場合において，当該定時株主総会の日が前事業年度に係る定時株主総会の日に応当する日と著しく離れた日であるときは，その日時を決定した理由を当該書面に記載しなければならない。","a":true,"c":"298条1項5号,会社法施行規則63条1号イ。","e":"また，株式会社が公開会社である場合において，定時株主総会の日と同一日において定時株主総会を開催する他の公開会社が著しく多い場合には，当該日に開催する理由が特にある場合に限って，その日時を決定した理由を定めなければならない（会社法施行規則63条１号ロ）。"},{"l":3,"m":"株主総会","sb":"株主総会の招集","i":"C","r":"","q":"株主総会の場所は，本店の所在地またはこれに隣接する地としなければならない。","a":false,"c":"298条1項1号。","e":"株主総会の場所に制限は設けられていない。ただし，株主総会の場所が過去に開催した株主総会のいずれの場所とも著しく離れた場所であるときは，当該場所が定款で定められている場合，または，当該場所で開催することについて株主総会に出席しない株主全員の同意がある場合を除いて，当該場所に決定した理由を定めなければならない（会社法施行規則63条２号）。"},{"l":4,"m":"株主総会","sb":"株主総会の招集","i":"B","r":"(平26I問題7ウ)","q":"取締役会設置会社が，代理人による議決権の行使について，代理権を証明する方法を定めたときは，当該株式会社は，当該事項を株主総会の招集通知に記載し，または記録しなければならない。","a":true,"c":"298条1項5号,会社法施行規則63条5号。","e":""},{"l":5,"m":"株主総会","sb":"株主総会の招集","i":"A","r":"(平26I問題7ア)","q":"取締役会設置会社においては，株主が株主総会を招集するときを除き，株主総会の招集事項の決定は，取締役会の決議によらなければならない。","a":true,"c":"298条4項。","e":"取締役会設置会社においては，株主が株主総会を招集するときを除き，株主総会の招集事項の決定は，取締役会の決議によらなければならない。なお，一定の要件を満たす監査等委員会設置会社，または，指名委員会等設置会社においても，当該決定は取締役または執行役に委任することができないものとされている（399条の13第５項４号，416条４項４号）。"},{"l":6,"m":"株主総会","sb":"株主総会の招集","i":"A","r":"","q":"株主総会は，必ず，取締役が招集しなければならない。","a":false,"c":"296条3項。","e":"株主総会は，原則として取締役が招集するが，一定の要件を満たせば，株主による招集（297 条４項）も認められている。"},{"l":7,"m":"株主総会","sb":"株主総会の招集","i":"A","r":"(平29I問題7ア類)","q":"公開会社において，総株主の議決権の100分の３以上の議決権を６か月前から引き続き有する株主は，株主総会を招集することができる。","a":false,"c":"297条1項4項。","e":"公開会社において，総株主の議決権の100分の３以上の議決権を６か月前から引き続き有する株主は，取締役に対して，株主総会の目的である事項（当該株主が議決権を行使することができる事項に限る）および招集の理由を示して，株主総会の招集を請求することができる。当該請求をした株主は，一定の場合，裁判所の許可を得て，株主総会を招集することができる。なお，非公開会社においては，６か月の保有期間要件は不要である（297条２項）。"},{"l":8,"m":"株主総会","sb":"株主総会の招集","i":"A","r":"(令6I問題9ア類・令4II問題7イ)","q":"取締役会設置会社以外の株式会社において，総株主の議決権の100分の３以上の議決権を有する株主は，取締役に対し，株主総会の目的である事項および招集の理由を示して，株主総会の招集を請求することができる。","a":true,"c":"297 条1項2項。","e":"総株主の議決権の100分の３以上の議決権を６か月前から継続して保有する株主は，取締役に対して，株主総会の目的である事項（当該株主が議決権を行使することができる事項に限る）および招集の理由を示して，株主総会の招集を請求することができる。なお，非公開会社では，６か月の保有期間要件は不要であり，取締役会非設置会社は非公開会社に該当するため（327 条１項１号参照），本肢は正しい。"},{"l":9,"m":"株主総会","sb":"株主総会の招集","i":"A","r":"(平29II問題9ウ・平24II問題8ア類)","q":"取締役に株主総会の招集を請求した株主は，当該請求の後遅滞なく招集の手続が行われない場合，または，当該請求があった日から８週間以内の日を株主総会の日とする株主総会の招集の通知が発せられない場合は，裁判所の許可を得て，株主総会を招集することができる。","a":true,"c":"297条4項。","e":"① 株主総会の招集請求の後，遅滞なく招集の手続が行われない場合，または，② 株主総会の招集請求があった日から８週間（定款で短縮可）以内の日を株主総会の日とする株主総会の招集の通知が発せられない場合には，株主総会の招集請求をした株主は，裁判所の許可を得て，株主総会を招集することができる。この場合においては，当該株主が招集事項の決定や招集の通知を行うこととなる（298条１項柱書かっこ書）。"},{"l":1,"m":"株主総会","sb":"株主総会の招集通知","i":"A","r":"","q":"取締役会設置会社における取締役が株主総会を招集するには，取締役は，株主総会の日の２週間前までに，株主に対してその通知を発しなければならない。","a":false,"c":"299条1項。","e":"取締役会設置会社であっても，公開会社か否かによって，招集通知の期限は異なる。招集通知の期限は，公開会社である取締役会設置会社では株主総会の日の２週間前，非公開会社である取締役会設置会社では株主総会の日の１週間前とされている。"},{"l":2,"m":"株主総会","sb":"株主総会の招集通知","i":"A","r":"(平27I問題7ウ)","q":"公開会社でない株式会社が，株主総会の招集通知を当該株主総会の日の1週間前までに発するものとするには，その旨を定款で定めなければならない。","a":false,"c":"299条1項かっこ書。","e":"非公開会社が株主総会を招集するには，取締役（株主による招集の場合には当該株主）は，株主総会の日の１週間前までに，株主に対して招集通知を発しなければならない。非公開会社の株主は少数かつ頻繁に変動せず，株主間の関係が緊密であることが想定されるため，公開会社の場合と比べて株主の準備期間を短縮しても問題ないと考えられたからである。よって，定款で定めなくても招集通知の期限は株主総会の日の１週間までである。"},{"l":3,"m":"株主総会","sb":"株主総会の招集通知","i":"A","r":"(平29II問題9ア類・平24I問題8ア類・平21問題9エ類)","q":"取締役会設置会社以外の株式会社においては，書面投票制度または電子投票制度を採用した場合を除いて，株主総会の招集通知の期限を，定款によって株主総会の日の前日とすることができる。","a":true,"c":"299条1項かっこ書。","e":"取締役会設置会社以外の株式会社においては，書面投票制度または電子投票制度を採用した場合を除いて，招集通知の期限として１週間を下回る期間を定款で定めることができる。"},{"l":4,"m":"株主総会","sb":"株主総会の招集通知","i":"A","r":"(令6I問題9ウ)","q":"電子投票制度を採用した株式会社における取締役が株主総会を招集するには，取締役は，株主総会の日の２週間前までに，株主に対してその通知を発しなければならない。","a":true,"c":"299条1項。","e":"株主総会に出席しない株主に株主総会参考書類等だけの情報によって議決権行使をさせる場合においては，十分な考慮期間を設けることが望ましいと考えられるからである。なお，書面投票制度を採用した株式会社も同様である。"},{"l":5,"m":"株主総会","sb":"株主総会の招集通知","i":"A","r":"(令7I問題9イ・令4II問題5エ類・平29II問題9イ)","q":"株主総会の招集通知は，その株主総会において決議をすることができる事項の全部につき議決権を行使することができない株主に対しても，これを送付しなければならない。","a":false,"c":"298条2項かっこ書,299条1項。","e":"株主総会において決議をすることができる事項の全部につき議決権を行使することができない株主は，招集通知の対象とはならない。"},{"l":6,"m":"株主総会","sb":"株主総会の招集通知","i":"A","r":"(令3問題8ウ類)","q":"株式会社が書面投票制度を採用する場合，株主総会の招集通知は，書面または株主の許可を得て電磁的方法でしなければならない。","a":true,"c":"299条2項1号3項。","e":"書面投票による議決権行使を認める旨を定めた場合は，株主総会参考書類および議決権行使書面の交付等（301条，302 条）を行うことになるため，招集通知を書面または電磁的方法で行うこととしても追加的な費用は少ないと考えられるからである。また，電子投票による議決権行使を認める旨を定めた場合も同様である。"},{"l":7,"m":"株主総会","sb":"株主総会の招集通知","i":"A","r":"(平30I問題9ア類・平28II問題9イ類・平24I問題8イ類)","q":"取締役会設置会社が書面投票制度または電子投票制度を採用しない場合は，株主総会の招集通知の方法に制限はなく，口頭や電話によって通知することも認められる。","a":false,"c":"299条2項3項。","e":"株式会社が書面投票制度または電子投票制度を採用しない場合であっても，株式会社が取締役会設置会社である場合は，株主総会の招集通知は，書面または株主の許可を得て電磁的方法によってしなければならない。株式会社が取締役会設置会社である場合には，株主総会に関する基本的な情報については書面または電磁的方法で受領することが株主の利益の保護を図るために重要であると考えられたためである。"},{"l":8,"m":"株主総会","sb":"株主総会の招集通知","i":"A","r":"(平31I問題10イ)","q":"取締役会設置会社以外の株式会社において，株主総会に出席しない株主が書面または電磁的方法によって議決権を行使することができる旨を定めていないときは，当該株主総会の招集の通知を書面または電磁的方法以外の方法ですることができる。","a":true,"c":"299条2項3項。","e":"① 書面投票・電子投票による議決権行使を認めることを定めた場合，および，② 株式会社が取締役会設置会社である場合は，株主に対する招集の通知は，書面または電磁的方法でしなければならないが，①・②に該当しない場合には，口頭や電話等の通知方法でもよい。"},{"l":9,"m":"株主総会","sb":"株主総会の招集通知","i":"A","r":"","q":"株主総会の招集通知を書面または株主の許可を得て電磁的方法でしなければならない場合は，株主総会の招集事項を当該招集通知に記載し，または記録しなければならない。","a":true,"c":"299条4項。","e":""},{"l":10,"m":"株主総会","sb":"株主総会の招集通知","i":"A","r":"(平27II問題6ア)","q":"公開会社（指名委員会等設置会社を除く）における株主が一定の事項を株主総会の会議の目的とすることを株式会社に適法に請求した場合には，当該株式会社の代表取締役は，当該事項を会議の目的として，当該株主総会の招集通知に記載し，または記録しなければならない。","a":true,"c":"299条4項。","e":"公開会社は，取締役会を置かなければならず（327 条１項１号），取締役会設置会社においては，株主総会の招集通知は，書面または電磁的方法でしなければならない（299 条２項３項前段）。ここで，招集通知を書面または電磁的方法でしなければならない株式会社は，招集通知に株主総会の招集事項（298 条１項各号）を記載または記録しなければならない（299条４項）。なお，株主総会の招集権者は条文上「取締役」とされているが（296 条３項），取締役会設置会社の場合には，代表取締役（指名委員会等設置会社では代表執行役）であると解するのが多数説である。そのため，実際の本試験では問題文の通り主語が「代表取締役」とされていたが，監査審査会の公表による解答では「正しい」とされた。"},{"l":11,"m":"株主総会","sb":"株主総会の招集通知","i":"A","r":"(平26II問題10エ)","q":"会計参与設置会社である取締役会設置会社においては，取締役は，定時株主総会の招集の通知に際して，株主に対し，会計参与報告を提供しなければならない。","a":false,"c":"437条。","e":"取締役会設置会社においては，取締役は，定時株主総会の招集の通知に際して，法務省令で定めるところにより，株主に対し，取締役会の承認を受けた計算書類および事業報告（監査役等または会計監査人の監査を受けなければならない場合は，監査報告または会計監査報告を含む）を提供しなければならない。しかし，会計参与報告は，監査報告および会計監査報告と異なり，取締役会設置会社においても定時株主総会の招集の通知に添付されない。"},{"l":12,"m":"株主総会","sb":"株主総会の招集通知","i":"B","r":"(平31I問題9イ)","q":"ある株主に対する招集通知の欠如は，全ての株主に対する関係において取締役の職務上の義務違反を構成する。","a":true,"c":"最判平9年9月9日。","e":""},{"l":13,"m":"株主総会","sb":"株主総会の招集通知","i":"A","r":"(令6I問題9エ類・令2II問題9ア類・平24II問題8イ)","q":"株主総会に出席しない株主が書面によって議決権を行使することができる旨を定めた場合には，株式会社は，株主（株主総会において決議をすることができる事項の全部につき議決権を行使することができない株主を除く）の全員の同意があれば，当該株主総会の招集の手続を省略することができる。","a":false,"c":"300条ただし書。","e":"株主総会の招集手続についての規律は，株主に株主総会への出席の機会と十分な準備期間を与えることを目的としているので，議決権を行使することができる株主の全員が同意しているのならば，招集手続の省略を認めても問題はない。ただし，書面投票制度または電子投票制度を採用している場合は，招集手続を省略することはできない。なぜなら，株主総会参考書類および議決権行使書面の交付等（301条，302条）が必要となるためである。"},{"l":14,"m":"株主総会","sb":"株主総会の招集通知","i":"A","r":"(令6II問題10イ・令4I問題9エ類・平30I問題9イ)","q":"最高裁判所の判例によれば，招集権者による招集の手続を欠く場合で，株主全員が出席して決議をしたときは，株主の一部がその開催に同意していない場合であっても，当該決議は有効に成立する。","a":false,"c":"最判昭60年12月20日。","e":"最高裁判所の判例によれば，招集権者による株主総会の招集の手続を欠く場合であっても，株主全員がその開催に同意して出席した株主総会においてなされた決議は有効に成立するとされる（全員出席総会）。"},{"l":1,"m":"株主総会","sb":"議決権","i":"A","r":"(平22II問題4エ)","q":"公開会社では，１株につき２個の議決権を与える旨を定款で定めることができる。","a":false,"c":"308条1項本文。","e":"各株主は，原則として１株につき１個の議決権を有する。これを１株１議決権の原則という。株式会社では，株主平等原則に基づき，株主の負担する経済的リスク，すなわち出資額に応じた株主総会決議への影響力を保障するために，１株１議決権の原則が採用されている。なお，株主総会における議決権は重要な意義を有するため，１株１議決権の原則は強行法規とされており，定款によって１株につき２個の議決権を与える旨を定めることはできない。"},{"l":2,"m":"株主総会","sb":"議決権","i":"A","r":"(平28II問題10ウ類・平22I問題9ア類)","q":"株式会社は，自己株式については，議決権を有しない。","a":true,"c":"308条2項。","e":"株式会社が自己株式について議決権を有するとなると，会社支配の公正の観点から望ましくないためである。なお，種類株主総会においても同様である（325条）。"},{"l":3,"m":"株主総会","sb":"議決権","i":"A","r":"(令4I問題8エ類・平28II問題10ア類)","q":"種類株式発行会社であるＡ社は，Ｂ社の総株主の議決権の４分の１以上を有しており，Ｂ社は，Ａ社の株主でもある。この場合，Ｂ社は，Ａ社の株主総会において議決権を有しないが，種類株主総会においては議決権を有する。","a":false,"c":"308条1項,325条。","e":"株式の相互保有には，資本の空洞化や議決権行使の歪曲化のおそれがあるため，これを防ぐ趣旨から，相互保有株式については，株主総会および種類株主総会において議決権を有しない。"},{"l":4,"m":"株主総会","sb":"議決権","i":"B","r":"(令2I問題8エ)","q":"退任取締役に対し退職慰労金を支給する旨の株主総会の決議について，当該退任取締役が株主である場合，当該株主は議決権を行使することができる。","a":true,"c":"","e":"会社法は，株主総会の決議について特別利害関係を有する株主であっても，原則として議決権の行使を許容している（例外は自己株式の売主である（140条３項，160条４項，175条２項））。株主は株式会社の実質的所有者であるため，自己の利益を確保するために議決権を行使することが認められているのである。特別利害関係を有する株主とは，株主としての資格と関係のない個人的な利害関係を有する株主のことをいう。例えば，株式会社の取締役でもあり株主でもあるＡの取締役としての報酬等を定める決議について，Ａは特別利害関係を有する株主に該当する。報酬等が不当に高額であれば，株式会社ひいてはＡ以外の株主にとって不利益となるが，Ａにとっては有利になるからである。しかし，このような特別利害関係を有する株主が議決権を行使したことにより著しく不当な決議が行われた場合については，決議取消事由となる（831条１項３号）。"},{"l":1,"m":"株主総会","sb":"議決権の行使","i":"A","r":"(平23I問題8ウ類)","q":"株主は，定款に議決権の代理行使を認める旨の定めがある場合に限って，代理人によりその議決権を行使することができる。","a":false,"c":"310条1項前段。","e":"株式会社においては，株主が広い範囲にわたって散在していると想定されるため，株主が自ら株主総会に出席して議決権を行使することが困難な場合がある。そこで，株主の議決権行使を容易にし，その行使の機会を保障する必要があるため，議決権の代理行使が認められている。したがって，定款の定めがなくても，当然に議決権の代理行使が認められる。"},{"l":2,"m":"株主総会","sb":"議決権の行使","i":"A","r":"(平28II問題10エ・平22I問題10イ類)","q":"株式会社は，定款の定めにより，株主が代理人によってその議決権を行使することを禁ずることができる。","a":false,"c":"","e":"株主に議決権の行使の機会を保障する必要があるため，定款により議決権の代理行使を禁止することは認められない。"},{"l":3,"m":"株主総会","sb":"議決権の行使","i":"A","r":"(令4II問題8ア類・平29I問題9ア類)","q":"株主総会における議決権の代理権の授与は，代理権を授与してから１年間に限ってその効力を有する。","a":false,"c":"310条2項。","e":"代理権の授与は，株主総会ごとにしなければならない。代理権の授与を株主総会ごとにしなければならないのは，株式会社の取締役等が長期間にわたり代理権の授与を受けることによって，会社支配の手段として濫用することを防止するためである。"},{"l":4,"m":"株主総会","sb":"議決権の行使","i":"B","r":"(平29I問題9エ)","q":"株主が代理人によってその議決権を行使する場合においては，当該株主または代理人は，株式会社に対し，代理権を証明する書面を提出し，または，当該株式会社の承諾を得て当該書面に記載すべき事項を電磁的方法により提供しなければならない。","a":true,"c":"310条1項3項。","e":""},{"l":5,"m":"株主総会","sb":"議決権の行使","i":"B","r":"(平24II問題8ウ)","q":"議決権行使の代理権を証明する書面が株式会社に提出されたときは，当該株式会社は，株主総会の日から３か月間，当該書面を本店に備え置かなければならない。","a":true,"c":"310条6項。","e":""},{"l":6,"m":"株主総会","sb":"議決権の行使","i":"A","r":"(令4I問題8イ類・平29I問題9イ類・平23II問題8ウ)","q":"株式会社は，株主総会に出席することができる代理人の数を制限することができる。","a":true,"c":"310条5項。","e":"１人の株主が多数の代理人を株主総会に出席させることで，株主総会の運営が混乱させられるのを防止するためである。"},{"l":7,"m":"株主総会","sb":"議決権の行使","i":"B","r":"(令4I問題9ウ・平29I問題9ウ類)","q":"最高裁判所の判例によれば，議決権を行使する代理人の資格を株主に制限する旨の定款の規定は，株主総会が，株主以外の第三者によって攪乱されることを防止し，会社の利益を保護する趣旨に出たものと認められ，合理的な理由による相当程度の制限ということができるから，有効である。","a":true,"c":"最判昭43年11月1日。","e":"判例によると，議決権の代理行使の規定の趣旨は，代理人資格を制限すべき合理的理由がある場合に，定款規定によって相当程度の制限を加えることまで禁止するものではないとしている。したがって，代理人資格を株主に限定する定款の定めは有効である。"},{"l":8,"m":"株主総会","sb":"議決権の行使","i":"C","r":"(令4II問題8エ類)","q":"最高裁判所の判例によれば，代理人資格を株主に限定する旨を定款に定めた場合において，法人株主が株主ではない使用人に議決権を代理行使させることは当該定款に違反するとしている。","a":false,"c":"最判昭43年11月1日。","e":"判例によると，法人株主（例えば，Ａ会社がＢ会社の株式を所有している場合）が株主ではない当該法人の使用人を代理人とした場合は，代理人資格を株主に限定する定款規定が適用されない。なぜなら，法人の使用人は組織の一員として議決権を行使するため，議決権の代理行使を認めても株主総会のかく乱を防止するという定款規定の趣旨に反しないためである。また，実質的な視点からしても，これを認めないと法人株主の議決権行使が困難となってしまうからである。"},{"l":9,"m":"株主総会","sb":"議決権の行使","i":"A","r":"(令3問題8イ類・平22I問題10ア)","q":"株主数が1,000人未満の会社は，株主総会に出席しない株主に対して，書面によって議決権を行使する機会を与える必要はない。","a":true,"c":"298条2項。","e":"書面投票制度を採用するか否かは，原則として，株式会社が任意に決定することができるが，株主（株主総会において決議することができる事項（取締役会設置会社においては株主総会の目的である事項）の全部につき議決権を行使することができない株主を除く）の数が 1,000 人以上である株式会社は，書面投票制度の採用が強制される（298条２項本文，３項）。このように株主の数が多い株式会社は，株主の分散度が高く，自ら株主総会に出席できない株主が多いことを考慮したものである。ただし，当該株式会社が金融商品取引法２条 16 項に規定する金融商品取引所に上場されている株式を発行している株式会社であって法務省令（会社法施行規則 64 条）で定めるものである場合には，書面投票制度の採用は強制されない。これは，上場会社に対して認められてきた従来の規制を維持したものである。すなわち，上場会社であって，金融商品取引法の委任状勧誘規則に従い議決権を行使することができる株主の全部に対して委任状勧誘をした場合は，株主数が1,000人以上であっても，書面投票制度の採用が強制されないのである。"},{"l":10,"m":"株主総会","sb":"議決権の行使","i":"A","r":"","q":"取締役会設置会社において，株主による株主総会の招集に際して，当該株主総会に出席しない株主が書面によって議決権を行使することができる旨の定めを定める場合は，取締役会の決議によらなければならない。","a":false,"c":"298条1項3号,4項。","e":"株主総会の招集に際して，取締役（取締役会設置会社では取締役会，株主による招集の場合には当該株主）は，書面投票制度を採用するか否かを任意に決定することができる。"},{"l":11,"m":"株主総会","sb":"議決権の行使","i":"C","r":"(平31II問題9エ類)","q":"取締役は，書面投票に関する事項を定めた場合は，株主総会の招集通知に際し，株主に対して株主総会参考書類および議決権行使書面を，必ず書面によって交付しなければならない。","a":false,"c":"301条。","e":"電磁的方法により株主総会の招集通知を発することについて承諾した株主（299 条３項）に対して電磁的方法による招集通知を発するときは，株主総会参考書類および議決権行使書面の交付に代えて，これらの書類に記載すべき事項を電磁的方法により提供することができる（301 条２項本文）。ただし，電磁的方法により株主総会の招集通知を発することについて承諾した株主であっても，株主総会参考書類および議決権行使書面については書類の交付を希望する場合があり得るため，当該株主から請求があったときは，これらの書類を当該株主に交付しなければならない（同条２項ただし書）。"},{"l":12,"m":"株主総会","sb":"議決権の行使","i":"C","r":"(平31II問題9ウ)","q":"各議案についての賛否を記載する欄に記載がない議決権行使書面が株式会社に提出された場合は，当該株式会社は，当該議案について棄権したものと取り扱わなければならず，これと異なる取扱いを定めることはできない。","a":false,"c":"会社法施行規則63条3号ニ,66条1項2号。","e":"各議案についての賛否を記載する欄に記載がない議決権行使書面が株式会社に提出された場合，当該株式会社は，当該議案について賛成，反対または棄権のいずれかの意思の表示があったものとする取扱いの内容を定めることができるため，本肢は誤りである。"},{"l":13,"m":"株主総会","sb":"議決権の行使","i":"B","r":"","q":"書面によって行使した議決権の数は，株主総会に出席した株主の議決権の数に算入してはならない。","a":false,"c":"311条2項。","e":"書面投票により行使した議決権の数は，出席した株主の議決権の数に算入する。すなわち，株主総会の定足数の計算に組み入れられることになる。"},{"l":14,"m":"株主総会","sb":"議決権の行使","i":"B","r":"(平31II問題9ア)","q":"株式会社は，株主総会の日から３か月間，当該株式会社に提出された議決権行使書面をその本店に備え置かなければならない。","a":true,"c":"311条3項。","e":""},{"l":15,"m":"株主総会","sb":"議決権の行使","i":"C","r":"(平23I問題8イ)","q":"株主総会決議事項のすべてについて議決権のない株式の種類株主は，株主総会の議決権行使書面の閲覧または謄写の請求をすることができる。","a":false,"c":"311条4項,310条7項。","e":"株主総会決議事項のすべてについて議決権のない株式の種類株主は，議決権行使書面の閲覧・謄写の請求をすることができない。株主（株主総会決議事項のすべてについて議決権のない株式の種類株主を除く）は，株式会社の営業時間内は，いつでも，議決権行使書面の閲覧または謄写を請求することができる。"},{"l":16,"m":"株主総会","sb":"議決権の行使","i":"B","r":"(令5II問題8エ類・平31II問題9イ)","q":"債権者は，株式会社の営業時間内は，いつでも，議決権行使書面の閲覧または謄写の請求をすることができる。","a":false,"c":"311条4項。","e":"株主（株主総会決議事項のすべてについて議決権のない株式の種類株主を除く）は，株式会社の営業時間内は，いつでも，議決権行使書面の閲覧または謄写を請求することができる。ここで，債権者には当該閲覧謄写請求権は認められていないため，本肢は誤りである。"},{"l":17,"m":"株主総会","sb":"議決権の行使","i":"B","r":"","q":"株式会社は，その本店に備え置いた議決権行使書面の閲覧を請求する株主が，閲覧によって知り得た事実を利益を得て第三者に通報するためその閲覧請求を行ったときであっても，当該請求を拒むことができない。","a":false,"c":"311条5項3号。","e":"株式会社は，株主から議決権行使書面の閲覧または謄写の請求があったときは，法定の拒否事由（311条５項各号）がある場合を除き，これを拒むことができない（同条５項）。ここで，株主が閲覧によって知り得た事実を利益を得て第三者に通報するためその閲覧請求を行ったときは，当該拒否事由に該当するため，当該株主の請求を拒むことができることになる。以下，議決権行使書面(311条５項・312条６項)および代理権行使書面(310条８項) の閲覧・謄写に係る拒否事由である。① 請求者がその権利の確保または行使に関する調査以外の目的で請求を行ったとき② 請求者が当該株式会社の業務の遂行を妨げ，または株主の共同の利益を害する目的で請求を行ったとき③ 請求者が閲覧または謄写によって知り得た事実を利益を得て第三者に通報するため請求を行ったとき④ 請求者が，過去２年以内において，閲覧または謄写によって知り得た事実を利益を得て第三者に通報したことがあるものであるとき"},{"l":18,"m":"株主総会","sb":"議決権の行使","i":"B","r":"(令6II問題9イ)","q":"取締役は，株主の数が1,000人以上である場合には，株主総会に出席しない株主が電磁的方法によって議決権を行使することができる旨を定めなければならない。","a":false,"c":"298条1項4号2項。","e":"電子投票制度は，いかなる場合であっても，その採用が強制されることはない。採用が強制される場合があるのは，書面投票制度である。"},{"l":19,"m":"株主総会","sb":"議決権の行使","i":"C","r":"","q":"取締役は，電子投票に関する事項を定めた場合は，株主総会参考書類に記載すべき事項を電磁的方法により提供しなければならない。","a":false,"c":"302条1項。","e":"取締役は，電子投票制度を採用する場合は，株主総会の招集の通知に際して，法務省令で定めることにより，株主に対し，株主総会参考書類を交付しなければならない（302条１項）。したがって，原則は，書面による交付である。もっとも，電磁的方法により株主総会の招集通知を発することについて承諾した株主（299 条３項）に対して電磁的方法による招集通知を発するときは，株主総会参考書類の交付に代えて，当該株主総会参考書類に記載すべき事項を電磁的方法により提供することができる（302 条２項本文）。ただし，電磁的方法により株主総会の招集通知を発することについて承諾した株主であっても，株主総会参考書類については書類の交付を希望する場合があり得るため，当該株主から請求があったときは，株主総会参考書類を当該株主に交付しなければならない（同条２項ただし書）。"},{"l":20,"m":"株主総会","sb":"議決権の行使","i":"C","r":"","q":"取締役は，電子投票に関する事項を定めた場合は，株主総会の招集通知に際し，すべての株主に対して，議決権行使書面に記載すべき事項を電磁的方法により提供しなければならない。","a":false,"c":"302条3項。","e":"取締役は，電子投票制度を採用する場合は，電磁的方法により株主総会の招集通知を発することについて承諾した株主（299 条３項）に対する電磁的方法による招集通知に際して，法務省令で定めるところにより，株主に対し，議決権行使書面に記載すべき事項を当該電磁的方法により提供しなければならない（302 条３項）。したがって，電磁的方法による招集通知を承諾した株主以外の株主に対しては，原則として，議決権行使書面に記載すべき事項を電磁的方法によって提供する必要はない。ただし，電磁的方法により株主総会の招集通知を発することについて承諾していない株主から，株主総会の日の１週間前までに議決権行使書面に記載すべき事項の電磁的方法による提供の請求があったときは，法務省令で定めるところにより，直ちに，当該株主に対し，当該事項を電磁的方法により提供しなければならない(同条４項)。"},{"l":21,"m":"株主総会","sb":"議決権の行使","i":"B","r":"(平30I問題10ア・平22I問題10エ)","q":"取締役が電磁的方法によって株主総会の招集通知を発することについて承諾した株主のみが，電磁的方法による議決権の行使をすることができる。","a":false,"c":"312条1項。","e":"電磁的方法による議決権の行使が認められる場合，電磁的方法により株主総会の招集通知を発することについて承諾した株主（299 条３項）であるか否かに関係なく，株主は，株式会社の承諾を得たうえで，電磁的方法により議決権を行使することができる。この場合において，株主が電磁的方法により株主総会の招集通知を発することについて承諾した者である場合には，株式会社は，正当な理由がなければ，当該承諾をすることを拒んではならない（312 条２項）。"},{"l":22,"m":"株主総会","sb":"議決権の行使","i":"B","r":"(令3問題8エ)","q":"電磁的方法による議決権の行使は，政令で定めるところにより，株式会社の承諾を得て，法務省令で定める時までに議決権行使書面に記載すべき事項を，電磁的方法により当該株式会社に提供して行う。","a":true,"c":"312条1項。","e":"電子投票は，株式会社の承諾を得て，法務省令（会社法施行規則70 条）で定める時までに議決権行使書面に記載すべき事項を，電磁的方法により当該株式会社に提出して行う。この場合において，株主が電磁的方法により株主総会の招集通知を発することについて承諾した者である場合には，株式会社は，正当な理由がなければ，当該承諾をすることを拒んではならない（312条２項）。"},{"l":23,"m":"株主総会","sb":"議決権の行使","i":"B","r":"","q":"電子投票によって行使した議決権の数は，株主総会に出席した株主の議決権の数に算入してはならない。","a":false,"c":"312条3項。","e":"電子投票により行使した議決権の数は，出席した株主の議決権の数に算入する。すなわち，株主総会の定足数の計算に組み入れられることになる。"},{"l":24,"m":"株主総会","sb":"議決権の行使","i":"B","r":"","q":"株主は，その有する議決権を統一しないで行使することができない。","a":false,"c":"313条1項。","e":"株主は，その有する議決権を統一しないで行使することができる。株主名簿上の株主と実質上の株主が異なる場合であって，さらに実質上の株主が複数存在するような場合は，当該実質上の株主の意向を反映させるために，議決権の不統一行使を認める必要があるためである。"},{"l":25,"m":"株主総会","sb":"議決権の行使","i":"B","r":"(令3問題8ア)","q":"株主は，電磁的方法により，議決権の不統一行使をすることができない。","a":false,"c":"313条1項参照。","e":"株主は，その有する議決権を統一しないで行使することができる。この場合において，行使方法に制限はないことから，電磁的方法によって行使することもできる。"},{"l":26,"m":"株主総会","sb":"議決権の行使","i":"B","r":"","q":"株式会社は，株主が他人のために株式を有する者でないときは，当該株主がその有する議決権を統一しないで行使することを拒むことができる。","a":true,"c":"313条3項。","e":"株主が他人のために株式を有する者でないときは，313 条１項の趣旨に合致しないため議決権の不統一行使を認める必要はないし，不必要な不統一行使は，株式会社の事務処理を煩雑なものとするからである。"},{"l":27,"m":"株主総会","sb":"議決権の行使","i":"A","r":"(令4II問題7エ類・令4I問題8ウ類・平28II問題10イ・平22I問題10ウ)","q":"取締役会設置会社以外の会社では，他人のために株式を有する株主は，事前の通知をしなくても議決権の不統一行使ができる。","a":true,"c":"313条2項参照。","e":"取締役会設置会社においては，議決権を不統一行使しようとする株主は，株主総会の日の３日前までに，取締役会設置会社に対して，議決権の不統一行使をする旨およびその理由を通知しなければならない。取締役会設置会社については，不統一行使を認めるか否かについて事前に判断する機会を与えるためである。これに対して，取締役会非設置会社については，事前の通知は必要とされていない。"},{"l":1,"m":"株主総会","sb":"株主総会参考資料の電子提供制度","i":"A","r":"","q":"公開会社は，取締役が株主総会の招集の手続を行うときは，株主総会参考書類等の内容である情報について，電子提供措置をとる旨を定款で定めなければならない。","a":false,"c":"振替法159条の2第1項。","e":"振替株式を発行する会社（上場会社）は，電子提供措置をとる旨を定款で定めなければならない。すなわち，上場会社は，電子提供措置の利用が義務付けられている。一方で，上場会社以外の株式会社は，取締役が株主総会（種類株主総会を含む）の招集の手続を行うときは，株主総会参考書類等の内容である情報について，電子提供措置をとる旨を定款で定めることができる（325 条の２）と規定されているため，任意で電子提供措置の利用をすることができる。"},{"l":2,"m":"株主総会","sb":"株主総会参考資料の電子提供制度","i":"B","r":"","q":"株主総会参考書類等の内容である情報について，電子提供措置をとる旨を定款で定める場合は，当該定款には電子データを掲載するウェブサイトのアドレスを定めなければならない。","a":false,"c":"325条の2。","e":"電子提供措置をとる旨を定款で定める場合は，当該定款には，電子提供措置をとる旨を定めれば足りる。したがって，電子データを掲載するウェブサイトのアドレス等を定める必要はない。また，当該定款の定めは，登記しなければならない（911条３項12号の２）。"},{"l":3,"m":"株主総会","sb":"株主総会参考資料の電子提供制度","i":"A","r":"(令5II問題9ア類)","q":"株主総会参考書類等の内容である情報について，電子提供措置をとる旨の定款の定めがある取締役会設置会社の取締役は，株主総会の日の３週間前の日または招集通知を発した日のいずれか早い日から株主総会の日後３か月間を経過する日までの間，株主総会の招集事項等の電子提供措置事項に係る情報について継続して電子提供措置をとらなければならない。","a":true,"c":"325条の3第1項。","e":"電子提供措置をとる旨の定款の定めがある株式会社の取締役は，株主総会の招集通知を書面または電磁的方法でしなければならない場合は，株主総会の日の３週間前の日または招集通知を発した日のいずれか早い日（電子提供措置開始日）から株主総会の日から３か月間（電子提供措置期間），次に掲げる事項（電子提供措置事項）に係る情報について継続して電子提供措置をとらなければならない（325条の３第１項）。"},{"l":4,"m":"株主総会","sb":"株主総会参考資料の電子提供制度","i":"A","r":"(令5II問題9イ類)","q":"株主総会の開催にあたり，電子提供措置事項に係る情報について継続して電子提供措置をとらなければならない株式会社であっても，株主に対し議決権行使書面を交付するときは，電子提供措置事項に係る情報のすべてにおいて，電子提供措置をとることを要しない。","a":false,"c":"325条の3第2項。","e":"取締役が招集通知に際して株主に対し議決権行使書面を交付するときは，議決権行使書面に記載すべき事項に係る情報については，電子提供措置をとることを要しない（325条の３第２項）。書面と電子提供措置の双方で，同じ情報を提供する必要はないためである。しかし，議決権行使書面に記載すべき事項に係る情報以外については，電子提供措置をとる必要があるため，本肢は誤りである。"},{"l":5,"m":"株主総会","sb":"株主総会参考資料の電子提供制度","i":"A","r":"","q":"金融商品取引法第 24 条１項の規定によりその発行する株式について有価証券報告書を内閣総理大臣に提出しなければならない会社が，定時株主総会に関し，電子提供措置開始日までに，電子提供措置事項（議決権行使書面に記載すべき事項を除く。）を記載した有価証券報告書をEDINETを使用して提出している場合には，当該電子提供措置事項について電子提供措置をとることを要さない。","a":true,"c":"325条の3第3項。","e":"この場合は，EDINETを通じてインターネット上において，電子提供措置事項が広く公衆に開示されるため，重ねて電子提供措置をとる必要性が乏しいためである。"},{"l":6,"m":"株主総会","sb":"株主総会参考資料の電子提供制度","i":"A","r":"(令5II問題9ウ類)","q":"公開会社でない株式会社が，株主総会の開催にあたり，電子提供措置事項に係る情報について継続して電子提供措置をとらなければならない場合は，当該株主総会の日の２週間前までに，株主に対して招集通知を発しなければならない。","a":true,"c":"325条の4第1項。","e":"電子提供措置をとらなければいけない場合は，公開会社であるか否かにかかわらず，株主総会の日の２週間前までに，株主に対して招集通知を発しなければならない。"},{"l":7,"m":"株主総会","sb":"株主総会参考資料の電子提供制度","i":"A","r":"","q":"取締役会設置会社が，株主総会の開催にあたり，電子提供措置事項に係る情報について継続して電子提供措置をとらなければならない場合は，株主総会の招集通知に際して，株主に対し，計算書類および事業報告を交付することを要しない。","a":true,"c":"325条の4第3項。","e":"そもそも，電子提供制度は，招集通知に際して，株主総会参考書類等（株主総会参考書類・議決権行使書面・計算書類・事業報告・連結計算書類）の交付・提供を要しないものとする制度であるためである。"},{"l":8,"m":"株主総会","sb":"株主総会参考資料の電子提供制度","i":"A","r":"(令5II問題9エ類)","q":"電子提供措置をとる旨の定款の定めがある株式会社の株主（基準日を定めた場合には，当該基準日までに請求した者に限る）は，総株主の議決権の100分の1以上の議決権を保有する場合に限り，株式会社に対し，電子提供措置事項を記載した書面の交付を請求することができる。","a":false,"c":"325条の5第1項。","e":"電子提供措置をとる旨の定款の定めがある株式会社の株主（基準日を定めた場合には，当該基準日までに請求した者に限る）は，株式会社に対し，電子提供措置事項を記載した書面の交付を請求することができる（325 条の５第１項）。すなわち，株主の書面交付請求権は単独株主権である。取締役は，当該請求をした株主に対しては，株主総会の招集通知とともに，電子提供措置事項を記載した書面を交付しなければならない（同条２項）。"},{"l":9,"m":"株主総会","sb":"株主総会参考資料の電子提供制度","i":"B","r":"(令6II問題9エ類)","q":"電子提供措置をとる旨の定款の定めがある株式会社の株主が，株式会社に対して行う電子提供措置事項を記載した書面の交付請求は，株主総会ごとにしなければならない。","a":false,"c":"325条の5第4項5項。","e":"書面交付請求をした株主がある場合において，その書面交付請求の日（当該株主が異議を述べた場合にあっては，当該異議を述べた日）から１年を経過したときは，株式会社は，当該株主に対し，書面の交付を終了する旨を通知し，かつ，これに異議のある場合には催告期間（１か月を下ることはできない）内に異議を述べるべき旨を催告することができる。そして，株主がした書面交付請求は，催告期間内に異議を述べなかった場合は，催告期間を経過したときにその効力を失う。すなわち，株主により一度された書面交付請求は，その後のすべての株主総会および種類株主総会について効力を有することとなる。しかし，過去に書面交付請求をした株主が，書面の交付を必要としなくなった場合であっても，書面交付請求を撤回しないおそれがあり，そのような株主が累積すると，会社の事務処理の負担が過大になる可能性があるためである。"},{"l":1,"m":"株主総会","sb":"株主総会の議事運営","i":"A","r":"(令5I問題8エ・平30II問題10ア・平26II問題7ア)","q":"株式会社は，株主総会の議長を定款で定めなければならない。","a":false,"c":"","e":"株主総会の議長を定款で定めることは求められていない。"},{"l":2,"m":"株主総会","sb":"株主総会の議事運営","i":"B","r":"(令4II問題9ア・平30I問題10ウ・平23II問題8エ)","q":"株主総会の議長は，その命令に従わない者その他当該株主総会の秩序を乱す者を退場させることができる。","a":true,"c":"315条2項。","e":"株主総会の議長は，当該株主総会の秩序を維持し，議事を整理する権限を有し（315 条１項），その命令に従わない者その他当該株主総会の秩序を乱す者を退場させることができる（同条２項）。"},{"l":3,"m":"株主総会","sb":"株主総会の議事運営","i":"A","r":"(令6II問題9ア類・令3問題7イ類・平30I問題10イ)","q":"取締役，会計参与，監査役および執行役は，株主総会において株主から特定の事項について説明を求められた場合に，その事項が株主総会の目的である事項に関しないものであることを理由として，説明を拒否することはできない。","a":false,"c":"314条ただし書。","e":"取締役，会計参与，監査役および執行役は，株主総会において，株主から特定の事項について説明が求められた場合には，当該事項について必要な説明をしなければならない（314 条本文）。株主総会において，株主が質問権を有することは当然であるが，それを取締役等の説明義務を明文化することにより保障し，もって株主総会の活性化を図ることが当該規定の趣旨である。ただし，① 株主から説明を求められた事項が，株主総会の目的である事項に関しないものである場合，② その説明をすることにより株主の共同の利益を著しく害する場合，③ その他正当な理由がある場合として法務省令（会社法施行規則71条）で定める場合には，取締役等は説明を拒むことができる（314条ただし書）。"},{"l":4,"m":"株主総会","sb":"株主総会の議事運営","i":"A","r":"(平28II問題8ア)","q":"取締役は，株主総会において株主から説明を求められた場合には，株主が当該株主総会において実質的に同一の事項について繰り返して説明を求めていることを理由に，説明を拒否することはできない。","a":false,"c":"314条ただし書,会社法施行規則71条3号。","e":"上記問題３の解説参照。会社法施行規則71条において，以下の事項を正当な理由がある場合と定めている。(１) 株主が説明を求めた事項について説明をするために調査をすることが必要である場合（次に掲げる場合を除く）① 当該株主が株主総会の日より相当の期間前に当該事項を株式会社に対して通知した場合② 当該事項について説明をするために必要な調査が著しく容易である場合(２) 株主が説明を求めた事項について説明をすることにより株式会社その他の者（当該株主を除く）の権利を侵害することとなる場合(３) 株主が当該株主総会において実質的に同一の事項について繰り返して説明を求める場合(４) (１)～(３)のほか，株主が説明を求めた事項について説明しないことにつき正当な理由がある場合"},{"l":5,"m":"株主総会","sb":"株主総会の議事運営","i":"B","r":"","q":"取締役は，株主総会において株主から特定の事項について説明を求められた場合であっても，当該株主が説明を求めた事項について説明をするために調査をすることが必要である場合は，当該株主が当該株主総会の日より相当の期間前に当該事項を株式会社に対して通知していたとしても，当該事項について必要な説明を拒むことができる。","a":false,"c":"314条ただし書,会社法施行規則71条1号。","e":"説明を拒むことができる正当な理由がある場合として，会社法施行規則 71 条１号においては，株主が説明を求めた事項について説明をするために調査をすることが必要である場合が定められているが，このような場合であっても，① 当該株主が株主総会の日より相当の期間前に当該事項を株式会社に対して通知した場合，または，② 当該事項について説明をするために必要な調査が著しく容易である場合は説明を拒むことができない。"},{"l":6,"m":"株主総会","sb":"株主総会の議事運営","i":"A","r":"(令5I問題8イ類・平28I問題8ア)","q":"株主が，株主総会の目的である事項に関し，取締役に対する質問事項を事前に会社に通知した場合で，当該株主総会において当該事項に係る質問が行われないときは，当該事項について取締役に説明義務は生じない。","a":true,"c":"314条本文。","e":"取締役，会計参与，監査役および執行役は，株主総会において，株主から特定の事項について説明を求められた場合には，当該事項について必要な説明をしなければならない。なお，当該説明義務は，株主総会において株主から特定の事項について説明を求められた場合に初めて生じるものであるため，本問は正しい。"},{"l":7,"m":"株主総会","sb":"株主総会の議事運営","i":"A","r":"(平28I問題8イ類・平23I問題8ア・平21問題14ウ・平20問題10ア)","q":"株式会社は，株主総会に係る招集の手続および決議の方法を調査させるため，当該株主総会に先立ち，裁判所に対し，検査役の選任の申立てをすることができる。","a":true,"c":"306条1項。","e":"株主総会の手続が適法になされたという証拠を保全することで，事後的な紛争に備えることができるようにするという観点から，総会検査役の選任請求権は，株式会社にも認められている。"},{"l":8,"m":"株主総会","sb":"株主総会の議事運営","i":"A","r":"(令5I問題8ア類)","q":"公開会社において，６か月前から継続して株式を有するすべての株主は，裁判所に対して総会検査役の選任の申立てをすることができる。","a":false,"c":"306条1項2項。","e":"総会検査役の選任請求権は少数株主権である。総株主の議決権の100分の１（定款で緩和可）以上の議決権を６か月（定款で短縮可）前から継続して保有する株主は，裁判所に対し，総会検査役の選任の申立てをすることができる。なお，非公開会社である場合は，６か月の保有期間要件は不要である。"},{"l":9,"m":"株主総会","sb":"株主総会の議事運営","i":"C","r":"(平20問題10イ)","q":"株主総会の決議事項の全部につき議決権を行使することができない株主は，裁判所に対して，総会検査役の選任の申立てをすることができない。","a":true,"c":"306条1項2項。","e":"総会検査役の選任の申立てをすることができる少数株主の要件にある「総株主」から，取締役会設置会社の場合は，株主総会の目的である事項の全部につき議決権を行使することができない株主が除かれ，取締役会非設置会社の場合は，株主総会において決議をすることができる事項の全部につき議決権を行使することができない株主が除かれる。"},{"l":10,"m":"株主総会","sb":"株主総会の議事運営","i":"C","r":"(令2I問題8イ)","q":"法定の要件を満たす株主の申立てに基づき，株主総会に係る招集の手続および決議の方法を調査させるための検査役が裁判所により選任された場合に，当該検査役は，必要な調査を行い，当該調査の結果を記載した書面を当該株主に提供して，報告をしなければならない。","a":false,"c":"306条5項。","e":"総会検査役は，必要な調査を行い，当該調査の結果を記載し，または記録した書面または電磁的記録を裁判所に提供して報告をしなければならない。"},{"l":11,"m":"株主総会","sb":"株主総会の議事運営","i":"C","r":"(平20問題10ウ類)","q":"裁判所は，総会検査役の報告があった場合において，必要があると認められるときは，取締役に対して，一定の期間内に株主総会を招集すること，または，総会検査役の調査の結果を株主に通知することのいずれかを命じなければならない。","a":false,"c":"307条1項。","e":"裁判所は，総会検査役の報告があった場合において，必要があると認められるときは，取締役に対して，一定の期間内に株主総会を招集すること，総会検査役の調査の結果を株主に通知することの全部または一部を命じなければならない。また，裁判所が一定の期間内に株主総会を招集することを命じた場合には，取締役は，総会検査役の報告の内容を当該株主総会において開示しなければならない（307 条２項）。そして，取締役（監査役設置会社にあっては取締役および監査役）は，総会検査役の報告内容を調査し，その結果を当該株主総会に報告しなければならない（307 条３項）。"},{"l":12,"m":"株主総会","sb":"株主総会の議事運営","i":"A","r":"(平23I問題8エ・平20問題10エ類)","q":"株主総会においては，その決議によって，取締役，会計参与，監査役，監査役会および会計監査人が当該株主総会に提出し，または提供した資料を調査する者を選任することができる。","a":true,"c":"316条1項。","e":""},{"l":13,"m":"株主総会","sb":"株主総会の議事運営","i":"A","r":"(令4II問題9イ・令2II問題9ウ類・平28II問題8イ)","q":"裁判所の許可を得て株主により招集された株主総会においては，その決議によって，株式会社の業務および財産の状況を調査する者を選任することができる。","a":true,"c":"316条2項。","e":"少数株主の請求（297 条）により招集された株主総会においては，その決議によって，株式会社の業務および財産の状況を調査する者を選任することができる（316条２項）。なお，少数株主の請求により招集された株主総会には，少数株主の請求により取締役が招集した株主総会（297 条１項）と，少数株主が裁判所の許可を得て自ら招集した株主総会（297条４項）との両者が含まれる。"},{"l":14,"m":"株主総会","sb":"株主総会の議事運営","i":"B","r":"","q":"株主総会の議事については，議事録を作成し，取締役は当該議事録に署名しなければならない。","a":false,"c":"","e":"株主総会の議事録には，取締役の署名義務は課されていない。"},{"l":15,"m":"株主総会","sb":"株主総会の議事運営","i":"A","r":"(平28II問題8ウ)","q":"株式会社は，株主総会の日から10年間，当該株主総会の議事録をその本店に備え置かなければならない。","a":true,"c":"318条2項。","e":"株式会社は，株主総会の日から10年間，議事録をその本店に備え置かなければならない。また，株式会社は，株主総会の日から５年間，当該株主総会の議事録の写しをその支店に備え置かなければならない（318 条３項本文）。ただし，当該議事録が電磁的記録をもって作成されている場合であって，支店における株主等の閲覧謄写請求に応じることを可能にするための措置として法務省令で定めるものをとっているときは，当該備置義務は免除される（318 条３項ただし書）。"},{"l":16,"m":"株主総会","sb":"株主総会の議事運営","i":"A","r":"","q":"債権者は，株主総会の議事録を閲覧することができない。","a":false,"c":"318条4項。","e":"株主および債権者は，株式会社の営業時間内は，いつでも，株主総会の議事録の閲覧謄写請求をすることができる。また，株式会社の親会社社員も，その権利を行使するため必要があるときは，裁判所の許可を得て，当該議事録の閲覧謄写請求をすることができる（318条５項）。"},{"l":17,"m":"株主総会","sb":"株主総会の議事運営","i":"A","r":"(令4II問題9エ類・平31II問題10イ)","q":"株式会社の親会社社員は，株式会社の営業時間内はいつでも，株主総会の議事録の閲覧または謄写の請求をすることができる。","a":false,"c":"318条5項。","e":"株式会社の親会社社員は，その権利を行使するため必要があるときは，裁判所の許可を得て，当該議事録の閲覧謄写請求をすることができる。"},{"l":18,"m":"株主総会","sb":"株主総会の議事運営","i":"A","r":"(平28II問題8エ類・平26II問題7イ)","q":"株式会社の子会社の株主は，その権利を行使するため必要があるときは，裁判所の許可を得て，当該株式会社の株主総会の議事録の閲覧または謄写の請求をすることができる。","a":false,"c":"318条5項参照。","e":"株式会社の子会社の株主には，当該株式会社の株主総会の議事録の閲覧謄写請求権は与えられていない。これに対して，株式会社の親会社社員は，その権利を行使するために必要があるときは，裁判所の許可を得て，当該議事録の閲覧または謄写を請求することができる（318条５項）。"},{"l":19,"m":"株主総会","sb":"株主総会の議事運営","i":"A","r":"(令4II問題9ウ類・平29II問題9エ・平26I問題7エ・平21問題9イ)","q":"株主総会の延期または続行について決議があった場合には，取締役は，延期または続行される株主総会について，株主に対してその招集の通知を発しなければならない。","a":false,"c":"317条。","e":"延期とは，株主総会の議事に入らずに，株主総会の日を後日に変更することをいう。続行とは，株主総会の議事に入ったものの議事が終わらずに，後日に再開し継続することをいう。株主総会においては，その延期または続行について決議することができる。当該決議があった場合は，株主総会の招集の決定（298 条）および株主総会の招集通知（299条）の規定は適用されない。"},{"l":1,"m":"株主総会","sb":"利益供与の禁止","i":"A","r":"(令6II問題7ウ類)","q":"株式会社は，何人に対しても，株主の権利の行使に関し，当該株式会社またはその子会社の計算において財産上の利益の供与をしてはならない。","a":true,"c":"120条1項。","e":"利益供与の禁止の趣旨は，会社財産の浪費を防止することにある。また，株式会社が金品等を総会屋に供与するのを禁止することで，総会屋を排除し，会社運営の健全化を図ることができるのである。利益供与の相手方は，株主に対するものに限定されず，株主以外の者に対する利益供与も禁止の対象となる。また，子会社の計算においてするものも禁止の対象としているのは，親会社の取締役が子会社の取締役と通謀して，子会社の計算で利益供与をすることも考えられるためであり，これにより，総会屋排除の趣旨を貫徹しようとするものである。"},{"l":2,"m":"株主総会","sb":"利益供与の禁止","i":"A","r":"(令6II問題7イ類・令3問題5ア類・平31I問題5ア類・平23I問題4エ・平21問題5ウ類)","q":"株式会社が特定の株主に対して無償で財産上の利益を供与したときは，当該株式会社は，株主の権利の行使に関し，財産上の利益の供与をしたものとみなす。","a":false,"c":"120条2項前段。","e":"株式会社が特定の株主に対して無償で財産上の利益の供与をしたときは，当該株式会社は，株主の権利の行使に関し，財産上の利益の供与をしたものと推定する。例えば，総会屋に対して無償で金品を供与した場合には，当該推定規定が働く。"},{"l":3,"m":"株主総会","sb":"利益供与の禁止","i":"A","r":"(平26II問題5ア類)","q":"株式会社が特定の株主に対して有償で財産上の利益の供与をした場合，当該株式会社は，株主の権利行使に関して財産上の利益の供与をしたものと推定されることはない。","a":false,"c":"120条2項後段。","e":"株式会社が特定の株主に対して有償で財産上の利益の供与をした場合において，当該株式会社またはその子会社の受けた利益が当該財産上の利益に比べて著しく少ないときは，当該株式会社は，株主の権利の行使に関し，財産上の利益の供与をしたものと推定する。例えば，総会屋の発行する情報誌に広告を掲載して広告料を支払った場合において，当該情報誌の読者が極めて限られているにもかかわらず，全国紙並みの広告料を支払った場合は，当該推定規定が働く。"},{"l":4,"m":"株主総会","sb":"利益供与の禁止","i":"A","r":"(平30I問題5エ類・平27II問題4イ・平26II問題5イ)","q":"株式会社が株主の権利の行使に関する財産上の利益の供与を当該株式会社の子会社の計算においてしたときは，当該利益の供与を受けた者は，これを当該株式会社に返還しなければならない。","a":false,"c":"120条3項。","e":"株式会社は，何人に対しても，株主の権利の行使に関し，当該株式会社またはその子会社の計算において，財産上の利益の供与をしてはならない（120 条１項）。株式会社が利益供与の禁止規定に違反して財産上の利益の供与をしたときは，当該利益の供与を受けた者は，これを当該株式会社またはその子会社に返還しなければならない（120 条３項）。本問では，子会社の計算において，利益の供与がなされているため，株式会社ではなくその子会社に対して返還がなされる。なお，株式会社が利益供与を受けた者に対して利益の返還を請求することは通常期待できないため，利益供与を受けた者への利益返還請求について，責任追及等の訴えの対象とされている（847条１項）。"},{"l":5,"m":"株主総会","sb":"利益供与の禁止","i":"A","r":"","q":"株式会社が利益供与の規定に違反して財産上の利益の供与をしたときは，当該利益の供与を受けた者は，これを当該株式会社またはその子会社に返還しなければならないが，当該利益の供与を受けた者が，禁止された利益供与であることに善意である場合は，当該返還義務を負わない。","a":false,"c":"120条3項前段。","e":"当該返還義務は，当該利益の供与を受けた者が善意の場合であっても，免除されることはない。なお，当該利益の供与を受けた者は，当該株式会社またはその子会社に対して当該利益と引換えに給付したものがあるときは，その返還を受けることができる（120条３項後段）。"},{"l":6,"m":"株主総会","sb":"利益供与の禁止","i":"A","r":"(令6II問題7エ・平31I問題5イ・平21問題5イ)","q":"株式会社の株主は，当該株式会社から株主の権利の行使に関して財産上の利益の供与を受けた者に対し，当該株式会社のために，供与された財産上の利益の返還を求める訴えを提起することができない。","a":false,"c":"847条1項3項。","e":"株式会社が利益供与を受けた者に対して利益の返還を請求することは通常期待できないため，利益供与を受けた者への利益返還請求は，責任追及等の訴えの対象とされている。"},{"l":7,"m":"株主総会","sb":"利益供与の禁止","i":"A","r":"","q":"株式会社が利益供与の規定に違反して財産上の利益の供与をしたときは，当該利益の供与をすることに関与した取締役（利益を供与した取締役を除く）は，当該株式会社に対して，連帯して，供与した利益の価額に相当する額を支払う義務を負い，その者がその職務を行うについて注意を怠らなかったことを証明した場合であっても，当該義務を免れることができない。","a":false,"c":"120条4項。","e":"利益の供与をすることに関与した取締役として法務省令で定める者（利益を供与した取締役を除く） は，株式会社に対して，連帯して，供与した利益の価額に相当する額を支払う義務を負う。ただし，その者がその職務を行うについて注意を怠らなかったことを証明した場合は，責任を負わない。すなわち，当該責任は立証責任が転換されている過失責任である。これに対して，利益の供与をした取締役は，無過失責任である（120 条４項ただし書かっこ書）。無過失責任とされている理由は，反社会的な利益供与を排除するために，政策的にその注意義務を加重する必要があったためである。"},{"l":8,"m":"株主総会","sb":"利益供与の禁止","i":"A","r":"(平26II問題5ウ・平21問題5ア類)","q":"株式会社が株主の権利の行使に関する財産上の利益の供与をした場合において，当該利益の供与をした取締役は，その職務を行うについて注意を怠らなかったことを証明したときは，当該株式会社に対して供与した利益の価額に相当する額を支払う義務を負わない。","a":false,"c":"120条4項ただし書かっこ書。","e":"上記問題７の解説参照。"},{"l":9,"m":"株主総会","sb":"利益供与の禁止","i":"B","r":"(平31I問題5ウ)","q":"株式会社が，株主の権利の行使に関し，その子会社の計算において，財産上の利益の供与をしたときは，当該利益の供与をすることに関与した取締役は，その職務を行うについて注意を怠らなかったことを証明しない限り，当該子会社に対して，連帯して，供与した利益の価額に相当する額を支払う義務を負う。","a":false,"c":"120条4項。","e":"株式会社が利益供与の禁止規定に違反して財産上の利益の供与をしたときは，当該利益供与をすることに関与した取締役（指名委員会等設置会社では執行役を含む）として法務省令で定める者は，当該株式会社に対して，連帯して，供与した利益の価額に相当する額を支払う義務を負う。すなわち，当該支払義務は，利益の供与を行った株式会社に対して生じるものであり，子会社に対して，その義務が生じるわけではない。したがって，Ａ社が子会社であるＢ社の計算で利益供与をした場合，Ａ社の取締役はＡ社に対して利益相当額の支払責任を負うことになるが，子会社であるＢ社に対して利益相当額の支払責任を負うことはない。また，Ｂ社の取締役が利益相当額の支払責任を負うこともない。"},{"l":10,"m":"株主総会","sb":"利益供与の禁止","i":"A","r":"(平31I問題5エ・平26II問題5エ・平21問題5エ)","q":"株主の権利の行使に関してなされた株式会社による財産上の利益の供与に関与した取締役が，供与した利益の価額に相当する額を当該株式会社に対して支払う義務は，総株主の同意がなければ，免除することができない。","a":true,"c":"120条5項。","e":""},{"l":11,"m":"株主総会","sb":"利益供与の禁止","i":"B","r":"(令6II問題7ア)","q":"最高裁判所の判例によれば，株式会社から見て好ましくない株主が議決権を行使することを回避する目的で，当該株式会社が，自己の計算において，第三者に対して当該株主から株式を譲り受けるための対価を供与した場合には，株主の権利の行使に関する利益の供与に該当する。","a":true,"c":"最判平18年4月10日。","e":"最高裁判所の判例によれば，株式譲渡それ自体は株主の権利の行使とはいえないとしながら，株式会社から見て好ましくないと判断される株主が議決権等の株主の権利を行使することを回避する目的で，当該株主から株式を譲り受けるための対価を何人かに供与する行為は，株主の権利の行使に関し利益を供与する行為であるとしている。"},{"l":1,"m":"株主総会","sb":"株主総会の決議","i":"B","r":"(令4I問題9イ・平31I問題9エ)","q":"株主総会決議は，定款に別段の定めがない限り，議案に対する賛成の議決権数が決議の成立に必要な数に達したことを明白にするため，挙手，起立，投票等の採決の手続を採らなければならない。","a":false,"c":"東京地判平14年2月21日。","e":"決議の方法については，定款に別段の定めがない限り，議案の賛否について判定できる方法であれば，いかなる方法によるかは総会の円滑な運営の職責を有する議長の合理的裁量に委ねられているとしている。"},{"l":2,"m":"株主総会","sb":"株主総会の決議","i":"A","r":"(令4II問題7ウ類・平31I問題10エ類・平24I問題8ウ)","q":"取締役会設置会社以外の株式会社において，株主総会は，招集通知に記載された株主総会の目的である事項以外の事項についても決議をすることができる。","a":true,"c":"309条5項本文の反対解釈。","e":"309 条５項本文の反対解釈として，取締役会非設置会社では，招集通知に記載された株主総会の目的である事項以外の事項についても決議をすることができる。すなわち，株主総会を万能の意思決定機関としているのである。"},{"l":3,"m":"株主総会","sb":"株主総会の決議","i":"B","r":"(令7I問題9エ類)","q":"取締役会設置会社において，招集事項の決定で定められた株主総会の目的である事項以外の事項についても決議することができる場合がある。","a":true,"c":"309条5項。","e":"取締役会設置会社においては，株主総会は，招集事項として定めた株主総会の目的である事項（議題）以外の事項については，決議することができない（309 条５項本文）。株式会社は所有と経営が制度的に分離されているため，株主に対し，事前に議題についての十分な検討の機会を与える必要があるからである。ただし，例外として，株主総会に提出された資料を調査する者の選任（316 条１項），株式会社の業務および財産の状況を調査する者の選任（同条２項）または定時株主総会において会計監査人の出席を求めること（398 条２項）は，事前に議題とされていなくても決議することができる（309 条５項ただし書）。これらの事項は，株式会社から事前に議題として設定される可能性が考えられず，他方で株主総会の議事の中で緊急に必要となることが想定される事項だからである。"},{"l":4,"m":"株主総会","sb":"株主総会の決議","i":"B","r":"(令6問題10エ)","q":"公開会社である会計監査人設置会社の株主総会は，株主総会の目的である事項として会計監査人により株主総会に提出された資料を調査する者の選任を定めていない場合には，当該調査をする者を選任することができない。","a":false,"c":"309条5項ただし書。","e":"取締役会設置会社における株主総会は，招集にあたり定められた議題以外の事項について決議することができないとされているが（309条５項本文），例外として，株主総会に提出された資料を調査する者の選任（316条１項），株式会社の業務および財産の状況を調査する者の選任（同条２項）または定時株主総会において会計監査人の出席を求めること（398条２項）は，事前に議題とされていなくても決議することができる。"},{"l":5,"m":"株主総会","sb":"株主総会の決議","i":"A","r":"","q":"株主総会の普通決議は，議決権を行使することができる株主の議決権の過半数を有する株主が出席し，出席した当該株主の議決権の過半数をもって行うが，定款によって，定足数を完全に排除することが認められる（役員の選任・解任の決議および公開会社における支配株主の異動をもたらす募集株式の発行等の決議を除く）。","a":true,"c":"309条1項。","e":"株主総会の普通決議は，定款によって別段の定めを設けることができる。すなわち，定款によって定足数を加重することもできれば，完全に排除することも認められる。これに対して，決議要件については，加重のみが認められ，緩和することは認められないと解される。すなわち，決議要件を出席した当該株主の議決権の半数以下とすることは許されないと解される。"},{"l":6,"m":"株主総会","sb":"株主総会の決議","i":"A","r":"(平20問題9イ)","q":"取締役を選任または解任する株主総会決議の定足数については，定款の定めによっても，議決権を行使することができる株主の議決権の３分の１未満に引き下げることはできない。","a":true,"c":"341条。","e":"役員（取締役，会計参与および監査役）を選任または解任する株主総会の決議は，定款の定めによっても，定足数について議決権を行使することができる株主の議決権の３分の１未満に引き下げることができない。また，決議要件については引上げしかできない旨を明文で規定している（役員の選解任決議の特則）。また，公開会社における支配株主の異動を伴う募集株式の発行等や募集新株予約権の発行において，株主からの反対通知があったことにより特定引受人に対する割当て等の承認をする場合の決議についても同様の要件とされている。"},{"l":7,"m":"株主総会","sb":"株主総会の決議","i":"C","r":"(令2I問題8ア)","q":"株式会社は，定款で定めることにより，株主総会の普通決議の要件を，出席した株主の議決権の過半数より引き下げることができる。","a":false,"c":"309条1項。","e":"株主総会の普通決議について，定款の定めによっても，決議要件を出席した株主の議決権の過半数より引き下げることは許されないと解される。これは，会社の意思を決定するという株主総会の決議の性質から当然のことであって，仮に出席株主の議決権の半数以下でも足りるとすると，内容が相反する複数の決議が成立しかねないからである。"},{"l":8,"m":"株主総会","sb":"株主総会の決議","i":"A","r":"(平30II問題10イ類・平28I問題8ウ類)","q":"株主総会の特別決議は，当該株主総会において議決権を行使することができる株主の議決権の過半数を有する株主が出席し，出席した当該株主の議決権の３分の２以上に当たる多数をもって行うが，定款によって，決議要件を出席した株主の議決権の過半数とすることが認められる。","a":false,"c":"309条2項。","e":"株主総会の特別決議は，定足数については加重することもできれば，緩和することが認められるが（ただし，３分の１未満にすることはできない），決議要件については，加重のみが認められ，緩和することは認められていない。"},{"l":9,"m":"株主総会","sb":"株主総会の決議","i":"A","r":"(令6II問題10ア類・令6I問題10ウ類)","q":"株主総会の特別決議における定足数は，定款の定めによっても，当該株主総会において議決権を行使することができる株主の議決権の３分の１未満の割合とすることができない。","a":true,"c":"309条2項。","e":"株主総会の特別決議は，定足数の要件の緩和をすることが認められるが，３分の１未満にすることはできない。"},{"l":10,"m":"株主総会","sb":"株主総会の決議","i":"A","r":"","q":"株主総会の特別決議は，当該株主総会において議決権を行使することができる株主の議決権の過半数を有する株主が出席し，出席した当該株主の議決権の３分の２以上に当たる多数をもって行うが，定款によって，当該決議要件に加えて，一定の数以上の株主の賛成を要する旨その他の要件を定めることが認められる。","a":true,"c":"309条2項柱書後段。","e":"すなわち，定款により頭数要件を加えるなど，会社法によって定められた要件を加重することが認められている。"},{"l":11,"m":"株主総会","sb":"株主総会の決議","i":"A","r":"(令6II問題10エ類・平30I問題9エ類・平20問題9ウ)","q":"発行する全部の株式を譲渡制限株式とする旨の定款の定めを設ける定款の変更を行う株主総会（種類株式発行会社の株主総会を除く）は，当該株主総会において議決権を行使することができる株主の議決権の過半数を有する株主が出席し，出席した当該株主の議決権の３分の２以上に当たる多数をもって行う。","a":false,"c":"107条2項1号,309条3項1号。","e":"発行する全部の株式を譲渡制限株式とする旨の定款の定めを設ける定款の変更を行う株主総会（種類株式発行会社の株主総会を除く）は，309 条３項の特殊決議によって行わなければならない。すなわち，当該株主総会において議決権を行使することができる株主の半数以上（定款で加重可，頭数要件）であって，かつ，議決権を行使することができる株主の議決権の３分の２（定款で加重可）以上に当たる多数をもって行わなければならない。"},{"l":12,"m":"株主総会","sb":"株主総会の決議","i":"A","r":"","q":"公開会社でない株式会社が，剰余金の配当を受ける権利，残余財産の分配を受ける権利，株主総会における議決権に関する事項について，株主ごとに異なる取扱いを行う旨を定款で定める定款変更の株主総会の決議は，当該株主総会において議決権を行使することができる株主の半数以上であって，当該株主の議決権の３分の２以上に当たる多数をもって行う。","a":false,"c":"109条2項,309条4項。","e":"非公開会社が，剰余金の配当を受ける権利，残余財産の分配を受ける権利，株主総会における議決権について，株主ごとに異なる取扱いを行う旨を定款で定めるための定款変更の株主総会の決議は，総株主の半数以上（定款で加重可）であって，総株主の議決権の４分の３（定款で加重可）以上に当たる多数をもって行わなければならない。当該定款変更は，株主の基本的な権利について株主ごとに異なる取扱いをする旨の定款の定めを新設するものであり，株主平等原則の例外であることから，株主にとって大変重大な影響を及ぼす。そのため，309 条３項の特殊決議よりもさらに厳重な要件が課せられている。"},{"l":1,"m":"株主総会","sb":"株主総会の決議・報告の省略","i":"A","r":"(令6I問題9イ・平30I問題10エ・平26II問題7ウ・平21問題9ア)","q":"取締役または株主が株主総会の目的である事項について提案をした場合において，当該提案につき株主（当該事項について議決権を行使することができるものに限る。）の全員が書面または電磁的記録により同意の意思表示をしたときは，当該提案を可決する旨の株主総会の決議があったものとみなされる。","a":true,"c":"319条1項。","e":"議決権を行使することができる株主の全員の意見が一致しているような場合には，あえて株主総会を開催することで費用と時間をかける必要はなく，株主総会の決議の省略を認めることが合理的だからである。なお，取締役会の決議の省略制度（370 条）と異なり，株主総会の決議の省略制度はその旨が可能な定款の定めを置く必要がない。このような決議を省略する制度を書面決議という。"},{"l":2,"m":"株主総会","sb":"株主総会の決議・報告の省略","i":"B","r":"","q":"株主総会の決議の省略の規定により定時株主総会の目的である事項のすべてについての提案を可決する旨の株主総会の決議があったものとみなされた場合には，その時に当該定時株主総会が終結したものとみなす。","a":true,"c":"319条5項。","e":"定時株主総会のみなし終結の規定が設けられている趣旨は，役員等の任期（332 条１項等）の終結時点を明確にするためである。"},{"l":3,"m":"株主総会","sb":"株主総会の決議・報告の省略","i":"A","r":"(平31II問題10ウ・平26II問題7エ・平21問題9ウ)","q":"取締役が株主の全員に対して株主総会に報告すべき事項を通知した場合において，当該事項を株主総会に報告することを要しないことにつき株主の全員が書面または電磁的記録により同意の意思表示をしたときは，当該事項の株主総会への報告があったものとみなされる。","a":true,"c":"320条。","e":"株主総会の決議の省略規定（319 条１項）により決議ですら省略が認められているのであれば，報告について省略を認めても問題はないため，株主総会への報告の省略規定が設けられている。"},{"l":1,"m":"株主総会","sb":"反対株主の株式買取請求","i":"A","r":"(平30II問題18ウ・平27II問題15エ類・平23II問題18イ)","q":"株式買取請求をした株主は，いつでも自由に，その請求を撤回することができる。","a":false,"c":"116条7項,182条の4第6項,469条7項,785条7項,797条7項,806条7項。","e":"株式買取請求をした株主は，株式会社の承諾を得た場合に限り，その株式買取請求を撤回することができる。"},{"l":2,"m":"株主総会","sb":"反対株主の株式買取請求","i":"C","r":"","q":"振替株式の株主は，その有する振替株式について，株式買取請求をしようとするときは，当該振替株式について買取口座を振替先口座とする振替の申請をしなければならない。","a":true,"c":"振替法155条3項。","e":"振替株式の株主は，その有する振替株式について，株式買取請求をしようとするときは，当該振替株式について買取口座を振替先口座とする振替の申請をしなければならない。これによって，反対株主は，株式買取請求に係る株式を自由に売却することができなくなるため，株式会社の承諾を得ることなく株式買取請求を撤回することを，事実上においても防止することができるのである。"},{"l":3,"m":"株主総会","sb":"反対株主の株式買取請求","i":"B","r":"","q":"株券が発行されている株式について，株式買取請求をしようとするときは，当該株式の株主（株券喪失登録の請求をした者を除く）は，株式会社に対し，当該株式に係る株券を提出しなければならない。","a":true,"c":"116条6項,182条の4第5項,469条6項,785条6項,797条6項,806条6項。","e":"株券発行会社における株式の譲渡は，当該株式に係る株券を交付しなければ，その効力を生じないとされており（128 条１項本文），株券提供後はその株券の交付ができなくなる。その結果，株式の譲渡を自由にできなくなり，株式会社の承諾を得ることなく株式買取請求を撤回することを，事実上においても防止することができるのである。"},{"l":4,"m":"株主総会","sb":"反対株主の株式買取請求","i":"B","r":"","q":"株券発行会社でない株式会社（振替株式の発行者を除く）において，株式買取請求に係る株式を当該株式会社以外の者から取得した者（当該株式会社を除く）は，当該株式会社に対し，当該株式に係る株主名簿記載事項を株主名簿に記載し，または記録することを請求することができない。","a":true,"c":"116条9項,182条の4第7項,469条9項,785条9項,797条9項,806条9項。","e":"株券不発行会社の株式は意思表示により譲渡をすることができるが，当該株式の譲渡は，株主名簿の名義書換をしなければ，株式会社その他の第三者に対抗することができないことから（130 条１項），株式会社が名義書換請求に応じなければ株式の譲受人を株主として扱う必要がなくなる。そこで，株式買取請求に係る株式については，133 条の規定の適用を除外することによって，株式買取請求に係る株式の譲渡を間接的に制限し，株式会社の承諾を得ることなく株式買取請求を撤回することを，事実上においても防止しているのである。"},{"l":5,"m":"株主総会","sb":"反対株主の株式買取請求","i":"B","r":"(平31I問題17ウ類)","q":"吸収合併存続株式会社の株主による株式買取請求があった場合において，当該株式買取請求に係る株式の買取りは，当該株式の代金の支払の時に，その効力を生ずる。","a":false,"c":"117条6項,182条の5第6項,470条6項,786条6項,798条6項,807条6項。","e":"反対株主の株式買取請求に係る株式の買取りは，効力発生日（新設型再編の場合は，設立会社の成立の日）に，その効力を生ずる。"},{"l":6,"m":"株主総会","sb":"反対株主の株式買取請求","i":"B","r":"(平23II問題18ア)","q":"新設合併における反対株主による株式買取請求に係る株式の買取りは，新設合併設立株式会社の成立の日に，その効力を生ずる。","a":true,"c":"807条6項。","e":""},{"l":7,"m":"株主総会","sb":"反対株主の株式買取請求","i":"B","r":"(令4II問題17ア)","q":"株式買取請求があった場合における株式の価格の決定について，効力発生日から 30 日以内に協議が調わない場合に，株式買取請求を受けた会社は，その期間の満了の日後30日以内に，裁判所に対し，価格の決定の申立てをすることができる。","a":true,"c":"","e":"株式買取請求があった場合における株式の価格の決定は，株主と株式会社との間の協議による（117条１項，182条の５第１項，470条１項，786条１項，798条１項，807条１項）。ただし，株式の価格の決定について，効力発生日（新設型再編の場合は，設立会社の成立の日）から30日以内に協議が調わないときは，株主または株式会社は，その期間の満了の日後30日以内に，裁判所に対し，価格の決定の申立てをすることができる（117条２項，182条の５第２項，470条２項，786条２項，798条２項，807条２項）。"},{"l":8,"m":"株主総会","sb":"反対株主の株式買取請求","i":"B","r":"(平23II問題18エ)","q":"新設合併における反対株主による株式買取請求に係る株式の価格の決定について，一定期間内に協議が調わない場合，株式買取請求をした株主は，裁判所に対し，公正な価格を調査させるため，検査役の選任を請求することができる。","a":false,"c":"807条2項。","e":"株式の価格の決定について，新設合併設立会社の成立の日から 30 日以内に協議が調わないときは，株主または新設合併消滅株式会社は，その期間の満了の日後 30 日以内に，裁判所に対し，価格の決定の申立てをすることができるが，価格を調査させるための検査役の選任の請求をすることはできない。"},{"l":9,"m":"株主総会","sb":"反対株主の株式買取請求","i":"C","r":"(平30II問題18エ)","q":"株式買取請求があった場合において，株式の買取価格の決定につき株主と株式会社との間に協議が調ったときは，当該株式会社は，吸収分割の効力発生日から60日以内にその支払をしなければならない。","a":true,"c":"786条1項。","e":""},{"l":10,"m":"株主総会","sb":"反対株主の株式買取請求","i":"B","r":"","q":"株式買取請求があった場合において，株式会社は，株式の価格の決定があるまでは，株主に対し代金の支払いをすることができない。","a":false,"c":"117条5項,182条の5第5項,470条5項,786条5項,798条5項,807条5項。","e":"株式会社は，株式の価格の決定があるまでは，株主に対し，当該株式会社が公正な価格と認める額を支払うことができる。これにより，裁判所による価格決定前に株式買取請求を受けた株式会社が反対株主に対して一定額を支払うことを認められるため，株式会社が当該一定額に係る利息の負担を回避することを防止することができるのである。"},{"l":11,"m":"株主総会","sb":"反対株主の株式買取請求","i":"C","r":"(令4II問題18イ)","q":"株式買取請求を受けた会社は，裁判所の決定した価格に対する効力発生日後の法定利率による利息を支払わなければならない。","a":false,"c":"117条5項,182条の5第5項,470条5項,786条5項,798条5項,807条5項。","e":"株式買取請求があった場合において，株式の買取価格の決定につき株主と株式会社との間に協議が調ったときは，当該株式会社は，効力発生日から60日以内にその支払をしなければならない（117条１項，182条の５第１項，470条１項，786条１項，798条１項，807条１項）。そして，期間内に代金が支払われない場合は，債務不履行となり，株式会社は，裁判所の決定した価格に対する効力発生日（新設型再編の場合は，設立会社の成立の日）から 60 日経過後の法定利率による利息をも支払わなければならない。"},{"l":1,"m":"株主総会","sb":"株主総会の瑕疵","i":"A","r":"(平29I問題10イ)","q":"株主総会の招集の手続または決議の方法が法令もしくは定款に違反し，または著しく不公正な場合は，株主総会の決議取消事由に該当する。","a":true,"c":"831条1項1号。","e":"株主総会の決議の取消事由は，① 招集手続または決議方法が法令もしくは定款に違反し，または著しく不公正な場合（831 条１項１号），② 決議の内容が定款に違反する場合（同条項２号），③ 決議について特別の利害関係を有する者が議決権を行使したことによって，著しく不当な決議がされた場合（同条項３号）である。"},{"l":2,"m":"株主総会","sb":"株主総会の瑕疵","i":"A","r":"(令2I問題9イ類)","q":"株主総会の決議の内容が法令に違反する場合は，株主総会の決議取消事由に該当する。","a":false,"c":"830条2項。","e":"決議の内容が法令に違反する場合は，決議無効原因（830 条２項）に該当する。なお，株主総会の決議の内容が定款に違反する場合は，株主総会の決議取消事由に該当する（831条１項２号）。"},{"l":3,"m":"株主総会","sb":"株主総会の瑕疵","i":"A","r":"","q":"株主総会の決議について特別の利害関係を有する者が議決権を行使した場合は，株主総会の決議取消事由に該当する。","a":false,"c":"831条1項3号。","e":"株主総会の決議について特別の利害関係を有する者が議決権を行使したことによって，著しく不当な決議がなされた場合は，株主総会の決議取消事由に該当する。特別利害関係とは，特定の株主が，決議について何らかの個人的利害関係を有する場合である。会社法は，決議について特別な利害関係を有する株主であっても，原則として議決権の行使を許容している（例外は自己株式の売主である（140条３項，160条４項，175条２項））。株主は株式会社の実質的所有者であるため，自己の利益を確保するために議決権を行使することが認められているのである。しかし，このような特別利害関係を有する株主が議決権を行使したことにより著しく不当な決議が行われた場合については，決議取消事由となる。"},{"l":4,"m":"株主総会","sb":"株主総会の瑕疵","i":"A","r":"(令3問題9ウ類・平29I問題10エ類・平20問題9ア類)","q":"株主総会の決議取消しの訴えは，株主総会の日から１年以内に限り，提起することができる。","a":false,"c":"831条1項柱書前段。","e":"株主総会の決議取消しの訴えは，株主総会の日から３か月以内に限り，提起することができる。"},{"l":5,"m":"株主総会","sb":"株主総会の瑕疵","i":"B","r":"(令4I問題10ウ・平30II問題11ア)","q":"最高裁判所の判例によれば，株主総会決議取消しの訴えを提起した後，提訴期間経過後に新たな取消事由を追加主張することは許されない。","a":true,"c":"最判昭51年12月24日。","e":"最高裁判所の判例によれば，提訴期間経過後は新たな取消事由を追加して主張することはできない。決議の取消しの訴えについて提訴期間が設けられている趣旨は，瑕疵が比較的軽微であり，瑕疵の有無や程度の判定も時の経過とともに困難となるため，可能な限り，早期に決議の効力を確定することにある。そうであるならば，提訴期間経過後に新たな取消事由を追加して主張することは，当該趣旨に反することになるためである。"},{"l":6,"m":"株主総会","sb":"株主総会の瑕疵","i":"A","r":"(令4I問題10エ・平25II問題8イ類)","q":"株式会社の債権者は，株主総会の決議の日から３か月以内に，訴えをもって当該決議の取消しを請求することができる。","a":false,"c":"831条1項柱書。","e":"決議の取消しを主張することができる者は，株主等（創立総会の場合は，株主等，設立時株主，設立時取締役または設立時監査役）である。ここで，株主等とは，以下の者をいう（828条２項１号かっこ書参照）。１ 監査役設置会社：株主，取締役，監査役または清算人２ 指名委員会等設置会社：株主，取締役，執行役または清算人３ それ以外の会社：株主，取締役または清算人"},{"l":7,"m":"株主総会","sb":"株主総会の瑕疵","i":"A","r":"(平27II問題7ウ)","q":"指名委員会等設置会社において，株主総会の決議の内容が定款に違反する場合には，当該指名委員会等設置会社の執行役は，訴えをもって当該決議の取消しを請求することができない。","a":false,"c":"831条1項柱書前段。","e":"決議の内容が定款に違反する場合は，決議取消事由に該当する。また，執行役は株主等に該当するため，訴えをもって株主総会の決議の取消しを主張することができる。"},{"l":8,"m":"株主総会","sb":"株主総会の瑕疵","i":"A","r":"(平27II問題7イ)","q":"会計参与設置会社において，株主総会の決議の方法が著しく不公正である場合には，当該会計参与設置会社の会計参与は，訴えをもって当該決議の取消しを請求することができない。","a":true,"c":"831条1項柱書前段。","e":"問題６の解説参照。決議の方法が著しく不公正である場合は，決議取消事由に該当する。しかし，会計参与は主張権者に含まれない。"},{"l":9,"m":"株主総会","sb":"株主総会の瑕疵","i":"A","r":"(平27II問題7エ)","q":"会計監査人設置会社において，招集の手続に法令違反のある株主総会の決議により会計監査人が解任された場合には，当該会計監査人は，訴えをもって当該決議の取消しを請求することができない。","a":true,"c":"831条1項柱書前段。","e":"問題６の解説参照。招集の手続が法令に違反する場合は，決議取消事由に該当する。しかし，会計監査人は主張権者に含まれない。"},{"l":10,"m":"株主総会","sb":"株主総会の瑕疵","i":"A","r":"(平24II問題8エ)","q":"定款の定めにより監査の範囲を会計に関するものに限定された監査役は，訴えをもって株主総会の決議の取消しを請求することができない。","a":true,"c":"831条1項柱書。","e":"問題６の解説参照。株主総会の決議の取消しの訴えを提起することができる監査役は，監査役設置会社（２条９号）の監査役であるから，定款の定めにより監査の範囲を会計に関するものに限定された監査役は，株主総会の決議の取消しの訴えを請求することはできない。"},{"l":11,"m":"株主総会","sb":"株主総会の瑕疵","i":"B","r":"(令5II問題10ウ・平30II問題11イ)","q":"最高裁判所の判例によれば，株主は，自己に対する株主総会の招集手続に瑕疵がない場合には，他の株主に対する招集手続に瑕疵があるときであっても，当該株主総会の決議の取消しの訴えを提起することができない。","a":false,"c":"最判昭42年9月28日。","e":"最高裁判所の判例によれば，株主は，他の株主に対する株主総会の招集手続に瑕疵があるときであっても，当該株主総会の決議の取消しの訴えを提起することができる。招集手続に瑕疵がある場合の決議取消しの訴えの制度は，手続の瑕疵それ自体に対する非難というよりは，むしろその瑕疵に公正な決議の成立が妨げられたかもしれないという意味での抗議を認める制度であり，決議の公正について利害関係をもつ他の株主についても主張を認めるべきだからである。"},{"l":12,"m":"株主総会","sb":"株主総会の瑕疵","i":"B","r":"","q":"最高裁判所の判例によれば，計算書類等の承認決議がその手続に法令違反等があるとして当該計算書類等の承認決議の取消しの訴えが提起された場合において，当該承認決議について再決議がなされた等の特別の事情がない限り，その後の決算期において新たな計算書類等の承認がなされたときであっても，当該計算書類等の承認決議の取消しを求める訴えの利益は失われない。","a":true,"c":"最判昭58年6月7日。","e":"判例によれば，計算書類等の承認決議（先行決議）がその手続に法令違反等があるとして取り消された場合は，たとえ当該計算書類等の内容自体が適正であったとしても，承認決議は遡及的に無効となるため，当該計算書類等は未確定となる。そして当該承認決議について再決議がなされた等の特別の事情がない限り，その後の決算期において新たな計算書類等の承認がなされたとしても，過去の未確定の決算を前提としたものにならざるを得ず，新たな計算書類等の記載内容も不確定なものとなる。そのため，計算書類等の承認決議（先行決議）の取消しを求める訴えの利益は失われないものとされる。"},{"l":13,"m":"株主総会","sb":"株主総会の瑕疵","i":"B","r":"(令5I問題8ウ類)","q":"株主総会の決議取消しによって取締役となる者は，株主総会の決議取消しの訴えを提起することができる。","a":true,"c":"831条1項柱書後段。","e":""},{"l":14,"m":"株主総会","sb":"株主総会の瑕疵","i":"B","r":"(令2I問題9エ)","q":"全部取得条項付種類株式の取得が行われた場合に，これにより株主の地位を失った者は，当該全部取得条項付種類株式の取得を決定した株主総会の決議について，当該決議の取消しの訴えの原告適格を有しない。","a":false,"c":"831条1項柱書後段。","e":"決議の取消しにより株主 （当該決議が創立総会の決議である場合にあっては，設立時株主）または取締役，監査役もしくは清算人（留任義務（346条１項，479条４項）により取締役，監査役または清算人としての権利義務を有する者を含み，決議が創立総会である場合にあっては設立時取締役または設立時監査役を含む） となる者も決議の取消しを主張することができる。すなわち，決議が取り消されれば地位を回復できる者（例えば，キャッシュ・アウトが株主総会の決議をもって行われ，そのキャッシュ・アウトにより株式を失った者や解任の決議により解任された取締役等）にも原告適格が認められる。"},{"l":15,"m":"株主総会","sb":"株主総会の瑕疵","i":"A","r":"(平27II問題7ア)","q":"株主総会において，ある議案に係る決議の方法が定款に違反する場合には，当該議案につき賛成の議決権を行使した株主は，訴えをもって当該決議の取消しを請求することができない。","a":false,"c":"831条1項柱書前段。","e":"株主総会の決議取消事由は，① 招集手続または決議方法が法令もしくは定款に違反し，または著しく不公正な場合，② 決議の内容が定款に違反する場合，③ 決議について特別の利害関係を有する者が議決権を行使したことによって，著しく不当な決議がされた場合である（831条１項各号）。したがって，決議の方法が定款に違反する場合は，決議取消事由に該当する。ここで，決議取消しの主張権者は，株主等（828条２項１号）である。株主等とは，株主，取締役または清算人（監査役設置会社では株主，取締役，監査役または清算人，指名委員会等設置会社では株主，取締役，執行役または清算人）をいう。ここで，賛成の議決権を行使した株主であっても主張権者から除外はされていないため，本肢は誤りである。"},{"l":16,"m":"株主総会","sb":"株主総会の瑕疵","i":"B","r":"","q":"株主総会決議の取消しは，訴えによらずに主張することができる。","a":false,"c":"","e":"株主総会決議の取消しは，必ず，決議取消しの訴えによって主張しなければならない。"},{"l":17,"m":"株主総会","sb":"株主総会の瑕疵","i":"A","r":"(平29I問題10ウ・平25II問題8エ)","q":"株主総会決議の取消しの訴えに係る請求を認容する確定判決は，第三者に対しその効力を有しない。","a":false,"c":"834条17号,838条。","e":"法律関係の画一的確定の観点から，決議取消判決は，第三者に対してもその効力を有する。すなわち，決議取消判決には対世的効力が認められているのである。"},{"l":18,"m":"株主総会","sb":"株主総会の瑕疵","i":"A","r":"(令4I問題10イ類・平29I問題10ア・平25II問題8ウ類)","q":"株主総会決議の取消しの訴えに係る請求を認容する判決が確定したときは，当該株主総会決議は，将来に向かってその効力を失う。","a":false,"c":"839条の反対解釈。","e":"会社法は，839 条において会社の組織に関する訴えのうち遡及効を否定する場合について規定しているが，その中には決議取消しの訴えは含まれていない（839条，834条17号）。したがって，決議取消判決により決議が取り消された場合は，当該決議は遡及的に無効となる。すなわち，決議の時点まで遡って無効となるのである（839 条の反対解釈）。"},{"l":19,"m":"株主総会","sb":"株主総会の瑕疵","i":"A","r":"(平25II問題8ア)","q":"株主総会の決議の方法が法令に違反することを原因として決議の取消しの訴えが提起された場合において，裁判所は，その違反する事実が重大でなく，かつ，決議に影響を及ぼさないものであると認めるときは，当該決議の取消しの請求を棄却することができる。","a":true,"c":"831条2項。","e":"決議取消しの訴えの提起があった場合において，招集手続または決議方法が法令または定款に違反するときであっても，裁判所は，その違反する事実が重大でなく，かつ，決議に影響を及ぼさないものであると認めるときは，決議取消しの請求を棄却することができる。これを，裁量棄却という。裁量棄却が認められるのは，招集手続または決議方法の法令定款違反は軽微な瑕疵であることが多いと考えられるし，その場合は決議をやり直しても同じ結果が予想されるためである。"},{"l":20,"m":"株主総会","sb":"株主総会の瑕疵","i":"A","r":"(令3問題9エ)","q":"株主総会の決議取消しの訴えの提起があった場合において，株主総会の決議の内容が定款に違反するときであっても，裁判所は，その違反する事実が重大でなく，かつ，決議に影響を及ぼさないものであると認めるときは，当該訴えに係る請求を棄却することができる。","a":false,"c":"831条2項。","e":"裁量棄却をすることができるのは，決議取消事由が株主総会の招集の手続または決議の方法が法令または定款に違反する場合のみである。したがって，株主総会の決議の内容が定款に違反する場合は裁量棄却をすることができない。"},{"l":21,"m":"株主総会","sb":"株主総会の瑕疵","i":"A","r":"(令4I問題10ア)","q":"株主総会の決議の取消しの訴えが提起された場合，当該決議の方法が著しく不公正なときであっても，裁判所は，その事実が決議に影響を及ぼさないものであると認めるときは，当該決議の取消しの請求を棄却することができる。","a":false,"c":"831条2項。","e":"問題 20 と同様，裁量棄却をすることができるのは，決議取消事由が株主総会の招集の手続または決議の方法が法令または定款に違反する場合のみである。したがって，株主総会の決議の方法が著しく不公正なときは裁量棄却をすることができない。"},{"l":22,"m":"株主総会","sb":"株主総会の瑕疵","i":"B","r":"(平31I問題9ウ)","q":"役員選任の株主総会決議取消しの訴えの係属中に，当該決議に基づいて選任された取締役ら役員が全て任期満了により退任し，その後の株主総会の決議によって取締役ら役員が新たに選任された場合には，特段の事情のない限り，当該取消しの訴えは実益を失い，訴えの利益を欠くに至る。","a":true,"c":"最判昭45年4月2日。","e":""},{"l":23,"m":"株主総会","sb":"株主総会の瑕疵","i":"B","r":"(令5II問題10エ ・令2I問題9ウ)","q":"最高裁判所の判例によれば，議案を否決する株主総会の決議について，当該決議の取消しを請求する訴えは，適法である。","a":false,"c":"最判平28年3月4日。","e":"最高裁判所の判例によれば，ある議案を否決する株主総会の決議の取消しを請求する訴えは，不適法である。ある議案を否決する株主総会の決議の場合には，これによって新たな法律関係が生ずることはないし，これを取り消すことによって新たな法律関係が生ずることもないためである。"},{"l":24,"m":"株主総会","sb":"株主総会の瑕疵","i":"A","r":"(令5II問題10イ類 ・令3問題9イ)","q":"最高裁判所の判例によれば，株主総会の招集の手続がその招集につき決定の権限を有する取締役会の有効な決議に基づかないでなされたものであって，かつ，その招集の通知が，通知すべき全ての株主に対して法定の招集期間に不足してなされた場合における株主総会の決議は，他に招集の手続に瑕疵がないとしても，不存在である。","a":false,"c":"最判昭46年3月18日。","e":"最高裁判所の判例によれば，株主総会が取締役会の決議に基づかないで招集され，その招集通知がすべての株主に対して法定の招集期間に２日足りない会日である12日前になされた場合には，決議取消事由に該当するものとされ，重大な瑕疵があり，裁量棄却することはできないとしている。"},{"l":25,"m":"株主総会","sb":"株主総会の瑕疵","i":"B","r":"(令3問題9ア)","q":"最高裁判所の判例によれば，株主総会の決議に基づいて新株が既に発行された後は，当該新株発行に関する株主総会の決議の無効の確認の訴えは，確認の利益を欠き，提起することができない。","a":true,"c":"最判昭40年6月29日。","e":"最高裁判所の判例によれば，新株発行に関する株主総会に無効事由があっても，その決議に基づく新株が発行済みである場合には，新株発行無効の訴えを提起しない限り当該新株を
