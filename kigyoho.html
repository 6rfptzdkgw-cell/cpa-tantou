取得されることとなるため，定款変更に必要な要件をさらに厳格にし，株主全員の同意を求めている。"},{"l":7,"m":"株式の内容","sb":"取得条項付株式","i":"B","r":"(平30I問題5ウ)","q":"株式会社が，定款の変更により，その発行する全部の株式の内容として，当該株式会社が一定の事由が生じたことを条件として当該株式を取得することができることを定める場合において，当該定款の変更に反対する株主は，株式買取請求権を行使することができる。","a":false,"c":"116条1項参照。","e":"発行する全部の株式を取得条項付株式とする旨の定款の定めを設ける定款の変更を行う場合，反対株主には株式買取請求権が認められていない。なぜなら，当該定款の変更については，株主全員の同意が必要となるため反対株主が存在しないからである。"},{"l":1,"m":"株式の内容","sb":"剰余金の配当・残余財産の分配について内容の異なる株式","i":"A","r":"(平27I問題5イ類・平23II問題4ア)","q":"株式会社は，剰余金の配当については普通株式よりも優先的に取り扱われるが，残余財産の分配については普通株式よりも劣後的に取り扱われる種類の株式を，発行することができる。","a":true,"c":"108条2項1号2号。","e":"剰余金の配当については劣後するが，残余財産の分配については優先するというような株式の発行も認められ，組み合わせは自由である。"},{"l":2,"m":"株式の内容","sb":"剰余金の配当・残余財産の分配について内容の異なる株式","i":"C","r":"","q":"株式会社は，剰余金の配当について他の種類株式よりも優先的な地位が与えられる株式を発行する場合は，必ず，定款で具体的な配当金額またはその決定方法を定めておかなければならない。","a":false,"c":"108条3項,会社法施行規則20条。","e":"株式会社が種類株式を発行する場合，種類株式の一定の事項については，定款にその内容の要綱を定めておけば，詳細な内容は，当該種類株式を初めて発行するときまでに，株主総会（取締役会設置会社にあっては株主総会または取締役会）の決議によって定めることを認めている。したがって，剰余金の配当について定款で具体的な配当金額またはその決定方法を定めず，その内容の要綱を定めるだけでもよい。これは，発行時の経済情勢に適した権利内容を機動的に定めることを可能にするためである。なお，定款で要綱のみを定めることのできる株式の種類は，すべての種類株式である。"},{"l":3,"m":"株式の内容","sb":"剰余金の配当・残余財産の分配について内容の異なる株式","i":"B","r":"(平27I問題5エ)","q":"株式会社が剰余金の配当を受ける権利について内容の異なる株式を発行する旨の定款変更をする場合において，当該株式に関する事項についての定めを設ける旨の定款の変更に反対する株主は，株式買取請求権を行使することができる。","a":false,"c":"116条1項各号参照。","e":"この場合においては，株主に株式買取請求権は与えられていない。"},{"l":1,"m":"株式の内容","sb":"議決権制限株式","i":"B","r":"(平27II問題4エ)","q":"株主総会において議決権を行使することができる事項に関する定款の定めは，種類株主総会における議決権の行使にも適用される。","a":false,"c":"108条1項3号参照。","e":"議決権制限株式を発行することによって制限することができるのは，株主総会において議決権を行使することができる事項であり，種類株主総会における議決権は制限されない。"},{"l":2,"m":"株式の内容","sb":"議決権制限株式","i":"B","r":"(平20問題4ア類)","q":"種類株式発行会社は，株主総会において全く議決権を有しない完全無議決権株式のみならず，一定の事項についてのみ議決権を制限した一部議決権制限株式を発行することも認められる。","a":true,"c":"108条2項3号イ。","e":""},{"l":3,"m":"株式の内容","sb":"議決権制限株式","i":"A","r":"(平29I問題6ウ類・平23II問題4イ類)","q":"種類株式発行会社において，議決権制限株式の数が発行済株式総数の２分の１を超えるに至ったときは，株式会社は，直ちに，議決権制限株式の数を発行済株式総数の２分の１以下にするための必要な措置をとらなければならない。","a":false,"c":"115条。","e":"種類株式発行会社が公開会社である場合において，議決権制限株式の数が発行済株式総数の２分の１を超えるに至ったときは，株式会社は，直ちに，議決権制限株式の数を発行済株式総数の２分の１以下にするための必要な措置をとらなければならない。議決権制限株式について発行限度が設けられているのは，少額の出資で株式会社を支配することは適当ではないからである。ただし，非公開会社においては，株式会社にとって好ましくない者が株主となることをそもそも阻止することができるため，株式の取得を認めたうえで議決権を制限することについても規制を加える必要性は乏しいことから，当該規制の対象は公開会社に限られている。"},{"l":1,"m":"株式の内容","sb":"全部取得条項付種類株式","i":"B","r":"","q":"株式会社は，全部取得条項付種類株式の内容として，株主総会の特別決議によって当該全部取得条項付種類株式の一部を取得することとする旨を定款に定めることができる。","a":false,"c":"108条1項7号参照。","e":"全部取得条項付種類株式とは，当該種類の株式について，当該株式会社が株主総会の決議（特別決議）によってその全部を取得する定めがある種類の株式である。"},{"l":2,"m":"株式の内容","sb":"全部取得条項付種類株式","i":"B","r":"","q":"株式会社は，全部取得条項付種類株式を取得するのと引換えに金銭等を交付しなければならない。","a":false,"c":"171条1項1号参照。","e":"全部取得条項付種類株式の取得の対価について特に制限はなく，無償による取得も可能である。なお，全部取得条項付種類株式の取得については，他の種類の株式を対価とする場合を除き，財源規制が設けられている（461条１項４号）。"},{"l":3,"m":"株式の内容","sb":"全部取得条項付種類株式","i":"B","r":"","q":"ある種類の株式を全部取得条項付種類株式とする定款の変更をする場合，当該種類の株式を有する反対株主は，株式会社に対して，自己の有する株式を公正な価格で買い取ることを請求することができる。","a":true,"c":"116条1項2号。","e":"反対株主の投下資本の回収を保障するためである。また，当該株式を目的とする新株予約権者にも新株予約権買取請求権が認められる（118条１項２号）。"},{"l":1,"m":"株式の内容","sb":"拒否権付株式","i":"B","r":"(平20問題4ウ)","q":"取締役会で決議すべき事項のうち，取締役会の決議のほか，ある種類の株式の株主を構成員とする種類株主総会の決議があることを必要とする旨の定款の定めは無効である。","a":false,"c":"108条1項8号。","e":"株式会社は，拒否権付株式として，株主総会，取締役会または清算人会において決議すべき事項のうち，当該決議のほか，ある種類株主を構成員とする種類株主総会の決議が必要であることを内容とした株式を発行することができる。"},{"l":2,"m":"株式の内容","sb":"拒否権付株式","i":"B","r":"(令6I問題ア)","q":"株式会社は，会計参与の選任につき株主総会決議のほか，ある種類の株式の種類株主を構成員とする種類株主総会の決議を必要とする旨を定款で定めることができない。","a":false,"c":"108条1項8号。","e":"拒否権付株式とは，株主総会，取締役会または清算人会において決議すべき事項のうち，当該決議のほか，当該種類の株式の種類株主を構成員とする種類株主総会の決議があることを必要と定められた株式をいう。そのため，拒否権付株式の内容として，会計参与の選任につき株主総会決議のほか，ある種類の株式の種類株主を構成員とする種類株主総会の決議を必要とする旨を定款で定めることは可能である。"},{"l":3,"m":"株式の内容","sb":"拒否権付株式","i":"B","r":"","q":"公開会社は，株主総会または取締役会において決議すべき事項のうち，当該決議のほか，ある種類株主を構成員とする種類株主総会の決議が必要であることを内容とした株式を発行することができない。","a":false,"c":"","e":"拒否権付株式を発行することができる株式会社に制限はない。"},{"l":1,"m":"株式の内容","sb":"取締役等選任権付種類株式","i":"A","r":"(平31II問題4ウ類・平30II問題5エ類・平29I問題6イ類・平23II問題4エ類)","q":"株式会社は，指名委員会等設置会社を除き，ある種類株主を構成員とする種類株主総会において取締役または監査役を選任することを内容とした株式を発行することができる。","a":false,"c":"108条1項柱書ただし書9号。","e":"指名委員会等設置会社および公開会社は，取締役等選任権付種類株式を発行することができない。したがって，指名委員会等設置会社でなくても公開会社は取締役等選任付種類株式を発行することができないので，本肢は誤りである。指名委員会等設置会社では，指名委員会が株主総会に提出する取締役の選任および解任に関する議案の内容の決定権限を有しているため，種類株主総会に取締役の選任および解任権限を与えてしまうと，矛盾が生じてしまうからである。また，取締役等選任権付種類株式は，議決権制限株式（108 条１項３号）に比べて，誰が当該種類株式を取得するかが会社運営に大きな影響を及ぼすと考えられるため，誰が当該種類株主になるかという点について，会社の意思が反映される非公開会社に限ってその発行を認めるべきである。"},{"l":2,"m":"株式の内容","sb":"取締役等選任権付種類株式","i":"B","r":"(令6I問題イ類)","q":"株式会社（指名委員会等設置会社および公開会社を除く）は，ある種類株主を構成員とする種類株主総会において会計参与を選任することを内容とした株式を発行することができる。","a":false,"c":"108条1項9号参照。","e":"種類株式として発行することができるのは，ある種類株主を構成員とする種類株主総会において取締役または監査役を選任することができる株式のみである。したがって，本肢のような種類株式を発行することはできない。"},{"l":3,"m":"株式の内容","sb":"取締役等選任権付種類株式","i":"C","r":"","q":"ある種類株主を構成員とする種類株主総会において取締役を選任することを内容とした株式についての定款の定めは，会社法または定款で定めた取締役の員数を欠いた場合において，そのために当該員数に足りる数の取締役を選任することができないときは，廃止されたものとみなす。","a":true,"c":"112条。","e":"当該規定は取締役等の欠員が永続することを回避するために設けられている。"},{"l":4,"m":"株式の内容","sb":"取締役等選任権付種類株式","i":"A","r":"","q":"指名委員会等設置会社において取締役等選任権付種類株式を発行している場合，指名委員会は，当該種類株式を有する種類株主と共同して，取締役の選任に関する議案の内容を決定しなければならない。","a":false,"c":"108条1項柱書ただし書9号。","e":"指名委員会等設置会社は，取締役等選任権付種類株式を発行することができない。なぜなら，指名委員会等設置会社においては，指名委員会が株主総会に提出する取締役の選任および解任に関する議案の内容の決定権限を有しているため，種類株主総会に取締役の選任および解任権限を与えてしまうと，矛盾が生じてしまうからである。"},{"l":1,"m":"株式の内容","sb":"種類株式に係る定款変更手続","i":"B","r":"","q":"種類株式発行会社が新しく株式の種類を追加する定款の変更をする場合において，ある種類の株式の種類株主に損害を及ぼすおそれがあるときは，当該種類の種類株主を構成員とする種類株主総会において議決権を行使することができる種類株主が存しない場合を除き，当該種類株主総会の決議がなければ，当該定款の変更は効力を生じない。","a":true,"c":"322条1項1号イ,324条2項4号。","e":"種類株式発行会社が新しく株式の種類を追加する定款の変更をする場合において，ある種類株主に損害を及ぼすおそれがあるときは，当該行為は，当該種類株主を構成員とする種類株主総会の決議がなければその効力を生じない。当該種類株主総会の決議は，特別決議である。"},{"l":2,"m":"株式の内容","sb":"種類株式に係る定款変更手続","i":"B","r":"(令5I問題10ア)","q":"種類株式発行会社がある種類株式について譲渡制限を設ける定款の変更は，株主総会の特別決議のほかに，譲渡制限が設けられる当該種類の株式の種類株主により構成される種類株主総会の特別決議が必要である。","a":false,"c":"111条2項1号,324条3項1号。","e":"種類株式発行会社がある種類株式について譲渡制限を設ける定款の変更は，株主総会の特別決議のほかに，譲渡制限が設けられる当該種類の株式の種類株主により構成される種類株主総会の特殊決議が必要である。すなわち，譲渡制限が設けられると，株式の譲渡，すなわち投下資本回収の機会が制限されることになり，種類株主に対して重大な影響を及ぼすことになるため，種類株主総会の特殊決議を求めているのである。なお，取得請求権付種類株式・取得条項付種類株式の取得の対価としての株式を譲渡制限株式とする場合は，当該種類株主により構成される種類株主総会の特殊決議も必要となる（111条２項２号３号，324条３項１号）。"},{"l":3,"m":"株式の内容","sb":"種類株式に係る定款変更手続","i":"B","r":"(令5I問題10イ)","q":"種類株式発行会社がある種類の株式の発行後に定款を変更して，当該種類の株式を取得条項付株式とする定款の定めを設けようとするときは，当該種類の株式を有する株主全員の同意を得なければならない。","a":true,"c":"111条1項。","e":"一定の事由の発生により株式会社に株式が取得されることとなるので，当該種類株式を有する種類株主を保護するために，当該種類株式を有する株主全員の同意を求めている。"},{"l":4,"m":"株式の内容","sb":"種類株式に係る定款変更手続","i":"A","r":"(令5I問題10ウ・平30II問題5ウ・平23II問題4ウ)","q":"種類株式発行会社が，ある種類の株式の発行後に，当該種類の株式を全部取得条項付種類株式にしようとするときは，当該種類の株式を有する株主全員の同意を得なければならない。","a":false,"c":"111条2項1号,324条2項1号。","e":"種類株式発行会社が，ある種類株式の発行後に，当該種類の株式を全部取得条項付種類株式にしようとする定款の定めを設ける場合には，当該定款の変更は，当該種類の株式を有する種類株主を構成員とする種類株主総会の特別決議がなければ，その効力を生じない。全部取得条項が設けられると，株主総会の特別決議で種類株式が会社に取得されてしまうことから，当該種類株主に対して重大な影響を及ぼすことになるため，普通決議よりも重い特別決議を課して，種類株主に慎重な判断を求めているのである。"},{"l":1,"m":"株式の内容","sb":"発行可能株式総数と発行可能種類株式総数","i":"B","r":"(平24II問題5ア)","q":"公開会社でない株式会社は，定款を変更して発行可能株式総数についての定めを廃止することができる。","a":false,"c":"113条1項。","e":"公開・非公開を問わず，株式会社は，定款を変更して発行可能株式総数についての定めを廃止することができない。"},{"l":2,"m":"株式の内容","sb":"発行可能株式総数と発行可能種類株式総数","i":"B","r":"","q":"定款を変更して発行可能株式総数を減少するときは，変更後の発行可能株式総数は，当該定款の変更が効力を生じた時における発行済株式総数を下ることができない。","a":true,"c":"113条2項。","e":""},{"l":3,"m":"株式の内容","sb":"発行可能株式総数と発行可能種類株式総数","i":"B","r":"(平31II問題4エ)","q":"株式会社が定款を変更して発行可能株式総数を増加させる場合は，当該定款の変更後の発行可能株式総数は，当該定款の変更が効力を生じたときにおける発行済株式総数の４倍を超えることができない。","a":false,"c":"113条3項1号。","e":"公開会社において，定款を変更して発行可能株式総数を増加する場合は，変更後の発行可能株式総数は，当該定款の変更が効力を生じたときにおける発行済株式総数の４倍を超えることができない（113 条３項本文）。公開会社においては，授権資本制度が採用されているため，授権限度を法定することにより取締役会の権限濫用の危険性を回避しているのである。また，授権限度を定めることにより，既存株主が受ける持株比率の低下の限界を既存株主に示すこともできるのである。"},{"l":4,"m":"株式の内容","sb":"発行可能株式総数と発行可能種類株式総数","i":"B","r":"","q":"公開会社でない株式会社が定款を変更して公開会社となる場合には，当該定款の変更後の発行可能株式総数は，当該定款の変更が効力を生じた時における発行済株式総数の４倍を超えることができる。","a":false,"c":"113条3項2号。","e":"非公開会社が定款を変更して公開会社となる場合には，当該定款の変更後の発行可能株式総数は，当該定款の変更が効力を生じた時における発行済株式総数の４倍を超えることができない。発行済株式総数の４倍を超える発行可能株式総数を定款に定めている非公開会社が，公開会社となる場合にその発行可能株式総数を維持できてしまうと，発行可能株式総数に係る規律（37条３項本文，113条３項１号）を設けた趣旨が達せられなくなるためである。"},{"l":5,"m":"株式の内容","sb":"発行可能株式総数と発行可能種類株式総数","i":"A","r":"(平25I問題4ウ)","q":"新株予約権の行使期間の初日が到来している場合には，新株予約権者が新株予約権を行使することにより取得することとなる株式の数は，発行可能株式総数から，自己株式を含む発行済株式の総数を控除して得た数を超えてはならない。","a":false,"c":"113条4項。","e":"新株予約権（権利行使期間の初日が到来していないものを除く）の新株予約権者が権利行使することにより取得することとなる株式の数は，発行可能株式総数から発行済株式（自己株式を除く）の総数を控除して得た数を超えてはならない。つまり，権利行使期間の初日が到来している新株予約権の新株予約権者が権利を行使することにより取得することとなる株式の数を，未発行または自己株式という形で留保することが求められているのである。"},{"l":6,"m":"株式の内容","sb":"発行可能株式総数と発行可能種類株式総数","i":"A","r":"(令3問題4ア類・平30II問題5ア・平25I問題4イ)","q":"種類株式発行会社においては，発行可能種類株式総数の合計数は，発行可能株式総数と一致しなければならない。","a":false,"c":"","e":"発行可能株式総数と発行可能種類株式総数の関係については，特に規律が設けられていないので，発行可能種類株式総数の合計額が発行可能株式総数を超えることも，逆に下回ることも差し支えない。"},{"l":1,"m":"株主平等原則","sb":"","i":"A","r":"","q":"株式会社が内容の異なる種類株式を発行している場合，株式会社は，それぞれの種類株主について，その内容に応じ異なる取扱いをすることができる。","a":true,"c":"109条1項参照。","e":"株式会社は，株主を，その有する株式の内容および数に応じて，平等に取り扱わなければならない。これを株主平等原則という。すなわち，株式会社が内容の異なる種類株式を発行している場合，株式会社は，それぞれの種類株主について，その内容に応じ異なる取扱いをすることが許容される。"},{"l":2,"m":"株主平等原則","sb":"","i":"A","r":"(令6I問題5ウ類・平31II問題4イ類・平27I問題5ウ類・平22II問題4ア類・平22I問題9エ類)","q":"公開会社は，剰余金の配当を受ける権利，残余財産の分配を受ける権利，株主総会における議決権に関する事項について，株主ごとに異なる取扱いを行う旨を定款で定めることができる。","a":false,"c":"109条2項。","e":"非公開会社は，剰余金の配当を受ける権利，残余財産の分配を受ける権利，株主総会における議決権に関する事項について，株主ごとに異なる取扱いを行う旨を定款で定めることができる。非公開会社は，株主の変動が頻繁に生じないため，株主間の関係が緊密になり，株主に個性が認められる。そのため，株主に着目してそれぞれ異なる取扱いを認めても問題はないためである。"},{"l":3,"m":"株主平等原則","sb":"","i":"A","r":"(令4II問題4ウ類・平24II問題16イ)","q":"公開会社でない株式会社が，剰余金の配当を受ける権利，残余財産の分配を受ける権利，株主総会における議決権に関する事項について，株主ごとに異なる取扱いを行う旨を定款で定める定款変更の株主総会の決議は，当該株主総会において議決権を行使することができる株主の半数以上であって，当該株主の議決権の３分の２以上に当たる多数をもって行う。","a":false,"c":"109条2項,309条4項。","e":"非公開会社が，剰余金の配当を受ける権利，残余財産の分配を受ける権利，株主総会における議決権について，株主ごとに異なる取扱いを行う旨を定款で定めるための定款変更の株主総会の決議は，総株主の半数以上（定款で加重可）であって，総株主の議決権の４分の３（定款で加重可）以上に当たる多数をもって行わなければならない。当該定款変更は，株主の基本的な権利について株主ごとに異なる取扱いをする旨の定款の定めを新設するものであり，株主平等原則の例外であることから，株主にとって大変重大な影響を及ぼす。そのため，309 条３項の特殊決議よりもさらに厳重な要件が課せられている。"},{"l":4,"m":"株主平等原則","sb":"","i":"A","r":"","q":"公開会社でない株式会社が，剰余金の配当を受ける権利，残余財産の分配を受ける権利，株主総会における議決権に関する事項について，株主ごとに異なる取扱いを行う旨を廃止する定款変更をする場合は，株主総会の特別決議により行うことができる。","a":true,"c":"309条4項かっこ書,466条,309条2項11号。","e":""},{"l":5,"m":"株主平等原則","sb":"","i":"C","r":"","q":"最高裁判所の判例によれば，株式会社が特定の株主に対して無配による損失填補のため金銭を贈与する契約を締結した場合であっても，株主平等原則に反することなく，当該契約は有効である。","a":false,"c":"最判昭45年11月24日。","e":"確かに，贈与であるので形式的には，株主の有する株主権の内容に基づく法律関係ではないが，無配による損失填補の趣旨で行った贈与なので，実質的には剰余金配当となり，株主権の内容に基づく法律関係にあたるといえる。そのため，株主平等原則に反し当該契約は無効である。"},{"l":1,"m":"株式譲渡","sb":"株式譲渡の方法と対抗要件(株式等振替制度を除く)","i":"A","r":"(平28II問題6ア類・平20問題3イ)","q":"株券発行会社の株式の譲渡は，自己株式の処分による株式の譲渡を除き，当該株式に係る株券を交付しなければ，その効力を生じない。","a":true,"c":"128条1項。","e":"株券発行会社における株式の譲渡は，株券の交付を効力発生要件とするのが原則である。ただし，自己株式の処分による株式の譲渡についてはこの限りでない。"},{"l":2,"m":"株式譲渡","sb":"株式譲渡の方法と対抗要件(株式等振替制度を除く)","i":"A","r":"(令2I問題4イ・平28I問題5ア)","q":"株券発行会社が自己株式の処分による株式の譲渡をする場合，当該株式に係る株券の交付がなくても，当該譲渡の効力が生じる。","a":true,"c":"128条1項ただし書。","e":"自己株式の処分の法的性質は株式の譲渡であるため，株券発行会社においては株券の交付がなければ，株式譲渡の効力が生じないはずである。しかし，会社法は，自己株式の処分を新株発行と合わせて「募集株式の発行等」として規制し（199 条以下），自己株式の処分の効力は，払込期日を定めた場合は払込期日に，払込期間を定めた場合は出資の履行をした日に発生することとしている（209 条）。したがって，自己株式の処分，すなわち，株式の譲渡の効力はこの日に生じることになるので，128 条１項ただし書は，自己株式の処分について，株券交付を効力要件にしない旨を定めている。"},{"l":3,"m":"株式譲渡","sb":"株式譲渡の方法と対抗要件(株式等振替制度を除く)","i":"A","r":"(平30II問題6ウ・平28II問題6イ)","q":"株券発行会社であるか否かを問わず，株式会社の株式の譲渡を当該株式会社を除く第三者に対抗するためには，株主名簿の名義書換が必要である。","a":false,"c":"130条2項。","e":"株券発行会社でない株式会社においては，株主名簿の名義書換が第三者に対する対抗要件である（130 条１項）。これに対して，株券発行会社における第三者に対する対抗要件は，株券の占有である。"},{"l":4,"m":"株式譲渡","sb":"株式譲渡の方法と対抗要件(株式等振替制度を除く)","i":"A","r":"(平28II問題6ウ)","q":"株券発行会社であるか否かを問わず，株式会社の株式の譲渡を当該株式会社に対抗するためには，株主名簿の名義書換が必要である。","a":true,"c":"130条。","e":"名義書換の確定的効力である。名義書換の確定的効力が認められるのは，株主名簿制度の趣旨のうち，会社の事務処理の便宜を図るためである。すなわち，株式会社は多数の流動的な株主の反復的かつ継続的な権利行使に対応しなければならないため，株主名簿の記載を基準として会社と株主との関係を決定することにより，会社の事務処理が煩雑になるのを防いでいるのである。"},{"l":1,"m":"株式譲渡","sb":"法律による譲渡制限","i":"A","r":"(平20問題3ア類)","q":"出資の履行をすることにより募集株式の株主となる権利の譲渡は，その効力を生じない。","a":false,"c":"208条4項。","e":"出資の履行をすることにより募集株式の株主となる権利の譲渡は，株式会社に対抗することができない。会社設立時における権利株の譲渡も同様である（35条，50条２項，63条２項）。"},{"l":2,"m":"株式譲渡","sb":"法律による譲渡制限","i":"A","r":"","q":"株券発行前にした株式の譲渡は，株券発行会社に対し，その効力を生じない。","a":true,"c":"128条2項。","e":"株券発行事務の渋滞を防止し，株券発行が円滑かつ正確に行われるようにするために，株券発行前の株式の譲渡は制限されている。"},{"l":3,"m":"株式譲渡","sb":"法律による譲渡制限","i":"B","r":"","q":"最高裁判所の判例によれば，会社が株券の発行を不当に遅滞した場合であっても，株券発行前の株式の譲渡の効力を否定し，譲渡人を株主として扱わなければならないとしている。","a":false,"c":"最判昭47年11月8日。","e":"判例は，会社が株券の発行を不当に遅滞し，信義則に照らしても株式譲渡の効力を否定することを相当としない状況においては，株主は，意思表示のみによって有効に株式を譲渡でき，会社はもはや，株券発行前であることを理由としてその効力を否定することができず，譲受人を株主として扱わなければならないとしている。"},{"l":1,"m":"株式譲渡","sb":"定款による譲渡制限","i":"B","r":"","q":"株式会社が譲渡制限株式を発行する場合は，その旨を登記しなければならない。","a":true,"c":"911条3項7号。","e":"発行する株式の内容は登記事項である。"},{"l":2,"m":"株式譲渡","sb":"定款による譲渡制限","i":"B","r":"","q":"株券発行会社が譲渡制限株式を発行する場合，当該株式を表章する株券に当該株式が譲渡制限株式である旨を記載する必要はない。","a":false,"c":"216条3号。","e":"株券発行会社が譲渡制限株式を発行する場合，当該株式を表章する株券に当該株式が譲渡制限株式である旨を記載しなければならない。"},{"l":3,"m":"株式譲渡","sb":"定款による譲渡制限","i":"B","r":"(令4II問題4エ)","q":"譲渡制限株式の株主は，その有する譲渡制限株式を他人（当該譲渡制限株式を発行した株式会社を除く）に譲り渡そうとするときは，当該株式会社に対し，当該他人が当該譲渡制限株式を取得することについて承認するか否かの決定をすることを請求することができる。","a":true,"c":"136条。","e":""},{"l":4,"m":"株式譲渡","sb":"定款による譲渡制限","i":"B","r":"(平29II問題5イ)","q":"譲渡制限株式を取得した株式取得者は，当該譲渡制限株式を発行した株式会社に対し，当該譲渡制限株式を取得したことについて承認するか否かの決定を請求することができない。","a":false,"c":"137条1項。","e":"譲渡制限株式を取得した株式取得者は，当該譲渡制限株式を発行した株式会社に対し，当該譲渡制限株式を取得したことについて承認するか否かの決定を請求することができる。"},{"l":5,"m":"株式譲渡","sb":"定款による譲渡制限","i":"B","r":"","q":"株券発行会社における譲渡制限株式の譲渡について，株式取得者は，当該譲渡制限株式に係る株券を提示することで，会社に対し，当該譲渡制限株式を取得したことについて承認するか否かの決定の請求を単独で行うことができる。","a":true,"c":"137条2項,会社法施行規則24条2項1号。","e":"譲渡制限株式を取得した株式取得者による譲渡等承認請求は，利害関係人の利益を害するおそれがないものとして法務省令で定める場合を除き，その取得した株式の株主として株主名簿に記載され，もしくは記録された者（譲渡人）またはその相続人その他一般承継人と共同してしなければならない。無権利者による請求を防止する趣旨である。ここで，利害関係人の利益を害するおそれがないものとして法務省令で定める場合とは，名義書換請求の規定（133条２項，会社法施行規則22条）とほぼ同じである。株券発行会社において，株券の占有者は，当該株券に係る株式についての権利を適法に有するものと推定される（131 条１項）。したがって，株式取得者が株券を提示した場合は，利害関係人の利益を害するおそれがない場合とされ，単独で譲渡等承認請求をすることができる。"},{"l":6,"m":"株式譲渡","sb":"定款による譲渡制限","i":"B","r":"","q":"譲渡制限株式の株主が譲渡等承認請求をする場合には，当該譲渡制限株式を譲り受ける者の氏名または名称を明らかにしてしなければならない。","a":true,"c":"138条1号ロ。","e":""},{"l":7,"m":"株式譲渡","sb":"定款による譲渡制限","i":"B","r":"","q":"譲渡制限株式を取得した株式取得者が譲渡等承認請求をする場合，株式会社がその承認をしない旨の決定をするのであれば，当該株式会社または指定買取人が当該譲渡制限株式を買い取ることを同時に請求しなければならない。","a":false,"c":"138条2号ハ。","e":"株式会社または指定買取人による譲渡制限株式の買取請求は，任意である。これは，譲渡制限株式の株主による譲渡等承認請求の場合も同様である（138条１号ハ）。"},{"l":8,"m":"株式譲渡","sb":"定款による譲渡制限","i":"B","r":"(平23I問題5ア)","q":"株券発行会社の譲渡制限株式を当該株式を発行した株式会社以外の者から取得した者は，当該株式会社に対し，株券を提示しても，当該譲渡制限株式を取得したことについて承認をするか否かの決定をすることを請求することができない。","a":false,"c":"137条2項,会社法施行規則24条2項1号。","e":"株式取得者からの承認請求は，原則として名義人またはその相続人その他の一般承継人と共同してしなければならないが，株券発行会社にあっては株券を提示して承認請求することができる。"},{"l":9,"m":"株式譲渡","sb":"定款による譲渡制限","i":"A","r":"(平24II問題5エ類)","q":"取締役会設置会社において譲渡等承認請求を承認するか否かの決定をするには，定款に別段の定めがある場合を除き，取締役会の決議によらなければならない。","a":true,"c":"139条1項本文かっこ書。","e":""},{"l":10,"m":"株式譲渡","sb":"定款による譲渡制限","i":"A","r":"(平23I問題5ウ)","q":"取締役会設置会社以外の株式会社において譲渡等承認請求を承認するか否かの決定をするには，定款に別段の定めがある場合を除き，株主総会の特別決議によらなければならない。","a":false,"c":"139条1項本文,309条2項各号参照。","e":"取締役会設置会社以外の株式会社において譲渡等承認請求を承認するか否かの決定をするには，原則として株主総会の決議によらなければならないが，当該決議は普通決議で足りる。"},{"l":11,"m":"株式譲渡","sb":"定款による譲渡制限","i":"B","r":"","q":"取締役会設置会社において，譲渡等承認請求を承認するか否かの決定を株主総会の決議により行う旨の定款の定めは，その効力を生じない。","a":false,"c":"139条1項ただし書。","e":"取締役会設置会社か否かに関係なく，譲渡等承認請求を承認するか否かの承認機関は，定款で別段の定めを設けることが認められている。例えば，取締役会設置会社において承認機関を株主総会と定めることや，譲渡制限種類株式に関する承認機関を当該種類株主総会と定めること等が考えられる。"},{"l":12,"m":"株式譲渡","sb":"定款による譲渡制限","i":"B","r":"","q":"株式会社は，譲渡等承認請求に対して承認するか否かの決定をしたときは，譲渡等承認請求者に対して，当該決定の内容を通知しなければならない。","a":true,"c":"139条2項。","e":"当該通知が譲渡等承認請求の日から２週間以内になされなかった場合には，株式会社と譲渡等承認請求者との合意により別段の定めがある場合を除き，譲渡等の承認をする旨の決定をしたものとみなす（145条１号）。"},{"l":13,"m":"株式譲渡","sb":"定款による譲渡制限","i":"B","r":"(平29II問題5ウ・平26I問題5エ類)","q":"譲渡制限株式を譲り渡そうとする株主が譲渡承認の請求をした場合において，当該請求の日から２週間（これを下回る期間を定款で定めた場合はその期間）以内に株式会社が承認するか否かの決定の内容を通知しないときは，当該株式会社は，当該株主との合意による別段の定めをした場合を除き，承認をする旨の決定をしたものとみなされる。","a":true,"c":"145条1号。","e":"① 株式会社が，承認するか否かの通知の日から40日以内に，買取りの通知をしなかった場合（承認するか否かの通知の日から10日以内に指定買取人が買取りの通知をした場合を除く）（145条２号），② 買取りの通知の期間内（会社は40日以内，指定買取人は10日以内）に，供託を証明する書面を譲渡等承認請求者に対して交付しなかった場合等（145条３号，会社法施行規則26条１号２号）も同様である。ここで，指定買取人による買取りの通知に係る期間（10日以内）よりも，会社による買取りの通知に係る期間（40日以内）の方が長い理由であるが，取締役会設置会社においては，指定買取人の指定は取締役会の決議で行うが（140条５項），会社が買い取る場合は，株主総会の特別決議が必要となる（140条２項，309条２項１号）。したがって，株主総会を招集しなければならないという点で，会社による買取りの通知に係る期間の方が長くなっているのである。"},{"l":14,"m":"株式譲渡","sb":"定款による譲渡制限","i":"B","r":"(平27I問題4ア類・平26I問題5ア類)","q":"譲渡等承認請求者からの買取請求に応じて株式会社が当該譲渡等承認請求に係る譲渡制限株式を買い取る場合，当該買取りに関する事項の決定は，株主総会の普通決議によらなければならない。","a":false,"c":"140条1項2項,309条2項1号。","e":"譲渡等承認請求者からの買取請求に応じて株式会社が当該譲渡等承認請求に係る譲渡制限株式を買い取る場合，当該買取りに関する事項の決定は，特定の者からの自己株式の取得となるので，株主総会の特別決議によらなければならない。"},{"l":15,"m":"株式譲渡","sb":"定款による譲渡制限","i":"B","r":"","q":"譲渡等承認請求者からの買取請求に応じて株式会社が当該譲渡等承認請求に係る譲渡制限株式を買い取る場合，当該譲渡承認請求者以外の株主の全部が当該買取りに関する事項の決定をする株主総会において議決権を行使することができない場合を除き，当該譲渡等承認請求者は当該株主総会において議決権を行使することができない。","a":true,"c":"140条1項2項3項。","e":"決議の公正を図るため，原則として，譲渡等承認請求者は当該買取りに関する事項の決定をする株主総会において議決権を行使することができない。ただし，当該譲渡承認請求者以外の株主の全部が当該株主総会において議決権を行使することができない場合は，この限りではない。"},{"l":16,"m":"株式譲渡","sb":"定款による譲渡制限","i":"B","r":"","q":"譲渡等承認請求者からの買取請求があった場合において，株式会社は，当該譲渡等承認請求に係る譲渡制限株式の全部または一部を買い取る者を指定することができる。","a":true,"c":"140条4項。","e":"この場合，対象株式の一部を指定買取人が買取り，その残りを株式会社が買い取ることも認められる。"},{"l":17,"m":"株式譲渡","sb":"定款による譲渡制限","i":"B","r":"(平26I問題5イ)","q":"取締役会設置会社における指定買取人の指定は，定款に別段の定めがある場合を除き，株主総会の特別決議によらなければならない。","a":false,"c":"140条5項。","e":"取締役会設置会社における指定買取人の指定は，原則として，取締役会の決議によらなければならない。また，取締役会非設置会社においては，株主総会の特別決議が必要となる（309 条２項１号）。ただし，取締役会設置会社か否かに関係なく，定款で別段の定めを設けることが認められる。"},{"l":18,"m":"株式譲渡","sb":"定款による譲渡制限","i":"C","r":"","q":"株式会社は，譲渡等承認請求者からの買取請求に応じて譲渡制限株式を買い取る決定をした場合には，譲渡等承認請求者に対し，決定事項を通知しなければならない。","a":true,"c":"141条1項。","e":"なお，株式会社が，譲渡等承認請求を承認するか否かの通知の日から40日以内（定款で短縮可）に，当該通知をしなかった場合（譲渡等承認請求を承認するか否かの通知の日から 10 日以内に指定買取人が買取りの通知をした場合を除く）は，株式会社と譲渡等承認請求者との合意により別段の定めがある場合を除き，譲渡等の承認をする旨の決定をしたものとみなす（145条２号）。"},{"l":19,"m":"株式譲渡","sb":"定款による譲渡制限","i":"C","r":"","q":"株式会社が指定買取人を指定した場合，当該株式会社は，譲渡等承認請求者に対して，指定買取人を指定した旨を通知しなければならない。","a":false,"c":"142条1項。","e":"指定買取人は，指定を受けたときは，指定買取人として指定を受けた旨等を，譲渡等承認請求者に対して通知しなければならない。なお，指定買取人が，譲渡等承認請求を承認するか否かの通知の日から10日以内（定款で短縮可）に買取りの通知をしなかった場合は，株式会社と譲渡等承認請求者との合意により別段の定めがある場合を除き，譲渡等の承認をする旨の決定をしたものとみなす（145条２号）。"},{"l":20,"m":"株式譲渡","sb":"定款による譲渡制限","i":"A","r":"(令2II問題5エ・平26I問題5ウ類)","q":"譲渡等承認請求をした者は，当該請求に係る譲渡制限株式を指定買取人が買い取る旨の通知を受けた後は，当該株式の売買価格が決定されていない場合に限り，当該請求を撤回することができる。","a":false,"c":"143条。","e":"譲渡等承認請求者は，会社または指定買取人による通知を受けた後は，会社または指定買取人の承諾を得なければ，買取請求を撤回することができない。すなわち，通知を受けるまでは，買取請求の撤回は自由にすることができるが，会社または指定買取人が買取りに向けて整えている準備を無駄にしないよう，通知を受けた後は，会社または指定買取人の承諾を得なければ買取請求の撤回をすることができないのである。"},{"l":21,"m":"株式譲渡","sb":"定款による譲渡制限","i":"C","r":"","q":"株式会社が買取請求に応じて譲渡制限株式を買い取る場合の売買価格は，株式会社と譲渡等承認請求者との協議によって定めるが，協議が調わない場合は，株式会社または譲渡等承認請求者は，株式会社から買取りの通知があった日から20日以内に，裁判所に対し，売買価格の決定の申立てをしなければならない。","a":false,"c":"144条1項2項。","e":"売買価格は，株式会社と譲渡等承認請求者との協議によって定めるが，協議が調わない場合は，株式会社または譲渡等承認請求者は，株式会社から買取りの通知があった日から 20 日以内に，裁判所に対し，売買価格の決定の申立てをすることができる。そして，裁判所に対する売買価格の決定の申立てがない場合は，１株当たり純資産額に対象株式の数を乗じて得た額をもって売買価格とする（144条５項）。なお，当該規定は，指定買取人による買取りにも準用される（144条７項）。"},{"l":22,"m":"株式譲渡","sb":"定款による譲渡制限","i":"B","r":"","q":"最高裁判所の判例によれば，株式会社の承認を欠く譲渡制限株式の譲渡は，株式会社に対する関係においても，譲渡当事者間においても無効である。","a":false,"c":"最判昭48年6月15日。","e":"判例によれば，株式会社の承認を欠く譲渡制限株式の譲渡は，株式会社に対する関係では無効であるが，譲渡当事者間では有効である。"},{"l":23,"m":"株式譲渡","sb":"定款による譲渡制限","i":"C","r":"","q":"最高裁判所の判例によれば，取締役会設置会社において，一人会社の株主がその有する譲渡制限株式を他に譲渡した場合は，取締役会の決議がなくても，当該譲渡は会社との関係では有効であるとしている。","a":true,"c":"最判平5年3月30日。","e":"譲渡制限株式を発行する趣旨は，会社にとって好ましくない者が株主になり，会社の経営に参加されることを防ぎ，譲渡株主以外の株主の利益を保護することにある。したがって，一人株主がその保有する株式を譲渡する場合は，当該趣旨に反することはない。また，一人会社においては，株主総会の特別決議により定款変更をして（466条，309条２項11号），公開会社になることも一人株主の意向により可能であることも根拠とされる。"},{"l":24,"m":"株式譲渡","sb":"定款による譲渡制限","i":"B","r":"(令2II問題5イ)","q":"最高裁判所の判例の趣旨によれば，公開会社でない株式会社において，当該株式会社の承認を得ずになされた株式の譲渡は，当該譲渡の当事者間においては有効であるが，当該株式会社に対する関係では効力を生じないから，当該株式会社は当該株式の譲渡人を株主として扱う義務がある。","a":true,"c":"最判昭63年3月15日。","e":"判例によれば，株式会社に対する関係では譲渡は無効であることを前提として，当該株式会社は譲渡人を株主として取扱う義務があるため，譲渡人は当該株式会社に対してなお株主としての地位を有し，権利行使することができる。したがって，株式会社側から譲受人を株主と認めて権利行使させることはできない。"},{"l":1,"m":"自己株式の取得","sb":"株主との合意による自己株式取得","i":"B","r":"","q":"株式会社が株主との合意により自己株式を有償で取得する場合には，原則として，あらかじめ，株主総会の決議によって，取得する株式の数，株式を取得するのと引換えに交付する金銭等の内容およびその総額，株式を取得することができる期間を定めなければならない。","a":true,"c":"156条1項。","e":"株主総会における授権決議である。授権決議は，定時株主総会に限られず，臨時株主総会であってもよい。"},{"l":2,"m":"自己株式の取得","sb":"株主との合意による自己株式取得","i":"B","r":"","q":"株式会社が株主との合意により自己株式を有償で取得する場合には，原則として，あらかじめ，株主総会の決議によって，株式を取得することができる期間を定めなければならないが，当該期間は１年間を超えることができない。","a":true,"c":"156条1項柱書ただし書,3号。","e":""},{"l":3,"m":"自己株式の取得","sb":"株主との合意による自己株式取得","i":"B","r":"(平27I問題4イ類)","q":"株式会社が株主との合意により自己の株式を無償で取得する場合，株主総会の決議が必要である。","a":false,"c":"","e":"自己株式を無償で取得することは認められている（155条13号，会社法施行規則27条１号）。しかし，156条～165 条は，株主との合意による自己株式の有償取得を対象としていることから，無償で取得する場合，株主総会の決議は不要である。"},{"l":4,"m":"自己株式の取得","sb":"株主との合意による自己株式取得","i":"B","r":"","q":"株式会社は，市場取引により自己株式を取得することができない。","a":false,"c":"165条1項。","e":"株式会社が株主との合意によって自己株式を有償で取得する場合には，① 株主全員に申込みの機会を与える場合（いわゆる「ミニ公開買付け」）（156条～159条），② 特定の株主から取得する場合（160条～164条），③ 市場取引または金融商品取引法による公開買付けにより取得する場合（165条）がある。"},{"l":5,"m":"自己株式の取得","sb":"株主との合意による自己株式取得","i":"A","r":"(平23II問題5ア)","q":"株式会社が特定の株主から自己株式を有償で取得する場合，取得する株式が市場価格のある株式であるときは，自己株式の取得に関する事項の決定を，株主総会の普通決議で行うことができる。","a":false,"c":"156条1項,160条1項,309条2項2号。","e":"株式会社が特定の株主から自己株式を有償で取得する場合，他の株主にも平等に投下資本の回収機会を与えるという趣旨で，株主総会の授権決議は特別決議が要求されている。"},{"l":6,"m":"自己株式の取得","sb":"株主との合意による自己株式取得","i":"B","r":"","q":"株式会社は，特定の株主から自己株式を有償で取得することを決定する株主総会の決議に先立ち，株主に対して，当該特定の株主に自己を加えたものを当該決議の議案とすることができる旨を通知することができる。","a":false,"c":"160条2項3項。","e":"株式会社は，特定の株主から自己株式を取得する株主総会の決議に先立ち，株主に対して，当該特定の株主に自己を加えたものを当該決議の議案とすることができる旨を通知しなければならない。他の株主にも平等に投下資本の回収機会を与える趣旨である。"},{"l":7,"m":"自己株式の取得","sb":"株主との合意による自己株式取得","i":"B","r":"","q":"株式会社が特定の株主から自己株式を有償で取得することを決定する株主総会において，当該特定の株主は，いかなる場合であっても，議決権を行使することができない。","a":false,"c":"160条4項ただし書。","e":"株式会社が特定の株主から自己株式を取得する場合において，自己株式の売主である株主は，決議の公平性を維持するという観点から，当該決議において議決権を行使することができない。ただし，当該特定の株主以外の株主の全部が当該株主総会において議決権を行使することができない場合は，この限りではない。"},{"l":8,"m":"自己株式の取得","sb":"株主との合意による自己株式取得","i":"C","r":"(令5I問題5ア類)","q":"株式会社が特定の株主から有償で取得する自己株式が市場価格のある株式であり，当該株式会社が株主に支払う対価が市場価格を超えない場合は，他の株主に売主追加請求権を認める必要はない。","a":true,"c":"161条。","e":"市場価格のある株式については，他の株主は市場で売却する機会を有しているため，投下資本の回収を行いたければ市場で売却すればよく，また，市場価格以下での取得は他の株主を害するおそれがないため，他の株主に売主追加請求権は認められない。"},{"l":9,"m":"自己株式の取得","sb":"株主との合意による自己株式取得","i":"C","r":"","q":"公開会社でない株式会社が株主の相続人その他の一般承継人（株主総会または種類株主総会において相続その他一般承継により取得した株式について議決権を行使していないものとする。）からその相続その他一般承継により取得した当該株式会社の株式を取得する場合には，他の株主に売主追加請求権を認める必要はない。","a":true,"c":"162条。","e":"非公開会社が株主の相続人その他の一般承継人からその相続その他の一般承継により取得した当該株式会社の株式を取得する場合には，他の株主に売主追加請求権を認める必要はない。なぜなら，非公開会社のような閉鎖的な会社においては，会社経営に関心がない相続人から株式を取得しなければならないという場面が考えられるが，その場合において，他の株主に売主追加請求権を認めなければならないのでは，株式会社が必要以上に資金を拠出しなければならないことになり，また，財源規制（461 条１項２号）により，当該相続人から株式を取得することができなくなる可能性があるからである。ただし，相続人その他の一般承継人が株主総会または種類株主総会において当該株式について議決権を行使した場合は，株式会社が株主の相続人その他の一般承継人からその相続その他一般承継により取得した当該株式会社の株式を取得する場合であっても，他の株主に売主追加請求権を認める必要がある。なぜなら，当該株主（相続人等）が株主として議決権の行使をした場合，当該相続人等は株主として会社に参加する意図を有しているといえるからである。"},{"l":10,"m":"自己株式の取得","sb":"株主との合意による自己株式取得","i":"C","r":"","q":"株式会社は，特定の株主から自己株式を有償で取得する場合であっても，他の株主に売主追加請求権を認めない旨を定款で定めることができる。","a":true,"c":"164条1項。","e":"なお，株式会社が，株式の発行後に定款を変更して当該株式について，特定の株主から自己株式を有償で取得する場合に他の株主に売主追加請求権を認めない旨の定款の定めを設けようとするときは，当該株式を有する株主全員の同意を得なければならない（164条２項）。また，種類株式が発行されている場合に，ある特定の種類株式の取得についてのみ，当該規定を設けることも可能である。"},{"l":11,"m":"自己株式の取得","sb":"株主との合意による自己株式取得","i":"A","r":"(令5I問題5エ類・平27I問題4ウ・平25II問題6ア類・平23II問題5イ)","q":"取締役会設置会社でない株式会社が，その子会社の有する当該株式会社の株式を有償で取得する場合には，自己の株式の取得に関する事項は，当該株式会社の取締役が決定することができる。","a":false,"c":"163条前段。","e":"株式会社がその子会社の有する当該株式会社の株式を取得する場合は，株主総会の普通決議（取締役会設置会社では取締役会決議）で決定する必要がある（309条１項）。親会社株式の取得は原則として禁止され，例外的に取得した場合であっても，相当の時期に処分しなければならないとされている（135 条）。しかし，親会社株式について流通性がない場合にはその処分が困難なことがあるし，市場価格があっても大量に取得した場合には市場に与える影響の大きさからその売却が困難となる場合もある。このような場合に，親会社が当該株式を取得することで子会社の親会社株式の処分が簡易かつ迅速に行えるようにするため，他の特定の株主からの取得による場合よりも規制が緩和されているのである。"},{"l":12,"m":"自己株式の取得","sb":"株主との合意による自己株式取得","i":"A","r":"","q":"株式会社がその子会社の有する当該株式会社の株式を有償で取得する場合は，他の株主に対して売主追加請求権を認める必要がある。","a":false,"c":"163条後段。","e":"株式会社がその子会社の有する当該株式会社の株式を取得する場合は，他の株主に対して売主追加請求権を認める必要はない。なお，この場合には，157条から160条までの規定は適用されないため，取締役会による具体的な取得事項の決定等は必ずしも必要ではなく，通常の業務執行と同様に業務執行担当者（代表取締役等）が授権決議に基づき取得することになる。"},{"l":13,"m":"自己株式の取得","sb":"株主との合意による自己株式取得","i":"A","r":"(平28II問題7ア・平25II問題6イ類)","q":"株式会社が，金融商品取引法上の公開買付けの方法により自己の株式を有償で取得するには，株主総会の特別決議によって，取得する株式の数や株式を取得することができる期間などの事項を決定しなければならない。","a":false,"c":"165条1項。","e":"市場取引または公開買付けの方法により自己株式を取得する場合でも，株主総会の決議により，156 条１項各号の事項を定めなければならない。ただし，当該方法により自己株式を取得する場合は，株主全員に申込みの機会が与えられていることから，授権決議は普通決議で足りる。また，取締役会設置会社は，市場取引または公開買付けの方法により当該株式会社の株式を取得することを取締役会の決議によって定めることができる旨を定款で定めることができる（165条２項）。この場合，156条１項各号の事項は株主総会または取締役会の決議で定めることになる（同条３項）。"},{"l":14,"m":"自己株式の取得","sb":"株主との合意による自己株式取得","i":"A","r":"","q":"株式会社が市場取引または公開買付けの方法により自己株式を有償で取得する場合には，他の株主に売主追加請求権を認める必要はない。","a":true,"c":"165条1項。","e":"市場取引または公開買付けにより自己株式を取得する場合は，株主全員に申込みの機会が与えられていることから，他の株主に売主追加請求権を認める必要はない。また，この場合には157条から160条までの規定は適用されないため，取締役会による具体的な取得事項の決定等は必ずしも必要ではなく，授権手続後は，市場取引の場合は通常の業務執行と同様に業務執行担当者（代表取締役等）の決定により，公開買付けの場合は金融商品取引法の規定にしたがって自己株式を取得する。"},{"l":15,"m":"自己株式の取得","sb":"株主との合意による自己株式取得","i":"B","r":"","q":"取締役会設置会社において，市場取引または公開買付けにより自己株式を取得することを取締役会の決議によって定めることができる旨を定款で定めた場合は，株主総会の決議によって当該取得の決定をすることができない。","a":false,"c":"165条3項。","e":"当該定款の定めは，株主総会の決議による取得を排除するものではないため，原則通り株主総会の決議に基づいて取得することも可能である。"},{"l":16,"m":"自己株式の取得","sb":"株主との合意による自己株式取得","i":"A","r":"","q":"取締役会設置会社においては，定款に別段の定めがなくとも，市場取引または公開買付けにより自己株式を取得することを取締役会の決議によって定めることができる。","a":false,"c":"165条2項。","e":"取締役会設置会社は，市場取引または公開買付けにより自己株式を取得することを取締役会の決議によって定めることができる旨を定款で定めることができる。このような規定が認められる理由は，事前に定款による授権がある場合には，機動的な自己株式の取得を可能とするために取締役会の決議による取得を認めるべきだからである。したがって，定款に上記の定めがない場合は，株主総会の決議によって取得に関する事項を決定しなければならない。この場合は，株主全員に売渡す機会が与えられていることから普通決議で足りる。"},{"l":17,"m":"自己株式の取得","sb":"株主との合意による自己株式取得","i":"A","r":"(平28II問題7ウ・平23II問題5エ類)","q":"株式会社は，自己の株式を取得した場合には，当該株式を相当の期間内に消却または処分しなければならない。","a":false,"c":"","e":"自己株式の取得には，取得目的，取得数量，保有期間等の規制はなされていないため，相当の期間に消却または処分する義務はない。"},{"l":1,"m":"自己株式の取得","sb":"取得請求権付株式の取得","i":"C","r":"","q":"株式会社は，取得請求権付株式を有する株主による取得請求の日に，当該取得請求権付株式を取得する。","a":true,"c":"167条1項。","e":""},{"l":2,"m":"自己株式の取得","sb":"取得請求権付株式の取得","i":"C","r":"","q":"株券発行会社の株主がその有する取得請求権付株式について取得請求をしようとするときは，当該取得請求権付株式に係る株券が発行されていない場合を除き，当該取得請求権付株式に係る株券を株券発行会社に提出しなければならない。","a":true,"c":"166条3項。","e":""},{"l":3,"m":"自己株式の取得","sb":"取得請求権付株式の取得","i":"C","r":"","q":"取得請求権付株式の取得の対価が当該株式会社の他の株式である場合において，交付される株式に１株に満たない端数があるときは，当該端数は切り捨てるものとする。この場合には，当該株主には１株当たりの純資産額にその端数を乗じて得た額に相当する金銭を交付しなければならない。","a":false,"c":"167条3項。","e":"前文は正しい。しかし，当該株式が市場価格のある株式である場合には，定款に別段の定めがある場合を除き，当該株式１株の市場価格として法務省令で定める方法により算定される額にその端数を乗じて得た額に相当する金銭を交付しなければならない。"},{"l":1,"m":"自己株式の取得","sb":"取得条項付株式の取得","i":"C","r":"","q":"株式会社が別に定める日が到来することをもって取得事由とする定めがある場合，株式会社は，定款に別段の定めがある場合を除き，その日を株主総会の特別決議によって定めなければならない。","a":false,"c":"168条1項,309条1項。","e":"株式会社が別に定める日が到来することをもって取得事由とする定めがある場合，株式会社は，定款に別段の定めがある場合を除き，その日を株主総会の普通決議（取締役会設置会社では取締役会決議）によって定めなければならない。"},{"l":2,"m":"自己株式の取得","sb":"取得条項付株式の取得","i":"C","r":"","q":"株式会社が別に定める日が到来することをもって取得事由とする定めがある場合であって，その取得の日を定めたときは，当該株式会社は，取得条項付株式の株主に対して，その取得の日までに当該日を通知または公告しなければならない。","a":false,"c":"168条2項。","e":"株式会社が別に定める日が到来することをもって取得事由とする定めがある場合であって，その取得の日を定めたときは，当該株式会社は，取得条項付株式の株主に対して，その取得の日の２週間前までに，当該日を通知しなければならない。また，登録株式質権者がいる場合は，当該登録株式質権者に対しても当該通知をすることを要する。なお，当該通知は，公告をもって代えることができる（168条３項）。ここで，取得の日の２週間前までという事前の通知が要求されている理由は，取得条項付株式の取得は，当該株式を有する株主の投資判断等に影響するため，株主に対応する時間的猶予を与える必要があるからである。"},{"l":3,"m":"自己株式の取得","sb":"取得条項付株式の取得","i":"C","r":"","q":"株式会社が取得条項付株式について当該株式の一部を取得する決定をした場合は，取得することが決定された株式を有する株主に対し，当該決定の日から２週間以内に，当該取得条項付株式を取得する旨を通知または公告しなければならない。","a":false,"c":"169条3項。","e":"株式会社が取得条項付株式について当該株式の一部を取得する決定をした場合は，取得することが決定された株式を有する株主に対し，直ちに，当該取得条項付株式を取得する旨を通知しなければならない。また，登録株式質権者がいる場合は，当該登録株式質権者に対しても当該通知をすることを要する。なお，当該通知は，公告をもって代えることができる（169条４項）。ここで，取得決定後，直ちに通知することが要求されている理由は，取得条項付株式の取得は，当該株式を有する株主の投資判断等に影響するためである。"},{"l":4,"m":"自己株式の取得","sb":"取得条項付株式の取得","i":"C","r":"","q":"株式会社が取得条項付株式の全部を取得する場合，当該株式会社は，取得事由が生じた日に当該株式を取得する。","a":true,"c":"170条1項柱書。","e":"なお，取得事由が生じたときに取得条項付株式の一部を取得する定めがある場合には，取得対象株式について株主等に周知させる必要があるため，取得事由が生じた日と取得条項付株式の株主およびその登録株式質権者に対する通知・公告の日から２週間を経過した日のいずれか遅い日に，取得条項付株式を取得することになる（170 条１項柱書かっこ書各号）。"},{"l":1,"m":"自己株式の取得","sb":"全部取得条項付種類株式の取得","i":"B","r":"","q":"株式会社は，全部取得条項付種類株式を取得するのと引換えに金銭等を交付しなければならない。","a":false,"c":"171条1項1号参照。","e":"全部取得条項付種類株式の取得の対価について特に制限はなく，無償による取得も可能である。"},{"l":2,"m":"自己株式の取得","sb":"全部取得条項付種類株式の取得","i":"C","r":"","q":"全部取得条項付種類株式を取得する株式会社の株主は，当該株式会社に対して，その営業時間内は，いつでも，取得日等一定の事項を記載した書面の閲覧を請求することができる。","a":true,"c":"171条の2第2項本文,1号。","e":"事前開示手続を設けた趣旨は，キャッシュ・アウトされる株主に対して，当該取得の是非についての判断材料として十分な情報提供をすることにある。"},{"l":3,"m":"自己株式の取得","sb":"全部取得条項付種類株式の取得","i":"A","r":"(平25II問題6ウ)","q":"株式会社が，金銭を取得対価として当該株式会社の発行する全部取得条項付種類株式の全部を取得する場合には，その額または算定方法の決定は，取締役会の決議による。","a":false,"c":"171条1項1号ホ。","e":"全部取得条項付種類株式の取得は，株主総会の特別決議によらなければならない（309条２項３号）。"},{"l":4,"m":"自己株式の取得","sb":"全部取得条項付種類株式の取得","i":"B","r":"","q":"取締役は，全部取得条項付種類株式を取得する株主総会において，全部取得条項付種類株式の全部を取得することを必要とする理由を説明しなければならない。","a":true,"c":"171条3項。","e":"全部取得条項付種類株式の取得は，株主総会の決議により当該株主から株主たる地位を奪うことになるので，その理由を説明する必要があるためである。"},{"l":5,"m":"自己株式の取得","sb":"全部取得条項付種類株式の取得","i":"B","r":"","q":"株式会社が全部取得条項付種類株式を取得する場合は，株主総会の特別決議のほか，当該全部取得条項付種類株式を有する種類株主を構成員とする種類株主総会の特別決議が必要である。","a":false,"c":"","e":"種類株式発行会社がある種類の株式を全部取得条項付種類株式とする定款の変更は，株主総会の特別決議のほかに，当該種類の株式の種類株主を構成員とする種類株主総会の特別決議が必要であるが（111 条２項，324 条２項１号），全部取得条項付種類株式の取得時には種類株主総会の決議は要求されていない。"},{"l":6,"m":"自己株式の取得","sb":"全部取得条項付種類株式の取得","i":"B","r":"","q":"株式会社が全部取得条項付種類株式を取得する場合，当該全部取得条項付種類株式の株主については，取得価格に不満がある場合であっても，裁判所に対して価格の決定の申立てをすることは認められない。","a":false,"c":"172条1項。","e":"① 当該株主総会に先立って，当該株式会社による全部取得条項付種類株式の取得に反対する旨を当該株式会社に対して通知し，かつ，当該株主総会において当該取得に反対した株主，および，② 当該株主総会において議決権を行使することができない株主は，裁判所に対し，全部取得条項付種類株式の取得の価格の決定の申立てをすることができる。このような申立てが認められている理由は，全部取得条項付種類株式の取得価格は，発行時に定めることが要求されておらず，取得時に定めることが要求されているため，当該取得価格が不服である株主を保護する必要があるためである。"},{"l":7,"m":"自己株式の取得","sb":"全部取得条項付種類株式の取得","i":"B","r":"","q":"全部取得条項付種類株式の取得に関する事項を定めた場合には，取得に関する事項を定める株主総会において議決権を行使することができない株主は，取得日の 20 日前の日から取得日の前日までの間に，裁判所に対し，株式会社による全部取得条項付種類株式の取得の価格の決定の申立てをすることができる。","a":true,"c":"172条1項2号。","e":"改正前会社法では，全部取得条項付種類株式の取得の価格の決定の申立期間は，当該取得に係る決議をした株主総会の日から 20 日以内とされていたが，当該株主総会の日と取得日との関係については，会社法上特段の規律は存在しなかったため，取得日が株主総会の日から 20 日以内に設定される場合には，申立期間の満了前に取得日が到来することがあり得た。しかし，取得日以降に取得価格決定の申立てがされた場合は，いったん株主に交付された対価の返還が必要となるという事態が生じることとなり，法律関係が複雑化するおそれがあるとの指摘がなされていた。そこで，改正法は，組織再編行為等における反対株主の株式買取請求権を参考にして，全部取得条項付種類株式の取得の価格の決定の申立てを取得日の 20 日前の日から取得日の前日までの間にしなければならないものと定めたのである。"},{"l":8,"m":"自己株式の取得","sb":"全部取得条項付種類株式の取得","i":"B","r":"","q":"株式会社は，取得日の 20 日前までに，全部取得条項付種類株式の株主に対し，当該全部取得条項付種類株式の全部を取得する旨を通知または公告しなければならない。","a":true,"c":"172条2項3項。","e":"裁判所に対する価格の決定の申立ては，取得を決定する株主総会の決議において議決権を行使することができない株主にも認められている（172 条１項２号）。しかし，改正前会社法においては，取得をする旨の通知または公告の制度が設けられていなかったため，株主が取得の事実を知らないまま申立期間が経過する可能性があった。そこで，改正法は，全部取得条項付種類株式の株主への通知または公告を求めたのである。"},{"l":9,"m":"自己株式の取得","sb":"全部取得条項付種類株式の取得","i":"B","r":"(平30I問題6ア)","q":"全部取得条項付種類株式を発行した種類株式発行会社による全部取得条項付種類株式の取得が法令または定款に違反する場合において，株主が不利益を受けるおそれがあるときは，株主は，株式会社に対し，当該全部取得条項付種類株式の取得をやめることを請求することができる。","a":true,"c":"171条の3。","e":"全部取得条項付種類株式の取得の無効を争う手段としては，株主総会の決議取消しの訴えがあるが，事後的に取得の効力が否定されると法律関係を不安定にするおそれがある。そうであれば，株主が，取得の効力発生前にその差止めを請求することができることとするのが相当である。そこで，会社法は，株主に全部取得条項付種類株式の取得差止請求を認めたのである。"},{"l":10,"m":"自己株式の取得","sb":"全部取得条項付種類株式の取得","i":"C","r":"","q":"全部取得条項付種類株式の取得の対価が当該株式を発行している株式会社の株式であると定められた場合は，当該株式会社以外の全部取得条項付種類株式の株主は，取得日に，株主総会の決議による定めに従い，当該株式会社の株主となる。","a":false,"c":"173条2項。","e":"株式会社は，株主総会の特別決議で定めた取得日に，全部取得条項付種類株式の全部を取得する（173 条１項）。そして，当該株式会社以外の全部取得条項付種類株式の株主（裁判所に対する価格の決定の申立て（172 条１項）をした株主を除く）は，それぞれ対価の交付を受けることとなる。取得の価格の決定の申立てをした株主については，取得対価にかかわらず金銭による処理が予定されており，このような株主に対して取得日に取得対価が交付されることは合理的ではないと考えられるためである。"},{"l":11,"m":"自己株式の取得","sb":"全部取得条項付種類株式の取得","i":"C","r":"","q":"全部取得条項付種類株式を取得した株式会社の株主に限り，当該株式会社に対して，株式会社が取得した全部取得条項付種類株式の数その他の全部取得条項付種類株式の取得に関する事項として法務省令で定める事項を記載した書面を閲覧の請求をすることができる。","a":false,"c":"173条の2第3項本文,1号。","e":"① 全部取得条項付種類株式を取得した株式会社の株主，または，②取得日に全部取得条項付種類株式の株主であった者は，当該株式会社に対して，その営業時間内は，いつでも，事後開示事項の内容を記載または記録した書面または電磁的記録の閲覧もしくは謄本または抄本の交付を請求することができる。事後開示手続を設けた趣旨は，全部取得条項付種類株式の取得に関して，株主総会の決議取消しの訴え（831 条１項）等を提起するか否かの判断材料を株主に提供することにある。すなわち，全部取得条項付種類株式の取得がキャッシュ・アウトに利用される場合は，キャッシュ・アウトにより株式を失った者も，閲覧等を請求することができるのである。"},{"l":12,"m":"自己株式の取得","sb":"全部取得条項付種類株式の取得","i":"B","r":"(平27II問題4ウ)","q":"株式会社が全部取得条項付種類株式を株主総会の決議に基づいて取得した場合には，当該決議において別段の定めをしたときを除き，当該株式会社は取得した当該全部取得条項付種類株式のすべてを相当の期間内に消却しなければならない。","a":false,"c":"","e":"株式会社が全部取得条項付種類株式を取得した場合であっても消却義務はない。"},{"l":1,"m":"自己株式の取得","sb":"譲渡制限株式の相続人等に対する売渡請求による取得手続","i":"A","r":"(令4問題6ア類・平23I問題5エ)","q":"公開会社は，相続その他の一般承継により当該株式会社の譲渡制限株式を取得した者に対し，当該株式を当該株式会社に売り渡すことを請求することができる旨を定款で定めることができる。","a":true,"c":"174条。","e":"公開会社，非公開会社を問わず，相続その他の一般承継により当該株式会社の譲渡制限株式を取得した者に対し，当該株式を当該株式会社に売り渡すことを請求することができる旨を定款で定めることができる。譲渡制限株式の制限は，売買等の特定承継にのみ適用され，相続等の一般承継には適用されない（134 条４号）。しかし，会社にとって好ましくない者の参加を防止し，もって会社経営の安定を図るという趣旨は，一般承継の場合にも同様に妥当するため，相続人から合意が得られてなくてもその株式を強制的に取得することができる制度を設けたのである。この点，相続人等との合意による取得の場合の特則（他の株主に売主追加請求権を認める必要がない）が，非公開会社に限られるのと異なることに注意する必要がある（162条１号）。"},{"l":2,"m":"自己株式の取得","sb":"譲渡制限株式の相続人等に対する売渡請求による取得手続","i":"C","r":"(令4問題6イ類)","q":"取締役会設置会社が，譲渡制限株式の相続人等に対して売渡しの請求をすることができる定款の定めに基づき売渡請求をしようとする場合は，その都度，取締役会の決議によって，請求する株式の数，請求の相手方となる株主の氏名または名称を定めなければならない。","a":false,"c":"175条1項,309条2項3号。","e":"株式会社が，譲渡制限株式の相続人等に対して売渡しの請求をすることができる定款の定めに基づき売渡請求しようとする場合は，その都度，株主総会の特別決議によって，請求する株式の数，請求の相手方となる株主の氏名または名称を定めなければならない。これは，特定の者からの自己株式の取得となるためである。"},{"l":3,"m":"自己株式の取得","sb":"譲渡制限株式の相続人等に対する売渡請求による取得手続","i":"C","r":"","q":"相続人等に対する売渡請求の対象となる株式を有する者は，当該者以外の株主の全部が当該株主総会において議決権を行使することができない場合を除き，当該株主総会の決議において議決権を行使することができない。","a":true,"c":"175条2項。","e":"決議の公正を図る必要があるためである。"},{"l":4,"m":"自己株式の取得","sb":"譲渡制限株式の相続人等に対する売渡請求による取得手続","i":"C","r":"(令4問題6エ類)","q":"株式会社は，当該株式会社が譲渡制限株式の相続その他の一般承継があったことを知った日から１年を経過した場合は，相続人等に対する売渡請求をすることができない。","a":true,"c":"176条1項ただし書。","e":"当該期間制限は，相続人等に対する売渡請求が株主との合意がなくてもその株式を取得することができる制度であることから，売渡請求の相手方となりうる株主の利益を保護するために設けられている。"},{"l":5,"m":"自己株式の取得","sb":"譲渡制限株式の相続人等に対する売渡請求による取得手続","i":"C","r":"","q":"株式会社は，譲渡制限株式の相続人等に対する売渡請求を撤回することができない。","a":false,"c":"176条3項。","e":"株式会社は，いつでも，譲渡制限株式の相続人等に対する売渡請求を撤回することができる。"},{"l":6,"m":"自己株式の取得","sb":"譲渡制限株式の相続人等に対する売渡請求による取得手続","i":"C","r":"","q":"譲渡制限株式の相続人等に対する売渡請求があった日から 20 日以内に売買価格についての協議が整わず，かつ，当該期間内に裁判所に対する売買価格決定の申立てがないときは，当該売渡請求はその効力を失う。","a":true,"c":"177条1項2項5項。","e":""},{"l":1,"m":"自己株式の取得","sb":"財源規制","i":"A","r":"(平23II問題5ウ類・平20問題5エ類)","q":"取得請求権付株式の株主は，株式会社に対して，当該取得請求権付株式を取得する場合の対価として交付する当該株式会社の発行する株式以外の財産の帳簿価額が当該請求の日における分配可能額を超えているときであっても，その有する株式を取得することを請求することができる。","a":false,"c":"166条1項ただし書。","e":"取得請求権付株式の取得については，財源規制がある。自己株式の有償取得は，実質的には株主への出資の払い戻しと同様の結果となり，株主が有限責任（104 条）しか負わない株式会社においては，これを無制限に認めてしまうと資本維持の原則に反し，会社債権者を害するおそれがあるのである。なお，対価が他の種類の株式である場合は，会社財産の減少を伴わないため，財源規制は課されない。"},{"l":2,"m":"自己株式の取得","sb":"財源規制","i":"A","r":"","q":"取得条項付株式を取得する場合の対価として交付する当該取得条項付株式を発行する株式会社の株式以外の財産の帳簿価額が，取得事由が生じた日における分配可能額を超えているときは，当該株式会社は，当該取得条項付株式を取得することができない。","a":true,"c":"170条5項。","e":""},{"l":3,"m":"自己株式の取得","sb":"財源規制","i":"A","r":"(令6II問題14ア・平23II問題15ア・平20問題5ア)","q":"譲渡制限株式の譲渡を承認しない場合の買取請求に応じた自己株式の取得により株主に対して交付する金銭等の帳簿価額の総額は，その効力が発生する日における分配可能額を超えてはならない。","a":true,"c":"461条1項1号。","e":"取得請求権付株式または取得条項付株式を取得する場合以外で，自己株式を有償取得した場合（以下の(ⅰ)～(ⅵ)まで）に株主に対して交付する金銭等（当該株式会社の株式を除く）の帳簿価額の総額は，自己株式取得の効力が発生した日における分配可能額（461条２項）を超えてはならない。(ⅰ) 譲渡制限株式の譲渡を承認しない場合の買取請求による取得（140条以下）(ⅱ) 株主との合意による取得（156条以下）(ⅲ) 全部取得条項付種類株式の取得（171条～173条）(ⅳ) 譲渡制限株式の相続人等に対する売渡請求による取得（174条～177条）(ⅴ) 所在不明株主の株式の買取りによる取得（197条３項４項）(ⅵ) 端数処理手続における株式の買取りによる取得（234条，235条）"},{"l":4,"m":"自己株式の取得","sb":"財源規制","i":"A","r":"(平30I問題15ア類・平28II問題7イ類・平27I問題4エ類・平20問題5ウ類)","q":"株主との合意による自己株式の有償取得により株主に対して交付する金銭等の帳簿価額の総額は，その効力が発生する日における分配可能額を超えてはならない。","a":true,"c":"461条1項2号3号。","e":"上記問題３の解説参照。"},{"l":5,"m":"自己株式の取得","sb":"財源規制","i":"A","r":"(令4問題6ウ類・平30I問題15ウ)","q":"相続により株式会社の譲渡制限株式を取得した者に対し，当該株式会社が，定款の定めおよび株主総会の決議に基づき，当該株式を当該株式会社に売り渡すことを請求した場合において，当該請求に基づき，当該株式会社が当該株式を買い取る行為により株主に対して交付する金銭等（当該株式会社の株式を除く。）の帳簿価額の総額が，当該行為がその効力を生ずる日における分配可能額を超えてはならない。","a":true,"c":"461条1項5号。","e":"上記問題３の解説参照。"},{"l":6,"m":"自己株式の取得","sb":"財源規制","i":"A","r":"(平30I問題15エ・平23II問題15イ類)","q":"株式会社が，株主の請求により，その有する単元未満株式を買い取る行為により株主に対して交付する金銭等（当該株式会社の株式を除く。）の帳簿価額の総額が，当該行為がその効力を生ずる日における分配可能額を超えてはならない。","a":false,"c":"461条1項参照。","e":"単元未満株式買取請求により，単元未満株式を買い取る行為は，一般的に買取代金がさほど高額にならないし，株主の投下資本回収を保障する必要性が高いことから，財源規制の対象とならない。"},{"l":7,"m":"自己株式の取得","sb":"財源規制","i":"A","r":"","q":"吸収合併に伴う自己株式の取得により株主に対して交付する金銭等の帳簿価額の総額は，その効力が発生する日における分配可能額を超えてはならない。","a":false,"c":"461条1項参照。","e":"吸収合併に伴う自己株式の取得は，債権者異議手続が設けられているため，財源規制は課せられていない。なお，吸収分割に伴う自己株式の取得も同様である。"},{"l":8,"m":"自己株式の取得","sb":"財源規制","i":"A","r":"(平30I問題15イ)","q":"株式会社が，他の会社の事業の全部を譲り受ける場合において，当該他の会社が有する当該株式会社の株式を取得する行為により株主に対して交付する金銭等（当該株式会社の株式を除く。）の帳簿価額の総額が，当該行為がその効力を生ずる日における分配可能額を超えてはならない。","a":false,"c":"461条1項参照。","e":"他の会社の事業の全部の譲受けに伴う自己株式の取得はやむを得ない取得であるため，財源規制の対象とならない。"},{"l":9,"m":"自己株式の取得","sb":"財源規制","i":"A","r":"(令4I問題15ウエ類・平25I問題16エ類・平20問題5イ類)","q":"吸収分割契約にかかる反対株主の株式買取請求に伴う自己株式の取得により株主に対して交付する金銭等の帳簿価額の総額は，その効力が発生する日における分配可能額を超えてはならない。","a":false,"c":"461条1項参照。","e":"組織再編行為等にかかる反対株主の株式買取請求による自己株式の取得は，反対株主の投下資本回収という利益を保護するため，財源規制は課せられていない。"},{"l":10,"m":"自己株式の取得","sb":"財源規制","i":"A","r":"","q":"株主との合意による自己株式の有償取得がその効力発生日における分配可能額を超える場合は，金銭等を受領した株主および当該取得に関する職務を行った業務執行者等は，当該株式会社に対し，連帯して，交付した金銭等のうち分配可能額を超えた部分に相当する金銭を支払う義務を負う。","a":false,"c":"462条1項。","e":"株主との合意による自己株式の取得が，その効力発生日における分配可能額を超える場合は，金銭等を受領した株主および当該取得に関する職務を行った業務執行者，株主総会または取締役会に議案を提出した取締役等は，当該株式会社に対し，連帯して，交付を受けた金銭等に相当する金銭を支払う義務を負う。すなわち，分配可能額の超過額の支払責任ではなく，交付を受けた金銭等の全額に相当する金銭を支払う義務を負うのである。"},{"l":11,"m":"自己株式の取得","sb":"財源規制","i":"A","r":"","q":"譲渡制限株式の相続人等に対する売渡請求による自己株式の取得がその効力発生日における分配可能額を超える場合，金銭等を受領した株主が分配可能額を超えていることについて善意であるならば，当該株主は，当該株式会社に対して，交付を受けた金銭等に相当する金銭を支払う義務を負わない。","a":false,"c":"462条1項2項。","e":"財源規制違反の株主の株式会社に対する支払責任は，無過失責任である。したがって，金銭等を受領した株主が分配可能額を超えていることについて善意である場合でも，当該株主は，当該株式会社に対して，交付を受けた金銭等に相当する金銭を支払わなければならない。"},{"l":12,"m":"自己株式の取得","sb":"財源規制","i":"A","r":"","q":"譲渡制限株式の譲渡を承認しない場合の買取請求に応じた自己株式の取得がその効力発生日における分配可能額を超える場合であっても，当該自己株式の取得に関する職務を行った業務執行者がその職務を行うについて注意を怠らなかったことを証明したときは，当該株式会社に対して，株主が交付を受けた金銭等を支払う義務を負わない。","a":true,"c":"462条1項2項。","e":"株主以外の業務執行者，株主総会または取締役会に議案を提出した取締役等の財源規制違反の責任は，立証責任の転換された過失責任である。"},{"l":13,"m":"自己株式の取得","sb":"財源規制","i":"A","r":"","q":"株式会社における取得条項付株式の取得が取得事由の生じた日における分配可能額を超える場合は，当該取得に関する職務を行った業務執行者等は，当該株式会社に対し，連帯して，取得条項付株式を有する株主が交付を受けた金銭等に相当する金銭を支払う義務を負う。","a":false,"c":"462条1項,461条1項参照。","e":"株式会社における取得条項付株式の取得が取得事由の生じた日における分配可能額を超える場合は，当該取得に関する職務を行った業務執行者等は，当該株式会社に対し，連帯して，取得条項付株式を有する株主が交付を受けた金銭等に相当する金銭を支払う義務を負わない。株主との合意による自己株式取得等は，取締役等の主導の下で行われるため，財源規制に違反した場合は取締役等に462条の責任を負わせるべきである。これに対して，取得条項付株式の取得は取得事由の定め方によっては取締役の意思に関わらず行われるため，取締役等に462条の責任を負わせるのは適当ではないのである。なお，取得請求権付株式の取得も株主の請求に基づくものであるため，取得条項付株式と同様に取締役等は462条の責任は負わない。"},{"l":14,"m":"自己株式の取得","sb":"財源規制","i":"A","r":"","q":"株式会社において，株主との合意により自己株式の取得をした事業年度末に欠損が生じた場合，自己株式の取得に関する業務執行者は，その職務を行うについて注意を怠らなかったことを証明した場合を除き，当該株式会社に対し，連帯して，当該欠損額（当該超過額が当該取得により株主に対して交付した金銭等の帳簿価額の総額を超える場合にあっては，当該帳簿価額の総額）を支払う義務を負う。","a":true,"c":"465条1項2号3号。","e":"当該責任は，立証責任が転換された過失責任である。"},{"l":15,"m":"自己株式の取得","sb":"財源規制","i":"B","r":"","q":"株式会社において，その発行する取得条項付株式を取得した事業年度末に欠損が生じた場合であっても，自己株式の取得に関する業務執行者は，当該株式会社に対し，当該欠損額を支払う義務を負わない。","a":false,"c":"465条1項5号。","e":"株式会社において，その発行する取得条項付株式を取得した事業年度末に欠損が生じた場合は，自己株式の取得に関する業務執行者等は，当該株式会社に対し，当該欠損額と当該取得により株主に対して交付した金銭等の帳簿価額の総額とのいずれか少ない額を支払う義務を負う。これは，取得請求権付株式の取得においても同様である（456 条１項４号）。"},{"l":16,"m":"自己株式の取得","sb":"財源規制","i":"C","r":"","q":"発行する全部の株式を譲渡制限株式とする定款の変更において，反対株主の株式買取請求に応じて自己株式を取得する場合，当該請求をした株主に対して支払った金銭の額が，支払日における分配可能額を超えるときは，当該株式の取得に関する職務を行った業務執行者は，その職務を行うについて注意を怠らなかったことを証明した場合を除き，連帯して，その超過額を支払う義務を負う。","a":true,"c":"464条1項。","e":"株式会社が，反対株主の株式買取請求（組織再編行為等に係るものを除く）の規定（116 条１項，182 条の４第１項）による請求に応じて株式を取得する場合において，当該請求をした株主に対して支払った金銭の額が，支払日における分配可能額を超えるときは，当該株式の取得に関する職務を行った業務執行者は，株式会社に対し，連帯して，その超過額を支払う義務を負う。ただし，その者がその職務を行うについて注意を怠らなかったことを証明した場合は，当該義務を免れることができる。すなわち，当該責任は，立証責任が転換された過失責任である。"},{"l":17,"m":"自己株式の取得","sb":"財源規制","i":"C","r":"","q":"発行済の種類株式について全部取得条項を設ける定款の変更において，反対株主の株式買取請求に応じて自己株式を取得する場合，当該請求をした株主に対して支払った金銭の額が，支払日における分配可能額を超えるときの業務執行者の責任は，総株主の同意によっても免除することができない。","a":false,"c":"464条2項。","e":"当該責任は，総株主の同意によって免除することが可能である。"},{"l":1,"m":"自己株式の取得","sb":"自己株式の法的地位","i":"A","r":"(平28II問題10ウ類・平22I問題9ア類)","q":"株式会社は，自己株式については，議決権を有しない。","a":true,"c":"308条2項。","e":"株式会社が自己株式について議決権を有するとなると，会社支配の公正の観点から望ましくないためである。なお，種類株主総会においても同様である（325条）。"},{"l":2,"m":"自己株式の取得","sb":"自己株式の法的地位","i":"B","r":"(令5II問題6イ)","q":"株式会社は，自己株式について，剰余金の配当をすることができない。","a":true,"c":"453条かっこ書。","e":"株式会社は，自己株式については，剰余金配当請求権を有しない。なぜなら，株式会社が自己株式について剰余金の配当を受けた場合，いったん計上した利益を翌事業年度の営業外収益に受取配当金として再度計上する結果となり，投資家に対して収益力に関する誤解を与えるおそれがあるためである。"},{"l":3,"m":"自己株式の取得","sb":"自己株式の法的地位","i":"B","r":"","q":"株式会社は，自己株式について，残余財産の分配をすることができない。","a":true,"c":"504条3項かっこ書。","e":"株式会社は，自己株式については，残余財産分配請求権を有しない。これを認めると，清算が終了しないからである。"},{"l":4,"m":"自己株式の取得","sb":"自己株式の法的地位","i":"A","r":"(平31I問題6ウ・平21問題6イ類)","q":"株式会社は，自己株式についても，株式無償割当てを行うことができる。","a":false,"c":"186条2項。","e":"株式会社は，自己株式については，株式無償割当てを受ける権利を有しない。これは，株式会社が自己株式を原始取得するのは妥当ではないからである。なお，同様の趣旨から，自己株式については，募集株式の割当てを受ける権利（202 条２項），募集新株予約権の割当てを受ける権利（241条２項），新株予約権無償割当てを受ける権利（278条２項）を有しない。"},{"l":5,"m":"自己株式の取得","sb":"自己株式の法的地位","i":"A","r":"(令5II問題6ア)","q":"株式会社は，自己株式について，新株予約権無償割当てをすることができない。","a":true,"c":"278条2項。","e":"問題４の解説参照。"},{"l":6,"m":"自己株式の取得","sb":"自己株式の法的地位","i":"A","r":"(令5II問題5ウ類・平31I問題6イ)","q":"自己株式は，株式の分割の対象となる。","a":true,"c":"184条参照。","e":"株式の分割の効果は，自己株式にも及ぶと解する。自己株式にも効果が及ばないと，自己株式の価値を維持することができないためである。同様に，株式の併合の効果は，自己株式にも及ぶと解する（182 条参照）。株式の併合の場合は，他の株主との関係において不公平となってしまうためである。"},{"l":1,"m":"自己株式の取得","sb":"子会社による親会社株式の取得","i":"A","r":"(平20問題3エ)","q":"子会社は，いかなる場合であっても，親会社株式を取得することができない。","a":false,"c":"135条1項。","e":"子会社は，原則として，親会社株式を取得することができない。親会社と子会社の間には経済的一体性および支配従属関係が存在するため，子会社による親会社株式の自由な取得を認めてしまうと自己株式取得に関する厳格な手続（155条等）や財源規制（461条等）の潜脱を許すことになるおそれがあり，親会社が自己株式を取得する場合と同様の弊害が生じてしまうおそれがある。また，自己株式の場合は所定の手続を経れば取得を認めているのに対して，子会社による親会社株式取得が原則禁止とされているのは，自己株式取得と同様の規制をすることが困難であるためである。ただし，以下に掲げる場合は，例外的に親会社株式を取得することができる（135条２項）。(ⅰ) 他の会社（外国会社を含む）の事業の全部を譲り受ける場合において当該他の会社の有する親会社株式を譲り受ける場合(ⅱ) 合併後消滅する会社から親会社株式を承継する場合(ⅲ) 吸収分割により他の会社から親会社株式を承継する場合(ⅳ) 新設分割により他の会社から親会社株式を承継する場合(ⅴ) 無償取得等，その他法務省令で定める場合（会社法施行規則23条）"},{"l":2,"m":"自己株式の取得","sb":"子会社による親会社株式の取得","i":"A","r":"","q":"子会社は，市場取引または公開買付けによって親会社株式を取得することができる。","a":false,"c":"135条2項各号参照。","e":"問題１の解説参照。子会社は，市場取引または公開買付けによって親会社株式を取得することは認められない。"},{"l":3,"m":"自己株式の取得","sb":"子会社による親会社株式の取得","i":"A","r":"","q":"子会社は，無償であっても，親会社株式を取得することができない。","a":false,"c":"135条2項5号,会社法施行規則23条5号。","e":"問題１の解説参照。無償による取得は，親会社株式取得による弊害がないため，認められている。"},{"l":4,"m":"自己株式の取得","sb":"子会社による親会社株式の取得","i":"A","r":"(平24I問題4ア)","q":"子会社が，他の会社の事業の一部を譲り受ける場合において当該他の会社の有する親会社株式を有償で譲り受ける場合には，親会社株式を取得できる。","a":false,"c":"135条2項各号参照。","e":"問題１の解説参照。子会社が他の会社の事業の一部を譲り受ける際に，当該他の会社から親会社株式を取得することは，やむを得ない取得に該当しないため，認められない。なお，子会社が他の会社の事業の全部を譲り受ける際に，当該他の会社から親会社株式を取得することは，やむを得ない取得に該当するため，認められている（135条２項１号）。"},{"l":5,"m":"自己株式の取得","sb":"子会社による親会社株式の取得","i":"A","r":"(平24I問題4イ)","q":"子会社が，吸収合併により合併後消滅する会社から親会社株式を承継する場合には，親会社株式を取得できる。","a":true,"c":"135条2項2号。","e":"問題１の解説参照。当該取得はやむを得ない取得であるため，例外的に認められている。その他，他の会社の事業の全部を譲り受ける場合において，当該他の会社の有する親会社株式を譲り受ける場合や，吸収分割または新設分割により他の会社から親会社株式を承継する場合も同様に認められる（135条２項１号３号４号）。"},{"l":6,"m":"自己株式の取得","sb":"子会社による親会社株式の取得","i":"A","r":"(平31II問題5ア・平24I問題4ウ)","q":"子会社が，市場価格のある親会社株式を，当該株式１株を取得するのと引換えに交付する金銭等の額が当該株式１株の市場価格として法務省令で定める方法により算定されるものを超えない額で取得する場合には，親会社株式を取得できる。","a":false,"c":"135条2項各号参照。","e":"問題１の解説参照。子会社が時価よりも安い価額で親会社株式を取得する場合であっても，親会社株式の取得の弊害が少なくなるわけではないため，この場合，取得は認められていない。"},{"l":7,"m":"自己株式の取得","sb":"子会社による親会社株式の取得","i":"C","r":"(平24I問題4エ)","q":"子会社が，その権利の実行に当たり目的を達成するために親会社株式を取得することが必要かつ不可欠である場合，親会社株式を取得できる。","a":true,"c":"135条2項5号,会社法施行規則23条14号。","e":"必要かつ不可欠である場合の典型例は，子会社の債務者が親会社株式以外の財産を有しない場合である。"},{"l":8,"m":"自己株式の取得","sb":"子会社による親会社株式の取得","i":"C","r":"","q":"吸収合併消滅会社の株主に対して交付する金銭等の全部または一部が存続株式会社の親会社株式である場合には，当該存続株式会社は，吸収合併に際して消滅会社の株主に対して交付する当該親会社株式の総数を超えない範囲において当該親会社株式を取得することができる。","a":true,"c":"800条1項。","e":"これは，三角合併をする場合の親会社株式の取得を許容した規定である。なお，吸収分割および株式交換でも同様である。"},{"l":9,"m":"自己株式の取得","sb":"子会社による親会社株式の取得","i":"B","r":"(平31II問題5エ類)","q":"子会社は，親会社株式を取得した後遅滞なく，当該親会社株式を処分しなければならない。","a":false,"c":"135条3項。","e":"子会社は，相当の時期にその有する親会社株式を処分しなければならない。しかし，親会社株式について流通性がない場合にはその処分が困難なことがあるし，市場価格があっても大量に取得した場合には市場に与える影響の大きさからその売却が困難となる場合がありえることから，親会社株式を親会社自身が簡易な手続で取得することが認められている（163条）。なお，組織再編行為を行う子会社が親会社株式を交付するために取得する場合（800 条１項）は，当該組織再編行為の効力発生日までの間は，親会社株式を保有し続けることができる（同条２項本文）。"},{"l":10,"m":"自己株式の取得","sb":"子会社による親会社株式の取得","i":"A","r":"(令7I問題5エ・平31II問題5イ類・平22I問題9イ)","q":"子会社は，適法に保有している親会社株式についても議決権を行使できる。","a":false,"c":"308条1項かっこ書。","e":"子会社は，その有する親会社株式について議決権を有しない。親会社の支配の公正を歪めるおそれがあるからである。"},{"l":11,"m":"自己株式の取得","sb":"子会社による親会社株式の取得","i":"C","r":"(平31II問題5ウ)","q":"子会社は，その有する親会社株式につき，剰余金の配当を受けることができない。","a":false,"c":"","e":"親会社株式において，自益権（剰余金配当請求権等）については，すべて認められると解されている。なぜなら，子会社の少数株主や債権者を保護する必要があるためである。"},{"l":1,"m":"株券","sb":"総則","i":"B","r":"","q":"株式会社は，その株式に係る株券を発行する場合は，定款にその旨を定めなければならない。","a":true,"c":"214条。","e":"会社法は株券の不発行を原則とし，株券を発行する旨を定款に定めないかぎり，株券を発行することができない。"},{"l":2,"m":"株券","sb":"総則","i":"B","r":"(令4II問題6ア)","q":"種類株式発行会社は，ある種類の株式についてのみ株券を発行する旨を定款で定めることができる。","a":false,"c":"214条かっこ書。","e":"ある種類株式にのみ株券を発行することはできない。"},{"l":3,"m":"株券","sb":"総則","i":"C","r":"","q":"株券発行会社が株式を発行した場合は，直ちに，当該株式に係る株券を発行しなければならない。","a":false,"c":"215条1項。","e":"株券発行会社は，株式を発行した日以後遅滞なく，当該株式に係る株券を発行しなければならない。"},{"l":4,"m":"株券","sb":"総則","i":"C","r":"","q":"公開会社でない株券発行会社は，株式を発行した場合であっても，株主から請求がある時までは株券を発行しないことができる。","a":true,"c":"215条4項。","e":""},{"l":5,"m":"株券","sb":"総則","i":"A","r":"(令4II問題6イ・平24I問題5ア類)","q":"種類株式発行会社が発行する株券には，当該株券に係る株式の種類およびその内容を記載し，代表取締役（指名委員会等設置会社では代表執行役）がこれに署名し，または記名押印しなければならない。","a":true,"c":"216条4号。","e":"株券には，① 株券発行会社の商号，② 当該株券に係る株式の数，③ 譲渡による当該株券に係る株式の取得について株式会社の承認を要することを定めたときは，その旨，④ 種類株式発行会社にあっては，当該株券に係る株式の種類およびその内容，およびその番号を記載し，株券発行会社の代表取締役（指名委員会等設置会社では代表執行役）がこれに署名し，または記名押印しなければならない（216条）。"},{"l":6,"m":"株券","sb":"総則","i":"A","r":"(平24I問題5イ・平24I問題5エ)","q":"株券には，会社成立の年月日，株券発行年月日，および株主の氏名を記載しなければならない。","a":false,"c":"216条各号参照。","e":"会社成立の年月日，株券発行年月日，および株主の氏名または名称を株券に記載することは求められていない。"},{"l":7,"m":"株券","sb":"総則","i":"B","r":"(令6I問題7エ類・令2I問題4ウ)","q":"最高裁判所の判例によれば，株券発行会社が，会社法が定める株券としての形式を具備した文書を作成すれば，株主に当該文書を交付しなくても，当該文書は株券としての効力を生じる。","a":false,"c":"最判昭40年11月16日。","e":"判例によると，株券は，株券発行会社が株券を株主に交付したときに効力が発生する。"},{"l":8,"m":"株券","sb":"総則","i":"B","r":"","q":"株券の占有者は，当該株券に係る株式についての権利を適法に有する。","a":false,"c":"131条1項。","e":"株券の占有者は，当該株券に係る株式についての権利を適法に有するものと推定する。これを，株券の資格授与的効力（推定的効力）という。株券を所持する者が必ず実質的な株主であるとは限らない。しかし，株券発行会社において，株式の譲渡は株券の交付によって行われる（128 条１項本文）ので，株券の占有者は実質的な株主である可能性が高い。したがって，会社法はこの可能性の大きさから株券の占有者を適法な権利者として推定して，その者に形式的な資格を与えているのである。"},{"l":1,"m":"株券","sb":"善意取得","i":"B","r":"(令2I問題4ア類・平20問題3ウ類)","q":"株券の交付を受けた者は，譲渡人が無権利者であることについて悪意である場合でも，当該株券に係る株式についての権利を取得する。","a":false,"c":"131条2項。","e":"株券の交付を受けた者は，悪意または重大な過失がないかぎり，当該株券が表章する株式についての権利を取得する。これを善意取得という。譲渡人が無権利者であれば，株式の譲渡は，本来無効であるが，それでは株式の流通の安全を図ることができないので，会社法は善意取得制度を設けている。"},{"l":1,"m":"株券","sb":"株券を発行する旨の定款の定めの廃止","i":"C","r":"","q":"株券発行会社は，その株式（種類株式発行会社では全部の種類の株式）に係る株券を発行する旨の定款の定めを廃止する定款の変更をしようとするときは，その旨および効力発生日等を，効力発生日の２週間前までに，公告し，かつ，株主および登録株式質権者には，各別にこれを通知しなければならない。","a":true,"c":"218条1項。","e":"公告および通知が要求されるのは，名義書換が未了の株主に名義書換等を促すためである。"},{"l":2,"m":"株券","sb":"株券を発行する旨の定款の定めの廃止","i":"C","r":"(令6I問題7イ)","q":"株式会社が，その株式に係る株券を発行する旨の定款の定めを廃止する定款変更をしたときは，当該株式会社の株主は，当該定款変更がその効力を生じた日から遅滞なく自己の有する株券を当該株式会社に提出しなければならない。","a":false,"c":"219条1項各号参照。","e":"株券を発行する旨の定款の定めを廃止する定款変更の効力発生日をもって株券は無効となるが（218 条２項），当該株券の提出は会社法上義務づけられていない。"},{"l":1,"m":"株券","sb":"株券の提出等","i":"B","r":"(平22I問題5イ)","q":"株券発行会社が株式の併合をするには，株券を全く発行していない場合を除き，株券の提出に関する手続をとらなければならない。","a":true,"c":"219条1項柱書本文,2号。","e":"①～⑨の株式に係る株券は，株券提出日に無効となる（同条３項）。株券発行会社が以下の行為をする場合には，当該行為の効力が生ずる日（⑤ 特別支配株主による株式等売渡請求における対象会社の承認をする場合には，特別支配株主が売渡株式等を取得する日）（株券提出日）までに株券を提出しなければならない旨を当該日の１か月前までに，公告し，かつ，当該株式の株主およびその登録株式質権者には，各別にこれを通知しなければならない。ただし，当該株式の全部について株券を発行していない場合は，この限りでない（同条項ただし書）。① 譲渡制限についての定款の定めを設ける定款の変更をする場合 全部の株式（種類株式発行会社では当該事項についての定めを設ける種類の株式）② 株式の併合をする場合 全部の株式（種類株式発行会社では併合する種類株式）③ 全部取得条項付種類株式の取得をする場合 当該全部取得条項付種類株式④ 取得条項付株式の取得をする場合 当該取得条項付株式⑤ 特別支配株主による株式等売渡請求における対象会社の承認をする場合 売渡株式"},{"l":2,"m":"株券","sb":"株券の提出等","i":"B","r":"(平25II問題17ア)","q":"株券発行会社が株式移転をする場合には，当該株券発行会社の株式に係るすべての株券は，当該株式移転の効力が生ずる日に無効となる。","a":true,"c":"219条3項。","e":"上記問題１の解説中における①～⑨の株式に係る株券は，株券提出日に無効となる（同条３項）。すなわち，株式移転をする場合には，その効力が生ずる日＝株券提出日となるため，効力発生日に株券は無効となる。"},{"l":3,"m":"株券","sb":"株券の提出等","i":"B","r":"(令5I問題6エ)","q":"最高裁判所の判例によれば，譲渡制限株式でない株式に係る株券の提出に関する公告等の手続がとられ，株券提出期間が経過したことにより無効となった株券（以下，「旧株券」という。）を所持する者は，株券提出期間経過前に譲渡により株主となっていた場合には，株式会社に対し，旧株券を呈示し，株券提出期間経過前に当該旧株券の交付を受けて株式を譲り受けたことを証明して，株主名簿の名義書換を請求することができる。","a":true,"c":"最判昭60年3月7日。","e":"最高裁判所の判例によれば，旧株券は，株券提出期間が経過した後は株券としては無効のものとなると解されるが，株券提出期間内に旧株券を提出しなかった株主も株主たる地位を失うものではなく，名義書換との関係においては，会社は，これを請求する株主が株主名簿に記載されていないことを理由に株主であることを否定して名義書換を拒否することはできないから，株券提出期間経過前に株主になっていた者は，期間経過によりその所持する旧株券が株券としては無効となった後であっても，会社に対し，旧株券を提示し，株券提出期間経過前に旧株券の交付を受けて株式を譲り受けたことを証明して，名義書換を請求することができる。"},{"l":1,"m":"株券","sb":"株券不所持制度","i":"B","r":"(令4II問題6ウ)","q":"公開会社である株券発行会社の株主は，当該株券発行会社に対して，自己の有する株式に係る株券の所持を希望しない旨を申し出ることはできない。","a":false,"c":"217条1項。","e":"公開会社か否かに関係なく，株券発行会社の株主は，当該株券発行会社に対して，自己の有する株式に係る株券の所持を希望しない旨を申し出ることができる。これを，株券不所持制度という。"},{"l":2,"m":"株券","sb":"株券不所持制度","i":"B","r":"(令6I問題7ア)","q":"株主が，株式会社に対し，株券の所持を希望しない旨を申し出た場合には，当該株主が所持していた株券は，当該株主が当該株券を当該株式会社に提出した時に無効となる。","a":false,"c":"217条5項。","e":"株券不所持の申出は，その申出に係る株式の数（種類株式発行会社では株式の種類及び種類ごとの数）を明らかにしてしなければならない。この場合において，当該株式に係る株券が発行されているときは，当該株主は，当該株券を株券発行会社に提出しなければならない（217条２項）。また，株券不所持の申出を受けた株券発行会社は，遅滞なく，その株式に係る株券を発行しない旨を株主名簿に記載し，または記録しなければならず（217条３項），この時点において，当該株券は無効となる。"},{"l":3,"m":"株券","sb":"株券不所持制度","i":"B","r":"","q":"株券発行会社に自己の有する株式に係る株券の所持を希望しない旨を申し出た株主は，いつでも，当該株券発行会社に対して株券の発行を請求することができる。","a":true,"c":"217条6項前段。","e":"株券発行会社においては，株式を譲渡する際には株券の交付が必要となる（128 条１項）。したがって，株券不所持制度を申し出ている株主が株式を譲渡しようとする場合には，会社から株券の発行を受ける必要があるのである。なお，当該請求が株券の再発行である場合には，当該株券の発行費用は株主の負担となるが，株式発行の効力発生以降，株券が未発行である時点で株券不所持の申出をした株主が初めて株券発行請求を行う場合は，当該発行費用は会社負担となる（217条６項後段）。これは，株券発行会社である以上，当該株式にかかる最初の株券発行については，会社が費用を負担するべきだからである。"},{"l":1,"m":"株券","sb":"株券喪失登録制度","i":"B","r":"","q":"株券を喪失した者は，株券発行会社に対し，当該株券についての株券喪失登録を請求することができる。","a":true,"c":"223条。","e":""},{"l":2,"m":"株券","sb":"株券喪失登録制度","i":"C","r":"","q":"株券発行会社が株主名簿管理人を置く場合，株券喪失登録簿に関する事務は当該株主名簿管理人が行う。","a":true,"c":"222条。","e":"株主名簿と株券喪失登録簿とを一元管理するためである。"},{"l":3,"m":"株券","sb":"株券喪失登録制度","i":"C","r":"","q":"株券喪失登録がなされた場合に，株券喪失登録者が株主名簿の名義人と異なるときは，株券発行会社は，遅滞なく，当該名義人に対して，当該株券について株券喪失登録をした旨およびその他の法定事項を通知しなければならない。","a":true,"c":"224条1項。","e":"株券喪失登録者が株主名簿の名義人と異なる場合，当該名義人が真実の権利者である可能性がある。その場合，その名義人が知らないうちに無権利者が株券喪失登録請求を行い株券が無効とされ，新株券が交付されてしまうことのないよう，異議を述べる機会を付与しているのである。"},{"l":4,"m":"株券","sb":"株券喪失登録制度","i":"C","r":"(令4II問題6エ類)","q":"株式について権利を行使するために株券が株券発行会社に提出された場合において，当該株券について株券喪失登録がされているときは，株券発行会社は，直ちに，当該株券についての株券喪失登録を抹消しなければならない。","a":false,"c":"224条2項。","e":"株式について権利を行使するために株券が株券発行会社に提出された場合において，当該株券について株券喪失登録がされているときは，株券発行会社は，遅滞なく，当該株券を提出した者に対し，当該株券について株券喪失登録がされている旨を通知しなければならない。したがって，登録が抹消されるわけではないので，本肢は誤りである。"},{"l":5,"m":"株券","sb":"株券喪失登録制度","i":"C","r":"","q":"株券喪失登録がなされた株券を所持する者は，いつでも，株券発行会社に対して，株券喪失登録の抹消を申請することができる。","a":false,"c":"225条1項参照。","e":"株券喪失登録がなされた株券を所持する者は，株券喪失登録の日の翌日から１年以内であれば，株券発行会社に対して，株券喪失登録の抹消を申請することができる。その際，抹消を申請する者は，株券を会社に提出しなければならない（225条２項）。"},{"l":6,"m":"株券","sb":"株券喪失登録制度","i":"B","r":"(令6I問題7ウ類・令2I問題4エ)","q":"株券喪失登録がなされた株券は，当該株券喪失登録が抹消されない限り，株券喪失登録日の翌日から起算して１年を経過した後に，裁判所の決定によって無効となる。","a":false,"c":"228条1項。","e":"株券喪失登録（抹消されたものを除く）がされた株券は，株券喪失登録日の翌日から起算して１年を経過した日に無効となるが，その際に裁判所の決定は不要である。なお，当該規定により株券が無効となった場合，株券発行会社は，当該株券についての株券喪失登録者に対し，株券を再発行しなければならない（228条２項）。"},{"l":7,"m":"株券","sb":"株券喪失登録制度","i":"B","r":"","q":"株券喪失登録がなされると，株券発行会社は，株券喪失登録日の翌日から起算して１年を経過した日までの間は，喪失登録がされた株券に係る株式について，株主名簿の名義書換をすることができない。","a":false,"c":"230条1項。","e":"株券喪失登録がなされると，株券発行会社は，① 株券喪失登録が抹消された日，② 株券喪失登録日の翌日から起算して１年を経過した日のいずれか早い日までの間は，喪失登録がされた株券にかかる株式について，株主名簿の名義書換をすることができない。なぜなら，自由に名義書換ができるとなると，株券の流通が継続し，株券喪失登録者にとって喪失株券所持者の把握に支障をきたすおそれがあるためである。"},{"l":8,"m":"株券","sb":"株券喪失登録制度","i":"B","r":"","q":"株券喪失登録者は，登録抹消日までの間は，当該株式について議決権を行使することができない。","a":false,"c":"230条3項。","e":"株券喪失登録者が株主名簿の名義人でない場合は，登録抹消日までの間は，当該株式について議決権行使は認められない。"},{"l":1,"m":"株主名簿","sb":"総則","i":"B","r":"(平21問題4ア)","q":"株式会社は，株主名簿に，株主が株式を取得した日を記載または記録しなければならない。","a":true,"c":"121条。","e":"株式会社は，株主名簿を作成し，会社法に規定する株主名簿記載事項を記載し，または記録しなければならない。なお，株主名簿記載事項として，① 株主の氏名または名称および住所，② 株主の有する株式の数，③ 株主が株式を取得した日，④ 株式会社が株券発行会社である場合には，株式（株券が発行されているものに限る）に係る株券の番号を記載または記録する必要がある（121条各号）。"},{"l":2,"m":"株主名簿","sb":"総則","i":"B","r":"(令4I問題5ア)","q":"株式会社は，株券が発行されている株式については，当該株式に係る株券の番号を株主名簿に記載し，または記録しなければならない。","a":true,"c":"121条。","e":"問題１の解説参照。"},{"l":3,"m":"株主名簿","sb":"総則","i":"A","r":"(令4I問題5イ類)","q":"株式会社は，株主名簿管理人を置き，当該株式会社に代わって株主名簿の作成および備置きその他の株主名簿に関する事務を行うことを委託しなければならない。","a":false,"c":"123条。","e":"会社法は，株主名簿管理人の設置を強制せず，設置するか否かを株式会社が自由に決定できることとしている。また，株主名簿管理人を設置する場合には，定款にその旨を定めなければならない。"},{"l":4,"m":"株主名簿","sb":"総則","i":"A","r":"(平25I問題6ウ)","q":"株式会社は，株主総会の特別決議によって，株主名簿管理人を置く旨の定款の定めを廃止することができる。","a":true,"c":"123条,466条,309条2項11号。","e":"株主名簿管理人の設置は定款の相対的記載事項である。株主名簿管理人を置く旨の定款の定めを廃止する場合は，通常の定款変更の方法である株主総会の特別決議を要する。"},{"l":5,"m":"株主名簿","sb":"総則","i":"A","r":"(平30II問題6ア類・平25I問題6ア類)","q":"株券発行会社の株主は，当該株券発行会社に対し，自己についての株主名簿記載事項を記載した書面の交付を請求することができる。","a":false,"c":"122条1項4項。","e":"株券不発行会社の株主には当該請求が認められるが，株券発行会社の株主には当該請求は認められない。株券不発行会社において当該請求が認められている理由としては，株券不発行会社においては株券が発行されないため，第三者に対して自己の権利の証明を可能にする必要があるからである。"},{"l":6,"m":"株主名簿","sb":"総則","i":"A","r":"(平25I問題6イ)","q":"株式会社は，株主名簿管理人がある場合には，株主名簿をその本店および株主名簿管理人の営業所に備え置かなければならない。","a":false,"c":"125条1項かっこ書き。","e":"株式会社は，株主名簿をその本店（株主名簿管理人がある場合はその営業所）に備え置かなければならない。"},{"l":7,"m":"株主名簿","sb":"総則","i":"A","r":"(令3問題5ウ類・平25I問題6エ・平21年問題4イウ類)","q":"株主は，書面をもって作成されている株主名簿の閲覧または謄写の請求をすることができるが，債権者は，当該請求をすることができない。","a":false,"c":"125条2項。","e":"株主および債権者は，株式会社の営業時間内は，いつでも，株主名簿の書面または電磁的記録に記録された事項を表示したものの，閲覧または謄写を請求することができる。この場合においては，当該請求の理由を明らかにしなければならない。"},{"l":8,"m":"株主名簿","sb":"総則","i":"A","r":"(令4I問題5ウ)","q":"株式会社は，債権者が書面をもって作成されている株主名簿の閲覧または謄写の請求をすることができない旨を定款で定めることができる。","a":false,"c":"125条2項。","e":"株主および債権者による株主名簿の閲覧請求権を定款によって排除することは認められていない。"},{"l":9,"m":"株主名簿","sb":"総則","i":"A","r":"(平21年問題4エ類)","q":"株式会社の親会社社員は，その権利を行使するため必要があるときは，裁判所の許可を得て，当該株式会社の株主名簿の閲覧または謄写請求を，当該請求の理由を明らかにしたうえですることができる。","a":true,"c":"125条4項。","e":""},{"l":10,"m":"株主名簿","sb":"総則","i":"A","r":"","q":"株式会社は，株主から株主名簿の閲覧請求があったときは，いかなる場合であってもこれを拒むことができない。","a":false,"c":"125条3項。","e":"株式会社は，法定の拒否事項がある場合は，株主名簿の閲覧または謄写請求を拒むことができる。これは，債権者および親会社社員からの請求における裁判所の許可についても同様である（125 条３項５項）。この法定事項とは，① 請求者がその権利の確保または行使に関する調査以外の目的で請求を行ったとき，② 請求者が当該株式会社の業務の遂行を妨げ，または株主の共同の利益を害する目的で請求を行ったとき，③ 請求者が株主名簿の閲覧または謄写によって知り得た事実を利益を得て第三者に通報するため請求を行ったとき，④ 請求者が，過去２年以内において，株主名簿の閲覧または謄写によって知り得た事実を利益を得て第三者に通報したことがあるものであるときである（125条３項各号参照）。"},{"l":11,"m":"株主名簿","sb":"総則","i":"B","r":"(令5I問題6ア類)","q":"株式会社は，株主から株主名簿の閲覧の請求があった場合であっても，請求者が当該株式会社の業務と実質的に競争関係にある事業を営み，またはこれに従事するものであるときは，当該請求を拒むことができる。","a":false,"c":"125条3項各号参照。","e":"「請求者が当該株式会社の業務と実質的に競争関係にある事業を営み，またはこれに従事するものであること」は請求の拒否事由とされていない。"},{"l":12,"m":"株主名簿","sb":"総則","i":"C","r":"","q":"株式会社が株主に対してする通知または催告は，株主名簿に記載された当該株主の住所（当該株主が別に通知または催告を受ける場所または連絡先を当該株式会社に通知した場合にあっては，その場所または連絡先）にあてて発すれば足りる。","a":true,"c":"126条1項。","e":""},{"l":13,"m":"株主名簿","sb":"総則","i":"C","r":"","q":"株式会社が株主に対してする通知または催告は，当該通知または催告が通常到達すべきであった時に到達したものとみなす。","a":true,"c":"126条2項。","e":"多数の変動する株主の存在を考慮して，集団的法律関係を簡易迅速かつ画一的に処理するためである。"},{"l":1,"m":"株主名簿","sb":"所在不明株主に対する通知の省略等","i":"C","r":"(令5I問題6ウ)","q":"株式会社が株主に対してする通知または催告が５年以上継続して到達しない場合には，株式会社は，当該株主に対する通知または催告をすることを要しない。","a":true,"c":"196条1項。","e":"株主管理コストを削減する趣旨である。"},{"l":2,"m":"株主名簿","sb":"所在不明株主に対する通知の省略等","i":"C","r":"","q":"株式会社が株主に対してする通知または催告が５年以上継続して到達しない場合には，株式会社は，当該株主の有する株式を競売し，かつ，その代金を当該株主に交付することができる。","a":false,"c":"197条1項。","e":"株式会社が株主に対してする通知または催告が５年以上継続して到達していない場合で，かつ，当該株主が継続して５年間剰余金の配当を受領しなかった場合，株式会社は，当該株主の有する株式を競売し，かつ，その代金を当該株主に交付することができる。"},{"l":3,"m":"株主名簿","sb":"所在不明株主に対する通知の省略等","i":"C","r":"","q":"取締役会設置会社が所在不明株主の株式を買い取る場合は，買い取る株式の数および対価として交付すべき金銭の総額を株主総会の特別決議で定めなければならない。","a":false,"c":"197条3項4項。","e":"取締役会設置会社が所在不明株主の株式を買い取る場合は，買い取る株式の数および対価として交付すべき金銭の総額を取締役会の決議で定めなければならない。"},{"l":4,"m":"株主名簿","sb":"所在不明株主に対する通知の省略等","i":"C","r":"","q":"所在不明株主の株式の買取りによる自己株式の取得により株主に対して交付する金銭等の帳簿価額の総額は，その効力が発生する日における分配可能額を超えてはならない。","a":true,"c":"461条1項6号。","e":""},{"l":1,"m":"株主名簿","sb":"基準日制度","i":"A","r":"","q":"株式会社は，基準日を定めて，当該基準日において株主名簿に記載されている株主をその権利行使することができる者と定めることができる。","a":true,"c":"124条1項。","e":""},{"l":2,"m":"株主名簿","sb":"基準日制度","i":"A","r":"(平22I問題6エ)","q":"株式会社は，基準日および基準日株主が行使することができる権利の内容について，定款または株主総会決議によって定めなければならない。","a":false,"c":"124条1項。","e":"基準日の設定は任意であり，定める場合であっても定款または株主総会の決議は不要とされている。"},{"l":3,"m":"株主名簿","sb":"基準日制度","i":"A","r":"(平22I問題6ア類)","q":"基準日株主が行使することができる権利は，基準日から１か月以内に行使するものでなければならないとされている。","a":false,"c":"124条2項かっこ書。","e":"基準日株主が行使することができる権利は，基準日から３か月以内に行使するものでなければならないとされている。"},{"l":4,"m":"株主名簿","sb":"基準日制度","i":"A","r":"(平22I問題6イ)","q":"基準日株主が行使することができる権利が剰余金配当請求権である場合には，当該剰余金の配当を決定する株主総会前に全部の株式を譲渡した基準日株主は，配当を受け取ることができない。","a":false,"c":"124条1項。","e":"この場合，基準日株主が剰余金配当請求権を行使できることとなるため，当該剰余金の配当を決定する株主総会前に全部の株式を譲渡した基準日株主は，配当を受け取ることができる。"},{"l":5,"m":"株主名簿","sb":"基準日制度","i":"B","r":"","q":"基準日を定めた場合は，定款に基準日およびその事項についての定めがある場合を除き，基準日の２週間前までに，当該基準日および基準日株主が行使することができる権利の内容を公告しなければならない。","a":true,"c":"124条3項。","e":"当該規定の趣旨は，株式取得者に名義書換を請求する機会を与え，権利行使の機会を逸しないようにすることにある。"},{"l":6,"m":"株主名簿","sb":"基準日制度","i":"A","r":"(令7I問題1ウ)","q":"株式会社は， 基準日を定めたときは， 当該基準日を登記しなければならない。","a":false,"c":"911条3項各号参照。","e":"株式会社は，基準日を定めたときは，当該基準日の２週間前までに，当該基準日および基準日株主が行使することができる権利の内容を公告しなければならない（124 条３項本文）。ただし，定款に当該基準日および基準日株主が行使することができる権利の内容についての定めがあるときは，この限りではない（同条項ただし書）。しかし，基準日についての定款の定めがある場合であっても，株式会社の登記事項とはされていない（911 条３項各号参照）。"},{"l":7,"m":"株主名簿","sb":"基準日制度","i":"A","r":"(平22I問題6ウ類)","q":"株式会社は，基準日株主の権利を害することがないならば，基準日後に株式を取得した者を，当該基準日株主が行使することができる権利を行使することができる者と定めることができる。","a":false,"c":"124条4項。","e":"基準日株主が行使することができる権利が株主総会または種類株主総会における議決権である場合は，会社は当該基準日後に株式を取得した者の全部または一部を当該権利を行使することができる者として定めることができる。ただし，当該株式の基準日株主の権利を害することができない。当該規定は，基準日後に会社が募集株式の発行や組織再編行為を行った場合を想定して，新株主に例外的に権利行使を許すための規定である。"},{"l":8,"m":"株主名簿","sb":"基準日制度","i":"A","r":"(令5I問題6イ)","q":"株式会社は，基準日において株主名簿に記載されている株主を株主総会における議決権を行使することができる者と定めた場合には，当該基準日後に実施された同一の募集株式の発行により株式を取得した者の一部に，当該株主総会における議決権の行使を認めることができる。","a":false,"c":"124条4項。","e":"基準日株主が行使することができる権利が株主総会または種類株主総会における議決権である場合には，株式会社は，当該基準日後に株式を取得した者の全部または一部を当該権利を行使することができる者と定めることができる。ただし，当該株式の基準日株主の権利を害することができない。基準日後に株式会社が募集株式の発行や組織再編行為を行った場合において，新株主に例外的に権利行使を許すために設けられた規定である。この規定を適用するにあたり，株主平等原則（109 条１項）に反しないかを検討する必要があり，同一の募集株式の発行により株式を取得した者の一部に議決権の行使を認めることは，そのような取扱いをする合理的な必要性がない限り，株主平等原則違反の問題が生じるおそれがあるため認められない。"},{"l":1,"m":"株主名簿","sb":"名義書換制度(株式等振替制度を除く)","i":"C","r":"","q":"株式会社が株式を発行した場合は，株主の請求によらずとも，当該株式の株主に係る株主名簿記載事項を株主名簿に記載または記録しなければならない。","a":true,"c":"132条1項1号。","e":"この他，自己株式を取得した場合や自己株式を処分した場合，株式の併合，株式の分割をした場合も同様に，株主の請求を受けることなく，株主名簿記載事項を株主名簿に記載または記録しなければならない（132 条１項２号３号２項３項）。"},{"l":2,"m":"株主名簿","sb":"名義書換制度(株式等振替制度を除く)","i":"B","r":"","q":"株券発行会社において，株式取得者は，株式会社に対して，取得した株式に係る株券を提示することで，単独で株主名簿の名義書換を請求することができる。","a":true,"c":"133条2項。","e":"株式取得者による名義書換請求は，利害関係人の利益を害するおそれがないものとして法務省令で定める場合を除き，株主名簿上の名義株主（その相続人その他一般承継人を含む）と共同して名義書換の請求を行わなければならない。したがって，株券発行会社においては，株券を提示して株式取得者が単独で名義書換をすることができるが，株券不発行会社においては，原則として，株式取得者による単独での名義書換は認められない。"},{"l":3,"m":"株主名簿","sb":"名義書換制度(株式等振替制度を除く)","i":"B","r":"(令4I問題5エ・令2II問題5ウ)","q":"相続その他の一般承継により譲渡制限株式を取得した者は，当該株式を取得したことについて株式会社の承認を得なければ，当該株式会社に対して株主名簿の名義書換を請求することができない。","a":false,"c":"134条4号。","e":"株式取得者が取得した株式が譲渡制限株式である場合には，当該株式取得者は，株式会社に対し，名義書換を請求することができない（134条柱書本文）。譲渡制限株式の趣旨を没却させないためである。ただし，① 当該株式取得者が当該譲渡制限株式を取得することについて，株式会社から譲渡承認（136条）を受けている場合，② 当該株式取得者が当該譲渡制限株式を取得したことについて，株式会社から取得承認（137条１項）を受けている場合，③ 当該株式取得者が，指定買取人（140 条４項）である場合，④ 当該株式取得者が，相続その他の一般承継により譲渡制限株式を取得した者である場合は，名義書換を請求することができる。④の場合に名義書換請求が認められるのは，譲渡制限株式の制限は，売買等の特定承継にのみ適用され，相続等の一般承継には適用されないためである。"},{"l":4,"m":"株主名簿","sb":"名義書換制度(株式等振替制度を除く)","i":"B","r":"(平28II問題6エ)","q":"最高裁判所の判例によれば，株券発行会社であるか否かを問わず，株式会社が株式譲受人による名義書換請求を不当に拒絶した場合には，当該株式会社は当該株式譲受人を株主として取り扱わなければならない。","a":true,"c":"最判昭42年9月28日,最判昭41年7月28日。","e":"最高裁判所の判例によれば，株式会社が正当な理由がないのに株主名簿の名義書換に応じない場合，株式譲受人は名義書換をすることなく当該株式会社に対して権利行使をすることができるとしている。"},{"l":5,"m":"株主名簿","sb":"名義書換制度(株式等振替制度を除く)","i":"B","r":"","q":"最高裁判所の判例によれば，株式譲受人が名義書換を失念した場合であっても，株主割当ての方法による募集株式の発行等に係る募集株式の割当てを受ける権利は，株式譲受人に帰属するとしている。","a":false,"c":"最判昭35年9月15日。","e":"最高裁判所の判例によれば，募集株式の割当てを受ける権利は，名簿上の株主である株式譲渡人に帰属し，株式譲受人は株式譲渡人に対して何ら請求することができないとしている。"},{"l":6,"m":"株主名簿","sb":"名義書換制度(株式等振替制度を除く)","i":"B","r":"","q":"最高裁判所の判例によれば，株式譲受人が名義書換を失念した場合において，株主名簿上の株主である譲渡人に株式の分割がなされた場合に交付される株式は，株式譲受人に帰属する。","a":true,"c":"最判平19年3月8日。","e":"最高裁判所の判例によれば，譲受人が株主名簿の名義書換を失念したため，名簿上の株主である譲渡人に株式の分割がなされた場合に交付される株式は，譲受人に帰属するとしている。また，株式の引渡しを請求した時に，当該株式が第三者に売却されていた場合において，譲受人は譲渡人に対して，売却代金相当額について不当利得返還請求権を認容した。"},{"l":1,"m":"株式等振替制度","sb":"総則","i":"B","r":"","q":"すべての株式会社は，その発行する株式を振替株式とすることができる。","a":false,"c":"振替法128条1項。","e":"振替株式とは，株券を発行する旨の定款の定めがない会社の株式（譲渡制限株式を除く）で振替機関が取り扱うものであるため，本肢は誤りである。"},{"l":2,"m":"株式等振替制度","sb":"総則","i":"B","r":"","q":"上場会社の発行する新株予約権は，株式等振替制度の対象とならない。","a":false,"c":"振替法2条1項13号。","e":"株式等振替制度は，上場会社等の発行する新株予約権も対象とする。その他，新株予約権付社債なども対象となる（２条１項各号参照）。"},{"l":3,"m":"株式等振替制度","sb":"総則","i":"A","r":"(平29II問題5エ・平24I問題7ア)","q":"譲渡制限株式を振替株式とすることができない。","a":true,"c":"振替法128条1項かっこ書。","e":"振替株式とは，株券を発行する旨の定款の定めがない会社の株式（譲渡制限株式を除く）で振替機関が取り扱うものをいう。したがって，譲渡制限株式を振替株式とすることはできない。なお，上場会社は株式等振替制度の適用を受けるため，株券を発行することができない。"},{"l":1,"m":"株式等振替制度","sb":"株式等振替制度における株式の権利の帰属","i":"B","r":"","q":"振替株式についての権利の帰属は，振替口座簿の記載または記録によって定まる。","a":true,"c":"振替法128条1項。","e":"すなわち，振替機関等に開設された口座の残高記録により，株式が誰に帰属するのかを決定するのである。"},{"l":2,"m":"株式等振替制度","sb":"株式等振替制度における株式の権利の帰属","i":"B","r":"(平24I問題7ウ)","q":"加入者は，その口座（口座管理機関の口座にあっては自己口座に限る）に記載または記録された振替株式についての権利を適法に有するものとみなされる。","a":false,"c":"振替法143条。","e":"加入者は，その口座における記載または記録がされた振替株式についての権利を適法に有するものと推定する。このように，振替口座簿の記載には資格授与的効力が認められる。"},{"l":1,"m":"株式等振替制度","sb":"振替株式の譲渡方法","i":"B","r":"(令2II問題6ア・平24I問題7イ)","q":"振替株式の譲渡は，振替の申請により，譲受人がその口座（機関口座ではないものとする）における保有欄に当該譲渡に係る数の増加の記載または記録を受けなければ，その効力を生じない。","a":true,"c":"振替法140条。","e":"振替株式については，意思表示だけで有効に譲渡することはできず，振替口座簿への記載または記録により株式を譲渡する。"},{"l":2,"m":"株式等振替制度","sb":"振替株式の譲渡方法","i":"B","r":"(平24I問題7エ)","q":"振替株式を取得した者は，いつでも，当該振替株式の発行者に対し，当該振替株式に係る株主名簿記載事項を株主名簿に記載し，または記録することを請求することができる。","a":false,"c":"振替法161条1項。","e":"振替株式については，会社法133条の規定は適用されない。したがって，株主の請求による株主名簿記載事項の記載または記録は認められないため，本肢は誤りである。"},{"l":1,"m":"株式等振替制度","sb":"振替株式の善意取得","i":"C","r":"","q":"振替の申請によりその口座（口座管理機関の口座にあっては，自己口座に限る）において特定の銘柄の振替株式についての増加の記載または記録を受けた加入者は，悪意または重大な過失がない限り，当該銘柄の振替株式についての当該増加の記載または記録に係る権利を取得する。","a":true,"c":"振替法144条。","e":"振替株式には善意取得が認められる。"},{"l":1,"m":"株式等振替制度","sb":"会社に対する権利行使方法","i":"B","r":"","q":"株式会社が基準日を定めた場合，振替機関は，当該株式会社に対して，当該基準日の株主に関する事項を速やかに通知しなければならない。","a":true,"c":"振替法151条1項1号。","e":"総株主通知である。"},{"l":2,"m":"株式等振替制度","sb":"会社に対する権利行使方法","i":"B","r":"","q":"総株主通知を受けた株式会社は，通知された事項を株主名簿に記載しなければならない。この場合には，基準日や効力発生日等の一定の日に株主名簿の名義書換がなされたものとみなされる。","a":true,"c":"振替法152条1項。","e":""},{"l":3,"m":"株式等振替制度","sb":"会社に対する権利行使方法","i":"B","r":"","q":"株式会社は，振替機関に対して，会社の定める一定の日の株主についての総株主通知をすることを請求するためには，裁判所の許可を得なければならない。","a":false,"c":"振替法151条8項。","e":"株式会社は，正当な理由があるときは，振替機関に対し費用を支払って，会社の定める一定の日の株主につき総株主通知をするよう請求することができる。したがって，裁判所の許可は必要ない。ここでいう正当な理由とは，株主優待制度の対象となる株主を確定する等が挙げられる。"},{"l":4,"m":"株式等振替制度","sb":"会社に対する権利行使方法","i":"B","r":"(令2II問題6イ)","q":"振替株式の株主は，株主名簿に自己の氏名または名称および住所が記載され，または記録されていなければ，当該振替株式についての少数株主権等を行使することができない。","a":false,"c":"","e":"少数株主権等とは，基準日を定めて基準日株主に行使の機会を与える権利以外の株主権をいう。ここでいう「基準日を定めて基準日株主に行使の機会を与える権利」とは，集団的権利行使の形で行使される株主権のことである。つまり，少数株主権等は，集団的権利行使以外の形で個別に行使される株主権を指す。具体的には，共益権であれば，株主名簿閲覧請求権（125条），責任追及等の訴え（株主代表訴訟）の提起権（847条），株主総会招集請求権（297条）等，自益権であれば，株式買取請求権（116 条）等である。「少数」株主権等とあるが，集団的権利行使以外の形で個別に行使される株主権であれば，単独株主権も少数株主権等に該当する。株主が少数株主権等を行使する場合には，必ず個別株主通知が必要になる（振替法154条３項）。すなわち，株主名簿に記載のある名簿上の株主でも，少数株主権等を行使するためには，個別株主通知をしなければならないのである。ここで，個別株主通知制度により少数株主権等を行使する場合には，会社法130条１項（株主名簿の名義書換が会社に対する対抗要件であるという規定）は適用されない（振替法154条１項）。なぜなら，個別株主通知制度は，振替口座簿の記載を基準に少数株主権等の行使を認める制度であるからである。"},{"l":5,"m":"株式等振替制度","sb":"会社に対する権利行使方法","i":"B","r":"","q":"株式等振替制度において，株主名簿の閲覧請求権を行使することができる者は株主名簿上の名義人である。","a":false,"c":"振替法154条1項。","e":"振替機関は，単独株主権および少数株主権（少数株主権等）を行使しようとする株主からの申出により，当該株主に関する事項を会社に対して通知する（振替法154条３項）。これを個別株主通知という。株主が少数株主権等を行使する場合には，必ず個別株主通知が必要になる。すなわち，株主名簿に記載のある名簿上の株主でも，少数株主権等を行使するためには，個別株主通知をしなければならず，個別株主通知を経た株主は，株主名簿の記載等にかかわりなく，株主名簿閲覧請求権等の少数株主権等を行使することができる。なお，個別株主通知制度は，株主名簿の名義を書換える制度ではない。"},{"l":6,"m":"株式等振替制度","sb":"会社に対する権利行使方法","i":"B","r":"(令2II問題6ウ・平26II問題4エ)","q":"最高裁判所の判例の趣旨によれば，振替株式の株主が裁判所に対し全部取得条項付種類株式の取得価格決定の申立てをする場合には，その審理が開始されるまでに，個別株主通知がされていることを要する。","a":false,"c":"最決平22年12月7日。","e":"判例は，振替株式発行会社が全部取得条項付種類株式の取得価格決定申立事件の審理において，申立人が株主であることを争った場合には，その審理終結までの間に個別株主通知がなされることを要するものと解している。"},{"l":1,"m":"株式担保","sb":"","i":"B","r":"","q":"株券発行会社の株式の質入れは，当該株式に係る株券を交付するとともに，株主名簿に質権者に関する事項を記載または記録しなければその効力を生じない。","a":false,"c":"146条2項。","e":"株式の質入れには，略式質と登録質がある。ここで，登録質の場合には，株券の交付に加えて，株主名簿に質権者に関する事項を記載しなければならないが，略式質の場合には，株主名簿に質権者に関する事項の記載は必要ない。"},{"l":2,"m":"株式担保","sb":"","i":"B","r":"(平25II問題5イ)","q":"株券発行会社でない株式会社における株式（振替株式を除く）の質入れは，その質権者の氏名または名称および住所を株主名簿に記載し，または記録しなければ，当該株式会社その他の第三者に対抗することができない。","a":true,"c":"147条1項。","e":""},{"l":3,"m":"株式担保","sb":"","i":"B","r":"(平30II問題6エ類・平25II問題5エ類)","q":"株券発行会社の株式の質権者は，継続して当該株式に係る株券を占有しなければ，その質権をもって第三者に対抗することができないが，株券発行会社に対しては，株券を継続して占有せずとも，株主名簿に当該質権者に関する事項が記載されていることによって対抗することができる。","a":false,"c":"147条2項。","e":"株券発行会社の株式の質権者は，継続して当該株式に係る株券を占有しなければ，その質権をもって株券発行会社その他の第三者に対抗することができない。会社または第三者に対抗するためには，質権者は株券を継続して占有しなければならない（147 条２項）。ここで，会社に対する対抗要件が株主名簿への記載・記録ではなく株券の継続占有とされているのは，登録質が会社および第三者に対しての対抗要件を備えるためには，略式質としての対抗要件をも備える必要があるからである。"},{"l":4,"m":"株式担保","sb":"","i":"B","r":"(平25II問題5ウ)","q":"株式の質権者は，株式会社に対し，質権者の氏名または名称および住所を株主名簿に記載し，または記録するよう請求することができる。","a":false,"c":"148条柱書。","e":"質権を株主名簿に記載する請求権を有するのは，株式に質権を設定した者に限られている。したがって，質権者は当該請求権を有していない。"},{"l":5,"m":"株式担保","sb":"","i":"B","r":"(平26II問題4ア)","q":"振替株式の質入れは，振替の申請により，質権者がその口座における質権欄に当該質入れに係る数の増加の記載または記録を受けなければ，その効力を生じない。","a":true,"c":"振替法141条。","e":""},{"l":6,"m":"株式担保","sb":"","i":"B","r":"","q":"株主がその有する譲渡制限株式を質入れする場合は，当該株式を発行している株式会社の承認を得なければならない。","a":false,"c":"","e":"株主がその有する譲渡制限株式を質入れする場合であっても，当該株式を発行している株式会社の承認を得る必要はない。"},{"l":7,"m":"株式担保","sb":"","i":"C","r":"","q":"株券発行会社でない株式会社において，登録株式質権者は，当該株式会社に対し，自己についての株主名簿記載事項を記載した書面の交付を請求することができる。","a":true,"c":"149条1項。","e":"株券不発行会社において当該請求が認められている理由としては，株券発行会社においては株券が発行されないため，第三者に対して自己の権利の証明を可能にする必要があるからである。なお，株券発行会社では，当該請求は認められない（149条４項）。"},{"l":8,"m":"株式担保","sb":"","i":"B","r":"(平25II問題17イ)","q":"株式会社が株式移転をした場合には，当該株式会社の株式を目的とする質権は，当該株式移転によって当該株式の株主が受けることのできる金銭その他の財産について存在する。","a":true,"c":"151条1項13号。","e":"物上代位的効力である。質権者は，質権設定者（債務者である株主）が債務を履行しなかった場合は，株式移転によって株主が受ける金銭等の財産について優先的に弁済を受けることができるのである。"},{"l":9,"m":"株式担保","sb":"","i":"B","r":"(令6II問題5エ)","q":"特別支配株主が株式売渡請求により売渡株式の取得をした場合には，当該売渡株式を目的とする質権は，当該取得によって当該売渡株式の株主が受けることのできる金銭について存在する。","a":true,"c":"151条2項。","e":""},{"l":1,"m":"特別支配株主による株式等売渡請求","sb":"総論","i":"B","r":"","q":"特別支配株主とは，株式会社の総株主の議決権の３分の２（定款で加重可）以上を当該株式会社以外の者および当該者が発行済株式の全部を有する株式会社その他これに準ずるものとして法務省令で定める法人が有している場合における当該者をいう。","a":false,"c":"179条1項本文かっこ書。","e":"特別支配株主とは，株式会社の総株主の議決権の 10 分の９（定款で加重可）以上を当該株式会社以外の者および当該者が発行済株式の全部を有する株式会社その他これに準ずるものとして法務省令で定める法人（特別支配株主完全子法人）が有している場合における当該者をいう。すなわち，特別支配株主とは，対象会社の総株主の議決権の10分の９（定款で加重可）以上を直接的または間接的に保有する者をいう。この 10 分の９という議決権保有割合の要件は，略式組織再編行為等により株主総会決議を省略するための要件（468条１項，784条１項等）にならったものである。なぜなら，特別支配株主の株式等売渡請求は，対象会社の株主総会の決議を要することなくキャッシュ・アウトを行うことができるという点で，略式組織再編行為等の制度を利用する場合と共通するためである。"},{"l":2,"m":"特別支配株主による株式等売渡請求","sb":"総論","i":"C","r":"","q":"特別支配株主は，会社でなければならない。","a":false,"c":"","e":"株式等売渡請求による売渡株式等の取得は，特別支配株主と売渡株主との間の売買取引であるため，合併等の組織再編行為等とは異なり，その主体を会社に限る必要はない。そこで，権利主体として株式等の売買取引を行う者であれば，会社以外の者（会社以外の法人や自然人）も特別支配株主となり得る。"},{"l":1,"m":"特別支配株主による株式等売渡請求","sb":"株式売渡請求・新株予約権売渡請求","i":"B","r":"","q":"株式会社の特別支配株主は，特別支配株主完全子法人に対しても株式売渡請求をしなければならない。","a":false,"c":"179条1項。","e":"株式売渡請求は，対象会社の株主（当該株式会社および特別支配株主を除く）の全員を相手方として，その有する対象会社の株式の全部を請求の対象としなければならない。ただし，特別支配株主完全子法人に対しては，その請求をしないことができる。特別支配株主完全子会社の有する株式は，すでに特別支配株主の完全な支配下にあるといえるため，これを常に株式売渡請求の対象とすることを強制する必要はない。そこで，特別支配株主は，株式売渡請求をしないことを選択することができる。"},{"l":2,"m":"特別支配株主による株式等売渡請求","sb":"株式売渡請求・新株予約権売渡請求","i":"B","r":"","q":"特別支配株主は，株式売渡請求をするときは，併せて，対象会社の新株予約権の新株予約権者（対象会社および当該特別支配株主を除く）の全員に対し，その有する対象会社の新株予約権の全部を当該特別支配株主に売り渡すことを請求しなければならない。","a":false,"c":"179条2項。","e":"特別支配株主は，株式売渡請求をするときは，併せて，対象会社の新株予約権の新株予約権者（対象会社および当該特別支配株主を除く）の全員に対し，その有する対象会社の新株予約権の全部を当該特別支配株主に売り渡すことを請求することができる。対象会社が新株予約権を発行している場合には，株式売渡請求によって特別支配株主が発行済株式の全部を有することとなっても，その後に新株予約権が行使されると，当該新株予約権者が株主となり，株式売渡請求の意義が損なわれるおそれがあるためである。"},{"l":3,"m":"特別支配株主による株式等売渡請求","sb":"株式売渡請求・新株予約権売渡請求","i":"B","r":"(令6II問題5イ)","q":"特別支配株主は，株式の売渡請求に併せて新株予約権の売渡請求を行う場合には，新株予約権者（対象会社および当該特別支配株主を除き，特別支配株主完全子法人は存在しないものとする。）の全員に対して，その有する当該対象会社の新株予約権の全部を自己に売り渡すことを請求することを要しない。","a":false,"c":"179条2項。","e":"新株予約権売渡請求は，新株予約権者（対象会社および特別支配株主を除く）の全員を相手方として，その有する対象会社の新株予約権の全部を請求の対象としなければならない。ただし，特別支配株主完全子法人に対しては，その請求をしないことができる（179条２項ただし書）。"},{"l":4,"m":"特別支配株主による株式等売渡請求","sb":"株式売渡請求・新株予約権売渡請求","i":"B","r":"","q":"株式会社の特別支配株主は，株式売渡請求をしない場合であっても，当該株式会社の新株予約権の新株予約権者（当該株式会社および特別支配株主を除く）の全員に対し，その有する当該株式会社の新株予約権の全部を当該特別支配株主に売り渡すことを請求することができる。","a":false,"c":"179条2項。","e":"新株予約権売渡請求は，株式売渡請求と併せてする場合に限って認められる。"},{"l":5,"m":"特別支配株主による株式等売渡請求","sb":"株式売渡請求・新株予約権売渡請求","i":"B","r":"(令2I問題5ア)","q":"特別支配株主が売渡株式を取得するときに，売渡株主に対して交付する当該売渡株式の対価は，金銭に限られない。","a":false,"c":"179条の2第1項2号。","e":"特別支配株主の株式等売渡請求における売渡株式の対価は，金銭に限られる。"},{"l":1,"m":"特別支配株主による株式等売渡請求","sb":"特別支配株主の株式等売渡請求の手続","i":"C","r":"","q":"特別支配株主は，株式等売渡請求をしようとするときは，対象会社に対し，一定の事項を通知し，その承認を受けなければならない。","a":true,"c":"179条の3第1項。","e":"株式等売渡請求については，対象会社の承認を受けなければならない。株式等売渡請求では，キャッシュ・アウトの対価その他の条件は，対象会社ではなく，特別支配株主が定めることになるが，特別支配株主が不当な条件を定めるおそれがあるため，売渡株主等の利益への配慮という観点からは，特別支配株主による一方的な条件提示のみによってキャッシュ・アウトを認めるのは適切ではない。そこで，対象会社の承認を株式等売渡請求の要件とすることによって手続的な制約を課し，対象会社に特別支配株主の提示した株式等売渡請求の条件が適切であるかを検討させることとしたのである。対象会社は，株式等売渡請求についての承認をするか否かの決定をしたときは，特別支配株主に対し，当該決定の内容を通知しなければならない（179条の３第４項）。"},{"l":2,"m":"特別支配株主による株式等売渡請求","sb":"特別支配株主の株式等売渡請求の手続","i":"C","r":"","q":"対象会社は，特別支配株主が株式売渡請求に併せて新株予約権売渡請求をしようとするときは，新株予約権売渡請求のみを承認することができる。","a":false,"c":"179条の3第2項。","e":"対象会社は，特別支配株主が株式売渡請求に併せて新株予約権売渡請求をしようとするときは，新株予約権売渡請求のみを承認することはできない。"},{"l":3,"m":"特別支配株主による株式等売渡請求","sb":"特別支配株主の株式等売渡請求の手続","i":"A","r":"(令2I問題5イ・平30I問題6ウ)","q":"取締役会設置会社の特別支配株主が株式売渡請求をしようとするときは，当該取締役会設置会社の株主総会の特別決議による承認を受けなければならない。","a":false,"c":"179条の3第3項。","e":"取締役会設置会社が株式等売渡請求についての承認をするか否かの決定をするには，取締役会の決議によらなければならない。特別支配株主の株式等売渡請求は，キャッシュ・アウトを行おうとする株主が大多数の議決権を保有している場合に，対象会社の株主総会の決議を経ることなく，機動的にキャッシュ・アウトを行うことができるようにするための制度である。"},{"l":4,"m":"特別支配株主による株式等売渡請求","sb":"特別支配株主の株式等売渡請求の手続","i":"C","r":"","q":"売渡新株予約権者は，対象会社に対して，特別支配株主の氏名または名称および住所等を記載した書面の閲覧を請求することができない。","a":false,"c":"179条の5第2項本文。","e":"売渡株主等（売渡株主および売渡新株予約権者） は，対象会社に対して，その営業時間内は，いつでも，事前開示事項の内容を記載または記録した書面または電磁的記録の閲覧もしくは謄本または抄本の交付を請求することができる。事前開示手続を設けた趣旨は，売渡株主等の救済措置（株式等売渡請求の差止請求（179 条の７），裁判所に対する売買価格決定の申立て（179条の８），売渡株式等の取得の無効の訴え（846条の２））を前提として，当該売渡株主等に対して，株式等売渡請求に関する情報を提供することにある。"},{"l":5,"m":"特別支配株主による株式等売渡請求","sb":"特別支配株主の株式等売渡請求の手続","i":"B","r":"","q":"特別支配株主は，取得日の前日までの間は，いつでも，売渡株式等の全部について，株式等売渡請求を撤回することができる。","a":false,"c":"179条の6第1項。","e":"特別支配株主は，株式等売渡請求についての承認を受けた後は，取得日の前日までに対象会社の承諾を得た場合に限り，売渡株式等の全部について株式等売渡請求を撤回することができる。取締役会設置会社が当該承諾をするか否かの決定をするには，取締役会の決議によらなければならない（179条の６第２項）。"},{"l":6,"m":"特別支配株主による株式等売渡請求","sb":"特別支配株主の株式等売渡請求の手続","i":"C","r":"(令6II問題5ア)","q":"特別支配株主が取得日において取得した売渡株式が譲渡制限株式である場合には，対象会社は，当該特別支配株主が当該売渡株式を取得したことについて，当該譲渡制限株式の取得に係る承認をしたものとみなされる。","a":true,"c":"179条の9第2項。","e":"特別支配株主が取得した売渡株式等が譲渡制限株式または譲渡制限新株予約権であるときは，対象会社は，当該特別支配株主が当該売渡株式等を取得したことについて，譲渡承認（137条１項，263条１項）をする旨の決定をしたものとみなす。"},{"l":1,"m":"特別支配株主による株式等売渡請求","sb":"売渡株主等の救済措置","i":"B","r":"(令2I問題5ウ類)","q":"売渡株式の対価として交付される金銭の額またはその算定方法，もしくは，売渡株主に対するその金銭の割当てに関する事項が対象会社の財産の状況その他の事情に照らして著しく不当である場合において，売渡株主が不利益を受けるおそれがあるときは，売渡株主は，特別支配株主に対し，株式等売渡請求に係る売渡株式等の全部の取得をやめることを請求することができる。","a":true,"c":"179条の7第1項3号。","e":"① 株式売渡請求が法令に違反する場合，② 対象会社が売渡株主に対する通知（179条の４第１項１号），または，事前開示手続（179条の５）の規定に違反した場合，③ 売渡株式の対価として交付される金銭の額またはその算定方法（179 条の２第１項２号），もしくは，売渡株主に対するその金銭の割当てに関する事項（同条項３号）が対象会社の財産の状況その他の事情に照らして著しく不当である場合のいずれかに該当する場合において，売渡株主が不利益を受けるおそれがあるときは，売渡株主は，特別支配株主に対し，株式等売渡請求に係る売渡株式等の全部の取得をやめることを請求することができる。"},{"l":2,"m":"特別支配株主による株式等売渡請求","sb":"売渡株主等の救済措置","i":"B","r":"(令3問題17イ類)","q":"株式売渡請求が対象会社の定款に違反する場合において，売渡株主が不利益を受けるおそれがあるときは，売渡株主は，特別支配株主に対し，株式等売渡請求に係る売渡株式等の全部の取得をやめることを請求することができる。","a":false,"c":"179条の7第1項各号参照。","e":"差止事由を規定している179条の７第１項１号の「株式等売渡請求が法令に違反する場合」は，定款違反を差止事由とせず，法令違反のみを差止事由としている。これは，株式等売渡請求は対象会社が取引当事者とならないことから，当該請求が対象会社の定款に違反するということは考えられないためである。"},{"l":3,"m":"特別支配株主による株式等売渡請求","sb":"売渡株主等の救済措置","i":"B","r":"(令6II問題5ウ)","q":"特別支配株主は，株式の売渡請求に併せて新株予約権の売渡請求を行う場合には，新株予約権売渡請求における新株予約権の取得対価として交付する金銭の額が著しく不当であり，売渡新株予約権者（対象会社および当該特別支配株主を除く。）が不利益を受けるおそれのあるときであっても，当該売渡新株予約権者は，当該特別支配株主に対し，売渡新株予約権の取得をやめることを請求することができない。","a":false,"c":"179条の7第2項3号。","e":"次に掲げる場合において，売渡新株予約権者が不利益を受けるおそれがあるときは，売渡新株予約権者は，特別支配株主に対し，株式等売渡請求に係る売渡株式等の全部の取得をやめることを請求することができる。(ⅰ) 新株予約権売渡請求が法令に違反する場合(ⅱ) 対象会社が売渡新株予約権者に対する通知（179条の４第１項１号），または，事前開示手続（179条の５）の規定に違反した場合(ⅲ) 売渡新株予約権の対価として交付される金銭の額またはその算定方法（179条の２第１項４号ロ），もしくは，売渡新株予約権者に対するその金銭の割当てに関する事項（同条項号ハ）が対象会社の財産の状況その他の事情に照らして著しく不当である場合"},{"l":4,"m":"特別支配株主による株式等売渡請求","sb":"売渡株主等の救済措置","i":"B","r":"","q":"新株予約権売渡請求が法令に違反する場合において，売渡新株予約権者が不利益を受けるおそれがあるときは，売渡新株予約権者は，特別支配株主に対し，新株予約権売渡請求に係る売渡新株予約権のみについてその全部の取得をやめることを請求することができる。","a":false,"c":"179条の7第2項。","e":"売渡株主による差止請求および売渡新株予約権者による差止請求に共通して，差止請求の対象は，「売渡株式等の全部」とされている（179 条の７第１項２項）。したがって，売渡株主による差止請求の効果は，差止請求を行う売渡株主の有する売渡株式のみならず，他の売渡株主の有する売渡株式も含めた売渡株式の取得の全体におよび，また，株式売渡請求と併せて新株予約権売渡請求がされている場合は，新株予約権売渡請求による売渡新株予約権の取得にも及ぶこととしている。また，同様に売渡新株予約権者による差止請求の効果も，株式等売渡請求による売渡株式等の取得の全体に及ぶこととされているため，特別支配株主がその意図に反して株式売渡請求による売渡株式の取得のみを行うことを強いられることがないよう配慮されている。"},{"l":5,"m":"特別支配株主による株式等売渡請求","sb":"売渡株主等の救済措置","i":"B","r":"","q":"株式等売渡請求があった場合には，売渡株主等は，取得日の 20 日前の日から取得日の前日までの間に，裁判所に対し，その有する売渡株式等の売買価格の決定の申立てをすることができる。","a":true,"c":"179条の8第1項。","e":"裁判所に対する売買価格の決定の申立ての規定の趣旨は，売渡株主等に売渡株式等の対価の金額を争う機会を認めることにある。"},{"l":6,"m":"特別支配株主による株式等売渡請求","sb":"売渡株主等の救済措置","i":"B","r":"(令2I問題5エ類)","q":"公開会社でない株式会社において，株式等売渡請求に係る売渡株式等の全部の取得の無効は，取得日から６か月以内に限り，訴えを持ってのみ主張することができる。","a":false,"c":"846条の2第1項。","e":"株式等売渡請求に係る売渡株式等の全部の取得の無効は，取得日から６か月以内（非公開会社では１年以内）に限り，主張することができる。"},{"l":7,"m":"特別支配株主による株式等売渡請求","sb":"売渡株主等の救済措置","i":"B","r":"","q":"売渡株式等の取得の無効の訴えの被告は，対象会社である。","a":false,"c":"846条の3。","e":"売渡株式等の取得の無効の訴えについては，特別支配株主を被告とする。対象会社は，売渡株式等の取得に係る取引の当事者ではないため，被告にはならない。"},{"l":8,"m":"特別支配株主による株式等売渡請求","sb":"売渡株主等の救済措置","i":"A","r":"","q":"売渡株式等の取得の無効の訴えに係る請求を認容する判決が確定したときは，当該判決において無効とされた売渡株式等の全部の取得は，将来に向かってその効力を失う。","a":true,"c":"846条の8。","e":"法的安定性を確保するために無効判決の遡及効は阻止され，売渡株式等の取得の無効は将来に向かってその効力を失う（将来効）。また，法律関係の画一的確定の観点から，売渡株式の取得の無効判決には対世的効力が認められている（846条の７）。"},{"l":1,"m":"株式の消却・併合・分割・無償割当て・1株に満たない端数の処理・単元株制度","sb":"株式の消却","i":"A","r":"","q":"取締役会設置会社でない株式会社において，自己株式の消却の決定は，株主総会の普通決議によらなければならない。","a":false,"c":"178条1項2項。","e":"取締役会設置会社でない株式会社における自己株式の消却の決定については，株主総会の決議は求められていない。"},{"l":2,"m":"株式の消却・併合・分割・無償割当て・1株に満たない端数の処理・単元株制度","sb":"株式の消却","i":"A","r":"(平30I問題6イ類・平28II問題7エ・平25II問題6エ類・平25I問題5ア類)","q":"取締役会設置会社が自己株式を消却する場合，消却する自己株式の数の決定は，取締役会の決議によらなければならない。","a":true,"c":"178条1項2項。","e":"取締役会設置会社においては，自己株式の消却に関する事項の決定は，取締役会の決議によらなければならない。"},{"l":3,"m":"株式の消却・併合・分割・無償割当て・1株に満たない端数の処理・単元株制度","sb":"株式の消却","i":"C","r":"(令5I問題5ウ)","q":"株式会社が自己株式を消却した場合には，資本金の額は当該自己株式の帳簿価額に相当する額だけ減少する。","a":false,"c":"","e":"株式会社が自己株式を消却した場合には，当該自己株式の帳簿価額をその他資本剰余金から減額することになるため（会社計算規則24条２項３項），資本金の額は減少しない。"},{"l":4,"m":"株式の消却・併合・分割・無償割当て・1株に満たない端数の処理・単元株制度","sb":"株式の消却","i":"B","r":"(令3問題4イ類・平25I問題4エ)","q":"公開会社において，株式の消却によって発行済株式総数が発行可能株式総数の４分の１を下ることとなる場合には，定款を変更して発行可能株式総数の定めを発行済株式総数の４倍以下の数にする必要はない。","a":true,"c":"178条1項2項。","e":"株式の消却がなされた場合，発行済株式総数は減少するが，発行可能株式総数は当然には変動しない。ここで，株式の併合の場合と異なり，株式の消却の場面では，公開会社における発行可能株式総数に係る規律は維持されていないため，公開会社であっても，株式の消却の結果，発行可能株式総数が発行済株式総数の４倍を超えても構わない。"},{"l":5,"m":"株式の消却・併合・分割・無償割当て・1株に満たない端数の処理・単元株制度","sb":"株式の消却","i":"B","r":"(令5II問題6エ)","q":"株式会社が自己株式を消却した場合には，発行可能株式総数は減少する。","a":false,"c":"","e":"株式の消却がなされた場合，発行済株式総数は減少するが，発行可能株式総数は当然には変動しない。"},{"l":1,"m":"株式の消却・併合・分割・無償割当て・1株に満たない端数の処理・単元株制度","sb":"株式の併合","i":"A","r":"(平29I問題5ア類・平21問題6エ類)","q":"株式会社は，株式の併合をしようとするときは，その都度，株主総会の普通決議によって，併合の割合等を決定しなければならない。","a":false,"c":"180条2項,309条2項4号。","e":"株式会社は，株式の併合をしようとするときは，その都度，株主総会の特別決議によって，併合の割合等を決定しなければならない。株式の併合を決定する決議において株主総会の特別決議が要求されているのは，株式の併合は，併合前に比べて株式の単位が大きくなるため，株主は従前の株式単位で株式を処分することができないという不利益を被ることになるからである。また，併合の割合によっては，１株に満たない端数が生じ，その結果として株主の地位が失われるということも考えられ，株主に重大な影響を及ぼすため，厳格な手続が要求されている。"},{"l":2,"m":"株式の消却・併合・分割・無償割当て・1株に満たない端数の処理・単元株制度","sb":"株式の併合","i":"A","r":"","q":"種類株式発行会社において，ある種類株式についてのみ株式の併合をすることは認められない。","a":false,"c":"180条2項3号。","e":"種類株式発行会社において，ある種類株式についてのみ株式の併合をすることは認められる。"},{"l":3,"m":"株式の消却・併合・分割・無償割当て・1株に満たない端数の処理・単元株制度","sb":"株式の併合","i":"A","r":"(平22I問題5ウ)","q":"取締役は，株式の併合を決定する株主総会において，株式の併合をすることを必要とする理由を説明しなければならない。","a":true,"c":"180条4項。","e":"当該説明は，株主の判断に有用な情報を与えることを目的とする。"},{"l":4,"m":"株式の消却・併合・分割・無償割当て・1株に満たない端数の処理・単元株制度","sb":"株式の併合","i":"B","r":"(平30II問題7エ)","q":"株式会社が株式の併合を行う場合，当該株式会社の資本金の額は当該併合の比率に応じて減少する。","a":false,"c":"","e":"株式の併合がなされても資本金の額に変動はない。"},{"l":5,"m":"株式の消却・併合・分割・無償割当て・1株に満たない端数の処理・単元株制度","sb":"株式の併合","i":"B","r":"(平30I問題6エ類)","q":"公開会社であっても，株式の併合の効力発生日における発行可能株式総数は，効力発生日における発行済株式総数の４倍を超えることができる。","a":false,"c":"180条3項。","e":"公開会社において，株式の併合の効力発生日における発行可能株式総数は，効力発生日における発行済株式総数の４倍を超えることができない。これを許容してしまうと，発行可能株式総数に係る規律（37条３項本文，113条３項１号）を設けた趣旨が達せられなくなるためである。なお，株式の併合をした株式会社は，効力発生日に，株主総会の決議で定められた発行可能株式総数（180 条２項４号）に係る定款の変更をしたものとみなす（182条２項）。"},{"l":6,"m":"株式の消却・併合・分割・無償割当て・1株に満たない端数の処理・単元株制度","sb":"株式の併合","i":"A","r":"(令3問題4ウ類・平30II問題7ア・平23II問題7ア)","q":"種類株式発行会社でない株式会社が２株を１株に併合する株式の併合を行った場合，当該株式会社は，発行可能株式総数を２分の１に減少する旨の定款変更をしたものとみなされる。","a":false,"c":"","e":"このような規定はない。株式の併合がなされた場合，発行済株式総数は減少するが，発行可能株式総数は当然には変動しない。公開会社において，株式の併合の効力発生日における発行可能株式総数は，効力発生日における発行済株式総数の４倍を超えることができないこととされている（180 条３項）。これを許容してしまうと，発行可能株式総数に係る規律（37条３項本文，113条３項１号）を設けた趣旨が達せられなくなるためである。そこで，株式会社は，株式の併合をしようとするときは，その都度，株主総会の特別決議によって，効力発生日における発行可能株式総数を定めなければならない（180条２項４号，309条２項４号）。そして，株式の併合をした株式会社は，効力発生日に，株主総会において決議された定めに従い，発行可能株式総数にかかる定款変更をしたものとみなされる（182条２項）。"},{"l":7,"m":"株式の消却・併合・分割・無償割当て・1株に満たない端数の処理・単元株制度","sb":"株式の併合","i":"B","r":"","q":"株式会社は，株主総会の決議において，株式の併合に係る基準日を決定しなければならない。","a":false,"c":"","e":"株式の併合に係る基準日の設定は義務づけられていない。"},{"l":8,"m":"株式の消却・併合・分割・無償割当て・1株に満たない端数の処理・単元株制度","sb":"株式の併合","i":"A","r":"(平22I問題5エ)","q":"親子会社関係がある場合，子会社が株式の併合をするには，当該子会社において，株主総会の特別決議のほか，親会社以外の株主が有する議決権の過半数の賛成が必要である。","a":false,"c":"180条2項,309条2項4号。","e":"このような規定はない。子会社が株式の併合をするには，当該子会社において，株主総会の特別決議をすれば足りる。"},{"l":9,"m":"株式の消却・併合・分割・無償割当て・1株に満たない端数の処理・単元株制度","sb":"株式の併合","i":"C","r":"(平26II問題4イ)","q":"振替機関は，株式の併合がその効力を生ずる日が到来したときは，発行者に対し，当該株式の併合が効力を生ずる日の株主に関する法定の事項を通知しなければならない。","a":true,"c":"振替法151条1項2号。","e":"振替機関は，株式の併合がその効力を生ずる日が到来したときは，発行者に対し，総株主通知をしなければならない。これに基づいて，振替株式発行会社において株主名簿の名義書換が行われることになる。"},{"l":10,"m":"株式の消却・併合・分割・無償割当て・1株に満たない端数の処理・単元株制度","sb":"株式の併合","i":"B","r":"(令3問題17ウ類・平30II問題7イ類)","q":"単元株式数を定めていない株式会社において，株式の併合が法令または定款に違反する場合，株主が不利益を受けるおそれがあるときであっても，株主は株式会社に対し，当該株式の併合をやめることを請求することができない。","a":false,"c":"182条の3。","e":"株式の併合により端数となる株式の株主を保護する規制（182条の２～182条の６）は，その趣旨に鑑み，端数が生じることによる株主への影響が大きいと考えられる，①単元株式数を定めていない株式会社による株式の併合，および，② 単元株式数を定めている株式会社による株式の併合であって，当該単元株式数（種類株式発行会社では，併合する種類株式の単元株式数）に併合の割合を乗じて得た数に１に満たない端数が生じるものに限って適用することとされている（182条の２第１項柱書かっこ書）。したがって，単元株式数を定めていない株式会社において，株式の併合が法令または定款に違反する場合，株主が不利益を受けるおそれがあるときは，株主は，株式会社に対し，当該株式の併合をやめることを請求することができる。"},{"l":11,"m":"株式の消却・併合・分割・無償割当て・1株に満たない端数の処理・単元株制度","sb":"株式の併合","i":"B","r":"(平30II問題7ウ類・平22I問題5ア類)","q":"単元株式数を定めていない株式会社が株式の併合をする場合には，反対株主は，当該株式会社に対し，自己の有する株式の全部を公正な価格で買い取ることを請求することができる。","a":false,"c":"182条の4第1項。","e":"株式会社が株式の併合をすることにより株式の数に１株に満たない端数が生ずる場合には，反対株主は，当該株式会社に対し，自己の有する株式のうち１株に満たない端数となるものの全部を公正な価格で買い取ることを請求することができる。株式の併合によって生じる１株に満たない端数については，その端数の合計数に相当する株式の売却等で得られた代金を端数に応じて株主に交付することとされているが（235 条１項），多くの端数を売却する場合，端数の対価として適切な代金が交付されないおそれがある。そこで，会社法は，株式の併合によって生じる端数について，株主に対し
