株式の発行等","sb":"新株発行無効・不存在確認の訴え・自己株式処分無効・不存在確認の訴え","i":"B","r":"(平22II問題7イ)","q":"公開会社において，新株発行の無効の訴えの提訴期間は，株式の発行の効力が生じた日から６か月以内であるが，新株発行の不存在の確認の訴えの提訴期間は，株式の発行の効力が生じた日から１年以内である。","a":false,"c":"828条1項2号,829条1号。","e":"新株発行の不存在の確認の訴えには提訴期間は定められていない。"},{"l":16,"m":"募集株式の発行等","sb":"新株発行無効・不存在確認の訴え・自己株式処分無効・不存在確認の訴え","i":"B","r":"(平22II問題7ア)","q":"新株発行の無効は，訴えをもってのみ主張することができるが，新株発行の不存在は，訴えによらなくても主張することができる。","a":true,"c":"828条1項2号,829条1号。","e":"新株発行無効の訴えは形成訴訟になっており，訴えをもって主張しなければならない。それに対し，新株発行の不存在はいつでも誰でもどのような方法でもその不存在を主張でき，対世的効力を得たい場合は，訴えをもってそれを確認することもできる。"},{"l":17,"m":"募集株式の発行等","sb":"新株発行無効・不存在確認の訴え・自己株式処分無効・不存在確認の訴え","i":"B","r":"(平22II問題7ウ)","q":"新株発行の不存在の確認の訴えに係る請求を認容する判決が確定したときは，当該新株発行は，将来に向かって効力を失う。","a":false,"c":"839条かっこ書参照。","e":"新株発行または自己株式処分が不存在である場合は瑕疵が重大であるため，そもそもはじめから新株発行または自己株式処分は存在しない。したがって，新株発行不存在確認の訴え・自己株式処分不存在確認の訴えは，新株発行または自己株式処分がそもそも存在しないことを確認するものであり，判決の確定によって，当該新株発行または自己株式処分が，将来に向かって効力を失うことにはならない。"},{"l":1,"m":"新株予約権","sb":"新株予約権の内容","i":"B","r":"","q":"株式会社が新株予約権を発行する場合において，金銭以外の財産を当該新株予約権の行使に際して出資するときは，その旨ならびに当該財産の内容および価額を当該新株予約権の内容として定めなければならない。","a":true,"c":"236条1項3号。","e":"新株予約権の権利行使時についても，募集株式の発行等の場合と同様に現物出資が認められる。その場合は，あらかじめ新株予約権の内容として，現物出資をする旨と当該財産の内容および価額を定めなければならない。新株予約権の内容として現物出資をする旨を定めた場合，当該新株予約権の行使は，内容として定められた財産を給付して行わなければならず（281条２項），原則として，裁判所選任の検査役の調査を要する（284条）。"},{"l":2,"m":"新株予約権","sb":"新株予約権の内容","i":"B","r":"","q":"種類株式発行会社が新株予約権を発行する場合においては，新株予約権の目的である株式の種類を新株予約権の内容として定めなければならない。","a":true,"c":"236条1項1号かっこ書。","e":""},{"l":3,"m":"新株予約権","sb":"新株予約権の内容","i":"B","r":"(平28I問題6イ)","q":"株式会社は，新株予約権証券を発行する旨の定款の定めがあるときに限り，新株予約権の発行後これに係る新株予約権証券を発行することができる。","a":false,"c":"236条1項10号。","e":"株式の場合，株券不発行の原則により，その株式（種類株式発行会社にあっては，全部の種類の株式）に係る株券を発行する旨を定款で定めない限り，株券を発行することができない（214 条）。これに対して，新株予約権の場合は，新株予約権証券の発行を定款で定めるのではなく，新株予約権の内容として個別に定めれば，新株予約権証券を発行することができる。"},{"l":4,"m":"新株予約権","sb":"新株予約権の内容","i":"C","r":"(令2II問題7ア)","q":"株式会社は，新株予約権の内容として，新株予約権を行使した新株予約権者に交付する株式の数に１株に満たない端数が生ずる場合，これを切り捨てるものとする旨を定めることができる。","a":true,"c":"236条1項9号。","e":"新株予約権を行使した新株予約権者に交付する株式の数に１株に満たない端数が生じるときは，株式会社は新株予約権者にその端数について一定の金銭を交付しなければならない（283 条柱書本文）。ただし，新株予約権を発行するときに，あらかじめ新株予約権の内容として，端数を切り捨てる旨を定めておけば，株式会社は新株予約権者に対して金銭を交付する必要はなく，その端数を切り捨てることができる（同条柱書ただし書）。"},{"l":5,"m":"新株予約権","sb":"新株予約権の内容","i":"A","r":"","q":"金融商品取引法第２条 16 項に規定する金融商品取引所に上場されている株式を発行している株式会社は，取締役の報酬等として当該株式会社の新株予約権を付与するときは，当該新株予約権に係る権利行使価額を当該新株予約権の内容として定めることを要しない。","a":true,"c":"236条3項前段。","e":"金融商品取引法第２条16項に規定する金融商品取引所に上場されている株式を発行している株式会社（上場会社）は，取締役の報酬等として当該株式会社の新株予約権を付与するとき（361 条１項４号）または取締役の報酬等をもってする払込みと引換えに新株予約権を発行するとき（同条項５号ロ）は，236 条１項２号に規定される権利行使価額を当該新株予約権の内容として定めることを要しない。なお，この場合においては，以下の事項を当該新株予約権の内容としなければならない（236条３項後段）。(ⅰ) 取締役の報酬等としてまたは取締役の報酬等をもってする払込みと引換えに新株予約権を発行するものであり，当該新株予約権の行使に際してする金銭の払込みまたは財産の給付を要しない旨(ⅱ) 報酬等を付与する対象となる取締役（取締役であった者を含む。）以外の者は，当該新株予約権を行使することができない旨"},{"l":6,"m":"新株予約権","sb":"新株予約権の内容","i":"C","r":"(平20問題6エ)","q":"新株予約権付社債に付された新株予約権の数は，当該新株予約権付社債についての社債の金額ごとに，均等に定めなければならない。","a":true,"c":"236条2項。","e":""},{"l":1,"m":"新株予約権","sb":"募集新株予約権の募集事項","i":"A","r":"(令2II問題7イ・平29II問題7ア類・平27II問題5ア・平23I問題6ア類)","q":"株式会社が，募集新株予約権を株主以外の者に無償で発行するには，その旨の定款の定めがなければならない。","a":false,"c":"238条1項2号。","e":"株式会社は，募集新株予約権と引換えに金銭の払込みを要しないこととするときは，その旨を募集事項で定めなければならないが，定款に定めることは要求されていない。"},{"l":2,"m":"新株予約権","sb":"募集新株予約権の募集事項","i":"B","r":"","q":"募集新株予約権の募集事項は，募集ごとに均等に定めなければならない。","a":true,"c":"238条5項。","e":""},{"l":1,"m":"新株予約権","sb":"株主割当て以外の方法による募集新株予約権の発行","i":"A","r":"(令2II問題7エ・平24I問題6ウ類)","q":"公開会社が，自己新株予約権を処分する場合に，払込金額が当該自己新株予約権を取得する者に特に有利な金額であるときは，株主総会の特別決議を要する。","a":false,"c":"","e":"自己株式の処分の場合と異なり，自己新株予約権の処分については募集新株予約権の発行の手続により行う必要はない。したがって，自己新株予約権の処分は，通常の資産の売却と同様に行うことができる。"},{"l":2,"m":"新株予約権","sb":"株主割当て以外の方法による募集新株予約権の発行","i":"A","r":"","q":"公開会社において，株主割当て以外の方法による募集新株予約権の発行の決定は，原則として，取締役会の決議によらなければならない。","a":true,"c":"238条2項,240条1項。","e":""},{"l":3,"m":"新株予約権","sb":"株主割当て以外の方法による募集新株予約権の発行","i":"A","r":"(平28I問題6エ)","q":"公開会社でない株式会社が，株主割当て以外の方法による募集新株予約権を発行するには，株主総会の特別決議を経なければならない。","a":true,"c":"238条2項,309条2項6号。","e":""},{"l":4,"m":"新株予約権","sb":"株主割当て以外の方法による募集新株予約権の発行","i":"B","r":"","q":"公開会社において，株主割当て以外の方法による募集新株予約権の発行の際に，募集新株予約権と引換えに金銭の払込みを要しないこととする場合は，株主総会の特別決議によって募集事項を定めなければならない。","a":false,"c":"238条3項1号,240条1項,238条2項,309条2項6号。","e":"公開会社において，株主割当て以外の方法による募集新株予約権の発行の際に，募集新株予約権と引換えに金銭の払込みを要しない場合において，金銭の払込みを要しないこととすることが募集新株予約権を引き受ける者に特に有利な条件であるときは，有利発行に該当し，株主総会の特別決議によって募集事項を定めなければならない。また，取締役は，当該株主総会において，有利発行を必要とする理由を説明しなければならない（238条３項）。"},{"l":5,"m":"新株予約権","sb":"株主割当て以外の方法による募集新株予約権の発行","i":"A","r":"(平29II問題7エ・平26I問題6ウ)","q":"公開会社において，募集新株予約権の募集事項の決定時の株式の時価より，新株予約権の行使に際して出資される財産の価額を著しく低い金額とする旨の決定は，株主総会の特別決議によらなければならない。","a":false,"c":"238条3項2号,240条1項,238条2項,309条2項6号。","e":"公開会社において，株主割当て以外の方法による募集新株予約権の発行の際に，募集新株予約権と引換えに金銭の払込みを要する場合において，払込金額が募集新株予約権を引き受ける者に特に有利な金額であるときは，有利発行に該当し，株主総会の特別決議によって募集事項を定めなければならない。ここで，有利発行に該当する場合というのは，① 募集新株予約権と引換えに金銭の払込みを要しない場合において，金銭の払込みを要しないこととすることが募集新株予約権を引き受ける者に特に有利な条件であるとき，または，② 募集新株予約権と引換えに金銭の払込みを要する場合において，払込金額が募集新株予約権を引き受ける者に特に有利な金額であるときとされている。そのため，適正な条件や払込金額が募集事項において定められている場合は，権利行使価額が株価より著しく低いときであっても，有利発行には該当しない。また，取締役は，当該株主総会において，有利発行を必要とする理由を説明しなければならない（238条３項）。"},{"l":6,"m":"新株予約権","sb":"株主割当て以外の方法による募集新株予約権の発行","i":"B","r":"(平27II問題5イ)","q":"種類株式発行会社である株式会社は，譲渡制限株式を目的とする新株予約権に係る募集事項を決定する場合に，当該種類の株式の種類株主を構成員とする種類株主総会の決議を要しない旨の定款の定めを置くことができない。","a":false,"c":"238条4項。","e":"種類株式発行会社が株主割当て以外の方法により募集新株予約権を発行する場合で，募集新株予約権の目的である株式が譲渡制限株式である場合には，募集事項の決定は，当該譲渡制限株式の株主を構成員とする種類株主総会の特別決議が必要とされる（324条２項３号）。ただし，当該種類株主総会の決議を要しない旨の定款の定めがある場合，または，当該種類株主総会において議決権を行使することができる種類株主が存在しない場合には，種類株主総会の特別決議は不要とされている。"},{"l":7,"m":"新株予約権","sb":"株主割当て以外の方法による募集新株予約権の発行","i":"B","r":"","q":"公開会社において，株主割当て以外の方法による募集新株予約権の発行の際に，募集新株予約権の募集事項を決定した場合は，有利発行である場合を除き，払込期日または払込期間の初日の２週間前までに，株主に対して募集事項を通知または公告しなければならない。","a":false,"c":"240条2項3項。","e":"公開会社において，募集新株予約権の募集事項を決定した場合は，有利発行である場合を除き，割当日の２週間前までに，株主に対して募集事項を通知または公告しなければならない。"},{"l":8,"m":"新株予約権","sb":"株主割当て以外の方法による募集新株予約権の発行","i":"B","r":"(平26I問題6ア)","q":"公開会社でない株式会社は，株主割当て以外の方法による募集新株予約権の発行の際に，募集新株予約権の募集事項を定めた場合には，株主に新株予約権の割当てを受ける権利を与えるときを除き，割当日の２週間前までに，株主に対し，当該募集事項を通知しなければならない。","a":false,"c":"","e":"非公開会社において株主割当て以外の方法による募集新株予約権の発行をする場合，募集事項の決定については株主総会の特別決議が要求されているため（取締役または取締役会に委任される場合も特別決議が必要），募集事項の詳細を株主は知っていることから，株主への通知または公告は不要とされている。"},{"l":9,"m":"新株予約権","sb":"株主割当て以外の方法による募集新株予約権の発行","i":"B","r":"","q":"公開会社でない取締役会設置会社において，株主割当て以外の募集新株予約権の発行を，株主総会の特別決議によって取締役会に委任することができる。","a":true,"c":"239条1項前段。","e":"この場合には，株主総会の特別決議によって，① 委任に基づいて募集事項の決定をすることができる募集新株予約権の内容および数の上限，② 募集新株予約権につき金銭の払込みを要しないこととする場合には，その旨，③ 募集新株予約権につき金銭の払込みを要する場合には，募集新株予約権の払込金額の下限を定めなければならない（239条１項後段）。"},{"l":10,"m":"新株予約権","sb":"株主割当て以外の方法による募集新株予約権の発行","i":"C","r":"","q":"募集新株予約権の募集事項の決定を取締役または取締役会に委任する株主総会の特別決議は，割当日が当該決議の日から１年以内の日である募集事項についてのみその効力を有する。","a":true,"c":"239条3項。","e":""},{"l":11,"m":"新株予約権","sb":"株主割当て以外の方法による募集新株予約権の発行","i":"B","r":"(令4I問題7エ)","q":"最高裁判所の判例の趣旨によれば，公開会社でない株式会社において，募集新株予約権の発行に際して，株主総会決議による委任を受けて取締役会が新株予約権の行使条件を定めた場合には，当該募集新株予約権の発行後に当該行使条件を取締役会決議によって変更することに制限はなく，当該行使条件を変更する取締役会決議は有効と解される。","a":false,"c":"最判平24年4月24日。","e":"判例によれば，取締役会が株主総会決議による委任を受けて新株予約権の行使条件を定めた場合に，新株予約権の発行後に当該行使条件を変更することができる旨の明示の委任がないときは，当該新株予約権の発行後に行使条件を変更することは原則として許されず，これを変更する取締役会決議は，行使条件の細目的な変更をするにとどまるものであるときを除き，無効である。株主総会の委任の趣旨は，株主総会当時の諸事情の下における適切な行使条件を定めることを委任する趣旨のものであり，一旦定めた行使条件を新株予約権の発行後に適宜実質的に変更することまで委任する趣旨のものではないためである。また，取締役会による行使条件の変更は，新株予約権の内容の実質的な変更に至らない行使条件の細目的な変更にとどまるものでない限り，新たに新株予約権を発行したものというに等しく，株主の利益保護のために，新株予約権の発行にはその都度株主総会の決議を必要とした法の趣旨に反するからである。"},{"l":1,"m":"新株予約権","sb":"株主割当ての方法による募集新株予約権の発行","i":"B","r":"","q":"公開会社でない取締役会設置会社における株主割当ての方法による募集新株予約権の発行の決定は，定款に別段の定めがある場合を除き，取締役会の決議による。","a":false,"c":"241条3項4号,309条2項6号。","e":"非公開会社において，株主割当ての方法により募集新株予約権の発行をしようとする場合には，募集事項その他の決定は原則として株主総会の特別決議によらなければならない。ただし，募集事項その他の決定を取締役の決定（取締役会設置会社では取締役会の決議）によって定めることができる旨の定款の定めがある場合は，当該募集事項その他の決定は取締役の決定（取締役会設置会社では取締役会の決議）によって定めなければならない（241条３項１号２号）。"},{"l":2,"m":"新株予約権","sb":"株主割当ての方法による募集新株予約権の発行","i":"B","r":"","q":"種類株式発行会社は，株主割当ての方法による募集新株予約権の発行の際に，ある種類株式を有する種類株主に対して，他の種類株式を目的とする新株予約権を割り当てることを定めることができる。","a":false,"c":"241条1項1号かっこ書。","e":"種類株式発行会社が，株主割当ての方法による募集新株予約権の発行の際に，ある種類株式を有する種類株主に対して，他の種類株式を目的とする新株予約権を割り当てることを定めることはできない。"},{"l":3,"m":"新株予約権","sb":"株主割当ての方法による募集新株予約権の発行","i":"B","r":"","q":"株式会社は，株主割当ての方法による募集新株予約権の発行の際に，募集新株予約権の募集事項その他の決定事項を定めた場合には，引受けの申込期日の２週間前までに，割当てを受ける権利を与える株主に対して，募集事項等を必ず通知しなければならない。","a":true,"c":"241条4項。","e":"株主の新株予約権の引受けの申込みの機会を確保するためである。"},{"l":1,"m":"新株予約権","sb":"募集新株予約権の割当て","i":"C","r":"","q":"総数引受契約を締結する場合以外の場合において，取締役会設置会社が申込者の中から譲渡制限新株予約権の割当てを受ける者を定め，かつ，その者に割り当てる募集新株予約権の数を定めるためには，定款に別段の定めがある場合を除き，取締役会の決議を経なければならない。","a":true,"c":"243条2項。","e":"① 募集新株予約権の目的である株式の全部または一部が譲渡制限株式である場合，または，② 募集新株予約権が譲渡制限新株予約権である場合，割当先の決定は，株主総会の特別決議（取締役会設置会社では取締役会）によらなければならない（243 条２項柱書本文，309 条２項６号）。ただし，定款で別段の定めを置くことが認められている（243条２項柱書ただし書）。なお，総数引受契約を締結する場合も同様の規定が設けられている（244条３項）。"},{"l":1,"m":"新株予約権","sb":"公開会社における支配株主の異動を伴う募集新株予約権の発行","i":"C","r":"","q":"特定引受人とは，募集新株予約権の引受人（その子会社等を含む）がその引き受けた募集新株予約権の目的である株式の株主となった場合に有することとなる議決権の数のその場合における総株主の議決権の数に対する割合が２分の１を超える場合の当該引受人をいう。","a":false,"c":"244条の2第1項1号。","e":"特定引受人とは，「募集新株予約権の引受人（その子会社等を含む）がその引き受けた募集新株予約権に係る交付株式の株主となった場合に有することとなる最も多い議決権の数」の「その場合における最も多い総株主の議決権の数」に対する割合が２分の１を超える場合の当該引受人をいう。ここで，交付株式とは，① 募集新株予約権の目的である株式（236 条１項１号），② 募集新株予約権が取得条項付新株予約権である場合のその取得と引換えに交付される株式（236条１項７号ニ），③ その他募集新株予約権の新株予約権者が交付を受ける株式として法務省令（会社法施行規則 55 条の３）で定める株式をいう（244 条の２第２項）。このように，新株予約権の行使の他に株式の交付を受ける方法が存在する募集新株予約権については，交付株式として複数のものが考えられることとなる。この場合，募集新株予約権の引受人が交付株式の株主となった場合に有することとなる議決権の数も，複数のものが存在することとなるが，これらのうち最も多い数を基準として議決権保有割合を定めることとしている。"},{"l":2,"m":"新株予約権","sb":"公開会社における支配株主の異動を伴う募集新株予約権の発行","i":"C","r":"","q":"特定引受人とは，募集新株予約権の引受人（その子会社等を含む）がその引き受けた募集新株予約権に係る交付株式の株主となった場合に有することとなる最も多い議決権の数の当該募集新株予約権の引受人の全員がその引き受けた募集新株予約権に係る交付株式の株主となった場合における総株主の議決権の数に対する割合が２分の１を超える場合の当該引受人をいう。","a":false,"c":"244条の2第1項2号。","e":"特定引受人とは，「募集新株予約権の引受人（その子会社等を含む）がその引き受けた募集新株予約権に係る交付株式の株主となった場合に有することとなる最も多い議決権の数」の「その場合における最も多い総株主の議決権の数」に対する割合が２分の１を超える場合の当該引受人をいう。分母となる総株主の議決権数は，募集株式の割当て等の場合と異なり，当該募集新株予約権の引受人の全員ではなく，特定引受人（その子会社等を含む）のみが，その引き受けた募集新株予約権に係る交付株式の株主となったと仮定して計算する。すなわち，特定引受人以外の引受人が，その引き受けた募集新株予約権に係る交付株式の株主となったとは考えないで計算するのである。これは，他の引受人が新株予約権を行使しない可能性があることから，特定引受人の議決権割合の最大の可能性を算定するうえでは，分母から除外して計算するのが適当であると考えられたためである。"},{"l":1,"m":"新株予約権","sb":"新株予約権者となる日","i":"A","r":"(令5II問題7ウ類・令4I問題7ウ類・平29II問題7ウ類・平24I問題6エ類)","q":"募集新株予約権の申込者は，募集新株予約権の払込期日に，株式会社の割り当てた募集新株予約権の新株予約権者となる。","a":false,"c":"245条1項。","e":"募集新株予約権の申込者は，割当日に，株式会社の割り当てた募集新株予約権の新株予約権者となる。すなわち，募集新株予約権の効力発生日は，割当日である。"},{"l":2,"m":"新株予約権","sb":"新株予約権者となる日","i":"A","r":"(平28I問題6ア)","q":"募集新株予約権の引受人が，自己の引き受けた新株予約権について，払込金額に係る金銭の払込みまたはそれに代わる金銭以外の財産の給付をしない場合であっても，当該引受人は，当該新株予約権の割当日に当該新株予約権に係る新株予約権者となる。","a":true,"c":"245条1項。","e":"募集新株予約権の引受人は，募集事項に定める割当日に新株予約権者となり，払込み等を要する場合であっても，その払込み等を待たずして新株予約権者となる。そして，新株予約権者は，募集新株予約権についての払込期日までに，それぞれの募集新株予約権の払込金額の全額の払込み（当該払込みに代えてする金銭以外の財産の給付または当該株式会社に対する債権をもってする相殺を含む）をしないときは，当該募集新株予約権を行使することができない（246条３項）。なお，行使することができなくなった新株予約権は消滅する（287条）。"},{"l":1,"m":"新株予約権","sb":"募集新株予約権に係る払込み","i":"B","r":"","q":"募集新株予約権と引換えに金銭の払込みを要する場合には，新株予約権者は，払込期日までに，会社が定めた払込取扱機関において，それぞれの募集新株予約権の払込金額の全額を払い込まなければならない。","a":true,"c":"246条1項。","e":""},{"l":2,"m":"新株予約権","sb":"募集新株予約権に係る払込み","i":"C","r":"","q":"募集新株予約権に係る払込期日は，募集事項において募集新株予約権と引換えに金銭を払い込むべき期日が定められていなければ，新株予約権の行使期間の初日の前日となる。","a":true,"c":"246条1項。","e":""},{"l":3,"m":"新株予約権","sb":"募集新株予約権に係る払込み","i":"A","r":"(令5II問題7ア類・平28I問題6ウ・平24I問題6イ類・平21問題14イ類)","q":"新株予約権者が，株式会社の承諾を得て，募集新株予約権の払込金額に係る金銭の払込みに代えて金銭以外の財産を給付する場合，当該株式会社は，当該財産の価額を調査させるため，検査役の選任を裁判所に申し立てなければならない。","a":false,"c":"246条2項。","e":"株式会社の承諾を得れば，現物財産の給付は事前に定めておく必要もなく，検査役の調査も必要はない。なぜなら，募集新株予約権の発行は，募集株式の発行等のような出資行為ではなく，新株予約権者にとって，募集新株予約権の払込みは会社に対する債務の履行にすぎないためである。"},{"l":4,"m":"新株予約権","sb":"募集新株予約権に係る払込み","i":"A","r":"(令2II問題7ウ類・平26I問題6イ類)","q":"新株予約権者は，株式会社の承諾を得たとしても，募集新株予約権に係る金銭の払込みに代えて，当該株式会社に対する債権をもって相殺することは認められない。","a":false,"c":"246条2項。","e":"新株予約権者は，株式会社の承諾を得て，募集新株予約権に係る金銭の払込みに代えて，当該株式会社に対する債権をもって相殺することが認められる。なぜなら，募集新株予約権の発行は，募集株式の発行等のような出資行為ではなく，新株予約権者にとって，募集新株予約権の払込みは会社に対する債務の履行にすぎないためである。"},{"l":5,"m":"新株予約権","sb":"募集新株予約権に係る払込み","i":"C","r":"","q":"新株予約権者は，募集新株予約権についての払込期日までに，それぞれの募集新株予約権の払込金額の全額の払込み，金銭以外の財産の給付，または当該株式会社に対する債権をもってする相殺をしないときは，当該募集新株予約権を行使することができない。","a":true,"c":"246条3項。","e":"なお，行使することができなくなった新株予約権は消滅する（287条）。"},{"l":1,"m":"新株予約権","sb":"募集新株予約権発行の差止請求権","i":"B","r":"","q":"募集新株予約権の発行が法令に違反する場合において，新株予約権者が不利益を受けるおそれがあるときには，当該新株予約権者は，株式会社に対して，募集新株予約権発行の差止めを請求することができる。","a":false,"c":"247条。","e":"募集新株予約権の発行が法令または定款に違反する場合，もしくは，著しく不公正な方法により行われる場合において，株主が不利益を受けるおそれがあるときには，株主は，株式会社に対して，募集新株予約権発行の差止めを請求することができる。"},{"l":1,"m":"新株予約権","sb":"新株予約権発行無効の訴え","i":"B","r":"","q":"新株予約権発行無効の訴えの提訴権者には，新株予約権者が含まれる。","a":true,"c":"828条2項4号。","e":""},{"l":1,"m":"新株予約権","sb":"新株予約権証券","i":"B","r":"(平28I問題6イ類)","q":"株式会社は，その新株予約権に係る新株予約権証券を発行する場合には，その旨を定款で定めなければならない。","a":false,"c":"236条1項10号。","e":"株式の場合，株券不発行の原則により，その株式（種類株式発行会社にあっては，全部の種類の株式）に係る株券を発行する旨を定款で定めないかぎり，株券を発行することができない（214 条）。これに対して，新株予約権の場合は，新株予約権証券の発行を定款で定めるのではなく，新株予約権の内容として個別に定めれば，新株予約権証券を発行することができる（236条１項10号）。"},{"l":2,"m":"新株予約権","sb":"新株予約権証券","i":"B","r":"","q":"公開会社は，新株予約権者から請求があるときまでは，新株予約権証券を発行しないことができる。","a":true,"c":"288条2項。","e":"株券の場合，非公開会社に限って，株主から請求があるときまでは，株券を発行しないことができる（215条４項）。これに対して，新株予約権証券の場合，公開会社・非公開会社を問わず，新株予約権者から請求があるときまでは，新株予約権証券を発行しないことができる。"},{"l":3,"m":"新株予約権","sb":"新株予約権証券","i":"B","r":"","q":"新株予約権証券の占有者は，当該新株予約権証券に係る証券発行新株予約権についての権利を適法に有するものと推定する。","a":true,"c":"258条1項。","e":"新株予約権証券の占有者は実質的な新株予約権者である可能性が高いためである。また，新株予約権証券には善意取得の制度も設けられている（258条２項）。"},{"l":4,"m":"新株予約権","sb":"新株予約権証券","i":"B","r":"(平31II問題7エ類)","q":"新株予約権証券を喪失した者は，株式会社に対し，新株予約権喪失登録を請求することができる。","a":false,"c":"291項1項。","e":"株券を喪失した場合，株券の再発行を受けるには，株券喪失登録制度（221 条以下）による。これに対して，新株予約権証券を喪失した場合，喪失登録制度は設けられていないため，公示催告・除権決定の手続によることになる。"},{"l":5,"m":"新株予約権","sb":"新株予約権証券","i":"B","r":"(平31II問題7ア)","q":"証券発行新株予約権の新株予約権者は，株式会社に対し，当該新株予約権者の有する新株予約権に係る新株予約権証券の所持を希望しない旨を申し出ることができる。","a":false,"c":"","e":"株券発行会社の株主は株券不所持制度（217 条）により当該株券発行会社に対し，当該株主の有する株式に係る株券の所持を希望しない旨を申し出ることができるが，これに対して，新株予約権証券不所持制度は設けられていない。"},{"l":1,"m":"新株予約権","sb":"新株予約権原簿","i":"C","r":"","q":"株主名簿管理人を置いている株式会社が新株予約権を発行する場合は，当該株主名簿管理人に新株予約権原簿に関する事務を委託することとなる。","a":true,"c":"251条。","e":""},{"l":1,"m":"新株予約権","sb":"新株予約権付社債","i":"C","r":"(平22II問題16エ)","q":"公開会社でない株式会社は，株主総会の普通決議によって，新株予約権付社債の発行を決定することができる。","a":false,"c":"238条2項,309条2項6号,248条。","e":"新株予約権付社債の募集手続については，募集社債の規定（676条～680条）は適用されない（248条）。新株予約権付社債の募集をする場合は，募集新株予約権の募集事項において，社債の募集の際に定めるべき事項も定めることとされている（238条１項６号）。すなわち，新株予約権の募集の規定が適用されることとなる。したがって，社債に関する募集事項の決定や申込み，割当ての規定は適用されない。また，公開会社でない会社における新株予約権の募集事項の決定は，株主総会の特別決議を要する。"},{"l":2,"m":"新株予約権","sb":"新株予約権付社債","i":"C","r":"","q":"新株予約権付社債について証券を発行する場合は，新株予約権証券に，当該新株予約権付社債に係る社債が表章されることなる。","a":false,"c":"292条1項,236条1項10号参照。","e":"新株予約権付社債について証券を発行する場合（新株予約権付社債券）は，新株予約権証券は発行されずに，社債券に当該新株予約権が表章されることになる。"},{"l":1,"m":"新株予約権","sb":"新株予約権の譲渡","i":"B","r":"","q":"新株予約権者がその有する新株予約権を譲渡する場合には，株式会社の承認を得なければならない。","a":false,"c":"254条1項。","e":"新株予約権者は，その有する新株予約権を原則として自由に譲渡することができる。"},{"l":2,"m":"新株予約権","sb":"新株予約権の譲渡","i":"B","r":"","q":"新株予約権付社債に付された新株予約権のみを譲渡することは，原則として認められない。","a":true,"c":"254条2項本文。","e":"新株予約権の譲渡は自由であるというのが原則であるが，新株予約権付社債は，新株予約権と社債をそれぞれ分離して譲渡することは認められないため，新株予約権付社債に付された新株予約権は社債と一体として譲渡しなければならない。ただし，新株予約権付社債についての社債が消滅した場合は，当該新株予約権付社債に付されていた新株予約権は自由に譲渡することができ，また，新株予約権付社債に付されていた新株予約権が消滅した場合は，当該新株予約権付社債についての社債は自由に譲渡することができる（254条２項３項）。"},{"l":3,"m":"新株予約権","sb":"新株予約権の譲渡","i":"B","r":"","q":"自己新株予約権の処分による証券発行新株予約権の譲渡は，当該証券発行新株予約権に係る新株予約権証券を交付しなければ，その効力を生じない。","a":false,"c":"255条1項ただし書。","e":"自己新株予約権の処分による証券発行新株予約権の譲渡は，当該証券発行新株予約権に係る新株予約権証券を交付せずともその効力が生じる。"},{"l":4,"m":"新株予約権","sb":"新株予約権の譲渡","i":"B","r":"(平24I問題6ア・平23I問題6イ類)","q":"譲渡による新株予約権の取得について株式会社の承認を要することとするときは，定款にその旨を定めなければならない。","a":false,"c":"236条1項6号。","e":"新株予約権に譲渡制限を付す場合には，定款にその旨を定める必要はなく，新株予約権の内容として定めればよい。"},{"l":5,"m":"新株予約権","sb":"新株予約権の譲渡","i":"A","r":"(令5II問題7イ・平27II問題5ウ類)","q":"譲渡制限新株予約権の新株予約権者は，株式会社に対し譲渡等承認請求をする際に，当該株式会社が譲渡を承認しない旨の決定をする場合には，当該株式会社または当該株式会社の指定する者が当該譲渡制限新株予約権を買い取ることを請求することができる。","a":false,"c":"","e":"譲渡制限新株予約権の場合には，会社が承認しない場合の会社の買取りまたは指定買取人の指定請求の制度はない。この理由として，新株予約権をストックオプションとして付与する場合には，当該新株予約権に譲渡制限を付すことが通常であるが，ストックオプションを付与された役員から譲渡承認請求された場合に会社が買取り等をしなければならないとなると，インセンティブ報酬としての目的を達成することができないからである。また，会社の買取り等の制度がないと新株予約権者の投下資本回収が困難になるとも考えられるが，新株予約権を行使して株式を取得すれば，それを譲渡することができるので問題はないのである。"},{"l":1,"m":"新株予約権","sb":"自己新株予約権の取得","i":"B","r":"(平27II問題5エ類)","q":"株式会社は，当該株式会社が取得することのできる事由を新株予約権の内容として定めた場合において，当該事由が生じた場合にのみ自己新株予約権を取得することができる。","a":false,"c":"","e":"自己新株予約権は，自己株式の場合（155条参照）のように，取得できる場合が限定されていない。"},{"l":2,"m":"新株予約権","sb":"自己新株予約権の取得","i":"C","r":"","q":"株式会社は，取得条項付新株予約権の内容として，取得事由が生じたときに，当該取得条項付新株予約権の一部を取得することを定めることができる。","a":true,"c":"236条1項7号ハ。","e":""},{"l":3,"m":"新株予約権","sb":"自己新株予約権の取得","i":"C","r":"(令4I問題7ア類)","q":"取締役会設置会社が自己新株予約権を消却する場合，当該決定は，取締役会の決議によらなければならない。","a":true,"c":"276条2項。","e":""},{"l":1,"m":"新株予約権","sb":"新株予約権無償割当て","i":"B","r":"","q":"株式会社は，新株予約権者に対して，新たに払込みをさせないで，当該株式会社の新株予約権の割当てをすることができる。","a":false,"c":"277条。","e":"株式会社は，株主に対して，新たに払込みをさせないで，当該株式会社の新株予約権の割当てをすることができる。"},{"l":2,"m":"新株予約権","sb":"新株予約権無償割当て","i":"B","r":"","q":"種類株式発行会社は，ある種類の種類株主に対して，新株予約権無償割当てをすることはできない。","a":false,"c":"277条かっこ書。","e":"種類株式発行会社は，ある種類の種類株主に対して新株予約権無償割当てをすることができる。"},{"l":3,"m":"新株予約権","sb":"新株予約権無償割当て","i":"B","r":"","q":"種類株式発行会社は，ある種類の種類株主に対して，他の種類株式を目的とする新株予約権を割り当てることを定めた新株予約権無償割当てをすることができる。","a":true,"c":"278条1項1号参照。","e":""},{"l":4,"m":"新株予約権","sb":"新株予約権無償割当て","i":"B","r":"","q":"取締役会設置会社における新株予約権無償割当ての決定は，株主総会の普通決議によらなければならない。","a":false,"c":"278条3項。","e":"新株予約権無償割当ての決定は，株主総会の普通決議（取締役会設置会社では取締役会の決議）によらなければならない。"},{"l":5,"m":"新株予約権","sb":"新株予約権無償割当て","i":"B","r":"(令5I問題7ウ・平20問題6ア類)","q":"最高裁判所の判例によれば，特定の株主により株式会社の経営支配権を取得しようとする行為が行われている場合に，当該株式会社がこれを阻止するため，当該特定の株主以外の株主が行使することができるという条件を付した新株予約権の無償割当てには，株主平等の原則の趣旨が及ばない。","a":false,"c":"最判平19年8月7日。","e":"株式会社がある特定の株主による株式公開買付けに対抗し，当該特定の株主の議決権割合の低下を目的として，当該特定の株主は行使することができないという差別的な取扱いを内容とする新株予約権の無償割当てを株主総会の特別決議で行った事例が存在する（ブルドックソース事件）。ここで，新株予約権の無償割当ては，株主に対し，株主としての資格に基づいて新株予約権の割当てを行うものであるので，特定の株主は行使することができないという差別的な取扱いを内容とする新株予約権の無償割当てが，株主平等原則（109条１項）に反しないかが問題となる。この点，新株予約権の無償割当てについても株主平等原則の趣旨は及ぶが，ある特定の株主による経営支配権取得により会社の企業価値が毀損され，株主の利益ひいては株主の共同の利益が害されることになるような場合には，その防止のために当該株主を差別的に扱ったとしても，当該取扱いが衡平の理念に反し，相当性を欠くものでない限り，直ちに株主平等原則に反するものではないと解されることとなる。"},{"l":1,"m":"新株予約権","sb":"新株予約権の質入れ","i":"B","r":"(平23I問題6ウ)","q":"新株予約権者は，その有する新株予約権に質権を設定することはできない。","a":false,"c":"267条1項。","e":"新株予約権者は，その有する新株予約権に質権を設定することができる。"},{"l":2,"m":"新株予約権","sb":"新株予約権の質入れ","i":"A","r":"(令6I問題16ウ類・令4I問題7イ・平29II問題7イ・平24II問題7ア類・平20問題6ウ類)","q":"新株予約権付社債についての社債が消滅した場合を除き，新株予約権付社債に付された新株予約権のみに質権を設定することはできない。","a":true,"c":"267条2項。","e":"また，新株予約権付社債についての社債のみに質権を設定することは，新株予約権が消滅した場合を除き認められない（267条３項）。"},{"l":3,"m":"新株予約権","sb":"新株予約権の質入れ","i":"B","r":"","q":"証券発行新株予約権の質入れは，当該証券発行新株予約権に係る新株予約権証券の交付がなくても，その効力が生じる。","a":false,"c":"267条4項。","e":"証券発行新株予約権の質入れは，当該証券発行新株予約権に係る新株予約権証券を交付しなければ，その効力を生じない。"},{"l":4,"m":"新株予約権","sb":"新株予約権の質入れ","i":"B","r":"(平31II問題7ウ・平24II問題7イ)","q":"証券発行新株予約権の質権者は，継続して当該証券発行新株予約権に係る新株予約権証券を占有しなければ，その質権をもって株式会社その他の第三者に対抗することができない。","a":true,"c":"268条2項。","e":""},{"l":5,"m":"新株予約権","sb":"新株予約権の質入れ","i":"C","r":"(平24II問題7エ)","q":"新株予約権に質権を設定した者は，株式会社に対し，質権の設定日を新株予約権原簿に記載し，または記録することを請求することができる。","a":false,"c":"269条1項。","e":"新株予約権に質権を設定した者は，株式会社に対し，① 質権者の氏名または名称および住所，② 質権の目的である新株予約権を新株予約権原簿に記載し，または記録することを請求することができるが，質権の設定日を新株予約権原簿に記載し，または記録することを請求することはできない。"},{"l":6,"m":"新株予約権","sb":"新株予約権の質入れ","i":"B","r":"(平24II問題7ウ)","q":"新株予約権を目的とする質権は，株式会社が当該新株予約権を取得することによって当該新株予約権の新株予約権者が受けることのできる金銭等について存在する。","a":true,"c":"272条1項1号。","e":"新株予約権の質入れについては，株式の場合（151条）と同様に，物上代位的効力が認められる。"},{"l":1,"m":"新株予約権","sb":"新株予約権の行使","i":"B","r":"","q":"株式会社は自己新株予約権を行使することができる。","a":false,"c":"280条6項。","e":"株式会社は自己新株予約権を行使することができない。株式会社が自己株式を原始取得するのは妥当ではないためである。"},{"l":2,"m":"新株予約権","sb":"新株予約権の行使","i":"A","r":"(平31II問題7イ・平26I問題6エ)","q":"証券発行新株予約権の新株予約権者は，当該証券発行新株予約権を行使しようとする場合には，新株予約権証券が発行されていないときを除き，当該証券発行新株予約権に係る新株予約権証券を株式会社に提出しなければならない。","a":true,"c":"280条2項。","e":""},{"l":3,"m":"新株予約権","sb":"新株予約権の行使","i":"C","r":"","q":"新株予約権の行使に際して金銭以外の財産を出資の目的とする場合で，当該財産の価額が権利行使価額に足りないときは，株式会社が定めた払込取扱機関において，その差額に相当する金銭を払い込まなければならない。","a":true,"c":"281条2項後段。","e":"新株予約権の行使の場合，新株予約権の発行から行使までの間に相当の期間があると考えられるため，新株予約権を発行するときに決めておいた権利行使価額と当該財産の価額との間に差額が生じた場合には，その不足額を金銭で払込むことが求められているのである。"},{"l":4,"m":"新株予約権","sb":"新株予約権の行使","i":"B","r":"","q":"新株予約権者は，新株予約権の行使に際して，金銭を払込む債務または現物出資財産を給付する債務と，会社に対する債権とを相殺することができる。","a":false,"c":"281条3項。","e":"新株予約権者は，新株予約権の行使に際して，金銭を払込む債務または現物出資財産を給付する債務と，会社に対する債権とを相殺することができない。これは，募集株式の発行等における払込みにおける募集株式引受人の側からの相殺禁止（208条３項）と同様の規定である。"},{"l":5,"m":"新株予約権","sb":"新株予約権の行使","i":"A","r":"(令5II問題7エ類・平23I問題6エ類)","q":"新株予約権を行使した新株予約権者は，当該新株予約権の権利行使期間の末日に，当該新株予約権の目的である株式の株主となる。","a":false,"c":"282条1項。","e":"新株予約権を行使した新株予約権者は，当該新株予約権を行使した日に，当該新株予約権の目的である株式の株主となる。"},{"l":6,"m":"新株予約権","sb":"新株予約権の行使","i":"B","r":"","q":"株式会社は，新株予約権の内容として金銭以外の財産を出資の目的とすることを定めた場合は，原則として，権利行使による現物出資財産の給付があった後，遅滞なく，現物出資財産の価額を調査させるため，裁判所に対して，検査役の選任の申立てをしなければならない。","a":true,"c":"284条1項。","e":"なお，例外的に検査役の調査が不要となる場合は，募集株式の発行等の場合（207条９項各号）と同様である（284条９項）。"},{"l":1,"m":"新株予約権","sb":"著しく不公正な条件・払込金額で新株予約権を引き受けた者の責任","i":"C","r":"","q":"募集新株予約権と引換えに払込みを要する場合で，取締役と通じて著しく不公正な払込金額で新株予約権を引き受けた新株予約権者が当該新株予約権を行使したときは，当該新株予約権を行使した新株予約権者は，株式会社に対して，当該払込金額と当該新株予約権の公正な価額との差額に相当する金額を支払う義務を負う。","a":true,"c":"285条1項2号。","e":"会社が新株予約権を不公正な払込金額で発行した場合でも，新株予約権が行使されるまでは，新株予約権者は単なる債権者にすぎない。したがって，新株予約権を行使する以前は新株予約権者に会社に対する支払義務を課さず，新株予約権者が新株予約権を行使した段階で支払義務を課している。著しく不公正な払込金額で新株予約権を引き受けた者の責任（285 条１項２号），現物出資財産の価額が著しく不足する場合の新株予約権者の責任（同条項３号），および，新株予約権の権利行使時に払込み等を仮装した新株予約権者の責任（286 条の２第１項２号３号）は，取締役等と通じて著しく不公正な払込金額で募集株式を引き受けた募集株式引受人の責任（212 条１項１号），現物出資財産の価額が著しく不足する場合の募集株式引受人の責任（同条項２号），および，出資の履行を仮装した募集株式引受人の責任（213条の２第１項１号２号）と同様の規定である。また，取締役等・専門家の責任も，募集株式の発行等の場合（213 条，213 条の３）と同様の規定がなされている（286条，286条の３）。"},{"l":1,"m":"新株予約権","sb":"新株予約権に係る払込み等を仮装した場合の責任","i":"B","r":"","q":"募集新株予約権に係る払込みを仮装した者は，株式会社に対し，払込みが仮装された払込金額の全額の支払をする義務を負う。","a":false,"c":"286条の2第1項1号。","e":"新株予約権を行使した新株予約権者であって，募集新株予約権に係る払込み（当該払込みに代えてする金銭以外の財産の給付を含む）を仮装した者，または，当該払込みが仮装されたことを知って，もしくは重大な過失により知らないで募集新株予約権を譲り受けた者は，株式会社に対し，払込みが仮装された払込金額の全額の支払（当該払込みに代えてする金銭以外の財産の給付が仮装された場合にあっては，当該財産の給付（株式会社が当該給付に代えて当該財産の価額に相当する金銭の支払を請求した場合にあっては，当該金銭の全額の支払））をする義務を負う。募集新株予約権に係る払込みが仮装された場合であっても，募集新株予約権が行使されていないときは，本来拠出されるべき財産が拠出されないまま，株式が発行されるという事態には至っておらず，他の株主から新株予約権者に対する不当な価値の移転は生じていない。そこで，このような払込みを仮装した新株予約権者等は，自ら募集新株予約権を行使して不当な価値の移転を受けた場合に，株式会社に対して責任を負うこととしているのである。"},{"l":2,"m":"新株予約権","sb":"新株予約権に係る払込み等を仮装した場合の責任","i":"B","r":"","q":"募集新株予約権に係る払込みが仮装されたことを重大な過失により知らないで募集新株予約権を譲り受けた者が新株予約権を行使した場合，当該新株予約権者は，株式会社に対し，払込みが仮装された払込金額の全額の支払をする義務を負う。","a":true,"c":"286条の2第1項1号。","e":"募集新株予約権に係る払込みが仮装された場合において，これを譲り受けた者が当該募集新株予約権を行使した場合にも，不当な価値の移転が生じることとなる。しかし，当該新株予約権の譲受人が常に払込みを仮装した者と同様の義務を負うこととすれば，新株予約権の取引の安全を害する。そこで，当該募集新株予約権の譲受人は，払込みの仮装について悪意または重過失がある場合に限って責任を負うこととしたのである。"},{"l":3,"m":"新株予約権","sb":"新株予約権に係る払込み等を仮装した場合の責任","i":"B","r":"","q":"新株予約権を行使した新株予約権者であって，新株予約権の行使時における現物出資財産の給付を仮装した者は，株式会社に対し，給付を仮装した金銭以外の財産の給付（株式会社が当該給付に代えて当該財産の価額に相当する金銭の支払を請求した場合は，当該金銭の全額の支払）をする義務を負う。","a":true,"c":"286条の2第1項3号。","e":""},{"l":4,"m":"新株予約権","sb":"新株予約権に係る払込み等を仮装した場合の責任","i":"B","r":"","q":"新株予約権無償割当てにより発行された新株予約権を行使した新株予約権者がその行使時における金銭の払込みを仮装した場合，当該新株予約権者は，株式会社に対し，払込みが仮装された払込金額の全額の支払をする義務を負わない。","a":false,"c":"286条の2第1項2号。","e":"新株予約権の行使時における金銭の払込みまたは現物出資財産の給付が仮装された場合の責任（286 条の２第１項２号３号）は，募集新株予約権以外の新株予約権（取得条項付新株予約権の取得の対価として交付される新株予約権，新株予約権無償割当てにより発行される新株予約権等）の行使時における払込み等が仮装された場合にも生じる。"},{"l":5,"m":"新株予約権","sb":"新株予約権に係る払込み等を仮装した場合の責任","i":"B","r":"","q":"新株予約権を行使した新株予約権者が払込みを仮装したことにより株式会社に対して仮装された払込金額の全額の支払をする義務を負う場合には，その払込みを仮装することに関与した取締役（当該払込みを仮装したものを含む）は，株式会社に対して，その職務を行うについて注意を怠らなかったことを証明した場合を除き，仮装した払込金額の全額の支払をする義務を負う。","a":false,"c":"286条の3第1項。","e":"新株予約権を行使した新株予約権者が払込み等を仮装した新株予約権者等の責任の規定（286 条の２第１項）により責任を負う場合には，その払込みまたは給付を仮装することに関与した取締役（指名委員会等設置会社では執行役を含む）として法務省令で定める者は，株式会社に対し，払込み等を仮装した新株予約権者等と同額の支払をする義務を負う。ただし，その者（当該払込みまたは給付を仮装したものを除く）がその職務を行うについて注意を怠らなかったことを証明した場合は，当該義務を負わない。すなわち，払込みまたは給付を仮装した取締役は，その行為態様に鑑み，職務を行うについて注意を怠らなかったことを証明することにより義務を免れることができないこととしているのである。"},{"l":6,"m":"新株予約権","sb":"新株予約権に係る払込み等を仮装した場合の責任","i":"B","r":"","q":"新株予約権を行使した新株予約権者であって，新株予約権の行使時における金銭の払込みを仮装した者は，仮装された払込金額の全額の支払，または，払込みを仮装することに関与した取締役等の支払がされた後でなければ，払込みが仮装された新株予約権の目的である株式について，株主の権利を行使することができない。","a":true,"c":"282条2項。","e":"出資の履行が仮装された株式に係る権利行使の規定は，設立時発行株式，募集株式および新株予約権の目的である株式について共通である（52条の２第４項５項，102条３項４項，209条２項３項，282条２項３項）。"},{"l":1,"m":"新株予約権","sb":"記名式と無記名式との間の転換","i":"C","r":"","q":"証券発行新株予約権の新株予約権者は，いつでも，記名式の新株予約権証券を無記名式とし，または，無記名式の新株予約権証券を記名式とすることを請求することができる。当該請求について株式会社は制限を加えることができない。","a":false,"c":"236条1項11号。","e":"証券発行新株予約権の新株予約権者は，新株予約権の内容として定めた記名式と無記名式の間の転換請求の制限により転換することができないこととされている場合（236条１項11号）を除き，いつでも，記名式の新株予約権証券を無記名式とし，または，無記名式の新株予約権証券を記名式とすることを請求することができる（290条）。"},{"l":1,"m":"社債","sb":"総論","i":"A","r":"(令6II問題15イ類・令2II問題16イ類・平27II問題13イ類)","q":"社債を発行することができるのは，株式会社のみである。","a":false,"c":"2条23号参照。","e":"会社法上の会社（２条１号）のすべてが社債を発行することができる（２条 23 号）。つまり，株式会社のみならず，持分会社も社債を発行することができる。また，特例有限会社も会社法上の株式会社であることから，社債を発行することができる。なお，外国会社（２条２号）は会社法上の会社ではないため，会社法上の社債を発行することはできない。"},{"l":2,"m":"社債","sb":"総論","i":"B","r":"(令2II問題16ア)","q":"純資産額が300万円を下回る株式会社は，無担保社債を発行することができない。","a":false,"c":"","e":"このような規定はない。なお，株式会社の純資産額が300万円を下回る場合には，剰余金の配当をすることができないとされている（458条）。"},{"l":1,"m":"社債","sb":"募集社債の募集事項","i":"B","r":"(平29II問題16ア類)","q":"同一の会社で，社債券が発行されている社債と発行されていない社債が併存してはならない。","a":false,"c":"676条6号。","e":"社債については社債券を発行しないのが原則であり，会社は社債を発行するときは，その都度，募集社債に関する事項のなかで，社債券を発行する旨を定めなければならない。したがって，同一の会社で，社債券が発行されている社債と発行されていない社債が併存してもよい。"},{"l":2,"m":"社債","sb":"募集社債の募集事項","i":"B","r":"(平24II問題15ア)","q":"会社は，募集社債の償還の方法および期限を定めなければ，募集社債を発行することはできない。","a":true,"c":"676条4号。","e":""},{"l":3,"m":"社債","sb":"募集社債の募集事項","i":"A","r":"(平27II問題13ア類・平22II問題16ウ)","q":"募集社債の募集事項として，一定の日までに募集社債の総額について割当てを受ける者を定めていない場合において，募集社債の全部を発行しないこととするときは，その旨およびその一定の日を定めることができる。","a":true,"c":"676条11号。","e":"募集社債の引受けの申込みの金額が，募集社債の総額に達しない場合には，会社は，引受けの申込みの金額について社債を発行する。すなわち，打切発行が原則である。しかし，会社は，一定の日までに募集社債の総額について割当てを受ける者を定めていない場合においては，募集社債の全部を発行しないこととする旨を定めることができる（676条11号）。"},{"l":4,"m":"社債","sb":"募集社債の募集事項","i":"A","r":"(令6I問題16ア・平24II問題15イ)","q":"会社は，他の会社と合同して募集社債を発行することができる。","a":true,"c":"676条12号,会社法施行規則162条2号。","e":"会社が他の会社と合同して募集社債を発行するときは，その旨および各会社の負担部分を定めなければならない（合同発行）。"},{"l":5,"m":"社債","sb":"募集社債の募集事項","i":"A","r":"(平24II問題15ウ)","q":"会社は，募集社債と引換えにする金銭の払込みに代えて金銭以外の財産を給付する旨の契約を締結することができない。","a":false,"c":"676条12号,会社法施行規則162条3号。","e":"会社は，募集社債と引換えにする金銭の払込みに代えて金銭以外の財産を給付する旨の契約を締結することができる（現物払込み）。"},{"l":6,"m":"社債","sb":"募集社債の募集事項","i":"B","r":"","q":"会社は，その発行する社債を引き受ける者の募集をしようとするときであって，社債管理者を定めないこととするときは，その旨をあらかじめ定款で定めなければならない。","a":false,"c":"676条7号の2。","e":"会社は，その発行する社債を引き受ける者の募集をしようとするときであって，社債管理者を定めないこととするときは，その旨を募集事項として定めなければならない。なお，社債管理補助者を定めることとするときも同様に，その旨を募集事項として定めなければならない（676 条８号の２）。"},{"l":7,"m":"社債","sb":"募集社債の募集事項","i":"A","r":"(平24II問題15エ)","q":"会社は，数回に分けて募集社債と引換えに金銭の払込みをさせることはできない。","a":false,"c":"676条12号,会社法施行規則162条1号。","e":"会社は，数回に分けて募集社債と引換えに金銭の払込みをさせることができる（分割払込み）。"},{"l":8,"m":"社債","sb":"募集社債の募集事項","i":"B","r":"(平27II問題13ウ)","q":"株式会社は，募集社債の総額が資本金および準備金の総額を超えない範囲内で，社債の募集をしなければならない。","a":false,"c":"","e":"このような規定はない。"},{"l":1,"m":"社債","sb":"社債の償還請求権等の消滅時効","i":"A","r":"(平25I問題14イ類)","q":"社債の償還請求権は，５年間行使しないときは，時効によって消滅する。","a":false,"c":"701条1項。","e":"社債の償還請求権は，10年間行使しないときは，時効によって消滅する。"},{"l":2,"m":"社債","sb":"社債の償還請求権等の消滅時効","i":"A","r":"(令5I問題16ア類)","q":"社債の利息請求権は，５年間行使しないときは，時効によって消滅する。","a":true,"c":"701条2項。","e":""},{"l":1,"m":"社債","sb":"募集社債の発行手続","i":"A","r":"(令2II問題16エ類・平29II問題16ウ類・平26I問題15ア類)","q":"取締役会設置会社でない株式会社における募集社債に関する事項の決定は，株主総会の特別決議によらなければならない。","a":false,"c":"348条1項2項。","e":"募集社債に関する事項の決定は，金銭の借入れと同様に業務執行の決定である。したがって，取締役会非設置会社の場合，募集社債に関する事項は，取締役の決定で行う。"},{"l":2,"m":"社債","sb":"募集社債の発行手続","i":"A","r":"(平26I問題15イ類)","q":"取締役会設置会社において，募集社債に関する重要な事項の決定は取締役会の決議によらなければならないが，当該決定を取締役に委任することも認められる。","a":false,"c":"362条4項5号。","e":"取締役会設置会社の場合，募集社債に関する重要な事項（会社法施行規則99条１項）は，取締役会の決議により決定しなければならない（362 条４項５号）。なお，募集社債に関する重要な事項以外の事項の決定については，取締役に委任することが認められる。また，一定の要件を満たす監査等委員会設置会社は，取締役会の決議によって，取締役に募集社債に関する事項の決定を委任することができる（399条の13第５項６項）。同様に，指名委員会等設置会社においても取締役会の決議によって，執行役に委任することができる（416条４項）。"},{"l":3,"m":"社債","sb":"募集社債の発行手続","i":"C","r":"","q":"会社が募集社債の申込みをしようとする者に対して募集社債の募集事項等を記載した目論見書を交付している場合は，当該申込みをしようとする者に対する募集社債に関する事項の通知は不要である。","a":true,"c":"677条4項。","e":""},{"l":4,"m":"社債","sb":"募集社債の発行手続","i":"C","r":"","q":"募集社債を引き受けようとする者がその総額の引受けを行う契約を締結する場合には，当該引受人に対する募集社債に関する事項の通知は不要である。","a":true,"c":"679条。","e":"総額を引き受ける契約を締結する場合には，当該引受人に対して必要な情報が契約の段階で提供されていると考えられるためである。"},{"l":5,"m":"社債","sb":"募集社債の発行手続","i":"B","r":"(平25I問題14ウ)","q":"社債の発行の無効の主張は，会社法上の社債発行の無効の訴えによらなければならない。","a":false,"c":"828条1項各号参照。","e":"社債の発行は会社の組織に関する行為ではないため，会社法上，社債発行無効の訴えの制度は設けられていない。"},{"l":1,"m":"社債","sb":"社債券","i":"B","r":"","q":"会社がその発行する社債に係る社債券を発行する場合は，定款にその旨を定める必要はない。","a":true,"c":"676条6号。","e":"社債については，社債券を発行しないのが原則である。そのため，会社は，社債券を発行するときはその旨を定めなければならないが（676条６号），定款に定める必要はない。"},{"l":2,"m":"社債","sb":"社債券","i":"B","r":"(平27I問題13ア)","q":"社債券には，当該社債券に係る社債の金額および利率を記載しなければならない。","a":true,"c":"697条1項各号参照。","e":"社債券には，① 社債発行会社の商号，② 当該社債券に係る社債の金額，③ 当該社債券に係る社債の種類およびその番号を記載し，会社の代表者がこれに署名し，または記名押印しなければならない。本問は，実際の本試験における監査審査会の公表によれば「誤り」となるが，「社債の利率」については「社債の種類」に含まれるため（681条１号，会社法施行規則165条１号），「社債の利率」についても社債券の記載事項である。"},{"l":3,"m":"社債","sb":"社債券","i":"A","r":"(平31I問題16イ類・平25I問題14ア類)","q":"持分会社は，社債権者から請求がある時までは，当該社債権者の有する社債に係る社債券を発行しないことができる。","a":false,"c":"696条参照。","e":"社債発行会社は，社債券を発行する旨の定めがある社債を発行した日以後遅滞なく，当該社債に係る社債券を発行しなければならない。社債券には，株券または新株予約権証券の場合のような規定はない。"},{"l":4,"m":"社債","sb":"社債券","i":"A","r":"(令5II問題16ア類・平27I問題13イ類)","q":"社債券が発行されている社債の社債権者は，その記名式の社債券を無記名式とし，またはその無記名式の社債券を記名式とすることを請求することはできない。","a":false,"c":"698条。","e":"社債券が発行されている場合には，社債の内容として定めた記名式と無記名式間の転換請求の制限により転換することができないこととされている場合（676 条７号）を除き，いつでも，記名式の社債券を無記名式とし，または，無記名式の社債券を記名式とすることを請求することができる。"},{"l":5,"m":"社債","sb":"社債券","i":"B","r":"(平25I問題14エ)","q":"社債券の占有者は，当該社債券に係る社債についての権利を適法に有するものと推定される。","a":true,"c":"689条1項。","e":"社債券の占有者は実質的な社債権者である可能性が高いため，資格授与的効力が認められている。"},{"l":6,"m":"社債","sb":"社債券","i":"B","r":"(平29II問題16イ)","q":"無権利者から善意で，かつ重大な過失なく社債券の交付を受けた者は，当該社債券に係る社債についての権利を取得する。","a":true,"c":"689条2項。","e":"社債券が発行されている社債を取引する際の取引の安全を図り，もって社債の流通性を高めるためである。"},{"l":7,"m":"社債","sb":"社債券","i":"B","r":"(平27I問題13エ類)","q":"社債券を喪失した者は，会社に対し，社債券喪失登録を請求することができる。","a":false,"c":"699条。","e":"株券を喪失した場合，株券の再発行を受けるには，株券喪失登録制度（221 条以下）による。これに対して，社債券を喪失した場合，喪失登録制度は設けられていないため，公示催告・除権決定の手続によることになる。"},{"l":8,"m":"社債","sb":"社債券","i":"C","r":"","q":"社債券には利札を付さなければならない。","a":false,"c":"697条2項。","e":"社債券には利札を付すことができる。"},{"l":9,"m":"社債","sb":"社債券","i":"C","r":"(令5I問題16イ類)","q":"社債発行会社は，社債券が発行されている社債をその償還の期限前に償還する場合において，これに付された利札が欠けている場合であっても，当該利息請求権が弁済期にある場合は，当該利札に表示される社債の利息請求権の額を償還額から控除する必要はない。","a":true,"c":"700条1項ただし書。","e":"期限が到来している利札が欠けている場合は，既に社債発行会社が具体的な支払義務を負っているから，繰上償還がされても償還額から利札の券面額が控除されることはない。また，社債発行会社が繰上償還をする場合，社債発行会社は，期限が到来していない分の利札に係る利息については支払う義務はないはずである。しかし，700 条２項において，期限未到来のものであっても，利札の所持人は，いつでも，利札に表示される社債の利息の支払を請求することができるとされている。これは，利札所持人の利益を保護するためである。"},{"l":1,"m":"社債","sb":"社債原簿","i":"A","r":"(平31I問題16ア類・平29I問題15イ類・平25II問題15ア類・平22II問題16ア類)","q":"会社が社債原簿管理人を置く場合は，その旨を定款で定めなければならない。","a":false,"c":"683条。","e":"会社が社債原簿管理人を置く場合は，その旨を定款で定める必要はない。また，社債原簿管理人の設置は任意である。"},{"l":2,"m":"社債","sb":"社債原簿","i":"A","r":"","q":"株主名簿管理人を置いている株式会社が社債を発行する場合は，当該株主名簿管理人に社債に関する事務を委託することとなる。","a":false,"c":"683条参照。","e":"このような規定はない。"},{"l":3,"m":"社債","sb":"社債原簿","i":"B","r":"(平29II問題16エ)","q":"会社は，募集社債を発行する場合において，各社債の金額が１億円以上であるときは，社債原簿を作成しなくてもよい。","a":false,"c":"681条参照。","e":"このような規定はない。会社は，各社債の金額にかかわらず，社債を発行した日以降遅滞なく，社債原簿を作成する必要がある。"},{"l":4,"m":"社債","sb":"社債原簿","i":"B","r":"","q":"会社は，社債を発行した日以降遅滞なく，社債原簿を作成する必要があるが，当該社債について社債管理補助者を定めることとするときは，その旨を当該社債原簿に記載し，または記録しなければならない。","a":true,"c":"681条1号。","e":""},{"l":5,"m":"社債","sb":"社債原簿","i":"B","r":"","q":"社債権者ではない社債発行会社の債権者は，社債原簿を閲覧することができない。","a":false,"c":"684条2項。","e":"社債権者およびその他法務省令で定める者（会社の債権者・株主など）は，社債発行会社の営業時間内は，いつでも，社債原簿の書面または電磁的記録に記録された事項を表示したものの閲覧または謄写を請求することができる。この場合，社債権者等は，当該請求の理由を明らかにしなければならない。また，親会社社員についても，請求の理由を明らかにして閲覧または謄写を請求することができるが，裁判所の許可を得なければならない（684条４項）。"},{"l":6,"m":"社債","sb":"社債原簿","i":"B","r":"(平24I問題16ウ)","q":"社債発行会社は，社債原簿の閲覧の請求を行う社債権者が当該社債発行会社の業務と実質的に競争関係にある事業を営むことを理由として，当該社債権者の社債原簿の閲覧の請求を拒むことができる。","a":false,"c":"684条3項。","e":"会計帳簿の閲覧等の請求の場合（433 条２項３号）とは異なり，社債発行会社は，社債原簿の閲覧の請求を行う社債権者が当該社債発行会社の業務と実質的に競争関係にある事業を営むことを理由として，当該社債権者の社債原簿の閲覧の請求を拒むことができない。なお株主名簿（125条３項）や新株予約権原簿（252条３項）の場合も同様である。"},{"l":1,"m":"社債","sb":"社債の譲渡","i":"A","r":"","q":"社債券を発行する旨の定めがある社債の譲渡は，当該社債に係る社債券を交付しなければ，その効力を生じない。","a":true,"c":"687条。","e":""},{"l":2,"m":"社債","sb":"社債の譲渡","i":"A","r":"(令6I問題16イ類・平27I問題13ウ)","q":"無記名社債を譲り受けた者は，当該無記名社債に係る社債券の交付を受けた事実をもって，当該無記名社債の譲受けを社債発行会社その他の第三者に対抗することができる。","a":true,"c":"688条3項。","e":"無記名社債の譲渡の社債発行会社および第三者に対する対抗要件は，当該無記名社債に係る社債券の占有である。"},{"l":1,"m":"社債","sb":"社債の質入れ","i":"B","r":"(平24I問題16ア)","q":"社債権者は，社債に係る社債券を発行する旨の定めがない限り，当該社債を質入れすることができない。","a":false,"c":"","e":"社債券を発行する旨の定めがある社債であるか否かにかかわらず，社債権者は，当該社債を質入れすることができる。"},{"l":2,"m":"社債","sb":"社債の質入れ","i":"B","r":"","q":"社債券を発行する旨の定めがある場合，当該社債に質権を設置した者は，社債発行会社に対し，質権者に関する事項を社債原簿に記載することを請求することができる。","a":false,"c":"694条1項2項。","e":"社債に質権を設定した者は，社債発行会社に対し，一定の事項を社債原簿に記載・記録することを請求することができる（694 条１項）。ただし，社債券を発行している場合には，当該規定は適用されない（同条２項）。したがって，記名式社債券であっても，略式質の方法しか採用することができないのである。"},{"l":1,"m":"社債","sb":"社債管理者","i":"A","r":"","q":"社債管理者とは，社債発行会社のために，弁済の受領，債権の保全その他の社債の管理を行う者をいう。","a":false,"c":"702条本文。","e":"社債管理者とは，社債権者のために，弁済の受領，債権の保全その他の社債の管理を行う者をいう。社債管理者を設置する趣旨は，社債権者を保護するためである。社債は，個々の投資家から多額かつ長期の資金を調達する手段として利用されるものである。しかし，社債の償還期日までに社債の償還または利息の支払が遅滞するという事態が生ずることもありえないわけではなく，そのような事態が生じた場合には，個々の社債権者自らが社債発行会社と交渉するのは能力面などからみて困難であると考えられる。そこで，専門的能力を有する社債管理者に的確な措置をとらせて，社債権者の保護を図ることとしたのである。"},{"l":2,"m":"社債","sb":"社債管理者","i":"A","r":"","q":"会社は，社債を発行するには，必ず，社債管理者を定めなければならない。","a":false,"c":"702条ただし書。","e":"会社は，社債を発行する場合は，原則として，社債管理者を定めなければならない（702 条本文）。ただし，一定の場合には，社債管理者の設置義務を負わない（702条ただし書）。"},{"l":3,"m":"社債","sb":"社債管理者","i":"A","r":"(平31I問題16ウ類・平23II問題16ウ類・平22II問題16イ類)","q":"会社は，ある種類の社債の総額が１億円以上である場合については，社債管理者の設置義務を負わない。","a":false,"c":"702条ただし書。","e":"会社は，各社債の金額が１億円以上である場合については，社債管理者の設置義務を負わない。なぜなら，このような社債権者は，一定規模以上の資産を有すると考えられるし，有価証券について専門的知識および経験を有する者と考えられ，自ら社債発行会社と交渉する能力を持っていると考えられるためである。"},{"l":4,"m":"社債","sb":"社債管理者","i":"A","r":"(令3問題16イ類・平29I問題15ア類)","q":"会社は，ある種類の社債の総額を各社債の金額の最低額で除して得た数が 50 を下回る場合については，社債管理者の設置義務を負わない。","a":true,"c":"702条ただし書,会社法施行規則169条。","e":"このように社債権者が少数の場合は，通常，社債発行会社と交渉する能力を有していない個々の一般投資家が社債権者となるおそれが少ないからである。"},{"l":5,"m":"社債","sb":"社債管理者","i":"A","r":"(令3問題16ア・平31II問題16イ・平28I問題14ア・平23II問題16エ)","q":"信託会社は，社債管理者となる資格を有しない。","a":false,"c":"703条2号。","e":"社債管理者は，① 銀行，② 信託会社，③ その他これらに準ずるものとして法務省令で定める者でなければならない。また，証券会社などの金融商品取引業者は，社債管理者になることができない（金商法36条の４）。これは，社債発行会社のために社債の売出しを行うような証券会社に，社債管理者の資格を与えるのは妥当ではないからである。"},{"l":6,"m":"社債","sb":"社債管理者","i":"A","r":"(令2II問題16ウ類・平29I問題15エ類・平23II問題16イ)","q":"社債管理者は，社債権者のために社債に係る債権の弁済を受け，または，社債に係る債権の実現を保全するために必要な裁判外の行為をする権限を有するが，裁判上の行為をする権限は有していない。","a":false,"c":"705条1項。","e":"社債管理者は，社債権者のために社債に係る債権の弁済を受け，または，社債に係る債権の実現を保全するために必要な一切の裁判上または裁判外の行為をする権限を有する。"},{"l":7,"m":"社債","sb":"社債管理者","i":"B","r":"(令5I問題16エ)","q":"社債管理者が社債権者のために社債に係る債権の弁済を受けた場合，社債権者の当該社債管理者に対する社債の利息についての支払請求権は，これを行使することができる時から５年間行使しないときは，時効によって消滅する。","a":false,"c":"705条3項。","e":"社債管理者が社債に係る債権の弁済を受けた場合には，社債権者は，その社債管理者に対し，社債の償還額および利息の支払を請求することができる（705 条２項前段）。この場合において，社債券を発行する旨の定めがあるときは，社債権者は，社債券と引換えに当該償還額の支払を，利札と引換えに当該利息の支払を請求しなければならない（同条項後段）。なお，当該請求権は，これを行使することができる時から10年間行使しないときは，時効によって消滅する（同条３項）。"},{"l":8,"m":"社債","sb":"社債管理者","i":"B","r":"(令6II問題16エ類・平28I問題14イ類)","q":"社債管理者は，いつでも，その管理の委託を受けた社債について，社債に係る債権の弁済を受け，または社債に係る債権の実現を保全するために必要な行為をするために必要があるときは，社債発行会社の業務および財産の状況を調査することができる。","a":false,"c":"705条4項。","e":"社債管理者は，その管理の委託を受けた社債について，社債に係る債権の弁済を受け，または社債に係る債権の実現を保全するために必要な行為をするために必要があるときは，裁判所の許可を得て，社債発行会社の業務および財産の状況を調査することができる。"},{"l":9,"m":"社債","sb":"社債管理者","i":"B","r":"(平28I問題14ウ)","q":"社債管理者は，社債権者集会の決議によらずに，当該社債の全部についてするその支払の猶予，その債務の不履行によって生じた責任の免除または和解をすることができる。","a":false,"c":"706条1項1号。","e":"社債管理者は，社債権者集会の特別決議によらなければ，社債の全部についてするその支払の猶予，その債務の不履行によって生じた責任の免除または和解をすることができない。この場合は，社債権者集会の特別決議を要する（724条２項２号）。"},{"l":10,"m":"社債","sb":"社債管理者","i":"B","r":"(令2I問題16エ)","q":"社債権者集会の決議によらずに社債管理者がその社債の全部についての訴訟行為（社債に係る債権の弁済を受け，または社債に係る債権の実現を保全するために必要な行為を除く）をすることができる旨を定めることができる。","a":true,"c":"676条8号,706条1項2号。","e":""},{"l":11,"m":"社債","sb":"社債管理者","i":"C","r":"","q":"会社法上の債権者異議手続が行われるときは，会社は社債管理者に対して異議催告を行わなければならず，社債管理者は，社債権者集会の決議なくして異議を述べることができる。","a":true,"c":"740条2項。","e":""},{"l":12,"m":"社債","sb":"社債管理者","i":"A","r":"(令3問題16エ・平23II問題16ア)","q":"社債管理者は，社債権者のために，公平かつ誠実に社債の管理を行わなければならない。","a":true,"c":"704条1項。","e":"社債管理者の公平誠実義務である。"},{"l":13,"m":"社債","sb":"社債管理者","i":"A","r":"(平29I問題15ウ類・平23II問題16ア類)","q":"社債管理者は，社債権者に対し，善管注意義務を負わない。","a":false,"c":"704条2項。","e":"社債管理者は，社債権者に対し，善管注意義務を負う。社債管理者と社債発行会社との間には，委任契約が成立するから，社債管理者は社債発行会社に善管注意義務を負う（民法644条）。しかし，社債管理者と社債権者の間には委任契約は成立しないため，会社法において，特に善管注意義務が規定されたのである。"},{"l":14,"m":"社債","sb":"社債管理者","i":"B","r":"","q":"社債管理者は，会社法または社債権者集会の決議に違反する行為をしたときは，社債権者に対し，連帯して，これによって生じた損害を賠償する責任を負う。","a":true,"c":"710条1項。","e":"当該責任は，会社法が社債管理者に対して課す，公平誠実義務，善管注意義務や社債権者集会決議の違反があった場合の一般的な損害賠償責任を規定しているものである。"},{"l":15,"m":"社債","sb":"社債管理者","i":"B","r":"","q":"社債管理者は，社債発行会社が社債の償還もしくは利息の支払を怠った後またはその前３か月以内に，当該社債管理者の債権に係る債務について社債発行会社から担保の供与または債務の消滅に関する行為を受けたときは，社債権者に対し，損害を賠償する責任を負う。当該責任は，無過失責任である。","a":false,"c":"710条2項1号。","e":"社債管理者は，社債発行会社が社債の償還もしくは利息の支払を怠った後またはその前３か月以内に，当該社債管理者の債権に係る債務について社債発行会社から担保の供与または債務の消滅に関する行為を受けたときは，社債権者に対し，損害を賠償する責任を負う（710 条２項本文１号）。ただし，当該社債管理者が誠実にすべき社債の管理を怠らなかったことまたは当該損害が当該行為によって生じたものでないことを証明したときは，この限りでない（710条２項柱書ただし書）。710 条２項各号の行為については，利益相反性が高いため，個々の社債権者の利益保護を強化する必要があることから，それらの行為についての証明責任を転換するという形で特別の損害賠償責任を負わせたものである。"},{"l":16,"m":"社債","sb":"社債管理者","i":"B","r":"(平31II問題16ウ類・平25II問題15イ類)","q":"社債管理者は，いつでも辞任することができる。","a":false,"c":"","e":"社債管理者は，① 社債発行会社および社債権者集会の双方の同意による場合（711 条１項），② 委任契約においてあらかじめ定めた事由が生じた場合（711条２項），③ やむを得ない事由があり裁判所の許可を得た場合（711条３項）に限り辞任することができる。なお，①の場合は，他に社債管理者がないときは，当該社債管理者は，あらかじめ，事務を承継する社債管理者を定めなければならず，②の場合は，事務を承継する社債管理者に関する定めが当該契約にないときは辞任することができないとされている。"},{"l":17,"m":"社債","sb":"社債管理者","i":"B","r":"(平28I問題14エ)","q":"裁判所は，社債管理者がその義務に違反したとき，その事務処理に不適任であるときその他正当な理由があるときは，社債発行会社または社債権者集会の申立てにより，当該社債管理者を解任することができる。","a":true,"c":"713条。","e":""},{"l":18,"m":"社債","sb":"社債管理者","i":"C","r":"","q":"裁判所により社債管理者が解任され，他に社債管理者がなくなった日後２か月以内に，事務を承継する社債管理者についての同意を得るための社債権者集会を招集せず，または，社債権者集会の同意に代わる裁判所の許可の申立てをしなかったときは，社債発行会社は社債の総額について期限の利益を喪失する。","a":true,"c":"714条2項。","e":"社債管理者が裁判所により解任された場合などにおいて，他に社債管理者がないときは，社債発行会社は，事務を承継する社債管理者を定め，社債権者のために，社債の管理を行うことを委託しなければならない。この場合においては，社債発行会社は，社債権者集会の同意を得るため，遅滞なく，これを招集し，同意を得ることができなかったときは，その同意に代わる裁判所の許可の申立てをしなければならない（714条１項）。社債発行会社は，714 条１項各号に該当することとなった日後２か月以内に，事務を承継する社債管理者についての同意を得るための社債権者集会を招集せず，または，社債権者集会の同意に代わる裁判所の許可の申立てをしなかったときは，当該社債の総額について期限の利益を喪失する。"},{"l":19,"m":"社債","sb":"社債管理者","i":"C","r":"","q":"社債発行会社は複数の社債管理者に社債の管理を委託することができる。","a":true,"c":"709条1項参照。","e":"２以上の社債管理者があるときは，これらの者が共同してその権限に属する行為をしなければならない（709 条１項）。"},{"l":1,"m":"社債","sb":"社債管理補助者","i":"A","r":"","q":"会社は，社債を発行する際に，社債管理者を定めない場合は，社債管理補助者を定め，社債権者のために，社債の管理の補助を行うことを委託しなければならない。ただし，当該会社は社債管理者の設置義務がないものとする。","a":false,"c":"714条の2本文。","e":"社債発行会社は，社債管理者を定めることを要しない場合において，社債管理補助者を定め，社債権者のために，社債の管理の補助を行うことを委託することができる。"},{"l":2,"m":"社債","sb":"社債管理補助者","i":"A","r":"(令7I問題16イ)","q":"弁護士法人は，社債管理補助者となる資格を有しない。","a":false,"c":"714条の3,会社法施行規則171条の2。","e":"弁護士法人は，社債管理補助者となる資格を有する。なお，社債管理補助者は，次に掲げる者でなければならない。(ⅰ) 銀行(ⅱ) 信託会社(ⅲ) その他これらに準ずるものとして法務省令で定める者(ⅳ) 弁護士および弁護士法人"},{"l":3,"m":"社債","sb":"社債管理補助者","i":"A","r":"","q":"会社が担保付社債を発行する場合，当該担保付社債について，社債管理補助者を定めることはできない。","a":true,"c":"714条の2ただし書。","e":"担保付社債については，担保付社債信託法の適用により担保の受託会社を定める必要があり，当該受託会社が社債の管理を行うこととされているためである。"},{"l":4,"m":"社債","sb":"社債管理補助者","i":"B","r":"(令4I問題17ア)","q":"社債管理補助者は，社債権者のために破産手続に参加する権限を有する。","a":true,"c":"714条の4第1項1号。","e":"社債管理補助者は，① 破産手続参加，再生手続参加または更生手続参加をする権限，② 強制執行または担保権の実行の手続における配当要求をする権限，③ 499条１項の期間内に債権の申出をする権限を有する（714条の４第１項各号）。"},{"l":5,"m":"社債","sb":"社債管理補助者","i":"B","r":"(令4I問題17イ)","q":"社債管理補助者は，社債権者集会の決議によらずに，社債発行会社が社債の総額について期限の利益を喪失することとなる行為をする権限を有する。","a":false,"c":"714条の4第2項4号。","e":"社債管理補助者は，社債発行会社との間の委託契約に定める範囲内において，次に掲げる行為をする権限を有する（714条の４第２項各号）。"},{"l":6,"m":"社債","sb":"社債管理補助者","i":"C","r":"(令4I問題17エ)","q":"２以上の社債管理補助者があるときは，これらの者は，共同してその権限に属する行為をしなければならない。","a":false,"c":"714条の5第1項。","e":"２以上の社債管理補助者があるときは，社債管理補助者は，各自，その権限に属する行為をしなければならない。つまり，社債管理補助者は，各自の権限を行使すること，すなわち，職務の分掌が認められている。"},{"l":7,"m":"社債","sb":"社債管理補助者","i":"A","r":"(令4I問題17ウ類)","q":"社債管理補助者は，社債権者に対し，善管注意義務を負わない。","a":false,"c":"714条の7。","e":"社債管理補助者についても，社債管理者と同様に，公平誠実義務（704条1項）および善管注意義務（同条２項）が課せられている。"},{"l":1,"m":"社債","sb":"社債権者集会","i":"A","r":"","q":"社債権者集会は，毎期事業年度の終了後一定の時期に招集しなければならない。","a":false,"c":"","e":"社債権者集会とは，その社債の種類ごとに社債権者で組織される臨時的な合議体であって，社債発行会社が元利金の支払を懈怠した場合における対応など，社債権者の共同の利害に重大な事項を決定するために招集されるものである。社債権者集会は，必要がある場合には，いつでも，招集することができる（717条１項）。"},{"l":2,"m":"社債","sb":"社債権者集会","i":"A","r":"(平28II問題16ア・平25II問題15ウ類・平21問題17イ)","q":"社債権者は，社債の種類ごとに社債権者集会を組織する。","a":true,"c":"715条。","e":"社債の種類ごとに社債権者集会を組織することを要するのは，各種類の社債の権利内容が異なる結果，各種類の社債権者の利害等が必ずしも一致しないためである。"},{"l":3,"m":"社債","sb":"社債権者集会","i":"A","r":"(平27II問題13エ・平21問題17ア)","q":"社債権者集会は，裁判所の許可を得なければ開催することができない。","a":false,"c":"","e":"社債権者集会の開催は，裁判所の許可を得る必要はない。"},{"l":4,"m":"社債","sb":"社債権者集会","i":"B","r":"(令6II問題16イ)","q":"社債権者集会は，会社法に規定する事項および定款で定めた事項に限り，決議をすることができる。","a":false,"c":"716条。","e":"社債権者集会は，会社法に規定する事項および社債権者の利害に関する事項について決議をすることができる。"},{"l":5,"m":"社債","sb":"社債権者集会","i":"B","r":"(令4II問題15イ類)","q":"社債権者集会は，社債発行会社または社債管理者が招集し，社債管理補助者による招集は認められない。","a":false,"c":"717条3項各号。","e":"社債権者集会は，原則として，社債発行会社または社債管理者が招集する（717条２項）。ただし，①ある種類の社債の総額（償還済みの額・自己社債の金額の合計額を除く）の10分の１以上に当たる社債を有する社債権者から，社債権者集会の招集の請求があった場合，または，②社債管理補助者が社債発行会社および社債権者集会の双方の同意による辞任（711 条１項，714 条の７）をする際に社債権者集会の同意を得るため必要がある場合においては，社債管理補助者は，社債権者集会を招集することができる。"},{"l":6,"m":"社債","sb":"社債権者集会","i":"B","r":"(令4II問題15ア)","q":"裁判所は，社債発行会社の業務および財産の状況に関する検査役の報告があった場合において，必要があると認めるときは，当該社債発行会社に対し，一定の期間内に社債権者集会を招集することを命じることができる。","a":false,"c":"","e":"社債権者集会は，原則として，社債発行会社または社債管理者が招集し（717 項２項），一定の場合には，社債管理補助者による招集（同条３項各号）または社債権者による招集請求および招集（718 条１項２項３項）が認められている。しかし，裁判所による社債権者集会の招集は認められていないため，本肢は誤りである。なお，株主総会については，裁判所は，業務財産調査検査役の報告（358 条５項）があった場合において，必要があると認めるときは，取締役に対し，一定の期間内に株主総会を招集することを命じることができる（359条１項）。"},{"l":7,"m":"社債","sb":"社債権者集会","i":"A","r":"","q":"社債権者集会の招集者は，社債権者集会に出席しない社債権者が書面によって議決権を行使することができることとするときは，その旨を招集事項に定めなければならない。","a":false,"c":"726条1項。","e":"社債権者集会において書面投票は，必ず認められる。これは，社債権者集会に出席するインセンティブが株主総会に比して低いためであると考えられる。これに対して，電子投票を認める場合には，その旨を招集事項に定めなければならない（719条３号）。"},{"l":8,"m":"社債","sb":"社債権者集会","i":"A","r":"(平28II問題16ウ類・平23I問題16イ)","q":"社債発行会社は，その有する自己社債については，議決権を有しない。","a":true,"c":"723条2項。","e":"社債権者は，社債権者集会において，その有する当該種類の社債の金額の合計額（償還済みの額を除く）に応じて，議決権を有する（723条１項）。ただし，自己社債については議決権を有しない（723 条２項）。なぜなら，社債権者集会は，社債権者の共同の利害に重大な事項を決定するために招集されるものであるから，もし，資金を調達する側である社債発行会社の有する自己社債について議決権を行使することができるのであれば，資金を提供した社債権者の総意が正しく形成されないためである。"},{"l":9,"m":"社債","sb":"社債権者集会","i":"A","r":"(平30I問題16イ・平21問題17ウ)","q":"社債権者（社債発行会社を除く）は，社債権者集会において，その有する当該種類の社債の金額の合計額（償還済みの額を除く）に応じて，議決権を有する。","a":true,"c":"723条1項。","e":"問題８の解説参照。"},{"l":10,"m":"社債","sb":"社債権者集会","i":"C","r":"(令6I問題16エ)","q":"無記名社債の社債権者は，社債権者集会において議決権を行使しようとするときは，当該社債権者集会の日の１週間前までに，その社債券を，当該社債権者集会を招集する者に提示しなければならない。","a":true,"c":"723条3項。","e":"議決権を行使しようとする無記名社債の社債権者は，社債権者集会の日の１週間前までに，その社債券を招集者に提示しなければならない。"},{"l":11,"m":"社債","sb":"社債権者集会","i":"B","r":"","q":"社債権者集会の普通決議を可決するためには，議決権の総額の２分の１を超える議決権者が出席し，出席した議決権者の議決権の総額の２分の１を超える同意がなければならない。","a":false,"c":"724条1項。","e":"社債権者集会の普通決議を可決するには，出席した議決権者の議決権の総額の２分の１を超える議決権を有する者の同意がなければならない。すなわち，定足数の定めはない。社債権者集会は，株主総会と比して定足数の確保が困難であるためと考えられる。"},{"l":12,"m":"社債","sb":"社債権者集会","i":"B","r":"(令6II問題16ウ類)","q":"社債管理者がその社債の全部について支払の猶予をする場合は，社債権者集会の特別決議が必要となる。","a":true,"c":"724条2項2号。","e":""},{"l":13,"m":"社債","sb":"社債権者集会","i":"A","r":"(令3問題16ウ類・平31I問題16エ・平26II問題13ア)","q":"社債権者集会の決議によって代表社債権者を選任するには，議決権者の議決権の総額の５分の１以上で，かつ，出席した議決権者の議決権の総額の３分の２以上の議決権を有する者の同意がなければならない。","a":true,"c":"724条2項柱書,2号。","e":"代表社債権者の選解任および委任事項の変更（736 条１項，738 条）には社債権者集会の特別決議を要する。ここで，社債権者集会の特別決議を可決するためには，議決権者の議決権の総額の５分の１以上で，かつ，出席した議決権者の議決権の総額の３分の２以上の議決権を有する者の同意がなければならない。"},{"l":14,"m":"社債","sb":"社債権者集会","i":"A","r":"(令2I問題16イ・平30I問題16ア類・平26II問題13イ類・平23I問題16ア類)","q":"社債権者集会は，その招集通知において社債権者集会の目的である事項として記載されていない事項についても決議することができる。","a":false,"c":"724条3項。","e":"社債権者集会は，社債権者集会の目的である事項（719 条２号）である議題以外の事項については，決議をすることができない。"},{"l":15,"m":"社債","sb":"社債権者集会","i":"A","r":"(平30I問題16ウ・平24I問題16エ類)","q":"社債権者は，社債権者集会において，代理人によってその議決権を行使することができない。","a":false,"c":"725条。","e":"社債権者は，自らが社債権者集会に出席してその議決権を行使することができるのはもちろんのこと，議決権の代理行使（725条），書面投票（726条），電子投票（727条），議決権の不統一行使（728条）が認められる。なお，株主総会の場合と異なり，書面投票はいかなる場合でも認められる。"},{"l":16,"m":"社債","sb":"社債権者集会","i":"A","r":"(令4II問題15ウ・平31II問題16エ・平26II問題13ウ・平26I問題15ウ)","q":"社債権者集会に出席しない社債権者は，書面によって議決権を行使することができる。","a":true,"c":"726条1項。","e":"問題15の解説参照。なお，株主総会の場合と異なり，書面投票はいかなる場合でも認められる。"},{"l":17,"m":"社債","sb":"社債権者集会","i":"A","r":"(令2I問題16ウ類・平23I問題16ウ)","q":"社債権者集会の決議は，裁判所の認可を受けなければ，その効力を生じない。ただし，社債権者集会の決議の省略規定により社債権者集会の決議があったものとみなされる場合は考慮しないものとする。","a":true,"c":"734条1項。","e":"このように，裁判所の認可を決議の効力発生要件としたのは，社債権者集会の決議は，支払の猶予など社債権者に譲歩を強いる内容であることが多いためであり，もって社債権者を保護するためである。"},{"l":18,"m":"社債","sb":"社債権者集会","i":"A","r":"","q":"社債発行会社，社債管理者，社債管理補助者または社債権者が社債権者集会の目的である事項について提案をした場合において，当該提案につき議決権者の全員が書面または電磁的記録により同意の意思表示をしたときは，当該提案を可決する旨の社債権者集会の決議があったものとみなす。","a":true,"c":"735条の2第1項。","e":"社債権者集会の決議の省略の規定である。なお，社債権者集会の決議の省略規定により社債権者集会の決議があったとみなされる場合には，社債権者集会の決議につき裁判所の認可の申立て（732 条）は必要とされない（735 条の２第４項）。したがって，この場合において，裁判所の認可を得る必要はない。"},{"l":19,"m":"社債","sb":"社債権者集会","i":"A","r":"(平26II問題13エ)","q":"社債権者集会を開催し，その決議が出席した社債権者の全員の同意で成立したときは，当該決議の効力の発生に裁判所の認可を要しない。","a":false,"c":"","e":"上記問題 18 の解説参照。なお，社債権者集会の決議が社債権者の全員の同意で成立したときは，当該決議の効力の発生に裁判所の認可を要しないといった例外は設けられていないため，本肢は誤りである。"},{"l":20,"m":"社債","sb":"社債権者集会","i":"B","r":"","q":"社債権者集会においては，特別決議によって，償還済みの額および自己社債の金額を除いた当該種類の社債の総額の 1000 分の１以上に当たる社債を有する社債権者の中から，１人または２人以上の代表社債権者を選任し，これに社債権者集会において決議する事項についての決定を委任することができる。","a":true,"c":"736条1項2項。","e":"これは，社債権者集会を迅速に開催することが困難であることから認められている制度である。なお，代表者が複数人いる場合については，社債権者集会において決定を委任された事項の決定は，社債権者集会において別段の定めがなされた場合を除き，代表社債権者の過半数をもって行う（736条３項）。"},{"l":21,"m":"社債","sb":"社債権者集会","i":"B","r":"(平30I問題16エ類)","q":"社債権者集会の決議により，社債管理者，社債管理補助者または代表社債権者とは別に，社債権者集会の決議を執行する者を定めることができる。","a":true,"c":"737条1項。","e":"社債権者集会の決議は，社債管理者，社債管理補助者または代表社債権者（社債管理者または社債管理補助者があるときを除く）が執行する。ただし，社債権者集会の決議によって別に社債権者集会の決議を執行する者を定めることもできる。"},{"l":22,"m":"社債","sb":"社債権者集会","i":"C","r":"","q":"社債発行会社が社債の利息の支払を怠ったときは，社債権者集会の決議に基づき，当該決議執行者は，社債発行会社に対し，一定の期間内にその弁済をしなければならない旨および当該期間内にその弁済をしないときは総額について期限の利益を喪失する旨を通知することができる。この場合において，社債発行会社は，当該期間内に弁済をしなかったときは，当該社債の総額について期限の利益を喪失する。","a":true,"c":"739条1項3項。","e":"当該一定の期間は，２か月以上でなければならない（739条１項ただし書）。"},{"l":23,"m":"社債","sb":"社債権者集会","i":"A","r":"(平28II問題16イ・平23I問題16エ類)","q":"社債権者集会に関する費用は，社債発行会社の負担とする。","a":true,"c":"742条1項。","e":""},{"l":24,"m":"社債","sb":"社債権者集会","i":"A","r":"(令4II問題15エ類・平31II問題16ア・平28II問題16エ・平26I問題15エ・平21問題17エ類)","q":"社債権者集会の招集の手続が法令に違反する場合には，社債権者は，訴えをもって当該社債権者集会の決議の取消しを請求することができる。","a":false,"c":"","e":"社債権者集会の決議の瑕疵について，会社法は，特別の訴えの制度を設けていない。"}]},{"n":6,"name":"株式会社の計算等","qs":[{"l":1,"m":"会計の原則","sb":"","i":"C","r":"","q":"株式会社の会計は，一般に公正妥当と認められる企業会計の慣行に従うものとする。","a":true,"c":"431条。","e":""},{"l":1,"m":"会計帳簿","sb":"","i":"A","r":"(令6I問題14ア・平27II問題11ア類・平23I問題14イ類)","q":"株式会社は，会計帳簿の記録を開始した時点から 10年間，その会計帳簿およびその事業に関する重要な資料を保存しなければならない。","a":false,"c":"432条2項。","e":"株式会社は，会計帳簿の閉鎖の時から 10 年間，その会計帳簿およびその事業に関する重要な資料を保存しなければならない。会計帳簿の保存義務の趣旨は，将来会計に関する紛争が生じた場合に，会計帳簿および事業に関する重要な資料を証拠として利用できるようにすることである。"},{"l":2,"m":"会計帳簿","sb":"","i":"A","r":"(平29I問題7イ類・平23I問題14ア類)","q":"株主は，請求の理由を明らかにすることで，株式会社の営業時間内は，いつでも，会計帳簿の閲覧または謄写を請求することができる。","a":false,"c":"433条1項柱書前段。","e":"会計帳簿の閲覧謄写請求権は，少数株主権である。会計帳簿の閲覧請求権（433 条）の趣旨は，株主が責任追及等の訴え（847 条）を提起するため必要な調査をなす場合などに，会社の業務および財産の状況の調査を可能とすることにあり，業務財産調査検査役選任請求権（358条）とならび，重要な役割を果たすものである。"},{"l":3,"m":"会計帳簿","sb":"","i":"A","r":"(令6I問題14イ類・平29II問題14ア類)","q":"会計帳簿の閲覧を請求することができる株主は，総株主（株主総会において決議をすることができる事項の全部につき議決権を行使することができない株主を除く）の議決権の100分の３以上の議決権を有する株主に限られる。","a":false,"c":"433条1項柱書前段。","e":"会計帳簿の閲覧を請求することができる株主は，総株主（株主総会において決議をすることができる事項の全部につき議決権を行使することができない株主を除く）の議決権の100分の３以上の議決権を有する株主， または， 発行済株式 （自己株式を除く） の100分の３以上の数の株式を有する株主である。会計帳簿の閲覧謄写請求権は，議決権制限株式などを有する株主であっても一定割合以上の出資者には認めるべきであるため，議決権数基準のみでなく株式数基準も設けられている。"},{"l":4,"m":"会計帳簿","sb":"","i":"A","r":"(平27II問題11イ)","q":"会計帳簿の閲覧または謄写を請求した株主が，株式会社の業務と実質的に競争関係にある事業を営み，またはこれに従事するものであるときは，当該株式会社は当該請求を拒むことができる。","a":true,"c":"433条2項3号。","e":"433条２項各号に掲げる一定の場合には，株式会社は株主による会計帳簿の閲覧謄写請求を拒むことができる。以下，会計帳簿の閲覧・謄写に係る拒否事由である（433条２項各号）。① 請求者がその権利の確保または行使に関する調査以外の目的で請求を行ったとき② 請求者が株式会社の業務の遂行を妨げ，株主の共同の利益を害する目的で請求を行ったとき③ 請求者が株式会社の業務と実質的に競争関係にある事業を営み，またはこれに従事するものであるとき④ 請求者が閲覧または謄写によって知り得た事実を利益を得て第三者に通報するため請求を行ったとき⑤ 請求者が，過去２年以内において，閲覧または謄写によって知り得た事実を利益を得て第三者に通報したことがあるものであるとき"},{"l":5,"m":"会計帳簿","sb":"","i":"A","r":"(平25I問題13ウ)","q":"会計帳簿の閲覧または謄写を請求した株主が，株式会社の業務の遂行を妨げ，株主の共同の利益を害する目的で閲覧等の請求を行ったときは，当該株式会社は当該請求を拒むことができる。","a":true,"c":"433条2項2号。","e":"上記問題４の解説参照。例えば，いやがらせのために不必要に多数の帳簿書類の閲覧を求める場合等がこれに該当する。"},{"l":6,"m":"会計帳簿","sb":"","i":"A","r":"(平25I問題13エ)","q":"会計帳簿の閲覧または謄写を請求した株主が，閲覧または謄写によって知り得た事実を利益を得て第三者に通報するために当該請求を行ったときは，株式会社は当該請求を拒むことができる。","a":true,"c":"433条2項4号。","e":"上記問題４の解説参照。当該請求は，株主としての利益のための権利行使ではなく，これにより株主の共同の利益が害されるおそれがあるためである。"},{"l":7,"m":"会計帳簿","sb":"","i":"A","r":"(平27II問題11ウ・平25I問題13イ)","q":"株式会社の債権者は，その権利を行使するため必要があるときは，裁判所の許可を得て，会計帳簿またはこれに関する資料の閲覧または謄写を請求することができる。","a":false,"c":"433条参照。","e":"株式会社の債権者には，会計帳簿の閲覧謄写請求権は認められていない。"},{"l":8,"m":"会計帳簿","sb":"","i":"A","r":"(令7I問題6ア類・平25I問題13ア・平23I問題14エ)","q":"株式会社の親会社社員は，当該株式会社の営業時間内は，いつでも，当該株式会社に対し会計帳簿の閲覧または謄写を請求することができる。","a":false,"c":"433条3項。","e":"株式会社の親会社社員は，その権利を行使するため必要があるときは，裁判所の許可を得て，会計帳簿またはこれに関する資料の閲覧または謄写を請求することができる。この場合においては，当該請求の理由を明らかにしてしなければならない。ただし，433 条２項各号に掲げる一定の事由があるときは，裁判所は，当該許可をすることができない（433条４項）。"},{"l":9,"m":"会計帳簿","sb":"","i":"B","r":"(令7I問題6ウ・令2II問題13エ)","q":"最高裁判所の判例によれば，株式会社の会計帳簿等の閲覧謄写請求をした株主が，当該株式会社の業務と実質的に競争関係にある事業を営むものであることを理由として当該請求につき拒絶事由があるというためには，当該株主が当該株式会社と競業をなす者であるなどの客観的事実が認められるのみでは足りず，当該株主に会計帳簿等の閲覧謄写によって知り得る情報を自己の競業に利用するなどの主観的意図があることを要する。","a":false,"c":"最判平21年1月15日。","e":"433 条２項３号は，「請求者が株式会社の業務と実質的に競争関係にある事業を営み，またはこれに従事するものであるとき」を閲覧請求の拒否事由として挙げているが，判例は，この「実質的に競争関係にある」というためには，請求をしようとする株主が会社と競業をなす者であるなどの客観的事実が認められれば足り，当該株主に会計帳簿等の閲覧謄写によって知り得る情報を自己の競業に利用するなどの主観的意図があることを要しないとしている。"},{"l":10,"m":"会計帳簿","sb":"","i":"B","r":"(令7I問題6エ・令2II問題13ア)","q":"最高裁判所の判例によれば，会計帳簿等の閲覧謄写請求の理由は，具体的に記載されなければならないが，その記載された請求の理由を基礎づける事実が客観的に存在することについての立証は要しない。","a":true,"c":"最判平16年7月1日。","e":"会計帳簿等の閲覧等請求権は，請求の理由について基礎づける事実を立証するための材料を得る目的で行うものだからである。例えば，請求の理由が「取締役の特定の行為が違法であることを調査するため」だった場合に，閲覧等の請求権者は，取締役の行為が違法なものであることを立証できないからこそ請求権を行使するのであって，そのような事実の立証を請求時に要求すると，会計帳簿等の閲覧等請求制度の存在理由を否定することになり妥当ではない。したがって，判例は，請求の理由を基礎づける事実が客観的に存在することを立証する必要はないとしている。"},{"l":11,"m":"会計帳簿","sb":"","i":"C","r":"(令2II問題13ウ)","q":"最高裁判所の判例によれば，株主が会計帳簿等の閲覧を請求するため株式会社に提出した書面に，「会社財産が適正妥当に運用されているかどうかにつき，会計帳簿等を閲覧したい」と記載されている場合は，当該請求は，理由を具体的に記載してされたものとはいえない。","a":true,"c":"最判平2年11月8日。","e":"閲覧請求の理由は，閲覧目的および閲覧させるべき会計帳簿やこれに関する資料の範囲を会社が認識することができる程度に具体的に示す必要がある。"},{"l":12,"m":"会計帳簿","sb":"","i":"C","r":"(令2II問題13イ)","q":"最高裁判所の判例によれば，株式の譲渡につき定款で制限を設けている株式会社において，その有する株式を他に譲渡しようとする株主が，当該株式の適正な価格を算定する目的でした会計帳簿等の閲覧謄写請求は，特段の事情が存しない限り，株主等の権利の確保または行使に関して調査をするために行われたものとは認められない。","a":false,"c":"最判平16年7月1日。","e":"判例は，株式の譲渡につき定款で制限を設けている株式会社において，その有する株式を他に譲渡しようとする株主が，株式の適正な価格を算定する目的でした会計帳簿等の閲覧等請求は，特段の事情がない限り，433 条２項１号が定める「株主の権利の確保または行使に関する調査以外の目的で請求を行ったとき」に該当しないため，株主の権利の確保または行使に関する調査をするために行われたものと認められる。"},{"l":13,"m":"会計帳簿","sb":"","i":"C","r":"(平27II問題11エ)","q":"裁判所は，訴訟の当事者に対し，会計帳簿に関する資料の全部または一部の提出を，職権により命ずることができる。","a":false,"c":"434条。","e":"裁判所は，申立てによりまたは職権で，訴訟の当事者に対し，会計帳簿の全部または一部の提出を命ずることができる。434 条により提出命令の対象となるのは，会計帳簿のみであって，「これに関する資料」が含まれない点で，保存義務を定めた432条２項と異なっているため，注意してほしい。"},{"l":1,"m":"計算書類","sb":"計算書類および事業報告","i":"B","r":"","q":"事業報告について，その附属明細書を作成する必要はない。","a":false,"c":"435条2項。","e":"事業報告についても附属明細書を作成しなければならない。"},{"l":2,"m":"計算書類","sb":"計算書類および事業報告","i":"A","r":"(平27I問題15アイウエ類)","q":"計算書類とは，貸借対照表，損益計算書，株主資本等変動計算書，個別注記表および附属明細書をいう。","a":false,"c":"435条2項かっこ書,会社計算規則59条1項。","e":"計算書類とは，貸借対照表，損益計算書，株主資本等変動計算書および個別注記表をいう。すなわち，附属明細書は計算書類には含まれない。"},{"l":3,"m":"計算書類","sb":"計算書類および事業報告","i":"B","r":"(平31II問題14ア・平23I問題14ウ類)","q":"株式会社は，計算書類を作成した時から10年間，当該計算書類およびその附属明細書を保存しなければならない。","a":true,"c":"435条4項。","e":"なお，事業報告については保存義務は課せられていない。"},{"l":4,"m":"計算書類","sb":"計算書類および事業報告","i":"C","r":"(平27I問題10エ類)","q":"監査役の監査の範囲を会計に関するものに限定する旨の定款の定めがある株式会社の監査役は，事業報告の監査について，事業報告を監査する権限がないことを明らかにした監査報告を作成するものとされている。","a":true,"c":"会社法施行規則129条2項。","e":"監査役設置会社（監査役の監査の範囲を会計に関するものに限定する旨の定款の定めがある株式会社を含む）においては，各事業年度に係る計算書類および事業報告ならびにこれらの附属明細書は，法務省令で定めるところにより，監査役の監査を受けなければならない（436 条１項２項）。したがって，会計限定監査役であっても，事業報告の監査を行うことになるが，当該事業報告の監査については，事業報告を監査する権限がないことを明らかにした監査報告を作成するものとされている。"},{"l":5,"m":"計算書類","sb":"計算書類および事業報告","i":"A","r":"(平31II問題14ウ類・平28I問題13エ類・平23II問題14ウ類・平21問題15ア)","q":"会計監査人設置会社において，各事業年度における計算書類およびその附属明細書は，会計監査人の監査を受けなければならないが，事業報告およびその附属明細書は会計監査人の監査対象外である。","a":true,"c":"436条2項。","e":"事業報告の内容には会計に関する部分は含まれないので，会計監査人の監査対象とはならない。"},{"l":6,"m":"計算書類","sb":"計算書類および事業報告","i":"A","r":"(平24II問題13ア)","q":"会計参与設置会社においては，会計参与は，取締役が作成した計算書類およびその附属明細書，ならびに臨時計算書類を監査しなければならない。","a":false,"c":"374条1項。","e":"会計参与は，取締役（指名委員会等設置会社では執行役）と共同して，計算書類およびその附属明細書，臨時計算書類ならびに連結計算書類を作成する株式会社の機関である。"},{"l":7,"m":"計算書類","sb":"計算書類および事業報告","i":"A","r":"(平24II問題13イ)","q":"会計監査人設置会社においては，計算書類およびその附属明細書は，監査役（監査等委員会設置会社にあっては，監査等委員会，指名委員会等設置会社にあっては，監査委員会）および会計監査人の監査を受けなければならない。","a":true,"c":"436条2項1号。","e":""},{"l":8,"m":"計算書類","sb":"計算書類および事業報告","i":"A","r":"(平31II問題14イ)","q":"取締役会設置会社においては，監査役の監査に先立って，計算書類，事業報告およびこれらの附属明細書は取締役会の承認を受けなければならない。","a":false,"c":"436条3項。","e":"取締役会設置会社においては，各事業年度に係る計算書類および事業報告ならびにこれらの附属明細書（監査役等または会計監査人の監査を受けなければならない場合は，当該監査を受けたもの）は，取締役会の承認を受けなければならない。取締役会による計算書類，事業報告およびこれらの附属明細書の承認は，監査役等の監査を受けた後にすることとされている。"},{"l":9,"m":"計算書類","sb":"計算書類および事業報告","i":"A","r":"(平31II問題14エ・平28II問題14ア・平28I問題13ウ・平24II問題13ウ・平23II問題14ア類・平21問題15イ)","q":"取締役会設置会社において，取締役は，定時株主総会の招集に際して，株主に対し，取締役会の承認を受けた計算書類および事業報告を提供しなければならない。","a":true,"c":"437条。","e":"取締役会設置会社においては，取締役は，定時株主総会の招集の通知に際して，法務省令で定めるところにより，株主に対し，取締役会の承認を受けた計算書類および事業報告（監査役等または会計監査人の監査を受けなければならない場合は，監査報告または会計監査報告を含む）を提供しなければならない。なお，附属明細書は，招集通知の際に提供すべき書類に含まれない（437条参照）。また，定時株主総会への提出等の対象にも含まれない（438条）。"},{"l":10,"m":"計算書類","sb":"計算書類および事業報告","i":"A","r":"(平23II問題14イ)","q":"計算書類の附属明細書は，定時株主総会の承認を受ける必要はない。","a":true,"c":"438条2項。","e":""},{"l":11,"m":"計算書類","sb":"計算書類および事業報告","i":"A","r":"(令6I問題14エ類・平28I問題13イ類・平24II問題13エ・平21問題15ウ類)","q":"計算書類および事業報告は，定時株主総会の承認を受けなければならない。","a":false,"c":"438条3項。","e":"定時株主総会に提出または提供された計算書類は，定時株主総会の承認を受けなければならないが（438条２項），事業報告については，定時株主総会の承認を受ける必要はなく報告することで足りる（438 条３項）。ここで，事業報告の内容が承認事項ではなく報告事項とされている理由は，事業報告の記載事項は，当該事業年度における事実であり，その当否を株主が判断し，承認するという性質のものではないためである。"},{"l":12,"m":"計算書類","sb":"計算書類および事業報告","i":"B","r":"","q":"会計監査人設置会社については，定時株主総会における計算書類の承認は受ける必要はなく，取締役が，当該計算書類の内容を定時株主総会に報告することで足りる。","a":false,"c":"439条,会社計算規則135条。","e":"会計監査人設置会社については，取締役会の承認を受けた計算書類が法令および定款に従い株式会社の財産および損益の状況を正しく表示しているものとして法務省令で定める要件に該当する場合には，定時株主総会における計算書類の承認は受ける必要はない。この場合においては，取締役は，当該計算書類の内容を定時株主総会に報告することで足りる。"},{"l":13,"m":"計算書類","sb":"計算書類および事業報告","i":"A","r":"(平28I問題13ア類)","q":"株式会社は，定時株主総会の終結後遅滞なく，貸借対照表および損益計算書を公告しなければならない。","a":false,"c":"440条1項。","e":"株式会社は，定時株主総会の終結後遅滞なく，貸借対照表（大会社では，貸借対照表および損益計算書）を公告しなければならない。なお，株主資本等変動計算書，個別注記表，事業報告は公告の対象とはされていない。"},{"l":14,"m":"計算書類","sb":"計算書類および事業報告","i":"A","r":"(平22II問題13ア類)","q":"公開会社でない株式会社においては，貸借対照表の全文を公告する必要はなく，その要旨を公告することで足りる。","a":false,"c":"440条2項。","e":"公告方法が，官報に掲載する方法または日刊新聞紙に掲載する方法 （939 条１項１号２号） である株式会社は，貸借対照表の全文を公告する必要はなく，その要旨を公告することで足りる。"},{"l":15,"m":"計算書類","sb":"計算書類および事業報告","i":"A","r":"(平28II問題14ウ類・平22II問題13イ類)","q":"公告方法が，官報に掲載する方法または日刊新聞紙に掲載する方法である株式会社は，定時株主総会の終結後遅滞なく，貸借対照表の内容である情報を，定時株主総会の終結の日後５年を経過する日までの間，継続して電磁的方法により不特定多数の者が提供を受けることができる状態に置く場合は，計算書類の公告をする必要はない。","a":true,"c":"440条3項。","e":"この方法による場合は，実質的に電子公告（939条１項３号）をしているのと同じ機能を有しているためである。"},{"l":16,"m":"計算書類","sb":"計算書類および事業報告","i":"B","r":"(平20問題19ウ類)","q":"有価証券報告書提出会社である株式会社であっても，会社法における計算書類の公告が必要である。","a":false,"c":"440条4項。","e":"有価証券報告書提出会社である株式会社については，計算書類の公告をする必要はない。この場合は，会社法に基づく公告よりも詳細な情報が，金融商品取引法によって開示されるためである。"},{"l":17,"m":"計算書類","sb":"計算書類および事業報告","i":"B","r":"(平28II問題14エ・平22II問題13エ類)","q":"電子公告を公告方法としている株式会社では，貸借対照表の公告についての調査を電子公告調査機関に請求しなければならない。","a":false,"c":"941条かっこ書。","e":"電子公告は，印刷物が残る他の公告方法とは異なり，公告終了後に公告の有無や内容を証明する客観的証拠が残らない。したがって，適法な電子公告が行われたか否かを事後的に検証することが困難である。そこで，電子公告をしようとする会社は，法務大臣の登録を受けたもの（調査機関）に対し，当該公告が公告期間中，当該公告の内容である情報が不特定多数の者が提供を受けることができる状態に置かれているかどうかについて，調査を行うことを求めなければならないとされている（941条）。しかし，440 条１項の規定による決算公告については，調査機関の調査が不要とされているため，決算公告を電子公告によってする場合には，調査機関に対して調査を行うことを求める必要はない（同条かっこ書）。"},{"l":1,"m":"計算書類","sb":"臨時計算種類","i":"B","r":"(令3問題13ア)","q":"株式会社は，臨時決算日における当該株式会社の財産の状況を把握するため，法務省令で定めるところにより，臨時計算書類を作成することができる。","a":true,"c":"441条1項。","e":"株式会社は，最終事業年度の直後の事業年度に属する一定の日（臨時決算日）における当該株式会社の財産の状況を把握するため，法務省令で定めるところにより，臨時計算書類を作成することができる。臨時計算書類が作成されることで，最終事業年度の終結後生じた会計事象による影響を受けた期中の財産および損益の状況を把握することができる。また，会社法では，臨時計算書類で認識された期間損益を分配可能額に反映させることとしているため，期中の損益を分配可能額に含めたい場合にも臨時計算書類の作成が必要となる（461 条２項２号参照）。"},{"l":2,"m":"計算書類","sb":"臨時計算種類","i":"B","r":"","q":"臨時株主総会を開催するにあたっては，臨時計算書類を作成しなければならない。","a":false,"c":"","e":"臨時計算書類は，最終の事業年度の終結後生じた会計事象による影響を受けた期中の財産の状況や損益の状況を把握したい場合や，臨時計算書類で認識された期間損益を分配可能額に含めたい場合に作成される。したがって，臨時株主総会の開催にあたって，臨時計算書類の作成は義務づけられていない。"},{"l":3,"m":"計算書類","sb":"臨時計算種類","i":"B","r":"(令3問題13ウ)","q":"株式会社は，法務省令で定めるところにより，臨時計算書類の作成後遅滞なく，当該臨時計算書類を公告しなければならない。","a":false,"c":"","e":"臨時計算書類については，公告義務は課されていない。"},{"l":4,"m":"計算書類","sb":"臨時計算種類","i":"B","r":"(令3問題13エ)","q":"臨時計算書類は，臨時会計年度に係る会計帳簿に基づき作成しなければならない。","a":true,"c":"会社計算規則60条2項。","e":""},{"l":5,"m":"計算書類","sb":"臨時計算種類","i":"C","r":"","q":"臨時計算書類は，監査役の監査対象となるが，会計監査人の監査対象とはならない。","a":false,"c":"441条2項。","e":"会計監査人設置会社において，臨時計算書類は，会計監査人の監査を受けなければならない。"},{"l":6,"m":"計算書類","sb":"臨時計算種類","i":"C","r":"(令3問題13イ)","q":"監査等委員会設置会社が臨時計算書類を作成したときは，会計監査人の監査を受けた当該臨時計算書類について監査等委員会の承認を受けなければならない。","a":false,"c":"","e":"監査役設置会社（監査役の監査の範囲を会計に関するものに限定されている株式会社を含む）または会計監査人設置会社は，臨時計算書類は，法務省令で定めるところにより，監査役または会計監査人（監査等委員会設置会社にあっては，監査等委員会および会計監査人，指名委員会等設置会社にあっては，監査委員会および会計監査人）の監査を受けなければならない（441 条２項）。そのうえで，取締役会設置会社においては，臨時計算書類（監査役等または会計監査人の監査を受けなければならない場合は，当該監査を受けたもの）は，取締役会の承認を受けなければならない（同条３項）。"},{"l":7,"m":"計算書類","sb":"臨時計算種類","i":"C","r":"","q":"臨時計算書類は，株主総会の承認を受ける必要がない。","a":false,"c":"441条4項柱書本文。","e":"臨時計算書類は，原則として，株主総会の承認を受けなければならない（441条４項柱書本文）。ただし，会計監査人設置会社については，臨時計算書類が法令および定款に従い株式会社の財産および損益の状況を正しく表示しているものとして法務省令で定める要件に該当する場合は，株主総会における計算書類の承認は受ける必要はない（同条項ただし書，会社計算規則135条）。そして，この場合においては，計算書類の場合と異なり，臨時計算書類の内容を株主総会で報告する必要もない。"},{"l":1,"m":"計算書類","sb":"計算書類等の備置・閲覧等","i":"A","r":"(平23II問題14エ)","q":"取締役会設置会社は，計算書類，事業報告およびこれらの附属明細書を，定時株主総会の日の２週間前の日から５年間，本店に備え置かなければならない。","a":true,"c":"442条1項1号。","e":"株式会社は，計算書類および事業報告ならびにこれらの附属明細書（監査役等または会計監査人による監査を受ける必要がある場合（436 条１項２項）には，監査報告または会計監査報告を含む）を，定時株主総会の日の１週間前（取締役会設置会社では２週間前）の日から５年間，本店に備え置かなければならない。また，臨時計算書類についても同様に備置義務がある（442条１項２号）。"},{"l":2,"m":"計算書類","sb":"計算書類等の備置・閲覧等","i":"C","r":"","q":"株式会社は，計算書類の写しを支店に備え置く必要はない。","a":false,"c":"442条2項1号。","e":"株式会社は，計算書類等の写しを，定時株主総会の日の１週間前（取締役会設置会社では２週間前）の日から３年間，支店に備え置かなければならない（442条２項１号）。また，臨時計算書類についても同様に備置義務がある（442条２項２号）。ただし，計算書類が電磁的記録で作成されている場合であって，支店における閲覧等の請求に応じることを可能とするための措置として法務省令で定めるものをとっているときは，この限りでない（442 条２項柱書ただし書）。"},{"l":3,"m":"計算書類","sb":"計算書類等の備置・閲覧等","i":"B","r":"","q":"株主および債権者は，株式会社の営業時間内は，いつでも，計算書類の閲覧または謄抄本の交付を請求することができる。","a":true,"c":"442条3項。","e":"また，親会社社員についても，その権利を行使するため必要があるときは，裁判所の許可を得て，閲覧または謄抄本の交付を請求することができる（442条４項）。"},{"l":4,"m":"計算書類","sb":"計算書類等の備置・閲覧等","i":"B","r":"(平29II問題14エ)","q":"株式会社の計算書類が書面をもって作成されているとき，当該株式会社は，当該書面の写しの閲覧を請求する株主に対して費用の支払を請求することができない。","a":true,"c":"442条3項柱書ただし書。","e":"株主および債権者は，株式会社の営業時間内は，いつでも，計算書類の書面または電磁的記録に記録された事項を表示したものの閲覧または謄抄本の交付を請求することができる。ただし，謄抄本等の交付を請求する場合には，株式会社の定めた費用を支払わなければならない。しかし，書面の写しの閲覧を請求するだけでは，株主に対して費用の支払を請求することができないため，本肢は正しい。"},{"l":5,"m":"計算書類","sb":"計算書類等の備置・閲覧等","i":"A","r":"(平29II問題14ウ・平28II問題14イ類・平21問題15エ類)","q":"株式会社は，その計算書類の閲覧を請求する者が，閲覧によって知り得た事実を利益を得て第三者に通報するためその閲覧請求を行ったときであっても，当該請求を拒むことができない。","a":true,"c":"442条参照。","e":"会計帳簿の閲覧等の請求規定とは異なり，計算書類の閲覧等の請求規定には，このような法定の拒否事由はない。"},{"l":6,"m":"計算書類","sb":"計算書類等の備置・閲覧等","i":"C","r":"","q":"裁判所は，申立てによりまたは職権で，訴訟の当事者に対し，計算書類およびその附属明細書の全部または一部の提出を命ずることができる。","a":true,"c":"443条。","e":""},{"l":1,"m":"計算書類","sb":"連結計算書類","i":"B","r":"(令4I問題14ア類・平27II問題12ウ類)","q":"株式会社は，任意に，各事業年度に係る連結計算書類を作成することができる。","a":false,"c":"444条1項。","e":"連結計算書類を作成することができる株式会社は，会計監査人設置会社である。連結計算書類の適正性を保つためには，会計監査人による会計監査を受ける必要があると考えられたためである。"},{"l":2,"m":"計算書類","sb":"連結計算書類","i":"B","r":"(令4I問題14イ類・平27II問題12イ類)","q":"株式会社は，連結計算書類を公告したうえで，定時株主総会の日の１週間前の日から５年間，その本店に備え置かなければならない。","a":false,"c":"442条1項各号参照。","e":"連結計算書類については備置義務や公告義務は設けられていない。"},{"l":3,"m":"計算書類","sb":"連結計算書類","i":"B","r":"(平30II問題14イ)","q":"事業年度の末日において大会社であって金融商品取引法の規定により有価証券報告書の提出義務を負うものは，当該事業年度に係る連結計算書類を作成しなければならない。","a":true,"c":"444条3項。","e":"事業年度の末日において大会社である有価証券報告書提出会社は，当該事業年度に係る連結計算書類を作成しなければならない。"},{"l":4,"m":"計算書類","sb":"連結計算書類","i":"B","r":"(令4I問題14エ・平30II問題14ウ・平27II問題12エ類)","q":"監査等委員会設置会社における連結計算書類は，法務省令で定めるところにより，監査等委員会および会計監査人の監査を受けなければならない。","a":true,"c":"444条4項。","e":"なお，指名委員会等設置会社においても同様に，連結計算書類は，法務省令で定めるところにより，監査委員会および会計監査人の監査を受けなければならない。"},{"l":5,"m":"計算書類","sb":"連結計算書類","i":"B","r":"","q":"会計監査人設置会社が取締役会設置会社であり，連結計算書類を作成している場合，取締役は，定時株主総会の招集の通知に際して，株主に対し，連結計算書類を提供しなければならない。","a":true,"c":"444条6項。","e":""},{"l":6,"m":"計算書類","sb":"連結計算書類","i":"B","r":"","q":"会計監査人設置会社が取締役会設置会社であり，連結計算書類を作成している場合，取締役は，定時株主総会の招集の通知に際して，株主に対し，連結計算書類に係る会計監査報告を提供しなければならない。","a":false,"c":"444条6項。","e":"定時株主総会の招集の通知に際して,株主に対し，連結計算書類に係る監査報告，会計監査報告を提供することは求められていない。なお，当該連結計算書類に係る監査報告，会計監査報告を提供するか否かは，会社の判断に委ねられる（会社計算規則134条２項）。"},{"l":7,"m":"計算書類","sb":"連結計算書類","i":"B","r":"(令4I問題14ウ・平30II問題14エ・平27II問題12ア)","q":"連結計算書類は，定時株主総会の承認を受けなければならない。","a":false,"c":"444条7項柱書後段。","e":"会計監査人設置会社において，取締役は，連結計算書類を定時株主総会に提出または提供しなければならない（444条7項柱書前段）。この場合において，連結計算書類の内容および監査の結果を定時株主総会に報告しなければならない（447 条７項柱書後段）。すなわち，連結計算書類は承認事項ではなく報告事項である。この理由としては，連結計算書類は，主として利害関係人に対する情報提供の目的で作成され，原則として分配可能額の算定には影響を及ぼさないためである。"},{"l":8,"m":"計算書類","sb":"連結計算書類","i":"C","r":"(平30II問題14ア)","q":"連結計算書類を作成した株式会社は，計算書類ではなく，連結計算書類に基づいて分配可能額を算出し，その範囲内で剰余金の配当をすることができる。","a":false,"c":"","e":"このような規定はない。なお，連結配当規制（分配可能額を親会社単体で算出するよりも連結ベースで算出した方が少なくなる場合において，その少ない連結ベースで算出した額を当該株式会社の分配可能額とする制度）は存在する。その連結配当規制を適用する旨を定めた株式会社を，連結配当規制適用会社という（会社計算規則２条３項55号）。"},{"l":1,"m":"資本金の額等","sb":"総則","i":"A","r":"","q":"株主となる者が当該株式会社に対してした払込みまたは給付に係る額の２分の１を超えない額は，資本金として計上しないことができる。この場合において，資本金として計上しないこととした額は，資本準備金として計上しなければならない。","a":true,"c":"445条2項3項。","e":""},{"l":2,"m":"資本金の額等","sb":"総則","i":"A","r":"(令5I問題14ア類・令2II問題14ウ類・平30II問題15ア類)","q":"剰余金の配当をする場合，株式会社は，必ず，当該剰余金の配当により減少する剰余金の額に 10 分の１を乗じて得た額を準備金として計上しなければならない。","a":false,"c":"445条4項,会社計算規則22条。","e":"剰余金の配当をする場合，株式会社は，資本金額の４分の１に達するまで，当該剰余金の配当により減少する剰余金の額に10分の１を乗じて得た額を準備金として計上しなければならない。"},{"l":1,"m":"資本金の額等","sb":"資本金の額の減少","i":"B","r":"","q":"株式会社が資本金の額を減少する場合には，原則として，株主総会の特別決議によらなければならない。","a":true,"c":"447条1項,309条2項9号。","e":"資本金の額の減少は，株主に重大な影響を及ぼすため，原則として，株主総会の特別決議が求められている。"},{"l":2,"m":"資本金の額等","sb":"資本金の額の減少","i":"B","r":"(平30I問題14エ・平24I問題14ウ)","q":"株式会社が資本金の額を減少する場合，減少する資本金の額は，当該資本金の額の減少がその効力を生ずる日における資本金の額を超えてはならない。","a":true,"c":"447条2項。","e":"資本金の額を負の数値にすることはできない。"},{"l":3,"m":"資本金の額等","sb":"資本金の額の減少","i":"B","r":"","q":"株主総会において，その日における欠損の額を超えない範囲で資本金の額を減少する旨を決議する場合は，株主総会の普通決議で足りる。","a":false,"c":"447条1項,309条2項9号イ,ロ,309条1項。","e":"定時株主総会において，定時株主総会の日における欠損の額を超えない範囲で資本金の額を減少する旨を決議する場合は，株主総会の普通決議で足りる。欠損填補の場合には，将来の剰余金配当が容易になるだけであり，会社財産の流出が直ちになされるわけではないため，株主にとって不利益は少ない。また，定時株主総会に限定されている理由は，その時点の欠損の額が正確に把握される計算書類の確定時に限るべきだからである。"},{"l":4,"m":"資本金の額等","sb":"資本金の額の減少","i":"A","r":"(令2II問題14エ・平30II問題15イ・平29I問題14ウ類・平28I問題12イ・平20問題17ウ類)","q":"取締役会設置会社が株式の発行と同時に資本金の額を減少する場合において，資本金の額の減少の効力発生日後の資本金の額がその日の前の資本金の額を下回らないときは，取締役会の決議によって資本金の額を減少することができる。","a":true,"c":"447条3項。","e":"資本金の額が結果的に減少しないためである。なお，株式の発行とは違い，自己株式の処分をする場合は資本金の額は増加しないため，取締役会の決議によって資本金の額を減少することはできないため，注意してほしい。"},{"l":5,"m":"資本金の額等","sb":"資本金の額の減少","i":"A","r":"(令4II問題14イ類・平29I問題14イ・平20問題17イ類)","q":"定時株主総会において，定時株主総会の日における欠損の額を超えない範囲で資本金の額を減少する旨を決議する場合は，債権者異議手続は不要である。","a":false,"c":"449条1項柱書参照。","e":"資本金の額の減少は，会社債権者にとって重大な影響を及ぼすため，必ず，債権者異議手続が必要である。"},{"l":6,"m":"資本金の額等","sb":"資本金の額の減少","i":"A","r":"(令4II問題14ア)","q":"株式会社が株式の発行と同時に資本金の額を減少する場合において，当該資本金の額の減少の効力発生日後の資本金の額が当該日前の資本金の額を下回らないときは，当該株式会社の債権者は，当該株式会社に対し，当該資本金の額の減少について異議を述べることができない。","a":false,"c":"449条1項柱書参照。","e":"資本金の額の減少は，会社債権者にとって重大な影響を及ぼすため，必ず，債権者異議手続が必要である。"},{"l":7,"m":"資本金の額等","sb":"資本金の額の減少","i":"B","r":"","q":"株式会社が資本金の額を減少する場合における債権者が異議を述べることができる期間は，１か月を下ることができない。","a":true,"c":"449条2項柱書ただし書。","e":""},{"l":8,"m":"資本金の額等","sb":"資本金の額の減少","i":"B","r":"","q":"公開会社が資本金の額を減少する場合には，資本金の額の減少の内容等を債権者に対して公告することで足りる。","a":false,"c":"449条2項。","e":"すべての株式会社において，資本金の額の減少をする場合は，原則として，資本金の額の減少の内容等を官報に公告し，かつ，知れている債権者には，各別にこれを催告しなければならない。ただし，株式会社が，公告を官報に加え，定款の定め（939 条１項）による日刊新聞紙または電子公告によっても行う場合には，知れている債権者への各別の催告は必要ない（449 条３項）。この場合は，各別の催告を省略しても，会社債権者に対する公示の機能は十分であると考えられるからである。"},{"l":9,"m":"資本金の額等","sb":"資本金の額の減少","i":"B","r":"","q":"株式会社が資本金の額を減少する場合において，債権者が異議を述べることができる期間内に異議を述べなかったときは，当該債権者は，当該資本金の額の減少について承認したものとみなす。","a":true,"c":"449条4項。","e":""},{"l":10,"m":"資本金の額等","sb":"資本金の額の減少","i":"B","r":"","q":"株式会社が資本金の額を減少する場合において，債権者が一定の期間内に異議を述べたときは，当該株式会社は，当該資本金の額を減少しても当該債権者を害するおそれがない場合を除き，当該債権者に対し，弁済，相当の担保の提供，当該債権者に弁済を受けさせることを目的として信託会社等に相当の財産の信託のいずれかをしなければならない。","a":true,"c":"449条5項。","e":""},{"l":11,"m":"資本金の額等","sb":"資本金の額の減少","i":"A","r":"(平29I問題14エ・平23I問題13イ・平20問題17エ)","q":"資本金の額の減少は，債権者異議手続が終了していないときは，その効力を生じない。","a":true,"c":"449条6項。","e":""},{"l":12,"m":"資本金の額等","sb":"資本金の額の減少","i":"A","r":"(平23I問題13ア)","q":"資本金の額の減少に関する効力発生日は，当該効力発生日の前であっても，変更することができない。","a":false,"c":"449条7項。","e":"資本金の額の減少に関する効力発生日前は，いつでも当該日を変更することができる。"},{"l":13,"m":"資本金の額等","sb":"資本金の額の減少","i":"B","r":"(令5I問題14ウ)","q":"資本金の額の減少の無効は，その効力が生じた日から６か月以内に，訴えをもってのみ主張することができる。","a":true,"c":"828条1項5号。","e":""},{"l":14,"m":"資本金の額等","sb":"資本金の額の減少","i":"B","r":"","q":"すべての債権者は，資本金の額の減少の無効の訴えを提起することができる。","a":false,"c":"828条2項5号。","e":"資本金減少無効の訴えを提起することができるのは，株主等，破産管財人，資本金の額の減少について承認をしなかった債権者である。"},{"l":15,"m":"資本金の額等","sb":"資本金の額の減少","i":"B","r":"(平30II問題15エ・平23I問題13エ)","q":"資本金の額の減少の無効の訴えに係る請求を認容する判決が確定したときは，当該資本金の額の減少は，当該資本金の額の減少の効力発生日に遡ってその効力を失う。","a":false,"c":"839条。","e":"法的安定性を確保するために資本金の額の減少の無効判決の遡及効は阻止され，その資本金の額の減少は将来に向かってその効力を失う。"},{"l":1,"m":"資本金の額等","sb":"準備金の額の減少","i":"B","r":"(平24I問題14エ)","q":"株式会社が準備金の額を減少する場合には，原則として，株主総会の特別決議によらなければならない。","a":false,"c":"448条1項,309条1項。","e":"株式会社が準備金の額を減少する場合には，原則として株主総会の普通決議によらなければならない。"},{"l":2,"m":"資本金の額等","sb":"準備金の額の減少","i":"B","r":"","q":"取締役会設置会社でない株式会社が株式の発行と同時に準備金の額を減少する場合において，準備金の額の減少の効力発生日後の準備金額がその日の前の準備金の額を下回らないときは，取締役の決定によって準備金の額を減少することができる。","a":true,"c":"448条3項。","e":"準備金の額が結果的に減少しないためである。"},{"l":3,"m":"資本金の額等","sb":"準備金の額の減少","i":"A","r":"(令4II問題14ウ・平30II問題15ウ類・平29I問題14ア・平23I問題13ウ)","q":"株式会社が準備金の額を減少する場合において，減少する準備金の額の全部を資本金とする場合には，債権者異議手続は不要である。","a":true,"c":"449条1項本文かっこ書。","e":"この場合は，拘束力のより高い資本金が増加することになり，債権者にとって有利となるためである。また，定時株主総会における準備金の額のみの減少であって，定時株主総会の日における欠損の額を超えない範囲で準備金の額を減少する旨を決議する場合は，債権者異議手続は不要である（449条１項ただし書各号）。"},{"l":4,"m":"資本金の額等","sb":"準備金の額の減少","i":"A","r":"(平28I問題12ア)","q":"株式会社が利益準備金の額を減少するに際し，法定の債権者異議手続において所定の期間内に異議を述べなかった債権者は，利益準備金の額の減少を承認したものとみなされる。","a":true,"c":"449条4項本文。","e":""},{"l":5,"m":"資本金の額等","sb":"準備金の額の減少","i":"B","r":"(平28I問題12ウ類)","q":"会社法において，準備金減少無効の訴えの制度は設けられていない。","a":true,"c":"828条1項各号参照。","e":""},{"l":1,"m":"資本金の額等","sb":"資本金の額の増加","i":"B","r":"(平24I問題14ア類)","q":"株式会社が剰余金の額を減少して資本金の額を増加する場合は，株主総会の特別決議によらなければならない。","a":false,"c":"450条1項2項,309条1項。","e":"株式会社が剰余金の額を減少して資本金の額を増加する場合は，株主総会の普通決議によらなければならない。この場合においては，① 減少する剰余金の額，② 効力発生日を定めなければならない。なお，減少する剰余金の額は，効力発生日における剰余金の額を超えてはならない（450条３項）。"},{"l":1,"m":"資本金の額等","sb":"準備金の額の増加","i":"B","r":"(令5I問題14エ類・平30I問題14ウ・平25II問題13エ)","q":"株式会社が剰余金の額を減少して準備金の額を増加する場合は，株主総会の普通決議によらなければならない。","a":true,"c":"451条1項2項,309条1項。","e":"株式会社は，株主総会の普通決議により剰余金の額を減少して，準備金の額を増加することができる。この場合においては，① 減少する剰余金の額，② 効力発生日を定めなければならない。なお，減少する剰余金の額は，効力発生日における剰余金の額を超えてはならない（451条３項）。"},{"l":1,"m":"資本金の額等","sb":"剰余金についてのその他の処分","i":"C","r":"","q":"株式会社は，任意積立金の積立てを株主総会の普通決議によってすることができる。","a":true,"c":"452条前段,309条1項。","e":"株式会社は，株主総会の普通決議によって，損失の処理，任意積立金の積立てその他の剰余金の処分（剰余金の額を減少して資本金または準備金の額を増加させること（450 条，451 条）および剰余金の配当その他株式会社の財産を処分するものを除く）をすることができる。"},{"l":1,"m":"剰余金の配当","sb":"株主に対する剰余金の配当","i":"B","r":"(令5II問題6イ)","q":"株式会社は，自己株式について，剰余金の配当をすることができない。","a":true,"c":"453条かっこ書。","e":""},{"l":1,"m":"剰余金の配当","sb":"剰余金の配当に関する事項の決定","i":"A","r":"(令5II問題14ア類・令3問題14ウ・平29II問題13ア類・平28II問題15ア・平26I問題12ア類・平22II問題14エ類)","q":"株式会社は，剰余金の配当として，当該株式会社の株式または新株予約権を株主に配当することができる。","a":false,"c":"454条1項1号かっこ書。","e":"株式会社は，配当として金銭以外の財産を分配することも可能であるが，当該株式会社の株式等（株式，社債および新株予約権（107 条２項２号ホかっこ書））を配当財産とすることはできない。なぜなら，株式等についてはその募集手続（199条以下，238条以下，676条以下）などの規制に従うべきだからである。"},{"l":2,"m":"剰余金の配当","sb":"剰余金の配当に関する事項の決定","i":"C","r":"(平25I問題2ア)","q":"合名会社が利益の配当をする場合における配当する財産は，配当財産である。","a":false,"c":"2条25号。","e":"配当財産とは，株式会社が剰余金の配当をする場合における配当する財産をいう。したがって，合名会社が利益の配当をする場合における配当する財産は，配当財産ではない。"},{"l":3,"m":"剰余金の配当","sb":"剰余金の配当に関する事項の決定","i":"C","r":"","q":"剰余金の配当について内容の異なる２以上の種類の株式を発行している種類株式発行会社は，株主に対する配当財産の割当てに関する事項として，ある種類株主に対して配当財産の割当てをしないこととする旨を定めることができる。","a":true,"c":"454条2項1号。","e":"剰余金の配当について内容の異なる２以上の種類の株式を発行している場合，株式会社は，当該種類の株式の内容に応じ，株主に対する配当財産の割当てに関する事項（454条１項２号）として，① ある種類株主に対して配当財産の割当てをしないこととするときは，その旨および当該株式の種類，② ①のほか配当財産の割当てについて株式の種類ごとに異なる取扱いを行うこととするときは，その旨および当該異なる取扱いの内容を定めることができる（454条２項）。例えば，優先株式と普通株式を発行している場合に，優先株式のみに配当することや，優先株式と普通株式とで配当の割当額を異なるものとすることを決定することができる。"},{"l":4,"m":"剰余金の配当","sb":"剰余金の配当に関する事項の決定","i":"A","r":"","q":"株式会社は，剰余金の配当をしようとするときは，原則として，株主総会の特別決議によって，剰余金の配当に関する事項を決定しなければならない。","a":false,"c":"454条1項柱書,309条1項。","e":"株式会社は，剰余金の配当をしようとするときは，原則として，株主総会の普通決議によって，剰余金の配当に関する事項を決定しなければならない。利益を会社に留保して，会社の維持および成長を期待するか，剰余金の配当を受けるかということについては，通常，株主間で意見が異なるので，剰余金の配当に重要な利害を有する株主にその決定を委ねることが適当であると考えられるためである。"},{"l":5,"m":"剰余金の配当","sb":"剰余金の配当に関する事項の決定","i":"A","r":"(令3問題14エ)","q":"配当財産が金銭以外の財産である場合は，株式会社は，株主に対して，金銭分配請求権を与えなければならない。","a":false,"c":"454条4項1号参照。","e":"金銭分配請求権とは，現物配当をする場合に，当該配当財産（現物）に代えて金銭を交付することを株式会社に対して請求することができる権利をいう（454 条４項１号かっこ書）。現物配当を行う際に，株主に対して金銭分配請求権を与えるかどうかは，株式会社の任意である（454条４項１号）。"},{"l":6,"m":"剰余金の配当","sb":"剰余金の配当に関する事項の決定","i":"C","r":"(平26I問題12ウ)","q":"金銭以外の財産を配当財産とする剰余金の配当において，株主に金銭分配請求権を与えるときは，当該金銭分配請求権の行使期間の末日は，当該剰余金の配当の効力発生日の翌日から１週間以内の日でなければならない。","a":false,"c":"454条4項柱書ただし書。","e":"金銭分配請求権の行使期間の末日は，剰余金の配当の効力発生日以前の日でなければならない。"},{"l":7,"m":"剰余金の配当","sb":"剰余金の配当に関する事項の決定","i":"C","r":"","q":"配当財産が金銭以外の財産である場合において，株式会社は，一定の数未満の数の株式を有する株主に対して配当財産の割当てをしないこととする旨を定めることができる。","a":true,"c":"454条4項2号。","e":""},{"l":8,"m":"剰余金の配当","sb":"剰余金の配当に関する事項の決定","i":"A","r":"(令5II問題14エ類・平29II問題13ウ・平22II問題14ウ類)","q":"株式会社が金銭以外の財産を配当する場合，当該配当に関する事項の決定は，株主総会の特別決議によらなければならない。","a":false,"c":"454条4項,309条2項10号。","e":"現物配当をする際に，株主に金銭分配請求権を与えない場合には，株主総会の特別決議が必要である。この場合に特別決議が要求されているのは，株主は金銭による配当を望むのが通常であるから，当該株主の利益を保護する必要があるためである。"},{"l":9,"m":"剰余金の配当","sb":"剰余金の配当に関する事項の決定","i":"C","r":"","q":"金銭以外の財産を配当する場合において，株式会社は，基準未満株式を有する株主に対し，基準株式数を有する株主が割当てを受けた配当財産の価額として定めた額に，当該基準未満株式の数の基準株式数に対する割合を乗じて得た額に相当する金銭を支払わなければならない。","a":true,"c":"456条。","e":"これは，基準未満株式を有する株主に対して配当財産の割当てをしないこととした場合の，当該株主に対する救済を定めたものである。"},{"l":10,"m":"剰余金の配当","sb":"剰余金の配当に関する事項の決定","i":"A","r":"(令3問題14イ類・平29II問題13エ類・平26I問題12イ・平22II問題14イ)","q":"取締役会設置会社は，１事業年度の途中において１回に限り取締役会の決議によって金銭による剰余金の配当をすることができる旨を定款に定めることができる。","a":true,"c":"454条5項。","e":""},{"l":11,"m":"剰余金の配当","sb":"剰余金の配当に関する事項の決定","i":"A","r":"","q":"指名委員会等設置会社において，１事業年度の途中において１回に限り取締役会の決議によって剰余金の配当をすることができる旨の定款の定めがある場合，取締役会の決議によって，執行役に当該決定を委任することができる。","a":false,"c":"416条4項17号。","e":"指名委員会等設置会社において，中間配当の決定は，執行役に委任することができない。なお，一定の要件を満たす監査等委員会設置会社においても同様である（399条の13第５項15号）。"},{"l":12,"m":"剰余金の配当","sb":"剰余金の配当に関する事項の決定","i":"A","r":"","q":"中間配当をする場合に，金銭以外の財産を配当することができる。","a":false,"c":"454条5項かっこ書。","e":"中間配当は金銭配当に限られる。"},{"l":13,"m":"剰余金の配当","sb":"剰余金の配当に関する事項の決定","i":"B","r":"","q":"指名委員会等設置会社は，剰余金の配当に関する事項を取締役会の決議によって決定できる旨を定款で定めることができる。","a":true,"c":"459条1項柱書4号。","e":"① 指名委員会等設置会社，② 監査等委員会設置会社，または，③ 会計監査人設置会社であって，取締役の任期を選任後１年以内としている監査役会設置会社は，剰余金の配当に関する事項の決定を取締役会が定めることができる旨を定款で定めることができる。この定款の定めは，最終事業年度に係る計算書類が法令および定款に従い株式会社の財産および損益の状況を正しく表示しているものとして法務省令で定める要件（会社計算規則155条）に該当する場合に限り，その効力を有する（459条２項）。"},{"l":14,"m":"剰余金の配当","sb":"剰余金の配当に関する事項の決定","i":"B","r":"(平28II問題15イ・平20問題18ウ)","q":"株式会社が，剰余金の配当（金銭分配請求権を与えない現物配当を除く）に関する事項を取締役会が定めることができる旨の定款の定めを置く場合，当該株式会社の取締役（監査等委員である取締役は除く）の任期の末日は，選任後１年以内に終了する事業年度のうち最終のものに関する定時株主総会の終結の日後の日とすることができない。","a":true,"c":"459条1項柱書4号。","e":"分配特則規定により剰余金の配当を取締役会の決議によって決定できる旨を定款で定めることができるのは，①指名委員会等設置会社，② 監査等委員会設置会社，または，③ 会計監査人設置会社であって，取締役の任期を選任後１年以内としている監査役会設置会社である。"},{"l":15,"m":"剰余金の配当","sb":"剰余金の配当に関する事項の決定","i":"B","r":"(平26I問題12エ類)","q":"剰余金の配当を取締役会の決議によって決定できる旨を定款で定めている株式会社であっても，配当財産が金銭以外の財産である場合は，株主総会の決議によって剰余金の配当を決定しなければならない。","a":false,"c":"459条1項4号ただし書。","e":"分配特則規定により剰余金の配当を取締役会の決議によって決定できる旨を定款で定めている株式会社が，取締役会の決議により現物配当を決定することは可能である。ただし，株主に対して金銭分配請求権を与えないこととした場合は，株主総会の特別決議が必要である（309条２項10号）。"},{"l":16,"m":"剰余金の配当","sb":"剰余金の配当に関する事項の決定","i":"B","r":"","q":"公開会社であり，かつ，大会社でもある株式会社は，剰余金の配当を取締役会の決議によって定めることができる旨を定款で定めることができる。","a":false,"c":"459条1項柱書4号。","e":"公開大会社（監査等委員会設置会社および指名委員会等設置会社を除く）は，監査役会および会計監査人の設置義務が課される（328 条１項）が，取締役の任期の末日は，原則として選任後２年以内に終了する事業年度のうち最終のものに関する定時株主総会の終結の日までとされている（332 条１項本文）。したがって，監査等委員会設置会社および指名委員会等設置会社を除き，取締役の任期の末日が選任後１年以内に終了する事業年度のうち最終のものに関する定時株主総会の終結の日以前までとしている公開大会社のみに限って，当該事項を定款に定めることができる。"},{"l":17,"m":"剰余金の配当","sb":"剰余金の配当に関する事項の決定","i":"C","r":"(平20問題18ア)","q":"剰余金の配当を取締役会の決議によって定めることができる旨の定款は，最終事業年度に係る計算書類についての会計監査報告の内容が無限定適正意見でない場合には，その効力を有しない。","a":true,"c":"459条2項,会社計算規則155条。","e":"分配特則規定に関する定款の定めは，① 最終事業年度に係る計算書類についての会計監査報告の内容に会計監査人による無限定適正意見が含まれていること，②会計監査報告に係る監査役会，監査等委員会または監査委員会の監査報告に，会計監査人の監査の方法または結果を相当でないと認める意見がないこと，③ 会計監査報告に係る監査役会，監査等委員会または監査委員会の監査報告に，個々の監査役，監査等委員または監査委員による会計監査人の監査の方法または結果を相当でないと認める意見が付記されていないこと，④ 計算書類に関し期限内に特定監査役（会計監査人から会計監査報告の通知を受ける監査役）が監査報告の内容の通知をしないことにより監査を受けたものとみなされる場合でないことのいずれにも該当する場合に限り，その効力が認められる。"},{"l":18,"m":"剰余金の配当","sb":"剰余金の配当に関する事項の決定","i":"B","r":"(令5II問題14イ類・平20問題18イ)","q":"剰余金の配当を取締役会が決定する旨を定款で定めている場合は，株主総会の決議によって剰余金の配当を決定することができない。","a":false,"c":"","e":"分配特則規定を定款で定めている場合においても，株主総会の決議によって剰余金の配当を決定することができる。しかし，定款により，剰余金の配当を株主総会の決議によっては定めないことを定めることができる（460 条１項）。"},{"l":1,"m":"剰余金の配当","sb":"配当財産の交付の方法等","i":"C","r":"","q":"配当財産は，株主名簿に記載または記録された株主の住所または株主が株式会社に通知した場所において，これを交付しなければならない。","a":true,"c":"457条1項。","e":"剰余金配当の支払債務は，持参債務とされている。"},{"l":2,"m":"剰余金の配当","sb":"配当財産の交付の方法等","i":"C","r":"","q":"配当財産の交付に要する費用は，配当を受ける株主の負担とする。","a":false,"c":"457条2項本文。","e":"配当財産の交付に要する費用は，株式会社の負担とする。ただし，株主の責めに帰すべき理由によって交付費用が増加したときは，その増加額は株主の負担とされる（457条２項ただし書）。"},{"l":1,"m":"剰余金の配当","sb":"純資産の額が300万円を下回る場合の規制","i":"A","r":"(令5II問題14ウ類・令3問題14ア・平28II問題15ウ類・平22II問題14ア類)","q":"株式会社の資本金額が300万円を下回る場合，当該株式会社は，剰余金の配当をすることができない。","a":false,"c":"458条。","e":"株式会社の純資産額が300万円を下回る場合，当該株式会社は，剰余金の配当をすることができない。純資産額がわずかであるにもかかわらず剰余金の配当を許してしまうことは，会社の財産の状況の健全性を害し，会社が負う債務の弁済可能性を下げることにつながるため，会社債権者にとっては好ましいことではない。したがって，純資産額が300万円を下回る場合には，剰余金の配当を禁止したのである。"},{"l":1,"m":"剰余金の配当","sb":"剰余金の配当に関する責任","i":"C","r":"(令2I問題13イ)","q":"株式会社が剰余金の配当を行う場合の分配可能額を計算する際に，当該剰余金の配当が効力を生ずる日における剰余金の額から「自己株式の帳簿価額」を減じなければならない（当該株式会社の最終事業年度の末日後において臨時計算書類は作成されなかったものとする）。","a":true,"c":"461条2項3号。","e":"剰余金の配当等を行う場合に，株主に対して交付する金銭等（当該株式会社の株式を除く）の帳簿価額の総額は，当該行為がその効力を生ずる日における分配可能額を超えてはならない（461 条１項）。ここで，分配可能額とは，①と②の合計額から，③～⑥までの合計額を減じて得た額をいう（同条２項）。"},{"l":2,"m":"剰余金の配当","sb":"剰余金の配当に関する責任","i":"A","r":"","q":"株式会社が剰余金の配当を行う場合に，株主に対して交付する金銭等の帳簿価額の総額は，当該行為がその効力を生ずる日における分配可能額を超えてはならない。","a":true,"c":"461条1項8号。","e":""},{"l":3,"m":"剰余金の配当","sb":"剰余金の配当に関する責任","i":"A","r":"","q":"分配可能額を超えて剰余金の配当がなされた場合，金銭等の交付を受けた株主は，会社に対して配当財産の帳簿価額に相当する金銭を支払う義務を負う。当該責任は，無過失責任である。","a":true,"c":"462条1項2項。","e":""},{"l":4,"m":"剰余金の配当","sb":"剰余金の配当に関する責任","i":"A","r":"(令7I問題14ア類・平31I問題14イ類・平26II問題16ア類)","q":"分配可能額を超えて剰余金の配当がなされた場合，職務を行った業務執行者，配当に関する事項を決定する株主総会または取締役会に議案を提出した取締役は，会社に対して配当財産の帳簿価額に相当する金銭を支払う義務を負う。当該責任は，無過失責任である。","a":false,"c":"462条1項6号,2項。","e":"分配可能額を超えて剰余金の配当がなされた場合，職務を行った業務執行者，配当に関する事項を決定する株主総会または取締役会に議案を提出した取締役は，会社に対して配当財産の帳簿価額に相当する金銭を支払う義務を負う。ただし，当該責任は，立証責任が転換されている過失責任である。すなわち，その職務を行うについて注意を怠らなかったことを証明したときは，当該義務を負わない。"},{"l":5,"m":"剰余金の配当","sb":"剰余金の配当に関する責任","i":"A","r":"(令7I問題14イ類・平31I問題14ア類・平26II問題16イ類)","q":"分配可能額を超えて剰余金の配当がなされた場合における当該配当に関する職務を行った業務執行者の責任は，総株主の同意があれば，全額免除することができる。","a":false,"c":"462条3項。","e":"業務執行者等の負う責任は，総株主の同意がある場合は，分配可能額を限度として当該責任を免除することができる。分配可能額を超過した分について免除することができない理由は，違法配当は会社財産の不法な流出であり，特に会社債権者を保護する必要があるためである。"},{"l":6,"m":"剰余金の配当","sb":"剰余金の配当に関する責任","i":"B","r":"(令7I問題14エ・平26II問題16ウ類)","q":"剰余金の配当により，株主に対して交付された金銭等の帳簿価額の総額が剰余金の配当の効力発生日における分配可能額を超えることにつき善意の株主は，当該株主が交付を受けた金銭等について，支払義務を履行した業務執行者からの求償に応ずる義務を負わない。","a":true,"c":"463条1項。","e":"自ら違法行為をなした業務執行者等が，会社の機関として，善意の株主に違法配当の返還を求めることによって，自己の会社に対する弁済額を軽減できるとするのは不当である。そこで，会社法は，一種の制裁として，求償することができる株主の範囲を悪意の株主に限定しているのである。"},{"l":7,"m":"剰余金の配当","sb":"剰余金の配当に関する責任","i":"B","r":"(令7I問題14ウ・平31I問題14エ類・平26II問題16エ類)","q":"分配可能額を超えて剰余金の配当がなされた場合，会社債権者は，金銭等の交付を受けた株主に対し，その交付を受けた金銭等の帳簿価額，または，配当額が当該債権者の会社に対して有する債権額を超える場合においては当該債権額に相当する金銭を支払わせることができる。","a":true,"c":"463条2項。","e":"会社債権者による支払請求が認められている理由は，会社債権者が会社財産の維持に重大な利害を有するためである。なお，業務執行者等の株主に対する求償（463 条１項）と異なり，株主が悪意であることを要件としていないことに注意する必要がある。"},{"l":8,"m":"剰余金の配当","sb":"剰余金の配当に関する責任","i":"B","r":"(平31I問題14ウ)","q":"違法配当により配当財産の交付を受けた株主は，当該株式会社に対し，当該配当財産の帳簿価額に相当する金銭を支払った後でなければ，その有する株式について，株主の権利を行使することができない。","a":false,"c":"","e":"このような規定は存在しない。"},{"l":9,"m":"剰余金の配当","sb":"剰余金の配当に関する責任","i":"A","r":"","q":"株式会社が分配可能額の範囲内で剰余金の配当を行った場合であっても，事業年度末に欠損が生じた場合，当該配当により金銭等の交付を受けた株主は，会社に対し，連帯して，当該欠損額と剰余金の配当額とのいずれか少ない額を支払う義務を負う。","a":false,"c":"465条1項10号。","e":"株式会社が分配可能額の範囲内で剰余金の配当を行った場合であっても，事業年度末に欠損が生じた場合，剰余金の配当に関する職務を行った業務執行者は，会社に対し，連帯して，当該欠損額と剰余金の配当額とのいずれか少ない額を支払う義務を負う。業務執行者の欠損填補責任は，資本維持の原則の一環として，剰余金の配当等に関与する業務執行者に対して，事後に欠損が生じる可能性があれば，剰余金の配当を行わないという義務を課したものである。"},{"l":10,"m":"剰余金の配当","sb":"剰余金の配当に関する責任","i":"B","r":"(令2I問題14エ類・平22I問題15ウエ類)","q":"株式会社が定時株主総会において分配可能額の範囲内で剰余金の配当を行った場合であっても，事業年度末に欠損が生じた場合は，剰余金の配当に関する職務を行った業務執行者は，会社に対し，連帯して，当該欠損額と剰余金の配当額とのいずれか少ない額を支払う義務を負う。","a":false,"c":"465条1項10号。","e":"業務執行者は，① 剰余金の配当が定時株主総会の決議に基づく場合，② 資本金または準備金の額の減少に伴い剰余金の配当をする場合であって，かつ，配当額が当該資本金または準備金の減少額を超えない場合（減少額の全部または一部を資本金または準備金とする定めがない場合に限る）には，欠損填補責任を負わない（465条１項10号イ～ハ）。①の場合は，１事業年度に１回は業務執行者が責任を問われる懸念なしに剰余金の配当を行える機会を設けないと業務執行者が過度に剰余金の配当に消極的になり，株主の利益に反するおそれがあるからであり，②の場合は，資本金または準備金の額の減少について，株主総会の決議（447条１項，448条１項）および債権者異議手続（449条）がとられているためである。"},{"l":11,"m":"剰余金の配当","sb":"剰余金の配当に関する責任","i":"A","r":"","q":"株式会社が分配可能額の範囲内で剰余金の配当を行った場合であっても，事業年度末に欠損が生じた場合は，剰余金の配当に関する職務を行った業務執行者は，会社に対し，連帯して，当該欠損額と剰余金の配当額とのいずれか少ない額を支払う義務を負う。当該責任は，無過失責任である。","a":false,"c":"465条1項柱書ただし書。","e":"当該責任は，立証責任が転換されている過失責任である。"},{"l":12,"m":"剰余金の配当","sb":"剰余金の配当に関する責任","i":"B","r":"","q":"事業年度末に欠損が生じた場合の剰余金の配当に関する職務を行った業務執行者が負う欠損填補責任は，総株主の同意があれば，免除することができる。","a":true,"c":"465条2項。","e":""}]},{"n":7,"name":"持分会社","qs":[{"l":1,"m":"設立","sb":"","i":"C","r":"(平31II問題15ア)","q":"持分会社の社員の持分の割合は，当該持分会社の発行済持分総数に対して自己が所有する持分数の比率により定まる。","a":false,"c":"","e":"持分会社の社員の地位は，株式会社のように均等な割合的単位の形ではなく，社員によって持分の大きさが異なる。したがって，持分会社の社員の地位はそれぞれが不均一である（持分不均一主義）。また，持分会社の社員は，株式会社のように持分（株式）を複数有することは認められておらず，社員ごとに１個の持分を有する（持分単一主義）。"},{"l":2,"m":"設立","sb":"","i":"B","r":"","q":"持分会社を設立するには，その社員となろうとする者が，定款を作成し，定款が書面をもって作成されている場合には，その全員がこれに署名または記名押印しなければならない。","a":true,"c":"575条1項。","e":""},{"l":3,"m":"設立","sb":"","i":"C","r":"","q":"持分会社の定款は，公証人の認証を受けなければ，その効力を生じない。","a":false,"c":"","e":"持分会社の定款は，株式会社の場合とは異なり，公証人の認証を必要としていない（30条１項参照）。これは，持分会社の社員には相互に信頼関係があるため，公証人の認証により，定款が適法であることを確保する必要性に乏しいからである。"},{"l":4,"m":"設立","sb":"","i":"A","r":"","q":"持分会社の定款には，社員の氏名または名称および住所を記載する必要はない。","a":false,"c":"576条1項4号。","e":"持分会社の定款には，社員の氏名または名称および住所を記載または記録しなければならない。"},{"l":5,"m":"設立","sb":"","i":"A","r":"(平29II問題15ウ類・平23I問題2ア)","q":"会社は，他の会社の無限責任社員になることができない。","a":false,"c":"576条1項4号。","e":"持分会社の定款に定めるべき事項は，社員の氏名または「名称」となっているため，法人であっても持分会社の社員になることができる。また，その場合，無限責任社員または有限責任社員のいずれであってもよい。"},{"l":6,"m":"設立","sb":"","i":"A","r":"(平23I問題15ア)","q":"合同会社では，社員１人でも足り，自然人に限られない。","a":true,"c":"576条4項,576条1項4号。","e":"合同会社は，間接有限責任社員のみからなる会社である。条文上は社員の員数は示されていないため，合同会社は，１人の社員でも設立することができる。また，定款に定めるべき事項は，社員の氏名または「名称」となっ
