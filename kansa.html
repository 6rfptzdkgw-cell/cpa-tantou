": "監査証拠の十分性と適切性は，それぞれ量と質を表しており相互に関連しているため，監査人は，質の低い監査証拠を用いる場合，より多くの量の監査証拠を入手して監査証拠の質を補完することがある。", "a": true, "c": "H24Ⅱ⑭ア", "e": ""}, {"l": 13, "m": "監査実施論－総論", "sb": "", "i": "A", "r": "", "q": "必要と判断される監査証拠の量は，監査人が評価した虚偽表示リスクの程度のみならず，監査証拠の質によっても影響を受ける。", "a": true, "c": "H29Ⅱ⑬ア／H28Ⅱ⑬ウ", "e": ""}, {"l": 14, "m": "監査実施論－総論", "sb": "", "i": "A", "r": "", "q": "監査証拠の十分性は，監査証拠の量的尺度であり，監査証拠の質的評価が一定であると仮定すると，高い水準に設定された発見リスクのもとで要求される監査証拠の量は相対的に少なくなる。", "a": true, "c": "H25Ⅱ⑫ウ", "e": "ＤＲが高い（ＲＭＭが低い）場合は，実証手続を緩やかに実施することができるため，要求される監査証拠の量は相対的に少なくなる。"}, {"l": 15, "m": "監査実施論－総論", "sb": "", "i": "A", "r": "", "q": "監査証拠として利用する情報が監査手続の目的に関連しているかどうかは，主として情報源及び情報の種類，並びに情報を入手する状況によって判断される。", "a": false, "c": "H25Ⅰ⑪オ", "e": "本肢の「監査証拠として利用する情報が監査手続の目的に関連しているかどうか」は，監査証拠の適合性に関する記述である。一方，「情報源及び情報の種類，並びに情報を入手する状況によって判断」は，監査証拠の信頼性に関する記述である。"}, {"l": 16, "m": "監査実施論－総論", "sb": "", "i": "A", "r": "", "q": "基準日における帳簿上の買掛金残高に対して行った確認に関して，対応する債権が当該基準日時点で存在する旨の確認先からの回答は，買掛金の網羅性に関する監査証拠となる。", "a": false, "c": "H27Ⅱ⑮ア／H26Ⅰ⑫エ", "e": "買掛金の網羅性に関する監査証拠を入手するためには，帳簿に計上された買掛金の検討（帳簿⇒事実）ではなく，前進法（事実⇒帳簿）により検討する必要がある。"}, {"l": 17, "m": "監査実施論－総論", "sb": "", "i": "A", "r": "", "q": "監査人は，買掛金の過小計上の有無を確かめる場合，被監査会社の帳簿に計上された買掛金の検討により，当該目的に適合した監査証拠を入手することができる。", "a": false, "c": "R６Ⅰ⑯ウ", "e": "同上"}, {"l": 18, "m": "監査実施論－総論", "sb": "", "i": "A", "r": "", "q": "売掛金の実在性に関する監査要点を立証するためには，期末日後の売掛金の回収に関連した文書の閲覧が実施される。", "a": true, "c": "H26Ⅰ⑫ア", "e": ""}, {"l": 19, "m": "監査実施論－総論", "sb": "", "i": "A", "r": "", "q": "売上の期間帰属の適切性に関する監査要点を直接的に立証するには，期末日後の時点において，当該売上に対応する債権の回収に関連した記録の閲覧が実施される。", "a": false, "c": "H27Ⅰ⑩エ／H23Ⅱ⑪ウ", "e": "期末日後の売掛金の回収に関連した文書の閲覧は，売掛金（売上）の期間帰属の適切性については「必ずしも」監査証拠を提供しない。"}, {"l": 20, "m": "監査実施論－総論", "sb": "", "i": "A", "r": "", "q": "被監査会社から独立した情報源から入手した監査証拠は，一般的には被監査会社内部から入手した監査証拠より強い証明力を有するが，独立した情報源から入手した監査証拠であっても十分な証明力を有していないと判断される場合がある。", "a": true, "c": "H27Ⅱ⑮ウ／H23Ⅱ⑪エ", "e": "独立した情報源から入手する監査証拠であっても，その情報源が十分な知識を有していない個人又は組織である場合等，情報を入手する状況によっては信頼できないことがある。"}, {"l": 21, "m": "監査実施論－総論", "sb": "", "i": "A", "r": "", "q": "監査人は経営者の利用する専門家の業務により作成された情報を監査証拠として利用する場合には当該専門家の適性，能力及び客観性を評価しなければならない。", "a": true, "c": "R５Ⅰ⑰ア／H26Ⅰ⑨ア", "e": ""}, {"l": 22, "m": "監査実施論－総論", "sb": "", "i": "A", "r": "", "q": "監査人は，監査証拠として利用する情報が経営者の利用する専門家の業務により作成されている場合には，当該情報の信頼性を考慮する必要があるが，この信頼性は当該専門家の適性によっても影響を受ける。", "a": true, "c": "H25Ⅱ⑫エ", "e": ""}, {"l": 23, "m": "監査実施論－総論", "sb": "", "i": "A", "r": "", "q": "（監査手続の実施として適切か？）監査人は，被監査会社が事業を譲り受けた際の事業価値の評価額について，被監査会社が利用した専門家が作成した報告書が重要であると判断し，経営者が利用した専門家とその業務の評価を行い監査証拠として利用した。", "a": true, "c": "R４Ⅰ⑯ア", "e": ""}, {"l": 24, "m": "監査実施論－総論", "sb": "", "i": "A", "r": "", "q": "企業に雇用されている専門家は，高度な専門的知識を有し，かつ，所属する専門家団体の規制を受けているため，監査人は，当該専門家は当該企業の他の従業員と比べて高い客観性を有しているものと見なすことができる。", "a": false, "c": "H26Ⅰ⑨イ", "e": "企業の従業員であることにより生じる客観性に対する阻害要因は常に存在する。そのため，企業に雇用されている専門家は，通常，当該企業の他の従業員に比べて高い客観性を有しているとみなすことはできない。"}, {"l": 25, "m": "監査実施論－総論", "sb": "", "i": "A", "r": "", "q": "監査証拠として利用する情報が経営者の利用する専門家により作成されている場合，監査人は，専門家の指摘事項又は結論の合理性，あるいは専門家が採用している重要な仮定や方法の合理性といった事項を検討する。", "a": true, "c": "H25Ⅰ⑪ア", "e": ""}, {"l": 26, "m": "監査実施論－総論", "sb": "", "i": "A", "r": "", "q": "二重責任の原則の下では，経営者が作成又は収集した情報に基づいて監査人が判断を行うことは適切でない。", "a": false, "c": "H24Ⅱ①イ", "e": "監査人は，監査証拠の入手において，経営者（企業）が作成又は収集した情報を利用することがある。"}, {"l": 27, "m": "監査実施論－総論", "sb": "", "i": "A", "r": "", "q": "監査人は，手作業により作成された情報か，企業内の情報システムから出力された情報かにかかわらず，企業が作成した情報を監査証拠として利用する場合，監査人の目的に照らして十分な信頼性を有しているかどうかを評価することが必要である。", "a": true, "c": "H29Ⅱ⑬エ", "e": ""}, {"l": 28, "m": "監査実施論－総論", "sb": "", "i": "A", "r": "", "q": "被監査会社が作成した情報を監査証拠として利用するために，当該情報の正確性及び網羅性が十分であることを確かめる場合には，監査人は，当該情報の作成と管理に関する内部統制の運用評価手続を省略することはできない。", "a": false, "c": "H27Ⅱ⑮イ", "e": "監査人は，企業が作成した情報の正確性及び網羅性を確かめるために，情報の作成と管理に関する内部統制の運用評価手続を実施することもあれば，実施しないこともある。"}, {"l": 29, "m": "監査実施論－総論", "sb": "", "i": "A", "r": "", "q": "複数の情報源から入手した監査証拠が相互に矛盾する場合，監査人は，当初適用した監査手続とは異なる監査手続を適用しなければならない。", "a": false, "c": "H25Ⅰ⑪ウ", "e": "複数の監査証拠が相互に矛盾する場合，監査人は，どのような監査手続の変更又は追加が必要であるかを判断して対処するが，必ずしも，当初適用した監査手続とは異なる監査手続を適用しなければならないわけではない。"}, {"l": 30, "m": "監査実施論－総論", "sb": "", "i": "A", "r": "", "q": "複数の情報源から入手した監査証拠に矛盾がない場合に得られる心証の確からしさと，個々に検討された監査証拠から得られる心証の確からしさに，通常，相違はない。", "a": false, "c": "H28Ⅱ⑬ア", "e": "複数の情報源から入手した監査証拠に矛盾がない場合，通常，個々に検討された監査証拠に比べ，より確かな心証が得られる。"}, {"l": 31, "m": "監査実施論－総論", "sb": "", "i": "A", "r": "", "q": "有価証券の実在性に関する監査要点を直接的に立証するには，株券や債券のような文書の閲覧が実施される。", "a": true, "c": "H27Ⅰ⑩ア", "e": ""}, {"l": 32, "m": "監査実施論－総論", "sb": "", "i": "A", "r": "", "q": "取引銀行の発行する貸付金に関する残高証明書の閲覧は，帳簿に計上された借入金の実在性を検討する目的に適合するが，借入金残高の網羅性を検討する目的には適合しない。", "a": true, "c": "R４Ⅱ⑭エ", "e": "難易度の高い肢。本肢にある「取引銀行の発行する貸付金に関する残高証明書」とは，借入金（銀行にとっては貸付金）の未返済残高に関する証明書であり，企業が銀行から発行を受けるものである。残高証明書の閲覧は，企業が全ての残高証明書を監査人に見せるとは限らないことから，網羅性を検討する目的には適合しないとされる。"}, {"l": 33, "m": "監査実施論－総論", "sb": "", "i": "A", "r": "", "q": "不動産の権利と義務の帰属に関する監査要点を直接的に立証するには，登記簿謄本や契約書の閲覧が実施される。", "a": true, "c": "H27Ⅰ⑩イ", "e": ""}, {"l": 34, "m": "監査実施論－総論", "sb": "", "i": "A", "r": "", "q": "土地の実査及び登記簿謄本の閲覧は，土地の実在性及び権利の帰属に関する証明力のある監査証拠を提供するが，当該土地の評価に関する監査証拠を提供しないことがある。", "a": true, "c": "R４Ⅱ⑭ウ", "e": ""}, {"l": 35, "m": "監査実施論－総論", "sb": "", "i": "A", "r": "", "q": "実査は，有形資産の実在性に関する監査証拠を入手するための監査手続であるとともに，無形資産の評価の妥当性に関する監査証拠を入手するための監査手続でもある。", "a": false, "c": "H27Ⅱ⑫ウ", "e": "実査は，有形資産に対してのみ実施することができる。"}, {"l": 36, "m": "監査実施論－総論", "sb": "", "i": "A", "r": "", "q": "監査人は，会社の保有する全ての預金証書や有価証券の実査をすることにより，基準日現在の残高の実在性のみならず，網羅性に関する監査要点に適合した監査証拠を入手できる。", "a": false, "c": "H23Ⅱ⑭ア", "e": "監査人は，通常，「会社の保有する全ての有形資産を実査した」という心証を得ることはできない。そのため，実査はあくまで実在性に関する監査証拠を入手するための監査手続として位置づけられる。"}, {"l": 37, "m": "監査実施論－総論", "sb": "", "i": "A", "r": "", "q": "監査人は，有価証券や有形固定資産の実査により，これらの資産の実在性に関する証明力のある監査証拠を入手できるが，必ずしも当該資産に係る権利と義務又は評価に関する監査証拠を入手できるわけではない。", "a": true, "c": "H30Ⅰ⑬イ", "e": ""}, {"l": 38, "m": "監査実施論－総論", "sb": "", "i": "A", "r": "", "q": "監査人は，生産設備の視察又は実査により当該設備の実在性や担保の設定状況を検証することができる。", "a": false, "c": "H23Ⅱ⑭オ", "e": "生産設備の視察又は実査により当該設備の実在性を検証することはできるが，担保の設定状況（権利と義務）を検証することはできない。当該検証においては，登記簿謄本や抵当権設定関係書類等の閲覧を実施する必要がある。"}, {"l": 39, "m": "監査実施論－総論", "sb": "", "i": "A", "r": "", "q": "監査人は，観察により，プロセス又は手続の実施に関する監査証拠を入手できるが，入手できる監査証拠は観察を行った時点に関する監査証拠に限定される。", "a": true, "c": "R３⑯イ", "e": ""}, {"l": 40, "m": "監査実施論－総論", "sb": "", "i": "A", "r": "", "q": "監査証拠を入手する監査手続には，質問，閲覧，観察，確認，再計算，再実施及び分析的手続があるが，通常，質問のみではアサーション・レベルの重要な虚偽表示がないことについて十分な監査証拠を提供しない。", "a": true, "c": "H28Ⅱ⑬エ", "e": ""}, {"l": 41, "m": "監査実施論－総論", "sb": "", "i": "A", "r": "", "q": "監査人は，質問により被監査会社の内外の関係者に対して情報を求める場合，その回答者が被監査会社の内部者又は外部者のいずれであるかにかかわらず，また，その回答が非公式な口頭によるものであっても，その回答を評価しなければならない。", "a": true, "c": "R６Ⅰ⑯エ", "e": ""}, {"l": 42, "m": "監査実施論－総論", "sb": "", "i": "A", "r": "", "q": "網羅性という経営者の主張に関連する実証手続としてサンプリングを行う場合には，財務諸表計上額を母集団とし，実在性という経営者の主張に関連する実証手続としてサンプリングを行う場合には，証憑書類を母集団とする。", "a": false, "c": "H23Ⅱ⑬エ", "e": "本肢は，網羅性の立証において遡及法による実証手続を実施し，実在性の立証において前進法による実証手続を実施すると記述しているが，正しくは逆（網羅性が前進法，実在性が遡及法）である。"}, {"l": 43, "m": "監査実施論－総論", "sb": "", "i": "A", "r": "", "q": "監査人は，取引種類又は勘定残高を構成している項目の母集団全体を検討することが最も適切であると判断した場合には，詳細テストのみならず，内部統制の運用評価手続においても，精査を実施することが求められている。", "a": false, "c": "R７Ⅰ⑯ア", "e": "通常，運用評価手続を精査で実施することはない。"}, {"l": 44, "m": "監査実施論－総論", "sb": "", "i": "A", "r": "", "q": "試査には，「サンプリングによる試査」と「特定項目抽出による試査」があるが，一定金額以上のすべての項目を抜き出して調べる場合は，前者に該当する。", "a": false, "c": "H28Ⅰ⑭ア", "e": "一定金額以上の全ての項目を抜き出して調べる試査は，特定項目抽出による試査に該当する。"}, {"l": 45, "m": "監査実施論－総論", "sb": "", "i": "A", "r": "", "q": "取引種類又は勘定残高から特定項目を抽出する試査は，潜在的に誤謬を含む可能性が高い項目等を母集団から抽出する監査手続であり，発見された誤謬をもとに母集団全体の特性を推定することができる。", "a": false, "c": "H31Ⅰ⑰エ／H24Ⅰ⑫ア", "e": "母集団の特性を代表しない項目を抽出する特定項目抽出による試査では，母集団の特性を推定することはできない。"}, {"l": 46, "m": "監査実施論－総論", "sb": "", "i": "A", "r": "", "q": "特定項目抽出による試査では，監査サンプリングによる試査とは異なり，その実施した監査手続の結果からは，母集団の中から抽出されなかった残余部分に関する監査証拠は得られない。", "a": true, "c": "H29Ⅱ⑬イ", "e": "そのため，特定項目抽出による試査の場合には，必要に応じて，残余部分に対する他の監査手続を実施することになる。"}, {"l": 47, "m": "監査実施論－総論", "sb": "", "i": "A", "r": "", "q": "期末日の売掛金残高の実在性を確かめるため，実在性に関するリスクが特に高いと評価した相手先に対する残高を抽出して検証した結果，実在性に関して重要な虚偽の表示の存在を示唆する監査証拠が得られなかったとしても，そのことをもって期末日の売掛金残高の実在性に関する結論を導き出すことはできない。", "a": true, "c": "H27Ⅱ⑮エ", "e": "本肢は読み取りが難しい記述であるが，要するに，売掛金の実在性を立証するために特定項目抽出による試査を実施した結果，抽出した項目からは重要な虚偽表示が発見されなかったとしても，母集団全体に重要な虚偽表示がないとの結論を導き出すことはできない（＝母集団の特性を推定できない）ことを意味している。"}, {"l": 48, "m": "監査実施論－総論", "sb": "", "i": "A", "r": "", "q": "特定項目抽出による試査では，リスクが高いと推定する項目等を抽出して監査手続を実施するため，入手された監査証拠の証明力は，サンプリングによる試査によって入手された監査証拠より相対的に強い。", "a": false, "c": "H23Ⅱ⑪オ", "e": "特定項目抽出による試査により入手した監査証拠と，サンプリングによる試査により入手した監査証拠との間で，証明力の優劣は存在しない。"}, {"l": 49, "m": "監査実施論－総論", "sb": "", "i": "A", "r": "", "q": "サンプリングによる試査では，母集団の一部から項目を抽出して監査手続を適用するため，発見リスクをゼロとすることはできないが，特定項目抽出による試査では，母集団の特定項目すべてに対して監査手続を実施するため，発見リスクをゼロにできる。", "a": false, "c": "H23Ⅱ⑫オ", "e": "特定項目抽出による試査の場合でも，ノンサンプリングリスクは存在するため，発見リスクをゼロにすることはできない。"}, {"l": 50, "m": "監査実施論－総論", "sb": "", "i": "A", "r": "", "q": "試査に基づく監査が行われる理由は，一般に，監査資源の制約，有効な内部統制の存在，統計技術及び統計理論の発達，並びに財務諸表監査の目的が重要な虚偽表示が存在しないことを合理的な水準で保証することとする社会的な合意にある。", "a": true, "c": "R３②ウ／R６Ⅰ①イ", "e": ""}, {"l": 51, "m": "確認", "sb": "", "i": "A", "r": "", "q": "確認項目に関する金額を記載しないブランク確認状は，確認回答者に追加作業が要求されるため回答率が低下する場合もあるが，金額を記載した確認状と比較してより信頼性が高い。", "a": true, "c": "H28Ⅰ⑮ウ", "e": ""}, {"l": 52, "m": "確認", "sb": "", "i": "A", "r": "", "q": "消極的確認から入手する監査証拠は，積極的確認から入手する監査証拠と比べ証明力が弱いため，監査人は，アサーション・レベルで評価した重要な虚偽表示リスクに対応するための単独の実証手続として，消極的確認を利用することはできない。", "a": false, "c": "H27Ⅰ⑫イ／H25Ⅱ⑯イ", "e": "条件を充たした場合は，単独の実証手続として消極的確認を利用することができる。"}, {"l": 53, "m": "確認", "sb": "", "i": "A", "r": "", "q": "監査人は，重要な虚偽表示リスクが高いと評価したアサーションを裏付けるための単独の実証手続として，消極的確認を利用してはならない。", "a": true, "c": "R６Ⅱ⑯ウ", "e": ""}, {"l": 54, "m": "確認", "sb": "", "i": "A", "r": "", "q": "監査人は，一つの確認先に対して，積極的確認と消極的確認を組合せて実施することはできない。", "a": false, "c": "H23Ⅱ⑭エ", "e": "例えば，一つの確認先に対する確認事項が複数ある場合，ある確認事項に対して積極的確認を実施する一方，他の確認事項に対して消極的確認を実施するといったように，積極的確認と消極的確認を組み合わせて実施することができる。"}, {"l": 55, "m": "確認", "sb": "", "i": "A", "r": "", "q": "売掛金残高に対する確認手続は，売掛金の評価の妥当性かつ売上高の期間配分の妥当性に関する監査証拠を入手する目的で実施される。", "a": false, "c": "R４Ⅱ⑭ア／H27Ⅰ⑩ウ／H26Ⅰ⑫イ", "e": "売掛金残高の確認により入手した監査証拠は，評価の妥当性には必ずしも適合しない。なお，レジュメに掲載していないが，多くの場合，売上高の期間帰属（期間配分）には適合するとされている。"}, {"l": 56, "m": "確認", "sb": "", "i": "A", "r": "", "q": "監査人は，売掛金の確認により，通常，確認基準日現在の残高の実在性及び権利と義務のみならず，評価の適切性に適合した監査証拠も入手することができる。", "a": false, "c": "R６Ⅰ⑯ア", "e": "同上"}, {"l": 57, "m": "確認", "sb": "", "i": "A", "r": "", "q": "売上取引に買戻条件が付いていないことに関する監査証拠を入手するために，確認という監査手続が利用されることもある。", "a": true, "c": "H25Ⅰ⑪エ", "e": "確認は，残高に関する情報以外にも様々な情報を入手できる監査手続である。"}, {"l": 58, "m": "確認", "sb": "", "i": "A", "r": "", "q": "経営者が監査人の確認依頼の送付に同意しない場合，監査人は，その正当性と合理性に関する監査証拠を求めることになるが，同意しないことに合理性がないと結論付けたときは，その状況を監査役等に報告することが必要である。", "a": true, "c": "R２Ⅱ⑮ウ", "e": ""}, {"l": 59, "m": "確認", "sb": "", "i": "A", "r": "", "q": "監査人は，重要な勘定科目に関して経営者が確認状の送付依頼に同意しないために確認が実施できなかった場合であっても，代替手続により十分かつ適切な監査証拠を入手できたときは，監査範囲の制約とはしない。", "a": true, "c": "H28Ⅰ⑮イ／H23Ⅱ⑭ウ", "e": "なお，監査範囲の制約とするかどうかは，予定していた監査手続を実施できたかどうかではなく，常に「十分かつ適切な監査証拠を入手できたかどうか」で判断すること。"}, {"l": 60, "m": "確認", "sb": "", "i": "A", "r": "", "q": "監査人は，確認依頼の送付に経営者が同意せず，代替的な監査手続を実施しても，十分かつ適切な監査証拠を入手できない場合には，監査が継続できないと判断することもある。", "a": true, "c": "R６Ⅱ⑯ア", "e": ""}, {"l": 61, "m": "確認", "sb": "", "i": "A", "r": "", "q": "確認依頼への回答には，紙媒体，電子媒体又はその他の媒体によるかに関係なく改ざん又は不正に係るリスクが存在し，監査人はこれらのリスクを低いと評価することはできない。", "a": false, "c": "R３⑯ウ／H25Ⅱ⑯エ", "e": "たとえば，監査人と回答者が確認依頼の送付及び回答に利用する電子的なプロセスが信頼できる環境にある場合は，改ざん又は不正に係るリスクを軽減（低いと評価）することができる。"}, {"l": 62, "m": "確認", "sb": "", "i": "A", "r": "", "q": "監査人は，電子的に受領した回答の改ざんリスクを，例えば，暗号化，電子署名などの電子的なプロセスに組み込まれた技術によって軽減することはできない。", "a": false, "c": "R６Ⅱ⑯エ", "e": "同上"}, {"l": 63, "m": "確認", "sb": "", "i": "A", "r": "", "q": "確認依頼先からの回答が口頭によるものであっても，監査人が直接入手した回答の内容を監査調書に適切に記載することにより，文書による回答と同様に取り扱うことができる。", "a": false, "c": "H28Ⅰ⑮ア／H25Ⅱ⑯ウ", "e": "確認依頼への口頭による回答は，それだけでは監査人への直接の文書による回答ではなく，確認の定義には該当しないため，本肢は誤りとなる。"}, {"l": 64, "m": "確認", "sb": "", "i": "A", "r": "", "q": "発送した債権残高確認状が宛先不明として返送されることにより，当初設定した発送件数に不足が生じた場合には，確認残高が近似する他の得意先を選定し確認状を送付することができる。", "a": false, "c": "H28Ⅰ⑮エ", "e": "確認状が宛先不明で返送された場合には，不正の可能性も考慮して慎重な対応をとるべきである。そのため，確認残高が近似する他の得意先に対する確認の実施で発送件数の不足を補おうとする本肢の対応は適切とはいえない。"}, {"l": 65, "m": "確認", "sb": "", "i": "A", "r": "", "q": "積極的確認を実施して未回答であった場合，代替的な監査手続を実施してもなお，当該確認に対する回答が必要であると監査人が判断したときには，監査意見への影響のみならず，監査が継続できるかどうかについても判断しなければならない。", "a": true, "c": "H25Ⅱ⑯ア", "e": ""}, {"l": 66, "m": "確認", "sb": "", "i": "A", "r": "", "q": "監査人は，売掛金の残高確認の結果，確認金額と回答金額に著しい差異が生じている場合，当該差異が虚偽表示の兆候を示しているものとして，差異の調査を実施しなければならない。", "a": false, "c": "R６Ⅱ⑯イ", "e": "確認差異が虚偽表示の兆候を示しているか否かは，当該差異の調査により判明するものであるため，たとえ差異の金額が著しくとも，調査前に虚偽表示の兆候を示しているものとして扱うことはない。"}, {"l": 67, "m": "確認", "sb": "", "i": "A", "r": "", "q": "監査人は，確認差異が財務諸表における虚偽表示の兆候を示しているか否かを判断するために，当該事項を調査することが求められているが，重要性の基準値を下回る確認差異を調査する必要はない。", "a": false, "c": "H23Ⅱ⑭ウ", "e": "重要性の基準値は，財務諸表全体の観点からの金額的重要性を判断するために用いるものであり，本肢のように，特定の財務諸表項目における発見事項の金額的重要性を判断するために用いることは適切ではない。また，確認差異については，分析的実証手続の実施において決定するような「追加的な調査を行わなくても監査上許容できる差異の金額」の規定は存在しない。"}, {"l": 68, "m": "分析的手続", "sb": "", "i": "A", "r": "", "q": "監査人は，リスク評価手続として実施する分析的手続において，過年度の財務諸表，期中の財務情報，経営者が策定した当期の予算数値等を比較することにより，認識していなかった重要な虚偽表示リスクを識別することがある。", "a": true, "c": "R７Ⅰ⑮ウ", "e": ""}, {"l": 69, "m": "分析的手続", "sb": "", "i": "A", "r": "", "q": "計画した分析的実証手続は，反証がない限り，データ間の関係が存在し継続するという推定に基づいて実施されるが，これらの関係を変化させ得る状況の例として，通例でない取引や事象，会計処理の変更，事業の変化，虚偽表示等が挙げられる。", "a": true, "c": "H31Ⅱ⑮ア", "e": ""}, {"l": 70, "m": "分析的手続", "sb": "", "i": "A", "r": "", "q": "特定の分析的実証手続が適切かどうかは，アサーションの種類及び監査人の重要な虚偽表示リスクの評価によって影響を受ける。例えば年度を通じて給与月額及び従業員数が明らかであり，監査人が年度の給与合計を高い精度で見積もることができる場合には，分析的実証手続の実施が適切である。", "a": true, "c": "H29Ⅰ⑭イ", "e": "なお，監基報によれば，本肢にある具体例は，「単純な計算手法でも分析的手続が有効である場合」の例として示されているものであるが，「アサーションの種類及び重要な虚偽表示リスクの評価によって影響を受ける」ことの例としても内容として整合するため，本肢は正しいと判断することになる。"}, {"l": 71, "m": "分析的手続", "sb": "", "i": "A", "r": "", "q": "監査人は，推定値を設定するに当たり使用するデータの信頼性を評価しなければならないが，企業外部の独立した情報源からデータを入手する場合には，その信頼性を評価する必要はない。", "a": false, "c": "H29Ⅰ⑭ア", "e": "たしかに，推定に当たり使用するデータが企業外部の独立した情報源から入手したものである場合，当該データを信頼できるものとして判断できることがある。しかし，入手したデータがどのようなものであっても，データの信頼性の評価そのものを省略することはできない。"}, {"l": 72, "m": "分析的手続", "sb": "", "i": "A", "r": "", "q": "監査人は，分析的実証手続を立案するに当たり，重要な虚偽表示を識別するための推定の精度を十分に高める必要があるので，予算や見込みのように経営者による裁量の余地が大きい情報を利用してはならない。", "a": false, "c": "H24Ⅱ⑬ア", "e": "たしかに，経営者の裁量の余地が大きい情報を利用した分析では推定の精度が低くなる場合があるが，そのような情報を一切利用してはならないわけではない。"}, {"l": 73, "m": "分析的手続", "sb": "", "i": "A", "r": "", "q": "監査人は，分析的実証手続を実施する場合，計上された金額と監査人の推定値との差異に対して，追加的な調査を行わなくても監査上許容できる差異の金額を決定しなければならない。", "a": true, "c": "R３⑯エ", "e": ""}, {"l": 74, "m": "分析的手続", "sb": "", "i": "A", "r": "", "q": "監査人は，分析的実証手続における推定値と実際に計上された金額との差異について，追加的な調査をせずに許容可能とするかどうかを判断しなければならないが，当該判断は，重要性と手続から得ようとする保証水準によっても影響を受ける。", "a": true, "c": "H24Ⅱ⑬ウ", "e": ""}, {"l": 75, "m": "分析的手続", "sb": "", "i": "A", "r": "", "q": "監査人は，計上された金額と監査人の推定値との差異に対して，追加的な調査を行わなくても監査上許容できる差異の金額を決定しなければならないが，評価した重要な虚偽表示リスクが高く，より確かな心証が得られる証拠を入手する必要がある場合，当該許容可能な差異の金額は小さくなる。", "a": true, "c": "H29Ⅰ⑭ウ", "e": ""}, {"l": 76, "m": "分析的手続", "sb": "", "i": "A", "r": "", "q": "監査人は，計上された金額と監査人の推定値との差異に対して，追加的な調査を行わなくても監査上許容できる差異の金額を設定することになるが，その金額は，監査人が重要性の基準値よりも低い金額として設定する手続実施上の重要性と一致させる必要がある。", "a": false, "c": "H31Ⅱ⑮イ", "e": "たしかに，追加的な調査を行わなくても監査上許容できる差異の金額の設定において，手続実施上の重要性を参考にすることはあるが，それと一致させることは求められておらず，例えば，手続実施上の重要性よりも小さい金額として設定することもある。"}, {"l": 77, "m": "分析的手続", "sb": "", "i": "A", "r": "", "q": "監査人は，監査の最終段階において，重要な虚偽表示がないと判断した場合には，企業に関する監査人の理解と財務諸表が整合していることについて，全般的な結論を形成するための分析的手続を実施しなくてもよい。", "a": false, "c": "H24Ⅱ⑬イ", "e": "監査の最終段階における分析的手続の実施は必須である。"}, {"l": 78, "m": "分析的手続", "sb": "", "i": "A", "r": "", "q": "監査の最終段階で実施される分析的手続の目的は，財務諸表の個別の構成単位又は構成要素についての重要な虚偽の表示がないかどうかに関する結論を形成すること，及び意見表明の基礎となる結論を導くことである。", "a": false, "c": "H27Ⅱ⑫イ", "e": "正確な理解が必要となる肢。本肢にある，「財務諸表の個別の構成単位又は構成要素についての重要な虚偽の表示がないかどうかに関する結論を形成すること」は，分析的実証手続の目的を示している。一方，監査の最終段階で実施される分析的手続の目的は，財務諸表の個別の構成単位又は要素について「監査中に形成された結論を裏付ける」こと，及び意見表明の基礎となる結論を導くことにある。"}, {"l": 79, "m": "分析的手続", "sb": "", "i": "A", "r": "", "q": "監査人は，分析的実証手続の実施により，監査人の推定値と大きく乖離する変動が識別された場合は，乖離の理由を調査しなければならないが，当該調査は，差異の内容に関する定性的な回答を経営者への質問を通じて入手することだけでは不十分である。", "a": true, "c": "H31Ⅱ⑮ウ", "e": "なお，本肢の場合は，差異の内容に関する定性的な質問の回答を経営者から入手するだけでなく，当該回答に関する適切な監査証拠（回答を裏付けるための監査証拠）を入手する必要がある。"}, {"l": 80, "m": "分析的手続", "sb": "", "i": "A", "r": "", "q": "監査人は，分析的実証手続における推定値と実際に計上された金額との差異について，追加的な調査を実施しても許容可能金額の範囲内に収まらない場合であっても，当該差異について経営者から説明を受けたときには，他の監査手続を実施しなくてもよい。", "a": false, "c": "H24Ⅱ⑬エ", "e": "本肢の場合，経営者からの説明に加えて，経営者の説明（回答）に関する適切な監査証拠を入手する必要がある。また，状況に応じて他の監査手続の実施が必要となることもある。そのため，経営者の説明があれば他の監査手続が不要であるとしている本肢は誤りとなる。"}, {"l": 81, "m": "分析的手続", "sb": "", "i": "A", "r": "", "q": "監査人は，分析的実証手続の結果，推定値と大きく乖離する変動を識別した場合，経営者に質問し，経営者の回答に関する適切な監査証拠を入手するとともに，推定値を見直さなければならない。", "a": false, "c": "H29Ⅰ⑭エ", "e": "推定値と大きく乖離した変動は，監査人の推定値が適切でないことにより生じる場合ももあれば，財務諸表上の計上額が適切でないことにより生じる場合もある。そのため，推定値と大きく乖離する変動を識別したとしても，必ずしも推定値の見直しが必要となるわけではない。"}, {"l": 82, "m": "内部統制", "sb": "", "i": "B", "r": "", "q": "小規模企業は，大規模企業に比べて，従業員が少人数のため適切な職務の分離が有効に実施できない場合があり，その内部統制は非公式な方法やより簡素な仕組み及び手続となることが多い。なお，小規模企業であっても，その限界を補完するような内部統制の整備及び運用が行われる場合がある。", "a": true, "c": "H29Ⅰ⑮イ", "e": ""}, {"l": 83, "m": "内部統制", "sb": "", "i": "A", "r": "", "q": "監査に関連する内部統制のほとんどは財務報告に係る内部統制であるため，重要な虚偽表示リスクを評価するに当たっては，監査人は財務報告に係る内部統制の全てを監査に関連する内部統制として理解しなければならない。", "a": false, "c": "H28Ⅱ⑭エ／H25Ⅰ⑬ウ", "e": "監査に関連する内部統制は，財務報告に係る内部統制のうち，財務諸表に関わる内部統制である。"}, {"l": 84, "m": "内部統制", "sb": "", "i": "A", "r": "", "q": "監査人は，監査に関連する内部統制を理解する必要があり，その際，内部統制のデザインと，それが業務に適用されているかどうかについて評価することを求められるが，デザインが有効でないと評価した内部統制については業務への適用まで評価する必要はない。", "a": true, "c": "R２Ⅱ⑭ア／H27Ⅰ⑪エ", "e": ""}, {"l": 85, "m": "内部統制", "sb": "", "i": "A", "r": "", "q": "監査人は，アサーション・レベルの重要な虚偽表示リスクに対応して識別された内部統制については，内部統制のデザインを最初に検討する。なぜなら，デザインが有効でない内部統制について，業務への適用を評価することは，監査上意義がないからである。", "a": true, "c": "R７Ⅰ⑮エ／H24Ⅱ⑪エ", "e": ""}, {"l": 86, "m": "内部統制", "sb": "", "i": "A", "r": "", "q": "監査人は，監査に関連する内部統制を理解する際に，内部統制のデザインを評価し，これらが業務に適用されているかどうかを確かめるため，運用評価手続を実施しなければならない。", "a": false, "c": "H26Ⅰ⑪ア", "e": "運用評価手続は，内部統制のデザインの評価や業務への適用の評価のために実施する手続ではなく，監査対象期間を通じて内部統制が有効に運用されているかどうかを評価するための手続である。"}, {"l": 87, "m": "内部統制", "sb": "", "i": "A", "r": "", "q": "監査人が監査の過程で識別する内部統制の不備は，内部統制の整備及び運用が不適切であり，財務諸表の虚偽表示が適時に防止又は発見・是正できない場合のことであり，財務諸表の虚偽表示が適時に防止又は発見・是正するのに必要な内部統制が存在しない場合は該当しない。", "a": false, "c": "H29Ⅰ⑮ウ", "e": "財務諸表の虚偽表示が適時に防止又は発見・是正するのに必要な内部統制が存在しないことは，内部統制の整備上の不備に該当する。"}, {"l": 88, "m": "リスク・アプローチ監査－総論", "sb": "", "i": "A", "r": "", "q": "監査リスクとは，財務諸表に生じた重要な虚偽表示を，監査人が監査手続を実施しても看過してしまうリスクをいう。監査人は，このリスクを合理的に低い水準に抑えることが求められている。", "a": false, "c": "R５Ⅱ⑮ア", "e": "引っかかりやすい肢。本肢が示すリスクは，ＡＲではなくＤＲである。また，当然，ＤＲを合理的に低い水準に抑えることは求められていない。"}, {"l": 89, "m": "リスク・アプローチ監査－総論", "sb": "", "i": "A", "r": "", "q": "監査リスクの考え方は，当初，監査上の危険性という用語をもって監査基準に取り入れられたが，その後の改訂により，監査リスクという用語に改められ，さらに監査リスクに対応するためのアプローチが重視されて現在に至っている。", "a": true, "c": "H24Ⅰ⑨ア", "e": ""}, {"l": 90, "m": "リスク・アプローチ監査－総論", "sb": "", "i": "A", "r": "", "q": "監査リスクは，いわゆる監査の失敗を惹起する可能性であるため，財務諸表に重要な虚偽の表示があるにもかかわらず，それがないという誤った意見形成をする可能性，及び財務諸表に重要な虚偽の表示がないにもかかわらず，それがあるという誤った意見形成をする可能性の両方を含む。", "a": false, "c": "R３②エ／H30Ⅰ①ア／H25Ⅰ⑫ア", "e": "財務諸表に重要な虚偽表示がない場合において，監査人が重要な虚偽表示があるという意見を誤って表明するリスクは，ＡＲに含まれない。"}, {"l": 91, "m": "リスク・アプローチ監査－総論", "sb": "", "i": "A", "r": "", "q": "監査リスクは，監査人が財務諸表の重要な虚偽表示を看過して誤った意見を形成する可能性をいい，さらに，財務諸表監査に関連して発生するおそれのある監査人の事業上のリスクも含まれる。", "a": false, "c": "R５Ⅰ⑭ア／H27Ⅱ⑬ア", "e": "財務諸表監査に関連して発生する訴訟，風評等から発生する損失のような監査人の事業上のリスク（＝ビジネスリスク）は，ＡＲに含まれない。"}, {"l": 92, "m": "リスク・アプローチ監査－総論", "sb": "", "i": "A", "r": "", "q": "固有リスクは，取引種類，勘定残高及び注記事項に係るアサーションに重要な虚偽の表示が行われる可能性であり，被監査会社に固有に存在するリスクであることから，監査人は，金利や為替相場などの経済状況を検討することはない。", "a": false, "c": "R４Ⅰ⑮イ／H27Ⅱ⑬イ", "e": "ＩＲは，金利，為替相場，エネルギー価格の変動等の一般的な経済環境にも影響を受けるリスクである。そのため，監査人は，ＩＲの識別と評価においてこれらを検討する。"}, {"l": 93, "m": "リスク・アプローチ監査－総論", "sb": "", "i": "A", "r": "", "q": "固有リスクとは，特定の取引及び財務諸表項目に固有の性質によって財務諸表に重要な虚偽表示が生じる可能性のことであり，産業構造の変化のような外部環境も固有リスクに影響を与える。", "a": true, "c": "H24Ⅰ⑪イ", "e": ""}, {"l": 94, "m": "リスク・アプローチ監査－総論", "sb": "", "i": "A", "r": "", "q": "統制リスクは，企業の内部統制によって重要な虚偽の表示が防止又は発見・是正されない可能性のことであるが，内部統制が良好に整備・運用されている場合であっても，統制リスクはゼロにはならない。", "a": true, "c": "R４Ⅰ⑮ウ／H24Ⅰ⑪ウ", "e": ""}, {"l": 95, "m": "リスク・アプローチ監査－総論", "sb": "", "i": "A", "r": "", "q": "発見リスクの水準は，実施する監査手続に関係する。このため，監査人は，より証明力の強い監査証拠が得られるような監査手続を選択すること，監査手続の実施時期を期末日近くに設定すること，監査範囲を拡大することによって，発見リスクを低くすることができる。", "a": true, "c": "R４Ⅰ⑮エ", "e": ""}, {"l": 96, "m": "リスク・アプローチ監査－総論", "sb": "", "i": "A", "r": "", "q": "重要な虚偽表示のリスクの程度が高い項目については，実証手続の実施によって証明力がより強く適合性がより高い監査証拠を入手するとともに，詳細に監査調書の査閲等を行う必要がある。", "a": true, "c": "H24Ⅰ⑬ウ", "e": ""}, {"l": 97, "m": "リスク・アプローチ監査－総論", "sb": "", "i": "A", "r": "", "q": "監査リスクとは，監査人が財務諸表の重要な虚偽表示を看過したために誤った監査意見を形成する可能性のことであり，十分かつ適切な監査証拠を入手するよう監査手続を立案することにより，結果として監査リスクを合理的に低い水準に抑えることが可能となる。", "a": true, "c": "H24Ⅰ⑪ア", "e": ""}, {"l": 98, "m": "リスク・アプローチ監査－総論", "sb": "", "i": "A", "r": "", "q": "監査人は，監査意見の表明に当たっては，重要な虚偽表示リスクを合理的に低い水準に抑えた上で，自己の意見を形成するに足る基礎を得なければならない。", "a": true, "c": "H30Ⅱ⑮イ／H25Ⅰ⑪イ", "e": "×うっかりとしてしまいそうな記述。合理的な低い水準に抑えるべきリスクは，ＲＭＭではなくＡＲである。"}, {"l": 99, "m": "リスク・アプローチ監査－総論", "sb": "", "i": "A", "r": "", "q": "統制リスクは，被監査会社の内部統制が重要な虚偽の表示を防止又は適時に発見・是正することに対してどのように整備されているか，またどの程度有効に運用されているかについて監査人が評価する被監査会社側のリスクであり，財務諸表監査とは独立して存在している。", "a": true, "c": "H27Ⅱ⑬ウ", "e": "なお，ＩＲも被監査会社側のリスクであり，財務諸表監査とは独立して存在するものである。"}, {"l": 100, "m": "リスク・アプローチ監査－総論", "sb": "", "i": "A", "r": "", "q": "監査人は，識別したアサーション・レベルの重要な虚偽表示リスクについて，虚偽表示の発生可能性と影響の度合いを評価することにより，発見リスクを評価しなければならない。", "a": false, "c": "R６Ⅱ⑭ア", "e": "ＤＲは，「評価したＲＭＭ」を踏まえて「設定」するものである。なお，虚偽表示の発生可能性と影響の度合いにより評価するのはＩＲである。"}, {"l": 101, "m": "リスク・アプローチ監査－総論", "sb": "", "i": "A", "r": "", "q": "発見リスクは，合理的に低い水準に設定された監査リスクを，監査人が評価した重要な虚偽表示のリスクで除することによって自ずと設定されるものであって，監査人は，達成しなければならない発見リスクの程度を直接的に操作することはできない。", "a": true, "c": "H27Ⅱ⑬エ", "e": "「達成しなければならない発見リスク」という部分がポイント。たしかに，ＤＲそのものは，どのような実証手続を実施するかで変化するものであるが，ＡＲを合理的に低い水準に抑えるために達成しなければならない「目標としてのＤＲ」の水準は，監査人が自由に操作できるものではない。"}, {"l": 102, "m": "リスク・アプローチ監査－総論", "sb": "", "i": "A", "r": "", "q": "発見リスクとは，監査を実施しても監査人が重要な虚偽表示を発見できない可能性のことであり，財務諸表全体レベル及び財務諸表項目レベルでその水準が設定される。", "a": false, "c": "H24Ⅰ⑪エ", "e": "ＤＲは，実証手続の実施水準を決定づけるものである。この点，実証手続は，財務諸表項目レベル（アサーション・レベル）のＲＭＭに対応するために実施するものであることを考えると，ＤＲが，財務諸表項目レベルで設定されるものであることが分かる。"}, {"l": 103, "m": "リスク・アプローチ監査－総論", "sb": "", "i": "A", "r": "", "q": "監査人は，固有リスクに影響を与える企業及び企業環境の変化により，重要な虚偽表示リスクの程度が暫定的な評価よりも高いと判断した場合には，発見リスクを暫定的な評価よりも低くするために，実証手続の強化等の監査計画の修正を行う必要がある。", "a": true, "c": "R７Ⅰ⑭イ", "e": ""}, {"l": 104, "m": "リスク・アプローチ監査－総論", "sb": "", "i": "A", "r": "", "q": "リスク対応手続の実施の基準日として，期末日前と期末日の二つがあるが，重要な虚偽表示リスクの程度が高いほど，監査に要する時間を確保するために，監査人は，可能な限り実証手続を期末日前に実施すべきである。", "a": false, "c": "H30Ⅰ⑭ア", "e": "ＲＭＭが高いほど，リスク対応手続（実証手続）を期末日により近い時期又は期末日を基準日として実施すべきである。"}, {"l": 105, "m": "リスク・アプローチ監査－総論", "sb": "", "i": "A", "r": "", "q": "監査人は，財務諸表の重要な虚偽表示を看過して誤った意見を形成する可能性を許容可能な低い水準に抑えなければならないため，発見リスクの水準を低くすることが求められている。", "a": false, "c": "R５Ⅰ⑭イ", "e": "ＡＲを許容可能な低い水準に抑えなければならない点は正しいが，ＤＲはＲＭＭの程度に応じて低くすることもあれば高くすることもあるため，本肢は誤りである。"}, {"l": 106, "m": "重要な虚偽表示リスクの識別と評価", "sb": "", "i": "B", "r": "", "q": "監査人は，リスク評価手続において，経営者への質問，分析的手続，記録や文書の閲覧など，必要であると判断した手続を実施すれば，リスク評価手続のみで監査意見の基礎となる十分かつ適切な監査証拠を入手することができる場合がある。", "a": false, "c": "H31Ⅱ⑭ア", "e": "監査人は，リスク評価手続を実施するのみでは，監査意見の基礎となる十分かつ適切な監査証拠を入手することはできない。"}, {"l": 107, "m": "重要な虚偽表示リスクの識別と評価", "sb": "", "i": "A", "r": "", "q": "監査人は，リスク評価手続の実施に当たっては，経営者等への質問，観察及び記録文書の閲覧に加えて，分析的手続を実施してもよい。", "a": false, "c": "H24Ⅱ⑬オ", "e": "リスク評価手続における分析的手続の実施は必須である。"}, {"l": 108, "m": "重要な虚偽表示リスクの識別と評価", "sb": "", "i": "A", "r": "", "q": "監査人は，リスク評価手続において，質問及び分析的手続を必ず実施しなければならないが，重要な虚偽表示リスクが高いと見込まれる場合には，追加的に記録や文書の閲覧も実施しなければならない。", "a": false, "c": "H31Ⅰ⑮ウ／H25Ⅱ⑭ア", "e": "リスク評価手続においては，必ず，質問，分析的手続，観察及び記録や文書の閲覧を実施しなければならない。"}, {"l": 109, "m": "重要な虚偽表示リスクの識別と評価", "sb": "", "i": "A", "r": "", "q": "監査人は，経営者に対して質問を実施するだけではなく，不正又は誤謬による重要な虚偽表示リスクを識別するための有用な情報を持っていると判断した従業員に対しても質問を実施しなければならない。", "a": true, "c": "H27Ⅰ⑪イ／H26Ⅰ⑪イ", "e": ""}, {"l": 110, "m": "重要な虚偽表示リスクの識別と評価", "sb": "", "i": "A", "r": "", "q": "監査人は，監査チームの全メンバーが虚偽表示に係る知識と知見を共有することを目的として，複数の事業所を複数の監査チームで監査する場合においても，全メンバーによる討議を実施しなければならない。", "a": false, "c": "H26Ⅰ⑪ウ", "e": "討議には，監査責任者と監査チームの主要メンバーが参加すればよく，全メンバーの参加は必ずしも必要ではない。"}, {"l": 111, "m": "重要な虚偽表示リスクの識別と評価", "sb": "", "i": "A", "r": "", "q": "監査責任者と監査チームの主要メンバーは，財務諸表の重要な虚偽表示の生じやすさについて討議しなければならない。", "a": true, "c": "R６Ⅱ⑭ウ", "e": ""}, {"l": 112, "m": "重要な虚偽表示リスクの識別と評価", "sb": "", "i": "A", "r": "", "q": "財務諸表監査においては，監査責任者と監査チームの主要メンバーは，財務諸表に重要な虚偽表示が行われる可能性，並びに企業グループの実態及びその環境に基づき適用される財務報告の枠組みについて討議しなければならないが，監査チームの主要メンバー以外のメンバーには必ずしも当該討議の結論のすべてを伝達する必要はない。", "a": true, "c": "H27Ⅰ⑪ア", "e": ""}, {"l": 113, "m": "重要な虚偽表示リスクの識別と評価", "sb": "", "i": "A", "r": "", "q": "監査計画の策定に当たっては，企業及び企業環境に内在する事業上のリスク等がもたらす財務諸表における重要な虚偽表示のリスクを暫定的に評価しなければならない。この事業上のリスク等の考慮は，経営者の関与による，財務諸表の重要な虚偽の表示に対処する必要性から求められたものである。", "a": true, "c": "R２Ⅰ⑭ア", "e": ""}, {"l": 114, "m": "重要な虚偽表示リスクの識別と評価", "sb": "", "i": "A", "r": "", "q": "事業上のリスク等を重視したリスク・アプローチでは，リスク評価の対象を従来よりも拡大し，重要な虚偽表示のリスクにつながる要因を見逃さないために，監査人はあらゆる事業上のリスクを識別し，評価することが求められる。", "a": false, "c": "R６Ⅱ②イ／R３⑭ウ", "e": "全ての事業上のリスクが必ずしもＲＭＭとなるわけではないため，監査人は，あらゆる（全ての）事業上のリスクを識別・評価（＝考慮）する必要はない。なお，事業上のリスクを識別・評価する目的については正しい。"}, {"l": 115, "m": "重要な虚偽表示リスクの識別と評価", "sb": "", "i": "A", "r": "", "q": "監査人が企業のリスク評価プロセスを評価することは，企業が発生可能性のあるリスクをどの領域で識別し，当該リスクにどのように対処したかを理解するのに役立つことから，監査人は，企業の全ての事業上のリスクを対象として評価しなければならない。", "a": false, "c": "R５Ⅰ⑮イ／H30Ⅰ⑪ウ", "e": "同上"}, {"l": 116, "m": "重要な虚偽表示リスクの識別と評価", "sb": "", "i": "A", "r": "", "q": "事業上のリスクは，企業の事業活動に関わるリスクであるという性質上，アサーション・レベルの重要な虚偽表示リスクには影響を与えるが，財務諸表全体レベルの重要な虚偽表示リスクには影響を与えることはない。", "a": false, "c": "R３⑭エ／H25Ⅰ⑫エ", "e": "事業上のリスクには，アサーション・レベルのＲＭＭにつながるものもあれば，財務諸表全体レベルのＲＭＭにつながるものもある"}, {"l": 117, "m": "重要な虚偽表示リスクの識別と評価", "sb": "", "i": "A", "r": "", "q": "事業上のリスクが財務諸表に影響を与えるときには，それが重要な虚偽表示のリスクに該当するか否かにかかわらず，補助者の増員や専門家の配置などの全般的な対応を考慮しなければならない。", "a": false, "c": "H24Ⅰ⑬ア", "e": "全般的な対応は，財務諸表全体レベルのＲＭＭが識別された場合に実施する。"}, {"l": 118, "m": "重要な虚偽表示リスクの識別と評価", "sb": "", "i": "A", "r": "", "q": "監査人は，重要な虚偽表示リスクを識別し評価する際，監査に関連する内部統制システムを理解しなければならない。このリスク評価の実施に際して，監査人は，状況に応じたリスク対応手続を立案するため内部統制システムを検討するが，これは，内部統制の有効性に対する意見を表明するためのものではない。", "a": true, "c": "R７Ⅰ⑬ア", "e": ""}, {"l": 119, "m": "重要な虚偽表示リスクの識別と評価", "sb": "", "i": "A", "r": "", "q": "統制環境は，内部統制システムの他の構成要素の基礎となっていることから，監査人がその理解及び評価を行うことは，財務諸表全体レベルの重要な虚偽表示リスクの識別及び評価に影響を与える。", "a": true, "c": "R５Ⅰ⑮ア", "e": ""}, {"l": 120, "m": "重要な虚偽表示リスクの識別と評価", "sb": "", "i": "A", "r": "", "q": "監査人は，経営者が識別していない重要な虚偽表示リスクが，企業のリスク評価プロセスにおいて本来識別されなければならないリスクであると判断した場合には，当該リスク評価プロセスを内部統制の重要な不備として必ず扱わなければならない。", "a": false, "c": "R７Ⅰ⑭ア／H28Ⅱ⑭イ", "e": "本肢の場合，監査人は，なぜ企業のリスク評価プロセスが当該リスクを識別できなかったのかを理解しなければならないが，当該状況を内部統制の重要な不備として識別するとは要求されていない（重要な不備として扱うかどうかは監査人の判断による）。"}, {"l": 121, "m": "重要な虚偽表示リスクの識別と評価", "sb": "", "i": "A", "r": "", "q": "監査人は，財務報告に関連する情報システムについて理解しなければならないが，これには，取引以外で，財務諸表に重要な影響を及ぼす事象の発生や状況を情報システムにより把握する方法も含まれる。", "a": true, "c": "H31Ⅱ⑭イ", "e": ""}, {"l": 122, "m": "重要な虚偽表示リスクの識別と評価", "sb": "", "i": "A", "r": "", "q": "監査人は，統制活動の理解の際，非経常的な取引や通例でない取引の仕訳，又は修正仕訳といった非定型的な仕訳を含む，仕訳入力に関する内部統制について，そのデザインを評価するとともに業務に適用されているかどうかについて判断しなければならない。", "a": true, "c": "R５Ⅰ⑮ウ", "e": ""}, {"l": 123, "m": "重要な虚偽表示リスクの識別と評価", "sb": "", "i": "A", "r": "", "q": "監査人は，複数の内部統制が特別な検討を必要とするリスクに対応する一つの統制目的に関連する場合，それらの内部統制の全てを識別及び評価しなければならない。", "a": false, "c": "R７Ⅰ⑮イ", "e": "監査人は，ＳＲや仕訳入力に関連する内部統制を識別する際，複数の内部統制が同一の目的を達成する場合には，その目的に関連する全ての内部統制を識別する必要はない。"}, {"l": 124, "m": "重要な虚偽表示リスクの識別と評価", "sb": "", "i": "A", "r": "", "q": "監査人は統制活動において識別した個々の内部統制の運用状況の有効性の評価を計画していない場合，特定のリスクに対する経営者の対処方針の理解を，関連する重要な虚偽表示リスクに対応する実証手続の種類，時期及び範囲の立案のために利用することはない。", "a": false, "c": "R５Ⅰ⑮エ", "e": "識別した内部統制の運用状況の有効性の評価を計画していない場合であっても，特定のリスクに対する経営者の対処方針を理解することは，関連するＲＭＭに対応する実証手続の種類，時期及び範囲の立案に役立つため，本肢は誤りである。"}, {"l": 125, "m": "重要な虚偽表示リスクの識別と評価", "sb": "", "i": "A", "r": "", "q": "重要な虚偽表示のリスクとは，財務諸表利用者を誤導する虚偽表示が財務諸表に含まれる可能性のことであり，財務諸表項目に係る特定の監査要点ごとに識別されるものである。", "a": false, "c": "H24Ⅰ⑪オ", "e": "ＲＭＭには，本肢のようなアサーション・レベルのＲＭＭだけでなく，特定の監査要点ごとに識別されない財務諸表全体レベルのＲＭＭもある。"}, {"l": 126, "m": "重要な虚偽表示リスクの識別と評価", "sb": "", "i": "A", "r": "", "q": "特定のアサーションが，関連するアサーション（重要な虚偽表示リスクが識別されたアサーション）かどうかを判断するに当たっては，監査人は，当該アサーションについて固有リスクと統制リスクの両者を評価しなければならない。", "a": false, "c": "R５Ⅱ⑮ウ", "e": "関連するアサーションの決定は，関連する内部統制を考慮する前に（ＩＲのみを考慮して）行う。"}, {"l": 127, "m": "重要な虚偽表示リスクの識別と評価", "sb": "", "i": "A", "r": "", "q": "財務諸表全体レベルの重要な虚偽表示リスクは，様々なアサーションに影響を及ぼす可能性があるリスクであり，監査人は，このリスクを評価するに当たり，当該影響を受ける可能性のあるアサーションを特定しなければならない。", "a": false, "c": "R３⑭ア", "e": "財務諸表全体レベルのＲＭＭは，虚偽表示が生じる可能性のあるアサーションを特定できないリスクである。"}, {"l": 128, "m": "重要な虚偽表示リスクの識別と評価", "sb": "", "i": "A", "r": "", "q": "監査人による財務諸表全体レベルでの重要な虚偽表示リスクの評価には，固有リスク及び統制リスクの評価は含まれない。", "a": true, "c": "R３⑭イ", "e": "読み取りが難しい肢。本肢にある「ＩＲ及びＣＲの評価は含まれない」という点は，財務諸表全体レベルのＲＭＭの評価が，ＩＲとＣＲに区別せず，結合したＲＭＭとして行われる点を表現している。"}, {"l": 129, "m": "重要な虚偽表示リスクの識別と評価", "sb": "", "i": "A", "r": "", "q": "固有リスクの評価においては，虚偽の表示が生じる可能性と虚偽の表示が生じた場合の影響を組み合わせて評価しなければならないが，この影響とは，金額的な影響であり，質的な影響は含まれない。", "a": false, "c": "R４Ⅰ⑮ア", "e": "ＩＲを評価する際に考慮する「虚偽表示が生じた場合の影響」には，金額的影響のみならず質的影響も含まれる。"}, {"l": 130, "m": "重要な虚偽表示リスクの識別と評価", "sb": "", "i": "A", "r": "", "q": "監査人は，虚偽表示の発生可能性と影響の度合いを考慮して，固有リスクが最も高い領域に存在すると評価した場合，そのリスクを特別な検討を必要とするリスクとしなければならない。なお，ここでいう虚偽表示の影響には，金額的な影響だけでなく質的な影響も含まれる。", "a": true, "c": "R５Ⅱ⑮イ", "e": ""}, {"l": 131, "m": "重要な虚偽表示リスクの識別と評価", "sb": "", "i": "A", "r": "", "q": "特別な検討を必要とするリスクは，アサーション・レベルにおいて虚偽表示が生じる可能性と当該虚偽表示が生じた場合の影響の双方を考慮して，監査人の判断により固有リスクの重要度が最も高い領域に存在すると評価されたリスクであり，その重要度は相対的なものである。", "a": true, "c": "R５Ⅰ⑭エ", "e": "なお，本肢では，監基報の要求事項に従ってＳＲとして決定するリスクについて考慮する必要はなかった（他の肢とのバランスで判断）。"}, {"l": 132, "m": "重要な虚偽表示リスクの識別と評価", "sb": "", "i": "A", "r": "", "q": "監査人が識別した重要な虚偽表示リスクが特別な検討を必要とするリスクにあたるかどうかを決定することは，財務諸表全体レベルとアサーション・レベルの二つのレベルで重要な虚偽表示リスクを識別し評価する過程で行われる。", "a": false, "c": "H25Ⅰ⑫ウ", "e": "ＳＲの決定は，アサーション・レベルのＲＭＭを評価する過程で行われる。"}, {"l": 133, "m": "重要な虚偽表示リスクの識別と評価", "sb": "", "i": "A", "r": "", "q": "監査人は，識別した重要な虚偽表示リスクが特別な検討を必要とするリスクであるかどうかを決定する際，関連する統制活動を含む内部統制の影響を考慮しなければならない。", "a": false, "c": "H31Ⅰ⑮イ／H30Ⅱ⑬ア／H28Ⅱ⑭ア／H25Ⅱ⑭イ／H24Ⅱ⑪イ", "e": "ＳＲの決定は，ＩＲの評価を踏まえて行う。したがって，関連する内部統制の影響を考慮してはならない。"}, {"l": 134, "m": "重要な虚偽表示リスクの識別と評価", "sb": "", "i": "A", "r": "", "q": "監査人は，評価した財務諸表全体レベルの重要な虚偽表示リスクが，アサーション・レベルの重要な虚偽表示リスクの評価にどのように影響するかを考慮するが，アサーション・レベルの重要な虚偽表示リスクの評価の結果により，財務諸表全体レベルの重要な虚偽表示リスクを新たに識別することもある。", "a": true, "c": "R５Ⅰ⑭ウ", "e": ""}, {"l": 135, "m": "評価した重要な虚偽表示リスクへの対応", "sb": "", "i": "B", "r": "", "q": "監査人は，財務諸表全体レベルにおいて，重要な虚偽表示のリスクがあると判断した場合には，監査時間の増加や補助者の増員といった全般的な対応を計画し，また財務諸表項目レベルに関連した重要な虚偽表示のリスクに関しては，これに対応した，内部統制の運用評価手続と監査要点の直接的な立証を行う実証手続を計画する。", "a": true, "c": "R２Ⅰ⑭エ", "e": ""}, {"l": 136, "m": "評価した重要な虚偽表示リスクへの対応", "sb": "", "i": "B", "r": "", "q": "リスク対応手続は，識別し評価したアサーション・レベルの重要な虚偽表示リスクに対応して，立案し実施されるものであるが，評価した財務諸表全体レベルの重要な虚偽表示リスクが，リスク対応手続の種類，時期及び範囲に影響を及ぼすことがある。", "a": true, "c": "R６Ⅰ⑮ア", "e": ""}, {"l": 137, "m": "評価した重要な虚偽表示リスクへの対応", "sb": "", "i": "A", "r": "", "q": "適切な財務報告に対する経営者の姿勢に重大な問題があるなど，広く財務諸表全体に関連する重要な虚偽表示リスクがある場合の監査人の対応には，例えば，監査チームメンバーへの指導監督の強化，より確かな心証が得られる監査証拠を入手するための監査手続の変更が含まれる。", "a": true, "c": "H31Ⅰ⑯ア", "e": ""}, {"l": 138, "m": "評価した重要な虚偽表示リスクへの対応", "sb": "", "i": "A", "r": "", "q": "監査手続を実施する基準日は，統制環境が有効である場合，期末日前とすることができるが，統制環境に不備がある場合，基準日を期末日前ではなく期末日として，監査人はより多くの監査手続を実施することがある。", "a": true, "c": "H30Ⅰ⑭イ／H25Ⅰ⑬ア", "e": ""}, {"l": 139, "m": "評価した重要な虚偽表示リスクへの対応", "sb": "", "i": "A", "r": "", "q": "監査人は，評価したアサーション・レベルの重要な虚偽表示リスクに応じて，実施する監査手続の種類，時期及び範囲を立案し実施しなければならないが，評価したリスクへの対応という点では，監査手続の種類が最も重要である。", "a": true, "c": "R５Ⅱ⑯ア", "e": ""}, {"l": 140, "m": "評価した重要な虚偽表示リスクへの対応", "sb": "", "i": "A", "r": "", "q": "監査人は，特定のアサーションに対して，運用評価手続を実施することなく実証手続のみを実施する監査アプローチを選択することはあるが，実証手続を実施することなく運用評価手続のみを実施する監査アプローチを選択することは認められない。", "a": false, "c": "R６Ⅰ⑮イ", "e": "例えば，重要な取引種類，勘定残高及び注記事項のアサーションのうち，ＲＭＭを識別しなかったアサーションや，重要性のある取引種類，勘定残高及び注記事項のアサーションのうち，実証手続を実施しないと決定したアサーションについて，運用評価手続のみを実施する監査アプローチを選択することがある。"}, {"l": 141, "m": "評価した重要な虚偽表示リスクへの対応", "sb": "", "i": "A", "r": "", "q": "監査人は，特定のアサーションに対して，運用評価手続を実施するだけで，評価した重要な虚偽表示リスクに有効に対応することができると判断した場合，評価した重要な虚偽表示リスクの程度によっては，重要な取引種類，勘定残高，注記事項について，実証手続を行わないことも認められる。", "a": false, "c": "H31Ⅱ⑭エ／H29Ⅱ⑭ウ／H24Ⅱ⑪ア", "e": "重要な取引種類，勘定残高及び注記事項については，ＲＭＭの程度にかかわらず実証手続が必須である。"}, {"l": 142, "m": "評価した重要な虚偽表示リスクへの対応", "sb": "", "i": "A", "r": "", "q": "監査人は，重要性のある取引種類，勘定残高又は注記事項であっても，重要な虚偽表示リスクを識別しなければ，実証手続を立案し実施することは求められていない。", "a": false, "c": "R５Ⅱ⑯エ", "e": "重要性のある取引種類，勘定残高及び注記事項については，ＲＭＭの有無にかかわらず実証手続が必須となる。"}, {"l": 143, "m": "評価した重要な虚偽表示リスクへの対応", "sb": "", "i": "A", "r": "", "q": "監査人は，重要性のある取引種類，勘定残高又は注記事項については，必ず実証手続を計画しなければならない。これは，監査人のリスク評価が判断に基づくものであり完全ではないことや，経営者が内部統制を無効化するリスク等を考慮したためであって，結果的に重要な虚偽の表示を発見できないリスクを回避するためである。", "a": true, "c": "R２Ⅰ⑮イ／H27Ⅰ⑫ウ", "e": ""}, {"l": 144, "m": "評価した重要な虚偽表示リスクへの対応", "sb": "", "i": "A", "r": "", "q": "監査人は，関連するアサーションを識別していないが重要性のある取引種類，勘定残高又は注記事項に重要な虚偽表示リスクがないとした監査人の評価が引き続き適切であるかどうかを評価するため，実証手続を立案し実施しなければならない。", "a": true, "c": "R６Ⅱ⑭エ", "e": "理由部分が微妙にズレていると言えなくもない肢。重要性のある取引種類，勘定残高及び注記事項について実証手続が必須とされている理由は，１つ上の肢の通りであるが，本肢ではこれを「監査人が行ったリスク評価の適切であるかどうかを評価するため」としている。"}, {"l": 145, "m": "評価した重要な虚偽表示リスクへの対応", "sb": "", "i": "A", "r": "", "q": "監査人は，監査の効率性の観点から，アサーション・レベルの重要な虚偽表示リスクを識別し評価するために実施する監査手続を，運用評価手続や実証手続と同時に実施することがある。", "a": true, "c": "H31Ⅰ⑮エ／H24Ⅱ⑪ウ", "e": ""}, {"l": 146, "m": "評価した重要な虚偽表示リスクへの対応", "sb": "", "i": "A", "r": "", "q": "監査人は，同一の取引に対し，運用評価手続と実証手続を同時に実施することはない。", "a": false, "c": "H23Ⅱ⑬オ", "e": "いわゆる二重目的テストを行う場合があるため，本肢は誤りである。"}, {"l": 147, "m": "評価した重要な虚偽表示リスクへの対応", "sb": "", "i": "A", "r": "", "q": "監査人は，アサーション・レベルの重要な虚偽表示リスクを評価した際に，内部統制が有効に運用されていると想定する場合は，内部統制の運用評価手続を実施しなければならない。", "a": true, "c": "H26Ⅱ⑨ウ", "e": ""}, {"l": 148, "m": "評価した重要な虚偽表示リスクへの対応", "sb": "", "i": "A", "r": "", "q": "監査人は，特定の内部統制について，アサーション・レベルの重要な虚偽表示を防止又は発見・是正するために適切にデザインされていないと判断した場合には，運用評価手続を実施しない。", "a": true, "c": "H25Ⅱ⑭ウ／H25Ⅰ⑬オ", "e": ""}, {"l": 149, "m": "評価した重要な虚偽表示リスクへの対応", "sb": "", "i": "A", "r": "", "q": "監査人は，実証手続のみではアサーション・レベルで十分かつ適切な監査証拠を入手できない場合，内部統制の運用状況の有効性に関して，運用評価手続を立案し実施することが求められている。", "a": true, "c": "R７Ⅰ⑯エ", "e": ""}, {"l": 150, "m": "評価した重要な虚偽表示リスクへの対応", "sb": "", "i": "A", "r": "", "q": "内部統制の運用状況の有効性を評価するに当たって，質問のみでは運用評価手続として十分ではないため，監査人は，質問を通じて入手した監査証拠を，質問以外の監査手続によって裏付けなければならない。", "a": true, "c": "R２Ⅱ⑭イ／H29Ⅱ⑭イ", "e": ""}, {"l": 151, "m": "評価した重要な虚偽表示リスクへの対応", "sb": "", "i": "A", "r": "", "q": "監査人は，内部統制への依拠を予定している場合には，依拠に関する適切な基礎を入手するために，特定の時点で又は依拠する期間に対して，運用評価手続を実施しなければならない。", "a": true, "c": "H30Ⅰ⑭ウ", "e": ""}, {"l": 152, "m": "評価した重要な虚偽表示リスクへの対応", "sb": "", "i": "A", "r": "", "q": "監査人の実証手続によって発見された重要な虚偽表示は，内部統制の重要な不備の存在を示唆する。したがって，実証手続によって虚偽表示が発見されていないことは，検討対象となっているアサーションに関連する内部統制が有効であることの監査証拠となる。", "a": false, "c": "H30Ⅱ⑬ウ／R６Ⅰ⑮ウ／H26Ⅱ⑨ア", "e": "実証手続によって虚偽表示が発見されていないことは，検討対象となっているアサーションに関連する内部統制が有効であることの監査証拠とはならない。なお，前段の記述は正しい。"}, {"l": 153, "m": "評価した重要な虚偽表示リスクへの対応", "sb": "", "i": "A", "r": "", "q": "監査人は，依拠しようとする内部統制からの逸脱を発見した場合，逸脱した原因が担当者の交代による一時的なものであっても，追加的な運用評価手続を実施しなければならない。", "a": false, "c": "H25Ⅰ⑬エ", "e": "依拠しようとする内部統制からの逸脱を発見した場合は，逸脱が生じた原因及びその潜在的な影響を理解するために質問を実施した上で，追加的な運用評価手続が必要かどうか等を判断しなければならない。したがって，本肢のような場合でも，追加的な運用評価手続の実施が必ず必要となるわけではない。"}, {"l": 154, "m": "評価した重要な虚偽表示リスクへの対応", "sb": "", "i": "A", "r": "", "q": "確認は，一般的に証明力の強い監査証拠を監査人に提供し，勘定残高に関連するアサーションに対応する場合に適合することが多い監査手続であるため，被監査会社の財務諸表において売掛金残高が重要である場合には，監査人は実証手続として確認手続を実施しなければならない。", "a": false, "c": "R２Ⅱ⑭エ", "e": "確認の性質に関する前段の記述と，後段のうち売掛金残高が重要である場合に実証手続が必須となる旨の記述は正しい。しかし，実証手続として確認手続を選択するかどうかは監査人の判断によるため，本肢は誤りとなる。"}, {"l": 155, "m": "評価した重要な虚偽表示リスクへの対応", "sb": "", "i": "A", "r": "", "q": "監査人は，分析的実証手続を実施するだけで監査リスクを許容可能な低い水準に抑えることができると判断した場合においても，詳細テストを実施することが求められている。", "a": false, "c": "R７Ⅰ⑯ウ", "e": "監査人は，評価したＲＭＭが低い場合等，分析的実証手続を実施するだけでＡＲを許容可能な低い水準に抑えることができると判断することがあり，このような場合，詳細テストを実施する必要はない。※本肢において，ＳＲに対して実証手続のみを実施するケースを考慮してはいけない。"}, {"l": 156, "m": "評価した重要な虚偽表示リスクへの対応", "sb": "", "i": "A", "r": "", "q": "監査人は，実証手続を立案し実施することが要求される場合には，評価した重要な虚偽表示リスクの程度にかかわらず，分析的実証手続だけでなく詳細テストによる検討も実施しなければならない。", "a": false, "c": "H31Ⅱ⑮エ", "e": "同上"}, {"l": 157, "m": "評価した重要な虚偽表示リスクへの対応", "sb": "", "i": "A", "r": "", "q": "監査人が，期末日前を基準日として実証手続を実施する場合には，期末日前を基準日として実施した実証手続の結果を期末日まで更新して利用するための合理的な根拠とするため，残余期間について，実証手続と運用評価手続を組み合わせて実施しなければならないが，状況に応じて運用評価手続のみの実施も認められている。", "a": false, "c": "H31Ⅰ⑯イ／H30Ⅰ⑭エ", "e": "実証手続におけるロールフォワード手続において，運用評価手続のみ実施することは認められていない。"}, {"l": 158, "m": "評価した重要な虚偽表示リスクへの対応", "sb": "", "i": "A", "r": "", "q": "（監査手続の実施として適切か？）監査人は，売上高の検証において，期末月の2か月前までの期中取引に関する実証手続を内部統制の運用評価手続の二重目的テストにより実施し，残余期間に関しては，リスク評価のための分析的手続のみを実施した。", "a": false, "c": "R４Ⅰ⑯イ", "e": "同上。リスク評価のための分析的手続をロールフォワード手続とすることはできない。"}, {"l": 159, "m": "評価した重要な虚偽表示リスクへの対応", "sb": "", "i": "A", "r": "", "q": "当期の売上目標は達成しているが来期の売上の減少が予想される場合，関係会社への期末日前後の売上取引について，期末日後の入金に関する記録を閲覧して売上の計上漏れがないことの確認は求められないが，損益計算書計上額からサンプルを抽出して関係会社からの受領証等の監査証拠を入手することは必要とされる。", "a": false, "c": "H24Ⅰ⑬エ", "e": "難易度の高い肢。「当期の売上目標は達成しているが来期の売上の減少が予想される場合」には，当期の売上を翌期に繰延計上する可能性があるため，「売上の期間帰属（過小計上）」に係るＲＭＭを識別することができる。この場合，「損益計算書計上額からサンプルを抽出して関係会社からの受領証等の監査証拠を入手（遡及法）」するのではなく，「期末日後の入金に関する記録を閲覧して売上の計上漏れがないこと」を検証する（前進法）べきである。"}, {"l": 160, "m": "評価した重要な虚偽表示リスクへの対応", "sb": "", "i": "A", "r": "", "q": "監査人は，期中に，重要な虚偽表示リスクを評価するときに予期しなかった虚偽表示を発見した場合には，必ずリスク評価を変更しなければならない。", "a": false, "c": "R６Ⅱ⑭イ", "e": "本肢の場合，リスク評価や実証手続の種類，時期及び範囲を変更する必要があるかどうかを評価するが，その結果，リスク評価を変更するかどうかは状況により異なる。"}, {"l": 161, "m": "評価した重要な虚偽表示リスクへの対応", "sb": "", "i": "A", "r": "", "q": "監査人は，期中に，当初のリスク評価において予期しなかった虚偽表示を発見した場合には，不正による重要な虚偽表示リスクを識別するとともに，当該リスクに応じたリスク対応手続の実施が求められる。", "a": false, "c": "R５Ⅱ⑯ウ", "e": "同上"}, {"l": 162, "m": "評価した重要な虚偽表示リスクへの対応", "sb": "", "i": "B", "r": "", "q": "実証手続の実施によって当初のリスク評価時に想定したよりも大きな金額の誤謬を発見したものの，それが単発的なものであると判断した場合には，改めて運用評価手続を実施することはない。", "a": false, "c": "H24Ⅰ⑬イ", "e": "本肢のように，リスク対応手続によって入手した監査証拠が，アサーション・レベルのＲＭＭに関する評価の基礎となった監査証拠と矛盾するときには，リスク評価を修正するとともに，これに応じてリスク対応手続も修正しなければならない。そのため，「改めて運用評価手続を実施することはない」と断定している本肢は誤りとなる。"}, {"l": 163, "m": "評価した重要な虚偽表示リスクへの対応", "sb": "", "i": "B", "r": "", "q": "監査人は，監査の実施の過程において，広く財務諸表全体に関係した重要な虚偽表示リスクを新たに発見しても，監査時間と監査費用を考慮して，監査計画の修正を検討しない場合がある。", "a": false, "c": "H25Ⅰ⑫イ", "e": "監査の実施の過程において，広く財務諸表全体に関係したＲＭＭを新たに発見した場合は，監査計画を修正（全般的な対応の見直し）する必要がある。また，そもそも，監査時間と監査費用の観点から必要な監査上の対応を省略することは認められない。以上より，本肢は誤りとなる。"}, {"l": 164, "m": "リスク・アプローチに関するその他の論点", "sb": "", "i": "A", "r": "", "q": "監査人は，特別な検討を必要とするリスクがあると判断した場合であっても，当該リスクに対する内部統制に依拠しないときは，当年度の監査において，関連する内部統制の運用状況の有効性を評価する必要はない。", "a": true, "c": "H31Ⅱ⑭ウ／H29Ⅱ⑭エ", "e": ""}, {"l": 165, "m": "リスク・アプローチに関するその他の論点", "sb": "", "i": "A", "r": "", "q": "当年度の監査を実施するにあたって，特別な検討を必要とするリスクに対する内部統制に依拠する場合，監査人は，前年度の当該内部統制に関する運用評価手続の実施結果を評価した上で，当年度においても当該運用評価手続を実施するか否かを検討しなければならない。", "a": false, "c": "H26Ⅱ⑨イ／H24Ⅰ⑭エ", "e": "監査人は，ＳＲに対する内部統制に依拠する場合には，当年度の監査において，当該内部統制の運用評価手続を必ず実施しなければならない。"}, {"l": 166, "m": "リスク・アプローチに関するその他の論点", "sb": "", "i": "A", "r": "", "q": "監査人は，評価したアサーション・レベルの重要な虚偽表示リスクが特別な検討を必要とするリスクであると判断した場合，そのリスクに対しては，個別に対応する実証手続を実施しなければならないが，内部統制に依拠しないのであれば，実証手続に詳細テストを含めなければならない。", "a": true, "c": "R５Ⅱ⑯イ／H27Ⅱ⑭エ／H26Ⅱ⑨エ", "e": "なお，内部統制に依拠する場合は，詳細テストを実施せずに，分析的実証手続のみを実施することも認められる。"}, {"l": 167, "m": "リスク・アプローチに関するその他の論点", "sb": "", "i": "A", "r": "", "q": "監査人は，特別な検討を必要とするリスクに対して実証手続のみを実施する場合，詳細テストと分析的実証手続を組み合わせて実施しなければならない。", "a": false, "c": "R６Ⅰ⑮エ／H31Ⅰ⑯エ／H24Ⅱ⑪オ", "e": "ＳＲに対して実証手続のみを実施する場合，分析的実証手続の実施は必須とされておらず，詳細テストのみの実施も認められる。"}, {"l": 168, "m": "リスク・アプローチに関するその他の論点", "sb": "", "i": "A", "r": "", "q": "監査人は，リスク評価手続を実施した結果，特別な検討を必要とするリスクがないと判断したアサーションについては，詳細テストを実施しない場合がある。", "a": true, "c": "H25Ⅱ⑭エ", "e": ""}, {"l": 169, "m": "リスク・アプローチに関するその他の論点", "sb": "", "i": "A", "r": "", "q": "重要な訴訟事件が発生していたので，これを特別な検討を必要とするリスクと判断し，関連する内部統制について検討したところ，訴訟事件の発生はまれであり，これに対応した内部統制は十分に構築されていなかった。このため，内部統制には依拠せず，担当部署への質問と弁護士への確認，その他必要な実証手続を実施した。", "a": true, "c": "R２Ⅰ⑯イ", "e": ""}, {"l": 170, "m": "リスク・アプローチに関するその他の論点", "sb": "", "i": "A", "r": "", "q": "収益認識には不正リスクがあると推定して，特別な検討を必要とするリスクであると判断した。そこで，内部統制の整備状況を検討したところ，有効であると評価したため，内部統制の運用評価手続と，リスクに個別に対応する実証手続として，通常の売掛金残高に加えて契約条件の詳細についての確認等を実施した。", "a": true, "c": "R２Ⅰ⑯エ", "e": ""}, {"l": 171, "m": "リスク・アプローチに関するその他の論点", "sb": "", "i": "A", "r": "", "q": "経営者に予想利益を達成しなければならないというプレッシャーがかかっており，売上取引が特別な検討を必要とするリスクに該当する場合に実施する詳細テストとして，売上取引に関する契約日や出荷日，返品条件や入金条件等の確認がある。", "a": true, "c": "H24Ⅰ⑭ア", "e": ""}, {"l": 172, "m": "リスク・アプローチに関するその他の論点", "sb": "", "i": "A", "r": "", "q": "監査人は，過年度の監査で実施した監査手続から得られた情報を利用することがある。その場合には，当該情報が当年度においても適合しているかどうかを検討しなければならない。", "a": true, "c": "H31Ⅰ⑮ア", "e": ""}, {"l": 173, "m": "リスク・アプローチに関するその他の論点", "sb": "", "i": "A", "r": "", "q": "監査人は，当年度の重要な虚偽表示リスクを評価するため，過年度に自ら監査手続を実施して入手した情報を利用することがあるが，そうした情報についても，監査証拠としての適合性及び信頼性を評価しなければならない。", "a": true, "c": "R５Ⅱ⑮エ", "e": ""}, {"l": 174, "m": "リスク・アプローチに関するその他の論点", "sb": "", "i": "A", "r": "", "q": "監査人は，過年度における内部統制の評価が良好であって重要な変更がない場合には，企業の担当者及び責任者に質問を行うことだけで，内部統制のデザインを評価し，これが業務に適切に適用されているかどうかを評価することができる。", "a": false, "c": "H25Ⅰ⑬イ", "e": "過年度情報の利用において，情報の適合性に影響を及ぼすことがある変化の有無を判断する際には，質問及びその他の適切な監査手続を実施することがある。したがって，企業の担当者及び責任者に質問を行うことだけで過年度情報を利用できると断定している本肢は誤りとなる。"}, {"l": 175, "m": "リスク・アプローチに関するその他の論点", "sb": "", "i": "A", "r": "", "q": "監査人は，過年度の監査で入手した内部統制の運用状況の有効性に関する監査証拠を利用する場合，当該内部統制の重要な変更が過年度の監査終了後に発生していないことを確かめ，過年度の監査から引き継ぐ監査証拠の適合性を確認できたとしても，毎期の監査において依拠を予定している内部統制の一部については，運用評価手続を実施する必要がある。", "a": true, "c": "R２Ⅱ⑭ウ／H29Ⅱ⑭ア", "e": "例えば，依拠する全ての内部統制の運用評価手続をある年度で実施し，その後２年間運用評価手続を一切実施しないとすることはできない。"}, {"l": 176, "m": "監査の計画及び実施における重要性（監査上の重要性）", "sb": "", "i": "A", "r": "", "q": "監査上の重要性は，監査計画の策定，監査の実施，監査証拠の評価及び監査意見の形成の全ての局面において，監査人に画一的な判断を求めるための規準ではなく，あくまで監査人が職業的専門家としての判断を行う上での規準である。", "a": true, "c": "R２Ⅰ⑮ウ", "e": ""}, {"l": 177, "m": "監査の計画及び実施における重要性（監査上の重要性）", "sb": "", "i": "A", "r": "", "q": "財務諸表監査における監査人の重要性の決定は，職業的専門家としての判断事項であるため，財務諸表の利用者が有する財務情報に対するニーズが勘案されるものではない。", "a": false, "c": "H26Ⅰ⑩ア", "e": "重要性の決定は，財務諸表の一般的な利用者が有する財務情報に対する共通のニーズを勘案して行う。※一般目的の財務諸表の監査を想定"}, {"l": 178, "m": "監査の計画及び実施における重要性（監査上の重要性）", "sb": "", "i": "A", "r": "", "q": "監査人は，監査計画の策定における重要性の判断に際して，財務情報の利用者の様々なニーズを勘案する必要があるため，ごく限られた特定の利用者にしか影響を及ぼさないであろう事項に関する虚偽表示であっても考慮しなければならない。", "a": false, "c": "R７Ⅰ⑭ア", "e": "重要性の判断において勘案するのは，財務諸表の一般的な利用者が有する財務情報に対する共通のニーズである。そのため，ごく限られた特定の利用者にしか影響を及ぼさないであろう事項に関する虚偽表示は考慮されない。※一般目的の財務諸表の監査を想定"}, {"l": 179, "m": "監査の計画及び実施における重要性（監査上の重要性）", "sb": "", "i": "A", "r": "", "q": "監査人は，監査を計画するに当たっては，企業の具体的な状況等を考慮した上で，財務諸表のあらゆる利用者の経済的な意思決定に影響を与えるかどうかという観点から重要性を検討し決定する。", "a": false, "c": "H31Ⅰ⑭ア", "e": "同上"}, {"l": 180, "m": "監査の計画及び実施における重要性（監査上の重要性）", "sb": "", "i": "A", "r": "", "q": "監査人はリスク・アプローチに基づいた監査を実施するために，監査の基本的な方針を策定する際に重要性の基準値を定めなければならない。これは，重要性の基準値の高低が監査リスクに影響を及ぼすためである。", "a": true, "c": "R５Ⅰ⑬イ", "e": "例えば，重要性の基準値が低い（小さい）場合，より小さな虚偽表示でも金額的に重要となるため，同じ被監査会社に対して重要性の基準値を高く（大きく）設定する場合に比べると，ＡＲ（重要な虚偽表示を看過して誤った意見を表明する可能性）は相対的に高くなるといえる。"}, {"l": 181, "m": "監査の計画及び実施における重要性（監査上の重要性）", "sb": "", "i": "A", "r": "", "q": "監査人は，監査計画の策定に当たって，重要性の基準値を設定するが，その際，税引前利益などの指標に対して５％などの特定の割合を適用する。この場合，指標の値には，監査対象年度の予算を適用することが求められているため，期中に被監査会社が予算の修正を行った場合には，それに合わせて重要性の基準値を改訂する。", "a": false, "c": "R２Ⅰ⑮ア", "e": "重要性の基準値を決定する際に使用する指標の値は，当年度の予算のみならず，過年度の実績や当年度の期中のものを適用することができる。"}, {"l": 182, "m": "監査の計画及び実施における重要性（監査上の重要性）", "sb": "", "i": "A", "r": "", "q": "監査人は，監査計画の策定時において，重要と考える虚偽表示の金額について職業的専門家としての判断を行うが，当該監査計画の策定時に決定する重要性の基準値は，全ての未修正の虚偽表示が，いかなる場合においても個別に又は集計しても重要性がないと評価できる金額として設定する必要はない。", "a": true, "c": "H29Ⅰ⑯ア／H24Ⅱ⑫ア", "e": ""}, {"l": 183, "m": "監査の計画及び実施における重要性（監査上の重要性）", "sb": "", "i": "A", "r": "", "q": "監査人は，従来，監査計画の策定時において重要性の基準値を当期の予想税引前利益を指標として決定している場合でも，市場環境の一時的な悪化によって大幅に税引前利益が減少する見込みとなるようなときは，過年度の数値を参考として算定した正常な税引前利益を基礎に重要性の基準値を決定することもある。", "a": true, "c": "R６Ⅱ⑮ア／H24Ⅱ⑫オ", "e": ""}, {"l": 184, "m": "監査の計画及び実施における重要性（監査上の重要性）", "sb": "", "i": "A", "r": "", "q": "監査人は，従来より，当期の予想税引前利益を指標として重要性の基準値を決定していた場合において，決算期変更により会計期間が６か月となるときには，当期の予想税引前利益を１２か月分に修正した税引前利益を，重要性の基準値算定の基礎としなければならない。", "a": false, "c": "H24Ⅱ⑫エ", "e": "会計期間が６か月となった場合は，６ヶ月分の指標（本肢であれば予想税引前利益）を基礎として重要性の基準値を決定すればよい。"}, {"l": 185, "m": "監査の計画及び実施における重要性（監査上の重要性）", "sb": "", "i": "A", "r": "", "q": "監査人は，監査計画の策定において，重要と判断される虚偽表示の金額を重要性の基準値として決定するが，質的な影響が大きいと判断した特定の勘定や注記事項に関して，重要性の基準値を小さくして監査手続を実施する場合がある。", "a": true, "c": "H23Ⅱ⑬ア", "e": "いわゆる，特定の取引種類，勘定残高又は注記事項に対する重要性の基準値に関する内容である。なお，本肢の「質的な影響が大きい」は，虚偽表示の影響ではなく，勘定自体が有する影響を指している点に注意する。特定の取引種類，勘定残高又は注記事項に対する重要性の基準値は，あくまでも虚偽表示の「金額的な影響」を判断するためのものである。"}, {"l": 186, "m": "監査の計画及び実施における重要性（監査上の重要性）", "sb": "", "i": "A", "r": "", "q": "監査人が，監査の基本的な方針を策定する際に決定する重要性の基準値は，財務諸表全体に対して設定されるものであり，特定の財務諸表項目に対して設定されるものではない。", "a": false, "c": "R５Ⅱ⑬イ", "e": "特定の取引種類，勘定残高又は注記事項に対して重要性の基準値が設定される場合，重要性の基準値は，当該特定の財務諸表項目に対して設定されることになる。"}, {"l": 187, "m": "監査の計画及び実施における重要性（監査上の重要性）", "sb": "", "i": "A", "r": "", "q": "監査人は，製薬会社の研究開発費のように，個別の財務諸表項目であるが，投資家が投資意思決定において重視している開示項目については，個別に重要性の基準値を設定することがある。", "a": true, "c": "H31Ⅰ⑭イ", "e": ""}, {"l": 188, "m": "監査の計画及び実施における重要性（監査上の重要性）", "sb": "", "i": "A", "r": "", "q": "手続実施上の重要性を重要性の基準値よりも低く設定する理由は，未修正の虚偽表示及び未発見の虚偽表示があった場合に，それらの合計が重要性の基準値を上回る可能性を適切な低い水準に抑制するためである。", "a": true, "c": "H31Ⅰ⑭エ", "e": ""}, {"l": 189, "m": "監査の計画及び実施における重要性（監査上の重要性）", "sb": "", "i": "A", "r": "", "q": "監査人は，未修正の虚偽表示と未発見の虚偽表示の合計が重要性の基準値を上回る可能性を適切な低い水準に抑えるために，手続実施上の重要性を複数設定できるが，当該設定額を重要性の基準値と同額以下とすることがある。", "a": false, "c": "R６Ⅱ⑮イ／H30Ⅱ⑭ウ／H24Ⅱ⑫ウ／H26Ⅰ⑩ウ", "e": "手続実施上の重要性は，重要性の基準値よりも「低く」設定する必要があるため，「同額以下とすることがある」としている本肢は誤りとなる。なお，手続実施上の重要性を複数設定できる点は正しい。"}, {"l": 190, "m": "監査の計画及び実施における重要性（監査上の重要性）", "sb": "", "i": "A", "r": "", "q": "ある勘定や取引などに対する手続実施上の重要性を200百万円とした場合，他の条件が一定であるとすれば，100百万円とした場合よりもリスク対応手続の実施範囲を拡大しなければならない。", "a": false, "c": "H26Ⅰ⑩エ", "e": "手続実施上の重要性を大きく設定した場合は，小さく設定した場合に比べてリスク対応手続の実施範囲を縮小することになるため，本肢は誤りとなる。"}, {"l": 191, "m": "監査の計画及び実施における重要性（監査上の重要性）", "sb": "", "i": "A", "r": "", "q": "監査人は，監査計画の策定時に重要性の基準値を設定し，これと監査の実施過程で発見された虚偽表示の金額との比較で最終的に監査意見を形成する。したがって，監査人は，監査実施の過程において，当初決定した重要性の基準値を変更してはならない。", "a": false, "c": "H31Ⅰ⑭ウ", "e": "監査人は，監査の実施過程において，当初決定した重要性の基準値を改訂すべき情報を認識した場合には，重要性の基準値を改訂しなければならない。"}, {"l": 192, "m": "監査の計画及び実施における重要性（監査上の重要性）", "sb": "", "i": "A", "r": "", "q": "監査の実施過程において，企業の実績が重要性の基準値を当初決定する際に使用した年度の業績予測から大幅に下方乖離する可能性が高まった場合には，監査人は重要性の基準値をより低い金額に改訂しなければならない。一方で，企業の実績が大幅に上方乖離する可能性が高まった場合には，監査人は重要性の基準値をより高い金額に改訂してはならない。", "a": false, "c": "R６Ⅱ⑮ウ／H29Ⅰ⑯ウ", "e": "重要性の基準値の改訂は，企業の実績が，年度の業績予測から大幅に下方乖離する場合のみならず，大幅に上方乖離する場合にも行う。なお，企業の実績が年度の業績予測から大幅に上方乖離する場合，重要性の基準値をより高い金額に改訂することになる。"}, {"l": 193, "m": "監査の計画及び実施における重要性（監査上の重要性）", "sb": "", "i": "A", "r": "", "q": "監査人は，重要性の基準値について，監査計画の策定当初に決定した金額より小さくすることが適切であると判断した場合には手続実施上の重要性も，当初に決定した金額よりも小さくしなければならない。", "a": false, "c": "R５Ⅰ⑬ウ", "e": "監査人は，重要性の基準値を改訂した場合，それに応じて手続実施上の重要性を改訂する必要があるかを判断する。したがって，本肢の場合において，手続実施上の重要性を当初に決定した金額よりも小さくしない場合もある。"}, {"l": 194, "m": "監査の計画及び実施における重要性（監査上の重要性）", "sb": "", "i": "A", "r": "", "q": "監査人は，当初の監査計画より重要性の基準値を小さくする必要があると判断したときには，計画したリスク対応手続の種類，時期及び範囲を修正する必要があるか判断しなければならない。", "a": true, "c": "R３⑮ウ", "e": ""}, {"l": 195, "m": "監査の計画及び実施における重要性（監査上の重要性）", "sb": "", "i": "A", "r": "", "q": "監査人は，監査計画の策定時に，監査上の重要性の基準値を１千万円に設定していたが，その後，設定対象としていた指標の値が修正されたために，重要性の基準値を５千万円に改訂した。この場合，他の条件が一定であれば，リスク対応手続の実施範囲は拡大しなければならない。", "a": false, "c": "R２Ⅰ⑮エ", "e": "重要性の基準値を当初決定した値よりも大きく改訂した場合，他の条件（ＲＭＭ等）が一定であれば，リスク対応手続の実施範囲を縮小することになる。"}, {"l": 196, "m": "監査の過程で識別した虚偽表示の評価", "sb": "", "i": "B", "r": "", "q": "監査人は，重要性があると判断される虚偽表示と比べて金額的にごく少額な水準として定めた「明らかに僅少」な虚偽表示を他の虚偽表示と集計する必要はないが，「明らかに僅少」であるかどうかについて何らかの疑義がある場合は「明らかに僅少」ではないと判断し，これを他の虚偽表示と集計しなければならない。", "a": true, "c": "R５Ⅱ⑰ア／H26Ⅱ⑪エ", "e": ""}, {"l": 197, "m": "監査の過程で識別した虚偽表示の評価", "sb": "", "i": "A", "r": "", "q": "監査人は，監査の過程で集計した虚偽表示が重要性の基準値に近づいている場合，未発見の虚偽表示と監査の過程で集計した虚偽表示の合計が，重要性の基準値を上回るリスクを監査上許容可能な低い水準に抑えられないことがあるが，重要性の基準値を超えていない時点では，監査計画を修正する必要があるかどうかの判断は求められていない。", "a": false, "c": "H29Ⅰ⑯イ", "e": "監査人は，監査の過程で集計した虚偽表示が重要性の基準値に近づいている場合（重要性の基準値を超えていなくとも）には，本肢にある趣旨から，監査計画を修正する必要があるかどうかを判断しなければならない。"}, {"l": 198, "m": "監査の過程で識別した虚偽表示の評価", "sb": "", "i": "A", "r": "", "q": "監査の過程で集計した虚偽表示の合計が重要性の基準値に近似していても，その範囲内であれば，監査人は，当初策定した監査計画の修正を検討する必要はない。", "a": false, "c": "R５Ⅱ⑰イ／H26Ⅱ⑪ア", "e": "同上"}, {"l": 199, "m": "監査の過程で識別した虚偽表示の評価", "sb": "", "i": "A", "r": "", "q": "監査人は，明らかに僅少であるものを除き，監査の過程で識別した虚偽表示を集計する必要があり，その集計した全ての虚偽表示について適切な階層の経営者に適時に報告し，なおかつ，これらの虚偽表示を修正するよう求めなければならない。", "a": true, "c": "H30Ⅱ⑬エ", "e": ""}, {"l": 200, "m": "監査の過程で識別した虚偽表示の評価", "sb": "", "i": "A", "r": "", "q": "監査人は，識別した虚偽表示について経営者に修正を求めたにもかかわらず経営者がその修正に同意しない場合，修正しない理由を把握した上で，全体としての財務諸表に重要な虚偽表示がないかどうかを評価しなければならない。", "a": true, "c": "H29Ⅱ⑲エ", "e": ""}, {"l": 201, "m": "監査の過程で識別した虚偽表示の評価", "sb": "", "i": "A", "r": "", "q": "監査人は，監査の実施において不正又は誤謬を発見した場合には，ただちに追加の監査手続を実施して，十分かつ適切な監査証拠を入手し，不正又は誤謬が財務諸表に与える影響を評価した上で，この評価に基づいて意見を形成しなければならない。", "a": false, "c": "H25Ⅰ①イ", "e": "監査人は，監査の実施において不正又は誤謬を発見した場合，まず，指導的機能を発揮することになる。そのため，ただちに追加の監査手続を実施すべきとする本肢は誤りとなる。"}, {"l": 202, "m": "監査の過程で識別した虚偽表示の評価", "sb": "", "i": "A", "r": "", "q": "利益を増加させる重要な虚偽表示と利益を減少させる重要な虚偽表示を相殺した結果，相殺後の金額に重要性が認められなくなった場合には，監査人は，財務諸表に重要な虚偽表示はないと結論づけることができる。", "a": false, "c": "H26Ⅱ⑪ウ", "e": "個々の虚偽表示が重要であると判断した場合，当該虚偽表示を他の虚偽表示と通常相殺できない。"}, {"l": 203, "m": "監査の過程で識別した虚偽表示の評価", "sb": "", "i": "A", "r": "", "q": "監査人は，未修正の虚偽表示が重要性の基準値を上回っている場合でも，勘定科目等の分類に係る虚偽表示のように，全体としての財務諸表との関連で重要ではないと判断することがある。", "a": true, "c": "R６Ⅱ⑮エ／H24Ⅱ⑫イ", "e": ""}, {"l": 204, "m": "監査の過程で識別した虚偽表示の評価", "sb": "", "i": "A", "r": "", "q": "監査人は，虚偽表示が重要性の基準値を下回る場合でも，当該虚偽表示が，個別に又は監査の過程で集計した他の虚偽表示と合わせて検討した結果，重要であると評価することがある。当該評価に影響を与える状況には，虚偽表示が，借入に係る財務制限条項又はその他の契約上の要求事項に影響を与えている場合が含まれる。", "a": true, "c": "H29Ⅰ⑯エ", "e": "なお，本肢は，質的影響から重要であると判断する虚偽表示の例である。"}, {"l": 205, "m": "監査の過程で識別した虚偽表示の評価", "sb": "", "i": "A", "r": "", "q": "監査人は，虚偽表示による影響額が重要性の基準値を下回っていたとしても，財務諸表の利用者が企業の財政状態や経営成績に関する適切な判断を行うために監査人が必要と判断した事項が開示されていない場合には，重要であると評価する。", "a": true, "c": "H26Ⅰ⑩イ", "e": "同上"}, {"l": 206, "m": "監査の過程で識別した虚偽表示の評価", "sb": "", "i": "A", "r": "", "q": "監査人は，過年度に重要性がないと判断された未修正の虚偽表示については，当年度の未修正の虚偽表示が重要であるかの判断において考慮する必要はない。", "a": false, "c": "R５Ⅱ⑰ウ", "e": "過年度の重要性がない未修正の虚偽表示の累積的影響が，当年度の財務諸表に重要な影響を与えることがあるため，監査人は，当年度の未修正の虚偽表示が重要であるかの判断においてこれを考慮しなければならない。"}, {"l": 207, "m": "監査の過程で識別した虚偽表示の評価", "sb": "", "i": "A", "r": "", "q": "監査人は，監査の過程で識別した未修正の虚偽表示がある場合には，その内容と，それが個別に又は集計して監査意見に与える影響を，監査役もしくは監査役会又は監査委員会に報告しなければならない。", "a": true, "c": "H25Ⅱ⑰イ", "e": ""}, {"l": 208, "m": "監査の過程で識別した虚偽表示の評価", "sb": "", "i": "A", "r": "", "q": "監査人は，未修正の重要な虚偽表示を識別した場合には，当該虚偽表示の内容及びそれが個別に又は集計して監査意見に与える影響について，監査役等に報告しなければならないが，この際監査人は，監査役等にそれが未修正の重要な虚偽表示であることを明示しなければならない。", "a": true, "c": "H31Ⅱ⑲エ", "e": ""}, {"l": 209, "m": "監査の過程で識別した虚偽表示の評価", "sb": "", "i": "A", "r": "", "q": "未修正の虚偽表示のうち重要な虚偽表示がある場合には，監査人は，監査役等が経営者に重要な虚偽表示の修正を求めることができるように，監査報告書日よりも前に監査役等とのコミュニケーションを行うことが必要である。", "a": true, "c": "R５Ⅱ⑰エ／H26Ⅱ⑪イ", "e": "本肢のコミュニケーションは，その趣旨から，当然に監査報告書日よりも前に行うことになる。"}, {"l": 210, "m": "監査の過程で識別した虚偽表示の評価", "sb": "", "i": "A", "r": "", "q": "監査人は，監査役等に対し，当年度の監査の過程で識別した未修正の虚偽表示の内容と，それが監査意見に与える影響について報告しなければならないが，あわせて，過年度の未修正の虚偽表示があった場合には，それが関連する勘定残高や開示に与えている影響についても報告する必要がある。", "a": true, "c": "H25Ⅰ⑭オ", "e": ""}, {"l": 211, "m": "監査計画", "sb": "", "i": "A", "r": "", "q": "監査計画は，リスク・アプローチの採用によって一層重要となった。すなわち，リスク・アプローチの採用によって，リスクの評価と監査手続，監査証拠の評価，監査意見の形成といった監査の一連の活動の相関性が増し，これらの活動を適切に管理するために監査計画が重要となった。", "a": true, "c": "R５Ⅱ⑬エ", "e": ""}, {"l": 212, "m": "監査計画", "sb": "", "i": "A", "r": "", "q": "監査計画を策定することで，監査を効果的かつ効率的に実施するとともに，監査チームメンバーへの指揮・監督を適切に行うことが可能となる。このため，詳細な監査計画を立案することで，その詳細さに対応して監査調書の査閲時間は短縮される。", "a": false, "c": "R２Ⅰ⑭ウ", "e": "監査計画が詳細であればあるほど監査プロセスが複雑であることを意味するため，監査調書の査閲時間は伸びると考えられる。"}, {"l": 213, "m": "監査計画", "sb": "", "i": "A", "r": "", "q": "監査計画の策定は，連続的かつ反復的なプロセスである。これは，当初に立案された監査計画が，暫定的なものであることを意味しており，時間の経過とともに，計画の内容が定まり，意見表明の前の審査において，監査計画が承認されることによって最終的に確定する。", "a": false, "c": "R２Ⅰ⑭イ", "e": "意見表明により重要な虚偽表示リスクが確定するため，監査計画も意見表明によって確定することになる。"}, {"l": 214, "m": "監査計画", "sb": "", "i": "A", "r": "", "q": "監査計画の策定は，前年度の監査の終了直後，又は前年度の監査の最終段階から始まり，当年度の監査の終了まで継続するが，監査計画には，例えば専門家の業務の利用の程度の決定のようなリスク対応手続の実施前に完了することが必要な活動が含まれる。", "a": true, "c": "H31Ⅰ⑬ウ", "e": ""}, {"l": 215, "m": "監査計画", "sb": "", "i": "A", "r": "", "q": "監査手続を実施することにより，リスク評価とリスク対応手続を見直す場合があるが，監査上の重要性の基準値の決定はリスク対応手続の前に完了しなければならない。", "a": true, "c": "H24Ⅰ⑬オ", "e": ""}, {"l": 216, "m": "監査計画", "sb": "", "i": "A", "r": "", "q": "監査は，監査経験や洞察力を十分に有する監査責任者の責任の下で行われるため，監査責任者自らが監査計画を他の監査チームメンバーに頼らず策定し，当該監査計画を監査チームの主要メンバーに伝達しなければならない。", "a": false, "c": "H30Ⅱ⑭イ", "e": "監査計画の策定には，監査責任者のみならず監査チームの主要メンバーも参画しなければならない。"}, {"l": 217, "m": "監査計画", "sb": "", "i": "A", "r": "", "q": "監査人は，監査計画の内容について，監査役等とコミュニケーションを実施する必要があるが，経営者に対しては，監査の有効性を阻害することになるため，その内容を知らせることはできない。", "a": false, "c": "R４Ⅰ⑭ア", "e": "監査人は，監査計画の内容について経営者と協議することがあるため，本肢は誤りである。"}, {"l": 218, "m": "監査計画", "sb": "", "i": "A", "r": "", "q": "監査人は，個々の監査業務における品質を管理し達成するために，実施する監査手続の種類や実施時期等の監査計画の内容に関する事項について，事前に経営者と協議するとともに，被監査会社の従業員の業務と連携しなければならない。", "a": false, "c": "H30Ⅱ⑭エ", "e": "監査計画の内容に関する経営者との協議は強制ではない。また，被監査会社の従業員の業務との連携も必要な場合にのみ行うものである。"}, {"l": 219, "m": "監査計画", "sb": "", "i": "A", "r": "", "q": "経営者に監査手続を容易に予測されることにより監査の有効性が阻害されてしまうことがあるため，監査の有効性を損なわないための配慮は必要であるが，監査人は監査計画の内容について経営者と協議することがある。", "a": true, "c": "H30Ⅱ⑭エ／H25Ⅱ⑬ア", "e": ""}, {"l": 220, "m": "監査計画", "sb": "", "i": "A", "r": "", "q": "監査計画には，監査業務に対する監査の基本的な方針の策定と詳細な監査計画の作成が含まれるが，両者は相互に密接に関連するものであり，監査人は，監査の基本的な方針が詳細な監査計画を作成するための指針となるように策定しなければならない。", "a": true, "c": "H30Ⅱ⑭ア", "e": ""}, {"l": 221, "m": "監査計画", "sb": "", "i": "A", "r": "", "q": "監査の基本的な方針は，リスク評価手続やリスク対応手続の内容を策定するための指針となるものであり，具体的な監査手続の種類や範囲を定めることを目的としたものではない。", "a": true, "c": "R４Ⅰ⑭イ", "e": ""}, {"l": 222, "m": "監査計画", "sb": "", "i": "A", "r": "", "q": "監査計画には，監査の基本的な方針と詳細な監査計画がある。監査の基本的な方針で策定される監査手続には，リスク評価手続が含まれる。", "a": false, "c": "R５Ⅱ⑬ア", "e": "上の肢との違いに注意。監査の基本的な方針は，リスク評価手続やリスク対応手続の内容を「策定するための指針となるもの」であって，それ自体がリスク評価手続やリスク対応手続の内容を策定するものではない。"}, {"l": 223, "m": "監査計画", "sb": "", "i": "A", "r": "", "q": "監査人は，監査の基本的な方針を策定する際に，被監査会社に対して監査以外の業務を実施している場合には，当該業務から得られた知識を含めて監査契約に係る予備的な活動の結果を考慮しなければならない。", "a": true, "c": "H25Ⅱ⑬イ", "e": ""}, {"l": 224, "m": "監査計画", "sb": "", "i": "A", "r": "", "q": "監査計画により，効果的かつ効率的な方法で監査業務を実施することが可能となるが，監査人は，全てのリスク対応手続の詳細な監査計画を決定する前であっても，一部の取引種類，勘定残高及び注記事項に関するリスク対応手続を実施することがある。", "a": true, "c": "R７Ⅰ⑭ウ／R５Ⅰ⑬エ／R３⑮イ", "e": ""}, {"l": 225, "m": "監査計画", "sb": "", "i": "A", "r": "", "q": "監査計画の意義は，効率的かつ効果的な監査の実施に資することにあるので，リスク対応手続は，その種類，時期及び範囲に係る詳細な監査計画の完成を待って開始されなければならない。", "a": false, "c": "H25Ⅱ⑬エ", "e": "全てのリスク対応手続に係る詳細な監査計画を作成する前（完成する前）であっても，一部の取引種類，勘定残高，注記事項に関するリスク対応手続を実施することがある。"}, {"l": 226, "m": "監査計画", "sb": "", "i": "A", "r": "", "q": "監査人は，監査期間中に予期しない出来事が生じた場合，状況に変化が生じた場合，又は監査手続の実施結果が想定した結果と異なった場合には，リスク評価に影響を及ぼすので，当初に計画したリスク対応手続の種類，時期及び範囲を修正しなければならない。監査人は，内部統制の運用評価手続より入手した監査証拠と実証手続の実施過程で入手した監査証拠が矛盾している場合，その矛盾が軽微なものであっても，監査計画を修正しなければならない。監査人は，監査手続を計画した時点での利用可能な情報と著しく異なる情報に気付いた場合，改訂されたリスク評価の結果に基づいて監査計画を修正することが必要となるが，この修正は監査の基本的な方針まで及ぶことがある。", "a": true, "c": "R５Ⅰ⑬ア／R７Ⅰ⑭エ／H31Ⅰ⑬エ／H25Ⅱ⑬ウ", "e": "×本肢の場合，リスク対応手続の種類，時期及び範囲の修正は，必要に応じて行うものである。、、×本肢は，「矛盾が軽微」という点から，監査計画の修正が不要であると判断する必要があった。、、、本肢は，「著しく異なる情報に気付いた」という点から，リスク評価及び監査計画の修正が必要になると判断する必要があった。"}, {"l": 227, "m": "監査計画", "sb": "", "i": "A", "r": "", "q": "監査人は，監査の開始に当たって，監査契約に係る予備的な活動の段階では，独立性を含む関連する職業倫理に関する規定の遵守状況の評価を実施する必要はないが，監査の基本的な方針を示す監査計画を策定する際には，当該状況の評価を実施する必要がある。", "a": false, "c": "R６Ⅱ③ア／R３⑪ア", "e": "監査人は，監査契約に係る予備的な活動の段階において，独立性を含む関連する職業倫理に関する規定の遵守状況の評価を実施しなければならない。一方，監査の基本的な方針を示す監査計画を策定する際に，当該評価を実施することは求められていない。"}, {"l": 228, "m": "監査計画", "sb": "", "i": "A", "r": "", "q": "監査人は，監査計画に先立ち，監査契約に係る予備的な活動において，当該監査を遂行するために必要な監査チームメンバーの能力，時期，及び人数を明確にしなければならない。", "a": false, "c": "R３⑮ア", "e": "監査を遂行するために必要な監査チームメンバーの能力，時期，及び人数は，監査の基本的な方針の策定において明確にする事項であるため，監査契約に係る予備的な活動において明確にすることはできない。👉講義レジュメ③-11-4"}, {"l": 229, "m": "監査計画", "sb": "", "i": "A", "r": "", "q": "監査計画の目的及び監査計画に係る活動の内容と範囲は，初年度監査，継続監査いずれにおいても同じである。", "a": false, "c": "H31Ⅰ⑬ア", "e": "監査計画の目的は，初年度監査，継続監査のいずれにおいても同じであるが，監査計画に係る活動の内容と範囲は，継続監査よりも初年度監査の方が広くなることがある。"}, {"l": 230, "m": "監査計画", "sb": "", "i": "A", "r": "", "q": "初年度監査においては，継続監査と異なり，被監査会社に対する経験が少ないことから，監査計画については必ず審査を受けなければならない。", "a": false, "c": "R４Ⅰ⑭ウ", "e": "初年度監査だからといって，監査計画の審査を必ず受けなければならないわけではない（義務付けの規定はない）。"}, {"l": 231, "m": "監査調書", "sb": "", "i": "A", "r": "", "q": "監査調書を作成する目的には，監査人が実施した作業の説明根拠にすることのほか，監査計画を策定する際及び監査を実施する際の支援とすることも含まれる。", "a": true, "c": "H29Ⅰ⑬ア", "e": ""}, {"l": 232, "m": "監査調書", "sb": "", "i": "A", "r": "", "q": "監査調書の作成の目的に，法令等に基づき実施される外部による検査の実施を可能にすることは含まれない。", "a": false, "c": "R６Ⅱ⑬ア／H24Ⅱ⑮オ", "e": "監査調書を作成する目的の１つに，法令等に基づき実施される外部の検査（日本公認会計士協会による品質管理レビューや公認会計士・監査審査会による検査）の実施を可能にすることがある。"}, {"l": 233, "m": "監査調書", "sb": "", "i": "A", "r": "", "q": "監査調書は，監査が一般に公正妥当と認められる監査の基準に準拠して実施されたという証拠を提供するものであるため，監査人が自らの責任を問われるような事態にあっては説明責任を果たすのに有用となる。", "a": true, "c": "H31Ⅱ⑬イ", "e": ""}, {"l": 234, "m": "監査調書", "sb": "", "i": "A", "r": "", "q": "監査人は，財務諸表の監査において正当な注意を行使したことを具体的な証拠に基づいて自ら立証することを主たる目的として監査調書を作成する。", "a": false, "c": "H23Ⅱ⑨オ", "e": "監査調書の作成目的は様々であり，本肢にある目的もその１つであるが，主たる目的というわけではない。"}, {"l": 235, "m": "監査調書", "sb": "", "i": "A", "r": "", "q": "一般基準の５によって作成と保存が求められている監査調書は，一般に公正妥当と認められる監査の基準に準拠して監査を実施したことに対して証拠を提供するが，監査に適用される法令等に準拠して監査を実施したことに対しての証拠は提供しない。", "a": false, "c": "H26Ⅰ⑥ウ", "e": "監査調書は，監査に適用される法令等に準拠して監査を実施したことに対しての証拠も提供する。"}, {"l": 236, "m": "監査調書", "sb": "", "i": "A", "r": "", "q": "監査人は，適時に監査調書を作成しなければならないが，その理由の一つとして，監査手続の実施から時間が経過した後で作成される監査調書は，手続実施時に適時に作成される監査調書に比べ正確でない場合があることがあげられる。", "a": true, "c": "R６Ⅱ⑬イ／H29Ⅰ⑬イ", "e": ""}, {"l": 237, "m": "監査調書", "sb": "", "i": "A", "r": "", "q": "監査調書には，監査手続書や分析表等に加えて，監査人と被監査会社との間の重要な事項に関するやりとりを示した電子メールも含まれる。", "a": true, "c": "H25Ⅰ⑳ウ", "e": ""}, {"l": 238, "m": "監査調書", "sb": "", "i": "A", "r": "", "q": "監査調書には，監査人による記録だけではなく，企業が作成した文書が含まれることがある。", "a": true, "c": "H29Ⅰ⑬エ", "e": "監査調書には，重要な契約書や覚書といった企業の記録の抜粋又はコピーを含めることができる。"}, {"l": 239, "m": "監査調書", "sb": "", "i": "A", "r": "", "q": "監査調書は，監査人が実施した監査手続，入手した監査証拠及び監査人が到達した結論を記録するものであるが，これを用いて監査業務に係る審査も行われるため，監査人の結論に至るまでの過程を確認するために，結論に至っていない考え，予備的な考えを書いたメモ及び監査調書の草稿も含めなければならない。", "a": false, "c": "H31Ⅱ⑬ア／H25Ⅰ⑳イ", "e": "作成途中の財務諸表や監査調書の草稿，結論に至っていない考えや予備的な考えを書いたメモ，字句のみを修正した場合の元の文書，重複した文書等は，監査調書に含める必要はない。"}, {"l": 240, "m": "監査調書", "sb": "", "i": "A", "r": "", "q": "監査人は，監査における作業の判断の質を自らあるいは組織的に管理するために監査調書を作成することが不可欠であるが，必ずしも紙媒体により保存する必要はない。", "a": true, "c": "H30Ⅱ⑫ウ", "e": ""}, {"l": 241, "m": "監査調書", "sb": "", "i": "A", "r": "", "q": "監査人は，監査手続により入手した重要な監査証拠について監査調書に記載するのであって，監査証拠の全てを記載するわけではない。", "a": false, "c": "H30Ⅱ⑫イ", "e": "たしかに，監査において検討された事項又は職業的専門家としての判断の全てを文書化する必要はないが，重要な監査証拠のみを監査調書に記載するわけでもない（重要でない監査証拠であっても，監査調書の目的を果たす上で必要であれば監査調書に記載することになる）。"}, {"l": 242, "m": "監査調書", "sb": "", "i": "A", "r": "", "q": "監査調書は，監査人が一般に公正妥当と認められる監査の基準に準拠して財務諸表監査を実施したという証拠を提示するものであるが，職業的専門家として監査人が判断した事項を全て文書化して含める必要はない。", "a": true, "c": "H25Ⅰ⑳オ", "e": ""}, {"l": 243, "m": "監査調書", "sb": "", "i": "A", "r": "", "q": "監査人は，監査において検討された事項又は職業的専門家としての判断の全てを文書化することが求められているわけではない。例えば署名された監査契約書は，監査人が経営者又は監査役等と合意したということを示しているため，当該合意について別途文書化する必要はない。", "a": true, "c": "H28Ⅱ⑯イ", "e": ""}, {"l": 244, "m": "監査調書", "sb": "", "i": "A", "r": "", "q": "監査人は，監査事務所内外の経験豊富な監査人が，以前に当該監査に関与していなかったとしても，実施した監査手続，入手した監査証拠，監査の過程で生じた重要な事項とその結論及び職業的専門家としての重要な判断を理解できるように監査調書を作成しなければならない。", "a": true, "c": "R４Ⅰ⑬イ", "e": ""}, {"l": 245, "m": "監査調書", "sb": "", "i": "A", "r": "", "q": "監査調書は，監査事務所の内外を問わず公認会計士であれば，実施した監査手続入手した監査証拠，並びに到達した結論及びその根拠を理解できるように作成されなければならない。", "a": false, "c": "H24Ⅱ⑮イ", "e": "監査人は，「経験豊富な監査人」が，以前に当該監査に関与していなくとも本肢にある事項を理解できるように，監査調書を作成すればよい。"}, {"l": 246, "m": "監査調書", "sb": "", "i": "A", "r": "", "q": "監査人は，実施した監査手続の種類，時期及び範囲の文書化において，手続を実施した項目又は対象を識別するための特性，監査手続を実施した者及びその完了日，査閲をした者，査閲日及び査閲の対象を記録しなければならない。", "a": true, "c": "H25Ⅱ⑪イ／H29Ⅰ⑬ウ", "e": ""}, {"l": 247, "m": "監査調書", "sb": "", "i": "A", "r": "", "q": "監査人は，実施した監査手続の種類，時期及び範囲を文書化する場合，監査調書の査閲に関しては，査閲をした者，査閲日及び査閲の対象を記録しなければならないが，当該記録は，必ずしも個々の監査調書に行う必要はない。", "a": true, "c": "H28Ⅱ⑯ア／H24Ⅱ⑮ア", "e": ""}, {"l": 248, "m": "監査調書", "sb": "", "i": "A", "r": "", "q": "監査人は，公正価値で測定・評価される金融商品の評価額を重要な事項として経営者と協議した場合には，当該協議事項の内容，協議を実施した日及び協議の相手方等について監査調書を作成しなければならない。", "a": true, "c": "H31Ⅱ⑱ウ", "e": ""}, {"l": 249, "m": "監査調書", "sb": "", "i": "A", "r": "", "q": "監査人は，重要な事項について経営者と協議した場合には，重要な事項の内容，協議を実施した日及び協議の相手方について文書化し，監査調書に含めなければならないが，これには企業側が作成した文書は含まれない。", "a": false, "c": "H29Ⅱ⑲ア", "e": "重要な事項について経営者と協議した場合に文書化する監査調書には，企業側が作成した文書も含まれる。"}, {"l": 250, "m": "監査調書", "sb": "", "i": "A", "r": "", "q": "監査人は，重要な事項に関する結論を形成する過程において，矛盾した情報を識別した場合には，監査人がどのようにその矛盾した情報に対応したかを文書化しなければならないが，必ずしも不正確な文書や修正前の文書を残すことは求められていない。", "a": true, "c": "R６Ⅱ⑬ウ／R４Ⅰ⑬ウ／H30Ⅱ⑫エ／H28Ⅱ⑯エ", "e": ""}, {"l": 251, "m": "監査調書", "sb": "", "i": "A", "r": "", "q": "監査人は，実施した監査手続，入手した関連する監査証拠及び監査人が到達した結論の記録として監査調書の作成を義務付けられているが，職業倫理に関する規定における責任に関して識別した事項を監査調書に含めることまでは求められていない。", "a": false, "c": "R７Ⅰ⑫エ", "e": "監査人は，職業倫理に関する規定における責任に関して識別した事項や到達した結論等について，監査調書に含めなければならない。"}, {"l": 252, "m": "監査調書", "sb": "", "i": "A", "r": "", "q": "監査調書は，監査が一般に公正妥当と認められる監査の基準に準拠して実施されたという証拠を提供するものであるため，監査事務所における監査業務に係る審査の内容や結論を監査調書に含めることはない。", "a": false, "c": "R４Ⅰ⑬ア／H27Ⅱ②ウ／H23Ⅱ⑩ア", "e": "監査調書には，監査業務に係る審査の内容や結論も含まれる。"}, {"l": 253, "m": "監査調書", "sb": "", "i": "A", "r": "", "q": "審査担当者は，監査事務所の所定の方針又は手続に従って審査を実施し，審査の内容や結論を文書化しなければならないが，文書化の作業は監査報告書日以後の監査調書の整理期間において実施することが認められている。", "a": true, "c": "H27Ⅱ⑨エ／H26Ⅱ⑧イ", "e": ""}, {"l": 254, "m": "監査調書", "sb": "", "i": "A", "r": "", "q": "監査人は，監査基準報告書における要求事項に代えて代替的手続が必要であると判断した場合，代替的手続を実施した旨，理由及びその結果を監査調書に文書化しなければならないが，当該代替的手続がどのようにその要求事項の目的を達成したかについてまでは文書化する必要はない。", "a": false, "c": "H24Ⅱ⑮ウ", "e": "本肢のような場合には，実施された代替的な監査手続がどのようにその要求事項の目的を達成したかということ及びその理由を文書化しなければならない。"}, {"l": 255, "m": "監査調書", "sb": "", "i": "A", "r": "", "q": "監査調書は，監査人の総括的な目的の達成に関する監査人の結論についての基礎となる証拠を提供するものであるため，いかなる理由があっても，監査報告書日後に監査調書に追加あるいは変更を加えることは認められない。", "a": false, "c": "H28Ⅱ⑯ウ／H23Ⅱ⑩ウ", "e": "監査人は，例外的な状況（事後判明事実がある場合など）において，監査報告書日後に新たに若しくは追加的に監査手続を実施する場合，又は新たな結論を導き出す場合がある。このような場合，監査人は，監査報告書日後に監査調書の追加・変更を行うことになる。"}, {"l": 256, "m": "監査調書", "sb": "", "i": "A", "r": "", "q": "監査人は，例外的な状況において，監査報告書日後に，新たに若しくは追加的に監査手続を実施する場合又は新たな結論を導き出す場合，監査調書に追加・変更を実施した者及び実施日を文書化する必要があるが，それらを査閲した者及び査閲日についての文書化は求められていない。", "a": false, "c": "R６Ⅱ⑬エ／R４Ⅰ⑬エ", "e": "本肢の場合に文書化する事項には，監査調書に追加・変更を実施した者及び実施日のみならず，それらを査閲した者及び査閲日も含まれる。"}, {"l": 257, "m": "監査調書", "sb": "", "i": "A", "r": "", "q": "監査人は，監査の過程を通じて職業的専門家としての判断が行使されたことを示すため，原則として，事務的な作業を除き，監査調書は監査報告書日までに作成しなければならない。", "a": true, "c": "R４Ⅱ⑬ウ", "e": "上２つの問題のように，監査報告書日後の新たな監査手続の実施等は例外とされていることから，「原則として，事務的な作業を除き，監査調書は監査報告書日までに作成しなければならない」とする本肢は正しいことになる。"}, {"l": 258, "m": "監査調書", "sb": "", "i": "A", "r": "", "q": "複数の補助者を使用して監査が実施される場合，より経験のある監査実施者は，経験の浅い補助者が作成する監査調書を査閲する責任を負うが，監査責任者がすべての監査調書を査閲する必要はない。", "a": true, "c": "H24Ⅰ④イ", "e": ""}, {"l": 259, "m": "監査調書", "sb": "", "i": "A", "r": "", "q": "監査責任者は，監査報告書日以前に，監査調書の査閲や監査チームとの討議を通じて，到達した結論と監査意見を裏付ける十分かつ適切な監査証拠が入手されているかどうかを判断しなければならないが，全ての監査調書を査閲する必要はない。", "a": true, "c": "R５Ⅱ⑦ウ／H31Ⅰ⑨ウ", "e": ""}, {"l": 260, "m": "監査調書", "sb": "", "i": "A", "r": "", "q": "監査事務所は，監査調書の査閲に関する方針又は手続を定める際に，監査基準や監査基準報告書はもとより，日本公認会計士協会が公表する会則及び倫理規則に従って業務を実施することも考慮しなければならない。", "a": true, "c": "H26Ⅱ⑧ウ", "e": "監査調書の査閲により検討する事項の中に，「職業的専門家としての基準及び適用される法令等に従って作業を行っているかどうか」が含まれることから，監査事務所は，監査調書の査閲に関する方針及び手続を定める際に，本肢の事項を考慮しなければならない。"}, {"l": 261, "m": "監査調書", "sb": "", "i": "A", "r": "", "q": "監査報告書日後に行う監査ファイルの最終的な整理は，事務的な作業であり，これには監査人が監査報告書日前に入手し，監査チームメンバーと討議して合意した監査証拠を文書化する作業も含まれる。", "a": true, "c": "H25Ⅱ⑪ア", "e": ""}, {"l": 262, "m": "監査調書", "sb": "", "i": "A", "r": "", "q": "監査人は，同一の事業年度の財務情報に対して，金融商品取引法に基づく監査と会社法に基づく監査を同時に行っている場合，監査調書を一つの監査ファイルに整理することができる。また，監査人は，期中レビューに関する調書のファイルと，年度監査の監査ファイルを一つのファイルに整理することができる。", "a": false, "c": "H29Ⅰ⑧イ／H26Ⅱ⑧エ", "e": "期中レビューに関する調書のファイルと，年度監査の監査ファイルを一つのファイルに整理することはできない。なお，前段の記述は正しい。"}, {"l": 263, "m": "監査調書", "sb": "", "i": "A", "r": "", "q": "監査ファイルの最終的な整理を完了する期限は，通常，監査報告書日から６０日程度を超えないものとされているが，複数の監査報告書が発行された監査調書を１つのファイルに整理する場合は，いずれか早い監査報告書日から６０日程度を超えないこととされている。", "a": false, "c": "H25Ⅱ⑪エ", "e": "複数の監査業務に係る監査調書を１つのファイルに整理する場合，いずれか「遅い」監査報告書日から６０日程度を超えないこととされている。"}, {"l": 264, "m": "監査調書", "sb": "", "i": "A", "r": "", "q": "上場会社の監査を終了した公認会計士又は監査法人は，監査が終了した日から三月を経過する日の属する月の末日までに，監査に関係する記録や資料を監査調書として整理して，これをその事務所に備えておく必要がある。", "a": false, "c": "R５Ⅰ⑤イ", "e": "上記問題を参照"}, {"l": 265, "m": "監査調書", "sb": "", "i": "A", "r": "", "q": "監査人は，特定の監査業務に関する監査調書を取りまとめた監査ファイルの整理を最終的に完了させた後，その保存期間が終了するまで，いかなる監査調書であっても削除又は廃棄してはならない。", "a": true, "c": "H31Ⅱ⑬エ", "e": ""}, {"l": 266, "m": "監査調書", "sb": "", "i": "A", "r": "", "q": "監査調書は，最終的に監査ファイルとして電磁媒体で保存することは認められているが，一定期間は紙媒体で容易に閲覧できるようにしておかなければならない。", "a": false, "c": "H24Ⅱ⑮エ", "e": "電磁媒体で保存した監査ファイルは，電磁媒体上で閲覧できれば問題ない。"}, {"l": 267, "m": "監査調書", "sb": "", "i": "A", "r": "", "q": "監査事務所は，法令等，職業倫理に関する規定及び職業専門家としての基準を遵守するため，審査に係る書類を適切に保存する期間を定めなければならないが，その期間は会社法上の会計帳簿に関する保存期間よりも短い期間であってはならない。", "a": false, "c": "R６Ⅱ⑦エ", "e": "審査に係る書類を含め，監査調書の保存期間としては会社法上の会計帳簿に関する保存期間（１０年）が参考となるが，状況次第で，これよりも長い期間ｏｒ短い期間とすることもできる。"}, {"l": 268, "m": "監査調書", "sb": "", "i": "A", "r": "", "q": "監査調書は，監査人が実施した監査手続，入手した監査証拠，及び監査証拠から導いた結論を紙媒体又は電子媒体に記録したものであり，金融商品取引法では１０年間保存することが義務づけられている。", "a": false, "c": "H25Ⅰ⑳ア", "e": "金融商品取引法において，監査調書の保存期間に関する定めは存在しない。なお，監査調書の保存期間については，１つ上の問題の解説を参照。"}, {"l": 269, "m": "監査調書", "sb": "", "i": "A", "r": "", "q": "監査人は，監査報告書日後，適切な期限内に，監査ファイルにおける監査調書を整理し，監査ファイルの最終的な整理についての事務的な作業を完了しなければならず，監査ファイルの最終的な整理が完了した後に，監査調書の修正又は追加の記録を行うことはない。", "a": false, "c": "H31Ⅰ⑨エ", "e": "監査ファイルの最終的な整理が完了した後でも，監査業務の定期的な検証や日本公認会計士協会が実施する品質管理レビュー等の指摘を受けて，監査調書の修正又は追加の記録を行うことがある。"}, {"l": 270, "m": "監査調書", "sb": "", "i": "A", "r": "", "q": "監査調書は監査事務所の所有に属するため，監査ファイルの最終的な整理を実施した後に監査対象の事業年度に関する会社資料を入手した場合，監査チームは自らの判断で任意に当該資料を監査調書に追加することができる。", "a": false, "c": "H26Ⅱ⑧ア", "e": "最終的な整理が完了した後の監査調書の修正・追加は，モニタリング活動や外部の検証の指摘等に基づいて行うものであり，監査チームの判断で自由に行えるわけではない。"}, {"l": 271, "m": "監査調書", "sb": "", "i": "A", "r": "", "q": "監査調書には被監査会社の秘密情報が数多く含まれており，そこから秘密情報の漏洩が生じることのないよう管理・保管に万全を期す必要がある。監査調書は監査事務所の所有に属するものの，その管理・保管に係る全ての責任は監査責任者が負わなければならない。", "a": false, "c": "H31Ⅱ⑬ウ", "e": "監査調書の管理・保管に係る責任は，監査責任者のみならず監査事務所も負う。"}, {"l": 272, "m": "監査サンプリング", "sb": "", "i": "B", "r": "", "q": "抽出したサンプルに対して監査手続が適切に実施されない場合には，当該サンプルが母集団の特性を正確に反映しないこととなり，サンプリングリスクが生じる。", "a": false, "c": "H28Ⅰ⑭エ", "e": "サンプルが母集団の特性を正確に反映しないことによるサンプリングリスクは，サンプルの抽出行為が適切でないことにより生じるものであり，抽出したサンプルに対して実施する監査手続の適切性は関係しない。なお，抽出したサンプルに対する監査手続が適切でないことにより生じるリスクは，ノンサンプリングリスクである。"}, {"l": 273, "m": "監査サンプリング", "sb": "", "i": "A", "r": "", "q": "サンプリングにおけるサンプル数は監査人の許容するサンプリングリスクの程度に影響を受けるが，具体的な抽出サンプル数を統計的手法によって決定するだけでなく，監査人の職業的専門家としての判断によって決定することができる場合もある。", "a": true, "c": "H31Ⅰ⑰イ／H24Ⅰ⑫イ", "e": ""}, {"l": 274, "m": "監査サンプリング", "sb": "", "i": "A", "r": "", "q": "監査人は，運用評価手続をサンプリングによる試査で行う場合のサンプル数を決定するに当たっては，内部統制に依拠しようとする程度，許容逸脱率，予想逸脱率，サンプリングの信頼度及び母集団を構成する項目数を総合的に考慮する必要がある。", "a": true, "c": "H23Ⅱ⑫イ", "e": ""}, {"l": 275, "m": "監査サンプリング", "sb": "", "i": "A", "r": "", "q": "（監査手続の実施として適切か？）監査人は，売掛金に対する監査手続として，得意先別売掛金残高を母集団として，サンプリングによる確認手続を実施するとともに，手続実施上の重要性より少額の許容虚偽表示額を設定して，その結果を評価した。", "a": true, "c": "R４Ⅰ⑯エ", "e": ""}, {"l": 276, "m": "監査サンプリング", "sb": "", "i": "A", "r": "", "q": "監査人が運用評価手続におけるサンプル数を決定する際に，テストすべき母集団における予想逸脱率が高いほど，実際の逸脱率を合理的に推定するために，より多くのサンプル数が必要となる。", "a": true, "c": "H31Ⅰ⑰ウ", "e": ""}, {"l": 277, "m": "監査サンプリング", "sb": "", "i": "A", "r": "", "q": "統制リスクの程度が高いと評価した場合であっても，監査人は内部統制への依拠の度合いを合理的に高めることによって発見リスクの程度を低くすることができるため，実証手続として実施されるサンプリングにおけるサンプル数を少なくすることができる場合もある。", "a": false, "c": "H24Ⅰ⑫ウ", "e": "統制リスクの程度が高いと評価した場合，監査人は内部統制への依拠の度合いを高めることはできないため，発見リスクの程度を低くしなければならない。したがって，実証手続として実施されるサンプリングにおけるサンプル数を多くすることになる。"}, {"l": 278, "m": "監査サンプリング", "sb": "", "i": "A", "r": "", "q": "実証手続として実施されるサンプリングにおいて，発見リスクの程度を許容できる水準にまで引き下げるために，同一の監査要点に対する他の実証手続への依拠の度合いを高めたときには，サンプル数は相対的に少なくてすむ場合がある。", "a": true, "c": "H24Ⅰ⑫オ", "e": ""}, {"l": 279, "m": "監査サンプリング", "sb": "", "i": "A", "r": "", "q": "実証手続として実施されるサンプリングにおいて，サンプルに含まれている誤謬金額が母集団の誤謬金額をどの程度正確に表わしているかに関し，監査人がその確からしさについてより高い信頼度を必要とすればするほど，より多くのサンプル数を必要とする。", "a": true, "c": "H24Ⅰ⑫エ", "e": ""}, {"l": 280, "m": "監査サンプリング", "sb": "", "i": "A", "r": "", "q": "詳細テストの実施に際して，テスト対象項目を抽出するために統計的サンプリング又は非統計的サンプリングのいずれの手法を用いるかは，監査人の判断により決定されるが，著しく多くのサンプル数を抽出する必要がある場合には，統計的サンプリングの実施が要求されている。", "a": false, "c": "H31Ⅰ⑰ア／H27Ⅰ⑫エ", "e": "統計的サンプリング又は非統計的サンプリングのいずれの手法を用いるかは，監査人の判断により決定されるが，抽出されるサンプル数自体は，これらの選択を決定付ける判断基準とはならない。"}, {"l": 281, "m": "監査サンプリング", "sb": "", "i": "A", "r": "", "q": "監査人は，監査手続の実施において監査サンプリングを利用することがある。この場合，監査手続の目的を考慮して，統計的サンプリング又は非統計的サンプリングのいずれの手法を用いるかを判断するが，特別な検討を必要とするリスクに対しては統計的なサンプリングを実施しなければならない。", "a": false, "c": "R５Ⅰ⑯ア", "e": "ＳＲであるかどうかは，統計的サンプリング又は非統計的サンプリングの選択を決定付ける判断基準とはならない。"}, {"l": 282, "m": "監査サンプリング", "sb": "", "i": "B", "r": "", "q": "監査人は，抽出したサンプルに立案した監査手続又は適切な代替手続を実施できない場合，当該サンプルを，運用評価手続においては内部統制の逸脱として扱うことが求められている。", "a": true, "c": "R７Ⅰ⑯イ", "e": ""}, {"l": 283, "m": "監査サンプリング", "sb": "", "i": "B", "r": "", "q": "監査サンプリングによる試査で，抽出したサンプルに関連する証拠書類が紛失しているときなど，抽出したサンプルに監査人が立案した監査手続を適用できない場合，又は適切な代替手続を実施できない場合，監査人は，当該サンプルを詳細テストにおいては虚偽表示として扱わなければならない。", "a": true, "c": "R２Ⅱ⑮ア／H28Ⅰ⑭イ", "e": ""}, {"l": 284, "m": "監査サンプリング", "sb": "", "i": "B", "r": "", "q": "監査人は，虚偽表示額の推定に当たって，運用評価手続に対する監査サンプリングを実施した結果，発見された逸脱率に基づいて，母集団全体の虚偽表示額を推定し，許容虚偽表示額の範囲内であるかどうかを判断しなければならない。", "a": false, "c": "R５Ⅰ⑯イ", "e": "虚偽表示額の推定は，詳細テストで発見した虚偽表示額に基づいて行う。"}, {"l": 285, "m": "監査サンプリング", "sb": "", "i": "B", "r": "", "q": "監査人は，詳細テストにおいて，母集団における虚偽表示に係る最善の見積りを行うに際し，母集団を明らかに代表していない例外的な虚偽表示が存在する場合，これを推定による虚偽表示の金額に加える。", "a": true, "c": "H28Ⅰ⑭ウ／H23Ⅱ⑫エ", "e": ""}, {"l": 286, "m": "監査サンプリング", "sb": "", "i": "B", "r": "", "q": "サンプリングに基づく内部統制の評価手続の結果，推定逸脱率が許容逸脱率を超えていないと判定されたとしても，更なる監査手続の実施が必要となる場合もある。", "a": true, "c": "H23Ⅱ⑫ア", "e": "推定逸脱率が，許容逸脱率を超えていなくとも近似している場合は，サンプリングリスクを考慮すれば実際の逸脱率が許容逸脱率を上回る可能性は高いため，更なる監査手続の実施が必要となる場合がある。※詳細テストと同じ考え方"}, {"l": 287, "m": "会計上の見積りの監査", "sb": "", "i": "B", "r": "", "q": "会計上の見積りに関連する注記事項が合理的であるかどうかを評価するに当たって，監査人は，適用される財務報告の枠組みに準拠しているかという観点から検討しなければならない。ただし，評価した見積り項目に関する固有リスクの程度が低い場合には，その枠組みにおける測定基礎の目的に合致した判断が行われているかの検討は必ずしも要しない。", "a": false, "c": "R４Ⅱ⑮ア", "e": "会計上の見積りに係る合理性の判断に当たっては，適用される財務報告の枠組みにおいて要求される事項が適切に適用されているかを検討する必要があるが，ここでいう「適切に適用されている」とは，適用される財務報告の枠組みに準拠しているだけでなく，その枠組みにおける測定基礎の目的に合致した判断が行われることを意味している。したがって，当該合理性の判断において，適用される財務報告の枠組みにおける測定基礎の目的に合致した判断が行われているかの検討は必ず行うため，本肢は誤りとなる。"}, {"l": 288, "m": "会計上の見積りの監査", "sb": "", "i": "B", "r": "", "q": "監査人は，職業的懐疑心を常に保持しなければならないので，会計上の見積りの不確実性の程度が高い場合，あるいは会計上の見積りが複雑性，主観性又はその他の固有リスク要因によって大きな影響を受ける場合であっても，職業的懐疑心の程度は変わらない。", "a": false, "c": "R４Ⅰ⑰イ", "e": "会計上の見積りに関する職業的懐疑心の程度は，見積りに係る固有リスク要因の影響によって変わる。"}, {"l": 289, "m": "会計上の見積りの監査", "sb": "", "i": "B", "r": "", "q": "監査人は，会計上の見積りの不確実性の影響を受ける程度や見積りを行うに当たっての複雑性又は主観性が非常に低い会計上の見積りについては，リスク評価手続及びリスク対応手続を行わなくてもよい。", "a": false, "c": "R４Ⅰ⑰ア", "e": "複雑性又は主観性が非常に低い会計上の見積りの場合，リスク評価手続及びリスク対応手続が広範になることはないが，手続そのものを省略できるわけではない。"}, {"l": 290, "m": "会計上の見積りの監査", "sb": "", "i": "A", "r": "", "q": "会計上の見積りに関して，企業の評価担当者が見積りの対象となる項目について豊富な経験や知識を有する場合や，上位の役職者による査問と承認等の内部統制手続が適切に整備・運用されている場合には，統制リスクが相対的に低くなる。", "a": true, "c": "H24Ⅰ⑮イ", "e": ""}, {"l": 291, "m": "会計上の見積りの監査", "sb": "", "i": "A", "r": "", "q": "監査人は，会計上の見積りの確定額を前年度の財務諸表に計上された見積額と比較検討しなければならない。その結果，両者に差異があったとしても，必ずしも前年度の財務諸表に虚偽表示があったと判断する必要はない。", "a": true, "c": "H29Ⅰ⑨エ", "e": ""}, {"l": 292, "m": "会計上の見積りの監査", "sb": "", "i": "A", "r": "", "q": "監査人は，過年度の会計上の見積りの確定額について，遡及的に検討することが求められている。検討の結果，確定額と過年度の財務諸表における認識額との間の差異が，過年度の財務諸表に虚偽表示があったことを示すこともある。", "a": true, "c": "R６Ⅰ⑰ウ", "e": "差異の原因が，過年度の財務諸表の確定時に利用可能であった情報を経営者が適切に利用しなかった等にある場合，虚偽表示を示すことがある。👉講義レジュメ③-14-2"}, {"l": 293, "m": "会計上の見積りの監査", "sb": "", "i": "A", "r": "", "q": "前年度の会計上の見積りの確定額又は再見積額の監査人による遡及的な検討は，当年度の監査のためのリスク評価手続であるとともに，経営者の前年度の見積りプロセスの有効性の評価に関する監査証拠を入手するための手続にもなり得る。ただし，当該検討は，見積りの時点において利用可能であった情報を基礎として行った前年度における経営者の判断を問題とするものではない。", "a": true, "c": "R４Ⅱ⑮ウ／H30Ⅰ⑮イ", "e": ""}, {"l": 294, "m": "会計上の見積りの監査", "sb": "", "i": "A", "r": "", "q": "会計上の見積りの監査では，経営者による見積りの合理性に関する監査証拠を，リスク評価手続において入手することはできない。", "a": false, "c": "H24Ⅰ⑮オ", "e": "本肢は，リスク評価手続により入手した情報を，リスク対応手続の監査証拠として利用する場合がある（講義レジュメ③-7-6を参照）という，リスク・アプローチの考え方で正誤判断してほしい。"}, {"l": 295, "m": "会計上の見積りの監査", "sb": "", "i": "A", "r": "", "q": "監査人は，会計上の見積り及び関連する注記事項に関して，識別し評価した重要な虚偽表示リスクが特別な検討を必要とするリスクであるかどうかを，見積りの不確実性の影響を受ける程度を考慮して判断する。", "a": true, "c": "R４Ⅰ⑰ウ", "e": "厳密に考えれば，ＳＲであるかどうかを決定する際に考慮する要素は見積りの不確実性だけではない（複雑性や主観性等も考慮する）ため，誤りと判断することもできる。しかし，本試験では，他の肢とのバランスで正しいと判断することが求められた。"}, {"l": 296, "m": "会計上の見積りの監査", "sb": "", "i": "A", "r": "", "q": "監査人は，会計上の見積りについて，当該見積りの不確実性が高いと判断した場合には，特別な検討を必要とするリスクが存在しているとして，監査手続を実施しなければならない。", "a": false, "c": "R６Ⅰ⑰ア／H24Ⅱ⑲ウ", "e": "監査人は，識別したＲＭＭがＳＲであるかどうかを「自らの判断」で決定する。したがって，見積りの不確実性が高いと判断した場合に，必ず，ＳＲとして決定しなければならないわけではない。"}, {"l": 297, "m": "会計上の見積りの監査", "sb": "", "i": "A", "r": "", "q": "経営者が会計上の見積りを行う方法を前年度から変更した場合，算出される測定値が大きく変更されるため，監査人は，当該会計上の見積りを特別な検討を必要とするリスクとして取り扱わなければならない。", "a": false, "c": "H30Ⅰ⑮ア", "e": "本肢の場合は「変化」の固有リスク要因が存在することになるが，この場合も，監査人は，当該会計上の見積りがＳＲであるかどうかを「自らの判断」で決定する。"}, {"l": 298, "m": "会計上の見積りの監査", "sb": "", "i": "A", "r": "", "q": "財務諸表は企業の期末日における財政状態及び期首から期末日までの経営成績を示すものであることから，期末日後に発生した事象によって，会計上の見積りに関する監査手続が追加されることはない。", "a": false, "c": "H26Ⅰ⑬ア", "e": "期末日後から監査報告書日までの間に発生した事象（後発事象）が，会計上の見積りに関する監査証拠を提供することもある。"}, {"l": 299, "m": "会計上の見積りの監査", "sb": "", "i": "A", "r": "", "q": "監査人は会計上の見積りのために経営者が使用した仮定の合理性を評価する際には，経営者が見積りを行った時点において利用可能な情報に基づいて，当該評価を行わなければならない。", "a": false, "c": "H24Ⅱ⑲エ", "e": "監査人は，「監査の時点」において利用可能な情報に基づいて本肢の評価を行う。"}, {"l": 300, "m": "会計上の見積りの監査", "sb": "", "i": "A", "r": "", "q": "会計上の見積りは，決算日において入手可能な情報に基づいて実施するものであることから，決算日後の監査の過程で当該事象の見積額が確定し，当初の見積額との間で差額が生じた場合であっても，監査人は経営者に対して見積額の修正を求める必要はない。", "a": false, "c": "H24Ⅰ⑮ウ", "e": "会計上の見積りは，「財務諸表の作成時点」において入手可能な情報（決算日後の情報を含む）に基づいて実施するものであるため，本肢のような場合，監査人は，経営者に対して見積額の修正を求める（修正後発事象としての対応を求める）ことになる。"}, {"l": 301, "m": "会計上の見積りの監査", "sb": "", "i": "A", "r": "", "q": "経営者が会計上の見積りを行う方法を前年度から変更している場合，監査人は，経営者がどのように会計上の見積りを行ったかの検討において，その変更が恣意的なものではなく相当の理由があるかどうか及び会計上の見積りを行う方法を変更することが認められる状況の変更があったかどうかを判断する。", "a": true, "c": "H29Ⅰ⑨ア", "e": "本肢の検討は，講義レジュメ③-14-12の［補足１］①にある「過年度に使用された見積手法からの変更が適切であるかどうか」の検討に該当する。"}, {"l": 302, "m": "会計上の見積りの監査", "sb": "", "i": "A", "r": "", "q": "会計上の見積りは，経営者の主観的判断を伴うことが多く，重要な虚偽表示のリスクが高いため，監査人は，自らの責任において独自の見積りを実施し，経営者が行った見積りと比較してその差異内容を検討しなければならない。", "a": false, "c": "H23Ⅱ⑬イ", "e": "会計上の見積りについて実施するリスク対応手続には，本肢にある手続も含めて複数あるが，監査人は，それらのリスク対応手続のうち，少なくとも１つを実施しなければならないのであって，本肢の手続の実施が必ず要求されるわけではない。"}, {"l": 303, "m": "会計上の見積りの監査", "sb": "", "i": "A", "r": "", "q": "監査人は，会計上の見積り及び関連する注記事項に関して，重要な虚偽表示リスクを評価した際に，内部統制が有効に運用されていると想定する場合には，関連する内部統制の運用評価手続を実施した上で，リスク対応手続を実施しなければならない。", "a": true, "c": "R４Ⅰ⑰エ", "e": ""}, {"l": 304, "m": "会計上の見積りの監査", "sb": "", "i": "A", "r": "", "q": "監査人は，経営者が会計上の見積りを行った方法に関連する内部統制の運用評価手続を実施した上で，経営者が使用した重要な仮定の合理性を評価するとともに，監査人による見積額又は許容範囲を設定しなければならない。", "a": false, "c": "H29Ⅰ⑨イ", "e": "上２つの問題を参照"}, {"l": 305, "m": "会計上の見積りの監査", "sb": "", "i": "A", "r": "", "q": "監査人は，見積りの不確実性に関する注記事項を評価するために，監査人自身が見積手法，仮定及びデータを設定することがある。このリスク対応手続は，経営者が適用した見積手法，仮定及びデータに対するリスク対応手続とは異なる。", "a": false, "c": "R４Ⅱ⑮イ", "e": "監査人は，見積りの不確実性に関する注記事項を評価するために監査人の見積額又は許容範囲を設定する場合，使用した見積手法，仮定及びデータが適用される財務報告の枠組みに照らして適切であるかどうかを評価するリスク対応手続を実施しなければならないが，当該手続は，経営者が適用した見積手法，仮定及びデータに対するリスク対応手続と同一であるため，本肢は誤りである。"}, {"l": 306, "m": "会計上の見積りの監査", "sb": "", "i": "A", "r": "", "q": "評価した重要な虚偽表示リスクへの対応に当たり，経営者の見積額の合理性を評価するために，監査人は見積りの許容範囲を使用することがあるが，当該許容範囲には全ての見込まれる結果を含めなければならない。", "a": false, "c": "H30Ⅰ⑮エ／R６Ⅰ⑰イ／H24Ⅱ⑲イ", "e": "許容範囲は，全ての見込まれる結果ではなく，合理的であると評価した金額のみが含まれるように設定する。"}, {"l": 307, "m": "会計上の見積りの監査", "sb": "", "i": "A", "r": "", "q": "監査人は，見積額の算定又は算定の支援のために専門家の業務を利用する場合には，当該専門家が高度な専門的知識や客観性等を有していることから，会計上の見積りのために使用した重要な仮定の合理性について評価する必要はない。", "a": false, "c": "H26Ⅰ⑬エ", "e": "監査人は，自らが必要とする監査証拠を入手するために専門家の業務を利用する。したがって，専門家の業務の利用によって，監査人が実施すべき監査手続の省略が可能であるとする本肢は誤りとなる。"}, {"l": 308, "m": "会計上の見積りの監査", "sb": "", "i": "B", "r": "", "q": "監査人は，複数の会計上の見積り若しくは会計上の見積りの全てを総括的に検討すること，又は複数の会計期間を通じて会計上の見積りを検討することによって，経営者の偏向を認識できる場合がある。", "a": true, "c": "H30Ⅰ⑮ウ", "e": ""}, {"l": 309, "m": "会計上の見積りの監査", "sb": "", "i": "B", "r": "", "q": "監査人の見積額とその許容範囲が監査証拠によって裏付けられている場合において，経営者の見積額が当該許容範囲の外にあるときには，経営者の見積額と監査人の許容範囲との最小の差額が虚偽表示となる。", "a": true, "c": "H24Ⅱ⑲オ", "e": ""}, {"l": 310, "m": "会計上の見積りの監査", "sb": "", "i": "B", "r": "", "q": "会計上の見積りの監査において，会社による見積額と監査人による見積額との差額が監査人の許容限度額を超える場合であっても，見積金額誤差であるため，発見した虚偽の表示の集計に含める必要はない。", "a": false, "c": "H24Ⅰ⑮ア", "e": "読み取りが難しい記述であるが，本肢にある「会社による見積額と監査人による見積額との差額が監査人の許容限度額を超える場合」とは，要するに，会社による見積額が監査人の設定した許容範囲の外にある場合のことを指している。したがって，本肢が示す差額は虚偽表示に該当するものであるため，発見した虚偽の表示の集計に含める必要がある。"}, {"l": 311, "m": "会計上の見積りの監査", "sb": "", "i": "A", "r": "", "q": "監査人は，会計上の見積りを行う際に使用された見積手法，重要な仮定及びデータ並びに関連する注記事項が，適用される財務報告の枠組みに準拠した認識，測定及び注記を達成する上で適切であるかどうかについて記載した経営者確認書を入手しなければならず，当該経営者確認書は会計上の見積りに関する監査証拠となる。", "a": true, "c": "H26Ⅰ⑬ウ", "e": ""}, {"l": 312, "m": "会計上の見積りの監査", "sb": "", "i": "A", "r": "", "q": "公正価値の測定について，見積りの不確実性が高いと評価したため，特別な検討を必要とするリスクであると判断した。これに対応する監査手続を実施した結果，経営者の採用した見積り方法，使用されたデータ，見積りの結果は合理的であると判断したため，経営者確認書には特段の記載を求めなかった。", "a": false, "c": "R２Ⅰ⑯ア", "e": "本肢のように見積りの結果が合理的であると判断しても，経営者が見積りを行う際に設定した仮定が重要である場合には，当該仮定に関する経営者確認書を入手しなければならない。"}, {"l": 313, "m": "会計上の見積りの監査", "sb": "", "i": "B", "r": "", "q": "監査人は，会計上の見積りにおけるアサーション・レベルの重要な虚偽表示リスクの評価の根拠を考慮し，当該リスクに対応するリスク対応手続を立案し実施しなければならず，監査調書には当該リスクと実施したリスク対応手続との関連性の記載を要する。", "a": true, "c": "R４Ⅱ⑮エ", "e": ""}, {"l": 314, "m": "会計上の見積りの監査", "sb": "", "i": "B", "r": "", "q": "監査人は，個々の会計上の見積りの合理性に関して結論付ける際に，経営者の偏向が存在する兆候があったとしても，それだけでは虚偽表示とはならないが，その内容と監査への影響に関する監査人の評価を監査調書に記載しなければならない。", "a": true, "c": "R６Ⅰ⑰エ／H24Ⅱ⑲ア", "e": ""}, {"l": 315, "m": "特定項目の監査証拠の入手", "sb": "", "i": "A", "r": "", "q": "監査人は棚卸資産の実在性と状態について，十分かつ適切な監査証拠を入手するため，財務諸表において棚卸資産が重要である場合には実務的に不可能でない限り，実地棚卸の立会を実施しなければならない。", "a": true, "c": "R５Ⅰ⑯ウ", "e": ""}, {"l": 316, "m": "特定項目の監査証拠の入手", "sb": "", "i": "A", "r": "", "q": "監査人は，棚卸資産が財務諸表において重要であったとしても，棚卸資産の実在性に不正リスクを識別していない場合や企業の内部統制が過年度より継続して有効であると評価している場合には，棚卸資産の実地棚卸の立会を省略することができる。", "a": false, "c": "H30Ⅰ⑬ウ", "e": "監査人は，棚卸資産が財務諸表において重要である場合には，不正リスク等が識別されていない場合でも，立会を実施しなければならない。"}, {"l": 317, "m": "特定項目の監査証拠の入手", "sb": "", "i": "A", "r": "", "q": "監査人は，重要な棚卸資産に関する実在性と状態について十分かつ適切な監査証拠を入手するために，実務的に不可能でない限り実地棚卸の立会を実施するが，その目的には，実地棚卸結果を記録し管理するための経営者による指示と手続を評価することが含まれる。", "a": true, "c": "H26Ⅱ⑩ア", "e": ""}, {"l": 318, "m": "特定項目の監査証拠の入手", "sb": "", "i": "A", "r": "", "q": "実地棚卸に対する立会は，被監査会社が行う実地棚卸の実施状況を監査人が観察することによって，棚卸資産の実在性に関する監査証拠を入手するとともに，棚卸資産の品質の低下や陳腐化を識別するための監査証拠を入手することを目的とする監査手続である。", "a": true, "c": "H27Ⅱ⑫ア", "e": "なお，本肢にある「棚卸資産の品質の低下や陳腐化を識別するための監査証拠」とは，棚卸資産の状態に関する監査証拠を指している。"}, {"l": 319, "m": "特定項目の監査証拠の入手", "sb": "", "i": "A", "r": "", "q": "監査人は，実地棚卸の立会において，行われている棚卸手続の実施状況の観察により，経営者の指示や実地棚卸手続が適切にデザインされ，業務に適用されているという監査証拠を入手することができる。", "a": true, "c": "R６Ⅰ⑯イ", "e": ""}, {"l": 320, "m": "特定項目の監査証拠の入手", "sb": "", "i": "A", "r": "", "q": "棚卸資産の実地棚卸の立会において棚卸資産の実査を実施することは，棚卸資産の評価の妥当性に関する十分かつ適切な監査証拠を入手することができる。", "a": true, "c": "H26Ⅰ⑫ウ／R４Ⅱ⑭イ", "e": ""}, {"l": 321, "m": "特定項目の監査証拠の入手", "sb": "", "i": "A", "r": "", "q": "実務上の理由により，経営者が棚卸資産の実地棚卸を期末日以外の日に実施することについて，たとえ棚卸資産の継続記録が保持されていない場合であっても，監査人は，棚卸資産の増減に係る内部統制を考慮して，監査上適切であるかどうかを判断する。", "a": true, "c": "H26Ⅱ⑩エ", "e": ""}, {"l": 322, "m": "特定項目の監査証拠の入手", "sb": "", "i": "A", "r": "", "q": "監査人は実務上の理由により実地棚卸を期末日以前の日に実施することが適切であると判断して，期末日以前の日に実地棚卸の立会を実施した場合，その結果を期末日まで更新して利用するための合理的な根拠とするため，期末日までの残余期間については，追加的な実証手続を実施しなければならない。", "a": true, "c": "R５Ⅰ⑯エ", "e": ""}, {"l": 323, "m": "特定項目の監査証拠の入手", "sb": "", "i": "A", "r": "", "q": "監査人は，予期し得ない事態により実地棚卸の立会を実施することができない場合には，代替的監査手続を実施しなければならない。それには，代替日での実地棚卸又はその立会は含まれない。", "a": false, "c": "R３⑯ア", "e": "本肢の「代替的監査手続」には，代替日での実地棚卸又はその立会が含まれる。"}, {"l": 324, "m": "特定項目の監査証拠の入手", "sb": "", "i": "A", "r": "", "q": "監査人は，第三者が保管し管理している棚卸資産が財務諸表において重要である場合，当該第三者の信頼性及び客観性の程度にかかわらず，実査及び当該第三者に対する確認を実施することにより，棚卸資産の実在性及び状態について十分かつ適切な監査証拠を入手しなければならない。", "a": false, "c": "H26Ⅱ⑩ウ", "e": "棚卸資産を保管している第三者の信頼性及び客観性について疑義が生じる情報を入手した場合，監査人は，状況に応じて，第三者の確認を実施しないこともある。"}, {"l": 325, "m": "特定項目の監査証拠の入手", "sb": "", "i": "C", "r": "", "q": "監査人は，識別した訴訟事件に関する重要な虚偽表示リスクを評価する場合，又は実施した監査手続によって重要な訴訟事件が存在する可能性があると判断した場合には，実務的に不可能でない限り，企業の顧問弁護士と面談しなければならない。", "a": false, "c": "R２Ⅱ⑮イ", "e": "本肢の場合に要求される監査手続は，質問書による企業の顧問弁護士との直接のコミュニケーションであり，面談までは要求されていない。"}, {"l": 326, "m": "特定項目の監査証拠の入手", "sb": "", "i": "C", "r": "", "q": "監査人は，実施した監査手続によって重要な訴訟事件が存在する可能性があると判断した場合には，法令等又は各法律専門家団体により顧問弁護士が監査人と直接コミュニケーションをすることが禁止されている場合を除き，顧問弁護士に対して経営者が作成した質問書を直接発送し，気付いているすべての訴訟事件等について，当該訴訟事件等の結果等に関する評価及び財務上の影響に関する見積りとともに，監査人に知らせるように依頼しなければならない。", "a": true, "c": "H27Ⅰ⑫ア", "e": ""}, {"l": 327, "m": "経営者確認書", "sb": "", "i": "A", "r": "", "q": "監査人は，同一の会社に対し会社法監査と金融商品取引法監査の両方を実施しているときには，金融商品取引法監査に対する経営者確認書のみを入手すればよい。", "a": false, "c": "R３⑰イ", "e": "経営者確認書は，発行する監査報告書ごとにそれぞれ入手しなければならない。"}, {"l": 328, "m": "経営者確認書", "sb": "", "i": "A", "r": "", "q": "経営者からの書面による確認は，監査の終了時に限らず，監査人の判断により適切な時期に実施することができる。", "a": true, "c": "H25Ⅰ①オ",
