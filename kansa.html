"e": ""}, {"l": 329, "m": "経営者確認書", "sb": "", "i": "A", "r": "", "q": "監査人が必要と判断した事項を確認するために経営者から書面又は電磁的記録で入手することの目的の一つは，財務諸表又は財務諸表における特定のアサーションに関して入手した他の監査証拠を裏付けることである。", "a": true, "c": "H30Ⅰ⑯エ", "e": ""}, {"l": 330, "m": "経営者確認書", "sb": "", "i": "A", "r": "", "q": "経営者確認書は，特定の事項を確認するため又は他の監査証拠を裏付けるために経営者が監査人に提出する書面又は電磁的記録による陳述なので，財務諸表監査に関連して監査人が入手しなければならない情報ではあるが監査証拠とはならない。", "a": false, "c": "R２Ⅱ⑮エ", "e": "経営者確認書で入手した陳述は監査証拠である。"}, {"l": 331, "m": "経営者確認書", "sb": "", "i": "A", "r": "", "q": "監査人は，ある特定の監査要点について，重要な監査手続を実施できない場合には，当該監査要点に関して記載された経営者確認書を入手することによって，他の監査証拠を補完して無限定適正意見を表明することができる。", "a": false, "c": "R３⑰エ／H27Ⅱ⑫エ", "e": "経営者確認書を入手したことをもって，特定のアサーションに関する監査手続の代替としてはならない。"}, {"l": 332, "m": "経営者確認書", "sb": "", "i": "A", "r": "", "q": "監査人は，経営者から入手した特定のアサーションに関する陳述をもって，当該アサーションに関する十分かつ適切な監査証拠としてはならない。", "a": true, "c": "H24Ⅱ⑱ウ", "e": ""}, {"l": 333, "m": "経営者確認書", "sb": "", "i": "A", "r": "", "q": "経営者確認書は，財務諸表監査において必要な監査証拠であるため，経営者から特定のアサーションに関して信頼性のある経営者確認書を入手した場合，当該アサーションに関する監査手続の範囲を縮小することができる。", "a": false, "c": "H27Ⅰ⑭ア", "e": "経営者確認書の入手は，監査人が入手しなければならない他の監査証拠の種類又は範囲には影響を及ぼさない。"}, {"l": 334, "m": "経営者確認書", "sb": "", "i": "A", "r": "", "q": "経営者確認書の入手が義務づけられた背景には，利害関係者に真実かつ公正な財務諸表を提供するために，財務諸表の作成者と監査人の協力関係が重視されたことがあり，こうした協力関係を経営者の立場から明らかにするために経営者確認書が作成された。", "a": true, "c": "H30Ⅰ⑪ア", "e": ""}, {"l": 335, "m": "経営者確認書", "sb": "", "i": "B", "r": "", "q": "監査人が，二重責任の原則について経営者が理解していることを確認する必要があることから，経営者確認書には，財務諸表に対する経営者の責任と当該財務諸表に関する意見表明に対する監査人の責任の双方が記載されている。", "a": false, "c": "R７Ⅰ②イ／R３⑰ア", "e": "監査報告書とは違い，経営者確認書では監査人の責任は記載されない。"}, {"l": 336, "m": "経営者確認書", "sb": "", "i": "B", "r": "", "q": "経営者確認書は，財務諸表に重要な影響を及ぼす事項について，経営者の意思や判断の内容及び根拠を確認するものであることから，監査人が特別な検討を必要とするリスクとして判断した事項については記載を求めなければならない。", "a": false, "c": "H24Ⅰ⑭ウ", "e": "ＳＲとして判断した事項について経営者確認書に記載を求める規定は存在しない（＝記載を求めるか否かは，監査人の判断により決定される）。なお，前段の記述は正しい。"}, {"l": 337, "m": "経営者確認書", "sb": "", "i": "B", "r": "", "q": "監査人は，財務諸表に対する最終的な責任を有し，確認事項についての知識を有する企業の最高経営責任者や最高財務責任者に対して経営者確認書を要請しなければならないが，これらの役職名を使用していない企業についてはこれらに相当する役職者に対して要請することができる。", "a": true, "c": "H27Ⅰ⑭イ", "e": ""}, {"l": 338, "m": "経営者確認書", "sb": "", "i": "B", "r": "", "q": "経営者確認書は，企業の財務諸表監査に関連して監査人が求める必要な情報であり，監査証拠である。その日付は，財務諸表に対する監査報告書日より後であってはならず，通常，監査報告書の日付とする。", "a": true, "c": "H30Ⅰ⑯イ／H27Ⅰ⑭エ", "e": ""}, {"l": 339, "m": "経営者確認書", "sb": "", "i": "B", "r": "", "q": "監査人は，経営者の交代等の特別の事情がある場合には，監査報告書日より後の日付の経営者確認書を入手することができる。", "a": false, "c": "H24Ⅱ⑱イ", "e": "監査人は，いかなる場合であっても，監査報告書日より後の日付で経営者確認書を入手することはできない。"}, {"l": 340, "m": "経営者確認書", "sb": "", "i": "A", "r": "", "q": "監査人は，経営者の誠実性について深刻な疑義があり，財務諸表に関する適切な陳述が得られないリスクがある場合には，意見を表明せず，監査契約を解除しなければならない。", "a": false, "c": "H24Ⅱ⑱ア", "e": "本肢のような場合で，監査役等による適切な是正措置が講じられない場合，監査人は，監査契約の解除を検討することがあるが，必ず解除するとは限らない。"}, {"l": 341, "m": "経営者確認書", "sb": "", "i": "A", "r": "", "q": "監査人は，経営者に対して，適用される財務報告の枠組みに準拠して財務諸表を作成する責任を果たした旨の経営者確認書を提出するように要請しなければならないが，当該確認事項に信頼性がないと判断した場合，又は当該事項について経営者から確認が得られない場合には，不適正意見又は限定付適正意見を表明しなければならない。", "a": false, "c": "H30Ⅰ⑯ア", "e": "本肢のような場合，もはや監査実施の前提が成立していない状況であり，意見表明の基礎を形成することが不可能であることから，監査人は，意見を表明してはならない。"}, {"l": 342, "m": "経営者確認書", "sb": "", "i": "A", "r": "", "q": "監査人は，経営者確認書において，監査実施の基礎となる経営者の責任を果たした旨の確認が得られない場合，意見表明をしてはならない。", "a": true, "c": "R３⑰ウ", "e": ""}, {"l": 343, "m": "経営者確認書", "sb": "", "i": "A", "r": "", "q": "経営者確認書において，監査に関連して監査人が依頼した全ての情報を入手する機会を監査人に提供した旨の確認が得られない場合，経営者が監査に関連する全ての情報を提供したと結論づけることができないため，監査人は意見を表明してはならない。", "a": true, "c": "H28Ⅱ⑱エ", "e": ""}, {"l": 344, "m": "経営者確認書", "sb": "", "i": "A", "r": "", "q": "監査人は，経営者確認書において確認を要請した事項について経営者によって変更が加えられている場合には，かかる変更を理由として当該確認を得られなかったものとしなければならない。", "a": false, "c": "H27Ⅰ⑭ウ／H24Ⅱ⑱オ", "e": "本肢の場合であっても，そのことが，要請した事項の確認が得られなかったことを必ずしも意味するわけではない。"}, {"l": 345, "m": "経営者確認書", "sb": "", "i": "B", "r": "", "q": "監査人は，監査の過程で識別した虚偽表示がない場合又は虚偽表示が識別されたものの，その及ぼす影響が明らかに重要ではない場合を除き，監査人が経営者に要請した経営者確認書の草案について，監査役等とコミュニケーションを行わなければならない。", "a": false, "c": "H30Ⅰ⑯ウ", "e": "経営者確認書の草案に関する監査役等とのコミュニケーションは，いかなる場合でも行わなければならないものである。"}]}, {"n": 4, "name": "監査報告論", "qs": [{"l": 1, "m": "監査意見－総論", "sb": "", "i": "A", "r": "", "q": "適正表示の枠組みでは，適用される財務報告の枠組みの要求事項に準拠して財務諸表が作成されたとしても，監査人は，財務諸表が適正に表示されていると認めない場合がある。このような場合においては，たとえ具体的に要求されている以上の注記が行われたとしても財務諸表の適正表示が達成されることはない。", "a": false, "c": "R２Ⅱ⑯イ", "e": "適正表示の枠組みの場合，具体的に要求されている以上の注記が行われることによって財務諸表の適正表示が達成されることがある。なお，前段の記述は正しい。"}, {"l": 2, "m": "監査意見－総論", "sb": "", "i": "A", "r": "", "q": "適正性に関する意見であれ，準拠性に関する意見であれ，財務諸表に対する監査意見は，財務諸表が，全ての重要な点において，適用される財務報告の枠組みに準拠して作成されているかどうかについて表明される。", "a": true, "c": "R７Ⅰ①ア", "e": "👉講義レジュメ④-1-1"}, {"l": 3, "m": "監査意見－総論", "sb": "", "i": "A", "r": "", "q": "監査人は，無限定適正意見を表明する場合，経営者の作成した財務諸表が，一般に公正妥当と認められる企業会計の基準に準拠して，企業の財政状態，経営成績及びキャッシュ・フローの状況をすべての重要な点において適正に表示している旨，及び財務諸表に重要な虚偽表示が存在しない旨の意見を表明しなければならない。", "a": false, "c": "H27Ⅰ⑮ア", "e": "引っかかりやすいので注意。無限定適正意見を表明する場合でも，「財務諸表に重要な虚偽表示が存在しない」旨の意見は表明されない。"}, {"l": 4, "m": "監査意見－総論", "sb": "", "i": "A", "r": "", "q": "監査人は，特別の利用目的に適合した会計の基準により作成される財務諸表の適正性に関する意見を表明する場合には，当該財務諸表に重要な虚偽の表示が存在しない旨を記載しなければならない。", "a": false, "c": "H30Ⅱ⑮ア", "e": "一般目的であろうが特別目的であろうが，適正性意見を表明する場合において，「当該財務諸表に重要な虚偽表示が存在しない旨」を記載することはない。"}, {"l": 5, "m": "監査意見－総論", "sb": "", "i": "A", "r": "", "q": "適正性に関する意見であれ，準拠性に関する意見であれ，無限定の意見が表明される場合には，財務諸表に重要な虚偽表示が存在しないことに関する合理的な保証が財務諸表利用者に与えられることになる。", "a": true, "c": "R７Ⅰ①ウ／H28Ⅰ⑫ウ", "e": ""}, {"l": 6, "m": "監査意見－総論", "sb": "", "i": "A", "r": "", "q": "「第一監査の目的」では，財務諸表が「企業の財政状態，経営成績及びキャッシュ・フローの状況をすべての重要な点において適正に表示しているか」どうかについて意見を表明するように規定しているが，これは実際に貸借対照表，損益計算書及びキャッシュ・フロー計算書に対して意見を表明するという意味ではないため，監査人は，監査の対象となる財務諸表の種類がどのような構成であったとしても，監査報告書においては同様の文言で意見を表明する必要がある。", "a": false, "c": "H28Ⅰ⑫ア／H24Ⅱ②イ", "e": "たしかに，財務諸表に対する適正性意見は財務諸表全体に対して表明するものである。しかし，金融商品取引法監査と会社法監査のように，監査の対象となる財務諸表の種類が異なれば，それに応じて意見の表明の形式は異なるものとなる。"}, {"l": 7, "m": "監査意見－総論", "sb": "", "i": "B", "r": "", "q": "監査人は，意見の表明に先立ち，自らの意見が一般に公正妥当と認められる監査の基準に準拠して適切に形成されていることを確かめるため，意見表明に関する審査を受けなければならないが，意見不表明の場合には，当該審査を受ける必要はない。", "a": false, "c": "H31Ⅰ⑱イ", "e": "審査は，監査人による意見形成の適切性を検討するために実施するものであるため，監査人は，意見を表明するか否かにかかわらず審査を受けなければならない。"}, {"l": 8, "m": "監査意見－総論", "sb": "", "i": "A", "r": "", "q": "監査人は，無限定適正意見を表明するかどうかの判断に当たっては，採用された会計方針が一般に公正妥当と認められる企業会計の基準に準拠して継続的に適用されていることを確かめることのみならず，その適用方法が会計事象を適切に反映するものであるかどうかについても評価しなければならない。", "a": true, "c": "H27Ⅰ⑮イ／H25Ⅰ⑮オ", "e": ""}, {"l": 9, "m": "監査意見－総論", "sb": "", "i": "A", "r": "", "q": "財務諸表の適正性を判断するに当たっては，監査人は経営者が採用した会計方針が会計基準のいずれかに準拠し，継続的に適用されているかを評価することにより，実質的な判断を行わなければならない。", "a": false, "c": "H25Ⅰ①ウ", "e": "本肢が示す評価事項は，実質的判断における評価事項ではない。"}, {"l": 10, "m": "監査意見－総論", "sb": "", "i": "A", "r": "", "q": "監査人が財務諸表の適正性に関する意見を表明する際に必要となる判断事項は，経営者が採用した会計方針が会計基準に準拠し，継続的に適用されているかを判断すること，及びその会計方針の選択や適用方法が会計事象や取引の実態を適切に反映するものであるかを判断することの二つである。", "a": false, "c": "R２Ⅰ①イ", "e": "本肢が示す判断事項以外に，財務諸表の表示方法が適切であるかどうかも判断しなければならない。"}, {"l": 11, "m": "監査意見－総論", "sb": "", "i": "A", "r": "", "q": "監査人は，適正性に関する意見の表明に当たっては，経営者による会計方針の選択や適用の方法が会計事象や取引の実態を適切に反映するものであるかどうかの判断を求められるが，準拠性に関する意見の表明に当たっては，そのような実質的判断は求められない。", "a": false, "c": "R７Ⅰ①イ／H29Ⅰ⑪エ", "e": "準拠性に関する意見を表明する場合にも，実質的判断が求められる。"}, {"l": 12, "m": "監査意見－総論", "sb": "", "i": "A", "r": "", "q": "平成２６年の改訂では，従来の適正性に関する意見表明の形式に加え，準拠性に関する意見表明の形式が導入された。適正性に関する意見表明において，監査人は，財務諸表の表示が利用者に理解されるために適切か否かの判断に当たり，財務諸表が全体として適切に表示されているか否かについての一歩離れての評価を行うが，準拠性に関する意見表明では，このような一歩離れての評価は行わないという違いがある。", "a": true, "c": "R６Ⅱ⑪ア／H28Ⅰ⑫エ／H31Ⅱ⑫イ", "e": "準拠性に関する意見表明の形式が導入された年度については👉講義レジュメ①-1-13"}, {"l": 13, "m": "監査意見－総論", "sb": "", "i": "A", "r": "", "q": "監査人は，適正表示の枠組みであれ，準拠性の枠組みであれ，適用される財務報告の枠組みにおいて具体的に要求されている以上の開示を，経営者が必要に応じて行っているかどうかを確かめなければならない。", "a": false, "c": "R７Ⅰ①エ", "e": "本肢にある，「適用される財務報告の枠組みにおいて具体的に要求されている以上の開示を行っているかどうかの検討」とは，いわゆる一歩離れて行う評価のことであり，準拠性の監査では行われない。"}, {"l": 14, "m": "監査意見－総論", "sb": "", "i": "A", "r": "", "q": "新しい取引形態の出現など，適用すべき企業会計の基準が必ずしも明確でない場合であっても，監査によって財務諸表に信頼性が付与される。", "a": true, "c": "R２Ⅱ①エ／H26Ⅱ⑬ア", "e": "本肢の場合でも，監査人は，経営者が採用した会計方針及びその適用方法が会計事象や取引の実態を適切に反映するものであるかどうかを判断した上で，意見を表明（財務諸表の信頼性を付与）する。"}, {"l": 15, "m": "監査意見－総論", "sb": "", "i": "A", "r": "", "q": "監査報告書は，監査人の監査範囲に制約があったときにはその旨を記載することが求められており，新たな会計事象や取引について適用すべき会計基準が明確でない場合，監査人は当該事項の財務諸表への影響を考慮して監査範囲の制約による除外事項を付した監査意見を表明する。", "a": false, "c": "H24Ⅰ⑱オ", "e": "本肢のような場合でも，実質的な判断により十分かつ適切な監査証拠を入手できた場合には，監査範囲による除外事項を付す必要はない。"}, {"l": 16, "m": "監査意見－総論", "sb": "", "i": "A", "r": "", "q": "監査人は，財務諸表の適正性を判断する際に，会計基準への準拠性，会計方針の継続性及び表示方法の基準への準拠性が求められているが，現行の会計基準に詳細な定めのない場合には，監査人が財務諸表の適正性を自己の判断で行ってはならない。", "a": false, "c": "H31Ⅱ①ア", "e": "本肢の場合，監査人は，財務諸表の適正性を自己の判断で行うことになる。"}, {"l": 17, "m": "監査意見－総論", "sb": "", "i": "A", "r": "", "q": "監査人は，仮想通貨取引といった新しい会計取引が行われている場合，財務諸表の適正性を判断するに当たり，経営者による会計方針の選択や適用方法が，会計事象や取引の実態を適切に反映するものであるかどうかを自己の判断で評価しなければならない。", "a": true, "c": "H31Ⅰ⑱エ／H30Ⅰ⑪イ／H28Ⅱ⑱ア", "e": ""}, {"l": 18, "m": "監査意見－総論", "sb": "", "i": "A", "r": "", "q": "監査人は，準拠性の枠組みで作成された財務諸表に対して監査意見を表明する場合には，準拠性の枠組みにおいて要求される事項が遵守されているかどうかのみを評価すればよい。", "a": true, "c": "R２Ⅰ⑰ア／H24Ⅱ⑰ウ", "e": ""}, {"l": 19, "m": "監査意見－総論", "sb": "", "i": "A", "r": "", "q": "財務諸表の適正表示を達成するために必要な表示及び注記が行われているかどうかに対する監査人の評価には，必要な情報が含まれているかどうかの判断，関連しない情報が財務諸表の全体的な表示を損なっていないかどうかの判断のみならず，有用な情報を曖昧にする情報が財務諸表の全体的な表示を損なっていないかどうかの判断を含めなければならない。", "a": true, "c": "R２Ⅱ⑯ア", "e": ""}, {"l": 20, "m": "監査報告書－総論", "sb": "", "i": "B", "r": "", "q": "監査報告書は，監査人が監査した財務諸表に対して信頼性を付与するとともに監査人自らの責任を明確にする機能を有している。", "a": true, "c": "H24Ⅰ⑱イ", "e": ""}, {"l": 21, "m": "我が国の財務諸表監査制度における監査報告書の基本形", "sb": "", "i": "A", "r": "", "q": "監査人は，監査報告書において，監査人の意見，意見の根拠，経営者及び監査役等の責任，監査人の責任を明瞭かつ簡潔にそれぞれを区分した上で，記載しなければならない。ただし，これらの項目は，「監査意見」区分及び「意見の根拠」区分を除き，想定利用者にとっての項目の相対的な重要性に基づいた順に記載される。", "a": true, "c": "R７Ⅰ⑱ウ", "e": ""}, {"l": 22, "m": "我が国の財務諸表監査制度における監査報告書の基本形", "sb": "", "i": "A", "r": "", "q": "財務諸表監査の対象は，財務諸表本体と財務諸表の注記における財務数値の部分である。", "a": false, "c": "H24Ⅱ③ア", "e": "財務諸表の注記に記載されている全ての内容が財務諸表監査の対象である（財務数値以外の記載も含まれる）。"}, {"l": 23, "m": "我が国の財務諸表監査制度における監査報告書の基本形", "sb": "", "i": "A", "r": "", "q": "財務諸表監査を実施した公認会計士は，監査報告書において，我が国における職業倫理に関する規定に従って，被監査会社から独立しており，また，監査人としてのその他の倫理上の責任を果たしている旨を記載しなければならない。", "a": true, "c": "R６Ⅱ③ウ／R４Ⅰ①イ／H25Ⅰ⑮ウ", "e": ""}, {"l": 24, "m": "我が国の財務諸表監査制度における監査報告書の基本形", "sb": "", "i": "A", "r": "", "q": "監査人は，監査報告書上で一般に公正妥当と認められる監査の基準に準拠した旨を記載するに当たって，監査基準，監査実務に関する全般的な指針，並びに個々の監査業務に関連する他の全ての監査基準報告書及び他の監査実務指針の要求事項を遵守しなければならない。", "a": true, "c": "R５Ⅰ⑪ア", "e": ""}, {"l": 25, "m": "我が国の財務諸表監査制度における監査報告書の基本形", "sb": "", "i": "A", "r": "", "q": "無限定適正意見を表明する監査報告書には，財務諸表の作成に対する経営者の責任と当該財務諸表に対する意見を表明する監査人の責任は明瞭に記載されるが，二重責任という言葉は明示されない。", "a": true, "c": "H25Ⅱ①イ", "e": ""}, {"l": 26, "m": "我が国の財務諸表監査制度における監査報告書の基本形", "sb": "", "i": "A", "r": "", "q": "財務諸表に対する経営者の責任には，会計帳簿や会計記録の妥当性を評価することが含まれることから，監査報告書の「財務諸表に対する経営者及び監査役等の責任区分」の区分においても，これらが妥当である旨が記載される。", "a": false, "c": "H25Ⅰ⑰ウ", "e": "本肢にある内容は，財務諸表の作成責任や内部統制の整備及び運用の責任に当然に含まれる内容であるため，監査報告書に記載されない。"}, {"l": 27, "m": "我が国の財務諸表監査制度における監査報告書の基本形", "sb": "", "i": "A", "r": "", "q": "財務諸表に対する経営者及び監査役等の責任区分には，監査の前提に関する利用者の理解に資するために，経営者が，適用される財務報告の枠組みに準拠して財務諸表を作成する責任を有すること，並びに不正又は誤謬による重要な虚偽表示のない財務諸表の作成に必要な内部統制の整備及び運用に対して責任を有することが必ず記載されなければならない。", "a": true, "c": "H31Ⅰ⑲イ／H29Ⅱ③エ", "e": ""}, {"l": 28, "m": "我が国の財務諸表監査制度における監査報告書の基本形", "sb": "", "i": "A", "r": "", "q": "準拠性の枠組みに基づく財務諸表の監査報告書においても，財務諸表に対する経営者及び監査役等の責任区分に，不正又は誤謬による重要な虚偽表示のない連結財務諸表を作成し適正に表示するために経営者が必要と判断した内部統制を整備及び運用することが経営者の責任に含まれる旨を必ず記載しなければならない。", "a": false, "c": "H25Ⅱ⑱ウ", "e": "準拠性の監査の場合は，本肢にある内容の「作成し適正に表示する」という箇所を「作成する」に変えて監査報告書に記載する必要がある。"}, {"l": 29, "m": "我が国の財務諸表監査制度における監査報告書の基本形", "sb": "", "i": "A", "r": "", "q": "経営者及び監査役等の責任については，二重責任の原則の観点から，経営者及び監査役等には，財務諸表の作成責任があることを明示しなければならない。", "a": false, "c": "R４Ⅰ⑱ウ", "e": "監査役等は財務諸表を作成する責任を負わないため，そのような記載は行われない。"}, {"l": 30, "m": "我が国の財務諸表監査制度における監査報告書の基本形", "sb": "", "i": "A", "r": "", "q": "上場会社の監査証明に際して公認会計士又は監査法人が作成する監査報告書の記載事項のうち，経営者及び監査役等の責任の区分には，両者がともに財務諸表に重要な虚偽表示がないように内部統制を整備及び運用する責任があることが含まれる。", "a": false, "c": "R５Ⅰ⑤エ", "e": "監査役等は内部統制を整備及び運用する責任を負わないため，そのような記載は行われない。"}, {"l": 31, "m": "我が国の財務諸表監査制度における監査報告書の基本形", "sb": "", "i": "A", "r": "", "q": "財務諸表において継続企業の前提に関する開示がない限り，監査報告書上の経営者及び監査役等の責任の区分には，経営者には継続企業の前提に関する評価及び開示を行う責任がある旨の記載は必要とされない。", "a": false, "c": "R５Ⅱ⑲エ", "e": "本肢の記載は，継続企業の前提に関する開示（注記）の有無にかかわらず行われる。"}, {"l": 32, "m": "我が国の財務諸表監査制度における監査報告書の基本形", "sb": "", "i": "A", "r": "", "q": "監査人は，経営者の責任に加え，監査役等の責任すなわち監査役等の責任は財務報告に係る過程を監視することにある旨を監査報告書に記載しなければならない。", "a": true, "c": "R３④ウ", "e": ""}, {"l": 33, "m": "我が国の財務諸表監査制度における監査報告書の基本形", "sb": "", "i": "A", "r": "", "q": "監査報告書は，財務諸表に対する監査人の意見を表明する手段であるとともに，監査人が自己の意見に関する責任を正式に認める手段でもあるが，監査報告書において監査人の責任の範囲を明確に記載した上で意見を表明することは，監査人自身の利益を擁護するという効果も有する。", "a": true, "c": "H26Ⅱ⑬エ", "e": ""}, {"l": 34, "m": "我が国の財務諸表監査制度における監査報告書の基本形", "sb": "", "i": "A", "r": "", "q": "監査報告書の監査人の責任区分においては，財務諸表に対する監査人の意見表明責任以外にも監査手続の選択及び適用は監査人の判断によることや内部統制の有効性について意見表明するためのものではないことが明示される。", "a": true, "c": "H23Ⅱ⑰イ", "e": ""}, {"l": 35, "m": "我が国の財務諸表監査制度における監査報告書の基本形", "sb": "", "i": "A", "r": "", "q": "監査報告書には，重要性の概念に関する記載が行われるが，監査報告書の利用者は，監査人が監査計画の策定時に決定した重要性の基準値を知ることはできない。", "a": true, "c": "H30Ⅰ①イ", "e": "本肢にある通り，監査報告書には，虚偽表示について，財務諸表利用者の意思決定に影響を与えると合理的に見込まれる場合に重要性があると判断される旨が記載されるが，重要性の基準値そのものが記載されるわけではないため，監査報告書の利用者は，監査人が決定した重要性の基準値を知ることはできない。"}, {"l": 36, "m": "我が国の財務諸表監査制度における監査報告書の基本形", "sb": "", "i": "A", "r": "", "q": "監査人の責任区分には，監査手続が監査人の判断により不正又は誤謬による財務諸表の重要な虚偽表示リスクの評価に基づいて選択及び適用される旨を記載しなければならない。", "a": true, "c": "H31Ⅰ⑲エ", "e": ""}, {"l": 37, "m": "我が国の財務諸表監査制度における監査報告書の基本形", "sb": "", "i": "A", "r": "", "q": "監査報告書における監査人の責任に関する記載事項には，監査人の責任は独立の立場から財務諸表に対する意見を表明することにあること，一般に公正妥当と認められる監査の基準に準拠して監査を行ったこと及び監査が原則として試査によって行われることが含まれている。", "a": false, "c": "H29Ⅰ⑱ア／H25Ⅱ⑱ア", "e": "監査報告書には，監査が原則として試査によって行われる旨の記載は行われない。"}, {"l": 38, "m": "我が国の財務諸表監査制度における監査報告書の基本形", "sb": "", "i": "A", "r": "", "q": "財務諸表の監査は，原則として試査に基づいて行われるが，監査報告書の利用者は，公認会計士が実施した試査の具体的な内容を知ることはできない。", "a": true, "c": "H30Ⅰ①エ", "e": ""}, {"l": 39, "m": "我が国の財務諸表監査制度における監査報告書の基本形", "sb": "", "i": "A", "r": "", "q": "財務諸表監査に併せて内部統制監査を実施している場合であっても，監査報告書の「財務諸表監査における監査人の責任」の区分には，財務諸表監査の目的は内部統制の有効性について意見表明するものではない旨が記載される。", "a": true, "c": "H28Ⅰ⑱ウ／H25Ⅰ⑰エ", "e": ""}, {"l": 40, "m": "我が国の財務諸表監査制度における監査報告書の基本形", "sb": "", "i": "A", "r": "", "q": "無限定適正意見が表明される監査報告書に記載される監査人の責任の記述には，継続企業の前提に関する経営者の評価を検討すること及び監査役等との適切な連携を図ることが含まれる。", "a": true, "c": "H31Ⅱ⑯ア", "e": ""}, {"l": 41, "m": "我が国の財務諸表監査制度における監査報告書の基本形", "sb": "", "i": "A", "r": "", "q": "一般に，監査報告書には区分を設けて利害関係の記載をするが，監査報告書の表題が「独立監査人の監査報告書」となっていること，また監査人に被監査会社との特別の関係がないことを法定しているため，監査報告書に利害関係について記載することは求められているわけではなく，監査人の任意の行為である。", "a": false, "c": "H30Ⅱ⑰エ／H31Ⅰ⑲ア／H26Ⅱ⑬イ", "e": "監査報告書における利害関係の記載は，任意ではなく，公認会計士法により求められているものである。"}, {"l": 42, "m": "我が国の財務諸表監査制度における監査報告書の基本形", "sb": "", "i": "A", "r": "", "q": "我が国において，「その他の事項」の一つに，公認会計士法の規定により要求される利害関係の記載がある。", "a": true, "c": "R７Ⅰ⑳ア", "e": ""}, {"l": 43, "m": "我が国の財務諸表監査制度における監査報告書の基本形", "sb": "", "i": "A", "r": "", "q": "監査人は，監査報告書に「独立監査人の監査報告書」という表題を付すことにより，監査人が独立性についての我が国における職業倫理に関する規定の全てを満たしていることを明らかにしている。", "a": true, "c": "R６Ⅰ⑱ア／R４Ⅰ⑱ア／H25Ⅱ⑱イ", "e": ""}, {"l": 44, "m": "我が国の財務諸表監査制度における監査報告書の基本形", "sb": "", "i": "A", "r": "", "q": "審査は，監査人が十分かつ適切な監査証拠を収集したかどうかを判断する一助となるが，監査報告書日は，監査人がその日付までに気付き，かつ，その日付までに発生した事象や取引の影響を検討したことを利用者に知らせるものであるので，その日付は，関連する審査を完了した日よりも前の日付になることがあり得る。", "a": false, "c": "H29Ⅰ⑱イ", "e": "監査報告書には，財務諸表に対する意見表明の基礎となる十分かつ適切な監査証拠を入手した日よりも前の日付を付してはならない。そのため，監査報告書の日付は，必ず，関連する審査を完了した日以降となる。"}, {"l": 45, "m": "我が国の財務諸表監査制度における監査報告書の基本形", "sb": "", "i": "A", "r": "", "q": "監査人は，監査報告書日を財務諸表の承認日より前の日付とすることはできない。ここで，財務諸表の承認日とは，関連する注記を含む全ての財務諸表が作成されており，認められた権限を持つ者が当該財務諸表に対する責任を認めた日付をいい，我が国では，株主総会又は取締役会による最終承認日となる。", "a": false, "c": "R４Ⅱ⑲イ", "e": "財務諸表の承認日は，株主総会又は取締役会による最終承認日ではなく，経営者確認書の日付である。なお，それ以外の記述は正しい。"}, {"l": 46, "m": "我が国の財務諸表監査制度における監査報告書の基本形", "sb": "", "i": "A", "r": "", "q": "我が国では，監査報告書には，監査人が財務諸表に対する意見表明の基礎となる十分かつ適切な監査証拠を入手した日よりも前の日付を付してはならないとされている。この監査報告書に記載する日付は，取締役会による財務諸表の最終承認の日よりも前の日付になることがあり得る。", "a": true, "c": "H29Ⅰ⑱ウ", "e": "上記の問題の通り，財務諸表の承認日は経営者確認書の日付であり，また，監査報告書の日付は，通常，経営者確認書の日付と同日となる。この点，経営者確認書の入手は，取締役会による財務諸表の最終承認の日よりも前であっても構わないため，監査報告書日が，取締役会による財務諸表の最終承認の日よりも前の日付となることもあり得る。"}, {"l": 47, "m": "我が国の財務諸表監査制度における監査報告書の基本形", "sb": "", "i": "A", "r": "", "q": "監査報告書には契約内容に応じた宛先を記載することが求められているため，監査対象となる財務諸表を作成する企業の機関設計に応じて，監査報告書の提出先を宛先とするが，我が国においては，通常，取締役会となる。", "a": true, "c": "R７Ⅰ⑱ア／H31Ⅰ⑲ウ", "e": ""}, {"l": 48, "m": "我が国の財務諸表監査制度における監査報告書の基本形", "sb": "", "i": "A", "r": "", "q": "金融商品取引法に基づく監査報告書では，株主を宛先とするように規定されている。", "a": false, "c": "H28Ⅰ⑱ア／H25Ⅰ⑰ア", "e": "同上"}, {"l": 49, "m": "我が国の財務諸表監査制度における監査報告書の基本形", "sb": "", "i": "A", "r": "", "q": "監査報告書には，公認会計士又は監査法人の代表者が作成の年月日を付して署名し，かつ，自己の印を押さなければならない。", "a": false, "c": "R７Ⅰ⑱イ", "e": "監査報告書は署名のみ行えばよく，捺印は不要である。"}, {"l": 50, "m": "我が国の財務諸表監査制度における監査報告書の基本形", "sb": "", "i": "A", "r": "", "q": "監査人は，日本でのみ流通することを前提に，日本語で作成された監査報告書であっても，監査事務所の所在地を監査報告書に記載しなければならない。", "a": true, "c": "R３⑲ウ／H29Ⅰ⑱エ", "e": "なお，本肢のような監査報告書の場合は，所在地として，監査責任者が執務する事業所の都市名又は登記されている事業所名を記載する。"}, {"l": 51, "m": "我が国の財務諸表監査制度における監査報告書の基本形", "sb": "", "i": "A", "r": "", "q": "監査人が，監査報告書において，我が国における一般に公正妥当と認められる監査の基準に基づいて財務諸表に対して意見表明する責任に加えて，その他の報告責任についても記載する場合，財務諸表監査とは別の区分を設けなければならない。", "a": true, "c": "R５Ⅱ⑳イ", "e": "なお，その他の報告責任を記載する区分には，「法令等に基づくその他の報告」又はその区分の記載内容に応じた適切な他の見出しを付す。"}, {"l": 52, "m": "我が国の財務諸表監査制度における監査報告書の基本形", "sb": "", "i": "A", "r": "", "q": "適用される財務諸表の枠組みでは要求されないが，法令等によって財務諸表と共に表示することが求められる補足的な情報が監査されていないという事実は，当該補足的な情報を通読しなければならないという監査人の責任を免除するものではない。", "a": true, "c": "H26Ⅱ⑫ア", "e": ""}, {"l": 53, "m": "我が国の財務諸表監査制度における監査報告書の基本形", "sb": "", "i": "A", "r": "", "q": "財務諸表がある財務報告の枠組みに準拠して作成されるとともに，注記において他の財務報告の枠組みを遵守している程度について記載している場合に，当該記載は，財務諸表と明確に区別することができないときには，監査意見の対象となる。", "a": true, "c": "R２Ⅱ⑯ウ", "e": "例えば，ある国の財務報告の枠組みに準拠して作成されている財務諸表において，追加的に，注記により国際会計基準をどの程度遵守しているかを記載する場合がある。このような記載は補足的な情報とみなされることがあり，財務諸表と明確に区別することができない場合には，監査意見の対象になる。"}, {"l": 54, "m": "我が国の財務諸表監査制度における監査報告書の基本形", "sb": "", "i": "A", "r": "", "q": "財務諸表が二つの財務報告の枠組みに準拠して作成される場合，監査人は財務諸表をそれぞれの枠組みについて別個に検討するため，一つの枠組みについては無限定意見を表明し，もう一つの枠組みについては否定的意見を表明することもありうる。", "a": true, "c": "R２Ⅰ⑰ウ／H25Ⅱ⑱エ", "e": ""}, {"l": 55, "m": "我が国の財務諸表監査制度における監査報告書の基本形", "sb": "", "i": "A", "r": "", "q": "監査人は，一つの監査報告書において，複数の財務報告の枠組みに基づいて作成された財務諸表に対する監査意見を表明する場合，同一の意見を表明しなければならない。", "a": false, "c": "R６Ⅰ⑲エ", "e": "上記の問題参照"}, {"l": 56, "m": "我が国の財務諸表監査制度における監査報告書の基本形", "sb": "", "i": "A", "r": "", "q": "監査人が，我が国において一般に公正妥当と認められる監査の基準に準拠して監査を行うことが求められている場合，それに加えて，監査の実施に際し，他の監査の基準も遵守することがある。この場合，我が国において一般に公正妥当と認められる監査の基準に加えて他の監査の基準に準拠している旨を監査報告書に記載しなければならない。", "a": false, "c": "R７Ⅰ⑱エ", "e": "本肢の記載は，一定の条件を満たした場合にのみ行うことができる。なお，前段の記述は正しい。"}, {"l": 57, "m": "我が国の財務諸表監査制度における監査報告書の基本形", "sb": "", "i": "A", "r": "", "q": "監査人は，監査を実施するに当たって，我が国において一般に公正妥当と認められる監査の基準に準拠することが求められているため，国際監査基準や特定の国の監査基準に準拠して監査を実施することはできない。", "a": false, "c": "R５Ⅰ⑪ウ", "e": "監査人は，我が国において一般に公正妥当と認められる監査の基準に加えて，国際監査基準や特定の国の監査基準にも準拠して監査を実施することがある。"}, {"l": 58, "m": "除外事項付意見を表明する場合の監査報告書", "sb": "", "i": "A", "r": "", "q": "意見に関する除外事項を付した限定付適正意見を表明するためには，識別された虚偽表示が，監査計画の策定時に決定した重要性の基準値を超えるが広範性がない，という条件を満たす必要がある。", "a": false, "c": "H26Ⅱ⑬ウ", "e": "虚偽表示の金額的重要性の判断は，監査計画の策定時に決定した重要性の基準値との比較で行われるとは限らず，改訂後の重要性の基準値との比較で行われることもある。また，本問の出題意図からは外れるが，虚偽表示の重要性の判断においては，金額的な重要性のみならず，質的な重要性も考慮しなければならないため，虚偽表示が重要性の基準値を超えていなくとも，当該虚偽表示が質的な観点から重要であると判断した場合には，限定付適正意見を表明することがあり得る。いずれにしても，本肢は誤りとなる。"}, {"l": 59, "m": "除外事項付意見を表明する場合の監査報告書", "sb": "", "i": "A", "r": "", "q": "財務諸表に及ぼす虚偽表示の影響が，個別に又は集計すると重要な金額となる場合には，監査人は，否定的意見を表明しなければならない。", "a": false, "c": "H25Ⅱ⑲ア", "e": "本肢の場合であっても，広範性が認められない場合には，否定的意見ではなく限定意見を表明することになる。"}, {"l": 60, "m": "除外事項付意見を表明する場合の監査報告書", "sb": "", "i": "A", "r": "", "q": "監査人は，経営者が採用した会計方針の選択及びその適用方法，財務諸表の表示方法に関して，重要な虚偽表示には該当しないが，不適切なものがあると判断した場合，除外事項を付した限定付適正意見を表明しなければならない。", "a": false, "c": "R５Ⅰ⑱ア", "e": "経営者が採用した会計方針の選択及びその適用方法，財務諸表の表示方法に関して不適切なもの，すなわち虚偽表示があっても，当該虚偽表示に重要性がなければ，無限定適正意見を表明する。"}, {"l": 61, "m": "除外事項付意見を表明する場合の監査報告書", "sb": "", "i": "A", "r": "", "q": "監査人は，注記事項に重要な未修正の虚偽表示があり，その影響が利用者の財務諸表の理解に不可欠であると判断した場合には，不適正意見を表明しなければならない。", "a": true, "c": "R３⑲エ", "e": "注記事項の未修正の虚偽表示による影響が，利用者の財務諸表の理解に不可欠であると判断した場合は，当該虚偽表示による影響に広範性があると判断することになる。"}, {"l": 62, "m": "除外事項付意見を表明する場合の監査報告書", "sb": "", "i": "A", "r": "", "q": "監査人は，限定付適正意見を表明する理由が，たとえ無限定適正意見の基礎となる十分かつ適切な監査証拠を入手できないことであっても，入手した監査証拠が監査人の限定付適正意見の基礎を得るために十分かつ適切なものであると判断した旨を監査報告書に記載しなければならない。", "a": true, "c": "R４Ⅱ⑰エ／R２Ⅱ⑰エ", "e": ""}, {"l": 63, "m": "除外事項付意見を表明する場合の監査報告書", "sb": "", "i": "A", "r": "", "q": "監査人は，意見に関する除外事項をもとに限定付適正意見を表明する場合には，意見の根拠において，当該除外事項による監査意見を不適正意見とせず限定付適正意見とした理由を明らかにしなければならない。", "a": true, "c": "R４Ⅰ⑱イ", "e": ""}, {"l": 64, "m": "除外事項付意見を表明する場合の監査報告書", "sb": "", "i": "A", "r": "", "q": "監査人は，除外事項付意見を表明する場合，除外した不適切な事項のほか，除外事項を付した限定意見とした理由を監査報告書に記載しなければならない。", "a": true, "c": "R６Ⅰ⑲イ", "e": "不備のある肢。除外事項付意見には否定的意見や意見不表明も含まれるが，本肢では，他の肢とのバランスで限定意見を想定していると読み取る必要があった。"}, {"l": 65, "m": "除外事項付意見を表明する場合の監査報告書", "sb": "", "i": "A", "r": "", "q": "監査人は，監査報告書において除外事項付意見の表明が見込まれる場合，監査役等にその原因となる状況を報告しなければならないが，除外事項付意見の文言の草案については監査役等に報告する必要はない。", "a": false, "c": "R６Ⅰ⑬イ／H25Ⅱ⑰エ", "e": "除外事項付意見の文言の草案についても，監査役等に報告する必要がある。"}, {"l": 66, "m": "除外事項付意見を表明する場合の監査報告書", "sb": "", "i": "A", "r": "", "q": "監査人は，会計方針の選択及びその適用方法，財務諸表の表示方法に関して不適切なものがあり，無限定適正意見を表明することはできないが，財務諸表全体としては虚偽の表示ではないと判断したときには，除外事項を付した限定付適正意見を表明しなければならない。", "a": true, "c": "H30Ⅱ⑮ウ", "e": ""}, {"l": 67, "m": "除外事項付意見を表明する場合の監査報告書", "sb": "", "i": "A", "r": "", "q": "監査人が，自ら入手した監査証拠に基づいて，経営者が選択した会計方針が適用される財務報告の枠組みに準拠していないことを原因として，全体としての財務諸表に重要な虚偽表示があると判断する場合に，当該監査人には，監査報告書において，当該財務諸表に対して意見を表明しないことが認められる。", "a": false, "c": "H30Ⅰ⑱ア", "e": "本肢の状況は，意見に関する除外の原因となるものであるため，意見不表明とすることは認められない。"}, {"l": 68, "m": "除外事項付意見を表明する場合の監査報告書", "sb": "", "i": "A", "r": "", "q": "被監査会社は新たに獲得した重要な子会社について連結の範囲に含めていなかったが，監査人が当該子会社を連結の範囲に含めない理由を調べたところ，その理由は，一般に公正妥当と認められる企業会計の基準に準拠しているとは認められなかった。この状況は，意見を表明しない直接の原因となりうる。", "a": false, "c": "R４Ⅰ⑲ア", "e": "同上"}, {"l": 69, "m": "除外事項付意見を表明する場合の監査報告書", "sb": "", "i": "A", "r": "", "q": "監査人は，被監査会社において循環取引による売上が計上されていることを発見し，それが財務諸表に及ぼす影響は重要かつ広範であると判断した。この状況は，意見を表明しない直接の原因となりうる。", "a": false, "c": "R４Ⅰ⑲エ", "e": "同上"}, {"l": 70, "m": "除外事項付意見を表明する場合の監査報告書", "sb": "", "i": "A", "r": "", "q": "監査人は，財務諸表に対して限定付適正意見を表明する場合，限定付適正意見を表明する原因となる事項について記載する区分を新たに設けなければならず，当該区分には金額的な影響額とそれに関する説明を記載することがある。", "a": false, "c": "H31Ⅰ⑱ア", "e": "除外事項付意見を表明する原因となる事項は，新たに設けた区分ではなく，意見の根拠の区分に記載する。"}, {"l": 71, "m": "除外事項付意見を表明する場合の監査報告書", "sb": "", "i": "A", "r": "", "q": "監査人は，財務諸表の特定の金額に関連する重要な虚偽表示が存在することにより限定付適正意見を表明する場合，金額的な影響額を算定することが困難でない限り，「限定付適正意見の根拠」区分において，当該虚偽表示による金額的な影響額とそれに関する説明を記載しなければならない。", "a": true, "c": "H29Ⅱ⑯ウ／H25Ⅱ⑨イ／H25Ⅰ⑰イ", "e": "なお，本肢は金額的な影響額の記載に関する問題であるため，「限定付適正意見とした理由」の記載に言及がなくても，正しいと判断してよい。"}, {"l": 72, "m": "除外事項付意見を表明する場合の監査報告書", "sb": "", "i": "A", "r": "", "q": "監査人は，財務諸表に定性的な注記事項に関連する重要な虚偽表示が存在する場合，当該事項を除外事項とするとともに，当該虚偽表示の内容を監査報告書に記載しなければならない。", "a": true, "c": "R６Ⅰ⑲ウ", "e": ""}, {"l": 73, "m": "除外事項付意見を表明する場合の監査報告書", "sb": "", "i": "A", "r": "", "q": "監査人は，財務諸表に開示すべき情報が開示されておらず，除外事項付意見を表明する場合，当該情報について十分かつ適切な監査証拠を入手したときは，法令等で禁止されていない限り，監査報告書において当該情報を開示しなければならない。ただし，当該開示を監査報告書に含めるには膨大であると監査人が判断した場合にはこの限りではない。", "a": true, "c": "H25Ⅱ⑲ウ／R６Ⅰ⑲ア", "e": ""}, {"l": 74, "m": "除外事項付意見を表明する場合の監査報告書", "sb": "", "i": "A", "r": "", "q": "監査人は，経営者が採用した会計方針の適用方法に不適切な事項があり，除外事項を付した限定付適正意見を表明する場合，「限定付適正意見の根拠」の区分に，除外した不適切な事項，当該事項が財務諸表に与えている影響及びこれらを踏まえて除外事項を付した限定付適正意見とした理由を記載しなければならない。", "a": true, "c": "H26Ⅰ⑮ア／H23Ⅱ⑱エ", "e": "監査基準の原文通りの記述である。なお，本肢にある「影響」は金額的な影響のみをさすわけではないため，「虚偽表示の金額的な影響額を算定することが可能であれば」という条件がなくとも，正しい記述として判断してよい。"}, {"l": 75, "m": "除外事項付意見を表明する場合の監査報告書", "sb": "", "i": "A", "r": "", "q": "監査人は，財務諸表の表示方法に関して不適切なものがあり，財務諸表全体として虚偽の表示に当たるとするほどに重要かつ広範な影響を与えていると判断した場合，財務諸表が不適正である旨の意見を表明するとともに，意見の根拠の区分に，財務諸表が不適正であるとした理由を記載しなければならない。", "a": true, "c": "H28Ⅰ⑰ア", "e": ""}, {"l": 76, "m": "除外事項付意見を表明する場合の監査報告書", "sb": "", "i": "A", "r": "", "q": "監査人が，監査報告書において，財務諸表に対して不適正意見を表明する場合に，当該監査人は，当該監査報告書に設けられる不適正意見の根拠区分に記載した事項の財務諸表に及ぼす重要な影響を除く旨を，当該監査報告書に設けられる意見区分に記載しなければならない。", "a": false, "c": "H30Ⅰ⑱ウ", "e": "不適正意見を表明する場合には，「不適正意見の根拠区分に記載した事項の財務諸表に及ぼす影響の重要性に鑑み」という表現で記載される。"}, {"l": 77, "m": "除外事項付意見を表明する場合の監査報告書", "sb": "", "i": "A", "r": "", "q": "監査人は，否定的意見を表明する場合，監査対象となった財務諸表について経営者が責任を果たさなかったことになるため，監査報告書において経営者による財務諸表の作成責任に関する記載を行わない。", "a": false, "c": "R７Ⅰ②エ／H27Ⅱ①エ", "e": "否定的意見を表明する場合にも，経営者の財務諸表の作成責任に関する記載を行う。"}, {"l": 78, "m": "除外事項付意見を表明する場合の監査報告書", "sb": "", "i": "A", "r": "", "q": "監査人は，意見表明の基礎となる十分かつ適切な監査証拠を入手できず，かつ，未発見の虚偽表示がもしあるとすれば，それが財務諸表に及ぼす可能性のある影響が，重要かつ広範であると判断する場合には，不適正意見を表明しなければならない。", "a": false, "c": "H26Ⅱ⑬ウ", "e": "本肢のような場合は，不適正意見ではなく意見不表明とすることになる。"}, {"l": 79, "m": "除外事項付意見を表明する場合の監査報告書", "sb": "", "i": "A", "r": "", "q": "監査人は，重要な監査手続を実施できなかったことにより，自己の意見を形成するに足る基礎を得られないときは，財務諸表に及ぼす影響の重要性及び広範性の程度に応じて，実施できなかった監査手続を除外事項とした限定付適正意見を表明するか，又は意見を表明してはならない。", "a": false, "c": "H27Ⅰ⑮エ", "e": "「自己の意見を形成するに足る基礎を得られないとき」とあるため，限定付適正意見を表明する余地はなく，意見不表明としなければならない。"}, {"l": 80, "m": "除外事項付意見を表明する場合の監査報告書", "sb": "", "i": "A", "r": "", "q": "監査人は，大規模自然災害の発生により無限定適正意見表明の基礎となる十分かつ適切な監査証拠を入手できず，かつ，未発見の虚偽表示がもしあるとすれば，それが財務諸表に及ぼす可能性のある影響が，重要ではないが広範であると判断する場合には，意見を表明してはならない。", "a": false, "c": "H26Ⅱ⑫エ", "e": "意見不表明とするケースは，未発見の虚偽表示がもしあるとすれば，それが財務諸表に及ぼす可能性のある影響が，「重要かつ広範」であると判断する場合である。なお，当該影響について「重要ではないが広範である」と判断する場合は，実務指針上想定されていない。"}, {"l": 81, "m": "除外事項付意見を表明する場合の監査報告書", "sb": "", "i": "A", "r": "", "q": "監査人が，企業の管理の及ばない状況を原因として，全体としての財務諸表に重要な虚偽表示がないと判断するための十分かつ適切な監査証拠を入手できない場合に，当該監査人は，監査報告書において，当該財務諸表に対して否定的意見を表明してはならない。", "a": true, "c": "H30Ⅰ⑱イ", "e": "本肢の状況は，監査範囲の制約の原因となるものであるため，否定的意見を表明することは認められない。"}, {"l": 82, "m": "除外事項付意見を表明する場合の監査報告書", "sb": "", "i": "A", "r": "", "q": "監査人は，他の監査人の監査の結果を利用できないと判断した重要な事項について，追加して行うべき重要な監査手続を実施できなかった場合には，除外事項を付した限定付適正意見を表明しなければならない。", "a": false, "c": "H23Ⅱ⑰エ", "e": "仮に，本肢のような状況の影響に広範性が認められる場合には，限定付適正意見の表明ではなく，意見不表明とすることになる。"}, {"l": 83, "m": "除外事項付意見を表明する場合の監査報告書", "sb": "", "i": "A", "r": "", "q": "被監査会社が新しく導入した売掛金システムの不備を原因とする多数の誤謬が発見され，監査報告書日時点においてもシステムの不具合を是正し当該誤謬を修正している過程にあり，売掛金残高を他の方法によって検証できなかった場合で，その影響が重要かつ広範であると判断される場合には，監査人は不適正意見を表明しなければならない。", "a": false, "c": "H27Ⅱ⑰ウ", "e": "本肢の状況は，監査範囲の制約の原因となるものであるため，不適正意見を表明することは認められない。なお，本肢にある「売掛金残高を他の方法によって検証できなかった」という点は，「売掛金残高に関する十分かつ適切な監査証拠を入手できなかった」と読み替える必要がある。"}, {"l": 84, "m": "除外事項付意見を表明する場合の監査報告書", "sb": "", "i": "A", "r": "", "q": "監査人は，監査契約締結後に監査範囲の制約に気付き，財務諸表に対する意見不表明につながる可能性が高いと判断したため，経営者に当該制約を除去するように要請したにもかかわらず，それが拒否された場合でも，監査役等に報告する前には監査契約を解除しない。", "a": true, "c": "R４Ⅱ⑰ア", "e": ""}, {"l": 85, "m": "除外事項付意見を表明する場合の監査報告書", "sb": "", "i": "A", "r": "", "q": "重要な在外関連会社への投資に関して十分かつ適切な監査証拠を入手できないために連結財務諸表に対して限定付適正意見を表明する場合，監査人は，意見区分において，「『限定付適正意見の根拠』に記載した事項の連結財務諸表に及ぼす可能性のある影響を除き」という文言により記載しなければならない。", "a": true, "c": "H26Ⅱ⑫ウ", "e": "なお，「可能性のある」という文言が含まれているかどうかを読み逃さないように注意すること。"}, {"l": 86, "m": "除外事項付意見を表明する場合の監査報告書", "sb": "", "i": "A", "r": "", "q": "監査人は，十分かつ適切な監査証拠を入手できないため意見を表明しない場合においても，監査報告書における監査意見を記載する区分において，財務諸表について監査を行った旨を記載しなければならない。", "a": true, "c": "H29Ⅱ⑯ア／H28Ⅱ⑱イ", "e": ""}, {"l": 87, "m": "除外事項付意見を表明する場合の監査報告書", "sb": "", "i": "A", "r": "", "q": "監査報告書は，監査人が財務諸表に対して意見表明を行うことを目的とするものであるが，意見表明のための基礎が得られなかった場合，監査報告書にはその旨及びその理由が記載されるにとどまり財務諸表に対する意見は表明されない。", "a": true, "c": "H24Ⅰ⑱ア", "e": ""}, {"l": 88, "m": "除外事項付意見を表明する場合の監査報告書", "sb": "", "i": "A", "r": "", "q": "監査人は，重要な監査手続を実施できなかったことにより監査意見を表明しない場合，財務諸表に対する意見を表明しない旨を「意見不表明」の区分に，財務諸表に対する意見を表明しない理由を「意見不表明の根拠」の区分に，それぞれ記載しなければならない。", "a": true, "c": "H26Ⅰ⑮イ", "e": ""}, {"l": 89, "m": "除外事項付意見を表明する場合の監査報告書", "sb": "", "i": "A", "r": "", "q": "監査人は，表明する監査意見の種類にかかわらず，監査報告書における監査意見の根拠を記載する区分において，意見表明の基礎となる十分かつ適切な監査証拠を入手したと判断したかどうかを記載しなければならない。", "a": false, "c": "H29Ⅱ⑯イ", "e": "意見表明の基礎となる十分かつ適切な監査証拠を入手したと判断したかどうかの記載について，意見不表明以外の場合は監査意見の根拠を記載する区分に行うが，意見不表明の場合には，「意見不表明」区分及び「財務諸表監査における監査人の責任」区分に行うことになる。"}, {"l": 90, "m": "除外事項付意見を表明する場合の監査報告書", "sb": "", "i": "A", "r": "", "q": "監査人が，監査報告書に設けられる意見不表明の根拠区分に記載した事項の財務諸表に及ぼす可能性のある影響の重要性に鑑み，意見表明の基礎を得るための十分かつ適切な監査証拠を入手することができなかった旨は，当該監査人が，意見表明の基礎となる十分かつ適切な監査証拠を入手できなかったことによって当該財務諸表に対して意見を表明しない場合に，当該監査報告書に設けられる意見区分に記載されなければならない。", "a": true, "c": "H30Ⅰ⑱エ", "e": ""}, {"l": 91, "m": "除外事項付意見を表明する場合の監査報告書", "sb": "", "i": "A", "r": "", "q": "監査人は，財務諸表に対して意見を表明しない場合，監査報告書に，監査人の責任は，我が国において一般に公正妥当と認められる監査の基準に準拠して監査を実施し，監査報告書において意見を表明することにある旨の記載は求められていない。", "a": false, "c": "R６Ⅰ⑱イ／H29Ⅱ⑯エ／H25Ⅱ①ウ／H24Ⅱ①ウ", "e": "意見不表明とする場合であっても，「財務諸表監査における監査人の責任」区分において監査人の意見表明に関する責任が記載される。"}, {"l": 92, "m": "除外事項付意見を表明する場合の監査報告書", "sb": "", "i": "A", "r": "", "q": "監査人は，将来の帰結が予測し得ない状況について，財務諸表に与える影響が複合的かつ多岐にわたる場合，重要な監査手続を実施できなかった場合に準じて意見の表明をしないことがある。", "a": true, "c": "R５Ⅱ⑳ウ／H28Ⅰ⑱エ", "e": ""}, {"l": 93, "m": "除外事項付意見を表明する場合の監査報告書", "sb": "", "i": "A", "r": "", "q": "監査人は，将来の帰結が予測し得ない事象又は状況について，財務諸表に与える当該事象又は状況の影響が複合的かつ多岐にわたる場合において，重要な監査手続を追加的に実施できなかったときには，除外事項を付した限定付適正意見を表明しなければならない。", "a": false, "c": "H23Ⅱ⑰オ", "e": "監査人は，本肢のような状況においては，意見を表明できるか否かを慎重に判断しなければならないのであって，限定付適正意見の表明が強制されるわけではない。"}, {"l": 94, "m": "除外事項付意見を表明する場合の監査報告書", "sb": "", "i": "A", "r": "", "q": "監査人は，複数の不確実性を伴う状況において，個々の不確実性について十分かつ適切な監査証拠を入手していたとしても，それらが財務諸表に及ぼす可能性のある累積的影響が複合的かつ多岐にわたる場合には，意見を表明できないことがある。", "a": true, "c": "H30Ⅱ⑮エ", "e": "なお，本肢には「財務諸表に対する意見を形成できないと判断する場合には」という条件付けがないため，意見を表明できない「ことがある」としている。"}, {"l": 95, "m": "除外事項付意見を表明する場合の監査報告書", "sb": "", "i": "A", "r": "", "q": "監査人は大規模な自然災害など将来の帰結が予測し得ない事象又は状況について，財務諸表に与える当該事象又は状況の影響が複合的かつ多岐にわたり，財務諸表全体に対する意見表明のための基礎を得ることができなかった場合，意見を表明してはならない。", "a": true, "c": "R５Ⅰ⑱ウ", "e": "本肢には「意見表明のための基礎を得ることができなかった」とあるため，意見を表明してはならないことになる。"}, {"l": 96, "m": "除外事項付意見を表明する場合の監査報告書", "sb": "", "i": "A", "r": "", "q": "被監査会社の重要な工場施設が未曾有の災害に見舞われ，監査人がその状況を調べたところ，この災害は，被監査会社の各種の資産のほか，中長期的な営業活動に甚大な影響を及ぼすと考えられたが，その損害が影響する項目の特定や損害額の予測は著しく困難であった。この状況は，意見を表明しない直接の原因となりうる。", "a": true, "c": "R４Ⅰ⑲ウ", "e": "同上"}, {"l": 97, "m": "監査上の主要な検討事項（Key Audit Matters）", "sb": "", "i": "A", "r": "", "q": "平成３０年改訂監査基準は，監査報告書に「監査上の主要な検討事項」の記載を求めたが，その目的は，監査人が実施した監査の透明性を向上させ，監査報告書の情報価値を高めることにある。", "a": true, "c": "H31Ⅱ⑪エ", "e": ""}, {"l": 98, "m": "監査上の主要な検討事項（Key Audit Matters）", "sb": "", "i": "A", "r": "", "q": "監査上の主要な検討事項は，監査を実施する上で監査人が特に注意を払った事項であり，財務諸表に表示又は開示されていない事項は，監査上の主要な検討事項とならない。", "a": false, "c": "R２Ⅱ⑰ウ", "e": "財務諸表に表示又は開示されていない事項（例えば，内部統制の不備等）がＫＡＭとして決定されることもある。"}, {"l": 99, "m": "監査上の主要な検討事項（Key Audit Matters）", "sb": "", "i": "A", "r": "", "q": "監査証明業務は専門的能力や実務経験を有する公認会計士又は監査法人の独占業務であることから，一定水準の監査品質が担保されており，また，監査品質を評価することも困難であることから，企業や株主等が監査品質について評価する必要はない。", "a": false, "c": "R４Ⅰ①エ", "e": "ＫＡＭで提供される監査のプロセスに関する情報は，企業や株主等が監査の品質を評価するための新たな検討材料として利用することが想定されている。そのため，企業や株主等が監査品質について評価する必要はないとする本肢は誤りとなる。"}, {"l": 100, "m": "監査上の主要な検討事項（Key Audit Matters）", "sb": "", "i": "A", "r": "", "q": "平成３０年の改訂では，監査報告書における「監査上の主要な検討事項」の記載が導入された。この意義は，財務諸表利用者の監査や財務諸表に対する理解を深めるとともに，経営者との対話を促進することにあり，副次的な効果として，監査報告書の情報価値を高めることが期待されている。", "a": false, "c": "R６Ⅱ⑪イ", "e": "監査報告書の情報価値を高めることが，ＫＡＭを記載する意義であり，利用者の理解を深めることや，利用者と経営者の対話を促進することが，ＫＡＭを記載する副次的効果である。"}, {"l": 101, "m": "監査上の主要な検討事項（Key Audit Matters）", "sb": "", "i": "A", "r": "", "q": "監査報告書における監査上の主要な検討事項の記載の効果として，監査人と経営者の間のみならず，監査人と財務諸表利用者の間の議論を更に充実させることを通じたコーポレート・ガバナンスの強化が期待されている。", "a": false, "c": "R４Ⅰ②イ", "e": "ＫＡＭの記載によって更なる充実が期待されているのは，監査人と監査役等の間のコミュニケーションや，監査人と経営者の間の議論である。なお，本肢にあるような，「監査人と財務諸表利用者の間の議論」が行われることは，そもそも想定されていない。"}, {"l": 102, "m": "監査上の主要な検討事項（Key Audit Matters）", "sb": "", "i": "A", "r": "", "q": "監査報告書における監査上の主要な検討事項の記載は，財務諸表利用者に対し，監査人が実施した監査の内容に関する情報を提供するものであり，当該事項について個別に意見を表明するものではない。", "a": true, "c": "R２Ⅰ⑱ア", "e": ""}, {"l": 103, "m": "監査上の主要な検討事項（Key Audit Matters）", "sb": "", "i": "A", "r": "", "q": "監査上の主要な検討事項は，監査人が全体としての財務諸表に対する監査意見を形成した上で行われるものであるため，監査役等との協議は，監査意見の形成段階になってから実施されなければならない。", "a": false, "c": "R３⑲イ", "e": "監査役等との協議は，監査の期間中を通して実施されるものである。なお，前半の記述は正しい。"}, {"l": 104, "m": "監査上の主要な検討事項（Key Audit Matters）", "sb": "", "i": "A", "r": "", "q": "監査報告書において監査上の主要な検討事項の記載が求められる会社は，金融商品取引法に基づいて開示が行われる会社（ただし，非上場会社のうち資本金５億円未満又は売上高１０億円未満かつ負債総額２００億円未満の会社を除く。）である。", "a": true, "c": "R３④イ", "e": ""}, {"l": 105, "m": "監査上の主要な検討事項（Key Audit Matters）", "sb": "", "i": "A", "r": "", "q": "特別目的の財務諸表に対する監査報告書においては，監査上の主要な検討事項を記載してはならない。", "a": false, "c": "R５Ⅱ⑲ア", "e": "特別目的の財務諸表に対する監査報告書においても，法令により要求されている場合又は任意で契約条件により合意した場合には，ＫＡＭが記載される。"}, {"l": 106, "m": "監査上の主要な検討事項（Key Audit Matters）", "sb": "", "i": "A", "r": "", "q": "監査人は，会社法及び金融商品取引法の規定により，監査報告書に「監査上の主要な検討事項」を記載しなければならない。", "a": false, "c": "R７Ⅰ⑲ウ", "e": "会社法監査では，監査上の主要な検討事項の報告は求められていない。"}, {"l": 107, "m": "監査上の主要な検討事項（Key Audit Matters）", "sb": "", "i": "A", "r": "", "q": "監査人は，当年度の財務諸表の監査において特に注意を払った事項を決定し，決定した事項について監査役等とコミュニケーションを行うことによって，その中で特に重要であると判断した事項を監査上の主要な検討事項として決定する。", "a": false, "c": "R４Ⅱ⑰イ", "e": "監査人が特に注意を払った事項は，監査役等とコミュ二ケーションを行った事項の中から決定する。"}, {"l": 108, "m": "監査上の主要な検討事項（Key Audit Matters）", "sb": "", "i": "A", "r": "", "q": "監査人は，監査の過程で監査役等と協議した事項の中から，特に注意を払った事項を決定し，その決定事項を監査報告書に監査上の主要な検討事項として記載することが求められる。", "a": false, "c": "R５Ⅱ⑳ア", "e": "ＫＡＭとなるのは，特に注意を払った事項のうち，職業的専門家として特に重要であると判断した事項のみである。"}, {"l": 109, "m": "監査上の主要な検討事項（Key Audit Matters）", "sb": "", "i": "A", "r": "", "q": "監査上の主要な検討事項を決定するさいに，監査人が特に注意を払った事項を考慮するのは，監査がリスク・アプローチに基づいて行われるためである。したがって，識別し評価した重要な虚偽表示リスクの中で，監査人が特別な検討を必要とするリスクと判断したものについては，監査上の主要な検討事項としなければならない。", "a": false, "c": "R２Ⅰ⑱ウ", "e": "ＳＲであると決定した事項であっても，監査人が特に注意を払った事項に該当しないこともあるため，必ずＫＡＭとして決定するわけではない。なお，前段の記述は正しい。"}, {"l": 110, "m": "監査上の主要な検討事項（Key Audit Matters）", "sb": "", "i": "A", "r": "", "q": "監査人は，監査上の主要な検討事項として決定した事項について，当該事項の内容，当該事項を監査上の主要な検討事項と決定した理由，監査人の対応及び個々の監査上の主要な検討事項に対して表明した意見を監査報告書に記載しなければならない。", "a": false, "c": "H31Ⅱ⑯ウ", "e": "ＫＡＭは，当該事項に対して監査人が意見を表明するものではない。"}, {"l": 111, "m": "監査上の主要な検討事項（Key Audit Matters）", "sb": "", "i": "A", "r": "", "q": "監査人は，監査上の主要な検討事項の報告が求められる場合において，それに該当する事項がないときでも，監査報告書において，「監査上の主要な検討事項」の見出しを付した区分を設けて，その旨を記載しなければならない。", "a": true, "c": "R５Ⅱ⑲イ", "e": ""}, {"l": 112, "m": "監査上の主要な検討事項（Key Audit Matters）", "sb": "", "i": "A", "r": "", "q": "監査上の主要な検討事項の監査報告書への記載は，業務上知り得た秘密情報を開示又は利用することが認められる正当な理由に該当する。ただし，その記載内容や程度の決定に当たっては，公共の利益についてだけでなく，企業や社会の不利益についても考慮する必要がある。", "a": true, "c": "R３⑬ア", "e": ""}, {"l": 113, "m": "監査上の主要な検討事項（Key Audit Matters）", "sb": "", "i": "A", "r": "", "q": "監査報告書において除外事項付意見を表明する原因となる事項は，その性質上は監査上の主要な検討事項に該当するが，監査報告書上の監査上の主要な検討事項区分には記載しない。", "a": true, "c": "R２Ⅰ⑱イ", "e": ""}, {"l": 114, "m": "監査上の主要な検討事項（Key Audit Matters）", "sb": "", "i": "A", "r": "", "q": "継続企業の前提に関する重要な不確実性は，「監査上の主要な検討事項」に該当するが，監査人は，当該事項を監査報告書の「監査上の主要な検討事項」区分に記載してはならない。", "a": true, "c": "R７Ⅰ⑲エ", "e": ""}, {"l": 115, "m": "監査上の主要な検討事項（Key Audit Matters）", "sb": "", "i": "A", "r": "", "q": "監査人は，否定的意見を表明する場合に，否定的意見を表明する原因となる事項を監査報告書に記載する。この場合，監査人は，当該事項以外の監査上の主要な検討事項を監査報告書に記載することを求められていない。", "a": false, "c": "R２Ⅱ⑰ア／H31Ⅱ⑯ウ", "e": "否定的意見を表明する原因となる事項以外に，監査人が特に重要であると判断した事項がある場合には，当該事項をＫＡＭ区分に記載することになる。"}, {"l": 116, "m": "監査上の主要な検討事項（Key Audit Matters）", "sb": "", "i": "A", "r": "", "q": "平成３０年改訂では，監査の透明性を向上させ，監査報告書の情報価値を高めるために，「監査上の主要な検討事項」が導入されることとなり，不適正意見及び意見不表明の場合であっても，「監査上の主要な検討事項」を記載することとした。", "a": false, "c": "R４Ⅱ⑪エ／R５Ⅰ④ウ", "e": "意見を表明しない場合は，ＫＡＭ区分自体を設けてはならない。なお，ＫＡＭが導入された経緯については正しい。"}, {"l": 117, "m": "監査上の主要な検討事項（Key Audit Matters）", "sb": "", "i": "A", "r": "", "q": "監査人は，財務諸表に対する意見を表明しない場合，十分かつ適切な監査証拠を入手できない理由を「監査上の主要な検討事項」区分に記載することがある。", "a": false, "c": "R７Ⅰ⑲イ", "e": "意見を表明しない場合は，ＫＡＭ区分自体を設けてはならない。また，十分かつ適切な監査証拠を入手できない理由は，除外事項付意見の根拠区分に記載する事項である。"}, {"l": 118, "m": "監査上の主要な検討事項（Key Audit Matters）", "sb": "", "i": "A", "r": "", "q": "監査人が被監査会社に関する未公表の情報を「監査上の主要な検討事項」に記載することが必要であると判断し，経営者に追加の情報開示を促したものの，経営者が情報を開示しない場合，監査人が当該情報を「監査上の主要な検討事項」に含めることは，監査人の守秘義務が解除される正当な理由となる。", "a": true, "c": "R７Ⅰ⑲ア／R２Ⅰ⑱エ", "e": ""}, {"l": 119, "m": "その他の記載内容", "sb": "", "i": "A", "r": "", "q": "その他の記載内容とは，監査した財務諸表を含む開示書類のうち，当該財務諸表と監査報告書を除いた部分の記載内容をいい，当該情報の非財務情報以外の部分は監査人の監査対象となる。", "a": false, "c": "H31Ⅱ⑰ア", "e": "その他の記載内容は，財務情報であるか非財務情報であるかを問わず，監査人の監査対象とはならない。"}, {"l": 120, "m": "その他の記載内容", "sb": "", "i": "A", "r": "", "q": "会計監査人が会社法監査において通読及び検討すべき「その他の記載内容」の対象となるのは，株主総会参考書類及び事業報告である。", "a": false, "c": "R７Ⅰ④イ", "e": "会社法監査におけるその他の記載内容に，事業報告は含まれるが，株主総会参考書類は含まれない。なお，本肢の内容は非常に細かいため，レジュメには掲載していない。"}, {"l": 121, "m": "その他の記載内容", "sb": "", "i": "A", "r": "", "q": "有価証券報告書における「その他の記載内容」の誤りとは，その情報自体が不正確であることのみならず，必要な情報が省略されている場合にも該当し，当該誤りが重要であるかどうかは，投資家の投資判断にとって重要か否かにより判断される。", "a": true, "c": "R４Ⅱ⑯ア", "e": ""}, {"l": 122, "m": "その他の記載内容", "sb": "", "i": "A", "r": "", "q": "監査人は，「その他の記載内容」に対する保証の結論として，当該記載内容に未修正の重要な誤りがあるかどうかを監査報告書に区分を設けて記載しなければならない。", "a": false, "c": "R４Ⅱ⑯エ", "e": "「その他の記載内容」区分で行われる報告は，その他の記載内容に対する保証（意見の表明）ではない。"}, {"l": 123, "m": "その他の記載内容", "sb": "", "i": "A", "r": "", "q": "監査人は，監査対象である財務諸表を含む有価証券報告書のうちに，当該財務諸表以外の情報に重要な誤りを認め，経営者及び監査役等と協議の上，経営者に当該重要な誤りの修正を求めたが，経営者が修正に応じなかった場合，当該重要な誤りを監査報告書の追記情報に記載しなければならない。", "a": false, "c": "R４Ⅰ⑱エ", "e": "本肢の場合，重要な誤りは追記情報ではなく「その他の記載内容」区分に記載しなければならない"}, {"l": 124, "m": "その他の記載内容", "sb": "", "i": "A", "r": "", "q": "監査人は，有価証券報告書における財務諸表とその他の記載内容に重要な差異がないかどうかを確かめるために，有価証券報告書を通読しなければならない。", "a": true, "c": "H24Ⅱ③ウ", "e": ""}, {"l": 125, "m": "その他の記載内容", "sb": "", "i": "A", "r": "", "q": "令和２年の改訂では，監査報告書において，「その他の記載内容」に係る記載が求められることとなった。監査人は，「その他の記載内容」の通読や検討に当たっては，あくまでも財務諸表監査の一環であることに留意することが求められるため，財務諸表や監査の過程で得た知識に関連しない内容についての重要な誤りの兆候に注意を払うことは求められていない。", "a": false, "c": "R６Ⅱ⑪エ", "e": "「その他の記載内容」の通読や検討に当たっては，財務諸表や監査の過程で得た知識に関連しない内容についての重要な誤りの兆候にも注意を払う必要がある。"}, {"l": 126, "m": "その他の記載内容", "sb": "", "i": "A", "r": "", "q": "監査人は，有価証券報告書に含まれる財務諸表の表示とその他の記載内容に重要な相違がある場合において，その影響が財務諸表全体にわたるほどではないと判断したときには，除外事項を付した限定付適正意見を表明しなければならない。", "a": false, "c": "H23Ⅱ⑱イ", "e": "もし重要な相違の原因がその他の記載内容にある場合は，除外事項を付した限定付適正意見を表明する必要はない。"}, {"l": 127, "m": "その他の記載内容", "sb": "", "i": "A", "r": "", "q": "監査人は，監査報告書日の前に入手したその他の記載内容について，財務諸表の表示との間に重要な相違を識別した場合，経営者がその他の記載内容の修正に同意しないとき，監査報告書において除外事項付意見を表明しなければならない。", "a": false, "c": "H31Ⅱ⑰ウ／H29Ⅱ⑰エ／H26Ⅱ⑫イ", "e": "「経営者がその他の記載内容の修正に同意しないとき」とあるため，本肢はその他の記載内容に重要な誤りがある場合の問題と読み取れる。したがって，除外事項付意見を表明する必要はない。"}, {"l": 128, "m": "その他の記載内容", "sb": "", "i": "A", "r": "", "q": "監査人は，重要な誤りがあると思われるその他の記載内容が存在すると判断した場合，経営者との協議に加えて，経営者以外からの追加の情報又は説明により，その他の記載内容における経営者の記述に重要な誤りがあることの裏付けを得ることが求められている。", "a": false, "c": "R５Ⅰ⑲ウ", "e": "監査人は，重要な誤りがあることの裏付けの入手を必ず行うわけではないし，その裏付けの入手も，基本的に経営者から行うものと考えられる。"}, {"l": 129, "m": "その他の記載内容", "sb": "", "i": "A", "r": "", "q": "監査人は，監査報告書日の後に入手したその他の記載内容について，財務諸表の表示との間に重要な相違を識別した場合，経営者がその他の記載内容の訂正に同意したとき，以前に発行された財務諸表，監査報告書及びその他の記載内容を受領した者に対して訂正内容を伝達するために経営者が行う対応の検討を行うことがある。", "a": true, "c": "H31Ⅱ⑰エ", "e": ""}, {"l": 130, "m": "その他の記載内容", "sb": "", "i": "A", "r": "", "q": "監査人が，監査した財務諸表及び監査報告書を含む開示書類における財務諸表及び監査報告書以外の情報を通読し，それらの情報と財務諸表に含まれる情報とに重要な相違があることに気付いた場合であっても，財務諸表に修正すべき点がないときは，必ず，無限定意見を記載した監査報告書を発行しなければならない。", "a": false, "c": "H28Ⅱ⑱ウ", "e": "まれではあるが，修正に同意しないことで経営者及び監査役等の誠実性に関して疑義が生じ，監査証拠全体の証明力が疑われる場合には，意見不表明とすることがある。"}, {"l": 131, "m": "その他の記載内容", "sb": "", "i": "A", "r": "", "q": "監査人はその他の記載内容における重要な誤りの修正を拒否した経営者及び監査役等の誠実性について疑義を抱き，監査の過程で入手した経営者及び監査役等の陳述の信頼性に関して重大な懸念があると判断した場合，現実的な対応として可能であれば，監査契約を解除することがある。", "a": true, "c": "R５Ⅰ⑲エ", "e": ""}, {"l": 132, "m": "その他の記載内容", "sb": "", "i": "A", "r": "", "q": "監査人はその他の記載内容を通読し，当該その他の記載内容と財務諸表又は監査人が監査の過程で得た知識との間に重要な相違があるかどうかを検討し，監査報告書に「その他の記載内容」等の適切な見出しを付した区分を設け，その他の記載内容に関する事項を記載することが求められている。ただし，監査人が財務諸表に対する意見を表明しない場合は，監査報告書にその他の記載内容を記載しない。", "a": true, "c": "R５Ⅰ⑲ア", "e": ""}, {"l": 133, "m": "その他の記載内容", "sb": "", "i": "A", "r": "", "q": "監査人は，所定の手続を実施した結果，監査報告書に記載すべきその他の記載内容が存在しないと判断した場合，監査報告書の「その他の記載内容」の区分に，その他の記載内容が存在しないと判断した旨及びその他の記載内容に対して実施した作業の概要を記載する。", "a": false, "c": "R５Ⅰ⑲イ", "e": "本肢の場合に「その他の記載内容」の区分に記載する事項は，その他の記載内容が存在しないと判断した旨と，その他の記載内容に対していかなる作業も実施していない旨である。"}, {"l": 134, "m": "追記情報", "sb": "", "i": "A", "r": "", "q": "監査報告書は，財務諸表に対する保証提供機能を担っているため，監査報告書における追記情報は，財務諸表に記載されている情報を要約したり再掲したりすることによって強調するものに限られている。", "a": false, "c": "H24Ⅰ⑱ウ", "e": "追記情報には，特定の事項に関する説明を行うその他の事項もある。"}, {"l": 135, "m": "追記情報", "sb": "", "i": "A", "r": "", "q": "監査人が財務諸表の表示に関して適正であると判断し，さらにその判断に関して説明を付す必要がある事項や財務諸表の記載について強調する必要がある事項を監査報告書において追記することは，監査人の指導的機能に該当する。", "a": false, "c": "H31Ⅰ①ウ", "e": "追記情報は，利害関係者に対して発揮する情報提供機能である。"}, {"l": 136, "m": "追記情報", "sb": "", "i": "A", "r": "", "q": "監査人は，監査報告書において，財務諸表の適正表示に関する意見を表明することに加え，係争中の重要な訴訟が存在し，当該訴訟の最終結果は不確実である旨の強調事項を記載した場合であっても，二重責任の原則には抵触しない。", "a": true, "c": "H27Ⅱ①ウ", "e": ""}, {"l": 137, "m": "追記情報", "sb": "", "i": "A", "r": "", "q": "監査人は，財務諸表利用者の経済的意思決定に有用な情報として経営者に対して財務諸表に記載を求めた事項が記載されなかった場合には，当該事項を除外事項又は追記情報としなければならない。", "a": false, "c": "R２Ⅰ①エ", "e": "本肢の状況は財務諸表の虚偽表示を示すものであるため，追記情報としてはならない。"}, {"l": 138, "m": "追記情報", "sb": "", "i": "A", "r": "", "q": "追記情報として記載される強調事項には，正当な理由によらない会計方針の変更，重要な偶発事象，重要な後発事象のうち，監査人によって記載が適当であると判断された事項が含まれる。", "a": false, "c": "R３⑲ア", "e": "正当な理由によらない会計方針の変更は虚偽表示であり，追記情報としてはならない。"}, {"l": 139, "m": "追記情報", "sb": "", "i": "A", "r": "", "q": "監査人は，財務諸表の記載について説明を付す必要があると認めた事項があり，当該事項を監査報告書において情報として追記する場合には，意見の表明とは明確に区別して記載しなければならない。", "a": true, "c": "H28Ⅰ⑰ウ", "e": "疑義問ともいえる肢。「財務諸表の記載について説明」を付すための追記情報は存在しないはずだが，当時は他の肢とのバランスで正しいと判断することが求められた。"}, {"l": 140, "m": "追記情報", "sb": "", "i": "A", "r": "", "q": "監査人が財務諸表における記載を前提に強調することが適当と判断した事項と，監査人がその他説明することを適当と判断した事項は，それぞれを区分して監査報告書に追記情報として記載しなければならない。", "a": true, "c": "H23Ⅱ⑱オ", "e": ""}, {"l": 141, "m": "追記情報", "sb": "", "i": "A", "r": "", "q": "監査人は，監査報告書にその他の事項区分を設けることが見込まれる場合，その旨と当該区分の文言の草案について，監査役等に報告しなければならない。", "a": true, "c": "H30Ⅱ⑰ウ／H29Ⅱ⑰ウ", "e": ""}, {"l": 142, "m": "追記情報", "sb": "", "i": "A", "r": "", "q": "監査人は，除外事項付意見を表明することが見込まれる場合には原因となる状況と文言の草案を，また強調事項区分を設けることが見込まれる場合にはその旨と文言の草案を，監査役若しくは監査役会又は監査委員会に報告しなければならない。", "a": true, "c": "H27Ⅱ⑰エ", "e": ""}, {"l": 143, "m": "追記情報", "sb": "", "i": "A", "r": "", "q": "監査人は，継続監査において，特定の事項に関する「その他の事項」区分が監査報告書に毎期設けられる場合であっても，当該事項について，監査役等とのコミュニケーションを実施しなければならない。", "a": false, "c": "R７Ⅰ⑳エ", "e": "「利害関係」区分のように，毎期設けられる「その他の事項」区分については，コミュニケーションを毎期繰り返す必要はないと判断することがある。"}, {"l": 144, "m": "追記情報", "sb": "", "i": "A", "r": "", "q": "財務諸表に表示又は開示されている事項以外の情報を強調事項に含めると，財務諸表に当該事項が適切に表示又は開示されていないことを示す可能性があるため，強調事項区分の使用は財務諸表に表示又は開示されている事項に限定される。", "a": true, "c": "H30Ⅱ⑰ア", "e": ""}, {"l": 145, "m": "追記情報", "sb": "", "i": "A", "r": "", "q": "監査人は，監査報告書に強調事項区分を設ける場合，当該事項について財務諸表の重要な虚偽表示がないという十分かつ適切な監査証拠を入手しているとは限らない。", "a": false, "c": "H30Ⅱ⑰イ", "e": "強調事項区分は，強調事項に関連して除外事項付意見を表明する必要がないと判断している（当該事項について財務諸表の重要な虚偽表示がないという十分かつ適切な監査証拠を入手している）場合にのみ設けることができる。"}, {"l": 146, "m": "追記情報", "sb": "", "i": "A", "r": "", "q": "監査人が，監査報告書についての利用者の理解に関連すると判断した場合に，当該監査人は，財務諸表に適切に表示されている事項について，当該監査報告書にその他の事項区分を設けることがある。", "a": false, "c": "H30Ⅰ⑲ウ／H25Ⅰ⑰オ／H24Ⅱ⑰オ", "e": "その他の事項区分に記載する事項は，財務諸表に表示又は開示されていない事項に限定されている。"}, {"l": 147, "m": "追記情報", "sb": "", "i": "A", "r": "", "q": "監査人は，監査報告書において強調事項区分を設ける場合には，当該事項が監査人の意見に影響を及ぼすものではないことを記載しなければならないが，その他の事項区分を設ける場合には，この記載は必要とされない。", "a": true, "c": "H29Ⅱ⑰イ", "e": ""}, {"l": 148, "m": "追記情報", "sb": "", "i": "A", "r": "", "q": "監査人は，強調事項に該当すると判断した事項があるときは，監査報告書の意見区分の次に強調事項区分を設け，当該事項を財務諸表における記載箇所と関連付けて明瞭に記載しなければならない。", "a": false, "c": "H29Ⅱ⑰ア", "e": "強調事項区分又はその他の事項区分の記載箇所は，当該事項の内容，及び想定利用者にとっての相対的重要性に関する監査人の判断によって決定されるものである。また，意見区分の次は監査意見の根拠区分と決まっているため，意見区分の次に強調事項区分が設けられることはない。"}, {"l": 149, "m": "追記情報", "sb": "", "i": "A", "r": "", "q": "監査人は，「その他の事項」区分において，守秘義務に関する倫理規則によって監査人が提供することが禁止されている情報は記載しないが，経営者が提供することが要求されている情報については記載する。", "a": false, "c": "R７Ⅰ⑳ウ", "e": "前段は正しいが，経営者が提供することが要求されている情報を「その他の事項」区分に記載することはできない。"}, {"l": 150, "m": "追記情報", "sb": "", "i": "A", "r": "", "q": "監査人は，監査報告書の「強調事項」区分に記載した事項が監査上の主要な検討事項に該当すると判断した場合，当該事項を「監査上の主要な検討事項」区分及び「強調事項」区分の両方に記載できないため，職業的専門家として，どちらの区分に記載するかを判断しなければならない。", "a": false, "c": "R６Ⅰ⑱ウ", "e": "「強調事項」区分を設けることが監基報で「要求されている」事項である場合で，当該事項が同時にＫＡＭにも該当する場合は，「強調事項」区分と「ＫＡＭ」区分の両方に記載しなければならない。"}, {"l": 151, "m": "追記情報", "sb": "", "i": "A", "r": "", "q": "監査人は，「監査上の主要な検討事項」に記載した事項を「その他の事項」区分に記載することがある。", "a": true, "c": "R７Ⅰ⑳イ", "e": ""}, {"l": 152, "m": "追記情報", "sb": "", "i": "B", "r": "", "q": "監査人によって，監査報告書に区分された上で情報として追記される事項に，正当な理由による会計方針の変更のような，当該監査人が強調することが適当と判断した事項が含まれる。", "a": true, "c": "H30Ⅰ⑲エ", "e": ""}, {"l": 153, "m": "追記情報", "sb": "", "i": "B", "r": "", "q": "監査人は，正当な理由による会計方針の変更が行われている場合，監査報告書において，強調事項区分を設けて，追記情報として記載しなければならない。", "a": false, "c": "H28Ⅰ⑰エ", "e": "正当な理由による会計方針の変更について強調事項区分を設ける場合は，当該会計方針に関する注記が適切に行われている場合で，かつ，当該注記を強調すべきと監査人が判断した場合である。"}, {"l": 154, "m": "追記情報", "sb": "", "i": "B", "r": "", "q": "監査人は，正当な理由によらない会計方針の変更に重要性がある場合，利用者の注意を喚起する必要があるため，「強調事項」の区分を設けて，当該変更が行われた旨を記載しなければならない。", "a": false, "c": "H26Ⅰ⑮ウ", "e": "正当な理由によらない会計方針の変更に重要性がある場合は，重要な虚偽表示となるため，除外事項として扱わなければならない。"}, {"l": 155, "m": "追記情報", "sb": "", "i": "B", "r": "", "q": "財務諸表に重要な影響を及ぼす会計方針の変更があり，それが正当な理由によるものであって除外事項とはならない場合，監査人は，監査報告書の強調事項区分に，会計方針の変更を行った旨，正当な理由によるものと認めた根拠，会計方針の変更による影響額を記載しなければならない。", "a": false, "c": "H27Ⅱ⑰ア", "e": "正当な理由による会計方針の変更について強調事項区分を設ける場合，監査人は，変更理由や当該変更理由の正当性の根拠まで記載する必要はなく，会計方針等の変更が行われた旨のみを記載する。"}, {"l": 156, "m": "追記情報", "sb": "", "i": "B", "r": "", "q": "財務諸表に適切に開示されている重要な偶発事象について，監査人によって，監査報告書にその他の事項区分が設けられることはないが，監査報告書に強調事項区分が設けられることはある。", "a": true, "c": "H30Ⅰ⑲ア", "e": ""}, {"l": 157, "m": "追記情報", "sb": "", "i": "A", "r": "", "q": "我が国において一般に公正妥当と認められる監査の基準では，国際監査基準に倣って，後発事象は，期末日の翌日から監査報告書日までに発生した事象と，監査報告書日後に監査人が知るところとなった事実を含むものとされている。", "a": false, "c": "H28Ⅱ⑰イ", "e": "我が国の監査の基準では，後発事象には，事後判明事実は含まないものとされている。"}, {"l": 158, "m": "追記情報", "sb": "", "i": "A", "r": "", "q": "財務諸表の利用者の理解に関連するため説明を付す必要があると監査人が判断した修正後発事象は，監査報告書のその他の事項区分に記載されなければならない。", "a": false, "c": "H28Ⅱ⑰ウ", "e": "修正後発事象が，その他の事項区分に記載されることはない。"}, {"l": 159, "m": "追記情報", "sb": "", "i": "A", "r": "", "q": "監査人は，財務諸表に重要な後発事象の記載が行われていないと判断した場合には，説明事項として追記情報を記載しなければならない。", "a": false, "c": "H23Ⅱ⑱ア", "e": "財務諸表に重要な後発事象の記載が行われていないことは重要な虚偽表示であるため，追記情報ではなく除外事項として扱うべきである。"}, {"l": 160, "m": "追記情報", "sb": "", "i": "A", "r": "", "q": "監査人は，期末日の翌日から監査報告書日までの間に発生し，財務諸表の修正又は財務諸表における開示が要求される全ての事象を識別したことについて，十分かつ適切な監査証拠を入手するために立案した監査手続を実施しなければならないが，期末日現在の残高についての監査証拠の入手を目的とする手続によって，後発事象に関する証拠を入手する場合がある。", "a": true, "c": "H30Ⅱ⑲イ", "e": "例えば，会計上の見積りの合理性に関する監査証拠を入手するための手続の過程で，監査報告書日までに発生した事象（後発事象）に関する情報を入手することがある。※講義レジュメ③-14-11参照"}, {"l": 161, "m": "追記情報", "sb": "", "i": "A", "r": "", "q": "監査人は，期末日の翌日から監査報告書日までの間に発生し，財務諸表の修正又は財務諸表における開示が要求される全ての事象を識別したことについて十分かつ適切な監査証拠を入手するために立案した監査手続を実施しなければならない。当該監査手続の中には，経営者への質問や，期末日後に取締役会，監査役会，監査等委員会又は監査委員会，株主総会が開催された場合は，議事録の閲覧が含まれる。", "a": true, "c": "H29Ⅰ⑰イ／R４Ⅱ⑲ア", "e": ""}, {"l": 162, "m": "追記情報", "sb": "", "i": "A", "r": "", "q": "監査人は，期末日の翌日から監査報告書日までの間に発生し，財務諸表の修正又は財務諸表における開示が要求される全ての事象を識別するために，当該期間に行われる監査手続に含めなければならないものとして，期末日後の期間に対する予算や資金計画のような最新の利用可能な経営管理資料を通読しなければならない。", "a": false, "c": "H30Ⅱ⑲ア", "e": "本肢の手続は，後発事象の識別のための監査手続に「加えて実施することがある」ものであり，必ず含めなければならないものではない。"}, {"l": 163, "m": "追記情報", "sb": "", "i": "A", "r": "", "q": "会社法における監査報告書日後，金融商品取引法における監査報告書日までに発生した修正後発事象は，金融商品取引法に基づいて作成される財務諸表においては，開示後発事象に準じて取り扱われる。", "a": true, "c": "H29Ⅰ⑰ア", "e": ""}, {"l": 164, "m": "追記情報", "sb": "", "i": "A", "r": "", "q": "監査人は，監査報告書日には存在せず，その翌日から財務諸表の発行日までの間に発生した事象を識別した場合には，当該事象に関して監査手続を実施する必要はない。", "a": true, "c": "H28Ⅱ⑰ア", "e": "厳密に考えれば誤りと判断すべき記述。例えば，金融商品取引法監査報告書日後に発生した後発事象について，経営者が財務諸表に注記を行う場合，監査人は，当該事象に関して監査手続を実施する必要がある。本肢は，他の記述との比較で正しいと判断することが求められた。"}, {"l": 165, "m": "監査報告に関するその他の論点", "sb": "", "i": "A", "r": "", "q": "財務諸表の発行日とは，第三者が監査報告書と監査した財務諸表を入手することが可能となる日付をいい，監査報告書日以降で，かつ企業に監査報告書が提出される日以降の日付でなければならない。", "a": true, "c": "R４Ⅱ⑲エ", "e": ""}, {"l": 166, "m": "監査報告に関するその他の論点", "sb": "", "i": "A", "r": "", "q": "監査報告書日は，財務諸表に対する意見表明の基礎となる十分かつ適切な監査証拠を監査人が入手した日以後にしなければならないので，監査人は監査報告書日後に財務諸表に関していかなる監査手続を実施する義務も負わないが，監査報告書日の翌日から財務諸表発行日までの間に事後判明事実を知ることとなった場合は，経営者への質問等の監査手続を実施しなければならない。", "a": true, "c": "H27Ⅱ⑰イ", "e": ""}, {"l": 167, "m": "監査報告に関するその他の論点", "sb": "", "i": "A", "r": "", "q": "監査人は，もし監査報告書日に気づいていたとすれば監査報告書を訂正する原因となった可能性のある事実を，監査報告書日の翌日から財務諸表の発行日までの間に把握した場合には，当該事実への対応について経営者と協議することの必要性について検討しなければならない。", "a": false, "c": "H25Ⅱ⑰ウ", "e": "本肢のような場合には，当該事実に関する経営者との協議を必ず実施しなければならない。"}, {"l": 168, "m": "監査報告に関するその他の論点", "sb": "", "i": "A", "r": "", "q": "監査人が，監査報告書発行の翌日から財務諸表の発行日までの間に，もし監査報告書日現在に気付いていたとしたら，監査報告書を修正する原因となった可能性のある事実を知り，経営者（及び適切な場合，監査役等）と協議した結果，経営者が財務諸表を修正又は開示を追加する場合がある。このとき，監査人は，修正又は開示が追加された財務諸表に対して必要な監査手続を実施するが，いかなる場合であっても監査報告書を差し替える必要はない。", "a": false, "c": "H29Ⅰ⑰ウ", "e": "本肢のような場合には，当該修正又は開示が追加された財務諸表に対する監査報告書に差し替える必要がある。"}, {"l": 169, "m": "監査報告に関するその他の論点", "sb": "", "i": "A", "r": "", "q": "監査人は，監査報告書日の翌日から財務諸表の発行日までの間に，事後判明事実を知るところとなり，監査人が財務諸表の修正又は財務諸表における開示が必要であると判断する状況において，まだ監査報告書を企業に提出しておらず，かつ，経営者が財務諸表の修正又は開示を行わない場合，除外事項付意見を表明することがある。", "a": true, "c": "H30Ⅱ⑲ウ", "e": ""}, {"l": 170, "m": "監査報告に関するその他の論点", "sb": "", "i": "A", "r": "", "q": "監査人は，財務諸表が発行された後に，もし監査報告書日現在に気付いていたとしたら監査報告書を修正する原因となった可能性のある事実が判明した場合には，財務諸表の訂正が必要かどうかを判断しなければならない。", "a": true, "c": "H28Ⅱ⑰エ", "e": ""}, {"l": 171, "m": "監査報告に関するその他の論点", "sb": "", "i": "A", "r": "", "q": "事後判明事実が財務諸表の発行日後に発生し，財務諸表の訂正が必要となった場合，監査人は，当該訂正に必要な監査手続を実施するほか，監査報告書を差し替えなければならない。", "a": false, "c": "R４Ⅱ⑲ウ", "e": "財務諸表が訂正される場合，監査人は，訂正後の財務諸表に対して監査報告書を発行するのであって，既に発行済みの監査報告書と差し替えるわけではない。"}, {"l": 172, "m": "監査報告に関するその他の論点", "sb": "", "i": "A", "r": "", "q": "監査人は，財務諸表が発行された後に，事後判明事実を知るところとなり，経営者が財務諸表を訂正する場合，当該財務諸表に対する監査報告書を提出するが，監査人が以前に提出した監査報告書について記載する必要はない。", "a": false, "c": "H30Ⅱ⑲エ", "e": "本肢のような場合には，訂正後の財務諸表に対する監査報告書の強調事項区分又はその他の事項区分に，監査人が以前に提出した監査報告書について記載する必要がある。"}, {"l": 173, "m": "監査報告に関するその他の論点", "sb": "", "i": "A", "r": "", "q": "監査人が，財務諸表が発行された後，もし監査報告書日現在に気付いていたとしたら，監査報告書を修正する原因となった可能性のある事実を知り，経営者（及び適切な場合，監査役等）と協議した結果，財務諸表の訂正が必要と監査人が判断したが，経営者が訂正しない場合，監査人は，財務諸表の利用者による監査報告書への依拠を防ぐための措置を，経営者及び監査役等に事前通知することなく直ちに講じなければならない。", "a": false, "c": "H29Ⅰ⑰エ", "e": "本肢のような場合，まず監査人は，財務諸表の利用者による監査報告書への依拠を防ぐための措置を講じる予定であることを，経営者及び監査役等に事前に通知しなければならない。なお，このような通知にもかかわらず，経営者が必要な対応を行わない場合，監査人は，監査報告書への依拠を防ぐための適切な措置を講じることになる。"}, {"l": 174, "m": "監査報告に関するその他の論点", "sb": "", "i": "A", "r": "", "q": "財務諸表に表示される比較情報は，監査意見の表明の方式によって，対応数値方式と比較財務諸表方式に区分されるが，いずれの方式であっても実施される監査手続は同じである。", "a": true, "c": "R４Ⅱ⑱ア", "e": ""}, {"l": 175, "m": "監査報告に関するその他の論点", "sb": "", "i": "A", "r": "", "q": "比較情報が対応数値によって表示されている場合，監査人は，当年度だけでなく比較情報の対象である前年度の財務諸表についても経営者確認書に記載するよう経営者に要請する必要がある。", "a": false, "c": "H30Ⅱ⑱エ／H28Ⅰ⑲ウ", "e": "比較情報が対応数値によって表示されている場合は，当年度の財務諸表のみについて，経営者確認書に記載することを要請する。"}, {"l": 176, "m": "監査報告に関するその他の論点", "sb": "", "i": "A", "r": "", "q": "財務諸表に表示される比較情報が対応数値として表示される場合，過年度に作成された経営者確認書が依然として適切であることを経営者が再確認する必要があるため，監査人は，比較情報の全ての対象年度を含めた確認事項を当年度の経営者確認書に記載することを要請しなければならない。", "a": false, "c": "R４Ⅱ⑱イ", "e": "同上"}, {"l": 177, "m": "監査報告に関するその他の論点", "sb": "", "i": "A", "r": "", "q": "比較情報が対応数値として表示される場合，監査意見は対応数値を含む当年度の財務諸表全体に対して表明されるため，監査人は対応数値については原則として意見を表明しない。", "a": true, "c": "H28Ⅰ⑲ア", "e": ""}, {"l": 178, "m": "監査報告に関するその他の論点", "sb": "", "i": "A", "r": "", "q": "前年度に表明された監査意見が除外事項付意見であり，かつ，その原因となった事項が未解消である状況において，当該事項が当年度の数値には関連しない場合においても，当年度の数値と対応数値の比較可能性の観点から，当年度の財務諸表に対する監査報告書において除外事項として取り扱うことが必要となることがある。", "a": true, "c": "R２Ⅱ⑲イ／H30Ⅱ⑱ア", "e": "なお，「必要となる『ことがある』」となっている本肢の末尾は，「必要となる」と読んで構わない。"}, {"l": 179, "m": "監査報告に関するその他の論点", "sb": "", "i": "A", "r": "", "q": "比較情報が対応数値として表示される場合，以前に発行した前年度の監査報告書において除外事項付意見が表明されており，かつ，当該除外事項付意見の原因となった事項が未解消であるときは，監査人は，当年度の財務諸表に対して無限定意見を表明することはできない。", "a": true, "c": "H28Ⅱ⑳ア／H25Ⅱ⑲イ", "e": ""}, {"l": 180, "m": "監査報告に関するその他の論点", "sb": "", "i": "A", "r": "", "q": "比較情報が対応数値として表示される場合，監査人が，当年度の監査において，以前に無限定意見が表明されている前年度の財務諸表に重要な虚偽表示が存在するという監査証拠を入手したとしても，対応数値が適切に修正再表示され，かつ，注記事項が妥当であるときは，当年度の財務諸表に含まれる対応数値に関する除外事項付意見は表明されない。", "a": true, "c": "R４Ⅱ⑱ウ／H28Ⅱ⑳イ", "e": ""}, {"l": 181, "m": "監査報告に関するその他の論点", "sb": "", "i": "A", "r": "", "q": "監査人は，前任監査人が以前に無限定意見を表明した前年度の財務諸表に影響を及ぼす重要な虚偽表示が存在すると判断する場合，通常，適切な階層の経営者，監査役等と協議を行い，前任監査人には報告しなければならない。", "a": false, "c": "R２Ⅱ⑲エ／H30Ⅱ⑱イ", "e": "本肢の場合，監査人は，適切な階層の経営者及び監査役等に報告すると共に，前任監査人を含め三者間で協議するよう求めなければならない。したがって，当該協議は前任監査人を含めて行う必要がある（報告で済ませることはできない）。"}, {"l": 182, "m": "監査報告に関するその他の論点", "sb": "", "i": "A", "r": "", "q": "前年度の財務諸表を前任監査人が監査している場合であっても，監査人は，前任監査人が対応数値を監査している旨及びその意見を監査報告書に記載しないことがある。", "a": true, "c": "R２Ⅱ⑲ウ", "e": "本肢の記載は，当該記載が法令等によって禁止されておらず，かつ監査人がそれを記載することにした場合に行う。"}, {"l": 183, "m": "監査報告に関するその他の論点", "sb": "", "i": "A", "r": "", "q": "比較情報が対応数値として表示される場合に，前年度の財務諸表が前任監査人に監査された旨が，当年度の財務諸表を監査する監査人によって，当年度の監査報告書のその他の事項区分に記載されることはないが，強調事項区分に記載されることはある。", "a": false, "c": "H30Ⅰ⑲イ", "e": "前年度の財務諸表が前任監査人に監査された旨の記載は，強調事項区分ではなく，その他の事項区分に記載される。"}, {"l": 184, "m": "監査報告に関するその他の論点", "sb": "", "i": "A", "r": "", "q": "前年度の財務諸表が監査されていない場合，当該事実について利用者の注意を喚起する必要があると判断したときは，監査人は，監査報告書の強調事項区分に，対応数値が監査されていない旨を記載しなければならない。", "a": false, "c": "R２Ⅱ⑲ア", "e": "前年度の財務諸表が監査されていない旨の記載は，強調事項区分ではなく，その他の事項区分に記載される。"}, {"l": 185, "m": "監査報告に関するその他の論点", "sb": "", "i": "A", "r": "", "q": "比較情報が対応数値によって表示されている場合，前年度の財務諸表が監査されていないとき，監査人は，その他の事項区分に対応数値が監査されていない旨を記載しなければならないが，当年度の財務諸表の期首残高に関する十分かつ適切な監査証拠を入手できないときは監査範囲の制約として取り扱う。", "a": true, "c": "H30Ⅱ⑱ウ", "e": ""}, {"l": 186, "m": "監査報告に関するその他の論点", "sb": "", "i": "A", "r": "", "q": "前年度の財務諸表が監査されていない場合，監査報告書のその他の事項区分に比較情報が監査されていない旨を記載することによって，当年度の財務諸表の期首残高についての監査手続が免除される。", "a": false, "c": "R４Ⅱ⑱エ／H28Ⅰ⑲エ", "e": "その他の事項区分に対応数値が監査されていない旨を記載したとしても，期首残高に関する十分かつ適切な監査証拠の入手は免除されない。これは，比較情報が対応数値として表示されているか比較財務諸表として表示されているかにかかわらず同じである。"}, {"l": 187, "m": "監査報告に関するその他の論点", "sb": "", "i": "A", "r": "", "q": "比較情報が比較財務諸表として表示される場合，監査意見は財務諸表に表示されたそれぞれの年度を対象として表明される。", "a": true, "c": "H28Ⅰ⑲イ", "e": ""}, {"l": 188, "m": "監査報告に関するその他の論点", "sb": "", "i": "A", "r": "", "q": "比較情報が比較財務諸表として表示される場合，当年度の監査に関連して前年度の財務諸表に対して監査意見を表明するに当たり，前年度の財務諸表に対する意見が以前に表明した意見と異なることとなったときには，監査人は監査報告書の強調事項区分で監査意見が異なる理由を記載しなければならない。", "a": false, "c": "H28Ⅱ⑳ウ", "e": "本肢のような場合，強調事項区分ではなくその他の事項区分に，監査意見が異なる理由を記載しなければならない。"}, {"l": 189, "m": "監査報告に関するその他の論点", "sb": "", "i": "A", "r": "", "q": "比較情報が比較財務諸表として表示される場合，監査人が当年度の監査において，前任監査人が以前に無限定意見を表明した前年度の財務諸表に重要な影響を及ぼす虚偽表示が存在すると判断するときには，当該虚偽表示について経営者，監査役等及び前任監査人に報告しなければならない。", "a": false, "c": "H28Ⅱ⑳エ", "e": "本肢の場合に行う虚偽表示の報告は，前任監査人に対してではなく，適切な階層の経営者及び監査役等に対して行うものである。また，本肢の場合，監査人は，前任監査人を含め三者間で協議するよう会社に求めなければならない。"}]}, {"n": 5, "name": "他者の作業の利用", "qs": [{"l": 1, "m": "グループ監査における特別な考慮事項", "sb": "", "i": "A", "r": "", "q": "監査人は，監査を行うに当たって，自らの組織として監査業務の質を確保しなければならないが，他の監査人の監査結果を利用するに当たっては，当該他の監査人の監査業務の質の確保まで要求されるわけではない。", "a": false, "c": "H30Ⅱ⑪ウ／H29Ⅰ⑫エ", "e": "監査人は，自ら実施する監査業務の質の確保のみならず，利用する他の監査人の監査業務の質の確保も求められる。"}, {"l": 2, "m": "グループ監査における特別な考慮事項", "sb": "", "i": "A", "r": "", "q": "グループ財務諸表に関する監査の基準は，連結財務諸表の監査のみならず，個別財務諸表が複数の構成単位から作成される場合や，単一の構成単位から作成される財務諸表の監査において他の監査人を関与させる場合にも必要に応じて適用されることがある。", "a": true, "c": "R５Ⅱ⑱ア", "e": "本肢にある「グループ財務諸表に関する監査の基準」は，監基報600のことを指している。この点，監基報600は，連結財務諸表の監査のみならず，複数の支店又は部門によって組織されている企業の個別財務諸表の監査や，単一の構成単位からなる企業の個別財務諸表の監査（遠方にある事業所の立会等において構成単位の監査人を利用する場合等）にも適用される。"}, {"l": 3, "m": "グループ監査における特別な考慮事項", "sb": "", "i": "A", "r": "", "q": "グループ監査チームは，構成単位の財務情報に関する作業の実施を構成単位の監査人に依頼する場合，構成単位の監査人が同じネットワークに属する他の事務所に所属していても，独立性に問題がないかを理解しなければならない。", "a": true, "c": "R５Ⅱ⑱イ", "e": "監査人は，同じネットワークに所属する者に関しても，職業倫理の遵守及び独立性の保持に関する品質目標を設定しなければならないため，本肢は正しい内容となる。👉講義レジュメ②-2-12"}, {"l": 4, "m": "グループ監査における特別な考慮事項", "sb": "", "i": "A", "r": "", "q": "グループ監査人は，構成単位の監査人に独立性がないと判断した場合であっても，その構成単位の監査人の作業に関与し，追加の監査手続を実施すれば，構成単位の財務情報に関する作業の実施を当該構成単位の監査人に依頼することができる。", "a": false, "c": "H29Ⅰ⑩ア", "e": "構成単位の監査人に独立性がない場合は，グループ監査人が，どれだけその構成単位の監査人の作業に関与し，追加の監査手続を実施したとしても，その状況を克服することはできないため，当該構成単位の監査人を関与させてはならない（依頼できない）。"}, {"l": 5, "m": "グループ監査における特別な考慮事項", "sb": "", "i": "A", "r": "", "q": "親会社の監査人は，連結子会社の監査人が職業的専門家としての能力を有しているかについて重大な懸念を抱いている場合には，連結子会社の監査人に作業の実施を依頼してはならない。", "a": true, "c": "R３⑱エ", "e": ""}, {"l": 6, "m": "グループ監査における特別な考慮事項", "sb": "", "i": "B", "r": "", "q": "グループ監査では，グループ監査人は，グループ経営者によって識別された関連当事者との関係又は取引及びグループ監査人が把握しているその他の関連当事者に係る情報を，各構成単位の監査人に伝達しなければならない。", "a": true, "c": "H29Ⅱ⑮エ", "e": ""}, {"l": 7, "m": "グループ監査における特別な考慮事項", "sb": "", "i": "A", "r": "", "q": "グループ監査チームは，グループ財務諸表の取引種類，勘定残高又は注記事項が構成単位ごとに細分化されている場合，構成単位の手続実施上の重要性を決定しなければならないが，この構成単位の手続実施上の重要性は，グループ・レベルの手続実施上の重要性より高く設定しなければならない。", "a": false, "c": "R５Ⅱ⑱エ", "e": "合算リスクに対応するため，構成単位の手続実施上の重要性は，グループ・レベルの手続実施上の重要性より低く設定しなければならない。"}, {"l": 8, "m": "グループ監査における特別な考慮事項", "sb": "", "i": "A", "r": "", "q": "連結財務諸表は企業集団に属する親会社及び子会社の個別財務諸表を基礎として作成されることから，個々の構成単位の手続実施上の重要性の合計は，原則としてグループ・レベルの手続実施上の重要性に一致する。", "a": false, "c": "H26Ⅰ⑭ア", "e": "個々の構成単位の手続実施上の重要性の合計は，グループ・レベルの手続実施上の重要性と一致する必要はなく，それを超える場合もある。"}, {"l": 9, "m": "グループ監査における特別な考慮事項", "sb": "", "i": "A", "r": "", "q": "グループ監査人は，構成単位の監査人に対して，重要性等を通知する必要はない。", "a": false, "c": "H23Ⅱ⑯エ", "e": "グループ監査人は，構成単位の手続実施上の重要性等について，構成単位の監査人とコミュニケーションを行わなければならない。"}, {"l": 10, "m": "グループ監査における特別な考慮事項", "sb": "", "i": "B", "r": "", "q": "グループ監査人は，構成単位の監査人から，グループ監査についてのグループ監査人の結論に関連する事項の報告を求めなければならず，その報告事項には構成単位において識別された内部統制システムの不備に関する説明も含まれる。", "a": true, "c": "H27Ⅱ⑯ウ", "e": ""}, {"l": 11, "m": "グループ監査における特別な考慮事項", "sb": "", "i": "B", "r": "", "q": "グループ監査チームは，構成単位の財務情報について，構成単位の監査人が実施すべき作業の種類を決定し，構成単位の監査人に指示することまでが求められており，当該構成単位の監査人の作業を評価する必要はない。", "a": false, "c": "R５Ⅱ⑱ウ", "e": "グループ監査チームは，構成単位の監査人の作業の妥当性を評価する必要がある。"}, {"l": 12, "m": "グループ監査における特別な考慮事項", "sb": "", "i": "A", "r": "", "q": "構成単位の監査人は，グループ財務諸表の監査のために構成単位の財務情報に関する作業を実施するが，グループ財務諸表の監査意見については責任を有しない。", "a": true, "c": "H29Ⅰ⑩エ", "e": ""}, {"l": 13, "m": "グループ監査における特別な考慮事項", "sb": "", "i": "A", "r": "", "q": "平成１４年改訂では，企業活動の国際化・多角化及び連結対象会社の増加による監査範囲の拡大に伴い，他の監査人の監査の結果を利用する範囲も拡大することから，他の監査人を利用した場合には，その旨を監査報告書に記載することとした。", "a": false, "c": "R４Ⅱ⑪ア", "e": "他の監査人を利用した場合，原則として，その旨を監査報告書に記載してはならない。"}, {"l": 14, "m": "グループ監査における特別な考慮事項", "sb": "", "i": "A", "r": "", "q": "グループ監査人は，他の監査人の業務を利用する場合において，連結財務諸表に対して無限定適正意見以外の監査意見を表明するときには，他の監査人の業務の利用という事実を監査報告書に記載することがある。", "a": true, "c": "H28Ⅰ⑯ウ", "e": "「無限定適正意見以外の監査意見」には，監査範囲の制約に係る除外事項付意見を表明する場合が含まれる。この点を踏まえれば，他の監査人を利用した旨を監査報告書に記載する「ことがある（意見に関する除外の場合は記載しないが，監査範囲の制約の場合は記載することがある）」としている本肢は正しい。"}, {"l": 15, "m": "グループ監査における特別な考慮事項", "sb": "", "i": "B", "r": "", "q": "監査人は，連結子会社の監査人から不正についての報告を受けた場合には，連結財務諸表の作成に責任を有する経営者のうち適切な者にその事項を報告しなければならない。", "a": true, "c": "H26Ⅰ⑭エ", "e": ""}, {"l": 16, "m": "グループ監査における特別な考慮事項", "sb": "", "i": "B", "r": "", "q": "グループを構成する企業又は事業単位の財務諸表に重要な影響を及ぼす可能性がある事項で，当該企業又は事業単位の経営者が把握していない事項にグループ監査人が気付いた場合，グループ監査人は，まず当該事項について当該企業又は事業単位の経営者と協議しなければならない。", "a": false, "c": "H31Ⅱ⑱イ", "e": "本肢の場合，グループ監査人は，当該事項を企業又は事業単位の経営者に伝達するようにグループ経営者に依頼しなければならないのであって，企業又は事業単位の経営者との協議は要求されていない。"}, {"l": 17, "m": "専門家の業務の利用", "sb": "", "i": "A", "r": "", "q": "監査人に求められる専門知識には，被監査会社の製品の原価計算に関する専門知識のほか，当該製品の工学的な特性や製法に関する専門知識も含まれる。", "a": false, "c": "R２Ⅰ⑬ウ", "e": "製品の工学的な特性や製法に関する専門知識は，監査人には求められない。"}, {"l": 18, "m": "専門家の業務の利用", "sb": "", "i": "A", "r": "", "q": "職業的専門家としての専門能力は，財務諸表の適正性についての意見を表明するために必要な能力を意味するが，環境債務及び土地浄化費用の評価に必要とされる専門知識は含まれない。", "a": true, "c": "H25Ⅱ⑧イ", "e": ""}, {"l": 19, "m": "専門家の業務の利用", "sb": "", "i": "A", "r": "", "q": "専門家の業務を利用した監査人が，当該専門家の業務を十分に適切なものとして評価したうえで適切な監査証拠として受け入れた場合には，その範囲において監査意見に対する監査人の責任は軽減される。", "a": false, "c": "H26Ⅰ⑨エ", "e": "専門家の業務を利用した場合でも，監査意見に対する監査人の責任は軽減されない。"}, {"l": 20, "m": "専門家の業務の利用", "sb": "", "i": "A", "r": "", "q": "監査人は監査意見に単独で責任を負うが，除外事項付意見の理由を説明するために，専門家の同意を得て，専門家の業務を利用した事実等，専門家について監査報告書において言及することが適切な場合がある。", "a": true, "c": "H25Ⅱ⑮イ／H23Ⅱ⑮イ", "e": ""}, {"l": 21, "m": "専門家の業務の利用", "sb": "", "i": "A", "r": "", "q": "監査人は，除外事項付意見を表明する場合において，監査報告書において専門家の業務を利用したことに言及するときは，必要に応じて当該専門家の同意を事前に得るとともに，当該記載が監査意見に対する監査人の責任を軽減しないことを監査報告書において示さなければならない。", "a": true, "c": "H28Ⅱ⑮ウ", "e": ""}, {"l": 22, "m": "専門家の業務の利用", "sb": "", "i": "B", "r": "", "q": "監査人は，経営者が財務諸表の作成に当たって会計以外の分野における専門家の業務を利用した場合にも，自らも，当該分野に係る専門家の業務を利用しなければならない。", "a": false, "c": "R５Ⅰ⑰イ", "e": "たしかに，監査人が専門家の業務を利用するかどうかを判断する場合の考慮事項には，「経営者が財務諸表の作成に当たって利用する専門家の有無」があるが，経営者が専門家を利用しているからといって，必ず，監査人も専門家を利用するわけではない。"}, {"l": 23, "m": "専門家の業務の利用", "sb": "", "i": "A", "r": "", "q": "監査人は，監査人の利用する専門家が，業務を依頼した外部の専門家である場合には，監査人の目的に照らして当該専門家が必要な適性，能力及び客観性を備えているかどうかを評価しなければならないが，監査人の利用する専門家が監査人の雇用する内部の専門家である場合にはその必要はない。", "a": false, "c": "H28Ⅱ⑮ア", "e": "監査人の利用する専門家が監査人の雇用する内部の専門家である場合にも，本肢の評価は必要である。"}, {"l": 24, "m": "専門家の業務の利用", "sb": "", "i": "A", "r": "", "q": "監査人は，専門家の業務を利用する場合，当該専門家に対して，監査人と同じ水準の独立性を保持しているかどうかを，質問等により確認しなければならない。", "a": false, "c": "H23Ⅱ⑮エ", "e": "監査人が利用する専門家は，必要な客観性を備える必要はあるが，監査人と同じ水準の「独立性」を保持することまでは求められてない。"}, {"l": 25, "m": "専門家の業務の利用", "sb": "", "i": "A", "r": "", "q": "外部の専門家を利用する場合，当該専門家の独立性への阻害要因の重大性と，セーフガードの必要性に関する評価は，当該専門家の役割と，監査に関連した専門家の業務の重要性に依存することがある。", "a": false, "c": "H25Ⅱ⑮エ", "e": "「独立性」となっている点が誤り。なお，阻害要因の重大性とセーフガードの必要性に関する評価が，専門家の役割と専門家の業務の重要性に依存する旨の記述は正しい。"}, {"l": 26, "m": "専門家の業務の利用", "sb": "", "i": "A", "r": "", "q": "監査人は，監査人が利用しようとする外部の専門家について，客観性への阻害要因が存在すると判断したとしても，適切な対応によって阻害要因が除去された場合には，当該専門家の業務を利用することができる。", "a": true, "c": "R５Ⅰ⑰エ", "e": ""}, {"l": 27, "m": "専門家の業務の利用", "sb": "", "i": "A", "r": "", "q": "監査人の利用する専門家と監査人との間での，専門家の業務の内容，範囲及び目的についての合意並びに監査人及び専門家のそれぞれの役割と責任についての合意は書面又は電磁的記録によらなければならない。", "a": false, "c": "H28Ⅱ⑮イ／H25Ⅱ⑮ア／H23Ⅱ⑮ア", "e": "本肢の合意は，適切な場合に書面又は電磁的記録で行えばよく，必ず書面又は電磁的記録によらなければならないわけではない。"}, {"l": 28, "m": "専門家の業務の利用", "sb": "", "i": "A", "r": "", "q": "監査人は，監査人が雇用する内部の専門家を利用する場合には，専門家の業務について熟知していることから，業務の内容，範囲及び目的等の事項について，当該専門家との間で合意しておくことは求められていない。", "a": false, "c": "R５Ⅰ⑰ウ", "e": "専門家を利用する場合に行う合意は，当該専門家が外部の専門家であるか内部の専門家であるかにかかわらず必要となる。"}, {"l": 29, "m": "専門家の業務の利用", "sb": "", "i": "A", "r": "", "q": "監査人に適用される職業倫理で要求される秘密保持に関する事項は，監査人に限定して要求される事項であるため，監査人が利用する専門家には適用されない。", "a": false, "c": "R４Ⅰ⑫エ", "e": "監査人に適用される職業倫理で要求される秘密保持に関する事項は，専門家にも適用される。"}, {"l": 30, "m": "専門家の業務の利用", "sb": "", "i": "A", "r": "", "q": "会計上の重要な見積りの監査において，監査人が外部の専門家を利用している場合，監査チーム内の専門家を利用している場合と同様に監査調書には外部の専門家の作成した調書を含めなければならない。", "a": false, "c": "H25Ⅰ⑳エ", "e": "監査チーム内の専門家の調書は監査調書の一部を構成するが，外部の専門家の調書は，他に合意がない限り，当該専門家の所有に属し，監査調書の一部を構成しない。"}, {"l": 31, "m": "専門家の業務の利用", "sb": "", "i": "A", "r": "", "q": "監査人が専門家の業務を利用する場合，監査人に適用される職業倫理で要求される秘密保持に関する事項は，たとえ当該専門家が外部の専門家であったとしても適用することが求められる。", "a": true, "c": "H26Ⅰ⑨ウ", "e": ""}, {"l": 32, "m": "専門家の業務の利用", "sb": "", "i": "A", "r": "", "q": "専門家の業務を利用する監査人は，その専門分野において当該専門家が採用する方法，仮定，さらにはモデルの適用の適切性と合理性を事前に評価しておかなければならない。", "a": false, "c": "H25Ⅱ⑮ウ", "e": "本肢の評価は，専門家を利用する前ではなく，専門家の業務結果が報告された後に行うものである。"}, {"l": 33, "m": "専門家の業務の利用", "sb": "", "i": "A", "r": "", "q": "監査人の利用する専門家の業務が監査人の目的に照らして適切ではないと判断した場合の監査人の対応としては，当該専門家又は他の専門家に対する追加業務の依頼と，監査人自身が当該状況において適切と判断する追加的監査手続の実施とがある。", "a": true, "c": "H28Ⅱ⑮エ", "e": ""}, {"l": 34, "m": "内部監査の利用", "sb": "", "i": "A", "r": "", "q": "監査人は，内部監査の目的及び手続が，監査人の監査の目的に適合するならば，内部監査の結果を利用することができる。", "a": false, "c": "H31Ⅱ①エ", "e": "内部監査の目的及び手続が監査の目的に適合しているとしても，内部監査機能の客観性や能力の観点から内部監査人の作業が信頼できない場合には利用できない。"}, {"l": 35, "m": "内部監査の利用", "sb": "", "i": "A", "r": "", "q": "内部監査は法律で義務付けられているものではないが，監査人は，内部監査人と効果的なコミュニケーションを行うことによって，監査人の作業に影響を与える可能性のある情報が監査人に提供される関係が構築される。", "a": true, "c": "R４Ⅰ②ウ", "e": ""}, {"l": 36, "m": "内部監査の利用", "sb": "", "i": "B", "r": "", "q": "監査人は，被監査企業が内部監査部門を有している場合には，内部監査部門の責任の内容や経営組織における位置付け，及び内部監査部門により実施された又は実施される予定の業務を理解しなければならない。", "a": true, "c": "H26Ⅰ⑪エ", "e": ""}, {"l": 37, "m": "内部監査の利用", "sb": "", "i": "B", "r": "", "q": "監査調書は，監査人の責任において監査人自身が実施した作業に基づいて作成されるものであるため，内部監査人の特定の作業を利用する場合であっても内部監査人の作業に関して記載する必要はない。", "a": false, "c": "H30Ⅱ⑫ア", "e": "監査人は，内部監査人の特定の作業を利用する場合，内部監査人の作業の適切性の評価に関する結論及び実施した監査手続を監査調書に記載しなければならない。"}]}, {"n": 6, "name": "その他の重要論点", "qs": [{"l": 1, "m": "継続企業の前提に関する開示と監査", "sb": "", "i": "A", "r": "", "q": "財務報告の枠組みに，経営者に対して継続企業の前提に関する評価を行うことを要求する明示的な規定がない場合，経営者は，財務諸表の作成に際して継続企業の前提について評価する必要はない。", "a": false, "c": "R６Ⅱ⑱ア", "e": "継続企業の前提は財務諸表の作成における基本的な原則であるため，本肢の場合でも，経営者は財務諸表の作成において継続企業の前提を評価する必要がある。"}, {"l": 2, "m": "継続企業の前提に関する開示と監査", "sb": "", "i": "A", "r": "", "q": "継続企業の前提に関する監査人の責任は，企業の事業継続能力そのものを認定し，企業の存続を保証することではなく，経営者が継続企業を前提として財務諸表を作成することの適切性について十分かつ適切な監査証拠を入手し，継続企業の前提に関する重要な不確実性が認められるか否かを結論付けることである。", "a": true, "c": "H30Ⅰ⑰ア", "e": ""}, {"l": 3, "m": "継続企業の前提に関する開示と監査", "sb": "", "i": "A", "r": "", "q": "財務諸表監査において行われる，継続企業の前提に重要な疑義があるかどうかの評価は，被監査会社の存続可能性の評価であり，したがって，監査人が無限定適正意見をもって提供する保証には，被監査会社の存続可能性に問題はないという意味が含まれている。", "a": false, "c": "H27Ⅰ①エ", "e": "監査人の責任は，企業の事業継続能力そのものを認定し，企業の存続を保証することにはない。したがって，監査人が無限定適正意見をもって提供する保証には，被監査会社の存続可能性に問題はないという意味は含まれていない。"}, {"l": 4, "m": "継続企業の前提に関する開示と監査", "sb": "", "i": "A", "r": "", "q": "監査人は，経営者が継続企業を前提として財務諸表を作成することの適切性について十分かつ適切な監査証拠を入手していることから，監査報告書に継続企業の前提に関する重要な不確実性についての記載がなければ，財務諸表の利用者は，企業の将来にわたる事業活動の継続が保証されていると考えることができる。", "a": false, "c": "R６Ⅱ⑱ウ／H24Ⅱ⑰ア", "e": "継続企業に関する不確実性についての記載が監査報告書にないとしても，継続企業の前提が保証されていることを意味しない。"}, {"l": 5, "m": "継続企業の前提に関する開示と監査", "sb": "", "i": "A", "r": "", "q": "監査人は，監査報告書において財務諸表の適正表示に関する意見を表明することに加えて，継続企業の前提に関する重要な不確実性が認められる旨の記載した場合であっても，二重責任の原則を逸脱することにはならない。", "a": true, "c": "H25Ⅱ①エ／H25Ⅰ⑮イ", "e": "継続企業の前提に関する重要な不確実性が認められる旨の監査報告書上の記載は，あくまでも，財務諸表における注記を注意喚起する目的で行われるものであるため，二重責任の原則を逸脱することにはならない。"}, {"l": 6, "m": "継続企業の前提に関する開示と監査", "sb": "", "i": "B", "r": "", "q": "監査人は，継続企業の前提に重要な疑義を生じさせるような事象又は状況について経営者が予備的な評価を行っていないときには，監査計画に，リスク評価手続において継続企業の前提で財務諸表を作成する根拠等について経営者と協議することを含めなければならない。", "a": true, "c": "R３⑲エ", "e": ""}, {"l": 7, "m": "継続企業の前提に関する開示と監査", "sb": "", "i": "B", "r": "", "q": "年度監査においては，継続企業の前提に重要な不確実性が認められるか否かについて，少なくとも決算日の翌日から1年間について検討しなければならない。", "a": true, "c": "H25Ⅱ⑨ウ", "e": ""}, {"l": 8, "m": "継続企業の前提に関する開示と監査", "sb": "", "i": "B", "r": "", "q": "監査人は，継続企業の前提に関して経営者が行った評価を検討するに当たって，経営者の評価期間と同じ期間を対象としなければならないため，経営者の評価期間を超えた期間に発生する可能性がある継続企業の前提に重要な疑義を生じさせるような事象又は状況については，質問を実施する必要はない。", "a": false, "c": "H26Ⅱ⑭ウ", "e": "監査人は，経営者の評価期間を超えた期間に発生する可能性がある継続企業の前提に重要な疑義を生じさせるような事象又は状況に関して，経営者に対する質問を実施しなければならない。なお，経営者へ質問を行う以外に，他の監査手続を追加して実施する必要はない点に注意。"}, {"l": 9, "m": "継続企業の前提に関する開示と監査", "sb": "", "i": "B", "r": "", "q": "監査人は，継続企業の前提に重要な疑義を生じさせるような事象又は状況を識別した場合，継続企業の前提に関する重要な不確実性が認められるかどうかを判断するための十分かつ適切な監査証拠を入手するために，継続企業の前提の評価に関連する経営者の対応策の有効性及び実行可能性を検討しなければならない。", "a": true, "c": "R６Ⅱ⑱イ／H30Ⅰ⑰ウ", "e": ""}, {"l": 10, "m": "継続企業の前提に関する開示と監査", "sb": "", "i": "A", "r": "", "q": "監査人は，継続企業の前提に関する監査手続の過程で，事業等のリスクとして記載されることとなった継続企業の前提に重要な疑義を生じさせる事象又は状況については，記載内容の適切性を判断しなければならない。", "a": false, "c": "H24Ⅱ③イ", "e": "「事業等のリスク」は財務諸表外に記載される監査対象外の情報であるため，監査人は当該記載の適切性を判断する責任はない。なお，重要な相違を識別するための通読を行う責任はある。"}, {"l": 11, "m": "継続企業の前提に関する開示と監査", "sb": "", "i": "A", "r": "", "q": "監査人は，継続企業の前提に重要な疑義を生じさせる事象が認められる状況において，当該事象を解消するための合理的な対応策が経営者から提示されない場合，状況に応じて限定付適正意見又は不適正意見を表明しなければならない。", "a": false, "c": "H28Ⅰ⑰イ／H25Ⅰ⑯ア", "e": "対応策が経営者から提示されない状況は，監査範囲の制約の原因となるものである。したがって，監査人は，当該事項の重要性及び広範性の程度に応じて，限定付適正意見の表明又は意見不表明とする。"}, {"l": 12, "m": "継続企業の前提に関する開示と監査", "sb": "", "i": "A", "r": "", "q": "監査人は，被監査企業が債務超過にあるなど，継続企業の前提に重要な疑義を生じさせるような事象又は状況に関して経営者が評価及び対応策を示さないときには，意見を表明してはならない。", "a": false, "c": "H30Ⅱ⑯ウ／H29Ⅱ⑱ア", "e": "本肢のような場合は，当該事項の重要性及び広範性の程度に応じて，限定付適正意見の表明又は意見不表明とする。"}, {"l": 13, "m": "継続企業の前提に関する開示と監査", "sb": "", "i": "A", "r": "", "q": "継続企業の前提に重要な疑義を生じさせるような事象又は状況が存在しているが，経営者は当該事象又は状況に関して，監査人が納得するような評価又は対応策を示さなかった。この状況は，意見を表明しない直接の原因となりうる。", "a": true, "c": "R４Ⅰ⑲イ", "e": ""}, {"l": 14, "m": "継続企業の前提に関する開示と監査", "sb": "", "i": "A", "r": "", "q": "被監査企業の売上が著しく減少し，重要な営業損失が発生しているため，継続企業としての存続に重要な疑義が生じている状況において，かかる重要な疑義に対して，監査人が要請しても経営者が継続企業の前提によって財務諸表を作成することができるかどうかを評価せず，また対応策も提示しない場合，監査人は，当該事項の重要性及び広範性の程度に応じ，限定付適正意見を表明するか又は意見を表明してはならない。", "a": true, "c": "H27Ⅰ⑯ア", "e": "長い記述だが，内容は難しくないため，焦らず丁寧に読むことがポイント。"}, {"l": 15, "m": "継続企業の前提に関する開示と監査", "sb": "", "i": "A", "r": "", "q": "監査人が，継続企業を前提として財務諸表を作成することが適切でないと判断する例として，更生手続開始決定や，再生計画の認可がある。", "a": false, "c": "H30Ⅰ⑰エ", "e": "更生手続や再生手続については，手続開始決定が取消されたり，計画が不認可になった場合に，はじめて継続企業を前提とした財務諸表を作成できないことになる。"}, {"l": 16, "m": "継続企業の前提に関する開示と監査", "sb": "", "i": "A", "r": "", "q": "監査人は，継続企業を前提として財務諸表が作成されているが，継続企業を前提として経営者が財務諸表を作成することが適切でないと判断した場合には，意見を表明してはならない。", "a": false, "c": "R２Ⅱ⑯エ／H29Ⅱ⑱ウ／H25Ⅰ⑯オ／H24Ⅰ⑲オ", "e": "本肢の場合，監査人は，不適正意見を表明しなければならない。"}, {"l": 17, "m": "継続企業の前提に関する開示と監査", "sb": "", "i": "A", "r": "", "q": "監査人は，経営者が作成する財務諸表が継続企業を前提とすることが適切ではないと判断した場合，継続企業を前提とした財務諸表に不適正である旨の意見を表明するとともに，その理由を記載しなければならない。", "a": true, "c": "R５Ⅱ⑲ウ／H30Ⅱ⑯エ", "e": ""}, {"l": 18, "m": "継続企業の前提に関する開示と監査", "sb": "", "i": "A", "r": "", "q": "監査人は，継続企業の前提に重要な疑義を生じさせる状況を識別したが，経営者の対応策について検討した結果，それが当該状況を解消するものであり継続企業の前提に関する重要な不確実性がないと判断した場合は，無限定適正意見を表明する。", "a": true, "c": "H29Ⅱ⑱エ", "e": "特に指示がないため，他に除外事項の原因となる状況がない前提で正誤判断する。"}, {"l": 19, "m": "継続企業の前提に関する開示と監査", "sb": "", "i": "A", "r": "", "q": "被監査企業の売上が著しく減少し，重要な営業損失が発生しているため，継続企業としての存続に重要な疑義が生じている状況において，かかる重要な疑義に対して，経営者が金融機関からの借入等により対応しているため，継続企業の前提に関する重要な不確実性は認められず継続企業の前提により財務諸表を作成することは適切であると認められる場合，当該状況に関する注記が適切になされていれば，監査人は，無限定適正意見を表明するとともに，当該事項を継続企業の前提に関する重要な不確実性区分に記載しなければならない。", "a": false, "c": "H27Ⅰ⑯イ／H25Ⅰ⑯イ", "e": "本肢は，継続企業の前提に関する重要な不確実性がない場合に関する記述である。この場合，財務諸表の注記は不要であるため，「継続企業の前提に関する重要な不確実性」の区分を設ける必要もない。"}, {"l": 20, "m": "継続企業の前提に関する開示と監査", "sb": "", "i": "A", "r": "", "q": "継続企業の前提に重要な疑義を生じさせるような事象又は状況があるにもかかわらず，経営者が当該事象又は状況について注記していなかった場合，監査人は限定付適正意見又は不適正意見を表明しなければならない。", "a": false, "c": "H27Ⅱ⑱エ／H27Ⅰ⑯ウ", "e": "継続企業の前提に関する注記が要求されるのは，継続企業の前提に関する重要な不確実性がある場合である。したがって，本肢の場合において，経営者が当該事象又は状況について注記していなかったとしても，監査人は限定付適正意見や不適正意見を表明する必要はない。"}, {"l": 21, "m": "継続企業の前提に関する開示と監査", "sb": "", "i": "A", "r": "", "q": "継続企業の前提に関して重要な疑義を生じさせるような事象又は状況が存在する場合において，当該疑義を解消若しくは改善するための経営者の対応策によって当該疑義が解消されないとしても，そのことを理由とする意見不表明とはならない。", "a": true, "c": "H27Ⅱ⑱ア", "e": "「経営者の対応策によって当該疑義が解消されない」場合とは，継続企業の前提に関する重要な不確実性がある場合等を指しているが，このことが意見不表明とすべき理由にはならない。"}, {"l": 22, "m": "継続企業の前提に関する開示と監査", "sb": "", "i": "A", "r": "", "q": "監査人は継続企業の前提に関する重要な不確実性が認められる場合であっても，継続企業の前提に関する事項が財務諸表に適切に記載されていると判断できるときは，監査報告書に継続企業の前提に関する事項を記載した上で，無限定適正意見を表明する。", "a": true, "c": "R５Ⅰ⑱イ", "e": "なお，継続企業の前提に関する事項は，「継続企業の前提に関する重要な不確実性」区分に記載する。"}, {"l": 23, "m": "継続企業の前提に関する開示と監査", "sb": "", "i": "A", "r": "", "q": "監査人は，継続企業の前提に関する重要な不確実性について財務諸表に適切な注記がなされている場合，無限定意見を表明し，監査報告書に「継続企業の前提に関する重要な不確実性」区分を設けて，財務諸表における注記事項について，財務諸表利用者に注意喚起しなければならない。", "a": true, "c": "R６Ⅰ⑱エ", "e": ""}, {"l": 24, "m": "継続企業の前提に関する開示と監査", "sb": "", "i": "A", "r": "", "q": "監査人は，継続企業を前提として財務諸表を作成することが適切であるが，継続企業の前提に関する重要な不確実性が認められる場合において，継続企業の前提に関する事項が財務諸表に適切に注記されていると判断したときは，無限定適正意見を表明した上で，当該事項について強調事項区分を設けなければならない。", "a": false, "c": "H29Ⅱ⑱イ／H23Ⅱ⑱ウ", "e": "本肢の場合に設ける区分は，強調事項区分ではなく「継続企業の前提に関する重要な不確実性」区分である。"}, {"l": 25, "m": "継続企業の前提に関する開示と監査", "sb": "", "i": "A", "r": "", "q": "継続企業を前提として財務諸表を作成することが適切であるが，重要な不確実性が認められる場合に，監査人は，重要な不確実性について財務諸表に適切に注記がなされていると判断したときには，無限定意見を表明する。この場合，監査人は，監査報告書に重要な不確実性が認められる旨を記載しなければならない。", "a": true, "c": "R２Ⅱ⑰イ／H27Ⅰ⑯エ", "e": ""}, {"l": 26, "m": "継続企業の前提に関する開示と監査", "sb": "", "i": "A", "r": "", "q": "監査人は，継続企業を前提として財務諸表を作成することが適切であっても重要な不確実性が認められる場合において，継続企業の前提に関する事項が財務諸表に適切に記載されていると判断したときには，無限定適正意見又は重要な不確実性が及ぼす影響に関する除外事項を付した限定付適正意見を表明する。", "a": false, "c": "H30Ⅱ⑯ア", "e": "本肢の場合，重要な虚偽表示は存在しないため，限定付適正意見の表明を検討する必要はない。"}, {"l": 27, "m": "継続企業の前提に関する開示と監査", "sb": "", "i": "A", "r": "", "q": "継続企業を前提として財務諸表を作成することが適切であるが，継続企業の前提に関する重要な不確実性が認められる場合，当該不確実性は，監査上の主要な検討事項に該当するため，監査人は，継続企業の前提に関する事項を監査報告書の監査上の主要な検討事項の区分に記載しなければならない。", "a": false, "c": "H31Ⅱ⑯イ", "e": "継続企業の前提に関する重要な不確実性は，その性質上，監査上の主要な検討事項に該当するが，当該不確実性に関する記載は，「継続企業の前提に関する重要な不確実性」区分に行う。"}, {"l": 28, "m": "継続企業の前提に関する開示と監査", "sb": "", "i": "A", "r": "", "q": "監査人は，継続企業の前提に重要な不確実性が認められ，財務諸表における注記が適切に行われている場合，「継続企業の前提に関する重要な不確実性」の区分を設けた上で無限定適正意見を表明するが，重要な不確実性の状況によっては意見不表明とすることが適切となることがある。", "a": true, "c": "H25Ⅰ⑯エ", "e": "なお，意見不表明とすることが適切な場合には，重要な不確実性が複数存在し，当該不確実性による影響が複合的かつ多岐にわたる場合がある。"}, {"l": 29, "m": "継続企業の前提に関する開示と監査", "sb": "", "i": "A", "r": "", "q": "監査人は，重要な不確実性が複数存在し，財務諸表に及ぼす可能性のある当該不確実性の影響が複合的かつ多岐にわたる場合には，監査報告書の継続企業の前提に関する重要な不確実性区分においてその旨を記載しなければならない。", "a": false, "c": "H24Ⅱ⑰エ", "e": "本肢の場合，当該区分の記載に代えて，意見不表明とすることが適切な場合がある。"}, {"l": 30, "m": "継続企業の前提に関する開示と監査", "sb": "", "i": "A", "r": "", "q": "監査人は，継続企業を前提として財務諸表を作成することが適切であっても重要な不確実性が認められる場合において，継続企業の前提に関する事項が財務諸表に適切に記載されていないと判断したときは，当該記載についての除外事項を付した限定付適正意見を表明するか，又は，理由を付して不適正意見を表明しなければならない。", "a": true, "c": "H30Ⅱ⑯イ／H26Ⅱ⑭エ", "e": ""}, {"l": 31, "m": "継続企業の前提に関する開示と監査", "sb": "", "i": "A", "r": "", "q": "被監査会社が破産の申立てを検討している状況において，継続企業を前提として財務諸表を作成している場合で，継続企業の前提に関する重要な不確実性に係る注記が不適切であると監査人が判断したときには，その重要性と広範性に応じて限定付適正意見又は不適正意見を表明しなければならない。", "a": true, "c": "H27Ⅱ⑱ウ", "e": "破産申立ての「検討」段階であるため，本肢は，継続企業を前提として財務諸表を作成することはできるが，継続企業の前提に関する重要な不確実性が存在している状況（注記が必要）である点に注意。"}, {"l": 32, "m": "継続企業の前提に関する開示と監査", "sb": "", "i": "A", "r": "", "q": "監査人は，継続企業を前提として財務諸表を作成することが適切であっても重要な不確実性が認められる場合，強調事項区分において「継続企業の前提に関する重要な不確実性」に関する事項を付した上で，限定付適正意見又は不適正意見を表明しなければならない。", "a": false, "c": "R４Ⅱ⑰ウ", "e": "重要な不確実性が認められる場合において監査人が表明する意見は，継続企業の前提に関する注記が適切であるか否かによって変わる。また，当該注記が適切である場合に監査報告書に設ける区分は，強調事項区分ではなく「継続企業の前提に関する重要な不確実性」区分である。いずれにしても，本肢は誤りである。"}, {"l": 33, "m": "継続企業の前提に関する開示と監査", "sb": "", "i": "A", "r": "", "q": "監査人は，継続企業の前提に重要な不確実性が認められるにもかかわらず，財務諸表における注記において，かかる重要な不確実性に関する説明が十分に行われておらず不適切であると判断した場合，状況に応じて限定付適正意見又は不適正意見を表明した上で，監査報告書に「継続企業の前提に関する重要な不確実性」の区分を設けなければならない。", "a": false, "c": "H25Ⅰ⑯ウ", "e": "継続企業の前提に関する注記が適切でない場合は，「継続企業の前提に関する重要な不確実性」の区分を設けてはならない。"}, {"l": 34, "m": "財務諸表監査における不正への対応", "sb": "", "i": "B", "r": "", "q": "不正な財務報告とは，財務諸表の利用者を欺くために財務諸表に意図的な虚偽の表示を行うことをいうが，これは，意図的な会計基準の不適切な適用によって行われるものではなく，取引，会計事象又は重要な情報の財務諸表における不実表示や意図的な除外により行われるものである。", "a": false, "c": "H24Ⅰ⑩エ", "e": "不正な財務報告は，取引，会計事象又は重要な情報の財務諸表における不実表示や意図的な除外のみならず，意図的な会計基準の不適切な適用によっても行われる。"}, {"l": 35, "m": "財務諸表監査における不正への対応", "sb": "", "i": "B", "r": "", "q": "売上高や当期純利益などの財務数値の目標達成に対して，経営者と営業担当者が強いプレッシャーを受けている状況は，不正リスク要因となりうる。", "a": true, "c": "R５Ⅱ⑭ア", "e": ""}, {"l": 36, "m": "財務諸表監査における不正への対応", "sb": "", "i": "A", "r": "", "q": "財務諸表監査の目的は，企業が公表する財務諸表に信頼性を付与することにあり，会計上の不正を摘発することではないが，監査人は，財務諸表に不正による重要な虚偽の表示がないことについて，合理的な保証を得ることが求められている。", "a": true, "c": "R２Ⅱ①イ", "e": ""}, {"l": 37, "m": "財務諸表監査における不正への対応", "sb": "", "i": "A", "r": "", "q": "監査人は，財務諸表に重要な虚偽の表示をもたらす不正の発見に対して責任を負っており，財務諸表が一般に公正妥当と認められる企業会計の基準に準拠して，会社の財政状態，経営成績及びキャッシュ・フローの状況をすべての重要な点において適正に表示していることを認める旨の監査意見は，監査人がこの責任を果たしたことを意味している。", "a": false, "c": "H27Ⅰ①ウ", "e": "監査人は，不正の防止や発見について責任を負わない。したがって，監査人が表明した財務諸表が適正である旨の監査意見は，財務諸表には全体として重要な虚偽表示がないということについて合理的な保証を得たことを意味するものであり，不正を発見する責任を果たしたことを意味しない。"}, {"l": 38, "m": "財務諸表監査における不正への対応", "sb": "", "i": "A", "r": "", "q": "財務諸表の重要な虚偽表示を看過して，財務諸表に適正意見を表明した場合，監査人が一般に公正妥当と認められる監査の基準に準拠して当該監査を実施したかどうかは，経営者が不正を隠蔽するために仕組んだスキームの巧妙さ並びに改ざんの頻度及び程度によって判断される。", "a": false, "c": "H25Ⅰ①エ", "e": "監査人が不正を発見できるかどうかは，経営者が不正を隠蔽するために仕組んだスキームの巧妙さ並びに改ざんの頻度及び程度によって影響を受けるが，監査人が一般に公正妥当と認められる監査の基準に準拠して当該監査を実施したかどうかは，経営者が不正を隠蔽するために仕組んだスキームの巧妙さ並びに改ざんの頻度及び程度に関係なく判断される。"}, {"l": 39, "m": "財務諸表監査における不正への対応", "sb": "", "i": "A", "r": "", "q": "監査人が不正による重要な虚偽の表示を発見できないリスクは，誤謬による重要な虚偽の表示を発見できないリスクよりも高いが，当該不正が共謀により行われている場合には，当該不正による重要な虚偽の表示を発見できないリスクはさらに高まる。", "a": true, "c": "H24Ⅰ⑩ウ", "e": ""}, {"l": 40, "m": "財務諸表監査における不正への対応", "sb": "", "i": "A", "r": "", "q": "監査人が，経営者不正による重要な虚偽の表示を発見できない可能性は，経営者により内部統制が無効化される場合が多いこともあり，従業員不正による重要な虚偽の表示を発見できない可能性よりも一般に高い。", "a": true, "c": "H30Ⅰ⑳ウ", "e": ""}, {"l": 41, "m": "財務諸表監査における不正への対応", "sb": "", "i": "B", "r": "", "q": "監査人は，記録や証憑書類を真正なものとして受け入れることができるとされているが，監査の過程で真正性に疑いを抱いた場合には，それらを鑑定する技能を有する専門家を利用することができる。", "a": true, "c": "R６Ⅱ⑰ア", "e": ""}, {"l": 42, "m": "財務諸表監査における不正への対応", "sb": "", "i": "B", "r": "", "q": "監査チームで，財務諸表に重要な虚偽の表示が行われる可能性があるかどうかについて討議する場合において，過去の経験から経営者，取締役及び監査役が十分に信頼でき，誠実であると考えられるときには，討議すべき内容の一部を省略することができる。", "a": false, "c": "H24Ⅰ⑩ア", "e": "監査チームの討議は，経営者，取締役及び監査役等が信頼でき誠実であるという考えを持たずに行わなければならない。そのため，過去の経験から，経営者，取締役及び監査役等が十分に信頼でき，誠実であると認識していたとしても，討議すべき内容の一部を省略することはできない。"}, {"l": 43, "m": "財務諸表監査における不正への対応", "sb": "", "i": "B", "r": "", "q": "監査人は，監査チームのすべての構成員との間で，経営者等は誠実であるという考えを持たずに，不正による重要な虚偽の表示が財務諸表のどこにどのように行われる可能性があるのかについて討議を行い，監査チームのすべての構成員がすべての情報を共有できるようにしなければならない。", "a": false, "c": "H27Ⅱ⑥イ", "e": "監査人は，討議に参加していない監査チームの構成員がいる場合は，当該構成員に伝達する事項を決定するが，監査チームの全ての構成員に，討議の結論の全てを知らせることは必ずしも必要ではない。👉講義レジュメ③-6-5"}, {"l": 44, "m": "財務諸表監査における不正への対応", "sb": "", "i": "A", "r": "", "q": "監査人は，被監査会社の統制環境を理解する際には，経営者に対して，財務諸表に不正による重要な虚偽の表示が行われるリスクに係る経営者の評価について，質問しなければならない。", "a": true, "c": "H24Ⅰ⑩オ", "e": ""}, {"l": 45, "m": "財務諸表監査における不正への対応", "sb": "", "i": "A", "r": "", "q": "監査人は，経営者が関与する不正による重要な虚偽表示リスクを客観的に識別及び評価する観点から，被監査会社で想定される不正について，経営者に質問してはならない。", "a": false, "c": "R５Ⅱ⑭ウ", "e": "たしかに，経営者に対する質問で経営者不正に関する有益な情報を入手することは難しいが，本肢の質問が禁じられているわけではなく，状況に応じて行うこともある。"}, {"l": 46, "m": "財務諸表監査における不正への対応", "sb": "", "i": "A", "r": "", "q": "監査人は，監査計画の策定に当たり，入手した情報が不正リスク要因の存在を示しているかどうかを検討しなければならないが，不正リスク要因が存在することが，必ずしも財務諸表全体及び財務諸表項目における不正リスクとなるとは限らない。", "a": true, "c": "H30Ⅰ⑳エ", "e": ""}, {"l": 47, "m": "財務諸表監査における不正への対応", "sb": "", "i": "A", "r": "", "q": "アナリストや格付機関の報告書に記載されている被監査会社の業績予測情報は，経営者に業績達成に関するプレッシャーを与え，経営者が財務諸表の虚偽表示を行う動機ともなりうるので，監査人は当該報告書をアナリストや格付機関から直接入手しなければならない。", "a": false, "c": "H27Ⅰ⑪ウ", "e": "たしかに，本肢が示す被監査会社の業績予測情報は，経営者が不正な財務報告を行う動機やプレッシャーとなり得るが，監査人が不正リスク要因を検討する際，アナリストや格付機関の報告書を直接入手することまでは要求されていない。"}, {"l": 48, "m": "財務諸表監査における不正への対応", "sb": "", "i": "A", "r": "", "q": "監査人は，不正による重要な虚偽表示のリスクを識別し評価する際，収益の種類や形態にかかわらず，収益認識には不正リスクがあるという推定に基づき，収益認識に関連するアサーションについての重要な虚偽表示のリスクを特別な検討を必要とするリスクとして識別しなければならない。", "a": false, "c": "H27Ⅱ⑭イ", "e": "収益の種類，取引形態，アサーションによっては，不正リスクがないと判断する場合もある。"}, {"l": 49, "m": "財務諸表監査における不正への対応", "sb": "", "i": "A", "r": "", "q": "収益認識に関連する不正な財務報告による重要な虚偽表示は，収益の先行認識又は架空計上といった，収益の過大計上によるものを指すことから，収益の過少計上によるものは，不正による重要な虚偽表示リスクの識別対象にはならない。", "a": false, "c": "R６Ⅱ⑰イ／H25Ⅰ⑫オ", "e": "不正の多くは収益の過大計上によるものであるが，収益の過少計上を不正リスクとして識別することもある。"}, {"l": 50, "m": "財務諸表監査における不正への対応", "sb": "", "i": "A", "r": "", "q": "監査人は，収益認識に関係する不正による重要な虚偽表示リスクがないかどうかを判断しなければならないが，当該リスクがないと最終的に判断したときは，リスクがないとの結論のみを監査調書に記録する。", "a": false, "c": "H25Ⅰ②エ", "e": "本肢の場合，監査人は，リスクがないとの結論のみならず理由も監査調書に記録しなければならない。"}, {"l": 51, "m": "財務諸表監査における不正への対応", "sb": "", "i": "A", "r": "", "q": "監査人は，評価した不正による重要な虚偽表示リスクに応じた全般的対応を決定する際に，例えば，重要な取引の裏付けとなる証憑書類及びその範囲をより注意深く選択するというように，高められた職業的懐疑心を監査全般にどのように反映することができるかを考慮する。", "a": true, "c": "R７Ⅰ⑨イ", "e": ""}, {"l": 52, "m": "財務諸表監査における不正への対応", "sb": "", "i": "A", "r": "", "q": "監査人は，財務諸表全体に関連する不正による重要な虚偽表示リスクを識別したとしても，財務諸表のどの項目に不正が生じているかは明確ではないため，監査計画に，企業が想定しない要素を組み込んではならない。", "a": false, "c": "R５Ⅱ⑭イ", "e": "財務諸表全体に関連する不正によるＲＭＭを識別した場合は，監査計画に，企業が想定しない要素を組み込まなければならない。"}, {"l": 53, "m": "財務諸表監査における不正への対応", "sb": "", "i": "A", "r": "", "q": "監査人は，職業的専門家としての正当な注意を払い，懐疑心を保持して監査を行わなければならないが，財務諸表全体に関連する不正リスクが識別されない場合には，実施する監査手続の種類，実施の時期及び範囲の決定に当たって，企業が想定しない要素を監査計画に組み込まなくてもよい。", "a": true, "c": "H30Ⅱ⑪イ", "e": ""}, {"l": 54, "m": "財務諸表監査における不正への対応", "sb": "", "i": "A", "r": "", "q": "経営者による内部統制の無効化は不正による重要な虚偽表示リスクであり，監査人は，当該リスクを特別な検討を必要とするリスクとしなければならない。", "a": true, "c": "R５Ⅱ⑭エ", "e": ""}, {"l": 55, "m": "財務諸表監査における不正への対応", "sb": "", "i": "A", "r": "", "q": "経営者が内部統制を無効化するリスクは特別な検討を必要とするリスクであり，監査人は，当該リスクの程度にかかわらず，総勘定元帳への仕訳入力や財務諸表を作成する過程における修正についての適切性を検証しなければならない。", "a": true, "c": "H27Ⅱ⑭ア", "e": ""}, {"l": 56, "m": "財務諸表監査における不正への対応", "sb": "", "i": "A", "r": "", "q": "監査人は，財務報告プロセスに関する内部統制の運用評価手続により内部統制が有効に機能していると判断した場合には，総勘定元帳に記録された仕訳入力の適切性を検証する手続を実施しないことがある。", "a": false, "c": "R６Ⅱ⑰ウ", "e": "総勘定元帳に記録された仕訳入力の適切性を検証する手続は，必ず（内部統制の有効性に関係なく）実施する。"}, {"l": 57, "m": "財務諸表監査における不正への対応", "sb": "", "i": "B", "r": "", "q": "監査人は，監査手続を実施した結果，不正による重要な虚偽表示の兆候を示す状況を識別した場合，アサーション・レベルの不正による重要な虚偽表示リスクに関する評価が依然として適切であるかどうかを判断する際に，当該状況を考慮する必要がある。", "a": true, "c": "R７Ⅰ⑨エ", "e": ""}, {"l": 58, "m": "財務諸表監査における不正への対応", "sb": "", "i": "B", "r": "", "q": "監査人は，企業に関する監査人の理解と財務諸表が整合していることについて全般的な結論を形成するために，監査の最終段階で分析的手続を実施し，これまで認識していなかった不正による重要な虚偽表示リスクが存在していないかどうかを評価しなければならない場合がある。", "a": false, "c": "H25Ⅰ②イ", "e": "細かい引っかけ。本肢が示す監査の最終段階で実施する分析的手続は，実施しなければならない「場合がある」のではなく，「必ず」実施しなければならないものである。"}, {"l": 59, "m": "財務諸表監査における不正への対応", "sb": "", "i": "B", "r": "", "q": "監査人は，識別した虚偽表示が経営者による不正に起因するものであれば，それが重要であるかどうかにかかわらず，従業員，経営者又は第三者による共謀の可能性を検討する場合がある。", "a": true, "c": "R６Ⅱ⑰エ", "e": "共謀の可能性の検討は，「それまでに入手した証拠の証明力を再検討する場合」に行うものであるため，「検討する場合がある」としている本肢は正しい。"}, {"l": 60, "m": "財務諸表監査における不正への対応", "sb": "", "i": "A", "r": "", "q": "監査人は，不正が存在するかもしれない証拠を入手した場合には，速やかに，適切な階層の経営者に注意を喚起しなければならない。ただし，当該不正が従業員による少額の使い込みのような些細な事項である場合には，その必要はない。", "a": false, "c": "H29Ⅱ⑲イ", "e": "監査人は，識別した不正が従業員による少額の使い込みのような些細な事項である場合にも，適切な階層の経営者に注意を喚起しなければならない。また，本肢の状況における報告は，「速やかに」ではなく「適時に」行うものとされている。"}, {"l": 61, "m": "財務諸表監査における不正への対応", "sb": "", "i": "A", "r": "", "q": "監査人は，企業に影響を与える不正を識別した場合，当該不正への経営者の関与が疑われるかどうかにかかわらず，監査を完了するため必要となる監査手続の種類，時期及び範囲について監査役等と協議しなければならない。", "a": false, "c": "R７Ⅰ⑨ア", "e": "本肢にある協議は，経営者による不正又は不正の疑いを識別した場合にのみ求められるものである。"}, {"l": 62, "m": "財務諸表監査における不正への対応", "sb": "", "i": "A", "r": "", "q": "監査人は，財務諸表に重要な影響を及ぼす可能性がある不正への経営者の関与が疑われる場合には，監査役等への報告及び監査を完了するために必要となる監査手続の種類，時期並びに範囲について協議しないことがある。", "a": false, "c": "R２Ⅰ⑲エ", "e": "本肢のような不正の疑いがある場合，監査人は，監査役等への報告と監査手続に関する協議をしなければならない。"}, {"l": 63, "m": "財務諸表監査における不正への対応", "sb": "", "i": "A", "r": "", "q": "監査人は被監査会社に対して秘密保持の義務を負うが，不正を認識した場合には，速やかに規制当局等に対して報告する義務がある。", "a": false, "c": "H25Ⅰ②ウ", "e": "監査人が，認識した不正を規制当局等に報告する場合
