は，法令等で要求される義務を果たす場合等に限定される。"}, {"l": 64, "m": "財務諸表監査における不正への対応", "sb": "", "i": "B", "r": "", "q": "被監査会社の不正により財務諸表に虚偽の表示が行われた場合において，当該不正の影響が財務諸表にとって重要でなくても，当該不正に関する被監査会社の対応が著しく不適切であるときには，監査人は，監査契約を解除しなければならない。", "a": false, "c": "H24Ⅰ⑩イ", "e": "本肢のような状況において，監査人は，監査契約の解除が可能であれば，監査契約の解除の当否も含めて検討することになるが，直ちに監査契約を解除するわけではない。"}, {"l": 65, "m": "財務諸表監査における不正への対応", "sb": "", "i": "B", "r": "", "q": "監査人は，企業に影響を与える経営者自身による不正の疑いがあり，その疑いに関する情報が存在するときには，当該情報を監査人に示した旨が記載された経営者確認書を入手しなければならない。", "a": true, "c": "H24Ⅱ⑱エ", "e": ""}, {"l": 66, "m": "不正リスク対応基準", "sb": "", "i": "A", "r": "", "q": "「監査における不正リスク対応基準」では，監査人が財務諸表監査において対象とする重要な虚偽の表示の原因となる不正と誤謬を対象としている。", "a": false, "c": "R４Ⅱ⑳エ", "e": "不正リスク対応基準は，誤謬を対象にしたものではない。"}, {"l": 67, "m": "不正リスク対応基準", "sb": "", "i": "A", "r": "", "q": "不正リスク対応基準は，不正について，不当又は違法な利益を得る等のために，他者を欺く行為を伴う，経営者，従業員等又は第三者による意図的な行為と説明しており，重要な虚偽の表示とは関係のない不正を対象とした監査手続も含まれている。", "a": false, "c": "H27Ⅰ⑱イ", "e": "不正リスク対応基準は，財務諸表監査が対象とする重要な虚偽表示の原因となる不正について取り扱っているため，重要な虚偽表示とは関係のない不正を対象とした監査手続は含まれない。"}, {"l": 68, "m": "不正リスク対応基準", "sb": "", "i": "A", "r": "", "q": "不正リスク対応基準は，通常の財務諸表の監査において不正リスクに対応するための手続を明らかにしたものであり，不正リスクに対応する固有の手続を追加するものではない。", "a": true, "c": "R４Ⅰ⑳ア", "e": "「通常の財務諸表監査」の意味するところや，不正による重要な虚偽表示を示唆する状況を識別した場合等の対応が「固有の手続」に当たるか否かが分かりづらく，肢別で解くと難易度が高い肢である。"}, {"l": 69, "m": "不正リスク対応基準", "sb": "", "i": "A", "r": "", "q": "公認会計士又は監査法人は，上場会社の有価証券報告書の中の財務計算に関する書類を監査するに当たっては，企業会計審議会により公表された監査基準，監査に関する品質管理基準及び監査における不正リスク対応基準に準拠することが求められている。", "a": true, "c": "R４Ⅱ⑤イ", "e": "上場会社の監査では，不正リスク対応基準に準拠しなければならない。"}, {"l": 70, "m": "不正リスク対応基準", "sb": "", "i": "A", "r": "", "q": "不正リスク対応基準は，金融商品取引法に基づいて開示を行っている企業の監査を対象としているが，非上場企業のうち資本金５億円未満又は売上高１０億円未満かつ負債総額２００億円未満の企業の監査は対象の範囲外としている。", "a": true, "c": "H27Ⅰ⑱ア／R６Ⅰ⑳ア", "e": ""}, {"l": 71, "m": "不正リスク対応基準", "sb": "", "i": "A", "r": "", "q": "不正リスク対応基準は，年度監査に適用されるだけでなく，中間監査及び期中レビューに対しても準用されなければならない。", "a": false, "c": "R４Ⅰ⑳イ／H30Ⅰ⑳ア", "e": "不正リスク対応基準は，中間監査には準用されるが，期中レビューには準用（適用）されない。"}, {"l": 72, "m": "不正リスク対応基準", "sb": "", "i": "A", "r": "", "q": "監査人は，期中レビューに当たって，期中財務諸表に不正による重要な虚偽の表示の疑義に相当するものがあると判断した場合，監査における不正リスク対応基準ではなく，期中レビュー基準に従って，追加的手続を実施することが求められている。", "a": true, "c": "R６Ⅰ⑳ウ／R２Ⅱ⑳ア／H28Ⅱ⑲イ", "e": "本肢の状況において実施する追加的手続は，あくまでも期中レビュー基準に従ったものである点に注意。"}, {"l": 73, "m": "不正リスク対応基準", "sb": "", "i": "A", "r": "", "q": "監査人は，不正による重要な虚偽の表示を示唆する状況を識別している場合であっても，これを不正による重要な虚偽の表示の疑義として扱うと判断するまでは，不正リスク対応基準に準拠した監査を実施する必要はない。", "a": false, "c": "H28Ⅱ⑲ア", "e": "監査人は，不正による重要な虚偽表示を示唆する状況を識別している場合は，不正による重要な虚偽表示の疑義に該当するかどうかの判断等，不正リスク対応基準に準拠した対応が求められる。"}, {"l": 74, "m": "不正リスク対応基準", "sb": "", "i": "A", "r": "", "q": "監査人は，監査手続の実施に当たって，不正による重要な虚偽の表示の疑義に該当するかどうかを判断する場合には，職業的懐疑心を保持することが求められているが，不正による重要な虚偽の表示の疑義に該当すると判断した場合には，職業的懐疑心を高めることが求められている。", "a": false, "c": "R５Ⅰ⑳ア", "e": "不正による重要な虚偽の表示の疑義に該当するかどうかを判断する場合にも，職業的懐疑心を高めることが求められている。"}, {"l": 75, "m": "不正リスク対応基準", "sb": "", "i": "A", "r": "", "q": "監査人は，被監査会社の不正の可能性について当該会社の従業員から通報を受けた。この場合，職業的懐疑心を保持するだけでなく発揮して，不正による重要な虚偽の表示の疑義に該当するかどうかを判断しなければならない。", "a": false, "c": "R３⑳イ", "e": "不正による重要な虚偽表示の疑義に該当するかどうかを判断する際は，職業的懐疑心を「高め」なければならない。なお，本肢にある「被監査会社の不正の可能性について当該会社の従業員から通報を受けた」場合は，不正による重要な虚偽表示を示唆する状況に該当する。👉講義レジュメ⑥-3-12"}, {"l": 76, "m": "不正リスク対応基準", "sb": "", "i": "A", "r": "", "q": "不正リスク対応基準における職業的懐疑心の考え方は，職業的懐疑心の発揮という踏み込んだ表現が新たに採用されてはいるが，これまでの監査基準で採られている，監査を行うに際し，経営者が誠実であるとも不誠実であるとも想定しないという中立的な観点を変更するものではない。", "a": true, "c": "H28Ⅰ⑳ア／R５Ⅱ⑫ア／H27Ⅰ⑤ア", "e": ""}, {"l": 77, "m": "不正リスク対応基準", "sb": "", "i": "A", "r": "", "q": "不正リスク対応基準では，監査人による職業的懐疑心の保持又は発揮が強調されている。これは不正による重要な虚偽の表示の多くが経営者の関与によって生じるため，経営者は誠実でないと想定して，監査を実施すべきと考えられているからである。", "a": false, "c": "R４Ⅰ⑳エ", "e": "不正リスク対応基準における職業的懐疑心の考え方は，経営者が誠実であるとも不誠実であるとも想定しないという中立的な観点を変更するものではない。"}, {"l": 78, "m": "不正リスク対応基準", "sb": "", "i": "A", "r": "", "q": "監査人は，監査に臨むに当たり，過去に経営者が不正を行った事実を識別している場合には，当該経営者が不誠実であると想定しなければならない。", "a": false, "c": "H31Ⅱ⑳イ", "e": "本肢の場合でも，監査人は，経営者が誠実であるとも不誠実であるとも想定してはならない。"}, {"l": 79, "m": "不正リスク対応基準", "sb": "", "i": "A", "r": "", "q": "監査人が職業的懐疑心を適切に保持又は発揮したかどうかについての判断は，具体的な状況において監査人がどのような監査手続を実施したかに基づいて行われる。", "a": true, "c": "R５Ⅱ⑫エ／H31Ⅰ⑫イ", "e": ""}, {"l": 80, "m": "不正リスク対応基準", "sb": "", "i": "A", "r": "", "q": "監査人は，監査計画の策定に当たり，職業的懐疑心を発揮して，不正を実行する動機やプレッシャーが存在するかどうか，不正を実行する機会が存在するかどうか，不正を実行する際にそれを正当化する事象や状況が存在するかどうかを検討し，不正リスクの識別及び評価においてこれらの事項を考慮しなければならない。", "a": true, "c": "H27Ⅱ⑥ア", "e": "不正リスクを評価する際，職業的懐疑心を発揮しなければならない点に注意する。👉講義レジュメ⑥-3-4"}, {"l": 81, "m": "不正リスク対応基準", "sb": "", "i": "A", "r": "", "q": "監査人は，財務諸表全体に関連する不正リスクが識別されたとしても，企業側で当該リスクへの対応が適切に行われていると判断した場合には，実施する監査手続の種類，時期及び範囲の決定に当たって，企業が想定しない要素を監査計画に組み込む必要はない。", "a": false, "c": "H29Ⅱ⑳イ", "e": "財務諸表全体に関連する不正リスクを識別した場合には，企業側で当該リスクへの対応が適切に行われているか否かに関係なく，企業が想定しない要素を監査計画に組み込まなければならない。"}, {"l": 82, "m": "不正リスク対応基準", "sb": "", "i": "A", "r": "", "q": "監査人は，財務諸表全体に関連する不正リスクが識別された場合には，実施する監査手続の種類，実施の時期及び範囲の決定に当たって，例えば，往査先の選択方法の変更や予告なしの往査などといった，企業が想定しない要素を監査計画に組み込まなければならない。", "a": true, "c": "R７Ⅰ⑧イ／H29Ⅰ⑳ア／H27Ⅰ⑱ウ", "e": ""}, {"l": 83, "m": "不正リスク対応基準", "sb": "", "i": "A", "r": "", "q": "監査人は，監査チームの全ての構成員との間で，経営者等は誠実であるという考え方を持たずに，不正による重要な虚偽の表示が財務諸表のどこにどのように行われる可能性があるかについて協議を行い，監査チームの全ての構成員が知識や情報を共有できるようにしなければならない。", "a": false, "c": "R２Ⅰ⑳イ", "e": "本肢の協議（討議）は，「全ての構成員」ではなく，「監査責任者と監査チームの主要メンバー間」で知識や情報を共有するために行うものである。"}, {"l": 84, "m": "不正リスク対応基準", "sb": "", "i": "A", "r": "", "q": "監査人は，識別した不正リスクに関連する監査要点に対しては，不正リスクを識別していない場合に比べて，より適合性が高く，より証明力の強い，質の高い監査証拠を入手するか，又はより多くの監査証拠を入手する必要がある。", "a": true, "c": "R７Ⅰ⑧ア／H28Ⅰ⑳イ", "e": ""}, {"l": 85, "m": "不正リスク対応基準", "sb": "", "i": "A", "r": "", "q": "監査人は，被監査企業と取引先企業との通謀，いわゆる循環取引が疑われる場合には，監査役等に報告し，協議の上，取引先企業の監査人と連携するよう監査計画を修正しなければならない。", "a": false, "c": "H31Ⅰ⑳ア／H27Ⅰ⑱エ", "e": "不正リスク対応基準は，取引先企業の監査人と連携を導入していない。"}, {"l": 86, "m": "不正リスク対応基準", "sb": "", "i": "A", "r": "", "q": "監査人は，不正リスクが存在する場合に実施した積極的確認に対して，回答がないか，又は回答が不十分であったときは，全ての記載事項についての回答を入手できるよう留意し，代替的な手続に移行する場合には慎重に判断しなければならない。", "a": true, "c": "H31Ⅰ⑳ウ", "e": ""}, {"l": 87, "m": "不正リスク対応基準", "sb": "", "i": "A", "r": "", "q": "監査人は，不正リスクに対応する手続として積極的確認を実施する場合において，回答がない確認先について代替的な手続を実施するときは，監査証拠として被監査会社が作成した情報を利用することはできない。", "a": false, "c": "H28Ⅰ⑳ウ", "e": "たしかに，積極的確認の代替手続の監査証拠として企業や当該企業の子会社等が作成した情報「のみ」を利用するときは，当該情報の信頼性についてより慎重に判断しなければならないが，当該情報の利用自体が禁止されているわけではない。"}, {"l": 88, "m": "不正リスク対応基準", "sb": "", "i": "A", "r": "", "q": "監査人は，識別した不正リスクに対応するために実施した積極的確認の代替的な手続において，企業及び当該企業の子会社が作成した情報のみを利用することは可能であるが，その場合には，当該情報の信頼性について，より慎重に判断しなければならない。", "a": true, "c": "R２Ⅰ⑳エ／H29Ⅱ⑳ア", "e": ""}, {"l": 89, "m": "不正リスク対応基準", "sb": "", "i": "B", "r": "", "q": "監査人は，実施した監査手続及び入手した監査証拠に基づき，不正リスクに関連する監査要点に対する十分かつ適切な監査証拠を入手していないと判断した場合でも，追加的な監査手続を実施しないことがある。", "a": false, "c": "R７Ⅰ⑧ウ", "e": "本肢の場合，監査人は，追加的な監査手続を実施しなければならない。"}, {"l": 90, "m": "不正リスク対応基準", "sb": "", "i": "B", "r": "", "q": "監査チームは，不正はこれを隠蔽するために巧妙かつ念入りに仕組まれたスキームを伴うことが多いため，不正リスク対応手続においては，入手した記録や証憑書類の真正性について常に検討しなければならない。", "a": false, "c": "H31Ⅱ⑳エ", "e": "不正リスク対応基準に準拠する場合でも，監査人は，記録や証憑書類の真正性に疑いを抱く理由がある場合を除いては，通常，記録や証憑書類を真正なものとして受け入れることができる。"}, {"l": 91, "m": "不正リスク対応基準", "sb": "", "i": "A", "r": "", "q": "監査実施の過程において，不正による重要な虚偽の表示を示唆する状況を識別した場合には，想定される不正の態様等に直接対応した監査手続を立案し監査計画を修正しなければならない。", "a": false, "c": "H31Ⅰ⑳エ／H29Ⅰ⑳イ", "e": "本肢の対応は，不正による重要な虚偽表示の疑義が存在する場合にはじめて必要となるものである。"}, {"l": 92, "m": "不正リスク対応基準", "sb": "", "i": "A", "r": "", "q": "監査実施の過程において，不正による重要な虚偽の表示を示唆する状況を識別した際に，不正による重要な虚偽表示の疑義が存在していないかどうかを判断するために，追加的な監査手続とともに監査人が行う手続は，経営者に対する質問である。", "a": true, "c": "H31Ⅱ⑳ア", "e": ""}, {"l": 93, "m": "不正リスク対応基準", "sb": "", "i": "A", "r": "", "q": "監査人は，不正による重要な虚偽の表示を示唆する状況を識別した場合には，経営者に質問し説明を求めるとともに，追加的な手続を実施し，アサーション・レベルの不正による重要な虚偽表示リスクに関する評価が依然として適切であるかを評価しなければならない。", "a": true, "c": "R２Ⅰ⑳ウ", "e": ""}, {"l": 94, "m": "不正リスク対応基準", "sb": "", "i": "A", "r": "", "q": "「監査における不正リスク対応基準」が適用される監査において，監査人は，関連当事者との間に，事業上の合理性が不明瞭な重要な資金の貸付・借入契約を識別した場合，不正による重要な虚偽表示の疑義があると判断しなければならない。", "a": false, "c": "H29Ⅱ⑮ウ／H27Ⅱ⑥ウ", "e": "本肢の状況は，不正による重要な虚偽表示を示唆する状況に該当する。"}, {"l": 95, "m": "不正リスク対応基準", "sb": "", "i": "A", "r": "", "q": "監査人は，関連当事者との間に，事業上の合理性が不明瞭な重要な債務保証契約を発見し，経営者に説明を求めたが，その説明には合理性がないと判断した。この場合，不正による重要な虚偽の表示の疑義があるものとして扱わなければならない。", "a": true, "c": "R３⑳ア", "e": "同上"}, {"l": 96, "m": "不正リスク対応基準", "sb": "", "i": "A", "r": "", "q": "監査人は，重要な取引に関する重要な記録等に矛盾する証拠が存在する状況で，監査人がその状況に関連して入手した監査証拠に基づいて経営者の説明に合理性がないと判断した場合，不正による重要な虚偽の表示の疑義があるとして扱わなければならない。", "a": true, "c": "R４Ⅱ⑳ア", "e": "同上"}, {"l": 97, "m": "不正リスク対応基準", "sb": "", "i": "A", "r": "", "q": "監査人は，監査実施の過程で，重要な取引に関して証拠となる重要な文書を経営者が紛失していることを識別した場合には，不正による重要な虚偽の表示の疑義があると判断した上で，経営者に質問し説明を求めるとともに，追加的な監査手続を実施しなければならない。", "a": false, "c": "H28Ⅱ⑲ウ", "e": "同上"}, {"l": 98, "m": "不正リスク対応基準", "sb": "", "i": "A", "r": "", "q": "監査人は，企業の記録と確認状の回答に説明のつかない重要な差異がある状況を監査実施の過程において識別した場合には，不正による重要な虚偽の表示の疑義が存在していないかどうかを判断するため，経営者に質問し説明を求めるとともに，追加的な監査手続を実施しなければならない。", "a": true, "c": "H30Ⅱ⑳イ", "e": "同上"}, {"l": 99, "m": "不正リスク対応基準", "sb": "", "i": "A", "r": "", "q": "監査人は，被監査企業が，財務諸表に重要な影響を及ぼす取引に関して，明らかに専門家としての能力又は客観性に疑念があると考えられる専門家を利用していることに気がついた場合，不正による重要な虚偽の表示の疑義が存在するものとして扱わなければならない。", "a": false, "c": "H30Ⅰ⑳イ", "e": "同上"}, {"l": 100, "m": "不正リスク対応基準", "sb": "", "i": "A", "r": "", "q": "監査人は，被監査会社から重要な取引先に関する十分な情報が監査人に提供されない場合，不正による重要な虚偽の表示の疑義の有無を判断するため，適切な階層の経営者に質問し説明を求めるとともに，追加的な監査手続を実施しなければならない。", "a": true, "c": "R５Ⅰ⑳ウ", "e": "同上"}, {"l": 101, "m": "不正リスク対応基準", "sb": "", "i": "A", "r": "", "q": "監査人は，識別した不正による重要な虚偽の表示を示唆する状況について，関連して入手した監査証拠に基づいて経営者の説明に合理性がないと判断した場合でも，それだけで不正による重要な虚偽の表示の疑義があるとして扱ってはならない。", "a": false, "c": "R７Ⅰ⑧エ", "e": "本肢のような場合は，不正による重要な虚偽表示の疑義として扱わなければならない。"}, {"l": 102, "m": "不正リスク対応基準", "sb": "", "i": "A", "r": "", "q": "監査人は，自ら識別した不正による重要な虚偽の表示を示唆する状況について，関連して入手した監査証拠に基づいて経営者の説明に合理性がないと判断した場合には，不正による重要な虚偽の表示があるとして扱わなければならない。", "a": false, "c": "H29Ⅰ⑳ウ", "e": "本肢の場合は，不正による重要な虚偽表示の「疑義」として扱う。"}, {"l": 103, "m": "不正リスク対応基準", "sb": "", "i": "A", "r": "", "q": "監査人が不正による重要な虚偽の表示の疑義があるとして，想定される不正の態様に直接対応した監査手続を実施することが求められるのは，不正による重要な虚偽の表示を示唆する状況について，関連して入手した監査証拠に基づいて経営者の説明に合理性がないと判断した場合に限定される。", "a": false, "c": "R２Ⅱ⑳エ", "e": "本肢の場合のみならず，識別した不正リスクに対して，当初計画した監査手続や追加的手続を実施してもなお十分かつ適切な監査証拠を入手できない場合も，不正による重要な虚偽表示の疑義にあたる。"}, {"l": 104, "m": "不正リスク対応基準", "sb": "", "i": "A", "r": "", "q": "監査人は，識別した不正リスクに対応して当初計画した監査手続を実施し，さらに必要と判断した追加的な監査手続を実施したが，不正リスクに関連する十分かつ適切な監査証拠を入手できない場合には，不正による重要な虚偽の表示の疑義が存在していると認めてはならない。", "a": false, "c": "H30Ⅱ⑳ア／H29Ⅱ⑳エ", "e": "本肢の場合は，不正による重要な虚偽表示の疑義があるとして扱わなければならない。"}, {"l": 105, "m": "不正リスク対応基準", "sb": "", "i": "A", "r": "", "q": "監査人は不正による重要な虚偽の表示の疑義があると判断し，監査計画を修正して追加した監査手続を実施するときは，被監査会社に事前に通知することが求められている。", "a": false, "c": "R５Ⅰ⑳イ", "e": "本肢のような通知は要求されていないし，疑われる不正への対応を効果的に行う観点からは，このような通知は行うべきではないと考えられる。"}, {"l": 106, "m": "不正リスク対応基準", "sb": "", "i": "A", "r": "", "q": "監査人は，監査の各段階において監査役等と協議するなどして連携を図らなければならない。特に監査人は，不正による重要な虚偽の表示の疑義があると判断した場合には，速やかに監査役等に報告しなければならない。", "a": true, "c": "H31Ⅱ①ウ／H29Ⅱ⑳ウ", "e": ""}, {"l": 107, "m": "不正リスク対応基準", "sb": "", "i": "A", "r": "", "q": "監査人は，不正による重要な虚偽の表示の疑義があると判断した場合には，監査の最終の段階において監査役等に報告するとともに，監査を完了するために必要となる監査手続の種類，時期及び範囲について協議しなければならない。", "a": false, "c": "H30Ⅱ⑳ウ", "e": "本肢の報告は，監査の最終の段階ではなく「速やかに」行わなければならない。"}, {"l": 108, "m": "不正リスク対応基準", "sb": "", "i": "A", "r": "", "q": "監査人は，不正による重要な虚偽表示を示唆する状況を発見した場合には，速やかに監査役等に報告するとともに，監査を完了するために必要となる監査手続の種類，時期及び範囲についても監査役等と協議しなければならない。", "a": false, "c": "H28Ⅰ⑳エ", "e": "本肢の対応は，不正による重要な虚偽表示の疑義がある場合に行うものである。"}, {"l": 109, "m": "不正リスク対応基準", "sb": "", "i": "A", "r": "", "q": "監査人は，上場会社である被監査会社が取引所の上場基準に抵触し得る状況にあることを識別した。この場合，速やかに監査役等に報告するとともに，監査を完了するために必要となる監査手続の種類，時期及び範囲についても協議しなければならない。", "a": false, "c": "R３⑳エ", "e": "同上。本肢の状況は，不正による重要な虚偽表示を示唆する状況に該当する。"}, {"l": 110, "m": "不正リスク対応基準", "sb": "", "i": "A", "r": "", "q": "監査人は，監査実施の過程において経営者の関与が疑われる不正を発見した場合には，監査役等に報告し，協議の上，経営者に問題点の是正等適切な措置を求めるとともに，当該不正が財務諸表に与える影響を評価することが必要となる。", "a": true, "c": "R２Ⅱ⑳イ／R３⑳ウ／H31Ⅰ⑳イ", "e": ""}, {"l": 111, "m": "不正リスク対応基準", "sb": "", "i": "A", "r": "", "q": "監査人は，経営環境の変化がないにもかかわらず，経営者が意図的に引当金を過小に見積もって計上していることを発見した場合には，監査役等に報告し，協議の上，経営者に問題点の是正等適切な措置を求めるとともに，当該事象が財務諸表に与える影響を評価しなければならない。", "a": true, "c": "H27Ⅱ⑥エ", "e": ""}, {"l": 112, "m": "不正リスク対応基準", "sb": "", "i": "A", "r": "", "q": "監査人は，経営者の関与が疑われる不正を発見した場合，速やかに経営者に問題点の是正等適切な措置を求めた上で，監査役等に報告しなければならない。", "a": false, "c": "R６Ⅰ⑳イ／H28Ⅱ⑲エ", "e": "本肢で必要となるコミュニケーションは，「監査役等への報告・協議⇒経営者への是正要求」の順序で行う。"}, {"l": 113, "m": "不正リスク対応基準", "sb": "", "i": "A", "r": "", "q": "不正リスク対応基準では，経営者が関与する不正を発見した場合，監査人には，経営者にその修正を促すことが求められる。", "a": true, "c": "R４Ⅰ⑳ウ", "e": ""}, {"l": 114, "m": "不正リスク対応基準", "sb": "", "i": "A", "r": "", "q": "監査人は，追加的な監査手続を実施した結果，不正による重要な虚偽表示の疑義があると判断した場合，当該疑義の内容や実施した監査手続とその結果などを監査調書に記載しなければならないが，不正による重要な虚偽表示の疑義がないと判断した場合には，監査調書への記載は求められていない。", "a": false, "c": "R７Ⅰ⑨ウ／R６Ⅰ⑳エ／R５Ⅰ⑳エ／R２Ⅱ⑳ウ／H30Ⅱ⑳エ／H29Ⅰ⑳エ", "e": "不正による重要な虚偽表示の疑義がないと判断した場合には，その旨と理由を監査調書に記載しなければならない。なお，不正による重要な虚偽表示の疑義があると判断した場合の記述は正しい。"}, {"l": 115, "m": "不正リスク対応基準", "sb": "", "i": "A", "r": "", "q": "監査人が不正による重要な虚偽の表示の疑義があると判断した場合，経営者確認書における確認の要請を検討する内容には，経営者が当該疑義に関連していると認識している全ての情報を監査人に提供した旨を含むことがある。", "a": true, "c": "R４Ⅱ⑳イ", "e": ""}, {"l": 116, "m": "不正リスク対応基準", "sb": "", "i": "A", "r": "", "q": "品質管理基準報告書には，監査における不正リスク対応基準に準拠して実施される監査業務を行う監査事務所に遵守が求められる要求事項が含まれている。この要求事項は，監査事務所に新たな品質管理システムの導入を求めているものではなく，不正リスクに対応する観点から特に留意すべき点に対応したものである。", "a": true, "c": "R５Ⅱ⑥イ", "e": "本肢の内容は不正リスク対応基準の設定前文からの出題であるが，品質管理基準報告書にも共通する考え方である。"}, {"l": 117, "m": "不正リスク対応基準", "sb": "", "i": "A", "r": "", "q": "監査事務所は，品質管理のシステムの整備及び運用に関する責任者を明確にしなければならないが，当該責任者は，不正リスクに関する品質管理の責任者を兼ねることはできない。", "a": false, "c": "H30Ⅱ⑨イ", "e": "品質管理のシステムの整備及び運用に関する責任者が，不正リスクに関する品質管理の責任者を兼ねることもある。"}, {"l": 118, "m": "不正リスク対応基準", "sb": "", "i": "A", "r": "", "q": "監査事務所は，監査契約の新規の締結及び更新の判断に関する方針及び手続に，不正リスクを考慮して監査契約の締結及び更新に伴うリスクを評価すること，並びに当該評価の妥当性について，新規の締結時及び更新時はそのリスクの程度に応じて，審査担当者など監査チーム外の適切な部署又は者により検討することを含めなければならない。", "a": true, "c": "R２Ⅰ⑤ア／R７Ⅰ⑦ア", "e": "文章の読み取りが難しい。更新に伴うリスク評価の妥当性の検討は「リスクの程度に応じて」実施する点に注意。"}, {"l": 119, "m": "不正リスク対応基準", "sb": "", "i": "A", "r": "", "q": "監査事務所は，監査契約の新規の締結及び更新の判断に関する方針及び手続に，不正リスクを考慮して監査契約の締結及び更新に伴うリスクを評価することを含めなければならず，不正リスクの考慮には，関与先の誠実性に関する理解が含まれる。", "a": true, "c": "H31Ⅱ⑨イ", "e": ""}, {"l": 120, "m": "不正リスク対応基準", "sb": "", "i": "A", "r": "", "q": "監査事務所は，監査契約の更新に伴う不正リスクを含むリスク評価の妥当性を検討するために，審査業務を通じて関与先の誠実性に関する理解を有している審査担当者をあてることがある。", "a": true, "c": "H28Ⅱ⑨エ", "e": ""}, {"l": 121, "m": "不正リスク対応基準", "sb": "", "i": "A", "r": "", "q": "監査契約の更新に当たり，監査責任者は，不正リスクを考慮して監査契約の更新に伴うリスクの評価を行わなければならない。一方，不正リスクに関する品質管理の責任者は，リスクの程度に応じて行われる当該評価の妥当性に関する監査チーム外の適切な部署又は者による検討が監査事務所の定める方針及び手続に従って適切に行われていることを確かめなければならない。", "a": false, "c": "H28Ⅰ⑦ア", "e": "本肢にある，契約更新に伴うリスク評価の妥当性の検討が適切に行われているか否かの確認は，不正リスクに関する品質管理の責任者ではなく，監査責任者が行う。"}, {"l": 122, "m": "不正リスク対応基準", "sb": "", "i": "A", "r": "", "q": "監査事務所は，不正による重要な虚偽の表示を示唆する状況が識別された場合に，必要に応じて監査事務所の専門的な調査部門や法律専門家等，監査事務所内外の適切な者から専門的な見解を得られるようにするための方針及び手続を定めなければならない。", "a": true, "c": "R２Ⅰ⑤ウ", "e": ""}, {"l": 123, "m": "不正リスク対応基準", "sb": "", "i": "A", "r": "", "q": "監査責任者は，不正による重要な虚偽表示を示唆する状況が識別された段階にとどまる限り，監査チームが必要に応じ専門的な見解の問合せを適切に実施することについて責任を負わない。", "a": false, "c": "H28Ⅰ⑦イ", "e": "監査責任者は，不正による重要な虚偽表示を示唆する状況が識別された段階に留まる場合も，必要に応じて専門的な見解の問合せを適切に実施する責任を負う。"}, {"l": 124, "m": "不正リスク対応基準", "sb": "", "i": "A", "r": "", "q": "監査事務所は，不正による重要な虚偽表示を示唆する状況が識別された場合に，修正後の監査計画及び監査手続の妥当性について，監査事務所としての審査が行われるよう，審査に関する方針及び手続を定めなければならない。", "a": false, "c": "R５Ⅱ⑥エ", "e": "本肢の審査は，不正による重要な虚偽表示を示唆する状況が識別された場合ではなく，不正による重要な虚偽表示の疑義があると判断された場合に行うものである。"}, {"l": 125, "m": "不正リスク対応基準", "sb": "", "i": "A", "r": "", "q": "監査事務所は，不正による重要な虚偽表示を示唆する状況が識別された場合，重要な虚偽表示リスクに関する評価の見直しが必要であるかどうかについて，監査事務所としての審査が行われるよう，審査に関する方針及び手続を定めなければならない。", "a": false, "c": "H31Ⅱ⑨エ", "e": "同上"}, {"l": 126, "m": "不正リスク対応基準", "sb": "", "i": "A", "r": "", "q": "不正による重要な虚偽表示の疑義があると判断された場合，審査担当者は，専門的な見解の問合せの要否及びその結論を検討すること等を通じて，監査チームが入手した監査証拠が十分かつ適切であるかどうかについて検討しなければならない。", "a": true, "c": "H28Ⅰ⑦エ", "e": ""}, {"l": 127, "m": "不正リスク対応基準", "sb": "", "i": "A", "r": "", "q": "監査事務所は，不正による重要な虚偽表示の疑義に対応する審査担当者の選任に関する方針及び手続に，追加の審査担当者の選任，又は適格者で構成される会議体による審査の実施を定めなければならない。", "a": false, "c": "R２Ⅱ⑩ウ／H28Ⅱ⑨ウ", "e": "追加の審査担当者の選任や会議体による審査は，不正による重要な虚偽表示の疑義の内容及び程度に応じて，「必要と認めた場合」に行うため，これらを方針及び手続として「定めなければならない」とする本肢は誤りとなる。"}, {"l": 128, "m": "不正リスク対応基準", "sb": "", "i": "A", "r": "", "q": "監査事務所は，不正による重要な虚偽の表示の疑義があると判断された場合，通常の審査担当者による審査に比べて，監査事務所としてより慎重な審査が行われる必要があるため，合議制による審査を行わなければならない。", "a": false, "c": "R７Ⅰ⑥ウ／R４Ⅱ⑨ウ／R２Ⅰ⑤エ", "e": "本肢の審査は合議制によるものでなくても構わないため，本肢は誤りとなる。なお，前段の記述は正しい。"}, {"l": 129, "m": "不正リスク対応基準", "sb": "", "i": "A", "r": "", "q": "監査事務所は，不正による重要な虚偽表示の疑義に対応する十分かつ適切な経験や職位等の資格を有する審査担当者の選任に関する方針及び手続を定めなければならず，審査担当者には不正リスクに関する品質管理の責任者を含めなければならない。", "a": false, "c": "H31Ⅱ⑨ウ", "e": "審査担当者に不正リスクに関する品質管理の責任者を含めることは，必ずしも要求されない。"}, {"l": 130, "m": "不正リスク対応基準", "sb": "", "i": "A", "r": "", "q": "不正による重要な虚偽表示の疑義があると判断された場合に，監査事務所の定める方針及び手続に従って審査担当者が選任されていることを確かめる責任は，不正リスクに関する品質管理の責任者ではなく，監査責任者にある。", "a": true, "c": "H28Ⅰ⑦ウ", "e": ""}, {"l": 131, "m": "不正リスク対応基準", "sb": "", "i": "A", "r": "", "q": "監査事務所は，監査業務の実施における品質を保持するための方針及び手続において，同一の企業の監査業務を担当する監査責任者の一部が交代した場合，監査の過程で識別した不正リスクを含む重要な事項が適切に後任の監査責任者に伝達されるように定めなければならない。", "a": false, "c": "R７Ⅰ⑦イ／R２Ⅱ⑩ア／H31Ⅱ⑨ア", "e": "本肢の方針及び手続は，同一の企業の監査業務を担当する監査責任者が「全員」交代した場合のものである。"}, {"l": 132, "m": "不正リスク対応基準", "sb": "", "i": "A", "r": "", "q": "監査事務所が行う不正リスクへの対応状況についての定期的な検証の範囲には，不正に関する教育・訓練が含まれるが，監査契約の新規の締結は含まれない。", "a": false, "c": "R４Ⅱ⑳ウ", "e": "不正リスクへの対応状況についての定期的な検証の範囲には，監査契約の新規の締結も含まれる。"}, {"l": 133, "m": "不正リスク対応基準", "sb": "", "i": "A", "r": "", "q": "不正リスクに関連して監査事務所内外からもたらされる情報に対処する場合，関連する監査チームではなく監査チーム外の監査事務所の適切な部署又は者が，監査の実施において当該情報を検討しなければならない。", "a": false, "c": "R２Ⅰ⑤イ", "e": "不正リスクに関連して監査事務所内外からもたらされる情報の検討は，監査を実施する監査チームが行う。"}, {"l": 134, "m": "財務諸表監査における法令の検討", "sb": "", "i": "A", "r": "", "q": "監査人は，不正によるか誤謬によるかを問わず，全体としての財務諸表に重要な虚偽表示がないことについて合理的な保証を得ることが求められているが，企業の違法行為の防止に対して責任は負わず，違法行為の全てを発見することが期待されているわけではない。", "a": true, "c": "R６Ⅰ⑭イ", "e": ""}, {"l": 135, "m": "財務諸表監査における法令の検討", "sb": "", "i": "A", "r": "", "q": "違法行為は，財務諸表に重要な影響を及ぼさない場合であっても，経営上のリスクに結びつくことから，違法行為を発見することは監査人の責任である。", "a": false, "c": "H26Ⅱ⑥エ", "e": "監査人は，重要な虚偽表示の原因となる違法行為に留意しながら監査を実施する責任を負うのみであり，違法行為そのものを発見する責任は負わない。"}, {"l": 136, "m": "財務諸表監査における法令の検討", "sb": "", "i": "A", "r": "", "q": "監査人は，法律上の解釈が必要となるような違法行為の兆候を発見した場合には，意見表明による財務諸表の適正性の保証の対象としてではなく，当該事項の経営者等への報告によって対応しなければならない。", "a": false, "c": "H31Ⅰ①イ", "e": "読み取りが難しい記述。発見した違法行為の兆候が法律上の解釈が必要となるものであっても，当該違法行為が財務諸表に重要な影響を及ぼすものであれば，監査人は，意見表明による財務諸表の適正性の保証の対象として対応することになる。なお，監査人は法律の専門家ではないため，法的な判断を行う責任はない点に注意すること。"}, {"l": 137, "m": "財務諸表監査における法令の検討", "sb": "", "i": "A", "r": "", "q": "監査人は，違法行為の全てを発見することが期待されているわけではない。しかし，監査人は，法人税等や退職給付に関する費用の認識に関連する法令など，財務諸表上の重要な金額及び開示の決定に直接影響を及ぼすと一般的に認識されている法令を経営者が遵守していることについて，十分かつ適切な監査証拠を入手しなければならない。", "a": true, "c": "H29Ⅱ①イ", "e": ""}, {"l": 138, "m": "財務諸表監査における法令の検討", "sb": "", "i": "A", "r": "", "q": "監査人は，財務諸表上の重要な金額及び開示の決定に直接影響を及ぼさない場合であっても，事業継続のために必要な被監査会社の事業の許認可に関する規定を遵守しているかどうかについて，十分かつ適切な監査証拠を入手しなければならない。", "a": false, "c": "R６Ⅰ⑭エ", "e": "財務諸表上の重要な金額及び開示の決定に直接影響を及ぼさない法令については，違反の識別に資する手続を実施するのみであり，当該法令に遵守しているかどうかに関する十分かつ適切な監査証拠を入手することまでは求められていない。"}, {"l": 139, "m": "財務諸表監査における法令の検討", "sb": "", "i": "A", "r": "", "q": "監査人は，経営者に対し，財務諸表を作成する場合にその影響を考慮すべき，既に認識されている違法行為又はその疑いが全て監査人に示された旨の経営者確認書を提出するよう要請しなければならない。", "a": true, "c": "R６Ⅰ⑭ア", "e": ""}, {"l": 140, "m": "財務諸表監査における法令の検討", "sb": "", "i": "B", "r": "", "q": "監査人は，被監査会社に違法行為の疑いがあり，その違法行為の疑いに経営者が関与している可能性がある場合であっても，当該事項について経営者と協議しなければならない。", "a": true, "c": "H31Ⅱ⑱エ", "e": ""}, {"l": 141, "m": "財務諸表監査における法令の検討", "sb": "", "i": "C", "r": "", "q": "監査人は，経営者による重大な違法行為を発見したとしても，それが財務諸表の適正性に影響を及ぼさないと判断したときは，当該事項について監査役等へ報告する必要はない。", "a": false, "c": "R６Ⅱ②ウ", "e": "経営者による重大な違法行為を発見した場合は，財務諸表の適正性に影響を及ぼすか否かにかかわらず，監査役等へ報告する必要がある。"}, {"l": 142, "m": "財務諸表監査における法令の検討", "sb": "", "i": "C", "r": "", "q": "監査人は，違法行為を識別した場合，監査調書に，当該違法行為に加え，実施した監査手続，行った職業的専門家としての重要な判断及び到達した結論を記載しなければならないが，違法行為に関連する重要な事項についての経営者，監査役等及びその他の者との協議事項まで記載する必要はない。", "a": false, "c": "R６Ⅰ⑭ウ", "e": "違法行為に関連する重要な事項についての経営者，監査役等及びその他の者との協議事項についても，監査調書に記載しなければならない。"}, {"l": 143, "m": "監査役等とのコミュニケーション", "sb": "", "i": "A", "r": "", "q": "監査人と監査役等との有効な双方向のコミュニケーションは，監査役等が財務報告プロセスの監視責任を果たし，財務諸表の重要な虚偽表示リスクを軽減する上で重要である。", "a": true, "c": "R６Ⅱ⑳イ／H31Ⅱ⑲ア／H29Ⅱ⑥ウ", "e": ""}, {"l": 144, "m": "監査役等とのコミュニケーション", "sb": "", "i": "A", "r": "", "q": "監査人と監査役等の連携は，不正が疑われる場合に重要となるので，監査人は，不正発覚時並びに不正が疑われる場合に限って監査役等と連携を図らなければならないことが，監査基準上追加された。", "a": false, "c": "H30Ⅰ⑪エ", "e": "監査人と監査役等の連携は，不正が疑われる場合に限らず重要であるため，監査人は，不正又は不正の疑いの有無にかかわらず，監査役等と連携を図らなければならないことが，監査基準上追加された。"}, {"l": 145, "m": "監査役等とのコミュニケーション", "sb": "", "i": "A", "r": "", "q": "監査人は，監査役等と連携し監査を実施することが求められているが，ここでいう連携とは，監査人と監査役等とが，監査の業務を分担して実施することを意味する。", "a": false, "c": "R２Ⅱ②イ", "e": "監査人と監査役等の連携は，あくまでも双方向のコミュニケーションによる情報共有等を意味するものであり，監査の業務を分担して実施することを意味するわけではない。"}, {"l": 146, "m": "監査役等とのコミュニケーション", "sb": "", "i": "A", "r": "", "q": "監査人は，企業統治の構造に応じてコミュニケーションを行うことが適切な統治責任者を判断しなければならない。我が国においては，コミュニケーションの対象となる統治責任者は，取締役会，監査役若しくは監査役会，監査等委員会又は監査委員会とされている。", "a": false, "c": "R２Ⅰ⑲ア", "e": "我が国においてコミュニケーションの対象として想定されている統治責任者は，基本的には「監査役等」であり，取締役会は含まれていない。"}, {"l": 147, "m": "監査役等とのコミュニケーション", "sb": "", "i": "A", "r": "", "q": "企業において「ガバナンスに責任を有する者」とは，企業の戦略的方向性と説明責任を果たしているかどうかを監視する責任を有する者又は組織をいい，我が国においては，会社法の機関の設置に応じて，取締役会，監査役若しくは監査役会，監査等委員会又は監査委員会が該当する。", "a": true, "c": "R４Ⅰ②エ", "e": "本肢は，純粋に「ガバナンスに責任を有する者」について問うものであり，コミュニケーションの対象を問う上記の問題とは異なる点に注意。"}, {"l": 148, "m": "監査役等とのコミュニケーション", "sb": "", "i": "A", "r": "", "q": "監査人が監査役等とコミュニケーションを行うことが要求される事項は，財務諸表監査に関連する監査人の責任，監査上の重要な発見事項及び監査人の独立性に関する事項であり，計画した監査の範囲とその実施時期の概要は，監査役等とコミュニケーションを行うこととして必ずしも要求される事項ではない。", "a": false, "c": "H29Ⅱ⑥イ", "e": "計画した監査の範囲とその実施時期の概要についても，監査役等とコミュニケーションを行わなければならない。"}, {"l": 149, "m": "監査役等とのコミュニケーション", "sb": "", "i": "A", "r": "", "q": "監査人は，財務諸表監査に関連する監査人の責任についての監査役等とのコミュニケーションにおいて，財務諸表監査は経営者又は監査役等の責任を代替するものではないことについてまでも監査役等に伝達する必要はない。", "a": false, "c": "H27Ⅰ⑬エ", "e": "本肢のコミュニケーションにおいては，財務諸表監査は経営者又は監査役等の責任を代替するものではないことについても伝達する必要がある。"}, {"l": 150, "m": "監査役等とのコミュニケーション", "sb": "", "i": "A", "r": "", "q": "監査計画の策定において，収益認識を特別な検討を必要とするリスクであると判断したが，当該事項は非定型的な取引に基づくものではないため，監査計画についての監査役への説明においては，この部分を除外した。", "a": false, "c": "R２Ⅰ⑯ウ", "e": "計画した監査の範囲とその実施時期に関して監査役等と行うコミュニケーションには，監査人が識別したＳＲの内容を含まれるため，本肢は誤りとなる。"}, {"l": 151, "m": "監査役等とのコミュニケーション", "sb": "", "i": "A", "r": "", "q": "監査人は，被監査会社における関連当事者との通例ではない重要な取引に気付いた場合には，計画した監査の範囲とその実施時期の概要について監査役等とコミュニケーションを行う際に，これを伝達しなければならない。", "a": true, "c": "H31Ⅱ⑲イ", "e": "関連当事者との通例ではない重要な取引はＳＲに該当するため，上記の問題と同様に，計画した監査の範囲とその実施時期の概要に関する監査役等とのコミュニケーションに含めなければならない。"}, {"l": 152, "m": "監査役等とのコミュニケーション", "sb": "", "i": "A", "r": "", "q": "監査人は，計画した監査の範囲とその実施時期の概要について，監査役等とコミュニケーションを行わなければならないが，これには，特別な検討を必要とするリスク以外に識別している重要な虚偽表示リスクが高い領域への監査人の対応は，必ずしも含めなくてもよい。", "a": true, "c": "R２Ⅰ⑲イ", "e": ""}, {"l": 153, "m": "監査役等とのコミュニケーション", "sb": "", "i": "A", "r": "", "q": "監査人は，監査役等に対し，監査の過程で識別した会計上の見積り等の企業の会計実務に係る質的側面の重要事項だけではなく，経営者に要請した経営者確認書の草案についてもコミュニケーションを行わなければならない。", "a": true, "c": "H25Ⅰ⑭エ", "e": ""}, {"l": 154, "m": "監査役等とのコミュニケーション", "sb": "", "i": "A", "r": "", "q": "監査人は，監査期間中に困難な状況に直面した場合には，その状況について監査役等とコミュニケーションを行わなければならない。", "a": true, "c": "R６Ⅱ⑳ウ", "e": ""}, {"l": 155, "m": "監査役等とのコミュニケーション", "sb": "", "i": "A", "r": "", "q": "監査人は，監査期間中に不合理に短い期間内に監査を終了することが求められた場合，その状況について，監査役等とコミュニケーションを行わなければならない。", "a": true, "c": "R６Ⅰ⑬ア", "e": "本肢の状況は，監査期間中に直面した困難な状況に該当する。"}, {"l": 156, "m": "監査役等とのコミュニケーション", "sb": "", "i": "A", "r": "", "q": "被監査会社が上場企業の場合，監査人は，識別した独立性に対する阻害要因が許容可能な水準にないと判断したとき，当該要因を生じさせている状況を除去するための対応策又は当該要因を許容可能な水準にまで軽減するために適用されるセーフガードについて，当該企業の監査役等とコミュニケーションを行わなければならない。", "a": true, "c": "H31Ⅰ③イ", "e": ""}, {"l": 157, "m": "監査役等とのコミュニケーション", "sb": "", "i": "A", "r": "", "q": "上場企業の監査人が監査人の独立性に関して被監査会社の監査役等と口頭でコミュニケーションを行い，いつ，誰と，どのような内容についてコミュニケーションを行ったかを記載した監査調書を作成すれば，当該監査人は書面又は電磁的記録によるコミュニケーションを省略することができる。", "a": false, "c": "H31Ⅱ⑲ウ／H29Ⅱ⑥ア", "e": "上場企業の監査人が行う独立性に関する書面又は電磁的記録のコミュニケーションは，本肢の監査調書を作成しても免除されない。"}, {"l": 158, "m": "監査役等とのコミュニケーション", "sb": "", "i": "A", "r": "", "q": "監査人は，監査役等とのコミュニケーションのなかで独立性に関連する職業倫理の規定を遵守したことを報告する際には，監査制度の礎である独立性の重要性に鑑み，すべての監査契約において書面又は電磁的記録をもって実施する必要がある。", "a": false, "c": "H25Ⅰ⑭ア", "e": "独立性に関するコミュニケーションについて書面又は電磁的記録によることが強制されるのは，上場会社の監査契約のみである。"}, {"l": 159, "m": "監査役等とのコミュニケーション", "sb": "", "i": "A", "r": "", "q": "上場企業の監査人は，監査人の独立性についての職業倫理に関する規定を遵守した旨につき，監査役等と書面又は電磁的記録によるコミュニケーションを行わなければならないが，監査役等の全員が当該事実を知っていることが明らかな場合には，独立性に関するコミュニケーションを行わなくてもよい。", "a": true, "c": "H27Ⅰ⑬イ", "e": ""}, {"l": 160, "m": "監査役等とのコミュニケーション", "sb": "", "i": "A", "r": "", "q": "会計監査人設置会社の監査人は，監査事務所の品質管理システムの整備・運用状況の概要を，監査役等に書面若しくは電磁的記録又は口頭で伝達しなければならない。", "a": false, "c": "R６Ⅱ⑳ア", "e": "本肢のコミュニケーションは書面又は電磁的記録で行わなければならない。"}, {"l": 161, "m": "監査役等とのコミュニケーション", "sb": "", "i": "A", "r": "", "q": "監査人は，公認会計士法上の大会社等の監査を実施する場合，監査事務所の品質管理のシステムの外部のレビュー又は検査の結果を含めて，監査事務所の品質管理のシステムの整備・運用状況の概要を監査役等に口頭ではなく書面又は電磁的記録で伝達しなければならない。", "a": true, "c": "H29Ⅱ⑥エ", "e": ""}, {"l": 162, "m": "監査役等とのコミュニケーション", "sb": "", "i": "A", "r": "", "q": "監査事務所が日本公認会計士協会の品質管理レビューの結果を受領した場合には，監査チームは，被監査会社の監査役等に対し，必ずしもその結果を伝達しなくてもよいが，当該被監査会社に対する監査業務が品質管理レビューの対象業務として選定されたときは，選定された事実や当該業務に対する品質管理レビューにおいて発見された不備事項を伝達しなければならない。", "a": false, "c": "R５Ⅰ⑨エ", "e": "公認会計士法上の大会社等の監査を前提にするならば，本肢の後段で挙げられている事項を含めて，受領した品質管理レビューの結果を監査役等に伝達しなければならないため，本肢は誤りとなる。一方で，公認会計士法上の大会社等以外の会社の監査を前提にするならば，上記の伝達は要求されていないため，やはり本肢は誤りとなる。"}, {"l": 163, "m": "監査役等とのコミュニケーション", "sb": "", "i": "A", "r": "", "q": "監査人は，公認会計士法上の大会社等の監査において，前年度に監査事務所の品質管理のシステムの外部のレビューの結果を受領していないときでも，過去に外部のレビューの結果を受領している場合には，監査役等に書面又は電磁的記録で伝達する監査事務所の品質管理のシステムの整備・運用状況の概要に，当該レビューの結果を含めなければならない。", "a": true, "c": "R２Ⅰ⑲ウ", "e": "監査役等に書面又は電磁的記録での伝達が求められる外部のレビューの結果は，「前年度」のものではなく「直近」のものとされているため，本肢は正しい記述となる。"}, {"l": 164, "m": "監査役等とのコミュニケーション", "sb": "", "i": "B", "r": "", "q": "監査人は，監査役等とコミュニケーションをするに当たって，事前に，経営者あるいは内部監査に従事する適切な者と協議することがある", "a": true, "c": "R６Ⅰ⑬ウ", "e": ""}, {"l": 165, "m": "監査役等とのコミュニケーション", "sb": "", "i": "A", "r": "", "q": "監査人は，監査人と監査役等の間で行われる双方向のコミュニケーションの適切性に関する評価を裏付けるため，追加的な監査手続を立案し実施しなければならない。", "a": false, "c": "R６Ⅰ⑬エ", "e": "双方向のコミュニケーションが適切に実施されたかどうかを評価するための特別な手続を立案する必要はない。"}, {"l": 166, "m": "監査役等とのコミュニケーション", "sb": "", "i": "A", "r": "", "q": "監査人は，監査役等と有効なコミュニケーションをとることが必要とされているが，有効なコミュニケーションをとるために，監査役等と会う際には必ず経営者の同席を求める必要がある。", "a": false, "c": "H27Ⅰ⑬ア", "e": "経営者が同席する場合，経営者の誠実性等，経営者の問題に関するコミュニケーションを有効に行えない可能性が高まる。そのため，監査役等とのコミュニケーションを有効なものとするためには，例えば，監査役等と監査人が経営者の出席なしに会うこと等が考えられる。"}, {"l": 167, "m": "監査役等とのコミュニケーション", "sb": "", "i": "A", "r": "", "q": "監査人は，監査役等との間で行われる双方向のコミュニケーションが十分でなく，その状況が解消できない場合，監査報告書において監査範囲の制約に関する除外事項を付すことがある。", "a": true, "c": "H27Ⅰ⑬ウ／H25Ⅰ⑭イ", "e": ""}, {"l": 168, "m": "内部統制の不備に関するコミュニケーション", "sb": "", "i": "B", "r": "", "q": "財務諸表の虚偽表示を適時に防止又は発見・是正するのに必要な内部統制が存在しないことは，内部統制の不備には該当しない。", "a": false, "c": "R７Ⅰ⑬イ", "e": "必要な内部統制が存在しないことは内部統制の不備に該当する。"}, {"l": 169, "m": "内部統制の不備に関するコミュニケーション", "sb": "", "i": "B", "r": "", "q": "監査人は，内部統制の不備を識別した場合，実施した監査手続に基づいて，内部統制の不備が単独で又は複数組み合わさって重要な不備となるかどうかを，虚偽表示の発生可能性や潜在的な虚偽表示の影響を勘案して判断しなければならない。", "a": true, "c": "R７Ⅰ⑬ウ", "e": ""}, {"l": 170, "m": "内部統制の不備に関するコミュニケーション", "sb": "", "i": "A", "r": "", "q": "監査人は，監査の過程で識別した内部統制の重要な不備を，適切な階層の経営者に適時に書面又は電磁的記録により報告しなければならない。その時期は，監査役等への報告の前後いずれでもよい。", "a": true, "c": "H29Ⅱ⑲ウ", "e": ""}, {"l": 171, "m": "内部統制の不備に関するコミュニケーション", "sb": "", "i": "A", "r": "", "q": "監査人は，監査の過程で識別した内部統制の重要な不備全てについて，適切な階層の経営者に報告することが求められている。", "a": false, "c": "R５Ⅱ⑧ア", "e": "識別した重要な不備が経営者の誠実性や能力と関連する場合は，適切な階層の経営者に直接報告しないこともある。👉講義レジュメ⑥-6-2"}, {"l": 172, "m": "内部統制の不備に関するコミュニケーション", "sb": "", "i": "A", "r": "", "q": "監査人は，適切な階層の経営者に対して，直接報告することが適切でない場合を除き，内部統制の重要な不備のみを報告すればよい。", "a": false, "c": "R７Ⅰ⑬エ", "e": "重要でない不備のうち，適切な階層の経営者に注意を促すに値すると監査人が判断したものについても，適切な階層の経営者に報告しなければならない。"}, {"l": 173, "m": "内部統制の不備に関するコミュニケーション", "sb": "", "i": "A", "r": "", "q": "監査人は，監査の過程で識別した内部統制の重要な不備について，経営者に速やかに口頭で報告を行った場合，書面又は電磁的記録により監査役等に報告する責任は免除される。", "a": false, "c": "R５Ⅱ⑧イ", "e": "重要な不備について口頭で報告を行ったとしても，書面又は電磁的記録により報告する責任は免除されない。"}, {"l": 174, "m": "内部統制の不備に関するコミュニケーション", "sb": "", "i": "A", "r": "", "q": "監査人は，監査の過程で識別した重要な不備以外の内部統制の不備について，内部監査人や規制当局等の他の関係者が既に経営者に報告を行っていたとしても，経営者に報告を行うことが適切な場合がある。", "a": true, "c": "R５Ⅱ⑧エ", "e": ""}, {"l": 175, "m": "内部統制の不備に関するコミュニケーション", "sb": "", "i": "A", "r": "", "q": "監査人は，経営者や監査役等に内部統制の重要な不備の内容とそれによって見込まれる影響の説明をする場合，その影響額を算定する必要はなく，また，必ずしも重要な不備を分類して集約する必要もない。", "a": true, "c": "R５Ⅱ⑧ウ", "e": "重要な不備の分類・集約は必要に応じて行うものである。"}, {"l": 176, "m": "監査人の交代", "sb": "", "i": "A", "r": "", "q": "監査人の交代に関して監査業務の引継が求められる前任監査人とは，別の監査事務所に所属する，前年度の財務諸表の監査報告書を提出した者をいい，当該監査報告書を提出する前に監査契約を解除した者は含まれない。", "a": false, "c": "R６Ⅰ⑧ア", "e": "本肢にある「当該監査報告書を提出する前に監査契約を解除した者」は，当年度の財務諸表の監査に着手したものの監査報告書を提出していない別の監査事務所に属する退任した者を意味していると思われる。"}, {"l": 177, "m": "監査人の交代", "sb": "", "i": "A", "r": "", "q": "監査事務所は，監査人予定者となった場合，前任監査人から監査業務の十分な引継を受ける必要があるが，適切な引継を受けることは，監査契約の締結に伴うリスクを低い水準に抑えることができるか否かを的確に判断することを可能にする。", "a": true, "c": "R４Ⅱ⑩ウ", "e": ""}, {"l": 178, "m": "監査人の交代", "sb": "", "i": "A", "r": "", "q": "監査人予定者は，監査業務の引継を開始する時点を明確にするため，前任監査人及び監査人予定者に対して，監査人予定者の指定に関する通知を書面等で行うよう，会社に依頼しなければならない。", "a": true, "c": "R６Ⅰ⑧イ", "e": ""}, {"l": 179, "m": "監査人の交代", "sb": "", "i": "A", "r": "", "q": "監査人予定者は，前任監査人に対し，経営者による不正又は不正の疑いの有無及び該当がある場合にはその内容を質問しなければならない。この手続は監査契約の締結の可否について適切に判断するために行うものであるため，監査契約の締結の前に実施する必要がある。", "a": true, "c": "H30Ⅰ⑨ウ", "e": ""}, {"l": 180, "m": "監査人の交代", "sb": "", "i": "A", "r": "", "q": "監査人予定者は，監査契約の可否を適切に判断するため，前任監査人と会社との間に会計処理，表示及び監査手続に関する会社との間の重要な意見の相違があるかどうかを問い合わせ，相違がある場合には，監査契約の締結前に，前任監査人からその内容に関する回答を書面又は電磁的記録で得ておかなければならない。", "a": false, "c": "H27Ⅰ⑧ウ", "e": "本肢の質問の回答は，書面又は電磁的記録で得る必要はない。"}, {"l": 181, "m": "監査人の交代", "sb": "", "i": "A", "r": "", "q": "監査人予定者は，前任監査人から監査業務の十分な引継を受けられない場合には，監査契約の締結に伴うリスクを低い水準に抑えることができるか否かについて，より慎重な検討が求められるが，これには第三者への問い合わせ等により阻害要因に関する情報を収集することが含まれる。", "a": true, "c": "H27Ⅰ⑧イ", "e": ""}, {"l": 182, "m": "監査人の交代", "sb": "", "i": "A", "r": "", "q": "監査人予定者は，監査人の交代に際して前任監査人から監査業務の引継が受けられない場合，第三者への問合せ等，他の方法により情報を収集することで監査契約の締結に伴うリスクを許容可能な水準に抑えることができると判断したとしても，監査人予定者は，当該監査業務の契約を締結してはならない。", "a": false, "c": "H30Ⅰ⑨ア", "e": "前任監査人からの引継が受けられない場合でも，第三者への問合せ等，他の方法による情報収集で監査契約の締結に伴うリスクを許容可能な水準に抑えることができると判断すれば，契約締結できる。"}, {"l": 183, "m": "監査人の交代", "sb": "", "i": "A", "r": "", "q": "公認会計士は，監査人の交代に当たり，前任監査人に対して監査契約を継続しない理由につき質問した場合において，秘密保持を理由としてその回答を拒否されたときには，監査契約を締結してはならない。", "a": false, "c": "H24Ⅰ①イ", "e": "同上。また，引継は，業務上知り得た秘密情報を開示又は利用することが認められる正当な理由に該当するため，前任監査人は，秘密保持を理由として，監査人予定者からの質問を拒否してはならない。"}, {"l": 184, "m": "監査人の交代", "sb": "", "i": "A", "r": "", "q": "前任監査人は，監査人予定者からの求めの有無にかかわらず，監査の過程で自らが認識した特別な検討を必要とするリスクを生ずる事項や，監査手続を実施した結果重要な虚偽の表示の可能性を示した事項を，監査人予定者に対して伝達しなければならない。", "a": true, "c": "H27Ⅰ⑧ア", "e": ""}, {"l": 185, "m": "監査人の交代", "sb": "", "i": "A", "r": "", "q": "監査事務所は，監査人の交代に際し，財務諸表の重要な虚偽の表示に係る情報を把握していたとしても，後任の監査事務所からの質問がない場合には，自ら通知することは求められていない。", "a": false, "c": "H24Ⅱ⑩オ", "e": "前任の監査事務所は，後任の監査事務所からの質問がなくとも，財務諸表の重要な虚偽の表示に係る情報を後任の監査事務所に伝達しなければならない。"}, {"l": 186, "m": "監査人の交代", "sb": "", "i": "A", "r": "", "q": "前任監査人は，監査業務の引継に当たり，監査人予定者の求めに応じて，監査役等に提出した監査実施結果を記載した報告書の写しを提供する場合がある。", "a": true, "c": "R６Ⅰ⑧エ", "e": ""}, {"l": 187, "m": "監査人の交代", "sb": "", "i": "A", "r": "", "q": "監査人予定者の閲覧に供することが求められる監査調書の範囲には，前任監査人が監査の過程で識別した重要な事項に関する監査調書が含まれるが，監査手続の実施結果のうち，最終的な意見形成の判断過程に関する監査調書については含める必要はない。", "a": false, "c": "R６Ⅰ⑧ウ", "e": "閲覧に供する監査調書の範囲には，監査手続の結果導かれた結論を記載した監査調書等も含まれるため，本肢のいう「最終的な意見形成の判断過程に関する監査調書」も含まれることになる。"}, {"l": 188, "m": "監査人の交代", "sb": "", "i": "A", "r": "", "q": "監査業務の引継は，主に，監査人予定者及び監査人による質問及び監査調書の閲覧によって実施される。前任監査人が過年度に係る監査業務の実施過程で入手・作成した情報は重要であるため，前任監査人は求められた監査調書を全て閲覧に供しなければならない。", "a": false, "c": "H30Ⅰ⑨イ", "e": "前任監査人は，引継の目的に関連しない監査調書は，閲覧要求に応じる監査調書の範囲から除外することができる。そのため，前任監査人は，求められた監査調書を全て閲覧に供する必要はない。"}, {"l": 189, "m": "監査人の交代", "sb": "", "i": "A", "r": "", "q": "前任監査人は，監査人予定者の求めに応じて，前任監査人が識別した監査上の重要な事項や，期首残高に関連する監査調書を閲覧させる必要があるが，既に会社と監査契約を締結した監査人からはその求めがあっても閲覧させる必要はない。", "a": false, "c": "H27Ⅰ⑧エ", "e": "前任監査人は，監査契約を締結する前の監査人予定者からの閲覧要求のみならず，監査契約を既に締結している監査人からの閲覧要求にも応じなければならない。"}, {"l": 190, "m": "監査人の交代", "sb": "", "i": "A", "r": "", "q": "監査人は，あらかじめ監査契約書又は監査約款に，監査人の交代における監査業務の引継に当たって秘密保持が解除されることを明記しておかなければならない。", "a": true, "c": "R４Ⅰ⑫イ／H30Ⅰ⑨エ／H26Ⅱ③ア", "e": ""}, {"l": 191, "m": "監査人の交代", "sb": "", "i": "A", "r": "", "q": "監査人予定者は，監査契約の締結前に会社から得た情報及び監査業務の引継に関して前任監査人から得た情報に対して，当該会社と監査契約を締結するか否かにかかわらず秘密保持を負う。", "a": true, "c": "R５Ⅱ⑪ウ／H26Ⅱ③ウ／H24Ⅱ⑧イ", "e": ""}, {"l": 192, "m": "監査人の交代", "sb": "", "i": "A", "r": "", "q": "監査人予定者は，監査契約を締結するか否かにかかわらず，監査契約の締結前に会社や前任監査人から得た情報に対して秘密保持を負うことについて，当該会社と文書で確認しなければならない。", "a": true, "c": "R４Ⅰ⑫ア", "e": ""}, {"l": 193, "m": "監査人の交代", "sb": "", "i": "A", "r": "", "q": "監査人予定者は，被監査会社と前任監査人から得た情報に対して秘密保持を負うことになるので，「秘密保持に関する確認書」等の文書を作成し，被監査会社，前任監査人，及び監査人予定者の３者が書面又は電磁的記録で確認しなければならない。", "a": false, "c": "H26Ⅱ③イ", "e": "「秘密保持に関する確認書」は，被監査会社と監査人予定者が取り交わすものである。"}, {"l": 194, "m": "監査人の交代", "sb": "", "i": "A", "r": "", "q": "監査人の交代に際して，前任監査人が識別した監査上の重要な事項に関連する監査調書及び期首残高に関連する監査調書を，監査人予定者及び監査人に対して閲覧させることは前任監査人の秘密保持違反とはならない。ただし，この場合，前任監査人と監査人予定者及び監査人は，監査調書の閲覧の前に「監査調書の閲覧に伴う秘密保持に関する承諾書」を取り交わさなければならない。", "a": true, "c": "H27Ⅱ⑪ウ", "e": ""}, {"l": 195, "m": "監査人の交代", "sb": "", "i": "A", "r": "", "q": "監査人予定者は，前任監査人から入手した情報について，監査契約の締結の可否に関する判断及び監査業務の引継に役立てるために利用し，それ以外に利用してはならない。", "a": true, "c": "H26Ⅱ③エ", "e": ""}, {"l": 196, "m": "初年度監査の期首残高の検討", "sb": "", "i": "B", "r": "", "q": "初年度監査の期首残高について，当年度の財務諸表に重要な影響を及ぼす虚偽表示が含まれているかどうかについて十分かつ適切な監査証拠を入手するためには，前年度の財務諸表が監査されている場合，監査人は前任監査人の監査調書を閲覧するだけでなく，当年度の監査手続で期首残高に関する監査証拠を入手できるかどうかを評価し，期首残高に関する監査証拠を入手するための特定の監査手続を実施しなければならない。", "a": false, "c": "H26Ⅱ⑩イ", "e": "初年度監査の期首残高に関する十分かつ適切な監査証拠を入手するための監査手続として，本肢が挙げている，①前任監査人の監査調書の閲覧，②当年度の監査手続で期首残高に関する監査証拠を入手できるかどうかの評価，③期首残高に関する監査証拠を入手するための特定の監査手続の実施があるが，監査人は，これらの全てを実施する必要はなく，一つ又は複数選択して実施することになる。"}, {"l": 197, "m": "関連当事者の監査", "sb": "", "i": "B", "r": "", "q": "監査人は，関連当事者との取引に伴う重要な虚偽表示リスクを識別するための情報を入手することが必要であるが，関連当事者との重要な取引や取引条件についての権限の付与及び承認のために経営者が構築した内部統制がある場合には，その内部統制を理解するため，経営者に質問しなければならない。", "a": true, "c": "H29Ⅱ⑮イ", "e": ""}, {"l": 198, "m": "関連当事者の監査", "sb": "", "i": "A", "r": "", "q": "関連当事者との取引は，通常の取引過程において行われることが多いが，関連当事者との関係を利用して，経営者が共謀，隠蔽又は改竄を行う機会が増すため，監査人は，関連当事者との取引の全てを特別な検討を必要とするリスクとして取り扱わなければならない。", "a": false, "c": "H29Ⅱ⑮ア／H27Ⅱ⑭ウ", "e": "特別な検討を必要とするリスクとして取り扱わなければならないのは，企業の通常の取引過程から外れた関連当事者との重要な取引のみである。"}]}, {"n": 7, "name": "年度の財務諸表監査以外の保証業務", "qs": [{"l": 1, "m": "財務情報等に係る保証業務の概念的枠組み", "sb": "", "i": "A", "r": "", "q": "「財務情報等に係る保証業務の概念的枠組みに関する意見書」が公表された趣旨は，公認会計士が提供する業務を，監査人としての業務とその他の業務に区別することにより，公認会計士が提供できる保証を伴う業務の範囲を明確化することであった。", "a": true, "c": "H25Ⅰ⑦ウ", "e": ""}, {"l": 2, "m": "財務情報等に係る保証業務の概念的枠組み", "sb": "", "i": "A", "r": "", "q": "財務情報等に係る保証業務に関する概念整理を行うことを主たる目的として定めた「財務情報等に係る保証業務の概念的枠組みに関する意見書」は，「監査基準」のように，特定の保証業務を前提として適用されることを意図していない。", "a": true, "c": "R６Ⅱ⑩ア", "e": ""}, {"l": 3, "m": "財務情報等に係る保証業務の概念的枠組み", "sb": "", "i": "A", "r": "", "q": "財務情報等に係る保証業務の範囲は，公認会計士法に規定する監査又は証明業務以外の保証業務である。", "a": false, "c": "H28Ⅱ⑩ア", "e": "財務情報等に係る保証業務の範囲には，公認会計士法に規定する監査又は証明業務も含まれる。"}, {"l": 4, "m": "財務情報等に係る保証業務の概念的枠組み", "sb": "", "i": "B", "r": "", "q": "業務実施者は，職業的専門家としての倫理を遵守するとともに，業務の遂行に当たっては公正不偏の態度を保持しなければならず，業務を適正に遂行するための十分な専門的技能及び知識を有し，品質管理に関する業務規範に従う必要がある。", "a": true, "c": "R７Ⅰ⑩イ", "e": ""}, {"l": 5, "m": "財務情報等に係る保証業務の概念的枠組み", "sb": "", "i": "B", "r": "", "q": "業務実施者は，保証業務について要請される要件及び保証業務の実施に関する基準に準拠して適切に業務を行わなかった場合には責任を負う。通常，限定的保証業務と合理的保証業務とでは，業務実施者の責任の対象となる範囲が異なる。", "a": true, "c": "R６Ⅱ⑩イ／R４Ⅰ⑩イ／H28Ⅱ⑩ウ／H24Ⅰ⑧オ", "e": "限定的保証業務の場合は，合理的保証業務の場合よりも実施手続が限定されるため，業務実施者の責任の対象となる範囲も制限される。"}, {"l": 6, "m": "財務情報等に係る保証業務の概念的枠組み", "sb": "", "i": "A", "r": "", "q": "主題情報が想定利用者に提示されない場合，業務実施者は，主題それ自体について検証した結果を結論として報告することができる。", "a": true, "c": "H23Ⅱ⑥ウ", "e": ""}, {"l": 7, "m": "財務情報等に係る保証業務の概念的枠組み", "sb": "", "i": "A", "r": "", "q": "業務実施者は，自ら入手した証拠に基づき規準に照らして主題を判断した結果を結論として表明する場合，主題それ自体に対する責任を負う。", "a": false, "c": "R３⑩ア／H30Ⅱ⑩ウ", "e": "ダイレクト・レポーティングの場合，業務実施者は，主題それ自体の信頼の程度を高める責任を負うのみであり，主題それ自体に対する責任は負わない。"}, {"l": 8, "m": "財務情報等に係る保証業務の概念的枠組み", "sb": "", "i": "A", "r": "", "q": "保証業務のなかには，主題に責任を負う者が自己の責任において想定利用者に主題情報を提示せず，業務実施者が主題について一定の規準により評価又は測定した結果を結論として表明するものもある。この保証業務における業務実施者の責任は，主題それ自体の信頼の程度を高めることにある。", "a": true, "c": "H29Ⅱ⑩エ", "e": ""}, {"l": 9, "m": "財務情報等に係る保証業務の概念的枠組み", "sb": "", "i": "A", "r": "", "q": "保証業務には，業務実施者自らが主題情報を作成し，その主題情報を結論として保証報告書に報告する業務がある。", "a": true, "c": "R２Ⅰ⑩ア", "e": "本肢は，ダイレクト・レポーティングを説明している記述である。"}, {"l": 10, "m": "財務情報等に係る保証業務の概念的枠組み", "sb": "", "i": "A", "r": "", "q": "業務実施者は，主題に責任を負う者による想定利用者への主題情報の提示がない場合には，主題情報を保証報告書に記載した上で，それに関する積極的結論又は消極的結論を報告する。", "a": false, "c": "H31Ⅱ⑩エ", "e": "ダイレクト・レポーティングの場合に業務実施者が作成する主題情報は，保証報告書に記載される場合以外にも，保証報告書の添付情報として示される場合がある。"}, {"l": 11, "m": "財務情報等に係る保証業務の概念的枠組み", "sb": "", "i": "A", "r": "", "q": "保証業務においては，合理的保証業務よりも保証水準を引き下げ，消極的形式によって結論を報告することがある。", "a": true, "c": "H23Ⅱ⑥エ", "e": ""}, {"l": 12, "m": "財務情報等に係る保証業務の概念的枠組み", "sb": "", "i": "A", "r": "", "q": "合理的保証業務と限定的保証業務という分類は，保証業務リスクの程度による分類であり，結論が積極的形式で報告されるか，消極的形式で報告されるかとは無関係である。したがって，限定的保証業務の結論が積極的形式によって報告される場合もありうる。", "a": false, "c": "H29Ⅱ⑩イ／R５Ⅰ⑩ウ", "e": "合理的保証業務と限定的保証業務という分類は，保証業務リスクの程度による分類であるため，結論の形式と関係する分類である。したがって，限定的保証業務において，積極的形式で結論が報告されることはない。"}, {"l": 13, "m": "財務情報等に係る保証業務の概念的枠組み", "sb": "", "i": "A", "r": "", "q": "限定的保証業務は，合理的保証業務の場合と比べて，実施する手続の種類，実施時期及び実施範囲が限定的であるが，結論を報告する基礎として，業務実施者は十分に有意な保証水準を得ることが求められる。", "a": true, "c": "R５Ⅰ⑩ア／R３⑩エ", "e": ""}, {"l": 14, "m": "財務情報等に係る保証業務の概念的枠組み", "sb": "", "i": "A", "r": "", "q": "限定的保証業務において，業務実施者は，保証業務リスクの水準を，合理的保証業務の場合よりは低いが，消極的形式による結論の報告を行う基礎として受入可能な程度に抑えなければならない。", "a": false, "c": "R７Ⅰ⑩ア／R５Ⅱ⑩ア", "e": "引っかけに注意。限定的保証業務では，保証業務リスクの水準が合理的保証業務の場合よりも高くなる。"}, {"l": 15, "m": "財務情報等に係る保証業務の概念的枠組み", "sb": "", "i": "A", "r": "", "q": "業務実施者は，主題に責任を負う者が想定利用者へ主題情報を提示していない場合，保証報告書において，直接に当該主題について積極的形式又は消極的形式によって結論を報告することが求められている。", "a": true, "c": "R５Ⅱ⑩エ／H30Ⅱ⑩エ", "e": "ダイレクト・レポーティングにおいても，積極的形式又は消極的形式により結論を報告する。"}, {"l": 16, "m": "財務情報等に係る保証業務の概念的枠組み", "sb": "", "i": "A", "r": "", "q": "主題に責任を負う者によって主題情報が想定利用者に提示されず，公認会計士が主題に対する結論を報告する場合，公認会計士は，すべての重要な点において，一定の規準に照らして適正性や有効性等がないと考えられるような事項が発見されなかったかを報告する消極的形式を採用しなければならない。", "a": false, "c": "H27Ⅰ⑨イ／H24Ⅰ⑧ウ", "e": "同上"}, {"l": 17, "m": "財務情報等に係る保証業務の概念的枠組み", "sb": "", "i": "A", "r": "", "q": "業務実施者が，合理的保証業務ではなく，限定的保証業務を実施する場合に，自らが実施すべき手続，実施の時期及び範囲の決定についての責任を負わないことがある。", "a": false, "c": "H30Ⅱ⑩イ", "e": "業務実施者は，限定的保証業務の場合も，自らが実施すべき手続，実施の時期及び範囲の決定について責任を負う。"}, {"l": 18, "m": "財務情報等に係る保証業務の概念的枠組み", "sb": "", "i": "A", "r": "", "q": "主題情報が想定利用者に提示されない保証業務の場合，業務実施者は，経営者との間で合意された検証手続を実施することができる。", "a": false, "c": "H23Ⅱ⑥ウ", "e": "ダイレクト・レポーティングの場合も，上記と同様。"}, {"l": 19, "m": "財務情報等に係る保証業務の概念的枠組み", "sb": "", "i": "A", "r": "", "q": "業務実施者は，主題に責任を負う者になることができないが，主題の評価者又は測定者になることがある。", "a": true, "c": "R４Ⅰ⑩ア", "e": "ダイレクト・レポーティングの場合，業務実施者が主題の評価者又は測定者となる。"}, {"l": 20, "m": "財務情報等に係る保証業務の概念的枠組み", "sb": "", "i": "A", "r": "", "q": "業務実施者は，自らが主題に責任を負う者及び想定利用者となることはできない。また，主題に責任を負う者は，想定利用者となることはできるが唯一の利用者となることはできない。", "a": true, "c": "R６Ⅰ⑦イ／R７Ⅰ⑩エ／H30Ⅱ⑩ア／H29Ⅱ⑩ウ／H28Ⅱ⑩エ", "e": ""}, {"l": 21, "m": "財務情報等に係る保証業務の概念的枠組み", "sb": "", "i": "A", "r": "", "q": "保証業務において，主題に責任を負う者が当該保証業務の契約当事者とならない場合においても，当該主題に責任を負う者は，当該保証業務に係る保証報告書の想定利用者となることができる。", "a": true, "c": "H24Ⅰ⑧ア", "e": "主題に責任を負う者は，想定利用者の一人となることはできる。"}, {"l": 22, "m": "財務情報等に係る保証業務の概念的枠組み", "sb": "", "i": "A", "r": "", "q": "業務実施者は，保証業務を受託するに当たり，保証業務における主題が適切であるかどうかを判断する。この判断は，当該業務が合理的保証業務か限定的保証業務であるかにより影響を受ける。", "a": false, "c": "R２Ⅰ⑩エ", "e": "主題の適切性は，識別可能であるか，一定の規準に基づいて首尾一貫した評価・測定を行うことができるか，業務実施者が主題情報について十分かつ適切な証拠を収集することができるかによって評価されるものであり，保証水準の影響を受けない。"}, {"l": 23, "m": "財務情報等に係る保証業務の概念的枠組み", "sb": "", "i": "A", "r": "", "q": "定量的か定性的か，客観的か主観的か，といった主題の性格は，公認会計士が主題情報についての保証を得る際の正確性及び入手可能な証拠の説得力に影響するため，保証報告書にはこうした主題の性格について記載することが必要である。", "a": true, "c": "H27Ⅰ⑨ウ／R６Ⅰ⑦ウ／R３⑩イ／H25Ⅰ⑦オ／H24Ⅰ⑧エ", "e": ""}, {"l": 24, "m": "財務情報等に係る保証業務の概念的枠組み", "sb": "", "i": "A", "r": "", "q": "業務実施者が，自らの期待，判断及び個人的な経験を保証業務に適合する一定の規準として用いることは適切ではない。", "a": true, "c": "R６Ⅰ⑦エ", "e": ""}, {"l": 25, "m": "財務情報等に係る保証業務の概念的枠組み", "sb": "", "i": "A", "r": "", "q": "主題に対して確立された規準が存在しないため，主題に責任を負う者が個別に規準を策定したが，当該規準に規準の適合性があると業務実施者が判断できない場合，業務実施者は保証報告書において当該規準を明示する。", "a": false, "c": "R４Ⅰ⑩エ", "e": "業務実施者が規準の適合性を判断できない場合は，そもそも保証業務の前提を満たしていないと考えられるため，保証業務が成立し得るかのような本肢の内容は誤りとなる。"}, {"l": 26, "m": "財務情報等に係る保証業務の概念的枠組み", "sb": "", "i": "A", "r": "", "q": "保証業務には，主題に責任を負う者が主題情報の内容及び範囲を決定できるものがある。", "a": true, "c": "R４Ⅰ⑩ウ", "e": "主題情報の内容及び範囲は，適合する規準によって決定される。この点，主題に責任を負う者が適合する規準を個別に設定する場合には，結果的に，主題に責任を負う者が主題情報の内容及び範囲を決定することとなる。"}, {"l": 27, "m": "財務情報等に係る保証業務の概念的枠組み", "sb": "", "i": "A", "r": "", "q": "保証業務における規準の適合性は，規準が目的適合性，完全性，信頼性，中立性及び理解可能性を備えていることを要件とし，業務の状況との関連で業務実施者により評価される。この評価は，保証業務リスクの水準によって影響を受ける。", "a": false, "c": "R３⑩ウ", "e": "保証業務リスクの水準（合理的保証業務or限定的保証業務）は，ある規準が適合するか否かの評価に影響しない。"}, {"l": 28, "m": "財務情報等に係る保証業務の概念的枠組み", "sb": "", "i": "A", "r": "", "q": "保証業務における規準は，保証報告書の想定利用者にも利用可能であることが求められている。", "a": true, "c": "R２Ⅰ⑩イ", "e": ""}, {"l": 29, "m": "財務情報等に係る保証業務の概念的枠組み", "sb": "", "i": "A", "r": "", "q": "保証業務の規準は，想定利用者にとって利用可能であることが求められるため，業務実施者は，特定の想定利用者にのみ利用可能であるような規準によって保証業務を行う場合，想定利用者を制限する旨を保証報告書に記載しなければならない。", "a": true, "c": "H31Ⅱ⑩イ", "e": ""}, {"l": 30, "m": "財務情報等に係る保証業務の概念的枠組み", "sb": "", "i": "A", "r": "", "q": "業務実施者は，保証業務に利用する規準が特定の利用者にのみ利用可能な場合には，保証報告書において積極的形式による結論を報告してはならない。", "a": false, "c": "H28Ⅱ⑩イ／H24Ⅰ⑧イ", "e": "本肢の場合でも，積極的形式による結論を報告することができる（特別目的の財務諸表の監査等）。"}, {"l": 31, "m": "財務情報等に係る保証業務の概念的枠組み", "sb": "", "i": "A", "r": "", "q": "業務実施者は，証拠の量的な十分性及び目的適合性や信頼性等の質的な適切性を勘案して，必要とされる証拠を入手しなければならないが，より多くの証拠を入手することにより，証拠の質を補完することがある。", "a": false, "c": "R６Ⅱ⑩ウ", "e": "疑義問。たしかに，意見書では，「単に証拠の入手量を増やすことにより質的な適切性を補うことはできない」とされているが，これは「常に補えるわけではない」ことを意味するもののはずであり，矛盾する。また，監基報５００にある「監査証拠の十分性と適切性は，相互に関連する」旨の規定とも矛盾する。"}, {"l": 32, "m": "財務情報等に係る保証業務の概念的枠組み", "sb": "", "i": "A", "r": "", "q": "業務実施者は，限定的保証業務であるレビューにおいて，主に分析的手続及び質問によって，十分かつ適切な証拠を得ることができる。そのため，当該業務においては，主題及び業務環境の理解を含む相互に関連性のある系統だった業務プロセスを必要としない。", "a": false, "c": "R６Ⅱ⑩エ", "e": "限定的保証業務でも，合理的保証業務と同様に，主題及び業務環境の理解を含む相互に関連性のある系統だった業務プロセスが必要となる。"}, {"l": 33, "m": "財務情報等に係る保証業務の概念的枠組み", "sb": "", "i": "A", "r": "", "q": "合理的保証業務及び限定的保証業務のいずれにおいても，業務実施者は，内部統制を含む業務環境を理解することが求められる。", "a": true, "c": "R５Ⅰ⑩エ", "e": ""}, {"l": 34, "m": "財務情報等に係る保証業務の概念的枠組み", "sb": "", "i": "A", "r": "", "q": "業務実施者は，保証業務において，手続の適用を通じて十分かつ適切な証拠の収集が求められるが，財務情報のレビューを行う場合，主に合意された手続によって，レビューにおいて求められる十分かつ適切な証拠を得ることになる。", "a": false, "c": "R５Ⅱ⑩ウ", "e": "レビューにおいて，非保証業務である合意された手続を実施してはならない。👉講義レジュメ⑦-1-15"}, {"l": 35, "m": "財務情報等に係る保証業務の概念的枠組み", "sb": "", "i": "A", "r": "", "q": "実施される保証業務が合理的保証業務か限定的保証業務かの区別は，業務実施者が保証業務リスクの構成要素である固有リスクや統制リスクを検討する程度に影響を与える。", "a": true, "c": "R７Ⅰ⑩ウ／R２Ⅰ⑩ウ／H27Ⅰ⑨ア", "e": ""}, {"l": 36, "m": "財務情報等に係る保証業務の概念的枠組み", "sb": "", "i": "A", "r": "", "q": "財務諸表監査以外の保証業務も，財務諸表監査と同様にリスク・アプローチに基づいて実施されるが，主題及び主題情報が特定されているとは限らないため，固有リスクと統制リスクを結合して評価することは想定されていない。", "a": false, "c": "H25Ⅰ⑦エ／R６Ⅰ⑦ア", "e": "保証業務は，特定された主題及び主題情報に対して行う。また，保証業務における固有リスクと統制リスクは，個別に又は結合して評価する。"}, {"l": 37, "m": "財務情報等に係る保証業務の概念的枠組み", "sb": "", "i": "A", "r": "", "q": "業務実施者が，合理的保証業務と限定的保証業務を依頼人に対して同時に提供する場合には，それぞれの保証報告書における結論は同一の形式で報告される。", "a": false, "c": "H25Ⅰ⑦ア", "e": "合理的保証業務又は限定的保証業務の区別が明確に理解されるように記載する必要があるため，本肢の各保証報告書における結論は，それぞれ異なる形式で報告される。"}, {"l": 38, "m": "財務情報等に係る保証業務の概念的枠組み", "sb": "", "i": "A", "r": "", "q": "保証業務において，すべての重要な点において主題又は主題情報の適正性又は有効性が認められるかどうかについての結論を報告することがある。", "a": true, "c": "H23Ⅱ⑥エ", "e": "なお，本肢は，合理的保証業務に関する記述である。"}, {"l": 39, "m": "財務情報等に係る保証業務の概念的枠組み", "sb": "", "i": "A", "r": "", "q": "業務実施者は，限定的保証業務を行う場合，保証業務の対象について，全ての重要な点において，一定の規準に照らして適正性や有効性等がないと考えられるような事項が発見されなかったかどうかを示す消極的形式によって結論を報告する。", "a": true, "c": "R５Ⅱ⑩イ", "e": ""}, {"l": 40, "m": "財務情報等に係る保証業務の概念的枠組み", "sb": "", "i": "A", "r": "", "q": "業務実施者は，会社側が証拠の提出を拒んだことによって検証手続が制約された場合には，主題又は主題情報が適正でない又は有効でないことを理由とした限定付の結論を報告しなければならない。", "a": false, "c": "H23Ⅱ⑥オ", "e": "本肢のケースは業務範囲の制約に当たるため，限定付の結論又は結論を表明しないことを検討することになる。"}, {"l": 41, "m": "財務情報等に係る保証業務の概念的枠組み", "sb": "", "i": "A", "r": "", "q": "保証業務の規準は，目的適合性，完全性，信頼性，中立性及び理解可能性の要件を満たすことが要求されるが，保証業務の受託後，これらのうち一部の要件を満たさないことが明らかになった場合，業務実施者は，当該業務の継続の可否や結論への影響を検討しなければならない。", "a": true, "c": "H31Ⅱ⑩ウ／H29Ⅱ⑩ア", "e": ""}, {"l": 42, "m": "財務情報等に係る保証業務の概念的枠組み", "sb": "", "i": "A", "r": "", "q": "公認会計士が，主題に責任を負う者との間で合意された手続に基づいて発見した事項のみを報告する業務は，そこでいかなる結論も報告されず，いかなる保証も提供されないため保証業務ではない。", "a": true, "c": "H27Ⅰ⑨エ", "e": ""}, {"l": 43, "m": "財務情報等に係る保証業務の概念的枠組み", "sb": "", "i": "A", "r": "", "q": "限定的保証業務に分類される業務には，業務実施者が，主題に責任を負う者又は特定の利用者との間で合意された手続に基づき発見した事項のみを報告する業務が含まれる。", "a": false, "c": "R５Ⅰ⑩イ", "e": "合意された手続に基づき発見した事項のみを報告する業務は，そもそも保証業務ではない。"}, {"l": 44, "m": "財務情報等に係る保証業務の概念的枠組み", "sb": "", "i": "A", "r": "", "q": "合意された手続を保証業務としない主たる理由は，合意された手続が，主題に責任を負う者のみの利用又は利益のために行われる業務であり，主題に責任を負う者が唯一の利用者となるためである。", "a": false, "c": "H31Ⅱ⑩ア", "e": "合意された手続を保証業務としない主たる理由は，業務実施者が自らの判断により証拠を入手しないこと，及び，手続の結果のみが報告され結論が報告されないことにある。なお，本肢が示している理由は，コンサルティング業務が保証業務に該当しないことの理由である。"}, {"l": 45, "m": "財務情報等に係る保証業務の概念的枠組み", "sb": "", "i": "A", "r": "", "q": "二重責任の原則は，保証業務を実施する場合に適用されるものであり，合意された手続のような保証業務に該当しない業務には，適用されない。", "a": true, "c": "H31Ⅱ②エ／H24Ⅱ①オ", "e": ""}, {"l": 46, "m": "財務情報等に係る保証業務の概念的枠組み", "sb": "", "i": "A", "r": "", "q": "保証業務の範疇に入らない業務としては，合意された手続，財務諸表等の調製，経営又は税務上の判断に関する助言や調査，財務情報のレビュー業務があげられる。", "a": false, "c": "H25Ⅰ⑦イ", "e": "本肢で列挙している業務のうち，財務情報のレビュー業務は保証業務である。"}, {"l": 47, "m": "期中レビュー", "sb": "", "i": "A", "r": "", "q": "適正性に関する期中レビューは，期中財務諸表が適正に表示されていないと信じさせる事項が全ての重要な点において認められなかったかどうかに関する結論の表明を目的として実施されるため，年度監査と同程度の信頼性を保証するものではない。", "a": true, "c": "R５Ⅰ⑫イ／H29Ⅰ⑥ア", "e": ""}, {"l": 48, "m": "期中レビュー", "sb": "", "i": "A", "r": "", "q": "適正性に関する期中レビューは限定的保証業務であるため，全ての重要な点において，一定の規準に照らして適正性がないと考えられるような事項が発見されなかったかどうかを報告する，消極的形式によって結論が表明される。", "a": true, "c": "R４Ⅱ⑧ウ", "e": ""}, {"l": 49, "m": "期中レビュー", "sb": "", "i": "A", "r": "", "q": "「期中レビュー基準」は，金融商品取引法の下で開示される期中財務諸表について，年度の財務諸表の監査を実施する監査人が行う期中レビューの基準であり，監査基準と同様，「期中レビューの目的」，「一般基準」，「実施基準」，「報告基準」の四つの区分から構成されている。", "a": false, "c": "H29Ⅱ⑦ア", "e": "「期中レビュー基準」において，一般基準は定められていない。"}, {"l": 50, "m": "期中レビュー", "sb": "", "i": "A", "r": "", "q": "監査人が期中レビュー手続を行うに当たり，期中レビュー基準の他に，監査人が備えるべき要件及び監査に対する姿勢について定めている監査基準の一般基準及び監査に関する品質管理基準が適用される。", "a": true, "c": "H31Ⅰ⑪イ／H28Ⅱ⑫ア／H26Ⅰ⑦イ", "e": ""}, {"l": 51, "m": "期中レビュー", "sb": "", "i": "A", "r": "", "q": "監査人は，期中レビューにおいて，年度の財務諸表監査において監査人が備えるべき要件及び監査に対する姿勢について定めている「監査基準」の一般基準，「監査における不正リスク対応基準」，及び「監査に関する品質管理基準」を適用しなければならない。", "a": false, "c": "H27Ⅱ⑦ウ", "e": "「監査における不正リスク対応基準」は，期中レビューに適用されない。"}, {"l": 52, "m": "期中レビュー", "sb": "", "i": "A", "r": "", "q": "期中レビューにおける保証水準は，年度の財務諸表の監査より低く設定されているが，監査人は，年度の財務諸表の監査と同様に，期中レビューにおいても職業的専門家としての正当な注意を払い，職業的懐疑心を保持しなければならない。", "a": true, "c": "H27Ⅰ⑤イ", "e": ""}, {"l": 53, "m": "期中レビュー", "sb": "", "i": "A", "r": "", "q": "期中レビューにおいて監査人が要求される保証水準は財務諸表監査よりも低いため，職業的懐疑心の発揮の程度は，財務諸表監査のそれよりも低くなる。", "a": false, "c": "H31Ⅰ⑧ア", "e": "正誤判断が悩ましい肢。本肢を誤りとする根拠は，期中レビュー基準の設定前文において，期中レビューでも「年度監査と同様に」職業的懐疑心を保持するべき旨が明記されている点にある。しかし，例えば，期中レビューでは，年度監査のように質問の回答を裏付ける証拠の入手が求められていない点などを勘案すれば，期中レビューにおける職業的懐疑心の発揮の程度は，年度監査のそれよりも低くなると考えることもできる。"}, {"l": 54, "m": "期中レビュー", "sb": "", "i": "B", "r": "", "q": "年度の財務諸表の監査にとって重要と考えられる取引や非経常的な取引の検証は，当該取引が発生した期中会計期間における期中レビューにおいでではなく，期末における年度の財務諸表の監査において行われなければならない。", "a": false, "c": "H24Ⅱ⑨ウ", "e": "本肢のような検証は，年度監査の実効性を向上させる観点から，当該取引が発生した期中会計期間における期中レビュー手続と同時期に実施することが望ましい。"}, {"l": 55, "m": "期中レビュー", "sb": "", "i": "A", "r": "", "q": "期中レビュー契約の締結に当たっては，年度監査の契約と異なり，監査事務所の方針及び手続に従って，適切な期中レビューが実施できるかどうかを検討することまでは求められていない。", "a": false, "c": "H31Ⅱ⑦イ", "e": "期中レビュー契約の締結においても，年度監査の契約と同様に，監査事務所の方針及び手続に従って，適切な期中レビューが実施できるかどうかを検討する必要がある。"}, {"l": 56, "m": "期中レビュー", "sb": "", "i": "A", "r": "", "q": "監査人は，期中レビューに係る結論の表明に先立ち，審査を受けなければならないが，当該審査は，監査に関する品質管理の基準に基づいて定められた方針と手続に従わなければならない。", "a": true, "c": "R４Ⅱ⑨イ", "e": ""}, {"l": 57, "m": "期中レビュー", "sb": "", "i": "A", "r": "", "q": "期中レビューでは，監査に関する品質管理基準に従って，期中レビュー業務の質を合理的に確保することが求められる。具体的には，契約の新規の締結及び更新，業務の実施等について，品質管理の方針及び手続を定め，これに従わなければならないが，開示の適時性の要請を考慮し，審査の省略が認められている。", "a": false, "c": "H25Ⅱ⑨エ", "e": "例えば，上場会社の中間財務諸表に対して行われる期中レビューの場合，結論形成の適切性の確認は必ず審査によらなければならず，他の方法によることは認められない。"}, {"l": 58, "m": "期中レビュー", "sb": "", "i": "A", "r": "", "q": "監査人は，結論の表明に先立ち審査を受けなければならないが，監査事務所は，期中レビュー業務の品質が合理的に確保される範囲において，期中レビュー業務に係る審査の方法，内容等を柔軟に定めることができる。", "a": true, "c": "H30Ⅱ⑦エ／H23Ⅱ⑧エ", "e": ""}, {"l": 59, "m": "期中レビュー", "sb": "", "i": "A", "r": "", "q": "期中レビューは，年度の財務諸表の監査を前提として実施されることから，期中レビューに関する調書のファイルは年度監査の監査ファイルと同一のファイルによって整理されなければならない。", "a": false, "c": "H23Ⅱ⑧オ", "e": "期中レビューに関する調書のファイルと，年度監査の監査ファイルを一つのファイルに整理することはできない。"}, {"l": 60, "m": "期中レビュー", "sb": "", "i": "A", "r": "", "q": "期中レビューは年度の財務諸表の監査を前提として実施されるものであるので，期中レビュー終了後に監査人が交代した場合には，後任の監査人は，前任監査人が策定した計画に従って年度の監査計画を策定しなければならない。", "a": false, "c": "H26Ⅰ⑦ウ", "e": "本肢のような場合でも，後任監査人は，年度の監査計画を「自ら」策定する。"}, {"l": 61, "m": "期中レビュー", "sb": "", "i": "A", "r": "", "q": "期中レビュー手続では，一般に，年度監査で実施されるような詳細なリスク評価は実施されないが，年度監査と組み合わせて実施されることにより，年度監査により得られたリスク評価の情報が期中レビューに反映され，期中レビューの結論が得られることになる。", "a": true, "c": "H31Ⅱ⑦ア", "e": ""}, {"l": 62, "m": "期中レビュー", "sb": "", "i": "A", "r": "", "q": "監査人は，年度の財務諸表の監査において得た企業及び企業環境の理解等を考慮して期中レビュー計画を策定し，これに基づき，質問，分析的手続その他の期中レビュー手続を実施しなければならない。", "a": true, "c": "H30Ⅱ⑦イ", "e": ""}, {"l": 63, "m": "期中レビュー", "sb": "", "i": "A", "r": "", "q": "期中レビューにおいては，財務諸表全体レベルとアサーション・レベルの双方において，年度の財務諸表の監査における重要な虚偽表示のリスクの評価を考慮するが，特別な検討を必要とするリスクについてはその評価を考慮する必要はない。", "a": false, "c": "H24Ⅱ⑨エ", "e": "期中レビューにおいては，年度監査で決定した特別な検討を必要とするリスクも考慮する。"}, {"l": 64, "m": "期中レビュー", "sb": "", "i": "A", "r": "", "q": "監査人は，期中レビュー計画の策定に当たっては，年度の財務諸表監査を通じて得た，内部統制を含む，企業及び企業環境についての理解と，それに基づく重要な虚偽表示のリスクの評価を考慮し，期中財務諸表の作成に係る内部統制を十分に理解しておかなければならない。", "a": true, "c": "H25Ⅰ③ウ／R４Ⅱ⑧ア", "e": ""}, {"l": 65, "m": "期中レビュー", "sb": "", "i": "A", "r": "", "q": "期中レビューにおける内部統制の評価範囲は，年度の財務諸表の監査における内部統制の評価範囲とは異なる場合がある。", "a": true, "c": "H24Ⅱ⑨オ", "e": ""}, {"l": 66, "m": "期中レビュー", "sb": "", "i": "A", "r": "", "q": "期中レビューは，年度の財務諸表の監査と監査人が得る保証水準が異なるため，期中レビュー計画は，同一の監査人であっても，年度の財務諸表の監査計画とは独立して策定されなければならない。", "a": false, "c": "R４Ⅰ⑦ウ／R２Ⅰ⑥ア／H28Ⅱ⑥ア／H24Ⅰ②イ", "e": "期中レビュー計画は，年度監査の監査計画の一環として策定することができる。"}, {"l": 67, "m": "期中レビュー", "sb": "", "i": "A", "r": "", "q": "監査人は，期中レビュー計画の内容を事業年度の途中で修正することはない。", "a": false, "c": "H30Ⅱ⑦ア", "e": "期中レビュー計画も，年度の財務諸表の監査計画と同様に連続的，反復的なプロセスであるため，必要に応じて，見直し，修正される。"}, {"l": 68, "m": "期中レビュー", "sb": "", "i": "A", "r": "", "q": "期中レビューに係る重要性の基準値は，年度の財務諸表監査に係る重要性の基準値を超えてはならない。", "a": true, "c": "R２Ⅱ⑧イ／H27Ⅰ⑦エ／H24Ⅰ②ウ", "e": ""}, {"l": 69, "m": "期中レビュー", "sb": "", "i": "A", "r": "", "q": "期中レビューを実施するに当たって設定する重要性の基準値は，年度監査に係る重要性の基準値を適用することが合理的であるが，少なくとも年度監査に係る重要性の基準値を上限とするべきとされるのは，期中財務諸表の実績数値が通年の財務諸表における数値よりも小さいこと等によるものである。", "a": true, "c": "H31Ⅱ⑦ウ", "e": ""}, {"l": 70, "m": "期中レビュー", "sb": "", "i": "A", "r": "", "q": "適正性に関する期中レビューの目的は，期中財務諸表の適正性に関する消極的形式による結論の表明にあり，監査人の行う質問，分析的手続その他の期中レビュー手続は，監査人の結論の基礎を与えるものでなければならない。", "a": true, "c": "H24Ⅰ②ア", "e": ""}, {"l": 71, "m": "期中レビュー", "sb": "", "i": "A", "r": "", "q": "期中レビュー手続は，質問及び分析的手続を中心とした限定的な証拠の収集手段であり，期中レビューの目的を達成する観点から，また期中レビューの効率的実施の観点から，実査，立会，確認を実施することは認められていない。", "a": false, "c": "H28Ⅰ⑩ウ", "e": "期中レビューにおいて，実査，立会，確認は，要求されていないだけであり，禁止されているわけではない。"}, {"l": 72, "m": "期中レビュー", "sb": "", "i": "A", "r": "", "q": "期中レビューにおいては，年度の財務諸表監査と同様に，レビュー対象会社の内部統制を理解しなければならないが，内部統制の運用状況の有効性を評価することは要求されていない。", "a": true, "c": "H28Ⅰ⑩イ", "e": ""}, {"l": 73, "m": "期中レビュー", "sb": "", "i": "A", "r": "", "q": "監査人は，期中財務諸表が，年度の財務諸表の作成の基礎となる会計記録に基づいて作成されていることを確かめなければならない。このため監査人は，期中財務諸表と会計帳簿等の会計記録との突合により確認する。", "a": true, "c": "H30Ⅰ⑥ア／R３⑥ア／H26Ⅰ⑦エ", "e": ""}, {"l": 74, "m": "期中レビュー", "sb": "", "i": "A", "r": "", "q": "監査人は，期中財務諸表が，年度の財務諸表の作成の基礎となる会計記録に基づいて作成されていることを確かめるため，期中財務諸表と当該会計記録との突合を行い，両者が一致又は調整後一致することを確認するとともに，当該会計記録の適正性について証拠を入手しなければならない。", "a": false, "c": "H27Ⅰ⑦ア", "e": "期中財務諸表が，年度の財務諸表の作成の基礎となる会計記録に基づいて作成されていることの確認は，会計記録の適正性に関する証拠の入手を意図するものではない。"}, {"l": 75, "m": "期中レビュー", "sb": "", "i": "A", "r": "", "q": "期中レビュー基準において監査人は，質問に対する回答が合理的である場合には，当該回答を裏付ける証拠の入手は要求されない。", "a": true, "c": "H31Ⅰ⑧イ", "e": ""}, {"l": 76, "m": "期中レビュー", "sb": "", "i": "A", "r": "", "q": "分析的手続は財務数値間又は財務数値と非財務数値間の関係を確かめるための手続であり，期中レビュー手続として実施する分析的手続と，年度の財務諸表の監査における分析的手続とでは特段異なる手法を用いるものではない。", "a": true, "c": "H29Ⅱ⑦ウ", "e": ""}, {"l": 77, "m": "期中レビュー", "sb": "", "i": "A", "r": "", "q": "期中レビューは，財務諸表には全体として重要な虚偽の表示がないということについて合理的な保証を得るために実施される年度の財務諸表の監査と同様の保証を得ることを目的とするものではないことから，期中レビューにおける分析的手続の実施は，業種の特性等を吟味したきめ細かなレベルにまで至ることは要求されていない。", "a": false, "c": "R３⑥イ／H25Ⅰ③イ", "e": "期中レビューでは，業種の特性等を吟味したきめ細かな分析的手続が要求される。"}, {"l": 78, "m": "期中レビュー", "sb": "", "i": "A", "r": "", "q": "期中レビューにおいては，実証手続としての分析的手続を，業種の特性等を踏まえてきめ細やかに実施しなければならないが，年度の財務諸表監査に比べて精度の高い推定値を算出することは求められていない。", "a": false, "c": "H27Ⅰ⑦ウ／H25Ⅰ③ア", "e": "期中レビューでは，実証手続としての分析的手続（分析的実証手続）の実施は要求されない。"}, {"l": 79, "m": "期中レビュー", "sb": "", "i": "A", "r": "", "q": "期中レビューでは，監査人は，財務数値間の関係，あるいは財務数値と非財務数値の間の関係を確かめるために設計された分析的手続を業種の特性を踏まえて実施し，異常な変動が認められた場合には，追加的な質問を実施して，その原因を確かめなければならない。", "a": true, "c": "H28Ⅱ⑥イ", "e": ""}, {"l": 80, "m": "期中レビュー", "sb": "", "i": "A", "r": "", "q": "監査人は，期中レビューの過程で気づいた数値間の矛盾又は異常な変動についての質問に対する回答が合理的かつ整合的であると判断した場合には，その回答を裏付けるための証憑突合を実施することは求められていない。", "a": true, "c": "H27Ⅰ⑦イ", "e": ""}, {"l": 81, "m": "期中レビュー", "sb": "", "i": "A", "r": "", "q": "監査人は，分析的手続を実施した結果，財務変動に係る矛盾又は異常な変動に気付いた場合，適切な者に対して質問を実施するとともに，証憑突合によりその回答の合理性を確かめなければならない。", "a": false, "c": "R４Ⅱ⑧イ／H24Ⅱ⑨ア", "e": "上記の問題を参照"}, {"l": 82, "m": "期中レビュー", "sb": "", "i": "A", "r": "", "q": "期中レビューにおいて分析的手続を実施した結果，財務変動に係る矛盾又は異常な変動に気付いた場合には，監査人は関係書類の閲覧を実施してその原因を確認しなければならない。", "a": false, "c": "H31Ⅰ⑧ウ", "e": "本肢の場合，監査人は，矛盾や異常な変動の原因を確かめるために追加的な質問を実施しなければならないが，関係書類の閲覧の実施までは要求されていない。"}, {"l": 83, "m": "期中レビュー", "sb": "", "i": "A", "r": "", "q": "監査人は，期中財務諸表について，質問及び分析的手続を実施した結果，重要な点において適正に表示していない事項が存在する可能性が高いと認めた場合には，追加的な質問や関係書類の閲覧等の適切な追加的手続を実施しなければならない。", "a": true, "c": "H29Ⅱ⑦イ", "e": ""}, {"l": 84, "m": "期中レビュー", "sb": "", "i": "A", "r": "", "q": "監査人は，期中財務諸表について，企業の財政状態，経営成績及びキャッシュ・フローの状況を重要な点において適正に表示していない事項が存在する可能性が高いと認められる場合には，追加的な手続として実証手続を実施しなければならない。", "a": false, "c": "R４Ⅰ⑦ア／R３⑥ウ／H25Ⅰ③オ", "e": "追加的な手続として，実証手続（分析的実証手続を含む）を実施する必要はない。"}, {"l": 85, "m": "期中レビュー", "sb": "", "i": "A", "r": "", "q": "監査人は，期中レビューの当初の計画において，期中財務諸表に，企業の財政状態，経営成績及びキャッシュ・フローの状況を重要な点において適正に表示していない事項が存在する可能性を勘案した，追加的な手続の実施を織り込まなければならない。", "a": false, "c": "R２Ⅱ⑧ア", "e": "追加的な手続は，期中レビュー手続の実施の過程において識別された（生じた）事項に対して実施するものであるため，当初の計画に織り込むことは難しい。"}, {"l": 86, "m": "期中レビュー", "sb": "", "i": "A", "r": "", "q": "期中レビュー手続において監査人は，期中財務諸表における会計上の見積りに対して，経営者が行った見積りの方法の評価，経営者の見積りと監査人が行った見積りの比較及び経営者の見積りと実績との比較等は要求されない。", "a": true, "c": "H31Ⅰ⑧エ", "e": "本肢の手続は，会計上の見積りに対して実施する実証手続である。"}, {"l": 87, "m": "期中レビュー", "sb": "", "i": "A", "r": "", "q": "期中レビュー契約書において，期中財務諸表の作成責任が経営者にあることを監査人と経営者との間で確認している旨が記載されている場合には，監査人は経営者確認書を入手する必要はない。", "a": false, "c": "H30Ⅰ⑥ウ", "e": "年度監査と同様に，期中レビューにおいても，経営者確認書を必ず入手しなければならない。"}, {"l": 88, "m": "期中レビュー", "sb": "", "i": "A", "r": "", "q": "期中レビューは，年度の財務諸表監査を前提として実施されるものであるため，年度の財務諸表監査における経営者確認書の入手をもって，期中レビューにおける経営者確認書の入手を省略することができる。", "a": false, "c": "H28Ⅰ⑩ア", "e": "同上"}, {"l": 89, "m": "期中レビュー", "sb": "", "i": "A", "r": "", "q": "期中レビューにおいては，質問及び分析的手続を基本とする限定した手続が適用され，適正に表示していない事項が存在する可能性が高いと認められる場合を除いて，経営者確認書の入手は求められていない。", "a": false, "c": "H27Ⅱ⑦イ／H25Ⅱ⑨ア", "e": "同上"}, {"l": 90, "m": "期中レビュー", "sb": "", "i": "A", "r": "", "q": "監査人は，期中レビューにおいて，他の監査人によって行われた期中レビューの結果を利用することができる。ただしこの場合には，監査人は当該他の監査人が関与した期中財務諸表の重要性及び他の監査人の品質管理の状況等に基づく信頼性の程度を勘案したうえで，その利用する程度及び方法を決定しなければならない。", "a": true, "c": "R４Ⅰ⑦イ／H23Ⅱ⑧ウ", "e": ""}, {"l": 91, "m": "期中レビュー", "sb": "", "i": "A", "r": "", "q": "監査人は，期中レビューにおいて，他の監査人によって行われた期中レビュー等の結果を利用することはあるが，専門家の業務や内部監査の結果を利用することはない。", "a": false, "c": "H30Ⅱ⑦ウ", "e": "年度監査と同様に，期中レビューにおいても，専門家の業務や内部監査の結果を利用することがある。"}, {"l": 92, "m": "期中レビュー", "sb": "", "i": "A", "r": "", "q": "期中レビューは年度の財務諸表の監査と同様の保証を得ることを目的とするものではないが，グループ監査において，監査人は年度監査における監査の作業を実施する構成単位の全てを期中レビュー手続を実施すべき構成単位としなければならない。", "a": false, "c": "H29Ⅱ⑦エ", "e": "監査人は，年度のグループ監査における監査の作業を実施する構成単位から，期中レビュー手続を実施すべき構成単位を決定する。したがって，期中レビュー手続を実施すべき構成単位の範囲は，年度監査における監査の作業を実施する構成単位の範囲よりも狭くなることがあり，同じとは限らない。"}, {"l": 93, "m": "期中レビュー", "sb": "", "i": "A", "r": "", "q": "監査人は，他の監査人によって行われた期中レビュー等の結果を利用する場合には，利用する程度及び方法を決定しなければならないが，その程度及び方法は年度の財務諸表監査と同一でなければならない。", "a": false, "c": "R２Ⅱ⑧ウ", "e": "同上"}, {"l": 94, "m": "期中レビュー", "sb": "", "i": "A", "r": "", "q": "期中財務諸表の監査証明は，一般に公正妥当と認められる監査に関する基準及び慣行に従って実施された期中レビューの結果に基づいて作成される期中レビュー報告書により行われる。", "a": true, "c": "H31Ⅰ④エ", "e": ""}, {"l": 95, "m": "期中レビュー", "sb": "", "i": "A", "r": "", "q": "監査人は，期中レビュー業務において質問及び分析的手続を基本とする限定した手続を適用しているため，無限定の結論を表明する場合であっても，期中レビュー報告書において，結論の表明の基礎となる証拠を入手したと判断した旨の記載は行わない。", "a": false, "c": "R２Ⅰ⑥ウ", "e": "結論の根拠区分において，結論の表明の基礎となる証拠を入手したと判断した旨が記載される。"}, {"l": 96, "m": "期中レビュー", "sb": "", "i": "A", "r": "", "q": "無限定の結論を表明する場合，監査人は，期中レビュー報告書において，期中レビューは質問，分析的手続その他の期中レビュー手続からなり，年度の財務諸表の監査に比べて限定的な手続からなることを記載しなければならない。", "a": true, "c": "H29Ⅰ⑥イ", "e": ""}, {"l": 97, "m": "期中レビュー", "sb": "", "i": "A", "r": "", "q": "中間監査報告書及び期中レビュー報告書上に記載すべき公認会計士又は監査法人の責任の内容について，中間監査及び期中レビューのそれぞれの目的は内部統制の有効性について意見を表明するものではないことを含む必要がある。", "a": false, "c": "R５Ⅰ④ア", "e": "非常に細かい肢。内部統制の有効性について意見を表明することが目的ではない旨の記載は，中間監査報告書では必要であるが，期中レビュー報告書では不要である。"}, {"l": 98, "m": "期中レビュー", "sb": "", "i": "A", "r": "", "q": "期中財務諸表において，企業の財政状態，経営成績及びキャッシュ・フローの状況を重要な点において適正に表示していないと信じさせる事項が認められる場合には，監査人は，期中レビュー報告書において，結論に関する除外事項を付した限定付結論又は否定的結論を表明し，その理由を記載しなければならない。", "a": true, "c": "R３⑥エ／H24Ⅰ②エ", "e": "本肢にある「その理由」は，それぞれの結論における根拠区分の記載事項を簡潔に表現したものとして読むこと。"}, {"l": 99, "m": "期中レビュー", "sb": "", "i": "A", "r": "", "q": "期中レビューでは，一般に公正妥当と認められる企業会計の基準に準拠していない会計処理が存在する場合，その影響が無限定の結論を表明できない程度に重要ではあるものの，期中財務諸表全体に対して否定的結論を表明するほどではないと判断したとき，監査人は，限定的結論を表明し，結論の根拠の区分に，修正すべき事項，当該事項が期中財務諸表に与える影響及びこれらを踏まえて除外事項を付した限定付結論とした理由を記載しなければならない。", "a": false, "c": "H28Ⅱ⑥エ", "e": "本肢の場合，期中財務諸表に与える影響の記載は「可能であれば」行うため，本肢は誤りとなる。"}, {"l": 100, "m": "期中レビュー", "sb": "", "i": "A", "r": "", "q": "監査人は，不適切な会計処理が存在する場合に，限定付結論を表明することがある。このとき，期中レビュー報告書において，結論の根拠の区分に，修正すべき事項と可能であれば当該事項が期中財務諸表に与える影響を記載するとともに，限定付結論とした理由についても記載しなければならない。", "a": true, "c": "R４Ⅱ⑧エ／H27Ⅱ⑦ア", "e": ""}, {"l": 101, "m": "期中レビュー", "sb": "", "i": "A", "r": "", "q": "監査人が期中レビューの結論を表明するに当たり，重要なレビュー手続を実施できず，かつレビュー範囲の制約が期中財務諸表全体に及ぶほど広範な場合には，監査人は結論を表明しない。", "a": true, "c": "H30Ⅰ⑥イ", "e": ""}, {"l": 102, "m": "期中レビュー", "sb": "", "i": "A", "r": "", "q": "監査人は，期中レビュー範囲の制約を受け，重要な期中レビュー手続を実施できない場合において，限定付結論を表明することがある。この場合には，結論の根拠の区分に，実施できなかった期中レビュー手続，当該事実が影響する事項及びこれらを踏まえて除外事項を付した限定付結論とした理由を記載しなければならない。", "a": true, "c": "R２Ⅱ⑧エ／H26Ⅱ⑦イ", "e": ""}, {"l": 103, "m": "期中レビュー", "sb": "", "i": "A", "r": "", "q": "監査人は，将来の帰結を予測し得ない重要な偶発事象が存在し，当該事象の期中財務諸表に与える影響が複合的かつ多岐にわたる場合，年度の財務諸表の監査ほど高い保証水準は求められないため，結論の不表明とはせずに限定付結論としなければならない。", "a": false, "c": "H26Ⅱ⑦ウ／H24Ⅰ②オ", "e": "本肢の場合，監査人は，結論を表明できるか否かを検討するのであって，限定付結論を表明するわけではない。"}, {"l": 104, "m": "期中レビュー", "sb": "", "i": "A", "r": "", "q": "期中レビューでは，監査人は，後発事象の検討に際し，経営者に今後の発生可能性も含めて訴訟事件の有無に関する質問を実施した上で，顧問弁護士から確認状を入手しなければならない。", "a": false, "c": "H28Ⅱ⑥ウ／H23Ⅱ⑧ア", "e": "期中レビューでは，顧問弁護士に対する確認の実施は求められない。"}, {"l": 105, "m": "期中レビュー", "sb": "", "i": "A", "r": "", "q": "監査人は，継続企業の前提に関して経営者が行った評価の検討に当たって，経営者の評価期間と同じ期間を対象としなければならない。年度決算の監査においては，その期間は監査の対象となった事業年度末から翌事業年度末までであるが，期中レビューにおいては，どのような場合であっても，この期間は期中レビューの対象となった期中会計期間末から翌期中会計期間末までとなる。", "a": false, "c": "H30Ⅰ⑰イ", "e": "期中レビューでは，前事業年度末からの状況の変化の有無等により，監査人が検討する経営者の評価期間は異なるため，本肢は誤りとなる。"}, {"l": 106, "m": "期中レビュー", "sb": "", "i": "A", "r": "", "q": "監査人は，前事業年度の決算日において，継続企業の前提に重要な不確実性が認められなかったが，当期中会計期間において初めて継続企業の前提に重要な疑義を生じさせる事象又は状況が認められた場合には，経営者の対応策について監査人が検討対象とする期間は，少なくとも当期中会計期間が属する事業年度の末日までである。", "a": true, "c": "R２Ⅰ⑥イ", "e": ""}, {"l": 107, "m": "期中レビュー", "sb": "", "i": "A", "r": "", "q": "監査人は，前事業年度の決算日において，継続企業の前提に重要な疑義を生じさせる事象又は状況が存在していなかったが，当期中会計期間に継続企業の前提に重要な疑義を生じさせるような事象又は状況を認めた場合には，当期中会計期間の末日から１年間の当該事象又は状況に関する経営者の評価及び対応策について検討しなければならない。", "a": false, "c": "H31Ⅱ⑦エ", "e": "本肢は状況Ｂの記述であるため，監査人が検討する対応策の期間は６ヶ月（当期中会計期間の事業年度の末日まで）である。なお，評価の検討期間に関する記述は正しい。"}, {"l": 108, "m": "期中レビュー", "sb": "", "i": "A", "r": "", "q": "前事業年度の決算日における継続企業の前提に重要な疑義を生じさせる事象又は状況に大きな変化がある場合には，監査人は，少なくとも当期中会計期間末から翌期中会計期間末までの継続企業の前提に関する事項について検討しなければならない。", "a": false, "c": "H29Ⅰ⑥ウ", "e": "本肢は状況Ｂの記述であるため，監査人が検討する経営者の評価期間は１年間，対応策の期間は６ヶ月（当期中会計期間の事業年度の末日まで）である。"}, {"l": 109, "m": "期中レビュー", "sb": "", "i": "A", "r": "", "q": "監査人は，期中会計期間に継続企業の前提に重要な疑義を生じさせるような事象又は状況を認めた場合においては，当期中会計期間の末日から当該事業年度の末日までの期間についての経営者の行った評価及び経営者の対応策を検討した上で，継続企業の前提に関する重要な不確実性が認められるかどうかの判断をしなければならない。", "a": false, "c": "H25Ⅰ③エ", "e": "本肢は状況Ｂの記述であるため，監査人が検討する経営者の評価期間は１年間となる。なお，対応策の検討期間に関する記述は正しい。"}, {"l": 110, "m": "期中レビュー", "sb": "", "i": "A", "r": "", "q": "監査人は，期中財務諸表に継続企業の前提に関する事項について注記がなされた場合であっても，期中レビュー報告書に無限定の結論を表明するときには継続企業の前提に関する事項を記載しない。", "a": false, "c": "H30Ⅰ⑥エ／H26Ⅱ⑦エ", "e": "期中財務諸表に継続企業の前提に関する事項について注記がなされた場合に，期中レビュー報告書に無限定の結論を表明するときには，継続企業の前提に関する事項を記載しなければならない。"}, {"l": 111, "m": "期中レビュー", "sb": "", "i": "A", "r": "", "q": "監査人は，継続企業の前提に関する重要な不確実性が認められ，それが期中財務諸表に適切に記載されていないと判断した場合には，当該不適切な記載についての除外事項を付した限定付結論又は否定的結論を表明し，その理由を期中レビュー報告書に記載しなければならない。", "a": true, "c": "R４Ⅰ⑦エ／R２Ⅰ⑥エ", "e": ""}, {"l": 112, "m": "期中レビュー", "sb": "", "i": "A", "r": "", "q": "「期中レビュー基準」の報告基準における継続企業の前提の項においては，「監査基準」の報告基準における継続企業の前提の項に記載されている意見の不表明に相当する規定は置かれていない。", "a": true, "c": "H27Ⅱ⑦エ", "e": ""}, {"l": 113, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "金融商品取引法における内部統制報告書とその監査制度は，上場会社による大規模な会計不正が相次いで発覚したことから，米国の制度を参考に設けられたものである。", "a": true, "c": "R６Ⅰ②エ", "e": ""}, {"l": 114, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "経営者は，内部統制の評価範囲を決定する場合，全社的な観点で評価することが適切と認められる決算・財務報告に係る業務プロセスであっても，財務報告に対する影響の重要性が僅少である事業拠点に係るものについては，評価対象としないことができる。", "a": true, "c": "H23Ⅱ⑲イ", "e": ""}, {"l": 115, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "経営者による内部統制の有効性の評価に当たってはトップダウン型のリスク・アプローチが採用されていることから，評価範囲とする事業拠点の決定において，全社的な内部統制の評価が良好であることを前提に，連結ベースの売上高等のおおむね３分の２程度とすることが認められている。したがって，これにより除外された事業拠点に関しては財務報告への影響を勘案して，重要性の大きい業務プロセスを有していても，それを評価対象に追加する必要はない。", "a": false, "c": "R５Ⅰ⑧ア", "e": "重要な事業拠点から除外された事業拠点であっても，財務報告への影響を勘案して，重要性の大きい業務プロセスを有していれば，個別に評価対象に追加する必要がある。"}, {"l": 116, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "業務プロセスに係る内部統制の評価範囲については，一定の条件を満たした場合，評価対象とする事業拠点の売上高等の合計額が，連結ベースの売上高等の３分の２を下回ることがある。", "a": true, "c": "R２Ⅱ⑨ウ", "e": ""}, {"l": 117, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "経営者は，内部統制の評価範囲の決定に際して，監査人と協議のうえ，前年度の評価範囲に入っていた重要な事業拠点のうち，前年度の内部統制の評価結果が有効であり，内部統制の整備状況に重要な変更がなく，特に重要な事業拠点に該当しない場合には，当該事業拠点を当年度の評価範囲から除外することができる。", "a": true, "c": "H24Ⅱ⑳イ", "e": ""}, {"l": 118, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "経営者は，期末日後に実施した開示すべき重要な不備に対する是正措置の内容を内部統制報告書に記載することがある。この場合，経営者が，有効な内部統制を整備し，その運用の有効性を確認し，かつ，是正措置を完了した旨を記載していたとしても，その是正措置は，当該年度の内部統制の有効性の評価結果に反映されない。", "a": true, "c": "R２Ⅰ⑧ウ", "e": ""}, {"l": 119, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "内部統制監査の目的は，経営者が構築した内部統制が，一般に公正妥当と認められる内部統制の評価の基準に準拠して，すべての重要な点において有効に運用されているかどうかについて，監査人自らが入手した監査証拠に基づいて判断した結果を意見として表明することにある。", "a": false, "c": "R２Ⅱ⑨ア／H28Ⅰ⑨イ", "e": "我が国の内部統制監査において，ダイレクト・レポーティングは採用されていない。"}, {"l": 120, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "我が国の内部統制監査に関する基準上，経営者による内部統制の有効性に関する評価結果と関係なく，内部統制の整備及び運用状況を監査人が直接検証する形式の内部統制監査も認められている。", "a": false, "c": "H31Ⅰ⑥イ", "e": "本肢も，ダイレクト・レポーティングの採用を意味する記述である。"}, {"l": 121, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "内部統制報告書が適正である旨の監査人の意見は，内部統制報告書には重要な虚偽の表示がないこと，及び被監査会社の財務報告に係る内部統制には開示すべき重要な不備がないことについて，合理的な保証を得たとの監査人の判断を含んでいる。", "a": false, "c": "H27Ⅱ⑧ア", "e": "本肢の「及び」以降が，ダイレクト・レポーティングの採用を意味する記述である。"}, {"l": 122, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "我が国における内部統制報告制度の導入にあたり参考にされた米国の企業改革法に基づく内部統制監査でも，企業の財務報告に係る内部統制そのものの有効性について意見を表明するダイレクト・レポーティングは採用されていない。", "a": false, "c": "H25Ⅰ⑱ア", "e": "米国での同制度では，ダイレクト・レポーティングが採用されている。"}, {"l": 123, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "内部統制監査は，被監査会社の内部統制の有効性の評価に対する監査となるため，情報監査ではなく実態監査の枠組みの中で実施される監査となる。", "a": false, "c": "R６Ⅰ⑥ア", "e": "我が国の内部統制監査は，被監査会社の内部統制の有効性の評価（＝内部統制報告書）に対する監査であるため，情報監査である。"}, {"l": 124, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "我が国の内部統制監査制度はダイレクト・レポーティングを採用していないため，監査人は，自らが内部統制の整備及び運用状況に関する十分かつ適切な監査証拠を入手し，それを根拠として意見を表明しているわけではない。", "a": false, "c": "H30Ⅰ⑦イ", "e": "内部統制報告書の適正性に関する意見は，監査人自らが内部統制の整備及び運用状況に関する十分かつ適切な監査証拠を入手し，それに基づいて表明するものである。"}, {"l": 125, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "我が国の内部統制監査は，内部統制の有効性の評価結果という経営者の主張を前提に，これに対する監査人の意見を表明するものであり，直接報告業務（ダイレクト・レポーティング）を採用しているわけではないが，監査人は，内部統制監査において意見を表明するに当たって，企業等から，直接，十分かつ適切な監査証拠を入手する。", "a": true, "c": "R５Ⅱ⑨ア", "e": "上記の肢とほぼ同趣旨の肢。"}, {"l": 126, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "内部統制監査は，効果的かつ効率的な財務諸表監査の実施を支える内部統制の有効性に関する経営者による内部統制報告書について検証する監査であり，内部統制監査の保証水準は，財務諸表監査の保証水準と同じ水準である。", "a": true, "c": "H28Ⅱ⑦イ／R５Ⅰ⑫エ／H25Ⅰ⑱ウ", "e": "なお，本肢にある「効果的かつ効率的な財務諸表監査の実施を支える内部統制」とは，財務報告に係る内部統制のことを意味している。"}, {"l": 127, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "内部統制は，基本的に，業務の有効性及び効率性，報告の信頼性，事業活動に関わる法令等の遵守並びに資産の保全の４つの目的が達成されているとの合理的な保証を得るために遂行されるプロセスをいい，内部統制監査の監査意見は，これら４つの目的が達成されているとの合理的な保証を得た上で表明される。", "a": false, "c": "H28Ⅰ⑨ウ", "e": "内部統制監査で対象となる内部統制は，財務報告に係る内部統制である。また，監査意見は，内部統制報告書における重要な虚偽表示の有無について合理的な保証を得た上で表明されるものである。"}, {"l": 128, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "内部統制監査は，原則として，同一の監査人により，財務諸表監査と一体となって行われるものである。ここでの同一の監査人とは，監査事務所が同一ということだけではなく，業務執行社員も同一であることを意味している。", "a": true, "c": "R６Ⅰ⑥イ／H31Ⅰ⑥ウ／H28Ⅱ⑦ア／H26Ⅰ⑯イ", "e": ""}, {"l": 129, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "内部統制監査は，原則として，財務諸表監査と同一の業務執行社員によって行われることから，監査人は，内部統制監査の過程で得られた監査証拠を財務諸表監査の監査証拠として利用したり，財務諸表監査の過程で得られた監査証拠を内部統制監査の監査証拠として利用したりすることがある。", "a": true, "c": "R５Ⅱ⑨ウ", "e": ""}, {"l": 130, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "監査人は，内部統制監査において経営者による内部統制の評価結果が実態を適切に表しているか否かを検証するのであり，内部統制それ自体の有効性を判断するわけではないので，当該検証の結果は財務諸表監査における統制リスクの評価に影響を与えるものではない。", "a": false, "c": "H24Ⅰ⑳オ", "e": "同上"}, {"l": 131, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "監査人は，経営者による全社的な内部統制の評価の妥当性について検討する際に，財務諸表監査の実施過程において入手した監査証拠を利用することができる。", "a": true, "c": "R３⑦イ／H26Ⅱ⑮ア", "e": ""}, {"l": 132, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "財務報告に係る内部統制に開示すべき重要な不備が存在する場合，監査人は，財務諸表監査において当該内部統制に依拠した監査はできないので，財務諸表監査においては，当該不備を除外事項として限定付適正意見又は不適正意見を表明しなければならない。", "a": false, "c": "H25Ⅰ⑲イ", "e": "本肢の状況から除外事項付意見になるとすれば，監査範囲の制約であろう。なお，特定の監査要点に係る内部統制に依拠できなくとも十分かつ適切な監査証拠を入手できる場合はあるため，必ず監査範囲の制約となるわけでもない。"}, {"l": 133, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "監査人は，内部統制監査において経営者による内部統制の評価結果の報告がなされなかったことにより意見を表明しない場合，内部統制に依拠した通常の試査による監査が実施できなくなるため，財務諸表監査においては意見不表明となる。", "a": false, "c": "H24Ⅰ⑳ア", "e": "内部統制に依拠した通常の試査による監査を実施できないとしても，それをもって直ちに財務諸表監査において意見不表明となるわけではない。"}, {"l": 134, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "内部統制の開示すべき重要な不備が期中に発見された場合には，当該不備が是正されるまでの間，財務諸表監査における内部統制への依拠が限定的となる可能性がある。", "a": true, "c": "H24Ⅰ⑳ウ", "e": ""}, {"l": 135, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "内部統制監査報告書において不適正意見が表明された場合であっても，財務諸表監査の意見が無限定適正意見となることがある。", "a": true, "c": "H25Ⅱ⑳エ", "e": ""}, {"l": 136, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "監査人は，内部統制監査の実施において，内部統制の不備を発見した場合には，経営者に報告して是正を求めなければならない。ただし，内部統制監査と非監査業務の同時提供は制限されているため，内部統制の構築段階において，監査人は，経営者との意見交換及び内部統制の構築に関する指摘を行ってはならない。", "a": false, "c": "R３⑦エ／R６Ⅱ⑨イ／R２Ⅱ⑨イ／H27Ⅱ⑧エ／H26Ⅱ⑮イ", "e": "内部統制の構築段階において行う経営者との意見交換及び内部統制の構築に関する指摘は，監査人の独立性を損なうものではないため，認められている。"}, {"l": 137, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "監査人は，内部統制監査業務について，関係法令に規定する身分的，経済的利害関係を有してはならず，二重責任の原則の適用も受けるため，経営者から内部統制の構築の段階において意見を求められても応じてはならない。", "a": false, "c": "H31Ⅰ⑦イ／H30Ⅱ⑧ア／H28Ⅱ⑦エ", "e": "監査人は，内部統制監査業務において，内部統制の構築に関する，経営者との意見交換や経営者に対する助言・指摘を行うことが求められる。"}, {"l": 138, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "監査人は，内部統制監査を行うに当たり，財務報告に係る内部統制の評価及び監査の基準の他に，監査基準の一般基準を遵守することが求められるが，監査に関する品質管理基準を遵守することは求められない。", "a": false, "c": "H31Ⅰ⑪ウ／H27Ⅱ⑧イ", "e": "監査人は，内部統制監査を行うに当たっては，「監査に関する品質管理基準」も遵守しなければならない。"}, {"l": 139, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "内部統制監査は，原則として，財務諸表監査と同一の業務執行社員により行うことが求められている。しかし，双方の監査は，目的が異なるため，内部統制監査の監査計画は，財務諸表監査の監査計画とは別に策定されなければならない。", "a": false, "c": "R２Ⅰ⑦エ／R３⑦ア", "e": "監査人は，内部統制監査の計画を財務諸表監査の監査計画に含めて策定する。"}, {"l": 140, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "監査人は，財務報告に係る内部統制の有効性を評価する経営者の評価手続の内容について理解しなければならないが，これには，内部統制の不備が，開示すべき重要な不備に該当するかどうかを判定するために経営者が設定した重要性の判断基準等の設定状況も含まれる。", "a": true, "c": "H26Ⅱ⑮エ", "e": ""}, {"l": 141, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "監査人は，経営者が重要な事業拠点における，企業の事業目的に大きく関わる勘定科目に至る業務プロセスを，原則として，全て評価対象としていることを確認する。", "a": true, "c": "R６Ⅱ⑨ウ／R４Ⅰ⑧ア", "e": "👉講義レジュメ⑦-3-6"}, {"l": 142, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "監査人は，経営者が全ての事業拠点を全社的な内部統制の評価の範囲に含めていない場合には，経営者によって決定された内部統制の評価の範囲の妥当性を判断するために，経営者が当該範囲を決定した方法及びその根拠の合理性を検討しなければならない。", "a": true, "c": "H29Ⅱ⑧ア", "e": ""}, {"l": 143, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "重要な事業拠点が行う事業との関連性が低く，財務報告に対する影響の重要性が僅少であるとして，経営者が評価対象としなかった業務プロセスがある場合，監査人は，業務プロセスの選定の方法及びその根拠の合理性を検討しなければならない。", "a": true, "c": "R３⑧ア", "e": ""}, {"l": 144, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "監査人が経営者の決定した評価範囲を妥当でないと判断した場合，経営者が新たな評価範囲を設定し業務プロセスに係る内部統制の有効性を評価することは時間的制約等から困難を伴うので，経営者が評価範囲を決定した前後に，必要に応じて監査人は経営者とその範囲について協議しておくことが適切である。", "a": true, "c": "H30Ⅰ⑦ア", "e": ""}, {"l": 145, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "監査人は，経営者が重要な事業拠点を適切に選定していないと判断する場合がある。この場合，監査人は，経営者に対して選定の見直しなどの追加的な対応を常に求めなければならない。", "a": false, "c": "R２Ⅰ⑧イ", "e": "選定の見直しは，財務報告に対する影響の程度等に応じて求めることになる。"}, {"l": 146, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "経営者は，第一義的に内部統制に責任を負い，内部統制の評価範囲も自ら判断して決定しなければならないが，監査人との協議により，自己の評価範囲を変更することもある。", "a": true, "c": "H23Ⅱ⑲ア", "e": ""}, {"l": 147, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "監査人は，経営者がやむを得ない事情により，内部統制の一部について十分な評価手続を実施できなかったことにつき，正当な理由が認められるか否かについて慎重に検討しなければならない。", "a": true, "c": "R６Ⅱ⑨エ", "e": ""}, {"l": 148, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "監査人は，全社的な内部統制の整備状況を検討する場合，経営者の採用する評価項目が適切かどうかについて，経営者に対する質問によって確認すればよい。", "a": false, "c": "H23Ⅱ⑲オ", "e": "本肢の検討を行う場合，監査人は，質問のみならず，内部統制の記録の閲覧も行う。"}, {"l": 149, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "監査人は，全社的な内部統制の運用状況を検討するに当たり，経営者により統制環境に係るいくつかの項目について内部統制の運用状況に関する記録が作成されていない場合には，評価の対象となる情報が存在しないため，経営者が決定した評価範囲，評価手続及び評価結果に関して不適切なものがあるものとして評価する。", "a": false, "c": "H31Ⅰ⑦ア", "e": "本肢のような場合でも，監査人は，関係者等への質問や観察等により運用状況を確認することができる。"}, {"l": 150, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "監査人は，取締役会が内部統制に関して経営者を監督する責任を有していることから，取締役会の構成員がこの監督責任を理解した上で，それを適切に実行しているかに留意して，全社的な内部統制の整備及び運用状況を検討する。", "a": true, "c": "H28Ⅱ⑦ウ", "e": ""}, {"l": 151, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "監査人は，財務報告に係る全社的な内部統制の評価の妥当性を検討するに当たって，監査役等の活動を含めた経営レベルにおける内部統制の整備及び運用状況の評価が重要となるため，監査役等が行った業務監査の中身を検討することが求められている。", "a": false, "c": "R５Ⅱ⑨イ／H25Ⅰ⑱イ", "e": "内部統制監査は，財務報告に係る内部統制を対象とするものであるため，監査人は，本肢の評価において，監査役等が行った「業務監査」の中身を含める必要はない。"}, {"l": 152, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "監査人は，経営者による業務プロセスに係る内部統制の評価の妥当性を検討するに当たり，経営者が評価した個々の統制上の要点について，内部統制の基本的要素が適切に機能しているかを判断するため，実在性，網羅性，権利と義務の帰属等の監査要点に適合した監査証拠を入手しなければならない。", "a": true, "c": "H31Ⅰ⑦エ", "e": ""}, {"l": 153, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "業務プロセスに係る内部統制の評価の妥当性に関する監査人の判断は，経営者が評価した統制上の要点について，財務諸表監査における監査要点に適合した監査証拠を入手することによって行われる。", "a": true, "c": "H26Ⅱ⑮ウ", "e": "なお，本肢にある「財務諸表監査における監査要点」の内容は，上の肢を参照。"}, {"l": 154, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "監査人は，内部統制の運用状況の有効性に関する経営者の評価の妥当性を検討するに当たって，内部統制の実施状況を検証するが，当該実施状況の検証で用いられるサンプルは，経営者が抽出したサンプルに限られており，監査人が自らサンプルを選択することはない。", "a": false, "c": "R６Ⅰ⑥エ／R３⑧イ／R２Ⅰ⑧ア", "e": "監査人は，基本的には，自ら選択したサンプルを用いて監査証拠を入手する。"}, {"l": 155, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "内部統制監査において，監査人が経営者の内部統制の運用評価の妥当性を検討する際に，監査人自身はサンプル抽出を全く行わずに経営者の抽出したサンプルを自らの用いるサンプルとして選択して検討を行うことがあり得る。", "a": true, "c": "H31Ⅰ⑦ウ／H25Ⅱ⑳ウ", "e": ""}, {"l": 156, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "監査人は，業務プロセスに係る内部統制の運用状況の検討に際して，経営者が行ったサンプリングのサンプルを自ら選択したものとして利用できるが，当該サンプルについて，経営者が行った評価結果を利用することはできない。", "a": false, "c": "H24Ⅱ⑳エ", "e": "監査人は，経営者が抽出したサンプルのみならず，当該サンプルについて経営者が行った評価結果も利用できる。"}, {"l": 157, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "内部統制監査においては，内部統制の有効性の評価結果という経営者の主張を前提に，これに対する監査人の意見を表明するものであるため，監査人は，経営者の評価結果を利用しない場合であっても，経営者の評価方法を具体的に検証しなければならない。", "a": false, "c": "R４Ⅰ⑧イ／R３⑦ウ／R２Ⅰ⑦ア／H31Ⅰ⑥ア／H31Ⅰ⑥エ／H27Ⅱ⑧ウ／H26Ⅰ⑯ア／H25Ⅰ⑱オ", "e": "監査人は，経営者の評価結果を自らが入手した監査証拠として利用する場合にのみ，経営者の評価方法を具体的に検証することが求められる。したがって，経営者の評価結果を利用しない場合には，経営者の評価方法を具体的に検証する必要はない。"}, {"l": 158, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "監査人は，経営者の評価結果を監査証拠として利用する場合を除き，経営者が具体的にどのような方法で内部統制の整備・運用の状況を評価したかを詳細に検証する必要はないが，経営者が統制上の要点を適切に選定しているかは評価する必要がある。", "a": true, "c": "R５Ⅰ⑧イ", "e": ""}, {"l": 159, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "「事業規模が小規模で，比較的簡素な構造を有している組織等」ではないと監査人が判断した会社に対する内部統制監査においては，経営者が直接行った日常的モニタリングの結果や監査役が直接行った棚卸の立会の結果等を利用することはできない。", "a": true, "c": "H28Ⅰ⑨ア／H27Ⅰ⑥イ", "e": ""}, {"l": 160, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "監査人は，前年度において，内部統制の評価結果が有効であった業務プロセスに係る内部統制の運用状況の評価に当たっては，当該業務プロセスに係る内部統制の整備状況に重要な変更がないなど新たに確認すべき事項がない場合，経営者が評価において選択したサンプル及びその評価結果を利用することができる。", "a": true, "c": "H30Ⅱ⑧エ", "e": ""}, {"l": 161, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "（監査手続の実施として適切か？）監査人は，被監査会社の重要な事業拠点の業務プロセスに係る内部統制の運用状況の評価において，１２か月の母集団に対して一部の特定の月から抽出したサンプルの評価結果を利用した。", "a": false, "c": "R４Ⅰ⑯ウ", "e": "一部の特定の月から抽出したサンプルは，１２ヶ月の母集団の特性を代表したものとは言えず，適切ではない。"}, {"l": 162, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "ＩＴを利用した内部統制に係る全般統制が有効であり，かつＩＴに係る業務処理統制の整備状況が有効であると評価された場合，監査人は，人手による内部統制よりも，一般に運用状況の検討作業を減らすことができる。", "a": true, "c": "H30Ⅰ⑦ウ／H28Ⅰ⑨エ", "e": ""}, {"l": 163, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "監査人は，経営者による財務報告に係る内部統制の評価結果を利用する場合，監査人が採用する評価方法を経営者の評価方法として用いるよう指導しなければならない。", "a": false, "c": "H30Ⅰ⑧ア", "e": "監査人の定めている手続や手法を，経営者に対して画一的に強制してはならない。"}, {"l": 164, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "監査人は，業務プロセスに係る不備が発見された場合において，不備の重要性を判断するときには，当該不備がどの勘定科目等にどの範囲で影響を及ぼしうるかについて検討しなければならない。", "a": true, "c": "H23Ⅱ⑲エ", "e": ""}, {"l": 165, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "監査人は，業務プロセスに係る内部統制の不備が発見された場合，当該不備がどの勘定科目にどの範囲で影響を及ぼすかを検討し，当該影響の発生可能性を検討するが，それには当該不備が財務報告に及ぼす潜在的な影響額も含まれる。", "a": true, "c": "H30Ⅱ⑧ウ", "e": ""}, {"l": 166, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "監査人は，財務報告に係る内部統制の不備が開示すべき重要な不備に該当するかどうかを，当該不備により実際に生じた虚偽記載の財務報告全般に対する金額的重要性及び質的重要性に基づいて決定しなければならない。", "a": false, "c": "R５Ⅰ⑧ウ／H25Ⅰ⑲エ", "e": "内部統制の不備が開示すべき重要な不備に該当するかどうかは，実際に虚偽記載が発生したかどうかではなく，財務報告全般に関する虚偽記載の発生可能性と潜在的な影響の大きさを考慮して決定する。"}, {"l": 167, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "内部統制の不備が複数存在する場合，監査人は，それらの不備が財務報告に及ぼす潜在的な影響額について個々にその質的及び金額的重要性を判断し，それぞれの不備が開示すべき重要な不備に該当しないかを検討する。", "a": false, "c": "R３⑧ウ", "e": "内部統制の不備が複数存在する場合，開示すべき重要な不備に該当するかは，複数の不備を組み合わせて評価する必要がある。"}, {"l": 168, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "内部統制上の不備が開示すべき重要な不備に該当するかを判断する指針となる金額的重要性及び質的重要性は，事業拠点において個別に評価対象に追加する業務プロセスを決定する際に用いる指針としても利用される。", "a": false, "c": "H30Ⅰ⑦エ", "e": "内部統制の不備の重要性の判断指針と，事業拠点において個別に評価対象に追加する業務プロセスを決定する際の指針とは異なる。"}, {"l": 169, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "内部統制の不備のうち，一定の金額を上回る虚偽記載，又は質的に重要な虚偽記載をもたらす不備であっても，財務報告に重要な影響を及ぼす可能性が低いと監査人が判断したものは，開示すべき重要な不備には該当しない。", "a": true, "c": "H24Ⅱ⑳ウ", "e": ""}, {"l": 170, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "監査人は，業務プロセスに係る不備を発見した場合には，当該不備が財務報告に及ぼす潜在的な影響を検討するが，開示すべき重要な不備に該当するかどうかに関する金額的な数値基準については，経営者と協議して決める。", "a": false, "c": "H23Ⅱ⑳エ", "e": "開示すべき重要な不備に該当するかどうかに関する金額的な基準は，財務諸表監査の判断基準と同一のもの（重要性の基準値）を使用するため，経営者と協議して決めるわけではない。"}, {"l": 171, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "ＩＴに係る全般統制の不備は，それ自体が財務報告の重要な事項に虚偽記載が発生するリスクに必ずしも直接に繋がるものではないものの，業務処理統制の有効な運用を継続的に維持することができない可能性があるため，直ちに開示すべき重要な不備となる。", "a": false, "c": "R４Ⅰ⑧ウ", "e": "開示すべき重要な不備に該当するか否かは，あくまでも，不備による潜在的な影響の重要性及び重要な虚偽記載の発生可能性（全社的な内部統制の不備の場合は後者のみ）を踏まえて決定する。"}, {"l": 172, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "監査人は，全社的な内部統制に不備がある場合，当該状況は基本的な内部統制の整備に不備があることを意味していることから，当該内部統制に開示すべき重要な不備があると判断しなければならない。", "a": false, "c": "H31Ⅱ⑧ア", "e": "同上"}, {"l": 173, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "内部統制の開示すべき重要な不備となる全社的な内部統制の不備には，財務報告に係る内部統制の有効性を評価する責任部署が明確でない場合が含まれる。", "a": true, "c": "H29Ⅱ⑧イ", "e": ""}, {"l": 174, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "監査人は，評価対象となった業務プロセスに係る内部統制に不備が発見され，それが及ぼす影響に質的又は金額的な重要性があり期末日までに是正されない場合には，当該不備は開示すべき重要な不備に該当すると判断しなければならない。", "a": true, "c": "H31Ⅱ⑧イ", "e": "本肢では「発生可能性」の要件が示されていないが，他の肢との比較で正しいと判断せざるを得ない記述であった。"}, {"l": 175, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "監査人は，内部統制監査の実施において開示すべき重要な不備を発見した場合には，その内容を経営者に報告して是正を求めるとともに，当該開示すべき重要な不備の内容を経営者に報告した旨を取締役会及び監査役等に報告しなければならない。", "a": true, "c": "H31Ⅱ⑧ウ", "e": ""}, {"l": 176, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "監査人は，内部統制の開示すべき重要な不備に該当しない場合でも，内部統制の不備を発見したときには，その内容を取締役会及び監査役又は監査委員会に報告しなければならない。", "a": false, "c": "H29Ⅱ⑧ウ／H25Ⅰ⑲オ", "e": "開示すべき重要な不備に該当しない内部統制の不備を発見した場合は，適切な管理者に報告すればよく，取締役会及び監査役又は監査委員会への報告は不要である。"}, {"l": 177, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "監査人は，内部統制監査において，内部統制の不備又は開示すべき重要な不備を発見した場合には，適時に監査計画を修正し，経営者に是正措置を講じることを求めるとともに，いずれの不備もその内容及び是正結果を取締役会及び監査役等に報告しなければならない。", "a": false, "c": "R２Ⅱ⑨エ／H25Ⅱ⑰ア／H23Ⅱ⑳ウ", "e": "発見した不備が開示すべき重要な不備に該当しない場合には，経営者への是正要求，当該不備の内容やその是正結果に関する取締役会及び監査役又は監査委員会への報告を行うことは求められない。"}, {"l": 178, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "開示すべき重要な不備が，経営者による内部統制の有効性評価の過程では発見されていないが，内部統制監査の過程で監査人により発見される場合がある。この場合，期末日までに是正措置が実施されたときには，監査人は，実施された是正措置の妥当性について検証するのではなく，当該措置について経営者が行った評価が適切であるかを確認する。", "a": true, "c": "R２Ⅰ⑧エ／R５Ⅰ⑧エ", "e": "実施された是正措置そのものの妥当性について検証する必要はなく，あくまでも評価結果の妥当性を検討すればよい点に注意する。"}, {"l": 179, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "B", "r": "", "q": "監査人は，在外子会社の他の監査人の監査結果を利用する旨を内部統制監査報告書に別途記載することによって，当該監査結果を利用することができる。", "a": false, "c": "H30Ⅱ⑧イ", "e": "監査人は，他の監査人の監査結果を利用した場合においても，内部統制監査報告書に特段の記載は行わない。"}, {"l": 180, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "B", "r": "", "q": "監査人は，財務諸表監査の実施過程において，他の専門家を利用して入手した監査証拠を，内部統制監査の監査証拠として利用することができる。", "a": true, "c": "R２Ⅰ⑦イ", "e": ""}, {"l": 181, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "B", "r": "", "q": "監査人は，内部監査人等が行っている内部統制の有効性の評価に関する作業の品質及び有効性を検証した結果，それが適切であると判断したときは，当該作業を自己の検証そのものに代えて，経営者の評価に対する監査証拠として利用しなければならない。", "a": false, "c": "R６Ⅱ⑨ア／R６Ⅰ⑥ウ／H27Ⅰ⑥ウ", "e": "監査人は，内部監査人の作業を自己の検証そのものに代えて利用することはできない。また，内部監査人の作業は，あくまでも「利用できる」ものであって，「利用しなければならない」ものではない。"}, {"l": 182, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "B", "r": "", "q": "監査人は，内部統制監査にあたり，内部監査人の業務を利用する場合には，内部監査人の専門的能力だけではなく，評価対象とした業務からの独立性についても検討する必要がある。", "a": true, "c": "H26Ⅰ⑯ウ", "e": ""}, {"l": 183, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "被監査会社が連結財務諸表及び個別財務諸表を開示している場合，内部統制監査報告書は，原則として，個別財務諸表監査報告書ではなく，連結財務諸表監査報告書と一体のものとして作成される。", "a": true, "c": "H25Ⅰ⑱エ", "e": ""}, {"l": 184, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "内部統制監査報告書の利用者は，財務報告に係る内部統制によって財務報告の虚偽の記載を完全には防止又は発見することができない可能性がある旨を知ることはできない。", "a": false, "c": "H30Ⅰ①ウ", "e": "内部統制監査報告書には，財務報告に係る内部統制によって虚偽記載を完全には防止又は発見することができない可能性がある旨が記載されるため，本肢は誤りとなる。"}, {"l": 185, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "監査人が監査の過程で発見した開示すべき重要な不備を，それが内部統制報告書における評価時点までに是正されていることを理由として経営者が内部統制報告書において開示していない場合，監査人は，当該事項の重要性に鑑み，除外事項を付した限定付適正意見又は不適正意見を表明しなければならない。", "a": false, "c": "H29Ⅰ⑦イ／H30Ⅰ⑧エ／H26Ⅱ⑯イ／H25Ⅰ⑲ウ", "e": "本肢の場合，内部統制は有効であるため，その旨の評価結果が内部統制報告書で適切に表明されていれば，無限定適正意見を表明できる。"}, {"l": 186, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "監査人は，内部統制監査の過程で監査人が発見した開示すべき重要な不備が期末日までに是正された場合，内部統制監査報告書において適正意見を表明するとともに，当該是正措置について追記情報として記載する。", "a": false, "c": "R５Ⅱ⑨エ", "e": "期末日前に実施した是正措置を追記情報として記載する必要はない。"}, {"l": 187, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "監査人は，開示すべき重要な不備があるとした経営者の評価結果は適正であるが，期末日後に実施した是正措置について，内部統制報告書の記載が不適切であると判断した場合，除外事項を付した限定付適正意見を表明することがある。この場合，監査人は，意見の根拠の区分に，除外した不適切な事項及び財務諸表監査に及ぼす影響を記載しなければならない。", "a": true, "c": "R３⑧エ／H30Ⅰ⑧イ", "e": ""}, {"l": 188, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "経営者が期末日後に実施された是正措置の内容を内部統制報告書に付記事項として記載している場合で，監査人が当該記載を適切ではないと判断したときには，監査人は，内部統制監査報告書において当該不適切な記載についての除外事項を付した限定付適正意見を表明しなければならない。", "a": false, "c": "H29Ⅰ⑦エ", "e": "付記事項の記載が適切でない場合，当該虚偽表示による影響の広
