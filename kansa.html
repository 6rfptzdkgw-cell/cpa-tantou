<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="監査論チェック">
<title>松本レジュメ（監査論）</title>
<style>
:root{
  --paper:#F4F5F1;
  --panel:#FFFFFF;
  --ink:#1B2229;
  --ink-2:#4A555F;
  --ink-3:#7E8A94;
  --rule:#D9DDD5;
  --rule-2:#E9ECE6;
  --red:#D62839;
  --red-soft:#FBE7E9;
  --blue:#1F5673;
  --ok:#2F7A4F;
  --ok-soft:#E5F1E9;
  --warn:#B26A00;
  --sheet:#8A4B12;
  --warn-soft:#FBEEDD;
  --shade:rgba(27,34,41,.06);
  --grid:rgba(31,86,115,.055);
  --radius:3px;
  --sans:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic Medium","Yu Gothic","Meiryo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Hiragino Mincho ProN","Yu Mincho",Georgia,serif;
}
[data-theme="dark"]{
  --paper:#14181C;
  --panel:#1B2126;
  --ink:#E7EAE5;
  --ink-2:#AEB8BF;
  --ink-3:#7A858D;
  --rule:#2C343A;
  --rule-2:#232A30;
  --red:#FF5C6B;
  --red-soft:#3A1E22;
  --blue:#7FB4D0;
  --ok:#6FC28E;
  --ok-soft:#1E2E24;
  --warn:#E0A14A;
  --sheet:#C97A2E;
  --warn-soft:#332616;
  --shade:rgba(0,0,0,.3);
  --grid:rgba(127,180,208,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.6;
  -webkit-text-size-adjust:100%;
  padding-bottom:env(safe-area-inset-bottom);
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:0 14px}

header{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid var(--rule)}
.hd{display:flex;align-items:center;gap:10px;padding:10px 0 8px}
.brand{font-family:var(--serif);font-size:19px;letter-spacing:.01em;line-height:1.2}
.brand small{display:block;font-family:var(--sans);font-size:10.5px;color:var(--ink-3);letter-spacing:.1em}
.hd-sp{flex:1}
.iconbtn{width:38px;height:38px;border:1px solid var(--rule);border-radius:var(--radius);display:grid;place-items:center;font-size:15px;background:var(--panel)}
.iconbtn[aria-pressed="true"]{background:var(--sheet);border-color:var(--sheet);color:#fff}
.tabs{display:flex;gap:0;border:1px solid var(--rule);border-bottom:none;background:var(--panel)}
.tabs button{flex:1;padding:9px 4px;font-size:13.5px;color:var(--ink-2);border-right:1px solid var(--rule);position:relative}
.tabs button:last-child{border-right:none}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:700;background:var(--paper)}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--red)}
.meter{height:3px;background:var(--rule-2);display:flex}
.meter i{display:block;height:100%}
.meter .m3{background:var(--ok)} .meter .m2{background:var(--warn)} .meter .m1{background:var(--red)}

.filters{padding:10px 0 6px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search{flex:1;min-width:180px;display:flex;align-items:center;gap:8px;border:1px solid var(--rule);background:var(--panel);padding:0 10px;border-radius:var(--radius)}
.search input{flex:1;border:none;background:none;padding:9px 0;outline:none;min-width:0}
select{border:1px solid var(--rule);background:var(--panel);padding:9px 8px;border-radius:var(--radius);max-width:100%}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--rule);background:var(--panel);padding:5px 11px;border-radius:99px;font-size:12.5px;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.count{font-size:12px;color:var(--ink-3);padding:4px 0 8px}

.chsel-head{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding:0 2px}
.chsel-head .lbl{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.chsel-head .links button{font-size:11.5px;color:var(--blue);text-decoration:underline;font-weight:400;margin-left:10px}
.chapter-list{background:var(--panel);border:1px solid var(--rule);margin-top:6px}
.chapter-row{display:flex;align-items:center;gap:10px;padding:10px 10px;border-bottom:1px solid var(--rule-2);cursor:pointer}
.chapter-row:last-child{border-bottom:none}
.chapter-row:active{background:var(--shade)}
.chapter-row .check{width:20px;height:20px;border-radius:4px;border:2px solid var(--ink-3);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
.chapter-row.checked{background:color-mix(in srgb, var(--blue) 7%, var(--panel))}
.chapter-row.checked .check{background:var(--blue);border-color:var(--blue)}
.chapter-row .cname{flex:1;font-size:13.5px;color:var(--ink-3)}
.chapter-row.checked .cname{color:var(--ink);font-weight:700}
.chapter-row .ccnt{font-size:11.5px;color:var(--ink-3);flex-shrink:0}
.chapter-row .caret{font-size:11px;color:var(--blue);margin-left:8px;flex-shrink:0;padding:4px 2px}
.major-list{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px 10px 40px;background:var(--rule-2);border-bottom:1px solid var(--rule-2)}
.major-chip{font-size:12px;padding:5px 10px;border-radius:99px;border:1px solid var(--rule);background:var(--panel);color:var(--ink-3);cursor:pointer;white-space:nowrap}
.major-chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.major-chip .mcnt{opacity:.7;font-size:10.5px}
.imp-row{display:flex;gap:8px;margin-top:6px}
.imp-box{flex:1;border:1px solid var(--rule);background:var(--panel);border-radius:var(--radius);padding:10px 8px;text-align:center;cursor:pointer}
.imp-box .check{width:20px;height:20px;border-radius:4px;border:2px solid var(--ink-3);margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
.imp-box.checked{background:color-mix(in srgb, var(--blue) 7%, var(--panel));border-color:var(--blue)}
.imp-box.checked .check{background:var(--blue);border-color:var(--blue)}
.imp-box .ilabel{font-size:13px;color:var(--ink-3)}
.imp-box.checked .ilabel{color:var(--ink);font-weight:700}
.imp-box .icnt{font-size:11px;color:var(--ink-3);margin-top:2px}

.sec{margin:18px 0 6px;display:flex;align-items:baseline;gap:10px}
.sec h2{font-size:13px;margin:0;letter-spacing:.03em;font-weight:700}
.sec span{flex:1;border-bottom:1px dashed var(--rule)}
.sec b{font-size:11px;color:var(--ink-3);font-weight:400}
ol.list{list-style:none;margin:0;padding:0;background:var(--panel);border:1px solid var(--rule)}
li.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:0 12px;padding:9px 10px;border-bottom:1px solid var(--rule-2);align-items:start}
li.item:last-child{border-bottom:none}
.no{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums;padding-top:4px;text-align:center}
.en{font-family:var(--serif);font-size:16px;line-height:1.5;word-break:break-word}
.ja{font-size:13.5px;color:var(--ink-2);margin-top:5px;font-weight:700}
.note{font-size:12px;color:var(--ink-3);margin-top:4px;white-space:pre-line;border-left:2px solid var(--rule);padding-left:7px;line-height:1.7}
.memoline{font-size:11.5px;color:var(--warn);margin-top:5px}
.tools{display:flex;flex-direction:column;align-items:center;gap:6px}
.mark{font-size:10px;padding:3px 7px;border:1px solid var(--rule);border-radius:99px;color:var(--ink-3);white-space:nowrap}
.mark.warn{color:var(--warn);border-color:var(--warn);background:var(--warn-soft)}
.mark.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.memo-dot{font-size:12px}

.hide .ja, .hide .note{position:relative;color:transparent}
.hide .ja::before,.hide .note::before{content:"";position:absolute;left:-2px;right:-2px;top:1px;bottom:1px;background:var(--sheet);opacity:.9;border-radius:1px}
.hide .note::before{left:5px}
.hide .revealed .ja,.hide .revealed .note{color:inherit}
.hide .revealed .ja::before,.hide .revealed .note::before{display:none}
.hide li.item{cursor:pointer}

.q-head{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3);margin-top:14px}
.q-stem{background:var(--panel);border:1px solid var(--rule);padding:26px 18px;text-align:left;margin-top:6px}
.q-stem .qt{font-family:var(--serif);font-size:clamp(17px,4.6vw,21px);line-height:1.7;word-break:break-word}
.q-stem .refs{font-size:11px;color:var(--ink-3);margin-top:10px;text-align:right}
.oxbtns{display:flex;gap:10px;margin-top:12px}
.oxbtn{flex:1;aspect-ratio:2;border-radius:var(--radius);border:2px solid var(--rule);background:var(--panel);font-size:34px;font-weight:700;font-family:var(--serif)}
.oxbtn.maru{color:var(--ok)}
.oxbtn.batsu{color:var(--red)}
.result-banner{border-radius:var(--radius);padding:14px 16px;margin-top:12px;display:flex;align-items:center;gap:12px;border:1px solid var(--rule)}
.result-banner.ok{background:var(--ok-soft);border-color:var(--ok)}
.result-banner.ng{background:var(--red-soft);border-color:var(--red)}
.result-banner .rmark{font-size:26px;font-family:var(--serif);font-weight:700}
.result-banner.ok .rmark{color:var(--ok)}
.result-banner.ng .rmark{color:var(--red)}
.result-banner .rtxt{font-size:13.5px;font-weight:700}
.q-result{margin-top:10px;background:var(--panel);border:1px solid var(--rule);padding:14px}
.q-result .r-cite{font-size:12px;font-weight:700;color:var(--warn);margin-bottom:6px}
.q-result .r-note{font-size:13px;color:var(--ink);white-space:pre-line;line-height:1.75}
.memo-box{margin-top:12px}
.memo-box label{font-size:11.5px;color:var(--ink-3);display:flex;align-items:center;gap:6px;margin-bottom:5px}
.memo-box textarea{width:100%;min-height:52px;border:1px solid var(--rule);background:var(--panel);padding:8px 10px;font-size:13px;border-radius:var(--radius);resize:vertical}
.memo-saved{font-size:10.5px;color:var(--ok);opacity:0;transition:opacity .3s}
.memo-saved.show{opacity:1}
.grade{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.grade button{border:1px solid var(--rule);background:var(--panel);padding:13px 4px;border-radius:var(--radius);font-size:14px}
.grade button b{display:block;font-size:11px;font-weight:400;color:var(--ink-3);margin-top:2px}
.g2{color:var(--warn)} .g3{color:var(--ok)}
.navrow{display:flex;gap:8px;margin-top:10px}
.navrow button{flex:1;border:1px solid var(--rule);background:var(--panel);padding:11px;border-radius:var(--radius);font-size:14px}
.btn-main{background:var(--ink)!important;color:var(--paper)!important;border-color:var(--ink)!important}
.score{text-align:center;padding:40px 16px;background:var(--panel);border:1px solid var(--rule);margin-top:14px}
.score .big{font-family:var(--serif);font-size:52px;line-height:1}

.stat-card{background:var(--panel);border:1px solid var(--rule);padding:14px;margin-top:12px}
.stat-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--rule-2)}
.stat-row:last-child{border-bottom:none}
.stat-row .nm{width:110px;font-size:12px;flex:none}
.bar{flex:1;height:9px;background:var(--rule-2);display:flex;overflow:hidden}
.bar i{height:100%}
.pc{width:52px;text-align:right;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;flex:none}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--ink-3);margin-top:10px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;margin-right:5px;vertical-align:-1px}
.lg3::before{background:var(--ok)} .lg2::before{background:var(--warn)} .lg0::before{background:var(--rule-2)}
.mini{font-size:12.5px;color:var(--ink-2);line-height:1.75}
.act{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.act button{border:1px solid var(--rule);background:var(--panel);padding:9px 13px;border-radius:var(--radius);font-size:13px}
.act .danger{color:var(--red);border-color:var(--red)}
.empty{text-align:center;color:var(--ink-3);padding:48px 16px;font-size:14px}
footer{text-align:center;font-size:11px;color:var(--ink-3);padding:26px 0 34px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:99px;font-size:13px;z-index:60;opacity:0;pointer-events:none;transition:opacity .18s}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:520px){
  li.item{gap:0 9px;padding:8px}
  .en{font-size:15px}
}

.add-overlay{position:fixed;inset:0;background:rgba(20,20,20,.5);z-index:80;display:none;align-items:flex-end;justify-content:center}
.add-modal{background:var(--panel);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:14px 14px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));box-sizing:border-box}
.add-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.add-title{font-family:var(--serif);font-size:17px;font-weight:700}
.add-body{display:flex;flex-direction:column}
.flabel{font-size:11.5px;color:var(--ink-3);margin-top:12px;margin-bottom:4px;font-weight:700}
.add-body input,.add-body select,.add-body textarea{width:100%;border:1px solid var(--rule);background:var(--paper);color:var(--ink);padding:9px 10px;border-radius:var(--radius);font-size:14px;resize:vertical;font-family:inherit}
.oxbtns.small{display:flex;gap:8px;margin-top:2px}
.oxbtns.small .oxbtn{aspect-ratio:auto;padding:10px;font-size:22px}
.oxbtn.sel.maru{background:var(--ok);border-color:var(--ok);color:#fff}
.oxbtn.sel.batsu{background:var(--red);border-color:var(--red);color:#fff}
.add-foot{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:8px}
.add-foot .danger{color:var(--red);border:1px solid var(--red);background:none;padding:10px 14px;border-radius:var(--radius);font-size:13px}
.badge-custom{display:inline-block;font-size:10px;background:var(--blue);color:#fff;padding:1px 6px;border-radius:99px;margin-right:6px;vertical-align:middle}
.edit-btn{margin-top:6px;font-size:10px}
.stat-card input{width:100%;border:1px solid var(--rule);background:var(--paper);color:var(--ink);padding:9px 10px;border-radius:var(--radius);font-size:13px;margin-top:4px}
.navrow2{display:flex;gap:8px;margin-top:14px}
.navrow2 button{flex:1;border:1px solid var(--rule);background:var(--panel);padding:12px;border-radius:var(--radius);font-size:14px}
.navrow2 button:disabled{opacity:.35;cursor:default}
.memo-preview{cursor:pointer;border-left-color:var(--blue)!important}
.tools button[data-memo-toggle]{margin-top:10px}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="hd">
      <div class="brand">松本レジュメ<small>監査論｜公認会計士試験</small></div>
      <div class="hd-sp"></div>
      <button class="iconbtn" id="btnAdd" title="問題を追加">＋</button>
      <button class="iconbtn" id="btnSheet" aria-pressed="false" title="赤シート（答えを隠す）">赤</button>
      <button class="iconbtn" id="btnTheme" title="表示切替">◐</button>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-view="list">一覧</button>
      <button role="tab" aria-selected="false" data-view="quiz">テスト</button>
      <button role="tab" aria-selected="false" data-view="record">記録</button>
    </div>
  </div>
  <div class="meter" id="meter"></div>
</header>
<main class="wrap" id="app"></main>
<div class="add-overlay" id="addOverlay"></div>
<footer>松本レジュメ（監査論・短答対策講義レジュメ問題演習・全11章1,580問）</footer>
<div class="toast" id="toast"></div>

<script id="quiz-data" type="application/json">[{"n": 1, "name": "監査総論", "qs": [{"l": 1, "m": "監査総論", "sb": "", "i": "B", "r": "", "q": "株式会社において，経営者は株主が拠出した資本を適切に管理・運用する受託責任を負い，この結果について株主に会計報告を行う。この会計報告に対する公認会計士の監査は，経営者の説明責任の適切な履行に貢献する。", "a": true, "c": "R５Ⅱ①ア", "e": "財務諸表監査制度が企業内容開示制度の実効性を担保していることから，本肢は正しいといえる。"}, {"l": 2, "m": "監査総論", "sb": "", "i": "A", "r": "", "q": "資本市場における財務諸表監査の目的は，企業の財務内容に関する情報を提供することではなく，当該情報の信頼性を担保することである。", "a": true, "c": "H31Ⅱ②ウ", "e": ""}, {"l": 3, "m": "監査総論", "sb": "", "i": "A", "r": "", "q": "財務諸表監査の目的は，経営者が作成した財務諸表に対して，監査人が独立した立場から，一般に公正妥当と認められる監査の基準に基づいて監査を実施し，自ら収集・評価した証拠のみに基づいて意見を表明することにある。", "a": true, "c": "H24Ⅱ②ア", "e": ""}, {"l": 4, "m": "監査総論", "sb": "", "i": "A", "r": "", "q": "財務諸表の表示が適正である旨の監査人の意見は，財務諸表には「全体として重要な虚偽の表示がないこと」について合理的な保証を得たとの監査人の判断を含んでいるが，財務諸表がすべての重要な点において適正に表示していることを意味するものではない。", "a": false, "c": "H26Ⅱ①ア", "e": "監査人が表明する意見は，財務諸表が全ての重要な点において適正に表示しているかどうかに関する意見である。"}, {"l": 5, "m": "監査総論", "sb": "", "i": "A", "r": "", "q": "財務諸表監査の目的は，不正を発見又は防止することにあるが，すべての不正が発見できなかったとしても，最終的に財務諸表が全体として重要な虚偽の表示がない状態であれば，監査の目的は達成されたことになる。", "a": false, "c": "H24Ⅱ②エ", "e": "監査の目的は，不正の発見又は防止することではない。"}, {"l": 6, "m": "監査総論", "sb": "", "i": "A", "r": "", "q": "財務諸表の表示が適正である旨の監査人の意見は，監査人が実施した監査手続の範囲では，財務諸表における重要な虚偽の表示を示す事項は検出されなかったことを意味するものである。", "a": false, "c": "H28Ⅰ⑱イ／H25Ⅰ⑮ア", "e": "財務諸表が適正である旨の監査人の意見は，財務諸表に全体として重要な虚偽表示がないかどうかについて合理的な保証を得たことを意味するものであって，監査人が実施した監査手続の範囲に限定して重要な虚偽表示の有無を保証するものではない。"}, {"l": 7, "m": "監査総論", "sb": "", "i": "A", "r": "", "q": "被監査会社の財務諸表は当該会社の財政状態，経営成績及びキャッシュ・フローの状況を適切に表示しているとの監査人の意見には，当該会社の安全性及び収益性に対する監査人の評価が含まれている。", "a": false, "c": "R５Ⅰ①エ", "e": "監査意見は，企業の将来の存続可能性や経営者による業務遂行の効率性や有効性などを保証するものではない。"}, {"l": 8, "m": "監査総論", "sb": "", "i": "A", "r": "", "q": "財務報告は，企業の財政状態，経営成績及びキャッシュ・フローの状況に関する情報を財務諸表の利用者に提供することを目的とする。監査人は，財務諸表の適正表示に関する意見を表明することで，企業の財政状態，企業活動の有効性や効率性等について保証を与えることになる。", "a": false, "c": "R２Ⅱ①ア", "e": "同上"}, {"l": 9, "m": "監査総論", "sb": "", "i": "A", "r": "", "q": "公認会計士は，財務諸表に対する監査意見を形成する過程において被監査会社の内部統制の整備及び運用状況を評価するが，財務諸表の表示が適正である旨の監査意見は，内部統制が有効に整備及び運用されていることを意味するものではない。", "a": true, "c": "H29Ⅰ①ア／H27Ⅰ①イ", "e": ""}, {"l": 10, "m": "監査総論", "sb": "", "i": "A", "r": "", "q": "公認会計士による財務諸表の監査は，財務諸表の信頼性を担保するための制度であって，被監査会社の経営が有効かつ効率的に行われていることや，被監査会社において法令等が遵守されていることを担保するための制度ではない。", "a": true, "c": "H29Ⅰ①イ", "e": ""}, {"l": 11, "m": "監査総論", "sb": "", "i": "A", "r": "", "q": "監査報告書は，財務諸表がすべての重要な点において適正に表示しているかどうかについての意見を表明するものであり，財務諸表における個々の金額や注記の正確性を保証するものではない。", "a": true, "c": "H24Ⅰ⑱エ", "e": ""}, {"l": 12, "m": "監査総論", "sb": "", "i": "A", "r": "", "q": "財務諸表監査の目的には，財務諸表に，財務諸表利用者の経済的な意思決定に影響を与えると合理的に見込まれる虚偽表示がないことについて，監査人が意見として表明することが含まれる。", "a": true, "c": "R６Ⅰ①ア", "e": ""}, {"l": 13, "m": "監査総論", "sb": "", "i": "A", "r": "", "q": "監査の計画と実施，及び識別した虚偽表示が監査に与える影響と未修正の虚偽表示が財務諸表に与える影響の評価において，重要性の概念が適用されるため，監査人は，財務諸表全体にとって重要でない虚偽表示を発見する責任を負うものではない。", "a": true, "c": "H26Ⅱ①ウ", "e": ""}, {"l": 14, "m": "監査総論", "sb": "", "i": "A", "r": "", "q": "「第一監査の目的」では，財務諸表について表示が適正である旨の意見を表明する場合，財務諸表に全体として重要な虚偽の表示がないことについて合理的な保証を得る必要がある旨の規定をおいているため，監査人は，重要な虚偽の表示がないことについて絶対的ではないが相当程度の心証を得ることが必要になる。", "a": true, "c": "H28Ⅰ⑫イ／H24Ⅱ②ウ", "e": ""}, {"l": 15, "m": "監査総論", "sb": "", "i": "A", "r": "", "q": "「監査の目的」では，財務諸表の監査の目的が示されていることに加え，財務諸表の作成に対する経営者の責任と，当該財務諸表の適正表示に関する意見表明に対する監査人の責任との区別が示されている。", "a": true, "c": "H29Ⅱ⑪ウ／H28Ⅰ①ウ", "e": ""}, {"l": 16, "m": "監査総論", "sb": "", "i": "A", "r": "", "q": "財務諸表の作成に対する経営者の責任と，当該財務諸表の適正表示に関する意見表明に対する監査人の責任との区別については，監査基準に「第一監査の目的」が追加された際，新たに明記された。", "a": true, "c": "R４Ⅰ⑪イ", "e": ""}, {"l": 17, "m": "監査総論", "sb": "", "i": "A", "r": "", "q": "監査基準に監査の目的が規定された理由の一つに，利害関係者を啓発することによって期待ギャップの縮小を図り，財務諸表監査の信頼性を回復させることが挙げられる。", "a": true, "c": "H31Ⅱ⑫ア", "e": ""}, {"l": 18, "m": "監査総論", "sb": "", "i": "A", "r": "", "q": "我が国においては，監査基準が最初に公表されたときから，監査の目的が明確に規定されていたので，監査の役割に関して，いわゆる期待のギャップは生じなかった。", "a": false, "c": "H24Ⅰ⑨ウ", "e": "監査の目的は，平成１４年の監査基準の改訂によりはじめて明確にされた。"}, {"l": 19, "m": "監査総論", "sb": "", "i": "A", "r": "", "q": "我が国の監査基準では，いわゆる「期待のギャップ」については言及されていないが，「二重責任の原則」を明示することによってこれを縮小する立場がとられている。", "a": false, "c": "H25Ⅰ⑧イ", "e": "「期待ギャップ」について，監査基準上の規定はたしかに存在しないが，監査基準の前文（平成１４年の監査基準の改訂前文等）で言及されているため，本肢は誤りとなる。なお，監査基準の「監査の目的」で二重責任の原則が明示されているが，この「監査の目的」は「期待ギャップ」の縮小のために明示されたものであることから，後半の記述は正しいといえる。"}, {"l": 20, "m": "監査総論", "sb": "", "i": "A", "r": "", "q": "監査における保証が，絶対的でなく合理的な保証に留まるのは，財務諸表には将来の見積もりの要素が含まれるといった財務報告の性格や，財務諸表監査における監査手続では必ずしも不正による重要な虚偽表示を発見できるわけではないといった監査の固有の限界があるためである。", "a": true, "c": "R５Ⅰ①ウ／H31Ⅱ①イ", "e": ""}, {"l": 21, "m": "監査総論", "sb": "", "i": "A", "r": "", "q": "監査を合理的な期間内に合理的なコストで実施する必要性など，財務諸表監査には固有の限界があるため，監査人が結論を導き，意見表明の基礎となる監査証拠の大部分は，絶対的というより心証的なものとなる。", "a": true, "c": "H31Ⅰ①エ／H26Ⅱ①エ", "e": ""}, {"l": 22, "m": "監査総論", "sb": "", "i": "A", "r": "", "q": "監査の固有の限界があるため，監査人が一般に公正妥当と認められる監査の基準に準拠して適切に監査計画を策定し監査を実施しても，重要な虚偽表示が発見されないというリスクを零にすることは不可能である。", "a": true, "c": "H28Ⅱ②ア／H25Ⅰ①ア", "e": ""}, {"l": 23, "m": "監査総論", "sb": "", "i": "A", "r": "", "q": "多くの財務諸表項目には，主観的な判断や評価又は不確実性が関連しており，合理的と考えられる解釈や判断に幅が存在することがあるので，このような財務報告の性質が原因となって，監査の固有の限界が生じている。", "a": true, "c": "H28Ⅱ②イ", "e": ""}, {"l": 24, "m": "監査総論", "sb": "", "i": "A", "r": "", "q": "一部の財務諸表項目には，財務諸表項目の残高に影響を与える固有の変動要因があり，その影響は，追加的な監査手続を実施してもなくすことができない。", "a": true, "c": "R７Ⅰ⑪イ", "e": ""}, {"l": 25, "m": "監査総論", "sb": "", "i": "A", "r": "", "q": "取引数が少なく精査を行うことが可能であり，かつ，財務諸表に見積りの要素が含まれていなければ，監査人は，財務諸表の適正性について，絶対的な保証を与えることができる。", "a": false, "c": "R６Ⅰ①ウ", "e": "監査の固有の限界には，監査手続の性質を原因した限界もあるため，本肢の状況でも絶対的な保証は得られない。"}, {"l": 26, "m": "監査総論", "sb": "", "i": "A", "r": "", "q": "経営者及びその他の者は，意図的であるかどうかにかかわらず，監査に必要な情報を提供しない可能性があるが，監査人は，監査役等とコミュニケーションを行うことで情報の網羅性に確信をもつことができる。", "a": false, "c": "R７Ⅰ⑪ウ", "e": "監査人は，監査役等と適切にコミュニケーションを行ったとしても，情報の網羅性に確信をもつことはできない。"}, {"l": 27, "m": "監査総論", "sb": "", "i": "A", "r": "", "q": "監査証拠を入手するために実施する監査手続は，意図的な虚偽表示を発見するために有効でないことがあるが，監査人は，記録や証憑書類の鑑定の技能を習得した専門家でもあるので，入手した監査証拠の正当性を判断することができる。", "a": false, "c": "R７Ⅰ⑪エ", "e": "監査人は，記録や証憑書類の鑑定の技能を習得していないため，正当でない監査証拠について，正当性があると信じてしまうことがある。"}, {"l": 28, "m": "監査総論", "sb": "", "i": "A", "r": "", "q": "監査人による監査証拠の入手には，法令違反に関する捜査はできないといった法令上の限界のために監査の固有の限界が生じるが，監査実施のための十分な時間と資源を利用できる場合，監査手続の性質を原因とする監査の固有の限界は生じない。", "a": false, "c": "H28Ⅱ②ウ", "e": "十分な時間と資源を利用して監査を実施しても，監査手続の性質を原因とする監査の固有の限界は解消できない。"}, {"l": 29, "m": "監査総論", "sb": "", "i": "A", "r": "", "q": "監査は合理的な期間内に合理的な費用の範囲で実施されなければならないが，監査人は，監査手続の実施が容易でないこと又は費用の制約があるために，心証を形成するに至らない監査証拠しか得られなかった場合には，当該証拠に依拠して結論に至ることはできない。", "a": true, "c": "H24Ⅱ⑭オ", "e": ""}, {"l": 30, "m": "監査総論", "sb": "", "i": "A", "r": "", "q": "監査人は，監査を合理的な期間内に合理的なコストで実施する必要があり，全ての事項を徹底的に追及することは不可能なので，心証を形成するに至らない監査証拠に依拠することが正当化される場合がある。", "a": false, "c": "H28Ⅱ②エ", "e": "心証を形成するに至らない監査証拠に依拠することが正当化されることはない。"}, {"l": 31, "m": "監査総論", "sb": "", "i": "A", "r": "", "q": "監査には固有の限界があるため，監査手続の実施が容易でないことを理由として代替手続のない監査手続を省略することができる場合がある。", "a": false, "c": "H29Ⅱ①ア", "e": "代替手続のない監査手続を省略することは認められない。"}, {"l": 32, "m": "監査総論", "sb": "", "i": "A", "r": "", "q": "監査人は，監査証拠を入手するためのコストと当該監査証拠の適合性及び証明力とバランスを考慮して監査手続を選択することから，代替手続のない監査手続の場合でも，そのコストが大きければ，それを理由として当該手続を省略することができる。", "a": false, "c": "H23Ⅱ⑪イ", "e": "同上"}, {"l": 33, "m": "監査総論", "sb": "", "i": "A", "r": "", "q": "監査人は，監査を合理的な期間内に合理的な費用で実施しなければならないが，適切な監査計画を策定することにより，監査実施のための十分な時間と資源を利用できるようになる。", "a": true, "c": "R７Ⅰ⑪ア", "e": ""}, {"l": 34, "m": "監査総論", "sb": "", "i": "A", "r": "", "q": "監査人は，一般に公正妥当な監査の基準に準拠して，全体としての財務諸表に重要な虚偽表示がないことについての合理的な保証を得たが，重要な虚偽表示が事後的に発見された場合には，一般に公正妥当と認められる監査の基準に準拠して監査が実施されなかったとみなされる。", "a": false, "c": "H31Ⅱ⑫エ／H26Ⅰ⑤イ", "e": "重要な虚偽表示が事後的に発見されたとしても，そのこと自体が，一般に公正妥当と認められる監査の基準に準拠して監査を実施しなかったことを示すものではない。"}, {"l": 35, "m": "監査総論", "sb": "", "i": "A", "r": "", "q": "監査人は，財務諸表に全体として重要な虚偽の表示がないことについて合理的な保証を得る責任を負っており，財務諸表の重要な虚偽の表示を発見できなかったとしても，独立性を保持するとともに，適切な水準の正当な注意を払い，職業的懐疑心を保持して監査を実施したのであれば，責任を問われない可能性がある。", "a": true, "c": "H27Ⅰ①ア／H27Ⅱ②イ", "e": "末尾の「可能性がある」がいやらしい。監査人の責任の有無は，本肢の内容が法廷の場で「立証されるか否かで決まる」ことから，末尾をこのような表現にしたと思われる。"}, {"l": 36, "m": "監査総論", "sb": "", "i": "A", "r": "", "q": "二重責任の原則は，経営者による財務諸表の作成・開示の責任を監査人が担ってはならないということを意味している。", "a": true, "c": "H24Ⅱ①ア", "e": ""}, {"l": 37, "m": "監査総論", "sb": "", "i": "A", "r": "", "q": "財務諸表の作成者である経営者とその監査人である公認会計士との間で，責任を分担することを意味する二重責任の原則は，利用者の意思決定に有用な財務諸表を提供し，財務諸表監査制度の社会的信頼を得るために必要不可欠な原則である。", "a": true, "c": "R６Ⅱ②エ／R５Ⅰ①ア／H29Ⅰ①エ", "e": ""}, {"l": 38, "m": "監査総論", "sb": "", "i": "A", "r": "", "q": "監査人は，被監査会社の財務情報システムの整備及び管理業務を受託したとしても，そのこと自体は経営者の責任である財務諸表の作成に直接関与したことにはならないため，二重責任の原則には抵触しない。", "a": false, "c": "H27Ⅱ①ア", "e": "被監査会社の財務情報システムは，財務諸表の作成に密接に関連する内部統制であるため，監査人が当該システムの整備や管理業務を担うことは二重責任の原則に抵触する。"}, {"l": 39, "m": "監査総論", "sb": "", "i": "A", "r": "", "q": "二重責任の原則は，財務諸表の作成に対する経営者の責任と当該財務諸表に関する監査意見に対する監査人の責任との区別を求める原則であるが，前者には，会計情報システムの整備又は管理に関する責任が含まれる。", "a": true, "c": "R７Ⅰ②ア", "e": ""}, {"l": 40, "m": "監査総論", "sb": "", "i": "A", "r": "", "q": "一般に公正妥当と認められる監査の基準に準拠して行われた財務諸表監査は，経営者又は監査役等の責任を軽減するものではない。", "a": true, "c": "R４Ⅱ⑫エ／R３①ア／R２Ⅱ②ア", "e": ""}, {"l": 41, "m": "監査総論", "sb": "", "i": "A", "r": "", "q": "経営者の責任と監査人の責任が明確に区別されず，財務諸表の作成過程に監査人自身が関与することになれば，監査人の結論の客観性が失われ，監査人による監査が自己監査になるため，これを防ぐことに二重責任の原則の意義がある。", "a": true, "c": "R３②ア", "e": ""}, {"l": 42, "m": "監査総論", "sb": "", "i": "B", "r": "", "q": "経営者は，一般に公正妥当と認められる企業会計の基準に準拠して財務諸表を作成する責任を負うものであるが，重要な虚偽表示のない財務諸表を作成するために必要と判断する内部統制を整備及び運用することに対しても責任を負う。", "a": true, "c": "H26Ⅱ②ア", "e": ""}, {"l": 43, "m": "監査総論", "sb": "", "i": "B", "r": "", "q": "経営者は，自社に関する重要な機密情報を除き，財務諸表の作成に関連すると認識している全ての情報を監査人に提供しなければならない。", "a": false, "c": "R２Ⅱ②エ／H26Ⅱ②イ", "e": "経営者は，自社に関する重要な機密情報も含めて，全ての情報を提供する責任を負う。"}, {"l": 44, "m": "監査総論", "sb": "", "i": "B", "r": "", "q": "経営者は，監査人が監査目的に関連して追加的な情報の提供を依頼した場合，それがいかなる情報であっても提供する責任を負う。", "a": true, "c": "H26Ⅱ②エ", "e": "経営者は，全ての追加的な情報を提供する責任がある。"}, {"l": 45, "m": "監査総論", "sb": "", "i": "B", "r": "", "q": "経営者は，財務諸表が適正に作成されていることを裏付ける監査証拠を入手するために必要であると監査人が判断した企業構成員及び取引先企業に対し，質問や面談の機会を制限なく提供する責任を負う。", "a": false, "c": "H26Ⅱ②ウ", "e": "経営者は，取引先企業に対する質問や面談の機会を提供する責任までは負わない。"}, {"l": 46, "m": "監査総論", "sb": "", "i": "B", "r": "", "q": "経営者が重要な虚偽表示のない財務諸表を作成するため，自らが必要と判断した内部統制を整備及び運用する責任があることに合意していることは，監査人が監査を受嘱する前提の一つである。", "a": true, "c": "R２Ⅱ②ウ", "e": ""}, {"l": 47, "m": "監査総論", "sb": "", "i": "A", "r": "", "q": "二重責任の原則のもとでは，財務諸表の作成に対する経営者の責任と，当該財務諸表に対する意見を表明する監査人の責任が区別されるため，監査人は，自らが検出した経営者による重要な会計基準の適用の誤りについて，それを修正するよう指導することはできない。", "a": false, "c": "H25Ⅱ①ア／H24Ⅱ①エ", "e": "監査人による指導的機能の発揮は，二重責任の原則に抵触するものではない。"}, {"l": 48, "m": "監査総論", "sb": "", "i": "A", "r": "", "q": "監査人は，監査実施中に不適切な会計処理を発見した場合，当該会計処理を修正するように経営者に指導し，経営者がそれを受け入れて修正したとしても，受け入れると判断したのは経営者であるため，財務諸表の作成に直接関与したことにはならず，二重責任の原則には抵触しない。", "a": true, "c": "H27Ⅱ①イ", "e": ""}, {"l": 49, "m": "監査総論", "sb": "", "i": "A", "r": "", "q": "監査人が財務諸表の適正表示のために必要であると判断して，経営者に対して財務諸表の注記として追加情報の開示を促したことを受けて，経営者がそれに従い追加情報を開示したとしても，そのことが直ちに二重責任の原則に反することにはならない。", "a": true, "c": "R７Ⅰ②ウ", "e": "なお，本肢の「追加情報の開示」は，適正表示の枠組みの場合に行う追加的な注記のこと。👉講義レジュメ①-1-8"}, {"l": 50, "m": "監査総論", "sb": "", "i": "A", "r": "", "q": "監査人が，財務諸表監査の実施過程において発見した財務諸表上の不適切な事項について，経営者に対し訂正を勧告し，経営者が勧告を受け入れた場合，訂正された表示に関しては，監査人が責任を負う。", "a": false, "c": "H31Ⅱ②イ", "e": "監査人の訂正勧告を受け入れるか否かは経営者が決定する以上，訂正された表示に関する責任は経営者にあり，監査人に転嫁されることはない。"}, {"l": 51, "m": "監査総論", "sb": "", "i": "A", "r": "", "q": "財務諸表監査には，財務諸表とそのもととなった会計処理を批判的に検討する機能及び当該会計処理に対し助言する機能があるが，被監査会社の会計システムの構築支援を行うことは，後者の機能に該当する。", "a": false, "c": "H31Ⅱ②ア", "e": "被監査会社の会計システムの構築支援は，公認会計士法上の大会社等に対して同時提供が禁止されている業務であるため，助言機能の範疇を超えるものと考えるべきである。"}, {"l": 52, "m": "監査総論", "sb": "", "i": "A", "r": "", "q": "公認会計士監査は，財務情報の信頼性を担保する役割があるが，その過程で発見した内部統制の不備や不正行為の是正を促す機能を有することから，コーポレート・ガバナンスを支援するという役割も有している。", "a": true, "c": "R５Ⅱ①イ", "e": "なお，ガバナンスの詳細は，講義レジュメ③-4-6参照。"}, {"l": 53, "m": "監査総論", "sb": "", "i": "B", "r": "", "q": "監査サービスの受益者は，監査契約により監査報酬を支払う主体であり，それ以外の財務諸表利用者が監査サービスの受益者になることはない。", "a": false, "c": "H28Ⅰ①エ", "e": "監査サービスの受益者は，監査報酬を支払う被監査会社のみならず，財務諸表利用者も含まれる。"}, {"l": 54, "m": "監査基準論", "sb": "", "i": "A", "r": "", "q": "一般に公正妥当と認められる監査の基準に準拠して作成される監査報告書には，経営者の責任について記載する区分が設けられるが，一般に公正妥当と認められる監査の基準自体は，財務諸表監査における経営者の責任を定めるものではない。", "a": true, "c": "H26Ⅰ⑤エ", "e": ""}, {"l": 55, "m": "監査基準論", "sb": "", "i": "A", "r": "", "q": "「監査基準」は法令ではないものの，「財務諸表等の監査証明に関する内閣府令」では一般に公正妥当と認められる監査の基準の１つとされており，金融商品取引法に基づく財務諸表の監査においては，法令により遵守することが求められている監査人の行為基準である。", "a": true, "c": "H28Ⅰ⑪エ／H24Ⅰ⑨オ", "e": "「監査基準」自体が法令でない点と，「監査基準」を遵守すべきことが法令で定められている点を混同しないこと。"}, {"l": 56, "m": "監査基準論", "sb": "", "i": "A", "r": "", "q": "公認会計士又は監査法人は，金融商品取引法に基づき上場会社の財務諸表の監査を行うに当たって，企業会計審議会が公表する監査基準にしたがって監査を行うべきことが法令に定められている。", "a": true, "c": "R２Ⅰ⑫ア", "e": ""}, {"l": 57, "m": "監査基準論", "sb": "", "i": "A", "r": "", "q": "監査報告書で言及されている「我が国において一般に公正妥当と認められる監査の基準」という文言は，企業会計審議会が公表している監査基準をいう。", "a": false, "c": "H26Ⅰ⑤ウ", "e": "企業会計審議会が公表する監査基準の他に，日本公認会計士協会の指針も含まれる。"}, {"l": 58, "m": "監査基準論", "sb": "", "i": "A", "r": "", "q": "監査に関する品質管理基準は，監査基準とともに一般に公正妥当と認められる監査の基準を構成し，監査基準と一体となって適用されるものであり，財務諸表の監査を実施する監査事務所及び監査実施者に，監査業務の質を合理的に確保することを求めるものである。", "a": true, "c": "H30Ⅱ⑨ア／H25Ⅰ⑨ア", "e": ""}, {"l": 59, "m": "監査基準論", "sb": "", "i": "A", "r": "", "q": "企業会計審議会が公表する「監査に関する品質管理基準」は，公認会計士による監査業務の質を合理的に確保するためのものであり，一般に公正妥当と認められる監査の基準を構成することから，法令によって強制されなくとも，公認会計士はこれを遵守しなければならない。", "a": true, "c": "H27Ⅱ⑩ウ", "e": ""}, {"l": 60, "m": "監査基準論", "sb": "", "i": "A", "r": "", "q": "監査人が財務諸表監査を行うに当たり，監査における不正リスク対応基準は，常に監査基準及び監査に関する品質管理基準とともに一般に公正妥当と認められる監査の基準を構成するため，監査基準及び監査に関する品質管理基準と一体となって適用されなければならない。", "a": false, "c": "H31Ⅰ⑪ア／H29Ⅰ⑪エ", "e": "法令で要求される場合にのみ遵守する不正リスク対応基準は，常に一般に公正妥当と認められる監査の基準を構成するものではない。"}, {"l": 61, "m": "監査基準論", "sb": "", "i": "A", "r": "", "q": "「我が国における一般に公正妥当と認められる監査の基準」には，全ての金融商品取引法監査において，監査における不正リスク対応基準及びこれを具体化した実務指針が含まれる。", "a": false, "c": "R４Ⅰ①ア", "e": "同上"}, {"l": 62, "m": "監査基準論", "sb": "", "i": "A", "r": "", "q": "不正リスク対応基準は，不正による重要な虚偽表示のリスクに対応した手続を明確化するとともに，一定の場合には監査手続をより慎重に実施することを求めるものであり，一般に公正妥当と認められる監査の基準を構成することから，法令によって強制されなくとも，全ての監査において，監査人はこれを遵守しなければならない。", "a": false, "c": "R２Ⅰ⑳ア／H27Ⅱ⑩エ", "e": "同上"}, {"l": 63, "m": "監査基準論", "sb": "", "i": "A", "r": "", "q": "日本公認会計士協会の各委員会が公表する報告書又は実務指針は，我が国における一般に公正妥当と認められる監査の基準の一部を構成しているが，企業会計審議会の設定する監査基準との間には，同じ事項について用語や表現が異なるものがある。", "a": true, "c": "H29Ⅰ⑪ア", "e": "例えば，監査基準上の「他の監査人」という用語は，監基報では「構成単位の監査人」と表現されている。"}, {"l": 64, "m": "監査基準論", "sb": "", "i": "A", "r": "", "q": "我が国の一般に公正妥当と認められる監査の基準には，企業会計審議会による監査基準と日本公認会計士協会による指針（監査実務指針）が含まれる。日本公認会計士協会は監査基準報告書のほか，監査基準を理解し実施するために参考となる文書を公表しているが，これらの全てが監査実務指針を構成する。", "a": false, "c": "R６Ⅰ①エ", "e": "監査基準を理解し実施するために参考となる文書（実務ガイダンス，周知文書，研究文書等）は，監査実務指針を構成しない。"}, {"l": 65, "m": "監査基準論", "sb": "", "i": "A", "r": "", "q": "監査実務指針を実務に適用するに当たって，日本公認会計士協会が公表する監査に関する研究報告や研究資料及び一般的に認められている監査実務慣行が参考になることがあるため，これらは監査実務指針の一部を構成するものとみなされる。", "a": false, "c": "H29Ⅱ①エ／H27Ⅱ⑩ア", "e": "監査に関する研究報告や研究資料及び一般的に認められている監査実務慣行は，監査実務指針に含まれない。"}, {"l": 66, "m": "監査基準論", "sb": "", "i": "A", "r": "", "q": "公認会計士又は監査法人は，金融商品取引法に基づき上場会社の財務諸表の監査を行うに当たって，日本公認会計士協会が定める監査の実務指針にしたがって監査を行っているが，この監査の実務指針は監査の慣行に当たり，法令上は，こうした監査の慣行に従うことまでは求められていない。", "a": false, "c": "R２Ⅰ⑫イ", "e": "監査の実務指針は監査の慣行には当たらない。"}, {"l": 67, "m": "監査基準論", "sb": "", "i": "A", "r": "", "q": "我が国における一般に公正妥当と認められる監査の基準には，企業会計審議会が設定する監査基準等が含まれるが，期中レビューは監査ではないため，同様に企業会計審議会が設定していても期中レビュー基準は含まれない。", "a": false, "c": "H31Ⅱ⑪ウ", "e": "我が国における一般に公正妥当と認められる監査に関する基準には，企業会計審議会が設定する期中レビュー基準も含まれるため，本肢は誤りとして判断する。"}, {"l": 68, "m": "監査基準論", "sb": "", "i": "A", "r": "", "q": "監査チーム及び審査担当者が従うべき職業倫理に関する規定は，日本公認会計士協会が公表する会則，倫理規則及びその他の倫理に関する規定のみである。", "a": false, "c": "H30Ⅱ②ア", "e": "職業倫理に関する規定には，法令である公認会計士法・同施行令・同施行規則等も含まれることに注意する。"}, {"l": 69, "m": "監査基準論", "sb": "", "i": "A", "r": "", "q": "我が国における職業倫理に関する規定は，公認会計士法・同施行令・同施行規則，並びに日本公認会計士協会が公表する会則，倫理規則及びその他の倫理に関する規定をいい，倫理規則は国際会計士連盟の「職業会計士に対する倫理規程」に対応している。", "a": true, "c": "H26Ⅰ①ア", "e": ""}, {"l": 70, "m": "監査基準論", "sb": "", "i": "A", "r": "", "q": "財務諸表監査が財務諸表の信頼性を保証する制度として成立するには，その品質を社会的な合意に基づいた一定の水準に保つために，監査を実施する監査人の資格や条件，監査の実施や報告に際しての要求事項等を社会的な規範として確立することが必要であり，その規範の一つが監査基準である。", "a": true, "c": "H31Ⅱ⑪ア", "e": ""}, {"l": 71, "m": "監査基準論", "sb": "", "i": "A", "r": "", "q": "かつて，監査基準は，監査実務の中に慣習として発達したもののなかから，一般に公正妥当と認められたところを帰納要約した原則であると述べられていた。現在の監査基準の設定においては，監査基準は，国際的な議論の動向や，日本の公認会計士監査をより実効性のあるものとする観点から改訂されることもある。", "a": true, "c": "H29Ⅰ⑪ウ", "e": ""}, {"l": 72, "m": "監査基準論", "sb": "", "i": "A", "r": "", "q": "「監査基準」は，国際的にも遜色のない監査の水準を達成するための基準を設定することを目的の一つとしているため，継続的に見直しを行い，国際的な監査の基準との整合性を高めるための改訂を実施してきている。", "a": true, "c": "H28Ⅰ⑪ウ", "e": ""}, {"l": 73, "m": "監査基準論", "sb": "", "i": "A", "r": "", "q": "監査基準は，監査の規範を演繹的方法により体系化したものであって，法令と同等の強制力はないものの，職業的監査人が監査の実施に当たって常に遵守しなければならない実務上の指針であるという点に主たる意義がある。", "a": false, "c": "H25Ⅰ⑧ア", "e": "監査基準は，監査実務を帰納的方法により体系化したものである。また，監査基準は，監査に関する根本的な原則を定めたものであって，実務上の指針ではない。"}, {"l": 74, "m": "監査基準論", "sb": "", "i": "A", "r": "", "q": "「監査基準」は，監査人が有効かつ効率的に財務諸表の監査を実施するために遵守すべき一般に公正妥当かつ理論的な監査実施規範を，演繹的方法により体系化したものである。", "a": false, "c": "H28Ⅰ⑪ア", "e": "同上"}, {"l": 75, "m": "監査基準論", "sb": "", "i": "A", "r": "", "q": "監査基準は，監査実務の中に慣習として発達したものをその源泉としているところから，監査実務の中で広く行われていない監査手続が新たに監査基準の中に含められることはない。", "a": false, "c": "H24Ⅱ⑦ア", "e": "近年では，演繹的方法による改訂により，理論的な観点から新たな監査手続が監査基準に含められることがある。"}, {"l": 76, "m": "監査基準論", "sb": "", "i": "A", "r": "", "q": "監査基準は，一般に公正妥当と認められたものであることから，財務諸表監査が監査基準に従って実施された場合には，被監査会社の経営者のみならず，財務諸表利用者もその結果を妥当なものとして受け入れなければならない。", "a": true, "c": "H24Ⅱ⑦イ", "e": ""}, {"l": 77, "m": "監査基準論", "sb": "", "i": "A", "r": "", "q": "「監査基準」は，国際監査基準を範として設定されたものであり，職業的監査人は，財務諸表の監査を行うに当たり，法令によって強制されなくとも，常にこれを遵守しなければならない。", "a": false, "c": "H28Ⅱ⑪ア", "e": "監査基準は，国際監査基準を範として設定されたものではなく，監査実務を帰納要約して設定されたものである。"}, {"l": 78, "m": "監査基準論", "sb": "", "i": "A", "r": "", "q": "企業会計審議会によって監査基準が設定された当初，監査基準は，監査制度の確立と維持を目的としていたことから，依頼人と一般関係人の二者間の利害を合理的に調整する機能を監査に付与するものであった。", "a": false, "c": "H26Ⅰ⑤ア", "e": "監査基準は，監査人，依頼人及び一般関係人の三者間の利害を合理的に調整するものである。"}, {"l": 79, "m": "監査基準論", "sb": "", "i": "A", "r": "", "q": "監査実施基準は，個々の監査人が有する監査の能力と経験には差異があることを踏まえて，監査人による監査手続の選択適用の一切を監査人の自由に委ねることを防ぐことを１つの目的として設定された。", "a": true, "c": "H28Ⅱ⑪イ", "e": ""}, {"l": 80, "m": "監査基準論", "sb": "", "i": "A", "r": "", "q": "監査報告基準は，監査報告書の記載要件について一定の基準を設けることによって，利害関係人の利益を擁護することだけでなく，監査人自身の利益を擁護することも目的として設定された。", "a": true, "c": "H28Ⅱ⑪ウ", "e": ""}, {"l": 81, "m": "監査基準論", "sb": "", "i": "A", "r": "", "q": "監査基準は，財務諸表を巡る利害関係者間の利害を調整するものであって，監査人の立場からすれば，自己の責任が過重になることを避け，責任の範囲を明確にするものである。", "a": true, "c": "R４Ⅱ⑫イ", "e": ""}, {"l": 82, "m": "監査基準論", "sb": "", "i": "A", "r": "", "q": "公認会計士による財務諸表監査の制度は，企業内容に関する情報を提供することを第一義的な目的とするものではないが，財務諸表の信頼性を担保することにより，企業による財務状況の的確な把握と適正な開示を確保し，適正・円滑な経済活動を支えるインフラストラクチャーとしての役割を担っている。", "a": true, "c": "R４Ⅰ①ウ／H28Ⅰ①イ", "e": ""}, {"l": 83, "m": "監査基準論", "sb": "", "i": "A", "r": "", "q": "監査基準は，財務諸表監査に従事する監査人の行為を規制する原則であるところから，財務諸表監査とは保証水準の異なる期中レビューには適用されることはない。", "a": false, "c": "H24Ⅱ⑦ウ", "e": "監査基準の一般基準については，期中レビューにも適用される。"}, {"l": 84, "m": "監査基準論", "sb": "", "i": "A", "r": "", "q": "監査基準は，監査実務の中に慣習として発達したものの中から一般に公正妥当と認められたものを帰納要約したものであり，公認会計士や監査法人が実施する法定された財務諸表監査のみに対する質的下限を定めたものである。", "a": false, "c": "H31Ⅱ⑪イ／R４Ⅱ⑫ア", "e": "監査基準は，法定監査のみならず，公認会計士が実施する全ての財務諸表監査の質的下限を定めたものである。"}, {"l": 85, "m": "監査基準論", "sb": "", "i": "A", "r": "", "q": "企業会計審議会が公表する「監査基準」は，公認会計士が財務諸表の監査を行うに当たって，法令によって強制されなくとも，常にこれを遵守しなければならないものである。すなわち，「監査基準」は，財務諸表の種類や意見として表明すべき事項を異にする監査を含め，公認会計士による財務諸表の監査に共通して適用される。", "a": true, "c": "H27Ⅱ⑩イ", "e": ""}, {"l": 86, "m": "監査基準論", "sb": "", "i": "A", "r": "", "q": "「監査の目的」が示す枠組みは，金融商品取引法に基づく監査のみならず，会社法に基づいて公認会計士が会計監査人として行う計算書類の監査等，公認会計士監査の全てに共通するものである。", "a": true, "c": "H29Ⅱ⑪ア", "e": ""}, {"l": 87, "m": "監査基準論", "sb": "", "i": "A", "r": "", "q": "監査基準は，金融商品取引法に基づく監査及び会社法に基づく会計監査人監査のみならず，労働組合法に基づく監査及び私立学校振興助成法に基づく監査においても適用される。", "a": true, "c": "H24Ⅰ⑨イ", "e": "「監査基準」は，財務諸表の種類や意見として表明すべき事項を異にする監査を含め，公認会計士による財務諸表の監査に共通して適用されるものであるため，本肢が示す監査においても適用される。"}, {"l": 88, "m": "監査基準論", "sb": "", "i": "A", "r": "", "q": "「監査基準」は，金融商品取引法に基づく監査及び会社法に基づく会計監査人監査のみならず，私立学校振興助成法に基づく監査等の法定監査においても適用されるが，任意の財務諸表の監査においては適用されない。", "a": false, "c": "H28Ⅰ⑪イ／H24Ⅱ⑦エ", "e": "「監査基準」は，法定監査のみならず，任意の財務諸表監査にも適用される。"}, {"l": 89, "m": "監査基準論", "sb": "", "i": "A", "r": "", "q": "公認会計士又は監査法人は，親会社の依頼に基づき，任意監査として子会社の財務諸表の監査を行う場合，企業会計審議会が公表する監査基準に準拠して監査を行うことが求められる。", "a": true, "c": "R２Ⅰ⑫ウ", "e": ""}, {"l": 90, "m": "監査基準論", "sb": "", "i": "B", "r": "", "q": "監査人の監査実施の総括的目的の一つは，監査人が全体として財務諸表に重要な虚偽表示がないかどうかについて合理的な保証を得ることにより，財務諸表がすべての重要な点において適正に表示されているかどうかに関して，意見を表明できるようにすることである。", "a": true, "c": "H31Ⅰ①ア", "e": ""}, {"l": 91, "m": "監査基準論", "sb": "", "i": "B", "r": "", "q": "一般に公正妥当と認められる監査の基準は，監査人に，意見表明の基礎として，財務諸表全体に重要な虚偽表示がないかどうかについて合理的な保証を得ることを要求している。", "a": true, "c": "R３①イ", "e": ""}, {"l": 92, "m": "監査基準論", "sb": "", "i": "B", "r": "", "q": "監査人が，発見事項に従って財務諸表について監査意見を表明するとともに，監査基準報告書により要求されるコミュニケーションを行うことは，財務諸表監査の実施における監査人の総括的目的に含まれる。", "a": true, "c": "H29Ⅱ①ウ", "e": ""}, {"l": 93, "m": "監査基準論", "sb": "", "i": "B", "r": "", "q": "監査基準報告書における小規模企業とは，相当に小規模な企業を想定している。我が国ではこうした企業が多く存在し，監査基準に基づく監査を行う上で適用例が多いと考えられるため，小規模企業に特有の考慮事項が規定されている。", "a": false, "c": "R５Ⅰ⑪エ", "e": "我が国における監査基準に基づく監査の多くは法定監査であることから，適用することになる例は少ないと考えられている。"}, {"l": 94, "m": "監査基準論", "sb": "", "i": "B", "r": "", "q": "監査基準は，財務諸表監査の根本原則を定めたものであるが，財務諸表監査に関係する法令の規定が監査基準の定めと異なる場合には，監査基準ではなく当該法令が優先して適用されることになる。", "a": true, "c": "H24Ⅱ⑦オ", "e": ""}, {"l": 95, "m": "監査基準論", "sb": "", "i": "B", "r": "", "q": "法令の規定が監査基準及び監査実務指針と異なる場合，法令のみに準拠して実施された監査であっても，一般に公正妥当と認められる監査の基準に準拠したものとはならないことがある。", "a": true, "c": "R５Ⅰ⑪イ", "e": ""}]}, {"n": 2, "name": "監査主体論と品質管理", "qs": [{"l": 1, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "一般基準は，元来は，監査人の適格性の条件及び監査人が業務上守るべき規範を明らかにするという性質を有するものであったが，現在ではこうした性質に加え，監査人の自主的かつ道義的な判断や行動を制度的に担保する性質も有するものとなっている。", "a": true, "c": "H26Ⅰ⑥ア", "e": "なお，「自主的かつ道義的な判断や行動を制度的に担保する」とは，品質管理に関する規定などをさしている。"}, {"l": 2, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "「一般基準」は，かつては職業的専門家としての監査人の人的要件を定めるものであったが，現在では人的要件に加えて，重要な虚偽の表示が財務諸表に含まれる可能性の考慮や，監査報告書の基本的な機能等，監査の実施と報告に関する基本的な事項も含まれている。", "a": false, "c": "H29Ⅱ⑫ア", "e": "一般基準には，監査報告書の基本的な機能に関する事項は含まれていない。また，監査の実施と報告に関する基本的な事項は，実施基準や報告基準の基本原則に含まれるものである。"}, {"l": 3, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "監査人に求められる専門能力及び実務経験等から得られる知識は，資本市場の国際化，会計処理の技術的進展，会計基準の高度の専門化などにより，絶えず変化する可能性がある。そのため，監査人には，こうした能力の維持・研鑽に努め，実務経験を積むことが要求される。", "a": true, "c": "R２Ⅰ⑬エ", "e": ""}, {"l": 4, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "監査人には，その資質の向上が求められ，そのための一つの手段として，日本公認会計士協会が自主規制として実施してきた継続的専門研修（ＣＰＥ）があったが，現在は公認会計士法によって継続的専門能力開発（ＣＰＤ）制度の研修を受けることが義務付けられている。", "a": true, "c": "R６Ⅰ⑪ア", "e": "現在のＣＰＤ制度は，導入された当初は，継続的専門研修（ＣＰＥ）制度と呼ばれていた。"}, {"l": 5, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "専門能力の向上と実務経験等から得られる知識の蓄積を達成するための一つの手段として，日本公認会計士協会が実施する継続的専門能力開発（ＣＰＤ）制度が該当するが，この制度は同協会の自主規制として会員に対してＣＰＤの履修を義務化するものであり，法令によって義務づけられているわけではない。", "a": false, "c": "H27Ⅱ②ア／H29Ⅱ⑫イ", "e": "日本公認会計士協会によるＣＰＤ制度は，現在では公認会計士法により義務化されている。"}, {"l": 6, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "一般基準の１は，監査人に対して，職業的専門家としての専門能力の向上と実務経験等から得られる知識の蓄積に常に努めなければならないことを求めているが，その具体的手段を定めた法令はなく，公認会計士個人または監査法人の裁量に委ねられている。", "a": false, "c": "H26Ⅰ⑥イ", "e": "同上"}, {"l": 7, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "公正不偏性と外観的独立性からなる監査人の独立性は，財務諸表監査の最も重要な存立基盤の一つであり，監査人はその保持に努めなければならない。", "a": true, "c": "R６Ⅰ⑪エ／H31Ⅱ⑫ウ", "e": ""}, {"l": 8, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "監査時に独立性が要求される理由には，監査人自身が，特定の利害関係者の利害に偏らず公正に判断できるようにすること，また，監査人の意見が財務諸表利用者に信頼されるようにすることが含まれている。", "a": true, "c": "R５Ⅰ①イ", "e": ""}, {"l": 9, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "公正不偏の態度は，被監査会社のみならず，特定の株主や債権者からの圧力や影響を排除しようとする監査人の姿勢である。", "a": true, "c": "H26Ⅱ⑥ア", "e": ""}, {"l": 10, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "監査人は，独立性を保持することで，他の者からの不当な影響を受けることなく監査意見を形成することができる。しかしながら，独立性を保持することで，職業的懐疑心が保持される可能性が高まることはない。", "a": false, "c": "R６Ⅱ⑫ア／H25Ⅰ⑧ウ", "e": "職業的懐疑心の保持は，独立性の保持に支えられているため，独立性の保持により，職業的懐疑心が保持される可能性が高まるといえる。"}, {"l": 11, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "監査人は，監査の実施に当たって，独立の立場を損なう特定の利害関係や外観を呈することがあってはならない。その主な理由は，こうした利害関係や外観が，公正不偏の態度に影響を及ぼす可能性があるからである。", "a": true, "c": "R３⑪エ／R２Ⅱ⑫ア／H29Ⅰ⑫ア", "e": ""}, {"l": 12, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "監査人の独立性は一般に外観的独立性と精神的独立性から構成されるが，外観的独立性は，様々な要因が影響しており，すべてを規制することはできないので，我が国の監査基準においては身分的・経済的独立性に限定して保持が求められている。", "a": false, "c": "H25Ⅱ⑧ウ", "e": "監査基準は，外観的独立性として，身分的・経済的な利害関係を有さないことのみならず，独立の立場に疑いを招く「外観」を有さないことについても求めている。"}, {"l": 13, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "監査人が有してはならない外観的独立性を損なう利害関係は，法令によって具体的に規定されており，また監査人が有すべき精神的独立性の具体的な判断基準に関しても，法令上規定されている。", "a": false, "c": "R２Ⅱ⑫イ", "e": "精神的独立性の具体的な判断基準に関する法令上の規定は存在しない。"}, {"l": 14, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "監査人が有してはならないとされる「独立の立場を損なう利害」は法令によって規制されているが，監査人が有するべき「公正不偏の態度」の保持を求める法令上の規定はない。", "a": true, "c": "H29Ⅱ⑫ウ", "e": "同上"}, {"l": 15, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "以前の監査基準・一般基準２において，監査人が公正不偏の態度を保持する局面として，「事実の認定，処理の判断及び意見の表明」と規定されていたが，平成１４年の改訂で削除された。これは，当時の監査を巡る環境の変化にあわせて，公正不偏の態度を保持する局面が変更したことに対応するためである。", "a": false, "c": "R３⑪イ", "e": "前段は正しい。しかし，「事実の認定，処理の判断及び意見の表明」を削除したのは，公正不偏の態度を保持すべき局面が限定的に捉えられかねないことに配慮したものであるため，後段が誤りである。なお，公正不偏の態度の保持に対する考え方は，監査基準の設定当初から変わっていない。👉講義レジュメ②-1-9"}, {"l": 16, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "正当な注意として求められる水準は，監査業務に従事する監査人として当然に払うべき注意の水準であって，職業的専門家がその職業や社会的地位等に鑑みて，通常，期待されるものである。", "a": true, "c": "R２Ⅱ⑬イ", "e": ""}, {"l": 17, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "監査人として払うべき正当な注意は，個々の監査業務に従事する監査責任者及び補助者に求められるのであって，審査担当者には求められない。", "a": false, "c": "R２Ⅱ⑬ア／H25Ⅱ⑧ア／H23Ⅱ⑨イ", "e": "審査担当者にも，職業的専門家としての正当な注意を払うことが求められる。"}, {"l": 18, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "個々の監査業務に従事する監査責任者及び補助者並びに監査事務所内の審査担当者には，監査人として払うべき正当な注意が求められるが，監査事務所外の審査担当者を活用する場合，当該審査担当者には，正当な注意は求められない。", "a": false, "c": "R６Ⅰ⑫ウ", "e": "監査事務所外の審査担当者にも，正当な注意を払うことが求められる。"}, {"l": 19, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "正当な注意の内容は，監査に対する社会的な信頼を確保するとともに，監査人の責任の限界を明確にする必要があるため，監査を取り巻く社会経済状況の変動や監査技法の発展の影響を受けて変化してはならない。", "a": false, "c": "H28Ⅰ⑬ウ／H26Ⅱ⑥イ／H23Ⅱ⑨エ", "e": "正当な注意の内容は，監査を取り巻く社会経済状況の変動や監査技法の発展の影響を受けて，一般に公正妥当と認められる監査の基準の改訂に応じて変化するものである。"}, {"l": 20, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "監査人が金融商品取引法上の監査又は会社法上の会計監査人監査を実施する場合，監査基準や日本公認会計士協会の実務指針が，その任務の内容や正当な注意の水準を画するものとなる。", "a": true, "c": "R６Ⅰ⑫イ", "e": ""}, {"l": 21, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "正当な注意の具体的内容は，企業会計審議会が公表する「監査基準」や日本公認会計士協会が公表する「監査基準報告書」などの実務指針において規定されているが，それらに基づいて監査人が実施すべき監査手続を画一的に決定することはできない。", "a": true, "c": "H28Ⅰ⑬エ／H23Ⅱ⑨ア", "e": ""}, {"l": 22, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "職業的懐疑心は，誤謬又は不正による虚偽表示の可能性を示す状態に常に注意し，監査証拠を鵜呑みにせず，批判的に評価する姿勢をいうが，その考え方は，経営者が誠実であるとも不誠実であるとも想定しない中立的な観点に立つものである。", "a": true, "c": "R２Ⅱ⑬ウ／R６Ⅰ⑪ウ／H31Ⅰ⑫ウ／H29Ⅱ⑫エ／H29Ⅰ⑫ウ", "e": "監査の実施においては，経営者が誠実であるという想定のみならず，不誠実であるという想定も認められない。"}, {"l": 23, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "現在の職業的懐疑心の考え方は，監査を行うに際して経営者が誠実でないと想定している。そのため，監査人が行った質問に経営者が誠実に対応したとしても，監査人は，財務諸表の重要な虚偽表示の可能性がありうることを認識し，監査手続を慎重に実施する姿勢で臨むことが求められる。", "a": false, "c": "R３⑫ア", "e": "後段は正しいが，前段が誤り（理由は同上）。"}, {"l": 24, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "公認会計士は，被監査会社との間に信頼関係がないと財務諸表の監査業務を効率的に遂行できないが，経営者は誠実であるという前提のもとで監査証拠を入手してはならない。", "a": true, "c": "H24Ⅰ①ウ", "e": ""}, {"l": 25, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "監査人は，財務諸表において重要な虚偽表示となる状況が存在する可能性のあることを認識し，監査計画の策定から，その実施，監査証拠の評価，意見の形成に至るまで，職業的懐疑心を保持しなければならない。", "a": true, "c": "R３⑫ウ／H25Ⅱ②イ", "e": ""}, {"l": 26, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "職業的懐疑心の保持は，監査証拠を批判的に評価するために必要とされるので，監査契約の締結時には求められていない。", "a": true, "c": "H27Ⅰ⑤エ", "e": "本肢の通り，職業的懐疑心は監査証拠の評価において保持すべき姿勢とされる。そのため，職業的懐疑心の保持が求められる局面は，「監査計画の策定から，その実施，監査証拠の評価，意見の形成に至るまで」とされ，監査契約の締結時では不要とされる。"}, {"l": 27, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "監査基準は財務諸表の重要な虚偽表示の原因となる不正を発見する姿勢の強化を図るため，職業的専門家としての懐疑心について規定しているが，監査人としての責任の遂行の基本は職業的専門家としての正当な注意を払うことにあり，職業的懐疑心を保持することは正当な注意義務の範囲に含まれる。", "a": true, "c": "R６Ⅱ⑫エ", "e": ""}, {"l": 28, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "監査人に求められる職業的懐疑心の保持は，正当な注意義務に含まれるものであり，監査人が職業的懐疑心を常に保持して監査を行うことが，重要な虚偽の表示の指摘につながることを特に強調するために，監査基準では正当な注意とともに列記されている。", "a": true, "c": "H30Ⅰ⑫ウ", "e": ""}, {"l": 29, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "監査人は，監査の過程を通じて職業的懐疑心を保持することにより，監査手続の結果について十分な検討をせずに一般論に基づいて結論を導いてしまうリスクを抑えることができる。", "a": true, "c": "R６Ⅱ⑫イ", "e": ""}, {"l": 30, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "監査において，職業的懐疑心を保持することは，実施する監査手続の種類，時期及び範囲の決定並びにその結果の評価において不適切な仮定を使用するリスクを抑えることに役立つ。", "a": true, "c": "R３⑫イ", "e": ""}, {"l": 31, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "職業的懐疑心は，監査人の心の状態を意味するものに過ぎないが，実施した監査手続の有効性を高め，また監査人が監査手続の結果を誤って解釈する可能性を抑えるのに役立つ。", "a": true, "c": "H25Ⅱ②ア", "e": ""}, {"l": 32, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "監査人は，職業的懐疑心の保持を前提においていたとしても，監査証拠として利用する情報の信頼性を検討した上で，とくに反証がない限りは，通常は記録や証憑書類を真正なものとして受け入れることができる。", "a": true, "c": "H25Ⅱ②エ／H25Ⅰ②ア", "e": "本肢の「とくに反証がない」という記述は，記録や証憑書類の真正性に疑いを抱く理由がないことを意味している。"}, {"l": 33, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "職業的懐疑心は，監査人が，記録や証憑書類の真正性に疑いを抱く理由がない場合であっても，記録や証憑書類の真正性を立証する証拠の入手が必要であることを意味している。", "a": false, "c": "H26Ⅱ⑥ウ", "e": "監査人は，記録や証憑書類の真正性に疑いを抱く理由がない場合は，当該記録や証憑書類を真正なものとして受け入れることができる。"}, {"l": 34, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "重要な虚偽表示の原因となる不正を看過しないようにするため，証憑書類の突合の際，筆跡や印影から証憑書類の真正性を評価することが必要となる場合があるが，監査人にはこうした専門能力は求められていない。", "a": true, "c": "R２Ⅰ⑬ア", "e": "証憑書類の真正性に疑いを抱く理由がある場合には，筆跡や印影から証憑書類の真正性を評価する場合もある。"}, {"l": 35, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "監査人は，入手した記録や証憑書類の真正性に疑いを抱く理由がなければ，通常，それらの記録や証憑書類を真正なものとして受け入れることができるが，その場合でも，監査証拠として利用する情報の信頼性を検討する必要がある。", "a": true, "c": "R５Ⅱ⑫イ／R２Ⅱ⑬エ", "e": ""}, {"l": 36, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "職業的懐疑心の発揮に当たっては，監査証拠として利用する情報の信頼性の検討のみならず，これに関連する情報の作成と管理に関する内部統制の検討までもが必要とされる。", "a": true, "c": "H25Ⅰ②オ", "e": ""}, {"l": 37, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "監査人は，矛盾する監査証拠を見出した場合など，経営者に対する職業的懐疑心を高めることがある一方で，過去の経験に基づいて経営者に信頼が置けると認識して，職業的懐疑心を保持する必要性を軽減できる場合がある。", "a": false, "c": "H31Ⅰ⑫エ／R６Ⅱ⑫ウ／R５Ⅱ⑫ウ／R３⑫エ／H27Ⅰ⑤ウ／H25Ⅱ②ウ", "e": "監査人が，過去の経験に基づいて経営者等に信頼が置けると認識していても，それによって職業的懐疑心を保持する必要性は軽減されない。なお，前半の記述は正しい。"}, {"l": 38, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "監査人は，継続監査における過去の経験に基づいて，ガバナンスに責任を有する者に対して信頼が置けると認識している場合には，職業的懐疑心の保持の責任が軽減されることがある。", "a": false, "c": "R４Ⅱ⑬ア", "e": "同上。なお，ガバナンスに責任を有する者とは，取締役会や監査役等をさす。"}, {"l": 39, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "監査人は，前年度の監査において，経営者，取締役及び監査役等は誠実であるという心証を得ており，当該心証を監査調書に記載していても，それによって当年度の監査において保持すべき監査人の職業的懐疑心の程度を軽減することはできない。", "a": true, "c": "H30Ⅱ⑪ア", "e": ""}, {"l": 40, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "財務諸表監査における監査人による職業的専門家としての判断の行使は，監査計画に基づいて監査手続を実施する段階に限られない。", "a": true, "c": "R３①エ", "e": ""}, {"l": 41, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "監査人は，監査の過程を通じて職業的専門家として判断を行使することが必要となり，事実や状況又は十分かつ適切な監査証拠による裏付けのない判断を行使してはならない。", "a": true, "c": "R２Ⅰ①ウ", "e": ""}, {"l": 42, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "監査人と被監査会社との間の信頼関係を重視する観点から，財務諸表監査を行う公認会計士に秘密保持が課されることは，職業倫理上当然必要なことである。", "a": true, "c": "R６Ⅱ③エ", "e": ""}, {"l": 43, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "職業的専門家としての監査人に秘密保持が課せられることは職業倫理の上から当然であるが，秘密保持が敢えて一般基準の８として維持されているのは，依頼人との信頼関係を維持し，監査業務の効率的な遂行に資するためである。", "a": true, "c": "H26Ⅰ⑥エ", "e": ""}, {"l": 44, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "監査人による秘密保持の遵守は，被監査会社との間の信頼関係の上に立った監査業務の有効かつ効率的な遂行を可能にし，監査に対する社会の期待に応える基盤をなすものであることから，公正不偏の態度の保持の一環であり，それに包含されるものである。", "a": false, "c": "H24Ⅱ⑧ウ", "e": "秘密保持の遵守は，職業的専門家としての正当な注意に包含されるものである。"}, {"l": 45, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "令和元年の監査基準の改訂では，秘密保持の対象に係る文言について，「業務上知り得た事項」が「業務上知り得た秘密」に改められた。これは，公認会計士法上の「業務上取り扱ったことについて知り得た秘密」との文言上の整合を図るため，秘密を対象にするものであることを明確にするという趣旨に基づいている。", "a": true, "c": "R６Ⅱ⑪ウ", "e": ""}, {"l": 46, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "監査人は，秘密保持を犯すことのないよう，日常生活においても注意を払い，特に違反の自覚なく家族や近親者に対して秘密情報を漏えいしないように十分留意しなければならない。", "a": true, "c": "H27Ⅱ②エ", "e": ""}, {"l": 47, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "被監査会社以外から知り得た秘密情報は，監査人の秘密保持の対象とはならない。", "a": false, "c": "H24Ⅰ①エ", "e": "秘密保持の対象は，依頼人，潜在的な依頼人，所属する組織から業務上知り得た秘密情報等であるため，被監査会社以外から知り得た秘密情報も秘密保持の対象となる。"}, {"l": 48, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "公認会計士は，依頼人である被監査会社から得た秘密情報に対しては秘密保持を負うが，潜在的な依頼人及び雇用主である所属監査法人から得た秘密情報に対しては秘密保持を負わない。ただし，公認会計士の監督下にある者及び公認会計士の求めに応じて助言・支援を行う者に対しては秘密保持を遵守させる義務を負う。", "a": false, "c": "H27Ⅱ⑪イ", "e": "同上。なお，後段の記述は正しい。"}, {"l": 49, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "秘密保持は，監査証明業務に従事する公認会計士が知り得た秘密情報に対して課せられる義務であり，公認会計士が非監査証明業務に従事することによって知り得た秘密情報は，秘密保持の対象とはならない。", "a": false, "c": "R５Ⅱ⑪イ／R３⑬エ", "e": "秘密保持の対象には，非監査証明業務から知り得た秘密情報も含まれる（倫理規則は，監査業務を行う会員のみを対象とした規則ではない）。"}, {"l": 50, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "公認会計士は，監査契約継続中はもちろん，その終了又は解除後も，業務上知り得た秘密情報に対して秘密保持を負うが，監査事務所を定年退職した場合には，退職後十年を経過した時点で，秘密保持は解除される。", "a": false, "c": "R４Ⅰ⑫ウ／H26Ⅰ①ウ／H24Ⅱ⑧エ", "e": "秘密保持は，公認会計士でなくなった後も解除されることはない。"}, {"l": 51, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "監査法人の特定社員は，公認会計士である社員と同様に秘密保持を負うが，特定社員でなくなったときに秘密保持が解除される。", "a": false, "c": "R５Ⅱ⑪エ", "e": "特定社員が負う秘密保持は，特定社員でなくなった後も解除されることはない。"}, {"l": 52, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "秘密保持は，公認会計士が監査法人を退職し，依頼人又は当該監査法人との関係が終了した後も解除されない。ただし，公認会計士が所属する監査法人を変更した場合に，以前の経験を活かすこと，及び業務上知り得た秘密情報を利用することは秘密保持違反とはならない。", "a": false, "c": "H27Ⅱ⑪エ", "e": "以前の経験を活かすことは認められるが，業務上知り得た秘密情報を利用することは秘密保持違反である。"}, {"l": 53, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "訴訟手続の過程で文書を作成するとき等，秘密保持の解除が法令等によって要求されている場合には，被監査会社から事前に了解を得ることなく監査人の秘密保持は解除される。", "a": true, "c": "H24Ⅱ⑧ア", "e": ""}, {"l": 54, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "監査人は，不正を識別した場合でも，秘密保持があるため，被監査会社の同意がある場合や法令等の規定に基づく場合等正当な理由がある場合を除き，当該不正の事実を規制当局に対して報告してはならない。", "a": true, "c": "H31Ⅱ⑳ウ", "e": "なお，本肢の「法令等に規定に基づく場合」とは，金商法で義務付けられている法令違反等事実を当局へ報告する場合を指している。"}, {"l": 55, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "監査人が監査の過程において被監査会社の不正を識別した場合，被監査会社の監査役等の同意を得ることなく規制当局に当該事実を報告することは秘密保持違反である。", "a": false, "c": "H30Ⅱ⑪エ", "e": "本肢の「規制当局への報告」が，金商法で義務づけられている法令違反等事実の報告に該当する場合（当該事実を被監査会社に通知してもなお是正されず，かつ重大な影響がある場合）であれば，被監査会社の同意がなくとも，業務上知り得た秘密情報を開示又は利用することが認められる正当な理由に該当する（報告が義務付けられる）ため，本肢は誤りとなる。"}, {"l": 56, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "監査人は，業務上知り得た秘密情報を正当な理由なく他に漏らしてはならないが，この正当な理由には，日本公認会計士協会による品質管理レビューや公認会計士・監査審査会の立入検査を受ける場合も含まれる。", "a": true, "c": "H26Ⅰ①エ／H24Ⅰ①ア", "e": ""}, {"l": 57, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "親子会社で監査人が異なる場合，親会社の監査人が子会社の監査人から情報を入手することは，監査業務の充実に関連することであり，そのような場合には秘密保持の解除を図る必要がある。", "a": true, "c": "H30Ⅰ⑫エ", "e": ""}, {"l": 58, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "監査人が業務上知り得た秘密情報を他に漏らしたり窃用することは許されないが，監査人の交代に当たって前任監査人から引き継ぐ場合，及び親子会社で監査人が異なるときに親会社の監査人が子会社の監査人から情報を入手する場合には，関係者間の合意が得られれば，秘密保持が解除される。", "a": true, "c": "H25Ⅱ⑧エ", "e": ""}, {"l": 59, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "監査人は業務上知り得た秘密情報を正当な理由なく他に漏らしてはならないが，同一の監査事務所内における監査業務の審査担当者に対しては，秘密保持を解除する手続は必要ない。", "a": true, "c": "H29Ⅰ⑫イ", "e": ""}, {"l": 60, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "監査人は，業務上知り得た秘密情報に関する秘密保持が解除されている場合でも，当該秘密情報の開示に当たって第三者も含めた利害関係者の利益が不当に損なわれるおそれがないかどうかを考慮しなければならない。", "a": true, "c": "H30Ⅰ②エ", "e": ""}, {"l": 61, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "公認会計士が秘密保持に違反した場合には，刑事罰の対象となることがある。", "a": true, "c": "R５Ⅱ⑪ア", "e": ""}, {"l": 62, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "投資者が，財務計算に関する書類について重要な事項について虚偽の記載があることを知らず，これにより投資意思決定を誤って損害を被った場合，当該財務計算に関する書類を監査した公認会計士又は監査法人は，その虚偽の記載を看過したことにつき，自ら故意又は過失がなかったことを証明しない限り，当該投資者に対して，その損害を賠償する責任を負う。", "a": true, "c": "R４Ⅱ⑤ウ／R５Ⅰ④エ／R２Ⅰ①ア", "e": "本肢がいう「財務計算に関する書類」は，有価証券報告書や有価証券届出書等に含まれる財務諸表のことである。"}, {"l": 63, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "投資者が，重要な虚偽記載を含む財務諸表に基づいて投資意思決定を行った結果，損害を受けた場合，その財務諸表に虚偽の監査証明を行った公認会計士は，損害と重要な虚偽記載との間に因果関係がないことを証明しない限り，損害賠償責任を負うこととされている。", "a": false, "c": "R６Ⅰ④イ", "e": "公認会計士の損害賠償責任の有無は，損害との因果関係ではなく，公認会計士の故意又は過失の有無で判断される。"}, {"l": 64, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "財務諸表の虚偽の監査証明に係る監査人の過失責任の有無は，当該監査人が公正不偏の態度を保持していたか否か及び正当な注意を行使したか否かに基づき判断される。", "a": false, "c": "H23Ⅱ⑨ウ", "e": "過失責任の有無は，正当な注意を行使したか否かに基づき判断される（公正不偏の態度を保持していなかった場合は故意と判断される）。"}, {"l": 65, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "公認会計士が，金融商品取引法に基づく財務書類の監査において，故意又は過失により虚偽の証明を行ったとして，当該虚偽の証明により有価証券取得者に生じた損害を賠償する責任を問われた場合には，いわゆる「挙証責任の転換」により，故意又は過失がなかったことを公認会計士自身が証明すれば免責となる可能性があるが，このことを定めた明文規定は金融商品取引法には存在しない。", "a": false, "c": "H27Ⅰ③イ", "e": "金融商品取引法では，挙証責任の転換に関する明文規定が存在する。なお，会社法にも同様の明文規定が存在する。"}, {"l": 66, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "有価証券報告書に含まれる財務諸表に重要な虚偽記載がある場合に，重要な虚偽記載がないと証明した公認会計士は，有価証券報告書の提出者とともに刑事責任を問われることがある。", "a": true, "c": "R６Ⅰ④ア", "e": ""}, {"l": 67, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "公認会計士法は，公認会計士及び監査法人の行う業務を規制しているが，職業的専門家としての自律的規制を促すことを主な目的としているために，この法律に違反した場合でも懲戒処分以外の罰則は課せられない。", "a": false, "c": "H25Ⅱ④イ", "e": "公認会計士法では，刑事責任（虚偽証明や秘密保持違反の場合等）も規定されている"}, {"l": 68, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "監査法人の社員が，故意により，虚偽，錯誤又は脱漏のある財務書類を虚偽，錯誤及び脱漏のないものとして証明した場合，当該監査法人は公認会計士法違反により刑事責任を問われることがある。", "a": false, "c": "H29Ⅰ③ウ", "e": "監査法人に対する刑事責任は法定されていない。"}, {"l": 69, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "公認会計士法では，相当の注意が監査の基準における正当な注意に該当するとされ，相当の注意を怠って重大な虚偽，錯誤又は脱漏のある財務書類を重大な虚偽，錯誤及び脱漏のないものとして証明した公認会計士は懲戒処分の対象となることが規定されている。", "a": true, "c": "R６Ⅰ⑫エ／H31Ⅰ⑫ア", "e": ""}, {"l": 70, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "公認会計士が，相当の注意を怠って，重大な脱漏のある財務書類を重大な脱漏のないものとして証明した場合には，内閣総理大臣により当該公認会計士は登録の抹消という懲戒処分を受けることがある。", "a": false, "c": "H28Ⅱ③ア", "e": "本肢の場合に受ける懲戒処分は，戒告又は２年以内の業務停止処分である。"}, {"l": 71, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "公認会計士に対する懲戒処分として，戒告，２年以内の業務の停止及び登録の抹消という３種類が定められているが，公認会計士が，故意に，虚偽，錯誤又は脱漏のある財務書類を虚偽，錯誤及び脱漏のないものとして証明した場合には，内閣総理大臣は２年以内の業務の停止又は登録の抹消という処分をすることができる。", "a": true, "c": "H27Ⅱ③エ／H31Ⅰ②エ／H28Ⅱ③イ", "e": ""}, {"l": 72, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "公認会計士に課される課徴金の金額は，看過した虚偽表示によって財務諸表利用者が被ったと推計される経済的損失の総額ではなく，監査報酬相当額を基準として算出される。", "a": true, "c": "H31Ⅱ③ア／H27Ⅱ③ウ／H25Ⅰ④イ", "e": ""}, {"l": 73, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "監査法人に対して課徴金制度が導入されたのは，従前の懲戒処分では，監査証明業務の停止等によって，善意の被監査会社に不当な負担を課すことになるためである。", "a": true, "c": "R２Ⅱ③エ", "e": "なお，本肢の内容は非常に細かいため，レジュメには掲載していない。"}, {"l": 74, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "公認会計士が，公認会計士法に違反した場合に，当該公認会計士に対して内閣総理大臣がすることができる懲戒処分には，登録の抹消は含まれないが，戒告は含まれる。", "a": false, "c": "H29Ⅱ②ウ", "e": "本肢の場合の懲戒処分は，戒告，２年以内の業務の停止，登録抹消のいずれかである。"}, {"l": 75, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "公認会計士が，著しく不当と認められる業務の運営を行った場合に，当該公認会計士に対して内閣総理大臣がすることができる懲戒処分には，２年以内の業務の停止が含まれる。", "a": true, "c": "H29Ⅱ②エ", "e": ""}, {"l": 76, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "公認会計士が著しく不当と認められる業務運営を行った場合には，虚偽又は不当の証明をした場合の懲戒処分と同じ処分が行われる。", "a": false, "c": "H25Ⅰ④ア", "e": "相当の注意を怠った虚偽証明の場合の処分とは同じになるが，故意による虚偽証明の場合の処分とは異なる。"}, {"l": 77, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "公認会計士が財務諸表に対して虚偽の監査証明を行った場合，一定の期間内に内閣総理大臣に提出される有価証券報告書等のうち，その公認会計士による監査証明に係るものの全部又は一部が受理されないことがある。", "a": true, "c": "R６Ⅰ④ウ", "e": ""}, {"l": 78, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "監査法人の社員が相当の注意を怠ったことにより，虚偽又は不当の監査証明を行った場合，内閣総理大臣は，当該監査証明が含まれる有価証券報告書を受理しない旨の決定をすることができる。ただし，この決定を理由として，当該監査法人が監査を行った他の会社の有価証券報告書について，受理しない旨の決定することはできない。", "a": false, "c": "R４Ⅱ⑤エ／H29Ⅱ③イ／H27Ⅱ④イ／H23Ⅱ②イ", "e": "本肢の場合，内閣総理大臣は，当該監査法人が監査を行った他の会社の有価証券報告書についても受理しない旨の決定をすることができる。"}, {"l": 79, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "公認会計士又は監査法人が財務計算に関する書類について行った監査証明が不正なものであるとき，内閣総理大臣は，一年以内の期間を定めて，当該期間内に提出される有価証券報告書でその公認会計士又は監査法人の監査証明に係るものの一部を受理しないことができる。", "a": true, "c": "R４Ⅰ④ア", "e": "肢別だと引っかかりやすい。本肢は，全部の不受理ができないとは言っておらず，一部の不受理が可能であると言っているだけであり，正しい。"}, {"l": 80, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "公認会計士法に違反した事実により，監査法人が処分される場合において，当該監査法人の特定社員につき，公認会計士法違反の事実があるときは，当該特定社員に対しても登録抹消の処分が行われることがある。", "a": true, "c": "H25Ⅰ④オ", "e": ""}, {"l": 81, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "公認会計士が虚偽又は不当の証明を行ったことによる処罰としては，懲戒処分のみが行われる場合，課徴金納付命令のみが行われる場合，懲戒処分と課徴金納付命令のいずれも行われる場合がある。", "a": true, "c": "H29Ⅰ③エ／H25Ⅰ④ウ", "e": ""}, {"l": 82, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "公認会計士が，監査証明業務において，故意に虚偽証明を行った場合には，内閣総理大臣は，２年以内の業務停止，登録の抹消又は課徴金の納付命令のうちいずれか一つの処分を科すことができる。", "a": false, "c": "R３③ウ", "e": "故意の虚偽証明の場合の懲戒処分の内容（２年以内の業務停止又は登録の抹消）は正しいが，課徴金の納付命令（故意の場合は１.５倍）は懲戒処分と併せて下される場合もあるため，「いずれか一つ」とする本肢は誤りである。"}, {"l": 83, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "公認会計士が，故意に，虚偽のある財務書類を虚偽のないものとして証明した場合において，財務書類に係る虚偽が当該財務書類全体の信頼性に与える影響が比較的軽微であると認められるときには，当該公認会計士に課徴金の納付が命じられないことがある。", "a": true, "c": "H28Ⅱ③エ", "e": ""}, {"l": 84, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "公認会計士が，故意に，脱漏のある財務書類を脱漏のないものとして証明した場合に該当する事実があると思料される場合において，内閣総理大臣に対し，その事実を報告し，適当な措置をとるべきことを求めることができるのは，当該財務書類を利用した投資家に限られる。", "a": false, "c": "H28Ⅱ③ウ", "e": "本肢の懲戒処分の請求は，虚偽証明がなされた財務書類を利用した投資家のみならず，何人でも行うことができる。"}, {"l": 85, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "公認会計士法においては，公認会計士の虚偽又は不当な証明の事実がある場合には，株主や債権者の利害関係者に限定することなく，何人からも内閣総理大臣に対して当該事実に関する適当な措置を要求することのできる旨が定められている。", "a": true, "c": "H24Ⅱ⑤オ", "e": ""}, {"l": 86, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "金融庁長官は，内閣総理大臣により委任された権限のうち，公認会計士，監査法人及び日本公認会計士協会に関する検査の権限を公認会計士・監査審査会に委任する。同審査会は，その検査の結果に基づき，これらの者の監査証明業務又は事務の適正な運営を確保するため行うべき行政処分について内閣総理大臣（委任先である金融庁長官）に勧告できる。", "a": true, "c": "R４Ⅰ③エ", "e": "なお，前段の内容は非常に細かいため，レジュメには掲載していない。"}, {"l": 87, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "2000年代に入って，監査法人に対するガバナンスの強化等を目的として，公認会計士法により公認会計士・監査審査会が組織された。公認会計士・監査審査会はその調査結果に基づき，監査法人に対して解散命令等を出すことができる。", "a": false, "c": "R６Ⅱ①エ", "e": "行政処分を行う権限は，公認会計士・監査審査会ではなく内閣総理大臣にあるため，本肢は誤り。なお，公認会計士・監査審査会は，米国での粉飾事例を契機として，監査法人に対するガバナンスの強化等を目的として2004年に設立されたものであるため，前半の記述は正しい。"}, {"l": 88, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "公認会計士・監査審査会は，公認会計士に対する懲戒処分及び課徴金納付命令に関する事項を調査審議し，行政処分その他について，内閣総理大臣に勧告することができる。", "a": false, "c": "H31Ⅱ③イ", "e": "細かい引っかけ。公認会計士・監査審査会が調査審議できる事項に，課徴金納付命令に関する事項は含まれない。"}, {"l": 89, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "日本公認会計士協会は，会員である公認会計士が，相当の注意を怠り，重大な虚偽，錯誤又は脱漏のある財務書類を重大な虚偽，錯誤及び脱漏のないものとして証明した事実があると認めたときは，内閣総理大臣に対し，その事実を報告しなければならない。", "a": true, "c": "H31Ⅱ③エ", "e": "なお，本肢の内容は非常に細かいため，レジュメには掲載していない。"}, {"l": 90, "m": "監査主体論", "sb": "", "i": "A", "r": "", "q": "内閣総理大臣は．公認会計士又は監査法人に対して懲戒の処分をするに当たっては，公認会計士・監査審査会による勧告がない事案については，公認会計士・監査審査会の意見を聴取しなければならない。", "a": true, "c": "R５Ⅰ③エ", "e": ""}, {"l": 91, "m": "監査の品質管理", "sb": "", "i": "A", "r": "", "q": "監査チームのメンバーは，個々の監査業務を実施する全ての社員等及び専門職員，並びに当該業務において監査手続を実施する全ての者であるので，監査責任者が所属するネットワーク外の監査事務所に所属する者が含まれることがある。", "a": true, "c": "R５Ⅱ⑦ア", "e": ""}, {"l": 92, "m": "監査の品質管理", "sb": "", "i": "B", "r": "", "q": "品質管理基準は，監査の品質を維持しながら効率的な監査業務の提供を求める依頼人側からの要請に応える必要が生じたことを背景として設定された。", "a": false, "c": "H26Ⅰ⑧イ", "e": "品質管理基準は，監査の品質のさらなる向上を図るため，品質管理の基準に関する国際的な動向を踏まえて設定されたものである。"}, {"l": 93, "m": "監査の品質管理", "sb": "", "i": "A", "r": "", "q": "監査に関する品質管理基準は，公認会計士による財務諸表の監査において適用されるものであり，品質管理システムの構成は，監査事務所の規模や扱う監査業務の目的，内容等により，監査業務の質が合理的に確保される範囲において変化しうるため，監査事務所によって異なることがある。", "a": true, "c": "R５Ⅱ⑥ア", "e": ""}, {"l": 94, "m": "監査の品質管理", "sb": "", "i": "A", "r": "", "q": "年度の財務諸表監査においては，監査に関する品質管理基準に従って，監査業務の質を合理的に確保することが求められる。具体的には，契約の新規の締結及び更新，業務の実施，審査等について，品質管理の方針又は手続を定め，これに従わなければならない。", "a": true, "c": "H25Ⅱ⑨エ", "e": ""}, {"l": 95, "m": "監査の品質管理", "sb": "", "i": "A", "r": "", "q": "監査事務所は，品質管理システムを，内部規程や監査マニュアル等において文書化しなければならない。", "a": true, "c": "H31Ⅰ⑨ア", "e": "内部規程や監査マニュアル「等」とあるため，正しいと判断してＯＫ。"}, {"l": 96, "m": "監査の品質管理", "sb": "", "i": "A", "r": "", "q": "監査事務所の最高責任者以外の者が品質管理システムに関する最高責任者になった場合，監査事務所の品質管理システムに関する説明責任を含む最終的な責任は，当該品質管理システムに関する最高責任者が負う。", "a": false, "c": "R６Ⅱ⑦ア", "e": "監査事務所の最高責任者以外の者が品質管理システムに関する最高責任者になった場合であっても，品質管理システムに関する説明責任を含む最終的な責任を負う者は，監査事務所の最高責任者である。"}, {"l": 97, "m": "監査の品質管理", "sb": "", "i": "A", "r": "", "q": "監査責任者は，監査チームのメンバーに期待される行動を定め，伝達する際に，監査チームのメンバーとしての職業倫理，価値観及び姿勢の重要性などを強調しなければならない。", "a": true, "c": "R７Ⅰ⑫イ", "e": ""}, {"l": 98, "m": "監査の品質管理", "sb": "", "i": "A", "r": "", "q": "監査事務所は，主体的に品質管理システムの構成要素に関連する品質目標を設定し，品質目標の達成を阻害し得るリスク，いわゆる品質リスクを識別及び評価し，品質リスクに対処するための対応をデザインし，適用しなければならない。", "a": true, "c": "R６Ⅰ⑨ア", "e": ""}, {"l": 99, "m": "監査の品質管理", "sb": "", "i": "A", "r": "", "q": "監査事務所は，監査事務所の品質管理において達成すべき品質目標を設定しなければならない。その品質目標には，監査に関する品質管理基準が規定する品質管理システムの構成要素に関連する品質目標と，監査事務所が実施する業務の内容や監査事務所の状況に応じて，監査事務所が主体的に追加設定する品質目標が含まれる。", "a": true, "c": "R６Ⅱ⑦イ", "e": ""}, {"l": 100, "m": "監査の品質管理", "sb": "", "i": "B", "r": "", "q": "監査事務所の最高責任者等は，監査事務所内での発言や教育を通じて，品質管理システムを遵守し監査業務の質を確保する風土を監査事務所内に醸成する役割を担っている。", "a": true, "c": "H29Ⅱ⑨ウ／H23Ⅱ⑤イ", "e": ""}, {"l": 101, "m": "監査の品質管理", "sb": "", "i": "B", "r": "", "q": "最高責任者等に品質に対する説明責任を含む責任を負わせるために監査事務所がデザインし適用する対応には，最高責任者等の定期的な業績評価の実施は含まれない。", "a": false, "c": "R６Ⅰ⑨イ", "e": "本肢の対応には，最高責任者等に対して行われる業績評価が含まれる。"}, {"l": 102, "m": "監査の品質管理", "sb": "", "i": "A", "r": "", "q": "監査事務所は，内部で適切な資源を利用できない場合に，外部のサービス・プロバイダーが提供する資源を利用することがあるが，当該利用に関する品質管理システムに対する責任は免除される場合がある。", "a": false, "c": "R６Ⅰ⑨ウ", "e": "監査事務所は，サービス・プロバイダーの利用に関する品質管理システムに対しても責任を負わなければならない。"}, {"l": 103, "m": "監査の品質管理", "sb": "", "i": "A", "r": "", "q": "品質管理基準では，監査事務所が職業倫理の遵守と独立性の保持に関する方針及び手続を定め，監査実施の責任者がこれらの方針又は手続を遵守した上で，適正意見を表明できるように監査の品質を一定に保つことが要求されている。", "a": false, "c": "H26Ⅰ⑧ア", "e": "品質が合理的に確保された監査において，不適正意見が表明されることもある。"}, {"l": 104, "m": "監査の品質管理", "sb": "", "i": "A", "r": "", "q": "監査事務所は，職業倫理に関する規定に含まれる独立性の規定を遵守することを確保するために，独立性の保持のための方針又は手続を定めなければならないが，当該方針又は手続が適用されるのは，監査事務所及びその専門要員であり，監査事務所が所属するネットワーク・ファームの専門要員は含まれない。", "a": false, "c": "H31Ⅰ③ウ", "e": "独立性の保持のための方針及び手続の適用対象には，ネットワーク・ファームの専門要員も含まれる。"}, {"l": 105, "m": "監査の品質管理", "sb": "", "i": "A", "r": "", "q": "監査事務所は，独立性が適切に保持されるための方針又は手続を定めなければならない。大会社等の監査業務において，監査責任者や審査担当者に対して一定期間のローテーションを義務付けることは，独立性が適切に保持されるための方針及び手続に含まれる。", "a": true, "c": "H29Ⅱ⑨ア", "e": ""}, {"l": 106, "m": "監査の品質管理", "sb": "", "i": "A", "r": "", "q": "主要な担当者が同一の監査業務に長期間にわたって関与した場合，独立性を阻害する馴れ合い及び自己利益を生じさせてしまうことがあるため，監査事務所は，全ての監査業務において，監査責任者及び審査担当者を一定期間でローテーションさせなければならない。", "a": false, "c": "H31Ⅰ⑨イ／H28Ⅰ⑧エ", "e": "監査業務の主要な担当者のローテーションは，被監査会社が大会社等である場合にのみ義務付けられるものである。"}, {"l": 107, "m": "監査の品質管理", "sb": "", "i": "A", "r": "", "q": "監査事務所は，独立性の保持が要求される全ての専門要員から，独立性保持のための方針又は手続の遵守に関する確認書を，少なくとも年に一度入手しなければならず，その際入手する確認書は紙媒体又は電子的媒体によることができる。", "a": true, "c": "H31Ⅰ③ア／R３⑨ア／H29Ⅰ⑧ア／H26Ⅰ①イ", "e": ""}, {"l": 108, "m": "監査の品質管理", "sb": "", "i": "A", "r": "", "q": "監査責任者は，独立性の保持が要求される全ての専門職員から，独立性の保持のための方針及び手続の遵守に関する確認書が入手されているかどうかを自ら確認しなければならない。", "a": false, "c": "R５Ⅱ⑦イ", "e": "本肢にある確認書の入手は監査事務所が行うものであるため，その入手状況について個々の監査責任者が自ら確認することは求められていない。"}, {"l": 109, "m": "監査の品質管理", "sb": "", "i": "A", "r": "", "q": "監査事務所は，監査事務所及び監査実施者の独立性の保持のための方針又は手続を定めるに当たり，監査実施者に対して独立性の規定を周知徹底する方策や独立性の保持に疑義を生じさせる関係を適時に把握する方法だけではなく，監査契約を解除する際の手続も考慮しなければならない。", "a": true, "c": "H23Ⅱ⑤エ", "e": ""}, {"l": 110, "m": "監査の品質管理", "sb": "", "i": "A", "r": "", "q": "監査責任者は，監査契約を更新した既存の関与先との間に独立性を阻害する要因を識別した場合，適切な対処により，こうした阻害要因を許容可能な水準にまで軽減又は除去することができることから，監査契約の解除まで行うことはない。", "a": false, "c": "R２Ⅱ⑫ウ／R２Ⅰ⑨イ／H30Ⅰ⑩ア", "e": "適切な対処をしても独立性を阻害する要因を許容可能な水準にまで軽減又は除去できない場合には，監査契約を解除することもある。"}, {"l": 111, "m": "監査の品質管理", "sb": "", "i": "A", "r": "", "q": "監査責任者が適切な対処をしても許容可能な水準にまで軽減又は除去することができないような独立性に対する阻害要因を識別した場合であっても，監査契約の解除を行わないことがある。", "a": true, "c": "R４Ⅰ⑨ウ", "e": ""}, {"l": 112, "m": "監査の品質管理", "sb": "", "i": "A", "r": "", "q": "監査責任者は，監査業務の全ての局面において，監査チームのメンバーが監査事務所の定める職業倫理の遵守に関する方針又は手続を遵守していない形跡がないかについて留意し，遵守していないことに気付いたときは，監査を速やかに中止しなければならない。", "a": false, "c": "H30Ⅱ②イ", "e": "本肢の状況において，専門的な見解の問合せ等の適切な対応をとることは求められているが，すぐさま監査を中止することは求められていない。"}, {"l": 113, "m": "監査の品質管理", "sb": "", "i": "A", "r": "", "q": "監査責任者は，我が国における職業倫理に関する規定が遵守されていないことに気付いたときには，職業倫理に関する規定への違反に係る監査事務所の方針又は手続に従うことが求められている。その方針又は手続には，当該状況について規制当局又は専門家団体とコミュニケーションを行うことは含まれない。", "a": false, "c": "R６Ⅱ⑧ア", "e": "本肢の状況において行うべき措置の例として，規制当局又は専門家団体とのコミュニケーションがあるため，本肢は誤りとなる。"}, {"l": 114, "m": "監査の品質管理", "sb": "", "i": "A", "r": "", "q": "監査人は，公認会計士以外の専門家を含む監査チームのメンバーが，監査事務所の独立性保持のための方針又は手続を遵守していることを確かめる責任がある。", "a": true, "c": "R２Ⅱ⑫エ／H28Ⅰ⑬イ", "e": "なお，監査チームの範囲については，講義レジュメ②-2-2を参照。"}, {"l": 115, "m": "監査の品質管理", "sb": "", "i": "A", "r": "", "q": "監査事務所は，監査報告書の発行予定日までに監査報告書を発行するために必要な手続が完了できないことが見込まれる場合，新規の監査契約の締結を見合わせることを検討しなければならない。", "a": true, "c": "H25Ⅰ⑨エ", "e": "本肢は「監査事務所の能力」に関わる問題である。"}, {"l": 116, "m": "監査の品質管理", "sb": "", "i": "A", "r": "", "q": "監査事務所は，新規の監査契約の締結時に，監査業務を実施するための適性や能力を有しているかどうかを検討しなければならないが，契約の更新時においては，改めて検討する必要はない。", "a": false, "c": "R４Ⅱ⑩エ", "e": "監査業務を実施するための適性や能力を有しているかどうかの検討は，契約の新規締結時のみならず，更新時においても求められる。"}, {"l": 117, "m": "監査の品質管理", "sb": "", "i": "A", "r": "", "q": "監査事務所は，関与先との契約の新規の締結又は更新に当たり，関与先の誠実性に疑念を抱いた場合には，十分な専門要員が存在している場合を除き，当該関与先と契約の新規の締結又は更新を行ってはならない。", "a": false, "c": "H30Ⅱ⑨ウ", "e": "そもそも，関与先の誠実性に関する疑念は，十分な専門要員が存在することで解決できる問題ではないため，本肢は誤りである。"}, {"l": 118, "m": "監査の品質管理", "sb": "", "i": "A", "r": "", "q": "監査事務所は，監査契約の新規の締結又は更新の可否を判断するに当たり，関与先の誠実性を検討する必要があるが，当該検討には，主な株主の誠実性の考慮を含めることがある。", "a": true, "c": "R４Ⅰ⑨ア", "e": ""}, {"l": 119, "m": "監査の品質管理", "sb": "", "i": "A", "r": "", "q": "監査事務所は，関与先との契約の更新に関する方針又は手続に，関与先の誠実性を検討することを含めなければならないが，この検討に当たっては，過去において当該関与先に対して職業的専門家として会計及び監査関連業務を提供していた者から情報を得ることも許容される。", "a": true, "c": "H25Ⅰ⑩エ", "e": ""}, {"l": 120, "m": "監査の品質管理", "sb": "", "i": "A", "r": "", "q": "監査事務所は，監査契約の更新時において関与先の誠実性を検討し，監査契約の更新に伴うリスクを見極める必要があるため，当該関与先の誠実性に関する情報を，金融機関又は関与先の同業他社等の第三者との討議により入手することがある。", "a": true, "c": "R２Ⅰ⑨ア／R３⑨イ", "e": ""}, {"l": 121, "m": "監査の品質管理", "sb": "", "i": "A", "r": "", "q": "監査事務所は，契約の継続又は解除に関する方針又は手続に，監査契約を解除することが相当であると判断した場合には速やかに被監査会社の経営者及び監査役等に監査契約を解除する旨を書面又は電磁的記録により通知することを含めなければならない。", "a": false, "c": "H25Ⅰ⑨イ", "e": "契約の解除が適切であると判断した場合，監査事務所は，その旨と理由に関して，被監査会社の経営者及び監査役等に伝達することが一般的であるが，そのような方針又は手続を必ず含めなければならないわけではない。"}, {"l": 122, "m": "監査の品質管理", "sb": "", "i": "A", "r": "", "q": "監査実施の責任者は，監査契約の新規の締結に当たり，当該監査契約の締結プロセスに最初から関与しなかった場合であっても，当該監査契約の締結の適切性について判断しなければならない。", "a": true, "c": "H23Ⅱ⑤オ", "e": ""}, {"l": 123, "m": "監査の品質管理", "sb": "", "i": "A", "r": "", "q": "監査責任者は，どのような場合でも，自身が知っている事実と状況に基づいて，職業的専門家としての判断を行使するが，十分な情報を得た上で合理的に当該判断を行えるよう，監査事務所内で専門的な見解の問合せを実施することがある。", "a": true, "c": "R４Ⅱ⑬エ／H24Ⅰ④ウ", "e": ""}, {"l": 124, "m": "監査の品質管理", "sb": "", "i": "A", "r": "", "q": "監査実施の責任者は，複雑な金融商品取引に関する専門的な見解について，監査事務所内に問合せを行うべき適切な人材がいない場合には，他の監査事務所に問合せを行うことができる。", "a": true, "c": "H23Ⅱ⑤ウ", "e": ""}, {"l": 125, "m": "監査の品質管理", "sb": "", "i": "A", "r": "", "q": "監査事務所は，専門性が高く，判断に困難が伴う事項等については専門的な見解の問合せを行うが，この問合せを強調し，奨励することは，監査業務を外部に委託することにつながり，監査事務所による品質目標の達成を阻害することになる。", "a": false, "c": "R７Ⅰ⑦ウ", "e": "専門的な見解の問合せを奨励する環境は，品質へのコミットメントを示す組織風土を醸成するのに役立つ。"}, {"l": 126, "m": "監査の品質管理", "sb": "", "i": "A", "r": "", "q": "監査人は，審査担当者との間で見解の相違が生じ，解決できないままであった場合でも，公正不偏の態度を保持して他人に自己の判断を委ねることなく，自らの見解に基づいて監査意見を表明する責任がある。", "a": false, "c": "H28Ⅰ⑬ア", "e": "いかなる場合であっても，監査人は，監査上の判断の相違を解決しない限り，監査意見を表明することはできない。"}, {"l": 127, "m": "監査の品質管理", "sb": "", "i": "A", "r": "", "q": "監査責任者と審査担当者との間に監査上の判断の相違が生じ，それが監査報告書日に至っても解決できない場合，監査上の判断の相違が生じた事項に関する監査責任者の結論及びその際になされた職業的専門家としての判断を監査調書に記録した上で，監査事務所は監査報告書を発行することができる。", "a": false, "c": "R２Ⅰ⑨ウ／H29Ⅰ⑧ウ", "e": "同上"}, {"l": 128, "m": "監査の品質管理", "sb": "", "i": "A", "r": "", "q": "監査責任者と審査担当者との間で監査上の判断の相違が生じた場合，監査責任者は限定付適正意見の表明又は意見を表明しないことを検討しなければならない。", "a": false, "c": "H25Ⅰ⑨ウ", "e": "同上"}, {"l": 129, "m": "監査の品質管理", "sb": "", "i": "A", "r": "", "q": "監査チームと専門的な見解の問合せの助言者との間に監査上の判断の相違が生じたため，監査事務所の所定の方針又は手続に従って当該相違に係る問題の解決を試みたものの，監査報告書の発行予定日に至っても当該問題を解決できない場合，監査チームは，最終的に，監査責任者の判断において監査報告書を発行することができる。", "a": false, "c": "R４Ⅰ⑨エ／H27Ⅱ⑨イ／H24Ⅰ④エ", "e": "判断の相違は，当事者が納得する形で解決しなければならず，知識・経験・職位等によって，ある者の見解が優先されてはならない。"}, {"l": 130, "m": "監査の品質管理", "sb": "", "i": "A", "r": "", "q": "審査担当者は，審査を通じて監査責任者の責任の一部を担うことになるため，当該審査は，監査業務の責任者と同等以上の十分かつ適切な経験を有する社員等によって行われなければならない。", "a": false, "c": "H25Ⅰ⑨オ", "e": "審査は，監査責任者の責任を軽減するものではないため，審査担当者が監査責任者の責任の一部を担うことはない。"}, {"l": 131, "m": "監査の品質管理", "sb": "", "i": "A", "r": "", "q": "監査報告書の発行自体は審査の完了日以降に行う必要はあっても，監査報告書の日付は，監査人が自らの責任において監査が終了したと判断した時の日付とするため，必ずしも審査の完了日以降とする必要はない。", "a": false, "c": "R６Ⅰ⑩イ", "e": "監査報告書の日付は，審査が完了した日以降の日付としなければならない。"}, {"l": 132, "m": "監査の品質管理", "sb": "", "i": "A", "r": "", "q": "審査は，監査人が十分かつ適切な監査証拠を入手したかどうかを明瞭に判断するための一助となる。審査に関して，監査責任者は，監査チームが行った監査手続，監査上の重要な判断及び監査意見を客観的に評価するために実施される審査が完了した日を監査報告書日としなければならない。", "a": false, "c": "H30Ⅰ⑩ウ", "e": "監査報告書の日付は，審査が完了した日「以降の日」であればよく，必ずしも審査が完了した日と同日とする必要はない。"}, {"l": 133, "m": "監査の品質管理", "sb": "", "i": "A", "r": "", "q": "監査人は，意見表明に関する審査を意見表明前に完了することが原則であるが，無限定適正意見を表明する場合には指摘すべき除外事項がないため，必ずしも意見表明前に審査を完了する必要はない。", "a": false, "c": "H26Ⅰ⑮エ／H24Ⅰ④ア", "e": "意見表明に関する審査は，いかなる場合でも，意見表明に先立って完了しなければならない。"}, {"l": 134, "m": "監査の品質管理", "sb": "", "i": "A", "r": "", "q": "審査担当者の審査は監査報告書の日付以前に完了していなければならないが，その実施時期は監査終了時に限定されず，監査の適切な段階で適時に実施することが求められる。", "a": true, "c": "H28Ⅰ⑧イ", "e": ""}, {"l": 135, "m": "監査の品質管理", "sb": "", "i": "A", "r": "", "q": "監査事務所は，全ての監査業務について審査に関する方針又は手続を定めなければならないが，公認会計士法上の大会社等であっても上場会社でない場合は，監査業務の社会的影響の程度や個々の業務において識別したリスクの重要性により，上場会社の場合と比べて審査の方法や内容等を簡素化することが認められている。", "a": false, "c": "R２Ⅱ⑩イ／H28Ⅱ⑨イ／H25Ⅰ⑩ア", "e": "審査に関する方針又は手続を定めない場合もある。また，審査の方法や内容等の簡素化は，大会社等でない会社の監査でのみ認められる（上場会社でなくとも大会社等に含まれる会社がある点に注意）。"}, {"l": 136, "m": "監査の品質管理", "sb": "", "i": "A", "r": "", "q": "監査事務所は，審査担当者の選任に関する責任の付与に関する方針又は手続を定めなければならない。当該責任を付与された者は，原則として，その監査業務に対する客観性と独立性を有する者の中から審査担当者を選任する。", "a": true, "c": "R７Ⅰ⑥イ", "e": "「原則として」に少し引っかかるが，素直に正しいと判断してよい。"}, {"l": 137, "m": "監査の品質管理", "sb": "", "i": "A", "r": "", "q": "監査業務の審査担当者に求められる十分かつ適切な知識，経験，能力，職位等の資格は，個々の業務の状況によって異なるが，原則として，その監査業務に対する客観性を有する者の中から，監査責任者が審査担当者を指名する。", "a": false, "c": "H31Ⅰ⑩ア", "e": "実務的に不可能な場合を除いて，監査責任者が審査担当者を指名してはならない。なお，前段の記述は正しい。"}, {"l": 138, "m": "監査の品質管理", "sb": "", "i": "A", "r": "", "q": "審査担当者には，十分な知識や経験，能力に加えて，当該監査業務に対する客観性を有する者であることが求められている。しかしながら，小規模な監査事務所においては，実質的に客観性を有する者を確保することが困難であるため，客観性を有する者でなくても審査を担当することが認められている。", "a": false, "c": "R４Ⅱ⑨ア", "e": "小規模な監査事務所のように客観性を有する者を確保できない場合，外部の者に審査を委託することになる（審査担当者の定義参照）。なお，前段の記述は正しい。"}, {"l": 139, "m": "監査の品質管理", "sb": "", "i": "A", "r": "", "q": "監査業務の審査においては，企業が行う特定の取引の理解及び監査チームが行った重要な判断を評価するのに役立つ場合でも，審査担当者が自身の補助者を使用することは想定されていない。", "a": false, "c": "R６Ⅰ⑩ア", "e": "審査担当者は，自身の補助者を使用しながら審査を行う場合もある。"}, {"l": 140, "m": "監査の品質管理", "sb": "", "i": "A", "r": "", "q": "監査業務の対象が公認会計士法上の大会社等である場合，監査責任者は，連続して担当する期間が合わせて７会計期間を超えないのであれば，翌会計期間に監査チームを外れて当該監査業務の審査担当者に就任することができる。", "a": false, "c": "R６Ⅱ⑧ウ", "e": "監査責任者が審査担当者に就任するには，クーリングオフ期間（２年間又は職業倫理に関する規定により要求される場合はそれより長い期間）が必要となる。なお，当該規定は，監査対象がＣＰＡ法上の大会社等であるかにかかわらず適用される。"}, {"l": 141, "m": "監査の品質管理", "sb": "", "i": "A", "r": "", "q": "監査事務所は，特定の監査業務に関して審査担当者を選任せず，適格者で構成される会議体による審査を実施することができる。この場合，会議体の構成員が従事している監査業務の審査においては，当該構成員は審査には加われないものの案件の説明はできる。", "a": true, "c": "H31Ⅰ⑩ウ／H28Ⅰ⑧ウ", "e": ""}, {"l": 142, "m": "監査の品質管理", "sb": "", "i": "A", "r": "", "q": "監査事務所は，審査担当者が自らの適格性が損なわれる状況を識別した場合には，当該審査担当者に対して，既に開始されている審査については，後任の審査担当者が選任された後，遅滞なく当該審査の実施を中止させるという方針又は手続を定めなければならない。", "a": false, "c": "R７Ⅰ⑥ア", "e": "審査担当者が自らの適格性が損なわれる状況を識別した場合で，既に審査が開始されている場合は，後任の審査担当者の選任の有無に関係なく，当該審査の実施を中止しなければならない。"}, {"l": 143, "m": "監査の品質管理", "sb": "", "i": "A", "r": "", "q": "審査担当者は，自身の審査担当者としての適格性が損なわれる状況を識別した場合，監査事務所の適切な者に通知し，審査が既に開始されているときは，審査の実施を中止しなければならない。", "a": true, "c": "R６Ⅰ⑩エ", "e": ""}, {"l": 144, "m": "監査の品質管理", "sb": "", "i": "A", "r": "", "q": "監査事務所は，監査責任者の適格性に疑念が生じた場合等，監査業務の遂行に重大な支障をきたす事態に備えて，審査担当者が監査チームに代わって意思決定を行う場合の方針と手続を定めなければならない。", "a": false, "c": "H25Ⅰ⑩ウ", "e": "審査担当者は，監査チームに代わって意思決定を行ってはならない。"}, {"l": 145, "m": "監査の品質管理", "sb": "", "i": "A", "r": "", "q": "審査担当者は，専門的な見解の問合せが適切に行われたかを審査において検討する立場にあるため，審査担当者の客観性の程度にかかわらず，監査業務実施中の監査責任者からの専門的な見解の問合せに応じる行為は認められていない。", "a": false, "c": "R４Ⅰ⑨イ／H31Ⅰ⑩エ", "e": "監査責任者は，審査担当者に対しても専門的な見解の問合せを行うことができる。"}, {"l": 146, "m": "監査の品質管理", "sb": "", "i": "A", "r": "", "q": "監査責任者は，審査担当者に業務に関する専門的な見解の問合せを行う場合，審査担当者の客観性を阻害することになるため，業務の実施中に，監査責任者自らが行った判断に審査担当者が同意するかどうかを確かめることはできない。", "a": false, "c": "R３⑨ウ", "e": "同上"}, {"l": 147, "m": "監査の品質管理", "sb": "", "i": "A", "r": "", "q": "審査担当者は，監査チームが行った重要な判断や監査意見を客観的に評価することを求められており，審査において，重要な事項について監査責任者と討議するだけでなく，監査チームが行った重要な判断とその結論に関する監査調書の検討も実施しなければならない。", "a": true, "c": "H31Ⅰ⑩イ", "e": ""}, {"l": 148, "m": "監査の品質管理", "sb": "", "i": "A", "r": "", "q": "審査担当者は，監査チームによる職業的専門家としての懐疑心が保持及び発揮されているかどうかも含めて，監査調書のうち重要な判断の根拠を査閲及び評価しなければならない。", "a": true, "c": "R６Ⅰ⑩ウ", "e": ""}, {"l": 149, "m": "監査の品質管理", "sb": "", "i": "A", "r": "", "q": "審査担当者は，監査チームが行った監査手続，監査上の重要な判断，監査意見の形成について客観的に評価することが求められており，審査においては，重要な事項について監査責任者と討議するだけでなく，財務諸表等と監査報告書案についても検討しなければならない。", "a": true, "c": "R４Ⅱ⑨エ", "e": ""}, {"l": 150, "m": "監査の品質管理", "sb": "", "i": "A", "r": "", "q": "監査業務の審査において監査調書の検討が行われる場合があるが，審査担当者からの指摘により監査調書を修正したとしても，それによって監査調書の作成責任の一部が審査担当者と分担されるわけではない。", "a": true, "c": "H23Ⅱ⑩エ", "e": ""}, {"l": 151, "m": "監査の品質管理", "sb": "", "i": "A", "r": "", "q": "監査業務に係る審査担当者は，監査責任者との討議を通じて，監査チームが行った重要な判断や監査意見を客観的に評価するが，このことによって監査責任者の責任が軽減されることはない。", "a": true, "c": "H27Ⅱ⑨ア／H24Ⅰ④オ", "e": ""}, {"l": 152, "m": "監査の品質管理", "sb": "", "i": "A", "r": "", "q": "監査事務所は，監査チームによる監査意見の形成について適切な審査が行われていることを確かめなければならないが，任意監査のうち，監査報告の対象となる財務諸表の社会的影響が小さく，かつ，監査報告の利用者が限定されている監査業務については，監査意見が適切に形成されていることを確認できる他の方法を定めた上で，審査を要しないとすることができる。", "a": true, "c": "H29Ⅰ⑧エ", "e": ""}, {"l": 153, "m": "監査の品質管理", "sb": "", "i": "A", "r": "", "q": "監査事務所は，金融商品取引法に基づく監査であっても，監査報告の対象となる財務諸表の社会的影響が小さく，かつ，監査報告の利用者が限定されている非上場会社の監査業務の場合には，審査を要しないとすることができる。", "a": false, "c": "R５Ⅱ⑥ウ", "e": "法定監査において審査を省略することはできない。"}, {"l": 154, "m": "監査の品質管理", "sb": "", "i": "A", "r": "", "q": "監査人は，品質管理の方針及び手続において，意見が適切に形成されていることを確認できる審査以外の方法が定められている場合であっても，無限定適正意見以外の監査意見を表明するときは，意見を表明する前に，意見表明に関する審査を受けることが求められている。", "a": false, "c": "R５Ⅰ⑱エ", "e": "意見が適切に形成されていることを確認できる審査以外の方法は，監査意見の類型にかかわらず利用できる。"}, {"l": 155, "m": "監査の品質管理", "sb": "", "i": "A", "r": "", "q": "監査事務所は，審査を実施しない監査業務に関して，監査意見が適切に形成されていることを確認できる審査以外の方法を定めなければならない。", "a": true, "c": "R７Ⅰ⑥エ", "e": ""}, {"l": 156, "m": "監査の品質管理", "sb": "", "i": "A", "r": "", "q": "監査人は，意見の表明に先立ち，自らの意見が一般に公正妥当と認められる監査の基準に準拠して適切に形成されていることを確かめるため，意見表明に関する審査を受けなければならないが，上場企業以外の企業の監査では，品質管理の方針及び手続において，意見が適切に形成されていることを確認できる他の方法が定められている場合には，かかる審査を受けなくても良い。", "a": true, "c": "H27Ⅰ⑮ウ", "e": "規定上は×と判断されるべき肢であるが，審査会から公表された解答ではとなっている。おそらく，問題の不備であると思われる。"}, {"l": 157, "m": "監査の品質管理", "sb": "", "i": "B", "r": "", "q": "監査業務を遂行するにあたって，監査実施者による不適切な行為がある場合には，監査事務所の外部から情報が提供されることも考えられることから，監査事務所はこうした情報に対処するための方針又は手続をあらかじめ定めておかなければならない。", "a": true, "c": "H26Ⅰ⑧エ", "e": "いわゆる，不服と疑義の申し立て（内部通報制度）に関する方針又は手続について問う肢である。"}, {"l": 158, "m": "監査の品質管理", "sb": "", "i": "B", "r": "", "q": "監査事務所における内部通報制度は，監査事務所の専門要員が，業務における職業的専門家としての基準及び適用される法令等の違反に関する不服と疑義の申立てを行うために設けられるものであることから，監査事務所外の第三者が当該制度を利用することはできない。", "a": false, "c": "R５Ⅰ⑨イ", "e": "内部通報制度は，監査事務所外の第三者も利用できる。"}, {"l": 159, "m": "監査の品質管理", "sb": "", "i": "A", "r": "", "q": "監査事務所は，外部の検証プログラムである日本公認会計士協会が実施する品質管理レビューの範囲及び結論を考慮した結果，適切であると判断した場合には，当該日本公認会計士協会の品質管理レビューをそのまま監査事務所が実施すべきモニタリング活動の代わりとして用いることができる。", "a": false, "c": "H30Ⅰ⑩エ／R５Ⅰ⑨ア", "e": "品質管理レビューをそのまま監査事務所が実施すべきモニタリング活動の代わりとして用いることはできない。"}, {"l": 160, "m": "監査の品質管理", "sb": "", "i": "A", "r": "", "q": "監査事務所は，モニタリング活動の範囲の決定に際し，日本公認会計士協会が実施した品質管理レビューの結論を考慮することに差し支えはないが，品質管理レビューの結論を監査事務所が実施すべきモニタリング活動の結論として用いることはできない。", "a": true, "c": "H25Ⅱ⑩ウ", "e": ""}, {"l": 161, "m": "監査の品質管理", "sb": "", "i": "A", "r": "", "q": "完了した監査業務の定期的な検証は，監査事務所が定めた品質管理の方針及び手続に準拠して監査チームが監査業務を実施したことを確かめるために，監査意見を表明する前に実施されなければならない。", "a": false, "c": "R２Ⅱ⑲エ", "e": "「完了した監査業務」の定期的な検証であるため，監査意見が表明された監査業務に対して実施される。"}, {"l": 162, "m": "監査の品質管理", "sb": "", "i": "A", "r": "", "q": "監査事務所は，モニタリング活動として，日常的な監視だけではなく，監査責任者ごとに一定の期間を設けて一つの完了した監査業務の定期的な検証も実施するが，当該定期的な検証を担当する者として，当該監査業務の審査担当者に実施させることが，監視活動の実効性を高める観点から推奨されている。", "a": false, "c": "H29Ⅱ⑨エ／H28Ⅱ⑨ア／H25Ⅱ⑩イ", "e": "監査業務又は審査を実施する者が当該監査業務の定期的な検証に関与することは禁止されている。"}, {"l": 163, "m": "監査の品質管理", "sb": "", "i": "A", "r": "", "q": "監査事務所は，品質管理システムの監視に係る手続を定めなければならない。その手続として完了した監査業務の検証を行う場合には，当該監査業務を担当した監査チームのメンバー又は当該監査業務の審査担当者が実施することは認められない。", "a": true, "c": "R６Ⅱ⑦ウ", "e": ""}, {"l": 164, "m": "監査の品質管理", "sb": "", "i": "A", "r": "", "q": "監査事務所は，品質管理システムについて識別された不備の評価において，根本原因の調査を行わなければならないが，その目的は，識別された不備の重大性と広範性を評価することである。", "a": true, "c": "R６Ⅰ⑨エ", "e": ""}, {"l": 165, "m": "監査の品質管理", "sb": "", "i": "A", "r": "", "q": "監査事務所は，品質管理システムの監視によって不備が発見された場合，関係する個々の監査業務又は専門要員に対して適切な是正措置を実施するほか，品質管理の方針及び手続の変更を行うことがある。", "a": true, "c": "R５Ⅰ⑨ウ", "e": ""}, {"l": 166, "m": "監査の品質管理", "sb": "", "i": "A", "r": "", "q": "監査事務所が定めた品質管理システムに重大な不備が存在した場合でも，当該品質管理システムの下で行われた個々の監査業務が，職業的専門家としての基準及び適用される法令等を遵守して実施されなかったことを必ずしも意味するものではない。", "a": true, "c": "R６Ⅱ⑧イ", "e": ""}, {"l": 167, "m": "監査の品質管理", "sb": "", "i": "B", "r": "", "q": "監査事務所は，監査人の交代に関する監査業務の引継についての方針及び手続を定めなければならないが，これらには，前任の監査事務所となる場合及び後任の監査事務所となる場合の双方を含めなければならない。", "a": true, "c": "H30Ⅱ⑨エ", "e": ""}, {"l": 168, "m": "監査の品質管理", "sb": "", "i": "B", "r": "", "q": "監査事務所は，監査人の交代に際し後任の監査事務所となる場合には，当該監査業務の引継作業は自らの方針及び手続に準拠して実施する必要があり，その際の責任者は当該監査業務の監査責任者となる者でなければならない。", "a": false, "c": "H24Ⅱ⑩エ", "e": "引継作業は，一般的には，当該監査業務の監査責任者が行うが，引継を行う時点で監査責任者が決まっていない場合は，引継のための責任者を選任する。"}, {"l": 169, "m": "監査の品質管理", "sb": "", "i": "B", "r": "", "q": "監査における不正リスク対応基準が適用される監査業務であるか否かにかかわらず全ての監査業務において，監査責任者は，監査チームが実施した監査事務所間の引継の状況について，監査事務所の適切な部署又は者に報告されていることを確かめなければならない。", "a": true, "c": "R６Ⅱ⑧エ", "e": ""}, {"l": 170, "m": "監査の品質管理", "sb": "", "i": "B", "r": "", "q": "監査事務所の品質管理システムに関する最高責任者は，少なくとも１年に一度，基準日を定めて品質管理システムを評価し，結論付けなければならない。また，監査事務所は，必要な場合，当該結論を監査チームを含む適切な者に伝達しなければならない。", "a": true, "c": "H25Ⅱ⑩ア", "e": ""}, {"l": 171, "m": "監査の品質管理", "sb": "", "i": "B", "r": "", "q": "監査事務所は，ネットワークに属する場合，自らの品質管理システムをデザイン，適用又は運用する際に，適用又は利用することを選択したネットワークが提供する全てのサービス又は資源を理解しなければならない。", "a": true, "c": "R７Ⅰ⑦エ", "e": ""}, {"l": 172, "m": "監査の品質管理", "sb": "", "i": "B", "r": "", "q": "異なる品質管理システムを有する複数の監査事務所が共同して監査業務を行うためには，そのシステムが当該監査業務の質を合理的に確保するものであることが，監査事務所及び監査実施の責任者によって確かめられていなければならない。", "a": true, "c": "H28Ⅰ⑧ア／R４Ⅱ⑩イ", "e": ""}, {"l": 173, "m": "監査の品質管理", "sb": "", "i": "B", "r": "", "q": "複数の監査事務所が共同して監査業務を行う場合には，監査事務所ごとに品質管理システムが異なっている場合であっても，それぞれの品質管理システムを統一する必要はない。", "a": true, "c": "H26Ⅰ⑧ウ", "e": ""}]}, {"n": 3, "name": "監査実施論", "qs": [{"l": 1, "m": "監査実施論－総論", "sb": "", "i": "B", "r": "", "q": "財務諸表監査の目的は，財務諸表の適正性に対して，監査人が自らの意見を表明することにある。そのためには，監査人は，経営者が提示する財務諸表項目について立証すべき監査要点を設定し，監査要点ごとに監査手続を実施して監査証拠を入手し，その監査要点に関する立証事項を積み上げて統合化し，財務諸表全体の適正性に関する結論を得る。", "a": true, "c": "R６Ⅱ②ア", "e": ""}, {"l": 2, "m": "監査実施論－総論", "sb": "", "i": "B", "r": "", "q": "監査要点とは，監査における具体的な立証の目標をいう。監査人は，監査計画において，財務諸表項目に対して監査要点を設定する。", "a": true, "c": "R５Ⅱ⑬ウ", "e": "直接の立証目標を特定化するという監査要点の設定目的に鑑みれば，監査計画において監査要点を設定するとする本肢は正しいといえる。"}, {"l": 3, "m": "監査実施論－総論", "sb": "", "i": "B", "r": "", "q": "監査人は，勘定残高に関するアサーションと取引に関するアサーションを組み合わせて，一つの監査要点として設定することはできない。", "a": false, "c": "H23Ⅱ⑪ア", "e": "監査人は，複数のアサーションを組み合わせて，一つの監査要点として設定することができる。"}, {"l": 4, "m": "監査実施論－総論", "sb": "", "i": "A", "r": "", "q": "監査証拠となる企業外の情報源からの情報には，第三者に対する確認等の一定の監査手続の結果得られたものだけではなく，一般に公表されているアナリストのレポートも含まれる。", "a": true, "c": "H24Ⅱ⑭エ", "e": ""}, {"l": 5, "m": "監査実施論－総論", "sb": "", "i": "A", "r": "", "q": "監査証拠は累積的な性質のものであるが，過年度の監査において入手した監査証拠は，監査人がその継続的な適合性を確かめる監査手続を実施したとしても，当年度の監査証拠にはならない。", "a": false, "c": "H29Ⅱ⑬ウ／H25Ⅱ⑫イ", "e": "過年度の監査において入手した監査証拠であっても，その継続的な適合性を確かめられれば，当年度の監査証拠として利用することができる。"}, {"l": 6, "m": "監査実施論－総論", "sb": "", "i": "A", "r": "", "q": "監査証拠は累積的な性質を有するため，監査人は，過去の虚偽表示の有無や内部統制に係る情報等，過年度の監査において入手した情報も監査証拠として利用しなければならない。", "a": false, "c": "H24Ⅱ⑭イ", "e": "過年度の監査において入手した情報を当年度の監査証拠として利用しないこともあるため，本肢は誤りとなる。"}, {"l": 7, "m": "監査実施論－総論", "sb": "", "i": "A", "r": "", "q": "監査証拠とは，監査人が意見表明の基礎となる個々の結論を導くために利用する情報であり，監査の過程で実施した監査手続によってのみ入手されるものであるが，ここでいう個々の結論とは財務諸表における個々のアサーションの適否に関する監査人の結論と同義である。", "a": false, "c": "H25Ⅱ⑫ア", "e": "監査証拠には，監査の過程で実施した監査手続によって入手した情報のみならず，過年度の監査において入手した情報や，監査契約の新規の締結及び更新において入手した情報も含まれることがある。"}, {"l": 8, "m": "監査実施論－総論", "sb": "", "i": "A", "r": "", "q": "監査意見及び監査報告書を裏付けるために必要とされる監査証拠は，アサーションを裏付ける情報と矛盾する情報の両方から構成されるが，アサーションを裏付ける情報がないことそれ自体はアサーションを肯定も否定もすることができないため，監査証拠とは認められない。", "a": false, "c": "H26Ⅱ①イ", "e": "情報がないことそれ自体が監査証拠となる場合もある。"}, {"l": 9, "m": "監査実施論－総論", "sb": "", "i": "A", "r": "", "q": "監査証拠は主として監査の過程で実施した監査手続から入手されるものであるため，依頼した陳述を経営者が拒んだ場合において，情報がないことそれ自体は監査証拠とはならない。", "a": false, "c": "H28Ⅱ⑬イ／H24Ⅱ⑭ウ", "e": "同上"}, {"l": 10, "m": "監査実施論－総論", "sb": "", "i": "A", "r": "", "q": "全ての監査証拠の質は，監査証拠の基礎となる情報の適合性と信頼性により影響されることから，監査人は，監査手続を実施する場合には，これらを考慮しなければならない。", "a": true, "c": "H30Ⅰ⑬ア", "e": ""}, {"l": 11, "m": "監査実施論－総論", "sb": "", "i": "A", "r": "", "q": "監査証拠の十分性と適切性は，相互に関連する。したがって，監査証拠をより多く入手することができれば，多くのアサーションを裏付けることができるため，監査証拠の適切性を補完することができる。", "a": false, "c": "R３①ウ", "e": "数多くの監査証拠を入手したとしても，監査証拠の質の低さを補完しないことがある。"}, {"l": 12, "m": "監査実施論－総論", "sb": "", "i": "A", "r": "", "q
