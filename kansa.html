７年の改訂では，重要な虚偽表示のリスクの評価が導入された。この背景には，多くの場合，監査人が固有リスクと統制リスクを組み合わせて判断することで，財務諸表の個別の項目に生じる重要な虚偽表示のリスクを見逃す傾向にあったため，本改訂では，固有リスクと統制リスクを個別に判断した上で，両者を組み合わせて重要な虚偽表示のリスクとして評価することとした。", "a": false, "c": "R２Ⅰ⑪イ", "e": "平成１７年の改訂は，それまで個別に判断していた固有リスクと統制リスクを組み合わせて判断することを求めたものである。"}, {"l": 27, "m": "倫理規則", "sb": "", "i": "B", "r": "", "q": "平成２１年の改訂により，監査人は，継続企業の前提に重要な疑義を生じさせる一定の事象又は状況が存在した場合，経営者が行った評価及び対応策について検討した上で，なお継続企業の前提に関する重要な不確実性が認められるか否かを確かめることとなった。この背景には，旧基準の下で，財務諸表への注記や監査報告書の追記情報への記載事例が急速に増えていたこと，また，旧基準が国際的な監査基準とも整合していなかったことがある。", "a": true, "c": "R２Ⅰ⑪ウ", "e": ""}, {"l": 28, "m": "倫理規則", "sb": "", "i": "B", "r": "", "q": "平成２１年の改訂では，継続企業の前提に重要な疑義を生じさせる一定の事象又は状況が存在した場合，経営者が行った評価及び対応策について検討した上で，なお継続企業の前提に関する重要な不確実性が認められるか否かを確かめなければならないこととした。その背景には，当該一定の事象又は状況が存在する場合には直ちに継続企業の前提に関する注記及び追記情報の記載を要するとの解釈があった。", "a": true, "c": "H25Ⅱ⑦ウ", "e": ""}, {"l": 29, "m": "倫理規則", "sb": "", "i": "B", "r": "", "q": "国際会計士連盟による国際監査基準の明瞭性プロジェクトの完了を受け，我が国においても平成２２年３月に監査基準が改訂されたが，この改訂は，国際会計基準が我が国に強制適用されることを前提としてなされたものである。", "a": false, "c": "H25Ⅰ⑧オ", "e": "現在においても，国際会計基準は我が国で強制適用されていない。"}, {"l": 30, "m": "倫理規則", "sb": "", "i": "B", "r": "", "q": "平成２２年に行われた監査基準の改訂により，監査報告書の記載区分が，かつての「監査の対象，実施した監査の概要及び財務諸表に対する意見」の３区分から，「監査の対象，経営者の責任，監査人の責任及び監査人の意見」の４区分に変更されたことに伴い，監査意見の形成過程が変化した。", "a": false, "c": "H30Ⅰ②イ／H24Ⅰ⑨エ", "e": "平成２２年の改訂は，監査意見の形成過程を変えたものではない。なお，記載区分に関する記述は正しい。"}, {"l": 31, "m": "倫理規則", "sb": "", "i": "B", "r": "", "q": "平成２２年の改訂では，監査報告書において，監査意見に関する除外事項を意見区分に記載し，監査範囲の制約に関する除外事項を範囲区分に記載する形式から，除外事項の性質に関わらず，意見区分の前に根拠区分を設けて記載する形式に変更した。その背景には，国際監査基準の明瞭性プロジェクトの結果を受けた国際監査基準と我が国の監査基準との差異の調整があった。", "a": true, "c": "H25Ⅱ⑦エ", "e": ""}, {"l": 32, "m": "倫理規則", "sb": "", "i": "B", "r": "", "q": "平成２５年の改訂では，監査基準とは別に不正リスク対応基準が新設された。この背景には，不正による有価証券報告書の虚偽記載等の不適切な事例が相次いだことがある。そのため，不正リスク対応基準では職業的懐疑心の重要性が強調され，不正に対応する手続が定められるとともに，不正リスク要因等が例示されている。", "a": true, "c": "R２Ⅰ⑪ア", "e": ""}, {"l": 33, "m": "倫理規則", "sb": "", "i": "B", "r": "", "q": "平成２６年の改訂では，従来の適正性に関する意見表明の形式に加え，準拠性に関する意見表明の形式が導入された。これは，特別目的の財務諸表に対する，監査による信頼性の担保の要請に応えるためであって，一般目的の財務諸表には適用されない。", "a": false, "c": "R２Ⅱ⑪ア／H30Ⅱ①ア", "e": "一般目的の財務諸表に対しても，「準拠性」に関する意見を表明することができる。"}, {"l": 34, "m": "倫理規則", "sb": "", "i": "B", "r": "", "q": "平成３０年の改訂では，監査報告書の記載区分等が変更され，経営者の責任が経営者及び監査役等の責任となった。これにより，経営者による職務の執行を監査するというこれまでも監査役等が担っていた役割に，財務報告プロセスの監視責任が含まれていることについて，監査報告書において明確に記載されることとなった。", "a": true, "c": "R２Ⅱ⑪イ", "e": ""}, {"l": 35, "m": "倫理規則", "sb": "", "i": "B", "r": "", "q": "平成３０年の改訂では，監査報告書において意見表明とは別に，独立した区分を設けて継続企業の前提に関する事項を記載することとした。これは，従来どおり継続企業の前提に関する事項が財務諸表に適切に注記されていることを確かめた上で記載することとされており，継続企業の前提に関する評価と開示に関する経営者及び監査人の対応についてより明確にすることを目的としている。", "a": true, "c": "R２Ⅱ⑪ウ", "e": ""}, {"l": 36, "m": "倫理規則", "sb": "", "i": "B", "r": "", "q": "「監査基準」は，監査を巡る環境の変化とともに改訂されてきたが，一般基準において求められている監査人の適格性，独立性及び正当な注意は普遍的な性質を有するものであり，これらに関する規定は「監査基準」の設定当初から改訂されていない。", "a": false, "c": "H28Ⅱ⑫ウ", "e": "例えば，正当な注意に関する規定であれば，平成１４年改訂により「懐疑心の保持」が明示されるなどの改訂がなされている。また，正当な注意の内容は，時代や場所によって変化する相対的なものであるため，「普遍的な性質」を有するとはいえない。"}, {"l": 37, "m": "倫理規則", "sb": "", "i": "B", "r": "", "q": "監査人に求められる職業的専門家としての正当な注意は，監査基準の設定当初は規定されていなかったが，その後，監査基準の改訂に伴って正当な注意が規定された。", "a": false, "c": "R６Ⅰ⑫ア", "e": "職業的専門家としての正当な注意は，監査基準の設定当初から規定されていた。"}, {"l": 38, "m": "倫理規則", "sb": "", "i": "B", "r": "", "q": "監査人に秘密保持が課されることは職業倫理上当然のことであり，「監査基準」が設定された当初は規定されていなかったが，監査人と監査を受ける企業との信頼関係を重視する観点から，現在の一般基準には含められている。", "a": false, "c": "H28Ⅱ⑫イ", "e": "秘密保持は，監査基準が設定された当初から規定されている。"}, {"l": 39, "m": "倫理規則", "sb": "", "i": "B", "r": "", "q": "秘密保持は，監査基準の設定当初から，監査業務を有効かつ効率的に遂行する上で必要な義務となっており，その意義は変わっていないが，例えば監査人の交代時における引継ぎを行う場合のように，秘密保持の範囲や解除要件は明確化されてきている。", "a": true, "c": "R３⑬イ", "e": "令和元年の監査基準の改訂において秘密保持の範囲の明確化（事項⇒秘密）が行われたように，秘密保持の範囲や解除要件は明確化されてきているといえる。"}, {"l": 40, "m": "倫理規則", "sb": "", "i": "B", "r": "", "q": "監査の品質管理に関する規定は，「監査基準」の設定当初は一般基準に存在していなかったが，監査人の自主的かつ道義的な判断や行動に任されていた点を制度的に担保する観点から，現在の一般基準には含められている。", "a": true, "c": "H28Ⅱ⑫エ", "e": ""}, {"l": 41, "m": "倫理規則", "sb": "", "i": "B", "r": "", "q": "令和元年の改訂では，秘密保持の対象に係る文言について，「業務上知り得た事項」が「業務上知り得た秘密」に改められた。これは，公認会計士法上の「業務上取り扱ったことについて知り得た秘密」との文言上の整合性をとったものであり，業務上知り得た企業に関する未公表の情報全てが秘密保持の対象であることに変わりない。", "a": false, "c": "R２Ⅱ⑪エ", "e": "本肢の改訂は，公認会計士法上の文言との整合性を図ること，及び，未公表の情報の全てが秘密保持の対象であるとの誤解を解消することを目的として行われたものである。"}, {"l": 42, "m": "倫理規則", "sb": "", "i": "B", "r": "", "q": "我が国における一般に公正妥当と認められる監査の基準の一部を構成している日本公認会計士協会が公表した監査基準報告書は，国際監査基準の明瞭性プロジェクトにより改訂された監査基準等に対応して改正が進められており，日本独自の内容を持つ監査基準報告書は全て廃止された。", "a": false, "c": "H29Ⅰ⑪イ", "e": "国際監査基準の明瞭性プロジェクトにより，我が国の監基報も全面的に改正されたが，日本独自の内容を持つ監基報（監基報９００「中間監査」など）も存在している。"}]}]</script>
<script>
const CHAPTERS = JSON.parse(document.getElementById('quiz-data').textContent);

let ALL_Q=[], BY_CHAPTER={}, MAJORS_BY_CHAPTER={};
let customQs=[]; // user-added questions, persisted separately

function rebuildIndexes(){
  ALL_Q=[];
  CHAPTERS.forEach((ch,ci)=>{
    ch.qs.forEach((q,qi)=>{
      ALL_Q.push({
        id: ci+'_'+qi, chNum: ch.n, chName: ch.name,
        major: q.m||'', sub: q.sb||'', importance: q.i||'',
        label: q.l, refs: q.r||'', statement: q.q, answer: q.a,
        citation: q.c||'', explanation: q.e||'', custom:false
      });
    });
  });
  customQs.forEach(q=>{
    const ch = CHAPTERS.find(c=>c.n===q.chNum);
    ALL_Q.push({
      id: q.id, chNum: q.chNum, chName: ch?ch.name:'追加した問題',
      major: q.major||'', sub:'', importance: q.importance||'',
      label:'', refs:'', statement:q.statement, answer:q.answer,
      citation:q.citation||'', explanation:q.explanation||'', custom:true
    });
  });
  BY_CHAPTER={};
  CHAPTERS.forEach(ch=>{ BY_CHAPTER[ch.n]=ALL_Q.filter(q=>q.chNum===ch.n); });
  MAJORS_BY_CHAPTER={};
  CHAPTERS.forEach(ch=>{
    const order=[],counts={};
    BY_CHAPTER[ch.n].forEach(q=>{ const k=q.major||''; if(!(k in counts)){counts[k]=0;order.push(k);} counts[k]++; });
    MAJORS_BY_CHAPTER[ch.n]=order.map(name=>({name,count:counts[name]}));
  });
}
function majorKey(chNum,major){ return chNum+'::'+major; }

/* ---------- persisted state ---------- */
let status={};   // id -> 0|1|2  (0=未,1=あいまい,2=覚えた)
let notes={};    // id -> memo text
let noteSaveTimer=null;
let localUpdatedAt=0;

const SUBJECT_KEY='kansa';
const LS_STATUS_KEY='kansa_status_v1';
const LS_NOTES_KEY='kansa_notes_v1';
const LS_CUSTOM_KEY='kansa_custom_v1';
const LS_UPDATED_KEY='kansa_updated_v1';
const SYNC_URL_KEY='qsync_dburl_v1';
const SYNC_CODE_KEY='qsync_code_v1';

function storageAvailable(){
  try{
    const k='__t__'; localStorage.setItem(k,'1'); localStorage.removeItem(k);
    return true;
  }catch(e){ return false; }
}
const HAS_LS = storageAvailable();

async function loadStorage(){
  if(HAS_LS){
    try{
      const s=localStorage.getItem(LS_STATUS_KEY);
      if(s) status=JSON.parse(s);
    }catch(e){ status={}; }
    try{
      const n=localStorage.getItem(LS_NOTES_KEY);
      if(n) notes=JSON.parse(n);
    }catch(e){ notes={}; }
    try{
      const c=localStorage.getItem(LS_CUSTOM_KEY);
      if(c) customQs=JSON.parse(c);
    }catch(e){ customQs=[]; }
    try{
      const u=localStorage.getItem(LS_UPDATED_KEY);
      localUpdatedAt = u? (parseInt(u,10)||0) : 0;
    }catch(e){ localUpdatedAt=0; }
  }
  rebuildIndexes();
}
async function saveStatus(){
  if(!HAS_LS) return;
  try{ localStorage.setItem(LS_STATUS_KEY,JSON.stringify(status)); }catch(e){}
  touchUpdated();
}
function saveCustomQs(){
  if(!HAS_LS) return;
  try{ localStorage.setItem(LS_CUSTOM_KEY,JSON.stringify(customQs)); }catch(e){}
  touchUpdated();
}
function scheduleSaveNote(id,text){
  notes[id]=text;
  if(noteSaveTimer) clearTimeout(noteSaveTimer);
  noteSaveTimer=setTimeout(()=>{
    if(HAS_LS){ try{ localStorage.setItem(LS_NOTES_KEY,JSON.stringify(notes)); }catch(e){} }
    touchUpdated();
    document.querySelectorAll('[data-memo-saved="'+id+'"]').forEach(el=>{
      el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),1200);
    });

/* ---------- CLOUD SYNC (optional, Firebase Realtime Database via REST) ---------- */
function touchUpdated(){
  localUpdatedAt = Date.now();
  if(HAS_LS){ try{ localStorage.setItem(LS_UPDATED_KEY, String(localUpdatedAt)); }catch(e){} }
  scheduleCloudPush();
}
function getSyncConfig(){
  if(!HAS_LS) return null;
  const url=(localStorage.getItem(SYNC_URL_KEY)||'').trim();
  const code=(localStorage.getItem(SYNC_CODE_KEY)||'').trim();
  if(!url||!code) return null;
  return {url,code};
}
function cloudPath(cfg){
  return cfg.url.replace(/\/+$/,'') + '/quizSync/' + encodeURIComponent(cfg.code) + '/' + SUBJECT_KEY + '.json';
}
let cloudPushTimer=null;
function scheduleCloudPush(){
  const cfg=getSyncConfig(); if(!cfg) return;
  if(cloudPushTimer) clearTimeout(cloudPushTimer);
  cloudPushTimer=setTimeout(()=>{ pushToCloud(cfg); },1500);
}
async function pushToCloud(cfg){
  cfg = cfg||getSyncConfig(); if(!cfg) return false;
  try{
    await fetch(cloudPath(cfg), {
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({status,notes,customQs,updatedAt:localUpdatedAt})
    });
    return true;
  }catch(e){ return false; }
}
async function pullFromCloud(showToast){
  const cfg=getSyncConfig(); if(!cfg) return false;
  try{
    const res=await fetch(cloudPath(cfg));
    if(!res.ok) return false;
    const data=await res.json();
    if(!data || !data.updatedAt || data.updatedAt<=localUpdatedAt) return false;
    status=data.status||{};
    notes=data.notes||{};
    customQs=data.customQs||[];
    localUpdatedAt=data.updatedAt||0;
    if(HAS_LS){
      try{
        localStorage.setItem(LS_STATUS_KEY,JSON.stringify(status));
        localStorage.setItem(LS_NOTES_KEY,JSON.stringify(notes));
        localStorage.setItem(LS_CUSTOM_KEY,JSON.stringify(customQs));
        localStorage.setItem(LS_UPDATED_KEY,String(localUpdatedAt));
      }catch(e){}
    }
    rebuildIndexes();
    meter();
    if(S.view!=='quiz') render();
    if(showToast) toast('他の端末の学習記録を読み込みました');
    return true;
  }catch(e){ return false; }
}
function randomSyncCode(){
  const chars='abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  let s=''; for(let i=0;i<20;i++) s+=chars[Math.floor(Math.random()*chars.length)];
  return s;
}
function syncSettingsHTML(){
  if(!HAS_LS) return '<div class="mini">このブラウザでは同期機能を使えません。</div>';
  const url=(localStorage.getItem(SYNC_URL_KEY)||'').trim();
  const code=(localStorage.getItem(SYNC_CODE_KEY)||'').trim();
  if(!url){
    return `<div class="flabel">データベースURL（Firebaseコンソールで確認）</div>
      <input id="cloudUrlInput" placeholder="https://xxxx-default-rtdb.firebaseio.com">
      <div class="act"><button id="cloudUrlSave" class="btn-main">保存</button></div>`;
  }
  if(!code){
    return `<div class="mini">データベースURL：<code style="font-size:11px">${esc(url)}</code> <button id="cloudUrlEdit" style="font-size:11px;text-decoration:underline;color:var(--blue)">変更</button></div>
      <div class="act" style="margin-top:10px"><button id="cloudGenBtn" class="btn-main">この端末を1台目にして同期コードを発行</button></div>
      <div class="flabel" style="margin-top:16px">他の端末で発行したコードをお持ちの場合</div>
      <input id="cloudCodeInput" placeholder="同期コードを貼り付け">
      <div class="act"><button id="cloudJoinBtn">このコードで同期を開始</button></div>`;
  }
  const lastSync = localUpdatedAt? new Date(localUpdatedAt).toLocaleString('ja-JP') : '未同期';
  return `<div class="mini">データベースURL：<code style="font-size:11px">${esc(url)}</code></div>
    <div class="flabel">同期コード（他の端末にも入力してください）</div>
    <input id="cloudCodeShow" readonly value="${esc(code)}" style="font-family:monospace;font-size:15px;letter-spacing:.05em">
    <div class="act">
      <button id="cloudCopyCode">コピー</button>
      <button id="cloudNowBtn">🔄 今すぐ同期</button>
    </div>
    <div class="mini" style="margin-top:8px">最終同期：${lastSync}</div>
    <div class="act" style="margin-top:12px"><button id="cloudUnlink" style="color:var(--red);border-color:var(--red)">この端末の同期を解除</button></div>`;
}
function bindSyncSettings(){
  const us=$('#cloudUrlSave');
  if(us) us.onclick=()=>{
    const v=$('#cloudUrlInput').value.trim();
    if(!v){ toast('URLを入力してください'); return; }
    try{ localStorage.setItem(SYNC_URL_KEY,v); }catch(e){}
    renderSyncSettings();
  };
  const ue=$('#cloudUrlEdit');
  if(ue) ue.onclick=()=>{
    if(confirm('データベースURLを変更しますか？（同期コードも解除されます）')){
      try{ localStorage.removeItem(SYNC_URL_KEY); localStorage.removeItem(SYNC_CODE_KEY); }catch(e){}
      renderSyncSettings();
    }
  };
  const gen=$('#cloudGenBtn');
  if(gen) gen.onclick=async()=>{
    const code=randomSyncCode();
    try{ localStorage.setItem(SYNC_CODE_KEY,code); }catch(e){}
    touchUpdated();
    await pushToCloud();
    toast('同期コードを発行しました');
    renderSyncSettings();
  };
  const jo=$('#cloudJoinBtn');
  if(jo) jo.onclick=async()=>{
    const v=$('#cloudCodeInput').value.trim();
    if(!v){ toast('コードを入力してください'); return; }
    try{ localStorage.setItem(SYNC_CODE_KEY,v); }catch(e){}
    const got=await pullFromCloud(true);
    if(!got) toast('コードを保存しました（クラウドにまだデータがありません）');
    renderSyncSettings();
  };
  const cc=$('#cloudCopyCode');
  if(cc) cc.onclick=async()=>{
    const el=$('#cloudCodeShow'); el.select();
    try{ await navigator.clipboard.writeText(el.value); toast('コピーしました'); }
    catch(e){ document.execCommand('copy'); toast('コピーしました'); }
  };
  const nb=$('#cloudNowBtn');
  if(nb) nb.onclick=async()=>{
    await pushToCloud();
    await pullFromCloud(true);
    renderSyncSettings();
    toast('同期しました');
  };
  const ul=$('#cloudUnlink');
  if(ul) ul.onclick=()=>{
    if(confirm('この端末の同期を解除しますか？（データは削除されません）')){
      try{ localStorage.removeItem(SYNC_CODE_KEY); }catch(e){}
      renderSyncSettings();
    }
  };
}
function renderSyncSettings(){
  const el=$('#cloudSyncBox'); if(!el) return;
  el.innerHTML=syncSettingsHTML();
  bindSyncSettings();
}
function setStatus(id,val){ status[id]=val; saveStatus(); }
function cycleStatus(id){
  const cur=status[id]||0;
  const next=(cur+1)%3;
  setStatus(id,next);
  return next;
}

  view:'list',

};
try{ const t=localStorage; }catch(e){}

const $=s=>document.querySelector(s);
const app=$('#app');
function esc(s){ if(!s) return ''; return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1500); }
function shuffled(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; }

function counts(list){ const c=[0,0,0]; list.forEach(q=>c[status[q.id]||0]++); return c; }
function markClass(s){ return s===2?'ok':(s===1?'warn':''); }
function meter(){
  const c=counts(ALL_Q), t=ALL_Q.length||1;
  $('#meter').innerHTML=`<i class="m3" style="width:${c[2]/t*100}%"></i><i class="m2" style="width:${c[1]/t*100}%"></i>`;
}

function listFiltered(){
  const q=S.search.trim().toLowerCase();
  return ALL_Q.filter(w=>{
    if(!S.selectedChapters.has(w.chNum)) return false;
    if(w.importance && !S.selectedImportance.has(w.importance)) return false;
    if(S.excludedMajors.has(majorKey(w.chNum,w.major))) return false;
    const st=status[w.id]||0;
    if(S.statusFilter!=='all' && String(st)!==S.statusFilter) return false;
    if(q && !((w.statement||'').toLowerCase().includes(q) || (w.explanation||'').toLowerCase().includes(q) || (w.citation||'').toLowerCase().includes(q))) return false;
    return true;
  });
}

      ${edit?'<button id="fDelete" class="danger">削除</button>':'<span></span>'}
      <button id="fSave" class="btn-main">保存</button>
    </div>
  </div>`;
}
function openAddForm(id){
  editingId = id || null;
  const edit = id ? customQs.find(q=>q.id===id) : null;
  addAnswerVal = edit ? edit.answer : null;
  const ov=$('#addOverlay');
  ov.innerHTML = addFormHTML(edit);
  ov.style.display='flex';
  document.querySelectorAll('#addOverlay .oxbtn').forEach(b=>{
    if((b.dataset.v==='true')===addAnswerVal) b.classList.add('sel');
    b.onclick=()=>{
      addAnswerVal = b.dataset.v==='true';
      document.querySelectorAll('#addOverlay .oxbtn').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel');
    };
  });
  $('#addClose').onclick=closeAddForm;
  $('#fSave').onclick=saveAddForm;
  const del=$('#fDelete');
  if(del) del.onclick=()=>{
    if(confirm('この問題を削除しますか？')){
      customQs=customQs.filter(q=>q.id!==editingId);
      saveCustomQs(); rebuildIndexes(); closeAddForm(); render();
      toast('削除しました');
    }
  };
}
function closeAddForm(){
  const ov=$('#addOverlay');
  ov.style.display='none'; ov.innerHTML='';
}
function saveAddForm(){
  const chNum=parseInt($('#fChapter').value);
  const major=$('#fMajor').value.trim();
  const importance=$('#fImportance').value;
  const statement=$('#fStatement').value.trim();
  const citation=$('#fCitation').value.trim();
  const explanation=$('#fExplanation').value.trim();
  if(!statement){ toast('問題文を入力してください'); return; }
  if(addAnswerVal===null){ toast('正誤を選んでください'); return; }
  if(editingId){
    const q=customQs.find(x=>x.id===editingId);
    Object.assign(q,{chNum,major,importance,statement,answer:addAnswerVal,citation,explanation});
  }else{
    customQs.push({id:'custom_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
      chNum,major,importance,statement,answer:addAnswerVal,citation,explanation});
  }
  saveCustomQs();
  rebuildIndexes();
  closeAddForm();
  render();
  toast(editingId?'更新しました':'追加しました');
}

/* ---------- QUIZ VIEW ---------- */
function quizPool(){
  return ALL_Q.filter(w=>
    S.selectedChapters.has(w.chNum) &&
    (!w.importance || S.selectedImportance.has(w.importance)) &&
    !S.excludedMajors.has(majorKey(w.chNum,w.major)) &&
    (S.statusFilter==='all' || String(status[w.id]||0)===S.statusFilter)
  );
}
function startQuiz(){
  const pool=quizPool();
  if(!pool.length) return;
  let qs = S.shuffle? shuffled(pool): pool.slice();
  if(S.quizCount!=='all'){
    const n=parseInt(S.quizCount);
    if(n>0 && n<qs.length) qs=qs.slice(0,n);
  }
  qs = qs.map(q=>({...q, _userAns:null}));
  S.quiz={ qs, i:0 };
  render();
}
function viewQuiz(){
  if(!S.quiz){
    const pool=quizPool();
    const countOpts=[10,20,30,50,100].filter(n=>n<pool.length);
    app.innerHTML=controls()+`<div class="stat-card">
      <div class="mini">現在の絞り込みで <b>${pool.length}</b> 問が対象です。</div>
      <div class="row" style="margin-top:10px">
        <select id="quizCount">
          <option value="all">出題数：全問（${pool.length}問）</option>
          ${countOpts.map(n=>`<option value="${n}" ${S.quizCount===String(n)?'selected':''}>出題数：${n}問</option>`).join('')}
        </select>
        <button id="shf" aria-pressed="${S.shuffle}">シャッフル：${S.shuffle?'ON':'OFF'}</button>
      </div>
      <div class="act">
        <button class="btn-main" id="go" style="border:1px solid var(--ink)" ${pool.length?'':'disabled'}>テストを始める</button>
      </div></div>`;
    bindControls();
    const cs=$('#quizCount'); if(cs){ cs.value=S.quizCount; cs.onchange=e=>{ S.quizCount=e.target.value; render(); }; }
    $('#shf').onclick=()=>{ S.shuffle=!S.shuffle; render(); };
    const go=$('#go'); if(go) go.onclick=startQuiz;
    return;
  }
  const Q=S.quiz;
  if(Q.i>=Q.qs.length){
    const answered=Q.qs.filter(q=>q._userAns!==null);
    const ok=answered.filter(q=>q._userAns===q.answer).length;
    const missed=answered.filter(q=>q._userAns!==q.answer);
    const skipped=Q.qs.length-answered.length;
    const pc=answered.length? Math.round(ok/answered.length*100):0;
    app.innerHTML=`<div class="score">
      <div class="big">${ok} <span style="font-size:22px;color:var(--ink-3)">/ ${answered.length}</span></div>
      <div class="mini" style="margin-top:10px">正答率 ${pc}％${skipped?'　（未回答 '+skipped+'問）':''}</div>
      <div class="act" style="justify-content:center">
        <button id="navBack" style="border:1px solid var(--rule)">‹ 最後の問題に戻る</button>
        <button class="btn-main" id="again" style="border:1px solid var(--ink)">もう一度</button>
        <button id="toList">一覧に戻る</button>
      </div></div>
      ${missed.length? `<div class="sec"><h2>間違えた問題（${missed.length}問）</h2><span></span></div>
      <ol class="list">${missed.map(m=>`<li class="item" style="grid-template-columns:1fr">
        <div><div class="en">${esc(m.statement)}</div>
        <div class="ja">正解：${m.answer?'○（正しい）':'✕（誤り）'}</div>
        <div class="note">${esc((m.citation?m.citation+'　':'')+m.explanation)}</div></div></li>`).join('')}</ol>`:''}`;
    $('#navBack').onclick=()=>{ Q.i=Q.qs.length-1; render(); };
    $('#again').onclick=()=>{ S.quiz=null; startQuiz(); };
    $('#toList').onclick=()=>{ S.quiz=null; setView('list'); };
    return;
  }
  const w=Q.qs[Q.i];
  let bottom='';
  if(w._userAns===null){
    bottom=`<div class="oxbtns">
      <button class="oxbtn maru" id="bm">○</button>
      <button class="oxbtn batsu" id="bx">✕</button>
    </div>`;
  } else {
    const correct = w._userAns===w.answer;
    bottom=`<div class="result-banner ${correct?'ok':'ng'}">
        <div class="rmark">${w.answer?'○':'✕'}</div>
        <div class="rtxt">${correct?'正解！':'不正解'}　正解は「${w.answer?'○（正しい）':'✕（誤り）'}」</div>
      </div>
      <div class="q-result">
        ${w.citation?`<div class="r-cite">${esc(w.citation)}</div>`:''}
        <div class="r-note">${esc(w.explanation)||'（解説なし）'}</div>
      </div>
      <div class="memo-box">
        <label>📝 メモ <span class="memo-saved" data-memo-saved="${w.id}">保存しました</span></label>
        <textarea data-memo-input="${w.id}" placeholder="覚え方やひっかけポイントなど">${esc(notes[w.id]||'')}</textarea>
      </div>
      <div class="grade">
        <button class="g2" data-g="1">✕<b>ダメ</b></button>
        <button class="g3" data-g="2">○<b>覚えた</b></button>
      </div>`;
  }
  app.innerHTML=`
    <div class="q-head"><span>第${w.chNum}章 ${w.chName}${w.major?'／'+w.major:''}</span><span>${Q.i+1} / ${Q.qs.length}</span></div>
    <div class="q-stem"><div class="qt">${esc(w.statement)}</div>${w.refs?`<div class="refs">${esc(w.refs)}</div>`:''}</div>
    ${bottom}
    <div class="navrow2">
      <button id="navPrev" ${Q.i===0?'disabled':''}>‹ 前の問題</button>
      <button id="navNext">${Q.i===Q.qs.length-1?'結果を見る ›':'次の問題 ›'}</button>
    </div>
  `;
  if(w._userAns===null){
    $('#bm').onclick=()=>submitAnswer(true);
    $('#bx').onclick=()=>submitAnswer(false);
  } else {
    const mi=$('[data-memo-input]'); if(mi) mi.oninput=e=>scheduleSaveNote(w.id,e.target.value);
    document.querySelectorAll('.grade button').forEach(b=>b.onclick=()=>{
      setStatus(w.id,+b.dataset.g); meter(); nextQuestion();
    });
  }
  $('#navPrev').onclick=()=>{ if(Q.i>0){ Q.i--; render(); } };
  $('#navNext').onclick=()=>{ Q.i++; render(); };
}
function submitAnswer(userAns){
  const Q=S.quiz, w=Q.qs[Q.i];
  w._userAns=userAns;
  render();
}
function nextQuestion(){
  const Q=S.quiz;
  Q.i++;
  render();
}

/* ---------- RECORD VIEW ---------- */
function viewRecord(){
  const c=counts(ALL_Q), t=ALL_Q.length;
  const rows=CHAPTERS.map(ch=>{
    const list=BY_CHAPTER[ch.n], cc=counts(list), ct=list.length||1;
    return `<div class="stat-row"><div class="nm">第${ch.n}章 ${ch.name}</div>
      <div class="bar">${[2,1].map(k=>`<i style="width:${cc[k]/ct*100}%;background:var(--${k===2?'ok':'warn'})"></i>`).join('')}</div>
      <div class="pc">${Math.round(cc[2]/ct*100)}%</div></div>`;
  }).join('');

  app.innerHTML=`
  ${HAS_LS?'':'<div class="stat-card" style="border-color:var(--red)"><div class="mini" style="color:var(--red)">⚠️ このブラウザでは保存機能が使えないため、学習記録は画面を閉じると消えます（Safariのプライベートブラウズ中など）。通常モードで開き直してください。</div></div>'}
  <div class="stat-card">
    <div class="mini">覚えた <b>${c[2]}</b>／ダメ <b>${c[1]}</b>／未学習 <b>${c[0]}</b>（全 ${t} 問）</div>
    <div style="height:10px"></div>
    ${rows}
    <div class="legend"><span class="lg3">覚えた</span><span class="lg2">ダメ</span><span class="lg0">未学習</span></div>
  </div>
  <div class="stat-card">
    <div class="mini">📶 複数端末で自動的に同期する（Firebase・初回のみ設定）</div>
    <div id="cloudSyncBox" style="margin-top:10px"></div>
  </div>
  <div class="stat-card">
    <div class="mini">学習記録（未／ダメ／覚えた・メモ）は端末ごとに保存されます。上の自動同期を使わない場合は、下のコードを表示してコピーし、別の端末でこの画面に貼り付けて読み込むことでも引き継げます。</div>
    <div class="act">
      <button id="exportBtn">引き継ぎコードを表示</button>
      <button id="importBtn">コードから読み込む</button>
    </div>
    <div id="syncBox" style="display:none;margin-top:10px">
      <textarea id="syncText" rows="5" style="width:100%;font-size:11px;border:1px solid var(--rule);background:var(--panel);color:var(--ink);padding:6px;border-radius:var(--radius)" placeholder="ここに引き継ぎコードを貼り付けてください"></textarea>
      <div class="act">
        <button id="syncCopy">コピー</button>
        <button id="syncLoad">このコードを読み込む</button>
      </div>
    </div>
  </div>
  `;
  renderSyncSettings();
  $('#exportBtn').onclick=()=>{
    const code=JSON.stringify({v:1,status,notes});
    const box=$('#syncBox'), ta=$('#syncText');
    box.style.display='block'; ta.value=code; ta.select();
    toast('下のコードを全選択してコピーしてください');
  };
  $('#importBtn').onclick=()=>{
    const box=$('#syncBox');
    box.style.display='block'; $('#syncText').value=''; $('#syncText').focus();
  };
  $('#syncCopy').onclick=async()=>{
    const ta=$('#syncText'); ta.select();
    try{ await navigator.clipboard.writeText(ta.value); toast('コピーしました'); }
    catch(e){ document.execCommand('copy'); toast('コピーしました'); }
  };
  $('#syncLoad').onclick=()=>{
    try{
      const data=JSON.parse($('#syncText').value.trim());
      if(!data || typeof data!=='object') throw new Error('bad');
      status=data.status||{};
      notes=data.notes||{};
      saveStatus();
      if(HAS_LS){ try{ localStorage.setItem(LS_NOTES_KEY,JSON.stringify(notes)); }catch(e){} }
      rebuildIndexes();
      meter(); render(); toast('読み込みました');
    }catch(e){ toast('このコードは読み込めません'); }
  };
}

/* ---------- ROUTER ---------- */
function render(){
  document.body.classList.toggle('hide', S.sheet && S.view==='list');
  ({list:viewList, quiz:viewQuiz, record:viewRecord})[S.view]();
  meter();
}
function setView(v){
  S.view=v;
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected', b.dataset.view===v));
  window.scrollTo(0,0);
  render();
}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>setView(b.dataset.view));
$('#btnSheet').onclick=()=>{
  S.sheet=!S.sheet; $('#btnSheet').setAttribute('aria-pressed',S.sheet);
  render();
  toast(S.sheet?'赤シートをかけました（一覧の答えが隠れます）':'赤シートを外しました');
};
$('#btnTheme').onclick=()=>{
  document.documentElement.dataset.theme = document.documentElement.dataset.theme==='dark' ? 'light':'dark';
};
$('#btnAdd').onclick=()=>openAddForm(null);

(async()=>{
  app.innerHTML=`<div class="empty">読み込み中...</div>`;
  await loadStorage();
  render();
  pullFromCloud(true);
})();
</script>
</body>
</html>
