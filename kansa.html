範性次第では不適正意見を表明することもある。"}, {"l": 189, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "監査人が，開示すべき重要な不備があるとした経営者の評価の結果を適正と認め，かつ期末日後に実施した是正措置が内部統制報告書に記載されているものの，監査人が当該記載を不適切であると判断した場合には，監査人は除外事項を付した限定付適正意見を表明しなければならない。", "a": true, "c": "R４Ⅰ⑧エ", "e": "上の問題と矛盾する悪問💢本肢の虚偽表示による影響に広範性があれば不適正意見を表明することはあり得る。どう考えても出題ミス。"}, {"l": 190, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "経営者は，期中に発見された開示すべき重要な不備に対する是正措置の実施が期末日には間に合わず，期末日後に実施したため，内部統制報告書において，財務報告に係る内部統制は有効でない旨，開示すべき重要な不備の内容及びそれが是正されない理由を記載した上で，付記事項として是正措置を記載している。この場合，監査人は，当該是正措置の内容の記載が適切であれば，内部統制監査報告書において，追記情報として当該是正措置の内容を記載する。", "a": true, "c": "H28Ⅱ⑧ア", "e": ""}, {"l": 191, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "監査人は，内部統制に開示すべき重要な不備を発見した場合，期末日後，監査報告書の提出日までに，経営者が当該不備に対する是正措置を講じ，有効な内部統制を整備し，その運用の有効性を確認していれば，内部統制監査報告書に当該不備や是正措置に関して記載する必要はない。", "a": false, "c": "H26Ⅰ⑯エ", "e": "上記の問題を参照"}, {"l": 192, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "監査人は，内部統制監査報告書において除外事項を付した限定付適正意見を表明する場合には，除外した不適切な事項及び当該事項が内部統制の有効性に及ぼす影響について記載しなければならない。", "a": false, "c": "H23Ⅱ⑳オ", "e": "本肢の場合に内部統制監査報告書に記載する事項は，除外した不適切な事項及び当該事項が「財務諸表監査に及ぼす影響」である。"}, {"l": 193, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "内部統制報告書に対する監査意見は，財務報告に係る内部統制に対する経営者の評価結果に関して表明されるが，意見に関する除外事項が存在するかどうかの判断は，経営者の評価結果のみならず，経営者が決定した内部統制の評価範囲，評価手続の適切性に関してもなされる。", "a": true, "c": "H26Ⅱ⑯ア", "e": ""}, {"l": 194, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "監査人は，経営者の作成した内部統制報告書において，評価範囲，評価手続及び評価結果に不適切なものがあり，無限定適正意見を表明できないと判断した場合には，期末日の翌日から監査報告書日までの間に開示すべき重要な不備が是正されたときであっても，限定付適正意見または不適正意見を表明しなければならない。", "a": true, "c": "H25Ⅱ⑳イ", "e": ""}, {"l": 195, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "監査人は，期末日時点で開示すべき重要な不備があり，その旨を経営者が内部統制報告書に記載している場合には，それが監査報告書日までに是正されない限り，内部統制報告書が不適正である旨の意見を表明しなければならない。", "a": false, "c": "H31Ⅱ⑧エ／H24Ⅱ⑳ア／H23Ⅱ⑳イ", "e": "本肢の場合は，内部統制報告書に重要な虚偽表示はないため，監査人は無限定適正意見を表明することになる。"}, {"l": 196, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "経営者が，内部統制報告書に財務報告に係る内部統制に開示すべき重要な不備の内容，それが是正されていない理由及び財務報告に係る内部統制が有効でない旨を記載しており，それらの記載が適切である場合，監査人は，内部統制監査報告書において不適正意見を表明しなければならない。", "a": false, "c": "H29Ⅱ⑧エ", "e": "同上"}, {"l": 197, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "経営者は，期中に二つの開示すべき重要な不備を特定し，いずれも期末日までに是正措置を講じていない状況にあるにもかかわらず，監査人の二つとも開示すべきという要請に応じず，内部統制報告書において，一つの開示すべき重要な不備の内容を記載し，財務報告に係る内部統制は有効でない旨及び当該開示すべき重要な不備が是正されない理由を記載している。この場合，監査人は，内部統制監査報告書において，他の一つの開示すべき重要な不備を記載していない影響が内部統制報告書全体として虚偽の表示にあたるほど重要であると判断したならば，不適正意見を表明する。", "a": true, "c": "H28Ⅱ⑧イ", "e": "なお，本肢の状況では，「影響が内部統制報告書全体として虚偽の表示にあたるほど重要であると判断したならば」の条件がなくとも不適正意見を表明することになると思われる。"}, {"l": 198, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "財務報告に係る内部統制に開示すべき重要な不備が存在する場合，内部統制報告書において当該不備が存在することを理由として内部統制は有効でない旨の評価がなされており，かつ監査人が当該不備に関する開示を適切であると判断した場合，監査人は，内部統制監査報告書において当該不備を追記しなければならない。", "a": true, "c": "H25Ⅰ⑲ア", "e": ""}, {"l": 199, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "経営者が財務報告に係る内部統制に開示すべき重要な不備の内容及びそれが是正されない理由を内部統制報告書に記載している場合，監査人は，当該開示すべき重要な不備がある旨及び当該開示すべき重要な不備が財務諸表監査に及ぼす影響を内部統制監査報告書に追記しなければならない。", "a": true, "c": "H29Ⅰ⑦ア／H24Ⅰ⑳エ", "e": ""}, {"l": 200, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "内部統制の不備が開示すべき重要な不備に該当するかどうかは，虚偽記載をもたらす金額的な重要性及び質的な重要性によって判断されるが，当該開示すべき重要な不備が内部統制報告書に適切に開示されている場合，内部統制監査報告書には，当該開示すべき重要な不備が財務諸表に与える影響額を追記することは求められていない。", "a": true, "c": "H26Ⅱ⑯エ", "e": ""}, {"l": 201, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "経営者の作成した内部統制報告書において，財務報告に係る内部統制に存在する開示すべき重要な不備の内容及び是正されない理由が記載されている場合，監査人は，内部統制監査報告書に，当該開示すべき重要な不備の内容及び是正されない理由を追記しなければならない。", "a": false, "c": "H25Ⅱ⑳ア", "e": "本肢の場合に監査人が追記情報として記載する内容は，当該開示すべき重要な不備がある旨及び当該開示すべき重要な不備が財務諸表監査に及ぼす影響であり，開示すべき重要な不備の内容と是正されない理由は記載しない。"}, {"l": 202, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "経営者は，やむを得ない事情により，内部統制の一部について十分な評価手続を実施できなかった場合には，当該範囲を除外して内部統制報告書を作成することができる。この場合，監査人は，当該事情に正当性が認められると判断して，無限定適正意見を表明することがある。", "a": true, "c": "R２Ⅰ⑦ウ", "e": ""}, {"l": 203, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "監査人は，正当な理由と認められるやむを得ない事情により十分な評価を実施できなかった範囲を除き，内部統制報告書が財務報告に係る内部統制の評価について，すべての重要な点において適正に表示していると認められると判断した場合，無限定適正意見を表明する。", "a": true, "c": "H30Ⅰ⑧ウ／H29Ⅰ⑦ウ", "e": ""}, {"l": 204, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "経営者が，内部統制の一部について，やむを得ない事情により評価手続を実施できなかった場合において，当該事情の正当性が認められないときには，監査人は，内部統制報告書に対する影響の重要性と広範性を考慮した上で，意見に関する除外事項を付した限定付適正意見又は不適正意見を表明しなければならない。", "a": false, "c": "H26Ⅱ⑯ウ", "e": "本肢は監査範囲の制約として扱うべき状況であるため，監査人は，限定付適正意見の表明又は意見不表明とすることになる。"}, {"l": 205, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "経営者は，評価範囲に含めるべきであると監査人が判断した内部統制について，監査人による評価範囲に含めるべきであるとする要請にもかかわらず，評価範囲に含めずに内部統制評価を実施し，内部統制報告書において，財務報告に係る内部統制は有効である旨の記載をしている。この場合，監査人は，当該事象の内部統制報告書全体に対する影響を検討した上で，除外事項を付した限定付適正意見又は不適正意見を表明する。", "a": false, "c": "H28Ⅱ⑧ウ／H27Ⅰ⑥ア", "e": "本肢は監査範囲の制約として扱うべき状況であるため，監査人は，限定付適正意見の表明又は意見不表明とすることになる。"}, {"l": 206, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "A", "r": "", "q": "経営者は，必要な評価範囲の内部統制の評価手続を完了できず，全体として，評価結果を表明するに足る証拠が得られないため，内部統制報告書において，財務報告に係る内部統制の評価結果を表明できない旨並びに実施できなかった評価手続及びその理由を記載している。この場合，監査人は，内部統制報告書の記載内容に誤りがなければ，内部統制監査報告書において，無限定適正意見を表明した上で，追記情報として実施されなかった評価手続とその理由を記載する。", "a": false, "c": "H28Ⅱ⑧エ", "e": "内部統制報告書において，経営者による評価結果が表明されていない場合，内部統制の有効性に関する経営者の主張が存在しないため，監査人は意見を表明してはならない。"}, {"l": 207, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "C", "r": "", "q": "平成１９年の基準設定に際し，財務報告に係る内部統制の評価及び監査に関わるコスト負担が過大なものとならないための方策として採用されたものには，トップダウン型のリスク・アプローチの活用は含まれなかった。", "a": false, "c": "R７Ⅰ③ア", "e": "我が国における「財務報告に係る内部統制の評価及び監査の基準」では，設定当初からトップダウン型のリスク・アプローチが採用されている。なお，同基準が平成１９年に設定された点は正しい。"}, {"l": 208, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "C", "r": "", "q": "内部統制監査において，トップ・ダウン型のリスク・アプローチが採用された背景には，財務諸表監査に事業上のリスク等を重視したリスク・アプローチが導入されたことにより，財務諸表全体レベルでの重要な虚偽表示リスクを評価することが監査人に求められるようになったことがある。", "a": false, "c": "H27Ⅰ⑥エ", "e": "トップ・ダウン型のリスク・アプローチの採用は，実務上のコスト負担を軽減することを背景にしたものである。"}, {"l": 209, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "C", "r": "", "q": "平成23年の基準改訂に際し，「重要な欠陥」が，企業自体に欠陥があるとの誤解を招くとの指摘から，その定義は実質上変更されることなく，「開示すべき重要な不備」へと置き換えられた。", "a": true, "c": "R７Ⅰ③イ", "e": ""}, {"l": 210, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "C", "r": "", "q": "令和元年の基準改訂に際し，財務諸表監査の監査報告書の記載内容と整合させるため，監査人の意見を内部統制監査報告書の冒頭に記載することとし，記載順序を変更するとともに，新たに意見の根拠区分を設けた。", "a": true, "c": "R７Ⅰ③ウ", "e": ""}, {"l": 211, "m": "財務報告に係る内部統制の報告と監査", "sb": "", "i": "C", "r": "", "q": "令和５年の基準改訂に際し，内部統制の評価範囲の決定は経営者のリスク評価に基づくべきとの観点から，評価対象とする重要な事業拠点を選定する際の指標として例示されていた「連結ベースの売上高等の一定割合（おおむね３分の２程度）」との文言は，削除された。", "a": false, "c": "R７Ⅰ③エ", "e": "令和５年の基準改訂後の現在においても，本肢の文言は削除されていない。👉講義レジュメ⑦-3-6"}, {"l": 212, "m": "中間監査", "sb": "", "i": "B", "r": "", "q": "中間監査と年度監査で要求される保証水準は，ともに合理的保証であるため，中間監査は，年度監査と同一の「適正性」という立証命題を設定している。", "a": false, "c": "R４Ⅱ⑫ウ", "e": "合理的保証である旨の記述は正しいが，中間監査で設定される立証命題は，「適正性」ではなく「有用性」である。"}, {"l": 213, "m": "中間監査", "sb": "", "i": "B", "r": "", "q": "中間監査は，中間財務諸表を対象にしているものの監査として位置付けられることから，年度監査と同程度の信頼性を保証する。", "a": false, "c": "R５Ⅰ⑫ア", "e": "中間監査は年度監査と同じ合理的保証業務ではあるが，その水準は年度監査より低い。"}, {"l": 214, "m": "中間監査", "sb": "", "i": "B", "r": "", "q": "監査人が中間監査を行うに当たり，中間監査基準の他に，監査に関する品質管理基準が適用されるが，監査基準はそのまま中間監査に適用されるのではなく基本的には準用される。", "a": true, "c": "H31Ⅰ⑪エ", "e": ""}]}, {"n": 8, "name": "新しい保証業務", "qs": [{"l": 1, "m": "特別目的の財務諸表の監査と準拠性の意見の表明", "sb": "", "i": "B", "r": "", "q": "監査基準の「第一監査の目的」においては，一般目的の財務諸表又は特別目的の財務諸表を対象とした準拠性に関する意見表明が可能であることが付記されている。", "a": true, "c": "R４Ⅰ⑪ウ", "e": ""}, {"l": 2, "m": "特別目的の財務諸表の監査と準拠性の意見の表明", "sb": "", "i": "B", "r": "", "q": "監査基準の「第一監査の目的」においては，一般目的の財務諸表の監査と特別目的の財務諸表の監査では保証水準が異なることが明示されている。", "a": false, "c": "R４Ⅰ⑪ア", "e": "一般目的の財務諸表の監査と特別目的の財務諸表の監査で保証水準は異ならないため，当然，監査基準の「第一監査の目的」においてもそのような明示規定は存在しない。"}, {"l": 3, "m": "特別目的の財務諸表の監査と準拠性の意見の表明", "sb": "", "i": "B", "r": "", "q": "監査人は，監査契約の締結に当たり，財務報告の枠組みの受入可能性の検討が必要になるが，この枠組みは認知されている会計基準設定主体により公表されることがある。このような枠組みであっても，当該設定主体が，確立された透明性のあるプロセスに従っていることのみで受入可能な枠組みであるとは推定できない。", "a": false, "c": "R６Ⅱ⑲エ", "e": "財務報告の枠組みの設定主体が，確立された透明性のあるプロセスに従っているのであれば，当該枠組みを受入可能なものとして推定することができる。"}, {"l": 4, "m": "特別目的の財務諸表の監査と準拠性の意見の表明", "sb": "", "i": "B", "r": "", "q": "一般目的の財務報告の枠組みを基礎として策定された特別目的の財務報告の枠組みが，適正表示の枠組みである場合には，監査人は，適正性に関する意見を表明しなければならない。", "a": false, "c": "R４Ⅰ⑪エ", "e": "本肢のような特別目的の財務報告の枠組みの場合，形式的に適正表示の枠組みの定義を満たしているに過ぎない場合もあるため，監査人が準拠性に関する意見を表明することもある。"}, {"l": 5, "m": "特別目的の財務諸表の監査と準拠性の意見の表明", "sb": "", "i": "B", "r": "", "q": "監査人は，特別の利用目的に適合した会計の基準により作成されている財務諸表に対し，当該財務諸表が会計の基準に準拠して作成されているとする意見を表明する場合には，財務諸表に重要な虚偽の表示がないことについて合理的な保証を得る必要はない。", "a": false, "c": "H30Ⅰ⑫イ／H29Ⅰ⑲ウ", "e": "監査人は，特別目的の財務諸表に対して準拠性の意見を表明する場合は，一般目的の財務諸表に対して適正性の意見を表明する場合と同様に，重要な虚偽表示がないことについて合理的な保証を得る必要がある。"}, {"l": 6, "m": "特別目的の財務諸表の監査と準拠性の意見の表明", "sb": "", "i": "B", "r": "", "q": "平成２６年改訂では，監査の目的に準拠性に関する意見表明が加わった。この準拠性に関する意見には，適正性に関する意見と同様に，財務諸表に重要な虚偽の表示がないことの合理的な保証を得たとの監査人の判断が含まれる。", "a": true, "c": "R４Ⅱ⑪ウ", "e": ""}, {"l": 7, "m": "特別目的の財務諸表の監査と準拠性の意見の表明", "sb": "", "i": "A", "r": "", "q": "監査人は，特別目的の財務諸表の監査を行う場合，準拠性に関する意見のみを表明するのであり，適正性に関する意見を表明することはできない。", "a": false, "c": "H30Ⅰ②ウ", "e": "監査人は，特別目的の財務諸表の監査を行う場合，準拠性に関する意見のみならず，適正性に関する意見を表明することもできる。"}, {"l": 8, "m": "特別目的の財務諸表の監査と準拠性の意見の表明", "sb": "", "i": "A", "r": "", "q": "特別の利用目的に適合した会計の基準に準拠して作成された財務諸表に対して準拠性に関する無限定意見を表明する場合には，監査人は，監査報告書に，財務諸表がすべての重要な点において適用される財務報告の枠組みに準拠して適正に表示されている旨を記載しなければならない。", "a": false, "c": "H29Ⅰ⑲イ", "e": "特別目的の財務諸表に対して準拠性に関する無限定意見を表明する場合には，財務諸表がすべての重要な点において「適用される財務報告の枠組みに準拠して作成されている旨」を記載する。"}, {"l": 9, "m": "特別目的の財務諸表の監査と準拠性の意見の表明", "sb": "", "i": "A", "r": "", "q": "特別の利用目的に適合した会計の基準に準拠して作成された財務諸表に対して意見を表明する場合には，財務諸表が適用される財務報告の枠組みに準拠して作成されているかどうかの判断に当たって，監査人は，経営者が採用した会計方針が，当該枠組みに準拠して継続的に適用されているかどうかのみを評価する。", "a": false, "c": "H29Ⅰ⑲ア", "e": "特別目的の財務諸表に対して準拠性に関する意見を表明する場合は，本肢の評価のみならず，会計方針の選択及び適用方法が会計事象や取引を適切に反映するものであるかどうかや，財務諸表の表示方法が適切であるかどうかも評価しなければならない。"}, {"l": 10, "m": "特別目的の財務諸表の監査と準拠性の意見の表明", "sb": "", "i": "A", "r": "", "q": "特別の利用目的に適合した会計の基準により作成される財務諸表の作成目的は，監査人によって，当該財務諸表に対する監査報告書上の追記情報として記載されなければならない。", "a": true, "c": "H29Ⅰ⑲エ", "e": ""}, {"l": 11, "m": "特別目的の財務諸表の監査と準拠性の意見の表明", "sb": "", "i": "A", "r": "", "q": "特別目的の財務諸表に対する監査の場合，監査人は，監査報告書に財務諸表の作成目的及び想定利用者を記載するか，又はこれらの情報について記載している特別目的の財務諸表の注記への参照を付さなければならない。", "a": true, "c": "R６Ⅱ⑲ア", "e": "財務諸表の作成目的と想定利用者の範囲の記載は，注記参照方式によることもできる。"}, {"l": 12, "m": "特別目的の財務諸表の監査と準拠性の意見の表明", "sb": "", "i": "A", "r": "", "q": "財務諸表の作成基準が明確に確立していない状況において，利害関係者の間で枠組みが決定され，特別目的の財務報告の枠組みとして取り扱われている場合，監査人は，監査報告書に当該財務諸表が特定の利用者のみを想定している旨，及び配布又は利用の制限を付すことが適切である旨を記載すればよく，他の目的には適合しないことがある旨の記載まで求められていない。", "a": false, "c": "R２Ⅱ⑱ア", "e": "特別目的の財務諸表に対する監査報告書では，当該財務諸表が他の目的には適合しないことがある旨も必ず記載されなければならない。また，配布又は利用制限は必要な場合にのみ付されることになる。"}, {"l": 13, "m": "特別目的の財務諸表の監査と準拠性の意見の表明", "sb": "", "i": "A", "r": "", "q": "特別目的の財務諸表に対する監査報告書においては，監査人は，その他の事項区分を設けて，財務諸表は特別目的の財務報告の枠組みに準拠して作成されており，他の目的には適合しないことがあることを説明しなければならない。", "a": false, "c": "R６Ⅱ⑲イ", "e": "本肢の記載は，強調事項区分に行うものである。"}, {"l": 14, "m": "特別目的の財務諸表の監査と準拠性の意見の表明", "sb": "", "i": "A", "r": "", "q": "監査人は，特別の利用目的に適合した会計の基準により作成される財務諸表に対する監査報告書において，想定される主な利用者等を記載するとともに，他の目的で利用できる場合がある旨の記載が求められている。", "a": false, "c": "R５Ⅱ⑳エ", "e": "特別目的の財務諸表に対する監査報告書において記載するのは，他の目的で利用できる場合がある旨ではなく，他の目的に適合しないことがある旨である。なお，想定される主な利用者等を記載する点は正しい。"}, {"l": 15, "m": "特別目的の財務諸表の監査と準拠性の意見の表明", "sb": "", "i": "A", "r": "", "q": "特別目的の財務諸表に対する監査報告書には，利用者への注意を喚起するために，強調事項区分を設けて，財務諸表が特別目的の財務報告の枠組みに準拠して作成されており他の目的には適合しないことがある旨を記載すればよく，その利用者は特定されていることから，監査報告書に配布又は利用の制限を付す旨を記載する必要はない。", "a": false, "c": "R２Ⅰ⑰イ", "e": "特別目的の枠組みに関する注意喚起の記載のみでは誤解を十分に避けられないと監査人が考える場合には，配布又は利用制限を付す必要がある。"}, {"l": 16, "m": "個別の財務表又は財務諸表項目等に対する監査", "sb": "", "i": "B", "r": "", "q": "監査基準は，財務諸表の適正性について意見表明することを監査人に求めているため，財務諸表を構成する貸借対照表等の個別の財務表や個別の財務諸表項目等に対する監査意見を表明する場合には，監査基準を適用することはできない。", "a": false, "c": "H30Ⅰ⑫ア", "e": "個別の財務表や個別の財務諸表項目等に対する監査意見を表明する場合についても，監査基準が適用される。また，監査基準は，財務諸表の適正性意見のみならず，準拠性意見の表明についても規定している。"}, {"l": 17, "m": "個別の財務表又は財務諸表項目等に対する監査", "sb": "", "i": "B", "r": "", "q": "公認会計士又は監査法人は，依頼人から，その財務諸表の一部についてのみ監査を行うよう依頼を受けた場合，その監査には企業会計審議会が公表する監査基準を適用してはならない。", "a": false, "c": "R２Ⅰ⑫エ", "e": "同上"}, {"l": 18, "m": "個別の財務表又は財務諸表項目等に対する監査", "sb": "", "i": "B", "r": "", "q": "個別の財務表又は財務諸表項目等に対する監査は，完全な一組の財務諸表に対する監査とは別の業務であるため，一つの監査報告書において両方の監査に対する意見を表明してはならない。", "a": false, "c": "R２Ⅱ⑱イ", "e": "本肢にある業務は，それぞれ別の業務として意見を表明しなければならないが，一つの監査報告書において意見を表明することもできる。この場合，それぞれの意見を別に記載しなければならない。"}, {"l": 19, "m": "個別の財務表又は財務諸表項目等に対する監査", "sb": "", "i": "B", "r": "", "q": "監査人は，完全な一組の財務諸表に対する監査において意見を表明しない場合に，当該財務諸表に含まれる個別の財務表に対して無限定意見を表明してはならない。", "a": true, "c": "R２Ⅱ⑱ウ", "e": "「個別の財務表」の場合は，いかなる場合も無限定意見を表明することはできない。"}, {"l": 20, "m": "個別の財務表又は財務諸表項目等に対する監査", "sb": "", "i": "B", "r": "", "q": "監査人は，全体としての財務諸表に対して意見不表明とする場合であっても，個別の財務表もしくは財務諸表の特定の項目等が，適用される財務報告の枠組みに準拠しているときには，利害関係者への情報提供のため，監査報告書にその旨を記載しなければならない。", "a": false, "c": "H25Ⅱ⑲エ", "e": "全体としての財務諸表に対して意見不表明とする場合に，同じ監査報告書において個別の財務表又は財務諸表項目等について「適用される財務報告の枠組みに準拠している」旨を記載することは，全体としての財務諸表に対して意見不表明としたことと矛盾するため，認められない。"}, {"l": 21, "m": "個別の財務表又は財務諸表項目等に対する監査", "sb": "", "i": "B", "r": "", "q": "監査人は，完全な一組の財務諸表に対する監査において否定的意見を表明した場合であっても，その一部を構成する当該財務諸表項目に対する監査において無限定意見を表明することがある。", "a": true, "c": "R２Ⅱ⑱エ", "e": "「個別の財務諸表項目」の場合は，無限定意見を表明することができる場合がある。"}]}, {"n": 9, "name": "その他の諸論点", "qs": [{"l": 1, "m": "ＩＴ環境下の監査", "sb": "", "i": "B", "r": "", "q": "監査人は，監査計画の策定に当たって，企業の情報技術（IT）の利用状況について理解しなければならないが，これは，ITの利用状況によっては，リスク評価に影響を及ぼすためである。", "a": true, "c": "R４Ⅰ⑭エ", "e": ""}, {"l": 2, "m": "ＩＴ環境下の監査", "sb": "", "i": "B", "r": "", "q": "近年のＩＴ化の進展による監査業務の自動化等の状況を踏まえると，監査人は，監査対象となるデータの収集，整理，加工，分析等を行うデータ・アナリストなどの専門家の活用が求められるが，自らＩＴに関する基礎知識を習得し，アップデートすることまでは求められていない。", "a": false, "c": "R４Ⅱ⑬イ／R６Ⅰ⑪イ", "e": "監査人が保持すべき職業的専門家としての能力には，企業が利用する情報技術とシステムに関する基礎的な知識や技術的な能力が含まれる。"}, {"l": 3, "m": "ＩＴ環境下の監査", "sb": "", "i": "A", "r": "", "q": "手作業による内部統制は，容易に回避，無視又は無効化することができ，また，単純な間違いを起こしやすいため，一般的に，自動化された内部統制ほど信頼性は高くないが，適切な判断や裁量が必要とされる場合には，手作業による内部統制の方が適切になることがある。", "a": true, "c": "H29Ⅰ⑮ア", "e": ""}, {"l": 4, "m": "ＩＴ環境下の監査", "sb": "", "i": "A", "r": "", "q": "ＩＴを利用した情報システムに対する内部統制について，多くのアプリケーションに関する方針及び手続であるＩＴ全般統制の有効性は，業務プロセスにおいて個々のアプリケーションによる取引の処理に適用される手続である情報処理統制によって支えられている。", "a": false, "c": "H29Ⅰ⑮エ", "e": "本肢は，ＩＴ全般統制と情報処理統制の関係性が逆となっている。ＩＴ全般統制の有効性を情報処理統制が支えているのではなく，情報処理統制の有効性をＩＴ全般統制が支えているのである。"}, {"l": 5, "m": "ＩＴ環境下の監査", "sb": "", "i": "A", "r": "", "q": "販売管理システムに入力されるデータが権限者によって承認され，漏れなく正確に記録・処理されることを担保する統制活動は，ＩＴ全般統制に該当する。", "a": false, "c": "H24Ⅰ⑰ア", "e": "本肢の統制活動は，情報処理統制に該当する。"}, {"l": 6, "m": "ＩＴ環境下の監査", "sb": "", "i": "A", "r": "", "q": "システム部門の適切な管理者が販売管理システムと新たに導入する他のシステムとの整合性を確認し，承認を与える統制活動は，情報処理統制に該当する。", "a": false, "c": "H24Ⅰ⑰イ", "e": "本肢の統制活動は，ＩＴ全般統制に該当する。"}, {"l": 7, "m": "ＩＴ環境下の監査", "sb": "", "i": "A", "r": "", "q": "販売管理システムの開発に関与したプログラマが，販売管理システムのオペレータを兼務することがないことを担保する統制活動は，ＩＴ全般統制に該当する。", "a": true, "c": "H24Ⅰ⑰ウ", "e": ""}, {"l": 8, "m": "ＩＴ環境下の監査", "sb": "", "i": "A", "r": "", "q": "販売管理システムにおいて，入力データの正確性を担保する妥当性のチェックを自動化した統制活動は，情報処理統制に該当する。", "a": true, "c": "H24Ⅰ⑰エ", "e": ""}, {"l": 9, "m": "ＩＴ環境下の監査", "sb": "", "i": "A", "r": "", "q": "販売管理システムのプログラムに組み込まれた統制と，人と情報システムが一体となって機能する統制とからなる統制活動であって，情報処理統制が有効に機能する環境を保証するための間接的な統制活動は，ＩＴ全般統制に該当する。", "a": false, "c": "H24Ⅰ⑰オ", "e": "本肢の統制活動は，情報処理統制に該当する。"}, {"l": 10, "m": "業務を委託している企業の監査上の留意事項", "sb": "", "i": "C", "r": "", "q": "被監査会社がその業務の一部を外部に委託している場合，監査人は，受託会社が提供する業務に関する十分な理解を被監査会社から得られなかったときは，受託会社に往査して必要な情報を入手するための手続を実施することもある。", "a": true, "c": "H30Ⅱ⑬イ", "e": ""}, {"l": 11, "m": "業務を委託している企業の監査上の留意事項", "sb": "", "i": "C", "r": "", "q": "委託会社監査人は，委託会社について評価した重要な虚偽表示リスクへの対応として，関連する財務諸表のアサーションに関する十分かつ適切な監査証拠を委託会社が保有する記録から入手不可能であると判断した場合には，十分かつ適切な監査証拠を入手するためのリスク対応手続を受託会社において実施するか，受託会社で当該手続を実施する他の監査人を利用しなければならない。", "a": true, "c": "R７Ⅰ⑰ウ", "e": ""}, {"l": 12, "m": "業務を委託している企業の監査上の留意事項", "sb": "", "i": "C", "r": "", "q": "委託会社監査人は，無限定意見を表明するに当たって，監査報告書に受託会社監査人の業務を利用したことを記載することがある。", "a": false, "c": "R７Ⅰ⑰ア", "e": "無限定意見を表明する場合，監査報告書に受託会社監査人の業務を利用したことを記載してはならない。"}, {"l": 13, "m": "業務を委託している企業の監査上の留意事項", "sb": "", "i": "C", "r": "", "q": "委託会社監査人は，無限定意見を表明できない場合に，その理由として受託会社監査人の業務に言及するときは，監査報告書において当該記載が監査意見に対する自らの責任を軽減しないことを示さなければならない。", "a": true, "c": "R７Ⅰ⑰エ", "e": ""}, {"l": 14, "m": "業務を委託している企業の監査上の留意事項", "sb": "", "i": "C", "r": "", "q": "委託会社監査人は，受託会社における不正，違法行為や未修正の虚偽表示のうち委託会社の財務諸表に影響を与えるものについて，受託会社から委託会社に報告があったかどうか，又は報告がない場合，委託会社がそれらの事項に気付いているかどうかを，委託会社の監査役等に質問しなければならない。", "a": false, "c": "R７Ⅰ⑰イ", "e": "本肢にある質問は，委託会社の監査役等ではなく，委託会社の経営者に対して行うものである。"}, {"l": 15, "m": "監査業務の契約条件の合意", "sb": "", "i": "B", "r": "", "q": "監査責任者は，監査業務の契約の新規締結又は更新を行うに当たって，依頼されている業務が監査の前提条件を満たしているかだけではなく，監査実施者が独立性や職業的専門家としての能力を含む職業倫理に関する規定を遵守できるかという判断をしなければならない。", "a": true, "c": "H30Ⅱ②エ", "e": ""}, {"l": 16, "m": "監査業務の契約条件の合意", "sb": "", "i": "B", "r": "", "q": "経営者には，監査人が監査証拠を入手するために必要と判断した企業構成員への無制限の質問や面談の機会を監査人に提供する責任がある。監査人は，経営者が当該責任を認識し理解している旨の合意を得られないことのみによって，監査契約の新規の締結又は更新を禁止されることはない。", "a": false, "c": "H31Ⅱ⑱ア", "e": "経営者が本肢の責任を認識し理解している旨の合意を得られない場合，監査人は，監査契約を新規に締結又は更新してはならない。"}]}, {"n": 10, "name": "監査に関する制度論", "qs": [{"l": 1, "m": "金融商品取引法", "sb": "", "i": "B", "r": "", "q": "有価証券届出書に含まれる財務計算に関する書類は，投資者が投資意思決定を行うための基本的な情報となるため，公認会計士又は監査法人の監査証明を受けなければならない。", "a": true, "c": "R４Ⅰ⑤イ／H29Ⅰ④イ", "e": ""}, {"l": 2, "m": "金融商品取引法", "sb": "", "i": "B", "r": "", "q": "発行価額又は売出価額の総額が１億円未満の有価証券の募集又は売出の場合，発行会社は公認会計士又は監査法人による監査証明を受けた財務書類を含む有価証券通知書を内閣総理大臣に提出しなければならない。", "a": false, "c": "H25Ⅰ⑤エ", "e": "有価証券通知書は，いかなる場合であっても監査証明を受ける必要はない。"}, {"l": 3, "m": "金融商品取引法", "sb": "", "i": "B", "r": "", "q": "上場会社は，事業再編のための株式分割によって株式を発行する場合，投資者保護の必要性が乏しいときは，有価証券届出書に代えて有価証券通知書を提出することが認められているが，当該有価証券通知書に対する監査証明は不要である。", "a": true, "c": "R２Ⅱ⑤イ", "e": "なお，本肢の「事業再編のための株式分割」は，「事業再編のための『会社分割』」の出題誤りであると思われる。"}, {"l": 4, "m": "金融商品取引法", "sb": "", "i": "B", "r": "", "q": "金融商品取引法により，公認会計士又は監査法人による監査証明を受けた財務計算に関する書類を含む有価証券報告書の提出を義務付けられるのは，金融商品取引所に上場されている有価証券の発行会社に限定される。", "a": false, "c": "H29Ⅰ④ア", "e": "監査証明を受けた財務計算に関する書類を含む有価証券報告書の提出を義務付けられる会社には，上場会社だけでなく，有価証券の募集又は売出時に有価証券届出書を提出していた会社や，株主が1,000名以上いる会社も含まれる。"}, {"l": 5, "m": "金融商品取引法", "sb": "", "i": "B", "r": "", "q": "非上場の会社であっても株主数が一定数以上である場合には監査対象となることがある。これは，非上場の会社であっても，株主が多数である場合には，企業内容の開示と監査を必要とする投資者が現実に存在することが想定され，こうした投資者を保護すべきであると考えられているからである。", "a": true, "c": "R４Ⅱ③ア／H27Ⅱ④ア／H23Ⅱ②ア", "e": ""}, {"l": 6, "m": "金融商品取引法", "sb": "", "i": "B", "r": "", "q": "特定会社が提出する有価証券報告書に記載される指定国際会計基準に準拠した連結財務諸表は，監査人の監査証明が必要である。", "a": true, "c": "H24Ⅰ⑤エ", "e": "準拠した基準が日本の会計基準であっても指定国際会計基準であっても，監査証明は必要となる。"}, {"l": 7, "m": "金融商品取引法", "sb": "", "i": "B", "r": "", "q": "有価証券報告書及び内部統制報告書は，５年間公衆の縦覧に供されるが，半期報告書は３年間公衆の縦覧に供される。", "a": false, "c": "H31Ⅱ④エ／H29Ⅰ④エ", "e": "法改正により，半期報告書の公衆縦覧期間は３年から５年に延長された。"}, {"l": 8, "m": "金融商品取引法", "sb": "", "i": "B", "r": "", "q": "上場してはいないが，事業年度末に１,０００名以上の株主が存在する株式会社は，有価証券報告書及び半期報告書を，「経理の状況」に含まれる財務計算に関する書類に対する監査又は期中レビューを受けた上で，有価証券報告書の場合は毎事業年度経過後３ヶ月以内に，半期報告書の場合は中間会計期間終了後４５日以内に，内閣総理大臣に提出しなければならない。", "a": false, "c": "H25Ⅱ⑤イ／H29Ⅰ④エ", "e": "本肢のような有価証券報告書提出会社のうち非上場会社の場合，半期報告書の中間財務諸表について，原則として期中レビューではなく中間監査を受けることになる。また，この場合の提出期限は４５日以内ではなく３ヶ月以内である。"}, {"l": 9, "m": "金融商品取引法", "sb": "", "i": "B", "r": "", "q": "有価証券報告書を提出しなければならない会社は，事業年度ごとに公認会計士又は監査法人による監査証明を受けた内部統制報告書を有価証券報告書と併せて内閣総理大臣に提出しなければならない。", "a": false, "c": "H25Ⅰ⑤ア／H28Ⅱ④ア", "e": "監査証明を受けた内部統制報告書の提出は，有価証券報告書提出会社のうち，上場会社にのみ義務付けられる。"}, {"l": 10, "m": "金融商品取引法", "sb": "", "i": "B", "r": "", "q": "有価証券報告書提出会社であって，上場会社等以外の会社は，内部統制報告書を任意に提出できるが，任意に提出された当該報告書は，監査人の監査証明を受けなければならない。", "a": false, "c": "H24Ⅰ⑤イ", "e": "任意に提出された内部統制報告書は，監査人の監査証明を受ける必要はない。"}, {"l": 11, "m": "金融商品取引法", "sb": "", "i": "B", "r": "", "q": "被監査会社の業務執行を決定する機関が，財務計算に関する書類の監査証明を行う公認会計士又は監査法人の異動を決定した場合，当該会社は，その異動の決定又は異動に至った理由及び経緯について記載した臨時報告書を提出しなければならない。", "a": true, "c": "R４Ⅰ④エ", "e": ""}, {"l": 12, "m": "金融商品取引法", "sb": "", "i": "B", "r": "", "q": "有価証券報告書の提出義務がある会社が発行する臨時報告書は，有価証券の募集又は売出しが外国において行われるとき，その他公益又は投資者保護のため必要かつ適当なものとして内閣府令で定める場合に該当することとなったときに，内閣総理大臣に提出されなければならないが，その記載内容に関する監査証明は不要である。", "a": true, "c": "H27Ⅰ③ウ／R４Ⅰ⑤ウ／H30Ⅱ④ウ", "e": ""}, {"l": 13, "m": "金融商品取引法", "sb": "", "i": "B", "r": "", "q": "上場会社の提出する臨時報告書は，原則として監査対象ではないが，財政状態及び経営成績に著しく重要な影響を及ぼす事象が発生したことによって臨時報告書を提出する場合には，当該事象の影響に関して，公認会計士又は監査法人による監査を受けなければならない。", "a": false, "c": "R４Ⅱ④ウ／R３④エ／H30Ⅰ④エ／H26Ⅱ⑤ア", "e": "臨時報告書は，いかなる場合であっても監査証明を受ける必要はない。"}, {"l": 14, "m": "金融商品取引法", "sb": "", "i": "B", "r": "", "q": "有価証券報告書の中で，公認会計士又は監査法人による監査証明の対象となる財務計算に関する書類には，主要な経営指標の推移，経理の状況に掲げられた連結財務諸表及び財務諸表とこれらに関連する記載事項が含まれる。", "a": false, "c": "R４Ⅱ⑤ア／H28Ⅱ④エ／H23Ⅱ②ウ", "e": "本肢にある「主要な経営指標の推移」や「これら（財務諸表等）に関連する記載事項」はその他の記載内容であり，監査証明の対象外である。"}, {"l": 15, "m": "金融商品取引法", "sb": "", "i": "B", "r": "", "q": "有価証券報告書に含まれる情報のうち，公認会計士又は監査法人による監査証明の対象は，「経理の状況」に掲げられている全ての情報である。", "a": false, "c": "R３④ア", "e": "監査対象は，「経理の状況」に掲げられている情報の中の財務諸表のみである。"}, {"l": 16, "m": "金融商品取引法", "sb": "", "i": "B", "r": "", "q": "金融商品取引所に上場されている有価証券の発行会社が，金融商品取引法の規定により提出する財務計算に関する書類は，当該会社と特別の利害関係のない公認会計士又は監査法人の監査証明を受けなければならないが，当該監査証明は，「財務諸表等の監査証明に関する内閣府令」で定める基準及び手続によって行われないことがある。", "a": false, "c": "H29Ⅱ③ア", "e": "本肢の「財務諸表等の監査証明に関する内閣府令」で定める基準とは，監査基準，中間監査基準，品質管理基準，期中レビュー基準，不正リスク対応基準であるが，監査証明がこれらに準拠せずに行われることはない。"}, {"l": 17, "m": "金融商品取引法", "sb": "", "i": "B", "r": "", "q": "金融商品取引法に基づく財務諸表の監査証明を行うに当たって，公認会計士が従うべき監査の基準は，金融庁企業会計審議会が公表する基準，すなわち，監査基準，中間監査基準，監査に関する品質管理基準，期中レビュー基準，財務報告に係る内部統制の評価及び監査の基準，監査における不正リスク対応基準である。", "a": false, "c": "H27Ⅰ③エ", "e": "財務報告に係る内部統制の評価及び監査の基準は，財務諸表監査において従うべき監査の基準には含まれない。"}, {"l": 18, "m": "金融商品取引法", "sb": "", "i": "B", "r": "", "q": "金融商品取引法は，上場会社の監査証明を行う公認会計士又は監査法人を会社法上の会計監査人とすることを求めている。", "a": false, "c": "H31Ⅰ④ウ", "e": "金融商品取引法に基づく監査証明を行うものが会社法上の会計監査人でなければならないとする規定は存在しない。"}, {"l": 19, "m": "金融商品取引法", "sb": "", "i": "B", "r": "", "q": "上場会社等の代表者は，有価証券報告書，半期報告書及び内部統制報告書を提出する際に，それらの記載内容が金融商品取引法令に基づき適正であることを確認した旨を記載した確認書を提出しなければならない。", "a": false, "c": "H31Ⅱ④ア", "e": "内部統制報告書を提出する際には，確認書の提出は必要ない。"}, {"l": 20, "m": "金融商品取引法", "sb": "", "i": "B", "r": "", "q": "有価証券報告書に対する確認書では，監査手続として監査人が入手しなければならない経営者確認書と同様に，経営者が財務諸表の作成・開示や内部統制の整備・運用に対して責任を有する旨等の記載が求められる。", "a": false, "c": "H24Ⅱ③エ", "e": "確認書と経営者確認書は全く異なるものであり，本肢のような記載は求められない。"}, {"l": 21, "m": "金融商品取引法", "sb": "", "i": "B", "r": "", "q": "監査人は，経営者が経営者確認書の重要な事項に対して確認しない場合には，意見不表明とすることを検討しなければならないが，有価証券報告書に対する確認書に経営者が署名をしない場合には，意見不表明とする必要はない。", "a": true, "c": "H24Ⅱ③オ", "e": ""}, {"l": 22, "m": "金融商品取引法", "sb": "", "i": "B", "r": "", "q": "有価証券報告書の提出義務がある会社のうち，上場会社等は，有価証券報告書の記載内容が金融商品取引法令に基づき適正であることを確認した旨を記載した確認書を，有価証券報告書と併せて内閣総理大臣に提出しなければならないが，当該確認書に対する公認会計士又は監査法人による監査証明は不要である。", "a": true, "c": "R４Ⅰ⑤エ／H30Ⅰ④イ／H25Ⅱ⑤ウ", "e": ""}, {"l": 23, "m": "金融商品取引法", "sb": "", "i": "B", "r": "", "q": "被監査会社が提出する有価証券報告書の訂正報告書に訂正後の財務計算に関する書類が含まれる場合，当該書類は，公認会計士又は監査法人による監査証明の対象となる。", "a": true, "c": "R６Ⅱ⑤ウ／R２Ⅰ③ウ／H30Ⅱ④ア／H26Ⅱ⑤エ", "e": ""}, {"l": 24, "m": "金融商品取引法", "sb": "", "i": "B", "r": "", "q": "上場会社が提出する半期報告書の訂正報告書に中間連結財務諸表又は中間財務諸表の内容に関する訂正が含まれる場合であっても，訂正報告書を適時に提出するため，当該訂正事項について公認会計士又は監査法人による監査証明は求められていない。", "a": false, "c": "R４Ⅱ④エ", "e": "中間財務諸表に訂正があった場合も，監査証明が必要となる。"}, {"l": 25, "m": "金融商品取引法", "sb": "", "i": "B", "r": "", "q": "内部統制報告書の提出会社が，内部統制には開示すべき重要な不備があった旨の訂正報告書を提出する場合，当該訂正内部統制報告書は，公認会計士又は監査法人の監査証明の対象となる。", "a": false, "c": "R４Ⅰ⑤ア／H30Ⅱ④イ／H24Ⅱ⑳オ", "e": "内部統制報告書の訂正報告書は，監査証明を受ける必要はない。"}, {"l": 26, "m": "金融商品取引法", "sb": "", "i": "B", "r": "", "q": "上場会社の親会社が会社法上の大会社であり有価証券報告書提出会社でない場合，当該親会社は親会社等状況報告書を内閣総理大臣に提出するが，この親会社等状況報告書には，大株主の状況や役員の状況のほか，監査役会の監査報告書及び会計監査人の監査報告書を含む，会社法の規定に基づく計算書類等を記載しなければならない。", "a": true, "c": "H25Ⅱ⑤エ", "e": ""}, {"l": 27, "m": "金融商品取引法", "sb": "", "i": "B", "r": "", "q": "上場会社の親会社が有価証券報告書提出会社でない場合，当該親会社は，親会社等状況報告書を提出しなければならない。この場合，親会社等状況報告書に含まれる財務計算に関する書類について，当該上場会社の監査を行っている公認会計士又は監査法人による監査を受けなければならない。", "a": false, "c": "R４Ⅱ③ウ", "e": "親会社が会計監査人の監査を受けていれば，当該会計監査人による監査報告書を親会社等状況報告書に添付することになるが，上場会社（つまり子会社）の監査人による監査を改めて受ける必要はない。"}, {"l": 28, "m": "金融商品取引法", "sb": "", "i": "B", "r": "", "q": "公認会計士又は監査法人が作成する内部統制監査報告書は，内閣府令で定めるもののほか，一般に公正妥当と認められる財務報告に係る内部統制の監査に関する基準及び慣行に従って実施された監査の結果に基づき作成される必要がある。", "a": true, "c": "R５Ⅰ⑤ア", "e": ""}, {"l": 29, "m": "金融商品取引法", "sb": "", "i": "B", "r": "", "q": "監査法人は，当該監査法人の公認会計士である社員以外の者に監査証明業務を行わせ，監査報告書の筆頭に署名させてはならない。", "a": true, "c": "R２Ⅰ②エ", "e": ""}, {"l": 30, "m": "金融商品取引法", "sb": "", "i": "B", "r": "", "q": "連結財務諸表の監査を実施した監査法人が作成する監査報告書に，当該監査報告書の作成の年月日を付して署名する者には，当該監査法人の代表者が含まれることがある。", "a": true, "c": "H29Ⅱ③ウ", "e": ""}, {"l": 31, "m": "金融商品取引法", "sb": "", "i": "B", "r": "", "q": "特定証明である場合の監査報告書には，原則として，当該特定証明に係る指定有限責任社員である業務執行社員が作成の年月日を付して署名しなければならないが，有限責任監査法人名で署名することも認められている。", "a": false, "c": "H28Ⅰ⑤ウ", "e": "意見に責任を負う者を対外的に明示するために，特定証明の監査報告書には指定有限責任社員が署名しなければならず，有限責任監査法人名で署名することは認められない。"}, {"l": 32, "m": "金融商品取引法", "sb": "", "i": "B", "r": "", "q": "財務諸表に対する独立監査人の監査報告書は，有価証券報告書に含めて提出され，内部統制監査報告書は，内部統制報告書に添付して提出されなければならない。", "a": false, "c": "H27Ⅱ④ウ／H23Ⅱ②エ", "e": "内部統制監査報告書は，原則として，財務諸表に対する監査報告書と一体的に作成されるが，一体的に作成された監査報告書は，有価証券報告書にのみ含めればよく，内部統制報告書には添付されない。"}, {"l": 33, "m": "金融商品取引法", "sb": "", "i": "B", "r": "", "q": "外国会社報告書の中の財務計算に関する書類に対して外国監査法人が行った監査証明が，我が国の監査証明に相当すると認められる証明である場合，当該外国会社報告書について，我が国の公認会計士又は監査法人による監査証明は不要である。", "a": true, "c": "R４Ⅱ③エ／R２Ⅰ③エ／H30Ⅰ④ウ／H28Ⅱ④イ／H25Ⅰ⑤イ／H24Ⅰ⑤ア", "e": ""}, {"l": 34, "m": "金融商品取引法", "sb": "", "i": "B", "r": "", "q": "上場会社は原則として，公認会計士又は監査法人の監査証明を受けなければならないものの，監査証明を受けなくても公益又は投資者保護に欠けることがないものとして内閣総理大臣の承認を受けた場合は必ずしも監査証明は必要とされない。", "a": true, "c": "R５Ⅰ⑤ウ／R２Ⅱ⑤ア／H31Ⅰ④イ／H24Ⅰ⑤ウ／H26Ⅱ⑤ウ", "e": ""}, {"l": 35, "m": "金融商品取引法", "sb": "", "i": "B", "r": "", "q": "上場会社は，一般投資家から広く資金調達を行うことが可能であるため，多くの利害関係者が生じ，これらに対する保護が必要となってくる。このため，利害関係者に対する適時・適切な情報開示のために管理体制の整備が必要となることから，新規に上場するときには，公認会計士による内部統制監査の実施が求められている。", "a": false, "c": "R５Ⅱ①エ", "e": "新規上場会社（大規模企業を除く）については，上場後３年を経過する日までの間，内部統制監査が免除される。"}, {"l": 36, "m": "金融商品取引法", "sb": "", "i": "B", "r": "", "q": "新規上場会社の内部統制監査報告書の提出は，資本金１００億円以上又は負債総額1,000億円以上の会社を除いて，上場後３年を経過する日まで免除される。", "a": true, "c": "H31Ⅱ④イ／H30Ⅱ④エ", "e": "内部統制「監査」報告書となっているところがポイント。つまり，本肢は内部統制監査の免除を問う肢である。"}, {"l": 37, "m": "金融商品取引法", "sb": "", "i": "B", "r": "", "q": "公認会計士又は監査法人は，財務計算に関する書類の監査証明終了後，監査の従事者，監査日数その他当該監査に関する事項の概要を記載した概要書を，財務局長等に提出しなければならない。", "a": true, "c": "R６Ⅱ⑤ア／H28Ⅰ⑤ア", "e": ""}, {"l": 38, "m": "金融商品取引法", "sb": "", "i": "B", "r": "", "q": "監査概要書には，監査の従事者，監査日数その他当該監査に関する事項の概要が記載されなければならない。加えて，無限定適正意見以外の意見が表明される場合には，その理由が記載されなければならない。", "a": true, "c": "H29Ⅰ④ウ", "e": ""}, {"l": 39, "m": "金融商品取引法", "sb": "", "i": "B", "r": "", "q": "監査証明に従事する公認会計士又は監査法人は，年度監査だけでなく，中間監査，期中レビュー，内部統制監査のそれぞれについて概要書を作成し，内閣総理大臣に提出しなければならない。", "a": false, "c": "R２Ⅱ⑤ウ／R４Ⅱ④ア／R４Ⅱ④イ／R２Ⅰ③イ／H27Ⅱ④エ", "e": "内部統制監査に関する事項の概要は，年度の財務諸表監査に係る監査概要書に含めて記載するため，内部統制監査に係る概要書は作成しない。なお，中間監査と期中レビューに係る概要書を作成する点は正しい。"}, {"l": 40, "m": "金融商品取引法", "sb": "", "i": "B", "r": "", "q": "公認会計士又は監査法人は，財務諸表監査，中間監査又は期中レビューについて，その従事者，監査日数その他当該監査等に関する事項の概要を記載した概要書を，当該概要書の対象となる報告書の作成日から３か月を経過する日の属する月の末日までに提出しなければならない。", "a": false, "c": "H31Ⅱ④ウ／H25Ⅱ⑤ア", "e": "概要書の提出期限は，当該概要書の対象となる報告書の作成日の翌月末日までである。"}, {"l": 41, "m": "金融商品取引法", "sb": "", "i": "B", "r": "", "q": "金融商品取引法第１９３条の２に基づく監査証明を行った公認会計士又は監査法人は，当該監査に係る従事者，監査日数，その他当該監査等に関する事項を記載した監査概要書を，内閣総理大臣宛てに提出しなければならない。", "a": false, "c": "H26Ⅱ⑤イ", "e": "監査概要書の提出先は，内閣総理大臣ではなく財務局長である。"}, {"l": 42, "m": "金融商品取引法", "sb": "", "i": "B", "r": "", "q": "上場会社は，内部統制報告書を訂正した場合には，訂正内部統制報告書に対する監査証明を受けなければならず，また，監査人は当該監査に関する監査概要書を提出しなければならない。", "a": false, "c": "R２Ⅱ⑤エ", "e": "そもそも，訂正内部統制報告書に対する監査証明は不要である。"}, {"l": 43, "m": "金融商品取引法", "sb": "", "i": "B", "r": "", "q": "公認会計士又は監査法人は，内閣総理大臣が公益又は投資者保護のため必要かつ適当であると認める場合であっても，秘密保持の観点から，自らが行った上場会社の監査証明について参考となるべき報告又は資料の提出をしてはならない。", "a": false, "c": "R４Ⅰ④イ／H31Ⅰ④ア", "e": "本肢の場合，当該公認会計士又は監査法人の秘密保持は，法令等により解除されることになる。"}, {"l": 44, "m": "金融商品取引法", "sb": "", "i": "A", "r": "", "q": "公認会計士又は監査法人は，金融商品取引法に基づいて実施される財務計算に関する書類の監査を行うに当たって，被監査会社による法令違反等事実を発見したときは，当該事実の内容及び当該事実に係る法令違反の是正その他の適切な措置をとるべき旨を記載した書面又は電磁的方法により，当該被監査会社の監査役等に対して通知しなければならない。", "a": true, "c": "H30Ⅰ④ア", "e": ""}, {"l": 45, "m": "金融商品取引法", "sb": "", "i": "A", "r": "", "q": "公認会計士は，監査証明業務を行うに当たって法令に違反する事実を発見したときは，当該法令違反事実が財務諸表の適正性の確保に影響を及ぼすか否かにかかわらず，それを監査役等に通知しなければならない。", "a": false, "c": "R６Ⅰ④エ", "e": "監査役等に通知する「法令違反等事実」は，財務書類の適正性の確保に影響を及ぼすおそれのある事実である。"}, {"l": 46, "m": "金融商品取引法", "sb": "", "i": "A", "r": "", "q": "公認会計士又は監査法人が監査証明を行うに当たり，被監査会社の法令違反等事実を発見した場合，当該会社に対して当該事実の内容等を書面等により通知しなければならない。ただし，その通知の内容には当該事実に係る適切な措置をとるべき旨を含む必要はない。", "a": false, "c": "R５Ⅰ④イ", "e": "本肢の通知の内容には，法令違反等事実に係る適切な措置をとるべき旨を含める必要がある。"}, {"l": 47, "m": "金融商品取引法", "sb": "", "i": "A", "r": "", "q": "公認会計士又は監査法人は，財務計算に関する書類の監査証明を行うに当たって，被監査会社における重大な法令違反等事実を発見し，当該事実の内容等を被監査会社へ通知したときは，遅滞なく，当該事実に関する意見を内閣総理大臣に申し出なければならない。", "a": false, "c": "R６Ⅱ⑤イ", "e": "例えば，法令違反等事実の内容等を被監査会社へ通知した後で，当該会社が適切な是正措置を取ったのであれば，内閣総理大臣への申出は不要である。"}, {"l": 48, "m": "金融商品取引法", "sb": "", "i": "A", "r": "", "q": "公認会計士又は監査法人は，監査証明業務に当たり，被監査会社による法令違反事実を発見し，当該会社に対し是正等の措置をとるように通知し，一定の日数が経過したにもかかわらず当該会社が適切な措置を取らない場合において，法令違反事実が当該会社の財務計算に関する書類の適正性の確保に重大な影響を及ぼすおそれがあり，重大な影響を防止するために必要であると認めるときには，当該事項に関する意見を内閣総理大臣に申し出なければならない。", "a": true, "c": "H28Ⅱ④ウ", "e": ""}, {"l": 49, "m": "金融商品取引法", "sb": "", "i": "A", "r": "", "q": "公認会計士は，金融商品取引法に基づいて実施される財務書類の監査において，財務計算に関する書類の適正性の確保に影響を及ぼすおそれのある法令違反事実を発見し，それを被監査会社に対して書面又は電磁的方法で通知したにもかかわらず，被監査会社が一定期間を経ても適切な措置をとらない場合には，被監査会社に事前に通知したうえで当該事項についての意見を内閣総理大臣に対して申し出なければならない。", "a": true, "c": "H27Ⅰ③ア", "e": "本肢では「財務計算に関する書類の適正性の確保に重大な影響を及ぼすおそれがあり，当該影響を防止するために必要であると認めるとき」の要件が明示されていないが，出題された問題での他の記述との正誤の比較で正しいと判断させる問題であった。"}, {"l": 50, "m": "金融商品取引法", "sb": "", "i": "A", "r": "", "q": "公認会計士又は監査法人は，監査証明業務を行うに当たって，被監査会社による法令違反等事実を発見した場合には，当該会社に対し是正等の措置をとるよう通知しなければならないが，当該会社が適切な措置をとらないときには，当該事項に関する意見を内閣総理大臣に申し出なければならない。", "a": false, "c": "H25Ⅰ⑤オ", "e": "本肢は上記の問題とは逆で，「財務計算に関する書類の適正性の確保に重大な影響を及ぼすおそれがあり，当該影響を防止するために必要であると認めるとき」の要件が明示されていない点から誤りであると厳密に判断させる問題であった。"}, {"l": 51, "m": "金融商品取引法", "sb": "", "i": "A", "r": "", "q": "公認会計士又は監査法人が，監査証明業務の実施に際して，被監査会社の法令違反等事実を発見し，その是正その他の適切な措置をとるべき旨を通知したにもかかわらず，一定期間を経過してもなお被監査会社が適切な措置をとらない場合には，ただちに当該事項に関する内容を内閣総理大臣に申し出なければならない。", "a": false, "c": "R２Ⅰ③ア", "e": "同上。本肢は「ただちに」とあるため，上記の問題よりも判断しやすいだろう。"}, {"l": 52, "m": "金融商品取引法", "sb": "", "i": "A", "r": "", "q": "公認会計士又は監査法人が，監査証明を行うに当たって，被監査会社の法令違反等事実を発見し，その重大な影響を防止するため，緊急性を認めた場合，被監査会社に書面又は電磁的方法で通知する前に，当該事実の内容を内閣総理大臣に申し出なければならない。", "a": false, "c": "R４Ⅰ④ウ", "e": "法令違反等事実を内閣総理大臣に申し出る場合は，必ず，事前に被監査会社に対する通知（是正措置を取るべき旨や内閣総理大臣に申し出る旨の通知）を行う必要がある。"}, {"l": 53, "m": "金融商品取引法", "sb": "", "i": "A", "r": "", "q": "金融商品取引法に基づく監査において，公認会計士が，被監査会社における法令に違反する事実を発見し，当該法令違反を是正すべき旨を書面又は電磁的方法で被監査会社に対して通知したにもかかわらず，所定の期間が経過した後も是正されなかった場合に，法に定める重大な影響を防止するために必要があると判断して当該法令違反事実を内閣総理大臣に申し出たとしても秘密保持違反とはならない。", "a": true, "c": "H27Ⅱ⑪ア", "e": ""}, {"l": 54, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "最終事業年度に係る貸借対照表に資本金として計上した金額が５億円以上又は負債の部に計上した金額の合計額が２００億円以上の株式会社は，計算書類及びその附属明細書について，会計監査人の監査を受けることが求められている。", "a": true, "c": "R４Ⅱ⑥ア", "e": ""}, {"l": 55, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "非公開会社であっても，資本金５億円以上又は負債総額２００億円以上の会社は，会計監査人を設置しなければならない。", "a": true, "c": "R２Ⅰ④イ", "e": ""}, {"l": 56, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "その発行する全部又は一部の株式の内容として，譲渡による当該株式の取得について，株式会社の承認を要する旨の定款の定めを設けていない監査等委員会設置会社及び指名委員会等設置会社は，会計監査人を設置する必要がある。", "a": true, "c": "R４Ⅱ⑥イ", "e": ""}, {"l": 57, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "事業年度中に資本金が５億円以上となった監査役会設置会社は，当該事業年度の末日までに監査役会の決議により遅滞なく一時会計監査人を選任し，当該事業年度に係る定時株主総会において改めて会計監査人を選任しなければならない。", "a": false, "c": "H26Ⅰ④ア", "e": "会計監査人の設置が必要となる大会社の要件は，「最終事業年度に係る貸借対照表」の資本金が５億円以上又は負債総額が２００億円以上の会社をいう。したがって，当事業年度中に資本金が５億円以上となった場合でも，当該会社が大会社となるのは翌事業年度からであり，本肢のような一時会計監査人の選任等は求められない。"}, {"l": 58, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "委員会設置会社でない株式会社が，事業年度中に減資により資本金を５億円から５億円未満とした場合，当該事業年度の計算書類及びその附属明細書に関する会計監査人の監査は不要となる。", "a": false, "c": "H26Ⅰ④ウ／H24Ⅱ⑥イ", "e": "当事業年度中に資本金が５億円未満となった場合でも，当該会社が大会社でなくなるのは翌事業年度からである。したがって，当該事業年度の計算書類及びその附属明細書については，会計監査人の監査が必要となる。"}, {"l": 59, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "会社の成立の日における貸借対照表の資本金が5億円以上の株式会社は，創立総会において会計監査人を選任する必要がある。", "a": true, "c": "H26Ⅰ④イ", "e": ""}, {"l": 60, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "会計監査人設置会社においては，会計監査人のみが各事業年度に係る計算書類及びその附属明細書に対する監査を行うこととされている。", "a": false, "c": "R６Ⅰ⑤イ", "e": "計算書類及びその附属明細書に対する監査は，会計監査人のみならず監査役等も行う。"}, {"l": 61, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "会計監査人設置会社において，会計監査人の監査対象となる計算書類には，貸借対照表，損益計算書，株主資本等変動計算書，個別注記表及び事業報告が含まれる。", "a": false, "c": "R２Ⅱ⑥ア", "e": "事業報告及びその附属明細書は，会計監査人の監査対象ではない。"}, {"l": 62, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "監査役及び会計監査人が設置されている株式会社の事業報告及びその附属明細書は監査役の監査対象であるが，計算書類との整合性を確保するため，会計数値に関する部分に限り，会計監査人の監査対象である。", "a": false, "c": "R３⑤イ／H30Ⅱ⑥エ", "e": "同上。なお，監査役の監査対象である旨の記述は正しい。"}, {"l": 63, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "会計監査人は，会社が連結計算書類として連結キャッシュ・フロー計算書を作成した場合，当該連結キャッシュ・フロー計算書を監査の対象としなければならない。", "a": false, "c": "R４Ⅱ⑦ウ／H29Ⅱ⑤イ", "e": "連結キャッシュ・フロー計算書は，会社法において開示が要求されている書類ではないため，任意で作成されていても，会計監査人の監査対象とはならない。"}, {"l": 64, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "臨時計算書類及び連結計算書類は，会計監査人の監査を受けなければならない。連結計算書類の監査対象と異なり，臨時計算書類は，貸借対照表と損益計算書のみである。", "a": true, "c": "R４Ⅰ⑥エ", "e": ""}, {"l": 65, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "事業年度の末日において会社法上の大会社であり，かつ有価証券報告書提出義務のある会社は，連結子会社がある場合，連結計算書類を作成し，監査役会の監査及び会計監査人の監査を受け，株主総会において報告しなければならない。", "a": true, "c": "H25Ⅱ⑥ア", "e": "連結計算書類については，提示株主総会での承認が不要である点に注意。"}, {"l": 66, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "会計監査人は，修正後の過年度事項を前提に当期の計算書類が作成されている場合であっても，当該過年度事項を監査することは求められていない。", "a": true, "c": "H24Ⅱ⑥エ", "e": ""}, {"l": 67, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "会計監査人設置会社のうち公開会社は，会計監査人に非監査業務の対価を支払っている場合，その非監査業務の内容を事業報告に記載しなければならない。", "a": true, "c": "R７Ⅰ④エ／H31Ⅱ⑤ウ", "e": ""}, {"l": 68, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "公開会社の監査役会設置会社において，社外監査役の取締役会及び監査役会へのそれぞれの出席の状況については，事業報告に記載しなければならない。", "a": true, "c": "R２Ⅱ⑦エ", "e": "なお，本肢の内容は非常に細かいため，レジュメには掲載していない。"}, {"l": 69, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "会計監査人による監査報告の通知期限は，特定取締役，特定監査役と合意を行っていない場合には，会計監査人がすべての計算書類を受領した日から４週間を経過した日又は当該計算書類の附属明細書を受領した日から１週間を経過した日のいずれか遅い日となる。", "a": true, "c": "H24Ⅰ⑦ア／H24Ⅱ⑥オ", "e": ""}, {"l": 70, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "会社法上の大会社である監査役会設置会社において，特定監査役は，特定取締役及び会計監査人に計算関係書類に関する監査役会監査報告の内容を，会計監査報告を受領した日から１週間を経過した日，又は特定取締役及び特定監査役の間で合意により定めた日があるときはその日のうち，いずれか遅い日までに通知しなければならない。", "a": true, "c": "H27Ⅱ⑤ウ／H25Ⅱ⑥イ", "e": ""}, {"l": 71, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "会計監査人設置会社において，特定監査役は，特定取締役及び会計監査人に計算書類及びその附属明細書に関する監査役会の監査報告の内容を，会計監査人に監査報告を受領した日から少なくとも１週間を経過した日を期日として通知しなければならない。なお，当該期日前に監査が終了すれば，結果として監査役会の監査報告の日付は，会計監査人の監査報告の日付と同日であってもよい。", "a": true, "c": "R３⑤エ", "e": "監査役等による監査の終了が早ければ，本肢のようなケースもあり得る。"}, {"l": 72, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "会社法上の大会社である監査役会設置会社において，会計監査人は，会計監査報告の内容を会計監査報告の通知を受ける者として定められた監査役及び取締役に通知しなければならないが，通知を受ける監査役及び取締役が定められていない場合，会計監査人は，監査役及び取締役の全員にこの通知を行う必要がある。", "a": false, "c": "H25Ⅱ⑥エ", "e": "会計監査報告の通知を受ける監査役及び取締役が定められていない場合には，会計監査人は，「書類を作成した取締役」と「監査役全員」に通知する必要がある。"}, {"l": 73, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "会計監査人を設置している監査役会設置会社において，特定監査役とは，会計監査報告の内容の通知を受ける監査役を監査役会が定めた場合には，当該通知を受ける監査役のことをいい，定めていない場合には，全ての監査役のことをいう。", "a": true, "c": "R２Ⅱ⑥エ", "e": ""}, {"l": 74, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "取締役会設置会社においては，会計監査人は，取締役会の承認を受けた計算書類及び附属明細書を監査する。", "a": false, "c": "R６Ⅰ⑤エ", "e": "取締役会の承認は，会計監査人と監査役等のそれぞれの監査結果を踏まえて行われる。"}, {"l": 75, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "取締役会設置会社において，会計監査人の監査意見が無限定適正意見で，監査役会又は監査役による会計監査人の監査の方法又は結果を相当でないと認める意見がなく，監査役が特定取締役及び会計監査人に対し監査報告の内容を通知すべき日までに通知をしている場合，定時株主総会での当該計算書類の承認は不要であるが，取締役は，その内容を定時株主総会に報告しなければならない。", "a": true, "c": "R４Ⅰ⑥イ／R２Ⅱ⑥ウ／H30Ⅰ⑤ア／H25Ⅱ⑥ウ／H24Ⅰ⑦エ", "e": ""}, {"l": 76, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "会計監査人が計算書類に対して除外事項を付した限定付適正意見を表明した場合には，会社は定時株主総会終結後の公告においてその旨を明らかにしなければならない。", "a": false, "c": "H29Ⅰ⑤ウ", "e": "公告が必要となるのは，不適正意見又は意見不表明の場合であり，限定付適正意見の場合は不要である。"}, {"l": 77, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "会計監査人設置会社は，定時株主総会の終結後の決算公告に係る計算書類に対して会計監査人が意見を表明していないとき，決算公告を行うことはできない。", "a": false, "c": "H31Ⅱ⑤ア", "e": "会計監査人が意見を表明していないときでも，決算公告を行うことはできる。なお，この場合は，意見表明がなかった旨を併せて公告する。"}, {"l": 78, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "会計監査人が，計算関係書類に対して監査意見を表明しない場合であっても，定時株主総会による承認があれば決算は確定するが，この場合，会社は会計監査人による意見表明がなかった旨を公告しなければならない。", "a": true, "c": "H27Ⅱ⑤ア／H24Ⅰ⑦ウ", "e": "なお，不適正意見の場合も同様である。"}, {"l": 79, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "連結計算書類について，定時株主総会の招集の通知に先立って行われる取締役会の承認は，監査を受けたものに対して行わなければならない。", "a": true, "c": "R７Ⅰ④ア", "e": ""}, {"l": 80, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "株主に対する定時株主総会の招集通知において，取締役会の承認を受けた連結計算書類を提供する場合には，連結計算書類に係る会計監査報告も合わせて提供することが求められている。", "a": false, "c": "R４Ⅱ⑥エ", "e": "連結計算書類に係る会計監査報告は，定時総会の招集通知に添付する必要はない。"}, {"l": 81, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "監査役会の監査報告には，事業報告及びその附属明細書が法令又は定款に従い当該株式会社の状況を正しく示しているかどうかについての意見を記載しなければならない。", "a": true, "c": "H28Ⅰ⑥ア", "e": ""}, {"l": 82, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "監査役会の監査報告には，当該株式会社の取締役の職務の遂行に関し，不正の行為又は法令若しくは定款に違反する重大な事実があったかどうかを記載しなければならない。", "a": false, "c": "H28Ⅰ⑥イ", "e": "監査役会の監査報告書には，取締役の職務遂行に関する重大な事実が「あったとき」にのみ，その事実を記載する。"}, {"l": 83, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "監査役は，原則として取締役の職務の執行について監査を行うが，公開会社でない株式会社は，監査役会設置会社及び会計監査人設置会社を除いて，その監査役の監査の範囲を会計に関するものに限定する旨を定款に定めることができる。", "a": true, "c": "H29Ⅱ④ア", "e": ""}, {"l": 84, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "会計参与が設置されていない監査役設置会社が，その監査役の監査の範囲を会計に関するものに限定する旨を定款で定めていないときは，当該監査役設置会社の監査役は，当該監査役設置会社の取締役の職務の執行を監査する。", "a": true, "c": "H30Ⅱ⑤イ", "e": ""}, {"l": 85, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "公開会社でないところの，会計監査人及び監査役会が設置されていない監査役設置会社が，その監査役の監査の範囲を会計に関するものに限定する旨を定款で定めているときに，当該監査役設置会社の監査役が，当該監査役設置会社が作成した事業報告を監査する権限がないことを明らかにした監査報告を，作成しなくてよい場合がある。", "a": false, "c": "H30Ⅱ⑤エ", "e": "監査役の監査の範囲を会計に関するものに限定する旨を定款で定めているときは，当該監査役は，事業報告を監査する権限がないことを明らかにした監査報告を作成しなければならない。"}, {"l": 86, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "会計監査人は，会社から独立した専門家の立場から会計監査を行い，監査役は，日常の業務監査を踏まえ，会計監査人の監査の方法又は結果を評価することにより会計監査を行う。なお，監査役が会計監査人の監査の方法又は結果を相当でないと認めたときは，その旨及びその理由を報告すれば足りる。", "a": true, "c": "R３⑤ウ", "e": ""}, {"l": 87, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "監査役会の監査報告には，会計監査人の監査の方法又は結果を相当と認めた場合にはその旨を，相当でないと認めた場合にはその旨及びその理由を記載しなければならない。", "a": false, "c": "H28Ⅰ⑥エ", "e": "会計監査人の監査の方法又は結果を相当であると認めた場合に，その旨を記載することまでは求められていない。なお，実務上は，相当と認めた場合の記載も行われている。"}, {"l": 88, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "会計監査人の監査報告日後に後発事象が発生した場合には，当該事象が監査役の監査報告書に重要な後発事象として記載されることがある。", "a": true, "c": "H23Ⅱ③イ", "e": ""}, {"l": 89, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "会計監査人設置会社において，監査役等は，会計監査人の職務の遂行が適正に実施されることを確保するための体制に関する事項を，監査報告に記載する必要がある。", "a": true, "c": "R２Ⅱ⑦ア／H30Ⅰ⑤エ／H23Ⅱ③ア", "e": ""}, {"l": 90, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "監査役会の監査報告には，監査のため必要な調査ができなかったときは，その旨及びその理由を記載しなければならない。", "a": true, "c": "H28Ⅰ⑥ウ", "e": ""}, {"l": 91, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "会計監査人設置会社の監査役会は，全ての監査役が出席する会議等を通じて各監査役の意見を集約，調整し，その一致をもって監査役会監査報告の内容としなければならない。", "a": false, "c": "R２Ⅰ④エ", "e": "監査役会監査報告の内容は，監査役会の決議（過半数）で決定される。また，各監査役は，監査役会監査報告の内容が自らの監査報告と異なる場合には，当該内容を監査役会監査報告に付記することができるため，全ての監査役の意見の一致は必要ない。"}, {"l": 92, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "監査役会と監査役の監査報告の内容が異なる場合は，監査役会の監査報告において，その内容を付記することができるが，監査委員会と監査等委員会の監査報告においては，委員会と各委員の意見が異なる場合でも，そのような記載はできない。", "a": false, "c": "R２Ⅱ⑦イ／R７Ⅰ④ウ／H30Ⅰ⑤イ", "e": "監査委員会と監査等委員会の監査報告においても，委員会と各委員の意見が異なる場合にはその内容を付記できる。"}, {"l": 93, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "会計監査人は，計算関係書類が株式会社の財産及び損益の状況を全ての重要な点において適正に表示しているかどうかについての意見がないときは，その旨及びその理由を内容とする会計監査報告を作成しなければならない。", "a": true, "c": "H28Ⅱ⑤イ", "e": ""}, {"l": 94, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "会計監査人は，意見表明に先立って，監査役に対して当該年度の監査の方法及び結果の相当性に関する意見を求めなければならない。", "a": false, "c": "H23Ⅱ③エ", "e": "会計監査人は，本肢のような意見を監査役に対して求める必要はない。"}, {"l": 95, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "会計監査人は，計算関係書類の監査の過程で，内部統制システムの整備に関する取締役会の決定又は決議の内容が相当か否かについて監査を行い，その結果を監査役に報告しなければならない。", "a": false, "c": "H27Ⅱ⑤イ／H24Ⅱ⑥ウ", "e": "会計監査人が本肢のような監査を行うことはない。"}, {"l": 96, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "大会社の監査において会計監査人であった公認会計士は，監査役が会計監査人の監査の相当性を確認する立場にあることから，監査を行った事業年度後１年を経過した後であっても，当該会社の監査役には就任することができない。", "a": false, "c": "H23Ⅱ③ウ", "e": "役員就職制限の知識で正誤判断する記述。👉講義レジュメ⑩-3-14"}, {"l": 97, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "監査役及び会計監査人が設置されている株式会社の会計監査人は，その職務を行うに当たって，当該株式会社の取締役だけでなく，監査役も使用してはならない。", "a": true, "c": "H30Ⅱ⑥ウ", "e": "なお，監査の過程で行うコミュニケーションは「使用」には該当しないため，注意。"}, {"l": 98, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "その発行する全部又は一部の株式の内容として，譲渡による当該株式の取得について株式会社の承認を要する旨の定款の定めを設けていない大会社（指名委員会等設置会社及び監査等委員会設置会社を除く。）は，監査役会に加えて会計監査人を設置する必要がある。", "a": true, "c": "H26Ⅰ④エ", "e": ""}, {"l": 99, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "指名委員会等設置会社及び監査等委員会設置会社のうち大会社以外の会社については，会計監査人を任意で設置することができる。", "a": false, "c": "H25Ⅰ⑥エ", "e": "指名委員会等設置会社及び監査等委員会設置会社は，大会社でなくとも，会計監査人を設置しなければならない。"}, {"l": 100, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "会計監査人設置会社が会計監査人を置く旨の定款の定めを廃止する定款の変更を行った場合，会計監査人を置く必要がなくなるため，株主総会の決議によって会計監査人を解任しなければならない。", "a": false, "c": "R４Ⅰ⑥ア", "e": "会計監査人を置く旨の定款の定めを廃止する定款の変更を行った場合，会計監査人の任期は，当該定款の変更の効力が生じた時に満了するため，株主総会決議は不要である。"}, {"l": 101, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "会計監査人を設置する場合には，会計監査人設置会社である旨及び会計監査人の氏名又は名称を登記しなければならない。", "a": true, "c": "H25Ⅰ⑥ア", "e": ""}, {"l": 102, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "会計監査人に選任された監査法人は，その構成員から会計監査人の職務を行うべき者を選定し，これを被監査会社に通知しなければならない。このとき選定される者は，公認会計士でなければならないが，社員である必要はない。", "a": false, "c": "R６Ⅱ⑥エ", "e": "会計監査人の職務を行うべき者の選定は，社員の中から行わなければならない。"}, {"l": 103, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "会計監査人は，選任後１年以内に終了する最終の事業年度に関する定時株主総会において，再任しない旨の決議がなされなかった場合には，再任されたものとみなされる。", "a": true, "c": "R６Ⅰ⑤ア／H29Ⅰ⑤エ", "e": ""}, {"l": 104, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "会計監査人の任期について，定時株主総会において別段の決議がされなかった場合におけるみなし再任を可能とするためには，その旨を定款に定めることが必要である。", "a": false, "c": "R３⑤ア", "e": "本肢のような定款の定めがなくとも，会計監査人のみなし再任はできる。"}, {"l": 105, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "会計監査人は，株主総会の決議によって選任及び解任される。株主総会に提出する会計監査人の選任及び解任に関する議案の内容は，監査役会設置会社にあっては，監査役の全員の同意をもって決定される。", "a": false, "c": "R４Ⅰ⑥ウ／R５Ⅰ⑥ア／H31Ⅱ⑥ア／H31Ⅱ⑥ウ／H30Ⅰ⑤ウ", "e": "会計監査人の選任及び解任に関する議案の内容は，監査役全員の同意ではなく，監査役の過半数の同意で決定する。なお，前段の記述は正しい。"}, {"l": 106, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "監査役会設置会社では，株主総会の決議又は監査役全員の同意によって，いつでも会計監査人を解任することができる。", "a": false, "c": "H28Ⅰ③ア", "e": "監査役全員の同意による解任の場合は，特別の事情がある場合にしかできない。"}, {"l": 107, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "監査役が複数いる監査役設置会社において，会計監査人が，職務上の義務に違反し，若しくは職務を怠ったとき，会計監査人としてふさわしくない非行があったとき，又は心身の故障のため，職務の遂行に支障があり，若しくはこれに堪えないとき，のいずれかに該当するときは，監査役の過半数の同意によって，その会計監査人を解任することができる。", "a": false, "c": "R４Ⅱ⑥ウ／R５Ⅰ⑥ウ／H31Ⅱ⑥エ", "e": "本肢のような解任相当事由がある場合において，監査役が会計監査人を解任する場合，監査役全員の同意が必要となる。"}, {"l": 108, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "監査役が３人以上ある場合で，監査役が会計監査人を解任するときは，監査役の過半数の同意をもって行わなければならず，その場合，監査役はその旨及び解任の理由を株主総会において報告しなければならない。", "a": false, "c": "H27Ⅰ④イ", "e": "監査役が会計監査人を解任するときは，監査役全員の同意が必要である。なお，後段の記述は正しい。"}, {"l": 109, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "会計監査人は，株主総会において，会計監査人の選任又は辞任について意見を述べることはできるが，会計監査人を解任された場合は，株主総会において意見を述べることはできない。", "a": false, "c": "R６Ⅱ⑥ア", "e": "会計監査人は，解任についても，株主総会において意見を述べることができる。"}, {"l": 110, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "会計監査人は，会計帳簿が電磁的記録をもって作成されている場合，取締役又は使用人に対して，当該会計帳簿を書面によって提出するよう求めなければならない。", "a": false, "c": "H24Ⅰ⑦イ", "e": "会計帳簿が電磁的記録をもって作成されている場合は，書面ではなく電磁的記録で提出を求めればよい。"}, {"l": 111, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "指名委員会等設置会社の会計監査人は，当該指名委員会等設置会社の執行役に対して，会計に関する報告を求めることはできるが，取締役に対して会計に関する報告を求めることはできない。", "a": false, "c": "H30Ⅱ⑥イ", "e": "取締役に対しても，会計に関する報告を求めることができる。"}, {"l": 112, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "会計監査人は，取締役，監査役，会計参与，支配人その他の使用人に対し，会計に関する報告を求める権限を有している。", "a": false, "c": "H28Ⅰ③ウ", "e": "会計監査人の会計報告要求権は，取締役，会計参与，支配人その他の使用人に対するものであって，監査役に対するものではない。"}, {"l": 113, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "会計監査人は，被監査会社の子会社に対して会計に関する報告を求め，又はその子会社の業務及び財産の状況の調査をすることができる。このとき，その子会社は，正当な理由がなければ，この報告又は調査を拒むことができない。", "a": true, "c": "H31Ⅱ⑤エ／R６Ⅰ⑤ウ／H28Ⅱ⑤ア", "e": ""}, {"l": 114, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "会計監査人は，その職務を行うため必要があるときに，会計監査人設置会社の子会社に対して会計に関する報告を求め，子会社の財産の状況を調査する場合，当該会計監査人設置会社の監査役等の承認を得なければならない。", "a": false, "c": "R４Ⅱ⑦イ／H27Ⅰ④ウ", "e": "会計監査人による子会社調査権の行使において，監査役等の承認を得る必要はない。"}, {"l": 115, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "取締役が会社の目的の範囲外の行為をするおそれがあり，当該行為が会社に対して著しい損害をもたらすおそれがある場合，会計監査人としての公認会計士は，当該取締役に対して当該行為をやめることを請求することができる。", "a": false, "c": "H29Ⅰ①ウ", "e": "会計監査人は，監査役が有しているような，取締役の不正行為等に対する差止請求権は有していない。"}, {"l": 116, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "監査役会設置会社における会計監査人は，その職務を行うに際して，取締役の職務の執行に関し不正の行為又は法令若しくは定款に違反する重大な事実を発見したときは，当該事項を監査役会に報告しなければならない。", "a": true, "c": "R４Ⅱ⑦ア／H29Ⅱ⑤ア／H28Ⅰ③イ", "e": ""}, {"l": 117, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "会計監査人は，全ての監査役が会計監査人の職務の遂行に関する事項を既に知っている場合を除き，特定監査役に対して会計監査報告の内容を通知する際に，当該事項についても通知しなければならない。", "a": true, "c": "R６Ⅱ⑥イ／H29Ⅰ⑤イ", "e": ""}, {"l": 118, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "監査役は，その職務を行うために必要な場合には，会計監査人に対し，その監査に関する報告を求めることができる。", "a": true, "c": "H24Ⅱ⑥ア", "e": ""}, {"l": 119, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "会計監査人は，計算書類が法令又は定款に適合するかどうかについて，監査役と意見が異なるときは，定時株主総会における決議がなくても，定時株主総会に出席して意見を述べることができる。", "a": true, "c": "R６Ⅱ⑥ウ／R４Ⅱ⑦エ／H31Ⅱ⑤イ／H28Ⅰ③エ／H27Ⅰ④エ", "e": ""}, {"l": 120, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "会計監査人監査による会計監査は，監査役等の監査と組み合わされて実施され，会計監査人の監査結果の報告を受けて，監査役等がその相当性を検証するかたちが基本となる。もし両者の意見が異なる場合，会計監査人は，定時株主総会に出席して意見を述べなければならない。", "a": false, "c": "H29Ⅱ⑤エ／R２Ⅰ④ア", "e": "本肢の場合，会計監査人は，定時株主総会に出席して意見を述べることが「できる」のであって，意見を述べなければならないわけではない。なお，前段の記述は正しい。"}, {"l": 121, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "会計監査人は，会社の役員と同様に委任に関する規定に従い，その任務を怠ったときは会社に対して損害賠償責任を負うが，全ての株主が同意した場合には免除される。", "a": true, "c": "H31Ⅰ⑤ア", "e": ""}, {"l": 122, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "会計監査人は，その任務を怠ったときは，株式会社に対し，これによって生じた損害を賠償する責任を負うが，会計監査人の職務を行うにつき善意でかつ重大な過失がないときは，株主総会の特別決議によって会計監査人が被監査会社から受ける報酬の２年分を控除して得た額を限度としてその責任を一部免除することができる。", "a": true, "c": "H29Ⅱ⑤ウ", "e": ""}, {"l": 123, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "株式会社は，会計監査人の任務僻怠による損害賠償責任を契約によって一定額に限定できるようにするためには，あらかじめ，そのような契約を締結できる旨を定款に定めておかなければならない。", "a": true, "c": "R５Ⅰ⑥エ／H25Ⅰ⑥オ", "e": ""}, {"l": 124, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "一時会計監査人は，会計監査人の選任と同様に，株主総会の決議によって選任されなければならない。", "a": false, "c": "R５Ⅱ⑤ア", "e": "一時会計監査人は，監査役等の過半数の同意により選任される。"}, {"l": 125, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "指名委員会等設置会社において，会計監査人が欠けた場合に，遅滞なく会計監査人が選任されないときは，指名委員会が一時会計監査人の職務を行うべき者を選任しなければならない。", "a": false, "c": "R５Ⅰ⑥イ／H30Ⅱ⑥ア", "e": "指名委員会等設置会社における一時会計監査人の選任は，指名委員会ではなく監査委員会が行う。"}, {"l": 126, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "会計監査人が辞任したが，直ちに臨時株主総会を開催することができない場合，監査役会は，その過半数の同意により，一時会計監査人を選任することができる。", "a": false, "c": "H31Ⅱ⑥イ", "e": "センスのない引っかけ。選任「することができる」ではなく「しなければならない」。"}, {"l": 127, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "一時会計監査人を選任した際には，会計監査人を選任した場合と同様に，一時会計監査人の氏名又は名称を登記しなければならない。", "a": true, "c": "R５Ⅱ⑤ウ", "e": ""}, {"l": 128, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "一時会計監査人に選任された監査法人は，監査法人に所属する社員の中から会計監査人の職務を行うべき者を選定し，会社に通知しなければならない。", "a": true, "c": "R５Ⅱ⑤イ", "e": ""}, {"l": 129, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "一時会計監査人の報酬等の決定に当たって，監査役設置会社で監査役が二人以上の場合，取締役は監査役全員の同意を得なければならない。", "a": false, "c": "R５Ⅱ⑤エ", "e": "一時会計監査人の報酬等の決定において必要となる監査役等の同意は，過半数でよい。"}, {"l": 130, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "親会社の監査役である者は，その子会社の会計監査人にはなれないが，社外監査役になることはできる。", "a": false, "c": "R２Ⅱ⑥イ", "e": "親会社の取締役，監査役，執行役の立場にある者は，社外監査役になれない。"}, {"l": 131, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "監査役会が４人で構成されている場合，社外監査役は３人以上必要であるが，監査委員会と監査等委員会が４人で構成されている場合には，当該委員会に属する社外取締役は，いずれも２人以上必要である。", "a": false, "c": "R２Ⅱ⑦ウ／H29Ⅱ④イ", "e": "社外監査役の必要数は，監査役会を構成する監査役の半数以上である。また，社外取締役の必要数は，各委員会の委員の過半数である。"}, {"l": 132, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "監査等委員会設置会社において，取締役会は必ずしも過半数が社外取締役である必要はないが，監査等委員会は過半数を社外取締役が占めなければならない。", "a": true, "c": "H31Ⅰ⑤ウ", "e": ""}, {"l": 133, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "大会社（公開会社でないもの及び指名委員会等設置会社並びに監査等委員会設置会社を除く）においては，監査役を4名選任した場合，社外監査役の員数は３名以上でなければならないが，常勤監査役は社外監査役の中から選定することができる。", "a": false, "c": "H25Ⅰ⑥イ", "e": "社外監査役の必要数は上記参照。なお，最後の記述は正しい。"}, {"l": 134, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "監査委員会の監査委員には全員が社外取締役であっても常勤者が不要であるが，監査等委員会の監査等委員には社外取締役のほか常勤者が一人以上必要である。", "a": false, "c": "R５Ⅰ⑦ア", "e": "監査等委員会の監査等委員も常勤者は不要である。なお，前段の記述は正しい。"}, {"l": 135, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "委員会設置会社を除く取締役会設置会社で，公開会社でない会計参与設置会社は，監査役を置かなくてもよい。", "a": true, "c": "H27Ⅰ④ア", "e": ""}, {"l": 136, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "監査等委員会設置会社において，原則，監査等委員である取締役の任期は２年，それ以外の取締役の任期は１年である。ただし，それぞれの任期について，後者が前者を超えない範囲で定款又は株主総会の決議で短縮することが可能である。", "a": false, "c": "H31Ⅰ⑤イ", "e": "監査等委員である取締役の任期は，定款又は株主総会の決議によっても短縮できない。"}, {"l": 137, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "監査役の任期は，選任後４年以内に終了する事業年度のうち最終のものに関する定時株主総会の終結時までとするが，指名委員会等設置会社における監査委員会の監査委員及び監査等委員会設置会社の監査等委員の任期は，取締役の任期と同じ選任後２年以内に終了する事業年度のうち最終のものに関する定時株主総会の終結の時までである。", "a": false, "c": "H29Ⅱ④エ", "e": "監査委員の任期は，選任後１年以内に終了する事業年度のうち最終のものに関する定時株主総会の終結の時までである。なお，監査役の任期に関する記述は正しい。"}, {"l": 138, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "監査役は株主総会で選任されなければならないが，欠員が生じた場合に備えて補欠として選任された監査役の任期は，欠員となった当該監査役の残任期間である。", "a": false, "c": "H25Ⅰ⑥ウ", "e": "いわゆる補欠監査役についても，その任期は，原則として就任の時から起算して４年以内に終了する事業年度のうち最終のものに関する定時株主総会の終結時までとなる。ただし，定款で定めることにより，退任した監査役の残任期間とすることもできる。"}, {"l": 139, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "監査役の任期は，その地位の強化や独立性の確保の観点から１年とされており，定款や選任決議によって任期を伸長又は短縮することはできない。", "a": false, "c": "H23Ⅱ③オ", "e": "監査役の任期は４年である。また，公開会社でない会社の監査役であれば，定款で定めることにより１０年まで伸長することができる。なお，任期の短縮はいかなる場合も認められていない。"}, {"l": 140, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "取締役は，監査役がある場合において，監査役の選任に関する議案を株主総会に提出するには，監査役全員の同意を得なければならない。", "a": false, "c": "H27Ⅱ⑤エ", "e": "本肢の場合に必要な監査役の同意は，全員ではなく過半数である。"}, {"l": 141, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "指名委員会等設置会社の監査委員の解職は，株主総会の特別決議により行わなければならないが，監査等委員会設置会社の監査等委員は，取締役会決議によって解任することができる。", "a": false, "c": "R５Ⅰ⑦イ", "e": "本肢は，解職・解任の手続の説明が逆になっている。つまり，指名委員会等設置会社の監査委員の解職は，取締役会の決議で行うのに対し，監査等委員会設置会社の監査等委員の解任は，株主総会の特別決議で行う。"}, {"l": 142, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "会社の取締役及び会計参与並びに支配人その他の使用人に対して，事業の報告を求めることは，監査役がいつでもできることである。", "a": true, "c": "H28Ⅱ⑤ウ", "e": ""}, {"l": 143, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "監査役会は，監査役の役割分担や情報の共有など，監査の方針や会社の業務及び財産の状況の調査の方法に関する事項を定めるが，このような監査役会の決定にかかわらず，各監査役は，自己の担当以外の事項についても単独で調査権限を行使できる。", "a": true, "c": "R５Ⅰ⑦エ", "e": ""}, {"l": 144, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "監査役は，必要に応じて，子会社に事業の報告を求めること並びに子会社の業務及び財産の状況を調査することが可能であり，子会社は，これらを拒むことができない。", "a": false, "c": "H31Ⅰ⑤エ", "e": "子会社は，正当な理由があれば，監査役による業務及び財産の状況の調査を拒むことができる。"}, {"l": 145, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "監査役が設置されている株式会社が，その監査役の監査の範囲を会計に関するものに限定する旨を定款で定めていないときに，当該株式会社の監査役が，当該株式会社の子会社の業務及び財産の状況の調査をすることができる場合がある。", "a": true, "c": "H30Ⅱ⑤ウ", "e": ""}, {"l": 146, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "監査役会が設置されている取締役会設置会社の監査役は，法令又は定款に違反する事実があると自らが認めるときに，その旨を当該取締役会設置会社の監査役会には報告しなければならないが，取締役会には報告しなくてよい。", "a": false, "c": "H30Ⅱ⑤ア", "e": "本肢の場合，監査役は，その旨を取締役会に報告しなければならない。なお，監査役会に対する報告の明文規定は存在しない。"}, {"l": 147, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "指名委員会等設置会社において，取締役により構成される機関である監査委員会の監査委員は，取締役の違法行為を差止請求する権限を持っていない。", "a": false, "c": "H29Ⅱ④ウ", "e": "監査委員会の監査委員も，監査役と同様に，取締役の違法行為を差止請求権を有している。"}, {"l": 148, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "監査役は，その職務の遂行に当たり，当該株式会社の親会社の監査役その他これに相当する者との意思疎通及び情報の交換を図るよう努める必要はない。", "a": false, "c": "H28Ⅱ⑤エ", "e": "監査役は，その職務の遂行に当たり，必要に応じて，親会社の監査役その他これらに相当する者との意思疎通及び情報の交換を図るよう努めなければならない。"}, {"l": 149, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "会計監査人は会計監査で得た情報を監査役等に伝える必要があるが，監査役等は，会計監査人の監査の方法と結果の相当性を判断する立場にあることから，日常の業務監査等で知り得た情報を会計監査人に伝えることは期待されていない。", "a": false, "c": "R４Ⅰ②ア", "e": "会計監査人と監査役等は，双方向のコミュニケーションを実施して，効果的な連携をもたらすような関係を構築することが求められている。したがって，監査役等には，日常の業務監査等で知り得た情報（経営者が関与する不正等）を会計監査人に伝えることが期待されているといえる。"}, {"l": 150, "m": "会社法", "sb": "", "i": "A", "r": "", "q": "指名委員会等設置会社及び監査等委員会設置会社では，大会社であるか否かとは無関係に，取締役会による内部統制システムの整備の決定が義務付けられている。", "a": true, "c": "R５Ⅰ⑦ウ", "e": ""}, {"l": 151, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "財務書類の監査証明業務のうち法定監査以外の業務は，公認会計士の独占業務ではない。", "a": false, "c": "H23Ⅱ④ア", "e": "財務書類の監査証明業務は，法定監査・任意監査ともに公認会計士の独占業務である。"}, {"l": 152, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "公認会計士法第１条では，公認会計士の使命として，財務に関する情報の信頼性を確保することにより投資者の保護を図ることのほか，会社等の公正な事業活動を図ること及び債権者の保護を図ることを定めている。", "a": true, "c": "H29Ⅰ③ア", "e": ""}, {"l": 153, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "公認会計士の使命は，監査証明業務及び非監査証明業務を通じて，会社等の公正な事業活動，投資者及び債権者の保護等を図り，もって国民経済の健全な発展に寄与することである。", "a": true, "c": "R３③ア", "e": "公認会計士法が明文化している公認会計士の使命は「非監査証明業務」を前提にしていないが，公認会計士の業務に「非監査証明業務」が含まれる点から，正しいと判断することが求められた。"}, {"l": 154, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "公認会計士には品位を保持すること並びに知識及び技能の修得に努めることが求められており，これらについては法人としての監査法人に対しても同様である。", "a": true, "c": "H23Ⅱ④イ", "e": ""}, {"l": 155, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "公認会計士の職責には独立性は含まれていない。これは，公認会計士の職責の対象となる業務が，監査業務だけでなく非監査業務も含むためである。", "a": false, "c": "R５Ⅰ③ア", "e": "公認会計士の職責には，独立性（独立の立場を保持すべきこと）も含まれている。"}, {"l": 156, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "公認会計士法は，制定当初より監査及び会計の専門家として，公認会計士の使命及び職責を定めており，当該規定は監査法人にも準用されている。", "a": false, "c": "R２Ⅱ③ア／H24Ⅱ⑤ア", "e": "使命及び職責は，平成１５年の法改正によりはじめて明文化された規定である。なお，使命及び職責が監査法人にも準用される点は正しい。"}, {"l": 157, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "公認会計士法は，公認会計士又は監査法人が行う，金融商品取引法や会社法等に基づく法定監査の監査証明業務に適用されるが，法定監査以外の任意監査，あるいは，公認会計士の名称を使って他者の依頼に応じて報酬を得て行う会計や財務に係るコンサルティング業務においても，非適用とならない。", "a": true, "c": "H25Ⅱ④ア", "e": ""}, {"l": 158, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "監査人の職業的専門家としての専門能力の向上と実務経験等から得られる知識の蓄積について，その具体的な手段の一つとして，公認会計士法は，日本公認会計士協会が実施する研修を受けるとともに，公認会計士としても自己研鑽に努めるべきことを規定している。", "a": false, "c": "R２Ⅰ⑬イ", "e": "公認会計士法には，研修を受けることを義務付けた規定は存在するが，自己研鑽を義務付ける規定は存在しない。"}, {"l": 159, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "公認会計士名簿，外国公認会計士名簿及び特定社員名簿は，日本公認会計士協会で備えることが求められている。", "a": true, "c": "R５Ⅱ④エ", "e": ""}, {"l": 160, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "公認会計士となる資格を有する者が，公認会計士となるためには，日本公認会計士協会に備えられた公認会計士名簿へ公認会計士としての登録を受けなければならない。この登録により，当然に，日本公認会計士協会の会員となり，日本公認会計士協会が自主に定める会則を守ることが求められる。", "a": true, "c": "R５Ⅰ③イ", "e": "なお，本肢の後段の内容は細かいため，レジュメには掲載していない。"}, {"l": 161, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "未成年者でも公認会計士試験を受験することができるが，公認会計士となることはできない。", "a": true, "c": "R５Ⅱ④ア", "e": ""}, {"l": 162, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "公認会計士が，故意に，虚偽，錯誤又は脱漏のある財務書類を虚偽，錯誤及び脱漏のないものとして証明し，内閣総理大臣から登録抹消の処分を受けた場合，処分の日から２年経過すると，再登録が可能となる。", "a": false, "c": "H31Ⅱ③ウ／H24Ⅰ③エ", "e": "登録抹消の処分を受けた後に再登録を行うためには，当該処分の日から５年を経過しなければならない。"}, {"l": 163, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "公認会計士が，故意に，虚偽，錯誤又は脱漏のある財務書類を虚偽，錯誤及び脱漏のないものとして証明した場合で，内閣総理大臣によって登録抹消の処分を受けたときであっても，処分の日から所定の期間が経過し，内閣総理大臣の認可を受けた者は，公認会計士として再登録することができる。", "a": false, "c": "H27Ⅰ②ア", "e": "登録抹消処分を受けた公認会計士が再登録する際に，内閣総理大臣の認可は求められていない。"}, {"l": 164, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "監査法人は，その業務のもつ公益性が高く，共同組織体として組織的な監査の遂行が公正かつ適切に行われる必要がある。そのため，監査法人の設立に当たっては，内閣総理大臣の認可を受けることを要する。", "a": false, "c": "R５Ⅰ③ウ", "e": "現在の監査法人の設立は，認可制ではなく届出制である。なお，前半の記述は正しい。"}, {"l": 165, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "公認会計士法は，経済社会を取り巻く環境の変化に対応して適時に改正が行われてきており，組織的監査の必要性から監査法人制度が導入され，また企業のグローバル化に伴う海外企業との関係促進に対応するために外国監査法人等の許認可制度が創設された。", "a": false, "c": "H25Ⅱ④ウ", "e": "外国監査法人等も，国内監査法人と同様，認可制ではなく届出制である。なお，それ以外の記述は正しい。"}, {"l": 166, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "監査法人は，業務として，監査証明業務に加え，公認会計士試験に合格した者に対する実務補習を実施しなければならない。", "a": false, "c": "R５Ⅱ④ウ", "e": "実務補習の業務は，定款で定めることではじめて実施できるものであり，実施しなければならないわけではない。"}, {"l": 167, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "監査法人の品質管理，ガバナンス及びディスクロージャーの強化の観点から，公認会計士以外の，経営，財務，内部統制，情報技術等の専門家が監査法人の社員となることが認められており，これを特定社員制度という。", "a": true, "c": "H24Ⅰ⑥ア／H24Ⅱ⑤イ", "e": ""}, {"l": 168, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "公認会計士でない者は，特定社員として日本公認会計士協会の登録を受けることにより，監査法人の社員となることができる。", "a": true, "c": "H26Ⅱ④エ", "e": ""}, {"l": 169, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "特定社員も，公認会計士法上の義務である秘密保持，特定社員が被監査会社と特定の利害関係を有する場合の監査法人の監査証明業務の制限，及び競業禁止の義務が課される。", "a": true, "c": "H26Ⅱ④エ／R３⑬ウ／R２Ⅱ④エ", "e": ""}, {"l": 170, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "監査法人は，当該監査法人の社員のうち，一定の割合以上を公認会計士である社員が占めることを求められているが，ここでいう公認会計士である社員には，外国公認会計士は含まれない。", "a": false, "c": "R４Ⅱ②イ", "e": "公認会計士である社員には，外国公認会計士も含まれる。※他の論点においても同じ"}, {"l": 171, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "監査法人が，その業務に係る契約の締結の方針について，社員の一部をもって構成される合議体で決定する場合には，当該合議体を構成する社員のうち７５％以上は公認会計士である社員でなければならない。", "a": true, "c": "H27Ⅰ②ウ", "e": ""}, {"l": 172, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "監査法人の社員は，他の監査法人の社員となることが禁じられている。", "a": true, "c": "R４Ⅱ②ア", "e": ""}, {"l": 173, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "監査法人の社員は競業禁止の観点から，他の監査法人の社員になってはならないが，自己又は第三者のために自己が所属する監査法人の業務の範囲に属する公認会計士法第２条第２項で規定される非監査証明業務を行うことについては，当該社員以外の全社員の承認を受けたときには認められる。", "a": true, "c": "H26Ⅰ②イ／R４Ⅰ③ウ／H31Ⅰ②ウ／H24Ⅰ③イ", "e": "なお，監査証明業務については，たとえ全社員の承認を受けたとしても行うことはできない。"}, {"l": 174, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "監査法人は，社員の全部が有限責任社員であっても，その名称中に有限責任という文字を使用する必要はない。", "a": false, "c": "H28Ⅰ④ア", "e": "有限責任監査法人は，その名称中に有限責任という文字を使用しなければならない。"}, {"l": 175, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "監査法人の合併の際には総社員の同意が求められるが，監査法人の社員の脱退については総社員の過半数の同意が必要となる。", "a": false, "c": "R５Ⅱ④イ", "e": "監査法人の社員の脱退についても総社員の同意が必要となる。"}, {"l": 176, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "監査法人は，業務管理体制の整備の一環として業務の品質の管理の方針の策定及びその実施が義務付けられているが，当該業務の品質の管理に関する規定は，「監査に関する品質管理基準」と整合的である。", "a": true, "c": "R４Ⅰ③イ", "e": "本肢は，品質管理に関する理解に基づいて正誤判断を行ってほしい。"}, {"l": 177, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "監査法人は，当該監査法人の公認会計士である社員以外の者に監査証明業務を行わせ，監査報告書の筆頭に署名させてはならない。", "a": true, "c": "R２Ⅰ②エ／H26Ⅰ②エ", "e": ""}, {"l": 178, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "無限責任監査法人は，当該法人の行うすべての監査証明業務について，それぞれの証明業務ごとに１名以上の指定社員を指定しなければならない。", "a": false, "c": "R２Ⅱ④イ／H26Ⅱ④ウ", "e": "指定社員制度の採用はあくまでも任意であるが，当該制度を採用する場合において，すべての監査証明業務について社員を指定する必要はない。"}, {"l": 179, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "有限責任監査法人は，全ての財務書類の証明について，証明ごとに１人又は数人の業務を担当する社員を指定しなければならない。", "a": true, "c": "R４Ⅱ②ウ／H26Ⅱ④イ", "e": "有限責任監査法人の社員の指定は，すべての監査証明業務に強制される。"}, {"l": 180, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "ひとたび有限責任監査法人となった無限責任監査法人は，再び無限責任監査法人となることはできない。", "a": false, "c": "H24Ⅱ④オ", "e": "監査法人は，定款の変更により，無限責任監査法人になることも有限責任監査法人になることもできる。"}, {"l": 181, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "無限責任監査法人が，特定の証明について，１人又は数人の業務を担当する社員を指定したときには，指定を受けた社員のみが業務を執行する権利を有し，義務を負う。", "a": true, "c": "H28Ⅰ④イ", "e": ""}, {"l": 182, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "監査法人における特定社員は，監査証明業務を執行する権利を有さず，義務も負わないが，非監査証明業務については，当該業務を執行する権利を有し，義務を負う。", "a": true, "c": "R２Ⅱ④ウ", "e": ""}, {"l": 183, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "無限責任監査法人は，当該監査法人が行う全ての財務書類の証明業務について，全社員が無限責任監査法人を代表する。", "a": false, "c": "R４Ⅱ②エ", "e": "無限責任監査法人が行う監査証明業務の代表権は，公認会計士である社員のみが有する（特定社員は有しない）。"}, {"l": 184, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "監査法人の特定社員は，補助者として監査法人の業務に従事することはできるが，監査法人の意思決定に関与することはできない。", "a": false, "c": "H30Ⅰ③ア／R２Ⅱ③イ", "e": "特定社員は，補助者として業務に従事することができるだけでなく，監査法人の意思決定に関与することもできる。"}, {"l": 185, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "無限責任監査法人における指定証明に関して，被監査会社等に対して負担することとなった当該法人の債務を，当該法人の財産をもって完済することができないときは，指定社員が連帯してその弁済の責任を負う。", "a": true, "c": "H29Ⅰ③イ", "e": ""}, {"l": 186, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "指定証明において，指定社員以外の社員は，無限責任監査法人が被監査会社に対して負担する債務について有限責任となるが，第三者に対して負担する債務については有限責任とはならない。", "a": true, "c": "H26Ⅱ④ウ／H24Ⅰ⑥オ", "e": ""}, {"l": 187, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "無限責任監査法人の成立後に新たに加入した社員は，加入する前に生じた当該監査法人の債務についても連帯して弁済する責任を負わなければならない。", "a": true, "c": "H24Ⅰ③ア", "e": "無限責任監査法人の社員の責任が「無限連帯責任」であることを踏まえて判断する。"}, {"l": 188, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "有限責任監査法人が行う証明業務は全て特定証明であり，特定証明について業務を執行する権利を有し義務を負う者は，指定有限責任社員のみである。", "a": true, "c": "H30Ⅰ③イ", "e": ""}, {"l": 189, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "指定有限責任社員は，特定証明に関して負担することとなった所属する有限責任監査法人の債務を当該監査法人の財産をもって完済することができない場合，連帯してその弁済の責任を負う。", "a": true, "c": "R３③エ／H24Ⅱ④イ", "e": ""}, {"l": 190, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "指定有限責任社員は，証明を受けようとする者に対し指定した旨の通知がされている場合，指定された証明に関して負担することとなった有限責任監査法人の債務について，脱退後の事由により生じた債務であることを証明したときを除き，当該有限責任監査法人の財産の状況にかかわらず，連帯してその弁済の責任を負う。", "a": false, "c": "R７Ⅰ⑤イ", "e": "指定有限責任社員が無限連帯責任を負うのは，生じた債務について有限責任監査法人の財産で完済できない場合であるため，「有限責任監査法人の財産の状況にかかわらず」責任を負うとする本肢は誤りとなる。"}, {"l": 191, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "特定証明において，指定有限責任社員以外の社員は，有限責任監査法人が被監査会社及び第三者に対して負担する債務について有限責任となる。", "a": true, "c": "H26Ⅱ④イ／R２Ⅱ④ア", "e": ""}, {"l": 192, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "有限責任監査法人は，特定証明に係る業務において指定有限責任社員を指定し，かつ証明を受けようとする者にその指定を通知する。この場合，指定を受けていない社員が補助者として特定証明に係る業務に関与したとき，当該社員は，指定有限責任社員と同一の責任を負わなければならない。", "a": false, "c": "R２Ⅰ②イ", "e": "指定を受けていない社員が補助者として関与しただけであれば，当該社員は有限責任を負うのみである。"}, {"l": 193, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "有限責任監査法人において，登録の義務，財政的基盤及びディスクロージャーの充実が求められているのは，特定証明に係る指定有限責任社員以外の社員の責任が限定され，軽減されていることによる。", "a": true, "c": "R２Ⅱ③ウ", "e": ""}, {"l": 194, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "全ての有限責任監査法人は，計算書類を作成しなければならず，当該計算書類については，特別の利害関係のない公認会計士又は監査法人の監査報告書を添付しなければならない。", "a": false, "c": "H30Ⅱ③エ／H28Ⅰ④ウ／H24Ⅱ④ウ", "e": "収益の額が１０億未満の有限責任監査法人は，作成する計算書類に監査報告書を添付する必要はない。"}, {"l": 195, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "監査法人は，毎会計年度経過後二月以内に，計算書類及び業務の概況等を記載した業務報告書を作成し，これらの書類を金融庁長官に提出しなければならない。このうち全ての有限責任監査法人は，直近の二会計年度の計算書類とその監査報告書を公衆縦覧に供しなければならない。", "a": false, "c": "R４Ⅰ③ア", "e": "監査報告書は，全ての有限責任監査法人で必要となるわけではない（上記参照）。なお，前段は正しい。"}, {"l": 196, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "監査法人の設立に際して，有限責任監査法人に限り，社員数に応じた最低資本金の金額が定められている。", "a": true, "c": "H24Ⅱ④エ", "e": ""}, {"l": 197, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "同一の監査法人を構成する社員として，有限責任社員と無限責任社員の両者が混在する場合がある。", "a": false, "c": "H30Ⅰ③エ", "e": "監査法人の形態は，無限責任監査法人か有限責任監査法人かのいずれかであるため，同一の監査法人の中に，有限責任社員と無限責任社員の両者が混在することはない。"}, {"l": 198, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "監査法人が合併によって大規模化するにつれて，従来の無限責任社員による法人制度では現実的ではなくなってきた。そのために設けられたのが特定社員や有限責任監査法人の制度である。", "a": false, "c": "R６Ⅰ②ウ", "e": "特定社員制度は，大規模化した監査法人における多様な分野における専門的知識の蓄積の必要性から設けられたものである。"}, {"l": 199, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "公認会計士は，その配偶者が過去１年以内に財務に関する事務の責任ある担当者であった会社の財務書類について，当該会社の求めに応じ報酬を得て，当該財務書類の監査又は証明をすることを業とすることができる場合がある。", "a": false, "c": "H29Ⅱ②ア", "e": "本肢のような場合は，当該会社に対して監査証明業務を提供できない。なお，監査法人の場合であれば，非関与社員の場合に限り監査証明業務を提供できる場合がある。"}, {"l": 200, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "公認会計士は，自らが使用人である会社の財務書類については，当該会社の求めに応じ報酬を得て，当該財務書類の監査又は証明をすることを業とすることができない。", "a": true, "c": "H29Ⅱ②イ", "e": ""}, {"l": 201, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "公認会計士は，自らの配偶者が株主である会社については，当該会社の財務書類の監査証明業務はできないが，配偶者が相続又は遺贈によって当該会社の株式を取得し，その後１年を経過していない場合においては，その監査証明業務を実施することができる。", "a": true, "c": "H27Ⅱ③ア", "e": ""}, {"l": 202, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "監査法人は，その社員の配偶者が役員である会社については，その社員が当該会社の財務書類の監査証明業務に関与しない場合であっても，当該会社の財務書類の監査証明業務を行うことができない。", "a": false, "c": "R７Ⅰ⑤ア", "e": "監査証明業務に関与しない社員の配偶者が被監査会社等の役員である場合，その数が社員の半数以上となってはじめて監査証明業務が禁じられるため，本肢は誤りとなる。"}, {"l": 203, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "監査法人に所属する公認会計士が，補助者として監査業務に従事していた会計期間の途中で退職し，直ちに当該被監査会社の使用人となった場合，当該監査法人は当該被監査会社の監査証明業務を行うことはできない。", "a": false, "c": "H24Ⅰ③オ", "e": "監査法人の退職後であれば，被監査会社の使用人になることに問題はない。"}, {"l": 204, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "監査法人は，その社員が税務業務によって会社から継続的な報酬を受け取っている場合には，当該会社に対して監査証明業務を行うことはできない。", "a": true, "c": "H23Ⅱ④オ", "e": ""}, {"l": 205, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "監査人は，被監査会社との間の特別の利害関係を検討するに当たって，被監査会社の持分法適用会社まで考慮に入れる必要はない。", "a": false, "c": "H31Ⅰ③エ", "e": "監査人は，金融商品取引法監査を行う場合には，被監査会社との関係のみならず，その連結子会社や持分法適用会社との関係においても，特別の利害関係を有してはならないとされている。"}, {"l": 206, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "監査証明をしようとする連結財務諸表に係る連結会計年度の各期首において，関連会社に対する投資について持分法を適用することを被監査会社が決定していない場合でも，当該監査証明に係る特別の利害関係について，持分法適用会社に係る関係は適用される。", "a": false, "c": "H28Ⅰ⑤イ", "e": "期首において，関連会社に対する投資について持分法を適用することを被監査会社が決定していない場合には，監査証明に係る特別の利害関係について，当該持分法適用会社に係る関係は適用されない。"}, {"l": 207, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "公認会計士又は監査法人は，ある株式会社の子会社から公認会計士又は監査法人の業務以外の業務により継続的な報酬を受けている場合，当該株式会社の会計監査人となることができない。", "a": true, "c": "R２Ⅰ④ウ", "e": ""}, {"l": 208, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "ある会社の財務書類について監査法人の行う監査証明業務に関与した公認会計士が，当該財務書類に係る会計期間又はその翌会計期間内に，その被監査会社の連結会社の役員となった場合，当該監査法人は当該期間に係る被監査会社の監査証明業務を行うことはできない。", "a": true, "c": "H31Ⅰ②ア", "e": "なお，本肢は，いわゆる就職制限規定に関する記述ではなく，監査法人に適用される特別な利害関係に関する記述である。"}, {"l": 209, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "公認会計士は，やむを得ない事情があると認められるなどの例外的な場合を除き，監査証明業務を行った翌会計期間の終了日まで，被監査会社の親会社，連結子会社，持分法適用の非連結子会社，関連会社及び親会社の他の連結子会社の役員になることはできない。", "a": true, "c": "H30Ⅱ③ア／R６Ⅰ③ウ／H26Ⅱ④ア", "e": ""}, {"l": 210, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "公認会計士が，公認会計士法で定める就職制限会社に該当しない会社の役員に就いている場合で，当該会社が就職制限会社に該当する会社と合併することとなったときには，当該公認会計士は，役員に就任する際に当該合併について知らなかったこと，及び内閣総理大臣の承認を得たことを条件として，合併後に存続する会社の役員に就くことができる。", "a": true, "c": "H27Ⅰ②イ", "e": "なお，本肢は，就職制限規定に定められている「やむを得ない事情」の具体例に関する記述である。"}, {"l": 211, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "被監査会社に将来就職することを見込んで監査証明を不当に歪めることを排除するために監査人の就職制限の規定が設けられているが，この場合の制限の対象となる公認会計士は，公認会計士法に定める大会社等の財務諸表監査を実施している監査責任者に限られる。", "a": false, "c": "H24Ⅰ⑥エ", "e": "就職制限規定は，被監査会社の規模に関係なく適用されるものである。"}, {"l": 212, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "監査証明業務に関与した公認会計士は，監査証明上の法的責任の時効が完成するまでの期間，被監査会社及びその連結会社等の役員又はこれに準ずるものに就いてはならない。", "a": false, "c": "H26Ⅰ②ア", "e": "役員への就職が制限されるのは，監査を行った財務書類の会計期間の翌会計期間末までであり，監査証明上の法的責任の時効が完成するまでの間ではない。"}, {"l": 213, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "独立性強化の観点から監査人の業務制限の特例が適用される大会社等の範囲には，会社法上の会計監査人設置会社のうち最終事業年度に係る貸借対照表上の資本金の額が１００億円以上又は負債総額１,０００億円以上の株式会社が含まれる。", "a": true, "c": "R７Ⅰ⑤ウ", "e": ""}, {"l": 214, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "上場会社は，社会的に大きな影響力をもっているため，上場会社の監査を担当する公認会計士に対しては，特別に，単独監査の禁止，一定の非監査証明業務の禁止，就職の制限などの規定が置かれている。", "a": false, "c": "R５Ⅱ①ウ", "e": "就職制限は，大会社等（本肢は上場会社と表現している）であるか否かに関わらず適用される規定であり，「特別」に置かれた規定ではない。"}, {"l": 215, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "公認会計士の独立性に関して，公認会計士法においては，大会社等への監査証明業務と非監査証明業務の同時提供の禁止やいわゆるローテーション制度等が規定されているが，この場合の大会社等は会社法の大会社と範囲が異なる。", "a": true, "c": "H24Ⅰ⑥イ", "e": ""}, {"l": 216, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "監査法人は，その社員が，内部監査人としての業務によって大会社等から継続的な報酬を得ている場合には，当該大会社等に対して監査証明業務を行ってはならない。", "a": true, "c": "R６Ⅰ③イ", "e": ""}, {"l": 217, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "公認会計士が会計帳簿の記帳の代行その他の財務書類の調製に関する業務を行いながら同時に監査証明業務を行うことは，公認会計士が監査人として自ら行った業務を自らの監査対象とすることにつながるおそれがあることから，いかなる場合にも禁止される。", "a": false, "c": "H31Ⅰ②イ", "e": "会計帳簿の記帳の代行その他の財務書類の調製に関する業務は，公認会計士法上の大会社等に対してのみ同時提供が禁止される業務である。"}, {"l": 218, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "監査法人が，公認会計士法で大会社等に係る業務の制限の特例として禁止されている業務以外の非監査証明業務を，被監査会社である大会社等に対して提供する場合は，当該被監査会社の監査役会又は監査委員会の承認を得なければならない。", "a": false, "c": "H26Ⅰ②ウ", "e": "大会社等に対して同時提供が禁止されていない非監査証明業務を実施する際，監査役等の承認を得る必要はない。"}, {"l": 219, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "公認会計士は，大会社等に対して連続する７会計期間について監査証明業務を行った場合には，その翌会計期間以後の５会計期間について，当該大会社等に対して監査証明業務を行ってはならない。", "a": false, "c": "R６Ⅰ③ア", "e": "公認会計士の場合のローテーションは，「７－２ルール」に従う。"}, {"l": 220, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "大規模監査法人ではない監査法人が公認会計士法上の大会社等に対して行う監査証明業務において，業務執行社員が連続して当該監査証明業務を行うことのできる期間は７会計期間，その後の監査禁止期間は２会計期間である。", "a": true, "c": "H25Ⅱ③ア", "e": ""}, {"l": 221, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "直近会計年度において１００以上の上場有価証券発行者等の監査証明を行った監査法人の筆頭業務執行社員が，金融商品取引所に上場されている有価証券の発行者等の財務書類について連続して監査証明を行うことのできる期間は，最長で５会計期間である。", "a": true, "c": "H30Ⅰ③ウ／H28Ⅰ④エ", "e": "なお，直近会計年度において１００以上の上場有価証券発行者等の監査証明を行った監査法人とは，大規模監査法人のことである。"}, {"l": 222, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "上場会社を監査する大規模監査法人において，筆頭業務執行社員が連続して当該上場会社の監査証明を行うことのできる期間は５会計期間，その後の監査禁止期間は５会計期間である。", "a": true, "c": "H25Ⅱ③ア", "e": ""}, {"l": 223, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "大規模監査法人の社員のうち，公認会計士法に定める大会社等の監査証明業務を行う筆頭業務執行社員の連続する関与会計期間の上限は，5会計期間である。", "a": false, "c": "H24Ⅰ③ウ", "e": "本肢の規定は，「上場会社」の監査証明業務を行う場合にのみ適用されるものである。"}, {"l": 224, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "大規模監査法人において，上場会社の監査証明業務を行う筆頭業務執行社員は，連続した５会計期間の監査証明業務の後，当該上場会社の監査関連業務には５会計期間の経過後でなければ従事できないが，審査に最も重要な責任を有する者はこの限りでない。", "a": false, "c": "R２Ⅰ②ウ／H30Ⅱ③イ", "e": "審査に最も重要な責任を有する者も，本肢のローテーションが必要となる。"}, {"l": 225, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "大規模監査法人では，筆頭業務執行社員のみでなく，監査証明業務の審査に関与し最も重要な責任を有する者も交替の対象となるが，大規模監査法人ではない監査法人では，交代の対象となる者は業務執行社員のみであり，監査証明業務の審査に関与した者は交替しなくてもよい。", "a": false, "c": "H25Ⅱ③イ", "e": "大規模監査法人ではない監査法人においても，交代の対象となる者に審査担当者が含まれる。"}, {"l": 226, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "公認会計士法上の大会社に対して７会計期間継続して監査を行った監査法人は，その後の２会計期間当該被監査会社を監査することはできない。", "a": false, "c": "H24Ⅰ⑥ウ", "e": "現行制度上，監査法人自体の交代は求められていない。"}, {"l": 227, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "大規模監査法人であるか大規模監査法人でないかにかかわらず，監査関連業務を行わない会計期間が法で定める期間に満たない場合は，当該期間についても連続業務期間に算入する。", "a": true, "c": "H25Ⅱ③エ", "e": ""}, {"l": 228, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "大規模監査法人であるか大規模監査法人でないかにかかわらず，新規上場前に監査関連業務を行っている場合には，その監査関連業務を行った会計期間も，連続業務期間に算入する。", "a": true, "c": "H25Ⅱ③ウ", "e": ""}, {"l": 229, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "公認会計士及び監査法人は，大会社等において監査証明業務を行うときは，他の公認会計士を補助者として使用するか，又は他の監査法人と共同しなければならない。", "a": false, "c": "R６Ⅰ③エ", "e": "単独監査の禁止は，監査法人については適用されない（組織的な監査が可能なため）。"}, {"l": 230, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "公認会計士は，大会社等の財務書類に係る単独監査を禁止されているが，共同監査を行う他の公認会計士が登録を抹消された場合にはこの限りでない。", "a": true, "c": "R２Ⅰ②ア／H23Ⅱ④ウ", "e": ""}, {"l": 231, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "公認会計士は，大会社等の財務書類について監査証明業務を行う際に監査法人と共同監査を行っている場合において，当該監査法人が解散したことにより共同で当該業務を行うことができなくなったときには，新たに公認会計士又は監査法人を選任して，共同監査を行わなければならない。", "a": false, "c": "H30Ⅱ③ウ／H27Ⅰ②エ", "e": "本肢のようなやむを得ない事情が認められる場合，公認会計士は，共同で監査する公認会計士又は監査法人を新たに選任せずとも，大会社等の財務書類について引続き監査証明業務を行うことができる。"}, {"l": 232, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "公認会計士は，大会社等の監査証明業務の実施に当たっては，他の公認会計士等と共同するか，又は他の公認会計士を補助者として実施しなければならないが，単独監査が認められる場合もある。それは，他の公認会計士が，登録を抹消された場合や事故又は疾病によって業務を行うことができなくなった場合に限られる。", "a": false, "c": "R３③イ／H27Ⅱ③イ", "e": "本肢が示す状況以外に，他の公認会計士が移転した場合や他の監査法人が解散した場合にも単独監査は認められる。"}, {"l": 233, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "公認会計士法は，公認会計士の自主規制機関である日本公認会計士協会の事務や目的等について規定しているが，公的な監視・監督機関である公認会計士・監査審査会の事務や目的等についても規定している。", "a": true, "c": "H25Ⅱ④エ／H24Ⅱ⑤エ", "e": ""}, {"l": 234, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "公認会計士法においては，公認会計士・監査審査会の設置を規定し，同審査会の権限の一つとして，公認会計士，外国公認会計士及び監査法人に対する懲戒処分を定めている。", "a": false, "c": "H24Ⅱ⑤ウ", "e": "公認会計士・監査審査会は，あくまで懲戒処分に関する調査審議及び内閣総理大臣に対する勧告を行うことができるのみであり，懲戒処分を行う権限は有していない。"}, {"l": 235, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "公認会計士及び監査法人は，日本公認会計士協会が備えている上場会社等監査人名簿への登録を受けなければ，上場会社等の財務書類について監査証明を行うことができない。", "a": true, "c": "R６Ⅱ④ア", "e": ""}, {"l": 236, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "日本公認会計士協会は，上場会社等監査人名簿への登録の申請者が，無限責任監査法人又は有限責任監査法人のいずれであったとしても，その公認会計士の社員数が政令で定める数を満たしていなければ，登録を拒否しなければならない。", "a": true, "c": "R６Ⅱ④イ", "e": ""}, {"l": 237, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "上場会社等監査人名簿への登録に係る申請書を提出した公認会計士は，当該申請書を提出した日から３か月を経過しても，登録の可否についての通知がなされない場合，当該登録を拒否されたものとして，日本公認会計士協会に対して，再審査の請求をすることができる。", "a": false, "c": "R６Ⅱ④ウ", "e": "再審査の請求は，日本公認会計士協会ではなく，内閣総理大臣に対して行う。"}, {"l": 238, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "上場会社等監査人の登録が取り消された公認会計士又は監査法人は，その取消日前に締結された契約があったとしても，当該契約に係る監査証明を行うことはできない。", "a": false, "c": "R６Ⅱ④エ", "e": "登録を取り消された公認会計士又は監査法人であっても，その取消しの日前に締結された契約に係る監査証明業務を行うことができる。"}, {"l": 239, "m": "公認会計士法", "sb": "", "i": "A", "r": "", "q": "登録上場会社等監査人は，年度又は会計年度中の一定の日における業務の品質の管理の状況を適切に評価し，一定の事項を公表する体制を整備しなければならない。", "a": true, "c": "R７Ⅰ⑤エ", "e": ""}, {"l": 240, "m": "公認会計士法", "sb": "", "i": "B", "r": "", "q": "財務諸表監査の目的は，企業が公表する財務諸表に信頼性を付与することにあるため，監査人は，被監査企業から監査上の報酬を得ることを含め，当該企業に対して利害関係を持つことは基本的に禁止されている。", "a": false, "c": "R２Ⅱ①ウ", "e": "監査人が被監査会社から監査報酬を直接受領するという契約形態は，監査人の独立性を損なうものではないため，禁止されていない。"}, {"l": 241, "m": "倫理規則", "sb": "", "i": "A", "r": "", "q": "公認会計士の使命は，監査及び会計の専門家として独立した立場において財務情報の信頼性を確保することにより，国民経済の健全な発展に寄与することであるが，公認会計士は，個々の依頼人や雇用主の要請を満たすだけでは社会から期待された当該使命を果たすことはできない。", "a": true, "c": "H30Ⅰ②ア", "e": ""}, {"l": 242, "m": "倫理規則", "sb": "", "i": "A", "r": "", "q": "財務諸表監査制度の社会的信頼を獲得し，個々の公認会計士が職業的専門家として高度な倫理観を保持することが必要不可欠であることから，企業会計審議会は，「監査基準」とは別に「倫理規則」を定め，公認会計士にその遵守を求めている。", "a": false, "c": "R６Ⅱ③イ／R３②イ", "e": "倫理規則を定めているのは，企業会計審議会ではなく日本公認会計士協会である。"}, {"l": 243, "m": "倫理規則", "sb": "", "i": "A", "r": "", "q": "日本公認会計士協会が公表する倫理規則は，職業専門家としての倫理の基本原則を規定し，当該原則を適用するための概念的な枠組みを提供している。しかしながら，当該枠組みがどのように特定の状態に適用されることになるかを説明していない。", "a": false, "c": "R７Ⅰ⑫ア", "e": "倫理規則のパート２からパート４では，パート１で規定した概念的枠組みが，どのように特定の状態に適用されるかを具体的に説明している。"}, {"l": 244, "m": "倫理規則", "sb": "", "i": "A", "r": "", "q": "「誠実性の原則」には，重要な虚偽又は誤解を招く陳述が含まれる情報であることを認識しながら，その作成や開示に関与してはならないことが含まれている。", "a": true, "c": "H28Ⅰ②ウ", "e": ""}, {"l": 245, "m": "倫理規則", "sb": "", "i": "A", "r": "", "q": "「客観性の原則」には，誇張した宣伝及び他の者と自己との根拠のない比較をしてはならないことが含まれている。", "a": false, "c": "H28Ⅰ②ア", "e": "本肢は，客観性の原則の内容ではなく職業的専門家としての行動の原則の内容である。"}, {"l": 246, "m": "倫理規則", "sb": "", "i": "A", "r": "", "q": "「職業的専門家としての能力及び正当な注意の原則」には，バイアスや利益相反などによる影響を受けることなく，職業的専門家としての判断又は業務上の判断を行うことが含まれている。", "a": false, "c": "H28Ⅰ②イ", "e": "本肢は，職業的専門家としての能力及び正当な注意の原則の内容ではなく客観性の原則の内容である。"}, {"l": 247, "m": "倫理規則", "sb": "", "i": "A", "r": "", "q": "「職業的専門家としての行動の原則」には，常に職業的専門家としての基準及び法令等を遵守することが含まれている。", "a": true, "c": "H28Ⅰ②エ", "e": ""}, {"l": 248, "m": "倫理規則", "sb": "", "i": "A", "r": "", "q": "監査人は被監査企業に対して独立性を保持することが倫理規則によって要求されている。ただし，精神的独立性は，その本質が監査人の心の状態を意味することから，規定が困難なため，倫理規則では外観的独立性の保持に限定して規定している。", "a": false, "c": "R３⑪ウ／R７Ⅰ⑫ウ", "e": "倫理規則は，外観的独立性の保持のみならず，精神的独立性の保持についても規定している。"}, {"l": 249, "m": "倫理規則", "sb": "", "i": "B", "r": "", "q": "公認会計士は，監査業務から成功報酬を受け取ることはできないが，監査以外の保証業務からは成功報酬を受け取ることができる。", "a": false, "c": "H24Ⅰ①オ", "e": "監査業務であるか否かにかかわらず，成功報酬により保証業務の契約を締結することはできない。"}, {"l": 250, "m": "倫理規則", "sb": "", "i": "B", "r": "", "q": "監査人の独立性は，監査業務の主要な担当者の長期間の関与によって生じる馴れ合いによって阻害される可能性があり，それに対するセーフガードの例として，主要な担当者のローテーションやより深度のある監査業務の審査の実施が挙げられる。", "a": true, "c": "H30Ⅱ②ウ", "e": ""}]}, {"n": 11, "name": "監査の歴史", "qs": [{"l": 1, "m": "倫理規則", "sb": "", "i": "B", "r": "", "q": "我が国では，明治時代から株式会社が存在しており，株主総会に提出される財務書類については，今日の公認会計士に相当する計理士による監査が義務付けられていた。", "a": false, "c": "H23Ⅱ①エ", "e": "計理士による業務において，今日の公認会計士が実施しているような監査は行われていなかった。"}, {"l": 2, "m": "倫理規則", "sb": "", "i": "B", "r": "", "q": "会計に関する検査，調査，鑑定，証明，計算，整理又は立案を為すことを業とする計理士は，我が国最初の会計に関する法的資格であり，計理士法に基づくものであった。同法は，昭和２３年の公認会計士法により廃止されたが，計理士のうち希望する者は公認会計士の資格を無条件に与えられた。", "a": false, "c": "H28Ⅱ①ア", "e": "当時の計理士が公認会計士の資格を得るには，計理士のみを対象とした特別試験に合格する必要があった。"}, {"l": 3, "m": "倫理規則", "sb": "", "i": "B", "r": "", "q": "戦前にも，例えば商法上の監査役監査といった法定監査の制度が設けられていた。しかしながら，戦後，こうした旧来の制度とは別に，証券市場法制が整備される中で公認会計士監査制度が新設された。", "a": true, "c": "R６Ⅰ②ア", "e": "監査役制度は戦前から存在していた。なお，当該内容はレジュメには掲載していない。"}, {"l": 4, "m": "倫理規則", "sb": "", "i": "B", "r": "", "q": "証券取引法に監査の規定が導入されたことに対応して商法が改正され，上場会社においては公認会計士が会計監査を実施することとなったため，監査役の権限は業務監査に限定された。", "a": false, "c": "R４Ⅱ①ウ", "e": "昭和２５年の商法改正で，監査役の権限は一時的に会計監査に限定されたが，昭和４９年の商法改正で，再び監査役に業務監査権限が付与されることとなった。つまり，監査役の権限が業務監査に限定された歴史は存在しない。なお，当該内容はレジュメには掲載していない。"}, {"l": 5, "m": "倫理規則", "sb": "", "i": "B", "r": "", "q": "昭和２０年代には，証券取引法及び公認会計士法が成立し，施行されるとともに，企業会計原則が設定され，我が国における会計及び監査制度の基盤が整備された。また，公認会計士法に基づいて第１回の公認会計士試験が実施された。", "a": true, "c": "H29Ⅰ②ア", "e": ""}, {"l": 6, "m": "倫理規則", "sb": "", "i": "B", "r": "", "q": "第２次世界大戦後，証券取引法及び公認会計士法が成立し，施行されたことにより，１９５０年代に上場会社に対する公認会計士による我が国初めての監査が実施され，会計・監査制度が徐々に整備されていった。", "a": true, "c": "R６Ⅱ①ア", "e": ""}, {"l": 7, "m": "倫理規則", "sb": "", "i": "B", "r": "", "q": "公認会計士法制定後，初めての公認会計士試験が実施され，翌年には財務諸表の適正表示に関する意見を表明する正規の財務諸表監査が開始された。", "a": false, "c": "H28Ⅰ①ア", "e": "第１回公認会計士試験は，公認会計士法が制定された翌年昭和２４年に実施されたが，正規の財務諸表監査が開始されたのは昭和３２年である。"}, {"l": 8, "m": "倫理規則", "sb": "", "i": "B", "r": "", "q": "証券取引法に監査の規定が導入された当時の我が国の企業会計制度の実情においては，被監査会社の受入れ態勢が未整備であり，また，公認会計士の監査慣行が成熟していなかったため，正規の財務諸表監査を実施するまでに数年を要した。", "a": true, "c": "R４Ⅱ①イ／H23Ⅱ①オ", "e": "この数年の間（昭和２６年～昭和３０年）に，監査の範囲及び手続が漸次拡充されていった。"}, {"l": 9, "m": "倫理規則", "sb": "", "i": "B", "r": "", "q": "我が国では，第二次世界大戦後のいわゆる財閥解体によって株式が市場に放出されたことから，一般投資家を保護する必要性が生まれ，上場会社は，証券取引法に基づいて設置された証券取引委員会に対して監査済財務諸表の提出が求められることとなった。", "a": false, "c": "H23Ⅱ①イ", "e": "当時の監査済財務諸表の提出先は，大蔵大臣である。"}, {"l": 10, "m": "倫理規則", "sb": "", "i": "B", "r": "", "q": "我が国では，公認会計士による法定監査は，間接金融市場における銀行の信用調査制度を担う貸借対照表監査として開始された。", "a": false, "c": "H23Ⅱ①ウ", "e": "我が国の公認会計士による法定監査は，一般投資家の保護を目的として開始された。"}, {"l": 11, "m": "倫理規則", "sb": "", "i": "B", "r": "", "q": "１９６０年代に社会的影響の大きな粉飾決算事件が多発したことを受け，組織的な財務諸表監査の実施が求められたことから，公認会計士法が改正され，監査法人制度が新たに導入されるに至った。", "a": true, "c": "R６Ⅱ①イ／R４Ⅱ①エ／H29Ⅰ②イ／H28Ⅱ①イ", "e": "監査法人制度は，昭和４１年（１９６５年）の公認会計士法の改正時に創設されたものであるため，本肢は正しい。"}, {"l": 12, "m": "倫理規則", "sb": "", "i": "B", "r": "", "q": "昭和４０年代には，いわゆる粉飾決算事件が多発したことを受け，株式会社等の監査等に関する商法の特例に関する法律が成立し，施行され，同法で規定される大会社に対して会計監査人による監査が義務付けられた。", "a": true, "c": "H29Ⅰ②ウ／H28Ⅱ①ウ", "e": "なお，本肢の制度は，現在の会社法監査制度として引き継がれている。"}, {"l": 13, "m": "倫理規則", "sb": "", "i": "B", "r": "", "q": "現在，会社法上の大会社は，上場会社でなくとも公認会計士又は監査法人の監査を受けることが義務付けられている。この制度は，商法から会社の規定が分離して会社法が制定されたときに創設されたものである。", "a": false, "c": "R６Ⅰ②イ", "e": "上記の肢参照"}, {"l": 14, "m": "倫理規則", "sb": "", "i": "B", "r": "", "q": "昭和５０年代に公認会計士による中間財務諸表監査が開始された。当時設定された中間財務諸表監査基準において，監査人の意見表明は，中間財務諸表の「有用性」についてのものであり，その後の改訂を経て中間監査基準になっても，それが維持されて現在に至っている。", "a": true, "c": "H30Ⅱ①イ", "e": ""}, {"l": 15, "m": "倫理規則", "sb": "", "i": "B", "r": "", "q": "昭和５０年代に公認会計士による連結財務諸表の監査が開始された。その実施に伴い，個別財務諸表監査を前提とした従来の監査基準の実施基準及び報告基準について，連結財務諸表特有の監査手続や監査報告に関する規定が設けられる等，連結財務諸表監査に備えて見直され，その後の改訂を経て現在に至っている。", "a": false, "c": "H30Ⅱ①ウ", "e": "現在の監査基準には，連結財務諸表特有の監査手続や監査報告に関する規定は設けられていない。"}, {"l": 16, "m": "倫理規則", "sb": "", "i": "B", "r": "", "q": "我が国におけるバブル経済の崩壊後に発覚した粉飾決算について，監査人の責任問題に注目が集まったことを受け，監査人の責任を明確にするため，１９９０年代に有限責任監査法人の設立が認められることとなった。", "a": false, "c": "R６Ⅱ①ウ／H28Ⅱ①エ", "e": "有限責任監査法人制度は，監査法人の大規模化や業務の多様化等を背景に，平成１９年（２００７年）の公認会計士法の改正時に創設されたものである。"}, {"l": 17, "m": "倫理規則", "sb": "", "i": "B", "r": "", "q": "平成２０年代に金融商品取引法の施行を受けて，四半期報告制度が実施された。それに対応して，公認会計士による四半期レビューが開始され，四半期財務諸表の「適正性」について消極的形式による結論が表明されるようになり，その後の改訂を経て現在に至っている。", "a": true, "c": "H30Ⅱ①エ", "e": "なお，四半期報告制度（四半期財務諸表に対する四半期レビューの実施を含む）は，現在では廃止されている。"}, {"l": 18, "m": "倫理規則", "sb": "", "i": "B", "r": "", "q": "公認会計士監査の規範としての監査基準は，証券市場における適正なディスクロージャーを確保するための重要なインフラストラクチャーである。このため，我が国においては，証券取引法に監査の規定が導入されると同時に，監査基準が公表された。", "a": false, "c": "R４Ⅱ①ア", "e": "細かすぎる悪質な肢（次の肢も参照）。証券取引法に監査の規定が導入されたのは昭和２５年３月であるが，監査基準が公表されたのは同年７月であるため，同時ではない。"}, {"l": 19, "m": "倫理規則", "sb": "", "i": "B", "r": "", "q": "我が国では，公認会計士監査の規範としての監査基準及び監査実施準則は，証券取引法に監査の規定が導入されると同時に公表されたが，監査報告については具体的な規定をもたなかったため，正規の財務諸表監査が実施される際に，監査基準及び監査実施準則が改訂され，監査報告準則が新たに設定された。", "a": true, "c": "H23Ⅱ①ア", "e": "上の肢と矛盾する肢。この肢では，数ヶ月のズレを問題にせず「同時に」と表現している。いい加減にしてほしい。"}, {"l": 20, "m": "倫理規則", "sb": "", "i": "B", "r": "", "q": "監査基準の設定当初は，監査慣行が十分に確立していなかったことから，個々の財務諸表項目ごとに監査人が実施すべき監査手続が列挙されていたが，現在では，監査実施上の具体的な指針の策定は日本公認会計士協会に委ねられている。", "a": true, "c": "H25Ⅰ⑧エ", "e": ""}, {"l": 21, "m": "倫理規則", "sb": "", "i": "B", "r": "", "q": "昭和５０年代には，監査法人制度が社会制度として定着した一方で，監査基準を補足する具体的な指針を示す役割は日本公認会計士協会に委ねられることとなったため，監査実施準則及び監査報告準則が廃止された。", "a": false, "c": "H29Ⅰ②エ", "e": "監査基準を補足する具体的な指針を示す役割を日本公認会計士協会に委ねる方針が明示されたのは平成３年，監査実施準則及び監査報告準則が廃止されたのは平成１４年のことである。"}, {"l": 22, "m": "倫理規則", "sb": "", "i": "B", "r": "", "q": "監査実施準則及び監査報告準則は，それぞれ監査実施基準及び監査報告基準を補足することを目的として設定されていたが，その後，国際監査基準に関するクラリティ・プロジェクトが完了したことを受けて廃止された。", "a": false, "c": "H28Ⅱ⑪エ", "e": "国際監査基準のクラリティ・プロジェクトが完成したのは平成２１年であるが，各準則が廃止されたのは平成１４年である。"}, {"l": 23, "m": "倫理規則", "sb": "", "i": "B", "r": "", "q": "平成１４年の改訂では，監査の実施において他の監査人の監査の結果を利用した場合，監査報告書において他の監査人に依拠した範囲を記載することとした。その背景には，企業活動の国際化・多角化及び連結対象会社の増加による監査範囲の拡大に伴う，他の監査人の監査の結果を利用する範囲の拡大があった。", "a": false, "c": "H25Ⅱ⑦ア", "e": "原則として，監査報告書において他の監査人に依拠した範囲を記載することはなく，このことは従来から変わっていない。"}, {"l": 24, "m": "倫理規則", "sb": "", "i": "B", "r": "", "q": "平成１７年改訂では，特別な検討を必要とするリスクが財務諸表に重要な虚偽の表示をもたらしていないかどうかを確かめるため，実証手続の実施及び必要に応じて内部統制の整備状況の調査や運用状況の評価を求めることとした。", "a": true, "c": "R４Ⅱ⑪イ", "e": "「必要に応じて」の場所が現在の規定と違うが，平成１７改訂当時はこの場所だった。"}, {"l": 25, "m": "倫理規則", "sb": "", "i": "B", "r": "", "q": "平成１７年の改訂では，「財務諸表項目」及び「財務諸表全体」の二つのレベルでのリスクの評価の考え方を導入した。その背景には，それまでのリスク・アプローチが財務諸表全体におけるリスク評価に重点を置いており，財務諸表の個々の項目の詳細な検討が不十分になる傾向があった。", "a": false, "c": "H25Ⅱ⑦イ", "e": "二つのレベルでのリスク評価は，平成１７改訂前までのリスク・アプローチが財務諸表項目におけるリスク評価に重点を置いており，監査人が自らの視野を狭めている傾向にあったことを背景として導入されたものである。"}, {"l": 26, "m": "倫理規則", "sb": "", "i": "B", "r": "", "q": "平成１
