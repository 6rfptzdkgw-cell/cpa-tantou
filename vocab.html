<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="英単語チェック">
<title>公認会計士 短答式 英単語帳</title>
<style>
:root{
  --paper:#F4F5F1;
  --panel:#FFFFFF;
  --ink:#1B2229;
  --ink-2:#4A555F;
  --ink-3:#7E8A94;
  --rule:#D9DDD5;
  --rule-2:#E9ECE6;
  --red:#D62839;
  --red-soft:#FBE7E9;
  --blue:#1F5673;
  --ok:#2F7A4F;
  --warn:#B26A00;
  --shade:rgba(27,34,41,.06);
  --grid:rgba(31,86,115,.055);
  --radius:3px;
  --sans:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic Medium","Yu Gothic","Meiryo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Hiragino Mincho ProN","Yu Mincho",Georgia,serif;
}
[data-theme="dark"]{
  --paper:#14181C;
  --panel:#1B2126;
  --ink:#E7EAE5;
  --ink-2:#AEB8BF;
  --ink-3:#7A858D;
  --rule:#2C343A;
  --rule-2:#232A30;
  --red:#FF5C6B;
  --red-soft:#3A1E22;
  --blue:#7FB4D0;
  --ok:#6FC28E;
  --warn:#E0A14A;
  --shade:rgba(0,0,0,.3);
  --grid:rgba(127,180,208,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.6;
  -webkit-text-size-adjust:100%;
  padding-bottom:env(safe-area-inset-bottom);
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:0 14px}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:30;
  background:var(--paper);
  border-bottom:1px solid var(--rule);
}
.hd{display:flex;align-items:center;gap:10px;padding:10px 0 8px}
.brand{font-family:var(--serif);font-size:19px;letter-spacing:.01em;line-height:1.2}
.brand small{display:block;font-family:var(--sans);font-size:10.5px;color:var(--ink-3);letter-spacing:.14em}
.hd-sp{flex:1}
.iconbtn{width:38px;height:38px;border:1px solid var(--rule);border-radius:var(--radius);display:grid;place-items:center;font-size:15px;background:var(--panel)}
.iconbtn[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.tabs{display:flex;gap:0;border:1px solid var(--rule);border-bottom:none;background:var(--panel)}
.tabs button{flex:1;padding:9px 4px;font-size:13.5px;color:var(--ink-2);border-right:1px solid var(--rule);position:relative}
.tabs button:last-child{border-right:none}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:700;background:var(--paper)}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--red)}
.meter{height:3px;background:var(--rule-2);display:flex}
.meter i{display:block;height:100%}
.meter .m3{background:var(--ok)} .meter .m2{background:var(--warn)} .meter .m1{background:var(--red)}

/* ---------- filter bar ---------- */
.filters{padding:10px 0 6px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search{flex:1;min-width:180px;display:flex;align-items:center;gap:8px;border:1px solid var(--rule);background:var(--panel);padding:0 10px;border-radius:var(--radius)}
.search input{flex:1;border:none;background:none;padding:9px 0;outline:none;min-width:0}
select{border:1px solid var(--rule);background:var(--panel);padding:9px 8px;border-radius:var(--radius);max-width:100%}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--rule);background:var(--panel);padding:5px 11px;border-radius:99px;font-size:12.5px;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.count{font-size:12px;color:var(--ink-3);padding:4px 0 8px}

/* ---------- list ---------- */
.sec{margin:18px 0 6px;display:flex;align-items:baseline;gap:10px}
.sec h2{font-size:13px;margin:0;letter-spacing:.04em;font-weight:700}
.sec span{flex:1;border-bottom:1px dashed var(--rule)}
.sec b{font-size:11px;color:var(--ink-3);font-weight:400}
ol.list{list-style:none;margin:0;padding:0;background:var(--panel);border:1px solid var(--rule)}
li.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:0 12px;padding:9px 10px;border-bottom:1px solid var(--rule-2);align-items:start}
li.item:last-child{border-bottom:none}
.no{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums;padding-top:4px}
.en{font-family:var(--serif);font-size:17px;line-height:1.35;word-break:break-word}
.ja{font-size:14px;color:var(--ink-2);margin-top:2px}
.note{font-size:11.5px;color:var(--ink-3);margin-top:3px;white-space:pre-line;border-left:2px solid var(--rule);padding-left:7px}
.boxes{display:flex;gap:3px;padding-top:5px}
.bx{width:15px;height:15px;border:1px solid var(--ink-3);border-radius:1px;background:transparent;padding:0;flex:none}
.bx[aria-pressed="true"]{background:var(--red);border-color:var(--red);position:relative}
.bx[aria-pressed="true"]::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(42deg)}
.tools{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.spk{font-size:12px;color:var(--ink-3);padding:2px 4px}
.mark{font-size:10px;padding:1px 6px;border:1px solid var(--rule);border-radius:99px;color:var(--ink-3)}
.mark.s1{color:var(--red);border-color:var(--red)}
.mark.s2{color:var(--warn);border-color:var(--warn)}
.mark.s3{color:var(--ok);border-color:var(--ok)}

/* ---------- red sheet ---------- */
.hide .ja, .hide .note{position:relative;color:transparent}
.hide .ja::before,.hide .note::before{
  content:"";position:absolute;left:-2px;right:-2px;top:1px;bottom:1px;
  background:var(--red);opacity:.88;border-radius:1px;
}
.hide .note::before{left:5px}
.hide .revealed .ja,.hide .revealed .note{color:inherit}
.hide .revealed .ja::before,.hide .revealed .note::before{display:none}
li.item .ja,li.item .note{cursor:default}
.hide li.item{cursor:pointer}

/* ---------- card mode ---------- */
.card{
  background:var(--panel);border:1px solid var(--rule);
  box-shadow:0 1px 0 var(--shade);
  min-height:290px;display:flex;flex-direction:column;justify-content:center;
  padding:28px 22px;text-align:center;margin-top:14px;position:relative;
}
.card .tag{position:absolute;top:10px;left:12px;font-size:11px;color:var(--ink-3)}
.card .idx{position:absolute;top:10px;right:12px;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.card .front{font-family:var(--serif);font-size:clamp(26px,7vw,40px);line-height:1.25;word-break:break-word}
.card .back{margin-top:16px;padding-top:16px;border-top:1px solid var(--rule-2)}
.card .back .b-ja{font-size:clamp(18px,4.6vw,23px);font-weight:700}
.card .back .b-note{font-size:13px;color:var(--ink-2);margin-top:8px;white-space:pre-line;text-align:left;display:inline-block;border-left:2px solid var(--red);padding-left:10px}
.veil{color:var(--ink-3);font-size:13px;margin-top:18px}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.grade button{border:1px solid var(--rule);background:var(--panel);padding:13px 4px;border-radius:var(--radius);font-size:14px}
.grade button b{display:block;font-size:11px;font-weight:400;color:var(--ink-3);margin-top:2px}
.g1{color:var(--red)} .g2{color:var(--warn)} .g3{color:var(--ok)}
.navrow{display:flex;gap:8px;margin-top:10px}
.navrow button{flex:1;border:1px solid var(--rule);background:var(--panel);padding:11px;border-radius:var(--radius);font-size:14px}
.btn-main{background:var(--ink)!important;color:var(--paper)!important;border-color:var(--ink)!important}

/* ---------- quiz ---------- */
.q-head{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3);margin-top:14px}
.q-stem{background:var(--panel);border:1px solid var(--rule);padding:26px 18px;text-align:center;margin-top:6px}
.q-stem .qt{font-family:var(--serif);font-size:clamp(22px,6vw,32px);line-height:1.3;word-break:break-word}
.q-stem .qt.jp{font-family:var(--sans);font-weight:700;font-size:clamp(19px,5vw,26px)}
.opts{display:grid;gap:8px;margin-top:10px}
.opt{text-align:left;border:1px solid var(--rule);background:var(--panel);padding:13px 14px;border-radius:var(--radius);font-size:15px;display:flex;gap:10px;align-items:flex-start}
.opt em{font-style:normal;color:var(--ink-3);font-size:12px;padding-top:2px;flex:none}
.opt.correct{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--panel))}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt:disabled{cursor:default}
.q-result{margin-top:12px;background:var(--panel);border:1px solid var(--rule);padding:14px}
.q-result .r-ja{font-weight:700}
.q-result .r-note{font-size:12.5px;color:var(--ink-2);white-space:pre-line;margin-top:6px}
.score{text-align:center;padding:40px 16px;background:var(--panel);border:1px solid var(--rule);margin-top:14px}
.score .big{font-family:var(--serif);font-size:52px;line-height:1}

/* ---------- stats ---------- */
.stat-card{background:var(--panel);border:1px solid var(--rule);padding:14px;margin-top:12px}
.stat-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--rule-2)}
.stat-row:last-child{border-bottom:none}
.stat-row .nm{width:98px;font-size:12.5px;flex:none}
.bar{flex:1;height:9px;background:var(--rule-2);display:flex;overflow:hidden}
.bar i{height:100%}
.pc{width:52px;text-align:right;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;flex:none}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--ink-3);margin-top:10px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;margin-right:5px;vertical-align:-1px}
.lg3::before{background:var(--ok)} .lg2::before{background:var(--warn)} .lg1::before{background:var(--red)} .lg0::before{background:var(--rule-2)}
.mini{font-size:12.5px;color:var(--ink-2);line-height:1.75}
.act{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.act button{border:1px solid var(--rule);background:var(--panel);padding:9px 13px;border-radius:var(--radius);font-size:13px}
.act .danger{color:var(--red);border-color:var(--red)}
.empty{text-align:center;color:var(--ink-3);padding:48px 16px;font-size:14px}
.kbd{font-size:11.5px;color:var(--ink-3);margin-top:14px;line-height:1.9}
.kbd kbd{border:1px solid var(--rule);border-bottom-width:2px;border-radius:3px;padding:1px 5px;font-family:ui-monospace,monospace;font-size:11px}
footer{text-align:center;font-size:11px;color:var(--ink-3);padding:26px 0 34px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:99px;font-size:13px;z-index:60;opacity:0;pointer-events:none;transition:opacity .18s}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:520px){
  li.item{gap:0 9px;padding:8px}
  .bx{width:13px;height:13px}
  .bx[aria-pressed="true"]::after{left:3px;top:0;width:3px;height:7px}
  .en{font-size:16px}
}

.add-overlay{position:fixed;inset:0;background:rgba(20,20,20,.5);z-index:80;display:none;align-items:flex-end;justify-content:center}
.add-modal{background:var(--panel);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:14px 14px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));box-sizing:border-box}
.add-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.add-title{font-family:var(--serif);font-size:17px;font-weight:700}
.add-body{display:flex;flex-direction:column}
.flabel{font-size:11.5px;color:var(--ink-3);margin-top:12px;margin-bottom:4px;font-weight:700}
.add-body input,.add-body select,.add-body textarea{width:100%;border:1px solid var(--rule);background:var(--paper);color:var(--ink);padding:9px 10px;border-radius:var(--radius);font-size:14px;resize:vertical;font-family:inherit}
.add-foot{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:8px}
.add-foot .danger{color:var(--red);border:1px solid var(--red);background:none;padding:10px 14px;border-radius:var(--radius);font-size:13px}
.badge-custom{display:inline-block;font-size:10px;background:var(--blue);color:#fff;padding:1px 6px;border-radius:99px;margin-right:6px;vertical-align:middle}
.edit-btn{font-size:10px;margin-top:4px}
.stat-card input{width:100%;border:1px solid var(--rule);background:var(--paper);color:var(--ink);padding:9px 10px;border-radius:var(--radius);font-size:13px;margin-top:4px}
.toolsL{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.memo-box{margin-top:10px}

.memo-box label{font-size:11.5px;color:var(--ink-3);display:flex;align-items:center;gap:6px;margin-bottom:5px}
.memo-box textarea{width:100%;min-height:52px;border:1px solid var(--rule);background:var(--panel);color:var(--ink);padding:8px 10px;font-size:13px;border-radius:var(--radius);resize:vertical;font-family:inherit}
.memo-saved{font-size:10.5px;color:var(--ok);opacity:0;transition:opacity .3s}
.memo-saved.show{opacity:1}
.memo-preview{font-size:11.5px;color:var(--ink-3);margin-top:6px;white-space:pre-line;border-left:2px solid var(--blue);padding-left:7px;cursor:pointer}
.tools button[data-memo-toggle]{margin-top:10px}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="hd">
      <div class="brand">短答式 英単語帳<small>CPA ENGLISH TERMS ver.2</small></div>
      <div class="hd-sp"></div>
      <button class="iconbtn" id="btnAdd" title="単語を追加">＋</button>
      <button class="iconbtn" id="btnSheet" aria-pressed="false" title="赤シート（意味を隠す）">赤</button>
      <button class="iconbtn" id="btnTheme" title="表示切替">◐</button>

    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-view="list">一覧</button>
      <button role="tab" aria-selected="false" data-view="card">カード</button>
      <button role="tab" aria-selected="false" data-view="quiz">テスト</button>
      <button role="tab" aria-selected="false" data-view="stats">記録</button>
    </div>
  </div>
  <div class="meter" id="meter"></div>
</header>
<main class="wrap" id="app"></main>
<div class="add-overlay" id="addOverlay"></div>
<footer>収録 664 語／出典：CPA会計学院『短答式試験対策 英単語帳 ver.2』（2027年合格目標）</footer>

let WORDS=[];
let customWords=[];
const CKEY="cpa_tantou_vocab_custom_v1";
function loadCustomWords(){
  try{const r=localStorage.getItem(CKEY);customWords=r?JSON.parse(r):[];}catch(e){customWords=[];}
}
function saveCustomWords(){
  try{localStorage.setItem(CKEY,JSON.stringify(customWords));}catch(e){}
  touchUpdated();
}
function rebuildWords(){
  WORDS=[];
  DATA.forEach((ch,ci)=>{let n=0;ch.secs.forEach(sec=>{sec.w.forEach(w=>{n++;
    WORDS.push({id:ci+"-"+n,ci,ch:ch.c,sec:sec.s,no:n,en:w[0],ja:w[1],note:w[2]||"",custom:false});
  });});});
  customWords.forEach((w,i)=>{
    const ch=DATA[w.ci];
    WORDS.push({id:w.id,ci:w.ci,ch:ch?ch.c:"追加した単語",sec:w.sec||"自分で追加した単語",
      no:i+1,en:w.en,ja:w.ja,note:w.note||"",custom:true});
  });
}

/* ---------- CLOUD SYNC (optional, Firebase Realtime Database via REST) ---------- */
const SUBJECT_KEY='vocab';
const LS_UPDATED_KEY=KEY+"_updated_v1";
const SYNC_URL_KEY='qsync_dburl_v1';
const SYNC_CODE_KEY='qsync_code_v1';
let localUpdatedAt=0;
try{ const u=localStorage.getItem(LS_UPDATED_KEY); localUpdatedAt = u? (parseInt(u,10)||0) : 0; }catch(e){ localUpdatedAt=0; }
let cloudPushTimer=null;
function touchUpdated(){
  localUpdatedAt=Date.now();
  try{ localStorage.setItem(LS_UPDATED_KEY,String(localUpdatedAt)); }catch(e){}
  scheduleCloudPush();
}
function getSyncConfig(){
  let url='',code='';
  try{ url=(localStorage.getItem(SYNC_URL_KEY)||'').trim(); code=(localStorage.getItem(SYNC_CODE_KEY)||'').trim(); }catch(e){}
  if(!url||!code) return null;
  return {url,code};
}
function cloudPath(cfg){
  return cfg.url.replace(/\/+$/,'') + '/quizSync/' + encodeURIComponent(cfg.code) + '/' + SUBJECT_KEY + '.json';
}
function scheduleCloudPush(){
  const cfg=getSyncConfig(); if(!cfg) return;
  if(cloudPushTimer) clearTimeout(cloudPushTimer);
  cloudPushTimer=setTimeout(()=>{ pushToCloud(cfg); },1500);
}
async function pushToCloud(cfg){
  cfg = cfg||getSyncConfig(); if(!cfg) return false;
  try{
    await fetch(cloudPath(cfg), {
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({P,customWords,notes,updatedAt:localUpdatedAt})
    });
    return true;
  }catch(e){ return false; }
}
async function pullFromCloud(showToast){
  const cfg=getSyncConfig(); if(!cfg) return false;
  try{
    const res=await fetch(cloudPath(cfg));
    if(!res.ok) return false;
    const data=await res.json();
    if(!data || !data.updatedAt || data.updatedAt<=localUpdatedAt) return false;
    P=data.P||{};
    customWords=data.customWords||[];
    notes=data.notes||{};
    localUpdatedAt=data.updatedAt||0;
    try{
      localStorage.setItem(KEY,JSON.stringify(P));
      localStorage.setItem(CKEY,JSON.stringify(customWords));
      localStorage.setItem(NKEY,JSON.stringify(notes));
      localStorage.setItem(LS_UPDATED_KEY,String(localUpdatedAt));
    }catch(e){}
    rebuildWords();
    meter();
    if(S.view!=='quiz') render();
    if(showToast) toast('他の端末の学習記録を読み込みました');
    return true;
  }catch(e){ return false; }
}
function randomSyncCode(){
  const chars='abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  let s=''; for(let i=0;i<20;i++) s+=chars[Math.floor(Math.random()*chars.length)];
  return s;
}

  const lastSync = localUpdatedAt? new Date(localUpdatedAt).toLocaleString('ja-JP') : '未同期';
  return `<div class="mini">データベースURL：<code style="font-size:11px">${esc(url)}</code></div>
    <div class="flabel">同期コード（他の端末にも入力してください）</div>
    <input id="cloudCodeShow" readonly value="${esc(code)}" style="font-family:monospace;font-size:15px;letter-spacing:.05em">
    <div class="act">
      <button id="cloudCopyCode">コピー</button>
      <button id="cloudNowBtn">🔄 今すぐ同期</button>
    </div>
    <div class="mini" style="margin-top:8px">最終同期：${lastSync}</div>
    <div class="act" style="margin-top:12px"><button id="cloudUnlink" style="color:var(--red);border-color:var(--red)">この端末の同期を解除</button></div>`;
}
function bindSyncSettings(){
  const us=$('#cloudUrlSave');
  if(us) us.onclick=()=>{
    const v=$('#cloudUrlInput').value.trim();
    if(!v){ toast('URLを入力してください'); return; }

  };
  const ue=$('#cloudUrlEdit');
  if(ue) ue.onclick=()=>{
    if(confirm('データベースURLを変更しますか？（同期コードも解除されます）')){
      try{ localStorage.removeItem(SYNC_URL_KEY); localStorage.removeItem(SYNC_CODE_KEY); }catch(e){}
      renderSyncSettings();
    }
  };
  const gen=$('#cloudGenBtn');
  if(gen) gen.onclick=async()=>{
    const code=randomSyncCode();
    try{ localStorage.setItem(SYNC_CODE_KEY,code); }catch(e){}

  const jo=$('#cloudJoinBtn');

  };
  const nb=$('#cloudNowBtn');
  if(nb) nb.onclick=async()=>{
    await pushToCloud();
    await pullFromCloud(true);

  const ul=$('#cloudUnlink');
  if(ul) ul.onclick=()=>{
    if(confirm('この端末の同期を解除しますか？（データは削除されません）')){

const S={
  view:"list", ch:"all", sec:"all", status:"all", q:"",
  sheet:false, dir:"en", shuffle:false,
  ci:0, flipped:false, order:[],
  quiz:null
};


/* ====================== HELPERS ====================== */
const $=s=>document.querySelector(s);
const app=$("#app");
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("on"),1500);}
function filtered(){
  const q=S.q.trim().toLowerCase();
  return WORDS.filter(w=>{
    if(S.ch!=="all"&&w.ci!==+S.ch)return false;
    if(S.sec!=="all"&&w.sec!==S.sec)return false;
    const st=(P[w.id]||{}).s||0;
    if(S.status==="new"&&st!==0)return false;
    if(S.status==="1"&&st!==1)return false;
    if(S.status==="2"&&st!==2)return false;
    if(S.status==="3"&&st!==3)return false;
    if(S.status==="todo"&&st===3)return false;
    if(q&&!(w.en.toLowerCase().includes(q)||w.ja.includes(S.q.trim())||w.note.toLowerCase().includes(q)))return false;
    return true;
  });
}
function speak(t){
  if(!window.speechSynthesis)return toast("この環境では読み上げできません");
  const u=new SpeechSynthesisUtterance(t.replace(/\(.*?\)|\/.*$/g,"").trim()||t);
  u.lang="en-US";u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u);
}
function counts(list){const c=[0,0,0,0];list.forEach(w=>c[(P[w.id]||{}).s||0]++);return c;}
function meter(){
  const c=counts(WORDS),t=WORDS.length;
  $("#meter").innerHTML=[3,2,1].map(k=>`<i class="m${k}" style="width:${c[k]/t*100}%"></i>`).join("");
}
function shuffled(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ====================== SHARED CONTROLS ====================== */

function itemHTML(w){

function listBodyHTML(){
  const list=filtered();
  if(!list.length)return `<div class="empty">条件に合う語がありません。<br>検索語や絞り込みを変えてください。</div>`;
  let out="",cur="";
  list.forEach(w=>{
    if(w.sec+w.ch!==cur){
      if(cur)out+="</ol>";
      cur=w.sec+w.ch;
      const n=list.filter(x=>x.sec+x.ch===cur).length;
      out+=`<div class="sec"><h2>${esc(w.ch)}／${esc(w.sec)}</h2><span></span><b>${n}語</b></div><ol class="list">`;
    }
    out+=itemHTML(w);
  });
  return out+"</ol>";
}
function renderListBody(){
  const c=$("#listBody");if(!c)return;
  c.innerHTML=listBodyHTML();
  bindList();
  $("#cnt").textContent=`${filtered().length} 語を表示中`;
}
function bindList(){
  document.querySelectorAll("#listBody .item").forEach(li=>{
    li.addEventListener("click",e=>{
      const id=li.dataset.id;
      const ed=e.target.closest("[data-edit]");
      if(ed){openAddForm(ed.dataset.edit);return;}
      const mt=e.target.closest("[data-memo-toggle]");
      if(mt){ if(expandedMemos.has(id))expandedMemos.delete(id); else expandedMemos.add(id);
        renderListBody(); return; }
      const cy=e.target.closest("[data-cycle]");
      if(cy){ const r=rec(id); r.s=(r.s+1)%4; save(); meter();
        const lab=["未","苦手","あいまい","覚えた"][r.s];
        cy.className="mark"+(r.s?" s"+r.s:""); cy.textContent=lab; return; }
      if(e.target.closest("[data-spk]")){speak(WORDS.find(w=>w.id===id).en);return;}
      if(S.sheet)li.classList.toggle("revealed");
    });
    const mi=li.querySelector("[data-memo-input]");
    if(mi) mi.oninput=e=>scheduleSaveNote(mi.dataset.memoInput,e.target.value);
  });
}

  <div class="navrow">

  </div>

function grade(g){

/* ====================== QUIZ ====================== */
function startQuiz(){
  const pool=filtered();
  if(pool.length<4){app.innerHTML=controls()+`<div class="empty">テストには4語以上必要です。絞り込みを緩めてください。</div>`;bindControls();return;}
  const n=Math.min(10,pool.length);
  const qs=shuffled(pool).slice(0,n).map(w=>({...w,_userAns:null,_opts:null}));
  S.quiz={qs,i:0,pool};
  render();
}
function viewQuiz(){
  if(!S.quiz){
    const pool=filtered();
    app.innerHTML=controls()+`<div class="stat-card">
      <div class="mini">絞り込んだ <b>${pool.length}</b> 語から最大10問を4択で出題します。<br>出題方向は「${S.dir==="en"?"英語 → 日本語":"日本語 → 英語"}」です。</div>
      <div class="act">
        <button id="dir3">出題方向を切り替える</button>
        <button class="btn-main" id="go" style="border:1px solid var(--ink)">テストを始める</button>
      </div></div>`;
    bindControls();
    $("#dir3").onclick=()=>{S.dir=S.dir==="en"?"ja":"en";render();};
    $("#go").onclick=startQuiz;return;
  }
  const Q=S.quiz;
  if(Q.i>=Q.qs.length){
    const answered=Q.qs.filter(q=>q._userAns!==null);
    const ok=answered.filter(q=>q._userAns===q.id).length;
    const skipped=Q.qs.length-answered.length;
    const pc=answered.length?Math.round(ok/answered.length*100):0;
    app.innerHTML=`<div class="score">
      <div class="big">${ok} <span style="font-size:22px;color:var(--ink-3)">/ ${answered.length}</span></div>
      <div class="mini" style="margin-top:10px">正答率 ${pc}％${skipped?"　（未回答 "+skipped+"問）":""}</div>
      <div class="act" style="justify-content:center">
        <button id="navBack" style="border:1px solid var(--rule)">‹ 最後の問題に戻る</button>
        <button class="btn-main" id="again" style="border:1px solid var(--ink)">もう一度</button>
        <button id="toList">一覧に戻る</button>
      </div></div>`;
    $("#navBack").onclick=()=>{Q.i=Q.qs.length-1;render();};
    $("#again").onclick=()=>{S.quiz=null;startQuiz();};
    $("#toList").onclick=()=>{S.quiz=null;setView("list");};
    return;
  }
  const w=Q.qs[Q.i];
  if(!w._opts){
    const same=WORDS.filter(x=>x.ci===w.ci&&x.id!==w.id&&x.ja!==w.ja);
    const src=same.length>=3?same:WORDS.filter(x=>x.id!==w.id);
    w._opts=shuffled([w,...shuffled(src).slice(0,3)]);
  }
  const key=S.dir==="en"?"ja":"en";
  const hasMemo=notes[w.id]&&notes[w.id].trim();
  app.innerHTML=`<div class="q-head"><span>第 ${Q.i+1} 問 / ${Q.qs.length}</span><span>${Q.qs.filter(q=>q._userAns!==null&&q._userAns===q.id).length} 問正解</span></div>
  <div class="q-stem"><div class="qt ${S.dir==="en"?"":"jp"}">${esc(S.dir==="en"?w.en:w.ja)}</div></div>
  <div class="opts">${w._opts.map((o,i)=>{
    let cls="";
    if(w._userAns!==null){ if(o.id===w.id)cls="correct"; else if(o.id===w._userAns)cls="wrong"; }
    return `<button class="opt ${cls}" data-id="${o.id}" ${w._userAns!==null?"disabled":""}><em>${i+1}</em><span>${esc(o[key])}</span></button>`;
  }).join("")}</div>
  ${w._userAns!==null?`<div class="q-result">
      <div class="r-ja">${esc(w.en)} — ${esc(w.ja)}</div>
      ${w.note?`<div class="r-note">${esc(w.note)}</div>`:""}
      <div class="r-note">${esc(w.ch)}／${esc(w.sec)}</div>
    </div>
    <div class="memo-box">
      <label>📝 メモ <span class="memo-saved" data-memo-saved="${w.id}">保存しました</span></label>
      <textarea data-memo-input="${w.id}" placeholder="覚え方やひっかけポイントなど">${esc(notes[w.id]||"")}</textarea>
    </div>`:""}
  <div class="navrow">
    <button id="navPrev" ${Q.i===0?"disabled":""}>‹ 前の問題</button>
    <button id="navNext">${Q.i===Q.qs.length-1?"結果を見る ›":"次の問題 ›"}</button>
  </div>`;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    if(w._userAns!==null)return;
    w._userAns=b.dataset.id;
    const right=w._userAns===w.id;
    const r=rec(w.id);
    r.s=right?(r.s===3?3:Math.max(r.s,2)):1;
    save();meter();render();
  });
  const mi=$("[data-memo-input]");if(mi)mi.oninput=e=>scheduleSaveNote(w.id,e.target.value);
  $("#navPrev").onclick=()=>{ if(Q.i>0){Q.i--;render();} };
  $("#navNext").onclick=()=>{ Q.i++; render(); };
}

/* ====================== STATS ====================== */
function viewStats(){
  const rows=DATA.map((ch,i)=>{
    const list=WORDS.filter(w=>w.ci===i),c=counts(list),t=list.length;
    return `<div class="stat-row"><div class="nm">${esc(ch.c)}</div>
      <div class="bar">${[3,2,1].map(k=>`<i class="m${k}" style="width:${c[k]/t*100}%;background:var(--${k===3?"ok":k===2?"warn":"red"})"></i>`).join("")}</div>
      <div class="pc">${Math.round(c[3]/t*100)}%</div></div>`;
  }).join("");
  const c=counts(WORDS),t=WORDS.length;
  app.innerHTML=`<div class="stat-card">
    <div class="mini">覚えた <b>${c[3]}</b> ／ あいまい <b>${c[2]}</b> ／ 苦手 <b>${c[1]}</b> ／ 未学習 <b>${c[0]}</b>（全 ${t} 語）</div>
    <div style="height:10px"></div>
    ${rows}
    <div class="legend"><span class="lg3">覚えた</span><span class="lg2">あいまい</span><span class="lg1">苦手</span><span class="lg0">未学習</span></div>
  </div>
  <div class="stat-card">
    <div class="mini">📶 複数端末で自動的に同期する（Firebase・初回のみ設定）</div>
    <div id="cloudSyncBox" style="margin-top:10px"></div>
  </div>
  <div class="stat-card">
    <div class="mini">学習の記録はこの端末のブラウザだけに保存されます。上の自動同期を使わない場合は、「記録を表示」でテキストを画面に出し，コピーしてメモアプリ等に保管してください。</div>
    <div class="act">
      <button id="ex">記録を表示してコピーする</button>
      <button id="im">記録を読み込む</button>
      <button class="danger" id="rs">記録を消す</button>
    </div>
    <div id="exportFallback" style="display:none;margin-top:10px">
      <div class="mini">下のテキストを全選択してコピーし，メモアプリ等に貼り付けて保管してください。復元するときは，保管しておいたテキストをこの欄に貼り付けて「このテキストから復元」を押します。</div>
      <textarea id="exportText" rows="4" style="width:100%;margin-top:6px;font-size:11px;border:1px solid var(--rule);background:var(--panel);color:var(--ink);padding:6px;border-radius:var(--radius)" onclick="this.select()"></textarea>
      <div class="act">
        <button id="copyText">コピー</button>
        <button id="restoreText">このテキストから復元</button>
      </div>
    </div>
  </div>
  <div class="stat-card">
    <div class="mini"><b>使い方</b><br>
    ・赤シート：右上の「赤」で意味を隠し，語をタップで一時表示<br>
    ・□□□：周回チェック。1周目・2周目・3周目に印を付ける<br>
    ・カード：○△✕で評価すると「未修得のみ」で絞り込めます<br>
    ・テスト：絞り込んだ範囲から4択で10問</div>
  </div>`;
  $("#ex").onclick=()=>{
    showExportFallback(JSON.stringify(P));
  };
  function showExportFallback(dataStr){
    const box=$("#exportFallback");
    box.style.display="block";
    box.querySelector("textarea").value=dataStr;
    box.querySelector("textarea").select();
    toast("下のテキストを全選択してコピーしてください");
  }
  $("#im").onclick=()=>{
    const inp=document.createElement("input");inp.type="file";inp.accept="application/json";
    inp.onchange=()=>{const f=inp.files[0];if(!f)return;const rd=new FileReader();
      rd.onload=()=>{try{P=JSON.parse(rd.result);save();meter();render();toast("読み込みました");}
      catch(e){toast("このファイルは読み込めません");}};rd.readAsText(f);};
    inp.click();
  };
  $("#rs").onclick=()=>{if(confirm("すべての学習記録を消します。よろしいですか。")){P={};save();meter();render();toast("記録を消しました");}};
  const cpBtn=$("#copyText");if(cpBtn)cpBtn.onclick=async()=>{
    const ta=$("#exportText");ta.select();
    try{await navigator.clipboard.writeText(ta.value);toast("コピーしました");}
    catch(e){document.execCommand("copy");toast("コピーしました");}
  };
  const rsBtn=$("#restoreText");if(rsBtn)rsBtn.onclick=()=>{
    try{P=JSON.parse($("#exportText").value);save();meter();render();toast("読み込みました");}
    catch(e){toast("このテキストは読み込めません");}
  };
  renderSyncSettings();
}

/* ====================== ROUTER ====================== */
function render(){
  document.body.classList.toggle("hide",S.sheet&&S.view==="list");
  ({list:viewList,card:viewCard,quiz:viewQuiz,stats:viewStats})[S.view]();
  meter();
}
function setView(v){
  S.view=v;S.flipped=false;
  if(v!=="quiz")S.quiz=null;
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute("aria-selected",b.dataset.view===v));
  window.scrollTo(0,0);render();
}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>setView(b.dataset.view));
$("#btnSheet").onclick=()=>{S.sheet=!S.sheet;$("#btnSheet").setAttribute("aria-pressed",S.sheet);
  render();
  toast(S.sheet?"赤シートをかけました（一覧の意味が隠れます）":"赤シートを外しました");};
$("#btnTheme").onclick=()=>{
  const d=document.documentElement.dataset.theme==="dark"?"light":"dark";
  document.documentElement.dataset.theme=d;
  try{localStorage.setItem("theme_v1",d)}catch(e){}
};
$("#btnAdd").onclick=()=>openAddForm(null);
document.addEventListener("keydown",e=>{
  if(e.target.matches("input,select,textarea"))return;
  if(S.view==="card"){
    if(e.key===" "){e.preventDefault();S.flipped=!S.flipped;render();}
    if(e.key==="ArrowRight"){const d=deck();S.ci=(S.ci+1)%d.length;S.flipped=false;render();}
    if(e.key==="ArrowLeft"){const d=deck();S.ci=(S.ci-1+d.length)%d.length;S.flipped=false;render();}
    if("123".includes(e.key)&&S.flipped)grade(+e.key);
  }
  if(S.view==="quiz"&&S.quiz&&S.quiz.ans===null&&"1234".includes(e.key)){
    const b=document.querySelectorAll(".opt")[+e.key-1];if(b)b.click();
  }
  if(S.view==="quiz"&&S.quiz&&S.quiz.ans!==null&&e.key==="Enter"){const n=$("#nextq");if(n)n.click();}
});
render();
pullFromCloud(true);
</script>
</body>
</html>
