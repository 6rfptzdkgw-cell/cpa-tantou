<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="utf-8">
<script>try{var __t=localStorage.getItem('theme_v1'); if(__t) document.documentElement.dataset.theme=__t;}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="財務理論チェック">
<title>折原レジュメ スマコアplus</title>
<style>
:root{
  --paper:#F4F5F1;
  --panel:#FFFFFF;
  --ink:#1B2229;
  --ink-2:#4A555F;
  --ink-3:#7E8A94;
  --rule:#D9DDD5;
  --rule-2:#E9ECE6;
  --red:#D62839;
  --red-soft:#FBE7E9;
  --blue:#1F5673;
  --ok:#2F7A4F;
  --ok-soft:#E5F1E9;
  --warn:#B26A00;
  --sheet:#8A4B12;
  --warn-soft:#FBEEDD;
  --shade:rgba(27,34,41,.06);
  --grid:rgba(31,86,115,.055);
  --radius:3px;
  --sans:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic Medium","Yu Gothic","Meiryo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Hiragino Mincho ProN","Yu Mincho",Georgia,serif;
}
[data-theme="dark"]{
  --paper:#14181C;
  --panel:#1B2126;
  --ink:#E7EAE5;
  --ink-2:#AEB8BF;
  --ink-3:#7A858D;
  --rule:#2C343A;
  --rule-2:#232A30;
  --red:#FF5C6B;
  --red-soft:#3A1E22;
  --blue:#7FB4D0;
  --ok:#6FC28E;
  --ok-soft:#1E2E24;
  --warn:#E0A14A;
  --sheet:#C97A2E;
  --warn-soft:#332616;
  --shade:rgba(0,0,0,.3);
  --grid:rgba(127,180,208,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.6;
  -webkit-text-size-adjust:100%;
  padding-bottom:env(safe-area-inset-bottom);
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:0 14px}

header{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid var(--rule)}
.hd{display:flex;align-items:center;gap:10px;padding:10px 0 8px}
.brand{font-family:var(--serif);font-size:19px;letter-spacing:.01em;line-height:1.2}
.brand small{display:block;font-family:var(--sans);font-size:10.5px;color:var(--ink-3);letter-spacing:.1em}
.hd-sp{flex:1}
.iconbtn{width:38px;height:38px;border:1px solid var(--rule);border-radius:var(--radius);display:grid;place-items:center;font-size:15px;background:var(--panel)}
.iconbtn[aria-pressed="true"]{background:var(--sheet);border-color:var(--sheet);color:#fff}
.tabs{display:flex;gap:0;border:1px solid var(--rule);border-bottom:none;background:var(--panel)}
.tabs button{flex:1;padding:9px 4px;font-size:13.5px;color:var(--ink-2);border-right:1px solid var(--rule);position:relative}
.tabs button:last-child{border-right:none}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:700;background:var(--paper)}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--red)}
.meter{height:3px;background:var(--rule-2);display:flex}
.meter i{display:block;height:100%}
.meter .m3{background:var(--ok)} .meter .m2{background:var(--warn)} .meter .m1{background:var(--red)}

.filters{padding:10px 0 6px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search{flex:1;min-width:180px;display:flex;align-items:center;gap:8px;border:1px solid var(--rule);background:var(--panel);padding:0 10px;border-radius:var(--radius)}
.search input{flex:1;border:none;background:none;padding:9px 0;outline:none;min-width:0}
select{border:1px solid var(--rule);background:var(--panel);padding:9px 8px;border-radius:var(--radius);max-width:100%}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--rule);background:var(--panel);padding:5px 11px;border-radius:99px;font-size:12.5px;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.count{font-size:12px;color:var(--ink-3);padding:4px 0 8px}

.chsel-head{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding:0 2px}
.chsel-head .lbl{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.chsel-head .links button{font-size:11.5px;color:var(--blue);text-decoration:underline;font-weight:400;margin-left:10px}
.chapter-list{background:var(--panel);border:1px solid var(--rule);margin-top:6px}
.chapter-row{display:flex;align-items:center;gap:10px;padding:10px 10px;border-bottom:1px solid var(--rule-2);cursor:pointer}
.chapter-row:last-child{border-bottom:none}
.chapter-row:active{background:var(--shade)}
.chapter-row .check{width:20px;height:20px;border-radius:4px;border:2px solid var(--ink-3);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
.chapter-row.checked{background:color-mix(in srgb, var(--blue) 7%, var(--panel))}
.chapter-row.checked .check{background:var(--blue);border-color:var(--blue)}
.chapter-row .cname{flex:1;font-size:13.5px;color:var(--ink-3)}
.chapter-row.checked .cname{color:var(--ink);font-weight:700}
.chapter-row .ccnt{font-size:11.5px;color:var(--ink-3);flex-shrink:0}
.chapter-row .caret{font-size:11px;color:var(--blue);margin-left:8px;flex-shrink:0;padding:4px 2px}
.major-list{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px 10px 40px;background:var(--rule-2);border-bottom:1px solid var(--rule-2)}
.major-chip{font-size:12px;padding:5px 10px;border-radius:99px;border:1px solid var(--rule);background:var(--panel);color:var(--ink-3);cursor:pointer;white-space:nowrap}
.major-chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.major-chip .mcnt{opacity:.7;font-size:10.5px}
.imp-row{display:flex;gap:8px;margin-top:6px}
.imp-box{flex:1;border:1px solid var(--rule);background:var(--panel);border-radius:var(--radius);padding:10px 8px;text-align:center;cursor:pointer}
.imp-box .check{width:20px;height:20px;border-radius:4px;border:2px solid var(--ink-3);margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
.imp-box.checked{background:color-mix(in srgb, var(--blue) 7%, var(--panel));border-color:var(--blue)}
.imp-box.checked .check{background:var(--blue);border-color:var(--blue)}
.imp-box .ilabel{font-size:13px;color:var(--ink-3)}
.imp-box.checked .ilabel{color:var(--ink);font-weight:700}
.imp-box .icnt{font-size:11px;color:var(--ink-3);margin-top:2px}

.sec{margin:18px 0 6px;display:flex;align-items:baseline;gap:10px}
.sec h2{font-size:13px;margin:0;letter-spacing:.03em;font-weight:700}
.sec span{flex:1;border-bottom:1px dashed var(--rule)}
.sec b{font-size:11px;color:var(--ink-3);font-weight:400}
ol.list{list-style:none;margin:0;padding:0;background:var(--panel);border:1px solid var(--rule)}
li.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:0 12px;padding:9px 10px;border-bottom:1px solid var(--rule-2);align-items:start}
li.item:last-child{border-bottom:none}
.no{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums;padding-top:4px;text-align:center}
.en{font-family:var(--serif);font-size:16px;line-height:1.5;word-break:break-word}
.ja{font-size:13.5px;color:var(--ink-2);margin-top:5px;font-weight:700}
.note{font-size:12px;color:var(--ink-3);margin-top:4px;white-space:pre-line;border-left:2px solid var(--rule);padding-left:7px;line-height:1.7}
.memoline{font-size:11.5px;color:var(--warn);margin-top:5px}
.tools{display:flex;flex-direction:column;align-items:center;gap:6px}
.mark{font-size:10px;padding:3px 7px;border:1px solid var(--rule);border-radius:99px;color:var(--ink-3);white-space:nowrap}
.mark.warn{color:var(--warn);border-color:var(--warn);background:var(--warn-soft)}
.mark.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.memo-dot{font-size:12px}

.hide .ja, .hide .note{position:relative;color:transparent}
.hide .ja::before,.hide .note::before{content:"";position:absolute;left:-2px;right:-2px;top:1px;bottom:1px;background:var(--sheet);opacity:.9;border-radius:1px}
.hide .note::before{left:5px}
.hide .revealed .ja,.hide .revealed .note{color:inherit}
.hide .revealed .ja::before,.hide .revealed .note::before{display:none}
.hide li.item{cursor:pointer}

.q-head{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3);margin-top:14px}
.q-stem{background:var(--panel);border:1px solid var(--rule);padding:26px 18px;text-align:left;margin-top:6px}
.q-stem .qt{font-family:var(--serif);font-size:clamp(17px,4.6vw,21px);line-height:1.7;word-break:break-word}
.q-stem .refs{font-size:11px;color:var(--ink-3);margin-top:10px;text-align:right}
.oxbtns{display:flex;gap:10px;margin-top:12px}
.oxbtn{flex:1;aspect-ratio:2;border-radius:var(--radius);border:2px solid var(--rule);background:var(--panel);font-size:34px;font-weight:700;font-family:var(--serif)}
.oxbtn.maru{color:var(--ok)}
.oxbtn.batsu{color:var(--red)}
.result-banner{border-radius:var(--radius);padding:14px 16px;margin-top:12px;display:flex;align-items:center;gap:12px;border:1px solid var(--rule)}
.result-banner.ok{background:var(--ok-soft);border-color:var(--ok)}
.result-banner.ng{background:var(--red-soft);border-color:var(--red)}
.result-banner .rmark{font-size:26px;font-family:var(--serif);font-weight:700}
.result-banner.ok .rmark{color:var(--ok)}
.result-banner.ng .rmark{color:var(--red)}
.result-banner .rtxt{font-size:13.5px;font-weight:700}
.q-result{margin-top:10px;background:var(--panel);border:1px solid var(--rule);padding:14px}
.q-result .r-cite{font-size:12px;font-weight:700;color:var(--warn);margin-bottom:6px}
.q-result .r-note{font-size:13px;color:var(--ink);white-space:pre-line;line-height:1.75}
.memo-box{margin-top:12px}
.memo-box label{font-size:11.5px;color:var(--ink-3);display:flex;align-items:center;gap:6px;margin-bottom:5px}
.memo-box textarea{width:100%;min-height:52px;border:1px solid var(--rule);background:var(--panel);padding:8px 10px;font-size:13px;border-radius:var(--radius);resize:vertical}
.memo-saved{font-size:10.5px;color:var(--ok);opacity:0;transition:opacity .3s}
.memo-saved.show{opacity:1}
.grade{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.grade button{border:1px solid var(--rule);background:var(--panel);padding:13px 4px;border-radius:var(--radius);font-size:14px}
.grade button b{display:block;font-size:11px;font-weight:400;color:var(--ink-3);margin-top:2px}
.g2{color:var(--warn)} .g3{color:var(--ok)}
.navrow{display:flex;gap:8px;margin-top:10px}
.navrow button{flex:1;border:1px solid var(--rule);background:var(--panel);padding:11px;border-radius:var(--radius);font-size:14px}
.btn-main{background:var(--ink)!important;color:var(--paper)!important;border-color:var(--ink)!important}
.score{text-align:center;padding:40px 16px;background:var(--panel);border:1px solid var(--rule);margin-top:14px}
.score .big{font-family:var(--serif);font-size:52px;line-height:1}

.stat-card{background:var(--panel);border:1px solid var(--rule);padding:14px;margin-top:12px}
.stat-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--rule-2)}
.stat-row:last-child{border-bottom:none}
.stat-row .nm{width:110px;font-size:12px;flex:none}
.bar{flex:1;height:9px;background:var(--rule-2);display:flex;overflow:hidden}
.bar i{height:100%}
.pc{width:52px;text-align:right;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;flex:none}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--ink-3);margin-top:10px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;margin-right:5px;vertical-align:-1px}
.lg3::before{background:var(--ok)} .lg2::before{background:var(--warn)} .lg0::before{background:var(--rule-2)}
.mini{font-size:12.5px;color:var(--ink-2);line-height:1.75}
.act{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.act button{border:1px solid var(--rule);background:var(--panel);padding:9px 13px;border-radius:var(--radius);font-size:13px}
.act .danger{color:var(--red);border-color:var(--red)}
.empty{text-align:center;color:var(--ink-3);padding:48px 16px;font-size:14px}
footer{text-align:center;font-size:11px;color:var(--ink-3);padding:26px 0 34px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:99px;font-size:13px;z-index:60;opacity:0;pointer-events:none;transition:opacity .18s}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:520px){
  li.item{gap:0 9px;padding:8px}
  .en{font-size:15px}
}

.add-overlay{position:fixed;inset:0;background:rgba(20,20,20,.5);z-index:80;display:none;align-items:flex-end;justify-content:center}
.add-modal{background:var(--panel);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:14px 14px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));box-sizing:border-box}
.add-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.add-title{font-family:var(--serif);font-size:17px;font-weight:700}
.add-body{display:flex;flex-direction:column}
.flabel{font-size:11.5px;color:var(--ink-3);margin-top:12px;margin-bottom:4px;font-weight:700}
.add-body input,.add-body select,.add-body textarea{width:100%;border:1px solid var(--rule);background:var(--paper);color:var(--ink);padding:9px 10px;border-radius:var(--radius);font-size:14px;resize:vertical;font-family:inherit}
.oxbtns.small{display:flex;gap:8px;margin-top:2px}
.oxbtns.small .oxbtn{aspect-ratio:auto;padding:10px;font-size:22px}
.oxbtn.sel.maru{background:var(--ok);border-color:var(--ok);color:#fff}
.oxbtn.sel.batsu{background:var(--red);border-color:var(--red);color:#fff}
.add-foot{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:8px}
.add-foot .danger{color:var(--red);border:1px solid var(--red);background:none;padding:10px 14px;border-radius:var(--radius);font-size:13px}
.badge-custom{display:inline-block;font-size:10px;background:var(--blue);color:#fff;padding:1px 6px;border-radius:99px;margin-right:6px;vertical-align:middle}
.lease-badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;margin-right:8px;vertical-align:middle}
.lease-badge.new{background:var(--blue);color:#fff}
.lease-badge.old{background:var(--warn);color:#fff}
.q-stem .lease-badge{display:inline-block;margin-bottom:10px}
.edit-btn{margin-top:6px;font-size:10px}
.stat-card input{width:100%;border:1px solid var(--rule);background:var(--paper);color:var(--ink);padding:9px 10px;border-radius:var(--radius);font-size:13px;margin-top:4px}
.navrow2{display:flex;gap:8px;margin-top:14px}
.navrow2 button{flex:1;border:1px solid var(--rule);background:var(--panel);padding:12px;border-radius:var(--radius);font-size:14px}
.navrow2 button:disabled{opacity:.35;cursor:default}
.memo-preview{cursor:pointer;border-left-color:var(--blue)!important}
.tools button[data-memo-toggle]{margin-top:10px}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="hd">
      <div class="brand">折原レジュメ スマコアplus<small>財務会計論・理論｜公認会計士試験</small></div>
      <div class="hd-sp"></div>
      <button class="iconbtn" id="btnAdd" title="問題を追加">＋</button>
      <button class="iconbtn" id="btnSheet" aria-pressed="false" title="赤シート（答えを隠す）">赤</button>
      <button class="iconbtn" id="btnTheme" title="表示切替">◐</button>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-view="list">一覧</button>
      <button role="tab" aria-selected="false" data-view="quiz">テスト</button>
      <button role="tab" aria-selected="false" data-view="record">記録</button>
    </div>
  </div>
  <div class="meter" id="meter"></div>
</header>
<main class="wrap" id="app"></main>
<div class="add-overlay" id="addOverlay"></div>

<script id="quiz-data" type="application/json">[{"n":1,"name":"財務会計の基礎概念","qs":[{"l":1,"m":"","sb":"","i":"B","r":"","q":"会計公準は個別の会計基準の具体的な内容を直接制約するものである。","a":false,"c":"","e":"会計の基礎的前提をなすものであり，個別の会計基準の具体的な内容を直接制約するものではない"},{"l":2,"m":"","sb":"","i":"A","r":"","q":"企業実体の公準により会計が行われる範囲は，企業及び出資者の経済活動が対象となる。","a":false,"c":"","e":"企業の経済活動のみが対象となる"},{"l":3,"m":"","sb":"","i":"A","r":"","q":"企業実体の種類としては法人としての一企業（法的実体）と統一的な意思の下に指揮命令されている企業集団（経済的実体）があるが，一企業を細分化した単位は企業実体とはならない。","a":false,"c":"","e":"一企業を細分化した単位（本店・支店など）が企業実体となることもある"},{"l":4,"m":"","sb":"","i":"A","r":"","q":"減価償却は固定資産の原価配分手続であるが，その基礎にある費用配分の原則は，企業実体の公準を前提に導き出される。","a":false,"c":"","e":"減価償却は継続企業の公準を前提に導き出される\n継続企業を前提とするからこそ費用配分が必要となり，費用配分手続として減価償却がある"},{"l":5,"m":"","sb":"","i":"B","r":"","q":"貨幣的測定の公準のもとでは，いかに重要なものであるとしても貨幣額による測定が不可能な企業の経済事象が会計上認識されることはない。","a":true,"c":"","e":""},{"l":6,"m":"","sb":"","i":"B","r":"","q":"貨幣的測定の公準のもとでは会計の対象は貨幣額で合理的に測定可能なものに限定されるため，現行制度上，自己創設無形資産は貸借対照表に計上されない。","a":false,"c":"","e":"自己創設無形資産は貸借対照表に計上される（自己創設のれんを除く）\n例えば市場販売目的のソフトウェアの製品マスターの制作費は，適正な原価計算により取得原価を明確化できることから，その取得原価を無形固定資産として計上する"},{"l":7,"m":"","sb":"","i":"B","r":"","q":"会計期間を人為的に区切って実施される期間損益計算は，継続企業の公準に基づいている。","a":true,"c":"","e":""},{"l":8,"m":"","sb":"","i":"A","r":"","q":"資本主理論は，「資産＝負債＋資本」という貸借対照表等式に要約される。","a":false,"c":"","e":"「資産－負債＝資本」という資本等式に要約される\n企業主体理論は「資産＝負債＋資本」という貸借対照表等式に要約される"},{"l":9,"m":"","sb":"","i":"A","r":"","q":"資本主理論によれば，利益が株主に帰属するのは配当が行われた時点である。","a":false,"c":"","e":"利益が株主に帰属するのは利益が発生した時点\n企業主体理論によれば，利益は企業自体の利益であって，決定された配当額だけが株主に帰属する"},{"l":10,"m":"","sb":"","i":"A","r":"","q":"資本主理論によれば，株主に対する支払配当金と債権者に対する支払利息はいずれも費用として取り扱うべきである。","a":false,"c":"","e":"株主（内部者）に対する支払配当金は剰余金の処分，債権者（外部者）に対する支払利息は費用\n企業主体理論によれば，株主に対する支払配当金と債権者に対する支払利息は，いずれも外部者に対する支払として費用とすべき"},{"l":11,"m":"","sb":"","i":"A","r":"","q":"企業実体の公準は企業主体理論と結びつき，資本主理論とは結びつかない。","a":false,"c":"","e":"どのような会計主体論をとる場合にも，企業実体の公準が前提とされる\n企業実体の公準は会計を行うための基礎的前提であり，資本主理論，企業主体理論の双方と結びつく／連結主体論（連結基礎概念）である親会社説・経済的単一体説はいずれも資本主理論と結びつく"},{"l":12,"m":"","sb":"","i":"B","r":"","q":"資本主理論によれば，資本剰余金は株主からの払込資本に限定される。","a":true,"c":"","e":"現行制度上，資本剰余金は株主からの払込資本に限定される。一方，企業主体理論によれば払込資本のみならず受贈資本（国庫補助金等）も資本剰余金に含まれる"},{"l":13,"m":"","sb":"","i":"B","r":"","q":"静態論における貸借対照表には繰延資産や引当金が計上されない。","a":true,"c":"","e":"動態論によれば繰延資産や引当金は収支・未解決項目として貸借対照表に計上される"},{"l":14,"m":"","sb":"","i":"B","r":"","q":"貸借対照表を一定時点における債務弁済能力を表示する手段として理解した場合，資産は処分価値を有していなければならないと考えられ，売却時価で評価すべきである。","a":true,"c":"","e":""},{"l":15,"m":"","sb":"","i":"B","r":"","q":"貨幣及び「収益・未収入」項目と「収入・未支出」項目は貨幣性資産とよばれ，原則として，回収可能額で評価される。","a":false,"c":"","e":"「支出・未収入」\n「収益・未収入」項目には売掛金，「支出・未収入」には貸付金などが該当する"},{"l":16,"m":"","sb":"","i":"C","r":"","q":"動態論によれば，貨幣は収支未解決項目として貸借対照表に計上される。","a":false,"c":"","e":"貨幣は収支・未解決項目ではないが，貸借対照表に計上される"},{"l":17,"m":"","sb":"","i":"B","r":"","q":"動態論によれば，「費用・未支出」項目は資産に計上される。","a":false,"c":"","e":"「費用・未支出」項目は負債に計上\n貸借対照表を収支未解決項目の一覧表とする動態論によれば，費用・未支出項目（例えば引当金）は負債計上される"},{"l":18,"m":"","sb":"","i":"B","r":"","q":"静態論によれば，貸借対照表の作成には誘導法が採用される。","a":false,"c":"","e":"貸借対照表の作成には棚卸法が採用\n動態論によれば，貸借対照表の作成には誘導法が採用される"},{"l":19,"m":"","sb":"","i":"A","r":"","q":"期間損益として収益費用アプローチでは純利益が算定され，資産負債アプローチでは包括利益が算定される。","a":true,"c":"","e":"純利益は成果たる収益と努力たる費用を対応付けた結果であり，包括利益は純資産の変動額を表している"},{"l":20,"m":"","sb":"","i":"B","r":"","q":"収益費用アプローチでは，資産に経済的資源に該当しない繰延費用が含まれ，負債には現在の義務ではない繰延収益や偶発性のない負債性引当金が含まれる。","a":false,"c":"","e":"経済的資源に該当しない繰延ヘッジ損失が該当し，現在の義務ではない繰延収益には修繕引当金が該当する"},{"l":21,"m":"","sb":"","i":"B","r":"","q":"収益費用アプローチでは，その他有価証券は時価評価され，評価差額は純資産の部に直接計上される。","a":false,"c":"","e":"収益費用アプローチでは，その他有価証券は原価評価される\nその他有価証券の評価差額は未実現損益であり，損益認識の必要がないため原価評価される"},{"l":22,"m":"","sb":"","i":"C","r":"","q":"資産負債アプローチでは研究活動に関する支出は，報告主体が支配する経済的資源という資産の定義を満たすため，資産に計上される。","a":false,"c":"","e":"資産に計上されない\n研究費が資産に計上されないのは，認識要件としての蓋然性を満たさないためである"},{"l":23,"m":"","sb":"","i":"B","r":"","q":"名目貨幣資本概念によれば，貨幣価値の変動による資産の評価増部分（評価替資本）は，資本剰余金とすべきである。","a":false,"c":"","e":"利益剰余金とすべき\n実質貨幣資本概念によれば，評価替資本は資本剰余金とすべきである"},{"l":24,"m":"","sb":"","i":"B","r":"","q":"資本維持論は，名目資本維持，実質資本維持，実体資本維持の3つに大別される。取得原価主義会計は名目資本維持に属するのに対して，時価主義会計は実体資本維持に属する。","a":false,"c":"","e":"取得原価主義会計は名目資本維持に属し，修正原価主義会計は実体資本維持に属する。なお，修正原価とは取得原価を物価指数で修正したものをいう"},{"l":25,"m":"","sb":"","i":"B","r":"","q":"物価変動がもたらす資産の増減変動額は，原則として売却時に損益として処理される。これは，現行制度が名目資本維持概念を前提としているためである。","a":true,"c":"","e":"現行制度は取得原価を費用化することで，資産に投下された貨幣の名目額を超える部分を利益としており，名目資本維持概念を前提としている"},{"l":26,"m":"","sb":"","i":"B","r":"","q":"名目資本維持概念によれば，減価償却費は再調達原価を基礎として計上される。","a":false,"c":"","e":"取得原価\n再調達原価を基礎に減価償却を行った場合，実体資本が維持される"},{"l":27,"m":"","sb":"","i":"A","r":"","q":"インフレーションを前提とした場合，名目資本維持の利益計算と実質資本維持の利益計算を比較したとき，前者における売上総利益は後者における売上総利益よりも小さくなる。","a":false,"c":"","e":"前者における売上総利益は後者における売上総利益よりも大きくなる"}]},{"n":2,"name":"企業会計制度と会計基準","qs":[{"l":1,"m":"","sb":"","i":"A","r":"","q":"会社法における計算書類には，貸借対照表，損益計算書，株主資本等変動計算書，キャッシュ・フロー計算書，事業報告及び附属明細書が含まれる。","a":false,"c":"","e":"個別注記表が含まれる\n計算書類に事業報告及び附属明細書が含まれる／事業報告及び附属明細書は開示が要求されるが，計算書類には含まれない"},{"l":2,"m":"","sb":"","i":"B","r":"","q":"会社法会計と金融商品取引法会計で対象とする利害関係者の範囲は異ならない。","a":false,"c":"","e":"会社法会計：現在債権者及び現在株主／金融商品取引法会計：投資者（現在債権者及び現在株主，潜在債権者及び潜在株主）"},{"l":3,"m":"","sb":"","i":"B","r":"","q":"一定の会社は会社法上の連結計算書類として，連結貸借対照表，連結損益計算書，連結包括利益計算書，連結株主資本等変動計算書，連結注記表の作成が要求される。","a":false,"c":"","e":"連結包括利益計算書の作成は要求されない（任意）"},{"l":4,"m":"","sb":"","i":"A","r":"","q":"会社法会計における一般に公正妥当と認められる企業会計の慣行には，企業会計審議会から公表された会計基準，企業会計基準委員会から公表された会計基準，日本公認会計士協会から公表された実務指針などが含まれるが，中小企業の会計に関する指針は含まれない。","a":false,"c":"","e":"中小企業の会計に関する指針も含まれる\nなお，中小企業の会計に関する指針は「金融商品取引法会計」の適用会社には適用できない"},{"l":5,"m":"","sb":"","i":"B","r":"","q":"会社法上の大会社が金融商品取引法上の有価証券報告書提出会社にも該当する場合，定時株主総会の終結後遅滞なく貸借対照表及び損益計算書を公告しなければならない。","a":false,"c":"","e":"金融商品取引法により有価証券報告書を提出する会社は決算公告を免除されている\n金融商品取引法適用会社に決算公告が免除されるのは，EDINETで有価証券報告書が電子開示されるため"},{"l":6,"m":"","sb":"","i":"B","r":"","q":"臨時計算書類には貸借対照表，損益計算書，株主資本等変動計算書が含まれる。","a":false,"c":"","e":"株主資本等変動計算書は含まれない"},{"l":7,"m":"","sb":"","i":"B","r":"","q":"企業会計原則は1982年以来修正されておらず，現在では「一般に公正妥当と認められる企業会計の基準（GAAP）」には含まれない。","a":false,"c":"","e":"「一般に公正妥当と認められる企業会計の基準」に含まれる\n有価証券の評価のように死文化している定めもあるが，一般原則のように普遍的に有効な定めもあるため"},{"l":8,"m":"","sb":"","i":"C","r":"","q":"現在，わが国では，公的機関である企業会計基準委員会により，会計基準が公表されている。","a":false,"c":"","e":"民間機関"},{"l":9,"m":"","sb":"","i":"B","r":"","q":"公的機関である企業会計審議会が公表した会計基準は企業会計基準委員会が公表した会計基準に優先して適用される。","a":false,"c":"","e":"企業会計基準委員会が公表した会計基準は，企業会計審議会が公表した会計基準に優先して適用"},{"l":10,"m":"","sb":"","i":"B","r":"","q":"会計基準の設定権限が企業会計基準委員会に委譲されたことに伴い，現行制度上，企業会計審議会が設定した会計基準は適用されていない。","a":false,"c":"","e":"企業会計基準委員会が会計基準を設定していない分野は，企業会計審議会が公表した会計基準が適用されている"},{"l":11,"m":"","sb":"","i":"B","r":"","q":"IFRSを強制的に適用することをコンバージェンスという。","a":false,"c":"","e":"IFRSを強制的に適用することはアドプションである"},{"l":12,"m":"","sb":"","i":"B","r":"","q":"指定国際会計基準の適用は，実質的にはIFRSのエンドースメントに相当する。","a":false,"c":"","e":"実質的にはIFRSのアドプションに相当する\nアドプションに相当するのは，IASBが策定したすべての基準がそのまま指定国際会計基準とされているため／IFRSのエンドースメントに相当するのは修正国際基準である"},{"l":13,"m":"","sb":"","i":"A","r":"","q":"指定国際会計基準特定会社については，国際的な比較可能性の観点から，連結財務諸表の作成にあたって，指定国際会計基準を適用しなければならない。","a":false,"c":"","e":"指定国際会計基準は任意適用である"},{"l":14,"m":"","sb":"","i":"A","r":"","q":"指定国際会計基準特定会社とは，国際的な財務活動又は事業活動を行う上場会社として一定の要件を満たす株式会社である。","a":false,"c":"","e":"国際的な財務活動又は事業活動を行うことや上場会社であることは要求されていない"},{"l":15,"m":"","sb":"","i":"A","r":"","q":"指定国際会計基準は企業会計基準委員会が定めるが，現在，国際会計基準審議会が策定したすべての基準がそのまま指定国際会計基準とされている。","a":false,"c":"","e":"指定国際会計基準は金融庁長官が定める"},{"l":16,"m":"","sb":"","i":"B","r":"","q":"エンドースメント手続は指定国際会計基準の指定とは別の制度として行われるものであり，企業会計審議会が，個々の会計基準等を「削除又は修正」するか否かを判断する部分を担う。","a":false,"c":"","e":"企業会計基準委員会が，個々の会計基準等を「削除又は修正」するか否かを判断する"},{"l":17,"m":"","sb":"","i":"B","r":"","q":"連結財務諸表を作成していない修正国際基準特定会社については，個別財務諸表の作成にあたって修正国際基準の任意適用が認められる。","a":false,"c":"","e":"個別財務諸表の作成にあたって修正国際基準の任意適用は認められていない"},{"l":18,"m":"","sb":"","i":"B","r":"","q":"エンドースメント手続を行う上では，わが国の会計基準の考え方を反映するため，削除又は修正を最大限とすることが適切である。","a":false,"c":"","e":"削除又は修正を最小限とすることが適切"},{"l":19,"m":"","sb":"","i":"A","r":"","q":"エンドースメント手続を行う上で「削除又は修正」が行われた項目は，のれんの非償却と開発費の条件付資産計上の２つである。","a":false,"c":"","e":"のれんの非償却とその他の包括利益のノンリサイクリング処理"},{"l":20,"m":"","sb":"","i":"B","r":"","q":"一定の要件を満たす会社は，従来，米国基準に準拠した連結財務諸表（米国式連結財務諸表）を有価証券報告書に記載して提出することが認められていたが，指定国際会計基準の適用等が認められるようになった現在では認められていない。","a":false,"c":"","e":"現在でも認められている\n会社法上の連結計算書類も米国基準によって作成することが認められている"},{"l":21,"m":"","sb":"","i":"B","r":"","q":"真実性の原則以外の一般原則と損益計算書原則及び貸借対照表原則が守られているときは，その財務諸表は絶対的真実と解する。","a":false,"c":"","e":"相対的真実"},{"l":22,"m":"","sb":"","i":"B","r":"","q":"正規の簿記の原則によれば，実地調査を基礎とする棚卸法で貸借対照表を作成する。","a":false,"c":"","e":"帳簿記録を基礎とする誘導法"},{"l":23,"m":"","sb":"","i":"A","r":"","q":"会社法上，払込資本の一部であるその他資本剰余金が分配可能である現在，資本剰余金・利益剰余金区別の原則は有効に機能していない。","a":false,"c":"","e":"有効に機能している"},{"l":24,"m":"","sb":"","i":"B","r":"","q":"資本的支出か収益的支出か不明確な場合に，資本的支出とすることは，保守主義の原則の適用例である。","a":false,"c":"","e":"収益的支出"},{"l":25,"m":"","sb":"","i":"B","r":"","q":"その他有価証券の評価差額の処理方法として全部純資産直入法を採用することは，保守主義の原則の適用例である。","a":false,"c":"","e":"部分純資産直入法"},{"l":26,"m":"","sb":"","i":"B","r":"","q":"保守主義の原則によれば，重要な減価償却資産を取得した時点で全額費用処理することも認められる。","a":false,"c":"","e":"過度の保守主義に該当するため認められない"},{"l":27,"m":"","sb":"","i":"B","r":"","q":"一つの会計事実について二つ以上の会計処理の原則又は手続の選択適用が認められていない場合，企業会計上，継続性は問題とならない。","a":true,"c":"","e":"一つの会計事実について二つ以上の会計処理の原則又は手続の選択適用が認められていない場合，会計処理の選択の余地がないため，継続性は問題とならない"},{"l":28,"m":"","sb":"","i":"B","r":"","q":"重要性が増したことに伴い，支払保険料に対する会計方針を現金基準から発生基準へ変更する場合，継続性の原則の適用を受ける。","a":false,"c":"","e":"本事例は当然の変更であり継続性の原則の適用を受けない"},{"l":29,"m":"","sb":"","i":"B","r":"","q":"単一性の原則は，実質一元形式一元を要請するものであり，この原則を遵守することにより，二重帳簿の作成は排除される。","a":false,"c":"","e":"実質一元形式多元を要請するものであり，二重帳簿の作成は排除される"},{"l":30,"m":"","sb":"","i":"B","r":"","q":"金額的重要性が乏しい場合，項目の性質を問わず，簡便な会計処理の方法を採用してもよい。","a":false,"c":"","e":"簡便な会計処理の採用には，項目の性質が問われる"},{"l":31,"m":"","sb":"","i":"C","r":"","q":"重要性の原則は独立した一般原則である。","a":false,"c":"","e":"会計処理面は正規の簿記の原則，表示面は明瞭性の原則に含まれる\n具体的には「重要性の乏しいものについては，本来の厳密な会計処理によらないで他の簡便な方法によることも，正規の簿記の原則に従った処理として認められる」と規定されている"},{"l":32,"m":"","sb":"","i":"B","r":"","q":"分割返済の定めのある長期の債権のうち，期限が一年以内に到来するもので重要性の乏しいものについて，固定資産として表示する場合，簿外資産が生じる。","a":false,"c":"","e":"簿外資産は生じない"},{"l":33,"m":"","sb":"","i":"C","r":"","q":"臨時損益又は前期損益修正のような特別損益に属する項目であっても，金額が僅少で毎期経常的に発生するものに限り，経常損益計算に含めることができる。","a":false,"c":"","e":"臨時損益・金額の僅少なもの又は毎期経常的に発生するもの　※前期損益修正は廃止された"}]},{"n":3,"name":"損益会計総論","qs":[{"l":1,"m":"","sb":"","i":"C","r":"","q":"財産法によれば利益の発生原因が明らかになる。","a":false,"c":"","e":"損益法によれば利益の発生原因が明らかになる\n財産法によれば利益の財産的な裏付けが明らかになり，損益法によれば利益の発生原因が明らかになる"},{"l":2,"m":"","sb":"","i":"C","r":"","q":"棚卸法による貸借対照表の作成は損益法と結びつく。","a":false,"c":"","e":"棚卸法による貸借対照表の作成は実地調査を基礎とするため財産法と結びつく\n誘導法による貸借対照表の作成は，帳簿記録を基礎とするため損益法と結びつく"},{"l":3,"m":"","sb":"","i":"C","r":"","q":"現行制度では損益法により一貫して損益の把握を行うことで適正な期間利益を算定している。","a":false,"c":"","e":"損益法により一貫して損益の把握を行う\n損益法を基礎としながら，実地調査を一部採用し，損益計算を補完している"},{"l":4,"m":"","sb":"","i":"B","r":"","q":"企業の成立から解散までの期間利益の合計は，全体利益に一致するという一致の原則に照らし妥当なのは，当期業績主義である。","a":false,"c":"","e":"包括主義\n当期業績主義によれば，特別損益項目は利益剰余金に直接加減されるため一致の原則が成立しない"},{"l":5,"m":"","sb":"","i":"B","r":"","q":"当期業績主義の利益は企業の短期的収益力を示すものであるのに対し，包括主義の利益は企業の長期的収益力を示す。","a":true,"c":"","e":"包括主義による利益は，数年間に一度しか生じない特別損益を含めて算定されるため，企業の長期的収益力を示す"},{"l":6,"m":"","sb":"","i":"B","r":"","q":"現行制度における損益計算書は包括主義であり，当期業績主義の利点は失われている。","a":false,"c":"","e":"経常利益の区分表示を要求していることから，当期業績主義の利点も有している"},{"l":7,"m":"","sb":"","i":"A","r":"","q":"包括利益計算書においては，包括主義に基づく利益である包括利益を表示する。","a":false,"c":"","e":"包括主義に基づく利益は当期純利益である"},{"l":8,"m":"","sb":"","i":"B","r":"","q":"現金主義会計にはなくて，発生主義会計にある原則の一つは費用収益対応の原則である。","a":true,"c":"","e":"現金主義会計においては収益と費用がそれぞれ収入及び支出に基づいて計上され，費用収益対応の原則による調整は行われない"},{"l":9,"m":"","sb":"","i":"C","r":"","q":"「企業会計原則」における発生主義とは，収益と費用のいずれも発生主義による認識を要求している。","a":false,"c":"","e":"収益の認識に実現主義を用いる\n純粋理論上の発生主義会計と異なり，企業会計原則では利益の分配可能性に配慮し，収益の認識に実現主義を用いる"},{"l":10,"m":"","sb":"","i":"B","r":"","q":"収益の実現とは，貨幣・役務の移転又はこれに対する現金・現金等価物すなわち貨幣性資産の取得を指す。","a":false,"c":"","e":"貨幣・役務の移転及びこれに対する貨幣性資産の取得を指す"},{"l":11,"m":"","sb":"","i":"A","r":"","q":"費用収益対応の原則は，期間損益計算における期間収益を決定する機能を有する。","a":false,"c":"","e":"期間費用を決定する機能を有する\n具体的には，実現主義により期間収益が把握され，その後，発生主義で認識された発生費用の中から費用収益対応の原則により期間費用を決定する"},{"l":12,"m":"","sb":"","i":"B","r":"","q":"発生費用のうち，期間収益に対応しない費用は負債として繰り延べられる。","a":false,"c":"","e":"資産として繰り延べられる\n例えば，製品のうち在庫分は棚卸資産として繰り延べられる"},{"l":13,"m":"","sb":"","i":"B","r":"","q":"損益計算書上，売上高と販売費及び一般管理費は，通常，個別的に対応している。","a":false,"c":"","e":"売上高と販売費及び一般管理費は期間的に対応している\n売上高と売上原価は個別的に対応している"},{"l":14,"m":"","sb":"","i":"C","r":"","q":"収支基準は当期における収入額によって収益を測定することを要求するものである。","a":false,"c":"","e":"当期の収入のみならず，過去及び将来の収入を含む\n※例えば当期の収益の測定には，過去の収入である前受金や将来の収入である売掛金も含まれる"},{"l":15,"m":"","sb":"","i":"C","r":"","q":"前払費用及び前受収益は，当期の損益計算に計上し，未払費用及び未収収益は当期の損益計算から除去しなければならないという取扱いは，実現主義を根拠とする。","a":false,"c":"","e":"前払費用及び前受収益は，当期の損益計算から除去し，未払費用及び未収収益は当期の損益計算に計上しなければならないという取扱いは，発生主義を根拠とする"},{"l":16,"m":"","sb":"","i":"B","r":"","q":"前払費用及び未収収益は流動資産に属し，未払費用及び前受収益は流動負債に属する。","a":false,"c":"","e":"前払費用は一年基準を適用して流動資産と固定資産に分類する"},{"l":17,"m":"","sb":"","i":"B","r":"","q":"会計単位内部における原材料，半製品等の振替から生ずる内部利益は消去する。","a":false,"c":"","e":"誤：内部利益は消去する\n正：振替損益は原価差異として扱う\n同一企業の各経営部門の間における商品等の移転によって発生した内部利益は，売上高及び売上原価を算定するに当って除去しなければならない。"},{"l":18,"m":"","sb":"","i":"B","r":"","q":"役員賞与は発生した会計期間の費用として処理するが，当事業年度の職務に係る役員賞与を株主総会の決議事項とする場合，利益処分経理も認められる。","a":false,"c":"","e":"役員賞与を株主総会の決議事項とする場合であっても，発生した会計期間の費用として処理する"},{"l":19,"m":"","sb":"","i":"B","r":"","q":"子会社が支給する役員賞与は，役員賞与引当金等の適当な科目をもって計上しなければならない。","a":false,"c":"","e":"未払役員報酬等の適当な科目をもって計上することができる\n子会社が支給する役員賞与は，株主総会の決議はされてなくても実質的に確定債務と認められるため"},{"l":20,"m":"","sb":"","i":"C","r":"","q":"損益計算書上，売上高と売上原価及び営業外収益と営業外費用は，因果関係に基づき対応表示されている。","a":false,"c":"","e":"営業外収益と営業外費用は，取引の同質性に基づき対応表示されている\n売上高と売上原価は因果関係に基づき対応表示されている"}]},{"n":4,"name":"資産会計","qs":[{"l":1,"m":"","sb":"","i":"B","r":"","q":"企業会計原則によれば，まず正常営業循環基準を適用し，次いで正常な営業循環過程から離脱している項目について，補完的に１年基準を適用する。","a":true,"c":"","e":"具体的には，企業の主目的たる営業取引により発生した債権及び債務（受取手形，売掛金，前払金，支払手形，買掛金，前受金等）→流動資産又は流動負債。企業の主目的以外の取引によって発生した未収金，未払金の債権及び債務（貸付金，借入金，差入保証金，受入保証金）→1年以内に入金又は支払の期限が到来するもの：流動資産又は流動負債／1年をこえて期限が到来するもの：投資その他の資産又は固定負債"},{"l":2,"m":"","sb":"","i":"B","r":"","q":"固定資産のうち残存耐用年数が１年以下となったものは流動資産に振り替え，棚卸資産のうち恒常在庫品として保有するものもしくは余剰品として長期間にわたって所有するものは固定資産とする。","a":false,"c":"","e":"固定資産のうち残存耐用年数が1年以下となったもの：固定資産とせず流動資産とする。恒常在庫品，余剰品として長期間にわたって所有する棚卸資産：固定資産とせず流動資産とする"},{"l":3,"m":"","sb":"","i":"B","r":"","q":"不動産業者が本社ビル建設用地を購入するため振り出した約束手形は流動負債に表示する。","a":false,"c":"","e":"営業外の支払手形であるため１年基準により流動固定分類を行って表示する"},{"l":4,"m":"","sb":"","i":"B","r":"","q":"現行の会計制度では，資産の評価はその外形に基づいて，金融資産は時価で評価し，事業資産は取得原価で評価される。","a":false,"c":"","e":"資産の評価は投資目的に基づいて，金融投資は時価で評価し，事業投資は取得原価で評価する"},{"l":5,"m":"","sb":"","i":"B","r":"","q":"貸借対照表の項目の配列は，流動性配列法と固定性配列法の選択適用が認められている。","a":false,"c":"","e":"原則として流動性配列法を適用する"},{"l":6,"m":"","sb":"","i":"B","r":"","q":"資産評価に原価主義を採用すれば，企業の操業活動による成果と保有活動による成果とが区別され，経営活動に関する詳細な情報を提供できる。","a":false,"c":"","e":"操業損益と保有損益が区別されず，経営活動に関する詳細な情報を提供できない\n資産評価に時価主義（再調達原価）を採用すれば，操業損益と保有損益を区別できる"},{"l":7,"m":"","sb":"","i":"C","r":"","q":"取得原価は実際の取引価額であり，費用配分にあたり見積りや仮定は介入しない。","a":false,"c":"","e":"例えば減価償却計算では残存価値が見積られ，減価の態様に一定の仮定を設けている"},{"l":8,"m":"","sb":"","i":"A","r":"","q":"正味実現可能額による資産評価は未実現損益を排除する思考と整合する。","a":false,"c":"","e":"取得原価"},{"l":9,"m":"","sb":"","i":"C","r":"","q":"割引価値は，経済的資源という資産概念と整合する。","a":true,"c":"","e":"割引価値は将来キャッシュ・フローを基礎としているため経済的資源という資産概念と整合する"},{"l":10,"m":"","sb":"","i":"C","r":"","q":"費用配分の原則は有形固定資産に適用されるものであり，その他の資産には適用されない。","a":false,"c":"","e":"有形固定資産に適用されるものであり，通常の販売目的で保有する棚卸資産や繰延資産等にも適用される"},{"l":11,"m":"","sb":"","i":"C","r":"","q":"制度会計上，正味実現可能価額は正味売却価額と異なり適用されていない。","a":false,"c":"","e":"正味実現可能価額は正味売却価額と同義であり，棚卸資産の傷切下げ等に適用されている"},{"l":12,"m":"","sb":"","i":"B","r":"","q":"未渡小切手は現金に含めて表示する。","a":false,"c":"","e":"預金として表示する"},{"l":13,"m":"","sb":"","i":"A","r":"","q":"有形固定資産の自家建設に要する借入資本の利子で稼働前の期間に属するものは，原則として取得原価に算入する。","a":false,"c":"","e":"原則として営業外費用とし，例外的に取得原価に算入することができる"},{"l":14,"m":"","sb":"","i":"A","r":"","q":"有形固定資産を有価証券との交換によって取得した場合，当該有価証券の適正な簿価をもって取得原価としなければならない。","a":false,"c":"","e":"時価又は適正な帳簿価額をもって取得原価とする\n異種資産の交換の場合，投資が清算されたとみなして時価（又は近似する場合は帳簿価額）を用いる"},{"l":15,"m":"","sb":"","i":"B","r":"","q":"固定資産を無償取得した場合，支払対価主義に基づいて取得原価をゼロとすることができる。","a":false,"c":"","e":"公正な評価額をもって取得原価とする"},{"l":16,"m":"","sb":"","i":"A","r":"","q":"減価償却とは，有形固定資産の取得原価をその耐用期間における各事業年度に配分し，資産価値を測定するための手続である。","a":false,"c":"","e":"減価償却とは，費用配分の原則に基づいて，有形固定資産の取得原価をその耐用期間における各事業年度に配分する費用配分のための手続である"},{"l":17,"m":"","sb":"","i":"C","r":"","q":"減価償却資産の除去費用は，残存価額の算定上で控除する。","a":false,"c":"","e":"除去費用を控除せず，減価除去債務に該当する場合，減価償却資産の取得原価に加算する"},{"l":18,"m":"","sb":"","i":"B","r":"","q":"固定資産の耐用年数は，物質的減価を考慮し，機能的減価は予測が困難なため考慮しない。","a":false,"c":"","e":"物質的減価と機能的減価を適正に予測しなければならない"},{"l":19,"m":"","sb":"","i":"B","r":"","q":"災害，事故等の偶発的事情によって固定資産の実体が減失した場合には，臨時償却を行う。","a":false,"c":"","e":"臨時損失（災害損失等）を計上して資産の簿価を直接切り下げなければならない"},{"l":20,"m":"","sb":"","i":"C","r":"","q":"定額法は，固定資産費用の期間別負担が平均化される特徴を有する。","a":false,"c":"","e":"定率法は，固定資産費用の期間別負担が平均化される特徴を有する\n固定資産費用は，減価償却費と修繕費からなる"},{"l":21,"m":"","sb":"","i":"B","r":"","q":"減価償却資産の減価が主として固定資産の利用に比例して発生する場合，生産高を配分基準とする方法（生産高比例法）を採用しなければならない。","a":false,"c":"","e":"減価償却方法は選択適用する"},{"l":22,"m":"","sb":"","i":"B","r":"","q":"総合償却を採用し，平均耐用年数の到来前に個々の資産を除却した場合には，当該除却資産について除却時までの償却年数に基づいて未償却残高を計算し，除却損を計上する。","a":false,"c":"","e":"除却資産の要償却額を減価償却累計額から控除するため，除却損は計上されない"},{"l":23,"m":"","sb":"","i":"B","r":"","q":"総合償却においては，平均耐用年数が到来した後も，償却単位を構成する資産が残存する限り継続して減価償却を行う。","a":true,"c":"","e":"継続して減価償却を行うのは，総合償却が資産の反復的な取替更新を前提とするためである"},{"l":24,"m":"","sb":"","i":"A","r":"","q":"減価償却計画の設定に当たって予見することのできなかった新技術の発明等の外的事情により，固定資産が機能的に著しく減価した場合には，この事実に対応して臨時償却を行う。","a":false,"c":"","e":"臨時償却は廃止されており，プロスペクティブ方式により処理する"},{"l":25,"m":"","sb":"","i":"C","r":"","q":"減耗償却は生産高比例法に類似する減価償却方法である。","a":false,"c":"","e":"減耗償却は減価償却とは異なる別個の費用配分法である"},{"l":26,"m":"","sb":"","i":"C","r":"","q":"減耗償却に係る費用は販売費及び一般管理費に計上される。","a":false,"c":"","e":"売上原価に計上される"},{"l":27,"m":"","sb":"","i":"A","r":"","q":"取替法は，減価償却の代わりに固定資産の部分的取替に要する取替費用を資本的支出として処理する方法である。","a":false,"c":"","e":"取替法は，取替費用を収益的支出として処理する方法である"},{"l":28,"m":"","sb":"","i":"A","r":"","q":"取替法は，固定資産に先入先出法の考え方を採用したものである。","a":false,"c":"","e":"後入先出法の考え方を採用したものである"},{"l":29,"m":"","sb":"","i":"A","r":"","q":"取替法では資産の取り替えを繰り返す限り，取替資産の帳簿価額は時価である。","a":false,"c":"","e":"取替資産の帳簿価額は原始取得原価である"},{"l":30,"m":"","sb":"","i":"B","r":"","q":"取替法によれば，当初取得した資産の取得原価が資産勘定に計上されることから，価格変動時には，名目資本の維持が図られる。","a":false,"c":"","e":"価格変動時に取替費用が時価で計上され，実体資本（実物資本）の維持が図られる"},{"l":31,"m":"","sb":"","i":"B","r":"","q":"減価償却累計額は，有形固定資産が属する科目ごとに控除する形式で表示しなければならない。","a":false,"c":"","e":"本問の方法の他，2以上の科目について，減価償却累計額を一括して記載する方法や，減価償却累計額を控除した残額のみを記載し，減価償却累計額を注記する方法によることを妨げない"},{"l":32,"m":"","sb":"","i":"B","r":"","q":"のれん以外の無形固定資産を無償で取得した場合には，ゼロ評価する。","a":false,"c":"","e":"公正な評価額をもって取得原価とする"},{"l":33,"m":"","sb":"","i":"B","r":"","q":"無形固定資産は，減価償却累計額を控除した未償却残高を記載する。","a":true,"c":"","e":"有形固定資産と異なり取替更新を前提としないため，間接控除形式は認められていない"},{"l":34,"m":"","sb":"","i":"B","r":"","q":"破産債権・更生債権は，投資その他の資産に表示する。","a":false,"c":"","e":"貸借対照表日の翌日から起算して1年以内に回収されないものを投資その他の資産に表示する"},{"l":35,"m":"","sb":"","i":"B","r":"","q":"将来の期間に影響する特定の費用とは，すでに代価の支払が完了又は支払義務が確定し，これに対応する役務の提供を受けていないにもかかわらず，その効果が将来にわたって発現するものと期待される費用をいう。","a":false,"c":"","e":"対応する役務の提供を受けている\n将来の期間に影響する特定の費用とは，経過資産計上の対象となる費用である"},{"l":36,"m":"","sb":"","i":"B","r":"","q":"将来の期間に影響する特定の費用は，次期以後の期間に配分して処理するため，経過的に貸借対照表の資産の部に記載しなければならない。","a":false,"c":"","e":"経過的に貸借対照表の資産の部に記載することができる"},{"l":37,"m":"","sb":"","i":"A","r":"","q":"制度上の繰延資産は，「会社計算規則」に規定されている5項目に限定されている。","a":false,"c":"","e":"「繰延資産の会計処理に関する当面の取扱い」に規定されている5項目に限定されている"},{"l":38,"m":"","sb":"","i":"B","r":"","q":"制度上，繰延資産計上が認められているのは，株式交付費，社債発行費等，創立費，開業費，試験研究費の5項目である。","a":false,"c":"","e":"株式交付費，社債発行等，創立費，開業費，開発費の5項目である"},{"l":39,"m":"","sb":"","i":"B","r":"","q":"繰延資産は役務の提供をすでに受けている発生費用であるのに対して，長期前払費用は役務の提供をいまだ受けていない未発生費用である。","a":true,"c":"","e":""},{"l":40,"m":"","sb":"","i":"C","r":"","q":"一定の要件を満たす臨時巨額の損失は，繰延資産のように費用収益対応の観点から繰延経理が認められている。","a":false,"c":"","e":"政策的配慮の観点から繰延経理が認められている"},{"l":41,"m":"","sb":"","i":"C","r":"","q":"天災等により固定資産又は企業の営業活動に必須の手段たる資産の上に生じた損失が，巨額である場合には，これを経過的に資産の部に記載して繰延経理することができる。","a":false,"c":"","e":"繰延経理が認められるのは，問題文の要件に加えて特に法令をもって認められた場合である"},{"l":42,"m":"","sb":"","i":"B","r":"","q":"株式交付費は新株の発行に係る費用を指す。","a":false,"c":"","e":"自己株式の処分に係る費用も株式交付費に含まれる"},{"l":43,"m":"","sb":"","i":"B","r":"","q":"株式無償割当てに係る費用を繰延資産に計上した場合，営業外費用として処理しなければならない。","a":false,"c":"","e":"株式無償割当てに係る費用は繰延資産に計上できず，支出時に費用として処理する\nなお，株式無償割当てに係る費用は販売費及び一般管理費として処理することができる"},{"l":44,"m":"","sb":"","i":"B","r":"","q":"新株予約権付社債を区分法により処理するときは，当該社債の発行に係る費用は，社債発行費として処理する。","a":false,"c":"","e":"一括法により処理するときは，当該社債の発行費用は，社債発行費として処理する\n区分法により処理する場合，発行費用は社債発行費と新株予約権発行費に分けて処理する"},{"l":45,"m":"","sb":"","i":"B","r":"","q":"繰延資産は年数を基準として償却する。","a":false,"c":"","e":"月数を基準として償却する"},{"l":46,"m":"","sb":"","i":"B","r":"","q":"繰延資産に計上した社債発行費，社債発行のときから3年以内のその効果の及ぶ期間にわたり定額法により償却をしなければならない。","a":false,"c":"","e":"社債の償還までの期間にわたり利息法又は定額法により償却"},{"l":47,"m":"","sb":"","i":"B","r":"","q":"新株予約権の発行費用を繰延資産に計上する場合，発行のときから，5年以内のその効果の及ぶ期間にわたって，利息法又は定額法により償却をしなければならない。","a":false,"c":"","e":"3年以内のその効果の及ぶ期間にわたって，定額法により償却"},{"l":48,"m":"","sb":"","i":"B","r":"","q":"会社法上，創立費を資本金又は資本準備金から減額することが可能とされたため，企業会計においても同様の処理が認められる。","a":false,"c":"","e":"創立費は支出時に費用として処理するか繰延資産に計上する"},{"l":49,"m":"","sb":"","i":"B","r":"","q":"開業費を繰延資産に計上し，その後，営業の一部を開業した場合であっても，営業の全部を開始するまでは償却を要しない。","a":false,"c":"","e":"営業の一部を開業すれば償却を要する"},{"l":50,"m":"","sb":"","i":"B","r":"","q":"開業費は，営業外費用として処理しなければならない。","a":false,"c":"","e":"営業外費用として処理しなければならない，というわけではなく，販売費及び一般管理費として処理することもできる\n開業準備活動は通常の営業活動ではないため営業外費用として処理するほか，営業活動と密接であるため販売費及び一般管理費として処理することもできる"},{"l":51,"m":"","sb":"","i":"B","r":"","q":"現行制度上，開業費の範囲については，開業までに支出した一切の費用を含むものとする考え方が採用されている。","a":false,"c":"","e":"開業準備のために直接支出したものに限るとする考え方が採用\n開業準備のために直接支出したとは認められない費用については，その効果が将来にわたって発現することが明確ではないものが含まれている可能性があるため開業費に含められていない"},{"l":52,"m":"","sb":"","i":"B","r":"","q":"経常費の性格を持つものは開発費に含まれない。","a":true,"c":"","e":""},{"l":53,"m":"","sb":"","i":"B","r":"","q":"開発費のうち「研究開発等に係る会計基準」の対象となる研究開発に該当するものは，原則として発生時に費用として処理するが，繰延資産への計上も容認されている。","a":false,"c":"","e":"発生時に費用として処理しなければならない"},{"l":54,"m":"","sb":"","i":"B","r":"","q":"開発費を繰延資産に計上した場合には，定額法その他の合理的な方法により規則的に償却しなければならない。","a":true,"c":"","e":""},{"l":55,"m":"","sb":"","i":"B","r":"","q":"繰延資産に計上した開発費は支出のときから5年以内の期間で償却するが，支出の原因となった新技術や資源の利用可能期間が5年を上回る場合，当該利用可能期間内で償却する。","a":false,"c":"","e":"新技術や資源の利用可能期間が5年を上回る場合であっても，5年以内の期間で償却する"},{"l":56,"m":"","sb":"","i":"B","r":"","q":"支出の効果が期待されなくなった繰延資産であっても，適正な期間損益計算を行うため，規則的な償却を継続しなければならない。","a":false,"c":"","e":"未償却残高を一時に償却しなければならない\n将来における効果の発現が期待されなくなったためである"},{"l":57,"m":"","sb":"","i":"B","r":"","q":"当期に繰延資産の計上が行われた場合，前期において同一の繰延資産項目がないため，会計処理が行われていないのであれば会計方針の変更として注記しなければならない。","a":false,"c":"","e":"会計方針の変更として取り扱わない\n同一の繰延資産項目についての会計処理が前事業年度にも行われている場合において，当事業年度の会計処理方法が前事業年度の会計処理方法と異なるときは，原則として，会計方針の変更として取り扱う"},{"l":58,"m":"","sb":"","i":"B","r":"","q":"株式交付費については，現行制度上，一括費用処理もしくはいったん繰延資産に計上する会計処理のほかに，資本から直接控除することも認められる。","a":false,"c":"","e":"資本から直接控除することは認められない"}]},{"n":5,"name":"負債会計総論","qs":[{"l":1,"m":"","sb":"","i":"B","r":"","q":"法律上の債務は，確定債務と条件付債務に分類することができるが，この法律上の債務以外の項目は現行制度上，負債計上されない。","a":false,"c":"","e":"法律上の債務以外の項目であっても，例えば修繕引当金のような債務性のない引当金（会計的負債）は負債計上する"},{"l":2,"m":"","sb":"","i":"A","r":"","q":"将来の期間に影響する特定の費用であって，その発生が当期以前の事象に起因し，発生の可能性が高く，かつ，その金額を合理的に見積ることができる場合には，当期の負担に属する金額を当期の費用又は損失として引当金に繰入れる。","a":false,"c":"","e":"将来の特定の費用又は損失\n「将来の期間に影響する特定の費用」は繰延資産計上の対象となる費用である"},{"l":3,"m":"","sb":"","i":"A","r":"","q":"引当金の残高は貸借対照表の負債の部に記載される。","a":false,"c":"","e":"引当金の残高は貸借対照表の負債の部又は資産の部に記載される\n例えば貸倒引当金である"},{"l":4,"m":"","sb":"","i":"C","r":"","q":"財貨又は用役の消費の事実をもって費用が発生すると捉えた場合，売上債権に係る貸倒引当金繰入は，保守主義の原則が設定根拠となる。","a":false,"c":"","e":"掛取引により売上の獲得が促進されるため，費用収益対応の原則が設定根拠となる\n損失性の引当金（債務保証損失引当金等）は，売上収益獲得に貢献しないため保守主義が設定根拠となる"},{"l":5,"m":"","sb":"","i":"C","r":"","q":"「企業会計原則注解」注18には引当金として，貸倒引当金，減価償却引当金，製品保証引当金，工事補償引当金，返品調整引当金，売上割戻引当金，賞与引当金，退職給付引当金，修繕引当金，特別修繕引当金，債務保証損失引当金，損害補償損失引当金が限定列挙されている。","a":false,"c":"","e":"減価償却引当金・限定列挙\n減価償却引当金は，将来の特定の費用という引当金の設定要件に合致しないため，引当金として列挙されていない。また，「企業会計原則注解」注18では引当金が例示列挙されている"},{"l":6,"m":"","sb":"","i":"A","r":"","q":"負債性引当金のうち，通常1年以内に使用される見込のものは流動負債に表示し，通常1年を超えて使用される見込のものは，固定負債に表示する。","a":true,"c":"","e":"賞与引当金，工事補償引当金，修繕引当金等，通常1年以内に使用見込のものは流動負債に表示し，退職給付引当金，特別修繕引当金等，通常1年をこえて使用見込のものは固定負債に表示する"},{"l":7,"m":"","sb":"","i":"A","r":"","q":"「企業会計原則注解」注18では，負債の計算を重視して引当金の設定が行われている。","a":false,"c":"","e":"損益計算を重視して引当金の設定が行われている。\n注18によれば，負債性引当金は費用又は損失の相手勘定として債務性の有無を問わず負債に計上される"},{"l":8,"m":"","sb":"","i":"A","r":"","q":"「企業会計原則注解」注18は，貨幣の時間価値が重要である場合には，引当金の測定にあたって，合理的に見積られた当期の負担に属する金額を現在価値に割り引くことを求めている。","a":false,"c":"","e":"引当金の測定にあたって具体的な測定方法を定めていない"},{"l":9,"m":"","sb":"","i":"A","r":"","q":"発生の可能性の低い偶発事象に係る費用又は損失であっても，その金額を合理的に見積ることができる場合，保守主義の観点から引当金の計上が認められる。","a":false,"c":"","e":"過度の保守主義に該当し，引当金の計上は認められない"},{"l":10,"m":"","sb":"","i":"B","r":"","q":"負債性引当金と未払費用はいずれも期間損益計算の適正化の観点から計上されるものであり，また，金額の測定に恣意性が介入する点で共通する。","a":false,"c":"","e":"未払費用は契約に基づいて測定されるため恣意性は介入しない"},{"l":11,"m":"","sb":"","i":"B","r":"","q":"引当金の要件を満たすかどうかに関わらず，引当金として処理され，負債の部に計上する。","a":false,"c":"","e":"引当金の要件を満たす場合，引当金として処理され，負債の部に計上するが，引当金の要件を満たさない場合，剰余金の処分により任意積立金として純資産の部に計上する"},{"l":12,"m":"","sb":"","i":"B","r":"","q":"特別法上の準備金のうち，引当金の計上要件を満たさないものは，剰余金の処分により任意積立金として処理し，純資産の部に記載する。","a":false,"c":"","e":"引当金の計上要件を満たさないものも，引当金と同様に処理し，固定負債の次に別の区分を設けて負債の部に記載する\n特定業種の公益性の観点から，引当金の計上要件を満たさない場合も負債を計上し資金留保を図る"},{"l":13,"m":"","sb":"","i":"B","r":"","q":"偶発債務について，損失の発生の可能性が高いとはいえない場合や損失金額を合理的に見積ることができない場合，偶発債務の内容を貸借対照表に注記する。","a":true,"c":"","e":""},{"l":14,"m":"","sb":"","i":"B","r":"","q":"債務保証を行った場合の偶発債務について注記する金額は，債務保証の総額である。","a":false,"c":"","e":"注記する金額は，債務保証の総額から引当金設定額を控除した残額である"},{"l":15,"m":"","sb":"","i":"B","r":"","q":"債務保証損失引当金は，債務保証の履行に要した額をもって計上する。","a":false,"c":"","e":"債務保証額から，主たる債務者の返済可能額及び担保により保全される額等の求償債権について，の回収見積額を控除した額"},{"l":16,"m":"","sb":"","i":"C","r":"","q":"債権者から保証債務の履行請求を受けた場合，負担すべき債務を債務保証損失引当金に計上する。","a":false,"c":"","e":"未払金等に計上"},{"l":17,"m":"","sb":"","i":"B","r":"","q":"債務保証損失引当金の目的取崩額と求償債権に対する貸倒引当金繰入額又は貸倒損失は，それぞれ総額で表示する。","a":false,"c":"","e":"相殺後の純額で表示\n保証債務の履行を請求された場合には，債務保証損失引当金の目的取崩となるが，債務保証損失引当金の目的取崩と貸倒引当金繰入又は貸倒損失処理は一連の会計処理と考えられるため，原則として，債務保証損失引当金の目的取崩額と求償債権に対する貸倒引当金繰入又は貸倒損失は，相殺後の純額で表示する"},{"l":18,"m":"","sb":"","i":"C","r":"","q":"株主優待に係るコストは利益配当として処理する。","a":false,"c":"","e":"費用処理\n株主優待の内容は所有株数に完全に比例せず，一般的に利益配当と異なっていることから引当金の計上を通じて費用処理する"},{"l":19,"m":"","sb":"","i":"C","r":"","q":"財務諸表作成時において従業員への賞与支給額が確定している場合，当期に帰属する額を未払費用として計上する。","a":false,"c":"","e":"支給額が支給対象期間に対応して算定されている場合，未払費用に計上。支給対象期間以外の臨時的な要因に基づいて算定されたものである場合，未払金に計上\n財務諸表作成時において従業員への賞与支給額が確定していない場合には，支給見込額のうち当期に帰属する額を賞与引当金として計上する"}]},{"n":6,"name":"財務会計の概念フレームワーク","qs":[{"l":1,"m":"","sb":"","i":"C","r":"","q":"企業会計原則は，演繹的アプローチによって形成された会計基準である。","a":false,"c":"","e":"帰納的アプローチ"},{"l":2,"m":"","sb":"","i":"C","r":"","q":"概念フレームワークに関する次の①～④を適切なものと適切でないものに分類しなさい。①既存の基礎的な前提や概念を要約したものであり，吟味と再検討を加えた結果は反映されていない。②現行の会計基準の一部を説明できないものや，いまだ基準化されていないものは含まれていない。③会計基準間の理論的整合性を確保するため，個別具体的な会計基準の新設・改廃をただちに提案している。④概念フレームワークだけでは，個別の会計基準の具体的な内容を直接定めることはできない。","a":false,"c":"","e":"適切なもの：④。適切でないもの：①吟味と再検討を加えた結果が反映されている。②現行の会計基準の一部を説明できないものや，いまだ基準化されていないものが含まれていたりする。③個別具体的な会計基準の新設・改廃をただちに提案するものではない。"},{"l":3,"m":"","sb":"","i":"B","r":"","q":"情報の非対称性は，証券の発行市場で問題となるが，流通市場では問題とならない。","a":false,"c":"","e":"情報の非対称性は，証券の発行市場のみならず流通市場においても問題となる\n将来の売買機会が保証されない限り，投資家は発行市場において証券の購入に応じないため流通市場でも問題となる"},{"l":4,"m":"","sb":"","i":"A","r":"","q":"投資の成果を示す利益情報は基本的に過去の成果を表すため，企業価値評価の基礎となる将来キャッシュ・フローの予測に有用ではない。","a":false,"c":"","e":"将来キャッシュ・フローの予測に広く用いられており有用である"},{"l":5,"m":"","sb":"","i":"A","r":"","q":"利益の情報を利用することは，同時に，利益を生み出す投資のストックの情報を利用することも含意している。","a":true,"c":"","e":"投資の成果の絶対的な大きさのみならず，投資のストックと比較した収益性（効率性）も重視されるため"},{"l":6,"m":"","sb":"","i":"B","r":"","q":"情報の非対称性を緩和するための会計情報が，その内容を規制する会計基準は，市場が効率的であれば不要になる。","a":false,"c":"","e":"市場が効率的であっても不要になるわけではない"},{"l":7,"m":"","sb":"","i":"A","r":"","q":"投資家とは，証券市場で取引される株式や社債などに投資する者をいい，これらを保有する可能性があるに過ぎない者は含まれない。","a":false,"c":"","e":"株式や社債などを保有する可能性があるに過ぎない者も投資家に含まれる"},{"l":8,"m":"","sb":"","i":"B","r":"","q":"概念フレームワークでは，原則として，分析能力をもたない投資家が想定されている。","a":false,"c":"","e":"一定以上の分析能力をもった投資家が想定されている"},{"l":9,"m":"","sb":"","i":"A","r":"","q":"会計情報には，企業価値それ自体を表現することが期待されている。","a":false,"c":"","e":"企業価値それ自体を表現するものではない"},{"l":10,"m":"","sb":"","i":"B","r":"","q":"特定の事業について情報優位にある経営者は企業価値の推定についても投資家より高い能力を持つことから，その推定値の開示が経営者に期待されている。","a":false,"c":"","e":"事実の開示が期待されている"},{"l":11,"m":"","sb":"","i":"A","r":"","q":"ディスクロージャー制度において開示される会計情報は，主として企業関係者の間の私的契約等を通じた利害調整に利用されている。","a":false,"c":"","e":"利害調整にも副次的に利用されている"},{"l":12,"m":"","sb":"","i":"A","r":"","q":"会計基準の設定にあたり重視されるのは財務報告の目的の達成であるため，会計情報の副次的な利用の事実は，会計基準を設定・改廃する際の制約とならない。","a":false,"c":"","e":"会計基準を設定・改廃する際の制約となることがある"},{"l":13,"m":"","sb":"","i":"B","r":"","q":"概念フレームワークは現行の会計基準や会計実務を帰納要約的に記述したものである。","a":false,"c":"","e":"現行の会計基準や会計実務を帰納要約的に記述したものではなく，財務報告の目的の達成にとって有益であるか否か，必要であるか否かという判断が反映されている"},{"l":14,"m":"","sb":"","i":"B","r":"","q":"内的整合性と比較可能性は，会計情報が利用者の意思決定にとって有用であるか否かを直接判定する規準として機能する。","a":false,"c":"","e":"意思決定との関連性や信頼性が満たされているか否かを間接的に推定する際に利用される\n意思決定有用性を直接判定する規準として機能するのは，意思決定との関連性と信頼性である"},{"l":15,"m":"","sb":"","i":"B","r":"","q":"会計情報に求められる最も重要な特性は，意思決定との関連性である。","a":false,"c":"","e":"意思決定有用性である"},{"l":16,"m":"","sb":"","i":"B","r":"","q":"意思決定有用性を支える特性として，意思決定との関連性，信頼性，内的整合性がある。","a":false,"c":"","e":"意思決定有用性を支える特性は，意思決定との関連性と信頼性であり，内的整合性は比較可能性とともに一般的制約となる特性である"},{"l":17,"m":"","sb":"","i":"B","r":"","q":"わが国の概念フレームワークでは，諸外国と同様に，理解可能性，コストとベネフィットの斟酌などが独立の特性として採り上げられている。","a":false,"c":"","e":"独立の特性として採り上げられていない"},{"l":18,"m":"","sb":"","i":"B","r":"","q":"情報価値の存在が確認されていない限り，新しく提供されようとしている会計情報は，信頼性をもつものと期待することはできない。","a":false,"c":"","e":"情報ニーズの充足のために新しく提供されようとしている会計情報は，意思決定との関連性をもつものと期待することができる"},{"l":19,"m":"","sb":"","i":"B","r":"","q":"信頼性とは，客観性・検証可能性・表現の忠実性などに支えられ，会計情報が信頼に足る情報であることをいう。","a":false,"c":"","e":"中立性・検証可能性・表現の忠実性などに支えられている"},{"l":20,"m":"","sb":"","i":"B","r":"","q":"測定に主観が入る見積り情報の場合，意思決定有用性は認められない。","a":false,"c":"","e":"意思決定との関連性と信頼性との間で生じるトレードオフを考慮して新たな基準のもとで期待される会計情報の有用性を総合的に判断する"},{"l":21,"m":"","sb":"","i":"B","r":"","q":"検証可能性を高めるために監査のコストを抑えることは，会計基準を設定する目的となり得る。","a":false,"c":"","e":"会計基準を設定する目的とはなり得ない"},{"l":22,"m":"","sb":"","i":"B","r":"","q":"意思決定との関連性と信頼性は完全に独立している。","a":false,"c":"","e":"完全に独立しているわけではない\n例えば表現の忠実性に関する事実を会計データにどう置き換えるのかという問題は，情報価値を左右する"},{"l":23,"m":"","sb":"","i":"B","r":"","q":"会計基準は少数の基礎概念に支えられた1つの体系をなしており，意思決定との関連性がその体系の目標仮説となっている。","a":false,"c":"","e":"意思決定有用性が目標仮説となっている"},{"l":24,"m":"","sb":"","i":"C","r":"","q":"概念フレームワークに準拠して会計基準を設定することは，内的整合性を満たすうえでの十分条件である。","a":false,"c":"","e":"内的整合性を満たすうえでの必要条件であっても，十分条件ではない"},{"l":25,"m":"","sb":"","i":"C","r":"","q":"内的整合性は特定の会計手続が毎期継続的に適用されることを要請するものである。","a":false,"c":"","e":"内的整合性は個別の会計基準が会計基準全体を支える基本的考え方と矛盾しないことを要請する\n特定の会計手続が毎期継続的に適用されることを要請するのは首尾一貫性である"},{"l":26,"m":"","sb":"","i":"C","r":"","q":"内的整合性は既存の会計基準の体系との整合性を要求しており，慣行の維持，継続を目的とする。","a":false,"c":"","e":"内的整合性は，慣行の維持，継続を目的とするものではない\n既存の会計基準の体系が有用な会計情報を生み出しているという合意が崩れた状況では，概念フレームワーク自体を改訂することが想定されている"},{"l":27,"m":"","sb":"","i":"A","r":"","q":"会計情報が比較可能であるためには，会計処理の選択肢を少なくすることや画一的な会計処理を要請することが有効である。","a":false,"c":"","e":"同じ取引や事象には同じ会計処理が行われ，異なる取引や事象には異なる会計処理が行われなければならない"},{"l":28,"m":"","sb":"","i":"B","r":"","q":"比較可能性が確保されるためには，財務諸表の報告様式の統一はもちろん，企業において同一の会計方法が継続的に（首尾一貫して）適用されなければならない。","a":true,"c":"","e":"変更に際しては，利用者の比較作業に資するための情報の開示が必要となる。また，会計基準が変更された場合の移行措置を検討したり，注意喚起のために注記で開示すべき項目や内容を決めたりする場合にも，比較可能性が考慮されなければならない"},{"l":29,"m":"","sb":"","i":"B","r":"","q":"比較可能性を確保するには，2つの取引の法的形式が異なっているが，実質が同じ場合，同じ会計処理が適用される。","a":true,"c":"","e":"例えば，ファイナンス・リースと資産の割賦購入取引には，同じ会計処理が適用される"},{"l":30,"m":"","sb":"","i":"A","r":"","q":"概念フレームワークでは，包括利益と関連させて収益と費用の定義を導出している。","a":false,"c":"","e":"純利益と関連させて収益と費用の定義を導出している"},{"l":31,"m":"","sb":"","i":"A","r":"","q":"財務諸表の構成要素の定義及び認識要件を充足するものは，財務諸表に計上しなければならない。","a":false,"c":"","e":"財務報告の目的と財務諸表の役割に適合しないもの（例えば自己創設のれん）は，財務諸表の構成要素とならない"},{"l":32,"m":"","sb":"","i":"A","r":"","q":"自己創設のれんの計上は，経営者による企業価値の自己評価・自己申告を意味し，資産の定義を満たさないため，資産として計上することは否定される。","a":false,"c":"","e":"自己創設のれんは資産の定義を満たす"},{"l":33,"m":"","sb":"","i":"B","r":"","q":"財務諸表の構成要素として，資産や負債，純資産，株主資本，包括利益，純利益，収益，費用，現金及び現金同等物が定義されている。","a":false,"c":"","e":"キャッシュ・フロー計算書の構成要素である現金及び現金同等物は定義されていない"},{"l":34,"m":"","sb":"","i":"B","r":"","q":"財務諸表の構成要素についてまず資産と負債を定義しているのは，これらの構成要素を特に重視しているためである。","a":false,"c":"","e":"まず資産と負債を定義しているのは，構成要素の定義を確定する作業を容易にするため"},{"l":35,"m":"","sb":"","i":"A","r":"","q":"資産とは，過去の取引又は将来の事象の結果として，報告主体が所有している経済的資源をいう。","a":false,"c":"","e":"過去の取引又は事象・報告主体が支配\n資産とは，過去の取引又は事象の結果として，報告主体が支配している経済的資源をいう"},{"l":36,"m":"","sb":"","i":"A","r":"","q":"経済的資源とは，キャッシュの獲得に貢献する便益の源泉をいい，実物財の形態をとる。","a":false,"c":"","e":"経済的資源は，実物財に限らず，金融資産及びそれらの同等物を含む"},{"l":37,"m":"","sb":"","i":"B","r":"","q":"経済的資源は，市場での処分可能性を有するものである。","a":false,"c":"","e":"市場での処分可能性を有するものもあれば，そうでないもの（例えば繰延資産）もある"},{"l":38,"m":"","sb":"","i":"B","r":"","q":"繰延費用は，資産の定義に反するため資産計上が否定される。","a":false,"c":"","e":"将来の便益が得られると期待できる繰延費用は，資産の定義には必ずしも反していない\n定義を満たす繰延費用の資産計上が否定されるとしたら，蓋然性等の認識・測定の要件又は制約による"},{"l":39,"m":"","sb":"","i":"A","r":"","q":"繰延収益は原則として負債となる。","a":false,"c":"","e":"純資産のうち株主資本以外の部分となる"},{"l":40,"m":"","sb":"","i":"B","r":"","q":"概念フレームワークにおける純利益と株主資本は親会社説を前提としている。","a":true,"c":"","e":"純利益と株主資本は親会社株主に帰属する部分であり，親会社説を前提としている"},{"l":41,"m":"","sb":"","i":"A","r":"","q":"純資産のうち，株主資本が特に定義づけられているのは，包括利益を生み出す投資の正味ストックを財務諸表の構成要素として位置づけるためである。","a":false,"c":"","e":"株主資本は純利益を生み出す投資の正味ストックである\n包括利益を生み出す投資の正味ストックは純資産である"},{"l":42,"m":"","sb":"","i":"A","r":"","q":"当期の包括利益から，当期のその他の包括利益を控除すれば，純利益が計算される。","a":false,"c":"","e":"包括利益のうち，当期のその他の包括利益を控除し，非支配株主に帰属する純利益を控除すると，純利益が計算される\n概念フレームワークによればその他の包括利益の控除は「包括利益から投資のリスクから解放されていない部分を除き，過年度に計上された包括利益のうち期中に投資のリスクから解放された部分を加えること」と説明されている"},{"l":43,"m":"","sb":"","i":"A","r":"","q":"概念フレームワークは，資産負債アプローチを重視しているため，純利益概念を排除して包括利益概念を採用している。","a":false,"c":"","e":"純利益概念と包括利益概念を併存させている"},{"l":44,"m":"","sb":"","i":"A","r":"","q":"非支配株主に帰属する純利益は，特定期間中にリスクから解放されていない投資の成果のうち，子会社の非支配株主に帰属する部分をいう。","a":false,"c":"","e":"特定期間中にリスクから解放された投資の成果"},{"l":45,"m":"","sb":"","i":"A","r":"","q":"純利益は，投下した資金と回収した資金の差額にあたるネット・キャッシュフローと各期の利益の合計が等しくなるという基本的な制約を満たすが，包括利益は当該制約を満たさない。","a":false,"c":"","e":"包括利益も当該制約を満たす"},{"l":46,"m":"","sb":"","i":"B","r":"","q":"金融投資は売却時点で投資のリスクから解放される。","a":false,"c":"","e":"時価の変動時点で投資のリスクから解放"},{"l":47,"m":"","sb":"","i":"B","r":"","q":"異種資産の交換にともなって，収益が認識される場合，リスクから解放された投資の成果とは，交換以前の事業のリスクに拘束されない資産の獲得を指す。","a":true,"c":"","e":""},{"l":48,"m":"","sb":"","i":"B","r":"","q":"上場している子会社株式及び関連会社株式やその他有価証券の時価評価差額は，実現可能な成果に該当しないが，リスクから解放された投資の成果に該当する。","a":false,"c":"","e":"実現可能な成果に該当するが，リスクから解放された投資の成果に該当しない\n実現可能な成果とは，現金またはその同等物への転換が容易である成果（あるいは容易になった成果）として意味づけられることが多く，市場性があれば該当する"},{"l":49,"m":"","sb":"","i":"B","r":"","q":"投資の成果がリスクから解放されるためには，実際にキャッシュが獲得される必要がある。","a":false,"c":"","e":"実質的にキャッシュの獲得とみなされる事象も含まれる\n例えば，異種資産の交換に伴って投資の清算・再投資が行われる場合を想定すればよい"},{"l":50,"m":"","sb":"","i":"B","r":"","q":"費用の認識に際して，投資のリスクからの解放は要求されていない。","a":false,"c":"","e":"投資のリスクからの解放が要求されている"},{"l":51,"m":"","sb":"","i":"C","r":"","q":"概念フレームワークでは，収益と利得，費用と損失を区別している。","a":false,"c":"","e":"収益と利得，費用と損失を特に区別することなく一括して収益，費用と称している"},{"l":52,"m":"","sb":"","i":"C","r":"","q":"資産や負債の増減を伴わず，純資産を構成する項目間の振替と同時に収益や費用が計上される例を2つ挙げなさい。","a":true,"c":"","e":"・新株予約権が失効した場合\n・過年度のその他の包括利益をリサイクリングした場合"},{"l":53,"m":"","sb":"","i":"B","r":"","q":"事業に拘束されている資産については，現実とは異なる売却取引等を仮定し，キャッシュ・インフローを擬制して，収益が把握される。","a":false,"c":"","e":"収益が把握されるわけではない"},{"l":54,"m":"","sb":"","i":"B","r":"","q":"金融商品に属する契約の一部は，双務未履行の段階で財務諸表に計上されている。","a":true,"c":"","e":"例えば，有価証券の発生の認識は原則として約定日基準が適用され，双務未履行であっても財務諸表に計上される"},{"l":55,"m":"","sb":"","i":"B","r":"","q":"発生の可能性に関する判断は，資産と負債の間で対称的になされるが，これは投資家の意思決定に有用な情報を提供する観点によるものである。","a":false,"c":"","e":"資産と負債の間で対称的になされるわけではない。投資家の意思決定に有用な情報を提供する観点による"},{"l":56,"m":"","sb":"","i":"B","r":"","q":"概念フレームワークは，資産負債アプローチの観点から，資産と負債の測定値を時価に統一することが財務報告の目的に役立つと考えている。","a":false,"c":"","e":"財務報告の目的を達成するためには，投資の状況に応じて多様な測定値が求められる\n原始取得原価や未償却原価と，市場価格などによる測定が困難な場合に限って適用が許容される測定値として消極的に考えるのではなく，それらを積極的に並列させている"},{"l":57,"m":"","sb":"","i":"B","r":"","q":"毎期一定額の利息収入が予定されている貸付金を当初の貸付額で測定した場合，これは取得原価，割引価値，入金予定額などとして意味づけることができる。","a":true,"c":"","e":"それぞれの測定値の意味は必ずしも相互に対立しているわけでも排他的でもないことから，1つの会計数値に対して複数の測定方法による意味づけができることを否定せず，解釈の余地を残したままとしている"},{"l":58,"m":"","sb":"","i":"B","r":"","q":"退職給付引当金は負債の測定値として独立した意味を持つ数値が付されている。","a":false,"c":"","e":"退職給付引当金は過去に消費された労働サービスに見合って計上されるものであり，負債の測定値として独立した意味を持たない数値が付されている"},{"l":59,"m":"","sb":"","i":"B","r":"","q":"未償却原価は取得原価の範疇に含まれない。","a":false,"c":"","e":"未償却原価は広義にとらえた取得原価の範疇に含まれる"},{"l":60,"m":"","sb":"","i":"B","r":"","q":"原始取得原価であれ未償却原価であれ，取得原価によって資産を測定する場合は，現在の投資行動をそのまま継続することが前提とされる。","a":true,"c":"","e":""},{"l":61,"m":"","sb":"","i":"A","r":"","q":"取得原価（未償却原価）による測定は，資産の価値を測定する上で重要な意味を持つ。","a":false,"c":"","e":"資産の利用に伴う費用を測定する上で重要な意味を持つ"},{"l":62,"m":"","sb":"","i":"C","r":"","q":"日本の現行基準においては，市場価格と時価が同じ意味で用いられている。","a":false,"c":"","e":"市場価格と時価は同じ意味ではない\n時価は市場価格に基づく価額をいうが，市場が存在しない場合には合理的に算定された価額が用いられる"},{"l":63,"m":"","sb":"","i":"B","r":"","q":"再調達原価の変動額は，資産を期末に売却したら生じたはずの損益（の一部）として意味づけられる。","a":false,"c":"","e":"資産の側連時期を遅らせていたならば生じたはずの損益\n資産を期末に売却したら生じたはずの損益（の一部）として意味づけられるのは，正味実現可能価額の変動額である"},{"l":64,"m":"","sb":"","i":"A","r":"","q":"利用価値は市場価格と並んで資産の客観的価値を表す代表的な指標の一つである。","a":false,"c":"","e":"報告主体の主観的な期待価値"},{"l":65,"m":"","sb":"","i":"A","r":"","q":"固定資産の減損処理に際して資産を利用価値で測定した場合には，自己創設のれんが計上される。","a":false,"c":"","e":"利用価値が取得原価を上回らないため，自己創設のれんは計上されない"},{"l":66,"m":"","sb":"","i":"B","r":"","q":"利用価値による測定が意味を持つ状況は，主観的な見積りを事実の代理とするしかない例外的なケースに限られる。","a":true,"c":"","e":""},{"l":67,"m":"","sb":"","i":"B","r":"","q":"被投資企業の純資産額に基づく額は，個別会計においては用いられていない。","a":false,"c":"","e":"被投資企業の純資産額に基づく額は，個別会計上，非上場株式の簿価切下げに用いられることがある。連結会計上は持分法による評価額として，関連会社株式等の測定に用いられている"},{"l":68,"m":"","sb":"","i":"B","r":"","q":"制度会計上，リスクを調整した割引率による割引価値はリース債務の測定に用いられる。","a":false,"c":"","e":"制度会計上，用いられていない"},{"l":69,"m":"","sb":"","i":"B","r":"","q":"自社が発行した社債を市場価格によって貸借対照表に計上し，その変動額を損益として認識する考え方によれば，自社の倒産可能性が高まることで，評価損が計上される。","a":false,"c":"","e":"自社の倒産可能性が高まることで，評価益が計上される"},{"l":70,"m":"","sb":"","i":"C","r":"","q":"制度会計上，負債の測定値として市場価格は用いられていない。","a":false,"c":"","e":"デリバティブ取引により生じる正味の債務等の測定に用いられている"},{"l":71,"m":"","sb":"","i":"C","r":"","q":"随時換金可能で，換金の機会が事業活動による制約を受けない資産については，換金による成果を期待して資金の回収と再投資が繰り返されているとみなすこともできるため，市場価格の変動によって，投資の成果が生じたと判断される。","a":true,"c":"","e":"例えば，売買目的有価証券に係る収益の認識が該当する"},{"l":72,"m":"","sb":"","i":"B","r":"","q":"財やサービスを継続的に提供する契約が存在する場合，相手方による契約の履行（代金の支払）が確実視されるときは，相手方の履行を待って契約価額の一部を収益として計上する。","a":false,"c":"","e":"報告主体が契約を部分的に履行しただけで，相手方の履行を待たずに契約価額の一部を収益として計上することができる"},{"l":73,"m":"","sb":"","i":"B","r":"","q":"被投資企業との間に一体性を見出せる場合，被投資企業の成果の帰属に着目して，投資企業の成果を計算することができる。この場合の収益の額は，被投資企業の純資産に持分割合を乗じた額として測定される。","a":false,"c":"","e":"被投資企業の純利益に持分割合を乗じた額"},{"l":74,"m":"","sb":"","i":"B","r":"","q":"財・サービスは消費を行った時点で費用化されるため，財・サービスの消費に伴う費用が資産に計上されることはない。","a":false,"c":"","e":"財・サービスの消費に伴う費用のうち，資産の定義と認識・測定の要件を充足するものについては，繰延費用として資産に計上されることもある"}]},{"n":7,"name":"注記事項等","qs":[{"l":1,"m":"","sb":"","i":"B","r":"","q":"重要な会計方針の開示目的は，財務諸表を作成するための基礎となる事項を財務諸表利用者が理解するために，採用した会計処理の原則及び手続の概要を示すことにある。ただし，特定の会計事象等に対して適用し得る具体的な会計基準等の定めが存在しない場合に，会計処理の原則及び手続を採用するときはこの限りではない。","a":false,"c":"","e":"重要な会計方針の開示目的は，特定の会計事象等に対して適用し得る具体的な会計基準等の定めが存在しない場合も同じである"},{"l":2,"m":"","sb":"","i":"B","r":"","q":"会計基準等の定めが明らかであり，当該会計基準等において代替的な会計処理の原則及び手続が認められていない場合には，会計方針に関する注記を省略することができる。","a":true,"c":"","e":""},{"l":3,"m":"","sb":"","i":"A","r":"","q":"その他有価証券の時価評価を行うに際しての時価の算定方法及び評価差額の取扱いは，会計方針として注記する。","a":false,"c":"","e":"時価の算定方法は開示する会計方針に含まれない\n従来は，その他有価証券の時価として，①期末日の市場価格に基づいて算定された価額又は②期末前1カ月の市場価格の平均に基づいて算定された価額の適用が認められていたため，時価の算定方法の注記が要求されていた。しかし，「時価の算定に関する会計基準」において，時価は算定日における価格であることが示され，②の適用が認められなくなったため，注記は不要とされた"},{"l":4,"m":"","sb":"","i":"B","r":"","q":"会計方針として注記する外貨建の資産及び負債の本邦通貨への換算基準は，「外貨建取引等会計処理基準」に定めがある事項に関する換算基準等について記載する。","a":false,"c":"","e":"「外貨建取引等会計処理基準」に定めのない事項に関する換算基準等について記載する"},{"l":5,"m":"","sb":"","i":"B","r":"","q":"将来の期間に影響する特定の費用を支出時に全額費用として処理する方法を採用している場合，繰延資産の処理方法についての注記を要しない。","a":false,"c":"","e":"注記を要する"},{"l":6,"m":"","sb":"","i":"B","r":"","q":"連結決算日後に主力製品の製造工場が火災により焼失し，重大な損害が発生した場合，当該連結決算日に作成される連結財務諸表に影響を及ぼすため，修正後発事象として扱う。","a":false,"c":"","e":"開示後発事象として扱う\n例えば，決算日後に生じた販売先の倒産により，決算日において既に売掛債権に損失が存在していたことが裏付けられた場合には，修正後発事象として貸倒引当金を追加計上しなければならない"},{"l":7,"m":"","sb":"","i":"A","r":"","q":"連結子会社と関連当事者が行った取引は，個別財務諸表及び連結財務諸表において開示不要である。","a":false,"c":"","e":"連結財務諸表上は開示が必要である\n連結財務諸表においては，連結会社と関連当事者の取引を開示する"},{"l":8,"m":"","sb":"","i":"B","r":"","q":"個別財務諸表上は，重要な子会社の役員は関連当事者に該当しない。","a":true,"c":"","e":"なお，連結財務諸表上，重要な子会社の役員は関連当事者に該当する"},{"l":9,"m":"","sb":"","i":"B","r":"","q":"無償取引や低廉な価格での取引については，重要性が乏しいと考えられるため，関連当事者との取引の開示対象とならない。","a":false,"c":"","e":"独立第三者間取引であったと仮定した場合の金額に基づき重要性が高いと判断された場合，開連当事者との取引の開示対象となる"},{"l":10,"m":"","sb":"","i":"B","r":"","q":"わが国の会計基準では，国際会計基準と同様に，関連当事者とする株主を議決権で判断することは明示していない。","a":false,"c":"","e":"関連当事者に含まれる主要株主とは，議決権の10%以上を保有している株主をいう"},{"l":11,"m":"","sb":"","i":"B","r":"","q":"連結財務諸表上，重要な子会社の役員は関連当事者に含まれるが，親会社の役員は含まれない。","a":false,"c":"","e":"親会社の役員は関連当事者の範囲に含まれる"},{"l":12,"m":"","sb":"","i":"B","r":"","q":"重要な子会社の役員は，連結財務諸表上，連結財務諸表作成会社が直接議決権を有することを条件として関連当事者の範囲に含まれる。","a":false,"c":"","e":"関連当事者の範囲に含まれる子会社の役員は，重要な子会社の役員であり，連結財務諸表作成会社が直接議決権を有することは条件とされていない"},{"l":13,"m":"","sb":"","i":"C","r":"","q":"主要株主及び役員の近親者の範囲については，主要株主若しくは役員に影響を与えると予測される親族と規定されている。","a":false,"c":"","e":"近親者は開示対象を可能な限り明確化する観点から二親等以内の親族と規定されている"},{"l":14,"m":"","sb":"","i":"B","r":"","q":"創業者等で役員を退任した者は関連当事者に該当しない。","a":false,"c":"","e":"会社内における地位や職務等からみて実質的に会社の経営に強い影響を及ぼしていると認められる場合には，役員として関連当事者に該当する"},{"l":15,"m":"","sb":"","i":"B","r":"","q":"関連当事者に含まれるその他の関係会社には，共同支配企業が含まれる。","a":false,"c":"","e":"共同支配投資企業が含まれる"},{"l":16,"m":"","sb":"","i":"C","r":"","q":"従業員のための企業年金は，企業年金と会社の間で掛金の拠出以外の重要な取引を行う場合に限り，関連当事者に該当する。","a":true,"c":"","e":""},{"l":17,"m":"","sb":"","i":"B","r":"","q":"関連当事者との取引のうち，一般競争入札による取引は開示対象外となるが，配当の受取りは開示対象となる。","a":false,"c":"","e":"配当の受取りも開示対象外となる"},{"l":18,"m":"","sb":"","i":"B","r":"","q":"関連会社と当該関連会社以外の関連当事者との取引で連結財務諸表に重要な影響を及ぼす取引は，開示対象となる。","a":false,"c":"","e":"連結会社が直接関わらない関連当事者同士の取引については，開示対象とならない\n連結会社が直接関わらない関連当事者同士の取引については，正確かつ網羅的な情報の入手が困難であることや，連結財務諸表に与える影響が軽微な場合が多いと考えられるため"},{"l":19,"m":"","sb":"","i":"B","r":"","q":"会社と関連当事者との間での増資の引受けや自己株式の取得，公募増資などの資本取引は開示対象の取引となる。","a":false,"c":"","e":"公募増資は，取引条件が一般の取引と同様であることが明白な取引に該当するため，開示対象外の取引と考えられる"},{"l":20,"m":"","sb":"","i":"B","r":"","q":"関連当事者との取引のうち，役員に対する報酬，賞与の支払いは開示対象外となるが，退職慰労金の支払いは開示対象となる。","a":false,"c":"","e":"退職慰労金の支払いも開示対象外となる"},{"l":21,"m":"","sb":"","i":"B","r":"","q":"関連当事者に対する貸倒懸念債権及び破産更生債権等に係る情報（貸倒引当金繰入額，貸倒損失等）は，個々の関連当事者ごとに記載しなければならない。","a":false,"c":"","e":"関連当事者の種類ごとに合算して記載することもできる"},{"l":22,"m":"","sb":"","i":"B","r":"","q":"重要な関連会社が存在する場合には，取引の有無にかかわらず，その名称を開示するが，当該関連会社の財務情報については，持分法を通じて開示されているため不要である。","a":false,"c":"","e":"重要な関連会社の業績が悪化した場合，企業集団の財政状態や経営成績に多大な影響を及ぼす可能性があるため，要約財務情報の開示が必要である\nなお，親会社が存在する場合には，親会社の名称等を開示する"},{"l":23,"m":"","sb":"","i":"A","r":"","q":"連結財務諸表ではセグメント情報等の開示が要求されているが，個別財務諸表では開示されていない。","a":false,"c":"","e":"個別財務諸表においてもセグメント情報等の開示が要求されている\nなお，連結財務諸表でセグメント情報等の開示を行っている場合は，個別財務諸表での開示を要しない"},{"l":24,"m":"","sb":"","i":"C","r":"","q":"比較可能性の確保は意思決定との関連性の確保に優先するため，セグメント情報の開示にマネジメント・アプローチが導入された。","a":false,"c":"","e":"意思決定との関連性の確保は比較可能性の確保に優先する"},{"l":25,"m":"","sb":"","i":"B","r":"","q":"企業の事業活動に障害を生じさせると考えられる場合には，マネジメント・アプローチに基づくセグメント情報の開示が免除される。","a":false,"c":"","e":"セグメント情報の開示は免除されない"},{"l":26,"m":"","sb":"","i":"A","r":"","q":"企業の本社又は特定の部門は，企業を構成する一部のため，事業セグメント又は事業セグメントの一部となる。","a":false,"c":"","e":"本社又は特定の部門は，収益を稼得していない又は付随的な収益を稼得するに過ぎないため，事業セグメント又は事業セグメントの一部とならない\n新たな事業を立ち上げたときのように，現時点では収益を稼得していない事業活動を事業セグメントとして識別する場合もある"},{"l":27,"m":"","sb":"","i":"A","r":"","q":"最高経営意思決定機関には，最高経営責任者（CEO）又は最高執行責任者（COO）といった個人は含まれない。","a":false,"c":"","e":"最高経営責任者（CEO）又は最高執行責任者（COO）といった個人も含まれる"},{"l":28,"m":"","sb":"","i":"B","r":"","q":"企業は，売上高，利益又は損失の絶対値，資産の量的基準のすべてを満たす事業セグメントを報告セグメントとして開示しなければならない。","a":false,"c":"","e":"いずれかを満たす\n量的基準のいずれにも満たない事業セグメントを報告セグメントとして開示することを妨げない"},{"l":29,"m":"","sb":"","i":"C","r":"","q":"量的基準の判定に際しては，事業セグメント間の内部売上高又は振替高及び同一セグメント内の売上高を含めない。","a":false,"c":"","e":"量的基準の判定に際しては，事業セグメント間の内部売上高又は振替高を含めるが，同一セグメント内の売上高は含めない"},{"l":30,"m":"","sb":"","i":"B","r":"","q":"報告セグメントの外部顧客への売上高の合計額が損益計算書の売上高の50%未満である場合には，損益計算書の売上高の50%以上が報告セグメントに含まれるまで，報告セグメントとする事業セグメントを追加して識別しなければならない。","a":false,"c":"","e":"75%"},{"l":31,"m":"","sb":"","i":"B","r":"","q":"「セグメント情報等の開示に関する会計基準」では，報告セグメントの数に一定の限度が定められている。","a":false,"c":"","e":"報告セグメントの数に一定の限度は定められていない"},{"l":32,"m":"","sb":"","i":"B","r":"","q":"企業は，各報告セグメントの利益（損失），資産及び負債の額を開示しなければならない。","a":false,"c":"","e":"報告セグメントの負債は，最高経営意思決定機関に対して，情報が定期的に提供され，使用されている場合に開示しなければならない"},{"l":33,"m":"","sb":"","i":"B","r":"","q":"セグメント情報の各項目の測定方法については，財務諸表を作成するために採用される会計処理の原則及び手続に準拠することが求められている。","a":false,"c":"","e":"最高経営意思決定機関に報告される金額を用いるのであり，財務諸表を作成するために採用される会計処理の原則及び手続に準拠することは求められていない"},{"l":34,"m":"","sb":"","i":"C","r":"","q":"開示される報告セグメント利益の額は，営業利益や経常利益を開示する。","a":false,"c":"","e":"利益は，最高経営意思決定機関に報告される金額に基づいて開示される必要があり，営業利益や経常利益に限られない"},{"l":35,"m":"","sb":"","i":"C","r":"","q":"報告セグメントの利益の合計額と連結損益計算書の利益計上額が異なる場合，差異調整に関する事項を開示するが，連結損益計算書の利益としては当期純利益を開示する。","a":false,"c":"","e":"連結損益計算書の利益は，営業利益，経常利益，税金等調整前当期純利益，当期純利益又は親会社株主に帰属する当期純利益のうち，いずれか適当と判断される科目を開示する"},{"l":36,"m":"","sb":"","i":"B","r":"","q":"報告セグメントの区分方法を変更し，前年度のセグメント情報を当年度の区分方法により作り直した情報を開示することが実務上困難な場合，当年度のセグメント情報を前年度の区分方法により作成した情報を開示することは認められない。","a":false,"c":"","e":"認められる"},{"l":37,"m":"","sb":"","i":"B","r":"","q":"報告すべきセグメントが1つしかなく，セグメント情報を開示しない企業であっても，セグメント情報の関連情報を開示しなければならない。","a":true,"c":"","e":"なお，セグメント情報の関連情報は，製品及びサービスに関する情報，地域に関する情報，主要な顧客に関する情報である"},{"l":38,"m":"","sb":"","i":"B","r":"","q":"セグメント情報の関連情報，固定資産の減損損失に関する報告セグメント別情報及びのれんに関する報告セグメント別情報として開示される金額は，最高経営意思決定機関に報告される数値による。","a":false,"c":"","e":"財務諸表を作成するために採用した会計処理に基づく数値による"},{"l":39,"m":"","sb":"","i":"C","r":"","q":"財務諸表の遡及処理を行う場合は，前年度のセグメント情報等について，遡及処理の影響を反映した情報を開示する。","a":true,"c":"","e":""},{"l":40,"m":"","sb":"","i":"A","r":"","q":"次の①～⑦について，「賃貸等不動産の時価等の開示に関する会計基準」の適用対象となるものを選びなさい。①棚卸資産に分類されている不動産②物品の製造や販売，サービスの提供，経営管理に使用されている不動産③貸借対照表において，投資不動産として区分されている不動産④将来，使用が見込まれていない遊休不動産⑤将来において，賃貸等不動産として使用される予定で開発中の不動産や継続して賃貸等不動産として使用される予定で再開発中の不動産⑥一時的に借手が存在していない不動産⑦オペレーティング・リース取引の貸手における不動産","a":false,"c":"","e":"適用対象となるもの：③，④，⑤，⑥，⑦。①（ならない）販売努力をいかに行うかによってその成果が異なるため②（ならない）企業にとっての価値は，通常，市場の平均的な期待で決まる時価ではないため③（なる）市場平均を超える成果を期待して保有されているものではないため④（なる）処分によるキャッシュ・フローしか期待されていないため⑤～⑦（なる）会計基準に記述なし。なお，ファイナンス・リースに該当する不動産については，貸借対照表上，貸手において不動産ではなく金銭債権等として計上されるため，賃貸等不動産には該当しない。"},{"l":41,"m":"","sb":"","i":"C","r":"","q":"開示対象となる賃貸等不動産以外の不動産については，時価を開示してはならない。","a":false,"c":"","e":"開示対象となる賃貸等不動産以外の不動産についても，時価を開示することは妨げられない"},{"l":42,"m":"","sb":"","i":"C","r":"","q":"有形固定資産に分類されている賃貸されているオフィスビルや駐車場などの不動産は，賃貸等不動産に該当しない。","a":false,"c":"","e":"有形固定資産に分類されている賃貸されているオフィスビルや駐車場などの不動産は，賃貸されているという外形を重視して賃貸等不動産に該当する"},{"l":43,"m":"","sb":"","i":"C","r":"","q":"連結財務諸表において賃貸等不動産の時価等の開示を行っている場合には，個別財務諸表での開示を要しない。","a":true,"c":"","e":""},{"l":44,"m":"","sb":"","i":"B","r":"","q":"1株当たり当期純利益は，普通株式に係る当期純利益を普通株式の期末株式数で除して算定する。","a":false,"c":"","e":"普通株式の期中平均株式数で除して算定"},{"l":45,"m":"","sb":"","i":"B","r":"","q":"連結財務諸表において期中平均自己株式数には，子会社及び関連会社が保有する親会社等の発行する普通株式数を含める。","a":false,"c":"","e":"子会社及び関連会社が保有する親会社等の発行する普通株式数のうち，親会社等の持分に相当する株式数を含める"},{"l":46,"m":"","sb":"","i":"B","r":"","q":"1株当たり当期純利益の算定上，優先配当額は当期純利益から控除しない。","a":false,"c":"","e":"1株当たり当期純利益の算定の目的は，普通株主に関する企業の成果を示すことにあるため，普通株主に帰属しない優先配当額は，当期純利益から控除する\n当期純利益から控除される優先配当は，留保利益から行われるものに限られ，その他資本剰余金の処分によるものは含まれない"},{"l":47,"m":"","sb":"","i":"B","r":"","q":"当期純損失の場合には，1株当たり当期純損失の算定は不要とされている。","a":false,"c":"","e":"当期純損失の場合にも，当期純利益の場合と同様に，1株当たり当期純損失を算定する\n当期純損失の場合には，潜在株式調整後1株当たり当期純利益の算定は不要とされている"},{"l":48,"m":"","sb":"","i":"B","r":"","q":"連結財務諸表における1株当たり当期純利益は，連結損益計算書における当期純利益を基礎として算定する。","a":false,"c":"","e":"連結損益計算書における親会社株主に帰属する当期純利益を基礎として算定する"},{"l":49,"m":"","sb":"","i":"C","r":"","q":"ワラントの希薄化効果を反映させる方式としては，無調整方式，自己株式方式，利益調整方式があり，それらの中から選択する。","a":false,"c":"","e":"自己株式方式が採用されている"},{"l":50,"m":"","sb":"","i":"C","r":"","q":"潜在株式に係る権利の行使を仮定することにより算定した1株当たり当期純利益が，1株当たり当期純利益を下回る場合，当該潜在株式は希薄化効果を有し，潜在株式調整後1株当たり当期純利益が開示される。","a":true,"c":"","e":""},{"l":51,"m":"","sb":"","i":"C","r":"","q":"潜在株式が複数存在する場合は，最小希薄化効果を反映した潜在株式調整後1株当たり当期純利益を算定する。","a":false,"c":"","e":"最大希薄化効果を反映した潜在株式調整後1株当たり当期純利益を算定する"},{"l":52,"m":"","sb":"","i":"C","r":"","q":"潜在株式が存在しない場合や1株当たり当期純損失の場合には，その旨を開示し，潜在株式調整1株当たり当期純利益の開示は行わない。","a":true,"c":"","e":""},{"l":53,"m":"","sb":"","i":"B","r":"","q":"当期の貸借対照表日後に株式併合又は株式分割が行われた場合，開示後発事象として注記を行うのみであり，1株当たり当期純利益及び潜在株式調整後1株当たり当期純利益の算定に，当該株式併合又は株式分割の影響を反映させない。","a":false,"c":"","e":"普通株式の期中平均株式数を，表示する財務諸表のうち，最も古い期間の期首に当該併合又は分割が行われたと仮定して計算する\n当期に株式併合又は株式分割が行われた場合も同様に計算する"},{"l":54,"m":"","sb":"","i":"C","r":"","q":"会計方針の変更又は過去の誤謬の訂正により財務諸表に遡及適用又は修正再表示が行われた場合，表示する過去の期間の1株当たり当期純利益及び潜在株式調整1株当たり当期純利益を遡及適用後又は修正再表示後の金額により算定する必要はない。","a":false,"c":"","e":"遡及適用後又は修正再表示後の金額により算定する"},{"l":55,"m":"","sb":"","i":"C","r":"","q":"金融商品の時価等に関する事項の注記は，貸付金・借入金などの金銭債権債務を除く金融商品が対象とされている。","a":false,"c":"","e":"貸付金・借入金などの金銭債権債務を含む金融商品全体が対象\n借入金などの金銭債務の時価情報の注記については，企業自身の信用リスクが増加した場合にその時価が減少するため，投資者にとって有用な情報を提供することにはならないのではないかという見方がある。しかしながら，金銭債務の時価を注記することは当該時価を財務諸表に反映することとは異なること等の理由から金銭債務の時価も開示対象とされている"},{"l":56,"m":"","sb":"","i":"A","r":"","q":"貸借対照表日において，継続企業の前提に重要な疑義を生じさせるような事象又は状況が存在する場合には，関連する情報を財務諸表に注記する","a":false,"c":"","e":"本問の場合であって，当該事象又は状況を解消し，又は改善するための対応をしてもなお継続企業の前提に関する重要な不確実性が認められるときは，関連する情報を財務諸表に注記する"},{"l":57,"m":"","sb":"","i":"C","r":"","q":"1株当たり純資産額算定上の，普通株式に係る期末の純資産額には，評価・換算差額等（その他の包括利益累計額）を含めない。","a":false,"c":"","e":"普通株式に係る期末の純資産額には，新株予約権及び非支配株主持分は含めないが，評価・換算差額等（その他の包括利益累計額）を含める"},{"l":58,"m":"","sb":"","i":"A","r":"","q":"財務諸表には，財務諸表等規則において特に定める注記のほか，利害関係人が会社の財政状態，経営成績及びキャッシュ・フローの状況に関する適正な判断を行うために必要と認められる事項があるときは，当該事項を注記しなければならない。","a":true,"c":"","e":"いわゆる追加情報の注記である。例えば，保証債務の履行に伴う損失の発生の可能性が高いが，金額の見積りが不可能な場合，及び損失の発生がある程度予想される場合には，その旨，主たる債務者の財政状態，主たる債務者と保証人との関係内容，主たる債務者の債務履行についての今後の見通し等，その状況を適切に説明するために必要な事項を追加情報として注記する"},{"l":59,"m":"","sb":"","i":"B","r":"","q":"①～⑤のうち「時価の算定に関する会計基準」の適用範囲に含まれるものを指摘しなさい。①「金融商品に関する会計基準」における金融商品②トレーディング目的で保有する棚卸資産③通常の販売目的で保有する棚卸資産④賃貸等不動産の時価の開示⑤企業結合における時価を基礎とした取得原価の配分","a":false,"c":"","e":"含まれるもの：①，②（理由：国際的な企業間の財務諸表の比較可能性を向上させる便益が高いため）。含まれないもの：③（会計基準に記載なし），④（貸借対照表には時価で計上された損益にも影響を及ぼさないため），⑤（当初認識時のみの処理であり，毎期時価の算定が求められるわけではないため）"},{"l":60,"m":"","sb":"","i":"B","r":"","q":"時価とは，算定日において市場参加者間で秩序ある取引が行われると想定した場合の，当該取引における資産を取得するために支払った価格又は負債を引き受けるために受け取った価格をいう。","a":false,"c":"","e":"資産の売却によって受け取る価格又は負債の移転のために支払う価格（出口価格）\n資産を取得するために支払った価格又は負債を引き受けるために受け取った価格は入口価格である"},{"l":61,"m":"","sb":"","i":"B","r":"","q":"時価を算定するにあたっては，市場参加者が資産又は負債の時価を算定する際の仮定を用いるとともに，資産の保有や負債の決済又は履行に関する企業の意図を反映する。","a":false,"c":"","e":"資産の保有や負債の決済又は履行に関する企業の意図は反映しない\nこれらの影響を反映しないのは，時価の算定は，市場を基礎としたものであり，対象となる企業に固有のものではないためである"},{"l":62,"m":"","sb":"","i":"B","r":"","q":"時価の算定に用いる評価技法は，毎期継続して適用する。当該評価技法又はその適用を変更する場合は，会計方針の変更として処理する。","a":false,"c":"","e":"会計上の見積りの変更"},{"l":63,"m":"","sb":"","i":"B","r":"","q":"時価の算定に用いるインプットは，レベル1のインプット，レベル2のインプット，レベル3のインプットに分類され，レベル3のインプットが最も優先順位が高く，レベル1のインプットが最も優先順位が低い。","a":false,"c":"","e":"レベル1のインプットが最も優先順位が高く，レベル3のインプットが最も優先順位が低い\nレベル1とレベル2のインプットは「観察可能なインプット」といわれ，入手できる観察可能な市場データに基づくインプットをいう。レベル3のインプットは「観察できないインプット」といわれ，観察可能な市場データではないが，入手できる最良の情報に基づくインプットをいう"},{"l":64,"m":"","sb":"","i":"C","r":"","q":"時価を算定するために異なるレベルに区分される複数のインプットを用いており，時価の算定に重要な影響を与えるインプットが複数含まれる場合，重要な影響を与えるインプットが属するレベルのうち，時価の算定における優先順位が最も高いレベルに当該時価を分類する。","a":false,"c":"","e":"最も低いレベル"},{"l":65,"m":"","sb":"","i":"C","r":"","q":"時価を分類するレベルは評価技法のレベルに基づくものである。","a":false,"c":"","e":"時価を分類するレベルは，評価技法に用いるインプットのレベルに基づくものであり，評価技法に基づくものではない"},{"l":66,"m":"","sb":"","i":"C","r":"","q":"資産又は負債の取引の数量又は頻度が当該資産又は負債に係る通常の市場における活動に比して著しく低下していると判断した場合，取引価格又は相場価格は時価とは認められない。","a":false,"c":"","e":"本問の場合，取引価格又は相場価格が時価を表しているかどうかについて評価する。よって，当該取引価格又は相場価格が時価を表していると判断される場合もある"},{"l":67,"m":"","sb":"","i":"B","r":"","q":"負債の時価の算定にあたっては，負債の不履行リスクの影響を反映してはならない。","a":false,"c":"","e":"負債の時価の算定にあたっては，負債の不履行リスクの影響を反映する\n負債の不履行リスクとは，企業が債務を履行しないリスクであり，企業自身の信用リスクに限られるものではない（例えば，特定の国・地域の政治，経済，社会情勢等によるカントリーリスクも含まれる）"},{"l":68,"m":"","sb":"","i":"B","r":"","q":"負債の不履行リスクは当該負債の移転の前後で異なるものとして時価を算定する。","a":false,"c":"","e":"負債の移転の前後で同一であると仮定する\n負債を引き受ける企業の信用リスクを特定するのが困難なため，このような仮定を設けている"},{"l":69,"m":"","sb":"","i":"C","r":"","q":"どのような場合に時価で算定すべきかは，「時価の算定に関する会計基準」の定めに従う。","a":false,"c":"","e":"どのような場合に時価で算定すべきかは，他の会計基準の定めに従う。例えば，売買目的有価証券の時価評価は「金融商品に関する会計基準」に従って行う"}]},{"n":8,"name":"純資産","qs":[{"l":1,"m":"","sb":"","i":"A","r":"","q":"純資産は資産と負債から従属的にのみ導かれる概念である。","a":true,"c":"","e":""},{"l":2,"m":"","sb":"","i":"B","r":"","q":"利益剰余金は，連結貸借対照表上，利益準備金及びその他利益剰余金に区分しない。","a":true,"c":"","e":"連結貸借対照表は，会社法上の分配可能額の算定を目的としているものではなく，表示科目の統合の観点からも，利益の留保額を利益剰余金として一括して表示する"},{"l":3,"m":"","sb":"","i":"B","r":"","q":"個別貸借対照表上，その他資本剰余金は，資本金及び資本準備金の取崩によって生ずる剰余金や自己株式の処分差益等その内容を示す科目に区分して表示する。","a":false,"c":"","e":"個別貸借対照表上，その他資本剰余金の内訳は示さない\n連結貸借対照表上，資本剰余金の内訳は示さず一括表示する"},{"l":4,"m":"","sb":"","i":"B","r":"","q":"個別財務諸表上，当期純利益と純資産の間にクリーン・サープラス関係が成立している。","a":false,"c":"","e":"当期純利益と株主資本の間にクリーン・サープラス関係が成立している\n連結財務諸表上，親会社株主に帰属する当期純利益と株主資本，包括利益と純資産の間にクリーン・サープラス関係が成立している"},{"l":5,"m":"","sb":"","i":"A","r":"","q":"純資産の部は株主資本とその他純資産に大きく区分し，その他純資産をさらに評価・換算差額等，株式引受権，新株予約権及び非支配株主持分に区分して表示する。","a":false,"c":"","e":"純資産の部は株主資本とその他純資産以外の各項目は並列的に区分して表示する"},{"l":6,"m":"","sb":"","i":"B","r":"","q":"株主資本，その他の包括利益累計額及び新株予約権を括った小計を示す。","a":false,"c":"","e":"株主資本，その他の包括利益累計額及び新株予約権を括った小計を示すことは要求されてない"},{"l":7,"m":"","sb":"","i":"B","r":"","q":"資本剰余金の次に別に区分を設け，新株式払込金の科目をもって掲記しなければならない。","a":false,"c":"","e":"資本金の次に別に区分を設け，新株式申込証拠金の科目をもって掲記しなければならない"},{"l":8,"m":"","sb":"","i":"B","r":"","q":"株主資本は，資本金，資本剰余金及び利益剰余金に区分する。これは，債権者保護の観点から資本の部を資本金，法定準備金，剰余金に区分してきた旧商法の考え方と，払込資本と留保利益に区分する企業会計の考え方の調整によるものである。","a":true,"c":"","e":""},{"l":9,"m":"","sb":"","i":"C","r":"","q":"制度上の資本剰余金には，①株主からの払込資本を表す払込剰余金のほか，②贈与により発生する剰余金や，③資本修正により発生する剰余金が含まれる。","a":false,"c":"","e":"②と③は剰余金に含まれない。②は資本的支出に充てた国庫補助金等であり，③は貨幣価値変動に伴う固定資産の評価替（例えば保険差益）であり，どちらも利益剰余金に含まれる"},{"l":10,"m":"","sb":"","i":"B","r":"","q":"資本金及び資本準備金の取り崩しによって生ずる剰余金は，その他利益剰余金に計上する。","a":false,"c":"","e":"その他資本剰余金に計上する"},{"l":11,"m":"","sb":"","i":"A","r":"","q":"利益準備金及びその他利益剰余金を資本金に組み入れることは，払込資本と留保利益の混同に該当するため認められない。","a":false,"c":"","e":"認められる\nその他利益剰余金から株主に配当を行い，その配当金を株主から払込を受けることで同様の効果が得られるが，この場合，配当時点で課税されるという実務上の問題がある等の理由から認められている"},{"l":12,"m":"","sb":"","i":"A","r":"","q":"利益剰余金が負の残高のときにその他資本剰余金で補填するのは，資本剰余金と利益剰余金の混同にあたらない。","a":true,"c":"","e":"払込資本に生じている毀損を事実として認識するものであり，払込資本と留保利益の区分の問題にはあたらない"},{"l":13,"m":"","sb":"","i":"B","r":"","q":"その他利益剰余金又は繰越利益剰余金の金額が負の値となる場合には，繰越損失等の科目をもって表示する。","a":false,"c":"","e":"その他利益剰余金又は繰越利益剰余金の科目をもってマイナス残高として表示する"},{"l":14,"m":"","sb":"","i":"C","r":"","q":"自己株式の取得の対価として，自社の他の種類の自己株式を処分する場合，自己株式の取得原価は零とする。","a":false,"c":"","e":"自己株式の取得原価は処分した自己株式の帳簿価額とする\n取得原価を零とするのは，自己株式の取得の対価として新株を発行した場合である"},{"l":15,"m":"","sb":"","i":"C","r":"","q":"企業集団内の企業から金銭以外の財産を対価として，自己株式を取得する場合，当該自己株式の取得原価は，時価により算定する。","a":false,"c":"","e":"共通支配下の取引に準じて，移転された資産及び負債の適正な帳簿価額により算定する"},{"l":16,"m":"","sb":"","i":"A","r":"","q":"自己株式を無償で取得した場合，公正な評価額をもって測定する。","a":false,"c":"","e":"数のみの増加として処理する"},{"l":17,"m":"","sb":"","i":"B","r":"","q":"期末に保有する自己株式は，取得原価で一括して純資産全体の控除項目とする。","a":false,"c":"","e":"株主資本全体の控除項目とする"},{"l":18,"m":"","sb":"","i":"A","r":"","q":"自己株式の処分は新株の発行と同様の経済的実態を有するため，自己株式処分差益は資本準備金に計上する。","a":false,"c":"","e":"その他資本剰余金に計上する"},{"l":19,"m":"","sb":"","i":"B","r":"","q":"自己株式の処分及び消却時の帳簿価額は，移動平均法により算定しなければならない。","a":false,"c":"","e":"会社の定めた計算方法に従って算定する"},{"l":20,"m":"","sb":"","i":"B","r":"","q":"自己株式の処分及び消却時の帳簿価額は，自己株式の取得目的ごとに算定する。","a":false,"c":"","e":"株式の種類ごとに算定する"},{"l":21,"m":"","sb":"","i":"B","r":"","q":"自己株式を消却した場合には，消却の対象となった自己株式の帳簿価額を，その他利益剰余金（繰越利益剰余金）又はその他資本剰余金から減額する。","a":false,"c":"","e":"その他資本剰余金から減額する"},{"l":22,"m":"","sb":"","i":"B","r":"","q":"自己株式を消却する場合，取締役会等の会社の意思決定の段階で会計処理を行う。","a":false,"c":"","e":"消却手続が完了したときに会計処理を行う"},{"l":23,"m":"","sb":"","i":"C","r":"","q":"決議後消却手続を完了していない自己株式の帳簿価額，種類及び株式数は，連結貸借対照表及び個別貸借対照表に注記する。","a":false,"c":"","e":"連結株主資本等変動計算書又は個別株主資本等変動計算書に注記する"},{"l":24,"m":"","sb":"","i":"A","r":"","q":"その他資本剰余金の残高を超える自己株式処分差損が発生した場合には，その都度，その他利益剰余金で補てんし，その残高を確定しなければならない。","a":false,"c":"","e":"会計期間末において，その他利益剰余金で補てんし，その残高を確定しなければならない\n当該補填はその期に完結し，翌期以後にその他資本剰余金が生じてもその他利益剰余金への振替は行わない"},{"l":25,"m":"","sb":"","i":"B","r":"","q":"中間決算日において，その他資本剰余金の残高が負の値となった場合には，その他利益剰余金で補てんする。また，年度決算においては，中間決算等における処理を洗替処理する。","a":true,"c":"","e":"年度決算において中間決算等における処理を洗替処理するのは，当該処理を行わないと年度決算単位でみた場合，資本剰余金と利益剰余金の混同になることがあるからである"},{"l":26,"m":"","sb":"","i":"B","r":"","q":"会計年度末にその他資本剰余金の残高を超える自己株式処分差損が生じた場合でも，資本剰余金全体の金額が正の値である場合は，その他利益剰余金で補てんする必要はない。","a":false,"c":"","e":"資本剰余金全体の金額が正の値である場合でも，その他利益剰余金で補てんする必要がある"},{"l":27,"m":"","sb":"","i":"A","r":"","q":"自己株式の取得，処分及び消却時の付随費用は，取得に要した費用は取得価額に含め，処分及び消却に要した費用は自己株式処分差損等の調整とする。","a":false,"c":"","e":"損益計算書の営業外費用に計上する\n自己株式の処分時の付随費用は株式交付費に該当し，繰延資産に計上することも認められる"},{"l":28,"m":"","sb":"","i":"C","r":"","q":"自己株式の取得については，対価が金銭の場合は対価を支払うべき日に認識し，対価が金銭以外の場合は対価が引き渡された日に認識する。","a":true,"c":"","e":""},{"l":29,"m":"","sb":"","i":"C","r":"","q":"自己株式の処分は，取引の相手先との契約時に認識する。","a":false,"c":"","e":"募集株式の発行と同様に，対価の払込期日に認識する"},{"l":30,"m":"","sb":"","i":"B","r":"","q":"自己株式を処分する場合，申込期日経過後の自己株式申込証拠金は自己株式の前に表示する。","a":false,"c":"","e":"自己株式の後に表示する。"},{"l":31,"m":"","sb":"","i":"B","r":"","q":"自己新株予約権の取得は，新株予約権者との損益取引であるため，取得時に損益を認識する。","a":false,"c":"","e":"自己新株予約権の取得時には，その後，消却するか処分するかが明らかではないため，時価に基づき取得価額を算定し，損益を認識しない\n自己新株予約権には資産性が認められるため，付随費用は取得価額に加算する"},{"l":32,"m":"","sb":"","i":"B","r":"","q":"自己新株予約権は，取得原価をもって純資産の部の新株予約権から原則として間接控除する。","a":false,"c":"","e":"取得原価をもって純資産の部の新株予約権から原則として直接控除する\n例外は間接控除である。また，直接控除し新株予約権が負の値となった場合，負の値で表示する"},{"l":33,"m":"","sb":"","i":"B","r":"","q":"自己新株予約権の時価が著しく下落して対応する新株予約権の帳簿価額を下回り，回復する見込みがあると認められない場合，当該時価の下落に見合う金額を当期の損失として処理する。","a":false,"c":"","e":"自己新株予約権の取得価額と当該新株予約権の帳簿価額との差額を当期の損失として処理する"},{"l":34,"m":"","sb":"","i":"B","r":"","q":"自己新株予約権を消却した場合，消却した自己新株予約権の帳簿価額とこれに対応する新株予約権の時価との差額を，当期の損益として処理する。","a":false,"c":"","e":"損益処理するのは，自己新株予約権の帳簿価額と対応する新株予約権の帳簿価額との差額である"},{"l":35,"m":"","sb":"","i":"C","r":"","q":"現物配当を行った場合，配当財産の簿価をもって，その他利益剰余金（繰越利益剰余金）を減額する。","a":false,"c":"","e":"配当財産の時価をもってその他資本剰余金又はその他利益剰余金（繰越利益剰余金）を減額する"},{"l":36,"m":"","sb":"","i":"B","r":"","q":"売買目的で保有している有価証券について，その他資本剰余金の処分による配当を受けた場合，配当受領額を配当の対象である有価証券の帳簿価額から減額する。","a":false,"c":"","e":"有価証券の帳簿価額から減額する\n受取配当金（売買目的有価証券運用損益）として処理する。売買目的以外で有価証券を保有している場合，配当受領額を有価証券の帳簿価額から減額する"},{"l":37,"m":"","sb":"","i":"C","r":"","q":"資産性又は負債性を有しないものが資産の部又は負債の部に記載されることはない。","a":false,"c":"","e":"例えば，修繕引当金は負債の定義を満たさず，負債性を有しないが負債の部に表示する\n修繕引当金が純資産の部に表示されないのは，資産の控除項目という見方も存在するためである"},{"l":38,"m":"","sb":"","i":"B","r":"","q":"土地再評価差額金は土地を売却する際に取り崩され，期間損益として処理される。","a":false,"c":"","e":"土地再評価差額金の取崩額は，当期純利益には反映されず，その他利益剰余金（株主資本等変動計算書）に直接計上される\nなお，土地再評価差額金は再評価の対象となった土地を減損処理した場合も取り崩すが，この場合も取崩額は，当期純利益には反映されず，その他利益剰余金（株主資本等変動計算書）に直接計上される"},{"l":39,"m":"","sb":"","i":"B","r":"","q":"売買目的有価証券に該当する新株予約権の権利を行使し，発行者の株式を取得したときは，帳簿価額で株式に振り替える。","a":false,"c":"","e":"権利行使時の時価で株式に振り替える\nその他有価証券の場合，帳簿価額（洗替処理が行われているため取得原価）で株式に振り替える"},{"l":40,"m":"","sb":"","i":"A","r":"","q":"株主資本等変動計算書に記載する株主資本の各項目は，当期首残高，当期変動額及び当期末残高に区分し，当期変動額は純額で表示する。","a":false,"c":"","e":"株主資本の各項目は当期変動額は変動事由ごとにその金額を表示する"},{"l":41,"m":"","sb":"","i":"A","r":"","q":"株主資本等変動計算書に記載する株主資本以外の各項目は，当期首残高，当期変動額及び当期末残高に区分し，当期変動額は純額で表示しなければならない。","a":false,"c":"","e":"株主資本以外の各項目の当期変動額は，主な変動事由ごとにその金額を表示（注記による開示を含む）することもできる"},{"l":42,"m":"","sb":"","i":"B","r":"","q":"連結損益計算書の当期純利益は，連結株主資本等変動計算書において利益剰余金の変動事由として表示する。","a":false,"c":"","e":"連結損益計算書の親会社株主に帰属する当期純利益は，利益剰余金の変動事由として表示する"},{"l":43,"m":"","sb":"","i":"B","r":"","q":"「株主資本等変動計算書に関する会計基準」によれば，連結財務諸表を作成している会社は，連結株主資本等変動計算書に①発行済株式の種類及び総数に関する事項，②自己株式の種類及び株式数に関する事項，③新株予約権及び自己新株予約権に関する事項，④配当に関する事項を注記し，個別株主資本等変動計算書には注記を要しない。","a":false,"c":"","e":"連結財務諸表を作成している会社は，連結株主資本等変動計算書に，①～④に関する事項を注記するとともに，個別株主資本等変動計算書に②に関する事項を注記する"}]},{"n":9,"name":"ストック・オプション等","qs":[{"l":2,"m":"","sb":"","i":"C","r":"","q":"ストック・オプションの付与は報酬の前払と考え，その金額を貸借対照表に計上し，平均残存勤務期間に配分して費用計上する。","a":false,"c":"","e":"報酬の前払いと考えていない・対象勤務期間"},{"l":3,"m":"","sb":"","i":"A","r":"","q":"従業員等から提供される追加的なサービスの価値は，付与されたストック・オプションの市場価格で算定する。","a":false,"c":"","e":"通常，市場価格が観察できないため，株式オプション価格算定モデル等の算定技法を利用して価値（公正な評価単価）を見積る\n追加的なサービスは目観性をもって測定できないため，ストック・オプションの価値を用いる点は正しい"},{"l":4,"m":"","sb":"","i":"A","r":"","q":"権利確定日が明らかではない場合には，原則として，権利行使期間の開始日を権利確定日とみなす。","a":false,"c":"","e":"権利行使期間の開始日の前日"},{"l":5,"m":"","sb":"","i":"C","r":"","q":"条件の達成に要する期間が固定的ではない権利確定条件として株価条件が付されている場合，権利確定日を合理的に予測して，対象勤務期間にわたって費用を配分する。","a":false,"c":"","e":"権利確定日を合理的に予測することが困難なため，予測を行わず，対象勤務期間はないものとみなし，付与日に一時に費用を計上する\n条件の達成に要する期間が固定的ではない権利確定条件として，一定の業績の達成等が要求されており，権利確定日を合理的に予測可能な場合，対象勤務期間にわたって費用配分を行う"},{"l":6,"m":"","sb":"","i":"C","r":"","q":"権利確定条件が付されておらず付与日に既に権利が確定している場合，対象勤務期間にわたって費用を配分する。","a":false,"c":"","e":"対象勤務期間はないため，付与日に一時に費用を計上する\n付与日に既に権利が確定している場合，付与日以前のサービス提供に対する対価として付与されたものと理解されるため，付与日に一時に費用計上する"},{"l":7,"m":"","sb":"","i":"B","r":"","q":"複数の権利確定条件が付されている場合，最も早期に達成される条件が満たされる日を権利確定日とする。","a":false,"c":"","e":"いずれか1つ満たせば権利確定する場合，最も早期に達成される条件が満たされる日／すべて満たして権利確定する場合，最も長期を要する条件が満たされる日"},{"l":8,"m":"","sb":"","i":"A","r":"","q":"ストック・オプションの公正な評価額は，公正な評価単価にストック・オプションの付与数を乗じて算定する。","a":false,"c":"","e":"ストック・オプション数\nストック・オプション数は付与数から権利不確定による失効見積数を控除して算定する"},{"l":9,"m":"","sb":"","i":"A","r":"","q":"ストック・オプションの公正な評価単価は，付与日現在で算定し，権利確定日までの間，見直しを行う。","a":false,"c":"","e":"権利確定日までの間，見直しを行う。条件変更の場合を除き，その後は見直さない"},{"l":10,"m":"","sb":"","i":"A","r":"","q":"ストック・オプションの公正な評価単価の算定上，失効の見込みを考慮する。","a":false,"c":"","e":"公正な評価単価の算定上，失効の見込みを考慮する，ストック・オプション数の算定上，考慮する"},{"l":11,"m":"","sb":"","i":"A","r":"","q":"ストック・オプション数は，付与されたストック・オプション数から，権利不行使による失効の見積数を控除して算定する。","a":false,"c":"","e":"権利不確定による失効の見積数"},{"l":12,"m":"","sb":"","i":"B","r":"","q":"権利不確定による失効数は最善の見積りを行うことが原則であるが，十分な信頼性をもってストック・オプションの失効数を見積ることができない場合には，見積りを行うべきではない。","a":true,"c":"","e":"本問の場合，付与数＝ストック・オプション数となる"},{"l":13,"m":"","sb":"","i":"A","r":"","q":"ストック・オプションが権利行使され，これに対して新株を
