発行した場合，新株予約権の帳簿価額をその他資本剰余金に計上する。","a":false,"c":"","e":"払込資本（資本金及び資本準備金）\nその他資本剰余金に計上されるのは，新株予約権の行使に伴い自己株式を処分した場合に，自己株式の取得原価と，新株予約権の帳簿価額及び権利行使に伴う払込金額の合計額との差額の部分である"},{"l":14,"m":"","sb":"","i":"B","r":"","q":"権利不行使による失効が生じた場合には，株式報酬費用を減額する。","a":false,"c":"","e":"株式報酬費用を減額しない。利益（新株予約権戻入益）を計上する"},{"l":15,"m":"","sb":"","i":"A","r":"","q":"ストック・オプションの公正な評価単価を増加又は減少させる条件変更を行った場合には，付与日におけるストック・オプションの公正な評価単価に基づく費用計上を継続するとともに，条件変更日による公正な評価額の増減額を残存期間にわたって費用計上する。","a":false,"c":"","e":"付与日における公正な評価単価に基づく公正な評価額による費用計上を継続\nストック・オプションの価値が増加していたにもかかわらず費用が減少するパラドックスを回避するため"},{"l":16,"m":"","sb":"","i":"B","r":"","q":"新たな条件のストック・オプションの付与と引換えに，当初付与したストック・オプションを取り消す場合，両者を別個のものとみなして会計処理を行う。","a":false,"c":"","e":"条件変更と同じ経済実態を有すると考えられる限り，条件変更とみなして会計処理を行う"},{"l":17,"m":"","sb":"","i":"A","r":"","q":"ストック・オプション数に変動が生じた場合，影響額は残存期間にわたって反映させる。","a":false,"c":"","e":"条件変更による場合：影響額を残存期間にわたって計上する／条件変更以外による場合：影響額を一時の損益として計上する"},{"l":18,"m":"","sb":"","i":"B","r":"","q":"条件変更の結果，ストック・オプションと対価関係にある対象勤務期間が変動する場合，報酬としての同一性を失い，別の報酬に置き換わるため，過去に計上した費用を戻し入れる。","a":false,"c":"","e":"過去に計上した費用を戻し入れる，残存期間に計上すると見込んでいた金額を新たな残存期間にわたって費用計上する"},{"l":20,"m":"","sb":"","i":"A","r":"","q":"親会社にとって対価性が認められない自社株式オプションを子会社の従業員等に付与する取引は，追加的に提供されると考えられるサービスの直接の受領者は子会社であり，親会社にとって対価性は認められない。","a":false,"c":"","e":"親会社にとって対価性が認められる\n親会社自身の子会社に対する投資の価値を結果的に高めるようなサービス提供を期待しているため"},{"l":21,"m":"","sb":"","i":"B","r":"","q":"親会社が自社株式オプションを子会社の従業員等に付与した場合，当該オプションが子会社の報酬体系に組み入れられているか否かに関わらず，親会社の個別財務諸表上，費用計上する。","a":true,"c":"","e":"なお，親会社は株式報酬費用を計上する"},{"l":22,"m":"","sb":"","i":"B","r":"","q":"親会社が自社株式オプションを子会社の従業員等に付与した場合，子会社の個別財務諸表上，株式報酬費用と新株予約権を計上する。","a":false,"c":"","e":"子会社の報酬体系に組み入れられている場合：給料手当等と株式報酬受入益を計上する／子会社の報酬体系に組み入れられていない場合：会計処理を要しない"},{"l":23,"m":"","sb":"","i":"C","r":"","q":"段階的に権利行使が可能となるストック・オプションについては，原則として，付与された単位でまとめて処理を行う。","a":false,"c":"","e":"原則として，権利行使期間開始日の異なるごとに別個のストック・オプションとして処理を行う\n付与された単位でまとめて会計処理を行う方法は容認されているに過ぎない"},{"l":24,"m":"","sb":"","i":"A","r":"","q":"未公開企業については，ストック・オプションの公正な評価単価に代え，ストック・オプションの単位当たりの本源的価値の見積りに基づいて会計処理を行わなければならない。","a":false,"c":"","e":"行うことができる"},{"l":25,"m":"","sb":"","i":"B","r":"","q":"ストック・オプションの価値を本源的価値によって見積る場合，権利行使日に至るまで本源的価値を見直し，最終的に権利行使日において実現した価値に基づいて費用を計上する。","a":false,"c":"","e":"付与日現在で本源的価値を見積り，その後は見直さない\n公正な評価単価と同様に，条件変更の場合を除き，その後は見直さない"},{"l":26,"m":"","sb":"","i":"B","r":"","q":"ストック・オプションの本源的価値による算定は，未公開企業及び公開直後の企業に限って認められている。","a":false,"c":"","e":"未公開企業に限って認められている\n公開直後の企業の範囲を一律に画すことは困難であるため未公開企業に限定されている"},{"l":19,"m":"","sb":"","i":"B","r":"","q":"株式分割，株式併合，又は株式の第三者割当増資が行われた場合に，付与されたストック・オプションの実質的内容を維持するための調整として行われた行使価格やストック・オプション数の変更は，「条件変更」にはあたらない。","a":true,"c":"","e":""},{"l":27,"m":"","sb":"","i":"B","r":"","q":"財貨又はサービスを取得の対価として自社株式オプションを用いる場合，財貨又はサービスの取得価額は，対価として用いられた自社株式オプションの公正な評価額によって算定する。","a":false,"c":"","e":"いずれかより高い信頼性をもって測定可能な評価額で算定する"},{"l":28,"m":"","sb":"","i":"B","r":"","q":"公開企業が財貨又はサービスの取得の対価として自社株式オプションを用いる取引は，通常，自社株式オプションの公正な評価額に基づいて取得価額を算定する。","a":true,"c":"","e":"取得する財貨等が市場価格とより直接的に結びついているような場合には，財貨等の市場価格で測定することで，より信頼性の高い測定が可能となる場合があり得る"},{"l":29,"m":"","sb":"","i":"B","r":"","q":"財貨又はサービスの取得の対価として自社株式オプションを用いる場合，自社株式オプションの付与日における公正な評価単価の算定上，自社株式オプションの市場価格は用いられない。","a":false,"c":"","e":"市場価格が観察できる場合には，当該市場価格による"},{"l":30,"m":"","sb":"","i":"B","r":"","q":"公開企業が財貨又はサービスの取得の対価として自社の株式を交付する場合，取得した財貨又はサービスの取得価額は，株式を実際に交付した日の市場価格に基づいて算定する。","a":false,"c":"","e":"契約日の市場価格"},{"l":31,"m":"","sb":"","i":"B","r":"","q":"財貨又はサービスの取得の対価として自社の株式を交付する場合，取得した財貨又はサービスを資産又は費用として計上し，対応額を新株予約権として計上する。","a":false,"c":"","e":"払込資本"}]},{"n":10,"name":"退職給付","qs":[{"l":1,"m":"","sb":"","i":"C","r":"","q":"退職給付は一定の期間にわたり労働を提供したこと等の事由に基づいて，退職時に支給される給付をいい，年金による給付は含まれない。","a":false,"c":"","e":"退職以後に支給される給付をいい，年金による給付は含まれる\n従来は退職一時金のみを引当処理していた"},{"l":2,"m":"","sb":"","i":"B","r":"","q":"「退職給付に関する会計基準」は，役員の退職慰労金や厚生年金基金制度及び確定給付企業年金制度に含まれる役員部分には適用されない。","a":false,"c":"","e":"役員の退職慰労金には適用されないが，厚生年金基金制度及び確定給付企業年金制度に含まれる役員部分には適用される\n役員退職慰労金は「企業会計原則注解」注18に従い，役員退職慰労引当金の計上対象となる"},{"l":3,"m":"","sb":"","i":"B","r":"","q":"退職給付の性格としては，功績報償説の考え方が採用されている。","a":false,"c":"","e":"賃金後払説"},{"l":4,"m":"","sb":"","i":"A","r":"","q":"連結貸借対照表上，退職給付債務から未認識数理計算上の差異及び未認識過去勤務費用を加減した額から，年金資産の額を控除した額を，退職給付引当金等の適当な科目をもって固定負債に計上する。","a":false,"c":"","e":"連結貸借対照表上，退職給付債務から年金資産の額を控除した積立状況を示す額を，退職給付に係る負債等の適当な科目をもって計上する\n本問の取扱いは個別貸借対照表において要求されるものである"},{"l":5,"m":"","sb":"","i":"B","r":"","q":"積立状況を示す額が負の値となる場合，退職給付制度からの返還又は将来掛金の減額による経済的便益がないと判断される部分について資産計上は認められない。","a":false,"c":"","e":"本問の取扱い（アセットシーリング）は，わが国の会計基準では採用されていない\n従来は退職給付会計における本問に類する制限があったが，厚生年金基金等における掛金の減額等の制限が緩和されたことなどにより，当該制限は撤廃された"},{"l":6,"m":"","sb":"","i":"A","r":"","q":"複数の退職給付制度を採用している場合において，1つの退職給付制度に係る年金資産が当該退職給付制度に係る退職給付債務を超えるときは，当該年金資産の超過額を他の退職給付制度に係る退職給付債務から控除する。","a":false,"c":"","e":"年金資産の超過額を他の退職給付制度に係る退職給付債務から控除してはならない\n複数の退職給付制度を採用する場合，前払年金費用と退職給付引当金が両建てで計上される"},{"l":7,"m":"","sb":"","i":"B","r":"","q":"退職給付債務は，個々の従業員ごとに計算しなければならない。","a":false,"c":"","e":"退職給付債務は，原則として，個々の従業員ごとに計算する。ただし，勤続年数，残存勤務期間，退職給付見込額等について標準的な数値を用いて加重平均等により合理的な計算ができると認められる場合には，当該合理的な計算方法を用いることができる"},{"l":8,"m":"","sb":"","i":"A","r":"","q":"退職給付見込額に反映させる将来見込まれる昇給は，確実に見込まれる昇給である。","a":false,"c":"","e":"予想される昇給\n退職給付債務に将来の昇給を反映させるため，予測給付債務概念が採用されているといわれる"},{"l":9,"m":"","sb":"","i":"B","r":"","q":"一時的に支払われる早期割増退職金は，退職給付見込額の見積りに含める。","a":false,"c":"","e":"退職給付見込額の見積りに含めない\n一時的に支払われる早期割増退職金は，勤務期間を通じた労働の提供に伴って発生した性格を有しておらず，むしろ将来の勤務を放棄する代償等の性格を有するため，退職給付見込額の見積りには含めない"},{"l":10,"m":"","sb":"","i":"A","r":"","q":"期末時点において受給権を有していない従業員については，退職給付見込額の計算の対象とならない。","a":false,"c":"","e":"受給権を有していない従業員も，退職給付見込額の計算の対象となる"},{"l":11,"m":"","sb":"","i":"A","r":"","q":"各期の退職給付の発生額を見積る方法として，給付算定式基準を原則的に適用する。","a":false,"c":"","e":"給付算定式基準と期間定額基準を選択適用する"},{"l":12,"m":"","sb":"","i":"A","r":"","q":"退職給付債務の割引率の基礎とする安全性の高い債券の利回りとは，国債，政府機関債及び優良社債の利回りをいい，一定期間の利回りの変動を考慮することができる。","a":false,"c":"","e":"割引率の基礎とする安全性の高い債券の利回りとは，期末における国債，政府機関債及び優良社債の利回りをいい，一定期間の利回りの変動を考慮することはできない"},{"l":13,"m":"","sb":"","i":"B","r":"","q":"退職給付債務の割引率決定の基礎となる債券の期間は，従業員の平均残存勤務期間に近似した年数とする。","a":false,"c":"","e":"割引率は，退職給付支払ごとの支払見込期間を反映するものでなければならない\n具体的には，退職給付の支払見込期間及び支払見込期間ごとの金額を反映した単一の加重平均割引率を使用する方法や，退職給付の支払見込期間ごとに設定された複数の割引率が挙げられる"},{"l":14,"m":"","sb":"","i":"B","r":"","q":"利息費用は，財務費用として営業外費用に計上する。","a":false,"c":"","e":"原則として売上原価又は販売費及び一般管理費に計上する"},{"l":15,"m":"","sb":"","i":"A","r":"","q":"給付水準の重要な改訂を行ったときに発生する過去勤務費用を一定の期間にわたって費用処理する場合，当該金額を特別損益として計上することができる。","a":false,"c":"","e":"発生当時に全額費用処理する場合などにおいて，その金額が重要であると認められるときには，当該金額を特別損益として計上することができる"},{"l":16,"m":"","sb":"","i":"B","r":"","q":"勤務費用の計算においては，期末時点で当期の勤務費用を計算する手法を用いる。","a":false,"c":"","e":"期首時点で当期の勤務費用を計算する手法を用いる"},{"l":17,"m":"","sb":"","i":"B","r":"","q":"従業員からの拠出がある企業年金制度を採用している場合には，勤務費用の計算にあたり，従業員からの拠出額を含めた総額を計上する。","a":false,"c":"","e":"勤務費用の計算にあたり，従業員からの拠出額を差し引いた純額を計上する\n退職給付債務は従業員拠出部分を含めて総額で計算する"},{"l":18,"m":"","sb":"","i":"A","r":"","q":"期待運用収益は，期首の年金資産の額に安全性の高い債券の利回りを乗じて算定する。","a":false,"c":"","e":"合理的に期待される収益率（長期期待運用収益率）"},{"l":19,"m":"","sb":"","i":"B","r":"","q":"退職給付債務の割引率として長期期待運用収益率を用いることが認められる。","a":false,"c":"","e":"割引率は安全性の高い債券の利回りを基礎として決定する"},{"l":20,"m":"","sb":"","i":"A","r":"","q":"年金資産は時価評価し，投資その他の資産に計上する。","a":false,"c":"","e":"年金資産は時価評価し，退職給付債務から控除する"},{"l":21,"m":"","sb":"","i":"C","r":"","q":"資産の信託への拠出時に，退職給付信託財産及びその他の年金資産の時価の合計額が対応する退職給付債務を超える場合には，当該退職給付信託財産は年金資産として認められない。","a":true,"c":"","e":"退職給付信託は，退職給付債務の積立不足額を積み立てるために設定するものであり，本問の場合，積立超過のため年金資産として認められない"},{"l":22,"m":"","sb":"","i":"C","r":"","q":"退職給付信託に係る信託財産を年金資産とする場合，事業主から当該資産が簿価で拠出された場合と同様の会計処理を行うため損益は計上されない。","a":false,"c":"","e":"事業主から当該資産が時価で拠出された場合と同様の会計処理を行うため損益が計上される"},{"l":23,"m":"","sb":"","i":"B","r":"","q":"数理計算上の差異は，年金資産の期待運用収益と実際の運用成果との差異，退職給付債務の数理計算に用いた見積数値と実績との差異の2つを指す。","a":false,"c":"","e":"この他，見積数値の変更等により発生した差異も含めた3つを指す"},{"l":24,"m":"","sb":"","i":"C","r":"","q":"数理計算上の差異及び過去勤務費用のうちその他の包括利益を構成する項目として費用処理されていないものを未認識数理計算上の差異ないし未認識過去勤務費用という。","a":false,"c":"","e":"その他の包括利益を構成する項目として費用処理されていないもの\n当期純利益を構成する項目として費用処理されていないもの"},{"l":25,"m":"","sb":"","i":"B","r":"","q":"初めて退職給付制度を導入した場合，過去勤務費用は生じない。","a":false,"c":"","e":"給付計算対象が既存する従業員の過年度の勤務期間にも及ぶときは，過去勤務費用が生じる"},{"l":26,"m":"","sb":"","i":"B","r":"","q":"ベース・アップによる退職給付債務の増加は，過去勤務費用に該当する。","a":false,"c":"","e":"数理計算上の差異であり，過去勤務費用に該当しない"},{"l":27,"m":"","sb":"","i":"C","r":"","q":"給付水準を引き下げる場合，過去勤務費用の遅延認識は認められない。","a":false,"c":"","e":"過去勤務費用の遅延認識は認められる"},{"l":28,"m":"","sb":"","i":"A","r":"","q":"数理計算上の差異と過去勤務費用は，原則として各期の発生額について，平均残存勤務期間以内の一定の年数で按分した額を毎期費用処理する点，未認識部分の残高の一定割合を費用処理する方法によることができる点で共通する。","a":true,"c":"","e":""},{"l":29,"m":"","sb":"","i":"B","r":"","q":"過去勤務費用については，当期の発生額を翌期から費用処理する方法を用いることができる。","a":false,"c":"","e":"当期の発生額を翌期から費用処理する方法を用いることはできない\n数理計算上の差異は当期の発生額を翌期から費用処理する方法が認められている"},{"l":30,"m":"","sb":"","i":"C","r":"","q":"数理計算上の差異と過去勤務費用の費用処理年数は，それぞれ別個に設定できる。","a":true,"c":"","e":"発生原因と発生頻度が異なるためである"},{"l":31,"m":"","sb":"","i":"B","r":"","q":"過去勤務費用は即時費用処理が認められているが，数理計算上の差異は認められていない。","a":false,"c":"","e":"数理計算上の差異は即時費用処理が認められていない。両者とも平均残存勤務期間以内の一定の年数で按分した額を毎期費用処理することが求められており，費用処理年数を1年とすることで即時費用処理が認められる"},{"l":32,"m":"","sb":"","i":"A","r":"","q":"退職従業員に係る過去勤務費用は，他の過去勤務費用と区分して発生時に全額を費用処理しなければならない。","a":false,"c":"","e":"他の過去勤務費用と区分して発生時に全額を費用処理することができる（容認）"},{"l":33,"m":"","sb":"","i":"C","r":"","q":"割引率等の計算基礎に重要な変動が生じていない場合には，これを見直さない。","a":false,"c":"","e":"重要な変動が生じていない場合には，これを見直さないことができる（容認）\n重要性基準に加えて回避を設けることは認められていない"},{"l":34,"m":"","sb":"","i":"B","r":"","q":"期末の退職給付の要支給額を用いた見積計算を行う等の簡便な方法が認められるのは，退職給付に係る財務諸表項目に重要性が乏しい場合に限られる。","a":false,"c":"","e":"従業員数が比較的少ない小規模な企業等において，高い信頼性をもって数理計算上の見積りを行うことが困難である場合も簡便な方法が認められる"},{"l":35,"m":"","sb":"","i":"B","r":"","q":"確定拠出制度においては，当該制度に基づく要拠出額をもって費用処理し，未拠出の額は退職給付引当金として計上する。","a":false,"c":"","e":"未払費用の額は未払金として計上する"},{"l":36,"m":"","sb":"","i":"B","r":"","q":"複数の事業主により設立された確定給付型企業年金制度を採用している場合，自社の拠出に対応する年金資産の額を合理的に計算できるときは，確定拠出制度に準じた会計処理及び開示を行う。","a":false,"c":"","e":"確定給付制度の会計処理及び開示を行う\n年金資産の額を合理的に計算できないときは，確定拠出制度に準じた会計処理及び開示を行う"},{"l":37,"m":"","sb":"","i":"A","r":"","q":"連結財務諸表上，その他の包括利益累計額に計上されている未認識数理計算上の差異及び未認識過去勤務費用のうち，当期に費用処理された部分は，その他包括利益の調整を行う。","a":true,"c":"","e":"本規定にしたがい当期発生分の費用処理額と組替調整額に該当しない点に注意すること"},{"l":38,"m":"","sb":"","i":"C","r":"","q":"連結財務諸表作成会社において，未認識項目を発生時に全額費用処理する場合，個別と連結とで会計処理は異ならないため，未認識項目の貸借対照表における取扱いが連結財務諸表と異なる旨を注記する。","a":false,"c":"","e":"個別財務諸表に未認識項目の貸借対照表における取扱いが連結財務諸表と異なる旨を注記する\n未認識項目の貸借対照表における取扱いが連結財務諸表と異なる旨の注記は不要である"},{"l":39,"m":"","sb":"","i":"B","r":"","q":"過去勤務費用及び数理計算上の差異の費用処理年数は連結会社間で統一する。","a":false,"c":"","e":"平均残存勤務期間は連結会社間においても異なるのが通常であるため，過去勤務費用及び数理計算上の差異の費用処理年数は連結会社間で統一を要しない"},{"l":40,"m":"","sb":"","i":"B","r":"","q":"実際運用収益が期待運用収益を超過したこと等による数理計算上の差異の発生又は給付水準を引き下げたことによる過去勤務費用の発生により，年金資産が企業年金制度に係る退職給付債務を超えることとなった場合，当該超過額を資産及び利益として認識してはならない。","a":false,"c":"","e":"これらの原因により年金資産が企業年金制度に係る退職給付債務を超えることとなった場合，当該超過額を資産及び利益（費用の減額）として認識する"},{"l":41,"m":"","sb":"","i":"C","r":"","q":"年金資産が事業主へ返還された場合には，返還額を事業主の資産の増加と利益として処理する。","a":false,"c":"","e":"返還額を事業主の資産の増加と退職給付に係る資産の減少（又は退職給付に係る負債の増加）として処理する"},{"l":42,"m":"","sb":"","i":"C","r":"","q":"数理計算上の差異及び過去勤務費用の費用処理年数の決定方法として，平均残存勤務期間以内の一定の年数とする方法を採用している場合，リストラクチャリングによる従業員の大量退職などにより平均残存勤務期間の再検討を行った結果，平均残存勤務期間が費用処理年数より短くなったことを原因として費用処理年数を変更する場合は会計方針の変更となる。","a":false,"c":"","e":"会計上の見積りの変更となる\n本問のように，会計事実の変更に伴う費用処理年数の変更は会計上の見積りの変更となる。一方，これ以外の合理的な理由により変更する場合は会計方針の変更となる"}]},{"n":11,"name":"資産除去債務","qs":[{"l":1,"m":"","sb":"","i":"C","r":"","q":"有形固定資産を対象とする「資産除去債務に関する会計基準」は，建設仮勘定や使用権資産に適用されるが，投資その他の資産である投資不動産には適用されない。","a":false,"c":"","e":"「資産除去債務に関する会計基準」における有形固定資産にはそれに準じる有形の資産が含まれるため，投資不動産に資産除去債務が存在している場合，適用される"},{"l":2,"m":"","sb":"","i":"C","r":"","q":"「資産除去債務に関する会計基準」は，有形固定資産を除去する義務の発生原因に関わらず適用される。","a":false,"c":"","e":"不適切な操業等の異常な原因によって発生した場合，適用されない\n引当金の計上や「減損会計基準」の適用対象とすべき"},{"l":3,"m":"","sb":"","i":"B","r":"","q":"有形固定資産の除去が企業の自発的な計画のみによって行われる場合は，資産除去債務に該当しない。","a":true,"c":"","e":"資産除去債務は法令又は契約で要求される法律上の義務及びこれに準ずるものであるため，有形固定資産の除去が企業の自発的な計画のみによって行われる場合は，資産除去債務に該当しない"},{"l":4,"m":"","sb":"","i":"B","r":"","q":"有形固定資産を除去する際に当該資産に使用されている有害物質等を法律等の要求による特別の方法で除去する義務は，有形固定資産の除去費用全体が資産除去債務の計上対象となる。","a":false,"c":"","e":"資産除去債務の計上対象となるのは，有害物質の除去に直接関わる費用である"},{"l":5,"m":"","sb":"","i":"B","r":"","q":"有形固定資産の使用期間中に実施する環境修復や修繕支出は，資産除去債務に含めて会計処理を行う。","a":false,"c":"","e":"使用期間中に実施する環境修復や修繕支出は，資産除去債務に該当しない\n資産除去債務は有形固定資産の使用後の処分に係る債務であるため，使用期間中の支出は含めない"},{"l":6,"m":"","sb":"","i":"A","r":"","q":"有形固定資産が遊休状態になる場合や転用や用途変更を行う場合，除去に該当する。","a":false,"c":"","e":"転用や用途変更，有形固定資産が遊休状態になる場合は除去に該当しない"},{"l":7,"m":"","sb":"","i":"B","r":"","q":"引当金処理は資産除去債務の負債計上が不十分となるため，その採用には資産除去債務の金額を注記することが必要となる。","a":false,"c":"","e":"引当金処理の採用は認められていない"},{"l":8,"m":"","sb":"","i":"B","r":"","q":"資産除去債務の発生時に，当該債務の金額を合理的に見積ることができない場合には，これを計上せず，資産除去債務の概要，合理的に見積ることができない旨及びその理由を注記する。","a":true,"c":"","e":"債務額を合理的に見積ることができるようになった時点で負債として計上し，資産除去債務の見積りの変更に準じて処理する。"},{"l":9,"m":"","sb":"","i":"A","r":"","q":"資産除去債務に係る割引前の将来キャッシュ・フローは，市場の評価を反映した金額と自己の支出見積額のいずれか低い金額による。","a":false,"c":"","e":"合理的で説明可能な仮定及び予測に基づく自己の支出見積りによる"},{"l":10,"m":"","sb":"","i":"B","r":"","q":"将来キャッシュ・フローの見積方法は，最頻値法又は期待値法によるが，前者の方法による場合，将来キャッシュ・フローが見積値から乖離するリスクを勘案しない。","a":false,"c":"","e":"いずれの方法による場合でも，将来キャッシュ・フローが見積値から乖離するリスクを勘案する"},{"l":11,"m":"","sb":"","i":"B","r":"","q":"将来キャッシュ・フローが見積値から乖離するリスクは，将来キャッシュ・フローと割引率のいずれかに反映させる。","a":false,"c":"","e":"将来キャッシュ・フローに反映させ，割引率には反映させない"},{"l":12,"m":"","sb":"","i":"C","r":"","q":"将来キャッシュ・フローが見積値から乖離するリスクは，資産除去債務の見積額を増減させる要素となる。","a":false,"c":"","e":"資産除去債務の見積額を増加させる要素となる\nリスク回避型の一般の経済主体にとってマイナスの影響を有するため資産除去債務の見積額を増加させる"},{"l":13,"m":"","sb":"","i":"B","r":"","q":"将来キャッシュ・フローには，有形固定資産の除去に係る作業のために直接要する支出は含めるが，処分に至るまでの保管や管理のための支出は含めない。","a":false,"c":"","e":"処分に至るまでの保管や管理のための支出も含める"},{"l":14,"m":"","sb":"","i":"A","r":"","q":"将来キャッシュ・フローの見積りには法人税等の影響額を含め，割引率は貨幣の時間価値を反映した無リスクの税引後の利率とする。","a":false,"c":"","e":"割引率は貨幣の時間価値を反映した無リスクの税引前の利率とする"},{"l":15,"m":"","sb":"","i":"B","r":"","q":"資産除去債務に対応する除去費用を資産計上する方法として，資産除去債務に関連する有形固定資産と区別して把握し，別の資産として計上することも認められる。","a":false,"c":"","e":"関連する有形固定資産の帳簿価額に加える方法による"},{"l":16,"m":"","sb":"","i":"C","r":"","q":"資産除去債務に対応する金額を有形固定資産の取得原価に含めて資産計上する場合，関連する有形固定資産と区分して別の資産として管理することは認められない。","a":false,"c":"","e":"関連する有形固定資産と区分して別の資産として管理することは妨げられない"},{"l":17,"m":"","sb":"","i":"B","r":"","q":"建物が建築されている土地の原状回復費用等は，土地が処分されるまで費用計上されない。","a":false,"c":"","e":"土地に建てられている建物や構築物等の減価償却を通じて各期に費用配分される"},{"l":18,"m":"","sb":"","i":"B","r":"","q":"資産除去債務が有形固定資産の稼動等に従って，使用の都度発生する場合，原則として，資産除去債務に対応する除去費用をいったん資産に計上し，当該計上時期と同一の期間に，資産計上額と同一の金額を費用処理する方法による。","a":false,"c":"","e":"当該方法は，例外として認められているにすぎない\n原則法によると除去費用に係る費用配分が有形固定資産の使用期間の後半に著しく偏るため例外法が認められている"},{"l":19,"m":"","sb":"","i":"A","r":"","q":"資産除去債務の割引率は，毎期見直すことが要求されている。","a":false,"c":"","e":"毎期見直すことは要求されていない"},{"l":20,"m":"","sb":"","i":"C","r":"","q":"資産除去債務の対象が複数の有形固定資産から構成される場合，主たる資産を除去するまでに行われる，より短い周期で実施される資産の除去及び再取得に係る支出は資産除去債務に含める。","a":false,"c":"","e":"資産除去債務に含めず，主たる資産の除去と同時に行われる資産の除去に係る支出を含める"},{"l":21,"m":"","sb":"","i":"C","r":"","q":"賃借契約に関連する敷金が資産計上されているときは，当該敷金の回収が最終的に見込めないと認められる金額を合理的に見積り，そのうち当期の負担に属する額を費用計上する方法により処理しなければならない。","a":false,"c":"","e":"回収が最終的に見込めない金額を合理的に見積り，当期の負担に属する額を費用計上する。資産除去債務の負債計上及びこれに対応する除去費用の資産計上を行う方法が原則であり，本問の方法は容認されているに過ぎない"},{"l":22,"m":"","sb":"","i":"B","r":"","q":"資産除去債務の見積りの変更に係る会計処理は，資産除去債務に係る負債及び有形固定資産の残高の調整を行い，その調整の効果を一時の損益とするプロスペクティブ方式による。","a":false,"c":"","e":"資産除去債務に係る負債及び関連する有形固定資産の帳簿価額に加減して，減価償却を通じて残存耐用年数にわたり費用配分を行うプロスペクティブ方式による"},{"l":23,"m":"","sb":"","i":"A","r":"","q":"割引前の将来キャッシュ・フローに重要な見積りの増減が生じた場合，当該調整額にその時点の割引率を適用する。","a":false,"c":"","e":"将来キャッシュ・フローが増加する場合，その時点の割引率を適用するが，キャッシュ・フローが減少する場合，負債計上時の割引率を適用する\n過去に割引前の将来キャッシュ・フローの見積りが増加した場合で，減少部分に適用すべき割引率を特定できないときは，加重平均した割引率を適用する"},{"l":24,"m":"","sb":"","i":"A","r":"","q":"資産除去債務は，固定負債の区分に表示しなければならない。","a":false,"c":"","e":"貸借対照表日後1年以内に資産除去債務の履行が見込まれる場合，流動負債の区分に表示し，それ以外の場合は固定負債の区分に表示する"},{"l":25,"m":"","sb":"","i":"A","r":"","q":"時の経過による資産除去債務の調整額は損益計算書上，営業外費用に計上する。","a":false,"c":"","e":"資産除去債務に関連する有形固定資産の減価償却費と同じ区分に計上する"},{"l":26,"m":"","sb":"","i":"A","r":"","q":"資産除去債務の履行時に認識される資産除去債務残高と資産除去債務の決済のために実際に支払われた額との差額は，臨時的な損益であるため特別損益に計上する。","a":false,"c":"","e":"原則として，資産除去債務に対応する除去費用に係る費用配分額と同じ区分に計上する\n当初の予定よりも著しく早期に除去することとなった場合等，履行差額が異常な原因により生じた場合，特別損益として処理する"}]},{"n":12,"name":"固定資産の減損","qs":[{"l":1,"m":"","sb":"","i":"A","r":"","q":"固定資産の減損処理は，事業用資産の過大な帳簿価額を減額し，将来に損失を繰り延べないために行われる会計処理であり，時価基準の下で行われる帳簿価額の臨時的な減額である。","a":false,"c":"","e":"取得原価基準"},{"l":2,"m":"","sb":"","i":"B","r":"","q":"制度上の減損処理は投資期間全体を通じた投資額の回収可能性を評価するものである。","a":false,"c":"","e":"特定時点の帳簿価額の回収可能性を評価"},{"l":3,"m":"","sb":"","i":"B","r":"","q":"「固定資産の減損に係る会計基準」の適用対象に含まれるものを指摘しなさい。①投資有価証券，②繰延税金資産，③前払年金費用，④市場販売目的のソフトウェア，⑤自社利用のソフトウェア，⑥リース資産，⑦建設仮勘定","a":false,"c":"","e":"含まれるもの：⑤自社利用のソフトウェア，⑥リース資産，⑦建設仮勘定。①投資有価証券，②繰延税金資産，③前払年金費用，④市場販売目的のソフトウェアは，他の会計基準に減損処理や評価に関する定めがあるため除かれる"},{"l":4,"m":"","sb":"","i":"B","r":"","q":"資産のグルーピングに際しては，他の資産又は資産グループのキャッシュ・フローから概ね独立したキャッシュ・フローを生み出す最大の単位で行う。","a":false,"c":"","e":"最小の単位"},{"l":5,"m":"","sb":"","i":"A","r":"","q":"個別財務諸表基準性の原則にしたがい個別財務諸表で決定された資産のグルーピングの単位を連結財務諸表上で用いる必要がある。","a":false,"c":"","e":"連結財務諸表上，連結の見地から資産のグルーピングの単位が見直される場合がある\n当該見直しは，管理会計上の区分や投資の意思決定を行う際の単位の設定等が複数の連結会社（在外子会社を含む）を対象に行われていることが条件となる"},{"l":6,"m":"","sb":"","i":"B","r":"","q":"連結の見地からの資産のグルーピング単位の見直しの対象には，連結上，固定資産が計上される連結会社のみならず，持分法が適用されている非連結子会社や関連会社も含まれる。","a":false,"c":"","e":"持分法が適用されている非連結子会社や関連会社は含まれない\n持分法適用会社の固定資産は連結されないため"},{"l":7,"m":"","sb":"","i":"C","r":"","q":"連結の見地から個別財務諸表において用いられた資産グルーピングの単位が見直された場合，原則として，使用価値の算定に際して用いられる割引率も見直される。","a":true,"c":"","e":"個別財務諸表における資産グループと連結財務諸表における資産グループが異なる以上，資産グループの収益率等も異なるためである"},{"l":8,"m":"","sb":"","i":"B","r":"","q":"将来の使用が見込まれていない遊休資産のうち重要なものについては，他の資産又は資産グループに含める。","a":false,"c":"","e":"他の資産又は資産グループに含めず，独立したキャッシュ・フローを生み出す最小の単位として扱う\n将来の使用が見込まれていない遊休資産は，当該遊休資産を切り離しても他の資産又は資産グループの使用にほとんど影響を与えないため"},{"l":9,"m":"","sb":"","i":"B","r":"","q":"営業活動から生ずる損益又はキャッシュ・フローが，継続してマイナスの場合は減損の兆候に該当するが，継続してマイナスとなる見込みに過ぎない場合，減損の兆候に該当しない。","a":false,"c":"","e":"継続してマイナスとなる見込みに過ぎない場合も減損の兆候に該当する"},{"l":10,"m":"","sb":"","i":"B","r":"","q":"資産グループが遊休状態になり，将来の用途が定まっていない場合，減損損失を認識する。","a":false,"c":"","e":"減損の兆候に該当するが，減損損失を認識するとは限らない"},{"l":11,"m":"","sb":"","i":"C","r":"","q":"資産除去債務が法令の改正等により新たに発生した場合，影響が特に重要であれば，減損の兆候に該当するが，これまで合理的に見積ることができなかった資産除去債務の金額を合理的に見積ることができるようになった場合は，減損の兆候に該当しない。","a":false,"c":"","e":"資産除去債務の金額を合理的に見積ることができるようになった場合，減損の兆候に該当する\n資産に係る将来キャッシュ・フローに関する不利な予想が明確になったものであるため"},{"l":12,"m":"","sb":"","i":"B","r":"","q":"減損の兆候とされている資産又は資産グループの市場価格の著しい下落に関して，市場価格がない場合，合理的に算定された価額を算定する。","a":false,"c":"","e":"合理的に算定された価額の算定は必ずしも要しない\n企業の負担を軽減する減損の兆候の趣旨に照らし，市場価格がない場合，合理的価額の算定は要しない"},{"l":13,"m":"","sb":"","i":"B","r":"","q":"内部管理目的の損益報告や事業の再編等に関する経営計画などの企業内部の情報は主観が介入するため，それ以外の経営環境や資産の市場価格などの企業外部の要因に関する情報に基づき，減損の兆候を識別する。","a":false,"c":"","e":"企業内部の情報及び企業外部の要因に関する情報の双方で減損の兆候を識別する"},{"l":14,"m":"","sb":"","i":"A","r":"","q":"減損損失の認識の判定のために割引前将来キャッシュ・フローを見積る期間は，資産グループ中の主要な資産の経済的残存使用年数と20年のいずれか長い方とする。","a":false,"c":"","e":"いずれか短い方とする"},{"l":15,"m":"","sb":"","i":"A","r":"","q":"資産又は資産グループ中の主要な資産の経済的残存使用年数が20年を超える場合には，20年経過時点の正味売却価額を算定し，20年目までの割引前将来キャッシュ・フローに加算する。","a":false,"c":"","e":"20年経過時点の回収可能価額を算定し，20年目までの割引前将来キャッシュ・フローに加算する"},{"l":16,"m":"","sb":"","i":"B","r":"","q":"共用資産や土地は，原則として，資産グループにおける主要な資産には該当しない。","a":false,"c":"","e":"共用資産やのれんは，原則として，主要な資産には該当しない\n資産グループの将来キャッシュ・フロー生成にとって最も重要な構成資産という主要な資産の定義を満たさないため"},{"l":17,"m":"","sb":"","i":"A","r":"","q":"回収可能価額とは，資産又は資産グループの時価から処分費用見込額を控除して算定される金額と資産又は資産グループの継続的使用と使用後の処分によって生じると見込まれる将来キャッシュ・フローの現在価値のいずれか低い方の金額を指す。","a":false,"c":"","e":"いずれか高い方の金額を指す"},{"l":18,"m":"","sb":"","i":"B","r":"","q":"通常，使用価値は正味売却価額より高いと考えられるため，一定の場合を除き，減損損失の測定において，正味売却価額を算定しないことも認められる。","a":true,"c":"","e":"正味売却価額が使用価値より高い場合，企業は資産又は資産グループを既に売却していると考えられるため，通常，使用価値が正味売却価額より高いと考えられる"},{"l":19,"m":"","sb":"","i":"B","r":"","q":"資産グループについて認識された減損損失は，当該資産グループの主要な資産に優先的に配分する。","a":false,"c":"","e":"帳簿価額に基づく比例配分等の合理的な方法により，当該資産グループの各構成資産に配分する\n各構成資産の時価を配分等他の方法が合理的な場合，当該方法によることができる"},{"l":20,"m":"","sb":"","i":"A","r":"","q":"将来キャッシュ・フローは，恣意性を排除するため企業に固有の事情を反映しない合理的で説明可能な仮定及び予測に基づいて見積る。","a":false,"c":"","e":"企業に固有の事情を反映した合理的で説明可能な仮定及び予測に基づいて見積る"},{"l":21,"m":"","sb":"","i":"B","r":"","q":"将来キャッシュ・フローの見積りは，資産又は資産グループの現在の使用状況に基づいて行うのであり，資産又は資産グループの使用計画を考慮してはならない。","a":false,"c":"","e":"資産又は資産グループの現在の使用状況及び合理的な使用計画等を考慮しなければならない"},{"l":22,"m":"","sb":"","i":"A","r":"","q":"将来の用途が定まっていない遊休資産については，将来キャッシュ・フローの見積対象に含めない。","a":false,"c":"","e":"現在の状況に基づき将来キャッシュ・フローを見積る"},{"l":23,"m":"","sb":"","i":"A","r":"","q":"資産又は資産グループに関連して間接的に生ずる支出，利息の支払額並びに法人税等の支払額及び還付額は，将来キャッシュ・フローの見積りに含めない。","a":false,"c":"","e":"資産又は資産グループに関連して間接的に生ずる支出は，将来キャッシュ・フローの見積りに含める"},{"l":24,"m":"","sb":"","i":"A","r":"","q":"資産除去債務が負債に計上されている場合には，将来キャッシュ・フローの見積りに除去費用部分を含めない。","a":true,"c":"","e":"除去費用は有形固定資産の取得原価に加算されており，影響を二重で認識しないためである"},{"l":25,"m":"","sb":"","i":"A","r":"","q":"減損損失を認識するかどうかの判定又は使用価値を算定する際に見積られる割引前将来キャッシュ・フローの算定上，将来キャッシュ・フローが見積値から乖離するリスクを反映させる。","a":false,"c":"","e":"認識の判定時：割引前将来キャッシュ・フローにリスクを反映させない／使用価値の算定時：割引前将来キャッシュ・フローと割引率のいずれかに反映させる"},{"l":26,"m":"","sb":"","i":"C","r":"","q":"資産又は資産グループの将来キャッシュ・フローの見積りに際しては，現金基準に基づいて見積る方法のほか，発生基準に基づいて見積った金額に当該資産又は資産グループの減価償却費などの重要な非資金損益項目を加減した金額を用いることができる。","a":true,"c":"","e":"発生基準に基づいて見積った金額には，通常，営業利益が該当する"},{"l":27,"m":"","sb":"","i":"B","r":"","q":"複数の資産又は資産グループを含む部門全体の将来キャッシュ・フローの生成に寄与している資産は，全社的な資産ではないため，共用資産とならない。","a":false,"c":"","e":"部門全体の将来キャッシュ・フローの生成に寄与している資産は共用資産とならない。全社的な資産でなくても，複数の資産又は資産グループを含む部門全体の将来キャッシュ・フローの生成に寄与している資産は，当該部門の共用資産となる"},{"l":28,"m":"","sb":"","i":"B","r":"","q":"のれんの帳簿価額の分割について，分割したのれんを帰属させる事業の単位は，取得の対価が概ね独立して決定される単位であり，分割額は事業の減損処理時における時価の比率等によって決定する。","a":false,"c":"","e":"①取得の対価が概ね独立して決定され，かつ，取得後も内部管理上独立した業績報告が行われる単位である／②事業の取得時における時価の比率等による"},{"l":29,"m":"","sb":"","i":"B","r":"","q":"共用資産に係る資産のグルーピングを，より大きな単位で行う場合，減損の兆候の把握，減損損失を認識するかどうかの判定及び減損損失の測定は，先ず，より大きな単位で行い，その後，資産又は資産グループごとに行う。","a":false,"c":"","e":"先ず，資産又は資産グループごとに行い，その後，より大きな単位で行う\nのれんも同様である"},{"l":30,"m":"","sb":"","i":"B","r":"","q":"共用資産を含む，より大きな単位について減損損失を認識するかどうかを判定する場合，共用資産を加えることによって算定される減損損失の増加額は，原則として，合理的な基準により各資産又は資産グループに配分する。","a":false,"c":"","e":"減損損失の増加額は，原則として，共用資産に配分する\nのれんも同様である"},{"l":31,"m":"","sb":"","i":"A","r":"","q":"より大きな単位でグルーピングを行う方法によれば，のれんに配分された減損損失が，その正味売却価額を超過する場合，当該超過額を合理的な基準により各資産グループに配分する。","a":false,"c":"","e":"のれんに配分された減損損失が，その帳簿価額を超過する場合\n共用資産の場合，配分された減損損失が共用資産の帳簿価額と正味売却価額の差額を超過することが明らかな場合には，当該超過額を合理的な基準により各資産又は資産グループに配分する"},{"l":32,"m":"","sb":"","i":"A","r":"","q":"共用資産の帳簿価額を各資産又は資産グループに配分したうえで減損損失を認識するかどうかを判定する場合には，共用資産に減損の兆候がある場合に，その帳簿価額を各資産及び資産グループに配分する。","a":false,"c":"","e":"帳簿価額の配分は共用資産に減損の兆候があるか否かにかかわらず行う\nのれんも同様である"},{"l":33,"m":"","sb":"","i":"A","r":"","q":"のれんの帳簿価額を各資産グループに配分したうえで減損損失を認識するかどうかを判定する場合，各資産グループについて認識された減損損失は，帳簿価額に基づく比例配分等の合理的な方法により，当該資産グループの各構成資産に配分する。","a":false,"c":"","e":"減損損失はのれんに優先的に配分する\n共用資産の場合，帳簿価額に基づく比例配分等の合理的な方法により，共用資産の配分額を含む当該資産グループの各構成資産に配分する"},{"l":34,"m":"","sb":"","i":"C","r":"","q":"遊休資産の減価償却費は，減損処理後は，原則として，特別損失に計上する。","a":false,"c":"","e":"減損処理の前後に関わらず，原則として，営業外費用に計上する"},{"l":35,"m":"","sb":"","i":"A","r":"","q":"減損損失の戻入れは原則として行わないが，明らかに回収可能価額が回復していると認められる場合には，戻入れを行う。","a":false,"c":"","e":"回収可能価額が回復していると認められる場合には，戻入れを行わない"},{"l":36,"m":"","sb":"","i":"A","r":"","q":"貸借対照表上，減損損失累計額を，取得原価から間接控除する形式で表示することができるが，この場合，減損損失累計額は減価償却累計額と区別して表示しなければならない。","a":false,"c":"","e":"減損損失累計額を減価償却累計額に合算して表示することができる"},{"l":37,"m":"","sb":"","i":"A","r":"","q":"減損処理を行った資産の貸借対照表における表示形式は，減価償却累計額については各資産科目に対する控除項目として掲記する場合，減損損失についても間接控除形式を採るなど，減価償却累計額の表示形式と同じものにする必要がある。","a":false,"c":"","e":"減損損失と減価償却累計額の表示形式は同じものである必要はない\n減損損失と減価償却累計額は性格が異なるため"},{"l":38,"m":"","sb":"","i":"A","r":"","q":"投資不動産のうち，キャピタル・ゲインの獲得を目的として保有するものは，時価評価が認められる。","a":false,"c":"","e":"投資不動産は原価評価する\nなお，投資不動産は減損処理の対象となる"},{"l":39,"m":"","sb":"","i":"C","r":"","q":"企業は，店舗や工場などの資産と対応して継続的に収支の把握がなされている単位を識別し，グルーピングの単位を決定する基礎とする。そこで，グルーピングに関する①～④のうち適切なものを選びなさい。①収支は企業の外部との間で直接的にキャッシュ・フローが生じている必要がある。②収支の把握は，現金基準に基づいて把握しなければならない。③1つの資産において，一棟の建物が複数の単位に分割されて，継続的に収支の把握がなされている場合，分割された単位がグルーピングの単位を決定する基礎になる。④グルーピングの単位を決定する基礎から生ずるキャッシュ・フローが，他の単位から生ずるキャッシュ・フローと相互補完的であり，当該単位を切り離したときには他の単位から生ずるキャッシュ・フローに大きな影響を及ぼすと考えられる場合，当該他の単位とグルーピングを行う。","a":false,"c":"","e":"適切なもの：④。①収支は必ずしも企業の外部との間で直接的にキャッシュ・フローが生じている必要はなく，例えば，内部振替価額や共通費の配分額であっても，合理的なものであれば含まれる。②収支の把握は，必ずしも現金基準に基づくものではなく，発生基準に基づく損益の把握でもよい。③固定資産の減損会計は，資産を対象とするため，1つの資産において，継続的に収支の把握がなされている単位が複数存在する場合でも，1つの資産を細分化して減損処理の対象とすることは適切ではない\n④例えば，継続的な収支が把握されている単位として工場Aと工場Bがあるとする。工場Bは工場Aの製品製造に使用する部品（当該部品は工場BでのみB製造可能）を作っており，当該部品は市場性がなく販売先は工場Aのみである。この場合，それぞれの単位のキャッシュ・フローは相互補完的であるため，同じ資産グループとして扱う"}]},{"n":13,"name":"棚卸資産の評価","qs":[{"l":1,"m":"","sb":"","i":"A","r":"","q":"販売活動及び一般管理活動において短期間に消費されるべき財貨は，棚卸資産に含まれない。","a":false,"c":"","e":"棚卸資産に含まれる"},{"l":2,"m":"","sb":"","i":"B","r":"","q":"棚卸資産は有形の財貨であり，無形の用役は含まれない。","a":false,"c":"","e":"無形の用役も含まれる"},{"l":3,"m":"","sb":"","i":"C","r":"","q":"長期性資産が，本来の用途からはずされ，売却する目的で保有されることになった場合，当該資産は流動資産，すなわち棚卸資産に該当する。","a":false,"c":"","e":"流動資産ではあるが，通常の営業過程で販売されるものではないため棚卸資産に該当しない"},{"l":4,"m":"","sb":"","i":"B","r":"","q":"棚卸資産については，個別法，先入先出法，後入先出法，平均原価法，売価還元法等の評価方法の中から選択した方法を適用して売上原価等の払出原価と期末棚卸資産の価額を算定する。","a":false,"c":"","e":"後入先出法を選択することは認められていない"},{"l":5,"m":"","sb":"","i":"C","r":"","q":"個別法は実際原価によって払出単価を算定するため，利益操作に利用される恐れはない。","a":false,"c":"","e":"払出資産を選択することによって利益操作に利用される恐れがある"},{"l":6,"m":"","sb":"","i":"C","r":"","q":"先入先出法は，保有損益を売上総利益から排除するのに役立つ。","a":false,"c":"","e":"先入先出法によると，保有損益が売上総利益に算入される\n保有損益を売上総利益から排除するのに役立つのは後入先出法である"},{"l":7,"m":"","sb":"","i":"B","r":"","q":"期末在庫数量が最終仕入数量を超過する場合，最終仕入原価法による計算結果は，先入先出法と同じになる。","a":false,"c":"","e":"本問の場合，最終仕入原価法による計算結果は，先入先出法と同じ計算結果になる\n期末有高が最終仕入数量以下である場合，先入先出法と同じ計算結果になる。期末在庫数量が最終仕入数量を超過する場合，純然たる取得原価基準の評価方法とはいえない"},{"l":8,"m":"","sb":"","i":"B","r":"","q":"販売用不動産や開発事業等支出金は棚卸資産の範囲に含まれるもの，その価格の測定に幅がある点や客観性を欠くため，収益性の低下に基づく簿価切下げの対象から除外されている。","a":false,"c":"","e":"簿価切下げの対象から除外されていない"},{"l":9,"m":"","sb":"","i":"B","r":"","q":"販売活動及び一般管理活動目的で保有する棚卸資産は，販売により投資が回収されるものではないため，収益性の低下に基づく簿価切下げの対象から除外されている。","a":false,"c":"","e":"簿価切下げの対象から除外されていない\n少なくとも当該棚卸資産の価格下落が物理的な劣化又は経済的な劣化に起因している場合，収益性の低下に準じて通常の販売目的の棚卸資産と同様に簿価切下げを行うことが適当である"},{"l":10,"m":"","sb":"","i":"C","r":"","q":"棚卸資産の評価方法は，事業の種類，棚卸資産の種類，その性質及びその使用方法等を考慮した区分ごとに選択し，継続して適用しなければならない。","a":true,"c":"","e":""},{"l":11,"m":"","sb":"","i":"B","r":"","q":"低価法を原則（強制適用）と位置付ける考え方は，取得原価基準の本質を，名目上の取得原価で据え置く考え方とみている。","a":false,"c":"","e":"将来の収益を生み出すという意味においての有用な原価，すなわち回収可能な原価だけを繰り越そうとする考え方とみている\n取得原価基準の本質を名目上の取得原価で据え置く考え方とみれば，低価法は原価法に対する例外とされる"},{"l":12,"m":"","sb":"","i":"A","r":"","q":"収益性が低下した場合における簿価切下げは，正味売却価額を用いることから時価基準の下で回収可能性を反映させる会計処理である。","a":false,"c":"","e":"取得原価基準"},{"l":13,"m":"","sb":"","i":"C","r":"","q":"期末時点の正味売却価額が帳簿価額より下落していても，期末において見込まれた将来販売時点の正味売却価額が帳簿価額よりも下落していない場合には，簿価切下げを行う必要はない。","a":true,"c":"","e":"なお，制度上は，期末における将来販売時点での正味売却価額と期末前後での販売実績に基づく価額のいずれも認められている（双方を含めた「期末における正味売却価額」という表現を用いている）"},{"l":14,"m":"","sb":"","i":"A","r":"","q":"期末時点の正味売却価額が突発的な要因により，異常な水準となっている場合には，期末における正味売却価額として期末時点の売価を用いる。","a":false,"c":"","e":"期末前後の合理的な期間の平均的な売価を用いる"},{"l":15,"m":"","sb":"","i":"B","r":"","q":"物理的な劣化（品質低下），経済的な劣化（陳腐化）及び市場の需給変化による評価損は，会計処理上，区別することが要求されている。","a":false,"c":"","e":"収益性の低下の観点からは相違がないため，区別することは要求されていない"},{"l":16,"m":"","sb":"","i":"B","r":"","q":"企業が複数の売却市場に参加し得る場合には，複数の市場における最も低い売価を用いる。","a":false,"c":"","e":"実際に販売できると見込まれる売価を用いる\n複数の売却市場が存在し売価が異なる場合であって，棚卸資産をそれぞれの市場向けに区分できないときには，それぞれの市場の販売比率に基づいた加重平均売価等による"},{"l":17,"m":"","sb":"","i":"B","r":"","q":"正味売却価額の算定上，市場価格が存在しない場合には，合理的に算定された価額を売価とする。","a":true,"c":"","e":"合理的に算定された価額には，期末前後での販売実績に基づく価額や，契約により取り決められた一定の売価が含まれる"},{"l":18,"m":"","sb":"","i":"B","r":"","q":"正味売却価額がマイナスとなる場合，棚卸資産の帳簿価額を正味売却価額まで切り下げて損失を認識する。","a":false,"c":"","e":"棚卸資産の帳簿価額をゼロまで切り下げ，マイナス分について引当金による損失計上を検討する"},{"l":19,"m":"","sb":"","i":"C","r":"","q":"営業循環過程から外れた滞留又は処分見込等の棚卸資産は，取得原価で評価しなければならない。","a":false,"c":"","e":"帳簿価額を処分見込価額まで切り下げたり，一定の回転期間を超える棚卸資産について規則的な簿価切下げを行う"},{"l":20,"m":"","sb":"","i":"B","r":"","q":"再調達原価とは，購買市場と売却市場とが区別される場合における購買市場の時価をいい，購入に付随する費用は含まない。","a":false,"c":"","e":"購入に付随する費用を含む"},{"l":21,"m":"","sb":"","i":"B","r":"","q":"製造業における原材料等のように再調達原価の方が把握しやすく，正味売却価額が再調達原価に歩調を合わせて動くと想定される場合，再調達原価（最終仕入原価を含む）により簿価切下げを行わなければならない。","a":false,"c":"","e":"再調達原価（最終仕入原価を含む）により簿価切下げを行うことが容認されている"},{"l":22,"m":"","sb":"","i":"C","r":"","q":"収益性の低下の有無に係る判断及び簿価切下げは，原則として個別品目ごとに行う。","a":true,"c":"","e":"複数の棚卸資産を一括りとした単位で行うことが適切と判断される場合（例えば，同じ製品に使われる材料，仕掛品及び製品を1グループとして扱う場合），継続適用を条件として，その方法による"},{"l":23,"m":"","sb":"","i":"A","r":"","q":"収益性低下の要因を物理的な劣化や経済的な劣化による場合とそれ以外の場合に区分できる企業においては，前者の要因による売価が反響することは通常考えられないことから，前者については切放し法，後者については洗替え法による。","a":false,"c":"","e":"前者については切放し法による，後者については洗替え法による\n棚卸資産の種類ごと，簿価切下げの要因ごとに選択適用することができる"},{"l":24,"m":"","sb":"","i":"B","r":"","q":"収益性の低下による簿価切下げ額と，洗替え法を採用した場合における前期に計上した簿価切下げ額の戻入額は両建表示する。","a":false,"c":"","e":"純額表示する"},{"l":25,"m":"","sb":"","i":"B","r":"","q":"収益性の低下に伴う簿価切下げ額が販売促進に起因する場合には販売費として表示することが認められる。","a":false,"c":"","e":"販売費として表示することは認められない\n棚卸資産を見本品として使用する場合，他勘定振替処理により販売費計上する処理を否定するものではない"},{"l":26,"m":"","sb":"","i":"A","r":"","q":"収益性の低下に伴う簿価切下げ額が，臨時の事象に起因するか，又は，多額であるときは，特別損失に表示する。","a":false,"c":"","e":"臨時の事象に起因し，かつ，多額であるときは，特別損失に表示する"},{"l":28,"m":"","sb":"","i":"B","r":"","q":"正味売却価額が帳簿価額よりも著しく下落した場合，簿価切下げ額を営業外費用に計上することができる。","a":false,"c":"","e":"簿価切下げ額を営業外費用に計上することはできない"},{"l":29,"m":"","sb":"","i":"B","r":"","q":"収益性の低下による簿価切下げ額は，重要性が乏しい場合を除き，売上原価等の内訳項目として独立掲記する方法により開示しなければならない。","a":false,"c":"","e":"注記による方法又は売上原価等の内訳項目として独立掲記する方法により開示する"},{"l":30,"m":"","sb":"","i":"B","r":"","q":"売価還元低価法を採用している場合，期末における正味売却価額が帳簿価額よりも下落している場合には，当該正味売却価額を貸借対照表価額としなければならない。","a":false,"c":"","e":"売価還元低価法の原価率で算定した帳簿価額を貸借対照表価額とすることができる"},{"l":31,"m":"","sb":"","i":"B","r":"","q":"売価還元低価法は，収益性の低下に基づく簿価切下げという考え方と必ずしも整合するものではない。","a":true,"c":"","e":""},{"l":32,"m":"","sb":"","i":"B","r":"","q":"トレーディング目的で保有する棚卸資産に係る損益は，原則として，営業外収益又は営業外費用に含めて表示する。","a":false,"c":"","e":"原則として，純額で売上高に表示する"},{"l":33,"m":"","sb":"","i":"B","r":"","q":"トレーディング目的で保有する棚卸資産の時価とは，公正な評価額をいい，市場価格に基づく価額をいう。市場価格が観察できない場合には合理的に算定された価額を公正な評価額とする。","a":false,"c":"","e":"時価とは，算定日において市場参加者間で秩序ある取引が行われると想定した場合の，当該取引における資産の売却によって受け取る価格"},{"l":27,"m":"","sb":"","i":"B","r":"","q":"収益性の低下に伴う簿価切下額を特別損失に表示する場合，洗替え法を適用していても，当該簿価切下額の戻入れを行ってはならない。","a":true,"c":"","e":""}]},{"n":14,"name":"金融商品","qs":[{"l":1,"m":"","sb":"","i":"B","r":"","q":"現物商品（コモディティ）に係るデリバティブ取引は「金融商品会計基準」の適用対象とならない。","a":false,"c":"","e":"通常差金決済により取引されるものから生じる正味の債権又は債務は適用対象となる"},{"l":2,"m":"","sb":"","i":"C","r":"","q":"金融資産の時価を算定する際の市場は，公settled取引所及びこれに類する市場を指し，随時，売買・換金を行うことができる取引システム等は含まれない。","a":false,"c":"","e":"随時，売買・換金を行うことができる取引システム等も含まれる"},{"l":3,"m":"","sb":"","i":"B","r":"","q":"商品の売買の対価に係る金銭債権債務は，原則として，当該商品売買契約を締結したときにその発生を認識する。","a":false,"c":"","e":"当該商品を受け渡したときにその発生を認識する"},{"l":4,"m":"","sb":"","i":"A","r":"","q":"有価証券については，原則として約定時に発生を認識し，デリバティブ取引については，契約上の決済時に発生を認識しなければならない。","a":false,"c":"","e":"デリバティブ取引については，契約の締結時に発生を認識しなければならない"},{"l":5,"m":"","sb":"","i":"A","r":"","q":"有価証券の売買契約について，約定日から受渡日までの期間が市場の規則又は慣行に従った通常の期間である場合，買手は約定日から受渡日までの時価の変動のみを認識し，また，売手は売却損益のみを約定日に認識することができる。","a":true,"c":"","e":"約定日から受渡日までの期間が通常の期間よりも長い場合，売買契約は先渡契約であり，買手も売手も約定日に当該先渡契約による権利義務の発生を認識する"},{"l":6,"m":"","sb":"","i":"B","r":"","q":"貸付金及び借入金は，資金の貸借にその発生を認識し，その返済日に消滅を認識する。","a":false,"c":"","e":"金銭消費貸借の約定日と現金の受渡日は通常同一であるため"},{"l":7,"m":"","sb":"","i":"A","r":"","q":"第一次債務を引き受けた第三者が倒産等に陥ったときに二次的に責任を負う条件の下で，債務が契約上の第一次債務者の地位から免責される場合，リスク・経済価値アプローチにより当該債務に係る金融負債の消滅を認識し，二次的な責任を金融負債として認識する","a":false,"c":"","e":"財務構成要素アプローチ"},{"l":8,"m":"","sb":"","i":"A","r":"","q":"金融資産の契約上の権利に対する支配が他に移転するのは，倒産隔離，利益享受，買戻特約の不存在という3要件のいずれかが充たされた場合である。","a":false,"c":"","e":"支配が他に移転するのは，3要件のすべてが充たされた場合である"},{"l":9,"m":"","sb":"","i":"A","r":"","q":"Aは保有する債権をBに譲渡するとともに，譲渡した債権の貸倒リスクを保証した。この場合，リスク・経済価値アプローチでは，Aは債権の消滅を認識し，貸倒リスクに対する負債を計上する。","a":false,"c":"","e":"リスク・経済価値アプローチでは，Aは債権の消滅を認識することができず，Bからの入金額を負債（借入金等）として計上する\n財務構成要素アプローチによれば本問の通り処理する"},{"l":10,"m":"","sb":"","i":"B","r":"","q":"現先取引のように譲渡した金融資産を満期日前に買戻すことが予め合意されている取引は，当該金融資産の譲渡を売買取引として処理する。","a":false,"c":"","e":"金融取引として処理する"},{"l":11,"m":"","sb":"","i":"C","r":"","q":"譲受人が一定の要件を充たす特別目的会社の場合，特別目的会社が譲渡された金融資産の契約上の権利を直接又は間接に通常の方法で享受できるか否かにより支配の移転を判断する。","a":false,"c":"","e":"特別目的会社が発行する証券の保有者が譲渡された金融資産の契約上の権利を直接又は間接に通常の方法で享受できるか否かにより支配の移転を判断する"},{"l":12,"m":"","sb":"","i":"C","r":"","q":"金融資産を売却した直後に同一の金融資産を購入した場合又は金融資産を購入した直後に同一の金融資産を売却した場合で，譲渡人が譲受人から譲渡した金融資産を再購入又は回収する同時の契約があるときは，売買として処理しない。","a":true,"c":"","e":"このような取引をクロス取引という。契約書上，買戻す権利及び義務を取り決めていない場合又は売却と買入が別々の契約であっても，譲渡価格と購入価格が同一の場合，譲渡人は再購入又は回収する同時の契約があると推定する"},{"l":13,"m":"","sb":"","i":"A","r":"","q":"金融資産又は金融負債の消滅に伴い新たに発生した金融資産又は金融負債は時価で計上する。","a":true,"c":"","e":"当該金融資産又は金融負債の具体例は買戻権やリコース義務である"},{"l":14,"m":"","sb":"","i":"B","r":"","q":"ローン・パーティシペーションは，債権に係るリスクと経済的利益のほとんどすべてが譲渡人から譲受人に移転している場合等一定の要件を充たした場合には，当該債権の消滅を認識しなければならない。","a":false,"c":"","e":"本問の場合，債権の消滅を認識することが認められる\n譲受人の権利の法的保全という消滅の認識要件を満たさないため，原則として債権の消滅を認識しない"},{"l":15,"m":"","sb":"","i":"B","r":"","q":"デット・アサンプションは，実質的には社債の繰り上げ償還ないし買入償還と同様の経済効果を有するため，当該社債の償還と同様に会計処理を行わなければならない。","a":false,"c":"","e":"社債の償還と同様の会計処理（消滅の認識）は，認められているに過ぎない\n義務履行，消滅，第一次債務者の地位免責という消滅の認識要件を満たさないため，原則として社債の消滅を認識しない"},{"l":16,"m":"","sb":"","i":"C","r":"","q":"デット・エクイティ・スワップが行われ，債権者が債権を債務者に現物出資した場合，債権者は債権の消滅を認識するとともに，消滅した債権の帳簿価額とその対価として取得する株式の時価との差額を，資本剰余金として処理する。","a":false,"c":"","e":"差額を当期の損益として処理する\n債権者がその債権を債務者に現物出資した場合，債権と債務が同一の債務者に帰属し当該債権は混同により消滅し，支配が他に移転したかどうかを検討するまでもなく金融資産の消滅の認識要件を充たす"},{"l":17,"m":"","sb":"","i":"C","r":"","q":"割引手形については，原則として新たに生じた二次的責任である保証債務を時価評価して認識するとともに，割引による入金額から保証債務の時価相当額を差し引いた譲渡金額から，譲渡原価である帳簿価額を差し引いた額を支払利息割引料として期間配分する。","a":false,"c":"","e":"手形売却損益として処理する\n従来，手形の割引料は金融取引から生じた利息として理されていた"},{"l":18,"m":"","sb":"","i":"B","r":"","q":"社債を社債金額より低い価額で発行した場合，債務額をもって貸借対照表価額とする。","a":false,"c":"","e":"償却原価法に基づいて算定された価額をもって貸借対照表価額とする"},{"l":19,"m":"","sb":"","i":"C","r":"","q":"有価証券の範囲は「金融商品取引法」に基づくため，国内CD（譲渡性預金）は，会計上，有価証券に含めない。","a":false,"c":"","e":"有価証券の範囲に含める\n有価証券については，原則として，金融商品取引法に定義する有価証券に基づくが，本問はその例外である"},{"l":20,"m":"","sb":"","i":"C","r":"","q":"異なる保有目的区分に分類した有価証券であっても，同一銘柄の有価証券に係る売却原価は，これを通算（簿価通算）して計算することができる。","a":false,"c":"","e":"売却原価は通算できず，保有目的区分ごとに計算する\n各保有目的に着目して，それぞれ異なった評価方法及び処理方法を定めている趣旨に反するため簿価通算はできない"},{"l":21,"m":"","sb":"","i":"B","r":"","q":"有価証券の売買を業としていることが定款の上から明らかでなく，かつ，トレーディング業務を日常的に遂行し得る人材から構成された独立の専門部署をもたない場合，有価証券の売買を頻繁に繰り返していても，保有する有価証券は売買目的有価証券に該当しない。","a":false,"c":"","e":"売買目的有価証券に該当する"},{"l":22,"m":"","sb":"","i":"A","r":"","q":"満期保有目的の債券の判定に関する「満期まで所有する意図をもって保有する」とは，企業が償還期限まで所有するという積極的な意思に基づいて保有することをいう。","a":false,"c":"","e":"償還期限まで所有するという積極的な意思とその能力に基づいて保有することをいう"},{"l":23,"m":"","sb":"","i":"A","r":"","q":"債券を満期保有目的の債券に分類するためには，あらかじめ償還日が定められていること，又は，額面金額による償還が予定されていることを要する。","a":false,"c":"","e":"あらかじめ償還日が定められており，かつ，額面金額による償還が予定されている\nこれらの要件から満期の定めのない永久債や株価リンク債は満期保有目的の債券に分類できない"},{"l":24,"m":"","sb":"","i":"A","r":"","q":"満期保有目的の債券に該当しない変動利付債は満期保有目的の債券に該当しない。","a":false,"c":"","e":"変動利付債であっても，あらかじめ償還日が定められており，かつ，額面金額による償還が予定されていれば，満期保有目的の債券に該当する"},{"l":25,"m":"","sb":"","i":"B","r":"","q":"売買目的有価証券又はその他有価証券に分類した債券を，取得後に満期保有目的の債券へ振り替えることはできない。","a":true,"c":"","e":"満期保有目的の債券への分類はその取得当初の意図に基づいて行われるものであるから，取得後に満期保有目的の債券への振替は認められない"},{"l":26,"m":"","sb":"","i":"B","r":"","q":"満期保有目的の債券に分類された債券の一部を償還期限前に売却した場合，満期保有目的の債券に分類された残りのすべての債券について，保有目的の変更があったものとされるが，翌事業年度に債券を取得した際，満期保有目的の債券に分類することは否定されない。","a":false,"c":"","e":"翌事業年度に債券を取得した際，満期保有目的の債券に分類することは否定されない。保有目的の変更を行った事業年度を含む2事業年度においては，取得した債券を満期保有目的の債券に分類することは否定される"},{"l":27,"m":"","sb":"","i":"A","r":"","q":"債却原価法を適用していた満期保有目的の債券に関して減損処理を行った場合，以後，償却原価法を適用してはならない。","a":true,"c":"","e":"償却原価法の適用が不要となるのは，取得差額はもはや金利調整差額とは考えられないためである"},{"l":28,"m":"","sb":"","i":"B","r":"","q":"子会社株式は，他の企業への支配力の行使を目的として保有しており，金融投資と同じく時価の変動を成果とはとらえないため，取得原価により評価される。","a":false,"c":"","e":"事業投資"},{"l":29,"m":"","sb":"","i":"B","r":"","q":"連結財務諸表上，子会社株式については子会社純資産の実質価額が反映され，関連会社株式については持分法により評価される。","a":true,"c":"","e":""},{"l":30,"m":"","sb":"","i":"A","r":"","q":"その他有価証券の評価差額は，洗替え方式に基づいて処理し，切放し方式は適用されない。","a":false,"c":"","e":"減損処理を行った場合，減損処理後の価額が翌期首の取得原価となり，切放し方式が適用される"},{"l":31,"m":"","sb":"","i":"A","r":"","q":"その他有価証券に属する株式，債券等の有価証券の種類ごとに全部純資産直入法と部分純資産直入法を区分して適用することは認められない。","a":false,"c":"","e":"認められる"},{"l":32,"m":"","sb":"","i":"B","r":"","q":"その他有価証券は，個々の保有目的等に応じてその性格付けをさらに細分化してそれぞれ会計処理を定める方法が認められる。","a":false,"c":"","e":"細分化してそれぞれ会計処理を定める方法が認められる訳ではなく，事業投資と金融投資の中間的な性格を有するものとして一括して捉えられており，細分化して会計処理を定める方法は採用されていない"},{"l":33,"m":"","sb":"","i":"B","r":"","q":"その他有価証券に属する債券を額面金額よりも低い金額で取得した場合，取得原価と時価との差額を評価差額として処理しなければならない。","a":false,"c":"","e":"取得差額が金利調整差額と認められれば，まず償却原価法を適用し，償却原価と時価との差額を評価差額として処理する"},{"l":34,"m":"","sb":"","i":"C","r":"","q":"施設利用権を化体した株式及び預託保証金であるゴルフ会員権の時価が著しく下落し，預託保証金の回収可能性に疑義が生じた場合，ゴルフ会員権評価損として処理する。","a":false,"c":"","e":"貸倒引当金繰入として処理する"},{"l":35,"m":"","sb":"","i":"A","r":"","q":"売買目的有価証券及び1年内に満期の到来する満期保有目的の債券は流動資産とされ，それ以外の有価証券は投資その他の資産とされる。","a":false,"c":"","e":"売買目的有価証券及び1年内に満期の到来する社債その他の債券は流動資産，それ以外の有価証券は投資その他の資産である（1年内に満期の到来するその他有価証券の債券は流動資産である）"},{"l":36,"m":"","sb":"","i":"A","r":"","q":"保有目的区分にしたがって表示が決定される","a":false,"c":"","e":"親会社株式のうち1年以内に処分されると認められるものは流動資産に表示し，それ以外のものは投資その他の資産に表示する"},{"l":37,"m":"","sb":"","i":"B","r":"","q":"株式の追加取得により持分比率が増加し，その他有価証券が子会社株式に該当することとなった場合には，その他有価証券の評価差額の処理方法に関わらず，帳簿価額で振り替える。","a":false,"c":"","e":"その他有価証券が子会社株式に該当することとなった場合には，帳簿価額で振り替える。その他有価証券の評価差額の会計処理として部分純資産直入法を採用しており，当該有価証券について評価差損を計上している場合には，時価による評価後の価額で振り替える"},{"l":39,"m":"","sb":"","i":"C","r":"","q":"市場価格のある株式については，決算日をもって，前回の配当実績又は公表されている1株当たり予想配当額に基づいて未収配当金を見積計上する。","a":false,"c":"","e":"各銘柄の配当落ち日"},{"l":40,"m":"","sb":"","i":"B","r":"","q":"時価を把握することが極めて困難と認められる債券については，償却原価法を適用した上で，債権の貸倒見積高の算定方法に準じて信用リスクに応じた償還不能見積高を算定する。","a":false,"c":"","e":"「時価の算定に関する会計基準」の公表により，時価を把握することが極めて困難と認められる有価証券は想定されなくなった"},{"l":41,"m":"","sb":"","i":"C","r":"","q":"運用目的の金銭の信託に係る信託財産の構成物の評価差額は，信託契約の終了時まで繰り延べる。","a":false,"c":"","e":"評価差額は，当期の損益とする"},{"l":42,"m":"","sb":"","i":"C","r":"","q":"運用目的の金銭の信託に係る信託財産の構成物である有価証券は，その他有価証券とみなしてその評価基準に従って処理する。","a":false,"c":"","e":"売買目的有価証券とみなしてその評価基準に従って処理する"},{"l":43,"m":"","sb":"","i":"C","r":"","q":"運用を目的とする金銭の信託は，信託財産の価値を保有期間中の配当収入と元本部分の価値に分けて捉えるため，それぞれの価値部分に区分して計上する。","a":false,"c":"","e":"保有期間中の配当収入と元本部分の価値の合計は時価そのものであり，区分せず計上する"},{"l":44,"m":"","sb":"","i":"C","r":"","q":"デリバティブ取引に係る債権と債務はそれぞれ貸借対照表に計上する。","a":false,"c":"","e":"正味の債権又は正味の債務を貸借対照表に計上"},{"l":45,"m":"","sb":"","i":"B","r":"","q":"一般債権は，債権全体の貸倒実績率では合理的な貸倒見積高が算定できないため，同種・同類の債権ごとに区分して貸倒見積高を算定する。","a":false,"c":"","e":"債権全体又は同種・同類の債権ごとに区分して貸倒見積高を算定する"},{"l":46,"m":"","sb":"","i":"B","r":"","q":"貸倒懸念債権は，債権の元本及び利息について元本の回収及び利息の受取りが見込まれるときから当期末までの期間にわたり改訂後の約定利子率で割り引いた金額の総額と債権の帳簿価額との差額を貸倒見積高とする方法を採用できる。","a":false,"c":"","e":"当初の約定利子率"},{"l":38,"m":"","sb":"","i":"C","r":"","q":"子会社株式及び関連会社株式の売却損益は，特別損益に，原則として売却益と売却損を相殺せずに総額で表示する。","a":true,"c":"","e":""},{"l":47,"m":"","sb":"","i":"B","r":"","q":"キャッシュ・フロー見積法における割引効果の時間の経過による実現分のうち貸倒見積高の減額分は，原則として，貸倒引当金戻入額として営業費用又は営業外費用から控除するか営業外収益に計上する。","a":false,"c":"","e":"原則として，受取利息に含めて処理する\n貸倒引当金戻入額による処理は例外である"},{"l":48,"m":"","sb":"","i":"B","r":"","q":"破産更生債権等は，債権額から担保の処分見込額及び保証による回収見込額を減額し，その残額について債務者の財政状態及び経営成績を考慮して貸倒見積高を算定する。","a":false,"c":"","e":"債務者の財政状態及び経営成績を考慮するのは，貸倒懸念債権に財務内容評価法を適用する場合であり，破産更生債権等の場合は考慮しない"},{"l":49,"m":"","sb":"","i":"C","r":"","q":"破産更生債権等については，すでに計上されている未収利息を当期の損失として処理するとともに，それ以後の期間に係る利息を計上してはならない。","a":true,"c":"","e":"なお，破産更生債権等の他，債務者から契約上の利払日を相当期間経過しても利息の支払を受けていない債権も対象となる"},{"l":50,"m":"","sb":"","i":"C","r":"","q":"破産更生債権等の貸倒見積高は，原則として，債権金額又は取得価額から直接減額するが，貸倒引当金として処理することもできる。","a":false,"c":"","e":"原則として直接減額するが，貸倒引当金として処理することもできる，直接減額もできる"},{"l":51,"m":"","sb":"","i":"C","r":"","q":"債権の回収可能性がほとんどないと判断された場合，貸倒損失額を債権から直接減額して，当該貸倒損失額と当該債権に係る前期貸倒引当金残高のいずれか少ない金額まで貸倒引当金を取り崩し，当期貸倒損失額と相殺しなければならない。この場合，当該債権に係る前期末の貸倒引当金が当期貸倒損失額に不足する場合，当該不足額を特別損失に計上する。","a":false,"c":"","e":"債権に係る前期末の貸倒引当金が当期貸倒損失額に不足する場合，当該不足額を債権の性格により原則として営業費用又は営業外費用に計上する"},{"l":52,"m":"","sb":"","i":"A","r":"","q":"貸倒見積高を債権から直接減額した後に，残存する帳簿価額を上回る回収があった場合には，原則として特別利益として当該期間に認識する。","a":false,"c":"","e":"営業外収益"},{"l":53,"m":"","sb":"","i":"B","r":"","q":"債権の貸倒見積高に基づき計上された貸倒引当金は，原則として，その債権が属する科目ごとに控除する形式で記載する。","a":true,"c":"","e":"なお，以下の方法が例外として認められている。・2以上の科目について，貸倒引当金又は減価償却累計額を一括して記載する方法・債権又は有形固定資産について，貸倒引当金又は減価償却累計額を控除した残額のみを記載し，当該貸倒引当金又は減価償却累計額を注記する方法"},{"l":54,"m":"","sb":"","i":"A","r":"","q":"ヘッジ会計におけるヘッジ対象には，貸借対照表上で認識されていない資産又は負債は含まれない。","a":false,"c":"","e":"ヘッジ対象には予定取引により発生が見込まれる資産又は負債が含まれる"},{"l":55,"m":"","sb":"","i":"A","r":"","q":"予定取引とは未履行の確定契約に係る取引をいう。","a":false,"c":"","e":"未履行の確定契約に係る取引及び契約は成立していないが，主要な取引条件が合理的に予測可能であり，かつ，それが実行される可能性が高い取引も予定取引に含まれる"},{"l":56,"m":"","sb":"","i":"C","r":"","q":"他に適当なヘッジ手段がなく，ヘッジ対象と異なる類型のデリバティブ取引をヘッジ手段として用いるクロスヘッジは，ヘッジ会計の対象とならない。","a":false,"c":"","e":"クロスヘッジは，ヘッジ会計の対象となる。クロスヘッジの例としては，ジェット燃料を使用している航空会社が原油先物市場でヘッジを行うことが挙げられる"},{"l":57,"m":"","sb":"","i":"B","r":"","q":"ヘッジ取引時においてヘッジ取引が企業のリスク管理方針に従ったものであることは，文書により確認しなければならない。","a":false,"c":"","e":"文書により確認するか，又は企業のリスク管理方針に関して明確な内部規程及び内部統制組織が存在し，当該取引がこれに従って処理されることが期待される必要がある"},{"l":58,"m":"","sb":"","i":"A","r":"","q":"ヘッジ会計は，ヘッジ対象である資産又は負債に係る相場変動等を損益に反映させることにより，その損益とヘッジ手段に係る損益とを同一の会計期間に認識する方法を原則とする。","a":false,"c":"","e":"ヘッジ対象である資産又は負債に係る相場変動を損益に反映させることにより，その損益とヘッジ手段に係る損益とを同一の会計期間に認識する方法を原則とする。時価評価されているヘッジ手段に係る損益又は評価差額を，ヘッジ対象に係る損益が認識されるまで純資産の部で繰り延べる方法（繰延ヘッジ）を原則とする"},{"l":59,"m":"","sb":"","i":"A","r":"","q":"その他有価証券をヘッジ対象とするヘッジ取引の会計処理には時価ヘッジを用いる。","a":false,"c":"","e":"繰延ヘッジ又は時価ヘッジのいずれかを選択することができる\n時価ヘッジの適用が認められているのはその他有価証券のみである"},{"l":60,"m":"","sb":"","i":"B","r":"","q":"時価ヘッジを採用し，ヘッジ対象たるその他有価証券の時価の変動要因のうち特定のリスク要素のみをヘッジの目的としているときは，ヘッジ取引開始以後に生じた時価の変動額の全額を当期の純損益に計上する。","a":false,"c":"","e":"当期の純損益に計上するのは，時価の変動要因のうち特定のリスク要素の変動に係る部分のみであり，その他の部分は純資産の部に計上する。例えば，金利スワップで社債の金利変動による価格変動リスクをヘッジしている場合，当該リスク要素の変動に係る時価の変動額のみ純損益計上する"},{"l":61,"m":"","sb":"","i":"B","r":"","q":"ヘッジ対象の損益認識時に繰延ヘッジ損益を純損益に計上するに当たり，繰延ヘッジ会計においては，原則としてデリバティブ損益として営業外費用に表示する。","a":false,"c":"","e":"ヘッジ対象の損益認識時に繰延ヘッジ損益を純損益に計上するに当たっては，原則としてヘッジ対象の損益区分と同一区分で表示する\n為替リスクのヘッジによるヘッジ損益については，為替差損益として処理することができる"},{"l":62,"m":"","sb":"","i":"B","r":"","q":"ヘッジ対象が複数の資産から構成されている場合（包括ヘッジ），ヘッジ会計の適用は認められない。","a":false,"c":"","e":"個々の資産が共通の相場変動等による損失の可能性にさらされており，かつ，その相場変動等に対して同様に反応する場合，ヘッジ会計の適用が認められる"},{"l":63,"m":"","sb":"","i":"B","r":"","q":"固定利付借入金に固定金利受取・変動金利支払いの金利スワップを付し，当該借入金と金利スワップがヘッジ会計の要件を充たし，かつ，想定元本，利息の受払条件及び契約期間がヘッジ対象となる借入金とほぼ同一である場合，キャッシュ・フロー・ヘッジに該当しないため，金利スワップの特例処理は認められない。","a":false,"c":"","e":"金利スワップの特例処理の要件を満たしており，当該処理が認められる"},{"l":64,"m":"","sb":"","i":"A","r":"","q":"ヘッジ手段が消滅した場合，繰り延べられているヘッジ手段に係る損益又は評価差額は，当期の損益として処理しなければならない。","a":false,"c":"","e":"ヘッジ手段が消滅した場合，ヘッジ会計の中止に該当し，繰り延べられているヘッジ手段に係る損益又は評価差額は，ヘッジ対象に係る損益が認識されるまで引き続き繰り延べる"},{"l":65,"m":"","sb":"","i":"A","r":"","q":"ヘッジ会計の要件が充たされなくなった場合に繰り延べられたヘッジ手段に係る損益について，ヘッジ対象に係る含み益が減少することによりヘッジ会計の終了時点で重要な損失が生じるおそれがあるときは，当該損失部分を見積り，当期の損失として処理することが容認される。","a":false,"c":"","e":"容認される\n本問の処理は強制されている"},{"l":66,"m":"","sb":"","i":"A","r":"","q":"ヘッジ対象である予定取引が実行されないことが明らかになった場合，繰り延べられているヘッジ手段に係る損益又は評価差額は，引き続き繰り延べる。","a":false,"c":"","e":"ヘッジ会計の終了に該当するため，ヘッジ手段に係る損益又は評価差額は，引き続き繰り延べるのではなく，当期の損益として処理する"},{"l":67,"m":"","sb":"","i":"A","r":"","q":"ヘッジ全体が有効と判定された場合，ヘッジ手段に生じた損益のうち非有効となった部分についても，ヘッジ会計の対象として繰延処理しなければならない。","a":false,"c":"","e":"非有効となった部分についても，ヘッジ会計の対象として繰延処理しなければならない，ヘッジ手段に生じた損益のうち非有効となった部分についても，ヘッジ会計の対象として繰延処理することができる"},{"l":68,"m":"","sb":"","i":"B","r":"","q":"転換社債型新株予約権付社債以外の新株予約権付社債は，社債と新株予約権が単独で存在し得るため，発行者側において区分法を原則とするが，一括法によることも認められている。","a":false,"c":"","e":"区分法によるのであり，一括法によることは認められていない\n区分法と一括法の双方が認められているのは転換社債型新株予約権付社債の発行者である"},{"l":69,"m":"","sb":"","i":"C","r":"","q":"転換社債型新株予約権付社債の取得者は，社債と新株予約権が単独で存在し得ないため，一括法によらなければならない。","a":true,"c":"","e":"なお，転換社債型新株予約権付社債以外の新株予約権付社債の取得者は，区分法によらなければならない"},{"l":70,"m":"","sb":"","i":"C","r":"","q":"新株予約権付社債の発行者側では，払込金額を社債の対価部分と新株予約権の対価部分に区分する際，市場価格の比率で区分する方法が認められている。","a":false,"c":"","e":"新株予約権付社債の取得者側"},{"l":71,"m":"","sb":"","i":"C","r":"","q":"払込資本を増加させる可能性がある部分を含む複合金融商品以外の複合金融商品は，原則として，それを構成する個々の金融資産又は金融負債に区分して処理する。","a":false,"c":"","e":"原則として，個々の金融資産又は金融負債に区分せず一体として処理する"},{"l":72,"m":"","sb":"","i":"C","r":"","q":"通貨オプションが組み合わされた円建借入金のように，現物の金融負債にリスクが及ぶ可能性がある場合に，当該複合金融商品の評価差額が損益に反映されないときには，当該複合金融商品を構成する個々の金融資産又は金融負債を区分して処理することが必要である。","a":true,"c":"","e":""}]},{"n":15,"name":"外貨換算","qs":[{"l":1,"m":"","sb":"","i":"C","r":"","q":"テンポラル法によると，通常の販売目的で保有する棚卸資産は取得時の為替相場で換算される。","a":false,"c":"","e":"取得原価で測定されている場合：取得時の為替相場／正味売却価額で測定されている場合：決算時の為替相場"},{"l":2,"m":"","sb":"","i":"C","r":"","q":"為替相場の変動が激しいときに決算日レート法を適用すると，換算のパラドックスが生じることがある。","a":false,"c":"","e":"複数レート法（例えば，テンポラル法）"},{"l":3,"m":"","sb":"","i":"A","r":"","q":"外貨建金銭債権債務の換算については，貨幣・非貨幣法を基本としつつ，流動・非流動法を加味した考え方が採用されている。","a":false,"c":"","e":"貨幣・非貨幣法を基本としつつ，流動・非流動法を加味した考え方は採用されていない"},{"l":4,"m":"","sb":"","i":"B","r":"","q":"在外子会社の貸借対照表の換算には決算日レート法が採用されており，すべての項目について単一レートによる換算が行われる。","a":false,"c":"","e":"すべての項目について単一レートによる換算が行われる訳ではなく，純資産の一部の項目については取得時又は発生時の為替相場で換算する"},{"l":5,"m":"","sb":"","i":"B","r":"","q":"「外貨建取引等会計処理基準」は二取引基準を採用しており，為替換算差額と為替決済損益はともに為替差損として損益計算書の営業損益に計上される。","a":false,"c":"","e":"営業外損益"},{"l":6,"m":"","sb":"","i":"C","r":"","q":"国内の製造業者が商社等を通じて輸出入取引を行う場合，当該国内の製造業者と商社の取引価額は邦貨で表示されるため，外貨建取引に該当しない。","a":false,"c":"","e":"外貨建取引に該当しない，輸出入取引によって商社等に生ずる為替差損益を製造業者が負担する（メーカーズ・リスク）等のため実質的に取引価額が外国通貨で表示されている取引は，外貨建取引に該当する"},{"l":7,"m":"","sb":"","i":"C","r":"","q":"取引発生時の為替相場は，取引が発生した日における直物為替相場又は合理的な基礎に基づいて算定された平均相場による。ただし，取引が発生した日の直近の一定日における直物為替相場によることも認められる。","a":true,"c":"","e":"平均相場の例：取引の行われた月又は週の前月又は週の直物為替相場を平均したもの／直近の一定日の為替相場の例：取引の行われた月又は週の前月若しくは前週の末日又は当月若しくは当週の初日の直物為替相場"},{"l":8,"m":"","sb":"","i":"C","r":"","q":"収益及び費用の換算に用いる期中平均相場は，1年間を算定期間としなければならない。","a":false,"c":"","e":"月又は半期等を算定期間とする平均相場を用いることができる"},{"l":9,"m":"","sb":"","i":"B","r":"","q":"決算時の為替相場としては，原則として決算日の直物為替相場を用いるが，継続適用を条件として，決算日の前後一定期間の直物為替相場に基づいて算出された平均相場を用いることが認められている。","a":false,"c":"","e":"決算日前後の為替相場の変動状況から判断して，決算日の直物為替相場が異常と認められることを条件として"},{"l":10,"m":"","sb":"","i":"C","r":"","q":"外貨建取引は，取引発生時において円換算額をもって記録する方法を採用しなければならない。","a":false,"c":"","e":"取引発生時の外国通貨の額をもって記録する方法（多通貨会計）の採用が認められている\n多通貨会計は外貨建債権債務及び外国通貨の保有状況ならびに決済方法等から外国通貨により記録することが合理的であると認められる場合に適用が認められる"},{"l":11,"m":"","sb":"","i":"B","r":"","q":"為替予約の会計処理について，「金融商品に関する会計基準」による原則的な処理方法である独立処理から振当処理へ変更することが認められている。","a":false,"c":"","e":"認められていない\nなお，振当処理から独立処理への変更は，特例的な方法から原則的な方法への変更のため認められる"},{"l":12,"m":"","sb":"","i":"B","r":"","q":"独立処理を採用する場合には，ヘッジ会計の要件を満たすか否かの判定は要しない。","a":true,"c":"","e":"独立処理はヘッジ会計の適用ではないためである"},{"l":13,"m":"","sb":"","i":"B","r":"","q":"外貨建取引の発生後に外貨建金銭債権債務に対して為替予約を付した場合，振当処理の適用上，外貨建金銭債権債務の取得時又は発生時の為替相場による円換算額と為替予約による円貨額との差額は，予約日の属する期から決済日の属する期までの期間にわたって合理的な方法により配分し，各期の損益として処理しなければならない。","a":false,"c":"","e":"差額のうち，直々差額は予約日の属する期の損益として処理し，直先差額は予約日の属する期から決済日の属する期までの期間にわたって合理的な方法により配分し，各期の損益として処理する"},{"l":14,"m":"","sb":"","i":"B","r":"","q":"振当処理を適用した場合，取得時又は発生時の為替相場による円換算額と為替予約等による円貨額との差額のうち次期以降に配分される額は，貸借対照表上，純資産の部に記載する。","a":false,"c":"","e":"資産の部又は負債の部に記載する"},{"l":15,"m":"","sb":"","i":"B","r":"","q":"各期に配分された外貨建金銭債権債務等に係る為替予約差額は，為替差損益に含めて表示しなければならない。","a":false,"c":"","e":"為替差損益に含めて表示する方法の他，利息の調整項目として処理することができる"},{"l":16,"m":"","sb":"","i":"C","r":"","q":"為替予約差額のうち次期以降に配分された額は，貸借対照表上，長期前払費用又は長期前受収益を相殺表示する。","a":false,"c":"","e":"長期前払費用又は長期前受収益として両建てで表示する\n決済日が決算日から1年内に到来するものは，前払費用又は前受収益として表示する"},{"l":17,"m":"","sb":"","i":"C","r":"","q":"為替予約等の対象となった外貨建金銭債権債務等が予約等の決済日前に消滅した場合，直先差額は引き続き繰り延べる。","a":false,"c":"","e":"振当処理を終了し，直先差額は当該金銭債権債務等が消滅した期の損益として処理する"},{"l":18,"m":"","sb":"","i":"B","r":"","q":"振当処理を適用した場合，為替予約は金銭債権債務に振り当てられるため，ヘッジ対象の種類に関わらず為替予約は個別に認識されない。","a":false,"c":"","e":"ヘッジ対象の種類に関わらず為替予約は個別に認識される\n予定取引をヘッジ対象としている場合には，個別に認識される"},{"l":19,"m":"","sb":"","i":"C","r":"","q":"為替予約等が物品の売買又は役務の授受に係る外貨建金銭債権債務に対して，取引発生時以前に締結されている場合には，振当処理の適用上，外貨建取引及び金銭債権債務に為替予約相場による円換算額を付さなければならない。","a":false,"c":"","e":"外貨建取引及び金銭債権債務に為替予約相場による円換算額を付すことができる"},{"l":20,"m":"","sb":"","i":"C","r":"","q":"振当処理の対象となる外貨建金銭債権債務等は，為替予約等を付すことにより将来のキャッシュ・フローが固定されるものに限られる。","a":true,"c":"","e":""},{"l":21,"m":"","sb":"","i":"C","r":"","q":"外貨建その他有価証券は，たとえヘッジ会計の要件を満たすとしても，為替予約等の振当処理は認められない。","a":true,"c":"","e":"売却時期が未確定であること，また，時価の変動により受け取る外貨額が変動することから，為替予約等によりキャッシュ・フローを固定することは困難と考えられるためである"},{"l":22,"m":"","sb":"","i":"C","r":"","q":"額面金額と異なる金額で取得した外貨建満期保有目的の債券に為替予約を締結し，振当処理を採用している場合，外貨建ての取得価額を為替予約相場により円換算する。","a":false,"c":"","e":"外貨建ての償却原価金額（額面金額）を為替予約相場により円換算する"},{"l":23,"m":"","sb":"","i":"C","r":"","q":"ドル建ての満期保有目的の債券の取得後に，満期償還外貨を円転せずにドル建ての固定資産等に再投資することを決定した場合，当該債券の換算差額を繰り延べて再投資する資産の取得価額の調整に充てることができる。","a":false,"c":"","e":"ドル建ての満期保有目的の債券の取得の当初"},{"l":24,"m":"","sb":"","i":"B","r":"","q":"売買目的有価証券については，外国通貨による時価を決算時の為替相場により円換算した額を付し，換算差額は為替差損益として処理する。","a":true,"c":"","e":"換算差額は為替差損益として処理する，「金融商品に関する会計基準」の評価差額に関する処理方法に従い，有価証券評価損益として処理する"},{"l":25,"m":"","sb":"","i":"A","r":"","q":"その他有価証券に属する株式については，外国通貨による時価を決算時の為替相場で換算した金額のうち，外国通貨による時価の変動に係る換算差額を評価差額とし，それ以外の換算差額については為替差損益として処理する。","a":false,"c":"","e":"その他有価証券に属する債券\n本問はその他有価証券の換算の特例処理であるが，これは金銭債権等の換算方法との整合性を根拠とするため，その他有価証券に属する株式には認められない"},{"l":26,"m":"","sb":"","i":"B","r":"","q":"子会社株式及び関連会社株式への投資は，金融投資としての性質を有し，その外貨の属性が取得原価であるため，取得時の為替相場により換算する。","a":false,"c":"","e":"事業投資"},{"l":27,"m":"","sb":"","i":"B","r":"","q":"外貨建有価証券について時価の著しい下落により評価額の引下げが求められる場合に生じる換算差額は，為替差損として処理される。","a":false,"c":"","e":"有価証券評価損"},{"l":28,"m":"","sb":"","i":"B","r":"","q":"市場価格のない外貨建株式について，株式の実質価額が著しく低下した場合には減損処理を行うが，この判断は，円換算後の実質価額と取得原価を比較する。","a":false,"c":"","e":"外貨建の実質価額と外貨建の取得原価"},{"l":29,"m":"","sb":"","i":"B","r":"","q":"外貨建ての前渡金は，金銭債権に準じて決算時の為替相場による円換算額を付す。","a":false,"c":"","e":"金銭授受時の為替相場\n外貨建未収収益及び未払費用は金銭債権債務に準ずるものとして決算時の為替相場で円換算する"},{"l":30,"m":"","sb":"","i":"B","r":"","q":"その他有価証券に属する市場価格のない外貨建株式等については，取得原価を取得時の直物為替相場により換算する。","a":false,"c":"","e":"決算時の直物為替相場"},{"l":31,"m":"","sb":"","i":"C","r":"","q":"外貨建自社発行新株予約権の決算時の円貨への換算は，発行時の為替相場による。","a":true,"c":"","e":"将来株主資本又は利益に振り替えられる可能性のある仮勘定であるから，権利行使の有無が確定するまで発行時の為替相場による円換算額を付す"},{"l":32,"m":"","sb":"","i":"B","r":"","q":"在外子会社か在外支店かは法的形式の違いにすぎず，いずれも経済的に単一の組織を構成している点で変わりはないため，換算の方法も同一であることが要求されている。","a":false,"c":"","e":"いずれも経済的に単一の組織を構成している点で変わりはないため，換算の方法も同一であることが要求されている，現行の会計基準上は，在外子会社と在外支店という法的な形式の違いに基づき，異なる換算方法が要求されている"},{"l":33,"m":"","sb":"","i":"B","r":"","q":"在外支店の収益及び費用（収益性負債の収益化額及び費用性資産の費用化額を除く）の換算については，期中平均相場によらなければならない。","a":false,"c":"","e":"期中平均相場によることができる"},{"l":34,"m":"","sb":"","i":"B","r":"","q":"在外支店の財務諸表項目の換算について，非貨幣性項目の金額に重要性がない場合，すべての貸借対照表項目（支店における本店勘定等を除く）を決算時の為替相場で換算することができるが，この場合，損益項目についても決算時の為替相場で換算する。","a":false,"c":"","e":"損益項目についても決算時の為替相場で換算することが認められる\n決算時の為替相場で換算のみ損益項目には，収益性負債の収益化額及び費用性資産の費用化額も含まれる"},{"l":35,"m":"","sb":"","i":"B","r":"","q":"在外支店の財務諸表項目につき，本店と異なる方法により換算することによって生じた換算差額は，為替換算調整勘定として処理する。","a":false,"c":"","e":"当期の為替差損益"},{"l":36,"m":"","sb":"","i":"B","r":"","q":"在外子会社の財務諸表項目の換算にあたり，親会社による株式の取得後に生じた株主資本に属する項目については，決算時の為替相場による円換算額を付す。","a":false,"c":"","e":"当該項目の発生時の為替相場"},{"l":37,"m":"","sb":"","i":"B","r":"","q":"在外子会社の財務諸表項目の換算にあたり，非支配株主持分については，当該項目の発生時の為替相場による円換算額を付す。","a":false,"c":"","e":"決算時の為替相場"},{"l":38,"m":"","sb":"","i":"B","r":"","q":"在外子会社の新株予約権は，決算時の為替相場で換算する。","a":false,"c":"","e":"発生時の為替相場"},{"l":39,"m":"","sb":"","i":"B","r":"","q":"在外子会社の新株予約権に係る為替換算調整勘定は，新株予約権に含めて表示する。","a":true,"c":"","e":"このような表示が要求されているため，決算時の為替相場による円換算額と同額になる"},{"l":40,"m":"","sb":"","i":"B","r":"","q":"外貨建のれんは，発生時の為替相場で換算する。","a":false,"c":"","e":"決算時の為替相場"},{"l":41,"m":"","sb":"","i":"B","r":"","q":"在外子会社の収益及び費用については，原則として，決算時の為替相場で換算するが，期中平均相場で換算することもできる。","a":false,"c":"","e":"原則として，期中平均相場で換算するが，決算時の為替相場で換算することもできる"},{"l":42,"m":"","sb":"","i":"B","r":"","q":"子会社に対する持分への投資をヘッジ対象としたヘッジ手段から生じた為替換算差額については，為替換算調整勘定に含めて処理する方法を採用しなければならない。","a":false,"c":"","e":"為替換算調整勘定に含めて処理する方法を採用することができる\nヘッジ手段から発生する換算差額がヘッジ対象となる子会社に対する持分から発生する為替換算調整勘定を上回った場合には，その超える額を当期の純損益として処理する"},{"l":43,"m":"","sb":"","i":"A","r":"","q":"子会社株式を売却した場合，連結貸借対照表に計上されている為替換算調整勘定のうち持分比率の減少割合相当額を取り崩し，損益に計上しなければならない。","a":false,"c":"","e":"支配を喪失しない範囲内で子会社株式を売却した場合，資本剰余金に振り替える。支配を喪失する場合，株式売却損益に含めて損益に計上する"}]},{"n":16,"name":"収益認識","qs":[{"l":1,"m":"","sb":"","i":"C","r":"","q":"「収益認識に関する会計基準」は個別財務諸表には適用されない。","a":false,"c":"","e":"連結財務諸表及び個別財務諸表に適用される"},{"l":2,"m":"","sb":"","i":"B","r":"","q":"「収益認識に関する会計基準」は，固定資産の売却やリースについても適用される。","a":false,"c":"","e":"固定資産の売却やリースについては適用されない"},{"l":3,"m":"","sb":"","i":"B","r":"","q":"契約資産とは，企業が顧客に移転した財又はサービスと交換に受け取る対価に対する企業の権利をいい，顧客との契約から生じた債権を含む。","a":false,"c":"","e":"顧客との契約から生じた債権は含まれない"},{"l":4,"m":"","sb":"","i":"A","r":"","q":"契約の識別に際しては，当事者が，書面，取引慣行等により契約を承認し，それぞれの義務の履行を約束していることが必要となり，口頭による承認は含まれない。","a":false,"c":"","e":"口頭による承認も含まれる"},{"l":5,"m":"","sb":"","i":"B","r":"","q":"企業が権利を得ることとなる対価を回収する可能性の高さは，取引価格の算定上考慮されるため，契約の識別要件とはされていない。","a":false,"c":"","e":"契約の識別要件とされている"},{"l":6,"m":"","sb":"","i":"C","r":"","q":"顧客との契約が識別要件を満たさない場合には，当該契約を事後的に満たすかどうかを引き続き評価する。","a":true,"c":"","e":""},{"l":7,"m":"","sb":"","i":"B","r":"","q":"顧客との契約が識別要件を満たさない場合において，顧客から対価を受け取った際には，受け取った対価を収益として認識することは認められない。","a":false,"c":"","e":"財又はサービスを顧客に移転する残りの義務がなく，約束した対価のほとんどすべてを受け取っており，顧客への返金は不要であること，又は，契約が解約されており，顧客から受け取った対価の返金は不要であることのいずれかに該当するときに，受け取った対価を収益として認識する"},{"l":8,"m":"","sb":"","i":"C","r":"","q":"同一の顧客と同時又はほぼ同時に締結した複数の契約について，一定要件に該当する場合は，当該複数の契約を結合し，単一の契約とみなして処理する。","a":true,"c":"","e":""},{"l":9,"m":"","sb":"","i":"B","r":"","q":"契約変更について，別個の財又はサービスの追加により契約の範囲が拡大され，変更される契約の価格が，追加的に約束した財又はサービスに対する独立販売価格を反映する場合，既存の契約を解約して新しい契約を締結したものと仮定して処理する。","a":false,"c":"","e":"契約変更を独立した契約として処理する"},{"l":10,"m":"","sb":"","i":"B","r":"","q":"契約変更が独立した契約として処理されない場合，未だ移転していない財又はサービスが契約変更日以前に移転した財又はサービスと別個のものである場合には，契約変更を既存の契約の一部であると仮定して処理する。","a":false,"c":"","e":"契約変更を既存の契約を解約して新しい契約を締結したものと仮定して処理する\n未だ移転していない財又はサービスが契約変更日以前に移転した財又はサービスと別個のものではなく，契約変更日において部分的に充足されている単一の履行義務の一部を構成する場合には，契約変更を既存の契約の一部であると仮定して処理する"},{"l":11,"m":"","sb":"","i":"C","r":"","q":"一連の別個の財又はサービスは，一定の期間にわたり充足される履行義務に該当する。","a":true,"c":"","e":"一連の別個の財又はサービスは，一定の期間にわたり充足される履行義務に該当し，進捗度に応じて収益が認識される"},{"l":12,"m":"","sb":"","i":"A","r":"","q":"取引価格の算定上，顧客から受け取った又は受け取る対価の一部あるいは全部を顧客に返金すると見込む場合，受け取った又は受け取る対価の額のうち，企業が権利を得ると見込まない額について，契約負債を認識する。","a":false,"c":"","e":"返金負債を認識する\n返金負債の額は毎期見直す"},{"l":13,"m":"","sb":"","i":"B","r":"","q":"顧客に約束した財又はサービスは，①財又はサービスが別個のものとなる可能性があること，②財又はサービスを顧客に移転する約束が契約の観点において別個のものとなることの要件のいずれかを満たす場合には，別個のものとする。","a":false,"c":"","e":"①及び②の要件のいずれも満たす場合，別個のものとする"},{"l":14,"m":"","sb":"","i":"B","r":"","q":"変動対価の額の見積りにあたっては，原則として期待値による方法を用いる。","a":false,"c":"","e":"最頻値による方法又は期待値による方法のいずれかのうち，企業が権利を得ることとなる対価の額をより適切に予測できる方法を用いる"},{"l":15,"m":"","sb":"","i":"A","r":"","q":"見積られた変動対価の額については，変動対価の額に関する不確実性が事後的に解消される際に，解消される時点までに計上された収益の著しい減額が発生しないことが確実な部分に限り，取引価格に含める。","a":false,"c":"","e":"計上された収益の著しい減額が発生しない可能性が高い部分は，取引価格に含める"},{"l":16,"m":"","sb":"","i":"A","r":"","q":"顧客との契約に重要な金融要素が含まれる場合，顧客との契約から生じる収益は約束した対価の額で認識する。","a":false,"c":"","e":"顧客との契約から生じる収益は現金販売価格を反映する金額で認識する\n契約における取引開始日において，約束した財又はサービスを顧客に移転する時点と顧客が支払を行う時点の間が1年以内であると見込まれる場合，重要な金融要素の影響について約束した対価の額を調整しないことができる"},{"l":17,"m":"","sb":"","i":"B","r":"","q":"顧客に支払われる対価は，企業が顧客に対して支払う現金の額であり，顧客が企業に対する債務額に充当できるものの額は含まない。","a":false,"c":"","e":"顧客が企業に対する債務額に充当できるものの額を含む（例えば，クーポン）"},{"l":18,"m":"","sb":"","i":"B","r":"","q":"顧客に支払われる対価を取引価格から減額する場合には，①関連する財又はサービスの移転に対する収益を認識する時，又は，②企業が対価を支払うか又は支払を約束する時のいずれか早い方が発生した時点で（又は発生するについて），収益を減額する。","a":false,"c":"","e":"いずれか遅い方"},{"l":19,"m":"","sb":"","i":"C","r":"","q":"財又はサービスの独立販売価格を直接観察できない場合の独立販売価格の見積方法には，調整した市場評価アプローチ，予想コストに利益相当額を加算するアプローチ，残余アプローチなどが考えられるが，これらの方法を併用することは想定されていない。","a":false,"c":"","e":"財又はサービスの独立販売価格を直接観察できない場合に，当該財又はサービスのうち複数の独立販売価格が大きく変動する又は確定していないときには，複数の方法を組み合わせて，独立販売価格を見積る"},{"l":20,"m":"","sb":"","i":"B","r":"","q":"契約における取引開始日後の独立販売価格の変動を考慮して，その時点における独立販売価格の比率で取引価格を履行義務に配分する。","a":false,"c":"","e":"取引開始日後の独立販売価格の変動を考慮せず，契約における取引開始日と同じ基礎により契約における履行義務に配分する"},{"l":21,"m":"","sb":"","i":"B","r":"","q":"取引価格の事後的な変動のうち，既に充足した履行義務に配分された額については，過去の収益の額を遡及修正する。","a":false,"c":"","e":"取引価格が変動した期の収益の額を修正する"},{"l":22,"m":"","sb":"","i":"A","r":"","q":"企業は資産を顧客に移転することにより履行義務を充足した時に又は充足するにつれて，収益を認識する。資産が移転するのは，企業が当該資産に対する支配を喪失した時又は喪失するにつれてである。","a":false,"c":"","e":"資産が移転するのは，顧客が当該資産に対する支配を獲得した時又は獲得するにつれてとされており，顧客の観点から支配の移転を検討する"},{"l":23,"m":"","sb":"","i":"B","r":"","q":"顧客が資産を物理的に占有する場合には，顧客が当該資産の使用を指図し，当該資産からの残りの便益のほとんどすべてを享受する能力又は他の企業が当該便益を享受することを制限する能力を有しており，資産に対する支配を獲得する。","a":false,"c":"","e":"買戻契約，委託販売契約，請求済未出荷契約等，物理的占有が資産に対する支配と一致しない場合がある"},{"l":24,"m":"","sb":"","i":"A","r":"","q":"一時点で充足される履行義務に該当するための3要件を満たさない場合，一定の期間にわたり充足される履行義務として収益を認識する。","a":false,"c":"","e":"一定期間で充足される履行義務に該当するための3要件を満たさない場合，一時点で充足される履行義務として収益を認識する"},{"l":25,"m":"","sb":"","i":"B","r":"","q":"企業が顧客との契約における義務を履行することにより別の用途に転用することができない資産が生じる，又は企業が顧客との契約における義務の履行を完了した部分について，対価を収受する強制力のある権利を有している場合，一定期間にわたって充足される履行義務とされる。","a":false,"c":"","e":"又は→かつ\n本問の要件を満たし，一定期間にわたって充足される履行義務とされる例はコンサルティング・サービスである"},{"l":26,"m":"","sb":"","i":"B","r":"","q":"履行義務の充足に係る進捗度を合理的に見積ることができないが，当該履行義務を充足する際に発生する費用を回収することが見込まれる場合，履行義務の充足に係る進捗度を合理的に見積ることができる時まで，収益を認識しない。","a":false,"c":"","e":"原価回収基準により収益を認識する"},{"l":27,"m":"","sb":"","i":"B","r":"","q":"財又はサービスを顧客に移転する前に顧客から対価を受け取る場合，顧客から対価を受け取った時又は対価を受け取る期限が到来した時のいずれか遅い時点で，顧客から受け取る対価について契約負債を計上する。","a":false,"c":"","e":"いずれか早い時点"},{"l":28,"m":"","sb":"","i":"B","r":"","q":"約束した財に対する保証が，該取引が合意された仕様に従っているという保証に加えて，顧客にサービスを提供する保証を含む場合，保証サービスは引当金として処理する。","a":false,"c":"","e":"保証サービスは履行義務であり，取引価格を財及び保証サービスに配分する\nなお，合意された仕様に従っているという保証は引当金として処理する"},{"l":29,"m":"","sb":"","i":"A","r":"","q":"顧客との契約において，既存の契約に加えて追加の財又はサービスを取得するオプションを顧客に付与する場合，当該オプションが当該契約を締結しなければ顧客が受け取れない重要な権利を顧客に提供するときにのみ，当該オプションから履行義務が生じる。","a":true,"c":"","e":""},{"l":30,"m":"","sb":"","i":"B","r":"","q":"当社は仕入先との間で消化仕入契約を行っており，顧客への商品販売時に，商品の法的所有権は仕入先から当社に移転し，同時に顧客に移転する。この場合，当社は商品について顧客に提供される前に支配しているため，本人に該当するものとして収益を総額で認識する。","a":false,"c":"","e":"法的所有権が瞬時に顧客に移転される場合，当社は商品を支配していることにならないため，代理人に該当するものとして手数料等の金額を収益として純額で認識する"},{"l":31,"m":"","sb":"","i":"C","r":"","q":"契約負債における非行使部分については，顧客が残りの権利を行使する可能性が極めて低くなった時に収益を認識する。","a":true,"c":"","e":"企業が将来において権利を得ると見込む場合：顧客による権利行使のパターンと比例的に収益を認識／企業が将来において権利を得ると見込まない場合：顧客が残りの権利を行使する可能性が極めて低くなった時に収益を認識"},{"l":32,"m":"","sb":"","i":"C","r":"","q":"企業が商品のコール・オプションを有しており，商品の買戻価格が当初の販売価格以上の場合には，リース取引として処理する。","a":false,"c":"","e":"金融取引\n企業が商品のコール・オプションを有しており，商品の買戻価格が当初の販売価格以上の場合には，実質的に金利を支払うことになるため，金融取引として処理する"},{"l":33,"m":"","sb":"","i":"B","r":"","q":"企業が商品を最終顧客に販売するために販売業者に引き渡す場合，当該引渡時に収益を認識する。","a":false,"c":"","e":"企業が商品の返還を要求することあるいは第三者に商品を販売することができるなど，契約が委託販売契約に該当する場合，販売業者へ引渡時に収益を認識しない"},{"l":34,"m":"","sb":"","i":"B","r":"","q":"工事契約を締結した当初から損失が見込まれる場合，契約締結時点では引当金の計上対象とならない。","a":false,"c":"","e":"契約締結時点で引当金の計上対象となる\n損失の発生は工事契約を締結したという過去の事象に起因しているため"},{"l":35,"m":"","sb":"","i":"B","r":"","q":"工事契約について，工事原価総額等が工事収益総額を超過する可能性が高く，かつ，その金額を合理的に見積ることができる場合には，その超過すると見込まれる額を，工事損失が見込まれた期の損失として処理し，工事損失引当金を計上する。","a":false,"c":"","e":"工事原価総額等が工事収益総額を超過すると見込まれる額のうち，当該工事契約に関して既に計上された損益の額を控除した残額を工事損失引当金として計上する"},{"l":36,"m":"","sb":"","i":"B","r":"","q":"工事損失引当金の繰入額は販売費及び一般管理費に含め，工事損失引当金の残高は貸借対照表に流動負債として計上する。","a":false,"c":"","e":"工事損失引当金の繰入額は売上原価に含める"},{"l":37,"m":"","sb":"","i":"B","r":"","q":"同一の工事契約に関する棚卸資産と工事損失引当金がともに計上される場合には，貸借対照表の表示上，相殺して表示しなければならない。","a":false,"c":"","e":"相殺して表示することができる"},{"l":38,"m":"","sb":"","i":"B","r":"","q":"「収益認識に関する会計基準」では，財の販売から生じる収益を「売上高」，サービスの提供から生じる収益を「営業収益」，代理人として獲得する収益を「手数料収益」などの科目で表示する指針が示されている。","a":false,"c":"","e":"顧客との契約から生じる収益の表示科目を決定するための具体的な指針は示されていない\n一定の表示科目に統一することのコンセンサスを得ることは難しいものと考えられるため"},{"l":39,"m":"","sb":"","i":"B","r":"","q":"顧客との契約から生じる収益については，それ以外の収益と区分して損益計算書に表示しなければならない。","a":false,"c":"","e":"区分して損益計算書に表示せず，顧客との契約から生じる収益の額を注記することも認められる"},{"l":40,"m":"","sb":"","i":"B","r":"","q":"重要な金融要素の影響は顧客との契約から生じる収益に含めて計上して，当該影響を注記することが認められている。","a":false,"c":"","e":"顧客との契約から生じる収益と金融要素の影響（受取利息又は支払利息）を損益計算書において区分して表示する"},{"l":41,"m":"","sb":"","i":"B","r":"","q":"契約資産と顧客との契約から生じた債権は，貸借対照表の他の資産と区分して表示しなければならない。","a":false,"c":"","e":"他の資産と区分して表示せず，それぞれの残高を注記することも認められる\n契約負債についても貸借対照表において他の負債と区分して表示するか，区分して表示せず残高を注記することが認められている"},{"l":42,"m":"","sb":"","i":"C","r":"","q":"返金負債の決済時に顧客から商品又は製品を回収する権利として認識した資産は，返金負債と相殺表示することが認められる。","a":false,"c":"","e":"相殺表示することが認められない\n返金負債の決済時に顧客から商品又は製品を回収する権利として認識した資産は，返金資産である"},{"l":43,"m":"","sb":"","i":"A","r":"","q":"次の①～⑧で「収益認識に関する会計基準」に照らして適切なものを指摘しなさい。①返品権付販売において，将来の返品に備えて返品調整引当金を計上した。②消費税の会計処理に関して税込方式を採用し，収益に計上している。③割賦販売について，割賦金の回収期限の到来の日又は入金の日をもって収益を認識した。④メーカーである当社は顧客である小売チェーンと製品Aの販売契約を締結し，製品Aの保管コストとして顧客に支払った現金を販売費及び一般管理費に計上した。⑤製品を出荷してから国内の顧客による検収時までの期間が通常の期間である場合において，出荷時に収益を認識した。⑥当社は商品を顧客が購入するごとにポイントを付与しており，将来，権利行使が見込まれるポイントについてポイント引当金を計上した。⑦有償支給取引において，支給品を支給先に譲渡し，企業が支給品を買い戻す義務を負っている場合，企業は連結財務諸表上，当該支給品の消滅を認識せず，譲渡に係る収益を認識した。⑧請求済未出荷契約においては，企業が商品に対する占有を保持しているため，顧客が支配を獲得したとは認められない。","a":false,"c":"","e":"適切なもの：⑤。①返品権付販売は変動対価に該当し，受け取った対価のうち返品が見込まれる部分を返金負債に計上するとともに，返金負債の決済時に顧客から製品を回収する権利を返品資産に計上する。②消費税等が第三者のために回収する額であるため，税抜方式を採用し，収益に含めない。③割賦販売は，一時点で充足される履行義務に該当するため，商品等に対する支配が顧客に移転する販売時に収益を認識する。④本問は顧客に支払われる対価に該当するため，取引価格（収益）から減額する。⑤従来の実務等に配慮し，国内における販売を前提とし，製品出荷時から顧客による検収時までの期間が通常の期間である場合には出荷時や着荷時等に収益を認識することが認められる。⑥本肢におけるポイントは履行義務に該当するため，契約負債を計上する。⑦有償支給取引において，支給品を支給先に譲渡し，企業が支給品を買い戻す義務を負っている場合，企業は当該支給品の消滅を認識せず，譲渡に係る収益も認識しない（なお，個別財務諸表においては，支給品の譲渡時に当該支給品の消滅を認識することができる）。企業が支給品を買い戻す義務を負っていない場合：顧客が支配を獲得するが，有償支給時と外部販売時における収益の二重計上を避けるため，有償支給時には収益を認識しない（支給品の消滅の認識は行う）。⑧請求済未出荷契約を締結した合理的な理由があるなどの一定の要件を満たす場合，顧客が支配を獲得したと認められる"}]},{"n":17,"name":"リース（現行・新基準）","qs":[{"l":1,"m":"","sb":"","i":"B","r":"","q":"未経過のリース期間に係るリース料の概ね全額を支払うことによってリース期間の中途で解約が可能なものは，解約不能の要件を満たさない。","a":false,"c":"","e":"事実上解約不能と認められるリース取引として解約不能の要件を満たす"},{"l":2,"m":"","sb":"","i":"A","r":"","q":"現在価値基準と経済的耐用年数基準のいずれかに該当する場合，オペレーティング・リース取引と判定される。","a":false,"c":"","e":"ファイナンス・リース取引と判定される\n例外的に，リース期間が経済的耐用年数の概ね75パーセント以上であっても，リース物件の特性，経済的耐用年数の長さ，リース物件の中古市場の存在等により，借手がリース物件に係るほとんどすべてのコストを負担しないことが明らかな場合には現在価値基準のみにより判定を行う"},{"l":3,"m":"","sb":"","i":"A","r":"","q":"現在価値の計算をすべてのリース取引について行うことは実務上極めて困難と考えられるため，簡便法としての経済的耐用年数基準を設けている。","a":true,"c":"","e":""},{"l":4,"m":"","sb":"","i":"A","r":"","q":"現在価値基準は，解約不能のリース期間中のリース料総額の現在価値が，当該リース物件を借手が現金で購入するものと仮定した場合の合理的見積額の概ね75%以上である場合にファイナンス・リース取引と判定する。","a":false,"c":"","e":"90%\n数値基準は「概ね」とされているため，88%又は73%でも実質的にフルペイアウトと考えられる場合，ファイナンス・リース取引と判定される"},{"l":5,"m":"","sb":"","i":"B","r":"","q":"現在価値基準においてリース料総額を算定する際には，原則として維持管理費用相当額や残価保証額を控除する。","a":false,"c":"","e":"維持管理費用は控除するが残価保証額はリース料総額に含める"},{"l":6,"m":"","sb":"","i":"B","r":"","q":"経済的耐用年数基準の適用上はリース物件の物理的使用可能期間に見合った年数を用いる。","a":false,"c":"","e":"経済的使用可能予測期間に見合った年数\n経済的使用可能予測期間と著しい相違がある等の不合理と認められる事情のない限り，税法耐用年数を用いて判定を行う"},{"l":7,"m":"","sb":"","i":"B","r":"","q":"所有権移転ファイナンス・リース取引は，所有権移転条項付リース，割安購入選択権付リース，特別仕様のリース物件の3要件を満たしたものである。","a":false,"c":"","e":"いずれかの要件を満たすものである"},{"l":8,"m":"","sb":"","i":"B","r":"","q":"土地については，所有権移転条項付リース又は割安購入選択権付リースを除き，所有権移転外ファイナンス・リース取引に該当するものと推定する。","a":false,"c":"","e":"オペレーティング・リース取引に該当するものと推定する\n土地の経済的耐用年数は無限であり，通常，フルペイアウトのリースに該当しないため"},{"l":9,"m":"","sb":"","i":"C","r":"","q":"ファイナンス・リース取引を売買取引として会計処理することにより，資産の割賦売買取引との会計処理の比較可能性を確保することができる。","a":true,"c":"","e":""},{"l":10,"m":"","sb":"","i":"C","r":"","q":"所有権移転外ファイナンス・リース取引は，売買処理と同様の結果の注記を条件として，通常の賃貸借取引に準じて会計処理を行うことが認められている。","a":false,"c":"","e":"認められていない\n従来は，売買処理と同様の結果の注記を条件として賃貸借処理が認められていた"},{"l":11,"m":"","sb":"","i":"B","r":"","q":"所有権移転外ファイナンス・リース取引は，使用する権利の売買の性格を有するため，リース料の総額の割引現在価値をもって資産及び負債を計上する。","a":false,"c":"","e":"リース料の総額の割引現在価値と購入価額等のいずれか低い方の額で資産及び負債を計上する\n所有権移転ファイナンス・リース取引：貸手の購入価額等が明らかな場合：貸手の購入価額等／貸手の購入価額等が明らかでない場合：リース料の総額の割引現在価値と購入価額等のいずれか低い方の額（割安購入選択権の行使価額を含む）"},{"l":12,"m":"","sb":"","i":"B","r":"","q":"リース取引開始日とは，リース契約が締結された日をいう。","a":false,"c":"","e":"借手が，リース物件を使用収益する権利を行使することができることとなった日"},{"l":13,"m":"","sb":"","i":"A","r":"","q":"リース資産及びリース債務の計上額の算定にあたっては，原則としてリース料総額から利息相当額の合理的な見積額を控除しない方法による。","a":false,"c":"","e":"原則としてリース料総額から利息相当額の合理的な見積額を控除する方法"},{"l":14,"m":"","sb":"","i":"B","r":"","q":"リース資産及びリース債務の計上にあたって，リース料総額の割引現在価値を基礎とするのは，リース資産の価値評価を重視する考え方に基づく。","a":false,"c":"","e":"リース料総額の割引現在価値を基礎とするのはリース債務の評価を重視する考え方に基づく\nリース物件の購入価額等を基礎とするのは，リース資産の価値評価を重視する考え方に基づく"},{"l":15,"m":"","sb":"","i":"A","r":"","q":"個々のリース資産に重要性が乏しいと認められる場合，リース料総額から利息相当額の合理的な見積額を控除しない方法によることができる。","a":false,"c":"","e":"リース資産総額に重要性が乏しいと認められる場合"},{"l":16,"m":"","sb":"","i":"A","r":"","q":"所有権移転ファイナンス・リース取引で，リース資産総額に重要性が乏しいと認められる場合，利息相当額の配分にあたって定額法を採用できる。","a":false,"c":"","e":"所有権移転外ファイナンス・リース取引"},{"l":17,"m":"","sb":"","i":"B","r":"","q":"リース資産総額に重要性が乏しいと認められる場合とは，未経過リース料の期末残高が当該期末残高と有形固定資産の期末残高の合計額に占める割合が10パーセント未満の場合である。","a":false,"c":"","e":"未経過リース料の期末残高が当該期末残高と有形固定資産及び無形固定資産の期末残高"},{"l":18,"m":"","sb":"","i":"A","r":"","q":"ファイナンス・リース取引は資産の取得と同じ実質を有するため，リース資産の減価償却費は，自己所有の固定資産に適用する減価償却方法と同一の方法により算定する。","a":false,"c":"","e":"所有権移転ファイナンス・リース：自己所有の固定資産に適用する減価償却方法と同一の方法／所有権移転外ファイナンス・リース：自己所有の固定資産の減価償却方法と同一の方法による必要はない"},{"l":19,"m":"","sb":"","i":"A","r":"","q":"所有権移転外ファイナンス・リース取引に係るリース資産の償却方法は定額法による。","a":false,"c":"","e":"定額法，級数法，生産高比例法等の中から企業の実態に応じたものを選択適用する"},{"l":20,"m":"","sb":"","i":"B","r":"","q":"借手の利息相当額は所有権移転ファイナンス・リース取引の場合，リース資産の耐用年数で配分するが，所有権移転外ファイナンス・リース取引の場合，リース期間に配分する。","a":false,"c":"","e":"所有権が移転するか否かにかかわらず，利息相当額はリース期間に配分する"},{"l":21,"m":"","sb":"","i":"C","r":"","q":"ファイナンス・リースに該当するリース契約を中途解約した場合には，リース資産除却損とリース債務解約損は，損益計算書上それぞれ表示しなければならない。","a":false,"c":"","e":"「リース解約損」等の科目で損益計算書上合算して表示することができる"},{"l":22,"m":"","sb":"","i":"C","r":"","q":"所有権移転ファイナンス・リース取引の借手において，リース期間の中途に所有権が移転した場合，引き続きリース資産を計上する。","a":false,"c":"","e":"自己所有の固定資産に振り替える"},{"l":23,"m":"","sb":"","i":"B","r":"","q":"個々のリース資産に重要性が乏しいと認められる場合には，所有権移転外ファイナンス・リース取引を対象に賃貸借処理が認められている。","a":false,"c":"","e":"所有権移転ファイナンス・リース取引でも賃貸借処理が認められている"},{"l":24,"m":"","sb":"","i":"B","r":"","q":"借手のリース資産は，原則として，有形固定資産又は無形固定資産に属する各科目に含めて表示する。","a":false,"c":"","e":"原則として，有形固定資産，無形固定資産の別に，一括してリース資産として表示する\n有形固定資産又は無形固定資産に属する各科目に含めて表示する方法は例外である"},{"l":25,"m":"","sb":"","i":"A","r":"","q":"借手におけるリース資産の表示方法について，所有権移転ファイナンス・リース取引と所有権移転外ファイナンス・リース取引で異なる方法を適用することは認められない。","a":false,"c":"","e":"所有権移転ファイナンス・リース取引と所有権移転外ファイナンス・リース取引で異なる方法を適用することも認められる"},{"l":26,"m":"","sb":"","i":"C","r":"","q":"ファイナンス・リース取引の借手は，リース資産の内容として勘定科目別の金額を注記する。","a":false,"c":"","e":"リース資産の内容として主な資産の種類等を注記する"},{"l":27,"m":"","sb":"","i":"C","r":"","q":"ファイナンス・リース取引の借手は，リース債務について，重要性が乏しい場合を除き，貸借対照表日後5年以内における1年ごとの返済予定額及び5年超の返済予定額を注記する。","a":false,"c":"","e":"本問の注記は要求されていない\nファイナンス・リース取引の貸手では，貸借対照表日後5年以内における1年ごとの回収予定額及び5年超の回収予定額を注記する"},{"l":28,"m":"","sb":"","i":"B","r":"","q":"貸手において，所有権移転ファイナンス・リース取引で生じる資産はリース投資資産に計上し，所有権移転外ファイナンス・リース取引で生じる資産はリース債権に計上する。","a":false,"c":"","e":"所有権移転ファイナンス・リース取引で生じる資産はリース債権に計上し，所有権移転外ファイナンス・リース取引で生じる資産はリース投資資産に計上する"},{"l":29,"m":"","sb":"","i":"B","r":"","q":"リース投資資産は将来のリース料を収受する権利と割引購入選択権から構成される複合的な資産である。","a":false,"c":"","e":"将来のリース料を収受する権利と見積残存価額から構成される複合的な資産"},{"l":30,"m":"","sb":"","i":"B","r":"","q":"貸手におけるリース債権とリース投資資産は，その全額が貸倒引当金の設定対象となる。","a":false,"c":"","e":"リース投資資産は，リース料債権部分のみが貸倒引当金の設定対象となる"},{"l":31,"m":"","sb":"","i":"C","r":"","q":"貸手が，リース取引開始日に売上高と売上原価を計上する方法による場合，売上高と売上原価の差額が，リース開始初年度の損益に計上される。","a":false,"c":"","e":"各期末日後に対応する利益は繰り延べる（繰延リース利益）"},{"l":32,"m":"","sb":"","i":"C","r":"","q":"貸手が，リース取引開始日に売上高と売上原価を計上する方法による場合，各期末日に対応する利益は負債として繰り延べる。","a":false,"c":"","e":"各期末日に対応する利益はリース債権又はリース投資資産と相殺する"},{"l":33,"m":"","sb":"","i":"C","r":"","q":"ファイナンス・リース取引の貸手で，3通りの会計処理が認められており，どの方法を採用するかで各期における利息相当額は異なる。","a":false,"c":"","e":"どの方法を採用しても各期における利息相当額は同額となる"},{"l":34,"m":"","sb":"","i":"B","r":"","q":"所有権移転外ファイナンス・リース取引の貸手における利息相当額の総額は，リース料総額から対応するリース資産の取得価額を控除することによって算定する。","a":false,"c":"","e":"リース料総額及び見積残存価額の合計額から対応するリース資産の取得価額を控除して算定する"},{"l":35,"m":"","sb":"","i":"B","r":"","q":"貸手であるリース会社が行った所有権移転外ファイナンス・リース取引について，重要性が乏しいと認められる場合，利息相当額の総額をリース期間中の各期に定額で配分できる。","a":false,"c":"","e":"リース取引を主たる事業としているため，利息相当額の配分に際して定額法は認められない"},{"l":36,"m":"","sb":"","i":"B","r":"","q":"製品販売することを主たる事業としている企業が，同時に貸手として同一製品をリース取引の対象物件としている場合で，貸手における製作価額と貸手に対する現金販売価額に差があるときには，当該差額はリース物件の利息相当額として扱う。","a":false,"c":"","e":"当該差額は販売益として扱う\n当該販売益は，販売基準又は割賦基準により処理する"},{"l":37,"m":"","sb":"","i":"B","r":"","q":"リース債権又はリース投資資産は主目的たる営業取引により発生した場合，一年基準により流動資産と固定資産の分類を行う。","a":false,"c":"","e":"リース債権又はリース投資資産は主目的たる営業取引により発生した場合，正常営業循環基準により流動資産に表示する\n一年基準により流動固定の分類を行うのは，資産が営業の主目的以外の取引により発生した場合である"},{"l":38,"m":"","sb":"","i":"A","r":"","q":"オペレーティング・リース取引の借手及び貸手は，重要性が乏しい場合を除き，未経過リース料を，貸借対照表日後1年以内のリース期間に係るものと，貸借対照表日1年を超えるリース期間に係るものとに区分して注記しなければならない。","a":false,"c":"","e":"解約不能なオペレーティング・リース取引の場合，未経過リース料を注記しなければならない"},{"l":39,"m":"","sb":"","i":"B","r":"","q":"セール・アンド・リースバック取引におけるリース取引がファイナンス・リース取引に該当する場合，借手は，リースの対象となる物件の売却に伴う損益を長期前払費用又は長期前受収益等として繰延処理し，リース期間にわたって規則的に配分に振り替える。","a":false,"c":"","e":"リース資産の減価償却費の割合に応じ減価償却費に加算して損益に計上する"},{"l":40,"m":"","sb":"","i":"C","r":"","q":"セール・アンド・リースバック取引の対象となった物件の売却損失が，当該物件の合理的な見積市場価額が帳簿価額を下回ることにより生じたものであることが明らかな場合，売却損を繰延処理せず金融取引として処理する。","a":false,"c":"","e":"本問における売却損は繰延処理せずに売却時の損失として計上する"},{"l":41,"m":"","sb":"","i":"C","r":"","q":"ファイナンス・リースに該当する転リース取引においては，支払利息，売上高，売上原価等を損益計算書に計上しなければならない。","a":false,"c":"","e":"支払利息，売上高，売上原価等は計上せずに，貸手として受け取るリース料総額と借手として支払うリース料総額の差額を手数料収入として各期に配分し，転リース差益等の名称で損益計算書に計上する"},{"l":42,"m":"","sb":"","i":"C","r":"","q":"ファイナンス・リースに該当する転リース取引においては，貸借対照表上，リース債権又はリース投資資産とリース債務を相殺して計上する。","a":false,"c":"","e":"リース債権又はリース投資資産とリース債務の双方を計上する"},{"l":"N1","m":"","sb":"","i":"C","r":"","q":"無形固定資産のリースについては，「リースに関する会計基準」を適用する。","a":false,"c":"","e":"適用しないことができる"},{"l":"N2","m":"","sb":"","i":"C","r":"","q":"契約期間中は，契約条件が変更されない限り契約がリースを含むか否かの判断を見直さない。","a":true,"c":"","e":""},{"l":"N3","m":"","sb":"","i":"C","r":"","q":"資産が契約に明記されている場合であっても，サプライヤーが使用期間全体を通じて当該資産を他の資産に代替する実質上の能力を有しているときは，特定された資産に該当しない。","a":false,"c":"","e":"本問の要件に加えて，経済的利益がコストを上回ると見込まれるため，サプライヤーが資産を代替する権利を行使により，経済的利益を享受する場合，特定された資産に該当しない"},{"l":"N4","m":"","sb":"","i":"C","r":"","q":"顧客が，特定された資産の使用から生じる経済的利益のほとんどすべてを享受する権利を有している又は顧客が特定された資産の使用を指図する権利を有している場合，資産の使用を支配する権利がサプライヤーから顧客に移転している。","a":false,"c":"","e":"又は→及び"},{"l":"N5","m":"","sb":"","i":"B","r":"","q":"借手及び貸手は，契約における対価の金額をリースを構成する部分とリースを構成しない部分に配分するが，貸手は，契約における対価の中に維持管理費用相当額が含まれる場合，当該配分にあたって，借手と同様の方法により会計処理を行わなければならない。","a":false,"c":"","e":"借手と同様の方法により会計処理を行わなければならない他，対価に維持管理費用相当額が含まれる場合，貸手は借手と同様の方法の他，当該維持管理費用相当額を契約における対価から控除し収益に計上する，又は貸手の固定資産税，保険料等の費用の控除額として処理する方法によることも認められる（実務に配慮して認められた現行基準と同様の方法）\n借手と同様の方法とは，契約における対価を独立販売価格の比率に基づいて配分する方法である"},{"l":"N6","m":"","sb":"","i":"A","r":"","q":"借手のリース期間は，解約不能期間に，借手が行使することが合理的に確実であるリースの延長オプションの対象期間及び購入オプションを加味して決定する。","a":false,"c":"","e":"購入オプション，借手が行使しないことが合理的に確実であるリースの解約オプションの対象期間（解約不能期間＋合理的で確実である延長オプション及び解約オプションの対象期間）"},{"l":"N7","m":"","sb":"","i":"A","r":"","q":"貸手のリース期間は，借手のリース期間と同様に決定する。","a":false,"c":"","e":"本問の方法の他，解約不能期間に借手が再リースする意思が明らかな場合の再リース期間を加えて決定する方法を選択することもできる（実務に配慮して認められた現行基準と同様の方法）"},{"l":"N8","m":"","sb":"","i":"A","r":"","q":"借手はリース開始日に，リース負債及び使用権資産を同額で計上する。","a":false,"c":"","e":"リース負債及び使用権資産を同額で計上する。また，当該リース負債にリース開始日までに支払った借手のリース料，付随費用及び資産除去債務に対応する除去費用を加算し，受け取ったリース・インセンティブを控除した額により使用権資産を計上する\n資産及び負債の当初測定に際し，旧基準と異なり，購入価額とリース料の割引価値の比較は行わない"},{"l":"N9","m":"","sb":"","i":"A","r":"","q":"リース負債の計上額を算定するにあたって，借手のリース料を基礎とするが，これには，売上に応じて決まる借手の変動リース料や残価保証額が含まれる。","a":false,"c":"","e":"借手のリース料には，指数又はレートに応じて決まる借手の変動リース料や残価保証に係る借手による支払見込額が含まれる\n売上に応じて決まる変動リース料は負債の定義を満たさない"},{"l":"N10","m":"","sb":"","i":"A","r":"","q":"原資産の所有権が借手に移転すると認められるリース以外のリースに係る使用権資産の減価償却費は，原則として，借手のリース期間を耐用年数とし，残存価額をゼロとして算定するが，残価保証の取り決めがある場合，残価保証額を残存価額とする。","a":false,"c":"","e":"残存価額をゼロとして算定する\n借手のリース料として残価保証に係る支払見込額が用いられるため，現行基準のように残価保証額を残存価額としない"},{"l":"N11","m":"","sb":"","i":"B","r":"","q":"借手は，短期リース及び少額リースについて，リース開始日に借手のリース料をもって使用権資産及びリース負債を計上し，借手のリース期間にわたって原則として定額法により費用として計上することができる。","a":false,"c":"","e":"借手は，短期リースについて，リース開始日に使用権資産及びリース負債を計上せず，借手のリース料を借手のリース期間にわたって原則として定額法により費用として計上することができる"},{"l":"N12","m":"","sb":"","i":"B","r":"","q":"短期リースとは，リース開始日において，契約期間が12か月以内であり，購入オプションを含むリースをいう。","a":false,"c":"","e":"契約期間・購入オプションを含む→借手のリース期間・購入オプションを含まない"},{"l":"N13","m":"","sb":"","i":"B","r":"","q":"少額リースの判定に際しては，①企業の事業内容に照らして重要性の乏しいリースで，かつ，リース契約一件当たりの金額に重要性が乏しいリース，②新品時の原資産の価値が少額であるリースの双方を用いて判定する。","a":false,"c":"","e":"①又は②のいずれかを選択し，選択した方法を首尾一貫して適用する\n①はリース料総額300万円以下，②は新品時の原資産の価額5,000米ドル以下を念頭に置いている"},{"l":"N14","m":"","sb":"","i":"B","r":"","q":"リースの契約条件の変更により，1つ以上の原資産を追加することにより，リースの使用する権利が追加され，リースの範囲が拡大され借手のリース料が，範囲が拡大された部分に対する独立価格に特定の契約の状況に基づく適切な調整を加えた金額分だけ増額される場合，変更前のリースとは独立したリースとして会計処理を行う。","a":true,"c":"","e":"増額されたリース料が独立販売価格を反映しており，実質的に独立したリースと考えられるため，変更前のリースとは独立したリースとして会計処理を行う"},{"l":"N15","m":"","sb":"","i":"B","r":"","q":"リースの契約条件の変更のうちリースの範囲が縮小されるものについては，リース負債について，変更後の条件を反映した借手のリース期間を決定し，変更後の条件を反映した借手のリース料の現在価値まで修正し，リース負債の修正額に相当する金額を使用権資産に減少する。","a":false,"c":"","e":"リースの範囲が縮小されるものは，リース負債と使用権資産の修正金額を各々計算し，使用権資産の修正額とリース負債の修正額とに差額が生じた場合，当該差額を損益に計上する\n・リースの範囲が縮小される場合，リース負債の一部のリースを解約するものと考えられるため上記の処理を行う。・他のすべてのリースの契約条件の変更は，リース負債の修正額を使用権資産に加減する"},{"l":"N16","m":"","sb":"","i":"B","r":"","q":"借手は，リースの契約条件の変更が生じていない場合，リース負債の計上額の見直しを行わない。","a":false,"c":"","e":"借手は，リースの契約条件の変更が生じていない場合でも，借手のリース期間又はリース料に変更がある場合，リース負債の計上額の見直しを行う\n購入オプションの行使判定に変更がある場合，残価保証に基づく支払見込額に変動がある場合，指数又はレートに応じて決まる変動リース料に変動がある場合，借手のリース料に変更が生じる"},{"l":"N17","m":"","sb":"","i":"A","r":"","q":"原資産の所有権が借手に移転すると認められるリースの借手において，使用権資産は対応する原資産を自ら所有していたと仮定した場合に貸借対照表において表示するであろう科目に含めて表示する。","a":false,"c":"","e":"使用権資産の貸借対照表における表示は，次のいずれかの方法による。・対応する原資産を自ら所有していたと仮定した場合に貸借対照表において表示するであろう科目に含める方法・対応する原資産の表示区分において使用権資産として区分する方法"},{"l":"N18","m":"","sb":"","i":"B","r":"","q":"貸手のリース料の現在価値が，原資産の現金購入価額の概ね90パーセント以上である場合，ファイナンス・リースと判定されるが，当該リース料には残価保証に係る借手の支払見込額を含める。","a":true,"c":"","e":"本問はいわゆる現在価値基準の内容である"},{"l":"N19","m":"","sb":"","i":"A","r":"","q":"ファイナンス・リースの貸手の会計処理としては，売上高と売上原価を計上する方法があるが，従来の実務に配慮してリース開始日のほか，リース料受取時に売上高と売上原価を計上する方法も認められている。","a":false,"c":"","e":"リース料受取時に売上高と売上原価を計上する方法は認められていない\n収益認識会計基準において対価の受取時にその収益額で収益を計上することが認められなくなったことを契機としてリースに関する収益の計上方法を見直した結果，リース料受取時に売上高と売上原価を計上する方法を廃止した"},{"l":"N20","m":"","sb":"","i":"A","r":"","q":"製造又は販売を事業とする貸手が当該事業の一環で行うリースについては，リース開始日に，貸手のリース料の額をもって売上高を計上する。","a":false,"c":"","e":"リース開始日に，貸手のリース料からこれに含まれている利息相当額を控除した金額で売上高を計上する\n取引価格から重要な金融要素の影響を調整する収益認識基準と整合的な方法である"},{"l":"N21","m":"","sb":"","i":"B","r":"","q":"製造又は販売を事業とする貸手が当該事業の一環で行うリースについて，貸手における製作価額又は現金購入価額と借手に対する現金販売価額に差がある場合，当該差額を繰り延べる。","a":false,"c":"","e":"リース開始日に貸手のリース料から利息相当額を控除した金額で売上高を計上し，原資産の帳簿価額により売上原価を計上するため，販売益相当額はリース開始日に計上される"},{"l":"N22","m":"","sb":"","i":"B","r":"","q":"製造又は販売以外を事業とする貸手が当該事業の一環で行うリースについては，金融的な側面に着目し，リース料総額とリース物件の現金購入価額の差額を受取利息相当額として取り扱い，リース期間にわたり各期へ配分する会計処理を行う。","a":true,"c":"","e":""},{"l":"N23","m":"","sb":"","i":"C","r":"","q":"貸手のリース期間について借手のリース期間と同様に決定する方法を選択して決定している場合，オペレーティング・リースによる貸手のリース料について，貸手のリース期間にわたり原則として定額法で計上する。","a":true,"c":"","e":""},{"l":"N24","m":"","sb":"","i":"C","r":"","q":"オペレーティング・リースの貸手が貸手のリース期間について，借手が原資産を使用する権利を有する解約不能期間に再リース期間を加味して決定する方法を選択して決定する場合，契約に無償賃貸期間が含まれるときは，貸手は，契約期間における使用料の総額について貸手のリース期間にわたり収益を計上する。","a":false,"c":"","e":"契約期間にわたり収益を計上する\n本問の処理を行うことで契約に無償賃貸期間が含まれる場合であっても，取引価格を履行義務が充足される期間にわたって配分する収益認識基準との整合性を確保できる"},{"l":"N25","m":"","sb":"","i":"C","r":"","q":"リースパックが行われる場合であっても，売手である借手による資産の譲渡が，収益認識会計基準に従い，一定の期間にわたり充足される履行義務の充足によって行われるときはセール・アンド・リースバック取引に該当する。","a":false,"c":"","e":"セール・アンド・リースバック取引に該当しない\nセール・アンド・リースバック取引に該当するかどうかの判断においては，譲渡された資産とリースされた資産が同一であることが重要な要素となる。本問の場合，資産の譲渡により支配が移転するのは仕掛中の資産であり，リースバックにより支配する使用権資産は，完成した資産であるため，譲渡された資産とリースされた資産は同一ではないと考えられる"},{"l":"N26","m":"","sb":"","i":"A","r":"","q":"収益認識会計基準などの他の会計基準等に従うと売手である借手による資産の譲渡が損益を認識する売却に該当するセール・アンド・リースバック取引は，金融取引として会計処理する。","a":false,"c":"","e":"リースバック取引がフルペイアウトのリースに該当する場合，金融取引として会計処理するが，フルペイアウトのリースに該当しない場合，資産の譲渡について損益を認識し，リースバックについてリースとしてそれぞれ会計処理を行う\nフルペイアウトのリースに該当する場合，資産を担保にした資金調達と考えられるため金融取引として処理する"},{"l":"N27","m":"","sb":"","i":"B","r":"","q":"サブリースの中間的な貸手におけるリースの分類を行うにあたり，ヘッドリースに係る原資産を参照して分類する。","a":false,"c":"","e":"ヘッドリースに係る使用権資産を参照して分類する"},{"l":"N28","m":"","sb":"","i":"C","r":"","q":"ヘッドリースとサブリースは一連の契約として，貸借対照表においてヘッドリースにおける使用権資産及びリース負債を計上せず，かつ，損益計算書においてサブリースの貸手として受け取るリース料とヘッドリースの借手として支払うリース料の差額を損益に計上する。","a":false,"c":"","e":"サブリースでは，中間的な貸手は，ヘッドリースについて，借手のリースの会計処理を行い，サブリースはリースの分類に応じた会計処理を行う\n中間的な貸手がヘッドリースに対してリスクを負わない場合，貸借対照表においてヘッドリースにおける使用権資産及びリース負債を計上せず，かつ，損益計算書においてサブリースにおいて受け取るリース料の発生時又は当該リース料の受領時のいずれか遅い時点で貸手として受け取るリース料と借手として支払うリース料の差額を損益に計上することができる"},{"l":"N29","m":"","sb":"","i":"C","r":"","q":"借地権の設定に係る権利金等は，借地権が減価しない土地に係る権利である以上，減価償却は行わない。","a":false,"c":"","e":"借地権の設定に係る権利金等は，使用権資産の取得価額に含め，原則として，借手のリース期間を耐用年数とし，減価償却を行う"},{"l":"N30","m":"","sb":"","i":"C","r":"","q":"建設協力金の差入企業である借手は，当該差入預託保証金の支払額と当該時価との差額は長期前払家賃として処理する。","a":false,"c":"","e":"建設協力金の差入企業である借手は，当該差入預託保証金の支払額と当該時価との差額を使用権資産の取得価額に含める"}]},{"n":18,"name":"研究開発とソフトウェア","qs":[{"l":1,"m":"","sb":"","i":"B","r":"","q":"製造現場で行われる品質管理活動やクレーム処理のための活動は研究開発には含まれない。","a":true,"c":"","e":""},{"l":2,"m":"","sb":"","i":"B","r":"","q":"製造現場で行われる改良研究は，明確なプロジェクトとして行われている場合であっても，開発の定義における「著しい改良」に該当しない。","a":false,"c":"","e":"「著しい改良」に該当する"},{"l":3,"m":"","sb":"","i":"B","r":"","q":"「研究開発等に係る会計基準」の適用対象に含まれるものを挙げなさい。①一定の契約のもとに他の企業に行わせる研究開発②他の企業のために行う研究開発③共同研究④探査・掘削等の鉱業における資源の開発に特有の活動","a":false,"c":"","e":"適用対象に含まれるもの：①委託契約，③共同研究。②の受託契約は，業務の受託が事業目的である場合，研究が完了し委託者の検収時点で売上高に対応して売上原価を計上する。③の共同研究は，研究に要した費用のうち自己の負担した部分を研究開発費として処理する。④は，将来の期間に影響する特定の費用（繰延資産）として処理する"},{"l":4,"m":"","sb":"","i":"A","r":"","q":"分離して譲渡可能な研究開発の途中段階の成果を含む事業を取得した場合，「研究開発費等に係る会計基準」に従い，取得時に費用として処理する。","a":false,"c":"","e":"分離して譲渡可能な研究開発の途中段階の成果（仕掛研究開発）を含む事業を取得した場合，「企業結合に関する会計基準」に従い，取得時に資産として計上する\n企業結合会計により受け入れた他の資産の取り扱いとの整合性を重視して資産計上する"},{"l":5,"m":"","sb":"","i":"A","r":"","q":"分離して譲渡可能な研究開発の途中段階の成果を単独で取得した場合，資産として計上し，合理的な方法により償却する。","a":false,"c":"","e":"資産として計上し，合理的な方法により償却する，分離して譲渡可能な研究開発の途中段階の成果（仕掛研究開発）を単独で取得した場合，「研究開発費等に係る会計基準」に従い，取得時に費用として処理する"},{"l":6,"m":"","sb":"","i":"C","r":"","q":"外部に研究開発を委託した場合における契約金等は，当該委託時点で費用として処理する。","a":false,"c":"","e":"契約金等は前渡金として処理し，検収を行い，利用可能になった時点で費用として処理する"},{"l":7,"m":"","sb":"","i":"B","r":"","q":"市場の開拓のために特別に支出した費用は，研究開発費に含まれる。","a":false,"c":"","e":"開発費（繰延資産）に含まれる"},{"l":8,"m":"","sb":"","i":"B","r":"","q":"研究開発目的のために導入する技術，特許等に係る技術導入費，特許権使用に関する頭金等は繰延資産計上の対象となる開発費として処理する。","a":false,"c":"","e":"研究開発費として処理する"},{"l":9,"m":"","sb":"","i":"B","r":"","q":"研究開発費には，人件費，原材料費，固定資産の減価償却費及び間接費の配賦額，研究開発のために費消されたすべての原価が含まれる。","a":true,"c":"","e":""},{"l":10,"m":"","sb":"","i":"A","r":"","q":"特定の研究開発目的にのみ使用され，他の目的に使用できない機械装置や特許権等を取得した場合の原価は，固定資産に計上し，当該資産の減価償却費を研究開発費として処理する。","a":false,"c":"","e":"取得時の研究開発費として処理する\n特定の研究開発目的に使用された後に他の目的（他の研究開発目的を含む）に使用できる場合，資産計上し，当該資産の減価償却費を研究開発費として処理する"},{"l":11,"m":"","sb":"","i":"B","r":"","q":"わが国では，国際的な会計基準と同様に研究開発費について，将来の経済的便益の獲得可能性の確実性や原価の客観的な測定可能性の要件を満たした場合に資産計上が認められる。","a":false,"c":"","e":"研究開発費は発生時に費用として処理しなければならず，資産計上上は認められない"},{"l":12,"m":"","sb":"","i":"B","r":"","q":"研究開発費を費用として処理する方法には，一般管理費として処理する方法と営業外費用として処理する方法がある。","a":false,"c":"","e":"一般管理費として処理する方法と当期製造費用として処理する方法がある\n研究開発費を当期製造費用として処理し，当該製造費用の大部分が期末仕掛品等として資産計上される場合，資産計上する処理と結果的に変わらないこととなるため，妥当な会計処理とは認められない"},{"l":13,"m":"","sb":"","i":"B","r":"","q":"研究開発費を財務諸表に注記する際，ソフトウェアに係る研究開発費と他の研究開発費を区別して注記しなければならない。","a":false,"c":"","e":"ソフトウェアに係る研究開発費についても，研究開発費の総額に含めて注記しなければならない"},{"l":14,"m":"","sb":"","i":"B","r":"","q":"ソフトウェア制作費に係る会計基準は，自社制作，外部購入等の取得形態別に設定されている。","a":false,"c":"","e":"制作目的別に設定されている"},{"l":15,"m":"","sb":"","i":"B","r":"","q":"研究開発目的のソフトウェアの制作費は研究開発費として処理されるが，研究開発目的以外のソフトウェアの制作費は，研究開発費として処理されない。","a":false,"c":"","e":"研究開発目的以外（受注制作，市場販売目的，自社利用）のソフトウェアの制作費についても，制作に要した費用のうち研究開発に該当する部分は研究開発費として処理する"},{"l":16,"m":"","sb":"","i":"B","r":"","q":"市場販売目的のソフトウェアである製品マスターの機能維持に要した費用は，資産として計上してはならず，発生時に研究開発費として処理する。","a":false,"c":"","e":"発生時の費用として処理するものの，研究開発費として処理しない"},{"l":17,"m":"","sb":"","i":"B","r":"","q":"「最初に製品化された製品マスター」が完成するまでの制作活動に要した費用は，製品の製造に該当する部分であるため，資産として計上する。","a":false,"c":"","e":"製品の製造に該当する部分であるため，資産として計上する，研究開発に該当する部分であるため，研究開発費として処理する"},{"l":18,"m":"","sb":"","i":"B","r":"","q":"自社利用のソフトウェアは，将来の収益獲得又は費用削減が確実と認められない場合は費用処理し，それ以外は無形固定資産に計上する。","a":false,"c":"","e":"将来の収益獲得又は費用削減が確実と認められない場合は費用処理し，それ以外は無形固定資産に計上する，将来の収益獲得又は費用削減の効果が不明な場合は資産計上する"},{"l":19,"m":"","sb":"","i":"B","r":"","q":"社内利用ソフトウェアの完成品を購入した場合，資産計上が要求されるが，独自仕様の社内利用ソフトウェアを自社で制作する場合，費用処理しなければならない。","a":false,"c":"","e":"将来の収益獲得又は費用削減が確実であると認められる限り，資産計上しなければならない"},{"l":20,"m":"","sb":"","i":"C","r":"","q":"機械にソフトウェアが組み込まれ，両者が一体として機能している場合であっても，合理的に区分可能であれば当該機械とソフトウェアを独立した科目として区分処理する。","a":false,"c":"","e":"ソフトウェアを当該機械装置の取得原価に算入し，「機械及び装置」等の科目を用いて処理する"},{"l":21,"m":"","sb":"","i":"C","r":"","q":"製品マスターの無形固定資産としての表示
