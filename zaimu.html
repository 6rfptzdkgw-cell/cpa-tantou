に当たっては制作仕掛品と完成品を一括してソフトウェア等の科目で掲記するが，制作仕掛品に重要性がある場合，区分して表示すべきである。","a":true,"c":"","e":""},{"l":22,"m":"","sb":"","i":"B","r":"","q":"無形固定資産として計上せず，費用処理する","a":false,"c":"","e":"制作途中のソフトウェアの制作費は，無形固定資産の仮勘定として計上する\n無形固定資産の仮勘定は減価償却をしない"},{"l":23,"m":"","sb":"","i":"B","r":"","q":"市場販売目的のソフトウェア製品及び仕掛品は，無形固定資産として計上する。","a":false,"c":"","e":"棚卸資産として計上する"},{"l":24,"m":"","sb":"","i":"A","r":"","q":"無形固定資産として計上した市場販売目的のソフトウェアの毎期の償却額は，残存有効期間に基づく均等配分額を上回ってはならない。","a":false,"c":"","e":"下回ってはならない"},{"l":25,"m":"","sb":"","i":"A","r":"","q":"市場販売目的のソフトウェアに見込販売数量及び見込販売収益に基づく償却方法を適用した場合，当初における販売可能な有効期間の見積りは，原則として5年以内の年数である。","a":false,"c":"","e":"原則として3年以内の年数である\n自社利用のソフトウェアは原則として5年以内の年数とされる"},{"l":26,"m":"","sb":"","i":"A","r":"","q":"市場販売目的のソフトウェアについて，減価償却後の未償却残高が翌期以降の見込販売収益の額を上回った場合，当該超過額は一時の費用又は損失として処理する。","a":true,"c":"","e":"本問は市場販売目的のソフトウェアの減損処理の説明である"},{"l":27,"m":"","sb":"","i":"A","r":"","q":"ソフトウェアの見込有効期間及び見込利用可能期間の変更は，会計方針の変更に該当するため，遡及適用を行う。","a":false,"c":"","e":"通常，会計上の見積りの変更に該当し，影響は当事業年度及び将来の期間の損益で認識する"},{"l":28,"m":"","sb":"","i":"B","r":"","q":"購入ソフトウェアの価値も含めて費用処理しなければならない","a":false,"c":"","e":"将来の収益獲得又は費用削減が確実であると認められる場合，購入ソフトウェアの価額を含めて無形固定資産に計上し，それ以外の場合は費用処理する"},{"l":29,"m":"","sb":"","i":"B","r":"","q":"新しいシステムでデータを利用するために旧システムのデータをコンバートするための費用やソフトウェアの操作をトレーニングするための費用は，資産として処理する。","a":false,"c":"","e":"ソフトウェアそのものの価値を高めるものではないため，発生した事業年度の費用とする"}]},{"n":19,"name":"会計上の変更及び誤謬の訂正","qs":[{"l":1,"m":"","sb":"","i":"B","r":"","q":"会計上の変更とは，会計方針の変更，表示方法の変更及び過去の誤謬の訂正をいう。","a":false,"c":"","e":"会計上の変更とは，会計方針の変更，表示方法の変更及び会計上の見積りの変更をいい，過去の誤謬の訂正は，会計上の変更には該当しない"},{"l":2,"m":"","sb":"","i":"B","r":"","q":"会計方針の変更等に関する累積的影響額は，当期の損益に計上する。","a":false,"c":"","e":"期首の利益剰余金に含めて処理を行う"},{"l":3,"m":"","sb":"","i":"B","r":"","q":"連結財務諸表作成会社は，連結財務諸表について「会計方針の開示，会計上の変更及び誤謬の訂正に関する会計基準」にしたがって遡及処理を行うが，個別財務諸表については作成負担に配慮して遡及処理は要求されていない。","a":false,"c":"","e":"個別財務諸表についても遡及処理が要求されている"},{"l":4,"m":"","sb":"","i":"A","r":"","q":"会計方針とは，財務諸表の作成にあたって採用した会計処理の原則及び手続並びに表示方法をいう。","a":false,"c":"","e":"会計方針に表示方法は含まれない"},{"l":5,"m":"","sb":"","i":"A","r":"","q":"次の①～⑦を会計方針の変更，表示方法の変更，いずれにも該当しないものに分類しなさい。①重要性が増したことに伴う本来の会計処理の原則及び手続への変更②会計処理の対象となる新たな事実の発生に伴う新たな会計処理の原則及び手続の採用③連結又は持分法の適用の範囲に関する変動④キャッシュ・フロー計算書における資金の範囲の変更⑤キャッシュ・フロー計算書の表示の内訳の変更⑥キャッシュ・フロー計算書における直接法から間接法への変更⑦財務諸表の表示区分を超えた表示方法の変更","a":false,"c":"","e":"会計方針の変更に該当するもの：④。表示方法の変更に該当するもの：⑤，⑥，⑦。いずれにも該当しないもの：①，②，③"},{"l":6,"m":"","sb":"","i":"B","r":"","q":"会計方針等の改正に伴う会計方針の変更の場合，新たな会計方針を過去の期間のすべてに遡及適用しなければならない。","a":false,"c":"","e":"会計基準等に特定の経過的な取扱いが定められている場合：その取扱いに従う／会計基準等に特定の経過的な取扱いが定められていない場合：遡及適用を行う"},{"l":7,"m":"","sb":"","i":"C","r":"","q":"会計基準等に早期適用の取扱いが定められており，これを適用する場合，会計基準等の改正に伴う会計方針の変更に該当しない。","a":false,"c":"","e":"会計方針の変更に該当する"},{"l":8,"m":"","sb":"","i":"A","r":"","q":"新たな会計方針を遡及適用する場合，表示期間より前の期間に関する遡及適用による累積的影響額は，表示する財務諸表のうち，最も古い期間の期首の資産，負債及び純資産に反映する。","a":true,"c":"","e":""},{"l":9,"m":"","sb":"","i":"B","r":"","q":"当期の期首時点において，過去の期間のすべてに新たな会計方針を遡及適用した場合の累積的影響額を算定することができるものの，表示期間のいずれかにおいて，当該期間に与える影響額を算定することが実務上不可能な場合，期首以前の実行可能な最も古い日から将来にわたり新たな会計方針を適用する。","a":false,"c":"","e":"遡及適用が実行可能な最も古い期間の期首時点で累積的影響額を算定し，当該期首残高から新たな会計方針を適用する\n本問の取扱いを行うのは，当期の期首時点において，過去の期間のすべてに新たな会計方針を遡及適用した場合の累積的影響額を算定することが実務上不可能な場合である"},{"l":10,"m":"","sb":"","i":"B","r":"","q":"会計方針を変更した場合，原則として，当期及び過去の期間における会計方針の変更による影響額の注記が求められている。","a":false,"c":"","e":"当期における影響額の注記は求められていない"},{"l":11,"m":"","sb":"","i":"C","r":"","q":"既に公表されているものの，未だ適用されていない新しい会計基準等がある場合には，新しい会計基準の名称及び概要等を注記する。","a":true,"c":"","e":""},{"l":12,"m":"","sb":"","i":"B","r":"","q":"表示方法の変更には，財務諸表における同一区分内での科目の独立掲記，統合あるいは科目名の変更が含まれるが，重要性の増加に伴う表示方法の変更は含まれない。","a":false,"c":"","e":"表示方法の変更には，重要性の増加に伴う表示方法の変更も含まれる"},{"l":13,"m":"","sb":"","i":"B","r":"","q":"表示方法とは，財務諸表の作成にあたって採用した表示の方法をいい，注記による開示は含まれない。","a":false,"c":"","e":"注記による開示が含まれる"},{"l":14,"m":"","sb":"","i":"B","r":"","q":"会計処理の変更に伴って表示方法の変更が行われた場合，表示方法の変更として取扱う。","a":false,"c":"","e":"会計方針の変更として取扱う\n例えば，ある収益取引について営業外収益から売上高に表示区分を変更する場合，資産及び負債並びに損益の認識又は測定に何ら変更を伴うものではないときは，表示方法の変更として取扱う"},{"l":15,"m":"","sb":"","i":"B","r":"","q":"財務諸表の表示方法を変更した場合には，原則として表示する過去の財務諸表について，新たな表示方法に従い修正再表示を行う。","a":true,"c":"","e":"修正再表示を行うのは過去の誤謬である"},{"l":16,"m":"","sb":"","i":"A","r":"","q":"回収不能債権に対する貸倒見積額の見積りの変更及び有形固定資産の耐用年数の見積りの変更は，将来にわたり会計処理を行う。","a":false,"c":"","e":"回収不能債権に対する貸倒見積額の見積りの変更は，変更期間のみに影響するため，当該変更期間に会計処理を行う"},{"l":17,"m":"","sb":"","i":"B","r":"","q":"臨時償却は，耐用年数の変更等に関する影響額を，当期以降の費用配分に影響させるキャッチ・アップ方式であり，現在わが国では認められていない。","a":false,"c":"","e":"臨時償却は，耐用年数の変更等に関する影響額を，その変更期間で一時に認識するキャッチ・アップ方式であり，現在わが国では認められていない"},{"l":18,"m":"","sb":"","i":"A","r":"","q":"有形固定資産等の減価償却方法及び無形固定資産の償却方法は，会計方針に該当するため，その変更については，遡及適用を行う。","a":false,"c":"","e":"変更については，会計上の見積りの変更と同様に取り扱い，遡及適用は行わない"},{"l":19,"m":"","sb":"","i":"A","r":"","q":"会計基準上は不正と誤謬を区別している。","a":false,"c":"","e":"会計基準上は，誤謬を不正に起因するものも含めて定義しており，区別していない"},{"l":20,"m":"","sb":"","i":"A","r":"","q":"過去の財務諸表における誤謬が発見された場合には，前期損益修正項目として当期の特別損益で修正する。","a":false,"c":"","e":"過去の財務諸表における誤謬が発見された場合には，修正再表示する"},{"l":21,"m":"","sb":"","i":"C","r":"","q":"重要性の判断に基づき，過去の財務諸表を修正再表示しない場合には，損益計算書上，特別損益として認識する処理が行われる。","a":false,"c":"","e":"損益計算書上，営業損益又は営業外損益として認識する処理が行われる"},{"l":22,"m":"","sb":"","i":"B","r":"","q":"過去の誤謬については，会計方針の変更と同様に，原則的な取扱いが実務上不可能な場合の取扱いが設けられている。","a":false,"c":"","e":"原則的な取扱いが実務上不可能な場合の取扱いが設けられていない\n過去の財務諸表に影響する誤謬を発見しつつも実務上不可能であるために修正しなかった場合には，当該期間の財務諸表が一般に公正妥当と認められる会計原則に準拠して作成されたと企業が表明することと首尾一貫していないため，原則的な取扱いが実務上不可能な場合の取扱いは設けられていない"},{"l":23,"m":"","sb":"","i":"B","r":"","q":"過年度における引当金過不足修正額が生じた場合，過去の財務諸表作成時において入手可能な情報に基づき最善の見積りを行っていたときには，特別損益として認識する。","a":false,"c":"","e":"その性質により，営業損益又は営業外損益として認識する"},{"l":24,"m":"","sb":"","i":"B","r":"","q":"有形固定資産の耐用年数の変更は会計方針の変更に該当する。","a":false,"c":"","e":"会計上の見積りの変更又は過去の誤謬の訂正に該当する\n過去に定めた耐用年数が，これを定めた時点での合理的な見積りに基づくものであり，それ以降の変更も合理的な見積りによるものであれば，会計上の見積りの変更に該当する／過去に定めた耐用年数を事後的に合理的な見積りに基づいたものに変更する場合には，過去の誤謬の訂正に該当する"}]},{"n":20,"name":"期中財務諸表","qs":[{"l":1,"m":"","sb":"","i":"B","r":"","q":"連結財務諸表は個別財務諸表を基礎に作成されるため，期中連結財務諸表を開示する会社は，併せて期中個別財務諸表を開示する。","a":false,"c":"","e":"期中個別財務諸表の開示は要しない"},{"l":2,"m":"","sb":"","i":"A","r":"","q":"株主資本の金額に著しい変動があった場合に限り，期中株主資本等変動計算書の開示を要する。","a":false,"c":"","e":"期中株主資本等変動計算書の開示は不要であり，主な変動事由を注記事項として開示する\n期中開示における適時性の要請等を踏まえ，期中株主資本等変動計算書の開示は求められていない"},{"l":3,"m":"","sb":"","i":"A","r":"","q":"期中キャッシュ・フロー計算書の開示対象期間は，期中会計期間及び前年度における対応する期間であり，開示の省略は認められない。","a":false,"c":"","e":"期首からの累計期間・中間会計期間を除き，開示の省略が認められる"},{"l":4,"m":"","sb":"","i":"A","r":"","q":"期中貸借対照表は，期中会計期間の末日の期中貸借対照表及び前年度における対応する期間の末日の期中貸借対照表を開示する。","a":false,"c":"","e":"前年度の末日の要約貸借対照表"},{"l":5,"m":"","sb":"","i":"B","r":"","q":"6か月ごとより高い頻度で期中財務諸表を作成する場合，期中損益及び包括利益計算書又は期中損益計算書及び期中包括利益計算書の開示対象期間は，期首からの累計期間並びに前年度における対応する期間に代えて，期中会計期間及び前年度における対応する期間とすることができる。","a":false,"c":"","e":"期首からの累計期間並びに前年度における対応する期間に加えて\n累計期間の情報に加えて期中会計期間の情報を開示できるが，当該開示は最初の期中会計期間から行う"},{"l":6,"m":"","sb":"","i":"B","r":"","q":"実績主義とは，期中会計期間を年度の一構成部分とみた上で，期中財務諸表を，原則として年度の財務諸表と同じ会計方針を適用して作成することにより，期中会計期間を含む年度の業績予測に資する情報を提供する考え方である。","a":false,"c":"","e":"期中会計期間を年度と並ぶ一会計期間とみて，期中会計期間の財政状態，経営成績及びキャッシュ・フローの状況に関する情報を提供する考え方である"},{"l":7,"m":"","sb":"","i":"C","r":"","q":"期中連結キャッシュ・フロー計算書の作成方法は，期中開示の適時性に配慮して，期中連結損益及び包括利益計算書又は期中連結損益計算書，期中連結貸借対照表の期首残高，期末残高の増減額の分析及びその他の情報から作成する簡便法による。","a":false,"c":"","e":"期中連結財務諸表は期中個別財務諸表を基礎として作成するため，各連結会社の期中個別キャッシュ・フロー計算書に基づいて作成する原則法によるのであり，簡便法は容認されているに過ぎない"},{"l":8,"m":"","sb":"","i":"B","r":"","q":"年度の財務諸表では検収基準を採用している会社が，期中財務諸表では迅速な対応を理由に出荷基準を採用することは認められない。","a":true,"c":"","e":"収益の認識及び測定については，財務諸表の信頼性の根幹をなす重要なものであるため年度と期中で同一の会計処理が適用されなければならない"},{"l":9,"m":"","sb":"","i":"A","r":"","q":"期中会計期間末における棚卸資産の簿価切下げは，年度末において洗替え法，切放し法のいずれを採用しているかに関わらず，期中洗替え法による。","a":true,"c":"","e":"企業の報告の頻度（年次，半期，又は四半期）によって，年次の経営成績の測定が左右されてはならないとする原則に基づく"},{"l":10,"m":"","sb":"","i":"B","r":"","q":"一般債権の貸倒実績率等が前年度の財務諸表の作成において使用した貸倒実績率等と著しく変動していないと考えられる場合には，期中会計期間末において，前年度末の決算において算定した貸倒実績率等の合理的な基準を使用する。","a":false,"c":"","e":"当該処理は，簡便的な処理として容認されているに過ぎない"},{"l":11,"m":"","sb":"","i":"B","r":"","q":"期中会計期間末における棚卸高は，実地棚卸を行うことなく，前年度に係る実地棚卸高を基礎として，合理的な方法により算定する。","a":false,"c":"","e":"当該処理は，簡便な処理として容認されているに過ぎない"},{"l":12,"m":"","sb":"","i":"B","r":"","q":"期中会計期間末における通常の販売目的で保有する棚卸資産の簿価切下げにあたって，年度決算と同様に，収益性が低下していることが明らかでない棚卸資産についても正味売却価額を見積る。","a":false,"c":"","e":"年度決算と異なり，収益性が低下していることが明らかな棚卸資産についてのみ正味売却価額を見積ることができる"},{"l":13,"m":"","sb":"","i":"B","r":"","q":"固定資産の減価償却費は，期中会計期間末ごとに，当該期中会計期間に対応する額を算定する必要があり，予算制度の利用は認められない。","a":false,"c":"","e":"固定資産の年度中の取得，売却又は除却等の見積りを考慮した予算を策定している場合，当該予算に基づく年間償却予定額を期間按分する方法により減価償却費を算定できる"},{"l":14,"m":"","sb":"","i":"B","r":"","q":"減価償却の方法として定率法を採用している場合，年度に係る減価償却費の額を期間按分して減価償却費を計上する。","a":false,"c":"","e":"当該処理は，簡便な処理として容認されているに過ぎない\n期中会計期間等に対応する定率を用いて減価償却費を計算する方法が原則である"},{"l":15,"m":"","sb":"","i":"B","r":"","q":"一時差異等の発生状況について前年度末から大幅な変動がある場合，繰延税金資産の回収可能性の判断にあたり，簡便的な方法を用いることはできない。","a":false,"c":"","e":"前年度末の検討において使用した将来の業績予測やタックス・プランニングに，当該変動の影響を加味したものを利用することができる"},{"l":16,"m":"","sb":"","i":"A","r":"","q":"期中財務諸表における簡便的な会計処理として，原価差異の繰延処理と税金費用の計算が認められている。","a":false,"c":"","e":"期中特有の会計処理"},{"l":17,"m":"","sb":"","i":"A","r":"","q":"標準原価計算等を採用している場合において，原価差異が操業度等の季節的な変動に起因して発生したものであり，又は，原価計算期間末までにほぼ解消が見込まれるときには，6か月ごとより高い頻度で期中財務諸表を作成することを条件として，当該原価差異を流動資産又は流動負債として繰り延べることができる。","a":false,"c":"","e":"「又は」ではなく「かつ」，「6か月ごとより高い頻度で期中財務諸表を作成すること」ではなく「継続適用」を条件とする"},{"l":18,"m":"","sb":"","i":"A","r":"","q":"原価計算期間が期中会計期間と同じ場合，原価差異の繰延処理が認められるが，期中会計期間よりも短い場合は認められない。","a":false,"c":"","e":"原価計算期間が期中会計期間と同じ又はそれより短い場合，原価差異の繰延処理は認められない"},{"l":19,"m":"","sb":"","i":"A","r":"","q":"税金費用について，期中会計期間を含む年度の税引前当期純利益に対する税効果会計適用後の実効税率の見積りを用いて計算する方法による場合，期中貸借対照表に繰延税金資産及び繰延税金負債は計上されない。","a":false,"c":"","e":"前年度末の繰延税金資産及び繰延税金負債について，回収可能性等を検討した上で計上する"},{"l":20,"m":"","sb":"","i":"A","r":"","q":"税金費用の計算に期中特有の会計処理を適用する場合，税金費用の相手勘定としての期中貸借対照表計上額は未払法人税等又は未収法人税等その他適当な科目により流動負債又は流動資産として表示する。","a":false,"c":"","e":"繰延税金資産その他適当な科目により投資その他の資産として表示する"},{"l":21,"m":"","sb":"","i":"C","r":"","q":"期中会計期間において会計方針を変更した場合，期中開示の適時性に配慮して，新たな会計方針の遡及適用を要しない。","a":false,"c":"","e":"新たな会計方針の遡及適用を要する"},{"l":22,"m":"","sb":"","i":"C","r":"","q":"期首から期中会計期間末までの連結会社間取引により生じた未実現利益を期中連結手続上で消去するにあたり，当該未実現利益額が，売却元の年間見積課税所得額を上回っているときは，連結消去に係る一時差異の金額は，売却元の期首からの累計期間に係る見積課税所得額を限度とする。","a":false,"c":"","e":"年間見積課税所得額を限度\n課税所得が期中会計期間ごとに変動して限度額も変動し，法人税等調整額が変動する結果，1株当たり期中純損益の算定基礎となる期中純損益が大きく変動し得るため"},{"l":23,"m":"","sb":"","i":"C","r":"","q":"子会社の期中会計期間の末日が期中連結決算日と異なる場合，決算日の差異が3か月を超える場合でも，期中決算の適時性に配慮して，子会社の期中決算を基礎として，期中連結決算を行うことができる。","a":false,"c":"","e":"決算日の差異が3か月を超えない場合に限り"},{"l":24,"m":"","sb":"","i":"B","r":"","q":"期中連結財務諸表の作成上，支配獲得日又は売却日等が子会社の期中会計期間の末日以外の日である場合，当該日の前後いずれかの期中会計期間の末日等に支配獲得，株式取得又は売却等が行われたものとみなして処理することができる。この期中会計期間の末日等には，期首，期中会計期間の末日又はその他の適切に決算が行われた日が含まれるが，四半期決算日は含まれない。","a":false,"c":"","e":"四半期決算日が含まれる"},{"l":25,"m":"","sb":"","i":"B","r":"","q":"わが国では期中会計期間を年度と並ぶ一会計期間としてみる実績主義の考え方によっているため，期中財務諸表の表示科目及び表示区分については，年度の財務諸表との整合性は勘案せずに，期中財務諸表単独で判断する。","a":false,"c":"","e":"年度の財務諸表における表示との整合性を勘案しなければならない"},{"l":26,"m":"","sb":"","i":"B","r":"","q":"期中連結キャッシュ・フロー計算書における「営業活動によるキャッシュ・フロー」の表示にあたっては，小計の記載を省略することができる。","a":true,"c":"","e":""},{"l":27,"m":"","sb":"","i":"B","r":"","q":"期中財務諸表において表示方法の変更を行った場合，財務諸表の組替えを行うとともに表示方法の変更に係る注記が要求される。","a":false,"c":"","e":"表示方法の変更に係る注記は要求されていない\n過去の財務諸表本体の組替えが行われるため，表示方法の変更の注記は要求されていない"},{"l":28,"m":"","sb":"","i":"B","r":"","q":"年度の財務諸表では注記事項とされているが，期中財務諸表では注記事項とされていないものとして，ストック・オプション関係，１株当たり期中純損益の情報などがある。","a":false,"c":"","e":"１株当たり期中純損益ではなく，１株当たり純資産額等\nストック・オプションや1株当たり純資産額は，財務諸表利用者のニーズが高くないため注記を要しない"},{"l":29,"m":"","sb":"","i":"B","r":"","q":"期中特有の会計処理及び簡便的な会計処理を採用している場合には，その旨及びその内容を注記する。","a":false,"c":"","e":"簡便的な会計処理の注記は要求されていない（期中特有の会計処理は注記が要求されている）"},{"l":30,"m":"","sb":"","i":"B","r":"","q":"期中財務諸表ではセグメント情報に関する事項として，報告セグメントの利益（又は損失）及び売上高，資産について毎期開示しなければならない。","a":false,"c":"","e":"報告セグメントの資産については，企業結合や事業分離などによりセグメント情報に係る報告セグメントの資産の金額に著しい変動があった場合に，その概要を開示する"}]},{"n":21,"name":"連結財務諸表","qs":[{"l":1,"m":"","sb":"","i":"A","r":"","q":"経済的単一体説は，出資者から独立した企業集団そのものを会計主体とみる考え方に基づいている。","a":false,"c":"","e":"親会社株主及び非支配株主を会計主体とみる"},{"l":2,"m":"","sb":"","i":"B","r":"","q":"支配獲得日後に生じた子会社の利益剰余金及び評価・換算差額等は，連結貸借対照表上，利益剰余金及びその他の包括利益累計額として処理する。","a":false,"c":"","e":"親会社に帰属する部分は，利益剰余金及び評価・換算差額等として処理し，非支配株主に帰属する部分は，非支配株主持分として処理する\n包括利益計算書上は当期純利益及びその他の包括利益として処理する"},{"l":3,"m":"","sb":"","i":"B","r":"","q":"親会社説と経済的単一体説のいずれの考え方においても，単一の指揮下にある企業集団全体の資産・負債と収益・費用を連結財務諸表に表示するという点で変わりはない。","a":true,"c":"","e":"なお，資本に関して，親会社説は連結財務諸表を親会社の財務諸表の延長線上に位置づけて，親会社の株主の持分のみを反映させるのに対し，経済的単一体説は連結財務諸表を企業集団全体の財務諸表と位置づけて，企業集団を構成するすべての連結会社の株主の持分を反映させる点で異なる"},{"l":4,"m":"","sb":"","i":"A","r":"","q":"子会社の欠損のうち，非支配株主持分に割り当てられる額が非支配株主の負担すべき額を超える場合には，当該超過額は，持分比率に応じて親会社の持分と非支配株主持分に負担させる。","a":false,"c":"","e":"非支配株主持分に割り当てられる額が当該非支配株主の負担すべき額を超える場合には，当該超過額は，親会社の持分に負担させる"},{"l":5,"m":"","sb":"","i":"B","r":"","q":"経済的単一体説によれば，非支配株主持分は株主資本以外に表示すべきである。","a":false,"c":"","e":"株主資本に表示すべき"},{"l":6,"m":"","sb":"","i":"B","r":"","q":"更生会社，破産会社その他これらに準ずる企業は，子会社に該当しない。","a":false,"c":"","e":"更生会社，破産会社その他これらに準ずる企業であって，かつ，有効な支配従属関係が存在しないと認められる企業は，子会社に該当しない"},{"l":7,"m":"","sb":"","i":"B","r":"","q":"以下のA社～E社がP社の子会社となるかどうかを判定しなさい。「→」は資本所有関係を，%は発行済株式総数に占める所有割合を示している。A社：P社が35%、X社が15%（X社はP社と同一の内容の議決権を行使することに同意しているX社の保有する議決権比率と合わせて所有割合を判定）。B社：P社が40%、A社の子会社Y社が20%をB社に対して保有。C社：P社が40%、P社による融資額がC社の資金調達額の70%。D社：P社が40%、P社がC社の資金調達額の7割に相当する融資、株式所有の名義はP社の役員であるが当該株式は会社が自己の計算で所有しており、D社は自己株式を発行済株式の10%保有。E社：P社が42%、Z社が37%、E社とZ社は株式の相互持合関係にあり、E社はZ社の議決権の25%以上を保有しているため、Z社はE社に対する17%の議決権を行使できない。","a":false,"c":"","e":"子会社：B社，C社，D社，E社。・A社：子会社とならない。P社が40%未満しか保有していない場合，P社と同一の内容の議決権を行使することに同意しているX社の保有する議決権比率と合わせて50%超保有している必要があり，その上で重要な財務及び営業の方針決定を支配する契約の存在等の要件を充たす必要がある。・B社：子会社となる。B社は，P社が40%を直接所有するとともに，P社の子会社であるY社が株式の20%を間接所有している。つまり，P社とY社の合計で議決権の過半数を所有しているため，B社は子会社となる。・C社：子会社となる。C社は，P社が40%以上所有し，かつ，P社による融資額がC社の資金調達額の70%（過半）を占めているため，C社は子会社となる。・D社：子会社となる。会社が自己の計算で所有しているのであれば，会社が実質的に保有しているとされる。また，D社が自己株式を10%保有しているため，行使し得る議決権の総数が100%－10%＝90%となり，P社の議決権の所有割合が46%÷90%＝約51.1%となるため，D社は子会社となる。・E社：子会社となる。E社とZ社は株式の相互持合関係にあり，E社はZ社の議決権の25%以上を保有しているため，Z社はE社に対する17%の議決権を行使できない。よって，P社の議決権の所有割合を算定するに当たっては，E社の議決権の総数からZ社が所有する議決権の数を除く必要がある。つまり，P社が直接所有しているE社株式は42%であるが，所有割合は50%超〔42%÷(100%－17%)≈50.6%〕となるため，E社は子会社に該当する"},{"l":8,"m":"","sb":"","i":"C","r":"","q":"清算株式会社のように，継続企業と認められない企業は，子会社に該当しない。","a":false,"c":"","e":"意思決定機関を支配していると認められる場合には，子会社に該当する"},{"l":9,"m":"","sb":"","i":"C","r":"","q":"一定の要件を満たす特別目的会社については，当該特別目的会社に出資した企業の子会社に該当しないものと推定される。","a":false,"c":"","e":"特別目的会社に資産を譲渡した企業の子会社に該当しない"},{"l":10,"m":"","sb":"","i":"C","r":"","q":"連結の範囲に含めた特別目的会社におけるノンリコース債務は，連結貸借対照表上，他の項目と区別して記載しなければならない。","a":false,"c":"","e":"他の項目と区別して記載する方法のほか，注記によることもできる"},{"l":11,"m":"","sb":"","i":"B","r":"","q":"支配が一時的であると認められる企業は，その旨を注記により開示したうえで連結の範囲に含めることができる。","a":false,"c":"","e":"連結の範囲に含めることができない"},{"l":12,"m":"","sb":"","i":"A","r":"","q":"連結の範囲から除いても，企業集団の財政状態及び経営成績等に関する合理的な判断を妨げない程度に重要性が乏しい子会社かどうかは，企業集団における個々の特性並びに，少なくとも「資産」「売上高」「利益」の3項目に与える影響をもって判断すべきと考えられる。","a":false,"c":"","e":"「資産」「売上高」「利益」「利益剰余金」の4項目"},{"l":13,"m":"","sb":"","i":"C","r":"","q":"親会社と事業内容が著しく異なる子会社は連結の範囲から除外する。","a":false,"c":"","e":"連結の範囲から除外しない\n利害関係者の判断を著しく誤らせる子会社に該当しないことから，連結の範囲から除外しない"},{"l":14,"m":"","sb":"","i":"B","r":"","q":"親会社と連結子会社の決算日の差異が6か月を超えない場合には，子会社の正規の決算を基礎として連結決算を行うことができる。","a":false,"c":"","e":"親会社と連結子会社の決算日の差異が3か月を超えない場合"},{"l":15,"m":"","sb":"","i":"A","r":"","q":"同一環境下で行われた同一の性質の取引等について，親会社及び子会社が採用する会計方針は，原則として，子会社の会計処理を親会社の会計処理に合わせなければならない。","a":false,"c":"","e":"親会社の会計処理を子会社の会計処理に合わせることも認められる"},{"l":16,"m":"","sb":"","i":"B","r":"","q":"棚卸資産の評価方法である先入先出法，平均法等については，親会社と子会社の会計処理の統一を要しない。","a":false,"c":"","e":"財政状態，経営成績及びキャッシュ・フローの状況の表示に重要な影響がないと考えられるため統一を要しない"},{"l":17,"m":"","sb":"","i":"B","r":"","q":"親会社及び子会社の会計処理の統一は，各個別財務諸表の作成段階で行うのが原則である。","a":true,"c":"","e":"なお，例外は連結財務諸表の作成段階で統一することである"},{"l":18,"m":"","sb":"","i":"C","r":"","q":"部分時価評価法は，親会社が子会社を支配した結果，子会社が企業集団に含まれることになった事実を重視している。","a":false,"c":"","e":"全面時価評価法\n部分時価評価法は親会社が投資を行った際の親会社の持分を重視している。また当該方法は廃止されている"},{"l":19,"m":"","sb":"","i":"B","r":"","q":"子会社の資本と相殺消去の対象となる投資に持分法を適用していた場合，持分法評価額に含まれていたのれんを引き継ぐ処理が行われる。","a":false,"c":"","e":"持分法評価額に含まれていたのれんも含めて，のれん（又は負ののれん）が新たに計算される"},{"l":20,"m":"","sb":"","i":"B","r":"","q":"支配獲得日，株式の取得日又は売却日等が子会社の決算日以外の日である場合，当該日の前後いずれかの決算日に支配獲得，株式の取得又は売却等が行われたものとみなして処理しなければならない。","a":false,"c":"","e":"処理することができる"},{"l":21,"m":"","sb":"","i":"A","r":"","q":"子会社の取得が複数の取引により達成された場合，資本連結に係る親会社の子会社に対する投資の金額は，支配を獲得するに至った個々の取引ごとの原価の合計額に基づいて算定される。","a":false,"c":"","e":"支配獲得日の時価\n個別財務諸表における投資の金額は本問の通り算定する"},{"l":22,"m":"","sb":"","i":"A","r":"","q":"資本連結手続上，投資と相殺消去の対象となる子会社の資本には，子会社の個別貸借対照表の純資産の部における株主資本及び評価・換算差額等及び新株予約権と評価差額が含まれる。","a":false,"c":"","e":"新株予約権は含まれない"},{"l":23,"m":"","sb":"","i":"B","r":"","q":"子会社相互間の投資とこれに対応する他の子会社の資本については，連結財務諸表の作成上，相殺消去しない。","a":false,"c":"","e":"親会社の子会社に対する投資と対応する子会社の資本との相殺消去に準じて相殺消去する"},{"l":24,"m":"","sb":"","i":"A","r":"","q":"支配獲得後に，親会社が子会社株式を追加取得した場合，追加取得した株式に対応する持分を非支配株主持分から減額し，追加取得持分を追加投資額と相殺消去する。追加取得持分と追加投資額との間に生じた差額は，のれんとして処理する。","a":false,"c":"","e":"資本剰余金"},{"l":25,"m":"","sb":"","i":"A","r":"","q":"子会社株式を一部売却したが，親会社と子会社の支配関係が継続している場合，支配獲得時に計上したのれんの未償却額のうち売却した子会社株式に対応する額を売却による親会社の持分の減少額と同様に売却価額から控除し，これらの差額を資本剰余金とする。","a":false,"c":"","e":"のれんの未償却額のうち，売却した株式に対応する額を売却価額から控除せず，売却持分と売却価額の差額を資本剰余金として処理する\n支配関係を喪失する場合，のれんの減額をともに売却損益の修正を行う。また，残存投資は以下のように評価する。関連会社になった場合：持分法評価額で評価する／関連会社にも該当しない場合：個別貸借対照表上の帳簿価額で評価する"},{"l":26,"m":"","sb":"","i":"C","r":"","q":"子会社株式の一部売却（支配関係は継続）において，関連する法人税等は，利益剰余金から控除する。","a":false,"c":"","e":"関連する法人税等は，資本剰余金から控除する"},{"l":27,"m":"","sb":"","i":"B","r":"","q":"子会社の時価発行増資によって生じた差額は，原則として資本剰余金に計上するが，利害関係者の判断を著しく誤らせるおそれがあると認められる場合，利益剰余金に直接加減できる。","a":false,"c":"","e":"利益剰余金に直接加減する処理は認められない"},{"l":28,"m":"","sb":"","i":"B","r":"","q":"子会社株式の一部売却により，被投資会社が子会社及び関連会社に該当しなくなった場合，連結財務諸表上，残存する投資は，個別貸借対照表上の帳簿価額をもって評価する。","a":true,"c":"","e":""},{"l":29,"m":"","sb":"","i":"B","r":"","q":"子会社株式の一部売却等の会計処理の結果，その他資本剰余金が負の値となる場合，連結会計年度末において，その他資本剰余金を零とし，当該負の値を利益剰余金から減額する。","a":false,"c":"","e":"その他資本剰余金が負の値となる場合，連結会計年度末において，資本剰余金を零とする"},{"l":30,"m":"","sb":"","i":"B","r":"","q":"連結子会社における親会社株式の取得及び売却は，損益取引であると考えられる。","a":false,"c":"","e":"連結子会社における親会社株式の取得及び売却は，資本取引である\n連結子会社における親会社株式は，企業集団で考えた場合，親会社の保有する自己株式と同様の性格であり，その取得及び売却は，資本取引であると考えられる"},{"l":31,"m":"","sb":"","i":"A","r":"","q":"連結子会社が保有する親会社株式は，当該株式の取得原価を自己株式として純資産の部の株主資本から控除する。","a":false,"c":"","e":"取得原価のうち親会社の持分相当額を自己株式として純資産の部の株主資本から控除し，非支配株主持分相当額は非支配株主持分から控除する"},{"l":32,"m":"","sb":"","i":"A","r":"","q":"連結子会社における親会社株式の売却損益（内部取引によるものを除いた親会社持分相当額）は，連結財務諸表上，親会社における有価証券の売却損益と同様に処理する。","a":false,"c":"","e":"親会社における自己株式処分差額と同様に処理する"},{"l":33,"m":"","sb":"","i":"C","r":"","q":"持分法適用関連会社が当該会社に対して持分法を適用する投資会社の株を保有している場合，特に会計処理を要しない。","a":false,"c":"","e":"投資会社の持分相当額を自己株式として純資産の部の株主資本から控除し，当該会社に対する投資勘定を同額減額する"},{"l":34,"m":"","sb":"","i":"C","r":"","q":"持分法の適用対象となっている子会社における親会社株式の売却損益（内部取引によるものを除いた親会社の持分相当額）は親会社における自己株式処分差額と同様に処理し，当該会社に対する投資勘定を同額加減する。","a":true,"c":"","e":""},{"l":35,"m":"","sb":"","i":"C","r":"","q":"連結子会社が自己株式を非支配株主から取得した段階では，処分又は消却までの暫定的な状態に過ぎないため，親会社の持分比率の変動を認識しない。","a":false,"c":"","e":"連結子会社が自己株式を非支配株主から取得した段階で親会社の持分比率の変動を認識する\n連結子会社が自己株式を非支配株主から取得した段階で，実際に連結子会社の純資産の変動が生じるとともに，非支配株主が有する株式数が減少しているため，持分比率の変動を認識する"},{"l":36,"m":"","sb":"","i":"C","r":"","q":"連結子会社が保有する自己株式を消却した場合，子会社の資本の変動及び親会社の持分比率の変動はないため，連結貸借対照表上，資産の部，負債の部及び純資産の部に変動は生じない。","a":true,"c":"","e":""},{"l":37,"m":"","sb":"","i":"B","r":"","q":"連結会社が振り出した手形を他の連結会社が銀行割引した場合には，連結貸借対照表上，これを支払手形に振り替える。","a":false,"c":"","e":"短期借入金"},{"l":38,"m":"","sb":"","i":"B","r":"","q":"連結会社が発行した社債を親会社が所有する場合，相殺消去しなければならない。","a":false,"c":"","e":"連結会社が発行した社債で一時所有のものは，相殺消去の対象としないことができる"},{"l":39,"m":"","sb":"","i":"C","r":"","q":"非連結子会社及び関連会社に対する投資は，他の項目と区別して記載し，又は注記の方法により明瞭に表示する。","a":true,"c":"","e":""},{"l":40,"m":"","sb":"","i":"B","r":"","q":"利益剰余金のうち，減債積立金等外部者との契約による特定目的のために積み立てられたものがあるときは，独立掲記する。","a":false,"c":"","e":"独立掲記せず，その内容及び金額を注記する"},{"l":41,"m":"","sb":"","i":"B","r":"","q":"会社相互間取引が連結会社以外の企業を通じて行われていても，その取引が実質的に連結会社間の取引であることが明確であるときは，連結会社間の取引とみなして処理する。","a":true,"c":"","e":""},{"l":42,"m":"","sb":"","i":"B","r":"","q":"未実現損益の消去にあたり，制度上，親会社説と整合する方法が採用されている。","a":false,"c":"","e":"ダウン・ストリームの場合は全額消去・親会社負担方式，アップ・ストリームの場合は全額消去・持分按分負担方式が採用されており，親会社説と整合する部分消去・親会社負担方式は採用されていない"},{"l":43,"m":"","sb":"","i":"B","r":"","q":"連結会社間において棚卸資産を時価で売買することにより生じる内部損益について，消去する方法と消去しない方法の双方が認められる。","a":false,"c":"","e":"消去する方法と消去しない方法の双方が認められる，連結会社間において棚卸資産を時価で売買することにより生じる内部損失（未実現損失）については，回収不能と認められる部分は，消去しない"},{"l":44,"m":"","sb":"","i":"B","r":"","q":"未実現利益の消去に伴う減価償却費の修正計算方法については，毎期修正せずに固定資産の除却時又は連結会社以外の会社への売却時に一括して修正する方法が認められている。","a":false,"c":"","e":"一括して修正する方法が認められている，毎期修正する方法による"},{"l":45,"m":"","sb":"","i":"A","r":"","q":"連結損益計算書における当期純利益は，連結貸借対照表における株主資本と対応（連動）している。","a":false,"c":"","e":"親会社株主に帰属する当期純利益が連結貸借対照表における株主資本と対応（連動）"},{"l":46,"m":"","sb":"","i":"A","r":"","q":"連結損益計算書における純損益計算の区分では，非支配株主損益調整前当期純利益に非支配株主に帰属する当期純利益を加減して，当期純利益を表示する。","a":false,"c":"","e":"非支配株主損益調整前当期純利益に非支配株主に帰属する当期純利益を加減して，親会社株主に帰属する当期純利益を表示する"},{"l":47,"m":"","sb":"","i":"C","r":"","q":"連結財務諸表には，重要な資産の評価基準及び減価償却方法を注記することが要求されないが，のれんの償却方法及び償却期間を注記することは要求されていない。","a":false,"c":"","e":"のれんの償却方法及び償却期間を注記することが要求されている"},{"l":48,"m":"","sb":"","i":"B","r":"","q":"事業年度の末日が連結決算日と異なる連結子会社については，連結決算日後に発生した開示後発事象を連結財務諸表に注記する。","a":false,"c":"","e":"当該子会社の決算日後"},{"l":49,"m":"","sb":"","i":"C","r":"","q":"在外子会社の財務諸表が国際財務報告基準又は米国会計基準に準拠して作成されている場合，連結決算手続上，当該在外子会社の会計処理の修正が要求されているのは，のれんの償却，退職給付会計における数理計算上の差異の費用処理，会計方針の変更に関する遡及適用，投資不動産の時価評価及び固定資産の再評価，資本性金融商品の組替調整の5つである。","a":false,"c":"","e":"研究開発費の支出時費用処理"},{"l":50,"m":"","sb":"","i":"C","r":"","q":"親会社の個別財務諸表上，子会社株式を減損処理した場合，連結財務諸表上ののれんを全額償却する。","a":false,"c":"","e":"親会社の個別財務諸表上，子会社株式の帳簿価額を減損処理したことにより，減損処理後の帳簿価額が連結上の子会社の資本の親会社持分額とのれん未償却額の合計額を下回った場合，子会社株式の減損処理後の帳簿価額と，連結上の子会社の資本の親会社持分額とのれん未償却額との合計額との差額のうち，のれん未償却額に達するまでの金額についてのれん償却額として計上しなければならない"},{"l":51,"m":"","sb":"","i":"C","r":"","q":"例えば，関連会社株式の取得原価が100，取得後利益剰余金20，のれん償却累計額5，取得後に生じたその他の包括利益累計額10（いずれも売却後持分額）の場合，持分法評価額は125（=100+20-5+10）となる。","a":true,"c":"","e":""},{"l":52,"m":"","sb":"","i":"C","r":"","q":"子会社株式を一部売却し，支配を喪失して関連会社になった場合，売却前の投資の修正額とこのうち売却後の株式に対応する部分との差額（その他の包括利益累計額を除く）について，個別財務諸表で計上した子会社株式売却損益の修正として処理する。","a":true,"c":"","e":"なお，子会社株式を一部売却し，支配を喪失して関連会社にも該当しなくなった場合も同様である"},{"l":53,"m":"","sb":"","i":"C","r":"","q":"支配を喪失して連結範囲から除外する場合，子会社株式の追加取得及び一部売却等によって生じた資本剰余金は，連結財務諸表上，資本剰余金から控除する。","a":false,"c":"","e":"引き続き，連結財務諸表上，資本剰余金として計上する"},{"l":54,"m":"","sb":"","i":"B","r":"","q":"持分法適用会社の資産及び負債の時価評価方法は部分時価評価法によらなければならない。","a":false,"c":"","e":"部分時価評価法によらなければならない，持分法適用会社が関連会社の場合，部分時価評価法によるが，非連結子会社の場合，全面時価評価法による"},{"l":55,"m":"","sb":"","i":"B","r":"","q":"持分法において，投資が段階的に行われている場合には，原則として，投資日ごとの原価とこれに対応する被投資会社の資本との差額は，段階取得に係る損益として処理する。","a":false,"c":"","e":"のれん又は負ののれんとして処理する\n株式の段階取得に係る計算の結果が原則法によって処理した場合と著しく相違しないときには，持分法適用開始日における時価を基準として，関連会社の資産及び負債のうち投資会社の持分に相当する部分を一括して評価することができる（部分時価評価法の簡便法）"},{"l":56,"m":"","sb":"","i":"B","r":"","q":"被投資会社が持分法の適用範囲に含まれる場合，連結財務諸表上，個別財務諸表上で当該被投資会社の株式の取得原価に含まれた付随費用は，発生した連結会計年度の費用として処理する。","a":false,"c":"","e":"投資原価に含まれる\n連結子会社に係る取得関連費用は発生した連結会計年度の費用として処理する"},{"l":57,"m":"","sb":"","i":"B","r":"","q":"持分法適用関連会社株式の追加取得や一部売却等の場合に，追加取得持分と追加取得額との差額又は売却（減少）持分と売却価額（払込額）との差額は，資本剰余金として処理する。","a":false,"c":"","e":"差額は，のれん若しくは負ののれん又は売却損益の調整として処理する\n連結子会社の場合，支配関係を喪失しない持分変動は資本取引として処理する"},{"l":58,"m":"","sb":"","i":"C","r":"","q":"非連結子会社である持分法適用会社の子会社又は関連会社は，持分法の適用範囲に含まれる。","a":false,"c":"","e":"なお，関連会社である持分法適用会社の子会社又は関連会社は，持分法の適用範囲に含まれない"},{"l":59,"m":"","sb":"","i":"B","r":"","q":"持分法の適用にあたって，投資会社と被投資会社の決算日の差異が3ヵ月を超える場合，被投資会社は連結決算日に正規の決算に準ずる合理的な手続により決算（仮決算）を行う。","a":false,"c":"","e":"被投資会社は連結決算日に正規の決算に準ずる合理的な手続により決算（仮決算）を行う，投資会社は，被投資会社の直近の財務諸表を使用する\n連結子会社で決算日の差異が3ヵ月を超える場合，連結決算日に仮決算が要求される"},{"l":60,"m":"","sb":"","i":"B","r":"","q":"投資会社と持分法適用会社の決算日に差異があり，その差異の期間内に重要な取引又は事象が発生しているときには，持分法適用会社の財務諸表を修正しなければならない。","a":false,"c":"","e":"必要な修正又は注記を行う"},{"l":61,"m":"","sb":"","i":"B","r":"","q":"投資会社の会計処理をその連結子会社に合わせている場合には，持分法の適用上，被投資会社の会計処理についても，当該連結子会社に合わせる。","a":true,"c":"","e":""},{"l":62,"m":"","sb":"","i":"B","r":"","q":"のれんは投資勘定と区別して処理する。","a":false,"c":"","e":"のれんは投資勘定に含めて処理する"},{"l":63,"m":"","sb":"","i":"B","r":"","q":"投資会社は，持分法適用日以降における持分法適用会社のその他の包括利益のうち，投資会社の持分に見合う額は「持分法による投資損益」として親会社株主に帰属する当期純利益の計算に含める。","a":false,"c":"","e":"持分法適用日以降における持分法適用会社のその他の包括利益のうち，投資会社の持分に見合う額は「持分法適用会社に対する持分相当額」として包括利益の計算に含める\n連結子会社に係るその他の包括利益は，包括利益計算書上，その他有価証券評価差額金，繰延ヘッジ損益等に区分して表示する"},{"l":64,"m":"","sb":"","i":"B","r":"","q":"被投資会社から配当金を受け取った場合には，持分法の適用上，当該配当金に相当する額を投資の額から減額する。","a":true,"c":"","e":""},{"l":65,"m":"","sb":"","i":"B","r":"","q":"持分法の適用上，売手側の投資会社に生じた未実現損益は，買手側が関連会社である場合には原則として全額を消去する。","a":false,"c":"","e":"買手側が非連結子会社である場合には全額消去し，関連会社である場合には原則として当該関連会社に対する投資会社の持分相当額を消去する\n関連会社に対しては財務及び営業の方針決定に対して重要な影響を与えているものの，他の支配株主又は主要株主が存在するか，若しくは共同支配を行っているため，未実現損益のうち第三者の持分部分については実現したものと考えられることから，原則として当該未実現損益のうち当該関連会社に対する投資会社の持分相当額についてのみ消去する"},{"l":66,"m":"","sb":"","i":"B","r":"","q":"売手側である持分法適用会社に生じた未実現損益は，持分法適用会社が非連結子会社であるか関連会社であるかに関わらず，投資会社の持分相当額を消去する。","a":true,"c":"","e":""},{"l":67,"m":"","sb":"","i":"A","r":"","q":"持分法を適用する被投資会社に係るのれんの減損処理額と負ののれんについては，特別損益に含めて表示する。","a":false,"c":"","e":"持分法による投資損益に含めて営業外損益に表示する\n連結会社に係るのれんの減損処理額と負ののれんは特別損益に含めて表示する"},{"l":68,"m":"","sb":"","i":"C","r":"","q":"投資会社の持分に負担させた関連会社の欠損は，連結貸借対照表上，「投資有価証券」をゼロとした後は，当該関連会社に貸付金等がある場合には，投資の額を超える部分について当該貸付金等を減額する。債務超過持分相当額が投資及び貸付金等の額を超える場合，当該超過部分は「持分法適用に伴う引当金」等適切な科目をもって負債の部に計上する。","a":false,"c":"","e":"当該超過部分は「持分法適用に伴う負債」等適切な科目をもって負債の部に計上する\n引当金の科目が認められないのは，持分法適用会社の債務超過額は，当該持分法適用会社の各決算期の確定損失が累積されてきたものであり，将来の特定の費用又は損失に該当しないためである"},{"l":69,"m":"","sb":"","i":"C","r":"","q":"関連会社が株式の段階取得により連結子会社となった場合，持分法による投資評価額に含まれていたのれんも含めて，のれんが新たに計算されるが，当該のれんは，持分法による投資評価額に含まれていた未償却部分とそれ以外の部分を区別して，それぞれ償却する。","a":false,"c":"","e":"当該のれんは，持分法による投資評価額に含まれていた未償却部分と区別せず，支配獲得日から新たな償却期間にわたり償却する"}]},{"n":22,"name":"法人税等","qs":[{"l":1,"m":"","sb":"","i":"B","r":"","q":"過年度の所得等に対する法人税，住民税及び事業税等の更正等により，還付される可能性が高く，当該還付税額を合理的に見積ることができる場合（誤謬に該当する場合を除く）には，当該還付税額を損益に計上しなければならない。","a":false,"c":"","e":"還付されることが確実に見込まれる\n更正等による追徴税額については，追加で徴収される可能性が高く，金額を合理的に見積ることができる場合，損益に計上する"},{"l":2,"m":"","sb":"","i":"B","r":"","q":"事業税（付加価値割）及び事業税（資本割）は，原則として，営業外費用として表示する。","a":false,"c":"","e":"販売費及び一般管理費\n・合理的な配分方法に基づきその一部を売上原価として表示することができる。・更正等による追徴税額及び還付税額は，原則として，販売費及び一般管理費として表示する"},{"l":3,"m":"","sb":"","i":"C","r":"","q":"法人税，地方法人税，住民税，事業税（所得割）及び特別法人事業税（基準法人所得割）の更正等による追徴税額及び還付税額は，損益計算書上，原則として，法人税，住民税及び事業税の適切な科目に含めて表示する。","a":false,"c":"","e":"法人税，住民税及び事業税等の適切な科目の次に，その内容を示す科目をもって表示する"},{"l":4,"m":"","sb":"","i":"C","r":"","q":"法人税，住民税及び事業税等の税額が，中間申告により納付された税額を下回る場合等により還付されるとき，当該還付税額のうち受領されていない税額は，貸借対照表の固定資産の区分に，未収還付法人税等などその内容を示す科目をもって表示する。","a":false,"c":"","e":"貸借対照表の流動資産の区分"},{"l":5,"m":"","sb":"","i":"B","r":"","q":"純資産の部に計上されるその他有価証券の評価差額に課される法人税等がある場合，当該法人税等を損益計算書に計上するとともに，評価差額は税効果を控除した金額で表示する。","a":false,"c":"","e":"純資産の部に計上される評価差額は法人税等及び税効果を控除した金額で表示する"},{"l":6,"m":"","sb":"","i":"C","r":"","q":"法人税等が評価・換算差額等に計上される場合，過年度に計上された資産又は負債の評価替えにより生じた評価・換算差額等を損益に計上した時点で，対応する税額を利益剰余金に直接計上する。","a":false,"c":"","e":"対応する税額を損益に計上する（リサイクリング）\n法人税等が評価・換算差額等に計上された後，リサイクリングがなされるまでに法人税等の税率が変更された場合，税率変更に係る差額はリサイクリングしない"},{"l":7,"m":"","sb":"","i":"A","r":"","q":"税効果会計の対象となる法人税等には，法人税のほか，都道府県民税，市町村民税及び資本金額や報酬給与額等を課税標準とする事業税が含まれる。","a":false,"c":"","e":"法人税等に含まれる事業税は，利益に関連する金額を課税標準とするものである\n資本金額や報酬給与額等を課税標準とする事業税は販売費及び一般管理費（租税公課）である"},{"l":8,"m":"","sb":"","i":"B","r":"","q":"繰延法のもとでは，期間差異の解消年度における税引前当期純利益と法人税等の対応が重視される。","a":false,"c":"","e":"期間差異の発生年度\n資産負債法では，差異の解消年度における税引前当期純利益と法人税等が対応する"},{"l":9,"m":"","sb":"","i":"B","r":"","q":"資産負債法は，会計上の資産又は負債の額と課税所得計算上の資産又は負債の額に一時差異が生じており，当該差異が解消する時にその期の課税所得が増額又は増額する効果を有する場合に，当該差異が解消する年度に繰延税金資産又は繰延税金負債を計上する方法である。","a":false,"c":"","e":"差異が生じた年度に繰延税金資産又は繰延税金負債を計上する"},{"l":10,"m":"","sb":"","i":"B","r":"","q":"資産負債法のもとでは，繰延税金資産・負債の計算にあたり，差異の解消年度の税率が適用され，その後に税率の変更があっても繰延税金資産・負債の修正を行わない。","a":false,"c":"","e":"その後に税率の変更があれば繰延税金資産・負債の修正を行う"},{"l":11,"m":"","sb":"","i":"B","r":"","q":"期間差異と一時差異は，会計上と課税所得計算上の間に生じる差異を，損益計算の観点から見るか，資産・負債の観点から見るかの違いであるため，差異の認識範囲は一致する。","a":false,"c":"","e":"一時差異と期間差異の範囲はほぼ一致するが，例えば，有価証券等の資産又は負債の評価替えにより直接純資産の部に計上された評価差額は，一時差異であるが期間差異ではない"},{"l":12,"m":"","sb":"","i":"B","r":"","q":"期間差異に該当する項目は，すべて一時差異に含まれる。","a":true,"c":"","e":""},{"l":13,"m":"","sb":"","i":"B","r":"","q":"繰延税金負債は，将来の法人税等の支払額を減額する効果を有し，法人税等の未払額に相当するため，負債としての性格を有する。","a":false,"c":"","e":"将来の法人税等の支払額を増額する効果を有し"},{"l":14,"m":"","sb":"","i":"B","r":"","q":"将来減算一時差異は，当該一時差異が発生したときにその期の課税所得を減額する効果を持つものである。","a":false,"c":"","e":"当該一時差異が解消したとき"},{"l":15,"m":"","sb":"","i":"C","r":"","q":"永久差異の例としては，交際費の損金算入限度超過額，損金不算入の罰科金，受取配当金の益金不算入額等が挙げられ，税効果会計の対象とならない。","a":true,"c":"","e":""},{"l":16,"m":"","sb":"","i":"B","r":"","q":"将来減算一時差異は，例えば，貸倒引当金，退職給付引当金等の引当金の損金算入限度超過額，将来の課税所得と相殺可能な繰越欠損金，損金に算入されない棚卸資産に係る評価損等がある場合のほか，連結会社相互間の取引から生ずる未実現利益を消去した場合に生ずる。","a":false,"c":"","e":"将来の課税所得と相殺可能な繰越欠損金は一時差異ではない\n将来減算一時差異ではないが，将来加算一時差異と同様の効果を有するため，繰延税金資産を計上する"},{"l":17,"m":"","sb":"","i":"B","r":"","q":"繰越欠損金に係る繰延税金資産は，1年基準に基づいて流動・固定区分を行う。","a":false,"c":"","e":"投資その他の資産の区分に表示する"},{"l":18,"m":"","sb":"","i":"A","r":"","q":"繰延税金資産の回収可能性があると判断するためには，①収益力に基づく一時差異等加減前課税所得，②タックスプランニングに基づく一時差異等加減前課税所得，③将来加算一時差異の3つの要件のすべてを満たしている必要がある。","a":false,"c":"","e":"いずれかの要件を満たしている必要がある"},{"l":19,"m":"","sb":"","i":"A","r":"","q":"繰延税金資産の支払可能性は繰延税金資産の回収可能性と異なり，毎期見直すことが要求されていないため，当初計上された繰延税金負債の金額が修正されることはない。","a":false,"c":"","e":"当初計上された繰延税金負債の金額は，税率の変更があれば修正される\n繰延税金資産の回収可能性は毎期見直すが，繰延税金負債の支払可能性は毎期見直さない"},{"l":20,"m":"","sb":"","i":"C","r":"","q":"土地を対象に積立金方式の圧縮記帳を行い，将来加算一時差異が発生した場合であっても，土地の売却計画がなく，当面税金を支払う可能性がない場合，繰延税金負債は計上しない。","a":false,"c":"","e":"支払可能性があるものとして繰延税金負債を計上する\n繰延税金負債は企業が清算するまでに課税所得が生じないことが合理的に見込まれる場合を除き，支払可能性があるものと判断されるためである"},{"l":21,"m":"","sb":"","i":"B","r":"","q":"租税特別措置法上の諸準備金等の積立額に係る将来減算一時差異は，法人税等調整額を相手勘定として繰延税金負債を計上し，諸準備金等の積立額は繰延税金負債控除前の額である。","a":false,"c":"","e":"租税特別措置法上の諸準備金等の積立額に係る将来加算一時差異は，法人税等調整額を相手勘定として繰延税金負債を計上し，諸準備金等の積立額は繰延税金負債控除後の額である"},{"l":22,"m":"","sb":"","i":"B","r":"","q":"税率変更により諸準備金等に係る繰延税金負債の額を修正した場合，修正差額として諸準備金を計上し，法人税等調整額は計上しない。","a":false,"c":"","e":"法人税調整額は計上しない，税率変更により諸準備金等に係る繰延税金負債の額を修正した場合，当該修正差額は，法人税等調整額として処理するとともに，同額の諸準備金等を計上する"},{"l":23,"m":"","sb":"","i":"A","r":"","q":"繰延税金資産及び繰延税金負債の計算に用いる税率は，決算日において公布されている税法に規定されている税率による。","a":false,"c":"","e":"決算日において国会で成立している税法に規定されている税率"},{"l":24,"m":"","sb":"","i":"A","r":"","q":"年度の期首における繰延税金資産の額と繰延税金負債の額の差額と期末における当該差額の増減額は通常，当期に納付すべき法人税等として計上される。","a":false,"c":"","e":"当期に納付すべき法人税等の調整額として計上"},{"l":25,"m":"","sb":"","i":"A","r":"","q":"資産の評価替えにより生じた評価差益を直接純資産の部に計上する場合，当該評価差益に係る一時差異に関する繰延税金負債について，年度の期首と期末における増減額は，法人税等調整額を相手勘定として計上する。","a":false,"c":"","e":"純資産の部の評価・換算差額等を相手勘定として計上"},{"l":26,"m":"","sb":"","i":"B","r":"","q":"繰延税金資産及び負債は関連した資産・負債の分類に基づいて，繰延税金資産は流動資産又は投資その他の資産として，繰延税金負債は流動負債又は固定負債として表示する。","a":false,"c":"","e":"繰延税金資産は投資その他の資産の区分に表示し，繰延税金負債は固定負債の区分に表示"},{"l":27,"m":"","sb":"","i":"B","r":"","q":"同一納税主体の繰延税金資産と繰延税金負債は双方を相殺せずに表示し，異なる納税主体の繰延税金資産と繰延税金負債は双方を相殺して表示する。","a":false,"c":"","e":"同一納税主体の繰延税金資産と繰延税金負債は，双方を相殺して表示し，異なる納税主体の繰延税金資産と繰延税金負債は，双方を相殺せずに表示する"},{"l":28,"m":"","sb":"","i":"B","r":"","q":"繰延税金資産の発生原因別の主な内訳と回収可能性がないものとして繰延税金資産から控除された額は別個に注記する。","a":false,"c":"","e":"回収可能性がないものとして繰延税金資産から控除された額を併せて記載する"},{"l":29,"m":"","sb":"","i":"B","r":"","q":"税引前当期純利益に対する法人税等調整額を含まない法人税等の比率と法定実効税率との間に重要な差異があるときは，当該差異の原因となった主要な項目別の内訳を注記する。","a":false,"c":"","e":"税引前当期純利益に対する法人税等調整額を含む法人税等の比率"},{"l":30,"m":"","sb":"","i":"C","r":"","q":"評価性引当額は，税務上の繰越外国税額控除に係る評価性引当額と将来減算一時差異等の合計に係る評価性引当額に区分して注記する。","a":false,"c":"","e":"繰越欠損金に係る評価性引当額と将来減算一時差異等の合計に係る評価性引当額とに区分"},{"l":31,"m":"","sb":"","i":"B","r":"","q":"決算日前に税率の変更があった場合には，その内容及びその影響を個別財務諸表及び連結財務諸表に注記する。","a":false,"c":"","e":"その旨及び修正額を注記する"},{"l":32,"m":"","sb":"","i":"B","r":"","q":"事業年度終了後財務諸表作成までに税率の変更があった場合には，新たな税率に基づき再計算した繰延税金資産，繰延税金負債の金額をもって，当年度の財務諸表に計上する。","a":false,"c":"","e":"繰延税金資産及び負債を修正せず，その内容とその影響を注記する"},{"l":33,"m":"","sb":"","i":"A","r":"","q":"資本連結手続において，時価評価した子会社の資産を売却した場合，当該資産を売却した年度に，資産の時価評価による評価差額に係る一時差異の解消に応じて繰延税金資産又は繰延税金負債を取り崩すが，このとき評価差額を相手勘定とする。","a":false,"c":"","e":"法人税等調整額を相手勘定とする"},{"l":34,"m":"","sb":"","i":"A","r":"","q":"未実現利益の消去に係る繰延税金資産を計上するにあたっては，回収可能性を判断しない。","a":true,"c":"","e":"なお，未実現損益の発生年度における売却元の税率を適用して繰延税金資産を計上する"},{"l":35,"m":"","sb":"","i":"A","r":"","q":"未実現損益について，売却元の連結会社に適用されている税率がその後改正になった場合，当該税率変更に伴う繰延税金負債額又は繰延税金資産額の見直しを行う。","a":false,"c":"","e":"税率変更に伴う繰延税金負債額又は繰延税金資産額の見直しは行わない"},{"l":36,"m":"","sb":"","i":"B","r":"","q":"未実現利益の消去に係る繰延税金資産の計上対象となる将来減算一時差異の額については，売却元の連結会社の売却年度における課税所得の額を下限とする。","a":false,"c":"","e":"売却元の連結会社の売却年度における課税所得の額を上限とする"},{"l":37,"m":"","sb":"","i":"B","r":"","q":"個別財務諸表上，連結会社に対する債権の貸倒引当金に繰延税金資産が計上されている場合，連結決算手続上，貸倒引当金の相殺消去に伴い当該繰延税金資産と同額の繰延税金負債を計上する。当該繰延税金負債については，個別財務諸表で計上した繰延税金資産と相殺する。","a":true,"c":"","e":""},{"l":38,"m":"","sb":"","i":"B","r":"","q":"個別財務諸表において連結会社に対する債権に貸倒引当金を計上し，当該貸倒引当金繰入額について税務上の損金算入の要件を満たしている場合，連結決算手続上，債権と債務の相殺消去に伴い原則として，繰延税金負債を取り崩す。この場合，債権者側の連結会社に適用される法定実効税率を用いて計算する。","a":false,"c":"","e":"繰延税金負債を計上する・債権者側の連結会社に適用される法定実効税率を用いる"},{"l":39,"m":"","sb":"","i":"C","r":"","q":"個別財務諸表上，子会社株式の評価損を計上し，当該評価損について税務上の損金算入の要件を満たしている場合，資本連結手続に伴い生じた当該評価損の消去に係る連結財務諸表固有の将来加算一時差異に対して繰延税金負債を計上する。","a":false,"c":"","e":"（ケース区分）税務上損金不算入のため繰延税金資産計上：①連結財務諸表固有の将来加算一時差異に対して繰延税金負債を計上する。税務上で損金算入：連結財務諸表固有の将来加算一時差異に対して繰延税金負債を計上しない"},{"l":40,"m":"","sb":"","i":"A","r":"","q":"のれん又は負ののれんについては税務上の資産又は負債の計上もその償却額の損金又は益算入も認められておらず，また，子会社における個別貸借対照表上の簿価は存在しないから連結財務諸表上一時差異が生じる。したがって，税効果を認識する。","a":false,"c":"","e":"税効果を認識しない"},{"l":41,"m":"","sb":"","i":"B","r":"","q":"子会社株式の追加取得に伴い生じた親会社の持分変動に係る差額に係る連結財務諸表固有の一時差異について繰延税金資産又は繰延税金負債を認識する場合，法人税等調整額を相手勘定として計上する。","a":false,"c":"","e":"資本剰余金を相手勘定として計上する\nなお，税効果を認識するのは子会社投資に係る売却が決定された時点等である"},{"l":42,"m":"","sb":"","i":"B","r":"","q":"子会社に対する投資に係る連結財務諸表固有の将来加算一時差異のうち，子会社の留保利益に係るもので，親会社が当該留保利益を配当金として受け取ることにより解消されるものについては，繰延税金資産を計上する。","a":false,"c":"","e":"繰延税金負債を計上する"},{"l":43,"m":"","sb":"","i":"B","r":"","q":"子会社に対する投資に係る連結財務諸表固有の将来減算一時差異については，原則として，連結決算手続上，繰延税金資産を計上しない。","a":true,"c":"","e":"なお，繰延税金資産を計上するのは，例えば予測可能な将来の期間に，子会社に対する投資の売却等を行う意思決定又は実施計画が存在し，将来減算一時差異が解消される可能性が高く，さらに繰延税金資産に回収可能性があると判断される場合である"},{"l":44,"m":"","sb":"","i":"C","r":"","q":"子会社投資に係る連結財務諸表固有の一時差異については，支配獲得後に生じるものであり，支配獲得時には生じない。","a":false,"c":"","e":"支配獲得時に生じることがある\n子会社投資に係る連結財務諸表固有の一時差異は，子会社に対する投資の連結貸借対照表上の価額（親会社持分＋のれん）と親会社の個別貸借対照表上の投資額（子会社株式の取得原価）の差異から生じる。当該差異は通常，支配獲得後に生じるが，支配獲得時点で生じる項目として以下のものが挙げられる。取得関連費用：子会社株式の取得原価にのみ反映され，連結財務諸表固有の将来減算一時差異発生。段階取得に係る損益：連結上の価額のみに反映され，連結財務諸表固有の一時差異発生（差益の場合は将来加算・差損の場合は将来減算）。負ののれん発生益：連結上の価額にのみ反映され，連結財務諸表固有の将来加算一時差異発生。なお，いずれの差異も子会社投資に係る売却が決定された時点等で税効果を認識する"},{"l":45,"m":"","sb":"","i":"C","r":"","q":"子会社の正規の決算を基礎として連結決算を行う場合，当該子会社の繰延税金資産及び繰延税金負債の計算に用いる税率は，連結決算日において国会で成立している税法等に規定されている税率による。","a":false,"c":"","e":"子会社の決算日において国会で成立している税法等に規定されている税率による\nなお，子会社の決算日が連結決算日と異なる場合で，かつ，当該子会社が連結決算日に正規の決算に準ずる合理的な手続により決算を行う場合，当該子会社の繰延税金資産及び繰延税金負債の計算に用いる税率は，連結決算日において国会で成立している税法等に規定されている税率による"}]},{"n":23,"name":"財務諸表","qs":[{"l":1,"m":"","sb":"","i":"A","r":"","q":"包括利益とは，ある企業の特定期間の財務諸表において認識された純資産の変動額のうち，当該企業の純資産に対する持分所有者との直接的な取引によらない部分をいう。ここにおける持分所有者には，子会社の非支配株主や新株予約権の所有者は含まれない。","a":false,"c":"","e":"子会社の非支配株主や新株予約権の所有者は含まれない，子会社の非支配株主とともに新株予約権の所有者も含まれる"},{"l":2,"m":"","sb":"","i":"A","r":"","q":"包括利益の表示によって提供される情報は，株主資本とのクリーン・サープラス関係を明示することを通じて，財務諸表の理解可能性と比較可能性を高める。","a":false,"c":"","e":"純資産とのクリーン・サープラス関係"},{"l":3,"m":"","sb":"","i":"A","r":"","q":"包括利益の表示の導入は，包括利益を企業活動に関する最も重要な指標として位置づけることを目的としている。","a":false,"c":"","e":"包括利益を企業活動に関する最も重要な指標として位置づけることを目的とはしていない\n当期純利益に関する情報と併せて利用することにより，企業活動の成果についての情報の全体的な有用性を高めることを目的"},{"l":4,"m":"","sb":"","i":"B","r":"","q":"会計方針の変更及び誤謬の訂正に関する累積的影響額に係る期首の純資産の修正額は，当期の財務諸表で認識される純資産の変動であるため，当期の包括利益に含まれる。","a":false,"c":"","e":"当期の包括利益には含まれない\n当該修正額は，株主資本等変動計算書における利益剰余金の期首残高において区分表示する"},{"l":5,"m":"","sb":"","i":"A","r":"","q":"その他の包括利益とは，包括利益のうち親会社株主に帰属する当期純利益に含まれない部分をいう。","a":false,"c":"","e":"包括利益のうち当期純利益に含まれない部分"},{"l":6,"m":"","sb":"","i":"A","r":"","q":"連結財務諸表におけるその他の包括利益には，非支配株主に係る部分は含まれない。","a":false,"c":"","e":"非支配株主に係る部分が含まれる"},{"l":7,"m":"","sb":"","i":"B","r":"","q":"連結財務諸表における包括利益の計算の表示方法は，親会社株主に帰属する当期純利益に，親会社株主に係るその他の包括利益を加減して非支配株主に係る包括利益を計算し，これに非支配株主に係る包括利益を加減する方法による。","a":false,"c":"","e":"親会社株主に係る部分と非支配株主に係る部分を区分する方法による\n当期純利益にその他の包括利益を加減する方法による"},{"l":8,"m":"","sb":"","i":"B","r":"","q":"包括利益計算書上，持分法を適用する被投資会社のその他の包括利益に対する投資会社の持分相当額は，その他有価証券評価差額金，繰延ヘッジ損益等の各内訳項目に含めて表示する。","a":false,"c":"","e":"一括して区分表示する"},{"l":9,"m":"","sb":"","i":"B","r":"","q":"その他の包括利益の内訳項目は，①法人税等及び税効果を控除した後の金額で表示する方法と，②法人税等及び税効果控除前の金額で表示し，法人税等及び税効果の金額を一括して加減する方法が認められているが，②の方法による場合，その他の包括利益の各内訳項目別の税効果の金額の注記は要求されない。","a":false,"c":"","e":"いずれの方法においてもその他の包括利益の各内訳項目別の法人税等及び税効果の金額の注記が要求される"},{"l":10,"m":"","sb":"","i":"B","r":"","q":"持分法適用会社に係る持分相当額，その他の包括利益に係る法人税等及び税効果の金額の注記の対象に含まれる。","a":false,"c":"","e":"その他の包括利益に係る法人税等及び税効果の金額の注記の対象に含まれない\n被投資会社の税金は連結財務諸表には表示されないため"},{"l":11,"m":"","sb":"","i":"B","r":"","q":"組替調整額は，過去の期間にその他の包括利益に含まれていた項目が当期純利益に含められた金額に基づいて計算される。","a":false,"c":"","e":"当期及び過去の期間にその他の包括利益に含まれていた項目"},{"l":12,"m":"","sb":"","i":"B","r":"","q":"組替調整額の注記は，その他の包括利益の各内訳項目別の税効果の金額の注記とは区別して記載しなければならない。","a":false,"c":"","e":"併せて記載することができる"},{"l":13,"m":"","sb":"","i":"B","r":"","q":"ヘッジ対象とされた予定取引で購入した資産の取得価額に加減された繰延ヘッジ損益の金額は，組替調整額に準じて開示する。また，為替予約の振当処理は組替調整額とこれに準じた開示が必要と考えられる。","a":false,"c":"","e":"不要と考えられる\n為替予約の振当処理は，実務に対する配慮から認められてきた特例的な処理であることを勘案したため"},{"l":14,"m":"","sb":"","i":"B","r":"","q":"在外子会社の株式を売却したことに伴う為替換算調整勘定の取崩額は，組替調整額として開示しなければならない。","a":false,"c":"","e":"支配を喪失し，当期純利益に含められた場合，組替調整額として開示する"},{"l":15,"m":"","sb":"","i":"B","r":"","q":"土地再評価差額金の取崩額は組替調整額に該当しない。","a":true,"c":"","e":"土地再評価差額金の取崩額は，利益剰余金に直接加減され当期純損益に計上されないため，組替調整額に該当しない"},{"l":16,"m":"","sb":"","i":"A","r":"","q":"包括利益を表示する計算書は，原則として1計算書方式による。","a":false,"c":"","e":"1計算書方式と2計算書方式を選択適用する"},{"l":17,"m":"","sb":"","i":"B","r":"","q":"1計算書方式と2計算書方式のいずれによる場合も，包括利益のうち親会社株主に係る金額及び非支配株主に係る金額を付記する。","a":true,"c":"","e":""},{"l":18,"m":"","sb":"","i":"B","r":"","q":"要求払預金には，例えば，当座預金，普通預金，定期預金が含まれる。","a":false,"c":"","e":"要求払預金には，例えば，当座預金，普通預金，通知預金が含まれる\n預入期間が3か月以内の定期預金は，現金同等物に含まれる可能性がある"},{"l":19,"m":"","sb":"","i":"A","r":"","q":"現金同等物とは，容易に換金可能であり，かつ，価値の変動について僅少なリスクしか負わない短期投資をいい，株式も含まれる。","a":false,"c":"","e":"価格変動リスクの高い株式は資金の範囲から除かれる"},{"l":20,"m":"","sb":"","i":"A","r":"","q":"現金同等物に具体的に何を含めるのかについては経営者の判断に委ねることが適当と考えられるが，キャッシュ・フロー計算書の比較可能性を考慮して，決算日から3か月以内に満期日又は償還日が到来する短期投資を，一般的な例としている。","a":false,"c":"","e":"取得日から3か月以内"},{"l":21,"m":"","sb":"","i":"B","r":"","q":"当座借越を貸借対照表の短期借入金に含めて表示している場合，キャッシュ・フロー計算書上は「財務活動によるキャッシュ・フロー」の区分に記載する。","a":false,"c":"","e":"（ケース区分）当座借越が企業の日常の資金管理活動において現金同等物とほとんど同様に利用されている場合：負の現金同等物を構成するものとして取り扱う。当座借越の状況が明らかに短期借入金と同様の資金調達活動と判断される場合：「財務活動によるキャッシュ・フロー」の区分に記載する"},{"l":22,"m":"","sb":"","i":"B","r":"","q":"商品及び役務の販売により取得した手形の割引による収入は，「財務活動によるキャッシュ・フロー」の区分に記載することも認められる。","a":false,"c":"","e":"「営業活動によるキャッシュ・フロー」の区分に記載する"},{"l":23,"m":"","sb":"","i":"B","r":"","q":"「営業活動によるキャッシュ・フロー」の区分には，投資活動及び財務活動以外の取引によるキャッシュ・フローを記載して小計を算定する。","a":false,"c":"","e":"投資活動及び財務活動以外の取引によるキャッシュ・フローを記載して小計を算定する，投資活動及び財務活動以外の取引によるキャッシュ・フロー（例えば，災害による保険金収入）は小計の下に記載される項目であり，小計の算定には含まれない"},{"l":24,"m":"","sb":"","i":"B","r":"","q":"自己株式の取得による支出は，有価証券の取得による支出と同様に，「投資活動によるキャッシュ・フロー」の区分に記載する。","a":false,"c":"","e":"「財務活動によるキャッシュ・フロー」の区分に記載する\n・自己株式の取得による支出は，取得事由に関わらず「財務活動によるキャッシュ・フロー」の区分に記載する。・自己株式の処分による収入は，「財務活動によるキャッシュ・フロー」の区分に記載する"},{"l":25,"m":"","sb":"","i":"B","r":"","q":"商品販売により取得した連結会社振出しの手形を他の連結会社が金融機関で割引いた場合，連結キャッシュ・フロー計算書上，「営業活動によるキャッシュ・フロー」の区分に記載する。","a":false,"c":"","e":"「財務活動によるキャッシュ・フロー」の区分に記載する"},{"l":26,"m":"","sb":"","i":"B","r":"","q":"割賦取引又は延払取引により固定資産を取得した場合の割賦代金等の支払は，原則として，「投資活動によるキャッシュ・フロー」の区分に記載する。","a":false,"c":"","e":"「財務活動によるキャッシュ・フロー」の区分に記載する"},{"l":27,"m":"","sb":"","i":"C","r":"","q":"貸付けを事業目的にしている企業における資金の貸付けは，「投資活動によるキャッシュ・フロー」の区分に記載する。","a":false,"c":"","e":"「営業活動によるキャッシュ・フロー」の区分に記載する"},{"l":28,"m":"","sb":"","i":"B","r":"","q":"非支配株主に対する配当金の支払額は，「財務活動によるキャッシュ・フロー」の区分に親会社の株主に対する配当金の支払額と合算して記載する。","a":false,"c":"","e":"「財務活動によるキャッシュ・フロー」の区分に独立の項目として記載する\n非支配株主の増資引受による払込も「財務活動によるキャッシュ・フロー」の区分に独立掲記する"},{"l":29,"m":"","sb":"","i":"C","r":"","q":"取引先への前渡金や営業保証金の支出及び取引先からの前受金や営業保証金の収入等は，「営業活動によるキャッシュ・フロー」の区分に記載する。","a":true,"c":"","e":""},{"l":30,"m":"","sb":"","i":"A","r":"","q":"課税所得を活動ごとに分割できる場合，法人税等の支払額は，営業活動，投資活動，財務活動の3つの区分のそれぞれに分けて記載することも認められる。","a":false,"c":"","e":"「営業活動によるキャッシュ・フロー」の区分に一括して記載する"},{"l":31,"m":"","sb":"","i":"B","r":"","q":"付加価値割及び資本割に係る事業税の支払は，「営業活動によるキャッシュ・フロー」の「法人税等の支払額」に含める。","a":false,"c":"","e":"「法人税等の支払額」に含めてはならない"},{"l":32,"m":"","sb":"","i":"B","r":"","q":"受取利息と受取配当金は，「営業活動によるキャッシュ・フロー」と「財務活動によるキャッシュ・フロー」のいずれかの区分に記載する。","a":false,"c":"","e":"「営業活動によるキャッシュ・フロー」と「投資活動によるキャッシュ・フロー」のいずれか"},{"l":33,"m":"","sb":"","i":"A","r":"","q":"支払配当金は「財務活動によるキャッシュ・フロー」の区分に記載しなければならない。","a":true,"c":"","e":"利息及び配当金の受払に係るキャッシュ・フローについては2つの方法の選択適用が認められているが，いずれの方法においても支払配当金は「財務活動によるキャッシュ・フロー」に表示する"},{"l":34,"m":"","sb":"","i":"B","r":"","q":"利息の受取額及び支払額は，純額で表示する。","a":false,"c":"","e":"総額で表示する"},{"l":35,"m":"","sb":"","i":"B","r":"","q":"持分法適用会社からの配当金の受取額は，連結会社相互間のキャッシュ・フローとして相殺消去されるため，連結キャッシュ・フロー計算書に記載されない。","a":false,"c":"","e":"「営業活動によるキャッシュ・フロー」又は「投資活動によるキャッシュ・フロー」の区分のいずれかに記載する"},{"l":36,"m":"","sb":"","i":"C","r":"","q":"間接法により「営業活動によるキャッシュ・フロー」を表示する場合，持分法適用会社から の配当金受取額を持分法による投資利益と相殺して表示する。","a":false,"c":"","e":"相殺して表示することもできる"},{"l":37,"m":"","sb":"","i":"A","r":"","q":"期間が短く，又は，回転が速い項目に係るキャッシュ・フローは，純額で表示する。","a":false,"c":"","e":"期間が短く，かつ，回転が速い項目に係るキャッシュ・フローは，純額で表示することができる"},{"l":38,"m":"","sb":"","i":"C","r":"","q":"従業員からの源泉所得税や社会保険料等の預かり金及び納付に係るキャッシュ・フローは，総額で表示する。","a":false,"c":"","e":"純額で表示する"},{"l":39,"m":"","sb":"","i":"B","r":"","q":"社債発行費及び株式交付費に重要性がない場合は，社債や株式の発行価額から社債発行費や株式交付費を控除した実質手取額によって表示する。","a":false,"c":"","e":"社債発行費及び株式交付費に重要性がある場合，実質手取額によって表示する\n発行費等に重要性がない場合，それぞれのキャッシュ・フローを総額で表示することが認められている"},{"l":40,"m":"","sb":"","i":"B","r":"","q":"資産除去債務の履行に係る支出額は，「営業活動によるキャッシュ・フロー」に記載する。","a":false,"c":"","e":"「投資活動によるキャッシュ・フロー」に記載する"},{"l":41,"m":"","sb":"","i":"B","r":"","q":"（現行リース）売買処理された借手側のファイナンス・リース取引に係る支払リース料のうち，元本返済額部分は，「投資活動によるキャッシュ・フロー」の区分に記載し，利息相当額部分については，企業が採用した支払利息の表示区分に従って記載する。","a":false,"c":"","e":"元本返済額部分は，「財務活動によるキャッシュ・フロー」の区分に記載する"},{"l":42,"m":"","sb":"","i":"B","r":"","q":"（新リース）借手側の支払リース料のうち，元本返済額部分は，「投資活動によるキャッシュ・フロー」の区分に記載し，利息相当額部分については，企業が採用した支払利息の表示区分に従って記載する。","a":false,"c":"","e":"元本返済額部分は，「財務活動によるキャッシュ・フロー」の区分に記載"},{"l":43,"m":"","sb":"","i":"B","r":"","q":"（現行リース）オペレーティング・リース取引に係る支払リース料のキャッシュ・フローは，原則として，「投資活動によるキャッシュ・フロー」の区分に記載する。","a":false,"c":"","e":"「営業活動によるキャッシュ・フロー」の区分に記載する\nオペレーティング・リースに係る支払リース料は営業損益計算の対象に含まれるためである"},{"l":44,"m":"","sb":"","i":"B","r":"","q":"（新リース）利息相当額区分を区分計算していない場合は，支払リース料を「営業活動によるキャッシュ・フロー」の区分に記載する。","a":false,"c":"","e":"「財務活動によるキャッシュ・フロー」\n借手についてはファイナンス・リース取引とオペレーティング・リース取引の区分が廃止されたためオペレーティング・リースに係る支払リース料の取扱いが変更された"},{"l":45,"m":"","sb":"","i":"A","r":"","q":"連結範囲の変動を伴う株式の取得を行った場合，連結キャッシュ・フロー計算書において，当該株式の取得のために支払った額をもって「投資活動によるキャッシュ・フロー」の区分に記載する。","a":false,"c":"","e":"株式の取得のために支払った額から，新たに連結子会社となった会社の現金及び現金同等物の額を控除した額\n連結範囲の変動を伴う子会社株式の売却に係るキャッシュ・フローは，連結子会社でなくなった会社の現金及び現金同等物の額を株式の売却による収入額から控除して「投資活動によるキャッシュ・フロー」に記載する"},{"l":46,"m":"","sb":"","i":"A","r":"","q":"連結範囲の変動を伴わない子会社株式の売却に係るキャッシュ・フローについては，当該変動に関連するキャッシュ・フローを「投資活動によるキャッシュ・フロー」の区分に記載する。","a":false,"c":"","e":"「財務活動によるキャッシュ・フロー」の区分に記載する\n子会社株式の追加取得又は一部売却による親会社の持分変動による差額は，資本剰余金に計上されるため，連結範囲の変動を伴わない子会社株式の売却に係るキャッシュ・フローについては，非支配株主との取引として「財務活動によるキャッシュ・フロー」の区分に記載する"},{"l":47,"m":"","sb":"","i":"B","r":"","q":"連結キャッシュ・フロー計算書上，支配獲得時に生じた取得関連費用に係るキャッシュ・フローは「投資活動によるキャッシュ・フロー」の区分に記載する。","a":false,"c":"","e":"「営業活動によるキャッシュ・フロー」の区分に記載する"},{"l":48,"m":"","sb":"","i":"B","r":"","q":"在外子会社の外貨によるキャッシュ・フローは，資本取引に関連するキャッシュ・フローを含めて「外貨建取引等会計処理基準」における収益及び費用の換算方法に準じて換算する。","a":false,"c":"","e":"配当金，増資等の資本取引に関連するキャッシュ・フローは，発生時の為替相場で換算する"},{"l":49,"m":"","sb":"","i":"B","r":"","q":"「営業活動によるキャッシュ・フロー」の区分における表示方法は，一会計期間のキャッシュ・フローの状況を報告する観点から，原則として直接法による。","a":false,"c":"","e":"継続適用を条件として，直接法と間接法の選択適用が認められる"},{"l":50,"m":"","sb":"","i":"B","r":"","q":"「営業活動によるキャッシュ・フロー」の区分を間接法により表示する場合，法人税等を控除した後の当期純利益から開始する形式による。","a":false,"c":"","e":"法人税等を控除する前の当期純利益から開始する形式による"},{"l":51,"m":"","sb":"","i":"B","r":"","q":"資金の範囲に含めた現金及び現金同等物の内容は，重要な会計方針として注記し，正当な理由により変更した場合，遡及適用を行う。","a":true,"c":"","e":""},{"l":52,"m":"","sb":"","i":"B","r":"","q":"社債の償還と引換えにより新株予約権付社債に付された新株予約権が行使された場合，「財務活動によるキャッシュ・フロー」の区分に記載する。","a":false,"c":"","e":"重要な非資金取引として，キャッシュ・フロー計算書に注記する"},{"l":53,"m":"","sb":"","i":"C","r":"","q":"重要な資産除去債務を計上した場合であっても資産除去債務を履行するまでは，キャッシュ・フロー計算書に影響しない。","a":false,"c":"","e":"重要な非資金取引として，キャッシュ・フロー計算書に注記する必要がある"},{"l":54,"m":"","sb":"","i":"C","r":"","q":"連結財務諸表作成会社が有価証券報告書において開示が要求されている連結附属明細表の種類は，有形固定資産等明細表，借入金等明細表，資産除去債務明細表の3つである。","a":false,"c":"","e":"社債明細表，借入金等明細表，資産除去債務明細表の3つである"},{"l":55,"m":"","sb":"","i":"C","r":"","q":"連結財務諸表作成会社は，個別財務諸表として個別附属明細表を開示する必要はない。","a":false,"c":"","e":"個別附属明細表として，有価証券明細表，有形固定資産等明細表，引当金明細表を開示する"},{"l":56,"m":"","sb":"","i":"C","r":"","q":"金融商品取引法に規定される一定の有価証券の発行者（上場会社やこれに準ずる会社）については，有価証券明細表の作成が不要とされる。","a":true,"c":"","e":"これは，有価証券報告書におけるコーポレート・ガバナンスの状況の「株式の保有状況」において一定の開示がなされており，情報の重複記載を避けるためである"}]},{"n":24,"name":"企業結合","qs":[{"l":1,"m":"","sb":"","i":"C","r":"","q":"複数の取引が1つの企業結合を構成している場合，それらを別個のものとして取り扱う。","a":false,"c":"","e":"一体として取り扱う"},{"l":2,"m":"","sb":"","i":"B","r":"","q":"パーチェス法は，ある種の非貨幣財同士の交換の会計処理と整合する。","a":false,"c":"","e":"新規投資の会計処理\nある種の非貨幣財同士の交換の会計処理と整合するのは，持分プーリング法である"},{"l":3,"m":"","sb":"","i":"C","r":"","q":"いずれかの結合当事企業において持分の継続が断たれているならば，持分プーリング法が，企業にとっての投資原価の回収計算すなわち損益計算の観点から優れている。","a":false,"c":"","e":"持分プーリング法"},{"l":4,"m":"","sb":"","i":"C","r":"","q":"新設合併の場合には，すべての結合当事企業の資産及び負債を企業結合時の時価に評価替えするフレッシュ・スタート法を採用することが認められている。","a":false,"c":"","e":"認められていない"},{"l":5,"m":"","sb":"","i":"C","r":"","q":"持分プーリングは廃止されており，制度上，持分の結合に該当する企業結合は存在しない。","a":false,"c":"","e":"共同支配企業の形成は，持分の結合である"},{"l":6,"m":"","sb":"","i":"B","r":"","q":"主な対価の種類として，現金もしくは他の資産を引き渡す場合，通常，当該現金もしくは他の資産を受け取る企業が取得企業となる。","a":false,"c":"","e":"現金もしくは他の資産を引き渡す企業が取得企業となる"},{"l":7,"m":"","sb":"","i":"B","r":"","q":"対価の種類が株式である場合の取得企業の決定にあたっては，総体としての株主が占める相対的な議決権比率の大きさを優先的な判断基準とする。","a":false,"c":"","e":"本肢の要素の他，最も大きな議決権比率を有する株主の存在，取締役を選解任できる株主の存在などの要素を総合的に勘案しなければならない"},{"l":8,"m":"","sb":"","i":"A","r":"","q":"株式の交換による取得の場合，市場価格のある取得企業等の株式が取得の対価として交付されるときは，主要な交換条件が合意されて公表された時点の株価をもって取得原価を算定する。","a":false,"c":"","e":"企業結合日（支配獲得日）の株価"},{"l":9,"m":"","sb":"","i":"A","r":"","q":"取得が複数の取引により達成された場合には，個別上，支配を獲得するに至った個々の取引すべての企業結合日における時価をもって取得原価を算定する。","a":false,"c":"","e":"支配を獲得するに至った個々の取引すべての企業結合日における時価の合計額\n連結上，支配を獲得するに至った個々の取引すべての企業結合日における時価が用いられる"},{"l":10,"m":"","sb":"","i":"B","r":"","q":"被取得企業の取得原価と，支配を獲得するに至った個々の取引ごとの原価の合計額との差額を，段階取得に係る損益として処理する。","a":false,"c":"","e":"被取得企業の取得原価と，持分法による評価額との差額を，段階取得に係る損益として処理する"},{"l":11,"m":"","sb":"","i":"A","r":"","q":"連結財務諸表上，取得関連費用（外部のアドバイザー等に支払った特定の報酬・手数料等）は，取得原価に含めて処理する。","a":false,"c":"","e":"発生した事業年度の費用として処理する\n・個別財務諸表上，子会社株式の取得に伴って発生した取得関連費用は取得原価に含めて処理する。・株式の段階取得により支配を獲得する場合，連結財務諸表上，支配獲得前に保有していた株式の取得原価に含まれている付随費用は段階取得に係る損益に含まれる"},{"l":12,"m":"","sb":"","i":"B","r":"","q":"将来の業績に依存する条件付取得対価は，その時価を支配獲得日において合理的に見積り，被取得企業の取得原価に含める。","a":false,"c":"","e":"条件付取得対価の交付又は引渡しが確実となり，その時価が合理的に決定可能となった時点で，支払対価を取得原価として追加的に認識するとともに，のれんを追加的に認識する又は負ののれんを減額する"},{"l":13,"m":"","sb":"","i":"B","r":"","q":"将来の業績に依存する条件付取得対価の交付又は引渡しが確実となり，その時価が合理的に決定可能となった場合，追加的に認識されたのれんは，その時点から将来に向かって償却額を損益処理する。","a":false,"c":"","e":"追加的に認識されたのれんは，企業結合日時点で認識されたものと仮定して計算し，追加認識する事業年度以前に対応する償却額は損益処理する\n減損損失額があれば当期の損益として処理する"},{"l":14,"m":"","sb":"","i":"B","r":"","q":"取得原価は，識別可能資産及び負債の企業結合日時点の時価を基礎として，当該資産及び負債に対して企業結合日に配分しなければならない。","a":false,"c":"","e":"企業結合日以後1年以内に配分する"},{"l":15,"m":"","sb":"","i":"C","r":"","q":"時価が一義的には定まりにくい土地が識別可能資産に含まれており，正ののれんが多額に生じることが見込まれるときには，その金額を土地に配分して，合理的に時価を算定できる。","a":false,"c":"","e":"負ののれん"},{"l":16,"m":"","sb":"","i":"B","r":"","q":"企業結合日以後の決算時に取得原価の配分が完了していなかった場合，会計処理を行わず，その後追加的に入手した情報等に基づき配分額が確定した時点で会計処理を行う。","a":false,"c":"","e":"企業結合日以後の決算時点で入手可能な合理的な情報等に基づき暫定的な会計処理を行い，その後追加的に入手した情報等に基づき配分額を確定させる"},{"l":17,"m":"","sb":"","i":"B","r":"","q":"暫定的な会計処理の確定により取得原価の配分額を見直した場合，当該見直しに伴うのれんの修正額は当期の損益として処理する。","a":false,"c":"","e":"暫定的な会計処理が企業結合年度の翌年度に行われた場合には，企業結合年度に当該確定が行われたかのように会計処理を行う"},{"l":18,"m":"","sb":"","i":"B","r":"","q":"識別可能資産及び負債は，被取得企業の企業結合日前の貸借対照表に計上されていたものに限られる。","a":false,"c":"","e":"限られない\n例えば，仕掛研究開発は費用処理されており貸借対照表に計上されていないが，識別可能資産に該当しうる"},{"l":19,"m":"","sb":"","i":"A","r":"","q":"無形資産については，詳細な会計基準が定められていない等の理由により，識別可能なものであっても取得原価を当該無形資産等に配分しないことができる。","a":false,"c":"","e":"原則として取得原価を配分して資産計上する\n従来，無形資産は，詳細な会計基準が定められていない等の理由により，識別可能なものであっても「取得原価を当該無形資産等に配分することができる」ものとされていた"},{"l":20,"m":"","sb":"","i":"A","r":"","q":"企業結合により取得した仕掛研究開発は，「研究開発費等に係る会計基準」との整合性を重視し，取得原価の配分時に費用処理する。","a":false,"c":"","e":"「研究開発費等に係る会計基準」との整合性を重視し，企業結合により受け入れた他の資産の取扱いとの整合性を重視し，資産計上する"},{"l":21,"m":"","sb":"","i":"B","r":"","q":"取得後短期間に発生することが予測される特定の事象に対応した費用又は損失であって，発生の可能性が取得の対価の算定に反映されていない場合，企業結合に係る特定勘定を認識する。","a":false,"c":"","e":"取得後（短期間であることは求められていない）に発生することが予測される特定の事象に対応した費用又は損失であって，発生の可能性が取得の対価の算定に反映されている場合"},{"l":22,"m":"","sb":"","i":"B","r":"","q":"企業結合に係る特定勘定は原則として，固定負債として表示し，5年以内の効果の及ぶ期間にわたって規則的に取り崩す。","a":false,"c":"","e":"認識の対象となった事象が発生した事業年度又は当該事象が発生しないことが明らかになった事業年度に取り崩す"},{"l":23,"m":"","sb":"","i":"B","r":"","q":"取得原価が，受け入れた資産及び引き受けた負債に配分された純額を上回る場合には，その不足額は負ののれんとして会計処理する。","a":false,"c":"","e":"下回る"},{"l":24,"m":"","sb":"","i":"B","r":"","q":"個別財務諸表に計上されたのれんは，資産に計上し，5年以内のその効果の及ぶ期間にわたって，定額法その他の合理的な方法により規則的に償却する。","a":false,"c":"","e":"20年以内"},{"l":25,"m":"","sb":"","i":"A","r":"","q":"国際的な会計基準ではのれんの規則的な償却を行わず，減損処理のみが要求されているが，わが国はそれと異なり，規則的な償却を行い，減損処理の対象外とすることが要求されている。","a":false,"c":"","e":"わが国においてのれんは「固定資産の減損に係る会計基準」にしたがい減損処理の対象とされている"},{"l":26,"m":"","sb":"","i":"B","r":"","q":"負ののれんが生じると見込まれる場合，原則として，すべての識別可能資産及び負債が把握されているか，また，それらに対する取得原価の配分が適切に行われているかどうかを見直す。","a":true,"c":"","e":""},{"l":27,"m":"","sb":"","i":"B","r":"","q":"のれんの償却費は販売費及び一般管理費に表示するが，保守主義の観点から発生時に一括償却し，特別損失に計上することも認められる。","a":false,"c":"","e":"過度の保守主義に該当するため，認められない"},{"l":28,"m":"","sb":"","i":"A","r":"","q":"負ののれんの会計処理には，正ののれんとの対称性を重視した方法が採用されている。","a":false,"c":"","e":"発生した事業年度の利益（特別利益）として処理する方法が採用されている"},{"l":29,"m":"","sb":"","i":"B","r":"","q":"吸収合併において，消滅会社が被取得企業となる場合，存続会社の個別財務諸表では，当該消滅会社の資産及び負債を合併直前の適正な帳簿価額により計上する。","a":false,"c":"","e":"時価"},{"l":30,"m":"","sb":"","i":"B","r":"","q":"株式交換において，完全子会社が取得企業となる場合，完全親会社の個別財務諸表上，当該完全子会社の株式交換直前における時価に基づき，完全子会社株式の取得原価を算定する。","a":false,"c":"","e":"適正な帳簿価額による株主資本の額に基づき，完全子会社株式の取得原価を算定する"},{"l":31,"m":"","sb":"","i":"C","r":"","q":"複数の独立した企業により共同で支配される企業を共同支配投資企業という。","a":false,"c":"","e":"共同支配企業"},{"l":32,"m":"","sb":"","i":"A","r":"","q":"共同支配企業の形成に該当するには，原則として，支払対価のすべてが議決権付株式であるか，共同支配となる契約等を締結していることが必要である。","a":false,"c":"","e":"共同支配企業の形成に該当するためには本問の要件の他，共同支配投資企業となる企業が複数の独立した企業から構成されていること，支配関係を示す一定の事実が存在しないことが求められている。なお，共同支配企業に対する議決権比率が均等であることは要求されていない"},{"l":33,"m":"","sb":"","i":"B","r":"","q":"共同支配投資企業は，共同支配企業に対する投資に比例連結を適用することも認められる。","a":false,"c":"","e":"比例連結を適用することは認められず，持分法を適用する\n渾然一体となっている共同支配企業の資産，負債等を一律に持分比率で按分して連結財務諸表に計上することは不適切であるため，比例連結は認められていない"},{"l":34,"m":"","sb":"","i":"B","r":"","q":"共同支配投資企業が事業を移転した場合，移転した事業に係る資産及び負債の移転直前の適正な帳簿価額による株主資本相当額に基づいて投資の取得原価を算定し，連結財務諸表上，共同支配企業の資本のうち共同支配投資企業の持分比率に対応する部分との差額は処理しない。","a":false,"c":"","e":"共同支配投資企業が，事業を移転した場合，移転した事業に係る資産及び負債の移転直前の適正な帳簿価額による株主資本相当額に基づいて投資の取得原価を算定し，連結財務諸表上，共同支配企業の資本のうち投資企業の持分比率に対応する部分との差額（のれん相当額）を処理する"},{"l":35,"m":"","sb":"","i":"A","r":"","q":"親会社と子会社が企業結合し，子会社の資産及び負債の帳簿価額を連結上修正している場合，親会社の個別財務諸表上，修正前の帳簿価額で計上する。","a":false,"c":"","e":"連結上の金額である修正後の帳簿価額（のれんを含む）で計上する"},{"l":36,"m":"","sb":"","i":"B","r":"","q":"共通支配下の取引により子会社が法律上消滅する場合，当該子会社に係る子会社株式の適正な帳簿価額とこれに対応する増加資本との差額は，親会社の利益剰余金に直接加減する。","a":false,"c":"","e":"親会社の損益とする"},{"l":37,"m":"","sb":"","i":"C","r":"","q":"非支配株主との取引は，企業結合に該当し，「企業結合に関する会計基準」が適用される。","a":false,"c":"","e":"非支配株主との取引は，企業結合に該当しない取引である"},{"l":38,"m":"","sb":"","i":"B","r":"","q":"親会社が自社の株式を対価として子会社株式を追加取得した場合，連結財務諸表上の非支配株主持分の金額相当額をもって，個別財務諸表における子会社株式の取得原価を算定する。","a":false,"c":"","e":"子会社株式の時価と支払対価となる自社の株式の時価のうち，より高い信頼性をもって測定可能な時価をもって"}]},{"n":25,"name":"事業分離等","qs":[{"l":1,"m":"","sb":"","i":"B","r":"","q":"移転した事業に係る株主資本相当額とは，移転した事業に係る資産及び負債の移転直前の適正な帳簿価額による差額をいう。","a":false,"c":"","e":"移転した事業に係る資産及び負債の移転直前の適正な帳簿価額による差額から，評価・換算差額等及び新株予約権を控除した額をいう"},{"l":3,"m":"","sb":"","i":"B","r":"","q":"現金など，移転した事業と明らかに異なる資産を対価として受け取る場合，投資が清算されたとみなされる場合とそうでない場合があり，必ずしも移転損益は認識されない。","a":true,"c":"","e":""},{"l":4,"m":"","sb":"","i":"A","r":"","q":"「事業分離等に関する会計基準」では，「企業結合に関する会計基準」と同様に，投資の継続・清算という概念に基づいて事業分離の会計処理を考えており，観察可能な具体的要件について，は，「対価の種類」と「支配」が該当するものと考えている。","a":false,"c":"","e":"観察可能な具体的要件については，「対価の種類」は該当するが，「支配」については必ずしも該当しないものと考えている\nこれは分離元企業の株式のみを受取対価とする事業分離において，分離先企業が関連会社に該当する場合，移転事業に対する支配を喪失しているものの，投資の継続として扱われることから明らかである"},{"l":5,"m":"","sb":"","i":"B","r":"","q":"事業分離が企業結合（取得）とされ，分離先企業（結合企業）が，パーチェス法に基づき取引時点の取得の対価となる財の時価をもって取得原価とする場合，これと対称的に分離元企業は，移転損益を認識しなければならない。","a":false,"c":"","e":"事業分離により分離先企業が分離元企業の関連会社となる場合，分離先企業（結合企業）においては取得と判定され，パーチェス法に基づき取引時点の取得の対価となる財の時価をもって取得原価とするが，分離元企業は関連会社株式を通じて移転した事業に対する投資を引き続き行っていると考えられるため移転損益は認識しない"},{"l":6,"m":"","sb":"","i":"B","r":"","q":"事業分離に要した支出額は，受け取る資産の取得原価に含めて処理する。","a":false,"c":"","e":"発生時の事業年度の費用として処理する"},{"l":7,"m":"","sb":"","i":"B","r":"","q":"分離元企業において移転損益を認識する場合の受取対価となる財の時価は，受取対価が現金以外の資産等の場合には，移転した事業の時価で算定する。","a":false,"c":"","e":"受取対価となる財の時価と移転した事業の時価のうち，より高い信頼性をもって測定可能な時価で算定する"},{"l":8,"m":"","sb":"","i":"B","r":"","q":"市場価格のある分離先企業の株式が受取対価とされる場合，受取対価となる財の時価は，事業分離の合意公表日の株価を基準にして算定する。","a":false,"c":"","e":"事業分離日の株価を基準にして算定する"},{"l":9,"m":"","sb":"","i":"C","r":"","q":"分離元企業は，重要な会社分割などの場合には，事業分離日の前日に決算又は仮決算を行い，適正な帳簿価額を確定させる必要がある。","a":true,"c":"","e":""},{"l":10,"m":"","sb":"","i":"A","r":"","q":"現金等の財産のみを受取対価とする事業分離における分離元企業の個別財務諸表上の会計処理について，空欄を埋めなさい。分離先企業＝子会社：受け取った現金等の財産の金額＝①、移転損益の認識の要否＝④。分離先企業＝関連会社：受け取った現金等の財産の金額＝②、移転損益の認識の要否＝⑤。分離先企業＝その他投資先：受け取った現金等の財産の金額＝③、移転損益の認識の要否＝⑥。","a":false,"c":"","e":"①移転前に付された適正な帳簿価額②時価③時価④する⑤する⑥する"},{"l":2,"m":"","sb":"","i":"B","r":"","q":"分離元企業において，移転した事業に対する投資が清算されたとみる場合，事業を分離先企業に移転したことにより受取対価となる財の時価と，移転した事業に係る株主資本相当額との差額は移転損益として認識し，改めて当該受取対価の時価にて投資を行ったものとする。","a":true,"c":"","e":""},{"l":11,"m":"","sb":"","i":"A","r":"","q":"分離先企業の株式のみを受取対価とする事業分離における分離元企業の個別財務諸表上の会計処理について，空欄を埋めなさい。分離先企業＝子会社：受け取った分離先企業株式の金額＝①、移転損益の認識の要否＝④。分離先企業＝関連会社：受け取った分離先企業株式の金額＝②、移転損益の認識の要否＝⑤。分離先企業＝その他投資先：受け取った分離先企業株式の金額＝③、移転損益の認識の要否＝⑥。","a":false,"c":"","e":"①移転した事業に係る株主資本相当額②移転した事業に係る株主資本相当額③時価④しない⑤しない⑥する"},{"l":12,"m":"","sb":"","i":"C","r":"","q":"現金等の財産と分離先企業の株式を受取対価とする事業分離における分離元企業の個別財務諸表上の会計処理について，空欄を埋めなさい（子会社・関連会社・その他投資先について，受け取った現金等の財産の金額，受け取った分離先企業株式の金額，移転損益の認識の要否を答える表）。","a":false,"c":"","e":"①移転前に付された適正な帳簿価額②時価③時価④ゼロ⑤借方差額⑥ゼロ⑦借方差額⑧時価⑨する⑩しない⑪する⑫しない⑬する"},{"l":13,"m":"","sb":"","i":"C","r":"","q":"被結合企業の株主の個別財務諸表上の会計処理について，子会社や関連会社以外の投資先を被結合企業とする企業結合により，子会社株式や関連会社株式以外の被結合企業の株式が結合企業の株式のみと引き換えられ，結合後企業が当該株主の子会社や関連会社に該当しない場合，結合後企業の株式の取得原価は，引き換えられた被結合企業の株式の時価に基づいて算定し，交換損益を認識する。","a":false,"c":"","e":"結合後企業の株式の取得原価は，引き換えられた被結合企業の株式に係る企業結合直前の適正な帳簿価額に基づいて算定し，交換損益は認識しない\n有価証券の保有目的区分が企業結合の前後に関わらずその他有価証券であり，投資の継続に該当する"}]},{"n":26,"name":"過去問リサイクル対策（第2部）","qs":[{"l":1,"m":"","sb":"","i":"B","r":"平成20年","q":"残存価額を法人税法の規定によっていた企業は，残存価額に関する税制改正があった場合には，変更後の法人税法の規定による残存価額に変更しなければならない。","a":false,"c":"","e":"会計処理の上で法人税法に基づく減価償却計算が強制連用されるものではない"},{"l":2,"m":"","sb":"","i":"C","r":"平成20年","q":"被取得企業の資産および負債を時価評価するにあたり，識別可能な無形資産を計上することが認められ，それと同時に負ののれんが計上される場合もある。","a":true,"c":"","e":""},{"l":3,"m":"","sb":"","i":"A","r":"平成20年","q":"わが国の討議資料「財務会計の概念フレームワーク」によれば，当期の包括利益の額から当期のその他の包括利益の額を控除すれば，当期の純利益の額が算定される。","a":true,"c":"","e":""},{"l":4,"m":"","sb":"","i":"B","r":"平成20年","q":"資産と負債の評価が損益計算の結果として得られる場合には，貸借対照表と損益計算書は完全に連繋しており，純利益と包括利益との間に差異はない。","a":false,"c":"","e":""},{"l":5,"m":"","sb":"","i":"A","r":"平成20年","q":"期末に資産負債を実地調査することにより貸借対照表を作成する場合，資産負債の貸借対照表能力・評価の基準は，貸借対照表を作成する目的により規定されることになる。","a":false,"c":"","e":""},{"l":6,"m":"","sb":"","i":"C","r":"平成20年","q":"A社とB社が消滅してC社を新設する新設合併のケースにおいては，C社の開始貸借対照表の作成にあたり，A社及びB社の資産及び負債を時価評価することが認められている。","a":false,"c":"","e":""},{"l":7,"m":"","sb":"","i":"B","r":"平成21年","q":"会計情報の基本的な特性である意思決定有用性は，意思決定との関連性と信頼性の2つの下位の特性により支えられているが，意思決定有用性を高めるためには，この2つの下位特性を同時に高める必要はない。","a":true,"c":"","e":""},{"l":8,"m":"","sb":"","i":"C","r":"平成21年","q":"資産を「将来経済便益」，つまり「将来においてキャッシュ・フローを生み出す潜在力」と定義したとき，資産の測定において特定の測定属性に結びつくわけではないとする見解もあるが，将来キャッシュ・フローの割引現在価値と最も整合的であるとする見解もある。","a":true,"c":"","e":""},{"l":9,"m":"","sb":"","i":"B","r":"平成21年","q":"債務保証に関連して債務保証損失引当金を計上しているときに，第一次債務者が当該債務を返済した場合，金融負債の契約上の義務が消滅したと表示する。","a":true,"c":"","e":""},{"l":10,"m":"","sb":"","i":"B","r":"平成21年","q":"退職給付費用から控除される年金資産に係る期待運用収益相当額の計算にあたって，期首の年金資産の額に乗ずべき期待運用収益率は合理的に予測される収益率であり，利息費用の計算に適用される割引率を下回ることも認められる。","a":true,"c":"","e":""},{"l":11,"m":"","sb":"","i":"B","r":"平成21年","q":"減損会計において，資産の時価を算定するためには将来キャッシュ・フローが用いられなければならないが，その見積りは企業に固有の事情を反映した合理的で説明可能な仮定及び予測に基づかなければならない。","a":false,"c":"","e":""},{"l":12,"m":"","sb":"","i":"B","r":"平成21年","q":"将来の使用が見込まれていない遊休資産は，キャッシュ・フローを生まないので，資産のグルーピングに際しては，独立した資産又は資産グループとして取り扱うことはできない。","a":false,"c":"","e":""},{"l":13,"m":"","sb":"","i":"C","r":"平成22年第I回","q":"子会社であっても，支配が一時的であると認められる場合は，連結や持分法の適用範囲に含めてはならない。これは財務諸表の比較可能性を保つためである。なお支配が一時的とは，3ヶ月以内(翌四半期)に株式の処分が予定されている場合を指す。","a":false,"c":"","e":""},{"l":14,"m":"","sb":"","i":"B","r":"平成22年第I回","q":"わが国とは著しく異なる会計基準が適用されている海外子会社は，財務諸表の読者に誤解を与えないように，連結の範囲から除かなければならない。ただし，国際会計基準審議会の基準を適用している海外子会社を連結の範囲から除いてはならない。","a":false,"c":"","e":""},{"l":15,"m":"","sb":"","i":"C","r":"平成22年第II回","q":"法人税を利益（剰余金）の処分と考えるかぎり，税引前利益と合理的に対応させる必要はないが，法人税を費用としてとらえれば，費用収益対応の考え方に基づき，当期に係る納付すべき法人税に税引前利益を合理的に対応させなければならない。","a":false,"c":"","e":"当期に係る納付すべき法人税を税引前利益に合理的に対応させなければならない"},{"l":16,"m":"","sb":"","i":"C","r":"平成22年第II回","q":"ストック・オプションに関する会計処理と整合的なあるいは共通する会計処理が必要とされる事例として，株式公開準備中の企業がコンサルタントからサービスを得る対価として自社株式オプションを付与する場合や機械装置の取得の対価として取引先に自社株式を交付する場合などがあげられる。","a":true,"c":"","e":""},{"l":17,"m":"","sb":"","i":"B","r":"平成22年第II回","q":"ストック・オプションの公正な評価額とは，一般に，市場において形成されている取引価格，気配値又は指標その他の相場にもとづく価額をいうから，原資産である自社の株式の市場価格（株価）であると考えられる。","a":false,"c":"","e":"ストック・オプションに関しては，通常，市場価格が観察できないため，株式オプションの合理的な価格算定のために広く受け入れられている，株式オプション価格算定モデル等の算定技法を利用して公正な評価単価を見積る。したがって，原資産である自社の株式の市場価格（株価）がストック・オプションの公正な評価額になるわけではない"},{"l":18,"m":"","sb":"","i":"B","r":"平成23年第I回","q":"資本維持概念として名目貨幣資本維持をとった場合，減価償却費は再調達原価を基礎として計上される。","a":false,"c":"","e":"資本維持概念として名目貨幣資本維持をとった場合，減価償却費は取得原価を基礎として計上される"},{"l":19,"m":"","sb":"","i":"B","r":"平成23年第I回","q":"その他有価証券の評価差額の処理に際して部分純資産直入法を用いるかぎり，期間損益に与える影響は，低価法（洗替え法）を採用した場合と同一である。","a":true,"c":"","e":""},{"l":20,"m":"","sb":"","i":"B","r":"平成23年第I回","q":"実際運用収益が期待運用収益を超過したことにより生ずる数理計算上の差異の発生，又は給付水準を引き下げたことによる過去勤務債務の減少により，年金資産が企業年金制度に係る退職給付債務を超えることとなった場合，当該数理計算上の差異又は過去勤務費用の減少額は，企業の採用する処理年数及び処理方法に従い，費用の減額として処理する。","a":true,"c":"","e":""},{"l":21,"m":"","sb":"","i":"A","r":"平成23年第I回","q":"外貨表示財務諸表の換算に際し，在外子会社の自律性を重視するという現地主義の考え方は，支配従属関係にある複数企業を単一の組織体とみなすという連結会計の前提とは相容れないため，現行の会計基準では採用されていない。","a":false,"c":"","e":""},{"l":22,"m":"","sb":"","i":"C","r":"平成23年第II回","q":"日本において企業会計基準等を作成している企業会計基準委員会（ASBJ）は，プライベート・セクターであるため，その作成する企業会計基準は，パブリック・セクターである企業会計審議会の承認を受けて初めて発効する。","a":false,"c":"","e":""},{"l":23,"m":"","sb":"","i":"A","r":"平成23年第II回","q":"国際財務報告基準（IFRS）は，国際的な基準ではあるが，日本国内で上場している株式会社は，国内の基準に従えばよく，国際財務報告基準に従う法的義務はない。","a":true,"c":"","e":""},{"l":24,"m":"","sb":"","i":"B","r":"平成23年第II回","q":"ストック・オプションの付与によって認識される新株予約権について権利不行使による失効が生じた場合には，新株予約権として計上した額のうち，当該失効に対応する部分は債務免除益として計上する。","a":false,"c":"","e":"失効に対応する部分を新株予約権戻入益等の科目名称を用いて計上する。なお，新株予約権は負債ではないため，債務免除益は不適切である"},{"l":25,"m":"","sb":"","i":"C","r":"平成23年第II回","q":"複数の資産が一体となって独立したキャッシュ・フローを生み出す場合には，合理的な範囲で資産のグルーピングを行う必要があり，減損損失の認識の判定及び測定において，資産のグルーピングは重要事項である。したがって，資産のグルーピングの方法は，毎期，損益計算書に関わる注記事項としなければならない。","a":false,"c":"","e":"重要な減損損失を認識した場合，当該資産グループの概要と資産をグルーピングした方法を注記する"},{"l":26,"m":"","sb":"","i":"B","r":"平成23年第II回","q":"連結貸借対照表上，当期に発生した「負ののれん」は計上されない。","a":true,"c":"","e":""},{"l":27,"m":"","sb":"","i":"B","r":"平成24年第I回","q":"貨幣的測定の公準によると，会計上の取引は貨幣額で表示される。たとえば，人の能力を客観的に貨幣額へ変換することができないため，企業における人的資源は貸借対照表上，原則として資産としては計上されない。","a":true,"c":"","e":""},{"l":28,"m":"","sb":"","i":"C","r":"平成24年第I回","q":"未払費用は，一定の契約に従い，継続して役務の提供を受ける場合，すでに提供された役務に対していまだその対価の支払が終わらないものをいう。したがって契約の目的である継続的役務の提供が貸借対照表日までに完了している場合にも，その対価の未払額によって表示しなければならない。","a":false,"c":"","e":"契約の目的である継続的役務の提供が貸借対照表日までに完了している場合，その対価の未払額を未払金勘定によって表示しなければならない"},{"l":29,"m":"","sb":"","i":"B","r":"平成24年第I回","q":"その他有価証券評価差額金と，土地再評価差額金はいずれも評価対象となる資産を売却する際に取り崩され，利益として処理される。","a":false,"c":"","e":"その他有価証券評価差額金を売却する際，その他有価証券評価差額金相当額は期間利益として処理されるが，土地再評価差額金の取崩額は利益剰余金に直接加算される"},{"l":30,"m":"","sb":"","i":"A","r":"平成24年第II回","q":"インフレーションを前提とした場合，名目資本維持を求める利益計算の結果と実質資本維持を求める利益計算の結果とを比較したとき，前者における売上総利益は後者における売上総利益よりも必ず小さくなる。","a":false,"c":"","e":"前者における売上総利益は後者における売上総利益よりも大きくなる"},{"l":31,"m":"","sb":"","i":"A","r":"平成24年第II回","q":"わが国の討議資料『財務会計の概念フレームワーク』は，資産負債アプローチを重視しているため，当期純利益概念を排除して包括利益概念を採用している。","a":false,"c":"","e":"わが国の討議資料『財務会計の概念フレームワーク』は，当期純利益概念を重視している"},{"l":32,"m":"","sb":"","i":"C","r":"平成24年第II回","q":"単一性の原則は，目的に応じ形式は多元的であっても，実質は一元的な財務諸表の作成を要請するものであるが，税効果会計を適用した財務諸表と，租税目的の財務諸表との間には，乖離が生じていることが普通であり，単一性の原則は機能していない。","a":false,"c":"","e":"単一性の原則は実質一元形式多元を要請するものであり，複数の目的に応じた異なる財務諸表の形式を否定するものではなく，二重帳簿の作成を排除するものである。したがって，本問のような場合であっても，単一性の原則は機能している"},{"l":33,"m":"","sb":"","i":"C","r":"平成25年第I回","q":"財務諸表における認識とは，収益・費用を把握し，特定の期間に記録することと定義されている。","a":false,"c":"","e":"財務諸表における認識とは，構成要素を財務諸表の本体に計上することと定義されている"},{"l":34,"m":"","sb":"","i":"B","r":"平成25年第I回","q":"有形固定資産の建設代金を建設会社に支払うために資金を借入れた場合の支払利息は，一般に稼働前の期間に属するものに限り当該有形固定資産の取得原価に算入できる。","a":false,"c":"","e":"有形固定資産の建設代金を建設会社に支払うために資金を借入れた場合，購入に係る借入である ため支払利息は，当該有形固定資産の取得原価に算入できない"},{"l":35,"m":"","sb":"","i":"B","r":"平成25年第I回","q":"有形固定資産に係る税法上の特別償却の会計処理について，①通常の減価償却と同様の方式，②引当金の形で特別償却準備金に繰り入れる方式，及び③剰余金の処分として特別償却準備金を積み立てる方式のうち，適正な期間損益計算のための会計処理方法は③の方式である。","a":false,"c":"","e":"特別償却は課税の繰延という税務上の恩恵を受けるための制度であるため，損益に影響させない③の方式（積立金方式）が適正な期間損益計算の観点からは望ましい"},{"l":36,"m":"","sb":"","i":"B","r":"平成25年第I回","q":"分離して譲渡可能な研究開発の途中段階の成果を単独で取得した場合，「研究開発費等に係る会計基準」にしたがい，資産として計上し，合理的な方法により償却する。","a":false,"c":"","e":"分離して譲渡可能な研究開発の途中段階の成果を単独で取得した場合，「研究開発費等に係る会計基準」にしたがい，取得時に費用として計上する"},{"l":37,"m":"","sb":"","i":"B","r":"平成25年第I回","q":"分離して譲渡可能な研究開発の途中段階の成果を含む事業を取得した場合，その成果の時価に基づいて資産として計上し，合理的な方法により償却する。","a":false,"c":"","e":"分離して譲渡可能な研究開発の途中段階の成果を含む事業を取得した場合，「企業結合に関する会計基準」にしたがい，資産として計上する"},{"l":38,"m":"","sb":"","i":"B","r":"平成25年第II回","q":"のれんは，営業の譲受や合併・買収により有償取得した場合に限り無形固定資産に計上されるが，特許権，商標権，実用新案権等の法律上の権利は，贈与等により無償取得した場合にも無形固定資産として計上される。","a":true,"c":"","e":""},{"l":39,"m":"","sb":"","i":"B","r":"平成25年第II回","q":"負債の大半は法的債務の性格をもつ確定債務と条件付債務によって占められるが，法的債務の性格をもたない項目も負債として貸借対照表に計上することがある。","a":true,"c":"","e":""},{"l":40,"m":"","sb":"","i":"C","r":"平成25年第II回","q":"ストック・オプションの公正な評価単価を求めるために必要な株価変動性は将来の株価変動性の算定日現在における予測値であるため，その見積りにあたっては，自社もしくは類似の株式オプションの市場価格から株価変動性を逆算する方法が基礎となる。","a":false,"c":"","e":"株価変動性の算定にあたり，当該企業の株式オプションが市場で取引されている場合において，その市場価格から逆算される株価変動性の算定値に十分な信頼性があると認められるときに限り，これを利用することができる。よって，当該方法が基礎となっているわけではない"},{"l":41,"m":"","sb":"","i":"C","r":"平成25年第II回","q":"減損損失を測定する際に算定される使用価値は，今後生ずると見込まれる将来キャッシュ・フローを，現在時点の割引率を用いて割り引いた現在価値とすることが適当である。このため，借入資本の比率が極めて高い企業や，大型プロジェクトであって，そのほとんどを借入金で賄っているような場合，追加借入利子率を用いて現在価値を算定する。","a":false,"c":"","e":"借入資本の比率が高い場合には通常，自己資本コストが高く，追加借入利子率のみを割引率とした場合には，当該企業における当該資産に固有のリスクを反映した収益率より著しく低くなることは明らかであるため，原則として，追加借入利子率を用いることはできない"},{"l":42,"m":"","sb":"","i":"B","r":"平成26年第I回","q":"親会社が子会社を吸収合併する場合，当該子会社に係る子会社株式の適正な帳簿価額とこれに対応する増加資本との差額は，親会社の個別損益計算書に計上する。","a":false,"c":"","e":"なお，親会社の個別損益計算書に計上するのは抱合せ株式消滅差損益である"},{"l":43,"m":"","sb":"","i":"B","r":"","q":"借手が負担するリース料の中には，維持管理費用相当額，役務提供相当額，残価保証額が含まれている場合がある。解約不能なリース期間中のリース料総額の割引現在価値を算定するにあたっては，原則としてこれらの金額を控除して，リース資産およびリース債務の計上価額を決定する基礎とする。","a":false,"c":"","e":"残価保証額は控除しない"},{"l":44,"m":"","sb":"","i":"B","r":"平成26年第I回","q":"連結財務諸表の作成義務がある親会社であっても，当該親会社が他の企業の子会社であり，連結財務諸表を作成しないことに少数株主が同意している場合には，当該親会社は連結財務諸表を作成しないことが認められる。","a":false,"c":"","e":"このような規制は存在しない"},{"l":45,"m":"","sb":"","i":"B","r":"平成26年第II回","q":"企業会計制度において採用されてきた取得原価主義によると，物価上昇には減価償却資産の再取得に必要な資金が十分に回収留保されているかどうかについての情報が不足する場合がある。","a":true,"c":"","e":""},{"l":46,"m":"","sb":"","i":"A","r":"平成26年第II回","q":"討議資料『財務会計の概念フレームワーク』における資産とは，過去の取引または事象の結果として，報告主体が所有している経済的資源をいう。オペレーティング・リース取引においては，リース物件が当該定義をみたさないので，借手は通常の賃貸借取引に係る方法に準じて処理する。","a":false,"c":"","e":"「報告主体が所有している経済的資源」ではなく，「報告主体が支配している経済的資源」である。ここでいう「支配」とは，所有権の有無を問わない概念である"},{"l":47,"m":"","sb":"","i":"B","r":"","q":"予約販売については，予約金受取額のうち，決算日までに商品の引き渡しまたは役務の給付が完了した分だけを当期の売上高に計上し，残額は貸借対照表の負債の部に記載して次期以降に繰り延べなければならない。予約販売が通常の販売と異なる点は，販売代金が商品引渡し前に受け取られていることであり，その意味では予約金は繰延収益の性質をもっている。","a":false,"c":"","e":"予約金は商品の引渡義務を表しており負債性がある以上，もっぱら期間損益計算書の観点から計上される繰延収益の性質をもっていない"},{"l":48,"m":"","sb":"","i":"A","r":"","q":"企業は，過年度に認識した減損損失が，①もはや存在していないか，あるいは②減少しているという兆候があるか否かについて，各会計期末において検討しなければならない。そして，このような兆候が存在する場合には，企業は当該資産の回収可能額の見積りを行う。","a":false,"c":"","e":"減損損失の戻入れは認められていない"},{"l":49,"m":"","sb":"","i":"B","r":"","q":"企業会計原則注解【注18】では，偶発資産の会計上の認識は将来の経済的便益を有する資源の流入する確率に依拠して行われる。経済的便益の流入する可能性がほぼ確実であるならば，資産は認識される。","a":false,"c":"","e":"企業会計原則注解【注18】では，偶発資産の会計上の認識について規定を設けていない"},{"l":50,"m":"","sb":"","i":"B","r":"平成27年第I回","q":"連結財務諸表において，原則として，個別財務諸表における資産のグルーピングが用いられる。ただし，連結財務諸表において，独立したキャッシュ・フローを生み出す最小の単位が，各連結会社の個別財務諸表における資産のグルーピングと異なる場合には，連結財務諸表において資産のグルーピングの単位が見直されることとなるが，当該見直しは連結上，連結会社及び持分法が適用されている非連結子会社が対象であり，関連会社は含まれない。","a":true,"c":"","e":""},{"l":51,"m":"","sb":"","i":"C","r":"平成27年第I回","q":"店舗や工場などの資産と対応して継続的に収支の把握がされている単位を識別し，グルーピングの単位を決定する基準とするが，この収支は，必ずしも企業の外部との間で直接的にキャッシュ・フローが生じている必要はなく，例えば，内部振替価額や共通費の配分額であっても，合理的なものであれば含まれる。","a":true,"c":"","e":""},{"l":52,"m":"","sb":"","i":"B","r":"平成28年第I回","q":"連結損益及び包括利益計算書又は連結損益計算書における純損益計算の区分では，非支配株主損益調整前当期純利益に非支配株主損益を加減して，当期純利益を表示する。したがって，当期純利益は，連結貸借対照表における株主資本と対応(連繋)している。","a":false,"c":"","e":"株主資本と対応(連繋)しているのは親会社株主に帰属する当期純利益である"},{"l":53,"m":"","sb":"","i":"A","r":"平成28年第II回","q":"連結の基礎概念には，親会社説と経済的単一体説がある。前者は親会社の出資者を会計主体とみる考え方に基づいており，後者は出資者から独立した企業集団そのものを会計主体とみる考え方に基づいている。","a":false,"c":"","e":"経済的単一体説は親会社の出資者及び子会社の非支配株主を会計主体とみる考え方に基づいている"},{"l":54,"m":"","sb":"","i":"A","r":"平成28年第II回","q":"過去勤務費用の発生要因である給付水準の引き上げが，従業員の勤労意欲を将来にわたって向上させるとの期待のもとに行われる面があることは，過去勤務費用の遅延認識の根拠とされるが，遅延認識は給付水準の引き下げの場合にも認められる。","a":true,"c":"","e":""},{"l":55,"m":"","sb":"","i":"C","r":"平成28年第II回","q":"連結財務諸表の作成にあたっては，支配獲得日において，取得した支配下に係る子会社の資産及び負債を時価により評価する。ここで，当該子会社において，支配獲得日に固定資産の減損損失を計上している場合には，当該固定資産については減損損失計上後の帳簿価額と時価とすることができる。","a":false,"c":"","e":"子会社において，支配獲得日に固定資産の減損損失を計上している場合，当該損失計上後の帳簿価額は時価とはいえないため，それを用いることはできない"},{"l":56,"m":"","sb":"","i":"B","r":"平成28年第II回","q":"外貨建金銭債権債務等の換算に用いる決算時の直物為替相場については，決算日の直前為替相場のほか，継続適用を条件として，決算日の前後一定期間（おおむね1か月以内）の直物為替相場に基づいて算出された平均相場を用いることができる。","a":false,"c":"","e":"決算時の為替相場としての平均相場の適用は，無条件に認められているのではなく，決算日前後の為替相場の変動状況から判断して，決算日の直物為替相場が異常と認められる場合にのみ，その適用が認められる"},{"l":57,"m":"","sb":"","i":"C","r":"平成29年第I回","q":"国や地方自治体からの補助金のうち，固定資産の購入や製作に充当するなど，資本助成の目的で交付された国庫補助金について，かつて「企業会計原則」では，国庫補助金についてはこれを「その他の資本剰余金」として整理すべきとする見解が示されていた。この見解は，資本主理論では説明できない。","a":true,"c":"","e":""},{"l":58,"m":"","sb":"","i":"C","r":"平成30年第I回","q":"子会社や関連会社以外の投資先を被結合企業とする企業結合により，被結合企業の株式が保有する被結合企業の株式(その他有価証券)が結合企業の株式のみと引き換えられ，結合後企業の株主が子会社や関連会社に該当しない場合には，被結合企業の株主の個別財務諸表上，交換損益を認識しない。","a":true,"c":"","e":""},{"l":59,"m":"","sb":"","i":"B","r":"平成30年第II回","q":"金融資産の譲渡の際，譲渡人に買戻義務はなく，買戻権のみがある場合，譲受人は当該金融資産を自由に処分することができないので，支配は移転していないものとされる。ただし，買戻価格が固定価格で確定している場合には，譲受人は当該固定価格と同一の現金を獲得できることが明白であるので，支配は移転しているものとされる。","a":false,"c":"","e":"本肢における買戻権は支配の移転が認められない買戻権である。なぜなら買戻価格が固定価格で確定しており，譲受人は第三者に対して売却する場合と同一の現金を獲得できないためである"},{"l":60,"m":"","sb":"","i":"B","r":"平成31年第I回","q":"2計算書方式を採用して連結損益計算書を作成する場合，当期純利益は，純損益計算の区分において，非支配株主損益調整前当期純利益に非支配株主損益を加減して表示することとされている。","a":false,"c":"","e":"当期純利益は，純損益計算の区分において，税金等調整前当期純利益に法人税等を加減して当期純利益を表示する"},{"l":61,"m":"","sb":"","i":"B","r":"平成31年第I回","q":"組替調整額は，過年度においてその他の包括利益に含まれていた項目で当期純利益を構成していたものをいい，当期にその他の包括利益に含めた項目が組替調整額として当期純利益を構成することはない。","a":false,"c":"","e":"当期のその他の包括利益に含めた項目は組替調整額として当期純利益を構成する"}]}]</script>
<script>
const CHAPTERS = JSON.parse(document.getElementById('quiz-data').textContent);

let ALL_Q=[], BY_CHAPTER={}, MAJORS_BY_CHAPTER={};
let customQs=[]; // user-added questions, persisted separately

function rebuildIndexes(){
  ALL_Q=[];
  CHAPTERS.forEach((ch,ci)=>{
    ch.qs.forEach((q,qi)=>{
      ALL_Q.push({
        id: ci+'_'+qi, chNum: ch.n, chName: ch.name,
        major: q.m||'', sub: q.sb||'', importance: q.i||'',
        label: q.l, refs: q.r||'', statement: q.q, answer: q.a,
        citation: q.c||'', explanation: q.e||'', custom:false
      });
    });
  });
  customQs.forEach(q=>{
    const ch = CHAPTERS.find(c=>c.n===q.chNum);
    ALL_Q.push({
      id: q.id, chNum: q.chNum, chName: ch?ch.name:'追加した問題',
      major: q.major||'', sub:'', importance: q.importance||'',
      label:'', refs:'', statement:q.statement, answer:q.answer,
      citation:q.citation||'', explanation:q.explanation||'', custom:true
    });
  });
  BY_CHAPTER={};
  CHAPTERS.forEach(ch=>{ BY_CHAPTER[ch.n]=ALL_Q.filter(q=>q.chNum===ch.n); });
  MAJORS_BY_CHAPTER={};
  CHAPTERS.forEach(ch=>{
    const order=[],counts={};
    BY_CHAPTER[ch.n].forEach(q=>{ const k=q.major||''; if(!(k in counts)){counts[k]=0;order.push(k);} counts[k]++; });
    MAJORS_BY_CHAPTER[ch.n]=order.map(name=>({name,count:counts[name]}));
  });
}
function majorKey(chNum,major){ return chNum+'::'+major; }

/* ---------- persisted state ---------- */
let status={};   // id -> 0|1|2  (0=未,1=あいまい,2=覚えた)
let notes={};    // id -> memo text
let noteSaveTimer=null;
let localUpdatedAt=0;

const SUBJECT_KEY='zaimu';
const LS_STATUS_KEY='zaimu_status_v1';
const LS_NOTES_KEY='zaimu_notes_v1';
const LS_CUSTOM_KEY='zaimu_custom_v1';
const LS_UPDATED_KEY='zaimu_updated_v1';
const SYNC_URL_KEY='qsync_dburl_v1';
const SYNC_CODE_KEY='qsync_code_v1';

function storageAvailable(){
  try{
    const k='__t__'; localStorage.setItem(k,'1'); localStorage.removeItem(k);
    return true;
  }catch(e){ return false; }
}
const HAS_LS = storageAvailable();

async function loadStorage(){
  if(HAS_LS){
    try{
      const s=localStorage.getItem(LS_STATUS_KEY);
      if(s) status=JSON.parse(s);
    }catch(e){ status={}; }
    try{
      const n=localStorage.getItem(LS_NOTES_KEY);
      if(n) notes=JSON.parse(n);
    }catch(e){ notes={}; }
    try{
      const c=localStorage.getItem(LS_CUSTOM_KEY);
      if(c) customQs=JSON.parse(c);
    }catch(e){ customQs=[]; }
    try{
      const u=localStorage.getItem(LS_UPDATED_KEY);
      localUpdatedAt = u? (parseInt(u,10)||0) : 0;
    }catch(e){ localUpdatedAt=0; }
  }
  rebuildIndexes();
}
async function saveStatus(){
  if(!HAS_LS) return;
  try{ localStorage.setItem(LS_STATUS_KEY,JSON.stringify(status)); }catch(e){}
  touchUpdated();
}
function saveCustomQs(){
  if(!HAS_LS) return;
  try{ localStorage.setItem(LS_CUSTOM_KEY,JSON.stringify(customQs)); }catch(e){}
  touchUpdated();
}
function scheduleSaveNote(id,text){
  notes[id]=text;
  if(noteSaveTimer) clearTimeout(noteSaveTimer);
  noteSaveTimer=setTimeout(()=>{
    if(HAS_LS){ try{ localStorage.setItem(LS_NOTES_KEY,JSON.stringify(notes)); }catch(e){} }
    touchUpdated();
    document.querySelectorAll('[data-memo-saved="'+id+'"]').forEach(el=>{
      el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),1200);
    });
  },500);
}

/* ---------- CLOUD SYNC (optional, Firebase Realtime Database via REST) ---------- */
function touchUpdated(){
  localUpdatedAt = Date.now();
  if(HAS_LS){ try{ localStorage.setItem(LS_UPDATED_KEY, String(localUpdatedAt)); }catch(e){} }
  scheduleCloudPush();
}
function getSyncConfig(){
  if(!HAS_LS) return null;
  const url=(localStorage.getItem(SYNC_URL_KEY)||'').trim();
  const code=(localStorage.getItem(SYNC_CODE_KEY)||'').trim();
  if(!url||!code) return null;
  return {url,code};
}
function cloudPath(cfg){
  return cfg.url.replace(/\/+$/,'') + '/quizSync/' + encodeURIComponent(cfg.code) + '/' + SUBJECT_KEY + '.json';
}
let cloudPushTimer=null;
function scheduleCloudPush(){
  const cfg=getSyncConfig(); if(!cfg) return;
  if(cloudPushTimer) clearTimeout(cloudPushTimer);
  cloudPushTimer=setTimeout(()=>{ pushToCloud(cfg); },1500);
}
async function pushToCloud(cfg){
  cfg = cfg||getSyncConfig(); if(!cfg) return false;
  try{
    await fetch(cloudPath(cfg), {
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({status,notes,customQs,updatedAt:localUpdatedAt})
    });
    return true;
  }catch(e){ return false; }
}
async function pullFromCloud(showToast){
  const cfg=getSyncConfig(); if(!cfg) return false;
  try{
    const res=await fetch(cloudPath(cfg));
    if(!res.ok) return false;
    const data=await res.json();
    if(!data || !data.updatedAt || data.updatedAt<=localUpdatedAt) return false;
    status=data.status||{};
    notes=data.notes||{};
    customQs=data.customQs||[];
    localUpdatedAt=data.updatedAt||0;
    if(HAS_LS){
      try{
        localStorage.setItem(LS_STATUS_KEY,JSON.stringify(status));
        localStorage.setItem(LS_NOTES_KEY,JSON.stringify(notes));
        localStorage.setItem(LS_CUSTOM_KEY,JSON.stringify(customQs));
        localStorage.setItem(LS_UPDATED_KEY,String(localUpdatedAt));
      }catch(e){}
    }
    rebuildIndexes();
    meter();
    if(S.view!=='quiz') render();
    if(showToast) toast('他の端末の学習記録を読み込みました');
    return true;
  }catch(e){ return false; }
}
function randomSyncCode(){
  const chars='abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  let s=''; for(let i=0;i<20;i++) s+=chars[Math.floor(Math.random()*chars.length)];
  return s;
}
function syncSettingsHTML(){
  if(!HAS_LS) return '<div class="mini">このブラウザでは同期機能を使えません。</div>';
  const url=(localStorage.getItem(SYNC_URL_KEY)||'').trim();
  const code=(localStorage.getItem(SYNC_CODE_KEY)||'').trim();
  if(!url){
    return `<div class="flabel">データベースURL（Firebaseコンソールで確認）</div>
      <input id="cloudUrlInput" placeholder="https://xxxx-default-rtdb.firebaseio.com">
      <div class="act"><button id="cloudUrlSave" class="btn-main">保存</button></div>`;
  }
  if(!code){
    return `<div class="mini">データベースURL：<code style="font-size:11px">${esc(url)}</code> <button id="cloudUrlEdit" style="font-size:11px;text-decoration:underline;color:var(--blue)">変更</button></div>
      <div class="act" style="margin-top:10px"><button id="cloudGenBtn" class="btn-main">この端末を1台目にして同期コードを発行</button></div>
      <div class="flabel" style="margin-top:16px">他の端末で発行したコードをお持ちの場合</div>
      <input id="cloudCodeInput" placeholder="同期コードを貼り付け">
      <div class="act"><button id="cloudJoinBtn">このコードで同期を開始</button></div>`;
  }
  const lastSync = localUpdatedAt? new Date(localUpdatedAt).toLocaleString('ja-JP') : '未同期';
  return `<div class="mini">データベースURL：<code style="font-size:11px">${esc(url)}</code></div>
    <div class="flabel">同期コード（他の端末にも入力してください）</div>

function setStatus(id,val){ status[id]=val; saveStatus(); }
function cycleStatus(id){
  const cur=status[id]||0;
  const next=(cur+1)%3;
  setStatus(id,next);
  return next;
}

/* ---------- app state ---------- */
const S={
  view:'list',
  search:'',
  statusFilter:'all',
  selectedChapters:new Set(CHAPTERS.map(c=>c.n)),
  selectedImportance:new Set(['A','B','C']),
  excludedMajors:new Set(),
  expandedChapters:new Set(),
  sheet:false,
  shuffle:true,
  quizCount:'all',
  quiz:null
};
try{ const t=localStorage; }catch(e){}

const $=s=>document.querySelector(s);
const app=$('#app');
function esc(s){ if(!s) return ''; return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1500); }
function shuffled(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; }

function counts(list){ const c=[0,0,0]; list.forEach(q=>c[status[q.id]||0]++); return c; }
function markClass(s){ return s===2?'ok':(s===1?'warn':''); }
function meter(){
  const c=counts(ALL_Q), t=ALL_Q.length||1;
  $('#meter').innerHTML=`<i class="m3" style="width:${c[2]/t*100}%"></i><i class="m2" style="width:${c[1]/t*100}%"></i>`;
}

function listFiltered(){
  const q=S.search.trim().toLowerCase();
  return ALL_Q.filter(w=>{
    if(!S.selectedChapters.has(w.chNum)) return false;
    if(w.importance && !S.selectedImportance.has(w.importance)) return false;
    if(S.excludedMajors.has(majorKey(w.chNum,w.major))) return false;
    const st=status[w.id]||0;
    if(S.statusFilter!=='all' && String(st)!==S.statusFilter) return false;
    if(q && !((w.statement||'').toLowerCase().includes(q) || (w.explanation||'').toLowerCase().includes(q) || (w.citation||'').toLowerCase().includes(q))) return false;
    return true;
  });
}

function listBodyHTML(){

  let out='', cur='';
  list.forEach(w=>{
    const key=w.chNum+'|'+w.major;
    if(key!==cur){
      if(cur) out+='</ol>';
      cur=key;
      const n=list.filter(x=>(x.chNum+'|'+x.major)===key).length;

      const mt=e.target.closest('[data-memo-toggle]');

function openAddForm(id){
  editingId = id || null;
  const edit = id ? customQs.find(q=>q.id===id) : null;
  addAnswerVal = edit ? edit.answer : null;
  const ov=$('#addOverlay');
  ov.innerHTML = addFormHTML(edit);
  ov.style.display='flex';
  document.querySelectorAll('#addOverlay .oxbtn').forEach(b=>{
    if((b.dataset.v==='true')===addAnswerVal) b.classList.add('sel');
    b.onclick=()=>{
      addAnswerVal = b.dataset.v==='true';
      document.querySelectorAll('#addOverlay .oxbtn').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel');
    };
  });
  $('#addClose').onclick=closeAddForm;
  $('#fSave').onclick=saveAddForm;
  const del=$('#fDelete');
  if(del) del.onclick=()=>{
    if(confirm('この問題を削除しますか？')){
      customQs=customQs.filter(q=>q.id!==editingId);

function closeAddForm(){

  ov.style.display='none'; ov.innerHTML='';

function saveAddForm(){
  const chNum=parseInt($('#fChapter').value);
  const major=$('#fMajor').value.trim();
  const importance=$('#fImportance').value;
  const statement=$('#fStatement').value.trim();
  const citation=$('#fCitation').value.trim();
  const explanation=$('#fExplanation').value.trim();
  if(!statement){ toast('問題文を入力してください'); return; }
  if(addAnswerVal===null){ toast('正誤を選んでください'); return; }
  if(editingId){
    const q=customQs.find(x=>x.id===editingId);
    Object.assign(q,{chNum,major,importance,statement,answer:addAnswerVal,citation,explanation});
  }else{
    customQs.push({id:'custom_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
      chNum,major,importance,statement,answer:addAnswerVal,citation,explanation});
  }
  saveCustomQs();
  rebuildIndexes();
  closeAddForm();
  render();
  toast(editingId?'更新しました':'追加しました');

/* ---------- QUIZ VIEW ---------- */
function quizPool(){
  return ALL_Q.filter(w=>
    S.selectedChapters.has(w.chNum) &&
    (!w.importance || S.selectedImportance.has(w.importance)) &&
    !S.excludedMajors.has(majorKey(w.chNum,w.major)) &&
    (S.statusFilter==='all' || String(status[w.id]||0)===S.statusFilter)
  );
}
function startQuiz(){
  const pool=quizPool();
  if(!pool.length) return;
  let qs = S.shuffle? shuffled(pool): pool.slice();
  if(S.quizCount!=='all'){
    const n=parseInt(S.quizCount);
    if(n>0 && n<qs.length) qs=qs.slice(0,n);
  }
  qs = qs.map(q=>({...q, _userAns:null}));
  S.quiz={ qs, i:0 };
  render();
}
function viewQuiz(){
  if(!S.quiz){
    const pool=quizPool();
    const countOpts=[10,20,30,50,100].filter(n=>n<pool.length);
    app.innerHTML=controls()+`<div class="stat-card">
      <div class="mini">現在の絞り込みで <b>${pool.length}</b> 問が対象です。</div>
      <div class="row" style="margin-top:10px">
        <select id="quizCount">
          <option value="all">出題数：全問（${pool.length}問）</option>
          ${countOpts.map(n=>`<option value="${n}" ${S.quizCount===String(n)?'selected':''}>出題数：${n}問</option>`).join('')}
        </select>

      </div>
