      </div></div>`;
    bindControls();
    const cs=$('#quizCount'); if(cs){ cs.value=S.quizCount; cs.onchange=e=>{ S.quizCount=e.target.value; render(); }; }
    $('#shf').onclick=()=>{ S.shuffle=!S.shuffle; render(); };
    const go=$('#go'); if(go) go.onclick=startQuiz;
    return;
  }
  const Q=S.quiz;
  if(Q.i>=Q.qs.length){
    const answered=Q.qs.filter(q=>q._userAns!==null);
    const ok=answered.filter(q=>q._userAns===q.answer).length;
    const missed=answered.filter(q=>q._userAns!==q.answer);
    const skipped=Q.qs.length-answered.length;
    const pc=answered.length? Math.round(ok/answered.length*100):0;
    app.innerHTML=`<div class="score">
      <div class="big">${ok} <span style="font-size:22px;color:var(--ink-3)">/ ${answered.length}</span></div>
      <div class="mini" style="margin-top:10px">正答率 ${pc}％${skipped?'　（未回答 '+skipped+'問）':''}</div>
      <div class="act" style="justify-content:center">
        <button id="navBack" style="border:1px solid var(--rule)">‹ 最後の問題に戻る</button>
        <button class="btn-main" id="again" style="border:1px solid var(--ink)">もう一度</button>
        <button id="toList">一覧に戻る</button>
      </div></div>
      ${missed.length? `<div class="sec"><h2>間違えた問題（${missed.length}問）</h2><span></span></div>
      <ol class="list">${missed.map(m=>`<li class="item" style="grid-template-columns:1fr">
        <div><div class="en">${esc(m.statement)}</div>
        <div class="ja">正解：${m.answer?'○（正しい）':'✕（誤り）'}</div>
        <div class="note">${esc((m.citation?m.citation+'　':'')+m.explanation)}</div></div></li>`).join('')}</ol>`:''}`;
    $('#navBack').onclick=()=>{ Q.i=Q.qs.length-1; render(); };
    $('#again').onclick=()=>{ S.quiz=null; startQuiz(); };
    $('#toList').onclick=()=>{ S.quiz=null; setView('list'); };
    return;
  }
  const w=Q.qs[Q.i];
  let bottom='';
  if(w._userAns===null){
    bottom=`<div class="oxbtns">
      <button class="oxbtn maru" id="bm">○</button>
      <button class="oxbtn batsu" id="bx">✕</button>
    </div>`;
  } else {
    const correct = w._userAns===w.answer;
    bottom=`<div class="result-banner ${correct?'ok':'ng'}">
        <div class="rmark">${w.answer?'○':'✕'}</div>
        <div class="rtxt">${correct?'正解！':'不正解'}　正解は「${w.answer?'○（正しい）':'✕（誤り）'}」</div>
      </div>
      <div class="q-result">
        ${w.citation?`<div class="r-cite">${esc(w.citation)}</div>`:''}
        <div class="r-note">${esc(w.explanation)||'（解説なし）'}</div>
      </div>
      <div class="memo-box">
        <label>📝 メモ <span class="memo-saved" data-memo-saved="${w.id}">保存しました</span></label>
        <textarea data-memo-input="${w.id}" placeholder="覚え方やひっかけポイントなど">${esc(notes[w.id]||'')}</textarea>
      </div>
      <div class="grade">
        <button class="g2" data-g="1">✕<b>ダメ</b></button>
        <button class="g3" data-g="2">○<b>覚えた</b></button>
      </div>`;
  }
  app.innerHTML=`
    <div class="q-head"><span>第${w.chNum}章 ${w.chName}${w.major?'／'+w.major:''}</span><span>${Q.i+1} / ${Q.qs.length}</span></div>
    <div class="q-stem">${leaseBadgeHTML(w)}<div class="qt">${esc(w.statement)}</div>${w.refs?`<div class="refs">${esc(w.refs)}</div>`:''}</div>
    ${bottom}
    <div class="navrow2">
      <button id="navPrev" ${Q.i===0?'disabled':''}>‹ 前の問題</button>
      <button id="navNext">${Q.i===Q.qs.length-1?'結果を見る ›':'次の問題 ›'}</button>
    </div>
  `;
  if(w._userAns===null){
    $('#bm').onclick=()=>submitAnswer(true);
    $('#bx').onclick=()=>submitAnswer(false);
  } else {
    const mi=$('[data-memo-input]'); if(mi) mi.oninput=e=>scheduleSaveNote(w.id,e.target.value);
    document.querySelectorAll('.grade button').forEach(b=>b.onclick=()=>{
      setStatus(w.id,+b.dataset.g); meter(); nextQuestion();
    });
  }
  $('#navPrev').onclick=()=>{ if(Q.i>0){ Q.i--; render(); } };
  $('#navNext').onclick=()=>{ Q.i++; render(); };
}
function submitAnswer(userAns){
  const Q=S.quiz, w=Q.qs[Q.i];
  w._userAns=userAns;
  render();
}
function nextQuestion(){
  const Q=S.quiz;
  Q.i++;
  render();
}

/* ---------- RECORD VIEW ---------- */
function viewRecord(){
  const c=counts(ALL_Q), t=ALL_Q.length;
  const rows=CHAPTERS.map(ch=>{
    const list=BY_CHAPTER[ch.n], cc=counts(list), ct=list.length||1;
    return `<div class="stat-row"><div class="nm">第${ch.n}章 ${ch.name}</div>
      <div class="bar">${[2,1].map(k=>`<i style="width:${cc[k]/ct*100}%;background:var(--${k===2?'ok':'warn'})"></i>`).join('')}</div>
      <div class="pc">${Math.round(cc[2]/ct*100)}%</div></div>`;
  }).join('');

  app.innerHTML=`
  ${HAS_LS?'':'<div class="stat-card" style="border-color:var(--red)"><div class="mini" style="color:var(--red)">⚠️ このブラウザでは保存機能が使えないため、学習記録は画面を閉じると消えます（Safariのプライベートブラウズ中など）。通常モードで開き直してください。</div></div>'}
  <div class="stat-card">
    <div class="mini">覚えた <b>${c[2]}</b>／ダメ <b>${c[1]}</b>／未学習 <b>${c[0]}</b>（全 ${t} 問）</div>
    <div style="height:10px"></div>
    ${rows}
    <div class="legend"><span class="lg3">覚えた</span><span class="lg2">ダメ</span><span class="lg0">未学習</span></div>
  </div>
  <div class="stat-card">
    <div class="mini">📶 複数端末で自動的に同期する（Firebase・初回のみ設定）</div>
    <div id="cloudSyncBox" style="margin-top:10px"></div>
  </div>
  <div class="stat-card">
    <div class="mini">学習記録（未／ダメ／覚えた・メモ）は端末ごとに保存されます。上の自動同期を使わない場合は、下のコードを表示してコピーし、別の端末でこの画面に貼り付けて読み込むことでも引き継げます。</div>
    <div class="act">
      <button id="exportBtn">引き継ぎコードを表示</button>
      <button id="importBtn">コードから読み込む</button>
    </div>
    <div id="syncBox" style="display:none;margin-top:10px">
      <textarea id="syncText" rows="5" style="width:100%;font-size:11px;border:1px solid var(--rule);background:var(--panel);color:var(--ink);padding:6px;border-radius:var(--radius)" placeholder="ここに引き継ぎコードを貼り付けてください"></textarea>
      <div class="act">
        <button id="syncCopy">コピー</button>
        <button id="syncLoad">このコードを読み込む</button>
      </div>
    </div>
  </div>
  `;
  renderSyncSettings();
  $('#exportBtn').onclick=()=>{
    const code=JSON.stringify({v:1,status,notes});
    const box=$('#syncBox'), ta=$('#syncText');
    box.style.display='block'; ta.value=code; ta.select();
    toast('下のコードを全選択してコピーしてください');
  };
  $('#importBtn').onclick=()=>{
    const box=$('#syncBox');
    box.style.display='block'; $('#syncText').value=''; $('#syncText').focus();
  };
  $('#syncCopy').onclick=async()=>{
    const ta=$('#syncText'); ta.select();
    try{ await navigator.clipboard.writeText(ta.value); toast('コピーしました'); }
    catch(e){ document.execCommand('copy'); toast('コピーしました'); }
  };
  $('#syncLoad').onclick=()=>{
    try{
      const data=JSON.parse($('#syncText').value.trim());
      if(!data || typeof data!=='object') throw new Error('bad');
      status=data.status||{};
      notes=data.notes||{};
      saveStatus();
      if(HAS_LS){ try{ localStorage.setItem(LS_NOTES_KEY,JSON.stringify(notes)); }catch(e){} }
      rebuildIndexes();
      meter(); render(); toast('読み込みました');
    }catch(e){ toast('このコードは読み込めません'); }
  };
}

/* ---------- ROUTER ---------- */
function render(){
  document.body.classList.toggle('hide', S.sheet && S.view==='list');
  ({list:viewList, quiz:viewQuiz, record:viewRecord})[S.view]();
  meter();
}
function setView(v){
  S.view=v;
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected', b.dataset.view===v));
  window.scrollTo(0,0);
  render();
}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>setView(b.dataset.view));
$('#btnSheet').onclick=()=>{
  S.sheet=!S.sheet; $('#btnSheet').setAttribute('aria-pressed',S.sheet);
  render();
  toast(S.sheet?'赤シートをかけました（一覧の答えが隠れます）':'赤シートを外しました');
};
$('#btnTheme').onclick=()=>{
  const d = document.documentElement.dataset.theme==='dark' ? 'light':'dark';
  document.documentElement.dataset.theme = d;
  try{ localStorage.setItem('theme_v1', d); }catch(e){}
};
$('#btnAdd').onclick=()=>openAddForm(null);

(async()=>{
  app.innerHTML=`<div class="empty">読み込み中...</div>`;
  await loadStorage();
  render();
  pullFromCloud(true);
})();
</script>
</body>
</html>
