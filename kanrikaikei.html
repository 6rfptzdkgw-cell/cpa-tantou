前提とすれば，単位原価が低くなる好況時には低価格，単位原価が高くなる不況時には高価格での販売となり，利益が大きく変動する原因となる。"},{"l":6,"m":"間接費の配賦","sb":"","r":"(Ｒ５Ⅰ③-ア他複数)","q":"一定期間における各部門の間接費予定額又は各部門の固定間接費予定額および変動間接費予定額は，過去に生じた変動費と固定費の実績，将来の物価の変動予想および設備投資等の将来計画や製造条件の変動を考慮して決定する。","a":true,"c":"「基準」33⑷-1～3","e":"一定期間における各部門の間接費予定額又は各部門の固定間接費予定額および変動間接費予定額とは，基準操業度（予定操業度）における間接費の発生予定額，つまりは固定予算に相当する。その算定に当たっては，①間接費を固定費および変動費に分類して，過去におけるそれぞれの原価要素の実績を把握する，②将来における物価の変動予想を考慮して修正を加える，③設備計画の変更等(固定費)や製造条件の変更等(変動費)を考慮してさらに修正を加える，④予定操業度に応ずるように変動費の総額を算定する，という手続を踏むことになる。本肢は，このうち①～③を要約したものといえる。"},{"l":7,"m":"間接費の配賦","sb":"","r":"(Ｈ23Ⅱ①-キ)","q":"一定期間における各部門の固定間接費予定額および変動間接費予定額は，過去におけるそれぞれの原価要素の実績を把握し，それらのうちの固定費を除いた変動費については，将来における物価の変動予想，製造条件の変更等，変動費に影響する条件の変化を考慮してこれを修正する。","a":false,"c":"「基準」33⑷-1～3","e":"間接費予定額の計算に当たって，将来における物価の変動予想を考慮して修正を加えるのは変動費だけではないし，固定費については，さらに，設備計画の変更等を考慮してこれを修正する必要がある。"},{"l":8,"m":"間接費の配賦","sb":"","r":"(Ｈ29Ⅰ③-ア)","q":"部門間接費の予定配賦率の計算において，一定期間における各部門の間接費予定額又は各部門の固定間接費予定額および変動間接費予定額は，次のように算定される。まず，間接費を固定費と変動費に分類して，過去におけるそれぞれの原価要素の実績をは握し，将来における物価の変動予想を考慮して，これに修正を加える。次いで変動費は，設備計画や生産能力の変更等を考慮し，固定費は，製造条件の変更等を考慮して，これを修正する。","a":false,"c":"「基準」33⑷-1～3","e":"変動費と固定費の修正事項が逆である。正しくは「次いで固定費は，設備計画や生産能力の変更等を考慮し，変動費は，製造条件の変更等を考慮して，これを修正する」である。"},{"l":9,"m":"間接費の配賦","sb":"","r":"(Ｈ22Ⅱ③-オ)","q":"個別原価計算において，一定期間における各部門の間接費予定額又は各部門の固定間接費予定額および変動間接費予定額は，次のように計算する。まず，間接費を固定費および変動費に分類して，過去におけるそれぞれの原価要素の実績を把握する。この場合，間接費を固定費と変動費とに分類するためには，間接費要素に関する各費目を調査し，費目によって固定費又は変動費のいずれかに分類する。準固定費又は準変動費は，原則として実際値の変化の調査に基づき，これを固定費又は変動費とみなして，そのいずれかに帰属させる。","a":false,"c":"「基準」８⑷，33⑷-1","e":"個別原価計算において，予定配賦率を算定するための間接費予定額の見積りに当たっては，まず間接費を固定費と変動費とに分類することが求められる。この場合，準固定費又は準変動費は，①固定費又は変動費とみなしてそのいずれかに帰属させるか，②固定費部分及び変動費率を測定して固定費と変動費とに分解するかであり，その取り扱いについては，①と②の選択が認められる。また，上記は"},{"l":10,"m":"間接費の配賦","sb":"","r":"(Ｒ５Ⅱ③-エ)","q":"我が国の「原価計算基準」に照らせば，個別原価計算において間接費を固定費と変動費に分類するとき，準固定費と準変動費は原則として将来計画からそれぞれ固定費部分および変動費率を予測し，これを固定費と変動費とに分解することが求められる。","a":false,"c":"「基準」８⑷，33⑷-1","e":"個別原価計算において，予定配賦率を算定するための間接費予定額の見積りに当たっては，まず間接費を固定費と変動費とに分類することが求められる。この場合，準固定費又は準変動費は，①固定費又は変動費とみなしてそのいずれかに帰属させるか，②固定費部分及び変動費率を測定して固定費と変動費とに分解するかであり，その取り扱いについては，①と②の選択が認められる。また，上記は\n実際値の変化の調査に基づいて行うものであり，Ｒ５Ⅱ③の肢については，これを将来計画から予測するとしている点も誤りである。"},{"l":11,"m":"間接費の配賦","sb":"","r":"(Ｒ５Ⅱ③-イ)","q":"予定配賦率の基礎となる基準操業度は，期待実際操業度，予算操業度，達成可能最大操業度や平均操業度など様々である。例えば，期待実際操業度は，利用可能な全ての時間を使って最高能率で生産を行った場合の生産量に基づくものである。","a":false,"c":"「基準」33⑸","e":"期待実際操業度とは，一年又は一会計期間における生産ならびに販売事情を考慮して定めた操業度であり，次年度の販売予測に期首・期末の手持ないし予定在庫量を加味することで算定した期待実際生産量に基づくものである。"},{"l":12,"m":"間接費の配賦","sb":"","r":"(Ｒ３③-ウ)","q":"予定操業度は，技術的に達成可能な最大操業度ではなく，この期間における生産ならびに販売事情を考慮して定める。","a":true,"c":"「基準」33⑸","e":"「原価計算基準」では，実態に即した予定配賦率を算定するために，基準操業度(予定操業度)として，次年度の販売予測に基づく期待実際操業度（短期予定操業度）を想定している。"},{"l":13,"m":"間接費の配賦","sb":"","r":"(Ｈ22Ⅱ③-エ)","q":"予定配賦率の基礎となる操業度は，原則として，１年又は１会計期間において予期される操業度であり，それは，技術的に達成可能な最大操業度か，もしくはこの期間における生産ならびに販売事情を考慮して定めた操業度である。","a":false,"c":"「基準」33⑸","e":"「原価計算基準」では，予定配賦率の計算の基礎となる予定操業度について，期待実際操業度の採用を原則しており，技術的に達成可能な最大操業度（実際的生産能力）の採用は想定していない。正しくは「それは，技術的に達成可能な最大"},{"l":14,"m":"間接費の配賦","sb":"","r":"(Ｈ23Ⅱ①-カ)","q":"予定配賦率の計算の基礎となる予定操業度は，原則として，１年又は１会計期間において予期される操業度であり，それは，技術的に達成可能な最大操業度を基礎とし，この期間における生産ならびに販売事情を考慮して定めた期待実際操業度である。","a":false,"c":"「基準」33⑸","e":"「原価計算基準」では，予定配賦率の計算の基礎となる予定操業度について，期待実際操業度の採用を原則しており，技術的に達成可能な最大操業度（実際的生産能力）の採用は想定していない。正しくは「それは，技術的に達成可能な最大\n操業度ではなく…」である。"},{"l":15,"m":"間接費の配賦","sb":"","r":"(Ｈ29Ⅰ③-イ)","q":"予定配賦率の計算において基準となる操業度には，技術的に達成可能な理論的生産能力，理論的生産能力から生産に不可避的な作業の中断を差し引いた実際的生産能力，景気や販売事情を加味した上で，次の１年間に予期される期待実際操業度，操業度の変動を長期的に平準化した正常操業度などがある。経済環境の変化が激しい状況では，外部環境に左右されない実際的生産能力を予定配賦率の算定に用いることが望ましい。","a":false,"c":"「基準」33⑸","e":"経済環境の変化が激しい状況において，フル操業(実際的生産能力)や長期平均操業(正常操業度)を仮定すれば，配賦率が実態と乖離して望ましくない。したがって，次年度の販売予測に基づく期待実際操業度を予定配賦率の算定に用いるべきである。なお，Ｈ29Ⅰ③の肢では「原価計算基準」"},{"l":16,"m":"間接費の配賦","sb":"","r":"(Ｈ31Ⅱ③-イ)","q":"予定配賦率は，製造間接費の発生予定額を同じ期間の配賦基準の予定数値で割ることで算定される。予定配賦率の計算において基準となる操業度には，理論的生産能力，実際的生産能力，正常操業度，期待実際操業度などがある。環境変化が激しい状況では，過去数年の操業度を平均化した正常操業度を予定配賦率の算定に用いることが認められる。","a":false,"c":"「基準」33⑸","e":"経済環境の変化が激しい状況において，フル操業(実際的生産能力)や長期平均操業(正常操業度)を仮定すれば，配賦率が実態と乖離して望ましくない。したがって，次年度の販売予測に基づく期待実際操業度を予定配賦率の算定に用いるべきである。なお，Ｈ29Ⅰ③の肢では「原価計算基準」\nでいう「技術的に達成可能な最大操業度」を理論的生産能力と解釈している節があるが，作業休止は技術的に不可避なのであって，その解釈には問題がある。"},{"l":17,"m":"間接費の配賦","sb":"","r":"(Ｈ29Ⅱ③-ア)","q":"製造間接費の製品別配賦基準の選択は，価値移転又は価値回収の観点から行われる。価値移転の観点からは，投入と産出の因果関係を重視し，投入された原価材の中に入っていた価値が製品へ移転したと考え，その移転過程をできるだけ正確に捉えるために，製造間接費の発生と比例関係にある配賦基準が選択される。価値回収の観点に立てば，原価負担能力と比例関係にある配賦基準を選ばなければならない。直接材料費基準は，価値移転を重視した製造間接費の配賦基準である。","a":false,"c":"","e":"直接材料費を製造間接費の配賦基準として選択すれば，高価な材料を使用する高価な製品に対して，より多くの間接費を負担させることになる。したがって，それはむしろ，価値回収の観点を重視した配賦基準であるといえる。"},{"l":18,"m":"間接費の配賦","sb":"","r":"(Ｈ30Ⅱ③-ウ)","q":"製造間接費の配賦基準としては，便益基準，因果基準，負担能力基準があるが，因果基準が最も優れた配賦基準であり，我が国の「原価計算基準」では因果基準に基づく配賦基準を採用しなければならない。(参考)配賦基準の選択基準因果基準：原価計算対象に提供されたサービスに応じて原価を配賦する便益基準：原価計算対象との受益関係を認識し，受けた便益に応じて原価を配賦する負担能力基準：原価計算対象の原価負担能力に応じて原価を配賦する","a":false,"c":"「基準」33⑸","e":"「原価計算基準」では，原則として，直接作業時間，機械運転時間，生産数量等間接費の発生と関連ある適当な物量基準によって，操業度を表示することを求めている。これは因果基準に基づく配賦基準の採用を予定したものであるが，原則である以上，便益基準や負担能力基準に基づく配賦基準の採用が否定されるわけではない。なお，因果基準と便益基準は価値移転的原価計算，負担能力基準は価値回収的原価計算における基準と解釈できる。"},{"l":19,"m":"間接費の配賦","sb":"","r":"(Ｈ23Ⅱ①-オ他複数)","q":"部門間接費の各指図書への配賦額は，各製造部門又はこれを細分した各小工程又は各作業単位別に間接費予定配賦率を算定し，各指図書に関する実際の配賦基準を乗じて計算する。","a":true,"c":"「基準」33⑶⑹","e":"部門間接費の各指図書への配賦額は，①間接費予定配賦率，又は②固定間接費予定配賦率及び変動間接費予定配賦率に，それぞれ各指図書に関する実際の配賦基準を乗じて計算する。この点，本肢は①を前提とし，②を前提とした記述がないが，間接費予定配賦率＝固定間接費予定配賦率＋変動間接費予定配賦率である以上，誤りとはいえない。"},{"l":20,"m":"間接費の配賦","sb":"","r":"(Ｈ30Ⅰ③-ア)","q":"個別原価計算における間接費は，原則として部門間接費として各指図書に配賦する。間接費は，原則として予定配賦率をもって各指図書に配賦する。一部の補助部門費を製造部門に配賦しないで，直接に指図書に配賦する場合には，合算した上で適当な基準によりこれを配賦する。","a":false,"c":"「基準」18⑵，33⑺","e":"一部の補助部門費を直接に製品(指図書)に配賦する場合，適切な配賦基準はそれぞれの補助部門費によって異なるため，それらを合算した上で配賦すれば，製品原価の計算に歪みが生じてしまう。したがって，正しくは「そのおのおのにつき適当な基準を定めてこれを配賦する」ことが求められる。"},{"l":21,"m":"間接費の配賦","sb":"","r":"(Ｒ６Ⅱ③-エ)","q":"製造部門別の製造間接費を管理するとき，部門別に実際発生額と予定配賦額の差額を予算差異と操業度差異に分解できる。責任会計の観点によれば，各製造部門の現場管理者にとって重要な差異は操業度差異である。","a":false,"c":"","e":"製造部門の現場管理者にとって，受注不足を主たる原因とする操業度差異は，通常管理不能である。一方，予算差異は，当該部門の製造間接費資源の浪費ないし節約を示すことから，通常管理可能である。したがって，責任会計の観点によれば，製造部門の現場管理者にとって重要な差異は予算差異である。"},{"l":22,"m":"間接費の配賦","sb":"","r":"(Ｈ31Ⅱ③-エ)","q":"異常な原因により実際的生産能力の一部を遊休にしたために被る不働費は原価性を有さないことから，これを製品に配賦することは不合理である。また，原価管理のためには，このような不働費は分離される必要がある。","a":true,"c":"","e":"実際的生産能力はフル操業が常態の場合に採用され，この場合に生じる不働費（操業度差異）は原価性を有さず，理論的には非原価項目として処理すべきである。また，効果的な原価管理のためには責任会計との結合が不可欠であるが，このような不働費は工程管理者にとって管理不能であるため，責任会計の見地から分離される必要がある。"},{"l":1,"m":"加工費の配賦","sb":"","r":"(Ｒ５Ⅰ③-ア他複数)","q":"個別原価計算において，労働が機械作業と密接に結合して総合的な作業となり，そのため製品に賦課すべき直接労務費と製造間接費とを分離することが困難な場合その他必要ある場合には，加工費について部門別計算を行い，部門加工費を各指図書に配賦することができる。","a":true,"c":"「基準」34","e":"直接工が機械作業によって製品を製造している場合，指図書別に直接作業時間を測定することは困難であるし，その労働力はむしろ機械運転時間に応じて消費されていると見ることができる。このように，直接労務費と製造間接費の境界が曖昧なケースを想定し，両者を合わせた加工費について部門別計算を行い，部門加工費として各指図書に配賦することが認められている。"},{"l":2,"m":"加工費の配賦","sb":"","r":"(Ｈ23Ⅱ①-イ)","q":"個別原価計算においては，原則として直接費と間接費に区分して計算し，総合原価計算のように直接労務費と製造間接費を加工費として一括して計算し，各指図書に配賦することはない。","a":false,"c":"「基準」34","e":"直接労務費と製造間接費を分離することが困難な場合その他必要ある場合には，加工費について部門別計算を行い，部門加工費を各指図書に配賦することが認められている。"},{"l":3,"m":"加工費の配賦","sb":"","r":"(Ｈ26Ⅱ①-エ)","q":"個別原価計算において，労働が機械作業と密接に結合して総合的な作業となり，そのために製品に配賦すべき直接労務費と製造間接費とを分離することが困難な場合その他必要ある場合には，加工費について費目別計算を行ない，当該加工費を各指図書に配賦することができる。","a":false,"c":"「基準」34","e":"正しくは「製品に賦課すべき直接労務費と製造間接費とを分離することが困難な場合その他必要ある場合には，加工費について部門別計算を行ない，部門加工費を各指図書に配賦することができる」である。"},{"l":4,"m":"加工費の配賦","sb":"","r":"(Ｈ28Ⅱ③-エ)","q":"個別原価計算において，労働が機械作業と密接に結合して総合的な作業となり，そのため製品に賦課すべき直接労務費と製造間接費とを分離することが困難な場合その他必要ある場合には，直接労務費についてのみ部門別計算を行ない，部門加工費を各製造指図書に配賦することができる。","a":false,"c":"「基準」34","e":"直接労務費は本来各指図書に賦課すべきものであるし，製造間接費と分離することが困難な場合にそれのみを抽出して部門に集計することは困難である。正しくは，「加工費について部門別計算を行ない…」である。"},{"l":5,"m":"加工費の配賦","sb":"","r":"(Ｒ２Ⅰ③-イ)","q":"労働が機械作業と密接に結合して総合的な作業となり，そのため製品に賦課すべき直接労務費と製造間接費とを分離することが困難な場合，これらをともに直接労務費として，これを指図書に賦課することができる。","a":false,"c":"「基準」34","e":"製品に賦課すべき直接労務費と製造間接費とを分離することが困難な場合には，これらを合わせて加工費として計算せざるをえないのであって，ともに直接労務費として計算することはできない。正しくは「加工費について部門別計算を行い，部門加工費を各指図書に配賦することができる」である。"},{"l":1,"m":"仕損費の計算および処理","sb":"","r":"(Ｒ４Ⅰ③-イ他複数)","q":"仕損が補修によって回復でき，補修のために補修指図書を発行する場合には，補修指図書に集計された製造原価を仕損費とする。","a":true,"c":"「基準」35前段⑴","e":"仕損が補修によって回復でき，補修のために補修指図書を発行する場合には，補修に要した費用（補修指図書に集計された製造原価）を仕損費とする。"},{"l":2,"m":"仕損費の計算および処理","sb":"","r":"(Ｈ30Ⅰ③-ウ)","q":"個別原価計算において，仕損が補修によって回復できず，代品を製作するために新たに製造指図書を発行する場合，旧製造指図書の全部が仕損となったときは，旧製造指図書に集計された製造原価を仕損費とし，旧製造指図書の一部が仕損となったときは，新製造指図書に集計された製造原価を仕損費とする。","a":true,"c":"「基準」35前段⑵","e":"仕損が補修によって回復できず，代品を製作するために新たに製造指図書を発行する場合，「原価計算基準」では，全部仕損の場合は，実態に即して旧製造指図書に集計された製造原価をもって仕損費とする一方，一部仕損の場合は，代品製作費と仕損費を等価とみなし，新製造指図書に集計された製造原価をもって仕損費とする方法を採用している。"},{"l":3,"m":"仕損費の計算および処理","sb":"","r":"(Ｈ28Ⅰ③-イ他複数)","q":"仕損が補修によって回復できず，代品を製作するために新たに製造指図書を発行する場合において１旧製造指図書の全部が仕損となったときは，新製造指図書に集計された製造原価を仕損費とする。２旧製造指図書の一部が仕損となったときは，旧製造指図書に集計された製造原価を仕損費とする。","a":false,"c":"「基準」35前段⑵","e":"正しくは「旧製造指図書の全部が仕損となったときは，旧製造指図書に集計された製造原価を仕損費とする」，「旧製造指図書の一部が仕損となったときは，新製造指図書に集計された製造原価を仕損費とする」である。"},{"l":4,"m":"仕損費の計算および処理","sb":"","r":"(Ｈ28Ⅰ③-ウ)","q":"仕損の補修又は代品の製作のために別個の指図書を発行しない場合には，仕損の補修等に要する製造原価を見積ってこれを仕損費とする。","a":true,"c":"「基準」35前段⑶","e":"仕損の補修又は代品の製作のために別個の指図書を発行しない場合には，仕損費の実際発生額を把握することができない。そこで，仕損の補修等に要する製造原価を見積って，これを仕損費とすることになる。"},{"l":5,"m":"仕損費の計算および処理","sb":"","r":"(Ｈ28Ⅰ③-エ)","q":"仕損品が売却価値又は利用価値を有する場合には，その見積額を控除した額を仕損費とする。軽微な仕損については，仕損費を計上しないで，単に仕損品の見積売却価額又は見積利用価額を，当該製造指図書に集計された販売費および一般管理費から控除するにとどめることができる。","a":false,"c":"「基準」35","e":"期間原価としての販管費が指図書に集計されることはない。正しくは「…当該製造指図書に集計された製造原価から控除するにとどめることができる」である。"},{"l":6,"m":"仕損費の計算および処理","sb":"","r":"(Ｈ18③-エ)","q":"個別原価計算において，仕損費は仕損が発生した製品の指図書に賦課しなければならない。","a":false,"c":"「基準」35後段","e":"仕損費の処理について，いわゆる直接経費処理と間接経費処理は選択が認められており，いずれが原則・例外の関係にあるわけではない。仕損の発生原因が特定"},{"l":7,"m":"仕損費の計算および処理","sb":"","r":"(Ｈ30Ⅰ③-エ)","q":"個別原価計算における仕損費の処理については，仕損費を間接費とし，これを仕損の発生部門に賦課しなければならない。このとき，間接費の予定配賦率の計算において，当該製造部門の予定間接費額中に，仕損費の予定額を算入する。","a":false,"c":"「基準」35後段","e":"仕損費の処理について，いわゆる直接経費処理と間接経費処理は選択が認められており，いずれが原則・例外の関係にあるわけではない。仕損の発生原因が特定\nの製品にあるならば，仕損費は当該製品のみの負担とすべきであるし，特定の部門の作業にあるならば，仕損費は間接費とし，当該部門を通過する製品で均等に負担すべきである。"},{"l":1,"m":"作業くずの処理","sb":"","r":"(Ｒ２Ⅱ③-ウ他複数)","q":"作業くずは，これを総合原価計算の場合に準じて評価し，その発生部門の部門費から控除する。ただし，必要ある場合には，これを当該製造指図書の直接材料費又は製造原価から控除することができる。","a":true,"c":"「基準」36","e":"作業屑評価額の処理については，指図書を特定することは困難である一方，発生部門を特定することは容易であるという認識のもとに，厳密性よりも簡便性が優先されている。"},{"l":2,"m":"作業くずの処理","sb":"","r":"(Ｈ18③-カ)","q":"個別原価計算において，作業くずの評価額は当該製造指図書の直接材料費あるいは製造原価から控除するのが原則である。","a":false,"c":"「基準」36","e":"個別原価計算において，作業屑の評価額は発生部門の部門費から控除するのが原則であり，当該製造指図書の直接材料費又は製造原価から控除するのは，製造指"},{"l":3,"m":"作業くずの処理","sb":"","r":"(Ｈ27Ⅱ④-エ)","q":"個別原価計算において，作業くずは，これを総合原価計算の場合に準じて評価し，原則として，その評価額を当該製造指図書の直接材料費または製造原価から控除する。","a":false,"c":"「基準」36","e":"個別原価計算において，作業屑の評価額は発生部門の部門費から控除するのが原則であり，当該製造指図書の直接材料費又は製造原価から控除するのは，製造指\n図書が判明する場合の例外的な処理として規定されている。"},{"l":4,"m":"作業くずの処理","sb":"","r":"(Ｈ22Ⅱ③-ア)","q":"個別原価計算においては，作業くずは，これを総合原価計算の場合に準じて評価し，当該製造指図書の製造原価から控除する。ただし，必要ある場合には，これを当該製造指図書の直接材料費から控除することができる。","a":false,"c":"「基準」36","e":"個別原価計算において，作業屑の評価額は発生部門の部門費から控除するのが原則であり，当該製造指図書の直接材料費又は製造原価から控除するのは，製造指"},{"l":5,"m":"作業くずの処理","sb":"","r":"(Ｒ５Ⅰ③-エ)","q":"個別原価計算において，作業くずは，これを総合原価計算の場合に準じて評価し，その発生部門の部門費から控除する。なお，総合原価計算において作業くずの処理と評価は，副産物に準ずるとされている。","a":true,"c":"「基準」28，36","e":"作業屑の評価は総合原価計算の場合に準じるが，総合原価計算における作業屑の処理と評価は，副産物に準じることとされている。この点は，仕損品についても同様である。"}]},{"n":6,"name":"標準原価計算","qs":[{"l":1,"m":"標準原価算定の目的","sb":"","r":"(Ｈ19⑦-ア)","q":"標準原価計算は原価管理や予算管理を効果的に行うことに役立つが，実際原価の計算も行うことや，原価差異を算定する必要があるため，記帳の簡略化，迅速化を図ることは困難である。","a":false,"c":"「基準」40","e":"標準原価計算制度では，勘定組織のある時点で実際原価の流れを切断し，以降は予め設定した標準原価で計算・記帳手続が行われる。このような非通算方式の計算システムによれば，一方において実際"},{"l":2,"m":"標準原価算定の目的","sb":"","r":"(Ｒ３⑦-エ)","q":"標準原価計算の目的は複数あるが，複式簿記と有機的に結合して行われる標準原価計算制度の最大のメリットは，実際原価の偶然的な変動を排除し，原価管理の規範としての信頼性を高めることである。反面，標準原価計算制度では，実際原価の集計に加えて，製品の標準原価の計算が追加的に必要となることから，計算・記帳手続が煩雑化するというデメリットがある。","a":false,"c":"「基準」40","e":"標準原価計算制度では，勘定組織のある時点で実際原価の流れを切断し，以降は予め設定した標準原価で計算・記帳手続が行われる。このような非通算方式の計算システムによれば，一方において実際\n原価を計算し，他方においてその集計を待たずに同時並行的に標準原価による計算・記帳手続が可能となることから，実際原価計算制度に比して計算・記帳手続は著しく簡略化・迅速化されることになる。"},{"l":1,"m":"標準原価の算定(直接費と間接費の標準・間接費予算・標準原価カード)","sb":"","r":"(Ｈ29Ⅱ⑦-イ)","q":"標準直接材料費は，直接材料の種類ごとに，製品単位当たりの標準消費量と標準価格とを定め，両者を乗じて算定する。その際に用いる標準価格は，予定価格又は正常価格とする。","a":true,"c":"「基準」41⑴","e":"直接材料費の標準は，製品原価計算用の標準と原価管理用の標準の区別なく，製品単位当たりで算定する。標準価格は，現実的標準原価の場合は短期予想価格としての予定価格，正常原価の場合は長期平均価格としての正常価格とする。"},{"l":2,"m":"標準原価の算定(直接費と間接費の標準・間接費予算・標準原価カード)","sb":"","r":"(Ｈ28Ⅰ⑧-イ他複数)","q":"標準直接材料費を算定する上での製品単位当たり標準消費量については，製品の生産に必要な各種素材，部品等の種類，品質，加工の方法および順序等を定め，科学的，統計的調査により製品単位当たりの各種材料の標準消費量を定める。標準消費量には，通常生ずると認められる程度の減損，仕損等の消費余裕を含めてはならない。","a":false,"c":"「基準」41⑴-2","e":"原価管理を効果的に実施するためには，まず現場管理者や作業員を動機づける必要があり，短期目標としての原価の標準は，達成不可能な目標(理想標準)であってはならない。正しくは「標準消費量は，通常生ずると認められる程度の減損，仕損等の消費余裕を含む」である。"},{"l":3,"m":"標準原価の算定(直接費と間接費の標準・間接費予算・標準原価カード)","sb":"","r":"(Ｈ30Ⅰ⑦-イ)","q":"標準直接労務費は，直接作業の区分ごとに，製品単位当たりの直接作業の標準時間と標準賃率とを定め，両者を乗じて算定する。その際に用いる標準賃率は，予定賃率又は正常賃率とする。","a":true,"c":"「基準」41⑵","e":"直接労務費の標準は，製品原価計算用の標準と原価管理用の標準を区別なく，製品単位当たりで算定する。標準賃率は，現実的標準原価の場合は短期予想賃率としての予定賃率，正常原価の場合は長期平均賃率としての正常賃率とする。"},{"l":4,"m":"標準原価の算定(直接費と間接費の標準・間接費予算・標準原価カード)","sb":"","r":"(Ｈ30Ⅱ⑦-ウ他複数)","q":"標準直接労務費は，直接作業の区分ごとに，製品単位当たりの直接作業の標準時間と標準賃率とを定め，両者を乗じて算定する。標準直接作業時間については，製品の生産に必要な作業の種類別，使用機械工具，作業の方法および順序，各作業に従事する労働の等級等を定め，作業研究，時間研究その他経営の実情に応ずる科学的，統計的調査により製品単位当たりの各区分作業の標準時間を定める。標準時間は，通常生ずると認められる程度の疲労，身体的必要，手待等の時間的余裕を含まない。","a":false,"c":"「基準」41⑵","e":"動機づけの見地からすれば，作業時間標準は達成不可能な目標(理想標準)であってはならない。正しくは「標準時間は，通常生ずると認められる程度の疲労，身体的必要，手待等の時間的余裕を含む」である。"},{"l":5,"m":"標準原価の算定(直接費と間接費の標準・間接費予算・標準原価カード)","sb":"","r":"(Ｈ30Ⅱ⑦-エ)","q":"部門別製造間接費予算は，固定予算又は変動予算として設定する。変動予算の算定を実査法による場合には，一定の基準となる操業度を中心として，予期される範囲内の種々の操業度を，一定間隔に設け，各操業度に応ずる複数の製造間接費予算をあらかじめ算定列記する。","a":true,"c":"「基準」41⑶","e":"間接費の標準としての部門間接費予算には固定予算と変動予算があり，両者の選択が認められる。このうち，間接費の管理により有効とされるのは変動予算であり，その算定方法には実査法と公式法がある。実査法では種々の操業度における"},{"l":6,"m":"標準原価の算定(直接費と間接費の標準・間接費予算・標準原価カード)","sb":"","r":"(Ｈ29Ⅱ⑦-ウ)","q":"部門間接費予算には変動予算と固定予算があり，変動予算の算定方法の一つに公式法がある。公式法による場合には，製造間接費要素を固定費と変動費とに分け，固定費は，操業度の増減にかかわりなく一定とし，変動費は，操業度の増減との関連における各変動費要素又は変動費要素群の変動費率をあらかじめ測定しておき，これにその都度の関係操業度を乗じて算定する。","a":true,"c":"「基準」41⑶","e":"間接費の標準としての部門間接費予算には固定予算と変動予算があり，両者の選択が認められる。このうち，間接費の管理により有効とされるのは変動予算であり，その算定方法には実査法と公式法がある。実査法では種々の操業度における\n予算額を個別的に実査して算定するのに対し，公式法では一次関数の公式に当てはめてこれを算定する。"},{"l":7,"m":"標準原価の算定(直接費と間接費の標準・間接費予算・標準原価カード)","sb":"","r":"(Ｈ25Ⅰ⑨-ウ)","q":"製造間接費の標準は，部門別に算定して部門間接費予算を用いる。部門間接費予算には，固定予算と変動予算があるが，固定費の管理を重視して，変動予算より固定予算の方が有用であるとされている。","a":false,"c":"「基準」41⑶","e":"「原価計算基準」では「製造間接費の管理をさらに有効にするために，変動予算を設定する」としており，固定予算より変動予算の方が有用であるとされている。なお，固定費の予算は固定予算を使用する場合も変動予算を使用する場合も同じであり，固定費の管理を重視するから固定予算が有用であるとする理屈自体がそもそもおかしい。"},{"l":8,"m":"標準原価の算定(直接費と間接費の標準・間接費予算・標準原価カード)","sb":"","r":"(Ｈ26Ⅱ⑧-ウ)","q":"製造間接費の標準は，部門別に部門間接費予算として算定され，その部門間接費予算には変動予算と固定予算がある。各部門別の変動予算は，一定の限度内において原価管理に役立つのみでなく，製品に対する標準間接費配賦率算定の基礎となる。固定予算とは，製造間接費予算を予算期間に予期される範囲内における種々の操業度に対応して算定した予算をいい，実際間接費額を当該操業度の予算と比較して，部門の業績を管理することを可能にする。","a":false,"c":"「基準」41⑶","e":"一定の限度内において原価管理に役立つのみでなく，製品に対する標準配賦率算定の基礎となるのが固定予算，予算期間に予期される範囲内における種々の操業度に対応して算定した予算が変動予算である。"},{"l":9,"m":"標準原価の算定(直接費と間接費の標準・間接費予算・標準原価カード)","sb":"","r":"(Ｈ18⑤-エ)","q":"生産設備が常に基準操業度水準で稼動している場合，製造間接費予算について公式法変動予算を使用しても固定予算を使用しても，その予算差異の金額は等しくなる。","a":true,"c":"「基準」41⑶","e":"フル操業が常態であり，生産設備が常に基準操業度水準で稼動し，実際操業度が基準操業度に一致する場合には，実際操業度における発生予定額である変動予算が，基準操業度における発生予定額である固定予算に一致する。したがって，いずれの予算を管理標準としても，予算差異の金額は等しくなる。"},{"l":10,"m":"標準原価の算定(直接費と間接費の標準・間接費予算・標準原価カード)","sb":"","r":"(Ｈ23Ⅱ②-ウ)","q":"実際原価の計算において，操業度との関連における分類とは，操業度の増減に対する原価発生の態様による分類である。原価要素は，これによって，固定費と変動費とに分類できる。ここで，操業度とは，生産設備を一定とした場合における利用度をいう。「原価計算基準」によれば，製造間接費を正常配賦する際に変動予算を利用する場合，固定費の実際発生額と基準操業度における予算額との差額を操業度差異といい，変動費の実際発生額と実際操業度における予算額との差額を予算差異という。","a":false,"c":"８⑷，41⑶，45⑸，46⑷","e":"製造間接費は固定費を多く含むため，製造間接費を製品別に集計することと，製造間接費という原価を管理することとは全くの別問題であり，製造間接費の正常配賦(予定配賦)に際して変動予算という概念はない。また，変動予算による製造間接費差異の分析において，正しくは，固定費の正常配賦額と基準操業度における予算額との差額を操業度差異といい，変動費及び固定費の実際発生額と実際操業度における予算額(変動予算)の差を予算差異という。"},{"l":11,"m":"標準原価の算定(直接費と間接費の標準・間接費予算・標準原価カード)","sb":"","r":"(Ｈ28Ⅰ⑧-ウ)","q":"標準製品原価は，製品の一定単位につき標準直接材料費，標準直接労務費等を集計し，これに標準間接費配賦率に基づいて算定した標準間接費配賦額を加えて算定する。標準間接費配賦率は変動予算算定の基礎となる操業度ならびにこの操業度における標準間接費を基礎として算定する。","a":false,"c":"「基準」41⑷","e":"固定予算は，予算期間において予期される一定の操業度に基づいて算定した予算であり，一定の限度内において原価管理に役立つものの，本来は製品に対する標準間接費配賦率算定の基礎としての役割を担っている。正しくは「標準間接費配賦率は固定予算算定の基礎となる操業度ならびにこの操業度における標準間接費を基礎として算定する」である。"},{"l":12,"m":"標準原価の算定(直接費と間接費の標準・間接費予算・標準原価カード)","sb":"","r":"(Ｈ22Ⅰ⑦-カ)","q":"標準原価カードにおいて，材料標準消費量の中に減損や仕損の正常量をあらかじめ含める方法と含めない方法がある。減損や仕損が工程の途中で生じる場合には，月初仕掛品や月末仕掛品に正常減損費や正常仕損費が計上できるので，あらかじめ含める方法のほうが含めない方法よりも正確な計算になる。","a":false,"c":"","e":"減損や仕損が工程の途中で生じる場合，月初仕掛品や月末仕掛品に正常減損費や正常仕損費を計上すべきか否かは，減損や仕損の発生点の加工費進捗度と月初仕掛品や月末仕掛品の加工費進捗度とを比較して決定するのが理論的である。その意味では，減損や仕損の正常量をあらかじめ含めない方法(いわゆる第２法)の方が，含める方法(いわゆる第１法)よりも正確な計算になる。"},{"l":1,"m":"標準原価の改訂","sb":"","r":"(Ｒ４Ⅰ⑦-ア)","q":"原価標準には，様々な種類があるが，原価標準を適用する期間，つまり改訂の頻度によって，基準標準原価と当座標準原価が区別される。基準標準原価は，設定した標準を長期間にわたって適用し，生産条件や経営環境の大きな変化がない限り，改訂されない。これに対して，当座標準原価は，標準原価が実状に即しているかを頻繁に検討し，必要に応じて改訂される。","a":true,"c":"「基準」42","e":"原価標準は，その適用期間ないし改訂頻度により，短期可変的な当座標準原価と長期固定的な基準標準原価とに区別される。両者の相違は，短期的な価格水準や能率水準の変化を反映するか否かという点にあり，当座標準原価の代表例が現実的標準原価，基準標準原価の代表例が理想標準原価である。"},{"l":2,"m":"標準原価の改訂","sb":"","r":"(Ｒ６Ⅰ⑦-ア)","q":"我が国の「原価計算基準」において想定される標準原価は，原価管理や予算編成，また，たな卸資産価額や売上原価算定のために現状に即した標準となるよう，しばしば改訂されることが要求されるが，このような標準原価を当座標準原価という。","a":true,"c":"「基準」40，42","e":"「原価計算基準」では，原価管理，予算編成，棚卸資産価額算定という各種の目的に応えるためには，現状に即した標準でなければならないという認識のもとに，当座標準原価の採用を規定している。"},{"l":3,"m":"標準原価の改訂","sb":"","r":"(Ｈ31Ⅰ⑦-エ他複数)","q":"標準原価計算の目的としては，原価管理，たな卸資産価額および売上原価算定，予算編成，記帳の簡略化および迅速化などがあげられる。これらの目的を達するには標準原価は，現状に即した標準でなければならないため，常にその適否を吟味し，機械設備，生産方式等の生産の基本条件および材料価格，賃率等に重大な変化が生じた場合には，現状に即するようにこれを改訂する。","a":true,"c":"「基準」40，42","e":"「原価計算基準」では，原価管理，予算編成，棚卸資産価額算定という各種の目的に応えるためには，現状に即した標準でなければならないという認識のもとに，当座標準原価の採用を規定している。"},{"l":1,"m":"標準原価の指示","sb":"","r":"(Ｈ25Ⅰ⑨-イ)","q":"標準原価は，一定の文書に表示されて原価発生に責任を持つ各部署に指示される。指示する文書の種類について，標準製品原価表，材料明細表，標準作業表および製造間接費予算表の四つが例として取り上げられている。","a":true,"c":"「基準」41，43","e":"「原価計算基準」41(標準原価の算定)における①標準直接材料費，②標準直接労務費，③製造間接費の標準（部門間接費予算），④標準製品原価に対応する形で，「原価計算基準」43(標準原価の指示)で"},{"l":2,"m":"標準原価の指示","sb":"","r":"(Ｈ26Ⅱ⑧-エ)","q":"標準原価は，一定の文書に表示されて原価発生について責任をもつ各部署に指示されるとともに，この種の文書は，標準原価会計機構における補助記録となる。この種の文書には標準製品原価表，材料明細表，標準作業表，製造間接費予算表などがある。このうち標準製品原価表とは，製造指図書に指定された製品の一定単位当たりの標準原価を構成する各種直接材料費の標準，作業種類別の直接労務費の標準および部門別製造間接費配賦額の標準を数量的および金額的に表示指定する文書をいうのである。","a":true,"c":"「基準」41，43","e":"「原価計算基準」41(標準原価の算定)における①標準直接材料費，②標準直接労務費，③製造間接費の標準（部門間接費予算），④標準製品原価に対応する形で，「原価計算基準」43(標準原価の指示)で\nは，標準原価を指示する文書として①材料明細表，②標準作業表，③製造間接費予算表，④標準製品原価表を列挙している。このうち標準製品原価表は，製品の一定単位当たりの標準直接材料費，標準直接労務費，標準製造間接費（標準配賦額）を表示指定する文書をいい，いわゆる標準原価カードに相当する。"},{"l":1,"m":"原価差異の算定および分析","sb":"","r":"(Ｈ23Ⅰ⑧-イ)","q":"「原価計算基準」によれば，標準原価計算制度において，原価差異が生ずる場合には，その大きさを算定記録し，これを分析する。その目的は，原価差異を財務会計上適正に処理して製品原価及び損益を確定することと，その分析結果を各階層の経営管理者に提供することによって，原価の管理に資するためである。","a":true,"c":"「基準」44","e":"原価差異を算定・分析する目的には①財務諸表作成目的と②原価管理目的の２つがあり，①財務諸表作成目的から原価差異を「算定」し(分析の必要はない)，②原価管理目的から原価差異を「分析」する(算定するだけでは足りない)。"},{"l":1,"m":"標準原価計算における勘定記入法と原価差異の把握方法","sb":"","r":"(Ｒ２Ⅰ⑦-イ)","q":"標準原価計算制度は，標準原価をどの段階で複式簿記機構の中に組み入れるかによってパーシャル・プランとシングル・プランとに大別される。パーシャル・プランでは，実際生産量（完成品量と期末仕掛品の完成品換算量）に原価標準を乗じて標準原価を計算し，これを複式簿記機構に組み入れる。シングル・プランは，資源の消費時点で標準原価を計算し，これを複式簿記機構の中に組み入れる方法である。","a":true,"c":"「基準」２","e":"勘定組織と結合して標準原価計算を実施する標準原価計算制度は，標準原価を勘定組織に組み入れるタイミングによって，シングル・プランとパーシャル・プランに大別される。シングル・プランは，製品の生産量が事前に確定していることを前提として，資源の投入時点でその投入高を標準原価で計算するため，仕掛品勘"},{"l":2,"m":"標準原価計算における勘定記入法と原価差異の把握方法","sb":"","r":"(Ｒ３⑦-イ)","q":"標準原価計算制度では，標準原価をどの計算段階で複式簿記機構の中に組み入れるかによって，原則として，パーシャル・プランとシングル・プランに大別される。シングル・プランでは，仕掛品勘定の借方は標準原価で記入される。これに対して，パーシャル・プランでは，仕掛品勘定の借方は実際原価で記入される。","a":true,"c":"「基準」２","e":"勘定組織と結合して標準原価計算を実施する標準原価計算制度は，標準原価を勘定組織に組み入れるタイミングによって，シングル・プランとパーシャル・プランに大別される。シングル・プランは，製品の生産量が事前に確定していることを前提として，資源の投入時点でその投入高を標準原価で計算するため，仕掛品勘\n定の借方は貸方と同じように標準原価で記入される。これに対して，パーシャル・プランは，製品の実際生産量が原価計算期末に事後的に確定することを前提として，資源の投入高を実際原価で計算するため，仕掛品勘定の借方は実際原価で記入される。"},{"l":3,"m":"標準原価計算における勘定記入法と原価差異の把握方法","sb":"","r":"(Ｈ22Ⅰ⑦-ア)","q":"総合原価計算が適用される製品の場合には，一般的にパーシャル・プランや修正パーシャル・プランが採用され，そのとき仕掛品勘定(製造勘定)の借方には実際原価だけが記入される。","a":false,"c":"","e":"パーシャル・プランや修正パーシャル・プランにおいて，仕掛品勘定の借方には実際原価が記入されるが，通常は月初仕掛品が存在し，それは標準原価で借方記入される。したがって，必ずしも実際原価だけが記入されるわけではない。"},{"l":4,"m":"標準原価計算における勘定記入法と原価差異の把握方法","sb":"","r":"(Ｒ２Ⅰ⑦-ウ)","q":"修正パーシャル・プランとは，直接材料費および直接労務費の各仕掛品勘定の借方に，直接材料費と直接労務費の実際消費量を実際価格でなく，標準価格で評価した金額を計上する方法である。責任会計の見地から，材料の価格差異，労働の賃率差異は管理不能であるために，こうした外部要因による差異を原価業績報告書に含めることのない修正パーシャル・プランは，通常のパーシャル・プランよりも優れている。","a":true,"c":"","e":"工程管理者の業績評価のための原価業績報告書は，仕掛品勘定に基づいて作成される。そのため，工程管理者にとって管理不能な価格差異や賃率差異は，仕掛品勘定から予め排除されていることが望ましい。その意味では，責任会計の見地において，修正パーシャル・プランはパーシャル・プランよりも優れている（パー"},{"l":5,"m":"標準原価計算における勘定記入法と原価差異の把握方法","sb":"","r":"(Ｈ28Ⅱ⑦-ア)","q":"直接材料費に関する原価差異のうち価格差異は，工程管理者にとっては多くの場合管理不能であり，原価報告書に含めるべきではなく，この点において，パーシャル・プランは修正パーシャル・プランに劣っている。","a":true,"c":"","e":"工程管理者の業績評価のための原価業績報告書は，仕掛品勘定に基づいて作成される。そのため，工程管理者にとって管理不能な価格差異や賃率差異は，仕掛品勘定から予め排除されていることが望ましい。その意味では，責任会計の見地において，修正パーシャル・プランはパーシャル・プランよりも優れている（パー\nシャル・プランは修正パーシャル・プランに劣っている）といえる。"},{"l":6,"m":"標準原価計算における勘定記入法と原価差異の把握方法","sb":"","r":"(Ｈ20⑧-ウ)","q":"修正パーシャル・プランにおける仕掛品勘定の借方において，直接材料費は実際消費量と実際価格をもとに記帳されるため，工程管理者にとって管理不能な価格差異が原価業績報告書から排除されることとなり，この点において，パーシャル・プランより優れているといえる。","a":false,"c":"","e":"修正パーシャル・プランにおける仕掛品勘定の借方において，直接材料費は実際消費量と標準価格をもとに記帳される。"},{"l":7,"m":"標準原価計算における勘定記入法と原価差異の把握方法","sb":"","r":"(Ｈ19⑦-ウ)","q":"標準原価差異の把握方法には，直接材料や直接作業の投入時に算出する方法と，ある期間の実際生産量が確定してから算出する方法があり，前者をシングル・プランといい，後者をパーシャル・プランという。","a":false,"c":"","e":"標準原価差異を直接材料や直接作業の投入時に把握する方法はインプット法，ある期間の実際生産量が確定してから算出する方法はアウトプット法である。シングル・プランとパーシャル・プランは，標準原価計算制度において標準原価を複式簿記機構に組み込むタイミングに基づく区別である。"},{"l":8,"m":"標準原価計算における勘定記入法と原価差異の把握方法","sb":"","r":"(Ｒ３⑦-ウ)","q":"標準原価差額の把握方法には，インプット法とアウトプット法がある。期末に実際生産量に原価標準を乗じて，標準原価を算定し，実際原価と比較することによって，標準原価差額を把握する方法をインプット法という。このとき，標準原価差額は，原価計算期末まで判明しない。原価管理を推進するためには，アウトプット法よりもインプット法のほうが望ましい。","a":false,"c":"","e":"標準原価差額の把握方法にはインプット法とアウトプット法があるが，期末に実際生産量に原価標準を乗じて標準原価を算定し，実際原価と比較することによって標準原価差額を把握する方法をアウトプット法という。なお，アウトプット法を採用する場合，標準原価差額は原価計算期末まで判明しないため，原価管理を推進するためには，期中統制が可能なインプット法を採用するのが望ましい。"},{"l":9,"m":"標準原価計算における勘定記入法と原価差異の把握方法","sb":"","r":"(Ｒ２Ⅰ⑦-ア)","q":"原価計算期末にその期間の産出量（完成品量と期末仕掛品の完成品換算量）に基づき原価差異を把握する方法を一般にアウトプット法という。これに対して，資源投入時点で差異を把握する方法を一般にインプット法という。インプット法は，標準原価差額の把握と分析を迅速に実施できるとともに，計算事務量を節約できるという長所を有している。","a":false,"c":"","e":"インプット法(シングル・プラン)は，資源の投入時点でその都度差異(不利差異)を把握する方法であるから，標準原価差異の把握と分析を迅速に実施できるという長所を有する反面，超過材料庫出請求票など証憑類の整備も含め，計算事務が煩雑になるという短所を有している。"},{"l":10,"m":"標準原価計算における勘定記入法と原価差異の把握方法","sb":"","r":"(Ｈ20⑧-ア)","q":"標準原価計算における記帳方法はパーシャル・プランとシングル・プランに大別されるが，後者は原価財の投入時点において原価差異が計算されるため，前者に比べ，原価差異の把握と分析を迅速に行うことができ，計算事務量の負担も少ないという長所をもっている。","a":false,"c":"","e":"インプット法(シングル・プラン)は，資源の投入時点でその都度差異(不利差異)を把握する方法であるから，標準原価差異の把握と分析を迅速に実施できるという長所を有する反面，超過材料庫出請求票など証憑類の整備も含め，計算事務が煩雑になるという短所を有している。"},{"l":11,"m":"標準原価計算における勘定記入法と原価差異の把握方法","sb":"","r":"(Ｈ25Ⅱ⑧-ア)","q":"パーシャル・プランでは，労働時間差異について，作業時間報告書上に，①標準作業時間，②実際作業時間，③差異，④差異の発生原因などを日々記録する。これらが日報として作成され，現場の管理者へ提出され，原価管理の資料となる。","a":false,"c":"","e":"原価管理のために差異の発生原因などを日々記録するのは，パーシャル・プランではなくシングル・プランである。また，出題者は「正しくはシングル・プラン」という思考で本肢を作成していると推測されるが，シングル・プランは勘定記入法であるから，厳密にはインプット法が正しい。"},{"l":12,"m":"標準原価計算における勘定記入法と原価差異の把握方法","sb":"","r":"(Ｒ５Ⅰ⑦-ウ)","q":"多くの連続生産型企業では月末段階で材料の数量差異を把握し，パーシャル・プランを採用しているが，材料の投入段階で数量差異を把握することも可能であり，そのための方法が修正パーシャル・プランである。","a":false,"c":"","e":"連続生産を行う場合であっても，生産の平準化を図り，一定期間の生産量と標準投入量を事前に確定させることが出来れば，材料の投入段階で数量差異を把握することも理論上は可能である。ただし，そのための方法とは，修正パーシャル・プランではなく，インプット法である。"},{"l":13,"m":"標準原価計算における勘定記入法と原価差異の把握方法","sb":"","r":"(Ｒ５Ⅱ⑦-ア)","q":"インプット法の特徴は原価財の投入段階で差異を把握できる点にあるが，全ての差異を原価財の投入段階で把握できるわけではない。","a":true,"c":"","e":"直接労務費の賃率差異の把握には直接労務費の実際発生額を，製造間接費の予算差異と操業度差異の把握には製造間接費の実際発生額と実際操業度の合計を必要とし，それらが確定するのは原価計算期末以降となる。したがって，賃率差異，予算差異，操業度差異の把握はアウトプット法によらざるを得ず，全ての差異を原価財の投入段階で把握できるわけではない。"},{"l":14,"m":"標準原価計算における勘定記入法と原価差異の把握方法","sb":"","r":"(Ｒ２Ⅰ⑦-エ)","q":"原価差異をいつ把握するかという差異把握のタイミングと勘定記入法の区別は，必ずしも一対一で対応するものではないが，シングル・プランはインプット法，パーシャル・プランはアウトプット法と結び付きやすい。なお，製造間接費差異のうち，操業度差異および予算差異は，アウトプット法で把握することはできない。","a":false,"c":"","e":"製造間接費差異のうち，操業度差異及び予算差異をインプット法で把握することはできず，それらの把握はアウトプット法によらざるをえない。"},{"l":1,"m":"実際原価計算制度における原価差異","sb":"","r":"(Ｒ３①-イ)","q":"材料受入価格差異とは，材料の受入価格を予定価格等をもって計算することによって生ずる原価差異をいい，一期間におけるその材料の受入金額と実際受入金額との差額に実際受入数量を乗じて算定する。また，材料消費価格差異とは，材料の消費価格を予定価格等をもって計算することによって生ずる原価差異をいい，一期間におけるその材料費額と実際発生額との差額として算定する。","a":false,"c":"「基準」45⑵","e":"材料受入価格差異の算定に関する記述に問題がある。正しくは「一期間におけるその材料の受入金額と実際受入金額との差額として算定する」であり，仮に実際受入数量を乗じて算定するのであれば，それは予定価格等と実際受入価格との差に対してである。"},{"l":2,"m":"実際原価計算制度における原価差異","sb":"","r":"(Ｒ３①-ウ)","q":"加工費配賦差異とは，部門加工費を予定配賦率をもって製品に配賦することによって生ずる原価差異をいい，一期間におけるその製造間接費の配賦額と実際額との差額として算定する。","a":false,"c":"「基準」34，45⑹","e":"加工費配賦差異は，部門別の直接労務費と製造間接費とを合わせた加工費を予定配賦する場合に生ずる差異であり，製造間接費配賦差異とは区別される。正しくは「一期間におけるその加工費の配賦額と実際額との差額として算定する」である。"},{"l":3,"m":"実際原価計算制度における原価差異","sb":"","r":"(Ｒ３①-エ)","q":"振替差異とは，工程間に振り替えられる工程製品の価額を予定原価又は正常原価をもって計算することによって生ずる原価差異をいい，一期間におけるその工程製品の振替価額と実際額との差額として算定する。","a":true,"c":"「基準」４⑴-2，25，45⑻","e":"累加法による工程別総合原価計算において，工程間に振り替えられる工程製品の計算は，予定原価又は正常原価によることが認められている。この場合，予定原価又は正常原価による振替価額と実際額との差において，振替差異が生じることになる。なお，この振替差異は，後工程(次工程)から見れば「管理不能な前工程の能率の良否の影響」に相当し，これを取り除くことによって，後工程(次工程)の原価業績を純粋に判断することが可能となる。"},{"l":1,"m":"標準原価計算制度における原価差異","sb":"","r":"(Ｈ31Ⅰ⑦-エ他複数)","q":"標準原価計算制度における材料受入価格差異とは，材料の受入価格を標準価格をもって計算することによって生ずる原価差異をいい，標準受入価格と実際受入価格との差異に実際消費数量を乗じて算定する。この差異は当年度の材料の払出高と期末在高に配賦する。","a":false,"c":"「基準」46⑴","e":"材料受入価格差異とは，消費材料の価格差異ではなく，購入材料の価格差異に相当する。正しくは「標準受入価格と実際受入価格との差異に，実際受入数量を乗じて算定する」である。"},{"l":2,"m":"標準原価計算制度における原価差異","sb":"","r":"(Ｈ30Ⅰ⑦-ウ)","q":"直接材料費差異とは，標準原価による直接材料費と直接材料費の実際発生額との差額をいい，これを材料種類別に価格差異と数量差異とに分析する。このうち数量差異とは，材料の標準消費数量と実際消費数量との差異に基づく直接材料費差異をいい，直接材料の標準消費数量と実際消費数量との差異に，標準消費価格を乗じて算定する。","a":true,"c":"「基準」46⑵","e":"「原価計算基準」では，原価管理の観点から，価格差異と数量差異の混合差異を価格差異に含めて分析する立場を採っている。"},{"l":3,"m":"標準原価計算制度における原価差異","sb":"","r":"(Ｈ20⑧-オ)","q":"直接材料費差異は，理論的には，「価格差異」と「数量差異」と「混合差異」に３分されるが，一般的には管理可能な数量差異を正確に把握することを重視するため，混合差異を数量差異に含めて計算することが多くなされている。","a":false,"c":"「基準」46⑵","e":"一般的には，管理可能な数量差異を純粋に把握することを重視するため，混合差異を価格差異に含めて計算することが多くなされている。"},{"l":4,"m":"標準原価計算制度における原価差異","sb":"","r":"(Ｈ23Ⅰ⑧-ア)","q":"標準原価計算制度における直接材料費差異は消費価格と消費数量に基づいて，通常，価格差異と数量差異の二つに分解される。この場合の価格差異は，直接材料の標準消費価格と実際消費価格との差異に，実際消費数量を乗じて算定されるが，この価格差異には一部数量差異の影響が含まれる。","a":true,"c":"「基準」46⑵","e":"混合差異を価格差異に含めて分析する場合，歩留の良否が実際消費量の増減を通じて価格差異に影響するため，その中には，一部数量差異の影響が含まれることになる。"},{"l":5,"m":"標準原価計算制度における原価差異","sb":"","r":"(Ｒ２Ⅱ⑧-イ)","q":"標準原価計算制度における直接材料費差異は消費価格と消費数量に基づいて，価格に起因する差異と数量に起因する差異の２つに分解される。通常，価格差異は，直接材料の標準消費価格と実際消費価格の差に，標準消費数量を乗じて計算される。このようにして算出される価格差異には，一部，数量に起因する差異の影響が混入している。","a":false,"c":"「基準」46⑵","e":"正しくは「価格差異は，直接材料の標準消費価格と実際消費価格の差に，実際消費数量を乗じて計算される」である。なお，この場合，実際歩留を前提とする以上，価格差異の中に数量に起因する差異の影響が混入するという点は正しい。"},{"l":6,"m":"標準原価計算制度における原価差異","sb":"","r":"(Ｈ19⑦-オ)","q":"化学薬品を生産している工場では，原料の数量差異を配合差異と歩留差異に区分して把握することは有効な原価管理の一方法といえる。このうち歩留差異を，原料別標準消費量から，当該原料の標準配合割合とすべての原料の実際消費量合計を乗じたものを控除したものに，標準価格を乗じて算出した場合に，この値が正(プラス)のときは，その原料の歩留は良好であったことを示しているといえる。","a":true,"c":"","e":"一般に，歩留差異は，標準歩留・標準配合消費量と実際歩留・標準配合消費量の差に対して，標準価格を乗じることで計算される。この値が正のときは有利差異であり，歩留は良好と判定される。"},{"l":7,"m":"標準原価計算制度における原価差異","sb":"","r":"(Ｈ20⑧-カ)","q":"化学製品などを生産している場合に原料配合差異を把握することは原価管理にとって有効である。原料配合差異は，実際消費量合計に原料別標準配合割合を乗じたものから原料別実際消費量を控除したものに，原料別標準価格を乗じて計算することができる。","a":true,"c":"","e":"一般に，配合差異は，実際歩留・標準配合消費量と実際歩留・実際配合消費量の差に対して，標準価格を乗じることで計算される。"},{"l":8,"m":"標準原価計算制度における原価差異","sb":"","r":"(Ｈ25Ⅱ⑧-イ)","q":"ある製品を製造するために複数の原料が必要となり，それらの原料が代替可能であるとき，原料配合差異と原料歩留差異を計算することがある。この場合，原料配合差異は原料の標準単価，標準配合と実際歩留を使用することによって，原料歩留差異は原料の標準単価，標準配合と標準歩留を使用することによって計算する。","a":true,"c":"","e":"原料配合差異の計算には実際歩留・実際配合消費量も使用するし，原料歩留差異の計算には実際歩留・標準配合消費量も使用する。したがって，言葉足らずではあるが，記述内容自体に誤りはない。"},{"l":9,"m":"標準原価計算制度における原価差異","sb":"","r":"(Ｒ６Ⅰ⑦-イ)","q":"実際生産量と標準歩留率から計算された原料投入量を標準配合割合で分けた原料別投入量と，実際配合割合で分けた原料別投入量の差に，原料別標準価格を乗じたものが原料配合差異である。","a":false,"c":"","e":"配合割合の変更は，実際の原料投入量の中で行われるため，原料配合差異の分析は実際歩留を前提とする。正しくは，実際生産量と実際歩留率から計算された原料投入量を標準配合割合で分けた原料別投入量と，実際配合割合で分けた原料別投入量の差に，原料別標準価格を乗じたものが原料配合差異である。"},{"l":10,"m":"標準原価計算制度における原価差異","sb":"","r":"(Ｒ５Ⅱ⑦-イ)","q":"加重平均標準価格を用いて原料配合差異と原料歩留差異を計算する場合，各原料の標準消費量（実際生産量から標準歩留率と標準配合割合を用いて計算された標準消費量）と実際消費量の差が両方の差異の計算に必要となる。","a":true,"c":"","e":"加重平均標準価格を媒介とする方法により原料配合差異と原料歩留差異を計算する場合には，いずれの差異の計算においても，各原料の標準歩留・標準配合消費量と実際歩留・実際配合消費量の差が必要となる。"},{"l":11,"m":"標準原価計算制度における原価差異","sb":"","r":"(Ｈ29Ⅱ⑦-エ)","q":"直接労務費差異とは，標準原価による直接労務費と直接労務費の実際発生額との差額をいい，これを部門別又は作業種類別に賃率差異と作業時間差異とに分析する。この賃率差異とは，標準賃率と実際賃率との差異に基づく直接労務費差異をいい，標準賃率と実際賃率との差異に，標準作業時間を乗じて算定する。","a":false,"c":"「基準」46⑶","e":"「原価計算基準」では，原価管理の観点から，賃率差異と作業時間差異の混合差異を賃率差異に含めて分析する立場を採っている。正しくは「標準賃率と実際賃率との差異に，実際作業時間を乗じて算定する」である。"},{"l":12,"m":"標準原価計算制度における原価差異","sb":"","r":"(Ｈ28Ⅱ⑦-イ)","q":"直接労務費差異は，理論的には，賃率差異，作業時間差異および混合差異に三分されるが，一般的には管理可能な作業時間差異を正確に把握することを重視するため，混合差異を作業時間差異に含めて計算することが多くなされている。","a":false,"c":"「基準」46⑶","e":"一般的には，管理可能な作業時間差異を純粋に把握することを重視するため，混合差異を賃率差異に含めて計算することが多くなされている。"},{"l":13,"m":"標準原価計算制度における原価差異","sb":"","r":"(Ｈ30Ⅰ⑦-エ)","q":"製造間接費差異とは，製造間接費の標準額と実際発生額との差額をいい，原則として一定期間における製品別間接費差異として算定して，これを能率差異，操業度差異等に適当に分析する。","a":false,"c":"「基準」41⑶，46⑷","e":"製造間接費の標準は部門間接費予算として算定するため，これに照応して，製造間接費差異もまた，製品ではなく責任区分としての部門と結び付けて算定することになる。正しくは「一定期間における部門間接費差異として算定して…」である。"},{"l":14,"m":"標準原価計算制度における原価差異","sb":"","r":"(Ｈ19⑦-カ)","q":"製造間接費差異のうち予算差異は，通常，変動費から生ずるが，固定費から生ずることもある。また，操業度差異の計算上，変動費の発生額は操業度差異の額に影響を与えることはない。","a":true,"c":"","e":"予算差異は通常変動費から生ずるが，保険料の改訂等により固定費から生ずることもある。また，操業度差異は実際操業度ないし標準操業度と基準操業度の差に対して固定費標準配賦率や標準配賦率を乗じて計算するため，変動費の発生額自体が影響することはない。"},{"l":15,"m":"標準原価計算制度における原価差異","sb":"","r":"(Ｒ２Ⅱ⑧-ウ他複数)","q":"公式法変動予算に基づく，三分法による製造間接費差異分析で，操業度差異を標準作業時間と基準操業度となる作業時間(以下，基準作業時間)の差に固定費率を乗じて計算する場合，能率差異は変動費部分と固定費部分の両方を含む。また，操業度差異を実際作業時間と基準作業時間の差に固定費率を乗じて計算する場合，能率差異は変動費部分だけで構成される。","a":false,"c":"","e":"三分法において，操業度差異を標準作業時間と基準作業時間の差に固定費率を乗じて計算する場合，固定費能率差異は操業度差異に含まれることから，能率差異は変動費部分だけで構成される。また，操業度差異を実際作業時間と基準作業時間の差に固定費率を乗じて計算する場合，固定費能率差異は能率差異に含まれることから，能率差異は変動費部分と固定費部分の両方を含む。"},{"l":16,"m":"標準原価計算制度における原価差異","sb":"","r":"(Ｒ２Ⅱ⑧-エ他複数)","q":"公式法変動予算による製造間接費の差異分析には，複数の方法がある。二分法における管理可能差異と四分法における予算差異との差額は，操業度差異を基準操業度となる作業時間と標準作業時間との差によって計算するタイプの三分法における能率差異の金額と一致する。","a":true,"c":"","e":"二分法における管理可能差異と四分法における予算差異との差額は，変動費能率差異に相当する。したがって，操業度差異を基準作業時間と標準作業時間の差によって計算し，固定費能率差異を操業度差異に含めるタイプの三分法における能率差異の金額と一致する。"},{"l":17,"m":"標準原価計算制度における原価差異","sb":"","r":"(Ｈ28Ⅱ⑦-ウ)","q":"操業度を直接作業時間で測定しているとき，変動予算による製造間接費の差異分析において，二分法における操業度差異と，四分法における操業度差異との差額は，操業度差異を基準(正常)作業時間と標準作業時間との差として求める場合の三分法における能率差異の金額と一致する。","a":false,"c":"","e":"二分法における操業度差異と四分法における操業度差異との差額は固定費能率差異に相当し，操業度差異を基準作業時間と標準作業時間との差として求める場合の三分法における能率差異は変動費能率差異に相当する。したがって，両者は一致しない。"},{"l":18,"m":"標準原価計算制度における原価差異","sb":"","r":"(Ｒ６Ⅱ⑦-ア)","q":"製造間接費の差異を公式法変動予算の三分法によって分解する場合，能率差異は標準配賦率によって計算する方法と変動費率によって計算する方法がある。なお，前者の方法による場合の操業度差異は実際原価計算でも求められるが，後者の方法による操業度差異は実際原価計算では求めることができず，能率差異とともに標準原価計算固有の差異となる。","a":true,"c":"","e":"三分法において，能率差異を標準配賦率によって計算する場合，操業度差異は実際操業度と基準操業度の差に基づいて計算するため，それは実際原価計算でも求められる差異である。一方，能率差異を変動費率によって計算する場合，操業度差異は標準操業度と基準操業度の差に基づいて計算するため，それは能率差異とともに標準原価計算固有の差異となる。"},{"l":1,"m":"原価差異の解釈","sb":"","r":"(Ｈ22Ⅰ⑦-イ)","q":"材料費の価格差異は，輸入材料に関する為替レートの変動のように，外部要因によるものなので管理不能である。","a":false,"c":"","e":"価格差異の多くは外部要因によって発生するが，不適当な購買先の選択など内部要因によって発生する場合もあり，その管理可能性は発生原因，管理職能等に依存する。"},{"l":2,"m":"原価差異の解釈","sb":"","r":"(Ｈ20⑧-エ)","q":"賃率差異は工程管理者にとって管理不能な原因によって発生することが多くあるが，不適切な人員配置など管理可能な原因により発生することもある。","a":true,"c":"","e":"賃率差異は工程管理者にとって管理不能な原因によって発生することが多いが，人員配置計画の不手際，機械当たり標準人員以上の工員の配置など，管理可能な原因によって発生する場合もある。"},{"l":1,"m":"原価差異の会計処理","sb":"","r":"(Ｈ28Ⅱ⑦-エ)","q":"材料受入価格差異とは，材料の受入価格を標準価格をもって計算することによって生ずる原価差異をいう。発生した材料受入価格差異は，当年度の材料の払出高と期末在高に配賦する必要がある。この場合，材料の期末在高については，材料の適当な種類群別に配賦する。","a":true,"c":"「基準」46⑴，47⑴-2","e":"材料受入価格差異とは購入材料の価格差異であり，それは消費材料の価格差異と期末材料の価格差異からなる。したがって，その全てを費用計上することは認められず，消費材料価格差異と期末材料価格差異とに分割した上で，後者については期末材料に加算する必要がある。"},{"l":2,"m":"原価差異の会計処理","sb":"","r":"(Ｒ４Ⅱ⑧-ウ)","q":"材料受入価格差異は，当年度の材料の期首在高と購入高に配賦する。この場合，材料の期首在高については，材料の適当な種類群別に配賦する。","a":false,"c":"「基準」47⑴-2","e":"正しくは「当年度の材料の払出高と期末在高に配賦する」，「材料の期末在高については，材料の適当な種類群別に配賦する」である。"},{"l":3,"m":"原価差異の会計処理","sb":"","r":"(Ｈ29Ⅰ⑦-イ)","q":"材料受入価格差異は，当年度の材料の払出高と期末在高に配賦する。この場合，材料の期末在高については，材料の適当な種類群別に配賦する。材料受入価格差異以外の原価差異は，原則として当年度の売上原価に賦課する。","a":true,"c":"「基準」47⑴-1・2","e":"材料受入価格差異以外の原価差異は，少額の原価差異しか生じないという認識のもとに，全て売上原価に賦課するという簡便的な処理を原則としている。"},{"l":4,"m":"原価差異の会計処理","sb":"","r":"(Ｒ４Ⅰ③-ウ)","q":"個別原価計算において，原価差異は，当年度の売上原価と期末におけるたな卸資産に科目別に配賦しなければならない。","a":false,"c":"「基準」47⑴-1・3","e":"個別原価計算において，原価差異を当年度の売上原価と期末棚卸資産に配賦する場合には，指図書別配賦と科目別配賦の選択が認められている。また，それは原価差異が比較的多額に生じた場合の処理であり，原則的には，原価差異が少額であることを前提として，これを当年度の売上原価に賦課する。"},{"l":5,"m":"原価差異の会計処理","sb":"","r":"(Ｈ29Ⅰ⑦-ウ)","q":"予定価格等が不適当なため，比較的多額の原価差異が生ずる場合，直接材料費，直接労務費，直接経費および製造間接費に関する原価差異の処理は，個別原価計算の場合は，当年度の売上原価と期末におけるたな卸資産に科目別に配賦する方法のみが示されている。","a":false,"c":"「基準」47⑴-3⑴","e":"比較的多額の原価差異の処理について，個別原価計算の場合は指図書別配賦と科目別配賦の選択適用が規定されている。"},{"l":6,"m":"原価差異の会計処理","sb":"","r":"(Ｈ29Ⅰ⑦-エ)","q":"予定価格等が不適当なため，比較的多額の原価差異が生ずる場合，直接材料費，直接労務費，直接経費および製造間接費に関する原価差異の処理は，総合原価計算の場合は，当年度の売上原価と期末におけるたな卸資産に科目別に配賦する方法のみが示されている。","a":true,"c":"「基準」47⑴-3⑵","e":"比較的多額の原価差異の処理について，総合原価計算の場合は指図書別に製造原価を集計することはしないため，科目別配賦のみが規定されている。"},{"l":7,"m":"原価差異の会計処理","sb":"","r":"(Ｒ４Ⅱ⑧-エ)","q":"経営状況が安定していて，比較的少額の原価差異が発生した場合，原価差異の処理は，個別原価計算の場合には，前年度の売上原価と期末におけるたな卸資産に，指図書別，又は科目別に配賦する。総合原価計算の場合には，前年度の売上原価と期末におけるたな卸資産に科目別に配賦する。","a":false,"c":"「基準」47⑴-3","e":"原価差異を売上原価と期末棚卸資産に配賦することが求められるのは，比較的多額の原価差異が発生した場合である。また，その場合の売上原価と期末棚卸資産とは，前年度ではなく当年度の売上原価と期末棚卸資産をいう。"}]},{"n":7,"name":"直接原価計算","qs":[{"l":1,"m":"直接原価計算の利用","sb":"","r":"(Ｈ23Ⅰ⑩-ア)","q":"「原価計算基準」によれば，総合原価計算において，必要ある場合には，１期間における製造費用のうち，変動直接費および変動間接費のみを部門に集計して部門費を計算し，これに期首仕掛品を加えて完成品と期末仕掛品とにあん分して製品の直接原価を計算し，固定費を製品に集計しないことができる。この場合，会計年度末においては，当該会計期間に発生した固定費額は，これを期末の仕掛品および製品と当年度の売上品とに配賦する。","a":true,"c":"「基準」30","e":"「原価計算基準」では，総合原価計算を実施する場合において，会計年度末に固定費調整を行うことを条件として，直接原価計算の採用を認めている。なお，Ｈ27Ⅰ⑦の肢における「制度」とは，社会的制度としての含意を持つ原価計算制度ではなく，計算システムを意味すると考えればよい。"},{"l":2,"m":"直接原価計算の利用","sb":"","r":"(Ｈ27Ⅰ⑦-ア)","q":"わが国の「原価計算基準」では，総合原価計算において制度として直接原価計算を実施することを認めているが，その場合，会計年度末において，当該会計期間に発生した固定費額は，これを期末の仕掛品および製品と当年度の売上品とに配賦することとしている。","a":true,"c":"「基準」30","e":"「原価計算基準」では，総合原価計算を実施する場合において，会計年度末に固定費調整を行うことを条件として，直接原価計算の採用を認めている。なお，Ｈ27Ⅰ⑦の肢における「制度」とは，社会的制度としての含意を持つ原価計算制度ではなく，計算システムを意味すると考えればよい。"},{"l":3,"m":"直接原価計算の利用","sb":"","r":"(Ｈ22Ⅰ⑪-ア)","q":"直接原価計算による営業利益を，固定費調整をすることにより全部原価計算による営業利益と一致させることができるが，この処理は原価計算基準においては認められていない。","a":false,"c":"「基準」30","e":"「原価計算基準」では，総合原価計算において直接原価計算を採用する場合に，固定費調整によって全部原価計算への組み換えを行うことを求めている。なお，本肢では営業利益の修正のみを指摘しているが，固定費調整とは，本来は棚卸資産価額の修正をも含む会計処理である。"},{"l":4,"m":"直接原価計算の利用","sb":"","r":"(Ｈ23Ⅱ②-イ)","q":"実際原価の計算において，製品との関連における分類とは，製品に対する原価の発生が一定単位の製品の生成に関して直接的に認識されるかどうかの性質上の区別による分類である。原価要素は，これによって，直接費と間接費とに分類できる。「原価計算基準」によれば，総合原価計算において，必要ある場合には，一定期間における製造費用のうち，直接費のみを部門に集計して部門費を計算し，これに期首仕掛品を加えて完成品と期末仕掛品に按分して製品の直接原価を計算し，間接費を製品に集計しないで期間原価とすることができる。この場合，当該会計期間に発生した間接費額は，これを期末の仕掛品および製品と当年度の売上品に配賦することになる。","a":false,"c":"「基準」30","e":"直接原価計算における直接原価とは変動費に相当し，製品との関連における分類でいうところの直接費とは全く異なる概念である。正しくは「変動直接費および変動間接費のみを部門に集計して部門費を計算し…固定費を製品に集計しないで期間原価とすることができる」である。また，会計年度末に処理を要するのは間接費額ではない。正しくは「当該会計期間に発生した固定費額は，これを期末の仕掛品および製品と当年度の売上品に配賦する」である。"},{"l":5,"m":"直接原価計算の利用","sb":"","r":"(Ｈ30Ⅰ①-ア他複数)","q":"総合原価計算において，必要ある場合には，一期間における製造費用のうち，変動直接費及び変動間接費のみを部門に集計して部門費を計算し，これに期首仕掛品を加えて完成品と期末仕掛品とにあん分して製品の直接原価を計算し，固定費を製品に集計しないことができる。この場合，会計年度末においては，当該会計期間に発生した固定費額は，これを期末の仕掛品および製品とに配賦する。","a":false,"c":"「基準」30","e":"固定費調整の記述に問題がある。正しくは「会計年度末においては，当該会計期間に発生した固定費額は，これを期末の仕掛品および製品と当年度の売上品とに配賦する」である。"},{"l":6,"m":"直接原価計算の利用","sb":"","r":"(Ｒ５Ⅰ⑤-ア他複数)","q":"総合原価計算において必要がある場合には，製造費用のうち変動費のみを部門に集計して部門費を計算した上で製品の直接原価を計算し，固定費を製品に集計しないことができる。この場合，会計年度末においては，当該会計期間に発生した固定費額は，これを期末の製品と当年度の売上品とに配賦する。","a":false,"c":"「基準」30","e":"固定費調整の記述に問題がある。正しくは「会計年度末においては，当該会計期間に発生した固定費額は，これを期末の仕掛品および製品と当年度の売上品とに配賦する」である。"},{"l":1,"m":"全部原価計算と直接原価計算の比較","sb":"","r":"(Ｈ27Ⅱ⑧-ア)","q":"当月において月初在庫量が月末在庫量よりも多い場合，直接原価計算による営業利益のほうが，全部原価計算による営業利益より少ない。","a":false,"c":"","e":"月初在庫量が月末在庫量よりも多いということは，販売量が生産量よりも多いということであるから，直接原価計算における固定加工費の期間費用（実際発生額＝標準配賦額＋配賦差額）は，全部原価計算における固定加工費の期間費用（標準売上原価＋配賦差額）よりも小さくなる。したがって，直接原価計算による営業利益の方が，全部原価計算による営業利益よりも大きくなる。"},{"l":2,"m":"全部原価計算と直接原価計算の比較","sb":"","r":"(Ｈ27Ⅱ⑧-イ)","q":"当月において生産量と販売量が等しい場合，直接原価計算による営業利益と全部原価計算による営業利益は等しい。","a":true,"c":"","e":"生産量と販売量が等しい場合，直接原価計算における固定加工費の期間費用（実際発生額＝標準配賦額＋配賦差額）と，全部原価計算における固定加工費の期間費用（標準売上原価＋配賦差額）は等しくなる。したがって，両者の営業利益もまた等しくなる。"},{"l":3,"m":"全部原価計算と直接原価計算の比較","sb":"","r":"(Ｈ27Ⅱ⑧-ウ)","q":"直接原価計算による営業利益は，売上高に正比例する。","a":false,"c":"","e":"直接原価計算による営業利益は売上高の一次関数で表されるが，売上高の増減にかかわらず一定額発生する固定費が存在する以上，正比例はしない。売上高に正比例するのは，売上高から変動費のみを控除した貢献利益である。"},{"l":4,"m":"全部原価計算と直接原価計算の比較","sb":"","r":"(Ｈ27Ⅱ⑧-エ)","q":"当月の生産量が前月より増加しても，前月と当月の販売価格，販売量および製品単位当たり変動費が同一ならば，前月と当月の直接原価計算による営業利益は等しい。(注)上記のＨ27Ⅱ⑧では，標準原価計算を採用していることに加え，次の⑴～⑶の前提が置かれている。⑴全ての製造間接費差異は原価計算期間(月次)の期間原価として処理する。⑵会計期間(年次)内においては，予算固定製造間接費配賦率は変化しない。⑶各月において月初および月末仕掛品は存在しない。","a":true,"c":"","e":"直接原価計算では，生産量とは無関係に一定額発生する固定加工費を期間原価として処理するため，その営業利益は生産量の増減の影響を受けない。そのため，当月の生産量が前月より増加しても，販売価格，販売量及び製品単位当たり変動費に変化がなければ，直接原価計算による営業利益は一定である。"},{"l":5,"m":"全部原価計算と直接原価計算の比較","sb":"","r":"(Ｈ22Ⅰ⑪-エ)","q":"全部原価計算を採用した場合でも，予算差異を，発生した期間の原価とせずに次期以降に繰り延べるなら，売上高に比例した営業利益を算定することができる。","a":false,"c":"","e":"売上高に比例した営業利益を算定するためには，全ての原価要素を損益計算上変動費として取り扱う必要がある。そのような計算が可能となるのは，全部原価計算において，予算差異だけでなく固定加工費の配賦差額(操業度差異)を含む全ての原価差異を繰り延べ，なおかつ固定販管費が存在しない場合においてである。なお，全部原価計算において，固定加工費の配賦差額(操業度差異)を含む全ての原価差異を次期以降に繰り延べる場合には，全ての製造原価要素を損益計算上変動費として取り扱うことになるため，その場合の売上総利益は売上高に比例することになる。"},{"l":6,"m":"全部原価計算と直接原価計算の比較","sb":"","r":"(Ｒ６Ⅱ⑦-エ)","q":"20世紀初頭の世界的な不況期において，販売量が減少し，製品在庫が増加しているにもかかわらず，営業利益が増加してしまうという実際原価計算の構造的欠陥が明らかとなった。そのため，実際生産量に応じて製品単位当たり原価が変動せず，売上高の増減と営業利益の増減が対応するように考案された計算方法が標準原価計算である。","a":false,"c":"","e":"20世紀初頭の世界的な不況期において，販売量が減少し，製品在庫が増加しているにもかかわらず，営業利益が増加してしまうという構造的欠陥が明らかとなったのは，実際原価計算ではなく全部原価計算である。また，実際生産量に応じて製品単位当たり原価が変動せず，売上高の増減と営業利益の増減が対応するように考案された計算方法は，標準原価計算ではなく直接原価計算である。"}]},{"n":8,"name":"管理会計の基礎知識","qs":[{"l":1,"m":"経営管理機能と管理会計","sb":"","r":"(Ｈ28Ⅰ⑨-エ)","q":"管理会計は，意思決定，資源配分，業績評価を行うために必要となる情報を組織内の構成員に提供する会計システムである。","a":true,"c":"","e":"要約すると，管理会計は意思決定と業績管理のための情報を提供するシステムないしツールということになる。なお，Ｈ28Ⅰ⑨の「資源配分」については，期間"},{"l":2,"m":"経営管理機能と管理会計","sb":"","r":"(Ｈ29Ⅰ⑨-ア)","q":"管理会計は，経営者が企業の新事業進出，設備投資や撤退を決定したり，経営者の部下である管理者の経済的意思決定に影響を与えるとともに，経営者がその部下の業績評価を行う際に情報を提供するツールである。","a":true,"c":"","e":"要約すると，管理会計は意思決定と業績管理のための情報を提供するシステムないしツールということになる。なお，Ｈ28Ⅰ⑨の「資源配分」については，期間\n計画設定(予算編成)に相当する。"},{"l":3,"m":"経営管理機能と管理会計","sb":"","r":"(Ｒ５Ⅱ⑨-イ)","q":"個別計画は個々の問題やプロジェクトを対象とした計画である。期間計画は将来の一定期間における部門や企業全体の総合計画であり，その期間に実施される個別計画との関係部分を含めて検討される。","a":true,"c":"「基準」１⑷","e":"個別計画は個別の意思決定問題を扱う随時的，非反復的な計画であるのに対し，期間計画は一定期間ごとに策定される経常的，反復的な計画であり，期間予算とほぼ同義と捉えられる。ここで，期間計画としての予算は，製品組合せの決定，自製か購入かの決定など，個々の選択的事項の決定を踏まえて作成されるため，その編成過程には，個別計画の検討が含まれる。"},{"l":4,"m":"経営管理機能と管理会計","sb":"","r":"(Ｈ29Ⅰ⑨-イ)","q":"管理会計を経営機能によって体系付ける場合，経営管理過程に即して計画会計と統制会計に分類したり，臨時的・非反復的に設定される個別計画に関連する意思決定会計と経常的に設定される期間計画および統制に関連する業績管理会計とに分類したりする。","a":true,"c":"","e":"経営管理機能の観点から，管理会計は，随時的な個別計画設定のための意思決定会計と，経常的な期間計画設定と統制を包括する業績管理会計に分類される。"},{"l":5,"m":"経営管理機能と管理会計","sb":"","r":"(Ｈ30Ⅰ⑨-ウ)","q":"管理会計を意思決定会計と業績管理会計に体系化する場合，期間計画設定のための管理会計を意思決定会計とし，また，個別計画を統制の出発点と捉え，個別計画と統制を併せて業績管理会計とする。","a":false,"c":"","e":"個別計画設定のための管理会計が意思決定会計，期間計画を統制の出発点と捉え，期間計画と統制を併せたものが業績管理会計である。"},{"l":6,"m":"経営管理機能と管理会計","sb":"","r":"(Ｒ５Ⅱ⑨-イ)","q":"管理会計を意思決定会計と業績管理会計に体系化した場合，期間計画と個別計画を策定するための会計が意思決定会計であり，これらの計画の実行を統制するための会計が業績管理会計である。","a":false,"c":"","e":"個別計画設定のための会計が意思決定会計であり，期間計画設定と期間計画の実行を統制するための会計が業績管理会計である。"},{"l":7,"m":"経営管理機能と管理会計","sb":"","r":"(Ｒ２Ⅱ⑨-ア)","q":"管理会計は，意思決定会計と統制会計に体系的に区分されてきた。この場合，差額原価収益分析は前者の代表的な手法となり，標準原価管理は後者の代表的な手法となる。","a":false,"c":"","e":"管理会計は，意思決定会計と業績管理会計に区分され，差額原価収益分析は前者の代表的な手法となり，標準原価管理は後者の代表的な手法となる。"},{"l":1,"m":"経営管理プロセスと管理会計","sb":"","r":"(Ｒ４Ⅱ⑨-ア)","q":"組織の経営管理のプロセスは，戦略的計画，マネジメント・コントロール，オペレーショナル・コントロールに分類される。この３つのプロセスでは，組織における階層の違いを想定していない。","a":false,"c":"","e":"組織の経営管理プロセスは，①戦略的計画(戦略策定)，②マネジメント・コントロール，③オペレーショナル・コントロール(タスク・コントロール)に分類され，①はトップ・マネジメント，②はミドル・マネジメント，③はロワー・マネジメントが中心となって計画設定と統制が実施される。したがって，上記の３つのプロセスにおいては，組織における階層の違いが想定されているといえる。"},{"l":2,"m":"経営管理プロセスと管理会計","sb":"","r":"(Ｈ29Ⅰ⑨-ウ)","q":"管理会計を経営管理の階層によって体系付ける場合，戦術的計画のための管理会計，マネジメント・コントロールのための管理会計，オペレーショナル・コントロールのための管理会計に分類される。","a":false,"c":"","e":"経営管理プロセスに基づく管理会計の体系は，経営管理階層に基づく体系と換言しうるが，その頂点にあるのは戦術的計画ではなく戦略的計画である。なお，戦略的計画とオペレーショナル・コントロールは，戦略策定とタスク・コントロールの旧称である。"},{"l":3,"m":"経営管理プロセスと管理会計","sb":"","r":"(Ｈ22Ⅱ⑪-ア)","q":"経営戦略の策定に至る諸ステップのなかで，管理会計は代替案の探索の場面においてとくに大きな貢献を果たす。","a":false,"c":"","e":"経営戦略の策定に至る諸ステップのなかで，管理会計が特に大きな貢献を果たすのは，代替案の数量的測定と評価の場面においてである。"},{"l":4,"m":"経営管理プロセスと管理会計","sb":"","r":"(Ｈ22Ⅱ⑪-エ)","q":"管理会計は，戦略そのものの策定よりも，むしろ戦略遂行ないし実行の支援において大きな貢献を担っており，そのプロセスはマネジメント・コントロールと呼ばれている。","a":true,"c":"","e":"管理会計の貢献は戦略策定のプロセスにおいても認められるが，主たる貢献は，策定された戦略の実行を支援するマネジメント・コントロールのプロセスにあるといえる。"},{"l":5,"m":"経営管理プロセスと管理会計","sb":"","r":"(Ｈ29Ⅰ⑨-エ)","q":"マネジメント・コントロールとは，特定の課業を有効かつ能率的に実行することを確保するプロセスである。","a":false,"c":"","e":"特定の課業を有効かつ能率的に実行することを確保するプロセスは，マネジメント・コントロールではなくタスク・コントロールである。その特徴は「作業」もしくは「生産プロセス」そのものをコントロールの対象とする点にあり，「人間」もしくは「人間が行う意思決定」をコントロールの対象とするマネジメント・コントロールと区別される。"},{"l":1,"m":"マネジメント・コントロールのための管理会計","sb":"","r":"(Ｈ23Ⅰ⑪-ウ)","q":"管理会計の機能は，意思決定に対する情報提供であり，情報の中身や伝達の仕方が組織成員の行動に影響を及ぼすことがあったとしても，それは本質的な機能ではない。","a":false,"c":"","e":"上位者から下位者への情報システムの本質的特徴は，意思決定の基礎となる情報の伝達よりも，意思決定を方向づけるという点にあり，それ自体がマネジメント・コントロールのための管理会計の本質的機能であるといえる。"},{"l":2,"m":"マネジメント・コントロールのための管理会計","sb":"","r":"(Ｒ２Ⅱ⑨-イ)","q":"マネジメント・コントロールは，組織目標を達成するために，経営管理者が資源を効果的・効率的に取得・利用することを確保するプロセスであると伝統的にいわれてきた。この意味で，予算管理は典型的なマネジメント・コントロールの手法である。","a":true,"c":"","e":"マネジメント・コントロールは，現代的には「経営管理者が，組織の戦略を実行すべく，他の組織成員に影響を及ぼすプロセス」と定義されるが，伝統的には，問題文のように定義されてきた。これを換言すれば「上位の管理者が，下位の管理者の意思決定を，全社目標と整合性を有するように業績管理を通じてコントロールするプロセス」であり，業績管理の主たる手法が予算管理である以上，予算管理は典型的なマネジメント・コントロールの手法であるといえる。"},{"l":3,"m":"マネジメント・コントロールのための管理会計","sb":"","r":"(Ｈ27Ⅱ⑪-ウ)","q":"マネジメント・コントロール・システムにより，管理者・従業員は，組織目標を達成するために必要となる行動を理解することができる。","a":true,"c":"","e":"組織戦略の実行を支援するマネジメント・コントロール・システムは，ＢＳＣと予算を中核とする業績管理システムであり，ＢＳＣの作成や予算目標の設定・示達を通じて，管理者・従業員が，組織目標を達成するために必要となる行動を理解することを可能にする。"},{"l":4,"m":"マネジメント・コントロールのための管理会計","sb":"","r":"(Ｈ27Ⅱ⑪-エ)","q":"マネジメント・コントロール・システムでは，企業内部で得られる情報のみならず，企業外部から得られる情報も利用される。","a":true,"c":"","e":"マネジメント・コントロール・システムは，組織戦略の実行を支援するための業績管理システムといえるが，その目的を達成するためには，競合他社の動向把握や，最善ないしより良い実務に学ぶベンチマーキングが必須となる。"},{"l":5,"m":"マネジメント・コントロールのための管理会計","sb":"","r":"(Ｒ６Ⅰ⑨-イ他複数)","q":"マネジメント・コントロールは，人間若しくは人間が行う意思決定を対象とし，動機付けやその他の行動的な効果が期待できる管理技法の適用が望まれるため，財務情報だけでなく非財務情報も重視される。","a":true,"c":"","e":"マネジメント・コントロールは，組織構成員を戦略の実現に向けて動機づけ，方向づけるプロセスであるが，組織が財務的な成果をあげるためには，顧客，業務プロセス，学習と成長といった非財務的視点の改善に焦点を当てる必要がある。したがって，財務情報だけでなく非財務情報も当然に重視される。"},{"l":1,"m":"管理会計情報の特徴","sb":"","r":"(Ｈ28Ⅱ⑪-ア)","q":"財務会計情報は外部利害関係者に提供されるのに対して，管理会計情報は内部利害関係者に提供される。","a":true,"c":"","e":"財務会計と管理会計とでは，情報の利用者(利害関係者)が異なる。"},{"l":2,"m":"管理会計情報の特徴","sb":"","r":"(Ｈ28Ⅱ⑪-エ)","q":"財務会計情報の役割は利害関係者の利害調整や利益配分に重点が置かれるが，管理会計情報の役割は経営者の経営責任を明らかにすることに重点が置かれている。","a":false,"c":"","e":"管理会計はあくまでも内部管理用の情報システムであり，管理会計情報の役割は経営管理者の業績管理及び意思決定に資することに重点が置かれている。"},{"l":3,"m":"管理会計情報の特徴","sb":"","r":"(Ｈ24Ⅱ⑪-エ)","q":"ＩＦＲＳ(国際財務報告基準)の導入は，管理会計と財務会計が同じ会計フレームワークを使用することを強制する。","a":false,"c":"","e":"いわゆるマネジメント・アプローチの採用は，その部分について財管一致を意味するが，ＩＦＲＳの導入それ自体は，管理会計と財務会計が同じ会計フレームワークを使用することを強制するものではない。"},{"l":4,"m":"管理会計情報の特徴","sb":"","r":"(Ｈ23Ⅰ⑪-オ)","q":"財務会計情報には客観性や検証可能性など，具備しなければならないとされる複数の要件があるが，管理会計情報には，有用性を除けばそのような要件は存在しない。","a":true,"c":"","e":"管理会計は，企業内部の経営管理者に情報を提供するシステムであるから，財務会計のような厳密なルールは存在せず，そのアウトプット情報については，情報利用者である経営管理者にとっての有用性(情報ニーズに対する適合性)のみが唯一の要件とされる。"},{"l":5,"m":"管理会計情報の特徴","sb":"","r":"(Ｈ24Ⅱ⑪-イ)","q":"管理会計情報が備えなくてはならない要件とは，株主の情報ニーズと実際に提供される情報との適合性である。","a":false,"c":"","e":"管理会計情報が具備すべき唯一の要件は有用性であり，それは情報利用者である経営管理者の情報ニーズと実際に提供される情報との適合性を意味する。"},{"l":6,"m":"管理会計情報の特徴","sb":"","r":"(Ｈ28Ⅱ⑪-ウ)","q":"会計情報の質について，財務会計においては正確性や適法性などの概念が適用され，管理会計においては目的適合性や適時性などの概念が適用される。","a":true,"c":"","e":"外部利害関係者を情報利用者とする財務会計においては，正確性や適法性などの外部報告に関連する概念が適用されるのに対して，内部利害関係者を情報利用者とする管理会計においては，目的適合性や適時性などの内部管理に関連する概念が適用される。"},{"l":7,"m":"管理会計情報の特徴","sb":"","r":"(Ｒ４Ⅱ⑨-イ)","q":"管理会計では，経営管理への役立ちという観点から，企業内部の経営管理者に対して目的適合的で有用な情報を提供することが求められる。そのため，管理会計情報では，適時性と迅速性が重視される。","a":true,"c":"","e":"有用性の内容は，経営管理者の情報ニーズに依存するが，一般的には，適時性と迅速性が重視されるといわれる。勿論，迅速性よりも正確性を重視する経営管理者もいるだろうが，ここでは正確性を軽視すると言っているわけではなく，少なくとも本肢を×とする理由はない。"},{"l":8,"m":"管理会計情報の特徴","sb":"","r":"(Ｒ６Ⅱ⑨-ア)","q":"管理会計情報は，経営管理に役立つことが期待されているため，各種の経営意思決定に提供される管理会計情報には客観性や確実性が求められる。","a":false,"c":"","e":"管理会計情報において，一般的に重視されるのは適時性や迅速性であり，経営意思決定に提供される管理会計情報が未来情報である以上，そもそも客観性や確実性を求めることは困難である。"},{"l":9,"m":"管理会計情報の特徴","sb":"","r":"(Ｈ31Ⅰ⑨-イ)","q":"管理会計情報の備えるべき性質の一つは有用性である。それゆえ，経営管理者の必要があれば，月の途中で，物量情報のみならず金額情報についても前日までの実績を集計し，月次の予定との比較を行う。","a":true,"c":"","e":"管理会計情報が具備すべき要件は有用性(経営管理者の情報ニーズとの適合性)のみであるから，経営管理者が期中統制を重視するならば，月の途中で，物量情報のみならず金額情報についても前日までの実績を集計し，月次の予定との比較を行うこともある。"},{"l":10,"m":"管理会計情報の特徴","sb":"","r":"(Ｈ21⑪-イ)","q":"管理会計にも決められたルールがあり，企業独自の工夫は客観性の観点から認められない。","a":false,"c":"","e":"管理会計情報が具備すべき要件は有用性(経営管理者の情報ニーズとの適合性)のみであり，財務会計のように比較可能性や客観性が厳密に求められるわけではな"},{"l":11,"m":"管理会計情報の特徴","sb":"","r":"(Ｒ６Ⅰ⑨-エ他複数)","q":"管理会計には会計原則などのルールは存在しないが，比較可能性や客観性を維持するためにも，企業独自の工夫は最小限にすべきである。","a":false,"c":"","e":"管理会計情報が具備すべき要件は有用性(経営管理者の情報ニーズとの適合性)のみであり，財務会計のように比較可能性や客観性が厳密に求められるわけではな\nい。そのため，有用性(目的適合性)を充足するのであれば，企業独自の工夫も当然に認められる。"},{"l":12,"m":"管理会計情報の特徴","sb":"","r":"(Ｈ23Ⅰ⑪-エ)","q":"管理会計はいかなる法規制にも影響されないといわれるが，実務にあっては，法規制からまったく無縁なシステムなど存在しない。","a":true,"c":"","e":"管理会計の情報利用者である経営管理者は，売上高や営業利益，営業活動によるキャッシュ・フローなど，様々な社会的法規制のもとに測定される財務会計上の数値の最大化を志向する。経営管理者が財務会計情報を必要とする以上，現実には，社会的法規制と無縁の管理会計システムなど存在しないといえる。"},{"l":13,"m":"管理会計情報の特徴","sb":"","r":"(Ｈ21⑪-キ)","q":"管理会計と財務会計は異なる目的を持つが，管理会計では財務会計で用いられるデータを使用してもかまわない。","a":true,"c":"","e":"経営管理者が求めるならば，管理会計において財務会計で用いられるデータを使用することに何ら制約はない。また，財務情報分析のように，財務会計情報を利用した管理会計技法もある。"},{"l":14,"m":"管理会計情報の特徴","sb":"","r":"(Ｈ21⑪-カ)","q":"管理会計と財務会計は異なる目的を持つので，管理会計では財務会計で用いられるデータを使用することはない。","a":false,"c":"","e":"上記Ｈ21⑪の肢の解説を参照のこと。"},{"l":15,"m":"管理会計情報の特徴","sb":"","r":"(Ｈ30Ⅱ⑨-ア)","q":"管理会計においては，外部報告ではなく内部管理を目的とし，有用性の観点が重視されるため，財務会計的な解釈や技法が適用されることは認められない。","a":false,"c":"","e":"上記Ｈ21⑪の肢の解説を参照のこと。"},{"l":16,"m":"管理会計情報の特徴","sb":"","r":"(Ｈ21⑪-オ)","q":"管理会計では正確性の高い情報を提供する必要があるので，過去に確定したデータのみを使用し，未来情報は使用しないほうがよい。","a":false,"c":"","e":"期間計画としての予算の編成や，個別計画設定(意思決定)を支援する差額原価収益分析に際しては，未来情報が不可欠であり，事前情報を把握することが重視さ"},{"l":17,"m":"管理会計情報の特徴","sb":"","r":"(Ｈ24Ⅱ⑪-ウ)","q":"管理会計は企業活動について事前情報を把握することを重視していない。","a":false,"c":"","e":"期間計画としての予算の編成や，個別計画設定(意思決定)を支援する差額原価収益分析に際しては，未来情報が不可欠であり，事前情報を把握することが重視さ\nれる。"},{"l":18,"m":"管理会計情報の特徴","sb":"","r":"(Ｈ23Ⅰ⑪-ア)","q":"管理会計システムからアウトプットされる情報は未来情報であり，過去情報が含まれることはない。","a":false,"c":"","e":"管理会計システムは，期中統制や事後統制段階において過去情報(実績記録情報)もアウトプットする。"},{"l":19,"m":"管理会計情報の特徴","sb":"","r":"(Ｈ21⑪-エ)","q":"管理会計では，貨幣額により測定されるデータだけでなく，非財務的尺度により測定されるデータも利用される。","a":true,"c":"","e":"財務尺度に偏重した業績測定は，近視眼的な意思決定行動をもたらすとの反省から，近年は，非財務的尺度により測定されたデータを利用したプロセス重視の管理会計が浸透している。"},{"l":20,"m":"管理会計情報の特徴","sb":"","r":"(Ｈ24Ⅱ⑪-オ)","q":"管理会計システムのアウトプット情報としては，財務情報と非財務情報がある。","a":true,"c":"","e":"非財務的な尺度の改善は，一定のプロセスあるいは期間を経過した後に，財務的な成果に結び付くという特徴がある。この因果関係を合理的に識別できる場合に"},{"l":21,"m":"管理会計情報の特徴","sb":"","r":"(Ｒ２Ⅱ⑨-エ)","q":"管理会計の目的は，経営管理に有用な情報を提供することである。管理会計によって提供される情報は，目的適合性や適時性が重視され，財務情報だけでなく非財務情報も含まれる。","a":true,"c":"","e":"非財務的な尺度の改善は，一定のプロセスあるいは期間を経過した後に，財務的な成果に結び付くという特徴がある。この因果関係を合理的に識別できる場合に\nは，非財務情報も管理会計システムのアウトプット情報と見ることができる。"},{"l":22,"m":"管理会計情報の特徴","sb":"","r":"(Ｈ31Ⅱ⑨-ア)","q":"管理会計情報は，内部利害関係者に提供されるが，貨幣情報が原則であり，物量などの非財務情報が含まれることはない。","a":false,"c":"","e":"会計である以上，管理会計情報の多くは貨幣情報(財務情報)であるが，物量などの非財務情報も含まれる。"},{"l":23,"m":"管理会計情報の特徴","sb":"","r":"(Ｈ22Ⅱ⑪-オ)","q":"管理会計システムでは，財務的な情報ばかりでなく，戦略の策定に必要な非定量的な情報もアウトプットしており，かつ後者の非定量的な情報の割合は近年ますます大きくなってきている。","a":false,"c":"","e":"管理会計がアウトプットするのは，全て定量化された財務情報と非財務情報であり，正しくは「戦略の策定に必要な非財務的な情報もアウトプットしており，かつ後者の非財務的な情報の割合は近年ますます大きくなってきている」である。また，非財務的情報をアウトプットする目的は，戦略の策定よりも，むしろ戦略の実行を支援するという点にあるため，より正しくは「戦略の実行に必要な非財務的な情報も…」となる。"},{"l":24,"m":"管理会計情報の特徴","sb":"","r":"(Ｈ28Ⅱ⑪-イ)","q":"会計情報の測定尺度として，財務会計では財務情報すなわち貨幣価値情報が用いられ，管理会計では財務情報と，定量情報や定性情報の全ての非財務情報が用いられる。","a":false,"c":"","e":"管理会計がアウトプットするのは，全て定量化された財務情報と非財務情報であり，定性情報は含まれない。"},{"l":1,"m":"管理会計の領域と管理会計システムの設計","sb":"","r":"(Ｈ21⑪-ア)","q":"管理会計情報は，経理部以外の部門，例えば経営企画部などでも作成されることもあれば，利用されることもある。","a":true,"c":"","e":"財務的な管理会計情報の作成については経理部が主体となるが，たとえば，経営戦略，製品開発などに関わる管理会計情報の作成は経営企画部が担当することになる。また，管理会計情報は社内の全ての責任単位において利用される。"},{"l":2,"m":"管理会計の領域と管理会計システムの設計","sb":"","r":"(Ｈ22Ⅰ⑪-ア)","q":"管理会計は，連結企業集団などの企業グループ全体の業績管理を対象とするのではなく，個別企業の業績管理だけを対象とする。","a":false,"c":"","e":"グループ経営の浸透により，個別企業の業績管理だけでなく，連結企業集団などの企業グループ全体の業績管理も管理会計の対象となっている。"},{"l":3,"m":"管理会計の領域と管理会計システムの設計","sb":"","r":"(Ｈ22Ⅰ⑪-イ)","q":"個別企業の全社業績は損益計算書などの財務諸表で測定されるので，その業績管理は管理会計の対象ではない。","a":false,"c":"","e":"個別企業の全社業績は損益計算書などの財務諸表で測定されるが，業績の管理（計画と統制）は予算を用いて行われる。したがって，個別企業の業績管理も管理会計の対象である。"},{"l":4,"m":"管理会計の領域と管理会計システムの設計","sb":"","r":"(Ｒ６Ⅰ⑨-ウ他複数)","q":"管理会計では，事業部や社内カンパニーなどの組織単位ごとに，損益計算書に加えて貸借対照表を作成する場合があるが，組織単位ごとの貸借対照表を合算した数値が全社の貸借対照表の数値と一致しない場合がある。","a":true,"c":"","e":"事業部や社内カンパニーなどの組織単位ごとに貸借対照表を作成する場合，本社資産や共用資産については必ずしも各組織単位に配賦，計上されない。したがって，組織単位ごとの貸借対照表を合算しても，全社の貸借対照表とは必ずしも一致しないし，そもそも内部管理用に作成するのであるから一致する必要もない。"},{"l":5,"m":"管理会計の領域と管理会計システムの設計","sb":"","r":"(Ｈ31Ⅱ⑨-エ他複数)","q":"管理会計では，事業部や社内カンパニーなどの組織単位ごとに，損益計算書に加えて貸借対照表を作成する場合があるが，全社の目標整合性やコーポレート・ガバナンスの観点から，組織単位ごとの貸借対照表を合算した数値は，全社の貸借対照表の数値と一致する必要がある。","a":false,"c":"","e":"上記Ｒ６Ⅰ⑨の肢の解説を参照のこと。"},{"l":6,"m":"管理会計の領域と管理会計システムの設計","sb":"","r":"(Ｈ22Ⅰ⑪-エ)","q":"製造活動については，原価計算により製造原価が計算されているので，管理会計がそれ以外につけ加える情報はない。","a":false,"c":"","e":"原価計算により製造原価が計算されているのみでは，原価管理を効果的に実施することはできない。各種差異情報や，仕損率，歩留率，工数といった非財務的情報を含め，管理会計がつけ加えるべき情報は多岐に渡る。"},{"l":7,"m":"管理会計の領域と管理会計システムの設計","sb":"","r":"(Ｈ21⑪-ウ)","q":"管理会計情報は，製造部門の原価管理だけを目的として作成される。","a":false,"c":"","e":"管理会計の目的は多岐に渡り，製造部門の原価管理のみならず，分権組織や会社全体の業績管理，意思決定などの目的に対しても管理会計情報は作成される。"},{"l":8,"m":"管理会計の領域と管理会計システムの設計","sb":"","r":"(Ｈ22Ⅰ⑪-オ)","q":"研究開発部門で行われる活動は知的な創造活動であり，その活動の成果を定量的に測定することはむずかしいが，研究開発部門に予算管理などの管理会計手法を適用することはできる。","a":true,"c":"","e":"研究開発費は，経営管理者が毎期政策的に支出額を決定する自由裁量固定費（マネジド・コスト）であるから，毎期の予算で管理することができる。したがって，研究開発部門に対してゼロベース予算や割当予算などの管理会計手法を適用することは可能である。"},{"l":9,"m":"管理会計の領域と管理会計システムの設計","sb":"","r":"(Ｈ22Ⅰ⑪-カ)","q":"管理会計は組織単位で適用されるので，個別のプロジェクト単位で適用することは，組織の業績評価との関係をあいまいにするので好ましくない。","a":false,"c":"","e":"設備投資など個別のプロジェクトの評価は責任会計から独立して行われるのが通常であるし，組織単位とは別に個別のプロジェクト単位で権限・責任関係を明ら"},{"l":10,"m":"管理会計の領域と管理会計システムの設計","sb":"","r":"(Ｈ27Ⅰ⑨-エ)","q":"管理会計の報告・責任単位は組織単位と対応しているので，個別のプロジェクト単位に管理会計の手法を適用することは，責任・権限関係をあいまいにするので認められない。","a":false,"c":"","e":"設備投資など個別のプロジェクトの評価は責任会計から独立して行われるのが通常であるし，組織単位とは別に個別のプロジェクト単位で権限・責任関係を明ら\nかにし，その業績管理を行う場合もある。このように，管理会計は個別のプロジェクト単位にも適用される。"},{"l":11,"m":"管理会計の領域と管理会計システムの設計","sb":"","r":"(Ｈ28Ⅰ⑨-イ)","q":"管理会計は外部の利害関係者との調整機能を有しているため，管理会計システムの設計を行う場合，企業内の管理者・従業員のみならず，外部の利害関係者による利用をも考慮に入れながら設計を行うべきである。","a":false,"c":"","e":"管理会計は企業内部の経営管理者への情報提供を目的としており，外部の利害関係者との調整機能は有していない。したがって，管理会計システムの設計を行う場合に，外部の利害関係者による利用を考慮する必要はない。"},{"l":12,"m":"管理会計の領域と管理会計システムの設計","sb":"","r":"(Ｈ28Ⅱ⑨-ア)","q":"管理会計システムを構築する際，短期的な成果と長期的な成果を評価できるような評価尺度の利用を考慮すべきである。","a":true,"c":"","e":"管理会計システムにおいて，短期的な成果尺度のみを利用すれば，組織構成員の近視眼的な行動を誘発する結果として，組織戦略の実行に支障をきたすことになる。したがって，短期的な成果と長期的な成果の双方を評価できるような評価尺度の利用を考慮すべきである。具体的には，非財務尺度で財務尺度を補完するということである。"},{"l":13,"m":"管理会計の領域と管理会計システムの設計","sb":"","r":"(Ｈ28Ⅱ⑨-イ)","q":"管理会計システムを選択する際，そのシステムから入手できる情報のベネフィットと情報を入手するためのコストとのバランスを考慮すべきである。","a":true,"c":"","e":"管理会計に限らず，システムの選択に当たって，費用対効果を考慮すべきことは言うまでもない。"},{"l":1,"m":"責任会計の概念","sb":"","r":"(Ｈ28Ⅰ⑨-ア)","q":"責任センターとは組織の構成単位であり，その管理者は責任センターで行われる特定の活動について責任を持っている。","a":true,"c":"","e":"責任センターの管理者が責任を負うべき範囲は与えられた権限の範囲によって規定されるため，責任センターで行われる特定の活動について責任を持っているといえる。"},{"l":2,"m":"責任会計の概念","sb":"","r":"(Ｈ25Ⅰ⑭-ア)","q":"管理可能性原則とは，企業内の各部門への予算配分額が，当該部門管理者の管理能力の高さに比例して決定されるという原則を指す。","a":false,"c":"","e":"管理可能性原則とは，当該管理者の権限の範囲に対応して責任の範囲を決定し，その範囲(管理可能な範囲)のみを業績評価の対象とするという原則を指す。"},{"l":3,"m":"責任会計の概念","sb":"","r":"(Ｈ31Ⅰ⑨-ア)","q":"管理可能費は，その責任センターの管理者が，その発生額に対して完全な影響を及ぼすことのできる原価である。それゆえ，主材料の価格は，購買活動の良否のみでなく，企業外部の市況の変化にも左右され，購買部門の長にとっては，その発生額に完全な影響を及ぼすことができないため，管理可能費ではない。","a":false,"c":"","e":"管理階層に関わらず，一人の管理者が完全にコントロール可能な原価の存在は稀であり，特定の管理者が，他の管理者と比べて相対的に影響を及ぼすことができるならば，これを管理可能とみなすことになる。したがって，主材料の価格は，購買活動の良否のみでなく，企業外部の市況の変化によっても左右されるが，購買部門の長は同一階層の他の管理者と比べて相対的に影響を及ぼすことができるため，彼にとっての管理可能費とみることになる。"},{"l":4,"m":"責任会計の概念","sb":"","r":"(Ｒ２Ⅰ⑨-イ)","q":"責任センター別に集計される原価データのうち，ある費目が管理可能であるか管理不能であるかは，業績測定期間の長短によって変化する。当該期間が短ければ短いほど，特定の経営管理者にとっての管理可能費は多くなる。","a":false,"c":"","e":"管理可能性は，業績測定期間との関係で相対的な概念である。当該期間が短ければ短いほど，特定の経営管理者の影響力の程度は相対的に低下するため，管理可能費は少なくなる。"},{"l":5,"m":"責任会計の概念","sb":"","r":"(Ｒ５Ⅰ⑨-ア)","q":"管理可能費とは，管理者がその発生額に実質的に影響を与えることのできる費用のことであり，その管理者が担当する責任センター内で発生した費用のみが含まれる。","a":false,"c":"","e":"管理可能費とは，管理者がその発生額に実質的に影響を与えることのできる費用をいうが，責任センター間の相互依存性を考慮すれば，その範囲は，当該管理者が担当する責任センター内で発生した費用のみに限定されるわけではない。例えば，補助部門変動費は補助部門において発生するが，適切な方法（予定配賦ないし標準配賦）で製造部門に配賦された金額は，当該製造部門の用役消費に応じて発生したものであるから，当該製造部門において管理可能費とみなされる。"},{"l":6,"m":"責任会計の概念","sb":"","r":"(Ｈ25Ⅰ⑭-ウ)","q":"責任会計のもとで責任センター長に任命された者は，予算策定時に表明した年次目標が未達に終わった場合，次年度終了時までは，経営者，他の従業員，株主，銀行など社内外のステークホルダーに対して，原因と対策に関する説明責任を有する。","a":false,"c":"","e":"責任会計は，あくまでも内部管理用の管理会計システムである。したがって，目標が未達に終わった場合，責任センター長は，経営者や他の従業員など社内のステークホルダーに対する説明責任を有するものの，株主，銀行など社外のステークホルダーに対する説明責任はない。"},{"l":7,"m":"責任会計の概念","sb":"","r":"(Ｒ４Ⅰ⑬-ウ)","q":"製造部門のようなコスト・センターの場合，原価の発生額についてのみ意思決定権限を有するため，プロフィット・センターとしての業績管理が行われることはない。","a":false,"c":"","e":"製造部門は生来的にはコスト・センターとして位置付けられるが，利益動機からの製造活動を促すために，プロフィット・センターとしての業績管理が行われることもある。この場合，収益を擬制するべく，内部振替価格制度を採用するなどの工夫が必要となる。"},{"l":8,"m":"責任会計の概念","sb":"","r":"(Ｈ26Ⅱ⑫-イ)","q":"営業部門をレベニュー・センターとして扱う場合であっても，販売費は営業部門の責任範囲として管理される。","a":true,"c":"","e":"レベニュー・センターとは，収益（売上高）とその獲得に直接かかわる費用（販売費）について責任を負う責任センターをいう。したがって，営業部門をレベニュー・センターとして扱う場合であっても，販売費は営業部門の責任範囲として管理される。"},{"l":9,"m":"責任会計の概念","sb":"","r":"(Ｒ６Ⅱ⑨-ア)","q":"責任センターは，与えられた権限で管理可能な範囲の業績に基づいて評価されるべきである。したがって，インベストメント・センターは投資に関する一定の意思決定権限が与えられるが，外部からの資本調達の権限を有さないので，その業績評価に資本コスト額を考慮することはない。","a":false,"c":"","e":"インベストメント・センターとしての事業部やカンパニーは，外部からの資本調達の権限を有するわけではないが，本社が調達した資本について資本コストがかかる以上，その投資活動において資本コストの回収を動機づける必要がある。したがって，インベストメント・センターの業績評価においては，むしろ資本コスト額を考慮することが求められる。"},{"l":10,"m":"責任会計の概念","sb":"","r":"(Ｈ31Ⅱ⑨-ウ)","q":"責任会計は，組織上の責任センターごとに，業績を評価するための財務情報を提供する会計システムであり，事業部制組織だけではなく，職能別組織においても適用される。","a":true,"c":"","e":"責任会計とは，組織上の責任センターごとに，業績を評価するための財務情報を管理可能性原則に則って提供する会計システムであり，その適用は，組織形態とは無関係である。分権化によって責任会計の重要性が増すという解釈はできるが，事業部制組織だけでなく，職能別組織においても責任会計は適用される。"},{"l":11,"m":"責任会計の概念","sb":"","r":"(Ｈ29Ⅱ⑨-イ)","q":"責任会計システムは，標準や予算の設定，実績との比較，差異分析などを階層的な組織の責任構造や管理可能性に基づいて行う体系的な会計コントロール・システムであり，専ら職能別組織において適用される。","a":false,"c":"","e":"責任会計システムは，職能別組織と事業部制組織のいずれにおいても適用される。"},{"l":12,"m":"責任会計の概念","sb":"","r":"(Ｒ６Ⅰ⑨-ア)","q":"責任会計システムは，標準や予算の設定，実績との比較，差異分析などを階層的な組織の責任構造や管理可能性に基づいて行う体系的な会計コントロール・システムであり，専ら事業部制組織において適用される。","a":false,"c":"","e":"責任会計システムは，職能別組織と事業部制組織のいずれにおいても適用される。"},{"l":13,"m":"責任会計の概念","sb":"","r":"(Ｈ23Ⅰ⑪-イ)","q":"まれにロワーレベル(lowerlevel)のマネージャーに対して利益責任が付与されることもあるが，末端の従業員が利益責任を追及されることはない。","a":false,"c":"","e":"アメーバ経営のように，ロワーレベルの管理者だけでなく，現場の従業員が利益責任を負うことがある。"},{"l":14,"m":"責任会計の概念","sb":"","r":"(Ｈ30Ⅱ⑨-エ)","q":"ロワーレベルの管理者だけでなく，現場の従業員が利益責任を負うことがあるが，これは管理会計の範囲内の考え方である。","a":true,"c":"","e":"現場の従業員に利益責任を課すという方法は，伝統的な管理可能性原則に準拠するものではないが，利益動機からの活動を促すという点において，管理会計の範囲内の考え方であるといえる。"},{"l":15,"m":"責任会計の概念","sb":"","r":"(Ｒ２Ⅰ⑯-ア)","q":"責任会計の役割は二面性を有する。すなわち，上位者が下位者の業績を審査するための情報を提供するのみならず，下位者が自己の行動を管理するためのフィードバック情報をも提供する。","a":true,"c":"","e":"責任会計は，下位者の業務活動に関する計画と実績，差異を管理可能性原則に則って測定することで，上位者が下位者の業績を審査するための情報を提供する。また，それらの情報は，下位者が自己の行動の欠陥や改善策を検討するためのフィードバック情報となる。"},{"l":1,"m":"バランスト・スコアカード(ＢＳＣ)","sb":"","r":"(Ｒ２Ⅰ⑨-エ)","q":"バランスト・スコアカード(balancedscorecard，ＢＳＣ)を必要とした主たる理由として，財務目標に偏ったため経営が短期志向になっていること，戦略を立案したもののその実行が伴ってこなかったこと，戦略的に重要な資産である無形資産の価値を評価してこなかったこと，がある。現在では，ＢＳＣは，単なる業績測定システムのみならず，戦略マネジメント・システムへと発展している。","a":true,"c":"","e":"ＢＳＣの第一義的な特徴は，非財務的な視点と尺度を業績測定システムに取り入れた点にあるが，スコアカードに加えて戦略マップが提唱されたことにより，現在では，無形資産を利用した価値創造のシナリオを記述，測定，評価する戦略マネジメント・システムへと発展している。"},{"l":2,"m":"バランスト・スコアカード(ＢＳＣ)","sb":"","r":"(Ｈ30Ⅱ⑨-ウ)","q":"バランスト・スコアカードは，非財務情報が将来的な財務成果に結び付くという因果関係が識別可能であるので，それはマネジメント・コントロールの技法の一つである。","a":true,"c":"","e":"ＢＳＣは，戦略マップとスコアカードのそれぞれにおいて，無形資産が幾つかの中間的な因果連鎖を経由して将来的な財務成果に結び付くシナリオを明示する。したがって，組織構成員を戦略の実行に向けて方向付けるマネジメント・コントロール技法の一つであるといえる。"},{"l":3,"m":"バランスト・スコアカード(ＢＳＣ)","sb":"","r":"(Ｈ31Ⅰ⑨-エ)","q":"バランスト・スコアカード(ＢＳＣ)には，財務の視点，顧客の視点，内部プロセスの視点，学習と成長の視点の四つの視点が存在する。ＢＳＣにおける因果関係とは，四つの視点間の関係を示すものではなく，戦略目標とそれを具体的に示す尺度，その目標値とそれを達成するための戦略的実施項目という目的・手段の関係を意味するものである。","a":false,"c":"","e":"ＢＳＣにおける因果関係とは，スコアカードにおける戦略目標，尺度，目標値，戦略的実施項目という目的・手段の関係(横の因果連鎖)だけでなく，戦略マップ及びスコアカードにおける「学習と成長→業務プロセス→顧客→財務」という四つの視点間の因果関係(縦の因果連鎖)をも意味する。"},{"l":4,"m":"バランスト・スコアカード(ＢＳＣ)","sb":"","r":"(Ｈ31Ⅱ⑨-イ)","q":"バランスト・スコアカード(ＢＳＣ)における戦略マップとは，財務の視点，顧客の視点，内部ビジネス・プロセスの視点，学習と成長の視点の四つの視点において設定された戦略目標を矢印で結び，戦略目標間の因果関係を表現する手法である。","a":true,"c":"","e":"戦略マップは，四つの視点戦略目標間の因果関係(縦の因果連鎖)を可視化することで，戦略実行の道筋を組織構成員に浸透させる戦略コミュニケーションのための手法(ツール)である。"},{"l":5,"m":"バランスト・スコアカード(ＢＳＣ)","sb":"","r":"(Ｒ４Ⅱ⑨-エ)","q":"バランスト・スコアカード(ＢＳＣ)では，非財務の視点と財務の視点との間で因果関係が想定される。ここにおいて，非財務的な業績の向上が財務的な業績の向上に至るまでのタイム・ラグは考慮されない。","a":false,"c":"","e":"非財務尺度の改善が財務尺度の改善をもたらすまでにはタイム・ラグがあるため，業績測定・評価を通じて組織構成員を戦略の実行へと動機づけるには，各期の非財務尺度の改善を当該期の業績として測定・評価する必要がある。したがって，ＢＳＣでは，当期の非財務尺度の改善が次期以降の財務尺度の改善をもたらすと想定される場合であっても，非財務尺度の改善自体は当期の業績と見る。つまり，非財務的な業績の向上が，財務的な業績の向上に至るまでのタイム・ラグが考慮されている。"},{"l":6,"m":"バランスト・スコアカード(ＢＳＣ)","sb":"","r":"(Ｈ23Ⅱ⑬-イ)","q":"ＢＳＣの導入において業績評価指標として非財務指標を使用する場合，企業内の公式の業績評価システムとしてＢＳＣを導入する場合であっても，財務指標と非財務指標との間の統計的因果関係を必ずしも検証する必要はない。","a":true,"c":"","e":"非財務指標を業績評価に利用する場合には，財務指標との因果関係が統計的に実証されていることが望ましい。ただし，ＢＳＣの導入期においてそれは不可能であるし，だからといって非財務指標の利用が制限されるならば，ＢＳＣの導入は遅々として進まない。そこで，現実には，両者の因果関係についての仮説を統計的に検証し，因果関係が認められなければ他の非財務指標に変更するという作業を繰り返すことになる。"},{"l":7,"m":"バランスト・スコアカード(ＢＳＣ)","sb":"","r":"(Ｈ22Ⅱ⑪-イ)","q":"管理会計は，企業戦略の策定場面においても大きな貢献を果たす。戦略マップは戦略策定のための典型的な手法である。","a":false,"c":"","e":"戦略マップはＢＳＣの各視点に展開された戦略目標間の因果関係を図示したものであり，戦略策定よりもむしろ戦略実行のための典型的手法であるといえる。"},{"l":8,"m":"バランスト・スコアカード(ＢＳＣ)","sb":"","r":"(Ｈ27Ⅰ⑨-イ)","q":"近年，管理会計の役割として戦略の策定や実行について注目されるようになってきた。このうち，戦略マップは戦略の策定および実行に関して有効なツールの一つである。","a":true,"c":"","e":"戦略マップは，策定された戦略を達成するための道筋を明らかにするものであるから，生来的には，戦略の実行を支援するツールであるといえる。ただし，戦略マップの作成を通じて戦略が明確化されたり，トップ・マネジメントレベルでのコンセンサスが得られたりする側面もあり，戦略マップは，戦略の策定に関しても一定の貢献を有している。以上より，戦略マップは戦略の策定及び実行に関して有効なツールの一つであるといえる。"},{"l":9,"m":"バランスト・スコアカード(ＢＳＣ)","sb":"","r":"(Ｈ23Ⅱ⑬-エ)","q":"ＢＳＣでは，ＰＤＣＡ(Plan-Do-Check-Action)サイクルにビジョンや戦略を反映させ，かつトップダウンおよびボトムアップのダブルループの学習プロセスを活用することで，既存の戦略の実現のみならず新たな戦略を生み出すことが可能となる。","a":true,"c":"","e":"ＢＳＣによる戦略マネジメントは，戦略の策定→戦略の実行→戦略の検証→戦略の見直しというＰＤＣＡサイクルを有し，トップ・マネジメントレベルの戦略学習を促進するとともに，戦略学習ループ（トップダウン）と業務管理ループ（ボトムアップ）のダブルループの組織学習を通じて，新たな戦略の創発を可能にする。"},{"l":1,"m":"プロダクト・ポートフォリオ・マネジメント(ＰＰＭ)","sb":"","r":"(Ｒ５Ⅰ⑨-イ)","q":"ボストン・コンサルティング・グループにより開発されたプロダクト・ポートフォリオ・マネジメント(productportfoliomanagement)は，個別の事業単位ではなく，事業の組合せが企業全体のキャッシュ・フローに与える効果の観点から企業戦略を策定する分析ツールである。","a":true,"c":"","e":"ＰＰＭとは，多角化企業において，希少資源，とりわけ資金をいかに効果的に各事業に配分するかということに焦点を当てた手法をいう。このうち，ＢＣＧにより開発されたＰＰＭは，資金需要を示す市場成長率と資金供給能力を示す相対的マーケット・シェアを二軸に取り，そのフレームワークの中に各種の事業をマッピングすることで，効果的な資金配分とその流れを分析するものであり，企業戦略(全社戦略)の策定に利用される。"},{"l":2,"m":"プロダクト・ポートフォリオ・マネジメント(ＰＰＭ)","sb":"","r":"(Ｒ２Ⅰ⑨-ア)","q":"プロダクト・ポートフォリオ・マネジメント(ＰＰＭ)はボストン・コンサルティング・グループが開発したモデルが最も基本的である。ＰＰＭの図の二つの軸には，市場成長率と自社の絶対的マーケット・シェアの指標が採用される。","a":false,"c":"","e":"ＢＣＧが開発したＰＰＭの図の二つの軸には，市場成長率と自社の相対的マーケット・シェアが採用される。なお，相対的マーケット・シェアとは，最大手競争企業の製品が占めるシェアと対比した自社製品のシェアの割合を意味する。"},{"l":3,"m":"プロダクト・ポートフォリオ・マネジメント(ＰＰＭ)","sb":"","r":"(Ｒ３⑨-ア)","q":"ボストン・コンサルティング・グループが開発したプロダクト・ポートフォリオ・マネジメント(productportfoliomanagement)のモデルは，いくつかの前提の下に構築されている。それには経験曲線効果が含まれる。","a":true,"c":"","e":"ＢＣＧが開発したＰＰＭのモデルでは，資金供給能力を示す尺度として，横軸に相対的マーケット・シェアをとる。これは「マーケット・シェアの高い製品は経験曲線効果によって単位原価が減少し，高い収益性を持つ」という前提に立っている。"},{"l":1,"m":"戦略と管理会計の関係","sb":"","r":"(Ｒ５Ⅱ⑨-ウ)","q":"中長期経営計画は，将来の企業経営の方向性を示す大綱的な計画であり，１年を超える期間を対象として設定される。この中長期経営計画が設定された後，企業戦略や事業戦略が検討される。","a":false,"c":"","e":"全社的な立場から，事業領域の設定と存廃，経営資源の蓄積と配分について決定する戦略を企業戦略ないし全社戦略，特定の事業領域において，持続的な競争優位を獲得するための戦略を事業戦略ないし競争戦略という。これらはいずれも中長期的な指針であるが，それを具体化したものが中長期経営計画であり，企業戦略や事業戦略が検討された後に，中長期経営計画が設定される。"},{"l":2,"m":"戦略と管理会計の関係","sb":"","r":"(Ｒ２Ⅱ⑨-ウ)","q":"企業を取り巻く環境変化に伴い，戦略との関連を意識することが，管理会計において近年ますます重要となっている。このうち企業戦略とは，既に選択された各事業領域においての競争的行動に関する戦略を指し，関連する代表的な手法として価値連鎖(valuechain)の分析がある。","a":false,"c":"","e":"「既に選択された各事業領域においての競争的行動に関する戦略」とは，企業戦略ではなく事業戦略ないし競争戦略である。企業戦略とは，特定の事業領域に限定されない全社戦略を意味する。"},{"l":3,"m":"戦略と管理会計の関係","sb":"","r":"(Ｒ５Ⅰ⑨-ウ)","q":"事業戦略とは，選択した事業において持続的競争優位を確保するための基本方針である。このうち，資源アプローチの視点から見た事業戦略の基本的なパターンには，コスト・リーダーシップ戦略や差別化戦略，ニッチ戦略がある。","a":false,"c":"","e":"コスト・リーダーシップ戦略や差別化戦略，ニッチ戦略は，対外的な要因との関係で自社のポジショニング（戦略上の位置取り）を重視するポジショニング・アプローチの視点から見た事業戦略のパターンである。なお，資源アプローチとは，競争優位の源泉を企業内部の経営資源や能力に求める考え方をいい，ナレッジ・マネジメントやコア・コンピタンスに代表される。"},{"l":4,"m":"戦略と管理会計の関係","sb":"","r":"(Ｒ３⑨-ウ)","q":"価値連鎖(valuechain)とは，製品又はサービスの売り手にとっての価値を創り出す諸活動の繋がりを意味する。価値連鎖の枠組みを企業内部に限定せず，その枠組みを拡大して上流や下流の企業と連携することが，持続的な競争優位を確保するためには重要である。","a":false,"c":"","e":"価値連鎖とは，顧客にとっての価値を創り出す諸活動の繋がりを意味する。企業が持続的競争優位を確保するためには，価値連鎖の分析視野を上流に拡大させてサプライヤーと協力関係を築くとともに，下流にも拡大させて卸売，小売業者さらにはリサイクル業者とも連携することが重要となる。"},{"l":5,"m":"戦略と管理会計の関係","sb":"","r":"(Ｈ28Ⅰ⑨-ウ)","q":"価値連鎖(valuechain)とは，製品やサービスに価値を与えるための一連の活動であり，製品やサービスへの価値は生産プロセスにおいて付加されると考えられるので，販売後に行われる製品保証等のサポート活動は価値連鎖に含まれない。","a":false,"c":"","e":"価値連鎖とは，顧客にとっての価値を付加するための一連の活動であり，購買物流，製造，出荷物流，マーケティングと販売，顧客サービスを主活動とする。したがって，生産プロセスだけでなく，販売後に行われる製品保証等のサポート活動(顧客サービス活動)も含まれる。"}]},{"n":9,"name":"短期利益計画のための管理会計","qs":[{"l":1,"m":"ＣＶＰ分析の仮定と限界","sb":"","r":"(Ｈ20⑪-エ)","q":"市場競争が激しく，製造企業の価格決定権が低下している場合，当該企業は利益計画の精度を確保することが困難になる。","a":true,"c":"","e":"短期利益計画においては，営業量の変化にかかわらず，販売価格を一定と仮定してＣＶＰ分析を行う。したがって，市場競争が激しく，当該企業の価格決定権が低下している場合には，販売価格を一定と仮定する分析に無理が生じ，短期利益計画の精度を確保することは困難になるといえる。"},{"l":2,"m":"ＣＶＰ分析の仮定と限界","sb":"","r":"(Ｈ22Ⅰ⑪-カ)","q":"ＣＶＰ分析においては，操業度の変化のみならず，価格，固定費，あるいは変動費率の利益に与える影響を検討することができる。","a":true,"c":"","e":"ＣＶＰ分析においては，ある要素を固定する一方で他の要素を変化させ，その変化が貢献利益や営業利益に与える影響を分析する(感度分析)。分析上，価格，固定費，あるいは変動費率を一定と仮定するのが通常であるが，それは営業量との関係で一定と捉えるという意味であり，全ての要素について常に単一の数値を用いるということではない。"},{"l":3,"m":"ＣＶＰ分析の仮定と限界","sb":"","r":"(Ｈ30Ⅱ⑪-ア)","q":"多品種製品のＣＶＰ分析における固定費は，個別固定費と各製品品種に共通に発生する共通固定費からなり，共通固定費の場合，どの品種にどれだけ必要とされるかを正しく計算することは不可能である。","a":true,"c":"","e":"多品種製品のＣＶＰ分析においては，個別固定費と共通固定費を区別しないのが通常である。ＡＢＣの思考を導入することで，共通固定費がどの品種にどれだけ必要とされるかを合理的に見積もることはできるが，それはあくまでも長期的な因果関係に基づくものであり，短期を前提とするＣＶＰ分析において，各製品品種に共通固定費を正確に跡付けることは不可能であるといえる。"},{"l":4,"m":"ＣＶＰ分析の仮定と限界","sb":"","r":"(Ｈ30Ⅱ⑪-ウ)","q":"ＣＶＰ分析は，原価を変動費と固定費に分解する直接原価計算方式により行うが，原価を直接費と間接費に分類する全部原価計算方式によりＣＶＰ分析を行う場合は，原価・営業量・利益の関係について正確な予測ができない。","a":false,"c":"","e":"全部原価計算方式のＣＶＰ分析においては，直接費と間接費ではなく，製造原価，販売費，一般管理費といった職能別に原価を分類する。また，「生産量＝販売量」を仮定するか，これを仮定しない場合でも予定操業度差異を売上原価に賦課するという前提にたてば，直接原価計算方式の場合と同様に，営業利益を営業量の線形関数として表現することができる。したがって，原価・営業量・利益の関係について正確な予測ができないというわけではない。"},{"l":1,"m":"損益分析点分析と経営レバレッジ","sb":"","r":"(Ｈ30Ⅱ⑪-イ)","q":"限界利益率，損益分岐点比率，安全余裕率，経営レバレッジ係数は，ＣＶＰ分析において用いられる指標である。","a":true,"c":"","e":"いずれも原価(Ｃ)の固変分解を基礎として，営業量(Ｖ)の変化が利益(Ｐ)に与える影響を分析する際に用いられる指標である。"},{"l":2,"m":"損益分析点分析と経営レバレッジ","sb":"","r":"(Ｈ27Ⅰ⑦-エ)","q":"安全余裕率と損益分岐点比率は，どちらも企業経営の安全性を測定するものであり，実務上でもよく使用されている指標である。この両者には密接な関係がある。例えば，安全余裕率が20％の場合，損益分岐点比率は100％から安全余裕率を差し引いて，80％と算定される。","a":true,"c":"","e":"安全余裕率と損益分岐点比率は補数の関係にあり，両者の合計は100％となる。"},{"l":3,"m":"損益分析点分析と経営レバレッジ","sb":"","r":"(Ｒ５Ⅱ⑩-イ)","q":"損益分岐点比率は，実際の売上高と損益分岐点売上高との差額を実際の売上高で除して求められ，その値が高いほど収益性が高いことを意味する。","a":false,"c":"","e":"実際の売上高と損益分岐点売上高との差額を安全余裕額といい，それを実際の売上高で除して求められるのは，損益分岐点比率ではなく安全余裕率である。また，安全余裕率の値が高いほど，売上高の変化に対する営業利益の変化率が小さくなるため，その分だけ安全性が高い（経営リスクが小さい）ことを意味する。"},{"l":4,"m":"損益分析点分析と経営レバレッジ","sb":"","r":"(Ｈ23Ⅰ⑩-エ)","q":"損益分岐点比率と安全余裕率とは，ともに実際または予定売上高と損益分岐点売上高の関係から企業経営の安全性(利益計上の安定性)を測定するものであり，両者の間には密接な関係がある。たとえば，損益分岐点比率が上昇すれば安全余裕率も上昇し，企業の経営安全性は改善したといえる。","a":false,"c":"","e":"損益分岐点比率と安全余裕率は補数の関係にあるため，損益分岐点比率が上昇すれば安全余裕率は低下し，企業の経営安全性は悪化したといえる。"},{"l":5,"m":"損益分析点分析と経営レバレッジ","sb":"","r":"(Ｈ26Ⅰ⑧-イ)","q":"損益分岐点比率を低くするためには，販売量と固定費を変えることができないならば，単位当たり貢献利益を上げると良い。","a":true,"c":"","e":"損益分岐点比率を低くするためには，①販売量を上げるか，②損益分岐点販売量を下げるかのいずれかが必要であるが，販売量を変えることができないならば，②によらざるをえない。この場合，損益分岐点販売量＝固定費÷単位当たり貢献利益であるから，固定費を変えることができないならば，単位当たり貢献利益を上げると良い。"},{"l":6,"m":"損益分析点分析と経営レバレッジ","sb":"","r":"(Ｈ26Ⅰ⑧-ウ)","q":"損益分岐点売上高が目標売上高に近い場合，安全率を上げる必要があるが，そのためには，目標売上高を上げる，あるいは固定費を削減するほか，変動費率を上げても良い。","a":false,"c":"","e":"安全率(安全余裕率)を上げるためには，①売上高を上げるか，②損益分岐点売上高を下げるかのいずれかが必要となるが，②のためには，損益分岐点売上高＝固定費÷(１－変動費率)であるから，固定費を削減するほか，変動費率を下げても良い。"},{"l":7,"m":"損益分析点分析と経営レバレッジ","sb":"","r":"(Ｈ26Ⅰ⑧-エ)","q":"目標販売量を変えずに安全率を高くするためには，単位当たり変動費を下げるほか，固定費を削減して損益分岐点販売量を下げると良い。","a":true,"c":"","e":"安全余裕率を高くするためには，①販売量を上げるか，②損益分岐点販売量を下げるかの何れかが必要となるが，販売量を変えることができないならば，②によらざるをえない。この場合，損益分岐点販売量＝固定費÷単位当たり貢献利益であるから，単位当たり変動費を下げる(単位当たり貢献利益を上げる)ほか，固定費を削減すると良い。"},{"l":8,"m":"損益分析点分析と経営レバレッジ","sb":"","r":"(Ｒ３⑨-エ)","q":"短期利益計画に際し，原価・営業量・営業利益の関係の分析が有用である。この分析において，法人税率が上昇する場合，その他の条件を一定とすれば損益分岐点売上高は増大する。","a":false,"c":"","e":"損益分岐点売上高は，営業利益がちょうどゼロになる際の売上高であるから，法人税の影響を受けない。したがって，法人税率が上昇したとしても，その他の条件を一定すれば，損益分岐点売上高は変化しない。"},{"l":9,"m":"損益分析点分析と経営レバレッジ","sb":"","r":"(Ｈ27Ⅰ⑦-ウ)","q":"営業量が少し変化すると利益が大きく変化する現象は，一般に財務レバレッジと呼ばれているが，その大きさは財務レバレッジ係数で測定される。財務レバレッジの現象は固定費の存在によって生じるのであり，財務レバレッジ係数は固定費の割合が大きいほど大きくなる。","a":false,"c":"","e":"営業量が少し変化すると利益が大きく変化する現象は，財務レバレッジではなく経営レバレッジと呼ばれ，その大きさは財務レバレッジ係数ではなく経営レバレッジ係数で測定される。"},{"l":10,"m":"損益分析点分析と経営レバレッジ","sb":"","r":"(Ｈ23Ⅰ⑩-ウ)","q":"営業レバリッジ(または経営レバリッジ)は，負債の利用によるテコの作用から生じる。負債の割合を多くすることにより，営業レバリッジがより多く働き，総資本利益率の変動以上に自己資本利益率の変動を大きくすることができる。その営業レバリッジの程度を測定するものが営業レバリッジ度(ＤＯＬ)である。","a":false,"c":"","e":"負債の利用により，総資本利益率の変動以上に自己資本利益率(ＲＯＥ)が大きく変動する現象は，営業レバリッジではなく財務レバリッジ効果と呼ばれる。"},{"l":11,"m":"損益分析点分析と経営レバレッジ","sb":"","r":"(Ｈ26Ⅰ⑧-ア)","q":"固定費が相対的に多い企業では，経営レバレッジ係数が低く，売上高の増減による営業利益の影響は，固定費が相対的に少ない企業に比べて大きい。","a":false,"c":"","e":"経営レバレッジ係数は固定費の利用度を測定する尺度であり，経営レバレッジ係数＝(固定費＋営業利益)÷営業利益であるから，固定費が相対的に多い企業では経営レバレッジ係数は高くなる。"},{"l":12,"m":"損益分析点分析と経営レバレッジ","sb":"","r":"(Ｒ４Ⅰ⑨-エ)","q":"経営レバレッジ係数(degreeofoperatingleverage)は，総費用に占める固定費の割合が大きくなるほど，売上高の変化率に比べて営業利益の変化率がより大きくなることの程度を測る指標である。この指標の数値は，売上高が減少して損益分岐点に近づくにつれて小さくなる。","a":false,"c":"","e":"経営レバレッジ係数とは，売上高の変化率に対する営業利益の変化率の大きさを表す指標であり，貢献利益を営業利益で割ることで計算される。この点，売上高が減少して損益分岐点に近づくにつれて，分母の営業利益がゼロに近づくため，経営レバレッジ係数は大きくなる。"},{"l":1,"m":"原価予測","sb":"","r":"(Ｈ30Ⅰ⑨-ア)","q":"勘定科目精査法，高低点法，最小自乗法，ＩＥ法(インダストリアル・エンジニアリング法)は，原価の固変分解の方法である。","a":true,"c":"","e":"ＩＥ法は直接費標準の設定に利用される方法であり，厳密には，固変分解の方法というよりも，原価予測の方法というべきである。ただし，固変分解の方法の１つとして挙げる文献も散見されるし，他に明らかな×肢があったことから，〇肢と判断された。"},{"l":2,"m":"原価予測","sb":"","r":"(Ｈ23Ⅰ⑩-オ)","q":"原価分解法の一つであるインダストリアル・エンジニアリング法(ＩＥ法)は，生産過程における投入と産出との間の物量的な関係を工学的に分析することにより，発生すべき原価を予測する方法である。これは過去の資料を用いることができない新製品の直接材料費や直接労務費の測定などに有効な技法である。","a":true,"c":"","e":"ＩＥ法は規範的な原価を予測する方法であるため，過去の資料を用いることができない新製品の直接材料費や直接労務費の測定などに有効な方法であるといえる。"},{"l":3,"m":"原価予測","sb":"","r":"(Ｒ５Ⅰ⑦-エ)","q":"直接材料の標準消費量や標準直接作業時間は科学的，統計的調査に基づいて設定されるが，こうした科学的，統計的調査の代表的手法が動作研究や時間研究といったコンカレント・エンジニアリングである。","a":false,"c":"","e":"動作研究や時間研究を主たる内容とする科学的，統計的調査の代表的手法とは，コンカレント・エンジニアリングではなく，インダストリアル・エンジニアリング(ＩＥ法)である。"},{"l":4,"m":"原価予測","sb":"","r":"(Ｈ22Ⅰ⑪-ウ)","q":"実績データに基づく原価予測法であったとしても，回帰分析法を採用するなら，信頼のおける操業度ゼロ地点の固定費額を算定することができる。","a":false,"c":"","e":"回帰分析法(最小自乗法)を採用するとしても，正常操業圏の観測値を基礎とする以上，そこで導出される固定費額は，正常操業圏における固定費の発生予定額を意味し，操業度ゼロ地点において発生する絶対固定費を示すものではない。"},{"l":5,"m":"原価予測","sb":"","r":"(Ｈ22Ⅰ⑪-イ)","q":"スキャッター・チャート法は目分量で固定費と変動費の分解を実施するものであるため，容易ではあるが，実績に基づく他の予測法である高低点法に比べて正確性に劣る手法である。","a":false,"c":"","e":"高低点法ではたった２つの観測値から線形原価関数を推定するのに対し，スキャッター・チャート法ではすべての観測値からこれを推定する。したがって，線形原価関数の正確性という観点では，情報"},{"l":6,"m":"原価予測","sb":"","r":"(Ｈ27Ⅰ⑦-イ)","q":"固定費と変動費を分解する方法の一つにスキャッター・チャート法がある。この方法は，利用可能なすべてのデータをグラフに記入し，それらの点の真ん中を通る直線を目分量で引くため，この原価関数は主観的にならざるを得ず，他の予測法である高低点法に比べて正確性に劣る手法である。","a":false,"c":"","e":"高低点法ではたった２つの観測値から線形原価関数を推定するのに対し，スキャッター・チャート法ではすべての観測値からこれを推定する。したがって，線形原価関数の正確性という観点では，情報\nロスがない分だけ，スキャッター・チャート法の方が優れている。"},{"l":1,"m":"固定費の管理","sb":"","r":"(Ｒ５Ⅱ⑩-エ)","q":"キャパシティ・コストのうち，コミッテド・キャパシティ・コストには，減価償却費や固定資産税，長期契約の賃借料などがあるが，これらは長期の製造販売能力に関する意思決定によって発生する。","a":true,"c":"","e":"コミッテド・キャパシティ・コストとは，長期的な製造販売能力に関する意思決定の結果として，耐用年数全期間の発生額が決定してしまう原価であり，減価償却費や固定資産税，長期契約の賃借料などに代表される。短期的にはその発生を回避することができないという点において，経営管理者が政策的に支出額を決定しうるマネジド・キャパシティ・コストと対比される。"},{"l":2,"m":"固定費の管理","sb":"","r":"(Ｒ４Ⅰ⑨-ア)","q":"コミッティド・キャパシティ・コスト(committedcapacitycost)は，キャパシティの保有に関する長期的な意思決定によって発生額が決まる原価である。その発生額を管理するには長期的な意思決定の合理性が求められ，短期的にはキャパシティの利用度を高めてコストの回収を図ることが重視される。","a":true,"c":"","e":"コミッティド・キャパシティ・コストの管理は，投資段階と除却段階で合理的な意思決定を行うことに大半がかかっており，途中の期間は生産・販売能力を遊休にしないように努力する以外にない。"},{"l":3,"m":"固定費の管理","sb":"","r":"(Ｈ29Ⅱ⑨-ア)","q":"キャパシティ・コストのうち，マネジド・キャパシティ・コストには広告宣伝費，販売促進費，研究開発費などがあるが，これらの費目は費用対効果が不明確なため通常は予算管理によって管理される。","a":true,"c":"","e":"マネジド・キャパシティ・コストについては，費用対効果が不明確なため，経営管理者が政策的に支出額を決定する。その際，増分方式を採用すれば無駄な支出が生じやすいため，ゼロベース予算を採用するのが有効といわれる。"},{"l":4,"m":"固定費の管理","sb":"","r":"(Ｈ23Ⅰ⑩-イ)","q":"原価の発生源泉から変動費をアクティビティ・コスト，固定費をキャパシティ・コストと呼ぶことがある。さらに，キャパシティ・コストは経営管理者の管理可能性を基準として，管理可能なコミテッド・コストと管理不能なマネジド・コストとに分類される。","a":false,"c":"","e":"キャパシティ・コストは，経営管理者の管理可能性を基準として，管理不能なコミテッド・コストと管理可能なマネジド・コストとに分類される。"},{"l":1,"m":"その他","sb":"","r":"(Ｈ30Ⅱ⑪-エ)","q":"短期利益計画では，単年度の利益目標を設定するためにＣＶＰ分析の手法を用いて各種の数値目標を策定する。一方，中長期経営計画では，期間が数年に及び不確実性が高いので数値目標を策定することはない。","a":false,"c":"","e":"中長期経営計画(中長期利益計画)では，期間が数年に及び不確実性が高いことは事実であるが，その初年度分が短期利益計画であるし，３～５年スパンでの利益目標の策定も不可欠である。したがって，中長期経営計画においても，短期利益計画と同様に数値目標が策定される。"}]},{"n":10,"name":"財務情報分析","qs":[{"l":1,"m":"財務情報分析の種類と方法","sb":"","r":"(Ｈ24Ⅱ⑫-オ)","q":"流動性の分析は，企業が所有する支払手段と支払義務の短期的な関係，すなわち短期の資金繰りを捉えるもので，比較的長期の支払能力を捉える安定性の分析とともに，安全性の分析に寄与する。","a":true,"c":"","e":"安全性分析は，企業経営が財務的に行き詰まっていないか，倒産の懸念がないかを調査するものであり，短期の債務支払能力や利払能力を見る流動性分析と，長期的な支払能力（財務体質ならびに投資状況）を見る安定性分析からなる。"},{"l":2,"m":"財務情報分析の種類と方法","sb":"","r":"(Ｈ24Ⅱ⑫-ア)","q":"水平分析(horizontalanalysis)は，特定の財務諸表のそれぞれの項目を総額との百分比で表し構成比を分析する。百分率表示の財務諸表を共通サイズの財務諸表(common-sizestatement)という。","a":false,"c":"","e":"特定の財務諸表のそれぞれの項目を総額との百分比で表し，構成比を分析するのは，水平分析ではなく垂直分析である。水平分析とは，連続する２期間の変化を観察する分析をいう。"},{"l":3,"m":"財務情報分析の種類と方法","sb":"","r":"(Ｈ24Ⅱ⑫-イ)","q":"自社の売上総利益や経常利益の増減原因を構成項目に踏み込んで探る利益増減分析や，資産，負債ならびに資本の構成項目の増減分析は実数分析である。","a":true,"c":"","e":"実数分析とは，財務諸表の各細目の数値(実数)を過去や他企業の数値と比較・分析するものであり，典型的手法として，利益増減分析や貸借対照表項目の増減分析がある。"},{"l":4,"m":"財務情報分析の種類と方法","sb":"","r":"(Ｈ30Ⅱ⑨-イ)","q":"財務諸表分析は，数値や比率の「比較」によって行われるが，財務諸表の実際の数値を使って分析する手法を外部分析といい，財務諸表上のある項目と他の項目との比率を求め，それを使って分析する手法を比率分析という。","a":false,"c":"","e":"財務諸表の実際の数値を使って分析する手法は，外部分析ではなく実数分析である。"},{"l":5,"m":"財務情報分析の種類と方法","sb":"","r":"(Ｈ24Ⅱ⑫-ウ)","q":"垂直分析(verticalanalysis)や経時的(longitudinal)な変化を観察する趨勢分析(trendanalysis)は専ら期間比較を行う。なお，業績の期間比較では景況判断指数にみられる経済環境や景気動向を考慮する必要がある。","a":false,"c":"","e":"専ら期間比較を行うのは，水平分析と趨勢分析である。なお，水平分析が連続する２期間の変化を観察する分析をいうのに対し，趨勢分析とは，数期間の経時的な変化を観察する分析をいう。"},{"l":6,"m":"財務情報分析の種類と方法","sb":"","r":"(Ｈ24Ⅱ⑫-エ)","q":"経営比較は，ライバル企業との比較，同一産業に属する企業の平均値との比較などクロス・セクション分析を行う。実数の比較と比率の比較を実施するが，規模の経済の存否や経営効率の確認には前者の比較がより有用である。","a":false,"c":"","e":"実数の比較と比率の比較のうち，規模の経済の存否や経営効率の確認には，後者(比率)の比較がより有用である。なお，規模の経済とは，生産規模の拡大による単位原価の低減によって得られる経済効果をいい，利益率の向上に代表される。"},{"l":1,"m":"収益性分析(資本利益率の解釈)","sb":"","r":"(Ｈ30Ⅰ⑩-イ)","q":"良好な収益性の状態を維持するには，売上高利益率を上げることが困難な場合，売上高利益率が低くとも総資本回転率を上げれば総資本利益率の上昇は達成でき，これを実現するためには薄利多売戦略を行うことが考えられる。","a":true,"c":"","e":"総資本利益率＝売上高利益率×総資本回転率であるから，売上高利益率が低くとも総資本回転率を上げれば総資本利益率の上昇は達成できる。この点，薄利多売戦略を採用した場合，利幅は小さいために売上高利益率は相対的に低くなるが，大量販売によって総資本回転率を上げることが可能であり，結果として総資本利益率を上昇させることも可能となる。"},{"l":2,"m":"収益性分析(資本利益率の解釈)","sb":"","r":"(Ｒ３⑩-ア)","q":"総資本利益率における総資本に対比すべき利益として，損益計算書上の経常利益の数値をそのまま用いるのが理論的に妥当する。","a":false,"c":"","e":"総資本は経営資本(営業資産)と金融資産に運用され，前者から営業利益，後者から金融収益が稼得される。したがって，金融活動が増加した現代企業の収益性を総資本利益率で測る場合，総資本に対比すべき利益としては，営業利益と金融収益の合計である事業利益を用いるのが理論的に妥当する。"},{"l":3,"m":"収益性分析(資本利益率の解釈)","sb":"","r":"(Ｒ５Ⅱ⑩-エ他複数)","q":"総資本利益率を算定する場合の利益として，営業利益に金融収益(受取利息および受取配当金)を加算した事業利益を用いる場合がある。これは，株主と債権者の両方に対するリターンを考慮するためである。","a":true,"c":"","e":"資本運用の見地だけでなく，資本調達の見地からも，総資本に事業利益を対応させることに合理性が認められる。総資本は自己資本と他人資本(負債)からなり，株主に対するリターン(配当)と債権者に対するリターン(支払利息)の原資は，配当前・利払前の利益としての事業利益に相当するからである。"},{"l":4,"m":"収益性分析(資本利益率の解釈)","sb":"","r":"(Ｈ23Ⅰ⑬-ウ)","q":"ＲＯＥが当期純利益を用いるのに対し，ＲＯＡ(returnonassets)が営業利益や経常利益を用いるのは，事業の収益力を重視しようとするからである。","a":true,"c":"","e":"ＲＯＡは総資本事業利益率を指すことが多いが，広義には総資本営業利益率や総資本経常利益率を含み，利益ベースに営業利益，事業利益，経常利益を用いることで，事業の収益力を分析する。"},{"l":5,"m":"収益性分析(資本利益率の解釈)","sb":"","r":"(Ｈ23Ⅰ⑬-ア)","q":"上場会社の決算短信で記載される「自己資本当期純利益率」の自己資本は，純資産の部の株主資本と同義ではない。","a":true,"c":"","e":"決算短信で記載される「自己資本当期純利益率」の自己資本は株主資本とその他の包括利益累計額の合計（純資産－株式引受権－新株予約権－非支配株主持分）であり，株主資本と同義ではない。"},{"l":6,"m":"収益性分析(資本利益率の解釈)","sb":"","r":"(Ｒ５Ⅱ⑩-ア)","q":"ＲＯＥ(returnonequity)を分解すると，(売上高当期純利益率)×(総資産回転率)×(財務レバレッジ)になる。","a":true,"c":"","e":"ＲＯＥ＝当期純利益／売上高×売上高／総資産×総資産／自己資本なお，総資産回転率と総資本回転率は同じである。"},{"l":7,"m":"収益性分析(資本利益率の解釈)","sb":"","r":"(Ｈ23Ⅰ⑬-イ)","q":"ＲＯＥを分解すると，(売上高当期純利益率)×(総資産回転率)×(自己資本比率)になる。","a":false,"c":"","e":"ＲＯＥ＝(売上高当期純利益率)×(総資産回転率)×(財務レバレッジ)又はＲＯＥ＝(売上高当期純利率)×(総資産回転率)÷(自己資本比率)である。"},{"l":8,"m":"収益性分析(資本利益率の解釈)","sb":"","r":"(Ｈ25Ⅱ⑭-イ)","q":"売上高利益率と自己資本比率を一定とした場合で総資本回転率が上昇しているときは，自己資本利益率は低下する。","a":false,"c":"","e":"売上高利益率と自己資本比率（財務レバレッジ）を一定とした場合で総資本回転率が上昇しているときは，自己資本利益率は上昇する。"},{"l":9,"m":"収益性分析(資本利益率の解釈)","sb":"","r":"(Ｈ25Ⅱ⑫-ウ)","q":"総資本利益率を一定とした場合で自己資本比率が上昇しているときは，自己資本利益率は上昇する。","a":false,"c":"","e":"ＲＯＥ＝(総資本利益率)×(財務レバレッジ)であるから，総資本利益率を一定とした場合で自己資本比率(財務レバレッジ)が上昇(低下)しているときは，自己資本利益率は低下する。"},{"l":10,"m":"収益性分析(資本利益率の解釈)","sb":"","r":"(Ｒ３⑩-エ)","q":"ＲＯＡ(returnonassets)10％，ＲＯＥ(returnonequity)８％，負債資本倍率〔算式：負債÷自己資本〕２倍，実効税率50％の場合，負債利子率は４％である。","a":false,"c":"","e":"ＲＯＡ10％，ＲＯＥ８％，負債資本倍率〔算式：負債÷自己資本〕２倍，実効税率50％の場合，負債利子率は７％である。以下を参照のこと。ＲＯＥ＝{10％＋２×(10％－７％)}×(１－50％)＝８％"},{"l":11,"m":"収益性分析(資本利益率の解釈)","sb":"","r":"(Ｈ23Ⅰ⑬-エ)","q":"ＲＯＥとＲＯＡは，比例関係にある。(参考)一次関数はＹ＝ａＸ＋ｂと表され，定数項ｂ＝０の場合に，Ｙ＝ａＸという比例関数になる。つまり，比例は全て一次関数であるが，定数項ｂ≠０の場合の一次関数を比例とは言わない。","a":false,"c":"","e":"いわゆる財務レバレッジ効果を表す式において，ＲＯＥはＲＯＡの一次関数で定義される。ただし，ゼロ以外の定数項を含むため，ＲＯＥとＲＯＡが比例関係にあるわけではない。"},{"l":12,"m":"収益性分析(資本利益率の解釈)","sb":"","r":"(Ｈ25Ⅱ⑭-エ)","q":"自己資本比率が低い企業の場合，自己資本比率が高い企業と比べて，他の条件を同じとするならば，業績悪化時には減益幅が拡大する。","a":true,"c":"","e":"ＲＯＡと負債利子率の差は，負債比率によって増幅され，ＲＯＥに作用する。したがって，自己資本比率が低い（負債比率が高い）企業の場合，自己資本比率が高い（負債比率が低い）企業と比べて，他の条件を同じとすれば，業績悪化時には減益幅が拡大するといえる。"},{"l":13,"m":"収益性分析(資本利益率の解釈)","sb":"","r":"(Ｒ２Ⅱ⑩-イ)","q":"総資本は有利子負債と自己資本のみで構成され，金融損益以外の営業外損益項目や特別損益項目がないという仮定のもとでは，ＲＯＥ(returnonequity)およびＲＯＡ(returnonassets)の関係式は次のとおりである。税引前ＲＯＥ＝ＲＯＡ＋負債比率×(ＲＯＡ－負債利子率)ただし，負債比率は(他人資本÷自己資本)×100で計算される。したがって，ＲＯＡが負債利子率を上回ると，ＲＯＥがＲＯＡより大きくなり，財務レバレッジはマイナスの方向に作用する。","a":false,"c":"","e":"ＲＯＡが負債利子率を上回ると，ＲＯＡと負債利子率の差が負債比率によって増幅され，ＲＯＥはＲＯＡよりも大きくなるが，この場合，財務レバレッジはプラスの方向に作用するといえる。"},{"l":14,"m":"収益性分析(資本利益率の解釈)","sb":"","r":"(Ｈ27Ⅱ⑨-エ)","q":"自己資本純利益率の算式には負債は含まれていない。負債が増加しても，自己資本や純利益に影響を及ぼさず，自己資本純利益率は変動しない。","a":false,"c":"","e":"負債が増加すれば，支払利息の増加によって自己資本や純利益は減少するし，負債比率の増加を通じて自己資本純利益率は変動する。"},{"l":15,"m":"収益性分析(資本利益率の解釈)","sb":"","r":"(Ｈ30Ⅰ⑩-エ)","q":"企業の資本調達上，負債を利用する度合を財務レバレッジというが，資本調達に関して企業間比較を行う場合，財務レバレッジの高い企業の方が自己資本純利益率の変動についてのリスクは低くなる。","a":false,"c":"","e":"財務レバレッジや負債比率の高い企業の方が自己資本純利益率の変動についてのリスクは高くなる。"},{"l":16,"m":"収益性分析(資本利益率の解釈)","sb":"","r":"(Ｈ23Ⅰ⑬-オ)","q":"社内における設備投資の経済性を判断する際，ＲＯＥはハードルレートとしての役割を果たす。","a":false,"c":"","e":"ＲＯＥは自己資本に対するリターンの割合であり，所要利益率としての資本コスト率ではない。また，ＲＯＥを自己資本コスト率と見た場合であっても，これに有利子負債の利子率を加味してハードルレートとするのが通常である。以上より，社内における設備投資の経済性を判断する際，ＲＯＥ自体がハードルレートとしての役割を果たすわけではない。"},{"l":1,"m":"活動性分析","sb":"","r":"(Ｒ３⑩-イ)","q":"棚卸資産回転率が年間８回転の場合，棚卸資産回転月数は1.5か月で，棚卸資産回転日数は45.625日である。ただし，１年は365日とする。","a":true,"c":"","e":"棚卸資産回転率が年間８回転の場合，その逆数に相当する年単位の棚卸資産回転期間は0.125年となる。したがって，棚卸資産回転月数は0.125年×12ヶ月／年＝1.5か月，棚卸資産回転日数は0.125年×365日／年＝45.625日となる。"},{"l":2,"m":"活動性分析","sb":"","r":"(Ｈ18⑪-イ)","q":"固定資産回転期間が通常より長いということは，設備の稼動率が高かったり，投資が過大だったりすることを意味している。","a":false,"c":"","e":"固定資産回転期間(＝固定資産／売上高)が通常より長いということは，設備の稼働率が低かったり，投資が過大だったりすることを意味している。"},{"l":1,"m":"安全性分析","sb":"","r":"(Ｈ30Ⅰ⑩-ア)","q":"流動資産を流動負債で割った比率は流動比率となり，また，流動資産から流動負債を差し引くと正味運転資本が算定される。繰延資産がゼロの場合，正味運転資本は「(固定負債＋自己資本)－固定資産」の算式からも算定できる。","a":true,"c":"","e":"「流動資産＋固定資産＝流動負債＋固定負債＋自己資本」より,「流動資産－流動負債＝(固定負債＋自己資本)－固定資産」となる。"},{"l":2,"m":"安全性分析","sb":"","r":"(Ｒ５Ⅰ⑯-エ)","q":"短期の債務返済能力を示す指標である流動比率は，流動資産を流動負債で除して求められる。この数値が高いほど，債務返済能力が高いと評価される。","a":true,"c":"","e":"流動比率は，１年以内に支払義務が生じる流動負債を１年以内に現金化が予定される流動資産で賄えているかを見る指標であり，その数値が高いほど債務返済能力(短期支払能力)が高いと評価される。"},{"l":3,"m":"安全性分析","sb":"","r":"(Ｒ３⑬-ア)","q":"流動比率は，企業の短期的な債務返済能力を示す指標である。この比率は，流動負債を流動資産で除して計算され，債務返済能力の点からは高いほど望ましい。","a":false,"c":"","e":"流動比率は，流動資産を流動負債で除して計算される。"},{"l":4,"m":"安全性分析","sb":"","r":"(Ｈ30Ⅰ⑭-エ)","q":"財務安全性を見るのに流動比率があるが，この比率は，200％以上あるのが望ましいといわれている。ただし，同じ流動比率で200％を超える高い企業があっても，これらの支払能力は同等とは限らない。","a":true,"c":"","e":"流動比率が同じ企業であっても，より換金性の高い当座資産を基礎に算定した当座比率は異なるのが通常であり，支払能力は同等とは限らない。"},{"l":5,"m":"安全性分析","sb":"","r":"(Ｒ３⑬-エ)","q":"手元流動性を構成する資産項目は全て，短期のうちに換金して設備投資や債務返済等に充当できる流動性の著しく高い資金である。","a":true,"c":"","e":"手元流動性は当該企業の裁量で即時換金可能な資産であり，通常は「現金預金＋有価証券(売買目的有価証券)」によって計算される。"},{"l":6,"m":"安全性分析","sb":"","r":"(Ｒ６Ⅱ⑬-エ)","q":"手元流動性とは，設備投資や債務返済に充当できる流動性の著しく高い資金と定義され，貸借対照表の流動資産に計上される現金，預金，売上債権，有価証券，短期貸付金の合計額として算定される。","a":false,"c":"","e":"手元流動性は貸借対照表の流動資産に計上される現金預金と有価証券からなり，相手先からの回収を必要とする売上債権や短期貸付金は含まれない。"},{"l":7,"m":"安全性分析","sb":"","r":"(Ｈ18⑪-ウ)","q":"固定比率が100％を超えていても，固定長期適合率が100％以下であるならば，企業の長期的な支払能力は，通常問題ないと考えられる。","a":true,"c":"","e":"固定資産投資を自己資本のみで賄うというのは現実的でないし，自己資本に固執すれば投資機会を失うこととなり，競争優位を保てない。したがって，長期負債を加味した固定長期適合率が100％以下であるならば，企業の長期的な支払能力は問題ないと考えるのが通常である。"},{"l":8,"m":"安全性分析","sb":"","r":"(Ｒ５Ⅱ⑪-ウ)","q":"自己資本がプラスの企業において，固定長期適合率が100％を上回る場合であっても，固定比率が100％以下となる場合がある。","a":false,"c":"","e":"一般に，固定長期適合率は固定資産を長期資金(固定負債＋自己資本)で除すことにより，固定比率は固定資産を自己資本で除すことにより求められる。つまり，計算式の分子は同じであり，自己資本がプラスの企業であれば，分母については固定長期適合率の方が固定比率よりも大きくなる。以上より，固定長期適合率が100％を上回る場合に，固定比率が100％以下となる余地はない。"},{"l":9,"m":"安全性分析","sb":"","r":"(Ｈ30Ⅰ⑩-ウ)","q":"固定長期適合率と流動比率との関係において，固定長期適合率が１より大きい場合は，流動比率が１より大きいことに対応し，固定長期適合率が１より小さい場合は，流動比率が１より小さいことに対応する。","a":false,"c":"","e":"固定長期適合率と流動比率は表裏一体の関係にある。すなわち，固定長期適合率が１より大きい場合は，流動比率が１より小さいことに対応し，固定長期適合率が１より小さい場合は，流動比率が１より大きいことに対応する。"},{"l":10,"m":"安全性分析","sb":"","r":"(Ｒ２Ⅱ⑩-ウ)","q":"固定資産÷(自己資本＋固定負債)×100で計算される固定長期適合率(％)は低い方が長期財務安全性の面で良好である。それゆえ，当該指標が上昇すると長期財務安全性は悪化し，流動比率は必ず低下する。","a":false,"c":"","e":"固定長期適合率と流動比率は表裏一体の関係にあり，固定長期適合率が上昇すると，流動比率は低下するという関係にある。ただし，固定長期適合率＜100％(流動比率＞100％)を前提とするとき，固定資産と(自己資本＋固定負債)が同額ずつ増加して流動項目に変化がなければ，固定長期適合率は上昇するものの，流動比率は変化しない。以上のような状況を想定すれば，流動比率が必ず低下するとはいえない。"},{"l":11,"m":"安全性分析","sb":"","r":"(Ｈ18⑪-ア)","q":"企業の動態的な支払能力を見る重要な指標として経常収支比率がある。決算書上は黒字が続いているにもかかわらず，経常収支比率は100％を下回っている状態が何年も続いている場合には，資金的に非常に危険な状態にあるとみられ，粉飾決算の可能性がある。","a":true,"c":"","e":"経常収支比率が100％を下回っているということは，経常収入よりも経常支出の方が大きいことを意味する。この場合，経常収支差額のみならず，税金や配当，設備購入代金等の資金も借入や増資で調達しなければならないため，同じ状態が数年続けば，資金繰りに窮して倒産に至る。決算書上は黒字を計上しながら，経常収支比率が100％を下回る状態が続く場合には，架空売上などによる粉飾の可能性がある。"},{"l":12,"m":"安全性分析","sb":"","r":"(Ｒ２Ⅱ⑩-ア)","q":"仮に架空売上により利益を過大に計上すると，短期財務安全性の指標である流動比率は上昇し，キャッシュ・フローも増加する。","a":false,"c":"","e":"仮に架空売上(粉飾決算仕訳：売掛金／売上高)により利益を過大に計上すると，売上債権の水増しによって流動比率は上昇するが，キャッシュ・フローは増加しない。"},{"l":13,"m":"安全性分析","sb":"","r":"(Ｈ18⑪-オ)","q":"新製品のヒット等により売上高が急速に伸び，これまでの伸び率を大きく上回るような場合には，売上債権回転期間，買入債務回転期間及び棚卸資産回転期間にそれほど変化がなくても，売上債権や棚卸資産が著しく増え，一時的に経常収支が支出超過になることがある。このような場合には，外部資金の導入が順調である限り，支払能力はそれほど問題にならない。","a":true,"c":"","e":"売上が急増すれば，一時的に運転資金に大きな需要が生じるため，短期的に経常収支比率が100％を下回ることがある。このような場合には，外部資金でもって運転資金の不足を補えばよいのであって，その導入が順調であれば支払能力はそれほど問題とならない。"},{"l":1,"m":"キャッシュ・フロー分析","sb":"","r":"(Ｈ23Ⅱ⑫-ア)","q":"営業ＣＦマージンに総資本回転率を乗じると，総資本営業ＣＦが求まる。(注)総資本営業ＣＦ＝営業ＣＦ÷総資本営業ＣＦマージン＝営業ＣＦ÷売上高","a":true,"c":"","e":"営業ＣＦマージン×総資本回転率＝(営業ＣＦ÷売上高)×(売上高÷総資本)＝営業ＣＦ÷総資本＝総資本営業ＣＦ"},{"l":2,"m":"キャッシュ・フロー分析","sb":"","r":"(Ｈ23Ⅱ⑫-イ)","q":"過年度在庫や長期滞留売上債権の急増は，営業ＣＦ純利益率を低下させる。(注)営業ＣＦ純利益率＝当期純利益÷営業ＣＦ","a":false,"c":"","e":"過年度在庫や長期滞留売上債権が急増すれば，分母の営業ＣＦの減少を通じて，営業ＣＦ純利益率は上昇する。"},{"l":3,"m":"キャッシュ・フロー分析","sb":"","r":"(Ｈ23Ⅱ⑫-ウ)","q":"設備投資対営業ＣＦ比率が過度に高いのは，過年度に過大な設備投資支出が行われていることを示す。(注)設備投資対営業ＣＦ比率＝設備投資額÷営業ＣＦ","a":false,"c":"","e":"設備投資対営業ＣＦ比率が過度に高いということは，当年度に過大な設備投資支出が行われていることを示す。"},{"l":4,"m":"キャッシュ・フロー分析","sb":"","r":"(Ｈ23Ⅱ⑫-エ)","q":"営業ＣＦマージンが高いのは，製品(商品)単位当たり売上高から得る営業ＣＦが小さいことを示す。(注)営業ＣＦマージン＝営業ＣＦ÷売上高","a":false,"c":"","e":"営業ＣＦマージンが高いということは，製品(商品)単位当たり売上高から得る営業ＣＦが大きいことを示す。"},{"l":5,"m":"キャッシュ・フロー分析","sb":"","r":"(Ｈ23Ⅱ⑫-オ)","q":"建物や機械装置の減価償却費が急増すると，営業ＣＦ純利益率が低くなる。(注)営業ＣＦ純利益率＝当期純利益÷営業ＣＦ","a":true,"c":"","e":"建物や機械装置の減価償却費が急増すると，分子の当期純利益の減少と分母の営業ＣＦの増加を通じて，営業ＣＦ純利益率は低くなる。"}]},{"n":11,"name":"予算管理","qs":[{"l":1,"m":"予算の機能と予算管理の手段的特徴","sb":"","r":"(Ｒ４Ⅱ⑪-ア)","q":"予算は，企業の諸活動の具体的計画を貨幣的に表示したものであり，予算期間における企業の原価目標の達成に向けた，企業全般にわたる総合的管理の要具である。","a":false,"c":"「基準」１⑷","e":"原価管理に対する予算管理の特徴は，原価だけでなく収益についても目標を設定し，差額としての利益を管理の対象とする点にある。つまり，予算は会社全体ないし独立採算単位における利益管理のためのツールであり，予算期間における企業の利益目標の達成に向けた，企業全般にわたる総合的管理の要具である。"},{"l":2,"m":"予算の機能と予算管理の手段的特徴","sb":"","r":"(Ｈ27Ⅰ⑫-ウ)","q":"予算には計画機能，統制機能，調整機能があり，統制機能において予算は事後の統制を行うための基準として用いられ，管理者や予算執行者に十分な動機づけを行うような基準を設定するために事前統制が行われる。","a":true,"c":"","e":"統制機能とは，予算目標の達成を確保する機能をいう。予算目標は，事後統制の段階では実績を評価するための基準となるが，事前統制の段階では管理者や予算執行者の動機づけが重視される。"},{"l":3,"m":"予算の機能と予算管理の手段的特徴","sb":"","r":"(Ｈ20⑭-オ)","q":"予算の機能には，企業の各組織の活動を調整することも含まれる。","a":true,"c":"","e":"予算による調整とは，全社的な諸活動を予算(貨幣単位)という共通言語により調整することであり，むしろ調整機能こそが，予算に期待される最も重要な機能である。"},{"l":4,"m":"予算の機能と予算管理の手段的特徴","sb":"","r":"(Ｒ６Ⅱ⑪-ア)","q":"予算管理の役割には，計画機能，調整機能，統制機能の三つがあり，そのうち，調整機能と統制機能は予算統制プロセスにおいてのみその役割を果たすものである。","a":false,"c":"","e":"予算管理の役割のうち，計画機能は予算目標を公式化する機能，統制機能は予算目標の達成を確保する機能であるから，それぞれ予算編成プロセスと予算統制プロセスにおいてのみ役割を果たす。この点，調整機能は全社的な諸活動のバランスを保ち，目標整合性を確保する機能であるから，予算編成プロセスと予算統制プロセスの双方においてその役割を果たす。"},{"l":5,"m":"予算の機能と予算管理の手段的特徴","sb":"","r":"(Ｒ６Ⅰ⑫-ア)","q":"予算による調整はコミュニケーションの役割を果たす。その役割の一つに，予算編成過程において，企業全体の目標や各部門の計画を組
