定尺度として残余利益を使うことにより，事業部長の意思決定が全社的に望ましいものとなる。","a":true,"c":"","e":"インベストメント・センターの事業部長に対する業績測定尺度として残余利益を使うことにより，事業部長に資本コスト(率)を必要最低利益(率)とする意思決定を促すことになるため，事業部長の意思決定が全社的に望ましいものとなる。また，残余利益の現在価値総額は正味現在価値に一致するため，残余利益による業績測定は，正味現在価値法と整合的な意思決定を促すという側面もある。その意味においても，全社的に望ましい意思決定へと誘導できるといえる。"},{"l":6,"m":"投資センターの業績測定尺度","sb":"","r":"(Ｈ29Ⅱ⑯-ア)","q":"分権組織の管理者に使用資本の効率的な運用を動機づける方法は，投資利益率(ＲＯＩ)と残余利益(ＲＩ)以外にも存在する。","a":true,"c":"","e":"ＲＯＩとＲＩ以外にも，各種回転率や回転期間を業績測定尺度に使用する方法，社内金利制度を採用する方法などが存在する。"},{"l":1,"m":"事業部長の業績測定と事業部自体の業績測定","sb":"","r":"(Ｈ29Ⅱ⑨-エ)","q":"セグメント別損益計算書において，セグメント別営業利益を算出するには，まず各セグメントの売上高から変動製造原価および変動販売費を差し引いて貢献利益を計算する。次に各セグメントの貢献利益から管理可能個別固定費，管理不能個別固定費および共通固定費配賦額を差し引いてセグメント別営業利益を計算する。","a":true,"c":"","e":"・売上高－変動費＝貢献利益・貢献利益－管理可能個別固定費＝管理可能営業利益・管理可能営業利益－管理不能個別固定費－共通固定費配賦額＝セグメント別営業利益"},{"l":2,"m":"事業部長の業績測定と事業部自体の業績測定","sb":"","r":"(Ｈ20⑲-ウ)","q":"事業部の業績評価を行なうために，事業部ごとに会計数値が集計される。この会計数値が事業部の管理者業績を評価するために利用される場合，事業部長にとっての管理可能性を考慮する必要がある。","a":true,"c":"","e":"事業部長の業績評価は，事業部長の分権的な意思決定について目標整合性を確保することを目的とする。そのため，事業部長が業績評価に対して不公平感や不満足感を抱くことのないように，当該事業"},{"l":3,"m":"事業部長の業績測定と事業部自体の業績測定","sb":"","r":"(Ｒ５Ⅱ⑯-ア)","q":"事業部長の評価を事業部利益を用いて行う際に，所管する事業部で発生する費用であっても事業部長にとって管理可能でないものは負担させないほうが事業部長の業績評価の観点で望ましい。","a":true,"c":"","e":"事業部長の業績評価は，事業部長の分権的な意思決定について目標整合性を確保することを目的とする。そのため，事業部長が業績評価に対して不公平感や不満足感を抱くことのないように，当該事業\n部長にとっての管理可能性を重視する必要がある。"},{"l":4,"m":"事業部長の業績測定と事業部自体の業績測定","sb":"","r":"(Ｈ31Ⅱ⑯-ウ)","q":"事業部の業績測定を会計数値によって行うためには，事業部に対する追跡可能性に基づいて，固定費を個別固定費と共通固定費に分類する。事業部長の業績測定に会計数値を利用する場合，事業部長にとっての管理可能性を考慮して，個別固定費を管理可能費と管理不能費に分類する必要がある。","a":true,"c":"","e":"事業部の業績測定は，本社の意思決定に資する事業部の収益性情報の提供を目的とするため，当該事業部への追跡可能性を重視し，固定費を個別固定費と共通固定費に分類する。一方，事業部長の業績測定は，事業部長の意思決定について目標整合性を確保することを目的とするため，動機づけの見地から管理可能性を重視し，個別固定費を管理可能費と管理不能費に分類する必要がある。"},{"l":5,"m":"事業部長の業績測定と事業部自体の業績測定","sb":"","r":"(Ｒ５Ⅱ⑯-ウ)","q":"インベストメント・センターとしての事業部の業績を，各事業部の投下資本の収益性により評価する場合，管理可能利益を用いた事業部投下資本利益率や残余利益が用いられる。","a":false,"c":"","e":"インベストメント・センターとしての事業部の業績評価は，本社の意思決定に資する収益性情報の提供を目的とする。そのため，事業部長にとっての管理可能性を考慮する必要はなく，収益，費用，投資額の会計処理に当たって指導的役割を果たす概念は，当該事業部に対する追跡可能性である。そこで，事業部投下資本利益率や残余利益の計算における利益ベースには，管理可能利益ではなく税引後事業部純利益(税引後事業部営業利益)が用いられる。"},{"l":6,"m":"事業部長の業績測定と事業部自体の業績測定","sb":"","r":"(Ｈ28Ⅱ⑯-ア)","q":"管理可能利益と残余利益との違いは，事業部の業績評価を行う際に，管理可能利益は資本コストを考慮せずに算定するのに対して，残余利益は資本コストを考慮して算定することにある。","a":false,"c":"","e":"管理可能利益は売上高から変動費及び管理可能固定費を控除して算定するのに対し，(管理可能)残余利益は管理可能利益から(管理可能投資額に対する)資本コストを控除して算定する。したがって，両者の違いが資本コストを考慮するか否かという点にあることは正しいが，それらを算定するのは，事業部ではなく事業部長の評価に際してである。"},{"l":7,"m":"事業部長の業績測定と事業部自体の業績測定","sb":"","r":"(Ｒ４Ⅱ⑮-エ)","q":"事業部がプロフィット・センターとして位置づけられている場合，事業部と事業部長の業績は常に同一の利益によって測定されるべきである。","a":false,"c":"","e":"近年は区別がやや曖昧になってきているものの，伝統的な事業部制の業績測定において，事業部自体の業績測定と事業部長の業績測定は明確に区別されてきた。したがって，事業部と事業部長の業績が，常に同一の利益によって測定されるべきとはいえない。"},{"l":1,"m":"本社費の配賦","sb":"","r":"(Ｒ２Ⅰ⑯-ウ)","q":"本社費・共通費は事業部存続に必要なコストであるが，各事業部にとって直接コントロールすることができない費用である。事業部への配賦には合理的な意義や目的が全く存在しないため，本社費・共通費を各事業部に配賦するべきではない。","a":false,"c":"","e":"本社費・共通費(以下，本社費)は各事業部にとって直接コントロールすることができない費用であるが，各事業部に本社費回収の必要性を認識させるなどの意図から，本社費を各事業部に配賦するのがむしろ通常であり，それは合理的な意義や目的をもつものである。"},{"l":2,"m":"本社費の配賦","sb":"","r":"(Ｒ６Ⅱ⑭-ウ)","q":"管理可能利益で事業部長の業績評価を行う場合，本社費・共通費は事業部の運営に必要なコストであるから，事業部長の業績評価のためには本社費・共通費を各事業部に配賦する必要がある。","a":false,"c":"","e":"管理可能性原則に則り管理可能利益で事業部長の業績評価を行う場合，本社費・共通費は各事業部長にとって管理不能であるから，それらを各事業部に配賦する必要はない。厳密に言えば，各事業部に本社費・共通費の回収の必要性を認識させるべく，それらを各事業部に配賦するのが通常であるが，事業部長の業績評価自体は，本社費・共通費配賦前の管理可能利益をベースにするということである。"},{"l":3,"m":"本社費の配賦","sb":"","r":"(Ｒ４Ⅰ⑨-ウ)","q":"事業部制を採用している企業が本社費・共通費を各事業部に配賦する理由の一つに，本社・共通部門に対する牽制機能への期待があげられる。この機能は，本社・共通部門の費用の大きさに対する事業部側の関心が高まり，本社・共通部門の肥大化に対して一定の抑制力が働くことを意味する。","a":true,"c":"","e":"事業部制の実務では，本社費・共通費を各事業部に配賦するのが通常である。その意図は，第一義的には各事業部に本社費・共通費回収の必要性を認識させるためといわれるが，本社費・共通費の発生に対する各事業部の牽制機能を引き出すためともいわれる。本社費・共通費を配賦すれば，各事業部はその発生額に関心を持つようになり，本社・共通部門に対して圧力がかかる結果として，間接的に本社費・共通費の肥大化を抑える効果が期待できるのである。"},{"l":4,"m":"本社費の配賦","sb":"","r":"(Ｈ28Ⅱ⑯-イ)","q":"本社費・共通費の各事業部への配賦は，実務上，本社や共通部門が提供するサービスの利用の程度に基づいて決定されるのが合理的であり，各事業部の利益の規模は配賦の基準とはならない。","a":false,"c":"","e":"本社と事業部の目標一致の観点からすれば，因果的な配賦計算が求められるため，本社や共通部門が提供するサービスの利用の程度に応じて配賦するのが合理的といえる。一方で，収益性の高い事業部に本社費・共通費の発生に対する牽制機能を持たせるという見地からすれば，各事業部の利益の規模に応じて配賦することにも合理性が認められる。したがって，実務上，各事業部の利益の規模が配賦の基準となることはある。"},{"l":1,"m":"ＥＶＡⓇ","sb":"","r":"(Ｈ19⑳-ア)","q":"グループ経営における組織統合や会社分割の際に，事業の評価や選別を行うのに効果的な評価方法の例としては，キャッシュ・フローを基礎とした事業別の経済付加価値(ＥＶＡⓇ)やフリー・キャッシュフロー(ＦＣＦ)の算定が挙げられる。","a":true,"c":"","e":"ＥＶＡⓇやＦＣＦは，企業価値と密接な関係にあるため，これらの尺度を用いて評価対象事業の企業価値への貢献度を測定することによって，事業の評価や選別に効果的な情報を提供できる。"},{"l":2,"m":"ＥＶＡⓇ","sb":"","r":"(Ｒ２Ⅱ⑯-ウ)","q":"残余利益の一種である経済的付加価値(EconomicValueAdded：ＥＶＡⓇ)を算出するためには，損益計算書に記載される営業利益を出発点として経済的実態に合うようにいくつかの修正を加えて正味税引前営業利益を求め，その金額から，投下資本に加重平均資本コスト率を乗じた金額を控除する。","a":false,"c":"","e":"ＥＶＡⓇの算出に当たっては，税引後営業利益から，投下資本に加重平均資本コスト率を乗じた金額を控除する。"},{"l":1,"m":"社内金利制度と社内資本金制度","sb":"","r":"(Ｒ６Ⅱ⑭-エ)","q":"事業部の業績を管理する目的で事業部別貸借対照表を作成している企業では，社内金利を事業部に課すことがある。社内金利の対象となりうる貸借対照表項目としては，社内借入金，社内資本金，留保利益がある。","a":true,"c":"","e":"事業部別に貸借対照表を作成し，事業部投下資本(総資産－流動負債)の内訳項目として，貸方側に社内借入金，社内資本金，留保利益(剰余金)の各項目を設定する日本特有の管理会計技法を社内資本金制度という。この場合，社内金利制度を採用するのが通常であり，社内金利の適用パターンとしては，①社内借入金のみに課すパターン，②社内借入金に加えて社内資本金にも課すパターン，③社内借入金と社内資本金に加えて留保利益にも課すパターンの３つがある。このうち，③については，事業部投下資本に一律に加重平均資本コスト率を適用する計算と実質的に同じといえる。"},{"l":1,"m":"内部振替価格","sb":"","r":"(Ｒ４Ⅱ⑮-イ)","q":"事業部間の振替価格は，各事業部長の意思決定が全体利益に整合するように決められると同時に，各事業部長の業績測定に役立つように決められるのが望ましい。","a":true,"c":"","e":"事業部間で中間製品等の振替取引がある場合，振替価格の設定目的としては，①業績測定目的と②目標整合性目的の２つがある。すなわち，①プロフィット・センターとしての事業部ないし事業部長の業績測定に役立つとともに，②振替取引にかかわる事業部長の分権的な決定を全社目標と整合的なものへと誘導しうるように，振替価格を決定するのが望ましい。なお，本肢では①と②の順序が逆になっているが，一般的には経常目的としての①が強調される。"},{"l":2,"m":"内部振替価格","sb":"","r":"(Ｈ20⑲-エ)","q":"事業部制組織の下で，事業部間に取引がある場合には，振替価格を適切に決定する必要がある。一般に，振替価格には，市価基準，原価基準，操業度基準という三つの方式があり，企業の状況に応じていずれかが選択される。","a":false,"c":"","e":"振替価格の設定基準は市価基準と原価基準に大別されるが，市価基準，原価基準，交渉価格基準という三つの方式に区別する考え方もある。"},{"l":3,"m":"内部振替価格","sb":"","r":"(Ｈ22Ⅰ⑲-ア)","q":"プロフィット・センターである事業部制組織では，販売側事業部に取引先選択権を付与し，購入側事業部に販売側事業部からの購入を拒否する忌避権を付与する仕組みを常に採る。","a":false,"c":"","e":"市価基準の振替価格を採用する場合には関係事業部に忌避権を認めることが前提となるが，原価基準の振替価格を採用する場合にそのような前提はない。したがって，常に忌避権を付与する仕組みを採るわけではない。"},{"l":4,"m":"内部振替価格","sb":"","r":"(Ｈ22Ⅰ⑲-イ)","q":"内部振替価格に，実際原価に基づくコストプラス基準や限界原価基準を採用している場合には，販売側事業部のモラル・ハザードを誘発しやすくなるので，管理上の工夫が必要になる。","a":true,"c":"","e":"内部振替価格に実際原価に基づくコストプラス基準を用いている場合には，不能率をどれだけ発生させても販売側事業部では利益が保証されることになるし，限界原価基準を採用している場合には，逆に全く利益が保証されず，モチベーションの維持が困難となる。いずれにしても，不公平な業績測定によって販売側事業部のモラル・ハザードを誘発しやすくなるので，管理上の工夫が必要になる。"},{"l":5,"m":"内部振替価格","sb":"","r":"(Ｈ22Ⅰ⑲-エ)","q":"内部振替価格にコストプラス基準や限界原価基準を用いている場合，標準原価の採用は，単位製造原価にかかわる原材料や賃金等の価格と消費量における偶然性を抑制する。したがって，購入側事業部の視点では，販売側事業部における標準原価の採用が管理可能原則に，より適った方法と映る。","a":true,"c":"","e":"原価基準の振替価格を採用する場合，実際原価をコストベースとすれば，購入側事業部において管理不能な販売側事業部における能率の良否の影響が内部振替高に混入してしまう。したがって，購入側事業部からすれば，標準原価をコストベースとする方法の採用が，管理可能性原則により適った方法といえる。"},{"l":6,"m":"内部振替価格","sb":"","r":"(Ｈ28Ⅱ⑯-エ)","q":"ある会社において，製造事業部が製造した製品を販売事業部が外部に販売する国内取引を行う場合，事業部間の振替価格の決定方法を市価基準から原価プラス基準に変更しても，その他の取引条件が変化しなければ，当該取引に関して計上される会社全体としての利益には影響を及ぼさない。","a":true,"c":"","e":"会社全体で見れば内部取引は相殺されるため，振替価格の決定方法を市価基準から原価プラス基準に変更したとしても，その他の取引条件が変化しなければ，当該取引に関して計上される会社全体としての利益には影響を及ぼさない。"},{"l":7,"m":"内部振替価格","sb":"","r":"(Ｈ29Ⅱ⑯-ウ)","q":"事業部間の内部振替取引において振替価格が低く設定されていても，企業内部の振替価格に過ぎないので，経営トップの資源配分の意思決定に影響を及ぼす可能性はない。","a":false,"c":"","e":"振替価格に基づく分権的決定を受けて短期の資源配分は行われるし，振替価格如何で事業部の収益性が変化し，長期の資源配分にも影響する。いずれにしろ，振替価格の水準は，経営トップの資源配分の意思決定に影響する。"},{"l":8,"m":"内部振替価格","sb":"","r":"(Ｈ22Ⅰ⑲-オ)","q":"内部振替価格に交渉価格基準を採用している場合には，事業部を統括する本部が振替価格設定権を有しており，このことにより全体最適，すなわち，事業部利益と全社利益との目標の一致をはかっている。","a":false,"c":"","e":"交渉価格基準(交渉価格方式)を採用する場合，振替価格の設定自体は各事業部の交渉に委ねられており，本部は調整には入るものの，振替価格設定権を有するわけではない。"},{"l":1,"m":"ミニ・プロフィット・センター","sb":"","r":"(Ｈ19⑳-ウ)","q":"一般的に，ミニ・プロフィット・センターは少人数グループを基礎に，損益による業績評価指標から組織学習活動の効果を上げるものとされ，小組織単位による企業価値創造の方法の一つである。","a":true,"c":"","e":"ＭＰＣは，生来的にはコスト・センターやレヴェニュー・センターとされる小組織単位をプロフィット・センター化することで組織を活性化し，それによって企業価値の創造を意図した方法であるといえる。"},{"l":2,"m":"ミニ・プロフィット・センター","sb":"","r":"(Ｈ24Ⅰ⑳-ア)","q":"ミニ・プロフィットセンター制は，通常，コスト・センターあるいは収益センターと扱われる最小組織単位をプロフィット・センター化するマネジメント手法である。","a":true,"c":"","e":"ＭＰＣ制は，生来的にはコスト・センターとされる製造部門や収益センターとされる営業部門を小組織単位に細分化し，それらに利益責任を課すことでプロフィット・センター化するマネジメント手法である。"},{"l":3,"m":"ミニ・プロフィット・センター","sb":"","r":"(Ｒ６Ⅱ⑭-イ)","q":"ミニ・プロフィット・センターとは，事業部より小さな組織単位に比較的大きな権限を委譲し，独立性の高い利益管理単位（プロフィット・センター）として管理するマネジメント手法である。そのため，製造部門をミニ・プロフィット・センターにすることはできない。","a":false,"c":"","e":"ＭＰＣは，通常のプロフィット・センター(事業部)を垂直的に細分化するものではなく，ラインカンパニー制のように製造ラインそのものを１つの会社に見立てたり，アメーバ経営のように製造，販売というライン職能を細分化することで設定される。したがって，製造部門をＭＰＣとすることは可能であり，むしろそれが通常である。"},{"l":4,"m":"ミニ・プロフィット・センター","sb":"","r":"(Ｈ19⑳-オ)","q":"ミニ・プロフィット・センターの一つとして，いわゆるアメーバ経営がある。これを実施するアメーバ組織は，ＱＣサークルのように公式組織を補完する非公式組織である。","a":false,"c":"","e":"アメーバ組織は非公式組織ではなく，公式権限を付与された公式組織である。"},{"l":5,"m":"ミニ・プロフィット・センター","sb":"","r":"(Ｈ30Ⅱ⑮-ウ)","q":"アメーバ経営では，ミニ・プロフィット・センターの管理において，アメーバ単位ごとに財務会計に準じた損益計算が行われる。したがって，例えば材料をアメーバ単位が引き取っただけでは費用計上されず，損益計算上では当該単位での在庫として計上される。","a":false,"c":"","e":"アメーバ経営では，ＭＰＣの管理において，アメーバ単位ごとに財務会計に準じた計算が行われるわけではなく，中間生産物や製品が工程を進むごとに損益が計上される。したがって，例えば，材料をアメーバ単位が引き取っただけで費用計上がなされ，アメーバ利益の計算に算入される。"},{"l":6,"m":"ミニ・プロフィット・センター","sb":"","r":"(Ｒ２Ⅰ⑯-イ)","q":"ミニ・プロフィット・センターの一つであるアメーバ組織は日本発の分権化組織である。その主な特徴として，生産機能や販売機能を分割した少人数による独立採算制および重要業績指標として時間当たり採算が採用される点にある。","a":true,"c":"","e":"アメーバ組織は京セラが開発したものであり，日本発の分権化組織である。その特徴は，製造部門と営業部門を連続的に細分化し，アメーバと呼ばれる小組織単位をプロフィット・センターと定義した上で，アメーバ利益を総時間で除した「時間当たり採算」に基づいて業績評価を行うという点にある。"},{"l":7,"m":"ミニ・プロフィット・センター","sb":"","r":"(Ｒ５Ⅱ⑯-イ)","q":"ミニ・プロフィット・センターの代表例であるアメーバ組織といわれる分権化組織の特徴には，各アメーバ組織が製品開発，生産，販売，管理などの全ての機能を持つ独立採算制や時間当たり採算による業績管理がある。","a":false,"c":"","e":"アメーバ組織におけるアメーバとは，製造・販売職能を連続的に細分化したものであり，製造アメーバにおける収益の計上や販売アメーバに対する営業口銭の配分といった仕組みを導入することで，独立採算制を実現する。つまり，各アメーバ組織は，製品開発，生産，販売，管理などの全ての機能を持つわけではない。"},{"l":8,"m":"ミニ・プロフィット・センター","sb":"","r":"(Ｈ24Ⅰ⑳-イ)","q":"ミニ・プロフィットセンター制の代表的手法では，例えば製造部門の工程別にアメーバと呼ばれる組織が作られ，各アメーバのリーダー間の商談に基づいて中間生産物や製品の内部振替価格(売価)が設定される。また，それに対しては，忌避宣言権が認められる。","a":true,"c":"","e":"アメーバ組織においては，振替価格の設定は，値決め交渉と呼ばれるアメーバリーダー同士の交渉に委ねられる。また，各アメーバには内部取引と外部取引の選択権(忌避宣言権)が認められており，市場メカニズムが機能することから，各アメーバはリアルな利益責任を負っているといえる。"},{"l":9,"m":"ミニ・プロフィット・センター","sb":"","r":"(Ｒ２Ⅱ⑯-エ)","q":"代表的なミニ・プロフィット・センター制であるアメーバ経営には，時間当たり採算とよばれる利益計算プロセスの中に，営業部門のみならず製造部門のアメーバ(小集団)にも市場価格の情報を伝達する仕組みが内包されている。","a":true,"c":"","e":"アメーバ経営においては，製造アメーバにおいて売上高を計上し，社内のアメーバ間の取引に関しても忌避権が認められている。したがって，実際に最終製品の受注活動を行う営業部門のみならず，製造アメーバにおいても市場価格の情報を伝達する仕組みが内包されているといえる。"},{"l":10,"m":"ミニ・プロフィット・センター","sb":"","r":"(Ｈ24Ⅰ⑳-ウ)","q":"ミニ・プロフィットセンター制において，実際にはリーダーに売価決定権限が付与されないケースは，自律的組織とは言い難い。","a":true,"c":"","e":"自律的であるか否かは相対的なものであるが，リーダーに売価決定権限が付与されず，本部が集権的に決定するならば，それは自律的組織とは言い難い。"},{"l":11,"m":"ミニ・プロフィット・センター","sb":"","r":"(Ｈ24Ⅰ⑳-エ)","q":"いわゆる擬似ミニ・プロフィットセンターがプロフィット・センターとして振る舞わなければならない点は，伝統的な責任会計の管理可能性原則の考え方に準拠することになる。","a":false,"c":"","e":"生来的にはコスト・センターである小組織単位をＭＰＣと擬制する場合，収益面に関する権限と責任は現実には付与されていないのであるから，それらがプロフィット・センターとして振る舞わなければならない（管理不能な収益と管理可能な原価の差額としての利益に責任を負わなければならない）点は，伝統的な責任会計の管理可能性原則の考え方と整合しない。"},{"l":12,"m":"ミニ・プロフィット・センター","sb":"","r":"(Ｈ24Ⅰ⑳-オ)","q":"擬似ミニ・プロフィットセンターを採用し，利益を評価指標とすることで製造現場に活性化を促す効果が得られる。","a":true,"c":"","e":"利益を評価指標とすることにより，利益動機からの製造活動を促し，原価低減のモチベーションをより強く喚起することができる。また，原価低減の成果を利益指標の改善として可視化することにより，現場作業員の利益意識や責任感，満足感を醸成し，製造現場の活性化を促す効果が得られる。"},{"l":13,"m":"ミニ・プロフィット・センター","sb":"","r":"(Ｈ19⑳-エ)","q":"ミニ・プロフィット・センターの中で，ラインカンパニー制の一般的な特徴は，工場を少人数グループに細分化し，各ミニ・プロフィット・センター間で必ず振替価格を設定するとともに，生産速度・在庫率削減などの生産性指標を原価情報に転換することによって事業体質を改善することにある。","a":false,"c":"","e":"ラインカンパニー制においては，単に標準原価を売上高と見立てて実際原価と比較する場合もあり，ＭＰＣ間で必ずしも振替価格が設定されるとは限らない。"}]}]</script>
<script>
const CHAPTERS = JSON.parse(document.getElementById('quiz-data').textContent);

let ALL_Q=[], BY_CHAPTER={}, MAJORS_BY_CHAPTER={};
let customQs=[]; // user-added questions, persisted separately

function rebuildIndexes(){
  ALL_Q=[];
  CHAPTERS.forEach((ch,ci)=>{
    ch.qs.forEach((q,qi)=>{
      ALL_Q.push({
        id: ci+'_'+qi, chNum: ch.n, chName: ch.name,
        major: q.m||'', sub: q.sb||'',
        label: q.l, refs: q.r||'', statement: q.q, answer: q.a,
        citation: q.c||'', explanation: q.e||'', custom:false
      });
    });
  });
  customQs.forEach(q=>{
    const ch = CHAPTERS.find(c=>c.n===q.chNum);
    ALL_Q.push({
      id: q.id, chNum: q.chNum, chName: ch?ch.name:'追加した問題',
      major: q.major||'', sub:'',
      label:'', refs:'', statement:q.statement, answer:q.answer,
      citation:q.citation||'', explanation:q.explanation||'', custom:true
    });
  });
  BY_CHAPTER={};
  CHAPTERS.forEach(ch=>{ BY_CHAPTER[ch.n]=ALL_Q.filter(q=>q.chNum===ch.n); });
  MAJORS_BY_CHAPTER={};
  CHAPTERS.forEach(ch=>{
    const order=[],counts={};
    BY_CHAPTER[ch.n].forEach(q=>{ const k=q.major||''; if(!(k in counts)){counts[k]=0;order.push(k);} counts[k]++; });
    MAJORS_BY_CHAPTER[ch.n]=order.map(name=>({name,count:counts[name]}));
  });
}
function majorKey(chNum,major){ return chNum+'::'+major; }

/* ---------- persisted state ---------- */
let status={};   // id -> 0|1|2  (0=未,1=あいまい,2=覚えた)
let notes={};    // id -> memo text
let noteSaveTimer=null;
let localUpdatedAt=0;

const SUBJECT_KEY='kanrikaikei';
const LS_STATUS_KEY='mgmt_status_v1';
const LS_NOTES_KEY='mgmt_notes_v1';
const LS_CUSTOM_KEY='mgmt_custom_v1';
const LS_UPDATED_KEY='mgmt_updated_v1';
const LS_HL_KEY='mgmt_highlights_v1';
const SYNC_URL_KEY='qsync_dburl_v1';
const SYNC_CODE_KEY='qsync_code_v1';
let highlights={}; // id -> [[start,end], ...] ranges within explanation text

function storageAvailable(){
  try{
    const k='__t__'; localStorage.setItem(k,'1'); localStorage.removeItem(k);
    return true;
  }catch(e){ return false; }
}
const HAS_LS = storageAvailable();

async function loadStorage(){
  if(HAS_LS){
    try{
      const s=localStorage.getItem(LS_STATUS_KEY);
      if(s) status=JSON.parse(s);
    }catch(e){ status={}; }
    try{
      const n=localStorage.getItem(LS_NOTES_KEY);
      if(n) notes=JSON.parse(n);
    }catch(e){ notes={}; }
    try{
      const c=localStorage.getItem(LS_CUSTOM_KEY);
      if(c) customQs=JSON.parse(c);
    }catch(e){ customQs=[]; }
    try{
      const h=localStorage.getItem(LS_HL_KEY);
      if(h) highlights=JSON.parse(h);

    }catch(e){ localUpdatedAt=0; }
  }
  rebuildIndexes();

/* ---------- CLOUD SYNC (optional, Firebase Realtime Database via REST) ---------- */
function touchUpdated(){
  localUpdatedAt = Date.now();
  if(HAS_LS){ try{ localStorage.setItem(LS_UPDATED_KEY, String(localUpdatedAt)); }catch(e){} }
  scheduleCloudPush();
}
function getSyncConfig(){
  if(!HAS_LS) return null;
  const url=(localStorage.getItem(SYNC_URL_KEY)||'').trim();
  const code=(localStorage.getItem(SYNC_CODE_KEY)||'').trim();
  if(!url||!code) return null;
  return {url,code};
}
function cloudPath(cfg){
  return cfg.url.replace(/\/+$/,'') + '/quizSync/' + encodeURIComponent(cfg.code) + '/' + SUBJECT_KEY + '.json';
}
let cloudPushTimer=null;
function scheduleCloudPush(){
  const cfg=getSyncConfig(); if(!cfg) return;
  if(cloudPushTimer) clearTimeout(cloudPushTimer);
  cloudPushTimer=setTimeout(()=>{ pushToCloud(cfg); },1500);
}
async function pushToCloud(cfg){
  cfg = cfg||getSyncConfig(); if(!cfg) return false;
  try{
    await fetch(cloudPath(cfg), {
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({status,notes,customQs,highlights,updatedAt:localUpdatedAt})
    });
    return true;
  }catch(e){ return false; }
}
async function pullFromCloud(showToast){
  const cfg=getSyncConfig(); if(!cfg) return false;
  try{
    const res=await fetch(cloudPath(cfg));
    if(!res.ok) return false;
    const data=await res.json();
    if(!data || !data.updatedAt || data.updatedAt<=localUpdatedAt) return false;
    status=data.status||{};
    notes=data.notes||{};
    customQs=data.customQs||[];
    highlights=data.highlights||{};
    localUpdatedAt=data.updatedAt||0;
    if(HAS_LS){
      try{
        localStorage.setItem(LS_STATUS_KEY,JSON.stringify(status));
        localStorage.setItem(LS_NOTES_KEY,JSON.stringify(notes));
        localStorage.setItem(LS_CUSTOM_KEY,JSON.stringify(customQs));
        localStorage.setItem(LS_HL_KEY,JSON.stringify(highlights));
        localStorage.setItem(LS_UPDATED_KEY,String(localUpdatedAt));
      }catch(e){}
    }
    rebuildIndexes();
    meter();
    if(S.view!=='quiz') render();
    if(showToast) toast('他の端末の学習記録を読み込みました');
    return true;
  }catch(e){ return false; }
}

  let s=''; for(let i=0;i<20;i++) s+=chars[Math.floor(Math.random()*chars.length)];
  return s;
}

/* ---------- HIGHLIGHT MARKER (explanation text only) ---------- */
function highlightedHTML(id, text){
  text = text||'';
  const ranges=(highlights[id]||[]).slice().sort((a,b)=>a[0]-b[0]);
  let out='', pos=0;
  ranges.forEach(([s,e])=>{
    s=Math.max(0,Math.min(s,text.length)); e=Math.max(0,Math.min(e,text.length));
    if(e<=s || s<pos) return;
    if(s>pos) out+=esc(text.slice(pos,s));
    out+=`<mark class="hl" data-hl-range="${s}:${e}">${esc(text.slice(s,e))}</mark>`;
    pos=e;
  });
  if(pos<text.length) out+=esc(text.slice(pos));
  return out;
}
function addHighlight(id,s,e){
  const arr=(highlights[id]||[]).concat([[s,e]]).sort((a,b)=>a[0]-b[0]);
  const merged=[];
  arr.forEach(r=>{
    if(merged.length && r[0]<=merged[merged.length-1][1]) merged[merged.length-1][1]=Math.max(merged[merged.length-1][1],r[1]);
    else merged.push(r.slice());
  });
  highlights[id]=merged;
  saveHighlights();
  render();
}
function removeHighlight(id,s,e){
  highlights[id]=(highlights[id]||[]).filter(r=>!(r[0]===s&&r[1]===e));
  if(!highlights[id].length) delete highlights[id];
  saveHighlights();
  render();
}
function hlTextOffset(container,node,offset){
  let total=0;
  const walker=document.createTreeWalker(container,NodeFilter.SHOW_TEXT,null);
  let n;
  while((n=walker.nextNode())){
    if(n===node) return total+offset;
    total+=n.textContent.length;
  }
  return total;
}
let hlPopupEl=null;
function hlPopup(){
  if(hlPopupEl) return hlPopupEl;
  hlPopupEl=document.createElement('button');
  hlPopupEl.className='hl-popup';
  hlPopupEl.textContent='🖍 マーカー';
  hlPopupEl.style.display='none';
  document.body.appendChild(hlPopupEl);
  return hlPopupEl;
}
function hlOnSelectionChange(){
  const popup=hlPopup();
  const sel=window.getSelection();
  if(!sel||sel.rangeCount===0||sel.isCollapsed){ popup.style.display='none'; return; }
  const range=sel.getRangeAt(0);
  const anchorEl = range.commonAncestorContainer.nodeType===1 ? range.commonAncestorContainer : range.commonAncestorContainer.parentElement;
  const container = anchorEl? anchorEl.closest('[data-hl-id]') : null;
  if(!container){ popup.style.display='none'; return; }
  const start=hlTextOffset(container,range.startContainer,range.startOffset);
  const end=hlTextOffset(container,range.endContainer,range.endOffset);
  if(start===end){ popup.style.display='none'; return; }
  const s=Math.min(start,end), e=Math.max(start,end);
  const rect=range.getBoundingClientRect();
  popup.style.display='block';
  popup.style.left=Math.max(6,rect.left+rect.width/2-42)+'px';
  popup.style.top=Math.max(6,window.scrollY+rect.top-42)+'px';
  popup.onclick=()=>{
    addHighlight(container.dataset.hlId,s,e);
    sel.removeAllRanges();
    popup.style.display='none';
  };
}
document.addEventListener('selectionchange', hlOnSelectionChange);
document.addEventListener('scroll', ()=>{ if(hlPopupEl) hlPopupEl.style.display='none'; }, true);
document.addEventListener('click', e=>{

  const parts=m.dataset.hlRange.split(':').map(Number);
  const s=parts[0], e2=parts[1];

});

function shuffled(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; }

      <div class="oxbtns small">
        <button type="button" class="oxbtn maru" data-v="true">○</button>
        <button type="button" class="oxbtn batsu" data-v="false">✕</button>
      </div>
      <div class="flabel">出典（任意）</div>
      <input id="fCitation" type="text" value="${edit?esc(edit.citation):''}" placeholder="例：条文番号など">
      <div class="flabel">解説（任意）</div>
      <textarea id="fExplanation" rows="4" placeholder="解説を入力してください">${edit?esc(edit.explanation):''}</textarea>
    </div>
    <div class="add-foot">
      ${edit?'<button id="fDelete" class="danger">削除</button>':'<span></span>'}
      <button id="fSave" class="btn-main">保存</button>
    </div>
  </div>`;
}
function openAddForm(id){
  editingId = id || null;
  const edit = id ? customQs.find(q=>q.id===id) : null;
  addAnswerVal = edit ? edit.answer : null;
  const ov=$('#addOverlay');
  ov.innerHTML = addFormHTML(edit);
  ov.style.display='flex';
  document.querySelectorAll('#addOverlay .oxbtn').forEach(b=>{
    if((b.dataset.v==='true')===addAnswerVal) b.classList.add('sel');
    b.onclick=()=>{
      addAnswerVal = b.dataset.v==='true';
      document.querySelectorAll('#addOverlay .oxbtn').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel');
    };
  });
  $('#addClose').onclick=closeAddForm;
  $('#fSave').onclick=saveAddForm;
  const del=$('#fDelete');
  if(del) del.onclick=()=>{
    if(confirm('この問題を削除しますか？')){
      customQs=customQs.filter(q=>q.id!==editingId);
      saveCustomQs(); rebuildIndexes(); closeAddForm(); render();
      toast('削除しました');
    }
  };
}
function closeAddForm(){
  const ov=$('#addOverlay');
  ov.style.display='none'; ov.innerHTML='';
}
function saveAddForm(){
  const chNum=parseInt($('#fChapter').value);
  const major=$('#fMajor').value.trim();
  const statement=$('#fStatement').value.trim();
  const citation=$('#fCitation').value.trim();
  const explanation=$('#fExplanation').value.trim();
  if(!statement){ toast('問題文を入力してください'); return; }
  if(addAnswerVal===null){ toast('正誤を選んでください'); return; }
  if(editingId){
    const q=customQs.find(x=>x.id===editingId);
    Object.assign(q,{chNum,major,statement,answer:addAnswerVal,citation,explanation});
  }else{
    customQs.push({id:'custom_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
      chNum,major,statement,answer:addAnswerVal,citation,explanation});
  }
  saveCustomQs();
  rebuildIndexes();
  closeAddForm();
  render();
  toast(editingId?'更新しました':'追加しました');
}

/* ---------- QUIZ VIEW ---------- */
function quizPool(){
  return ALL_Q.filter(w=>
    S.selectedChapters.has(w.chNum) &&
    !S.excludedMajors.has(majorKey(w.chNum,w.major)) &&
    (S.statusFilter==='all' || String(status[w.id]||0)===S.statusFilter)
  );
}
function startQuiz(){
  const pool=quizPool();
  if(!pool.length) return;
  let qs = S.shuffle? shuffled(pool): pool.slice();
  if(S.quizCount!=='all'){
    const n=parseInt(S.quizCount);
    if(n>0 && n<qs.length) qs=qs.slice(0,n);
  }
  qs = qs.map(q=>({...q, _userAns:null}));
  S.quiz={ qs, i:0 };
  render();
}
function viewQuiz(){
  if(!S.quiz){
    const pool=quizPool();
    const countOpts=[10,20,30,50,100].filter(n=>n<pool.length);
    app.innerHTML=controls()+`<div class="stat-card">
      <div class="mini">現在の絞り込みで <b>${pool.length}</b> 問が対象です。</div>
      <div class="row" style="margin-top:10px">
        <select id="quizCount">
          <option value="all">出題数：全問（${pool.length}問）</option>
          ${countOpts.map(n=>`<option value="${n}" ${S.quizCount===String(n)?'selected':''}>出題数：${n}問</option>`).join('')}
        </select>
        <button id="shf" aria-pressed="${S.shuffle}">シャッフル：${S.shuffle?'ON':'OFF'}</button>
      </div>
      <div class="act">
        <button class="btn-main" id="go" style="border:1px solid var(--ink)" ${pool.length?'':'disabled'}>テストを始める</button>
      </div></div>`;
    bindControls();
    const cs=$('#quizCount'); if(cs){ cs.value=S.quizCount; cs.onchange=e=>{ S.quizCount=e.target.value; render(); }; }
    $('#shf').onclick=()=>{ S.shuffle=!S.shuffle; render(); };
    const go=$('#go'); if(go) go.onclick=startQuiz;
    return;
  }
  const Q=S.quiz;
  if(Q.i>=Q.qs.length){
    const answered=Q.qs.filter(q=>q._userAns!==null);
    const ok=answered.filter(q=>q._userAns===q.answer).length;
    const missed=answered.filter(q=>q._userAns!==q.answer);
    const skipped=Q.qs.length-answered.length;
    const pc=answered.length? Math.round(ok/answered.length*100):0;
    app.innerHTML=`<div class="score">
      <div class="big">${ok} <span style="font-size:22px;color:var(--ink-3)">/ ${answered.length}</span></div>
      <div class="mini" style="margin-top:10px">正答率 ${pc}％${skipped?'　（未回答 '+skipped+'問）':''}</div>
      <div class="act" style="justify-content:center">
        <button id="navBack" style="border:1px solid var(--rule)">‹ 最後の問題に戻る</button>
        <button class="btn-main" id="again" style="border:1px solid var(--ink)">もう一度</button>
        <button id="toList">一覧に戻る</button>
      </div></div>
      ${missed.length? `<div class="sec"><h2>間違えた問題（${missed.length}問）</h2><span></span></div>
      <ol class="list">${missed.map(m=>`<li class="item" style="grid-template-columns:1fr">
        <div><div class="en">${esc(m.statement)}</div>
        <div class="ja">正解：${m.answer?'○（正しい）':'✕（誤り）'}</div>
        <div class="note">${esc((m.citation?m.citation+'　':'')+m.explanation)}</div></div></li>`).join('')}</ol>`:''}`;
    $('#navBack').onclick=()=>{ Q.i=Q.qs.length-1; render(); };
    $('#again').onclick=()=>{ S.quiz=null; startQuiz(); };
    $('#toList').onclick=()=>{ S.quiz=null; setView('list'); };
    return;
  }
  const w=Q.qs[Q.i];
  let bottom='';
  if(w._userAns===null){
    bottom=`<div class="oxbtns">
      <button class="oxbtn maru" id="bm">○</button>
      <button class="oxbtn batsu" id="bx">✕</button>
    </div>`;
  } else {
    const correct = w._userAns===w.answer;
    bottom=`<div class="result-banner ${correct?'ok':'ng'}">
        <div class="rmark">${w.answer?'○':'✕'}</div>
        <div class="rtxt">${correct?'正解！':'不正解'}　正解は「${w.answer?'○（正しい）':'✕（誤り）'}」</div>
      </div>
      <div class="q-result">
        ${w.citation?`<div class="r-cite">${esc(w.citation)}</div>`:''}
        <div class="r-note" data-hl-id="${w.id}">${highlightedHTML(w.id, w.explanation) || '（解説なし）'}</div>
      </div>
      <div class="memo-box">
        <label>📝 メモ <span class="memo-saved" data-memo-saved="${w.id}">保存しました</span></label>
        <textarea data-memo-input="${w.id}" placeholder="覚え方やひっかけポイントなど">${esc(notes[w.id]||'')}</textarea>
      </div>
      <div class="grade">
        <button class="g2" data-g="1">✕<b>ダメ</b></button>
        <button class="g3" data-g="2">○<b>覚えた</b></button>
      </div>`;
  }
  app.innerHTML=`
    <div class="q-head"><span>第${w.chNum}章 ${w.chName}${w.major?'／'+w.major:''}</span><span>${Q.i+1} / ${Q.qs.length}</span></div>
    <div class="q-stem"><div class="qt">${esc(w.statement)}</div>${w.refs?`<div class="refs">${esc(w.refs)}</div>`:''}</div>
    ${bottom}
    <div class="navrow2">
      <button id="navPrev" ${Q.i===0?'disabled':''}>‹ 前の問題</button>
      <button id="navNext">${Q.i===Q.qs.length-1?'結果を見る ›':'次の問題 ›'}</button>
    </div>
  `;
  if(w._userAns===null){
    $('#bm').onclick=()=>submitAnswer(true);
    $('#bx').onclick=()=>submitAnswer(false);
  } else {
    const mi=$('[data-memo-input]'); if(mi) mi.oninput=e=>scheduleSaveNote(w.id,e.target.value);
    document.querySelectorAll('.grade button').forEach(b=>b.onclick=()=>{
      setStatus(w.id,+b.dataset.g); meter(); nextQuestion();
    });
  }
  $('#navPrev').onclick=()=>{ if(Q.i>0){ Q.i--; render(); } };
  $('#navNext').onclick=()=>{ Q.i++; render(); };
}
function submitAnswer(userAns){
  const Q=S.quiz, w=Q.qs[Q.i];
  w._userAns=userAns;
  render();
}
function nextQuestion(){
  const Q=S.quiz;
  Q.i++;
  render();
}

/* ---------- RECORD VIEW ---------- */
function viewRecord(){
  const c=counts(ALL_Q), t=ALL_Q.length;
  const rows=CHAPTERS.map(ch=>{
    const list=BY_CHAPTER[ch.n], cc=counts(list), ct=list.length||1;
    return `<div class="stat-row"><div class="nm">第${ch.n}章 ${ch.name}</div>
      <div class="bar">${[2,1].map(k=>`<i style="width:${cc[k]/ct*100}%;background:var(--${k===2?'ok':'warn'})"></i>`).join('')}</div>
      <div class="pc">${Math.round(cc[2]/ct*100)}%</div></div>`;
  }).join('');

  app.innerHTML=`
  ${HAS_LS?'':'<div class="stat-card" style="border-color:var(--red)"><div class="mini" style="color:var(--red)">⚠️ このブラウザでは保存機能が使えないため、学習記録は画面を閉じると消えます（Safariのプライベートブラウズ中など）。通常モードで開き直してください。</div></div>'}
  <div class="stat-card">
    <div class="mini">覚えた <b>${c[2]}</b>／ダメ <b>${c[1]}</b>／未学習 <b>${c[0]}</b>（全 ${t} 問）</div>
    <div style="height:10px"></div>
    ${rows}
    <div class="legend"><span class="lg2">覚えた</span><span class="lg1">ダメ</span><span class="lg0">未学習</span></div>
  </div>
  <div class="stat-card">
    <div class="mini">📶 複数端末で自動的に同期する（Firebase・初回のみ設定）</div>
    <div id="cloudSyncBox" style="margin-top:10px"></div>
  </div>
  <div class="stat-card">
    <div class="mini">学習記録（未／ダメ／覚えた・メモ）は端末ごとに保存されます。上の自動同期を使わない場合は、下のコードを表示してコピーし、別の端末でこの画面に貼り付けて読み込むことでも引き継げます。</div>
    <div class="act">
      <button id="exportBtn">引き継ぎコードを表示</button>
      <button id="importBtn">コードから読み込む</button>
    </div>
    <div id="syncBox" style="display:none;margin-top:10px">
      <textarea id="syncText" rows="5" style="width:100%;font-size:11px;border:1px solid var(--rule);background:var(--panel);color:var(--ink);padding:6px;border-radius:var(--radius)" placeholder="ここに引き継ぎコードを貼り付けてください"></textarea>
      <div class="act">
        <button id="syncCopy">コピー</button>
        <button id="syncLoad">このコードを読み込む</button>
      </div>
    </div>
  </div>
  `;
  renderSyncSettings();
  $('#exportBtn').onclick=()=>{
    const code=JSON.stringify({v:1,status,notes});
    const box=$('#syncBox'), ta=$('#syncText');
    box.style.display='block'; ta.value=code; ta.select();
    toast('下のコードを全選択してコピーしてください');
  };
  $('#importBtn').onclick=()=>{
    const box=$('#syncBox');
    box.style.display='block'; $('#syncText').value=''; $('#syncText').focus();
  };
  $('#syncCopy').onclick=async()=>{
    const ta=$('#syncText'); ta.select();
    try{ await navigator.clipboard.writeText(ta.value); toast('コピーしました'); }
    catch(e){ document.execCommand('copy'); toast('コピーしました'); }
  };
  $('#syncLoad').onclick=()=>{
    try{
      const data=JSON.parse($('#syncText').value.trim());
      if(!data || typeof data!=='object') throw new Error('bad');
      status=data.status||{};
      notes=data.notes||{};
      saveStatus();
      if(HAS_LS){ try{ localStorage.setItem(LS_NOTES_KEY,JSON.stringify(notes)); }catch(e){} }
      meter(); render(); toast('読み込みました');
    }catch(e){ toast('このコードは読み込めません'); }
  };
}

/* ---------- ROUTER ---------- */
function render(){
  ({list:viewList, quiz:viewQuiz, record:viewRecord})[S.view]();
  meter();
}
function setView(v){
  S.view=v;
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected', b.dataset.view===v));
  window.scrollTo(0,0);
  render();
}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>setView(b.dataset.view));
$('#btnSheet').onclick=()=>{
  S.sheet=!S.sheet;
  S.revealed=new Set();
  $('#btnSheet').setAttribute('aria-pressed',S.sheet);
  render();
  toast(S.sheet?'赤シートをかけました（タップで1問ずつ解答表示）':'赤シートを外しました');
};
$('#btnTheme').onclick=()=>{
  const d = document.documentElement.dataset.theme==='dark' ? 'light':'dark';
  document.documentElement.dataset.theme = d;
  try{ localStorage.setItem('theme_v1', d); }catch(e){}
};
$('#btnAdd').onclick=()=>openAddForm(null);

(async()=>{
  app.innerHTML=`<div class="empty">読み込み中...</div>`;
  await loadStorage();
  render();
  pullFromCloud(true);
})();
</script>
</body>
</html>
