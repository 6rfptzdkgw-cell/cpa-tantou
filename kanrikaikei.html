織構成員に周知し，受容させることがある。","a":true,"c":"","e":"予算による調整は，企業全体の目標と各下位組織単位の垂直的な調整，下位組織単位相互の水平的な調整からなる。調整は，予算編成と予算統制のいずれのプロセスにおいても重要となるが，予算編成のプロセスにおいては，垂直的，水平的な調整を通じて，企業全体の目標や各部門の計画を組織構成員に周知，受容させることになる。その意味において，予算による調整は，組織内のコミュニケーションを促進する役割を果たすといわれる。"},{"l":6,"m":"予算の機能と予算管理の手段的特徴","sb":"","r":"(Ｈ25Ⅱ⑬-ア)","q":"予算管理は，資源配分の手段である。","a":true,"c":"","e":"予算編成の過程では，企業が保有するあるいは利用可能な稀少経営資源を，競合する各種目的，責任単位に対してどのように配分するかが公式に決定される。したがって，予算管理は資源配分の手段であるといえる。"},{"l":7,"m":"予算の機能と予算管理の手段的特徴","sb":"","r":"(Ｈ25Ⅱ⑬-イ)","q":"予算管理は，組織メンバーを組織目標達成へと動機づける手段である。","a":true,"c":"","e":"予算統制(事前統制)の過程では，予算を自己目標として各階層の経営管理者に受容させ，その達成意欲を喚起する。したがって，予算管理は，資源配分の手段であると同時に，組織メンバーを組織目標達成へと動機づける手段であるといえる。"},{"l":8,"m":"予算の機能と予算管理の手段的特徴","sb":"","r":"(Ｈ26Ⅱ⑫-ウ)","q":"予算達成度が業績評価に反映される度合を部門間で統一しなかったとしても，予算の動機付け効果がなくなるわけではない。","a":true,"c":"","e":"予算達成度が業績評価に反映される度合が高い(低い)ほど，予算の動機付け効果は高く(低く)なるといえる。つまり，動機付け効果は程度問題であるため，予算達成度が業績評価に反映される度合を部門間で統一しなかったとしても，予算の動機付け効果がなくなるわけではない。"},{"l":1,"m":"予算編成の方法","sb":"","r":"(Ｈ29Ⅱ⑪-イ)","q":"予算編成の方法を大別すると，組織階層にかかわらせてトップ・ダウン方式又はボトム・アップ方式の２つの予算編成のタイプが考えられる。トップ・ダウン方式にこだわり過ぎると，各部門担当者のやる気を阻害してしまい，予算統制の機能が損なわれるおそれがないとはいえない。","a":true,"c":"","e":"トップ・ダウン方式にこだわり過ぎると，予算執行者の予算編成への参加機会を奪う結果としてその動機づけを損ない，予算目標の達成に支障を来す恐れがある。"},{"l":2,"m":"予算編成の方法","sb":"","r":"(Ｒ４Ⅰ⑬-イ)","q":"企業内の各部門の管理者が予算編成に参画することで，自ら受容できる目標としての予算の策定が期待される。それによって，管理者が予算の達成に向けて動機づけられる。","a":true,"c":"","e":"予算執行者である各部門の管理者を予算編成に参画(参加)させることで，予算目標に対する納得感と責任感を醸成することが可能となり，予算目標の達成に向けての動機づけ効果が高まることになる。"},{"l":3,"m":"予算編成の方法","sb":"","r":"(Ｒ３⑫-ア)","q":"ボトムアップ型予算は，現場への動機づけを重視して予算を主体的に編成させる方式であるが，全社的な利益計画との不整合をもたらすおそれがある。","a":true,"c":"","e":"ボトムアップ型の予算編成においては，予算執行部門が自ら予算目標を申告し，それらを予算担当部門が積み上げて総合予算を編成する。そのため，予算執行者の動機づけや現実的な目標値の設定に資"},{"l":4,"m":"予算編成の方法","sb":"","r":"(Ｒ６Ⅰ⑫-ウ)","q":"ボトム・アップ型の予算編成には，現場の情報を目標設定に反映することで実状に見合った目標値として予算が設定されるという長所があるが，その反面，企業全体の戦略や計画との整合性を欠く予算が設定されるおそれもある。","a":true,"c":"","e":"ボトムアップ型の予算編成においては，予算執行部門が自ら予算目標を申告し，それらを予算担当部門が積み上げて総合予算を編成する。そのため，予算執行者の動機づけや現実的な目標値の設定に資\nする反面，全社的な戦略や利益計画との整合性を欠く恐れがある。"},{"l":5,"m":"予算編成の方法","sb":"","r":"(Ｒ４Ⅱ⑪-ウ)","q":"ボトム・アップ方式による予算編成では，トップ・ダウン方式と比べて，各部門に予算目標を達成することを動機づける効果が期待され，全社的な計画との整合性を持つよう各部門の活動を調整することが容易となる。","a":false,"c":"","e":"ボトム・アップ方式の予算編成では，各部門から提出された予算を単純に合算するのではなく，全社的な計画との整合性に配慮しながら総合予算を編成する必要があり，トップ・ダウン方式と比べて，各部門の活動の調整に相当の手間を要することになる。"},{"l":6,"m":"予算編成の方法","sb":"","r":"(Ｈ31Ⅰ⑪-ウ)","q":"予算編成には，トップ・マネジメントから示されるトップダウン方式と，現場管理者から示されるボトムアップ方式がある。折衷方式では，トップダウン方式とボトムアップ方式のメリットを活かすことができる。","a":true,"c":"","e":"トップダウン方式とボトムアップ方式には一長一短があるため，両者の折衷方式を採用することにより，それぞれのメリットを活かす(デメリットを抑える)ことができる。"},{"l":7,"m":"予算編成の方法","sb":"","r":"(Ｒ６Ⅱ⑪-ウ)","q":"ボトム・アップ方式の予算編成においては，利益計画との整合性が欠けることがあるため，トップ・ダウン方式との折衷方式が採用されることがある。","a":true,"c":"","e":"ボトム・アップ方式の予算編成においては，全社的な利益計画との整合性を欠く側面がある。そこで，ボトム・アップ方式の動機づけ効果を損なわない範囲で，トップ・ダウン方式の要素を取り入れた折衷方式が採用されることがあり，それがむしろ通常であるといえる。"},{"l":8,"m":"予算編成の方法","sb":"","r":"(Ｈ30Ⅰ⑫-ア)","q":"予算編成に際し，トップ・マネジメントのスタッフが予算を作成し，それを一方的に現場部門に示達する方式があるが，現場の情報を活用するために部門管理者に各部門の予算を主体的に編成させる方式もある。後者の方式をとる場合，トップ・マネジメントが予算編成方針を示すことはない。","a":false,"c":"","e":"部門管理者に各部門の予算を主体的に編成させる方式(参加型)には，広義には，ボトムアップ方式と折衷方式の双方が含まれる。このうち，折衷方式では，まずトップ・マネジメントが予算編成方針を示すことになる。"},{"l":9,"m":"予算編成の方法","sb":"","r":"(Ｈ27Ⅰ⑫-イ)","q":"企業の予算管理の手順を事前，期中，事後に分類した場合に，事前の手順は，各部門の予算案の作成から始まり，全社的な調整とトップ・マネジメントによる総合予算の決定と示達により行われる。","a":false,"c":"","e":"予算管理の事前(予算編成)の手順は，一般的な折衷型を前提とした場合，予算編成方針の示達に始まり，各部門の予算案の作成，全社的な調整とトップ・マネジメントによる総合予算の決定と示達により行われる。また，厳密にいえば，トップ・マネジメントは総合予算の承認（決定）を行うのみであり，予算執行部門への示達自体は予算担当部門（経理部予算課）が行うものである。"},{"l":10,"m":"予算編成の方法","sb":"","r":"(Ｈ31Ⅰ⑪-ア)","q":"部門予算と総合予算とは，予算が適用される企業内組織の範囲に基づいた分類である。予算編成プロセスでは，各部門がそれぞれの活動を計画して部門予算を編成し，それらを調整せずに単純に足し合わせると企業全体の予算，すなわち総合予算が編成される。","a":false,"c":"","e":"予算編成のアプローチとして，ボトムアップ方式又はトップダウン方式とボトムアップ方式の折衷方式を採用する場合には，各部門の予算を基礎として総合予算を編成することになる。ただし，部門予算は各部門における独自計画に過ぎず，他部門の計画との整合性は考慮されていない。したがって，部門予算を単純に足し合わせるのではなく，予算担当部門がこれを全社的に調整することで，総合予算が編成される。"},{"l":1,"m":"総合予算の体系","sb":"","r":"(Ｈ20⑭-エ)","q":"収益と費用に関する予算については，最終的には見積損益計算書に集約される。","a":true,"c":"","e":"収益と費用に関する予算については，売上高予算，売上原価予算，販売費及び一般管理費予算，営業外損益予算として損益予算において検討され，見積損益計算書(予定損益計算書)に集約される。"},{"l":2,"m":"総合予算の体系","sb":"","r":"(Ｈ25Ⅰ⑭-オ)","q":"研究開発部門の活動は長期的な観点でマネジメントすべきであるため，研究開発費を単年度の損益予算に計上する企業はわずかである。","a":false,"c":"","e":"研究開発部門の活動を長期的な観点でマネジメントすべきこと，研究開発の効果が将来の年度におよぶことは確かであるが，現行会計基準において研究開発費は"},{"l":3,"m":"総合予算の体系","sb":"","r":"(Ｈ26Ⅱ⑫-エ)","q":"研究開発の効果は将来の年度におよぶため，収益・費用対応原則の観点から，研究開発費は年次の総合予算に含まれない。","a":false,"c":"","e":"研究開発部門の活動を長期的な観点でマネジメントすべきこと，研究開発の効果が将来の年度におよぶことは確かであるが，現行会計基準において研究開発費は\n一括費用処理が原則であるため，これを単年度の損益予算に計上する(年次の総合予算に含める)のが通常である。"},{"l":4,"m":"総合予算の体系","sb":"","r":"(Ｈ27Ⅰ⑫-エ)","q":"損益予算のみならず，資金予算を編成する理由の一つは，いわゆる「勘定合って銭足らず」という事態を回避することにある。","a":true,"c":"","e":"収益・費用の見積は収入・支出の見積と必ずしも一致しない。そこで，資金の過不足を事前に予測して計画的な資金繰りを行い，いわゆる「勘定合って銭足らず」という事態を回避するために，資金予算を編成するのである。"},{"l":5,"m":"総合予算の体系","sb":"","r":"(Ｈ27Ⅱ⑪-ア)","q":"業務予算の編成は，売上高予算の作成に始まり，見積キャッシュ・フロー計算書の作成で終わる。","a":false,"c":"","e":"経常予算としての総合予算は，損益予算(業務予算)と資金予算からなり，その編成は，損益予算における売上高予算の作成に始まり，資金予算における見積キャッシュ・フロー計算書の作成で終わるといえる。正しくは「総合予算の編成は…」である。"},{"l":6,"m":"総合予算の体系","sb":"","r":"(Ｈ29Ⅱ⑪-ア)","q":"資本予算は設備投資予算に代表される長期予算であるが，短期予算としての総合予算の中に組み込まれることがある。","a":true,"c":"","e":"長期予算としての資本予算は短期予算としての総合予算と概念上対比されるが，資本予算のうち次年度資本支出予算については，総合予算(資金予算)の中に組み込まれる。"},{"l":1,"m":"予算の修正と予算の種類","sb":"","r":"(Ｒ４Ⅱ⑪-エ)","q":"予算編成時点において予測できなかった経営環境の変化を予算に反映させるためにローリング(ころがし)方式を採用する予算を継続的予算という。","a":true,"c":"","e":"期間予算又は定期的予算は，一定の計画期間(通常は１年)について編成され，次の計画期間に関して新たな予算が作成される。これに対し，半期，四半期，月次など，一定期間が経過するごとにローリング(ころがし)方式で更新し，更新時に経過期間を加えて期間予算を継続的に維持する場合，当該予算を継続的予算という。"},{"l":2,"m":"予算の修正と予算の種類","sb":"","r":"(Ｒ２Ⅱ⑬-イ)","q":"期間予算又は定期的予算は，一定の計画期間(通常は１年)について編成され，次の計画期間に関して新たな予算が作成される。これに対し，一定の計画期間(例えば，半期，四半期，月次など)ごとにローリング方式(ころがし方式)で更新し，更新時に経過期間を加えて編成する予算を変動予算という。","a":false,"c":"","e":"一定の計画期間ごとにローリング方式(ころがし方式)で更新し，更新時に経過期間を加えて編成する予算とは，継続予算ないし継続的予算(ローリング予算)である。"},{"l":3,"m":"予算の修正と予算の種類","sb":"","r":"(Ｒ２Ⅱ⑬-ア)","q":"当初の年次予算や半期予算の編成で前提とされた環境条件は，その後に変化することが珍しくない。前提条件の変化が無視できない場合，当初予算を細分化して修正し，四半期予算や月次予算に統制機能を担わせる。この場合，年次予算や半期予算を基本予算，修正された予算を実行予算という。","a":true,"c":"","e":"環境変化の激しい現代においては，当初の年次予算や半期予算の妥当性が予算期間中に失われてしまうことが少なくない。そこで，環境変化に応じて，当初予算を細分化して修正し，四半期予算や月次予算に統制機能を担わせる場合がある。こ"},{"l":4,"m":"予算の修正と予算の種類","sb":"","r":"(Ｒ５Ⅰ⑪-イ)","q":"企業は新年度の開始までに年度予算を策定するが，経営環境の変化などによって当初想定した前提条件が大幅に変化する場合には，月次又は四半期単位で予算を修正することがある。このような予算を実行予算ということがある。","a":true,"c":"","e":"環境変化の激しい現代においては，当初の年次予算や半期予算の妥当性が予算期間中に失われてしまうことが少なくない。そこで，環境変化に応じて，当初予算を細分化して修正し，四半期予算や月次予算に統制機能を担わせる場合がある。こ\nの場合，当初予算を基本予算，細分化された修正予算を実行予算という。"},{"l":5,"m":"予算の修正と予算の種類","sb":"","r":"(Ｒ６Ⅰ⑫-イ)","q":"予算編成時に前提とした条件が変化した場合に，予算に期待される計画機能を維持するために予算を修正することがある。この修正された予算を実行予算と呼ぶ。","a":false,"c":"","e":"当初予算を修正し，実行予算を作成するのは，予算に期待される統制機能を維持するためである。"},{"l":6,"m":"予算の修正と予算の種類","sb":"","r":"(Ｈ23Ⅱ⑭-ア)","q":"精度の高い予算を策定できれば，予算統制における予算実績差異分析の必要性はなくなる。","a":false,"c":"","e":"ローリング方式を採用するなどして精度の高い予算を策定できれば，予算と実績が近似する結果として，予算実績差異分析の必要性は相対的に低下する。ただし，差異がゼロになるわけでない以上，予算実績差異分析を行わなければ業績評価を行ったり是正措置を講じたりすることはできないのであって，予算実績差異分析の必要性がなくなるわけではない。"},{"l":1,"m":"ゼロベース予算","sb":"","r":"(Ｈ23Ⅱ⑭-ウ)","q":"ゼロベース予算は，第１次・第２次オイルショック後に日本企業が考え出した予算編成方法である。","a":false,"c":"","e":"ゼロベース予算は，1960年代初頭に米国農務省によって最初に使用され、その後1970年代に米国企業（テキサス・インスツルメンツ社）での成功をもとに，州予算や連邦政府予算に採用されるに至った予算編成方法である。"},{"l":2,"m":"ゼロベース予算","sb":"","r":"(Ｒ２Ⅱ⑬-ウ)","q":"過去の支出額を考慮せず，あらゆる活動計画があたかも新規採用であるかのように，白紙状態からその正当性を検討する予算編成方式をゼロベース予算という。この方式と対照的なのは増分予算である。","a":true,"c":"","e":"ゼロベース予算とは，予算編成において過去の既得権(前年度実績)を一切認めず，ゼロから業務計画を編成する方法であり，前年度実績を基礎とする増分予算と対比される。"},{"l":3,"m":"ゼロベース予算","sb":"","r":"(Ｈ23Ⅱ⑭-カ)","q":"ゼロベース予算は，前年度の予算実績を基準とした予算作成方法である。","a":false,"c":"","e":"上記Ｒ２Ⅱ⑬の肢の解説を参照のこと。"},{"l":4,"m":"ゼロベース予算","sb":"","r":"(Ｈ30Ⅰ⑫-イ)","q":"広告宣伝費のような自由裁量費については，経営資源の効果的配分の観点からすると，増分予算よりゼロベース予算による管理が望ましいといえる。","a":true,"c":"","e":"増分予算では過年度の支出をベースとするため，無駄な支出が生じやすいのに対し，ゼロベース予算ではゼロから支出を再評価するため，無駄な支出を排除することができる。したがって，経営資源の効果的配分の観点からすると，自由裁量費についてはゼロベース予算による管理が望ましいといえる。"},{"l":5,"m":"ゼロベース予算","sb":"","r":"(Ｒ２Ⅰ⑪-イ)","q":"企業予算の設定方式として，増分予算ではなくゼロベース予算を用いることで，あらゆる活動計画の正当性が新規に検討されるため，無駄な支出を抑制することが期待できる。そのため，企業予算の全てに対しゼロベース予算を適用するべきである。","a":false,"c":"","e":"不確実性下において不測の事態に対処したり，部門間の対立関係を解消するなど，企業経営を円滑に進めるためには，緩衝材としての予算スラックの存在が不可欠となる。したがって，企業予算の全てに対してゼロベース予算を適用することは妥当でない。"},{"l":1,"m":"予算統制","sb":"","r":"(Ｈ20⑭-イ)","q":"予算は編成するだけではなく，予算と実績の比較もしたほうがよい。","a":true,"c":"","e":"予算執行者の業績評価のためにも，次期以降の目標達成に向けて是正措置を講じるためにも，予算と実績を比較した方がよいことは言うまでもない。"},{"l":2,"m":"予算統制","sb":"","r":"(Ｒ６Ⅱ⑪-イ)","q":"予算による統制には，事前，期中，事後の三つの統制活動があり，各部門の予算と実績を比較し，それをもとに是正措置を取る活動は，事後統制に限られるものではない。","a":true,"c":"","e":"環境変化の激しい現代の企業環境においては，予算期間終了後に予算実績比較を行って是正措置を講じる事後統制では遅きに失するため，予算期間中の統制活動が重要となる。期中統制においては，予"},{"l":3,"m":"予算統制","sb":"","r":"(Ｒ３⑫-ウ)","q":"予算による統制は，事前統制，期中統制，事後統制に分類される。期中統制において，管理者は，予算執行過程で予算目標の進捗状況を確認し，必要に応じて是正措置をとることが必要である。","a":true,"c":"","e":"環境変化の激しい現代の企業環境においては，予算期間終了後に予算実績比較を行って是正措置を講じる事後統制では遅きに失するため，予算期間中の統制活動が重要となる。期中統制においては，予\n算執行過程で予算目標の進捗状況を確認し，適時に是正措置を講じることが求められる。"},{"l":4,"m":"予算統制","sb":"","r":"(Ｈ29Ⅱ⑪-ウ)","q":"予算による統制は，事前統制・期中統制・事後統制という活動に分類される。この場合，各責任センターの予算と実績とを比較し，その分析結果を報告して是正措置を実施する活動は専ら事後統制として行われる。","a":false,"c":"","e":"期中統制においても予算実績比較や是正措置を実施する活動は行われ，変化の速い近年の企業環境では，事後統制よりも期中統制に重点がシフトしている。"},{"l":5,"m":"予算統制","sb":"","r":"(Ｈ28Ⅱ⑨-エ)","q":"変動予算は，予算期間内における実際のアウトプットに基づき計算される収益・費用からなり，予算編成プロセスの一環として予算期間開始時に策定される。","a":false,"c":"","e":"変動予算は実際のアウトプットに基づく業績測定用の予算であるから，予算統制プロセスの一環として予算期間終了後に策定される。"},{"l":6,"m":"予算統制","sb":"","r":"(Ｈ31Ⅰ⑪-イ)","q":"例外管理とは，企業の予算管理において予算と実績とを比較し，実績が予算から大きく乖離した部分へ経営者の注意を向けさせ，差異の発生原因を調査し，経営改善の措置をとる手法である。","a":true,"c":"","e":"例外管理とは，管理の対象を例外的事項のみにとどめることによって焦点を明確にし，効率的，効果的な管理活動を促進する考え方をいう。この考え方にしたがえば，予算管理の事後統制の局面においては，実績が予算から大きく乖離した部分に焦点を絞り，差異の発生原因の調査と是正措置を行うことになる。"},{"l":7,"m":"予算統制","sb":"","r":"(Ｒ４Ⅱ⑪-イ)","q":"予算実績差異分析を実施する際には，その差異が経営上重要な意味を持つと考える場合に，詳細なデータを収集し差異の原因を分析する。","a":true,"c":"","e":"事後統制の一環として予算実績差異分析を実施する際には，パーシャル・プランを採用する場合の標準原価差異分析と同様に，例外管理の考え方が採用される。つまり，全ての差異について原因分析を実施するのではなく，経営上重要な意味を持つと考えられる差異に限定して詳細な原因分析を行うことで，効率的・効果的な是正を意図している。"},{"l":1,"m":"営業費の分類と管理","sb":"","r":"(Ｒ２Ⅰ⑪-ア)","q":"注文獲得費は，費用（利益の減少要因）であると同時に，売上高の増大を通じて利益に貢献する戦略的投資（利益の増加要因）としての性質を有する。したがって，その管理の中心は費用効果分析に置かれ，その分析結果に基づいて，経営者が注文獲得費予算の総額を決定し，当該予算が編成される。","a":true,"c":"","e":"注文獲得費は，マネジド・コストとしての広告宣伝費に代表され，売上高の増大を通じて利益に貢献する戦略的投資としての性質を有する。したがって，節約すればよいという性質のものではなく，費用対効果が重要となる。ただし，因果関係に基づく効果の測定は困難であるため，その支出額は経営者が政策的に決定せざるをえず，注文獲得費予算を割当予算の形で設定することになる。"},{"l":2,"m":"営業費の分類と管理","sb":"","r":"(Ｒ２Ⅰ⑪-エ)","q":"保管費，輸送費および荷役費などの注文履行費は，注文獲得費に比して，反復的で，ある程度は標準化が可能である。したがって，注文履行費に標準原価又は変動予算による管理を適用することができる。","a":true,"c":"","e":"注文履行費は，製品の保管，包装，出荷，運送，売掛金の集金など，総じて機械的，反復的な作業から発生する。つまり，作業の標準化が可能であり，変動費としての性格が強いことから，標準原価ないし変動予算による管理が可能となる。"},{"l":3,"m":"営業費の分類と管理","sb":"","r":"(Ｒ２Ⅰ⑪-ウ)","q":"一般管理費は，役員・職員の給料，旅費交通費，通信費，事務用品費および減価償却費など，一般管理業務の遂行に関して発生する価値犠牲額である。その管理方法として，割当予算ではなく変動予算が最も適合するとされる。","a":false,"c":"","e":"一般管理費の多くは役員・職員の給料，減価償却費などの固定費であり，その管理方法としては，変動予算ではなく割当予算や固定予算が適合する。"},{"l":4,"m":"営業費の分類と管理","sb":"","r":"(Ｒ２Ⅱ⑬-エ)","q":"広告費，販売促進費又は研究開発費のような自由裁量原価に関する予算の編成に際して採用されることが多いのが割当型予算である。割当型予算はボトムアップ方式で設定されるのが通例である。","a":false,"c":"","e":"広告費，販売促進費又は研究開発費のような自由裁量原価については，資源の投入と効果の最適な関係が不明であるために，経営管理者が政策的に支出額を決定する割当型予算が採用される。つまり，割当型予算はトップダウン方式で設定されるのが通例である。"},{"l":1,"m":"予算ゲームと予算スラック","sb":"","r":"(Ｈ23Ⅱ⑭-エ)","q":"予算ゲームは，トップダウンで予算目標が決定されるとき，それを達成するために部門間で競争することを指している。","a":false,"c":"","e":"予算ゲームとは，ボトムアップで予算目標が決定されるとき，予算執行者がとる様々な対処行動をいう。"},{"l":2,"m":"予算ゲームと予算スラック","sb":"","r":"(Ｈ23Ⅱ⑭-イ)","q":"参加型予算編成の下では，予算スラックが生じやすい。","a":true,"c":"","e":"参加型予算編成の下では，予算執行者に予算編成への参加機会が与えられることから，虚偽の申告によって自らの予算目標の厳格度を緩めることが可能であり，予算スラックの問題が生じやすい。"},{"l":3,"m":"予算ゲームと予算スラック","sb":"","r":"(Ｈ25Ⅱ⑬-エ)","q":"組織メンバーが関与する参加型で予算を作成すると，予算スラックと呼ばれる問題が抑制される。","a":false,"c":"","e":"参加型予算管理では，多かれ少なかれ，各部門の予算管理者に予算編成への参加機会が与えられる。そのため，収益目標の過少申告や原価目標の過大申告による"},{"l":4,"m":"予算ゲームと予算スラック","sb":"","r":"(Ｒ６Ⅱ⑪-エ)","q":"参加型予算管理では，各部門の予算管理者が予算編成に参加するので，予算スラックの発生を回避できる。","a":false,"c":"","e":"参加型予算管理では，多かれ少なかれ，各部門の予算管理者に予算編成への参加機会が与えられる。そのため，収益目標の過少申告や原価目標の過大申告による\n予算スラックの発生(形成)を助長する傾向がある。"},{"l":5,"m":"予算ゲームと予算スラック","sb":"","r":"(Ｈ25Ⅱ⑬-ウ他複数)","q":"企業経営者の意思を強く反映したトップダウン型で予算を作成すると，予算ゲームと呼ばれる問題が深刻化する。","a":false,"c":"","e":"トップダウン型予算では，トップが定めた予算目標数値が各責任単位に割り当てられることから，予算執行者による予算ゲームや予算スラック形成の問題は生じ"},{"l":6,"m":"予算ゲームと予算スラック","sb":"","r":"(Ｒ３⑫-イ)","q":"予算ゲームは，予算編成過程における交渉上のゲームである。こうした交渉上のゲームは，特にトップダウン型予算において生じる。","a":false,"c":"","e":"トップダウン型予算では，トップが定めた予算目標数値が各責任単位に割り当てられることから，予算執行者による予算ゲームや予算スラック形成の問題は生じ\nない。それらが生じるのは，予算執行者に予算編成への参加機会が与えられるボトムアップ型ないしは参加型の予算においてである。"},{"l":7,"m":"予算ゲームと予算スラック","sb":"","r":"(Ｒ５Ⅰ⑪-ア)","q":"トップダウン型予算では，トップが定めた予算目標数値が各責任単位に割り当てられることから，収益の過小見積りや費用の過大見積りなどの予算スラックを誘発するという問題がある。","a":false,"c":"","e":"トップダウン型予算では，トップが定めた予算目標数値が各責任単位に割り当てられることから，予算執行者による予算ゲームや予算スラック形成の問題は生じ"},{"l":8,"m":"予算ゲームと予算スラック","sb":"","r":"(Ｈ26Ⅰ⑫-イ)","q":"予算スラックが形成される原因の１つは，トップマネジメントと現場の予算執行者との間に情報非対称性が存在するためである。","a":true,"c":"","e":"予算スラックが形成される原因の１つは，参加型の予算編成過程において，予算執行者の虚偽報告をトップマネジメントが知りえないという情報非対称性に求められる。"},{"l":9,"m":"予算ゲームと予算スラック","sb":"","r":"(Ｈ25Ⅰ⑭-カ)","q":"予算スラックとは，階層間の情報の非対称性を利用し，部下に気づかれないよう，上司が予算目標の厳格度を高める慣行を指す。","a":false,"c":"","e":"予算スラックとは，階層間の情報の非対称性を利用し，上司に気づかれないよう，部下が予算目標の厳格度を緩める慣行を指す。なお，厳密には，予算目標の厳格度を緩める行為自体は予算バイアスというべきである。"},{"l":10,"m":"予算ゲームと予算スラック","sb":"","r":"(Ｈ27Ⅱ⑪-イ)","q":"予算スラックとは，予算目標の達成を容易にするため，予算上の売上高と費用を過少に見積もることをいう。","a":false,"c":"","e":"予算スラックとは，参加型の予算編成過程において，予算執行者である部門管理者が意図的に予測情報を歪曲することによって生み出される「予算の水増し」を"},{"l":11,"m":"予算ゲームと予算スラック","sb":"","r":"(Ｈ29Ⅱ⑪-エ)","q":"予算スラックとは，参加型の予算編成の過程において，部門管理者が予算の厳格度を緩和することによって形成される予算額をいう。それゆえ，収益予算を容易に達成可能な水準に低く設定したり，費用として許容される予算額を過少に見積もることによって形成される。","a":false,"c":"","e":"予算スラックとは，参加型の予算編成過程において，予算執行者である部門管理者が意図的に予測情報を歪曲することによって生み出される「予算の水増し」を\nいう。これは，予算執行者が自らの業績評価を有利にするために形成するものであるから，費用については過大見積りが前提となる。"},{"l":12,"m":"予算ゲームと予算スラック","sb":"","r":"(Ｒ４Ⅰ⑬-ア)","q":"損益予算編成時の予算ゲームによって費用の過小見積もりが行われることで，利益目標の達成が容易になるように予算に組み込まれた余裕を予算スラックという。","a":false,"c":"","e":"予算スラックとは，参加型の予算編成過程において，予算執行者である部門管理者が意図的に予測情報を歪曲することによって生み出される「予算の水増し」を"},{"l":13,"m":"予算ゲームと予算スラック","sb":"","r":"(Ｈ26Ⅰ⑫-ウ)","q":"予算スラックは，環境変化への柔軟な対応に役立つこともあるので，必ずしも否定すべきものとは言えない場合もある。","a":true,"c":"","e":"不確実性の高い環境下において不測の事態が生じた場合や，部門間の対立関係が生じた場合には，予算スラックが緩衝材の役目を果たすことになる。したがって，予算執行者ではなく予算によって管理する側が上記の目的で形成する予算スラックについては，必ずしも否定されるべきでない。"},{"l":14,"m":"予算ゲームと予算スラック","sb":"","r":"(Ｈ31Ⅰ⑪-エ)","q":"予算スラックとは，予算編成過程において管理者によってなされる予算目標の厳格度を緩める慣行を指すが，予算管理の能率や有効性を適正に維持し，管理者の動機づけを損なわないようにするためには，全ての予算スラックを排除しなければならない。","a":false,"c":"","e":"予算管理の能率や有効性を適正に維持するとともに，管理者の動機づけを損なわないようにするためには，予算によって管理する側において，ある程度の予算スラックは許容するべきである。"},{"l":15,"m":"予算ゲームと予算スラック","sb":"","r":"(Ｈ26Ⅰ⑫-エ)","q":"予算スラックは，予算執行者の個人的な利得のために利用されることはないので，許容されることもある。","a":false,"c":"","e":"予算執行者が形成する予算スラックは，自らの業績評価を有利にするために，個人的な利得のために利用される。したがって，そのような過度の予算スラックは許容されるべきでない。"},{"l":16,"m":"予算ゲームと予算スラック","sb":"","r":"(Ｈ26Ⅰ⑫-ア)","q":"予算は，通常，トップマネジメントが示す予算編成方針に従って編成されるので，予算スラックが混入する余地はない。","a":false,"c":"","e":"通常はトップダウンとボトムアップの折衷型の予算編成が採用され，多かれ少なかれ，予算執行者には予算編成への参加機会が与えられるため，予算スラックが混入する余地がある。"},{"l":1,"m":"予算目標の厳格度","sb":"","r":"(Ｒ３⑫-エ)","q":"予算管理の目的の一つに，企業全体の利益目標を達成するために，具体的な計画を設定して希少な経営資源を配分することがある。この目的によると，予算目標は，達成が困難な水準のタイトネス(厳しさ)で設定されるのが望ましい。","a":false,"c":"","e":"予算は資源配分の手段であるため，企業全体の利益目標を達成するために，具体的な計画を設定して各責任単位に希少資源を配分することは，予算管理の目的の一つに数えられる。この目的に関して，予算目標を達成が困難な水準のタイトネスで設定すると，予算と実績が乖離する結果として資源配分のバランスが失われ，全社的な諸活動の調整に支障を来すことになる。そのため，予算目標は実現の見込みが高い水準のタイトネスで設定されるのが望ましいといえる。"},{"l":2,"m":"予算目標の厳格度","sb":"","r":"(Ｒ４Ⅰ⑫-エ)","q":"目標値としての予算の規範性は，総合的な利益管理の手段であることに求められる。これは，企業全体の利益目標を調和的に達成するために，各部門が自己の予算目標を達成しなければならないことを意味する。","a":true,"c":"","e":"同じ目標値であっても，標準原価と予算とでは必要とされる規範性の意味が異なる。つまり，標準原価における規範性とは，科学的，統計的調査に基づいて能率の尺度となるように予定された高いレベルでの目標を指し，実際原価との間で不利差異の発生が予定されていると言ってよい。この点，予算における規範性とは，企業全体の諸活動を調整し，利益目標を調和的に達成しうる過不足のない目標を指す。すなわち，少なくとも年次予算としての総合予算においては，資金予算の統制に不備が生じないように，期待水準での設定が求められ，予算実績差異については有利差異も不利差異も好ましくないものとして捉えられる。"},{"l":3,"m":"予算目標の厳格度","sb":"","r":"(Ｒ５Ⅰ⑪-ウ)","q":"予算管理の目的の一つに，組織目標の達成にむけて組織成員を動機づけることがある。そのために設定される事前統制としての予算目標は，努力しなければ達成できないようなストレッチな水準に設定することが望ましい。","a":true,"c":"","e":"予算管理(予算)は，資源配分の手段であると同時に，動機づけの手段でもある。前者の計画・調整目的からすれば，予算目標は実現の見込みが高い水準（期待水準）に設定することが求められるが，後者の事前統制目的からすれば，達成可能な範囲で最も厳しい水準（ストレッチ水準）に設定することが望ましいとされる。あえて厳しい目標を設定することで，目標達成意欲を喚起し，結果として最も良い業績を引き出すことが出来ると考えられるからである。"},{"l":1,"m":"脱予算経営","sb":"","r":"(Ｈ23Ⅱ⑭-オ)","q":"近年「予算は必要ない」との考え方が示されているが，日本で実際に予算管理をやめている企業はほとんどない。","a":true,"c":"","e":"近年，予算不要論ないし脱予算経営という考え方が欧米において台頭していることは確かであるが，日本において予算を廃止している企業は殆どない。"},{"l":2,"m":"脱予算経営","sb":"","r":"(Ｈ27Ⅰ⑫-ア)","q":"脱予算管理(BeyondBudgeting)の一つの論拠は，戦術的プロセスをマネジメントする役割を予算に期待できないことにある。","a":false,"c":"","e":"脱予算管理ないし予算不要論という考え方が台頭した背景には，予算には戦略をマネジメントする機能がないという認識のもとに，ＢＳＣが登場したことが関連している。正しくは「戦略的プロセスをマネジメントする役割を期待できない」である。"},{"l":3,"m":"脱予算経営","sb":"","r":"(Ｈ30Ⅰ⑫-ウ)","q":"予算管理の問題点の一つとして弾力性に欠けることが論じられてきたが，日本企業の場合，実行予算の編成やローリング予算などが用いられてこなかったため，脱予算管理(BeyondBudgeting)の議論が注目を浴びた。","a":false,"c":"","e":"日本企業においても，近年では実行予算やローリング予算が用いられている。また，実行予算やローリング予算は，脱予算管理の一環として採用されるものであり，実行予算やローリング予算が用いられてこなかったため，脱予算管理の議論が注目を浴びたわけではない。"},{"l":4,"m":"脱予算経営","sb":"","r":"(Ｒ５Ⅰ⑪-エ)","q":"予算管理の問題点の一つとして，予算編成作業に時間がかかりすぎることがある。脱予算経営(beyondbudgeting)の議論では，この問題点の解決には，経理部が中心となって前年度実績に基づく現実的な予算を策定することが有効であると主張されている。","a":false,"c":"","e":"脱予算経営の議論においては，主として予算の計画段階が批判の対象となっている。その代表的なものが，予算編成作業に時間がかかりすぎる（結果として，予算期間開始時には環境変化によって予算の妥当性が失われている）という批判である。そこで，この問題点の解決には，同業他社の実績など，相対的な業績目標を設定することが有効であると主張されている。"}]},{"n":12,"name":"資金管理とキャッシュ・フロー管理","qs":[{"l":1,"m":"資金管理の目的と領域","sb":"","r":"(Ｒ６Ⅰ⑬-エ)","q":"企業が利益を計上しているにもかかわらず資金繰りがつかず倒産することがあるのは，利益には資金の裏付けがないものがあるからである。","a":true,"c":"","e":"帳簿上は利益を計上している企業であっても，資金繰りがつかずに倒産することがある。このような「勘定合って銭足らず」という事態が起こりうるのは，収益・費用と収入・支出の不一致により，損益計算上の利益には必ずしも資金的な裏付けがないからである。"},{"l":2,"m":"資金管理の目的と領域","sb":"","r":"(Ｈ28Ⅱ⑬-イ)","q":"帳簿上は十分な利益が確保できているにもかかわらず，現金残高が不足して債務を支払うことができない状態を一般に「勘定合って銭足らず」というが，このような状態を回避するために，損益管理を徹底する必要がある。","a":false,"c":"","e":"損益管理のみを行っていれば「勘定合って銭足らず」という状態に陥る危険性がある。これを回避するためには，資金管理を徹底する必要がある。"},{"l":3,"m":"資金管理の目的と領域","sb":"","r":"(Ｈ24Ⅱ⑭-オ)","q":"資金管理には長期的なものと短期的なものがあるが，そのうち経常的な業務活動の遂行を安全に進めるためのキャッシュ管理を行うことが短期の資金管理の役割である。それはさらにキャッシュの効率的な運用をも目指さなければならず，設備投資の経済性計算もこの部類の資金管理に入る。","a":false,"c":"","e":"設備投資の経済性計算も設備資金という脈絡で資金管理に関連するが，それは短期ではなく長期の資金管理の部類に属する。"},{"l":4,"m":"資金管理の目的と領域","sb":"","r":"(Ｈ28Ⅰ⑪-ウ)","q":"資金管理の目的は支払不能状態の回避にあるため，資金を調達する上で，通常は自己資本による資金調達が優先される。","a":false,"c":"","e":"支払不能状態を回避するためには，借入等による資金調達と自己資本による資金調達を組み合わせることで，資金的な安全性を確保することに主眼が置かれるべきであり，必ずしも自己資本による資金調達が優先されるわけではない。"},{"l":5,"m":"資金管理の目的と領域","sb":"","r":"(Ｈ30Ⅰ⑭-ア)","q":"企業価値は，企業が将来において新たに創出するであろう価値を示すが，当該価値は収益力を表すため，割引キャッシュ・フロー法(ＤＣＦ法)によって企業価値を測る場合，資金管理の巧拙の影響は考慮されない。","a":false,"c":"","e":"ＤＣＦ法によって企業価値を測る場合，将来キャッシュ・フローの計算において運転資本の増減を考慮するし，割引計算に使用する加重平均資本コスト率（ＷＡＣＣ）の計算においては資本構成を考慮する。したがって，資金管理の巧拙の影響は考慮されているといえる。"},{"l":1,"m":"回転期間と資金管理の関係","sb":"","r":"(Ｈ25Ⅱ⑭-ア)","q":"増益基調であっても，売上債権回転期間やたな卸資産回転期間が伸張しているときは，黒字倒産のおそれがある。","a":true,"c":"","e":"増益基調であっても，入金待ちの期間が伸張しているときは，資金繰りが苦しくなるため，黒字倒産のおそれがある。"},{"l":2,"m":"回転期間と資金管理の関係","sb":"","r":"(Ｒ３⑬-ウ)","q":"売上債権回転期間(日)，棚卸資産回転期間(日)および仕入債務回転期間(日)に基づけば，収支の日数差は次式によって算出される。売上債権回転期間(日)＋棚卸資産回転期間(日)－仕入債務回転期間(日)","a":true,"c":"","e":"仕入代金を支払ってから売上代金の入金があるまでの収支の日数差(ＣＣＣ)は，「売上債権回転期間＋棚卸資産回転期間－仕入債務回転期間」によって算出される。"},{"l":3,"m":"回転期間と資金管理の関係","sb":"","r":"(Ｈ26Ⅰ⑬-ア)","q":"キャッシュ・コンバージョン・サイクルが長くなると，資金繰りが苦しくなる可能性が高まる。","a":true,"c":"","e":"ＣＣＣとは，仕入代金を支払ってから売上代金の入金があるまでの期間であるから，これが長期化すれば，手元資金が不足する結果として，資金繰りが苦しくなる可能性が高まる。"},{"l":4,"m":"回転期間と資金管理の関係","sb":"","r":"(Ｈ28Ⅱ⑬-ア)","q":"キャッシュ・サイクル(＝棚卸資産回転期間＋売上債権回転期間－買入債務回転期間)が長くなると，手元資金が不足し借入れが必要となるため，キャッシュ・サイクルは短い方が望ましい。さらに，手元資金に余裕がある場合でも，資金回収の観点からはキャッシュ・サイクルを短くすることが望ましい。","a":true,"c":"","e":"手元資金に余裕がある場合でも，ＣＣＣの期間は資金が棚卸資産又は売上債権として拘束されるため，より早期に回収できた場合と比べて機会原価が発生する。したがって，資金回収の観点から，ＣＣＣを短くするのが望ましい。"},{"l":5,"m":"回転期間と資金管理の関係","sb":"","r":"(Ｈ24Ⅱ⑭-ア)","q":"たな卸資産回転期間を短縮し，売掛金回転期間を短縮する一方で，買掛金回転期間を延長することによって，キャッシュ・コンバージョン・サイクルが短縮する。","a":true,"c":"","e":"ＣＣＣは「棚卸資産回転期間＋売掛金回転期間－買掛金回転期間」により算定されるため，その短縮は，①棚卸資産回転期間の短縮，②売掛金回転期間の短縮，③買掛金回転期間の延長によってもたらされる。"},{"l":6,"m":"回転期間と資金管理の関係","sb":"","r":"(Ｒ５Ⅰ⑯-イ)","q":"棚卸資産は販売により現金化できるので，在庫として保有する期間が長いほど資金繰りは向上する。","a":false,"c":"","e":"棚卸資産は販売ないし売上債権の回収によって初めて現金化するため，在庫として保有する期間(棚卸資産回転期間)は，資金が在庫に拘束されていることを意味する。したがって，在庫として保有する期間(棚卸資産回転期間)が長いほど，資金繰りは悪化することになる。"},{"l":7,"m":"回転期間と資金管理の関係","sb":"","r":"(Ｒ６Ⅰ⑬-ウ)","q":"棚卸資産回転期間と売上債権回転期間が延びても，キャッシュ・コンバージョン・サイクルが延びるとは限らない。","a":true,"c":"","e":"棚卸資産回転期間と売上債権回転期間が延びればＣＣＣも延びるのが通常であるが，それ以上に仕入債務回転期間が延びている場合には，ＣＣＣは短縮する。したがって，棚卸資産回転期間と売上債権回転期間が延びても，ＣＣＣが延びるとは限らない。"},{"l":8,"m":"回転期間と資金管理の関係","sb":"","r":"(Ｈ26Ⅰ⑬-ウ)","q":"買掛金回転期間を短縮することで，キャッシュ・コンバージョン・サイクルを短縮することができる。","a":false,"c":"","e":"ＣＣＣを短縮するためには，買掛金回転期間を延ばす必要がある。"},{"l":9,"m":"回転期間と資金管理の関係","sb":"","r":"(Ｒ６Ⅱ⑬-ア)","q":"前期と比較して，売上債権回転率が上昇し，棚卸資産回転率が変わらず，仕入債務回転率が低下すれば，キャッシュ・コンバージョン・サイクルの数値は前期より小さくなる。","a":true,"c":"","e":"回転率と回転期間は逆数の関係にあるため，売上債権回転率が上昇する一方で仕入債務回転率が低下すれば，売上債権回転期間が短縮する一方で仕入債務回転期間は伸長する。この場合，棚卸資産回転率（棚卸資産回転期間）に変化がなければ，ＣＣＣの数値は小さくなる。"},{"l":10,"m":"回転期間と資金管理の関係","sb":"","r":"(Ｒ５Ⅰ⑯-ア)","q":"短期のキャッシュ・フロー管理の手法には，販売から売上債権の回収までの回転期間に，棚卸資産の購入から仕入債務の支払いまでの回転期間を加算した数値で管理する手法がある。","a":false,"c":"","e":"短期のキャッシュ・フロー管理の手法として，売上債権回転期間と仕入債務回転期間の回転差を用いる場合がある。それは，販売から売上債権の回収までの回転期間(売上債権回転期間)を，棚卸資産の購入から仕入債務の支払いまでの回転期間(仕入債務回転期間)から控除した数値で管理する手法である。"},{"l":11,"m":"回転期間と資金管理の関係","sb":"","r":"(Ｈ24Ⅱ⑭-エ)","q":"仕入債務回転期間と売上債権回転期間の差から生じる資金を回転差資金と呼ぶことがあるが，いま仕入債務と売上債権の金額が同額という前提の下で，両者の回転期間の開始時期を揃えてみたとき，仕入債務の猶予期間が売上債権の未回収期間よりも長い場合，資金がその期間に運用されていると捉えることができる。","a":true,"c":"","e":"仕入債務の猶予期間が売上債権の未回収期間よりも長いということは，入金が支払に先行することを意味するから，支払までの期間において資金が運用されていると捉えることができる。"},{"l":12,"m":"回転期間と資金管理の関係","sb":"","r":"(Ｈ28Ⅰ⑪-ア)","q":"売掛金回転期間を短縮し，買掛金回転期間を延ばすことによって回転差資金を増加させ，資金繰りを好転させることができる。","a":true,"c":"","e":"回転差資金とは，売掛金回転期間と買掛金回転期間の開始時期を揃えた場合に，その回転差から生じる運用可能資金をいう。売掛金回転期間は入金待ちの未回収期間，買掛金回転期間は支払猶予期間であるから，前者を短縮し，後者を延ばすことによって回転差資金が増加し，資金繰りを好転させることができる。"},{"l":13,"m":"回転期間と資金管理の関係","sb":"","r":"(Ｈ26Ⅰ⑬-エ)","q":"売掛金回転期間をのばし，買掛金回転期間を短縮することで，回転差資金を増加させることができる。","a":false,"c":"","e":"運用可能資金をしての回転差資金を増加させるためには，売掛金回転期間を短縮する一方で，買掛金回転期間を延ばす必要がある。"},{"l":14,"m":"回転期間と資金管理の関係","sb":"","r":"(Ｈ30Ⅰ⑬-イ)","q":"資金管理上よく用いられる指標として，売上債権回転率，棚卸資産回転率等があるが，これらは売上高とそれぞれの残高を対比させその滞留状況を測るものである。当該数値は小さければ小さいほど投下資本が短期に回収されることを意味するため，望ましいといわれる。","a":false,"c":"","e":"売上債権回転率や棚卸資産回転率等は，売上高等を売上債権や棚卸資産等の平均残高で割ることで計算される。この場合，当該数値が大きければ大きいほど投下資本が短期に回収される(回転期間が短い)ことを意味するため，望ましいといわれる。"},{"l":1,"m":"運転資金等の管理(運転資金・現金資金・決算資金など)","sb":"","r":"(Ｈ29Ⅰ⑪-ア)","q":"正味運転資本は，期末売上債権と期末商品との差額に期末買入債務を加えたものである。","a":false,"c":"","e":"正味運転資本(運転資金)は，期末売上債権と期末商品の合計から期末買入債務を控除したものである。"},{"l":2,"m":"運転資金等の管理(運転資金・現金資金・決算資金など)","sb":"","r":"(Ｈ29Ⅱ⑬-ア)","q":"売上債権，たな卸資産，仕入債務の各金額を用いて算定される営業活動に係る所要運転資金について，その金額が減少する場合には，運転資金の状況は改善している。","a":true,"c":"","e":"営業活動に係る所要運転資金は，資金の需要を表すことから，その金額が減少する場合には，相対的に資金に余裕が生じることとなり，運転資金の状況は改善しているといえる。"},{"l":3,"m":"運転資金等の管理(運転資金・現金資金・決算資金など)","sb":"","r":"(Ｈ29Ⅰ⑪-ウ)","q":"売上債権の金額が，買入債務の金額よりもかなり大きい場合には，代金の回収が遅く支払が早い状態になる。すなわち，売上債権に資金が滞留し，支払に資金が循環し難い状況にあり，資金繰りは余裕がなくなる。","a":true,"c":"","e":"入金待ちの状態にある売上債権の金額が支払猶予の状態にある買入債務の金額よりもかなり大きい場合には，多くの支払が先行することから，資金繰りは余裕がなくなる。"},{"l":4,"m":"運転資金等の管理(運転資金・現金資金・決算資金など)","sb":"","r":"(Ｒ６Ⅰ⑬-イ)","q":"流動資産から流動負債を差し引いて求められる運転資本が増加している場合は，日々の事業活動のための追加の資金調達をする必要はない。","a":false,"c":"","e":"流動資産から流動負債を差し引いて求められる運転資本(正味運転資本)が増加しているということは，短期的に拘束される資金の増加を意味することから，その分だけ資金の需要が生じることになる。したがって，日々の事業活動のために，追加で資金調達を行う必要が生じる。"},{"l":5,"m":"運転資金等の管理(運転資金・現金資金・決算資金など)","sb":"","r":"(Ｒ６Ⅱ⑬-イ)","q":"流動資産から流動負債を差し引いて求められる正味運転資本が増加すれば，現金と預金の合計額が増加するので，必ず短期的な支払能力は向上する。","a":false,"c":"","e":"流動資産から流動負債を差し引いて求められる正味運転資本の増加は，現金預金ではなく所要運転資金（売上債権＋棚卸資産－仕入債務）の増加を主たる要因とする。この場合，短期的に資金需要が増加する一方で，手元流動性に変化はないため，支払能力が必ず向上するとはいえない。"},{"l":6,"m":"運転資金等の管理(運転資金・現金資金・決算資金など)","sb":"","r":"(Ｈ29Ⅰ⑪-エ)","q":"商品引渡し時に代金回収されたものおよび貸倒損失となったものを除き，売上代金の回収額は，当期の売上高，売掛金の期首と期末との増減差額，前受金の当期の入金額および前受金の期首と期末との増減差額から算定することができる。","a":true,"c":"","e":"・売上代金(売掛金)の回収額＝売掛金期首残高＋当期掛売上高－売掛金期末残高・当期掛売上高＝当期売上高－(期首前受金残高＋当期前受金入金額－期末前受金残高)"},{"l":7,"m":"運転資金等の管理(運転資金・現金資金・決算資金など)","sb":"","r":"(Ｈ22Ⅱ⑮-ア)","q":"通常の営業活動では，売上代金の回収よりも仕入代金や諸経費の支払いが先行するために，営業取引先との関係において立て替え払いが発生する。その性質は債権債務関係が中心であり，運転資金の所要額からは，支払い準備としての手許現金預金を除外する必要がある。","a":false,"c":"","e":"営業取引先との関係において発生する立て替え払いの性質は債権債務関係が中心であるが，企業としては，その他の経常的な諸経費の支払いや予期しえない不測の支払いに備える必要がある。したがって，運転資金の所要額の中には，支払い準備としての手許現金預金を含める必要がある。"},{"l":8,"m":"運転資金等の管理(運転資金・現金資金・決算資金など)","sb":"","r":"(Ｈ22Ⅱ⑮-イ)","q":"運転資金の必要額は一般に，営業活動や生産活動の量的な増減に比例して増減する。その活動の量的変化は通常，売上高の増減に比例することから，運転資金の必要額も売上高の増減を基準にして算定する。","a":true,"c":"","e":"棚卸資産や仕入債務の増減は売上原価や仕入高の増減によって生じるが，売上原価や仕入高は売上高に比例する。つまり，売上債権，棚卸資産，仕入債務はいずれも売上高に比例して増減するため，運転資金の必要額も売上高の増減を基準に算定するのが通常である。"},{"l":9,"m":"運転資金等の管理(運転資金・現金資金・決算資金など)","sb":"","r":"(Ｈ22Ⅱ⑮-ウ)","q":"通常は売上高の増加によって運転資金に不足が生ずるが，売上高が減少する場合でも運転資金の不足に陥るケースがある。その原因として，需要の読み違いによる在庫増や，無理な販売による売掛金の回収長期化などの影響を指摘できる。","a":true,"c":"","e":"需要を読み違えれば，売上高の減少に伴って在庫が増加するため，運転資金の負担は増加する。また，売上高の減少を補填するために無理な押し込み販売を行えば，売掛金の回収期間が長期化する結果として運転資金の負担は増加する。"},{"l":10,"m":"運転資金等の管理(運転資金・現金資金・決算資金など)","sb":"","r":"(Ｈ28Ⅱ⑬-ウ)","q":"手形割引を含む短期借入金の増減は，運転資金の必要額の増減に連動するのが通常であるが，運転資金の増減がない場合であっても短期借入金が増加しているケースがある。その原因として，急速な売上拡大に伴う売上債権の増加などの影響がある。","a":false,"c":"","e":"運転資金の増減がない場合であっても，短期借入金が増加しているケースはあるが，「急速な売上拡大に伴う売上債権の増加」は運転資金の必要額の増加に他ならず，上記の原因の例示としては不適切である。なお，運転資金の増減がない場合に短期借入金が増加しているということは，それが設備資金に利用されているということであり，望ましい資金の流れとはいえない。"},{"l":11,"m":"運転資金等の管理(運転資金・現金資金・決算資金など)","sb":"","r":"(Ｈ22Ⅱ⑮-エ)","q":"ボーナス商戦やクリスマス商戦など商品需要に季節性がある場合，運転資金に係る循環サイクルの前半期は仕入れと在庫に関する資金不足，後半期は売上債権の膨張に伴う資金不足が生ずる。したがって，前半期は手形割引による資金調達，後半期は短期借入金を利用した資金調達によることになる。","a":false,"c":"","e":"商品需要に季節性がある場合，運転資金に係る循環サイクルにおいて，仕入と在庫に関する資金不足が生じる前半期は短期借入金を利用した資金調達，売上債権の膨張に伴う資金不足が生じる後半期は手形割引による資金調達によることになる。"},{"l":12,"m":"運転資金等の管理(運転資金・現金資金・決算資金など)","sb":"","r":"(Ｒ３⑬-イ)","q":"流動資産から流動負債を差し引いた運転資金がプラスであれば，運転資金は長期借入金のみによってまかなわれていることを示している。","a":false,"c":"","e":"流動資産から流動負債を差し引いた運転資金(正味運転資本)がプラスの場合，運転資金は長期資金によってまかなわれていることになるが，長期資金には各種の固定負債と自己資本が含まれる。したがって，長期借入金のみによってまかなわれているとは限らない。"},{"l":13,"m":"運転資金等の管理(運転資金・現金資金・決算資金など)","sb":"","r":"(Ｈ28Ⅱ⑬-エ)","q":"資金繰りを検討する上で，買入債務の支払について現金による場合と小切手の振出しによる場合とでは，資金繰りに与える影響が異なる場合がある。","a":true,"c":"","e":"買入債務の支払について，現金による場合と小切手の振り出しによる場合では，支出が生じるタイミングが異なる。したがって，支払方法としていずれを選択するかによって，資金繰りに与える影響が異なる場合がある。"},{"l":14,"m":"運転資金等の管理(運転資金・現金資金・決算資金など)","sb":"","r":"(Ｈ29Ⅱ⑬-ウ)","q":"資金管理において，現金および当座預金は，次の活動において必要となる他の資産に転化するために保有されており，保有されたままでは利益を生み出さない資産である。","a":true,"c":"","e":"現金および当座預金(要求払預金)は，いわば支払準備のために手元資金として運用しているものであるが，それら現金資金の収益性はゼロに等しい。"},{"l":15,"m":"運転資金等の管理(運転資金・現金資金・決算資金など)","sb":"","r":"(Ｈ26Ⅰ⑬-イ)","q":"保有流動資産を最低限の水準に保つことで，収益性の向上に貢献することができる。","a":true,"c":"","e":"保有流動資産を最低限の水準に保つことで，これを多く保有する場合と比べて短期的な支払能力は低下するものの，投資利益率が改善する結果として，収益性の向上に貢献することができる。"},{"l":16,"m":"運転資金等の管理(運転資金・現金資金・決算資金など)","sb":"","r":"(Ｈ28Ⅰ⑪-イ)","q":"資金管理において，資本コストを上回るリターンが得られる設備投資の案件がある場合，保有する現金及び要求払預金の在高を最低限の水準まで減少させて投資を行うことがある。","a":true,"c":"","e":"現金資金の保有残高について積極的アプローチを採る場合には，資本コストを上回るリターンが得られる設備投資案件があれば，現金資金を最低限の水準まで減少させて投資を行うことがある。"},{"l":17,"m":"運転資金等の管理(運転資金・現金資金・決算資金など)","sb":"","r":"(Ｈ22Ⅱ⑮-オ)","q":"決算資金の使途は，納税資金や配当資金によって占められる。このうち，期末決算後に必要となる納税資金は，当期の利益に対して課せられる納税額のすべてではなく，中間納税額を除いたものである。","a":true,"c":"","e":"当期の利益に対して課せられる税額のうち中間申告額は既に納付済みであることから，期末決算後に必要となる納税資金は中間納税額を除いたものとなる。"},{"l":1,"m":"その他のキャッシュ・フロー論点","sb":"","r":"(Ｈ29Ⅰ⑪-ウ)","q":"一般的に，製造業と卸売業では，総資本が同額の場合，製造業は卸売業に比べて資産に対する売上高が大きくなるため，その分，営業キャッシュ・フローに占める減価償却費が生み出すキャッシュ・フローの割合は小さくなる。","a":false,"c":"","e":"一般に，製造業と卸売業では，売上高が同額の場合，総資本(総資産)は製造業の方が大きくなる。したがって，総資本が同額の場合には，製造業は卸売業に比べて資産に対する売上高が小さくなるため，その分，営業キャッシュ・フローに占める減価償却費が生み出すキャッシュ・フローの割合は大きくなる。"},{"l":2,"m":"その他のキャッシュ・フロー論点","sb":"","r":"(Ｈ29Ⅱ⑬-エ)","q":"減価償却費に関しては，年度末に計上される賞与引当金繰入額と同様に，当年度に発生する費用に係る資金の流出が次年度以降に生ずる。","a":false,"c":"","e":"減価償却費に関しては，支出済みの過去原価であり，当年度に発生する費用に係る資金の流出は，過去の投資時点で既に生じている。"},{"l":1,"m":"キャッシュ・フロー計算書","sb":"","r":"(Ｈ24Ⅱ⑭-ウ)","q":"直接法によってキャッシュ・フロー計算書を作成すると，営業活動によるキャッシュ・フローの増減の原因を理解でき，キャッシュ・フローを企業の営業活動と関わらせて捉えることができる。","a":true,"c":"","e":"直接法によってキャッシュ・フロー計算書を作成すると，間接法によるキャッシュ・フロー計算書では得られない収支の総額情報を入手しうるため，営業活動によるキャッシュ・フローの増減の原因を理解することができ，キャッシュ・フローを企業の営業活動と関わらせて捉えることができる。"},{"l":2,"m":"キャッシュ・フロー計算書","sb":"","r":"(Ｈ29Ⅱ⑬-イ)","q":"間接法によるキャッシュ・フロー計算書の主たる作成目的は，日々の資金繰りを行うことにある。","a":false,"c":"","e":"キャッシュ・フロー計算書は，一会計期間におけるキャッシュ・フローの状況を一定の活動区分別に表示するべく，事後的に作成されるものであり，日々の資金繰りに利用することはできない。"},{"l":3,"m":"キャッシュ・フロー計算書","sb":"","r":"(Ｈ24Ⅱ⑭-イ)","q":"事業のライフサイクルやビジネス・モデルなどの違いはキャッシュ・フローの違いとして現れてくる。例えば，事業の創生期には，投資活動によるキャッシュ・フローが大きなマイナスとなり，財務活動によるキャッシュ・フローはプラス，営業活動によるキャッシュ・フローがマイナスとなるのが一般的であり，成長期には営業活動によるキャッシュ・フローがプラスに転じ，投資活動によるキャッシュ・フローと財務活動によるキャッシュ・フローはマイナスというのが一般的なパターンである。","a":false,"c":"","e":"事業の成長期においては，投資需要が旺盛にあり，これを営業活動によるキャッシュ・フローで賄うことは困難であることから，財務活動によるキャッシュ・フローはプラスになるのが一般的である。"},{"l":4,"m":"キャッシュ・フロー計算書","sb":"","r":"(Ｈ28Ⅰ⑪-エ)","q":"創業当初の企業のキャッシュ・フロー計算書においては，営業活動によるキャッシュ・フローと財務活動によるキャッシュ・フローがマイナスとなり，投資活動によるキャッシュ・フローによって賄われることが多い。","a":false,"c":"","e":"創業当初の企業のキャッシュ・フロー計算書においては，営業活動によるキャッシュ・フローと投資活動によるキャッシュ・フローがマイナスとなり，財務活動によるキャッシュ・フローによって賄われることが多い。"},{"l":5,"m":"キャッシュ・フロー計算書","sb":"","r":"(Ｈ30Ⅰ⑭-ウ)","q":"企業のライフサイクルとキャッシュ・フローとの相関関係に限定すれば，製品は売れるが投資はあまり必要ではなくなり，逆に財務キャッシュ・フローがマイナスとなるような状態は，企業のライフサイクルの成熟期にあると考えられる。","a":true,"c":"","e":"企業のライフサイクルの成熟期には，営業面の成長が緩やかに継続する一方で，投資規模は縮小し，豊富な資金を配当金の拡充や負債の返済に充てるという状況が想定されるため，財務キャッシュ・フローがマイナスとなりやすい。"}]},{"n":13,"name":"差額原価収益分析・設備投資の経済性計算","qs":[{"l":1,"m":"差額原価収益分析総論(特殊原価など)","sb":"","r":"(Ｈ25Ⅰ⑳-ア)","q":"代替案の原価を計算する場合には，各代替案を採用したときに予測される未来原価に基づくのであって，過去原価は含めない。","a":true,"c":"","e":"過去原価とは支出済みの原価であり，意思決定に無関連な埋没原価である。"},{"l":2,"m":"差額原価収益分析総論(特殊原価など)","sb":"","r":"(Ｈ25Ⅰ⑳-イ)","q":"未来原価であっても，代替案によって発生額が異ならない原価は意思決定に影響を与えない。","a":true,"c":"","e":"未来原価であっても，代替案間で差額が生じないのであれば，意思決定には影響を与えない。したがって，広義には，未来原価の一部を埋没原価と捉えることもある。"},{"l":3,"m":"差額原価収益分析総論(特殊原価など)","sb":"","r":"(Ｈ29Ⅰ⑭-ア)","q":"何らかの経営活動の意思決定を行うに当たって，特定の代替案の選択により生ずる原価の変動金額のことを差額原価という。また，代替案の選択に関連せず金額の変化しない原価のことを埋没原価という。固定費は操業度の増減にかかわらず一定期間変化しないで同額が発生する原価ではあるが，その全てが埋没原価になるとは限らない。","a":true,"c":"","e":"固定費は短期的な操業度の増減にかかわらず一定額発生するため，埋没原価（無関連原価）となるのが通常であるが，特定の代替案の選択によって追加的に貨幣犠牲を伴うのであれば，差額原価（関連原価）に含まれる。なお，関連原価は本来認識概念とされる"},{"l":4,"m":"差額原価収益分析総論(特殊原価など)","sb":"","r":"(Ｒ６Ⅱ⑨-ウ)","q":"業務的意思決定における代替案の選択において，ある意思決定に関連して増減する原価を関連原価と呼ぶ。関連原価には固定費が含まれる場合がある。","a":true,"c":"","e":"固定費は短期的な操業度の増減にかかわらず一定額発生するため，埋没原価（無関連原価）となるのが通常であるが，特定の代替案の選択によって追加的に貨幣犠牲を伴うのであれば，差額原価（関連原価）に含まれる。なお，関連原価は本来認識概念とされる\nが，Ｒ６Ⅱ⑨の肢のように，測定概念としての差額原価と区別せずに使用されることが少なくない。"},{"l":5,"m":"差額原価収益分析総論(特殊原価など)","sb":"","r":"(Ｈ22Ⅱ⑲-ア)","q":"未来原価(futurecosts)は代替案選択の意思決定における重要な概念である。差額原価分析は，代替案間に金額の差がみられない未来原価を差額原価に集計する。","a":false,"c":"","e":"未来原価といえども，代替案間で差額が生じないのであれば，意思決定には影響を与えない。正しくは，代替案間に金額の差がみられる未来原価を差額原価に集計する。"},{"l":6,"m":"差額原価収益分析総論(特殊原価など)","sb":"","r":"(Ｈ22Ⅱ⑲-エ)","q":"限界原価(marginalcosts)は，本来，経済学上の概念で，総費用関数の第一次導関数，すなわち，操業度ないし生産量の無限小の変化に対する総費用の変化額であると定義される。なお，原価計算や管理会計では，一定範囲での操業変化がもたらす原価の増減分として扱っている。","a":true,"c":"","e":"限界原価とは，本来は操業度ないし生産量の変化に対する限界的な原価の変化額を指すが，原価計算や管理会計においては変動費とほぼ同義で使用され，差額原価の下位概念として位置付けられる。"},{"l":7,"m":"差額原価収益分析総論(特殊原価など)","sb":"","r":"(Ｈ22Ⅱ⑲-イ)","q":"ある代替案を採択することで他の代替案を選択できなくなることがある。採択されなかった代替案から得られたであろう利益の中で，最大のものを機会原価(opportunitycosts)という。","a":true,"c":"","e":"機会原価とは，現実のキャッシュ・アウトフローは伴わないものの，ある代替案を採択する結果として断念した機会から得られたはずの最大のキャッシュ・インフロー(利益)をいい，現金支出原価とともに差額原価を構成する。"},{"l":8,"m":"差額原価収益分析総論(特殊原価など)","sb":"","r":"(Ｈ29Ⅰ⑭-ウ)","q":"機会原価とは，ある代替案を選択することによって他の代替案が選択できなくなった場合，選択されなかった代替案から得られたであろう利益の中で最大のものである。したがって，最適な意思決定を行うためには，代替案の中で差額利益と機会原価が共に最大になるものを考慮すればよい。","a":false,"c":"","e":"最適な意思決定を行うためには，差額利益が最大のものを選択する必要があるが，それは機会原価(機会損失)を最小化することを意味する。"},{"l":9,"m":"差額原価収益分析総論(特殊原価など)","sb":"","r":"(Ｈ25Ⅰ⑳-ウ)","q":"財務諸表作成目的などを有する原価計算は支出原価だけに基づいて製品原価を計算するのに対し，差額原価収益分析は機会原価だけに基づいて計算する。","a":false,"c":"","e":"差額原価は現金支出原価と機会原価からなるのであって，機会原価だけに基づいて計算するわけではない。"},{"l":10,"m":"差額原価収益分析総論(特殊原価など)","sb":"","r":"(Ｈ22Ⅱ⑲-ウ)","q":"原価の発生が既に確定しており，どの代替案を採択しても回避し得ない原価を埋没原価(sunkcosts)という。","a":true,"c":"","e":"厳密には回避不能原価というべきであるが，回避不能原価は埋没原価の下位概念であり，本肢の記述に誤りはない。"},{"l":11,"m":"差額原価収益分析総論(特殊原価など)","sb":"","r":"(Ｈ22Ⅱ⑲-オ)","q":"業務を縮小したり停止したりする案の採択により発生を回避できる原価は回避可能原価(avoidablecosts)に分類する。複数製品を製造する工場において，ある製品のすべてをアウトソーシングに切り替えるか否かの分析では，固定製造原価は回避不能原価(unavoidablecosts)に分類されることになる。","a":false,"c":"","e":"ある製品をアウトソーシングに切り替えるか否かの分析において，固定製造原価の全てが回避不能原価(埋没原価)に分類されるわけではない。例えば，当該製品の専用機械のリース料は，アウトソーシングに切り替える場合には現金支出が回避されるため，回避可能原価(差額原価)に分類される。"},{"l":12,"m":"差額原価収益分析総論(特殊原価など)","sb":"","r":"(Ｈ29Ⅱ⑨-ウ)","q":"代替案の選択に関する意思決定に際して，原価に増減変化が生じるものを関連原価といい，それには過去原価および未来原価が含まれる。","a":false,"c":"","e":"関連原価は差額原価として測定され，差額原価には未来原価のみが含まれる。"},{"l":13,"m":"差額原価収益分析総論(特殊原価など)","sb":"","r":"(Ｈ29Ⅰ⑭-エ)","q":"差額原価収益分析においては，意思決定によって変化する増分に焦点を当てた増分法が用いられ，総額に基づく分析は行われない。","a":false,"c":"","e":"差額原価収益分析の方法には総額法と差額法(増分法)があり，重要なキャッシュ・フローを見落とさないためにも，分析に当たっては総額法を採用すべきであるといわれる。"},{"l":1,"m":"業務的意思決定","sb":"","r":"(Ｒ２Ⅰ⑨-ウ)","q":"経営意思決定の種類の一つである業務的意思決定は，生産・販売能力の変更を伴わない意思決定を指す。業務的意思決定は，短期的な問題であり，通常，予算編成の中で検討される問題であるため，経済計算に際し，発生主義の会計を使用し，貨幣の時間価値を考慮しない。","a":true,"c":"","e":"業務的意思決定は，現状の経営構造を前提とする意思決定であるため，投資は少額にとどまり，意思決定の効果が及ぶ期間も短期にとどまる。この場合，犠牲になる利子の重要性が低いため，経済計算に際し，貨幣の時間価値を考慮しないのが通常である。また，予算編成の過程において行われる意思決定であるため，損益予算と同じ発生主義の会計を使用するのが通常である。"},{"l":2,"m":"業務的意思決定","sb":"","r":"(Ｈ29Ⅰ⑭-イ)","q":"余剰生産能力があり，かつ，新規顧客から通常価格より低い価格の特別注文があった場合，その差額利益がプラスであったとしても，既存顧客からの受注への影響を考慮すると，この特別注文を引き受けるとは限らない。","a":true,"c":"","e":"通常価格より低い価格で特別注文を引き受けたとすれば，既存顧客からも値引き要請が生じる結果として，かえって収益構造が圧迫されてしまう恐れがある。したがって，差額利益がプラスであったとしても，特別注文を引き受けるとは限らない。"},{"l":3,"m":"業務的意思決定","sb":"","r":"(Ｈ25Ⅰ⑳-エ)","q":"連産品を追加加工するかどうかにあたって，連結原価は埋没原価になる。","a":true,"c":"","e":"連産品の連結原価は，追加加工の有無にかかわらず発生するため，追加加工の可否の意思決定には無関連な埋没原価として扱われる。"},{"l":4,"m":"業務的意思決定","sb":"","r":"(Ｈ26Ⅱ⑭-ウ)","q":"ＥＯＱモデルの仮定では，１回当たりの発注量は同じであり，製品や材料の購入価格も発注量にかかわらず一定である。","a":true,"c":"","e":"ＥＯＱモデルでは，①毎回同じ数量を発注する，②需要，発注費，保管費，リードタイムを確実に知ることができる，③購入価格は発注量の影響を受けない，④品切れは生じない，などの仮定を設けており，本肢はこのうち①と③について述べたものである。"},{"l":5,"m":"業務的意思決定","sb":"","r":"(Ｈ25Ⅰ⑳-オ)","q":"経済的発注量(economicorderquantity)の計算にあたって関連原価となるのは，生産量に応じて変化する原価だけである。","a":false,"c":"","e":"経済的発注量の計算にあたって関連原価となるのは，発注量に応じて変化する原価だけである。"},{"l":6,"m":"業務的意思決定","sb":"","r":"(Ｈ26Ⅱ⑭-ア)","q":"ＥＯＱ(EconomicOrderQuantity)モデルを用いる場合，発注１回当たりの費用を16分の１にすると，経済的発注量は８分の１になる。","a":false,"c":"","e":"ＥＯＱモデルを用いる場合，発注１回当たりの費用を16分の１にすると，経済的発注量は４分の１になる。これについては生産・在庫管理(現在は試験範囲外)の知識であるため，押さえなくてよい。"},{"l":1,"m":"設備投資の種類","sb":"","r":"(Ｈ29Ⅱ⑭-ウ)","q":"資本予算の編成は，企業の主要な投資案の識別，評価，採択などを行うプロセスであり，資本予算に関する意思決定には生産設備の取替えや拡張などがある。","a":true,"c":"","e":"代表的な設備投資の種類として，取替投資や拡張投資が挙げられる。"},{"l":2,"m":"設備投資の種類","sb":"","r":"(Ｈ29Ⅱ⑭-エ)","q":"投資計画は，収益拡大効果があるものと原価低減効果があるものに区別することができる。収益拡大効果があるものには，新製品開発投資や既存設備の取替投資などがあり，原価低減効果があるものには，既存製品の拡張投資や作業の機械化のための合理化又は省力化投資などがある。","a":false,"c":"","e":"収益拡大効果があるものには，新製品開発投資や既存製品の拡張投資などがあり，原価低減効果があるものには，既存設備の取替投資や作業の機械化のための合理化又は省力化投資などがある。"},{"l":1,"m":"キャッシュ・フローと資本コスト率の見積り","sb":"","r":"(Ｈ21⑲-イ)","q":"投資命数のすべての期間にわたって十分な課税所得が期待できる場合，当該投資案の減価償却費は税引後営業キャッシュ・フローを増やすことになるが，こうした現象をタックス・クレジットという。","a":false,"c":"","e":"減価償却費の損金算入による税引後営業キャッシュ・フローの増加現象は，タックス・シールドといわれる。"},{"l":2,"m":"キャッシュ・フローと資本コスト率の見積り","sb":"","r":"(Ｈ29Ⅱ⑭-イ)","q":"取替投資の経済性計算において，旧設備が廃棄されて他の用途に用いられず，かつ税節約額を考慮しない場合，旧設備の未償却残額は埋没原価となる。","a":true,"c":"","e":"旧設備の未償却残額は支出済みの過去原価であるから，取替投資の意思決定に無関連な埋没原価となる。ただし，法人税等への影響を考慮する場合には，売却損(未償却残額－売却価額)の損金算入によって法人税等が減少するため，その場合には未償却残額の一部が計算上は差額キャッシュ・フローを構成することになる。"},{"l":3,"m":"キャッシュ・フローと資本コスト率の見積り","sb":"","r":"(Ｈ21⑲-ア)","q":"各年度の見積正味キャッシュ・フローは，複数の予測値にそれぞれの生起確率を掛け合わせ算定した期待値である。","a":true,"c":"","e":"現実には確実性下のキャッシュ・フローの予測など不可能であり，将来キャッシュ・フローの見積りは，複数の事象が生起する可能性を考慮した期待値計算となる。なお，将来キャッシュ・フローの見積りの方法には，生起する可能性の最も高い単一の金額を見積もる最頻値法もあるが，より理論的とされるのは期待値法である。他に明らかな×肢が存在したことからも，本肢は〇と判定された。"},{"l":4,"m":"キャッシュ・フローと資本コスト率の見積り","sb":"","r":"(Ｈ21⑳-イ)","q":"不確実性等のリスクを割引キャッシュ・フロー法に取り込むための簡便法には，キャッシュ・フローの見積りを保守的にする，あるいは，資本コストを高めに見積る，といった方法がある。","a":true,"c":"","e":"不確実性等のリスクを割引キャッシュ・フロー法に取り込むための方法としては，不確実なキャッシュ・フローをリスク調整割引率で割り引く方法（リスク調整割引率法）と，不確実なキャッシュ・フローを確実なキャッシュ・フローに変換し，これを安全利子率で割り引く方法（確実性等価法）とがある。簡便的には，リスク調整割引率法は資本コスト(率)を高めに見積もることで，確実性等価法はキャッシュ・フローの見積りを保守的にすることで代替できる。"},{"l":5,"m":"キャッシュ・フローと資本コスト率の見積り","sb":"","r":"(Ｈ31Ⅱ⑮-ア)","q":"設備投資に要する資本コストは，資金提供者の期待収益を示すものであり，年利率で表した資本コスト率は，加重平均資本コスト率(ＷＡＣＣ)で計算されることがある。当該資本コスト率は投資の意思決定の判断には重要であり，誤って高く設定すると適切な投資案を棄却することにつながる。","a":true,"c":"","e":"ＷＡＣＣは債権者と株主の要求収益率を満たす所要利益率を意味することから，これを誤って高く設定すると，本来所要利益率を上回る適切な投資案を棄却することにつながる。"},{"l":1,"m":"設備投資の評価法","sb":"","r":"(Ｈ30Ⅰ⑨-エ)","q":"正味現在価値法，内部利益率法，線形計画法，回収期間法は，設備投資の意思決定における計算方法である。","a":false,"c":"","e":"線形計画法を用いて製品のセールス・ミックスを決定し，これに基づいて設備投資の経済性計算を行うことはあるが，線形計画法自体は設備投資の意思決定における計算方法(評価法)ではない。"},{"l":2,"m":"設備投資の評価法","sb":"","r":"(Ｒ６Ⅰ⑮-ウ)","q":"投資の効果が長期にわたる場合は，投資の経済性計算において貨幣の時間価値を考慮することが重要である。経済性計算の手法のうち，正味現在価値法と内部利益率法は貨幣の時間価値を考慮する手法であり，単純回収期間法と収益性指数法は貨幣の時間価値を考慮しない手法である。","a":false,"c":"","e":"正味現在価値法や内部利益率法と同じように，収益性指数法もまた，貨幣の時間価値を考慮する手法である。"},{"l":3,"m":"設備投資の評価法","sb":"","r":"(Ｒ６Ⅰ⑮-ア)","q":"回収期間法は投資額の目標回収期間をあらかじめ設定しておき，投資案の回収期間が目標回収期間内であるときにその案を採用する経済性計算の手法の一つである。しかし，回収期間法では，投資額を回収した後のキャッシュ・フローが考慮されていないため，プロジェクト期間全体の収益性の判断ができない。","a":true,"c":"","e":"回収期間法では，投資回収後のキャッシュ・フローが考慮外となっているため，回収期間後の収益性の良否を評価結果に反映できないという限界がある。そのため，回収期間法のみで投資案の採否を判定すれば，プラスの正味現在価値を持つ有利な投資案が，主観的に設定された目標回収期間をクリアしていないことを理由に棄却されてしまう恐れがある。"},{"l":4,"m":"設備投資の評価法","sb":"","r":"(Ｈ31Ⅱ⑮-ウ)","q":"単純回収期間法の欠点として，投資額を回収した後のキャッシュ・フローおよび貨幣の時間価値を無視していることがあげられる。これらの欠点を除くため割引回収期間法が考えられる。","a":false,"c":"","e":"割引回収期間法とは，各年度のキャッシュ・フローの現在価値で投資額を回収するまでに要する期間を求める方法をいう。この方法によれば，単純回収期間法の欠点のうち，貨幣の時間価値を無視している点は解消できるが，投資額を回収した後のキャッシュ・フローを無視している点は解消できない。"},{"l":5,"m":"設備投資の評価法","sb":"","r":"(Ｈ31Ⅱ⑮-イ)","q":"毎年のキャッシュ・インフローが均等である２年以上にわたる設備投資案が有利か不利かを判断する場合，当該キャッシュ・インフローから，投資額に資本回収係数を乗じた金額を差し引き，それが正であれば有利であると考えられる。この金額に現価係数を乗じると正味現在価値が算定できるからである。","a":false,"c":"","e":"資本回収係数とは，年金現価係数の逆数であり，投資額を回収するために最低限必要なキャッシュ・フローの年価を計算するための係数である。したがって，毎年のキャッシュ・インフローが均等である２年以上に渡る設備投資案が有利か不利かを判断する場合，当該キャッシュ・インフローから，投資額に資本回収係数を乗じた金額を差し引き，それ（正味現在価値の年価）が正であれば有利であると考えられる点は正しい。ただし，それは，当該金額に年金現価係数を乗じると正味現在価値が算定できるからである。"},{"l":6,"m":"設備投資の評価法","sb":"","r":"(Ｈ21⑲-エ)","q":"企業の内部利益率(internalrateofreturn,ＩＲＲ)の実績が10％である場合，ＩＲＲ15％の投資案は，当該投資案のハードル・レート(切捨て率)が17％であっても，採択すべきである。","a":false,"c":"","e":"ＩＲＲ15％の投資案は，当該投資案のハードル・レート(切捨て率)が17％であれば，採択すべきでない。"},{"l":7,"m":"設備投資の評価法","sb":"","r":"(Ｈ29Ⅱ⑭-ア)","q":"内部利益率法とは，純現金収入の現在価値合計と投資に必要な現金支出の現在価値合計が等しくなる割引率である内部利益率を求め，代替案の中から内部利益率が最少となる投資案を選択する方法である。","a":false,"c":"","e":"内部利益率法は，代替案の中から内部利益率が最大となる投資案を選択する方法である。"},{"l":8,"m":"設備投資の評価法","sb":"","r":"(Ｒ６Ⅰ⑮-エ)","q":"正味現在価値は割引率の関数としてグラフに表すことができる。縦軸に正味現在価値，横軸に割引率をとり，割引率に応じた投資案の正味現在価値をプロットすると正味現在価値線が描かれる。それと横軸との交点が内部利益率を表す。","a":true,"c":"","e":"縦軸に正味現在価値，横軸に割引率をとり，正味現在価値線を描写すると，横軸との交点は正味現在価値がちょうどゼロになる際の割引率であるから，当該投資案の内部利益率を表す。なお，正味現在価値線の縦軸との交点は，割引率０％のもとでの正味現在価値であるから，貨幣の時間価値を無視した正味価値（キャッシュ・フロー合計－初期投資額）を表す。"},{"l":9,"m":"設備投資の評価法","sb":"","r":"(Ｈ31Ⅱ⑮-エ)","q":"内部利益率法とは，投資額および正味キャッシュ・インフローの現在価値が同額になる割引率を求め，これを投資案を採択する際の判断基準とする方法のことである。対象となる案件が独立投資で，毎年の正味キャッシュ・インフローがプラスである場合は，正味現在価値法と必ず同じ結論となる。","a":true,"c":"","e":"毎年の正味キャッシュ・インフローがプラスである典型的な独立投資案の正味現在価値は，割引率の増加に応じて単調に減少する。この場合，内部利益率が資本コスト率を上回る(下回る)ことと，正味現在価値がプラス(マイナス)であることとは等価であるため，その採否について，内部利益率法による結論は正味現在価値によるそれを必ず同じになる。"},{"l":10,"m":"設備投資の評価法","sb":"","r":"(Ｒ６Ⅰ⑮-イ)","q":"複数の投資案の経済性計算においては対象となる案件が相互排他的投資で，投資から得られる毎年の正味キャッシュ・フローがプラスである場合は，正味現在価値法と内部利益率法とでは必ず同じ投資案が採択される。","a":false,"c":"","e":"正味現在価値法と内部利益率法では内在する再投資収益率の仮定が異なるため，相互排他的投資案の順位付けは必ずしも整合しない。両者の判定が必ず整合するのは，投資から得られる毎年の正味キャッシュ・フローがプラスであり，結果として単一の内部利益率を持つことになる典型的な独立投資案の採否についてである。"},{"l":11,"m":"設備投資の評価法","sb":"","r":"(Ｈ21⑲-ウ)","q":"複数の投資案が相互に排他的な場合には，正味現在価値法では最大の正味現在価値を持つ投資案を必ず採択する。","a":false,"c":"","e":"正味現在価値法においては，最大の正味現在価値を実現する投資案の「組合せ」を採択するのであって，複数の投資案が相互に排他的な場合において，最大の正味現在価値を持つ投資案が必ずしも採択されるわけではない。"}]},{"n":14,"name":"原価管理","qs":[{"l":1,"m":"原価管理手法の変遷と原価管理の体系","sb":"","r":"(Ｈ24Ⅱ⑪-ア)","q":"標準と実際を基に作業能率を管理する科学的管理法の出現は，標準原価管理などの管理会計技法をもたらした。","a":true,"c":"","e":"標準原価計算(標準原価管理)の起源は，テイラーを始祖とする科学的管理法にあり，それは「標準と実績をもとに作業能率を管理する」という思考を持つ。つま"},{"l":2,"m":"原価管理手法の変遷と原価管理の体系","sb":"","r":"(Ｒ６Ⅰ⑦-ウ)","q":"標準原価計算には科学的，統計的調査に基づいて能率の尺度となるよう予定された財貨の消費量が欠かせないが，このことは標準原価計算が20世紀初頭にF.W.テイラーが考案した科学的管理法に基づいているためである。","a":true,"c":"","e":"標準原価計算(標準原価管理)の起源は，テイラーを始祖とする科学的管理法にあり，それは「標準と実績をもとに作業能率を管理する」という思考を持つ。つま\nり，例外管理を行うわけであるから，基準値としての物量標準は，科学的，統計的調査に基づいて能率の尺度となるように，規範的に予定されることを要する。"},{"l":3,"m":"原価管理手法の変遷と原価管理の体系","sb":"","r":"(Ｒ５Ⅱ⑬-ア)","q":"標準原価管理における原価標準とは，製品単位当たりの目標となる原価であり，完成品の標準原価は，原価標準に標準生産量を乗じて求める。","a":false,"c":"","e":"標準原価管理における原価標準とは，製品単位当たりの目標となる原価であり，完成品の標準原価は，原価標準に実際生産量を乗じて求められる。"},{"l":4,"m":"原価管理手法の変遷と原価管理の体系","sb":"","r":"(Ｈ25Ⅰ⑯-エ)","q":"標準原価管理では，例外管理の考え方が適用されているため，例外なく原価差異が厳密に分析され，必要な是正措置がとられるべきである。","a":false,"c":"","e":"例外管理とは，管理の対象を例外的事項のみにとどめることによって焦点を明確にし，効率的，効果的な管理活動を促進する考え方をいう。この考え方にしたがえば，許容範囲を超える差異が生じた場合にのみ，その原因分析が行われ，改善策が検討・指示されることになる。"},{"l":5,"m":"原価管理手法の変遷と原価管理の体系","sb":"","r":"(Ｈ25Ⅰ⑯-オ)","q":"標準原価管理では，事前に設定した原価標準に基づき，標準原価と実際原価とが比較され，許容範囲以上の差異が生じた場合には，その原因の分析が行われ，改善策が検討・指示される。","a":true,"c":"","e":"インプット法による原価差異の把握を前提とすれば，原価差異の原因分析は経常的調査として実施されるため，本肢の内容にはやや問題がある。ただし，アウトプット法による原価差異の把握を前提とすれば，原価差異の原因分析は特別調査として実施されるため，本肢の内容に誤りはない。"},{"l":6,"m":"原価管理手法の変遷と原価管理の体系","sb":"","r":"(Ｈ19⑪-エ)","q":"製品ライフサイクルの短縮化により，標準原価計算を用いた原価管理機能の重要性は低下している。このことはまた，製品開発における作業標準や時間標準の役割低下にも結びついている。","a":false,"c":"","e":"製品ライフサイクルの短縮化により，標準原価計算を用いた原価管理機能の重要性が低下したことは事実であるが，作業標準や時間標準の設定は，製品開発における目標原価の設定に不可欠である。"},{"l":7,"m":"原価管理手法の変遷と原価管理の体系","sb":"","r":"(Ｈ27Ⅱ⑫-ア)","q":"製品ライフサイクルの短縮化により，標準原価計算を用いた原価管理機能の重要性は低下している。したがって，製造現場において標準原価を設定する意味はなくなってきている。","a":false,"c":"","e":"製品ライフサイクルの短縮化により，標準原価計算を用いた原価管理機能の重要性が低下したことは事実であるが，標準原価を用いた原価維持活動は，原価企画や原価改善といった原価低減活動をサポートする上で不可欠であり，製造現場において標準原価を設定する意味は依然として大いにある。"},{"l":8,"m":"原価管理手法の変遷と原価管理の体系","sb":"","r":"(Ｈ25Ⅰ⑯-ウ)","q":"標準原価管理は，製造段階での原価管理手法として伝統的に利用されてきたが，近年では，開発設計段階での原価の作りこみに活用されるようになってきている。","a":false,"c":"","e":"標準原価管理はあくまでも製造段階での原価管理手法であり，開発設計段階での原価の作りこみに活用されるのは原価企画である。"},{"l":9,"m":"原価管理手法の変遷と原価管理の体系","sb":"","r":"(Ｈ28Ⅰ⑫-ウ)","q":"標準原価計算は，主として製品の製造段階における科学的・統計的な調査に基づく原価管理技法であるが，標準原価計算の限界と原価企画との関係に鑑みて，現在では標準原価計算が製品開発のスピードに対応させた原価管理技法に変化してきている。","a":false,"c":"","e":"標準原価計算(標準原価管理)はあくまでも製造段階の原価管理技法であり，製品開発のスピードに対応させた原価管理技法に変化してきているという事実はない。"},{"l":10,"m":"原価管理手法の変遷と原価管理の体系","sb":"","r":"(Ｒ５Ⅱ⑬-イ)","q":"原価企画とは，企画設計段階において製造原価の大部分が決定される製品を対象として，源流に遡って原価の抜本的な引下げを行う手法である。","a":true,"c":"","e":"製造原価は製造段階で発生するが，その大部分は設計仕様に依存し，製造前の企画設計段階において発生額が決定してしまう。原価企画は，この製造原価の決定段階に着目し，製品開発の源流に遡って原価の抜本的な引き下げを行う源流管理の手法である。"},{"l":11,"m":"原価管理手法の変遷と原価管理の体系","sb":"","r":"(Ｈ25Ⅱ⑮-エ)","q":"原価企画では，製品ライフサイクルにおける原価発生原因に注目することで，そのライフサイクルのうちの製造段階で原価低減を目指す活動を行う。","a":false,"c":"","e":"原価企画では，製品の製造段階ではなく，原価の多くが決定する企画・設計段階で原価低減を目指す活動を行う。"},{"l":12,"m":"原価管理手法の変遷と原価管理の体系","sb":"","r":"(Ｒ２Ⅰ⑬-ア)","q":"源流段階における総合的利益管理活動である原価企画は，製品の企画・設計段階で大部分のコストが発生することから，製造段階における原価管理活動よりも原価低減に貢献することができる。","a":false,"c":"","e":"原価企画が製造段階における原価管理活動よりも原価低減に貢献することができるのは，製品の企画・設計段階で大部分のコストが決定するところ，その源流段階で原価低減を実施するからである。"},{"l":13,"m":"原価管理手法の変遷と原価管理の体系","sb":"","r":"(Ｒ４Ⅰ⑭-ウ)","q":"原価企画では，新製品の企画・開発・設計段階において，加算方式，控除方式又は折衷方式により目標原価を設定し，目標原価の水準まで実際原価を引き下げる活動が組織的に展開される。","a":false,"c":"","e":"原価企画では，新製品の企画・開発・設計段階において，目標原価の水準まで見積原価を引き下げる活動が組織的に展開される。製造前の企画・開発・設計段階において，製造原価について実際原価が生じる余地はない。"},{"l":14,"m":"原価管理手法の変遷と原価管理の体系","sb":"","r":"(Ｈ27Ⅱ⑫-イ)","q":"原価企画において，開発・設計段階において設定された目標原価が，量産開始後において，標準原価として設定されるので，標準原価の水準をさらに引き下げることは，考えなくてもよい。","a":false,"c":"","e":"量産開始後においても，原価改善によって実際原価を標準原価以下に引き下げることで，標準原価の水準をさらに引き下げることを考えるべきである。"},{"l":15,"m":"原価管理手法の変遷と原価管理の体系","sb":"","r":"(Ｈ30Ⅰ⑮-イ)","q":"原価維持の目的は，主として作業の不能率の防止による標準原価の達成にあるが，原価改善の目的は，改善目標が標準自体の引下げであり，単に標準作業を正しく実行しているだけではなく，改善がなければ達成できないレベルを目指している。","a":true,"c":"","e":"原価改善では，原価維持活動における物量標準を改訂することで，それを目標に実際原価を引き下げ，引き下げに要した製造条件の変更を標準化(マニュアル化)することで，結果として標準原価自体の引き下げを目的としているといえる。"},{"l":16,"m":"原価管理手法の変遷と原価管理の体系","sb":"","r":"(Ｈ28Ⅰ⑫-イ)","q":"原価改善とは，生産している製品の原価水準を維持し，さらに期待原価水準にまで計画的に引き下げる活動をいう。","a":true,"c":"","e":"原価改善とは，生産している製品の原価水準を維持するだけでなく，期待原価水準(基準原価)まで計画的に実際原価を引き下げる活動をいう。"},{"l":17,"m":"原価管理手法の変遷と原価管理の体系","sb":"","r":"(Ｒ６Ⅱ⑦-エ)","q":"原価管理の体系としては，原価維持，原価改善，原価企画がある。このうち，標準原価計算による原価管理に相当するものが原価維持であり，それは量産段階にて実際原価を標準原価から乖離させないようにすることを目的としている。なお，原価改善も量産段階における取組であるが，それは標準原価自体の低減を目的としている。","a":true,"c":"","e":"原価維持と原価改善は，量産段階の原価管理という点で共通するが，その目的は相違する。すなわち，原価維持は，製造条件を所与として，標準原価管理や予算管理によって実際原価を標準原価に合致させることを目的としているのに対し，原価改善は，製造条件の変更によって実際原価を標準原価以下に引き下げ，条件変更の標準化によって標準原価自体を引き下げることを目的としている。"},{"l":18,"m":"原価管理手法の変遷と原価管理の体系","sb":"","r":"(Ｒ６Ⅰ⑦-エ)","q":"現代の原価管理は，量産段階において標準原価の達成を目的とする原価維持と標準原価の低減を目的とする原価統制，更に，新製品の企画・開発段階にて目標原価を設定し，それを達成するための方策を練る原価企画という三つのプロセスから構成されている。","a":false,"c":"","e":"現代の原価管理は，量産段階において標準原価の達成を目的とする原価維持と標準原価の低減を目的とする原価改善，更に，新製品の企画・開発段階にて目標原価を設定し，それを達成するための方策を練る原価企画という三つのプロセスから構成されている。なお，原価維持と原価統制は基本的に同じものと見てよい。"},{"l":19,"m":"原価管理手法の変遷と原価管理の体系","sb":"","r":"(Ｈ24Ⅰ⑭-イ)","q":"原価改善は，原価維持活動が行われる量産段階とは異なるタイミングでなされる活動である。","a":false,"c":"","e":"原価改善は実際原価を標準原価以下に引き下げることを目的とする活動であるのに対し，原価維持は実際原価を標準原価(改善後の前期末実際原価)に合致させることを目的とする活動であるという点で両者は相違する。ただし，実際原価にアプローチする以上，いずれも量産段階という同じタイミングで行われる。"},{"l":20,"m":"原価管理手法の変遷と原価管理の体系","sb":"","r":"(Ｈ31Ⅰ⑫-ウ)","q":"原価改善は，量産後の原価低減の活動である。この原価改善には，製品別原価改善と期別・部門別原価改善の二つがある。製品別原価改善は，新製品の目標原価の未達部分の達成と優先順位の高い既存製品に対する原価低減活動をいう。期別・部門別原価改善は，予算管理の一環として各部門に目標利益改善額が示達され，その目標を達成するように日常的に行われる原価低減活動をいう。","a":true,"c":"","e":"製品別原価改善は，主として原価企画による製品開発プロジェクトの一環として，量産開始３か月後の実績評価の結果を受けて実施される初期流動性管理としての特徴を有する。一方，期別・部門別の原価改善は，短期利益計画上の目標利益と予想利益との間のギャップを解消する目的で実施されるものであり，原価改善目標額が予算として各責任単位に割り当てられ，年度中に目標低減額の達成が図られる。"},{"l":21,"m":"原価管理手法の変遷と原価管理の体系","sb":"","r":"(Ｒ４Ⅰ⑭-ア)","q":"原価維持とは，製造段階において標準原価管理等を用いて，標準原価からみた一定の幅の中に実際原価を収めるための活動をいう。","a":true,"c":"","e":"原価維持とは，現行製品の製造段階で，標準原価管理や予算管理によって実際原価を標準原価に合致させるための活動をいう。なお，直接費の管理には標準原価管理が，間接費の管理には予算管理が用いられる。"},{"l":22,"m":"原価管理手法の変遷と原価管理の体系","sb":"","r":"(Ｈ28Ⅰ⑫-ア)","q":"原価維持とは，設定された目標原価を標準原価管理や原価改善によって管理する活動である。","a":false,"c":"","e":"原価維持とは，実際原価を標準原価管理や予算管理によって管理(維持)する活動であり，原価改善は含まれない。"},{"l":23,"m":"原価管理手法の変遷と原価管理の体系","sb":"","r":"(Ｒ５Ⅱ⑦-ウ)","q":"標準原価による原価管理とは実際原価を標準原価に近似させることを意味し，このような原価管理を原価低減という。","a":false,"c":"","e":"標準原価による原価管理とは，実際原価を標準原価に合致させる，又は，実際原価を一定水準に維持することを意味し，それは一般に，原価維持ないし原価統制という。なお，原価低減とは利益目的で原価を計画的に引き下げる活動をいい，新製品の企画・設計段階で行う原価企画と，現行製品の量産段階で行う原価改善からなる。"},{"l":1,"m":"原価企画の目的と特徴","sb":"","r":"(Ｈ24Ⅱ⑯-ア)","q":"原価企画は，量産前の開発段階における原価低減のための原価管理手法であって，利益管理には関連しない。","a":false,"c":"","e":"原価企画の目的は，新製品の原価を開発段階で目標原価レベルまで引き下げることにより，全社的な中期利益計画の達成に貢献しうる目標利益を確保するという点にある。したがって，原価低減のための原価管理手法であると同時に，戦略的な利益管理手法でもある。"},{"l":2,"m":"原価企画の目的と特徴","sb":"","r":"(Ｈ30Ⅱ⑬-ア)","q":"原価企画を総合的利益管理活動として行う場合，中期経営計画から導かれる製品別の目標利益を達成する活動として行われる。","a":true,"c":"","e":"原価企画を総合的な利益管理活動として行う場合，中期経営計画(中期利益計画)から導かれる製品別の目標利益を達成しうるレベルまで見積原価を引き下げる活動として行われる。"},{"l":3,"m":"原価企画の目的と特徴","sb":"","r":"(Ｒ４Ⅰ⑭-エ)","q":"戦略的コスト・マネジメントとしての原価企画は，新製品の企画・開発・設計にあたって，顧客ニーズに適合する品質・価格・信頼性・納期等の目標を設定し，上流から下流までの全ての活動を対象として，それらの目標の同時達成を図る短期的な総合的利益管理活動である。","a":false,"c":"","e":"原価企画の目的は，マーケット・イン，開発リードタイムの短縮，高品質の維持といった諸要素を勘案した上で新製品の原価を引き下げることによって，魅力的な新製品を低価格でタイムリーに市場に投入し，全社的な中長期利益計画の達成に貢献しうる目標利益を確保することにある。その意味で，原価企画は，戦略的(中長期的)な総合的利益管理活動であるといえる。"},{"l":4,"m":"原価企画の目的と特徴","sb":"","r":"(Ｈ22Ⅱ⑪-ウ)","q":"原価企画は戦略的コストマネジメントの典型をなすプロセスであるとしばしばいわれるが，その特徴はマーケットインの発想で顧客が求める製品を低コストで開発することを支援する点に求められる。","a":true,"c":"","e":"戦略的コストマネジメントとしての原価企画の特徴は，差別化戦略とコスト・リーダーシップ戦略を同時的に追求する点にあるといえる。"},{"l":5,"m":"原価企画の目的と特徴","sb":"","r":"(Ｒ４Ⅱ⑫-イ)","q":"原価企画は，製品開発の源流に遡って，市場で顧客に受け入れられる品質・規格・信頼性などの実現をはかる総合的な利益管理活動である。原価企画の特徴の一つとして，プロダクト・アウト志向で許容原価を設定する点があげられる。","a":false,"c":"","e":"原価企画の特徴の一つとして，潜在的顧客が喜んで支払うと考えられる価格を起点として，マーケット・イン志向(市場ないし顧客志向)で許容原価を設定する点があげられる。なお，プロダクト・アウトとはマーケット・インの対義語であり，商品企画や製品開発に当たって，顧客ニーズよりもメーカー側の論理を優先する考え方をいう。"},{"l":6,"m":"原価企画の目的と特徴","sb":"","r":"(Ｈ23Ⅰ⑰-ア)","q":"原価企画は，顧客のニーズと目標利益の確保を両立させるために，製品の企画・開発段階から実施される総合的利益管理活動である。","a":true,"c":"","e":"原価企画は，マーケットイン（市場ないし顧客志向）の発想に基づく総合的（戦略的）な利益管理活動である。"},{"l":7,"m":"原価企画の目的と特徴","sb":"","r":"(Ｈ24Ⅰ⑭-ア)","q":"原価企画が伝統的原価計算手法と異なる特徴の一つは，源流段階から目標利益達成のための原価の低減を考えることにある。","a":true,"c":"","e":"原価企画の特徴は，価格主導で目標原価を計算し，製品開発の源流段階で目標原価までの原価低減を考えることにある。"},{"l":8,"m":"原価企画の目的と特徴","sb":"","r":"(Ｈ30Ⅰ⑮-ウ)","q":"我が国では，原価企画により製品の開発段階で大幅な原価低減が実現できるならば，当該製品の品質や機能が多少低下したとしても許容される。","a":false,"c":"","e":"原価企画では，製品品質や機能の維持が鉄則であるため，大幅な原価低減が実現できるとしても，品質や機能の低下は許容されるものではない。"},{"l":9,"m":"原価企画の目的と特徴","sb":"","r":"(Ｈ27Ⅰ⑬-ア)","q":"原価企画は，新製品の開発段階に組み込まれた原価および利益の作り込み活動であり，その活動の全貌は，会計的側面だけからでは説明することができない。","a":true,"c":"","e":"標準原価管理に対する原価企画の特徴の一つは，開発段階を中心にＶＥという工学的手法を使用する点にあり，その活動の全貌は，会計的側面だけからでは説明することができない。"},{"l":10,"m":"原価企画の目的と特徴","sb":"","r":"(Ｈ27Ⅱ⑫-ウ)","q":"環境対策のためには様々なコストを企業は負担しなければならない。このため，環境対策を行うことと原価管理における原価低減とは両立しないと思われるが，場合によっては，原材料などから生ずる廃棄物の削減が原価低減につながることもある。","a":true,"c":"","e":"環境に配慮した製品の開発にはコストがかかるし，環境に配慮した製造を行うためにも，省エネルギー型の設備導入などコスト要因が多い。したがって，環境負荷の低減と原価低減は両立しないようにも思えるが，原材料などから生ずる廃棄物の削減は，その双方に貢献する。"},{"l":11,"m":"原価企画の目的と特徴","sb":"","r":"(Ｈ28Ⅰ⑫-エ)","q":"最近のわが国における原価企画の概念は拡大化の傾向にあり，開発設計段階における単なる原価の引下げ活動ではなく，製品の機能向上や戦略的な製品コンセプト作りにまで及んできている。","a":true,"c":"","e":"原価企画といえば，伝統的には開発設計段階(生産準備段階)における原価低減活動を指すものであったが，近年では商品企画の段階にまでその概念は拡張しており，顧客ニーズに合致した機能の選択と"},{"l":12,"m":"原価企画の目的と特徴","sb":"","r":"(Ｈ29Ⅰ⑫-イ)","q":"最近の我が国における原価企画の活動は拡大化の傾向にあり，生産準備段階での単なる原価低減活動のみではなく，商品企画段階での顧客ニーズに適合した商品企画活動にまで及んできている。","a":true,"c":"","e":"原価企画といえば，伝統的には開発設計段階(生産準備段階)における原価低減活動を指すものであったが，近年では商品企画の段階にまでその概念は拡張しており，顧客ニーズに合致した機能の選択と\n絞り込み(0lookVE)を含む活動と解釈されている。"},{"l":1,"m":"原価企画のプロセス(目標原価の設定と展開など)","sb":"","r":"(Ｈ25Ⅰ⑯-イ)","q":"原価企画における目標原価の設定には，積上法と，控除法と，両者の折衷法である許容原価と成行原価との間で達成可能と思われる最も望ましい水準で目標原価を設定する方法がある。","a":true,"c":"","e":"目標原価の設定方法には，目標販売価格から目標利益を控除して算定した許容原価を目標原価とする控除法，現状の技術水準に基づく成行原価を積み上げ，これに原価低減目標を加味する積上法，許容原価と成行原価を擦り合わせ，両者の間に位置する水準に目標原価を設定する折衷法がある。"},{"l":2,"m":"原価企画のプロセス(目標原価の設定と展開など)","sb":"","r":"(Ｈ25Ⅱ⑮-イ)","q":"原価企画による目標原価は，製品の目標販売価格から目標利益を控除する方法で計算できる。","a":true,"c":"","e":"控除法を採用する場合，目標原価は目標販売価格から目標利益を控除することで計算される。"},{"l":3,"m":"原価企画のプロセス(目標原価の設定と展開など)","sb":"","r":"(Ｈ18⑱-ウ)","q":"目標原価は開発のできるだけ初期の段階において，開発しようとしている製品やサービスの予想販売価格から当該製品やサービスの期待利益を控除して算定することが望ましい。また，期待利益の算出に際しては，競争企業の動向も視野に入れながら，当該製品やサービスが中長期利益計画の達成に貢献できるよう十分な配慮を行う必要がある。","a":true,"c":"","e":"中長期利益計画の達成に貢献しうる目標利益の確保という原価企画の目的からすれば，許容原価を目標原価とする控除法を採用するのが望ましいといえる。この場合，期待利益(目標利益)の算出に際して，競争企業の動向を視野に入れるべきことは言うまでもない。"},{"l":4,"m":"原価企画のプロセス(目標原価の設定と展開など)","sb":"","r":"(Ｈ24Ⅰ⑭-オ)","q":"原価企画における目標原価は，単位当たりの予定販売価格から目標利益を控除して算出される許容原価と等しいものである。","a":false,"c":"","e":"控除法を採用する場合の目標原価は許容原価と等しくなるが，積上げ法や折衷法(統合法)を採用する場合の目標原価は許容原価とは一致しない。"},{"l":5,"m":"原価企画のプロセス(目標原価の設定と展開など)","sb":"","r":"(Ｈ24Ⅱ⑯-イ)","q":"目標原価を設定する際，目標販売価格から目標利益を控除する控除法（割付法）をそのまま採用すると，技術者に過度の原価低減努力を強いることになりがちである。","a":true,"c":"","e":"控除法による場合，目標原価には技術的な裏付けがないため，達成可能性という観点からすればかなり厳しい目標となる。したがって，技術者に過度の原価低減努力を強いることになりがちである。"},{"l":6,"m":"原価企画のプロセス(目標原価の設定と展開など)","sb":"","r":"(Ｈ29Ⅰ⑫-ウ)","q":"許容原価は見積販売価格から目標利益を控除して算定されるのに対して，成行原価は技術的な観点から原価が見積もられるため，成行原価の方が技術者にとって達成困難な目標を課されることが多い。","a":false,"c":"","e":"技術者にとって達成困難な目標を課されることが多いのは，技術的な裏付けのない許容原価の方である。"},{"l":7,"m":"原価企画のプロセス(目標原価の設定と展開など)","sb":"","r":"(Ｈ30Ⅰ⑮-ア)","q":"原価企画における目標原価の算定方法として積上げ法を用いた場合，技術的な観点よりも，企業の戦略と結び付けた総合的な利益管理手法として原価企画を活用することができる。","a":false,"c":"","e":"戦略的な利益管理手法として原価企画を活用することができるのは，目標原価の算定方法として控除法を用いた場合である。"},{"l":8,"m":"原価企画のプロセス(目標原価の設定と展開など)","sb":"","r":"(Ｈ27Ⅰ⑬-イ)","q":"原価企画の基礎には，原価が販売価格を主導するのではなく，市場価格が原価を主導するという考え方がある。その代表例として，オーバーラップ方式の開発がある。","a":false,"c":"","e":"原価企画の基礎にある「市場価格が原価を主導する」という考え方の代表例は，オーバーラップ方式ではなく控除法による目標原価の算定である。"},{"l":9,"m":"原価企画のプロセス(目標原価の設定と展開など)","sb":"","r":"(Ｈ26Ⅰ⑭-エ)","q":"モデルチェンジのために控除法方式の原価企画を行う場合，新モデルの目標原価は旧モデルの量産段階での実際原価以下に設定されなければならない。","a":false,"c":"","e":"旧モデルの実際原価を基礎とするのは，積上げ法方式の原価企画を行う場合である。また，モデルチェンジによって追加する機能もあるため，新モデルの目標原価は，必ずしも旧モデルの実際原価以下に設定されなければならないわけではない。"},{"l":10,"m":"原価企画のプロセス(目標原価の設定と展開など)","sb":"","r":"(Ｈ29Ⅰ⑫-エ)","q":"新型製品の目標原価の設定に際しては，現行製品の原価低減についての提案が盛り込まれることがある。","a":true,"c":"","e":"モデルチェンジ品の目標原価の設定に積上げ法を用いる場合には，現行製品の実際原価を基礎として新型製品の成行原価を算定し，これに原価低減目標を加味することが行われる。この場合，現行製品の原価低減についての提案は，新型製品の成行原価の算定や原価低減目標の算定に盛り込まれることになる。"},{"l":11,"m":"原価企画のプロセス(目標原価の設定と展開など)","sb":"","r":"(Ｈ30Ⅰ⑮-エ)","q":"統合法による原価企画においては，市場の状況から予定販売価格を決定し，次いで目標利益との関係から許容原価が導かれる。そして，技術者の現状見積りによる成行原価を基礎にＶＥ等の活用によって原価低減活動を行い，許容原価との擦合せから目標原価が決定される。","a":true,"c":"","e":"統合法(折衷法)では，市場とトップの意向を反映した許容原価と技術者の意向を反映した成行原価を擦り合わせることで(ＶＥの活用によって成行原価を許容原価に近付けることで)，許容原価と成行原価の間に位置する水準に目標原価が決定される。"},{"l":12,"m":"原価企画のプロセス(目標原価の設定と展開など)","sb":"","r":"(Ｒ５Ⅱ⑬-ウ)","q":"原価企画におけるすり合わせ方式(折衷方式)による目標原価は，まず成行原価を求め，次にその成行原価にＶＥ(valueengineering)による原価削減額を加味して求める。","a":false,"c":"","e":"原価企画における折衷方式による目標原価は，まず価格主導で許容原価を求める一方で，技術志向で成行原価を見積り，両者を擦り合わせた上で，成行原価にＶＥによる原価削減額を加味して求める。"},{"l":13,"m":"原価企画のプロセス(目標原価の設定と展開など)","sb":"","r":"(Ｈ27Ⅰ⑬-ウ)","q":"原価低減目標を定めるに当たり，中長期利益計画から導かれた許容原価と現状の技術水準をベースとする成行原価とを摺り合わせ，活動基準原価計算(ＡＢＣ)の活用によって原価低減活動を行い，実現可能な目標原価を決定する。これは折衷法とよばれる。","a":false,"c":"","e":"折衷法において，原価低減活動に活用されるのは，活動基準原価計算(ＡＢＣ)ではなくヴァリュー・エンジニアリング(ＶＥ)である。"},{"l":14,"m":"原価企画のプロセス(目標原価の設定と展開など)","sb":"","r":"(Ｒ２Ⅰ⑬-イ改)","q":"製品単位当たりの目標原価は，製品を構成している機能だけでなく，部品や原価要素ごとに割り付けられる。","a":true,"c":"","e":"原価見積は製品を構成する機能別，部品別，原価要素別(費目別)に行われるため，これと対照比較しうるように，目標原価も機能別，部品別，原価要素別(費目別)"},{"l":15,"m":"原価企画のプロセス(目標原価の設定と展開など)","sb":"","r":"(Ｈ24Ⅰ⑭-ウ)","q":"製品設計段階に入ると，目標原価を費目別・機能別・部品別に展開することになる。","a":true,"c":"","e":"原価見積は製品を構成する機能別，部品別，原価要素別(費目別)に行われるため，これと対照比較しうるように，目標原価も機能別，部品別，原価要素別(費目別)\nに割り付けられる。また，目標原価の達成に向けて設計担当エンジニアを動機づけ，より良い原価企画業績を引き出すために，目標原価は責任単位別にも展開さ"},{"l":16,"m":"原価企画のプロセス(目標原価の設定と展開など)","sb":"","r":"(Ｈ25Ⅰ⑯-ア)","q":"原価企画の特徴として，目標原価が製品を構成する機能別単位や構造別単位に細分割付され，それぞれの開発を担う技術者や部門の責任に関連づけられることが指摘されている。","a":true,"c":"","e":"原価見積は製品を構成する機能別，部品別，原価要素別(費目別)に行われるため，これと対照比較しうるように，目標原価も機能別，部品別，原価要素別(費目別)\nれる。"},{"l":17,"m":"原価企画のプロセス(目標原価の設定と展開など)","sb":"","r":"(Ｈ23Ⅰ⑰-エ)","q":"目標原価が算定されると，費目別・機能別・部品別に細分割付が行われるが，組織的な責任単位別に展開されることはない。","a":false,"c":"","e":"目標原価は費目別・機能別・部品別に細分割付が行われるだけでなく，組織的な責任単位別にも展開される。"},{"l":18,"m":"原価企画のプロセス(目標原価の設定と展開など)","sb":"","r":"(Ｒ４Ⅱ⑫-エ)","q":"原価企画においては，製品開発の節目ごとに，コストレビューやデザインレビューを繰り返しながら目標を着実に実現できるように管理が行われる。この仕組みをマイルストーン管理という。","a":true,"c":"","e":"原価企画では，製品開発の節目節目で段階的に目標を設定し，それらを着実にクリアして次の段階に進むというマイルストーン管理が行われる。その際，繰り返されるのがコストレビューやデザインレビューであり，前者は目標原価の達成状況を，後者は製品の性能，機能，信頼性などの実現状況をそれぞれ測定，評価し，改善策を講じるような活動をいう。"},{"l":19,"m":"原価企画のプロセス(目標原価の設定と展開など)","sb":"","r":"(Ｈ18⑱-カ)","q":"量産開始時点までに目標原価に到達した場合，量産開始以降に製造原価が上昇することはない。","a":false,"c":"","e":"量産開始時点までに目標原価に到達したとしても，それはあくまでも設計上の話であり，量産開始以降に製造原価が上昇しないとは限らない。したがって，量産開始から３ヶ月後に原価企画の実績評価を行い，実際原価が目標原価（標準原価）を上回っている場合には，製品別原価改善を実施する必要がある。"},{"l":1,"m":"原価企画におけるＶＥの活用","sb":"","r":"(Ｈ25Ⅱ⑮-ウ)","q":"ＶＥ(ValueEngineering)は，「価値＝機能－原価」と定義される関係に基づいて，機能や原価に関する様々な代替案を検討することにより，製品価値の向上を目指す技法である。","a":false,"c":"","e":"ＶＥにおける価値の定義式は「価値＝機能÷原価」である。"},{"l":2,"m":"原価企画におけるＶＥの活用","sb":"","r":"(Ｒ２Ⅰ⑬-ウ)","q":"原価企画では，目標原価を実現するため，競合製品を分解し調査するテア・ダウン(teardown)および原価を機能で除すことによって定義される価値を向上するための工学的手法であるＶＥ(valueengineering)を活用することが必要になる。","a":false,"c":"","e":"原価企画では，目標原価を実現するためにテア・ダウンやＶＥを活用することが必要になるが，ＶＥとは，機能を原価で除すことによって定義される価値を向上するための工学的手法である。"},{"l":3,"m":"原価企画におけるＶＥの活用","sb":"","r":"(Ｈ30Ⅱ⑬-イ)","q":"商品企画段階に行われる1stLookVEの開始後に，開発・設計段階に行われる2ndLookVEが開始されるが，1stLookVEと2ndLookVEを行うタイミングは一部重なる。","a":false,"c":"","e":"商品企画段階に行われるＶＥは1stLookVEではなく0LookVEであり，開発・設計段階で行われるＶＥは2ndLookVEではなく1stLookVEである。なお，効率性，効果性の観点から，商品企画と製品の開発・設計活動はある程度並行して行われるため，0LookVEと1stLookVEを行うタイミングは一部重なる。"},{"l":4,"m":"原価企画におけるＶＥの活用","sb":"","r":"(Ｈ24Ⅱ⑯-ウ)","q":"原価企画では，ＶＥ(ValueEngineering)を使って，より少ないコストで大きな効用を得ることが検討されるが，ＶＥは量産段階においてもセカンド・ルックＶＥ(2ndLookVE)として，原価改善に活用される。","a":true,"c":"","e":"製品の量産開始後の原価改善活動においても，ＶＥは適用される。一般に，これをセカンドルックＶＥという。"},{"l":5,"m":"原価企画におけるＶＥの活用","sb":"","r":"(Ｈ27Ⅱ⑫-エ)","q":"原価企画において利用されるツールとしてＶＥがある。ＶＥは，製品の価値を機能とそれを実現するためのコストとの関係により定義し，低コストで高い機能を実現しようとする組織的，工学的なアプローチであるので，主に製品の企画，開発・設計段階に適用されるが，量産開始後も，ＶＥは適用されることがある。","a":true,"c":"","e":"製品の量産開始後の原価改善活動においても，ＶＥは適用される。一般に，これをセカンドルックＶＥという。"},{"l":6,"m":"原価企画におけるＶＥの活用","sb":"","r":"(Ｈ23Ⅰ⑰-イ)","q":"原価企画活動の代表的な支援ツールであるＶＥは，「価値＝機能／原価」と定義され，できる限り低いコストで高い機能を実現しようとする組織的，工学的なアプローチであるが，製品の量産開始後はこのツールが適用されることはない。","a":false,"c":"","e":"ＶＥは主に製品の開発段階で適用されるが，量産開始後も適用される。"},{"l":7,"m":"原価企画におけるＶＥの活用","sb":"","r":"(Ｈ31Ⅰ⑫-エ)","q":"原価改善では，主に非会計的な手段によって製造段階での原価低減が行われている。したがって，原価改善の直接の対象は作業であり，ＩＥ分析手法などが使用される。作業要素ごとの所要時間を測定して分析する時間研究はＩＥ分析に含まれる。ＶＥは原価改善においても活用され，原価との関係から，製品やサービスの機能分析に組織的努力が注がれる。これをファースト・ルックＶＥ(1stlookVE)ともいう。","a":false,"c":"","e":"ＶＥは原価改善においても活用され，現行部品，現行作業方法，現行加工方法の改良など，的を絞りこんだＶＥ活動が展開されるが，この段階のＶＥはセカンド・ルックＶＥ(2ndlookVE)といわれる。"},{"l":8,"m":"原価企画におけるＶＥの活用","sb":"","r":"(Ｒ４Ⅱ⑫-ア)","q":"原価企画で使用される主要な手法にＶＥ(valueengineering，価値工学)がある。既に生産している現行製品を対象としたＶＥをセカンドルックＶＥという。この段階でのＶＥ実施にとどまるならば，大幅な原価低減を実現する可能性は限定される。","a":true,"c":"","e":"現行製品を対象として，製造段階で原価改善の一環として行われるＶＥをセカンドルックＶＥという。製造段階では，製品コンセプトや設計仕様が確定しており，原価の変更可能性は小さいため，この段階でのＶＥ実施にとどまるならば，大幅な原価低減を実現する可能性は限定される。そのため，商品企画段階のゼロルックＶＥや，開発段階のファーストルックＶＥを重視する必要がある。"},{"l":9,"m":"原価企画におけるＶＥの活用","sb":"","r":"(Ｈ30Ⅱ⑬-ウ)","q":"コスト・テーブルとは，加工方法や加工精度，あるいは材料の使用量や部品の生産量などに対応させて発生する原価を見積もり，それを図表にまとめたものである。","a":true,"c":"","e":"コスト・テーブルとは，原価見積に利用できるように作成されたデータベースをいう。"},{"l":10,"m":"原価企画におけるＶＥの活用","sb":"","r":"(Ｈ18⑱-ア)","q":"テアダウン(TearDown，製品分解分析)は，原価企画で活用されるベンチマーキングの手法である。","a":true,"c":"","e":"テアダウンとは，競合他社の製品を分解した上で，使用材料，形状，構造，加工方法，組立時間，製造原価などを究明し，これらの最善のものを採り入れて原価低減を図ろうとする手法である。"},{"l":11,"m":"原価企画におけるＶＥの活用","sb":"","r":"(Ｈ31Ⅰ⑫-ア)","q":"コスト・テーブルとテア・ダウン(teardown，製品分解分析)は，原価企画を支援する技法である。コスト・テーブルとは，原価見積りのためのデータベースのことである。テア・ダウンとは，ベンチマーキングの一種であり，リバース・エンジニアリングとも呼ばれる。","a":true,"c":"","e":"テア・ダウンは欧米では，リバース・エンジニアリングともいわれ，ベンチマーキングの主要な手続の１つとして位置付けられている。"},{"l":12,"m":"原価企画におけるＶＥの活用","sb":"","r":"(Ｒ４Ⅱ⑫-ウ)","q":"新製品の目標原価の細分割付けやＶＥ提案の評価などにみられるように，原価企画の様々な段階において原価見積りを行う必要がある。このような製品開発プロセスにおける原価見積りの仕組みをベンチマーキングという。","a":false,"c":"","e":"原価企画による製品開発プロセスにおいて，原価見積りの仕組みないしそのデータベースのことをコスト・テーブルという。なお，ベンチマーキングとは，最善ないし優良な実務(ベスト・プラクティス)を分析し，それをベンチマーク(基準)として自社の活動を測定・評価して改善を加える経営手法をいい，原価企画が活用する手法ではテアダウンが該当する。"},{"l":13,"m":"原価企画におけるＶＥの活用","sb":"","r":"(Ｈ30Ⅱ⑬-エ)","q":"テアダウンは，自社の既存モデルの製品を分解して，その機能や原価を分析する手法である。","a":false,"c":"","e":"テアダウンは，自社の製品ではなく競合他社の製品を分解して，その機能や原価を分析する手法である。"},{"l":14,"m":"原価企画におけるＶＥの活用","sb":"","r":"(Ｈ26Ⅰ⑭-ア)","q":"テアダウン(TearDown，製品分解分析)は，原価企画で活用されるマイルストーン管理の手法として利用できる。","a":false,"c":"","e":"テアダウンとは，原価企画において活用されるベンチマーキングの手法である。"},{"l":1,"m":"原価企画における製品開発方式とサプライヤー関係","sb":"","r":"(Ｈ23Ⅰ⑰-ウ)","q":"原価企画活動では，企画・開発部門だけでなく，購買，製造，営業，経営企画，経理部門など複数部門が関与する，リレー方式あるいはバトンタッチ方式と呼ばれる開発体制が採用されることが多い。","a":false,"c":"","e":"リレー方式あるいはバトンタッチ方式ではなく，ラグビー方式あるいはオーバーラップ方式が採用されることが多い。"},{"l":2,"m":"原価企画における製品開発方式とサプライヤー関係","sb":"","r":"(Ｈ24Ⅰ⑭-エ)","q":"原価企画を効率的に行うためには，バトンタッチ型分業体制が適している。","a":false,"c":"","e":"バトンタッチ型分業体制ではなく，オーバーラップ型分業体制(ラグビー方式)が適している。"},{"l":3,"m":"原価企画における製品開発方式とサプライヤー関係","sb":"","r":"(Ｈ25Ⅱ⑮-ア)","q":"原価企画の製品開発段階では，開発・設計部門のみならず営業や購買部門などの担当者による職能横断的な活動を行う。","a":true,"c":"","e":"例えば，開発・設計部門のエンジニアが購買部門の担当者と一緒になってサプライヤーを回り，製品仕様に合致した安い部材を調達する実務(開発購買)がある。"},{"l":4,"m":"原価企画における製品開発方式とサプライヤー関係","sb":"","r":"(Ｈ18⑱-オ)","q":"新製品や新サービスの開発に要する期間を短縮することは，原価低減に役立つ。開発期間の短縮のためには，開発作業を重複して進める作業のオーバーラップ方式が有効である。","a":true,"c":"","e":"異職種担当者が協働で同時並行的に製品開発を進める方式（ラグビー方式ないしオーバーラップ方式）によれば，企画→設計→生産準備といった具合に逐次的に製品開発を進める方式（バトンタッチ方"},{"l":5,"m":"原価企画における製品開発方式とサプライヤー関係","sb":"","r":"(Ｈ26Ⅰ⑭-ウ)","q":"職能の異なる複数の部署が同時並行的に開発作業をすすめる方式は，新製品の開発期間短縮のために利用できる。","a":true,"c":"","e":"異職種担当者が協働で同時並行的に製品開発を進める方式（ラグビー方式ないしオーバーラップ方式）によれば，企画→設計→生産準備といった具合に逐次的に製品開発を進める方式（バトンタッチ方\n式ないしリレー方式）による場合と比べて，開発リードタイムを短縮することができる。また，異職種担当者間の意見交流によって，原価低減のための新たな知"},{"l":6,"m":"原価企画における製品開発方式とサプライヤー関係","sb":"","r":"(Ｈ18⑱-キ)","q":"ＶＥ(ValueEngineering)やコスト・テーブルを活用して目標原価の達成を目指す活動とともに，新しい機械や素材の開発に代表される技術革新や異なる職能分野の専門家との対話は，原価低減に有用である。","a":true,"c":"","e":"異職種担当者が協働で同時並行的に製品開発を進める方式（ラグビー方式ないしオーバーラップ方式）によれば，企画→設計→生産準備といった具合に逐次的に製品開発を進める方式（バトンタッチ方\n識の創出が期待できる。"},{"l":7,"m":"原価企画における製品開発方式とサプライヤー関係","sb":"","r":"(Ｒ５Ⅱ⑬-エ)","q":"原価企画では，職能横断的なオーバーラップ型の製品開発を行うことで，製品開発のスピードアップが可能となり，さらに原価低減のための新たな知識の創出が期待できる。","a":true,"c":"","e":"異職種担当者が協働で同時並行的に製品開発を進める方式（ラグビー方式ないしオーバーラップ方式）によれば，企画→設計→生産準備といった具合に逐次的に製品開発を進める方式（バトンタッチ方"},{"l":8,"m":"原価企画における製品開発方式とサプライヤー関係","sb":"","r":"(Ｈ18⑱-オ)","q":"製造に配慮した設計(DesignforManufacturability)を行うとコスト増になるので，その増加分を相殺するだけの原価低減アイデアが必要となる。","a":false,"c":"","e":"製造に配慮した設計を行うことによって，製造段階での労務費の削減に役立つし，設計不備によるやり直しの無駄をなくすことで，開発リードタイムの短縮と開発費の抑制にも役立つ。したがって，コスト増ではなくむしろコスト削減につながる。"},{"l":9,"m":"原価企画における製品開発方式とサプライヤー関係","sb":"","r":"(Ｈ29Ⅰ⑫-ア)","q":"製品の開発設計段階において，生産技術部門や生産部門の管理者・従業員が意見を言うと活動が混乱し，製造コストの高い設計につながることから，設計者が開発設計活動を完了させてから生産技術部門に活動を引き継ぐのが望ましい。","a":false,"c":"","e":"製品の開発設計段階において，生産技術部門や生産部門の管理者・従業員が意見を言うことで，むしろ製造に配慮した設計が可能となるため，各活動を同時並行的に進めるのが望ましい。"},{"l":10,"m":"原価企画における製品開発方式とサプライヤー関係","sb":"","r":"(Ｒ２Ⅰ⑬-エ)","q":"原価企画を支える製品開発体制においては，製品開発，製造，マーケティングなどの自社のさまざまな部門の関与だけでなく，部品の開発を担うサプライヤーが重要な役割を果たす。","a":true,"c":"","e":"原価企画を支える製品開発体制はラグビー方式と呼ばれ，製品開発，製造，マーケティングなどの自社のさまざまな部門が，職能横断的に協働する点に特徴がある。また，我が国の完成品メーカーは外注比率が高く，製造原価の多くを買入部品費や外注加工賃が占めるため，上記の協働関係は社内にとどまるものではなく，部品の開発を担うサプライヤーが重要な役割を果たす。"},{"l":11,"m":"原価企画における製品開発方式とサプライヤー関係","sb":"","r":"(Ｈ31Ⅰ⑫-イ)","q":"原価企画に関連する組織的側面の一つにサプライヤー関係がある。たとえば，貸与図メーカーと呼ばれるサプライヤーと共同で設計を行うデザイン・インの活動がある。自動車メーカーなどでは部品納入内示を行い，部品価格が低減できるよう改善提案・技術指導を行うこともある。","a":false,"c":"","e":"デザイン・インの活動においては，完成品メーカーと共同(協働)でサプライヤーが詳細設計を行うため，この場合のサプライヤーは承認図メーカーに該当する。なお，承認図メーカーとは，完成品メーカーによる承認を前提に，自らが設計した図面に沿って部品を製造・納入するサプライヤーをいう。"},{"l":12,"m":"原価企画における製品開発方式とサプライヤー関係","sb":"","r":"(Ｒ４Ⅰ⑭-イ)","q":"原価企画を支える諸要素の一つにバイヤー・サプライヤー関係がある。この取引関係でのサプライヤーには，承認図メーカーや貸与図メーカーがある。このうち貸与図メーカーとは，バイヤーの設計による仕様に従って部品を製造し納入するサプライヤーをいう。","a":true,"c":"","e":"貸与図メーカーとは，バイヤー（完成品メーカー）から支給された図面にしたがって部品を製造・納入するサプライヤーをいう。"},{"l":13,"m":"原価企画における製品開発方式とサプライヤー関係","sb":"","r":"(Ｈ26Ⅰ⑭-イ)","q":"同一の部品や素材を複数のサプライヤーに同時発注することによって，サプライヤーに対するコストダウンへのプレッシャーを高めることができる。","a":true,"c":"","e":"同一ないし同等の部品や素材を複数のサプライヤーに同時発注する方式を複社発注方式という。これは，最終組立メーカーにおける調達リスクを抑えるとともに，サプライヤー間の競争を促すことでコストダウンへのプレッシャーを高め，より有利に部品や素材を調達することを意図した手法である。なお，オンリーワンの承認図部品について複社発注は困難となるが，類似の承認図部品を競合他社に発注することで代替することもある。"},{"l":14,"m":"原価企画における製品開発方式とサプライヤー関係","sb":"","r":"(Ｈ18⑱-エ)","q":"原価企画において，部品や素材を提供するサプライヤーが感じるプレッシャーを緩和する仕組みの一つとして，同等の部品や素材を同時発注する複社発注方式がある。","a":false,"c":"","e":"複社発注方式は，サプライヤー間の競争を促すことによってより有利に部品や素材を調達するための手法であり，サプライヤーが感じるプレッシャーを緩和するための仕組みではない。"},{"l":1,"m":"原価企画の課題(逆機能と海外移転)","sb":"","r":"(Ｈ23Ⅰ⑰-オ)","q":"製造原価に占める購入部品費が高い場合，目標原価を達成するためには，サプライヤーとの協業が重要となる。この場合，最終組立加工メーカーが原価企画活動を強力に実施することで，サプライヤーに対する原価低減，納期短縮，在庫縮減などのプレッシャーが高まり，その結果，サプライヤーが疲弊するという逆機能をもたらす可能性がある。","a":true,"c":"","e":"サプライヤー関係には協業(協働)とプレッシャーの両側面がある。つまり，最終組立メーカーが原価企画活動を強力に実施すれば，サプライヤーに対するプレッシャーも強くなるため，サプライヤーの疲弊という逆機能現象をもたらす可能性がある。"},{"l":2,"m":"原価企画の課題(逆機能と海外移転)","sb":"","r":"(Ｈ19⑪-オ)","q":"自社の利益目標を達成するためには，サプライヤーの置かれている状況を問わず，原価低減を要請することも致し方ない。","a":false,"c":"","e":"過度の原価低減要請は，サプライヤーの疲弊という逆機能現象をもたらす可能性がある。これはサプライヤーとの協業（協働）という原価企画の根幹を揺るがす問題であるから，サプライヤーの置かれている状況も考慮した上で製品開発をすすめるべきである。"},{"l":3,"m":"原価企画の課題(逆機能と海外移転)","sb":"","r":"(Ｈ24Ⅱ⑯-エ)","q":"原価企画は，ＶＥのほかに目標原価の設定と分析，ラグビー方式による製品開発といった視点が体系化されている点で，日本で独自に開発され発展した原価管理手法であるといえる。","a":true,"c":"","e":"原価企画は，ラグビー方式に代表されるように，日本企業に特有の組織的文化を基礎として開発され，発展した原価管理手法であるといえる。なお，以上を根拠として，従来は海外移転が困難であるとされてきたが，近年では海外移転に成功した事例が報告されている。"},{"l":1,"m":"ライフサイクル・コスティング","sb":"","r":"(Ｒ６Ⅱ⑨-エ)","q":"ライフサイクル・コスティングが対象とするコストには，研究・開発から企画，製造，販売に至るまでの生産者側で発生するコストと，使用，保守，処分といった使用者側で発生するコストが含まれている。","a":true,"c":"","e":"ＬＣＣが対象とするコストには，研究開発費，製造原価，販売費のように，生産者側で発生するコストと，使用維持コストや廃棄処分コストのように，使用者側で発生するコストが含まれている。なお，前者は価格に転嫁されるため，ライフサイクル・コストの最終負担者は使用者である。"},{"l":2,"m":"ライフサイクル・コスティング","sb":"","r":"(Ｒ４Ⅰ⑨-ア)","q":"ライフサイクル・コスティング(life-cyclecosting：ＬＣＣ)には二つのタイプがある。一つは，製品・サービスの供給者側からみたＬＣＣであり，もう一つは，製品・サービスの需要者側からみたＬＣＣである。供給者が考慮しなければならないのは，前者の意味でのＬＣＣのみである。","a":false,"c":"","e":"ＬＣＣには，①製造原価や研究開発費といったメーカーコストのみを計算対象とするＬＣＣ(製品・サービスの供給者側からみたＬＣＣ)と，②使用・維持コストや廃棄処分コストといったユーザーコストを含む全てのライフサイクル・コストを計算対象とするＬＣＣ(製品・サービスの需要者側からみたＬＣＣ)の２つのタイプがある。この点，製品・サービスの需要者は，ライフサイクル・コスト全体の経済性を望むため，製品・サービスの供給者は，①と②の両方のＬＣＣを考慮する必要がある。"},{"l":3,"m":"ライフサイクル・コスティング","sb":"","r":"(Ｈ27Ⅰ⑬-エ)","q":"原価企画活動においては，製品が顧客に販売され，顧客が製品を使用する際に発生する原価や，製品を廃棄処分し，あるいはリサイクルする際に発生する原価も考慮される。その意味においては，製品のライフサイクル・コストを最小にするように，原価企画活動を行うことが重要である。","a":true,"c":"","e":"近年では，使用維持コストや廃棄処分コストなど，ユーザー側で発生するコストが増加傾向にあり，ユーザーはライフサイクル・コスト全体の最小化を志向するようになっている。したがって，メーカーが行う原価企画活動においては，メーカー側で発生する製造原価や研究開発費だけでなく，ライフサイクル・コスト全体を対象とし，その最小化を図ることが重要となる。"},{"l":4,"m":"ライフサイクル・コスティング","sb":"","r":"(Ｈ24Ⅱ⑯-オ)","q":"原価企画において，目標原価を導く際にライフサイクル・コストを算定する場合，ユーザー側で負担するコストは考慮しない。","a":false,"c":"","e":"原価企画において，目標原価を導く際にライフサイクル・コストを算定する場合には，ユーザー側で負担するコストも考慮しなければ意味がない。"},{"l":1,"m":"品質管理会計","sb":"","r":"(Ｈ31Ⅰ⑨-ア)","q":"品質原価には，仕様に合致しない製品の製造を防ぐために発生する予防原価，仕様に合致しない製品を発見するために発生する評価原価，出荷前に仕様に合致しない製品を発見した際に認識される内部失敗原価，出荷後に仕様に合致しない製品が発見された際に発生し認識される外部失敗原価がある。","a":true,"c":"","e":"品質原価は主に適合品質（設計仕様と実際の製品の合致の程度）を測定対象とするものであり，予防原価と評価原価からなる品質適合原価と，内部失敗原価と外部失敗原価からなる品質不適合原価ないし失敗原価からなる。なお，予防原価の具体例としては品質教育訓練費，評価原価の例としては出荷製品検査費，内部失敗原価の例としては仕損費，外部失敗原価の例としてはクレーム処理費などがあげられる。"},{"l":2,"m":"品質管理会計","sb":"","r":"(Ｒ５Ⅰ⑨-エ)","q":"品質原価の分類方法であるＰＡＦアプロー(prevention-appraisal-failureapproach)によれば，品質原価は予防コストと評価コストからなる品質適合コストと，失敗コストからなる品質不適合コストに区分される。品質適合コストと品質不適合コストの発生額にはトレード・オフの関係がある。","a":true,"c":"","e":"品質コストは，適合品質を維持・向上するための投資である品質適合コスト（予防・評価コスト）と，適合品質を欠く欠陥品の発生によって引き起こされる品質不適合コスト（失敗コストないし失敗ロス）に区分される。両者の間には，長期・継続的に品質適合コストに投資すれば，欠陥品の減少を通じて品質不適合コストが低減するという具合に，トレード・オフの関係が見られる。"},{"l":1,"m":"マテリアルフローコスト会計","sb":"","r":"(Ｈ23Ⅱ⑯-ア)","q":"ＭＦＣＡは，投入された原材料(マテリアル)を物量で把握し，それが生産プロセスにおいてどのように移動するかを追跡し，その経済的価値のフローを可視化しようとするものであり，減価償却費は計算の対象外となる。","a":false,"c":"","e":"ＭＦＣＡにおいては，マテリアル・コスト(原材料費)の他にシステムコストとエネルギーコストからなる加工費も計算対象とし，減価償却費はシステムコストの中に含まれる。"},{"l":2,"m":"マテリアルフローコスト会計","sb":"","r":"(Ｈ23Ⅱ⑯-イ)","q":"製造上不可避的に生じる正常減損はマテリアルロスには含めない。","a":false,"c":"","e":"ＭＦＣＡにおいては，マテリアルロスを物量と金額で可視化することに重点が置かれている。したがって，減損が生じれば，正常・異常の区別なく，すべて負の製品コストとして明確に区別される。"},{"l":3,"m":"マテリアルフローコスト会計","sb":"","r":"(Ｈ23Ⅱ⑯-ウ)","q":"生産プロセスで排出される二酸化炭素は環境に負荷を与える物質であり，環境管理会計の一つの手法であるＭＦＣＡの価値的フロー計算においても主要な管理対象となっている。","a":false,"c":"","e":"二酸化炭素の削減が環境負荷の低減に資することは言うまでもないが，ＭＦＣＡはマテリアルロスの削減を通じて環境負荷の低減を目指す手法であり，二酸化炭素自体を管理対象とするものではない。"},{"l":4,"m":"マテリアルフローコスト会計","sb":"","r":"(Ｈ23Ⅱ⑯-エ)","q":"ＭＦＣＡは，マテリアルロスの発生場所，ロスとなった原材料の要素ごとの物量とコスト情報を提供することが重要な目的であり，製品原価の計算は重要な目的でない。","a":true,"c":"","e":"ＭＦＣＡは，製品原価の計算自体を目的とするものではない。したがって，必ずしも加工費進捗度を考慮する必要はないし，負の製品コストの負担関係を考慮する必要もない。"},{"l":5,"m":"マテリアルフローコスト会計","sb":"","r":"(Ｈ23Ⅱ⑯-オ)","q":"マテリアルロスの物量は，質量保存の法則にもとづき，次の算式で測定することができる。すなわち，マテリアルロスの物量＝(投入されたマテリアル量＋マテリアルの期首在庫量)－(完成品に含まれるマテリアル量＋マテリアルの期末在庫量)。","a":true,"c":"","e":"マテリアルロスがなければ，「投入されたマテリアル量＋マテリアルの期首在庫量＝完成品に含まれるマテリアル量＋マテリアルの期末在庫量」という算式が成立することから，マテリアルロスは両辺の差として算定される。"}]},{"n":15,"name":"ＡＢＣ／ＡＢＭ","qs":[{"l":1,"m":"ＡＢＣの特徴(伝統的原価計算との比較・構造・目的など)","sb":"","r":"(Ｈ29Ⅰ⑬-ウ)","q":"伝統的原価計算においては，製品の製造ロットに対して発生する段取替え等の原価について，各製造部門に集計し，操業度を用いて各製品に配賦する結果，少量生産品に製造間接費が少なく配賦されることがあり，多品種少量生産品の原価計算に適合しないことがある。","a":true,"c":"","e":"伝統的原価計算においては，生産量や操業度とは無関係に発生する複雑性・多様性関連の間接費(固定費)を生産量や操業度を基準に配賦するため，本来少量生産品が負担すべき原価を大量生産品が余計に負担するという弊害が生じることとな"},{"l":2,"m":"ＡＢＣの特徴(伝統的原価計算との比較・構造・目的など)","sb":"","r":"(Ｈ31Ⅰ⑬-ウ)","q":"ＡＢＣは，製品が多様化し大量生産品と多品種少量生産品が混在する状況において，製造間接費の構造に変化が生じ，製造間接費の配賦計算を精緻化する要請から生じた。すなわち，製造間接費が多品種少量生産品には過少に配賦され，大量生産品には過大に配賦されるという弊害をなくすことを意図している。","a":true,"c":"","e":"伝統的原価計算においては，生産量や操業度とは無関係に発生する複雑性・多様性関連の間接費(固定費)を生産量や操業度を基準に配賦するため，本来少量生産品が負担すべき原価を大量生産品が余計に負担するという弊害が生じることとな\nった。ＡＢＣにおいては，活動を中間的原価計算対象とすることで，資源の消費状況を正確に計算に反映し，上記の弊害をなくすことを意図している。"},{"l":3,"m":"ＡＢＣの特徴(伝統的原価計算との比較・構造・目的など)","sb":"","r":"(Ｒ５Ⅰ⑬-イ)","q":"ＡＢＣは，伝統的原価計算における製造間接費の配賦計算の問題を克服するために導入された。ここでいう製造間接費の配賦計算の問題とは，伝統的原価計算では，製造間接費が，小ロット・少量生産の非標準製品よりも，大ロット・大量生産の標準製品に対して過少に配賦されるという問題である。","a":false,"c":"","e":"ＡＢＣが導入された背景にある伝統的原価計算の問題点とは，操業度とは無関係に発生する固定費を操業度基準で配賦する結果，大ロット・大量生産の標準製品に対して，製造間接費が過大に配賦されるというものである。"},{"l":4,"m":"ＡＢＣの特徴(伝統的原価計算との比較・構造・目的など)","sb":"","r":"(Ｈ18⑯-ア)","q":"伝統的原価計算では，大ロットで生産される標準製品は，小ロットで生産される非標準的製品に比べて，実際よりも低めに原価が計算される。この現象は，活動基準原価計算の採用により改善されると期待されている。","a":false,"c":"","e":"伝統的原価計算によれば，本来，小ロットの非標準的製品が負担すべき原価を大ロットの標準製品が余計に負担することになり，その原価は実際よりも高めに計算される。"},{"l":5,"m":"ＡＢＣの特徴(伝統的原価計算との比較・構造・目的など)","sb":"","r":"(Ｈ29Ⅰ⑬-ア)","q":"ＡＢＣにおいては，資源の利用又は消費に関係する原価を，資源の利用量又は消費量と実行された活動に基づいて，製品やサービス等の原価計算対象に割り当てる。","a":true,"c":"","e":"ＡＢＣでは，活動を中間的原価計算対象とすることで，資源の消費状況に応じて原価を活動に集計し，活動の消費状況に応じて活動原価を原価計算対象に割り当てる。"},{"l":6,"m":"ＡＢＣの特徴(伝統的原価計算との比較・構造・目的など)","sb":"","r":"(Ｒ４Ⅰ⑮-ア)","q":"伝統的な製品原価計算では，操業度を基準に製造間接費を製品に配賦するのに対し，ＡＢＣでは，機械運転時間などの操業度関連のコスト・ドライバーを用いることはない。","a":false,"c":"","e":"ＡＢＣでは，活動に集計された原価を製品に集計するに当たり，活動の消費状況を表すコスト・ドライバーが選択される。この点，機械加工などの製品単位レベルの活動については，操業度に応じて消費されるため，ＡＢＣにおいても，機械運転時間などの操業度関連のコスト・ドライバーを用いることはある。"},{"l":7,"m":"ＡＢＣの特徴(伝統的原価計算との比較・構造・目的など)","sb":"","r":"(Ｈ31Ⅰ⑬-ア)","q":"ＡＢＣでは，まず各製品の製造に必要な活動を活動ドライバーに基づいて見積もり，次に必要な活動を行うために消費すべき資源の量を資源ドライバーに基づいて算定する。","a":false,"c":"","e":"まず各製品の製造に必要な活動(量)を活動ドラバイバーに基づいて見積もり，次に必要な活動を行うために消費すべき資源の量を資源ドライバーに基づいて算定するのは，ＡＢＣではなくＡＢＢである。なお，ＡＢＣでは資源の価値を資源ドライバーに基づいて活動に集計し，活動の原価を活動ドライバーに基づいて各製品に割り当てるため，ＡＢＢはＡＢＣの逆設計と捉えることができる。"},{"l":8,"m":"ＡＢＣの特徴(伝統的原価計算との比較・構造・目的など)","sb":"","r":"(Ｈ29Ⅰ⑬-エ)","q":"補助部門としての設計部門が製品に対して直接サービスを提供している場合，ＡＢＣでは設計部門の当該サービス提供の原価を活動に基づいて製品に割り当てるのに対して，我が国の「原価計算基準」では当該原価を部門別計算により製造部門に対して配賦することが求められ，製品に直接配賦することは認められていない。","a":false,"c":"「基準」18⑵","e":"設計部門など製品に直接サービスを提供している補助部門などを想定し，一部の補助部門費については，必要ある場合には，直接製品に配賦することが認められている。"},{"l":9,"m":"ＡＢＣの特徴(伝統的原価計算との比較・構造・目的など)","sb":"","r":"(Ｈ30Ⅱ③-イ)","q":"コスト・プールとは，製造間接費に含まれる様々な原価要素をグループにまとめたものである。正確な製造間接費の配賦を行うためには，コスト・プールに均質的な原価要素を集計する必要がある。我が国の「原価計算基準」では，部門をコスト・プールとして用いるため，正確な配賦計算を行うことができない。","a":false,"c":"「基準」18⑵","e":"一部の補助部門費については直接製品に配賦することが認められており，設計部門や検査部門といった直接製品に用役を提供していると考えられる補助部門の費用は，設計仕様書枚数や検査回数といった合理的なコスト・ドライバー（配賦基準）を選択することにより，ＡＢＣと同様の正確な計算を実現しうる。また，製品単位レベルの活動の原価(変動費)に関しては，操業度自体がコスト・ドライバーであることから，その配賦計算の正確性は元来担保されている。以上より，「原価計算基準」において正確な配賦計算を行うことができないというわけではない。"},{"l":10,"m":"ＡＢＣの特徴(伝統的原価計算との比較・構造・目的など)","sb":"","r":"(Ｈ19③-イ)","q":"活動基準原価計算において，活動ごとにコストを集計する際には，製造間接費の費目ごとに活動に対して配賦する必要が生じることがある。","a":true,"c":"","e":"伝統的原価計算において，部門共通費を各原価部門に配賦するのと同様に，ＡＢＣにおいても，活動共通費については，費目ごとに資源ドライバーを用いて活動に対して配賦する必要が生じる。"},{"l":11,"m":"ＡＢＣの特徴(伝統的原価計算との比較・構造・目的など)","sb":"","r":"(Ｈ19③-エ)","q":"活動基準原価計算は，複数の品種の製品間で原価を配分する方法であるので，製品別に配分された原価をさらに完成品と仕掛品に分けるには単純総合原価計算または指図書別原価計算が必要である。","a":true,"c":"","e":"ＡＢＣは，複数の製品種類間で間接費を配分する方法であり，製品別計算を内包するものではない。したがって，製品種類別に間接費を配分した後に，直接費と合わせて製品別計算が実施されるのであって，生産形態に応じて単純総合原価計算または個別原価計算が適用される。"},{"l":12,"m":"ＡＢＣの特徴(伝統的原価計算との比較・構造・目的など)","sb":"","r":"(Ｈ20⑤-エ)","q":"ＡＢＣは，製品別収益性を測定し，製品ミックスの決定等の製品戦略に有用な情報を提供するために考案されたものである。","a":true,"c":"","e":"ＡＢＣの目的は，正確な製品原価情報を提供することによって製品別収益性を適切に測定し，製品戦略の意思決定を支援するという点にある。"},{"l":13,"m":"ＡＢＣの特徴(伝統的原価計算との比較・構造・目的など)","sb":"","r":"(Ｈ31Ⅱ⑫-イ)","q":"ＡＢＣを用いることにより，より正確な顧客別収益性分析を行うことが可能となる。収益性の低い顧客に対しては，サービス提供コストが低くなるように，注文１回当たりの発注量を増やすなどの取引条件の変更を求めるという行動の必要性を認識できる。","a":true,"c":"","e":"ＡＢＣの適用対象を販管費にまで広げることで，正確な顧客別収益性の分析が可能となり，収益性を改善するための行動の必要性を認識できる。"},{"l":1,"m":"ＡＢＣの基礎概念(活動・活動階層・コスト・ドライバーなど)","sb":"","r":"(Ｈ18⑯-エ)","q":"活動基準原価計算においては，伝統的な原価計算とは異なり，コストを部門ではなく活動に集計する仕組みである。活動のコスト・プールは，部門横断的に設けられることもある。しかしながら，活動基準原価計算においては，活動を抽出する出発点として部門を利用する場合もあり，活動基準原価計算において部門がまったく意味をもたなくなるとはいえない。","a":true,"c":"","e":"活動は部門横断的に設定することもあるが，むしろ従来の縦割り型の部門を細分化して設定することが多い。したがって，ＡＢＣにおいて，部門が全く意味をもたなくなるとはいえない。"},{"l":2,"m":"ＡＢＣの基礎概念(活動・活動階層・コスト・ドライバーなど)","sb":"","r":"(Ｒ４Ⅰ⑮-ウ)","q":"ＡＢＣでは，活動の階層性に注目し，活動を①製品単位レベルの活動，②バッチ・レベルの活動，③製品支援活動，④工場支援活動に区分する。このうち，②バッチ・レベルの活動とは，一回の購入や生産等バッチごとに実施される活動である。","a":true,"c":"","e":"バッチレベルの活動とは，発注活動や段取活動に代表されるように，１回の購入や生産などバッチ毎に実施される活動をいう。"},{"l":3,"m":"ＡＢＣの基礎概念(活動・活動階層・コスト・ドライバーなど)","sb":"","r":"(Ｈ31Ⅰ⑬-イ)","q":"ＡＢＣにおける活動は，製品単位レベルの活動，バッチレベルの活動，製品支援活動および工場維持活動の四つの階層に分類される。このうち製品支援活動とは，製品の生産活動を行う企業全体を維持するために必要な活動である。","a":false,"c":"","e":"製品支援レベルの活動とは，特定の製品種類全体を支援する活動をいう。なお，企業(工場)全体を維持するために必要な活動とは，工場維持レベルの活動に相当する。"},{"l":4,"m":"ＡＢＣの基礎概念(活動・活動階層・コスト・ドライバーなど)","sb":"","r":"(Ｒ５Ⅰ⑬-エ)","q":"ＡＢＣでは，製品単位レベル活動およびバッチレベル活動に関する原価をできるだけ賦課に近い形で製品群などに割り当てるが，製品支援レベル活動で消費された原価についても，こうした手法を採ることが可能である。","a":true,"c":"","e":"製品支援レベルの活動とは，製品設計，生産計画など，特定の製品種類全体を支援する活動をいう。ＡＢＣにおいては，これらの活動原価を，設計仕様書枚数，生産指示書枚数などの合理的な活動ドライバーを用いて，賦課に近い形で製品種類全体に割り当てることが可能である。"},{"l":5,"m":"ＡＢＣの基礎概念(活動・活動階層・コスト・ドライバーなど)","sb":"","r":"(Ｈ20⑤-オ)","q":"ＡＢＣにおいては，製品単位レベルの活動およびバッチレベルの活動に関する原価をできるだけ賦課に近い形で製品群などに割り当てていく方法であるが，製品支援活動および工場維持活動に消費された原価については，こうした手続きをとることは困難である。","a":false,"c":"","e":"工場建物減価償却費，工場長給料など，工場維持活動に消費された原価を製品群に割り当てることは困難であるが，製品設計，生産計画など製品支援活動に消費された原価は，製品種類全体に割り当てることが可能である。"},{"l":6,"m":"ＡＢＣの基礎概念(活動・活動階層・コスト・ドライバーなど)","sb":"","r":"(Ｈ19③-オ)","q":"施設維持コスト・ドライバー(facility-sustainingcostdriver)は，製品と直接関係を持たないコスト・ドライバーなので，どのような目的に対してもこれを用いた活動原価の配分は望ましくない。","a":false,"c":"","e":"価格決定上の回収方針から，製品単位当たりの総原価を明らかにする実務は広く観察されており，施設維持レベルのコスト・ドライバーを用いた活動原価の配分を行うことにも，その意味での合理性はある。"},{"l":7,"m":"ＡＢＣの基礎概念(活動・活動階層・コスト・ドライバーなど)","sb":"","r":"(Ｒ５Ⅰ⑬-エ)","q":"ＡＢＣによる製品原価計算では，資源のコストを活動に割り当て，活動のコストを製品に割り当てる。ここで，資源のコストを活動に割り当てる配賦基準のことを資源ドライバーという。","a":true,"c":"","e":"ＡＢＣによる製品原価計算では，活動を中間的原価計算対象として，活動による資源の消費状況に応じて資源のコスト(価値)を活動に割り当てた後，製品による活動の消費状況に応じて活動のコストを製品に割り当てる。このうち，第１段階の計算において使用する，活動による資源の消費状況を表す変数のことを資源ドライバーという。"},{"l":8,"m":"ＡＢＣの基礎概念(活動・活動階層・コスト・ドライバーなど)","sb":"","r":"(Ｈ18⑯-オ)","q":"活動基準原価計算においては，活動コストを製品に割り当てることも重要であるが，各資源を各活動に割り当てることも重要である。例えば，ある人が複数の活動に従事しているならば，その人の給料は複数の活動に配分されなければならない。資源を活動に割り当てるドライバーのことを活動ドライバーとよぶ。","a":false,"c":"","e":"資源を活動に割り当てるドライバーのことを資源ドライバーとよぶ。"},{"l":9,"m":"ＡＢＣの基礎概念(活動・活動階層・コスト・ドライバーなど)","sb":"","r":"(Ｈ31Ⅱ⑫-ア)","q":"資源ドライバーの数値の測定方法には，機械に取り付けられたメーターによる方法以外に，従業員あるいは管理者に各活動に費やした時間の総計や比率をヒアリングする方法がある。","a":true,"c":"","e":"なお，資源ドライバーの測定をヒアリングによる場合，相当の時間と費用を要する上に，従業員に防衛本能が働き，フルキャパシティでの作業を報告されることが少なくない。このような問題点を改善するために考案されたのが時間主導型ＡＢＣ(ＴＤＡＢＣ)である。"},{"l":10,"m":"ＡＢＣの基礎概念(活動・活動階層・コスト・ドライバーなど)","sb":"","r":"(Ｒ４Ⅰ⑮-イ)","q":"ＡＢＣでは，まず，発生した製造間接費を資源ドライバーによって活動というコスト・プールに割り当てる。次に，各活動に集計された原価を活動ドライバーによって原価計算対象に割り当てる。","a":true,"c":"","e":"ＡＢＣにおいて，発生した製造間接費を活動に集計するためのコスト・ドライバーを資源ドライバー，活動に集計された原価を製品に集計するためのコスト・ドライバーを活動ドライバーという。すなわち，資源ドライバーとは活動による資源の消費状況を表す変数であり，活動ドライバーとは製品による活動の消費状況を表す変数であるといえる。"},{"l":11,"m":"ＡＢＣの基礎概念(活動・活動階層・コスト・ドライバーなど)","sb":"","r":"(Ｈ29Ⅰ⑬-イ)","q":"ＡＢＣにおいては，２段階計算として，製造間接費を活動に対して活動ドライバーに基づいて集計し，さらに，活動に集計された製造間接費をコスト・ドライバーに基づいて製品に配賦する。","a":false,"c":"","e":"ＡＢＣにおいては，製造間接費を活動に対して資源ドライバーに基づいて集計し，活動に集計された製造間接費を活動ドライバーに基づいて製品に配賦する。"},{"l":12,"m":"ＡＢＣの基礎概念(活動・活動階層・コスト・ドライバーなど)","sb":"","r":"(Ｈ18⑯-イ)","q":"部品の共通化を進め，特殊部品の使用を極力減らす努力をすることにより，購買部門の事務量を減らすことができる。活動基準原価計算を利用することにより，購買部門の事務に負担をかける製品は，製品原価が高く計算されるようになる。そのような製品の製造を抑制することにより，購買部門の事務量が減って，それがそのまま実際のコスト発生額の減少となってあらわれる。","a":false,"c":"","e":"製品の生産量の減少によって購買部門の事務量(活動量)が減少したとしても，購買部門における活動が消費する資源が人や設備などの固定費資源である以上，即座に実際のコスト発生額の減少につながるわけではない。ＡＢＣでは，このように，短期的に発生額(支出額)は一定であるが，長期的な消費額の変動に応じて発生額(支出額)が変化する費用概念を長期変動費と定義する。"},{"l":13,"m":"ＡＢＣの基礎概念(活動・活動階層・コスト・ドライバーなど)","sb":"","r":"(Ｈ31Ⅱ⑫-ウ)","q":"ＡＢＣによって測定される利用資源の原価と，組織の財務諸表によって報告される投入資源の原価とを用いることにより，未利用キャパシティのコストが計算できる。なお，ここでいう未利用キャパシティとは設備の未利用分を意味しており，人的資源の未利用分は貨幣額では把握できない。","a":false,"c":"","e":"ここでいう未利用キャパシティとは，固定費資源の未利用分をいい，設備だけでなく人的資源の未利用分も貨幣額（人件費）で把握される。"},{"l":1,"m":"ＡＢＣの限界","sb":"","r":"(Ｈ18⑯-ウ)","q":"活動基準原価計算は，特殊原価調査として行うこともできるが，経常的な計算システムのなかに組み込んで行うこともできる。経常的な計算システムに組み込む場合には，活動についての情報を常時収集できる仕組みが必要である。","a":true,"c":"","e":"ＡＢＣを経常的な計算システムに組み込む場合には，活動やそのコストおよびコスト・ドライバーについての情報を常時収集できる仕組みが必要となる。ただし，現実問題としてそのような仕組みの導入，更新には手間とコストがかかりすぎるため，伝統的なＡＢＣは当初の見込みよりも実務に浸透しなかったとされる。このような批判に応える形で提唱されたのがＴＤＡＢＣである。"},{"l":1,"m":"ＡＢＭ","sb":"","r":"(Ｈ31Ⅱ⑫-エ)","q":"製造間接費の割合が多く多品種少量生産が行われている企業において，直接労務費を配賦基準にして製造間接費の配賦を行う場合，算出される製品原価の正確性はＡＢＣを用いる場合に比して劣るが，製造間接費の削減に管理者の注意を向けることができる。","a":false,"c":"","e":"製造間接費の割合が多く多品種少量生産が行われている企業において直接労務費を配賦基準にして製造間接費の配賦を行う場合，算出される製品原価の正確性はＡＢＣを用いる場合に比して劣る点は正しい。しかし，製造間接費の削減に管理者の注意を向けるためには，ＡＢＣ情報を基にＡＢＭを推し進める方が効果的である。"},{"l":2,"m":"ＡＢＭ","sb":"","r":"(Ｈ31Ⅰ⑬-エ)","q":"ＡＢＭとは，企業の持続的競争優位を確保するために，企業活動を顧客の視点から付加価値活動と非付加価値活動に分類し，顧客にとって無駄な非付加価値活動を除去し，付加価値活動を効率的に実施するという一連の活動である。","a":true,"c":"","e":"ＡＢＭでは，企業内の諸活動を顧客にとっての付加価値活動と非付加価値活動に分類した上で，前者は効率化，後者は排除することによってプロセスを再構築し，原価低減につなげる。"},{"l":3,"m":"ＡＢＭ","sb":"","r":"(Ｈ20⑤-ウ)","q":"ＡＢＭの目的を達成するために，最終的には付加価値活動の効率化と，非付加価値活動の削除を含めたプロセスの再構築などが行われる。","a":true,"c":"","e":"ＡＢＭでは，企業内の諸活動を顧客にとっての付加価値活動と非付加価値活動に分類した上で，前者は効率化，後者は排除することによってプロセスを再構築し，原価低減につなげる。"},{"l":4,"m":"ＡＢＭ","sb":"","r":"(Ｒ４Ⅰ⑮-エ)","q":"ＡＢＭによるプロセス改善は，企業活動を顧客の視点から付加価値活動と非付加価値活動に区分する活動分析と，それらの活動量を決定する要因を識別するコスト・ドライバー分析の２つの分析のみから構成される。","a":false,"c":"","e":"ＡＢＭによるプロセス改善は，①企業活動を顧客の視点から付加価値活動と非付加価値活動に区分する活動分析，②それらの活動量を決定する要因を識別するコスト・ドライバー分析，③活動業績の改善の成果を継続的に評価する業績分析という３つの分析から構成される。"},{"l":5,"m":"ＡＢＭ","sb":"","r":"(Ｈ20⑤-カ)","q":"ＡＢＭにおいて活動原価の削減を行うまでのプロセスとしては，活動分析，コスト分析および業績分析がある。","a":false,"c":"","e":"ＡＢＭにおいて活動原価の削減を行うまでのプロセスは，活動分析，コスト・ドライバー分析および業績分析からなる。"},{"l":6,"m":"ＡＢＭ","sb":"","r":"(Ｒ５Ⅰ⑬-エ)","q":"ＡＢＭにおいて，顧客にとって無駄な非付加価値活動を除去すれば，当該非付加価値活動のために投入された経営資源の原価をすべて削減することができる。","a":false,"c":"","e":"ＡＢＭにおいて，顧客にとって無駄な非付加価値活動を除去することで，当該非付加価値活動のために投入されていた経営資源は不要となる。ただし，その多くは人員や設備などの固定費資源であり，その必要量が減少したとしても，供給量は短期的には変化しない。したがって，非付加価値活動を除去したとしても，少なくとも短期的には，当該活動のために投入されていた経営資源の原価の全てを削減できるわけではない。"}]},{"n":16,"name":"分権化組織とグループ経営の管理会計","qs":[{"l":1,"m":"組織設計と管理会計","sb":"","r":"(Ｒ４Ⅱ⑮-ウ)","q":"環境変化の激しい状況下で，各種の職務を遂行するうえで詳細な現場の情報が有用とされ，かつ，スピードを重視した経営が必要なときは，組織を集権化することの長所がより活かされてくるといえる。","a":false,"c":"","e":"環境変化の激しい状況下で，各種の職務を遂行するうえで詳細な現場の情報が有用とされ，かつ，スピードを重視した経営が必要なときは，管理階層の短縮が求められる。したがって，組織を分権化し，意思決定権限を下位に分散することの長所がより活かされてくるといえる。"},{"l":2,"m":"組織設計と管理会計","sb":"","r":"(Ｈ31Ⅱ⑯-ア)","q":"企業組織が，環境の不確実性に直面し，各種の職務を遂行するために詳細な現場情報を必要とし，かつ事業部間の相互依存関係がほとんど存在しない場合，組織を分権化することのメリットがより活かされなくなる。","a":false,"c":"","e":"管理階層の短縮が求められ，事業部間の調整の必要も殆どない状況であるから，むしろ組織を分権化することのメリットがより活かされるといえる。"},{"l":3,"m":"組織設計と管理会計","sb":"","r":"(Ｈ30Ⅱ⑮-エ)","q":"組織の分権化の程度が高まるにつれて，マネジメント・コントロールがより一層重要になってくる。すなわち，経営管理者は，マネジメント・コントロールによって，業務に必要な情報の伝達，目標の設定，業績の測定・評価を行い，組織構成員を組織の戦略遂行に向かわせるように影響を与える。","a":true,"c":"","e":"分権化の程度が高まるにつれて，部分最適のリスクも高まることになる。そのため，業績管理を通じて組織構成員の意思決定行動を組織戦略の遂行へと方向付けるマネジメント・コントロールの重要性が増すことになる。"},{"l":4,"m":"組織設計と管理会計","sb":"","r":"(Ｒ２Ⅱ⑯-イ)","q":"組織内のサブユニットは，責任会計の見地から，コスト・センター，プロフィット・センターなどに分類される。プロフィット・センターは分権的なサブユニットであり，コスト・センターは集権的なサブユニットであり，これらの関係は常に成立する。(注)サブユニットとは，組織内の部分的な構成要素を指す。","a":false,"c":"","e":"一般に，プロフィット・センターは分権的なサブユニット，コスト・センターは集権的なサブユニットと説明される。ただし，分権的であるか集権的であるかは程度問題であり，プロフィット・センターの中に相対的に集権的なサブユニットもあれば，コスト・センターの中に相対的に分権的なサブユニットもある。したがって，プロフィット・センター⇔分権的サブユニット，コスト・センター⇔集権的サブユニットという関係が常に成立するわけではない。"},{"l":5,"m":"組織設計と管理会計","sb":"","r":"(Ｈ20⑲-ア)","q":"現代企業の組織構造は大別して職能部門別組織と事業部制組織である。一般に，前者は集権的組織であり，後者は分権的組織であるとされている。","a":true,"c":"","e":"ただし，分権的であるか集権的であるかは程度問題であり，職能部門別組織と集権的組織，事業部制組織と分権的組織がそれぞれ１対１で対応するわけではない。"},{"l":6,"m":"組織設計と管理会計","sb":"","r":"(Ｈ30Ⅱ⑮-イ)","q":"企業の組織は，全体目標の達成に最適となるように階層化が行われている。比較的小規模であるか，製品や地域の多様性が低い場合には職能別組織が適合し，比較的大規模であるか，製品や顧客の多様性が高い場合には事業部制組織が適合する。","a":true,"c":"","e":"比較的小規模であるか，製品や地域の多様性が低い場合には，集権的な組織であっても意思決定の迅速性や適切性は担保されるため，全体最適を確保しやすい職能別組織が適合する。一方，比較的大規模であるか，製品や顧客の多様性が高い場合には，集権的な組織では意思決定の迅速性や適切性が阻害されるため，より分権的な事業部制組織が適合する。"},{"l":7,"m":"組織設計と管理会計","sb":"","r":"(Ｈ31Ⅱ⑯-イ)","q":"開発・生産・販売などの職能を集約することで得られるコストダウンや付加価値向上の効果よりも，個々の製品・市場への柔軟かつ迅速な適応によって得られる効果の方が大きい場合には，職能別組織がより適合する。これに対して，個々の職能をその内部で統合することから得られるメリットが大きく，製品・市場への柔軟で迅速な対応が重要ではない場合には，事業部制組織がより適合する。","a":false,"c":"","e":"開発・生産・販売などの職能を集約することで得られるコストダウンや付加価値向上の効果よりも，個々の製品・市場への柔軟かつ迅速な適応によって得られる効果の方が大きい場合には，事業部制組織がより適合する。これに対して，個々の職能をその内部で統合することから得られるメリットが大きく，製品・市場への柔軟で迅速な対応が重要ではない場合には，職能別組織がより適合する。"},{"l":8,"m":"組織設計と管理会計","sb":"","r":"(Ｈ28Ⅱ⑯-ウ)","q":"事業部制では，会社内の事業を製品，顧客，地域等からグループ化し，会社が持つべき職能のうち事業遂行に必要なものを備えて，事業部が編成される。","a":true,"c":"","e":"事業部制においては，会社内の事業をグループ化した上で，製造，販売，経理，研究開発といった会社が持つべき職能のうち，事業遂行に必要なものを備えて事業部が編成される。例えば，工場が複数の事業部に製品を供給したり，販売部門が複数の事業部の製品を取り扱ったりする場合には，製造部門や販売部門を事業部から独立させて組織することもある。"},{"l":9,"m":"組織設計と管理会計","sb":"","r":"(Ｈ20⑲-ウ)","q":"事業部制組織では，会計の視点からみれば，事業部をプロフィット・センターとしてみることが重要であるが，事業部長に対する権限委譲が徹底している場合には，コスト・センターしてみることがより適切である。","a":false,"c":"","e":"事業部は生来的にプロフィット・センターであるため，事業部長に対する権限委譲が徹底している場合には，インベストメント・センターしてみることがより適切である。"},{"l":10,"m":"組織設計と管理会計","sb":"","r":"(Ｈ30Ⅱ⑮-ア)","q":"事業部制組織は，社内カンパニー制よりもさらに分権化を進め業績を向上させる組織を企図したものであり，投資権限が与えられインベストメント・センターと呼ばれる。","a":false,"c":"","e":"事業部制組織は，社内カンパニー制よりもさらに分権化を進めたものではなく，事業部制組織（伝統的な日本型事業部制組織）よりもさらに分権化を進めたものが社内カンパニー制である。なお，厳密には，社内カンパニー制も事業部制組織の一形態であり，その意味において誤りの文章と解釈することもできる。"},{"l":11,"m":"組織設計と管理会計","sb":"","r":"(Ｈ19⑳-イ)","q":"日本企業におけるカンパニー制は，各カンパニーをあたかも独立した会社と見なし，各カンパニーは投資決定，人事，外部からの資金調達等の権限を有する。","a":false,"c":"","e":"カンパニー制はあくまでも社内分社制であるため，各カンパニーに対して，外部からの資金調達に関する権限までは委譲されない。"},{"l":1,"m":"投資センターの業績測定尺度","sb":"","r":"(Ｈ20⑲-オ)","q":"事業部長が短期的な業績向上を目指すために，研究開発や工場建設など，その投資効果が将来に及ぶ計画については，これを延期したり，中止したりすることがある。その理由の一つは，事業部長の業績評価にＲＯＩが採用されているためである。","a":true,"c":"","e":"事業部長の業績評価にＲＯＩを採用すると，事業部長の関心を短期的な比率の改善へと向けさせることになる。この点，投資の効果が将来におよぶ長期的な計画の実行は，短期的にＲＯＩを低下させる傾向があるため，結果として過少投資に"},{"l":2,"m":"投資センターの業績測定尺度","sb":"","r":"(Ｒ２Ⅱ⑯-ア)","q":"事業部長の業績評価にＲＯＩ(returnoninvestment)を採用すると，事業部長が短期的な業績をよく見せるために，研究開発や人材育成など，その効果が将来に及ぶような計画に消極的な行動をとる場合がある。","a":true,"c":"","e":"事業部長の業績評価にＲＯＩを採用すると，事業部長の関心を短期的な比率の改善へと向けさせることになる。この点，投資の効果が将来におよぶ長期的な計画の実行は，短期的にＲＯＩを低下させる傾向があるため，結果として過少投資に\n陥る危険性が指摘される。"},{"l":3,"m":"投資センターの業績測定尺度","sb":"","r":"(Ｈ29Ⅱ⑯-イ)","q":"投資利益率を事業部長の業績評価尺度として用いる場合，事業部長が投資案の採択に当たって全社にとって望ましい投資案を棄却することはない。","a":false,"c":"","e":"投資利益率を事業部長の業績評価尺度として用いる場合，現在の投資利益率が投資判断に際してのハードルレートとなるため，全社的に望ましい投資案が棄却される恐れがある。"},{"l":4,"m":"投資センターの業績測定尺度","sb":"","r":"(Ｒ２Ⅰ⑯-エ)","q":"インベストメント・センターの事業部長に対する業績測定尺度としてＲＯＩ(returnoninvestment，投資利益率)を使うことにより，事業部と全社の利害対立を解消し，目標整合性を達成することができる。","a":false,"c":"","e":"インベストメント・センターの事業部長に対する業績測定尺度としてＲＯＩを使用すれば，資本コスト率が考慮外となるため，事業部と全社の利害が対立し，目標整合性を失う恐れがある。"},{"l":5,"m":"投資センターの業績測定尺度","sb":"","r":"(Ｒ４Ⅱ⑮-ア)","q":"インベストメント・センターの事業部長に対する業績測
