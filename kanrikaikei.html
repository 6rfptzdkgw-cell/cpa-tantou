<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="utf-8">
<script>try{var __t=localStorage.getItem('theme_v1'); if(__t) document.documentElement.dataset.theme=__t;}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="管理会計論チェック">
<title>管理会計論 過去問チェック問題集</title>
<style>
:root{
  --paper:#F4F5F1;
  --panel:#FFFFFF;
  --ink:#1B2229;
  --ink-2:#4A555F;
  --ink-3:#7E8A94;
  --rule:#D9DDD5;
  --rule-2:#E9ECE6;
  --red:#D62839;
  --red-soft:#FBE7E9;
  --blue:#1F5673;
  --ok:#2F7A4F;
  --ok-soft:#E5F1E9;
  --warn:#B26A00;
  --sheet:#8A4B12;
  --warn-soft:#FBEEDD;
  --shade:rgba(27,34,41,.06);
  --grid:rgba(31,86,115,.055);
  --radius:3px;
  --sans:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic Medium","Yu Gothic","Meiryo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Hiragino Mincho ProN","Yu Mincho",Georgia,serif;
}
[data-theme="dark"]{
  --paper:#14181C;
  --panel:#1B2126;
  --ink:#E7EAE5;
  --ink-2:#AEB8BF;
  --ink-3:#7A858D;
  --rule:#2C343A;
  --rule-2:#232A30;
  --red:#FF5C6B;
  --red-soft:#3A1E22;
  --blue:#7FB4D0;
  --ok:#6FC28E;
  --ok-soft:#1E2E24;
  --warn:#E0A14A;
  --sheet:#C97A2E;
  --warn-soft:#332616;
  --shade:rgba(0,0,0,.3);
  --grid:rgba(127,180,208,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.6;
  -webkit-text-size-adjust:100%;
  padding-bottom:env(safe-area-inset-bottom);
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:0 14px}

header{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid var(--rule)}
.hd{display:flex;align-items:center;gap:10px;padding:10px 0 8px}
.brand{font-family:var(--serif);font-size:18px;letter-spacing:.01em;line-height:1.2}
.brand small{display:block;font-family:var(--sans);font-size:10.5px;color:var(--ink-3);letter-spacing:.1em}
.hd-sp{flex:1}
.iconbtn{width:38px;height:38px;border:1px solid var(--rule);border-radius:var(--radius);display:grid;place-items:center;font-size:15px;background:var(--panel)}
.iconbtn[aria-pressed="true"]{background:var(--sheet);border-color:var(--sheet);color:#fff}
.tabs{display:flex;gap:0;border:1px solid var(--rule);border-bottom:none;background:var(--panel)}
.tabs button{flex:1;padding:9px 4px;font-size:13.5px;color:var(--ink-2);border-right:1px solid var(--rule);position:relative}
.tabs button:last-child{border-right:none}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:700;background:var(--paper)}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--red)}
.meter{height:3px;background:var(--rule-2);display:flex}
.meter i{display:block;height:100%}
.meter .m2{background:var(--ok)} .meter .m1{background:var(--warn)}

.filters{padding:10px 0 6px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search{flex:1;min-width:180px;display:flex;align-items:center;gap:8px;border:1px solid var(--rule);background:var(--panel);padding:0 10px;border-radius:var(--radius)}
.search input{flex:1;border:none;background:none;padding:9px 0;outline:none;min-width:0}
select{border:1px solid var(--rule);background:var(--panel);padding:9px 8px;border-radius:var(--radius);max-width:100%}

.chsel-head{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding:0 2px}
.chsel-head .lbl{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.chsel-head .links button{font-size:11.5px;color:var(--blue);text-decoration:underline;font-weight:400;margin-left:10px}
.chapter-list{background:var(--panel);border:1px solid var(--rule);margin-top:6px}
.chapter-row{display:flex;align-items:center;gap:10px;padding:10px 10px;border-bottom:1px solid var(--rule-2);cursor:pointer}
.chapter-row:last-child{border-bottom:none}
.chapter-row:active{background:var(--shade)}
.chapter-row .check{width:20px;height:20px;border-radius:4px;border:2px solid var(--ink-3);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
.chapter-row.checked{background:color-mix(in srgb, var(--blue) 7%, var(--panel))}
.chapter-row.checked .check{background:var(--blue);border-color:var(--blue)}
.chapter-row .cname{flex:1;font-size:13.5px;color:var(--ink-3)}
.chapter-row.checked .cname{color:var(--ink);font-weight:700}
.chapter-row .ccnt{font-size:11.5px;color:var(--ink-3);flex-shrink:0}
.chapter-row .caret{font-size:11px;color:var(--blue);margin-left:8px;flex-shrink:0;padding:4px 2px}
.major-list{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px 10px 40px;background:var(--rule-2);border-bottom:1px solid var(--rule-2)}
.major-chip{font-size:12px;padding:5px 10px;border-radius:99px;border:1px solid var(--rule);background:var(--panel);color:var(--ink-3);cursor:pointer;white-space:nowrap}
.major-chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.major-chip .mcnt{opacity:.7;font-size:10.5px}

.sec{margin:18px 0 6px;display:flex;align-items:baseline;gap:10px}
.sec h2{font-size:13px;margin:0;letter-spacing:.03em;font-weight:700}
.sec span{flex:1;border-bottom:1px dashed var(--rule)}
.sec b{font-size:11px;color:var(--ink-3);font-weight:400}
ol.list{list-style:none;margin:0;padding:0;background:var(--panel);border:1px solid var(--rule)}
li.item{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 12px;padding:9px 10px;border-bottom:1px solid var(--rule-2);align-items:start}
li.item:last-child{border-bottom:none}
.no{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums;padding-top:4px;text-align:center;min-width:44px}
.en{font-family:var(--serif);font-size:16px;line-height:1.6;word-break:break-word}
.ja{font-size:13.5px;color:var(--ink-2);margin-top:5px;font-weight:700}
.note{font-size:12px;color:var(--ink-3);margin-top:4px;white-space:pre-line;border-left:2px solid var(--rule);padding-left:7px;line-height:1.7}
.tools{display:flex;flex-direction:column;align-items:center;gap:6px}
.mark{font-size:10px;padding:3px 7px;border:1px solid var(--rule);border-radius:99px;color:var(--ink-3);white-space:nowrap}
.mark.warn{color:var(--warn);border-color:var(--warn);background:var(--warn-soft)}
.mark.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}

.navrow2{display:flex;gap:8px;margin-top:14px}
.navrow2 button{flex:1;border:1px solid var(--rule);background:var(--panel);padding:12px;border-radius:var(--radius);font-size:14px}
.navrow2 button:disabled{opacity:.35;cursor:default}
.memo-preview{cursor:pointer;border-left-color:var(--blue)!important}

.masked{position:relative;color:transparent!important;border-radius:2px;cursor:pointer}
.masked::before{content:"";position:absolute;left:0;right:0;top:0;bottom:0;background:var(--sheet);opacity:.92;border-radius:3px}
mark.hl{background:#FFF176;color:#1B2229;padding:0 1px;border-radius:2px;cursor:pointer}
[data-theme="dark"] mark.hl{background:#8a7a1f;color:#F4F5F1}
.hl-popup{position:absolute;z-index:200;background:var(--ink);color:var(--paper);border:none;padding:9px 14px;border-radius:20px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.35);white-space:nowrap}
.sheet-on li.item{cursor:pointer}

.q-head{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3);margin-top:14px}
.q-stem{background:var(--panel);border:1px solid var(--rule);padding:26px 18px;text-align:left;margin-top:6px}
.q-stem .qt{font-family:var(--serif);font-size:clamp(17px,4.6vw,21px);line-height:1.7;word-break:break-word}
.q-stem .refs{font-size:11px;color:var(--ink-3);margin-top:10px;text-align:right}
.oxbtns{display:flex;gap:10px;margin-top:12px}
.oxbtn{flex:1;aspect-ratio:2;border-radius:var(--radius);border:2px solid var(--rule);background:var(--panel);font-size:34px;font-weight:700;font-family:var(--serif)}
.oxbtn.maru{color:var(--ok)}
.oxbtn.batsu{color:var(--red)}
.result-banner{border-radius:var(--radius);padding:14px 16px;margin-top:12px;display:flex;align-items:center;gap:12px;border:1px solid var(--rule)}
.result-banner.ok{background:var(--ok-soft);border-color:var(--ok)}
.result-banner.ng{background:var(--red-soft);border-color:var(--red)}
.result-banner .rmark{font-size:26px;font-family:var(--serif);font-weight:700}
.result-banner.ok .rmark{color:var(--ok)}
.result-banner.ng .rmark{color:var(--red)}
.result-banner .rtxt{font-size:13.5px;font-weight:700}
.q-result{margin-top:10px;background:var(--panel);border:1px solid var(--rule);padding:14px}
.q-result .r-cite{font-size:12px;font-weight:700;color:var(--warn);margin-bottom:6px}
.q-result .r-note{font-size:13px;color:var(--ink);white-space:pre-line;line-height:1.75}
.memo-box{margin-top:12px}
.memo-box label{font-size:11.5px;color:var(--ink-3);display:flex;align-items:center;gap:6px;margin-bottom:5px}
.memo-box textarea{width:100%;min-height:52px;border:1px solid var(--rule);background:var(--panel);padding:8px 10px;font-size:13px;border-radius:var(--radius);resize:vertical}
.memo-saved{font-size:10.5px;color:var(--ok);opacity:0;transition:opacity .3s}
.memo-saved.show{opacity:1}
.grade{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.grade button{border:1px solid var(--rule);background:var(--panel);padding:13px 4px;border-radius:var(--radius);font-size:14px}
.grade button b{display:block;font-size:11px;font-weight:400;color:var(--ink-3);margin-top:2px}
.g2{color:var(--warn)} .g3{color:var(--ok)}
.score{text-align:center;padding:40px 16px;background:var(--panel);border:1px solid var(--rule);margin-top:14px}
.score .big{font-family:var(--serif);font-size:52px;line-height:1}

.stat-card{background:var(--panel);border:1px solid var(--rule);padding:14px;margin-top:12px}
.stat-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--rule-2)}
.stat-row:last-child{border-bottom:none}
.stat-row .nm{width:130px;font-size:12px;flex:none}
.bar{flex:1;height:9px;background:var(--rule-2);display:flex;overflow:hidden}
.bar i{height:100%}
.pc{width:52px;text-align:right;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;flex:none}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--ink-3);margin-top:10px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;margin-right:5px;vertical-align:-1px}
.lg2::before{background:var(--ok)} .lg1::before{background:var(--warn)} .lg0::before{background:var(--rule-2)}
.mini{font-size:12.5px;color:var(--ink-2);line-height:1.75}
.act{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.act button{border:1px solid var(--rule);background:var(--panel);padding:9px 13px;border-radius:var(--radius);font-size:13px}
.empty{text-align:center;color:var(--ink-3);padding:48px 16px;font-size:14px}
.count{font-size:12px;color:var(--ink-3);padding:4px 0 8px}
footer{text-align:center;font-size:11px;color:var(--ink-3);padding:26px 0 34px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:99px;font-size:13px;z-index:60;opacity:0;pointer-events:none;transition:opacity .18s}
.toast.on{opacity:1}
.btn-main{background:var(--ink)!important;color:var(--paper)!important;border-color:var(--ink)!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:520px){
  li.item{gap:0 9px;padding:8px}
  .en{font-size:15px}
}

.add-overlay{position:fixed;inset:0;background:rgba(20,20,20,.5);z-index:80;display:none;align-items:flex-end;justify-content:center}
.add-modal{background:var(--panel);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:14px 14px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));box-sizing:border-box}
.add-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.add-title{font-family:var(--serif);font-size:17px;font-weight:700}
.add-body{display:flex;flex-direction:column}
.flabel{font-size:11.5px;color:var(--ink-3);margin-top:12px;margin-bottom:4px;font-weight:700}
.add-body input,.add-body select,.add-body textarea{width:100%;border:1px solid var(--rule);background:var(--paper);color:var(--ink);padding:9px 10px;border-radius:var(--radius);font-size:14px;resize:vertical;font-family:inherit}
.oxbtns.small{display:flex;gap:8px;margin-top:2px}
.oxbtns.small .oxbtn{aspect-ratio:auto;padding:10px;font-size:22px}
.oxbtn.sel.maru{background:var(--ok);border-color:var(--ok);color:#fff}
.oxbtn.sel.batsu{background:var(--red);border-color:var(--red);color:#fff}
.add-foot{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:8px}
.add-foot .danger{color:var(--red);border:1px solid var(--red);background:none;padding:10px 14px;border-radius:var(--radius);font-size:13px}
.badge-custom{display:inline-block;font-size:10px;background:var(--blue);color:#fff;padding:1px 6px;border-radius:99px;margin-right:6px;vertical-align:middle}
.edit-btn{margin-top:6px;font-size:10px}
.stat-card input{width:100%;border:1px solid var(--rule);background:var(--paper);color:var(--ink);padding:9px 10px;border-radius:var(--radius);font-size:13px;margin-top:4px}
.tools button[data-memo-toggle]{margin-top:10px}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="hd">
      <div class="brand">管理会計論 過去問チェック<small>短答対策問題集（池邉講師レジュメ①②準拠）</small></div>
      <div class="hd-sp"></div>
      <button class="iconbtn" id="btnAdd" title="問題を追加">＋</button>
      <button class="iconbtn" id="btnSheet" aria-pressed="false" title="赤シート（答えを隠す）">赤</button>
      <button class="iconbtn" id="btnTheme" title="表示切替">◐</button>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-view="list">一覧</button>
      <button role="tab" aria-selected="false" data-view="quiz">テスト</button>
      <button role="tab" aria-selected="false" data-view="record">記録</button>
    </div>
  </div>
  <div class="meter" id="meter"></div>
</header>
<main class="wrap" id="app"></main>
<div class="add-overlay" id="addOverlay"></div>
<footer>管理会計論 短答対策 過去問チェック問題集（全16章・804問）</footer>

<script id="quiz-data" type="application/json">[{"n":1,"name":"原価計算の基礎知識","qs":[{"l":1,"m":"原価計算基準の性質","sb":"","r":"(Ｒ２Ⅱ①-ア)","q":"企業の原価計算制度は，真実の原価を確定して財務諸表の作成に役立つとともに，原価を分析し，これを経営管理者に提供し，もって業務計画および原価管理に役立つことが必要とされている。したがって，原価計算制度は，いずれの計算目的にもともに役立つように形成され，一定の計算秩序として常時継続的に行なわれるものであることを要する。","a":true,"c":"「基準の設定について」","e":"「原価計算基準」の設定当時，主たる原価計算目的といえば財務諸表作成であったが，経営管理のために，原価管理や業務計画（期間計画及びそれに基づく予算管理）に役立つための原価計算への要請が著しく強まっていた。そこで，これらの複数の原価計算目的に対して，重点の相違はあるが，いずれの計算目的にも役立つ一定の計算秩序として，原価計算制度が形成される必要性が認識された。"},{"l":2,"m":"原価計算基準の性質","sb":"","r":"(Ｈ29Ⅱ①-エ)","q":"「原価計算基準」は，実践規範として，企業における原価計算の慣行のうちから，一般に公正妥当と認められるところを要約して設定されたものであるが，個々の企業の原価計算手続を画一的に規定するものではなく，基本的な枠組みを提示している。各企業には，業種，経営規模そのほかの個別の条件に応じて，「原価計算基準」の弾力的な適用が求められる。","a":true,"c":"「基準の設定について」","e":"「原価計算基準」は個々の企業の原価計算手続を画一的に規定するものではなく，弾力性に富む「ガイドライン」であることに注意する。"},{"l":3,"m":"原価計算基準の性質","sb":"","r":"(Ｒ２Ⅱ①-イ)","q":"「原価計算基準」は，実践規範として，わが国現在の企業における原価計算の慣行のうちから，一般に公正妥当と認められるところを要約して設定されたものである。したがって，「原価計算基準」は，原価情報の比較可能性を確保するために，個々の企業の原価計算手続を画一的に規定するものである。","a":false,"c":"「基準の設定について」","e":"「原価計算基準」は，単に原価計算に関する啓蒙的な役割を担っていただけというわけではないが，強制力を持つものでもない。正しくは「個々の企業の原価計算手続を画一に規定するものではなく，個々の企業が有効な原価計算手続を規定し実施するための基本的なわくを明らかにしたもの」である。"},{"l":4,"m":"原価計算基準の性質","sb":"","r":"(Ｈ24Ⅰ①-ア)","q":"「原価計算基準」は，昭和37年に制定され，以来一度も改正されずに今日に至っており，原価管理等の経営管理面に果たす役割については陳腐化している部分もあるが，「原価計算基準」は公認会計士や監査法人が財務諸表の監査を行う場合に従わなければならない基準となるので，棚卸資産の評価や原価差異の処理等財務諸表作成のための原価計算を実施する場合は,「原価計算基準」に従わなければならない。","a":false,"c":"「基準の設定について」","e":"「原価計算基準」はあくまでも「実践規範」であり，強制力はない。したがって，企業が原価計算を実施する場合には「原価計算基準」を尊重すべきではあるが，必ずしも「従わなければならない」というわけではない。"},{"l":1,"m":"原価計算の目的","sb":"","r":"(Ｈ20①-カ)","q":"原価計算目的には，政府調達のための予定価格計算に必要な原価資料を提供するという価格計算目的もある。","a":true,"c":"「基準」１⑵","e":"価格計算目的は，我が国の伝統的な原価計算目的の１つである。"},{"l":2,"m":"原価計算の目的","sb":"","r":"(Ｈ24Ⅰ①-イ)","q":"「原価計算基準」では原価計算目的の一つとして，「価格計算に必要な原価資料を提供すること。」があげられているが，これは製品やサービスの売価決定等企業の価格政策に資することを意味している。","a":false,"c":"「基準」１⑵","e":"ここでの価格計算目的とは，政府による調達物資の価格決定，公定価格や統制価格の決定等に際して，原価資料を提供することを意味する。"},{"l":3,"m":"原価計算の目的","sb":"","r":"(Ｈ18①-ア)","q":"原価計算の主たる目的の一つは，予算編成ならびに予算統制のために必要な原価資料を提供することである。","a":true,"c":"「基準」１⑷","e":"なお，予算は利益管理のためのツールであるから，利益管理目的もまた，原価計算の主たる目的の一つと解しうる。"},{"l":4,"m":"原価計算の目的","sb":"","r":"(Ｈ28Ⅱ①-ア他複数)","q":"予算とは，予算期間における企業の各業務分野の具体的な計画を貨幣的に表示し，これを総合編成したものをいい，予算期間における企業の利益目標を指示し，各業務分野の諸活動を調整し，企業全般にわたる総合的管理の要具となるものである。予算は，業務執行に関する総合的な期間計画であるが，予算編成の過程は，たとえば製品組合せの決定，部品を自製するか外注するかの決定等個々の選択的事項に関する意思決定を含まないことは，いうまでもない。","a":false,"c":"「基準」１⑷","e":"「原価計算基準」では，計画設定について概念上の分類よりも実態を重視し，期間計画としての予算編成の過程には，個別計画としての個々の選択的事項に関する意思決定(業務的意思決定)を含む，としている。"},{"l":5,"m":"原価計算の目的","sb":"","r":"(Ｈ29Ⅱ①-ウ他複数)","q":"原価計算の目的として，経営の基本計画設定に必要な原価情報を提供することが想定されている。基本計画とは，経済の動態的変化に適応して，経営の給付目的たる製品，経営立地，生産設備等経営構造に関する基本的事項について，経営意思を決定し，経営構造を合理的に組成することをいい，随時的に行なわれる決定である。","a":true,"c":"「基準」１⑸","e":"経営構造の変革を伴う戦略的意思決定に必要な原価情報を提供することは，原価計算の主たる目的の１つであるが，「原価計算基準」では，戦略的意思決定について「基本計画」という名称が使用されている。"},{"l":1,"m":"原価計算制度","sb":"","r":"(Ｒ４Ⅰ①-ア)","q":"原価計算制度は，財務会計機構と有機的に結びつき常時継続的に行われる計算体系であり，財務諸表の作成(棚卸資産や売上原価等の表示)に必要な情報の提供のみを目的としている。","a":false,"c":"「基準」２","e":"原価計算制度は，財務諸表の作成，原価管理，予算統制等の異なる目的が，重点の相違はあるが相ともに達成されるべき一定の計算秩序であり，財務諸表の作成に必要な情報の提供のみを目的としているわけではない。"},{"l":2,"m":"原価計算制度","sb":"","r":"(Ｈ20①-ア)","q":"原価計算制度とは財務諸表作成のための原価計算であり，原価管理，予算統制等の目的のためには，別の原価計算が行われなければならない。","a":false,"c":"「基準」２","e":"原価計算制度は「財務諸表の作成，原価管理，予算統制等の異なる目的が，重点の相違はあるが相ともに達成されるべき一定の計算秩序」であり，複数の原価計算目的に単一の計算システムで対応することが予定されている。"},{"l":3,"m":"原価計算制度","sb":"","r":"(Ｈ21①-ア)","q":"「原価計算基準」においては，原価計算の目的として財務諸表作成と原価管理を念頭においたものであり，利益管理のための原価計算は，制度としての原価計算の範囲外に属すると考えられている。","a":false,"c":"「基準」１⑷，２","e":"利益管理のためには予算管理が有効であり，予算管理は原価計算制度の目的の１つである。したがって，利益管理のための原価計算は，制度としての原価計算の範囲内に属するといえる。"},{"l":4,"m":"原価計算制度","sb":"","r":"(Ｈ31Ⅰ①-ア他複数)","q":"原価計算制度は，財務会計機構のらち外において，随時断片的に行われる原価の統計的，技術的計算ないしは調査ではなくて，財務会計機構と有機的に結びつき常時継続的に行われる計算体系であるから，予算統制のために必要な原価資料を提供することは，広い意味での原価の計算には含まれるが，制度としての原価計算の範囲外に属する。","a":false,"c":"「基準」１⑷，２","e":"予算統制のための原価計算は，財務会計機構と有機的に結びつき常時継続的に行われるものであり，制度としての原価計算の範囲内に属する。"},{"l":5,"m":"原価計算制度","sb":"","r":"(Ｈ29Ⅰ①-ア他複数)","q":"原価計算制度は，これを大別して実際原価計算制度と標準原価計算制度とに分類することができる。原価管理上必要がある場合には，実際原価計算制度においても必要な原価の標準を帳簿組織のわく外において設定し，これと実際との差異を分析し，報告することがある。","a":true,"c":"「基準」２","e":"原価計算制度は，製品原価の計算と財務会計とがいかなる原価で結び付くかによって，実際原価計算制度と標準原価計算制度とに大別される。ただし，実際原価計算制度を採用する場合に，勘定組織の枠外の統計的補助記録において標準原価計算を実施することがある（統計的標準原価計算）。"},{"l":6,"m":"原価計算制度","sb":"","r":"(Ｒ３⑦-ア)","q":"標準原価計算には種々の方法があるが，これを大別すれば，標準原価計算制度と統計的標準原価計算の二つに分けられる。前者は，標準原価計算を複式簿記機構と結合させ，常時，継続的に行う方法であり，後者は，標準原価計算を複式簿記機構から取り外し，これを統計的補助記録の中で行う方法である。","a":true,"c":"「基準」２","e":"標準原価計算の方法は，複式簿記機構との結合の有無により，標準原価計算制度と統計的標準原価計算に大別される。前者が勘定組織と結合して常時継続的に標準原価計算を実施するのに対し，後者は実際原価計算制度を採用する場合に，勘定組織の枠外の統計的補助記録の中で標準原価計算を実施する。"},{"l":7,"m":"原価計算制度","sb":"","r":"(Ｈ29Ⅱ①-イ)","q":"原価は集計される原価の範囲によって，全部原価と部分原価とに区別される。原価計算制度において計算される原価の種類およびこれと財務会計機構との結びつきは，単一ではない。原価計算制度は，財務会計機構といかに結びつくかという観点から，実際原価計算制度と直接原価計算制度とに大別される。","a":false,"c":"「基準」２","e":"原価計算制度は，財務会計機構といかに結びつくかという観点から，実際原価計算制度と標準原価計算制度とに大別される。直接原価計算制度という表現も散見されるが，その場合の制度とはシステム(system)としてのそれを意味するのであって，社会的制度(institution)としての含意はない。"},{"l":8,"m":"原価計算制度","sb":"","r":"(Ｈ28Ⅰ⑧-ア他複数)","q":"標準原価計算制度は，製品の標準原価を計算し，これを財務会計の主要帳簿に組み入れ，製品原価の計算と財務会計とが，標準原価をもって有機的に結合する原価計算制度である。標準原価計算制度は，必要な計算段階において実際原価を計算し，これと標準との差異を分析し，報告する計算体系である。","a":true,"c":"「基準」２","e":"原価計算が財務会計から入手するデータは実際原価であるため，標準原価計算制度では標準原価と実際原価の双方を計算する。"},{"l":9,"m":"原価計算制度","sb":"","r":"(Ｈ31Ⅱ⑦-エ)","q":"標準原価計算制度では，製品の標準原価を計算し，これを財務会計の主要帳簿に組み入れ，製品原価の計算と財務会計とが，標準原価をもって有機的に結合される。標準原価計算制度は，必要な計算段階において予定原価を計算し，これと標準との差異を分析し，報告する計算体系である。","a":false,"c":"「基準」２","e":"標準原価計算制度は，必要な計算段階において実際原価を計算し，これと標準との差異を分析し，報告する計算体系である。"},{"l":10,"m":"原価計算制度","sb":"","r":"(Ｈ18①-ウ)","q":"企業の経営者は，経営の基本計画及び予算編成における選択的事項の決定に必要な特殊原価の計算を必要としている。原価計算制度はこれらの経営者の情報ニーズを満たすために特殊原価も計算できなければならない。","a":false,"c":"「基準」１⑷⑸，２","e":"企業の経営者が特殊原価に関する情報を必要としていることは確かであるが，特殊原価調査は制度としての原価計算の範囲外に属するため，原価計算制度において特殊原価を計算することはない。"},{"l":11,"m":"原価計算制度","sb":"","r":"(Ｒ４Ⅰ①-イ)","q":"実践規範として設定された「原価計算基準」は，「企業会計原則」の一環を成し，そのうちとくに原価に関して規定したものであるが，必要に応じて，経営の基本計画および予算編成における選択的事項の決定に必要な差額原価や機会原価等の計算についても適用される。","a":false,"c":"「基準」１⑷⑸，２","e":"「原価計算基準」は原価計算制度を規定したものであり，原価計算制度は，財務会計機構と有機的に結びつき常時継続的に行われることを要する。したがって，財務会計機構のらち外において随時断片的に行なわれる特殊原価調査は，制度としての原価計算の範囲外に属するものとして，「原価計算基準」は適用されない。"},{"l":1,"m":"原価の本質と非原価項目","sb":"","r":"(Ｈ21①-ア)","q":"原価計算制度において原価とは，経営における一定の給付にかかわらせて，把握された支出をいう。","a":false,"c":"「基準」３","e":"原価計算制度において原価とは「経営における一定の給付にかかわらせて，は握された財貨又は用役の消費を，貨幣価値的に表したもの」である。"},{"l":2,"m":"原価の本質と非原価項目","sb":"","r":"(Ｈ29Ⅰ①-ウ他複数)","q":"原価は，経営において作り出された一定の給付に転嫁される価値であり，その給付にかかわらせて，は握されたものである。ここに給付とは，経営が作り出す財貨をいい，それは最終給付のみでなく，中間的給付をも意味する。","a":true,"c":"「基準」３⑵","e":"原価計算は，製品(サービス)単位当たりの原価を明らかにする「給付単位計算」としての本質を持つことから，給付にかかわらせて原価を把握するのは当然の要件といえる。"},{"l":3,"m":"原価の本質と非原価項目","sb":"","r":"(Ｈ21①-ウ)","q":"「原価計算基準」でいう給付とは，経営の最終給付である製品のみを意味しており，サービスは含まれていない。","a":false,"c":"「基準」３⑵","e":"給付とは，経営の最終給付のみでなく，仕掛品，半製品等の中間的給付も意味する。また，給付とは経営が作り出す財貨又は用役であるから，製品のみでなくサービスも含まれる。"},{"l":4,"m":"原価の本質と非原価項目","sb":"","r":"(Ｈ23Ⅱ②-オ)","q":"原価要素は，職能別分類に従い，製造原価要素と販売費および一般管理費の要素とに分類できる。製品の製造に要する原価が製造原価であり，製品の販売に要する原価が販売費である。管理費は，これを製造活動の管理費(たとえば，製造部長の給料)と販売活動の管理費（たとえば，販売部長の給料）とに分けられ，前者は製造原価に，後者は販売費に含め，いずれにも分けられない管理費は，一般管理費である。販売費と一般管理費を合わせて，営業費と呼ぶことがある。","a":true,"c":"","e":"製造活動の管理費は製造原価に，販売活動の管理費は販売費に含めるのであって，管理活動に要する費用の全てが一般管理費となるわけではない。"},{"l":5,"m":"原価の本質と非原価項目","sb":"","r":"(Ｈ24Ⅰ①-ウ)","q":"原価は，経営において作り出された一定の給付に転嫁される価値であり，その給付にかかわらせて把握されたものであるため，販売費及び一般管理費は期間原価とされ，非原価として処理される。","a":false,"c":"「基準」３⑵⑶,４⑵,６⑴-1","e":"販管費が期間原価とされることは正しいが，これらは経営目的としての生産・販売活動（及びそれらを支援する一般管理活動）にかかわる価値消費分であることから，製造原価とともに原価計算制度における原価を構成する。"},{"l":6,"m":"原価の本質と非原価項目","sb":"","r":"(Ｈ23Ⅱ②-カ他複数)","q":"「原価計算基準」によれば，原価は，経営目的に関連したものである。経営の目的は，一定の財貨を生産し販売することにあり，経営過程は，このための価値の消費と生成の過程である。原価は，かかる財貨の生産，販売に関して消費された経済価値である。したがって，資金の調達等の財務活動に関連する財務費用は，原則として原価計算制度のもとでは原価を構成しない。","a":true,"c":"「基準」３⑶，５⑴-3","e":"財務費用は「経営目的に関連しない価値の減少」であり，原則として非原価項目として処理される。財務費用を原価算入すれば，経営目的たる生産・販売活動の業績に資本構成の影響が混入し，望ましくないからである。"},{"l":7,"m":"原価の本質と非原価項目","sb":"","r":"(Ｈ18①-エ)","q":"原価計算制度において計算される原価は，経営目的に関連したものである。経営の目的は，資本を調達し，調達した資本により一定の財貨を生産し販売し，利益処分等を行うことである。このため，原価計算制度で計算する原価には，製造原価のみならず，販売費及び一般管理費，さらに財務費用も含まれている。","a":false,"c":"「基準」３⑶，５⑴-3","e":"原価計算制度において，経営目的とは「一定の財貨を生産し販売すること」であり，財務活動たる資本の調達，返還，利益処分等から生ずる財務費用は，原則として原価を構成しない。"},{"l":8,"m":"原価の本質と非原価項目","sb":"","r":"(Ｈ24Ⅰ①-オ)","q":"支払利息は原則として非原価とされるが，生産活動に使用する機械設備を自家建設するためにかかった借入金の支払利息は，一定の条件を満たす場合には原価性が認められるように，製品原価を算定する場合においても，支払利息を製品原価として算入することが認められる場合がある。","a":true,"c":"「基準」３⑶，５⑴-3","e":"「連続意見書第三」固定資産を自家建設した場合に，建設に要する借入資本の利子で稼動前の期間に属するものについては例外的に取得原価への算入が認められており，それが製造用設備の場合には，減価償却を通じて支払利息の一部が製品原価を構成することになる。"},{"l":9,"m":"原価の本質と非原価項目","sb":"","r":"(Ｈ20①-エ)","q":"異常な仕損，減損，棚卸減耗等は経営目的に関連しない価値の減少とされ，非原価項目となる。","a":false,"c":"「基準」３⑷，５⑵-1","e":"異常な仕損，減損，棚卸減耗等は異常な状態を原因とする価値の減少とされ，非原価項目となる。"},{"l":10,"m":"原価の本質と非原価項目","sb":"","r":"(Ｈ24Ⅰ①-エ)","q":"原価は，正常な状態のもとにおける経営活動を前提として，把握された価値の消費であり，異常な状態を原因とする価値の減少を含まないとされる。この場合，正常か異常かは，過去の実績データの平均値等を参考にして，当該価値の消費が金額的・量的に通常生ずると認められる許容範囲を超えているか否かによって判断するのが普通である。","a":false,"c":"「基準」３⑷，５⑵","e":"正常か異常かの判断に際しては，量的側面だけでなく質的側面も考慮される。"},{"l":11,"m":"原価の本質と非原価項目","sb":"","r":"(Ｈ29Ⅰ①-エ)","q":"有価証券の評価損および売却損は，異常な状態を原因とする価値の減少として，原価計算制度において原価に算入しない。また，固定資産売却損および除却損は，経営目的に関連しない価値の減少として，原価計算制度において原価に算入しない。","a":false,"c":"「基準」３⑶⑷,５⑴-4,５⑵-8","e":"有価証券の評価損および売却損は経営目的に関連しない価値の減少として，固定資産売却損および除却損は異常な状態を原因とする価値の減少として，それぞれ非原価項目となる。"},{"l":1,"m":"原価の諸概念","sb":"","r":"(Ｈ27Ⅱ①-イ他複数)","q":"実際原価とは，財貨の実際消費量をもって計算した原価をいう。ただし，その実際消費量は，経営の正常な状態を前提とするものであり，したがって，異常な状態を原因とする異常な消費量は，実際原価の計算においてもこれを実際消費量と解さないものとする。実際原価は，厳密には実際の取得価格をもって計算した原価の実際発生額であるが，原価を予定価格等をもって計算しても，消費量を実際によって計算する限り，それは実際原価の計算である。","a":true,"c":"「基準」４⑴-1","e":"「原価計算基準」における実際原価の本質的特徴は，①実際消費量をもって計算した原価であること（価格については予定価格等の適用が認められる），②実際消費量には異常な状態を原因とする異常な消費量を含まないこと（歴史的原価ではなく実際正常原価であること）の２点に求められる。"},{"l":2,"m":"原価の諸概念","sb":"","r":"(Ｈ26Ⅱ①-イ)","q":"実際原価は，厳密には実際の取得価格をもって計算した原価の実際発生額であるが，予定消費量等をもって計算しても，価格を実際によって計算する限り，それは実際原価の計算である。","a":false,"c":"「基準」４⑴-1","e":"正しくは「予定価格等をもって計算しても，消費量を実際によって計算する限り…」である。"},{"l":3,"m":"原価の諸概念","sb":"","r":"(Ｈ22Ⅰ⑦-エ)","q":"原価標準を設定する際には，価格水準，能率水準，操業度水準に関する基準を仮定しなければならない。これらの水準の組合せによって，理想標準原価，正常標準原価，現実的標準原価などに区別できる。","a":true,"c":"「基準」４⑴-2","e":"原価標準は，価格，能率，操業度といった基礎水準の組合せにより，理想標準原価，正常標準原価(正常原価)，現実的標準原価などに区別される。"},{"l":4,"m":"原価の諸概念","sb":"","r":"(Ｈ30Ⅱ⑦-ア)","q":"標準原価とは，財貨の消費量を科学的，統計的調査に基づいて能率の尺度となるように予定し，かつ，予定価格又は正常価格をもって計算した原価をいう。この場合，能率の尺度としての標準とは，その標準が適用される期間において達成されるべき原価の目標を意味する。標準原価計算制度において用いられる標準原価は，現実的標準原価又は正常原価である。","a":true,"c":"「基準」４⑴-2","e":"標準原価(原価標準)は，消費量と価格の双方を予定する。価格について，現実的標準原価では短期予想価格としての予定価格を，正常原価では長期平均価格としての正常価格を使用する。"},{"l":5,"m":"原価の諸概念","sb":"","r":"(Ｒ４Ⅰ⑦-イ)","q":"原価標準を設定する際に，価格水準，能率水準，操業水準が決定される。これらの水準を組み合わせることで，原価標準は，厳格度という点から，理想的標準原価，現実的標準原価，正常標準原価(正常原価)などに区分される。我が国の「原価計算基準」によれば，標準原価計算制度において用いられる標準原価として，理想的標準原価と現実的標準原価が示されている。","a":false,"c":"「基準」４⑴-2","e":"「原価計算基準」によれば，標準原価計算制度において用いられる標準原価として，現実的標準原価と正常原価が示されている。"},{"l":6,"m":"原価の諸概念","sb":"","r":"(Ｈ26Ⅱ⑧-ア)","q":"標準原価とは，財貨の消費量を科学的，統計的調査に基づいて能率の尺度となるように予定し，かつ，予定価格又は正常価格をもって計算した原価をいう。この場合，能率の尺度としての標準とは，その標準が適用される期間において達成されるべき原価の目標を意味する。標準原価計算制度において用いられる標準原価は，理想標準原価又は正常原価である。","a":false,"c":"「基準」４⑴-2","e":"標準原価計算制度において用いられる標準原価は，現実的標準原価又は正常原価である。"},{"l":7,"m":"原価の諸概念","sb":"","r":"(Ｈ31Ⅱ⑦-ア他複数)","q":"現実的標準原価とは，良好な能率のもとにおいて，その達成が期待されうる標準原価である。通常，生ずると認められる程度の減損，仕損，遊休時間等の余裕率を含む。比較的短期における予定操業度および予定価格を前提として決定され，これらの諸条件の変化に伴い，しばしば改訂される。原価管理目的に適合する。","a":true,"c":"「基準」４⑴-2","e":"現実的標準原価は能率水準として達成可能高能率を予定しており，短期的な動機づけ効果に優れるため，原価管理目的に最も適する。また，適宜改訂される当座標準原価の代表例でもある。"},{"l":8,"m":"原価の諸概念","sb":"","r":"(Ｒ５Ⅱ⑧-エ)","q":"我が国の「原価計算基準」では正常原価を標準原価計算制度における標準原価としているが，これは通常生ずると認められる程度の仕損等の余裕率を含み，比較的短期における予定操業度や予定価格を前提として決定される原価である。","a":false,"c":"「基準」４⑴-2","e":"通常生ずると認められる程度の仕損等の余裕率を含み，比較的短期における予定操業度や予定価格を前提として決定されるのは，もう一つの標準原価計算制度上の標準原価としての現実的標準原価であり，正常原価ではない。"},{"l":9,"m":"原価の諸概念","sb":"","r":"(Ｒ４Ⅰ⑦-エ)","q":"現実的標準原価は，良好な能率のもとで達成が期待される標準原価であり，通常生じると想定される減損，仕損などの余裕率を含んでいる。具体的には，当座価格水準，達成可能高能率水準(あるいは期待実際能率水準)，期待実際操業水準を組み合わせて設定される。経済状態が安定していない状況下でも，原価管理目的に適する。","a":true,"c":"「基準」４⑴-2","e":"現実的標準原価は短期的な標準原価であり，価格水準としては短期予想価格としての予定価格ないし当座価格を，操業水準(基準操業度)としては期待実際操業水準(期待実際操業度)を予定している。また，現実的標準原価が予定する達成可能高能率は規範的な能率水準であり，そういったあるべき作業能率は，経済状態とは無関係である。したがって，経済状態が安定していない状況下でも動機づけ効果に優れ，原価管理目的に適する。"},{"l":10,"m":"原価の諸概念","sb":"","r":"(Ｈ19⑦-イ)","q":"現実的標準原価は価格水準が比較的短期における見込みをもとに設定され，能率水準は達成可能な高水準に設定されることから，原価管理に最も適する標準原価ということができ，さらに，現実的標準原価は外部報告目的の財務諸表におけるたな卸資産価額の決定のためにも使用することができる。","a":true,"c":"「基準」４⑴-2","e":"現実的標準原価では，動機づけ目的から不利差異の発生が予定されるが，これを財務会計上適正に処理することを前提とすれば，外部報告目的の財務諸表における棚卸資産価額の決定のためにも使用することができる。"},{"l":11,"m":"原価の諸概念","sb":"","r":"(Ｈ29Ⅱ⑦-ア)","q":"現実的標準原価は，良好な能率のもとにおいて，その達成が期待されうる標準原価をいう。比較的短期における予定操業度および予定価格を前提として決定され，これら諸条件の変化に伴い，しばしば改訂される標準原価である。原価管理に最も適するのみでなく，予算の編成のためにも用いられる。ただし，たな卸資産価額の算定のためには用いるべきではない。","a":false,"c":"「基準」４⑴-2","e":"現実的標準原価は主として原価管理を目的とする標準原価であるが，棚卸資産価額の算定のためにも用いられる。"},{"l":12,"m":"原価の諸概念","sb":"","r":"(Ｈ31Ⅱ⑦-イ)","q":"正常原価とは，経営における異常な状態を排除し，経営活動に関する比較的長期にわたる過去の実際数値を統計的に平準化し，これに将来のすう勢を加味した正常能率，正常操業度および正常価格に基づいて決定される原価をいう。棚卸資産の算定に適する。","a":true,"c":"「基準」４⑴-2","e":"正常原価は，過去の統計に将来の趨勢を加味した長期平均的な標準原価であるから，経済状態が安定している場合に棚卸資産価額の算定に最も適する。"},{"l":13,"m":"原価の諸概念","sb":"","r":"(Ｒ６Ⅰ①-エ)","q":"正常原価とは，経営における異常な状態を排除し，経営活動に関する比較的短期にわたる過去の実際数値を統計的に平準化し，これに将来のすう勢を加味した正常能率，正常操業度および正常価格に基づいて決定される原価をいう。","a":false,"c":"「基準」４⑴-2","e":"正常原価の「正常」という語句には，異常でないという意味の他に「長期平均的」というニュアンスが含まれる。正しくは「経営活動に関する比較的長期にわたる過去の実際数値を統計的に平準化し…」である。"},{"l":14,"m":"原価の諸概念","sb":"","r":"(Ｒ４Ⅰ⑦-ウ)","q":"正常標準原価(正常原価)は，経営活動に関する比較的長期にわたる過去の実際数値を統計的に平準化し，これに将来の趨勢を加味して決定される。具体的には，正常価格水準，理想能率水準，実際的生産能力水準を組み合わせて設定した標準原価である。正常標準原価は，経済状態が安定している場合，期間損益計算目的に適合している。","a":false,"c":"「基準」４⑴-2","e":"正常標準原価(正常原価)は，正常価格水準，正常能率水準，正常操業水準（正常操業度ないし平均操業度）を組み合わせて設定した標準原価であり，理想能率水準や実際的生産能力水準を予定するのは理想標準原価である。"},{"l":15,"m":"原価の諸概念","sb":"","r":"(Ｈ30Ⅱ⑦-イ)","q":"正常原価とは，経営における異常な状態を排除し，経営活動に関する比較的長期にわたる過去の実際数値を統計的に平準化し，これに将来のすう勢を加味した正常能率，正常操業度および正常価格に基づいて決定される原価をいう。正常原価は，経済状態の安定している場合に，たな卸資産価額の算定および予算編成のために用いられる。","a":false,"c":"「基準」４⑴-2","e":"正常原価は長期平均的な標準原価であるため，短期を前提とする予算の編成には馴染まない。正しくは「経済状態の安定している場合に，たな卸資産価額の算定に最も適するのみでなく，原価管理のための標準としても用いられる」である。"},{"l":16,"m":"原価の諸概念","sb":"","r":"(Ｒ６Ⅱ⑦-イ)","q":"我が国の「原価計算基準」では，標準原価として現実的標準原価，正常原価，予定原価，理想標準原価の四つをあげており，理想標準原価は制度としての標準原価ではないものの，いずれも原価管理に役立つことを目的としている点で共通している。なお，理想標準原価を除いては，原価管理のみならず，たな卸資産価額の算定と予算の編成にも等しく適するものとして用いられる点で共通している。","a":false,"c":"「基準」４⑴-2","e":"４つの標準原価は，重点の相違はあるがいずれも原価管理目的での使用が想定されている。一方，理想標準原価を除く３つの標準原価について，棚卸資産価額の算定と予算の編成にも等しく適するとしているが，正常原価は長期平均的な標準原価であるから，短期を前提とする予算の編成には全く適さない。"},{"l":17,"m":"原価の諸概念","sb":"","r":"(Ｈ26Ⅱ⑧-イ)","q":"標準原価として，実務上予定原価が意味される場合がある。予定原価とは，将来における財貨の予定消費量と予定価格とをもって計算した原価をいう。予定原価は，予算の編成に適するのみでなく，原価管理およびたな卸資産価額の算定のためにも用いられる。","a":true,"c":"「基準」４⑴-2","e":"予定原価とは，理論上は見積原価と称されるものであり，過去の経験や勘といった非科学的方法により原価を予定するという点において，本来的な標準原価とは区別される。予定原価は実際原価に近似するように設定されるため，予算編成に適するといわれる。"},{"l":18,"m":"原価の諸概念","sb":"","r":"(Ｈ20⑧-イ)","q":"標準原価のタイプには，理想標準原価，正常標準原価および現実的標準原価などがあるが，このうち理想標準原価は，もっとも厳しい標準原価であるため，製造現場のモティベーションを下げることになり，原価管理において不適切な面があり，さらに期間損益計算に使用することも適していないといえる。","a":true,"c":"「基準」４⑴-2","e":"理想標準原価を達成することは現実には不可能であるため，これを短期的な目標として製造現場に指示すれば，その動機づけを損なう危険性がある。また，多額の不利差異の発生が自明であり，原価差異を適正に処理しさえすれば財務諸表作成に当たっての不備は生じないものの，少なくとも期間損益計算に適しているとはいえない。"},{"l":19,"m":"原価の諸概念","sb":"","r":"(Ｒ５Ⅰ⑦-ア)","q":"理想標準原価は原価管理のために用いられることがあるが，「原価計算基準」にいう制度としての標準原価ではない。","a":true,"c":"「基準」４⑴-2","e":"近年では，仕損ゼロの達成に向けた長期的な動機づけの観点から，将来的に回避すべき無駄を完全に明示するべく，理想標準原価を原価管理用の標準として使用する企業が少なくない。しかしながら，「原価計算基準」の設定当時，長期を見据えて原価を計画的に引き下げるという思考(原価低減)は未だ浸透していなかったため，短期目標としての適性を欠く理想標準原価は，制度としての標準原価ではないとされている。"},{"l":20,"m":"原価の諸概念","sb":"","r":"(Ｈ25Ⅰ⑨-ア)","q":"標準原価計算制度における標準は，原価管理を有効に行うため，技術的に達成可能な最大操業度のもとにおいて，最高能率を表す最低の原価である理想標準原価を使うとされている。","a":false,"c":"「基準」４⑴-2","e":"標準原価計算制度において用いられる標準原価は，現実的標準原価又は正常原価であり，理想標準原価は制度としての標準原価ではない。"},{"l":21,"m":"原価の諸概念","sb":"","r":"(Ｒ６Ⅰ①-ア)","q":"理想標準原価とは，技術的に達成可能な最小操業度のもとにおいて，最高能率を表わす最低の原価をいい，財貨の消費における減損，仕損，遊休時間等に対する余裕率を許容しない理想的水準における標準原価である。","a":false,"c":"「基準」４⑴-2","e":"最低の原価としての理想標準原価においては，配賦率を最小とするべく，操業水準として実際的生産能力が想定されている。正しくは「技術的に達成可能な最大操業度のもとにおいて…」である。"},{"l":22,"m":"原価の諸概念","sb":"","r":"(Ｈ30Ⅰ⑦-ア)","q":"原価管理のためにときとして理想標準原価が用いられることがあるが，かかる標準原価は，原価計算基準でいう制度としての標準原価ではない。理想標準原価とは，技術的に達成可能な最大操業度のもとにおいて，最高能率を表す最低の原価をいい，財貨の消費における減損，仕損，遊休時間等に対する余裕率を許容する理想的水準における標準原価である。","a":false,"c":"「基準」４⑴-2","e":"理想標準原価は，財貨の消費における減損，仕損，遊休時間等に対する余裕率を許容しない。余裕率を許容するのは，現実的標準原価である。"},{"l":23,"m":"原価の諸概念","sb":"","r":"(Ｈ31Ⅱ⑦-ウ)","q":"理想標準原価とは，技術的に達成可能な最大操業度のもとにおいて，最高能率を表す最低の原価をいう。財貨の消費における減損，仕損，遊休時間等に対する余裕率を許容しない理想的水準における標準原価である。棚卸資産価額の算定のために最も適することに加え，原価管理のための標準としても用いられる。","a":false,"c":"「基準」４⑴-2","e":"理想標準原価は，原価管理のための標準として用いられることがある。ただし，多額の原価差異の発生が自明であり，真実の原価とはいえないため，棚卸資産価額の算定には適さない。"},{"l":24,"m":"原価の諸概念","sb":"","r":"(Ｈ27Ⅱ①-ウ)","q":"原価は，財務諸表上収益との対応関係に基づいて，製品原価と期間原価とに区別される。製品原価とは，一定単位の製品に集計された原価をいい，期間原価とは，一定期間における発生額を，当期の収益に直接対応させて，は握した原価をいう。製品原価と期間原価との範囲の区別は相対的であるが，通常，売上品およびたな卸資産の価額を構成する全部の製造原価を製品原価とし，販売費および一般管理費は，これを期間原価とする。","a":true,"c":"「基準」４⑵","e":"製品原価と期間原価の範囲の区別は相対的であり，全部原価計算（直接原価計算）では全部製造原価（変動製造原価）を製品原価，販売費及び一般管理費（固定製造原価と販売費及び一般管理費）を期間原価とする。「原価計算基準」がいうところの「通常」が，全部原価計算を指すことはいうまでもない。"},{"l":25,"m":"原価の諸概念","sb":"","r":"(Ｒ６Ⅰ①-ウ)","q":"部分原価は，計算目的によって各種のものを計算することができるが，最も重要な部分原価は，変動直接費および変動間接費のみを集計した直接原価(変動原価)である。","a":true,"c":"「基準」４⑵","e":"最も重要な部分原価としての直接原価とは，変動直接費及び変動間接費のみを集計した原価をいい，変動間接費を含む以上，製品との関連における分類でいう直接費とは区別される。むしろ，操業度との関連における分類でいう変動費に相当する原価概念であり，近年では，直接原価(変動原価)のみを製品に集計する原価計算を，直接原価計算ではなく変動原価計算と呼ぶことがある。"},{"l":26,"m":"原価の諸概念","sb":"","r":"(Ｈ18①-オ)","q":"原価は，集計される原価の範囲によって，全部原価と部分原価とに区分される。最も重要な部分原価は，変動直接費及び変動間接費のみを集計した直接原価である。直接原価は直接費と同じ意味であり，変動原価ともよばれている。","a":false,"c":"「基準」４⑶，８⑶","e":"直接原価とは変動直接費及び変動間接費を集計したものであり，直接費だけを集計したものではない。したがって，直接原価と直接費は同じ意味ではない。"},{"l":1,"m":"原価計算の一般的基準","sb":"","r":"(Ｈ24Ⅱ①-ア)","q":"原価計算制度における一般的基準では，財務諸表の作成に役立つために，原価計算は，原価を一定の給付にかかわらせて集計し，製品原価および製品単位原価を計算するものとされている。","a":false,"c":"「基準」６⑴-1","e":"財務諸表の作成に役立つためには，財務諸表上の収益との対応関係に基づく原価の分類が重要となる。正しくは，「製品原価および期間原価を計算する」である。"},{"l":2,"m":"原価計算の一般的基準","sb":"","r":"(Ｈ28Ⅱ①-エ)","q":"原価の数値は，財務会計の原始記録，信頼しうる統計資料等によって，その信ぴょう性が確保されるものでなければならない。このため原価計算は，原則として実際原価を計算する。この場合，実際原価を計算することは，必ずしも原価を取得価格をもって計算することを意味しないで，予定価格等をもって計算することもできる。また必要ある場合には，製品原価を標準原価をもって計算し，これを財務諸表に提供することもできる。","a":true,"c":"「基準」６⑴-2","e":"原価計算制度としては，実際原価計算制度と標準原価計算制度の選択が認められるが，財務諸表の作成という見地からすれば，真実の原価としての信憑性を確保するべく，実際原価を計算するのが原則となる。つまり，本肢においては，「財務諸表の作成に役立つために…」という文言が背後に隠れている。"},{"l":3,"m":"原価計算の一般的基準","sb":"","r":"(Ｒ２Ⅰ①-イ)","q":"原価の数値は，財務会計の原始記録，信頼し得る統計資料等によって，その明瞭性が確保されるものでなければならない。このため原価計算は，原則として実際原価を計算する。この場合，実際原価を計算することは，必ずしも原価を取得価格をもって計算することを意味しないで，予定価格等をもって計算することもできる。また必要ある場合には，製品原価を標準原価をもって計算し，これを財務諸表に提供することもできる。","a":false,"c":"「基準」６⑴-2","e":"原価計算が原則として実際原価を計算するのは，原価の数値について「財務会計の原始記録，信頼しうる統計資料等によって，その信ぴょう性が確保されなければならない」からである。「明瞭性」は，報告，表示形式の問題であり，原価計算によって担保されるものではない。"},{"l":4,"m":"原価計算の一般的基準","sb":"","r":"(Ｈ31Ⅰ①-エ)","q":"原価の数値は，財務会計の原始記録，信頼しうる統計資料等によって，その信ぴょう性が確保されるものでなければならない。このため，原価計算は，原則として実際原価を計算する。この場合，実際原価を計算することは取得価格をもって原価を計算することを意味する。また必要ある場合には，標準原価をもって製品原価を計算し，これを財務諸表に提供することもできる。","a":false,"c":"「基準」４⑴-1，６⑴-2","e":"原価計算制度における実際原価とは，実際消費量をもって計算した原価をいい，実際の取得価格をもって計算した原価の実際発生額を必ずしも意味しない。正しくは，「実際原価を計算することは，必ずしも原価を取得価格をもって計算することを意味しないで，予定価格等をもって計算することもできる」である。"},{"l":5,"m":"原価計算の一般的基準","sb":"","r":"(Ｈ20①-オ)","q":"実際原価のみが真実の原価であり，標準原価は真実の原価ではない。","a":false,"c":"「基準」６⑴-2・3","e":"真実の原価といえば原則的には実際原価を意味するが，原価差異を財務会計上適正に処理することを前提とすれば，標準原価も棚卸資産価額の算定に資する真実の原価として認められる。"},{"l":6,"m":"原価計算の一般的基準","sb":"","r":"(Ｈ31Ⅰ①-ウ他複数)","q":"原価計算は，財務会計機構と有機的に結合して行われる。このため，勘定組織には，原価に関する細分記録を統括する諸勘定を設ける。なお，原価管理上必要がある場合には，実際原価計算制度においても必要な原価の標準を勘定組織のわく外において設定し，これと実際との差異を分析し，報告することがある。","a":true,"c":"「基準」２，６⑴-4","e":"本肢では隠れているが，原価計算と財務会計機構との有機的な結合が求められるのは，あくまでも財務諸表作成の見地である。原価管理のための標準原価計算は勘定組織の枠外の統計的補助記録の中で行うことも可能であり（いわゆる統計的標準原価計算），必ずしも財務会計機構との結合を要さない。"},{"l":7,"m":"原価計算の一般的基準","sb":"","r":"(Ｒ２Ⅰ①-ア)","q":"原価計算制度は，財務諸表の作成，原価管理，予算統制等の異なる目的が相ともに達成されるべき一定の計算秩序である。かかるものとして原価計算制度は，財務会計機構と有機的に結びつき常時継続的に行われる計算体系である。とりわけ，財務諸表の作成に役立つためには，勘定組織には，原価に関する集約情報を統括する諸勘定を設けることが重要である。","a":false,"c":"「基準」２，６⑴-4","e":"財務諸表の作成に役立つために，原価計算は，財務会計機構と有機的に結合して行われる。このため勘定組織には「原価に関する細分記録を統括する諸勘定を設ける」ことが求められる。なお，細分記録とは材料元帳，製造間接費元帳，原価元帳などの補助元帳（総勘定元帳の各勘定の内訳記録）をいい，これを統括するのが総勘定元帳における材料勘定，製造間接費勘定，仕掛品勘定などの諸勘定である。"},{"l":8,"m":"原価計算の一般的基準","sb":"","r":"(Ｈ21①-キ)","q":"原価管理に役立つために，原価計算は，原価要素を，機能別に，また直接費と間接費，固定費と変動費，管理可能費と管理不能費の区分に基づいて分類し，計算する。","a":true,"c":"「基準」６⑵-6","e":"少なくとも，操業度との関連における分類と管理可能性に基づく分類は，財務諸表作成の見地ではなく原価管理ないし責任会計の見地から必要となるものである。"},{"l":9,"m":"原価計算の一般的基準","sb":"","r":"(Ｒ２Ⅰ①-ウ他複数)","q":"原価計算は，原価管理に役立つために，経営における管理の権限と責任の委譲を前提とし，作業区分等に基づく部門を管理責任の区分とし，各部門における作業の原価を計算し，各管理区分における原価発生の責任を明らかにさせる。また，原価計算は，原価の標準の設定，指示から原価の報告に至るまでのすべての計算過程を通じて，原価の物量を測定表示することに重点を置く。","a":true,"c":"「基準」６⑵-5・7","e":"原価管理を効果的に行うためには現場管理者や現場作業員の動機づけが重要であり，動機づけのためには現場管理者の責任を問うのが有効である。そのため，原価計算は責任会計と結合し，原価責任を明確化することが求められる。また，標準原価管理の焦点は，製品単位当たりで設定した物量標準に基づく直接費の管理にある。したがって，すべての計算過程を通じて，直接材料消費量や直接作業時間といった物量を測定表示することに重点をおく必要がある。"},{"l":10,"m":"原価計算の一般的基準","sb":"","r":"(Ｒ５Ⅱ①-エ)","q":"原価管理に役立つために，原価計算は，原価の標準の設定，指示から原価の報告に至るまでのすべての計算過程を通じて，原価の物量を測定表示することに重点をおく。製造現場における原価管理のためには，物量の計算が不可欠だからである。原価計算担当者にとっても物量こそが管理すべき変数となる。","a":false,"c":"「基準」６⑵-7","e":"標準原価管理一連のプロセスにおいて，原価の物量を測定表示することに重点が置かれるという点は正しい。ただし，物量を管理すべき変数と捉えるのは，製造現場の管理者においてであり，原価計算担当者の管轄ではない。"},{"l":11,"m":"原価計算の一般的基準","sb":"","r":"(Ｒ２Ⅰ①-エ他複数)","q":"原価管理とは，原価の標準を設定してこれを指示し，原価の実際の発生額を計算記録し，これを標準と比較して，その差異の原因を分析し，これに関する資料を経営管理者に報告し，原価能率を増進する措置を講ずることである。したがって，原価の標準は，原価発生の責任を明らかにし，原価能率を判定する尺度として，これを設定する。","a":true,"c":"「基準」１⑶，６⑵-8","e":"「原価計算基準」における原価管理とは標準原価計算を用いた原価管理であるから，原価の標準（達成すべき原価の目標）は，原価責任を明確化し，原価能率を判定する尺度として，理想的には標準原価としてこれを設定する。"},{"l":12,"m":"原価計算の一般的基準","sb":"","r":"(Ｈ28Ⅱ①-ウ他複数)","q":"原価計算は，予算期間において期待されうる条件に基づく実際原価又は標準原価を計算し，予算とくに，費用予算の編成に資料を提供するとともに，予算と対照比較しうるように原価の実績を計算し，もって予算統制に資料を提供する。","a":false,"c":"「基準」６⑶-12","e":"実際原価が確定するのは当該予算期間の終了後であり，費用予算の編成に際して原価計算が実際原価を計算することはありえない。正しくは「予算期間において期待されうる条件に基づく予定原価又は標準原価を計算し…」である。"},{"l":13,"m":"原価計算の一般的基準","sb":"","r":"(Ｒ２Ⅱ①-エ)","q":"原価計算は，予算期間において期待されうる条件に基づく予定原価又は標準原価を計算し，予算とくに，費用予算の編成に資料を提供するとともに，予算と対照比較しうるように原価の標準を計算し，もって予算統制に資料を提供する。","a":false,"c":"「基準」６⑶-12","e":"「原価計算基準」設定当時の予算統制といえば，予算期間終了後に差異を把握して，是正措置を講じるという事後統制が中心であったが，原価計算に基づいて予算と対象比較するのは原価の標準ではない。正しくは「予算と対照比較しうるように原価の実績を計算し，もって予算統制に資料を提供する」である。"},{"l":1,"m":"実際原価の計算手続","sb":"","r":"(Ｈ21①-カ)","q":"原価計算制度においては，販売費及び一般管理費も費目別に計算したのち，製品別に配賦される。","a":false,"c":"「基準」７，38","e":"販売費及び一般管理費については，原則として費目別計算を行うのみであり，部門別に計算することもなければ，製品別に配賦する(集計する)こともない。価格"},{"l":2,"m":"実際原価の計算手続","sb":"","r":"(Ｈ30Ⅰ①-ア)","q":"原価要素は製造原価要素と販売費および一般管理費要素とに分類される。実際原価の計算においては，いずれの原価要素についても，原則としてその実際発生額を，まず費目別に計算し，次いで原価部門別に計算し，最後に製品別に集計する。","a":false,"c":"「基準」７，38","e":"販売費及び一般管理費については，原則として費目別計算を行うのみであり，部門別に計算することもなければ，製品別に配賦する(集計する)こともない。価格\n決定のために販売費及び一般管理費を製品に配賦することはあるが，そのような原価計算は原価計算制度の範囲外に属する。"},{"l":3,"m":"実際原価の計算手続","sb":"","r":"(Ｒ５Ⅱ①-ウ)","q":"原価計算制度における実際原価の計算には３つの段階がある。すなわち，製造原価は，原則として，その実際発生額を，まず費目別に計算し，次いで原価部門別に計算し，最後に製品別に集計する。このとき，原価計算は工業簿記の記録に基づいて行なわれる。原価計算数値は複式簿記機構に組み込まれ，原価計算により提供される内訳記録と複式簿記により提供される合計記録とが有機的に結合される。","a":true,"c":"「基準」７","e":"実際原価の計算・記帳手続において，原価計算により提供される内訳記録（材料元帳，製造間接費元帳，原価元帳などにおける各記録）は，これを統括する総勘定元帳における合計記録（材料勘定，製造間接費勘定，仕掛品勘定などにおける各記録）に対応する。"},{"l":1,"m":"製造原価要素の分類基準","sb":"","r":"(Ｈ30Ⅰ①-イ他複数)","q":"形態別分類とは，財務会計における費用の発生を基礎とする分類，すなわち原価発生の形態による分類である。原価要素は，形態別分類によって，材料費，労務費，経費に分類される。原価計算は，財務会計から原価に関する形態別分類による基礎資料を受け取り，これに基づいて原価を計算する。形態別分類は，原価計算と財務会計の関連上重要となる分類基準である。","a":true,"c":"「基準」８⑴","e":"形態別分類とは，財務会計における費用の発生を基礎とする分類であり，これに基づく費目の名称は原価財として「何を消費したのか」を示す。"},{"l":2,"m":"製造原価要素の分類基準","sb":"","r":"(Ｈ30Ⅰ①-ウ)","q":"機能別分類とは，原価が経営上のいかなる機能のために発生したかによる分類である。機能別分類により，材料費は主要材料費，修繕材料費，試験研究材料費，買入部品費，工場消耗品費等に分類される。","a":false,"c":"「基準」８⑴⑵","e":"機能別分類とは，同じ資源の消費であっても，目的・用途の相違によって異なる原価要素として再分類するものであり，これに基づく費目の名称は「原価財を何のために消費したのか」を示す。この点，買入部品費は，生来的には材料費の形態別分類の１つであり，機能別分類の例として挙げるのは不適切である。"},{"l":3,"m":"製造原価要素の分類基準","sb":"","r":"(Ｈ24Ⅰ①-キ)","q":"原価要素を製品との関連において分類すると，例えば，賃金は，作業種類別直接賃金，間接作業賃金，手待賃金等に分類することができる。","a":false,"c":"「基準」８⑵⑶","e":"作業種類別直接賃金，間接作業賃金，手待賃金等は，直接工賃金の機能別分類であって，製品との関連における分類ではない。"},{"l":4,"m":"製造原価要素の分類基準","sb":"","r":"(Ｒ５Ⅱ①-イ)","q":"費目別計算においては，原価要素を，原則として，形態別分類を基礎とし，これを直接費と間接費とに大別し，さらに必要に応じ機能別分類を加味して分類する。機能別分類は，原価が経営上のいかなる機能のために発生したかによる分類であるから，原価管理を実施するために重要な役割を果たすとともに，活動基準原価計算(ＡＢＣ)を適用するための実質的な基礎になる。","a":true,"c":"「基準」８⑵，10","e":"機能別分類は，機能別に設定された原価部門に対する原価集計の基礎となる。この点，ＡＢＣにおける中間的原価計算対象としての活動は，原価部門を細分化して設定するのが通常である。その意味において，部門別計算の基礎となる機能別分類は，ＡＢＣを適用するための実質的な基礎になるといえる。"},{"l":5,"m":"製造原価要素の分類基準","sb":"","r":"(Ｈ30Ⅱ③-ア)","q":"直接費と間接費の分類は製品との関連における分類であり，製品に対する原価の発生が，一定単位の製品の生成に関して直接的に認識・把握できるかどうかによって，直接費と間接費とに分けられる。","a":true,"c":"「基準」８⑶","e":"直接費と間接費の分類は，製品単位当たりで物量標準を設定しうるかどうかの性質上の区別による分類と換言しうる。"},{"l":6,"m":"製造原価要素の分類基準","sb":"","r":"(Ｈ22Ⅰ⑪-オ)","q":"固定費と変動費の区別は絶対的なものではなく，その発生額を把握する期間が長くなればなるほど，より多くの費目が変動費となる。","a":true,"c":"「基準」８⑷","e":"固定費と変動費の区別は，測定期間との関係で相対的なものである。つまり，その発生額を把握する期間が長くなればなるほど，より多くの費目がコスト・ドライバー(コストを増減させる要因)を有する変動費となり，期間の区切りを取り払えば，究極的には全ての費目が変動費となる。"},{"l":7,"m":"製造原価要素の分類基準","sb":"","r":"(Ｈ30Ⅰ①-エ)","q":"操業度との関連における分類とは，操業度の増減に対するコストビヘイビアによる分類である。原価要素は，この分類基準によって，固定費と変動費に分類される。分類困難な準固定費又は準変動費については，固定費又は変動費とみなして，これをそのいずれかに帰属させるか，固定費と変動費が合成されたものであると理解し，固定費部分と変動費部分に分解することで処理する。","a":true,"c":"「基準」８⑷","e":"準固定費又は準変動費を固定費と変動費とに分類する場合，①固定費又は変動費のいずれかに帰属させる，②固定費部分と変動費部分とに分解する，という２つの方法があり，「原価計算基準」ではその選択適用を規定している。"},{"l":8,"m":"製造原価要素の分類基準","sb":"","r":"(Ｈ31Ⅰ①-イ)","q":"原価要素は，原価の管理可能性に基づいて，管理可能費と管理不能費に分類される。原価計算は経営における管理の権限と責任の委譲を前提としているため，ある原価要素は，下級管理者層にとって管理不能費であっても，上級管理者層にとっては管理可能費であることがある。","a":true,"c":"「基準」８⑸","e":"管理可能性は管理階層との関係で相対的な概念であり，上級管理者層になるほど管理可能な項目の範囲は広くなる。したがって，下級管理者層にとって管理不能費であっても，上級管理者層にとっては管理可能費であることがある。"},{"l":9,"m":"製造原価要素の分類基準","sb":"","r":"(Ｈ27Ⅰ①-エ)","q":"原価の管理可能性に基づく分類とは，原価の発生が一定の管理者層によって管理しうるかどうかの分類であり，原価要素は，この分類基準によってこれを管理可能費と管理不能費とに分類する。上級管理者層にとって管理不能費であるものも，下級管理者層にとっては管理可能費となることがある。","a":false,"c":"「基準」８⑸","e":"正しくは「下級管理者層にとって管理不能費であるものも，上級管理者層にとっては管理可能費となることがある」である。"}]},{"n":2,"name":"費目別計算","qs":[{"l":1,"m":"費目別計算における原価要素の分類","sb":"","r":"(Ｈ31Ⅱ①-エ)","q":"実際原価計算制度は，製品の実際原価を計算し，これを財務会計の主要帳簿に組み入れ，製品原価の計算と財務会計とが，実際原価をもって有機的に結合する原価計算制度である。したがって，実際原価計算制度における原価の費目別計算は，一定期間における原価要素を費目別に分類測定する手続であるから，財務会計における費用計算であり，同時に原価計算における第一次の計算段階でもある。","a":true,"c":"「基準」２，９","e":"正しい文章であるが，標準原価計算制度を採用する場合であっても，実際原価の費目別計算は，実際原価計算制度を採用する場合と変わらない。"},{"l":2,"m":"費目別計算における原価要素の分類","sb":"","r":"(Ｈ20①-キ)","q":"費目別計算においては，形態別分類が基礎となるべきであり，機能別分類の観点は考慮されない。","a":false,"c":"「基準」10","e":"第一次の計算段階である以上，費目別計算において財務会計における費用の発生を基礎とする分類(形態別分類)が基礎となるのは確かであるが，部門別計算との関係で，機能別分類を加味する必要もある。"},{"l":3,"m":"費目別計算における原価要素の分類","sb":"","r":"(Ｈ28Ⅰ①-ア他複数)","q":"原価の費目別計算とは，一定期間における原価要素を費目別に分類測定する手続をいい，財務会計における費用計算であると同時に，原価計算における第一次の計算段階である。費目別計算においては，原価要素を，原則として，機能別分類を基礎とし，これを直接費と間接費とに大別し，さらに必要に応じ形態別分類を加味して分類する。","a":false,"c":"「基準」９，10","e":"財務会計における費用の発生を基礎とする分類が形態別分類，これを資源消費の目的・用途の相違によって再分類したものが機能別分類であり，機能別分類が形態別分類に先んじることはない。正しくは「形態別分類を基礎とし，これを直接費と間接費とに大別し，さらに必要に応じ機能別分類を加味して分類する」である。"},{"l":4,"m":"費目別計算における原価要素の分類","sb":"","r":"(Ｈ31Ⅱ①-ア)","q":"費目別計算においては，原価要素を，原則として，形態別分類を基礎とし，これを直接費と間接費とに大別し，さらに必要に応じて機能別分類を加味して分類する。機能別分類によると，賃金は，作業種類別直接賃金，間接作業賃金，間接工賃金，手待賃金等に分類されるが，福利費（健康保険料負担金等）は間接経費に分類される。","a":false,"c":"「基準」10","e":"福利費(健康保険料負担金等)は，個人別に把握されることから，労働力の調達・消費に付帯する労務副費としての性質を有し，間接労務費に分類される。"},{"l":1,"m":"材料費計算","sb":"","r":"(Ｈ30Ⅱ①-イ)","q":"直接材料費，補助材料費等であって出入記録を行う材料に関する原価は，各種の材料につき原価計算期間における実際の消費量に，その消費価格を乗じて計算する。材料の実際の消費量は，原則として継続記録法によって計算する。材料の消費価格は，原則として購入原価をもって計算する。材料の消費価格は必要ある場合には，予定価格等をもって計算することができる。","a":true,"c":"「基準」11⑴～⑶","e":"金額的重要性が高く，出入記録（受払記録）を行う材料に関する原価は，実際消費量（原則として継続記録法によって計算する）にその消費価格（原則として実際の購入原価をもって計算する）を乗じて計算する。また，消費価格については，製品原価の計算の迅速化及び比較可能性の確保という観点から，予定価格等をもって計算することが認められる。"},{"l":2,"m":"材料費計算","sb":"","r":"(Ｈ21②-イ)","q":"材料の実際消費量は，原則として継続記録法によって計算する。","a":true,"c":"「基準」11⑵","e":"棚卸計算法によれば棚卸減耗が実際消費量に混入する等の問題があるため，実際消費量の計算は継続記録法によるのが原則である。"},{"l":3,"m":"材料費計算","sb":"","r":"(Ｈ31Ⅱ①-イ)","q":"実際原価計算において，出入記録を行う材料に関する原価は，原価計算期間における実際の消費量に，その消費価格を乗じて計算しなければならない。ただし，材料の購入原価は，必要がある場合には，予定価格等をもって計算することができるが，材料の消費価格は予定価格等をもって計算することができない。","a":false,"c":"「基準」11⑴⑶⑷","e":"材料の消費価格は購入原価（実際購入原価）をもって計算するのが原則であるが，必要ある場合には，予定価格等をもって計算することが認められる。"},{"l":4,"m":"材料費計算","sb":"","r":"(Ｈ21②-ウ)","q":"材料の購入原価は，購入代価に買入手数料，引取運賃，荷役費，保険料，関税等材料買入に要した引取費用を加算した金額であり，購入事務や検収などに要した費用は購入原価に含めてはならない。","a":false,"c":"「基準」11⑷","e":"購入事務費や検収費などの内部副費は，購入原価に算入しない処理も認められるが，その全部ないし一部を購入原価に算入することも認められる。"},{"l":5,"m":"材料費計算","sb":"","r":"(Ｒ６Ⅱ①-ア)","q":"材料の購入原価を計算する際に，購入代価に全ての材料副費を加算することが困難である場合，購入代価のみで購入原価を計算することが認められている。","a":false,"c":"「基準」11⑷","e":"引取費用については，特定材料との因果関係が相対的に明確であり，全て入庫前(購入原価算定前)に発生することから，必ず購入原価に算入することになっている。したがって，購入代価のみで購入原価を計算することは認められていない。"},{"l":6,"m":"材料費計算","sb":"","r":"(Ｈ28Ⅰ①-イ他複数)","q":"購入代価に加算する材料副費の一部又は全部は，これを予定配賦率によって計算することができる。予定配賦率は，一定期間の材料副費の予定総額を，その期間における材料の予定購入代価又は予定購入数量の総額をもって除して算定する。ただし，購入事務費，検収費，整理費，選別費，手入費，保管費等については，それぞれに適当な予定配賦率を設定することができる。","a":true,"c":"「基準」11⑷","e":"購入代価に加算する材料副費について，購入原価の早期確定の観点から，予定配賦率による計算が認められている。また，予定配賦率を算定する際の配賦基準としては，主に引取費用との因果関係を重視し，購入代価基準や購入数量基準の採用が想定されている。ただし，内部副費については，購入代価又は購入数量との比例性(相関性)が相対的に低いため，それぞれに適当な予定配賦率(配賦基準)を設定することが認められている。"},{"l":7,"m":"材料費計算","sb":"","r":"(Ｒ６Ⅱ①-イ)","q":"材料副費は送状価額に比例して発生するため，種類別配賦を行うよりも一括配賦の方が望ましい。","a":false,"c":"「基準」11⑷","e":"材料副費の配賦基準としては，原則的には購入代価(送状価額)又は購入数量が想定されており，内部副費については，より適切な配賦基準を個別に適用することが認められている。これは，材料副費の発生と比例性(相関性)を有する配賦基準が，必ずしも単一でないことを意味する。したがって，価値移転の観点からすれば，一括配賦よりも種類別配賦の方が望ましい。"},{"l":8,"m":"材料費計算","sb":"","r":"(Ｒ６Ⅱ①-ウ)","q":"材料副費の一部を材料の購入原価に算入しない場合には，これを間接経費に属する項目とし又は材料費に配賦する。","a":true,"c":"「基準」11⑷","e":"内部副費については，特定材料に跡付けることが困難な費用や，入庫後（購入原価算定後）に発生する費用が含まれているため，一部ないし全部の購入原価不算入が認められている。この場合，特定材料に跡付けることが困難な内部副費については，間接経費に属する項目とし，全ての製品で均等に負担することが想定されている。一方，入庫後に発生する内部副費については，出庫時点ではフルに発生済みであることから，材料費（出庫材料）に配賦することが想定されている。"},{"l":9,"m":"材料費計算","sb":"","r":"(Ｈ31Ⅱ①-ウ他複数)","q":"購入した材料に対して値引又は割戻等を受けたときには，これを材料の購入原価から控除する。ただし，値引又は割戻等が材料消費後に判明した場合には，これを同種材料の購入原価から控除し，値引又は割戻等を受けた材料が判明しない場合には，これを当期の材料副費等から控除し，又はその他適当な方法によって処理することができる。","a":true,"c":"「基準」11⑷","e":"値引又は割戻等は，材料の購入単価ないし取引金額のマイナス修正であるから，当該材料の購入原価から控除するのが原則であり，消費後に判明した場合には同種材料の購入原価から控除する。また，材料が判明しない場合には購入原価から控除することができないため，材料副費等から控除するなどの方法による。"},{"l":10,"m":"材料費計算","sb":"","r":"(Ｈ28Ⅰ①-イ)","q":"購入した材料に対して値引又は割戻等を受けたときには，これを材料の購入原価から控除する。ただし，値引又は割戻等が材料消費後に判明した場合には，これを同種材料の間接経費から控除し，値引又は割戻等を受けた材料が判明しない場合には，これを当期の材料副費等から控除し，又はその他適当な方法によって処理することができる。","a":false,"c":"「基準」11⑷","e":"値引又は割戻等は，材料の購入単価ないし取引金額のマイナス修正であるから，それらを受けた材料が判明している限りは，購入原価から控除することが求められる。正しくは「これを同種材料の購入原価から控除し…」である。"},{"l":11,"m":"材料費計算","sb":"","r":"(Ｈ27Ⅰ①-イ)","q":"購入した材料に対して値引又は割戻等を受けたときは，これを材料の購入原価から控除する。ただし，値引又は割戻等が材料消費後に判明した場合には，これを同種材料の購入原価から控除し，値引又は割戻等を受けた材料が判明しない場合には，これを当期の直接材料費から控除し，又はその他適当な方法によって処理することができる。","a":false,"c":"「基準」11⑷","e":"値引又は割戻等を受けた材料が判明しない場合には，各種材料について共通的に把握された付随費用から控除せざるをえない。正しくは「値引又は割戻等を受けた材料が判明しない場合には，これを当期の材料副費等から控除し…」である。"},{"l":12,"m":"材料費計算","sb":"","r":"(Ｒ５Ⅰ②-ア改)","q":"購入した材料に対して値引又は割戻等を受けたときには，これを材料の購入原価から控除する。ただし，値引又は割戻等が材料消費後に判明した場合には，これを同種材料の購入原価から控除し，値引又は割戻等を受けた材料が判明しない場合には，これを当期の売上原価から控除し，又はその他適当な方法によって処理することができる。","a":false,"c":"「基準」11⑷","e":"値引又は割戻等を受けた材料が判明しない場合には，各種材料について共通的に把握された付随費用から控除せざるをえない。正しくは「値引又は割戻等を受けた材料が判明しない場合には，これを当期の材料副費等から控除し…」である。"},{"l":13,"m":"材料費計算","sb":"","r":"(Ｈ28Ⅰ①-エ他複数)","q":"材料の購入原価は，必要ある場合には，予定価格等をもって計算することができる。他工場からの振替製品の受入価格は，必要ある場合には，正常市価によることができる。","a":true,"c":"「基準」11⑷","e":"材料の購入原価は，購買管理の観点から予定価格等をもって計算することが認められている。また，他工場からの振替製品は一種の材料と見ることができるが，その受入価格について，正常市価（長期平均的な市場価格）を使用することが認められている。これは，一種の市価基準の振替価格の適用である。"},{"l":14,"m":"材料費計算","sb":"","r":"(Ｒ６Ⅱ①-エ他複数)","q":"間接材料費であって，工場消耗品，消耗工具器具備品等，継続記録法又はたな卸計算法による出入記録を行なわないものの原価は，原則として当該原価計算期間における買入額をもって計算する。","a":true,"c":"「基準」11⑸","e":"金額的重要性が低く，出入記録を行わない材料（工場消耗品，消耗工具器具備品等）については，当該原価計算期間における買入額をもって消費額とみなす簡便的な計算が原則とされている。"},{"l":15,"m":"材料費計算","sb":"","r":"(Ｒ５Ⅰ②-エ改)","q":"間接材料費であって，工場消耗品，消耗工具器具備品等，継続記録法又はたな卸計算法による出入記録を行なわないものの原価は，これを一般費として処理する。","a":false,"c":"「基準」11⑸，17","e":"工場消耗品，消耗工具器具備品等の原価は，金額的に僅少であるため，当該原価計算期間における買入額をもって計算するのが原則である。なお，一般費（独立の補助部門費）として処理することが認められるのは，部門共通費であって工場全般に関して発生し，適当な配賦基準の得がたいものである。"},{"l":1,"m":"労務費計算","sb":"","r":"(Ｈ21②-オ)","q":"労務費は，直接賃金であっても間接賃金であっても，原則として実際の作業時間又は作業量に賃率を乗じて計算する。","a":false,"c":"「基準」12","e":"直接工の間接賃金以外の間接賃金（間接工賃金等）については総額が分かれば足りるため，原則として原価計算期間の負担に属する要支払額をもって計算する。"},{"l":2,"m":"労務費計算","sb":"","r":"(Ｈ30Ⅱ①-ウ)","q":"直接賃金等であって，作業時間又は作業量の測定を行う労務費は，実際の作業時間又は作業量に賃率を乗じて計算する。賃率は，実際の個別賃率又は工場全体について計算した総平均賃率による。平均賃率は，必要ある場合には，予定平均賃率をもって計算することができる。間接労務費は，原則として当該原価計算期間の負担に属する要支払額をもって計算する。","a":false,"c":"「基準」12","e":"製品原価の正確な計算の観点から，賃率については，出来る限り資源の消費状況を反映することが求められる。正しくは「賃率は，実際の個別賃率又は，職場もしくは作業区分ごとの平均賃率による」である。"},{"l":3,"m":"労務費計算","sb":"","r":"(Ｈ21②-カ)","q":"労務費計算において，直接賃金等は，必要ある場合には，当該原価計算期間の負担に属する要支払額をもって計算することができる。","a":true,"c":"「基準」12⑴","e":"単純総合原価計算を採用する場合など，製品原価の計算上，直接労務費と間接労務費を区別する意義が希薄なケースを想定し，直接賃金等(直接工賃金)についても，要支払額(総額)による簡便的な計算が認められている。"},{"l":4,"m":"労務費計算","sb":"","r":"(Ｒ５Ⅱ①-ア)","q":"「原価計算基準」によると，直接賃金等であって，作業時間又は作業量の測定を行なう労務費は，実際の作業時間又は作業量に賃率を乗じて計算する。直接工の直接作業時間は，作業時間報告書によって把握される。まず勤務時間から定時休憩時間，職場離脱時間を差し引いて就業時間を計算する。その就業時間から手待時間を差し引いた実働時間が段取時間と直接作業時間から構成されることになる。","a":false,"c":"「基準」12","e":"就業時間から手待時間を差し引いた実働時間は，間接作業時間と直接作業時間から構成される。なお，段取時間は，加工時間とともに直接作業時間に含めるのが伝統的な解釈である。"},{"l":1,"m":"経費計算","sb":"","r":"(Ｈ21②-キ)","q":"経費は，原則として，当該原価計算期間の実際支払額をもって計算する。","a":false,"c":"「基準」13⑴","e":"経費は，原則として，当該原価計算期間の実際の発生額をもって計算する。支払経費であっても，原価計算上考慮するのは実際支払額ではなく，原価計算期間の負担に属する要支払額（＝実際発生額）である。"},{"l":2,"m":"経費計算","sb":"","r":"(Ｈ30Ⅱ①-エ)","q":"経費は，原則として当該原価計算期間の実際の発生額をもって計算する。ただし，必要ある場合には，予定価格又は予定額をもって計算することができる。数か月分を一時に総括的に計算し又は支払う経費については，これを月割り計算する。消費量を計量できる経費については，その実際消費量に基づいて計算する。","a":true,"c":"「基準」13","e":"製品原価の計算の迅速化やその比較可能性を確保するという観点からの要請は，経費計算においても，材料費計算や労務費計算の場合と同様に存在する。したがって，予定価格又は予定額による計算も認められる。"}]},{"n":3,"name":"部門別計算","qs":[{"l":1,"m":"原価部門の設定","sb":"","r":"(Ｈ19①-イ)","q":"部門別計算を行う目的としては，正確な製品原価を計算する目的のほかに原価管理目的をあげることができる。","a":true,"c":"「基準」16","e":"部門別計算の目的は，①機能別，責任区分別の原価管理と②製品原価の正確な計算の２つである。なお，原価部門は機能別に設定され，責任会計上はそれが責任"},{"l":2,"m":"原価部門の設定","sb":"","r":"(Ｒ６Ⅱ③-ア改)","q":"製造間接費を部門別に計算する主目的は，有効な原価管理を行うことおよび正確な製品原価の計算をすることである。これらの目的のために，原価部門を製造部門と補助部門に分ける。","a":true,"c":"「基準」16","e":"部門別計算の目的は，①機能別，責任区分別の原価管理と②製品原価の正確な計算の２つである。なお，原価部門は機能別に設定され，責任会計上はそれが責任\n区分となる。また，有効な原価管理のためには現場管理者や現場作業員の動機づけが重要であり，動機づけのためには責任会計との結合が必須となる。"},{"l":3,"m":"原価部門の設定","sb":"","r":"(Ｈ22Ⅰ①-ア)","q":"原価部門は，製品原価の計算を正確にするために原価要素を分類集計する計算組織上の区分であるにすぎず，責任区分とは無関係である。","a":false,"c":"「基準」16","e":"原価部門は，製品原価の計算を正確にすることのみを目的として設定されるのではない。原価管理というもう１つの目的からすれば，工場の組織図にしたがって，責任区分別に原価部門を設定すべきである。"},{"l":4,"m":"原価部門の設定","sb":"","r":"(Ｈ24Ⅱ①-ウ)","q":"原価部門とは，原価の発生を形態別，責任区分別に管理するとともに，製品原価の計算を正確にするために，原価要素を分類集計する計算組織上の区分をいい，これを諸製造部門と諸補助部門とに分ける。","a":false,"c":"「基準」16","e":"部門別計算では，費目別計算が財務会計から入手した形態別分類による基礎資料を目的・用途別に再分類し，それらを各原価部門に集計することで，効果的な原価管理を可能にする。正しくは「原価の発生を機能別，責任区分別に管理するとともに…」である。"},{"l":5,"m":"原価部門の設定","sb":"","r":"(Ｈ22Ⅰ①-イ)","q":"原価部門には，製造部門と補助部門があるが，製造部門とは，直接製造作業の行われる部門をいい，製品の種類別，製品生成の段階，製造活動の種類別等にしたがって，これを各種の部門または工程に分ける。","a":true,"c":"「基準」16⑴","e":"製造部門の例としては，機械製作工場における鋳造，鍛造，機械加工，組立等の各部門があげられる。"},{"l":6,"m":"原価部門の設定","sb":"","r":"(Ｈ22Ⅰ①-ウ)","q":"補助部門とは，製造部門に対して補助的関係にある部門をいい，これを補助経営部門と工場管理部門に分ける。副産物の加工，包装品の製造等を行ういわゆる副経営も，補助経営部門の一種である。","a":false,"c":"「基準」16⑴","e":"製造部門と補助部門の区別は，直接製造作業を行うか否かという点にある。副産物の加工，包装品の製造等といえども，直接製造作業を行うのであるから，副経営は製造部門に分類される。"},{"l":7,"m":"原価部門の設定","sb":"","r":"(Ｈ26Ⅰ①-ア他複数)","q":"補助部門とは，製造部門に対して補助的関係にある部門をいい，これを補助経営部門と工場管理部門とに分ける。工具製作，修繕，動力等の補助経営部門が相当の規模となった場合には，これを独立の経営単位とし，計算上製造部門として取り扱う。","a":true,"c":"「基準」16⑵","e":"補助部門は，自己の製品又は用役を製造部門に提供する補助経営部門と管理的機能を行う工場管理部門とに分類され，前者が相当の規模となった場合には，計算上製造部門として取り扱う。"},{"l":8,"m":"原価部門の設定","sb":"","r":"(Ｈ19①-ウ)","q":"工場内の原価計算担当者の給料は，｢原価計算基準｣でいう補助経営部門の部門費である。","a":false,"c":"「基準」16⑵，17","e":"工場内の原価計算担当者の給料は，「原価計算基準」でいう工場管理部門の部門費ないし各部門の部門共通費である。"},{"l":9,"m":"原価部門の設定","sb":"","r":"(Ｈ29Ⅱ③-ウ)","q":"部門別計算に用いられる原価部門は，製造部門と補助部門に大別される。製造部門は，製品の加工に直接的に従事する部門であるのに対して，補助部門とは，作り出した用役を，製造部門あるいは他の補助部門の活動を補助するために提供する部門であって，補助経営部門と工場管理部門に区分することができる。原価部門の設定は，業務活動の同種性や職制上の権限と責任を考慮して行われる。計算の経済性を満たすためには，原価部門の数はより多いほうが望ましい。","a":false,"c":"","e":"原価計算が合理的な経済活動のための計算システムである以上，正確な製品原価の計算や原価管理といた目的は，必要なレベルで達成できればよい。つまり，原価部門を過度に細分化して設定することが，必ずしも良いシステムとはいえないのであって，原価部門の数が多ければ多いほどよいというわけではない。"},{"l":1,"m":"部門個別費と部門共通費","sb":"","r":"(Ｈ26Ⅰ①-ウ他複数)","q":"原価要素は，これを原価部門に分類集計するに当たり，当該部門において発生したことが直接的に認識されるかどうかによって，部門個別費と部門共通費とに分類されるが，部門共通費であって工場全体に関して発生し，適当な配賦基準の得がたいものは，これを一般費とし，補助部門費として処理することができる。","a":true,"c":"「基準」17","e":"工場全般に関して発生し，適当な配賦基準を見出すことが困難な部門共通費については，恣意的な配賦計算を回避するべく，一般費という抽象的な補助部門費として処理することが認められている。"},{"l":2,"m":"部門個別費と部門共通費","sb":"","r":"(Ｈ24Ⅱ①-オ)","q":"部門共通費であって工場全般に関して発生し，適当な配賦基準の得がたいものは，これを複合費とし，補助部門費として処理することができる。","a":false,"c":"「基準」10，17","e":"正しくは「部門共通費であって工場全般に関して発生し，適当な配賦基準の得がたいものは，これを一般費とし，補助部門費として処理することができる」である。なお，複合費とは，形態別分類では異なる原価要素を，機能別分類によって独立の費目として集計したものをいい，補助部門費計算で得られる機能別原価を概算で把握したものである。"},{"l":1,"m":"部門別計算の手続","sb":"","r":"(Ｈ27Ⅰ①-ウ他複数)","q":"部門別計算では，まず，原価要素の全部又は一部を各製造部門および補助部門に賦課又は配賦する。この場合，部門に集計する原価要素の範囲は，製品原価の正確な計算および原価管理の必要によってこれを定める。たとえば，個別原価計算においては，製造間接費のほか，直接労務費をも製造部門に集計することがあり，総合原価計算においては，すべての製造原価要素又は加工費を製造部門に集計することがある。","a":true,"c":"「基準」18⑴","e":"製造部門(工程)に集計する原価要素の範囲は，①製品原価の正確な計算と②原価管理という部門別計算の２つの目的に応じて弾力的に決定される。ここで重要なことは，計算目的が複数存在する以上，集計すべき原価要素の範囲は固定的でないということである。"},{"l":2,"m":"部門別計算の手続","sb":"","r":"(Ｈ22Ⅰ①-オ)","q":"部門に集計する原価要素の範囲は，個別原価計算においては製造間接費とし，総合原価計算においてはすべての製造原価要素とする。","a":false,"c":"「基準」18⑴","e":"原価管理の観点から，個別原価計算においては，製造間接費だけでなく直接労務費をも製造部門に集計することがある。また，総合原価計算においては，加工費のみを製造部門(工程)に集計することがある。"},{"l":3,"m":"部門別計算の手続","sb":"","r":"(Ｈ18③-オ)","q":"個別原価計算において，直接労務費を部門別に把握するのは，製品原価の正確な計算や原価管理の必要性があるためである。","a":false,"c":"「基準」18⑴，32","e":"個別原価計算において，直接労務費は各指図書に賦課できるため，これを部門別に把握するのは，原価管理のためであって，製品原価の正確な計算のためではない。"},{"l":4,"m":"部門別計算の手続","sb":"","r":"(Ｒ６Ⅱ③-イ)","q":"部門費の第１次集計では，部門個別費は原価部門における発生額を直接当該部門に賦課し，部門共通費は適切な配賦基準によって関係各部門に配賦する。部門費の第２次集計とは，補助部門費の製造部門への配賦を意味する。その場合に，補助部門費の配賦方法として，直接配賦法，階梯式配賦法，相互配賦法等がある。一部の補助部門費は，必要ある場合には，これを製造部門に配賦しないで製造指図書に賦課することができる。","a":false,"c":"「基準」17，18⑵","e":"補助部門費の中には，特定の部門に跡付けることが困難な費用(一般費)や，製品に対して直接サービスを提供していると考えられる部門の費用(設計部費など)が含まれる。この点を踏まえて，一部の補助部門費については，これを製造部門に配賦しないで，直接製品(製造指図書)に配賦することが認められている。"},{"l":5,"m":"部門別計算の手続","sb":"","r":"(Ｈ18⑤-オ)","q":"わが国の「原価計算基準」では，製造間接費を部門別計算する場合には，すべての製造間接費は必ず製造部門を経由して，製品に配賦されることになっている。","a":false,"c":"「基準」18⑵","e":"一部の補助部門費は，必要ある場合には，これを製造部門に配賦しないで直接に製品に配賦することが認められている。したがって，全ての製造間接費が必ずしも製造部門経由で製品に配賦されるとは限らない。"},{"l":6,"m":"部門別計算の手続","sb":"","r":"(Ｈ24Ⅱ①-カ)","q":"製造部門に集計された原価要素は，必要に応じさらにこれをその部門における小工程又は作業単位に集計する。この場合，小工程又は作業単位には，その小工程等において管理可能の原価要素又は直接労務費のみを集計し，そうでないものは共通費および他部門配賦費とする。","a":true,"c":"「基準」18⑶","e":"なお，ここでの共通費には部門個別費中の管理不能費と部門共通費配賦額が，他部門配賦費には補助部門費配賦額中の管理不能費がそれぞれ該当する。"},{"l":7,"m":"部門別計算の手続","sb":"","r":"(Ｈ27Ⅱ①-ア)","q":"製造部門に集計された原価要素は，必要に応じさらにこれをその部門における小工程又は作業単位に集計する。この場合，小工程又は作業単位には，その小工程等において管理不能な原価要素又は直接労務費を集計し，そうでないものは共通費および他部門配賦費とする。","a":false,"c":"「基準」18⑶","e":"製造部門に集計された原価要素をさらに小工程等に集計するのは，責任会計の見地においてである。したがって，原価要素の集計に際しては管理可能性原則に準拠する必要があり，正しくは「その小工程等において管理可能の原価要素又は直接労務費のみを集計し…」である。"},{"l":1,"m":"補助部門費の配賦方法","sb":"","r":"(Ｒ５Ⅱ③-ウ)","q":"階梯式配賦法において補助部門の順位を決めるとき，我が国で一般に説明されている順位決定ルールでは，まず，より多くの他部門にサービスを提供している部門を上位とする。サービス提供先が同数の場合には，相互の配賦額を比較して多い方を上位とする，あるいは第一次集計額が多い方を上位とする，のいずれかの方法によって決定する。","a":true,"c":"","e":"階梯式配賦法における配賦順位の決定ルールは，一般に次の通りである。①他の補助部門に対するサービス提供先部門数が多い部門を先順位とする。②①が同数の場合は次のいずれかによる。⒜部門費(第１次集計費)の多い部門を先順位とする。⒝相互の配賦額を比較して，配賦額の多いサービスの提供部門を先順位とする。"},{"l":2,"m":"補助部門費の配賦方法","sb":"","r":"(Ｒ２Ⅱ③-エ)","q":"補助部門費を関係部門に配賦するに当たり，「原価計算基準」は，複数の配賦法を認めている。その中でも，階梯式配賦法は，補助部門間のすべての用役授受を促え，適切に各部門に配賦できるという点で他の配賦法よりも優れている。","a":false,"c":"「基準」18⑵","e":"「原価計算基準」において，補助部門費は，直接配賦法，階梯式配賦法，相互配賦法等にしたがい，適当な配賦基準によって，これを各製造部門に配賦することになっている。その中でも，補助部門間のすべての用役授受を捉え，適切に各部門に配賦できるという点で他の配賦法よりも優れているのは，階梯式配賦法ではなく相互配賦法である。"},{"l":3,"m":"補助部門費の配賦方法","sb":"","r":"(Ｈ18⑤-イ)","q":"現代のようにコンピューターなどの計算技術が発達している時代では，計算の手間を考える必要は小さく，たとえ補助部門間の用役の授受について合理的に測定できないとしても，補助部門費の配賦については相互配賦法を使用すべきである。","a":false,"c":"","e":"計算に手間がかからないことと計算に必要なデータを容易に入手できることとは別問題であり，補助部門間の用役授受の事実を経済合理的に測定できないのであれば，直接配賦法を使用すべきである。"},{"l":4,"m":"補助部門費の配賦方法","sb":"","r":"(Ｈ18⑤-ウ)","q":"補助部門は製造部門に用役を提供するために存在するから，その設備能力は製造部門の実際的生産能力あるいはそれに近似する操業度における用役予想使用量に基づいて決定される。したがって，設備能力によって決まる固定費はこうした用役提供能力によって製造部門に配賦されるべきである。","a":true,"c":"","e":"いずれも複数基準配賦法の論理を示した文章である。用役の提供又は供給，消費又は使用という表現が混在しているが，これらは表裏一体の関係にあるため，それほどデリケートになる必要性はない。補助部門から見れば用役の提供(供給)，"},{"l":5,"m":"補助部門費の配賦方法","sb":"","r":"(Ｈ29Ⅱ③-エ)","q":"補助部門の固定費は，関連部門に対して用役を提供するための供給能力の維持費であり，その発生額の大きさは，補助部門の用役供給能力の規模に依存する。したがって，補助部門における固定費は，補助部門が関係部門へ実際にどれだけの用役を供給したかとは無関係に発生する。これに対して，補助部門で発生する変動費は，補助部門が用役を関連部門へ供給すれば供給するほど発生する。複数基準配賦法では，補助部門費を固定費と変動費に分け，固定費は関係部門がその補助部門の用役を消費する能力の割合に基づき，変動費は関係部門がその補助部門の用役を実際に消費した割合に基づいて関係部門へ配賦する。","a":true,"c":"","e":"いずれも複数基準配賦法の論理を示した文章である。用役の提供又は供給，消費又は使用という表現が混在しているが，これらは表裏一体の関係にあるため，それほどデリケートになる必要性はない。補助部門から見れば用役の提供(供給)，\n製造部門から見れば用役の消費(使用)である。ただし，補助部門固定費は当該部門の用役提供能力を維持するために発生し，その発生額の大きさは用役提供能力の規模に依存する，さらに用役提供能力の規模は，関係部門の用役消費能力によって規定される，という因果関係は理解しておきたい。"}]},{"n":4,"name":"総合原価計算","qs":[{"l":1,"m":"原価の製品別計算および原価単位","sb":"","r":"(Ｒ５Ⅱ⑥-ア)","q":"原価の製品別計算とは，単位製品の製造原価を算定する手続をいい，原価計算における第三次の計算段階である。製品別計算のためには，加工費を集計する一定の製品単位すなわち原価単位を定める。原価単位は，これを個数，時間数，度量衡単位等をもって示し，業種の特性に応じて適当に定める。","a":false,"c":"「基準」19","e":"原価単位とは，発生した原価を関係付ける給付の量的な単位であり，原価計算単位ともいう。正しくは「原価を集計する一定の製品単位」であり，集計対象が加工費に限定されるわけではない。"},{"l":1,"m":"製品別計算の形態","sb":"","r":"(Ｒ６Ⅱ⑤-ウ他複数)","q":"製品別計算は，経営における生産形態の種類別に対応して，単純総合原価計算，等級別総合原価計算，組別総合原価計算，そして個別原価計算に区分される。","a":true,"c":"「基準」20","e":"「原価計算基準」では，単純総合原価計算と個別原価計算を製品別計算の形態の両極に置き，両者の中間形態として，等級別，組別の総合原価計算を並列させている。"},{"l":2,"m":"製品別計算の形態","sb":"","r":"(Ｒ５Ⅱ⑥-イ他複数)","q":"製品別計算は，経営における生産形態の種類別に対応して，単純総合原価計算，等級別総合原価計算，組別総合原価計算，個別原価計算の類型に区分される。いずれも原価集計の単位が期間生産量であることを特質とする。","a":false,"c":"「基準」20，24，31","e":"総合原価計算は原価集計の単位が期間生産量であることを特質とするが，個別原価計算では特定指図書の生産命令数量を原価集計単位とする。"},{"l":3,"m":"製品別計算の形態","sb":"","r":"(Ｈ31Ⅰ③-イ)","q":"個別原価計算は，注文によって異なる製品やサービスを個別に生産する受注生産形態，総合原価計算は同一あるいは同種製品を大量かつ反復的に生産する見込生産形態において採用される。企業は自社の事業特性や生産形態に応じて，両方を採用することができる。","a":true,"c":"「基準」20","e":"なお，ここでの「両方」とは，個別原価計算と総合原価計算のいずれかを採用することを必ずしも意味するわけではなく，現実には，むしろ両者の中間形態や混合形態(ハイブリッド・コスティング)が採用されるのが通常である。"},{"l":1,"m":"単純総合原価計算","sb":"","r":"(Ｒ４Ⅰ⑤-エ他複数)","q":"単純総合原価計算は，同種製品を反復連続的に生産する生産形態に適用する。単純総合原価計算にあっては，一原価計算期間に発生したすべての原価要素を集計して当期製造費用を求め，これに期首仕掛品原価を加え，この合計額を，完成品と期末仕掛品とに分割計算することにより，完成品総合原価を計算し，これを製品単位に均分して単位原価を計算する。","a":true,"c":"「基準」21","e":"単純総合原価計算は最も簡便的な製品別計算の形態であり，一種類ないし一種類とみなした製品の期間生産量に同期間の総製造費用を分割負担させることで，当該製品の平均単価を計算する。"},{"l":2,"m":"単純総合原価計算","sb":"","r":"(Ｈ18①-キ)","q":"単純総合原価計算では，期首仕掛品原価に当期製造費用を加算した合計額を完成品と期末仕掛品とに分割計算することにより，完成品総合原価を計算し，これを製品単位に均分して単位原価を計算する。このため，期首仕掛品原価と期末仕掛品原価が異なっていても，原理的には，当期製造費用と完成品総合原価は同じとなる。","a":false,"c":"「基準」21，24","e":"総合原価計算の基本公式は「期首仕掛品原価＋当期製造費用＝完成品総合原価＋期末仕掛品原価」であるから，期首仕掛品原価と期末仕掛品原価が異なっていれば，当期製造費用と完成品総合原価も当然に異なる。"},{"l":1,"m":"等級別総合原価計算","sb":"","r":"(Ｒ６Ⅰ⑥-ア)","q":"単純総合原価計算は，同種製品を反復連続的に生産する生産形態に適用するのに対し，等級別総合原価計算は，同一工程において，異種製品を連続生産する中で，その製品を形状，大きさ，品位等によって等級に区別する場合に適用する。","a":false,"c":"「基準」21，22","e":"等級別総合原価計算の趣旨は，複数製品を扱う場合に，より厳密な組別総合原価計算を実施しうるところ，それらが概ね同種製品とみなされることから，等価係数を用いて簡便的な原価計算を実施して経済性を図るという点にある。正しくは「同一工程において，同種製品を連続生産する中で…」である。"},{"l":2,"m":"等級別総合原価計算","sb":"","r":"(Ｈ30Ⅰ⑤-エ他複数)","q":"等級別総合原価計算は，同一工程において，同種製品を連続生産するが，その製品を形状，大きさ，品位等によって等級に区別する場合に適用する。等級別総合原価計算にあっては，各等級製品について適当な等価係数を定め，一期間における完成品の総合原価又は一期間の製造費用を等価係数に基づき各等級製品にあん分してその製品原価を計算する。","a":true,"c":"「基準」22","e":"等級別総合原価計算は，単純総合原価計算と組別総合原価計算の間に位置する方法であり，完成品総合原価を結合原価と捉える方法（単純総合原価計算に近い方法）と，当期製造費用を結合原価と捉える方法（組別総合原価計算に近い方法）の選択が認められている。"},{"l":3,"m":"等級別総合原価計算","sb":"","r":"(Ｒ５Ⅰ⑤-エ)","q":"等級別総合原価計算においては，各等級製品について適当な等価係数を定め，原則として，一期間における完成品の総合原価を等価係数に基づき各等級製品にあん分してその製品原価を計算する。","a":false,"c":"「基準」22","e":"正しくは「一期間における完成品の総合原価又は一期間の製造費用を…」である。"},{"l":4,"m":"等級別総合原価計算","sb":"","r":"(Ｈ25Ⅱ⑤-ア)","q":"わが国の「原価計算基準」によると，等級別総合原価計算では，各等級製品について適当な等価係数を定め，一期間における完成品の総合原価ではなく，一期間の製造費用を等価係数に基づき各等級製品にあん分してその製品原価を計算する。","a":false,"c":"「基準」22","e":"正しくは「一期間における完成品の総合原価又は一期間の製造費用を…」である。"},{"l":5,"m":"等級別総合原価計算","sb":"","r":"(Ｈ27Ⅰ⑥-ア)","q":"等級製品の原価計算に採用される等価係数は，価値移転的原価計算からの観点から，製造原価発生と関係のある何らかの基準によるものと，市価の高い製品にはそれだけ多くの製造原価を負担させるという負担能力主義に基づく正常市価基準によるものが認められる。","a":false,"c":"「基準」22","e":"等級別総合原価計算はあくまでも組別総合原価計算の簡便法という位置付けであり，等級製品に適用する等価係数は，価値移転的原価計算の範疇に属するものでなければならない。したがって，アウトプット基準の等価係数を使用する場合で"},{"l":6,"m":"等級別総合原価計算","sb":"","r":"(Ｈ31Ⅱ⑤-イ)","q":"等級別総合原価計算において，一定の要件の下で，等級品の正常市価を基準として定めた等価係数に基づき，一期間の総合原価を各等級品にあん分して計算することができる。","a":false,"c":"「基準」22","e":"等級別総合原価計算はあくまでも組別総合原価計算の簡便法という位置付けであり，等級製品に適用する等価係数は，価値移転的原価計算の範疇に属するものでなければならない。したがって，アウトプット基準の等価係数を使用する場合で\nあっても，それは各等級製品の重量，長さ等原価の発生と関連ある製品の諸性質に基づいて算定する必要があり，正常市価(販売価格)という価値回収的な等価係数の適用は認められない。"},{"l":7,"m":"等級別総合原価計算","sb":"","r":"(Ｒ６Ⅰ⑥-イ)","q":"等価係数は，各等級製品の販売価格，重量，長さ，面積，純分度，熱量，硬度等原価の発生と関連ある製品の諸性質に基づいて算定する。","a":false,"c":"「基準」22","e":"等級別総合原価計算はあくまでも組別総合原価計算の簡便法という位置付けであり，等級製品に適用する等価係数は，価値移転的原価計算の範疇に属するものでなければならない。したがって，アウトプット基準の等価係数を使用する場合で"},{"l":8,"m":"等級別総合原価計算","sb":"","r":"(Ｒ６Ⅰ⑥-ウ)","q":"原価要素別又は原価要素群別に定めた等価係数を個別的に適用しないで，各原価要素又は原価要素群の重要性を加味して総括し，この総括的等価係数に基づいて，一期間の完成品の総合原価を一括的に各等級製品にあん分して，その製品原価を計算することができる。","a":true,"c":"「基準」22","e":"等価係数の算定基準には，製品の諸性質に基づくアウトプット基準と投入要素に基づくインプット基準があり，前者を使用する場合には完成品総合原価を結合原価と捉える方法（単純総合原価計算に近い方法）を，後者を使用する場合には当期製造費用を結合原価と捉える方法（組別総合原価計算に近い方法）を採用することになる。この点，原価とは利用資源の価値であるから，価値移転的原価計算の観点からすれば，等価係数はインプット基準で算定するのが望ましい。そこで，インプット基準の等価係数を使用する場合に，原価要素(群)別に算定したそれらを総括し，単純総合原価計算に近い方法を実施することが認められている（いわゆる総合原価按分法）。なお，本肢では，上記波線部の前提が明示されていない。原価要素(群)別の等価係数＝インプット基準の等価係数と解しうるが，やや不完全な文章といえる。"},{"l":1,"m":"組別総合原価計算","sb":"","r":"(Ｒ５Ⅱ⑥-ウエ他複数)","q":"組別総合原価計算では，一期間の製造費用を組直接費と組間接費又は原料費と加工費とに分け，個別原価計算に準じ，組直接費又は原料費は，各組の製品に賦課し，組間接費又は加工費は，適当な配賦基準により各組に配賦する。次いで一期間における組別の製造費用と期首仕掛品原価とを，当期における組別の完成品とその期末仕掛品とに分割することにより，当期における組別の完成品総合原価を計算し，これを製品単位に均分して単位原価を計算する。","a":true,"c":"「基準」23","e":"組別総合原価計算は，原価計算対象が複数であるという点で個別原価計算に最も近い総合原価計算の形態であり，個別原価計算に類似の原価集計構造を持つ。すなわち，個別原価計算に準じて組直接費と組間接費(原料費と加工費)の集計を行った後，各組製品について各々単純総合原価計算を実施する。"},{"l":2,"m":"組別総合原価計算","sb":"","r":"(Ｈ24Ⅱ⑥-エ)","q":"組別総合原価計算は，同種製品を組別に連続生産する生産形態に適用する。","a":false,"c":"「基準」23","e":"組別総合原価計算は同種製品に対して適用することも可能であるが，「原価計算基準」では，より一般的なケースを想定している。正しくは「異種製品を組別に連続生産する生産形態に適用する」である。"},{"l":3,"m":"組別総合原価計算","sb":"","r":"(Ｒ４Ⅰ⑤-ア)","q":"組別総合原価計算では，一期間の製造費用を組直接費と組間接費又は原料費と加工費とに分け，個別原価計算とは異なり，組直接費又は原料費は，各組の製品に賦課し，組間接費又は加工費は，適当な配賦基準により各組に配賦する。","a":false,"c":"「基準」23","e":"正しくは「個別原価計算に準じ，組直接費又は原料費は，各組の製品に賦課し，組間接費又は加工費は，適当な配賦基準により各組に配賦する」である。"},{"l":4,"m":"組別総合原価計算","sb":"","r":"(Ｈ29Ⅰ⑥-ウ)","q":"組別総合原価計算では，一期間の製造費用を組直接費と組間接費又は原料費と加工費とに分け，等級別総合原価計算に準じ，組直接費又は原料費は，各組の製品に賦課し，組間接費又は加工費は，適当な配賦基準により各組に配賦する。次いで一期間における組別の製造費用と期首仕掛品原価とを，当期における組別の完成品とその期末仕掛品とに分割することにより，当期における組別の完成品総合原価を計算し，これを製品単位に均分して単位原価を計算する。","a":false,"c":"「基準」23","e":"正しくは「個別原価計算に準じ，組直接費又は原料費は，各組の製品に賦課し，組間接費又は加工費は，適当な配賦基準により各組に配賦する」である。"},{"l":1,"m":"総合原価計算における完成品総合原価と期末仕掛品原価","sb":"","r":"(Ｈ24Ⅱ⑥-ア)","q":"単純総合原価計算，等級別総合原価計算および組別総合原価計算は，いずれも原価集計の単位が期間生産量であることを特質とする。","a":true,"c":"「基準」24","e":"総合原価計算においては，同じ種類の製品である限り，原価計算上製造指図書を区別することはしない。つまり，その特徴は，一原価計算期間の生産量を原価集計単位とする点にある。"},{"l":2,"m":"総合原価計算における完成品総合原価と期末仕掛品原価","sb":"","r":"(Ｒ４Ⅰ⑤-イ他複数)","q":"単純総合原価計算，等級別総合原価計算および組別総合原価計算は，いずれも原価集計の単位が期間投入量であることを特質とする。すなわち，いずれも継続製造指図書に基づき，一期間における投入量について総製造費用を算定し，これを期間投入量に集計することによって完成品総合原価を計算する点において共通する。","a":false,"c":"「基準」24","e":"正しくは「単純総合原価計算，等級別総合原価計算および組別総合原価計算は，いずれも原価集計の単位が期間生産量であることを特質とする。すなわち，いずれも継続製造指図書に基づき，一期間における生産量について総製造費用を算定し，これを期間生産量に分割負担させることによって完成品総合原価を計算する点において共通する」である。"},{"l":3,"m":"総合原価計算における完成品総合原価と期末仕掛品原価","sb":"","r":"(Ｒ６Ⅱ⑤-エ)","q":"個別原価計算は製造指図書を原価集計の単位としているのに対して，総合原価計算は期間生産量を原価集計の単位としているため，総合原価計算の場合には製造指図書は発行されない。","a":false,"c":"「基準」24","e":"総合原価計算の特徴は，期間生産量を原価集計単位とする点にあるが，それは，同じ種類で同じ期間に生産された製品である限りは，製造指図書を区別しないことを意味する。逆に言えば，総合原価計算においても製造指図書（継続製造指図書）は発行されるのであって，それが個別原価計算のように原価集計単位として機能するわけではないというに過ぎない。"},{"l":4,"m":"総合原価計算における完成品総合原価と期末仕掛品原価","sb":"","r":"(Ｈ22Ⅱ⑨-イ)","q":"純粋先入先出法により完成品の単位原価を算定すると，当月作業と前月作業による原価を識別することができるので，修正先入先出法に比べて価格決定目的に有効な資料を得ることができる。","a":false,"c":"","e":"純粋先入先出法により完成品の単位原価を算定すると，当月作業と前月作業による原価を識別することができるので，完成品について単一の平均原価のみを算定する修正先入先出法に比べて，原価管理目的に有効な資料を得ることができる。"},{"l":5,"m":"総合原価計算における完成品総合原価と期末仕掛品原価","sb":"","r":"(Ｈ31Ⅰ⑤-ウ)","q":"総合原価計算において，期首仕掛品がない場合には，平均法，先入先出法，後入先出法による期末仕掛品原価は同一となる。","a":true,"c":"「基準」24⑵-1～3","e":"総合原価計算において，期首仕掛品がない場合には，平均法，先入先出法，後入先出法の区別がなくなるため，期末仕掛品原価は同一となる。なお，原価配分の仮定が不要となる以上「平均法，先入先出法，後入先出法による期末仕掛品原価は…」という記述は不正確といえるが，他の肢との兼ね合いで，相対的に〇肢と判断せざるをえなかった。"},{"l":6,"m":"総合原価計算における完成品総合原価と期末仕掛品原価","sb":"","r":"(Ｒ４Ⅱ⑤-ウ)","q":"加工費について期末仕掛品の完成品換算量を計算することが困難な場合には，当期の加工費総額は，すべてこれを完成品に負担させ，期末仕掛品は，直接材料費のみをもって計算することができる。","a":true,"c":"「基準」24⑵-4","e":"直接材料費と異なり，加工費については実体がないため，原価投入の程度である進捗度の見積りが相対的に難しい。そこで，加工費について期末仕掛品の完成品換算量(加工換算量)を計算することが困難な場合には，加工費の全額を完成品に負担させ，直接材料費のみを完成品と期末仕掛品に配分することが認められている。"},{"l":7,"m":"総合原価計算における完成品総合原価と期末仕掛品原価","sb":"","r":"(Ｈ28Ⅱ⑥-ア他複数)","q":"総合原価計算では，当期製造費用および期首仕掛品原価を，先入先出法などの方法により，完成品と期末仕掛品とに分割して，完成品総合原価を計算する。なお，加工費について期末仕掛品の完成品換算量を計算することが困難な場合であっても，当期の加工費総額は，すべてこれを完成品に負担させることができない。","a":false,"c":"「基準」24⑵-4","e":"加工費について期末仕掛品の完成品換算量を計算することが困難な場合には，いわゆる直接材料費法の採用が認められている。"},{"l":8,"m":"総合原価計算における完成品総合原価と期末仕掛品原価","sb":"","r":"(Ｈ31Ⅱ⑤-ア)","q":"等級別総合原価計算において，加工費を全て各等級の完成品に負担させ，各等級の期末仕掛品は直接材料費のみをもって計算することがありうる。","a":true,"c":"「基準」24⑵-4","e":"等級別総合原価計算は，総合原価計算の一形態であるから，いわゆる直接材料費法の適用が認められる。"},{"l":9,"m":"総合原価計算における完成品総合原価と期末仕掛品原価","sb":"","r":"(Ｒ２Ⅰ⑤-エ)","q":"総合原価計算において，期末仕掛品の評価に，「将来における財貨の予定消費量と予定価格とをもって計算した原価」又は「経営における異常な状態を排除し，経営活動に関する比較的長期にわたる過去の実際数値を統計的に平準化し，これに将来のすう勢を加味した正常な能率および操業度並びに価格に基づいて決定した原価」を用いることができる。","a":true,"c":"「基準」４⑴-2，24⑵-5","e":"総合原価計算において，必要ある場合には，期末仕掛品を予定原価又は正常原価で評価することが認められている。予定原価と正常原価を詳細に定義しているだけの文章である。"},{"l":10,"m":"総合原価計算における完成品総合原価と期末仕掛品原価","sb":"","r":"(Ｈ28Ⅰ⑥-エ)","q":"わが国の「原価計算基準」によると，総合原価計算において，期末仕掛品の数量が毎期ほぼ等しい場合には，総合原価の計算上これを無視し，当期製造費用をもってそのまま完成品総合原価とすることができる。","a":true,"c":"「基準」24⑵-6","e":"総合原価計算において，期末仕掛品の数量が毎期ほぼ等しい場合には，「数量が等しければ原価も等しい」という仮定のもとに，当期製造費用をもってそのまま完成品総合原価とする（期首仕掛品原価をそのまま期末仕掛品原価とする）ことが認められている。"},{"l":11,"m":"総合原価計算における完成品総合原価と期末仕掛品原価","sb":"","r":"(Ｒ４Ⅱ⑤-イ他複数)","q":"期末仕掛品の数量が毎期ほぼ等しい場合であっても，総合原価の計算上これを無視し，当期製造費用をもってそのまま完成品総合原価とすることはできない。","a":false,"c":"「基準」24⑵-6","e":"期末仕掛品の数量が毎期ほぼ等しい場合には，いわゆる無評価法の採用が認められている。"},{"l":12,"m":"総合原価計算における完成品総合原価と期末仕掛品原価","sb":"","r":"(Ｈ31Ⅰ⑤-イ)","q":"工程別総合原価計算において，各工程の製造費用をもってそのまま各工程の完成品総合原価とすることがありうる。","a":true,"c":"「基準」24⑵-6","e":"工程別総合原価計算において，各工程の期末仕掛品の数量が毎期ほぼ等しい場合には，総合原価の計算上これを無視し，当期製造費用をもってそのまま完成品総合原価とすることが認められる。"},{"l":13,"m":"総合原価計算における完成品総合原価と期末仕掛品原価","sb":"","r":"(Ｈ31Ⅱ⑤-エ)","q":"組別総合原価計算において，特定製品の期末仕掛品を予定原価又は正常原価で評価することができるのは，当該製品の期末仕掛品の数量が毎期ほぼ等しい場合である。","a":false,"c":"「基準」24⑵-5・6","e":"期末仕掛品の数量が毎期ほぼ等しい場合には，総合原価の計算上これを無視し，当期製造費用をもってそのまま完成品総合原価とすることができるのであって，期末仕掛品を予定原価又は正常原価で評価することができるのではない。なお，期末仕掛品は，必要ある場合には予定原価又は正常原価をもって評価することができる。"},{"l":1,"m":"工程別総合原価計算","sb":"","r":"(Ｒ６Ⅱ⑤-ア)","q":"単一製品のみを連続生産する工場においては，すべての製造費用は当該単一製品の製造に関連していることが明らかであるため，部門別計算は必要とされない。","a":false,"c":"「基準」18⑴，25","e":"総合原価計算を採用する場合，単一工程とみなした計算では，原価配分の正確性を確保することは困難であるし，責任区分別の原価管理もできない。そこで，単一製品のみを連続生産し，単純総合原価計算を採用する工場においても，工程別総合原価計算を実施することがあり，その場合には部門別計算が必要とされる。"},{"l":2,"m":"工程別総合原価計算","sb":"","r":"(Ｒ４Ⅰ⑤-ウ他複数)","q":"総合原価計算において，製造工程が二以上に連続する工程に分けられ，工程ごとにその工程製品の総合原価を計算する方法を工程別総合原価計算という。工程別総合原価計算の累加法によると，一工程から次工程へ振り替えられた工程製品の総合原価を，前工程費又は原料費として次工程の製造費用に加算する。この場合，工程間に振り替えられる工程製品の計算は，予定原価又は正常原価によることができる。","a":true,"c":"「基準」４⑴-2，25","e":"工程別総合原価計算の方法には累加法と非累加法があるが，「原価計算基準」では，累加法による計算のみを規定している。この点，累加法には，実際原価による完成品原価の振替を通じて，①管理不能な前工程の能率の良否の影響が自工程に混入し，原価業績を純粋に把握できない，②自工程の計算に当たって前工程の計算の終了を待つ必要があり，製品原価の計算が遅延する，という問題がある。そこで，工程間に振り替えられる工程製品の計算について，予定原価又は正常原価を用いることが認められている。"},{"l":3,"m":"工程別総合原価計算","sb":"","r":"(Ｈ26Ⅰ①-エ)","q":"総合原価計算において，製造工程が二以上の連続する工程に分けられ，工程ごとにその工程製品の原価を計算する場合には，一工程から次工程へと振り替えられた工程製品の総合原価を当該工程の完成品として当該工程の勘定に残しておき，次工程に振り替えない。","a":false,"c":"「基準」25","e":"「原価計算基準」では，累加法のみを規定しており，非累加法に関する記述はそもそもない。正しくは「一工程から次工程へ振り替えられた工程製品の総合原価を，前工程費又は原料費として次工程の製造費用に加算する」である。"},{"l":4,"m":"工程別総合原価計算","sb":"","r":"(Ｒ６Ⅱ⑤-イ)","q":"実際原価の計算においては，製造原価は，原則としてその実際発生額を，まず費目別に計算し，次いで原価部門別に計算し，最後に製品別に集計する。総合原価計算においては，一般に，すべての製造原価要素を部門別に計算するが，加工費のみを部門別計算すればよいこともある。","a":true,"c":"「基準」７，18⑴，26","e":"部門に集計する原価要素の範囲は，製品原価の正確な計算及び原価管理の観点から弾力的に決定される。総合原価計算においては，製品原価の正確な計算の観点から，全ての製造原価要素を部門別に計算するのが通常であるが，原価管理の観点から，加工費のみを部門別計算すればよいこともある。前者を全原価要素工程別総合原価計算，後者を加工費工程別総合原価計算(加工費法)という。"},{"l":5,"m":"工程別総合原価計算","sb":"","r":"(Ｈ28Ⅱ⑥-ウ他複数)","q":"工程別総合原価計算において，原料がすべて最初の工程の始点で投入され，その後の工程では，単にこれを加工するにすぎない場合には，各工程別に一期間の加工費を集計し，それに原料費を加算することにより，完成品総合原価を計算する。この方法を加工費工程別総合原価計算という。","a":true,"c":"「基準」26","e":"原料がすべて最初の工程の始点で投入され，その後の工程では，単にこれを加工するにすぎない場合（追加投入原料がない場合）には，原料費について進捗度を考慮する必要がない。そこで，原料費については面倒な工程別計算を省略し，加工費についてのみ工程別計算を適用する方法（加工費工程別総合原価計算）が認められている。"},{"l":6,"m":"工程別総合原価計算","sb":"","r":"(Ｈ22Ⅱ⑨-オ)","q":"加工費工程別総合原価計算は，工程別計算において最終完成品が負担する各加工費を直接計算し，これらを合計して完成品加工費を計算する方法である。","a":false,"c":"「基準」26","e":"加工費工程別総合原価計算（加工費法）とは，原料費については工程別計算を省略して全工程を単一工程とみなして一括的に原価配分を行い，加工費については累加法又は非累加法で工程別計算を行う方法をいう。この点，本肢は原料費の計算に関する記述がない上に，加工費について非累加法による工程別計算を行うことが前提となっており，妥当でない。なお，「原価計算基準」では累加法のみを規定しており，非累加法に関する記述はそもそもない。"},{"l":1,"m":"仕損および減損の処理","sb":"","r":"(Ｈ24Ⅱ⑥-イ)","q":"総合原価計算においては，仕損の費用は，原則として，特別に仕損費の費目を設けたうえで，これをその期の完成品と期末仕掛品とに負担させる。","a":false,"c":"「基準」27","e":"「原価計算基準」では，仕損費の処理方法として，いわゆる度外視法の採用が想定されている。正しくは「特別に仕損費の費目を設けることをしないで…」である。"},{"l":2,"m":"仕損および減損の処理","sb":"","r":"(Ｒ４Ⅱ⑤-エ)","q":"仕損の費用は，原則として，特別に仕損費の費目を設けることをしないで，これをその期の完成品と期末仕掛品とに負担させる。なお，加工中に蒸発，粉散，ガス化，煙化等によって生ずる原料の減損の処理は，原価差異に準ずる。","a":false,"c":"「基準」27","e":"減損の費用は，原則として，特別に減損費の費目を設けることをしないで，これをその期の完成品と期末仕掛品とに負担させる。つまり，正しくは「減損の処理は，仕損に準ずる」であり，仕損と同様に，いわゆる度外視法の採用が想定されている。"},{"l":3,"m":"仕損および減損の処理","sb":"","r":"(Ｈ22Ⅱ⑨-ウ)","q":"正常仕損費の処理を，仕損品の発生時点と仕掛品の進捗度により判断するケースにおいて，仕損が発生する進捗度が期末仕掛品の進捗度よりも高い場合は，度外視法で計算しても，非度外視法によっても，期末仕掛品原価の金額は等しくなる。","a":true,"c":"","e":"正常仕損費の処理に際して進捗度を考慮する場合，期末仕掛品の加工費進捗度よりも仕損の発生時点の加工費進捗度の方が大きければ，度外視法と非度外視法のいずれにおいても完成品のみに仕損費を負担させることになる。したがって，両者の期末仕掛品の金額は等しくなる。"},{"l":4,"m":"仕損および減損の処理","sb":"","r":"(Ｈ28Ⅰ⑥-イ)","q":"正常仕損が工程の終点で発生し，正常仕損費を完成品のみに負担させる場合，度外視法で計算した月末仕掛品原価と非度外視法で計算した月末仕掛品原価は一致する。しかし，正常仕損が工程の始点で発生し，正常仕損費を完成品と月末仕掛品の両者に負担させる場合，度外視法で計算した月末仕掛品原価と非度外視法で計算した月末仕掛品原価は一致しない。","a":false,"c":"","e":"いわゆる定点発生・両者負担の場合，度外視法と非度外視法の計算結果が相違する原因は，正常仕損費中の加工費の負担のさせ方にある。この点，正常仕損が工程始点で発生する場合には，正常仕損費は直接材料費のみからなり，度外視法と非度外視法のいずれにおいても，これを実在量基準で負担させることになる。したがって，両者の月末仕掛品原価は一致する。"},{"l":1,"m":"副産物等の処理と評価","sb":"","r":"(Ｈ29Ⅱ⑤-ア)","q":"副産物で，そのまま外部に売却できるものは，見積売却価額から販売費および一般管理費又は販売費，一般管理費および通常の収益の見積額を控除した額を副産物の価額とする。","a":false,"c":"「基準」28","e":"正しくは「見積売却価額から販売費および一般管理費又は販売費，一般管理費および通常の利益の見積額を控除した額を副産物の価額とする」である。"},{"l":2,"m":"副産物等の処理と評価","sb":"","r":"(Ｈ29Ⅱ⑤-イ)","q":"副産物で，加工の上売却できるものは，加工製品の見積売却価額から加工費，販売費および一般管理費又は加工費，販売費，一般管理費および通常の利益の見積額を控除した額を副産物の価額とする。","a":true,"c":"「基準」28","e":"副産物で加工の上売却できるものは，加工製品の見積売却価額から加工費，販管費(および通常の利益)の見積額を控除することで，価値回収的にその原価を推定する。"},{"l":3,"m":"副産物等の処理と評価","sb":"","r":"(Ｈ29Ⅱ⑤-ウ他複数)","q":"副産物でそのまま自家消費されるものは，これによって節約されるべき物品の見積購入価額を副産物の価額とする。","a":true,"c":"「基準」28","e":"副産物でそのまま自家消費できるものは，自家消費によって節約されるべき物品の見積購入価額をもってその原価とみなすことになる。"},{"l":4,"m":"副産物等の処理と評価","sb":"","r":"(Ｈ29Ⅱ⑤-エ)","q":"副産物で，加工の上自家消費されるものは，これによって節約されるべき物品の見積購入価額から一般管理費の見積額を控除した額を副産物の価額とする。","a":false,"c":"「基準」28","e":"正しくは「これによって節約されるべき物品の見積購入価額から加工費の見積額を控除した額を副産物の価額とする」である。"},{"l":5,"m":"副産物等の処理と評価","sb":"","r":"(Ｒ５Ⅰ⑤-イ他複数)","q":"主産物の製造過程から副産物が生じる場合，一期間の総合原価は副産物にあん分することなく，算定された副産物の価額を控除して主産物の総合原価となる。ただし，副産物が軽微な場合は，当該副産物を売却して得た収入を原価計算外の収益とすることができる。","a":true,"c":"「基準」28","e":"副産物については，主産物と原価のかかり具合が異なるという認識のもとに，主産物の総合原価から価値回収的に計算したその評価額を控除するという間接的な原価計算が想定されている。また，軽微な副産物については，これを売却して得た収入を原価計算外の収益とする更なる簡便法も認められる。"},{"l":6,"m":"副産物等の処理と評価","sb":"","r":"(Ｈ30Ⅱ⑤-エ)","q":"主産物の製造過程から副産物が生じる場合には，その価額を算定して，これを主産物の総合原価から控除する。副産物が軽微な場合には，これを売却して得た収入を主産物の総合原価から控除しなければならない。","a":false,"c":"「基準」28","e":"副産物が軽微な場合には，これを売却して得た収入を原価計算外の収益として処理することが認められる。"},{"l":7,"m":"副産物等の処理と評価","sb":"","r":"(Ｈ22Ⅱ⑨-ア)","q":"総合原価計算において仕損品が生じる場合に，この発生額が軽微であるなら，通常の処理方法ではなく，これを売却して得た収入を原価計算外の収益とすることも「原価計算基準」で認められている。","a":true,"c":"「基準」28","e":"仕損品の処理及び評価は副産物に準じることになっている。したがって，軽微な仕損品は，これを売却して得た収入を原価計算外の収益とすることが認められる。"},{"l":8,"m":"副産物等の処理と評価","sb":"","r":"(Ｈ31Ⅰ⑤-ア)","q":"総合原価計算において仕損品が生じた場合には，その売却収入を原価計算に反映しなければならず，原価計算外の収益とすることはできない。","a":false,"c":"「基準」28","e":"軽微な仕損品は，これを売却して得た収入を，原価計算外の収益とすることができる。"},{"l":1,"m":"連産品の計算","sb":"","r":"(Ｈ26Ⅱ④-エ他複数)","q":"連産品とは，同一工程において同一原料から生産される異種の製品であって，相互に主副を明確に区別できないものをいう。連産品の価額は，連産品の正常市価等を基準として定めた等価係数に基づき，一期間の総合原価を連産品にあん分して計算する。この場合，連産品で加工の上売却できるものについては，加工製品の見積売却価額から加工費の見積額を控除した額をもって，その正常市価とみなし，等価係数算定の基礎とする。","a":true,"c":"「基準」29","e":"連産品は同時必然的に産出される結合生産物であるため，価値移転的原価計算の適用は元来不可能であり，財務諸表作成(棚卸資産価額算定)の見地から，例外的に価値回収的原価計算の適用が認められる。そこで，分離点の正常市価を等価係数として使用するのが通常であるが，加工の上売却できる連産品については，加工製品の見積売却価額マイナス加工費の見積額によって分離点の正常市価とみなすことになる。これは，分離点の売上高の推定であり，原価の推定である副産物の評価とは全く異なる趣旨の計算であることに注意する。"},{"l":2,"m":"連産品の計算","sb":"","r":"(Ｈ28Ⅱ⑥-エ他複数)","q":"連産品とは，同一工程において同一原料から生産される異種の製品であって，相互に主副を明確に区別できないものをいう。連産品の価額は，連産品の正常市価等を基準として定めた現価係数に基づき，一期間の総合原価を連産品にあん分して計算する。","a":false,"c":"「基準」29","e":"正しくは「連産品の正常市価等を基準として定めた等価係数に基づき…」である。なお，現価係数とは，将来のフローを現在価値に換算するための係数をいう。"},{"l":3,"m":"連産品の計算","sb":"","r":"(Ｈ27Ⅰ⑥-ウ)","q":"同一工程から生産される複数製品が連産品の場合，総合原価は，分離点における連産品の正常市価に数量を乗じた金額に基づいてあん分される。分離点以降固有の原価の発生が無く連産品の販売価格が異なる場合，連産品ごとの売上総利益率は同率になる。","a":true,"c":"「基準」29","e":"「原価計算基準」では，連産品について正常市価基準による連結原価の按分を予定している。この場合，連産品を分離後そのまま販売する(追加加工しない)のであれば，売上高を基準に連結原価を按分するのであるから，連産品ごとの売上総利益率は同率となる。"},{"l":4,"m":"連産品の計算","sb":"","r":"(Ｈ30Ⅱ⑤-ウ)","q":"同一工程から生産される複数製品が連産品の場合，総合原価は，分離点における連産品の正常市価に数量を乗じた金額に基づいてあん分される。分離点以降固有の原価の発生がなく連産品の正常市価が異なる場合，連産品ごとの売上総利益率は同じにならない。","a":false,"c":"「基準」29","e":"連結原価の按分を正常市価基準による場合，連産品を分離後そのまま販売する（追加加工しない）のであれば，連産品ごとの売上総利益率は同率となる。"},{"l":5,"m":"連産品の計算","sb":"","r":"(Ｈ27Ⅰ⑥-イ)","q":"同一工程から生産される複数製品が連産品の場合，総合原価は，生産量などの物量尺度を用いて測定した，分離点における連産品の割合に基づいてあん分される。分離点以降固有の原価の発生が無く連産品の販売価格が異なる場合，連産品ごとの売上総利益率は異なることとなる。","a":false,"c":"「基準」29","e":"連産品の連結原価の按分方法は市価法と物量法に大別されるが，「原価計算基準」では正常市価基準による連結原価の按分を予定している。なお，物量法による場合，連産品の販売価格が異なれば，連産品ごとの売上総利益率が異なるという点は正しい。"},{"l":6,"m":"連産品の計算","sb":"","r":"(Ｒ２Ⅰ⑤-ウ他複数)","q":"連産品であるＡ製品とＢ製品を製造している場合に，そのまま外部に売却できるＢ製品の価額を見積売却価額から販売費および一般管理費と通常の利益の見積額を控除した額とし，これを一期間の総合原価から控除した額をもってＡ製品の価額とすることができる。","a":true,"c":"「基準」29","e":"主産物(連産品)と副産物の区別は相対的な売却価値に基づくものであり，固定的でない。そこで，連産品について，主副の区別が比較的明確であるケースを想定し，一部の連産品を副産物に準じて評価した上で，これを一期間の総合原価から控除した額をもって，他の連産品の価額とすることが認められている。"},{"l":7,"m":"連産品の計算","sb":"","r":"(Ｈ28Ⅰ⑥-ウ他複数)","q":"連産品と等級製品はともに同一工程において生産される複数の同種製品である点で共通している。連産品については，複数の製品が必然的に生産され，特定の製品を個別に生産することはできない。この点で連産品は，個別に特定の製品の生産量を決定できる等級製品とは異なっている。","a":false,"c":"「基準」22，29","e":"連産品と等級製品は，同一工程において生産される複数の製品であるという点で共通するが，等級製品が同種製品であるのに対し，連産品は異種製品である。なお，連産品は同時必然的に産出される結合生産物であり，個別生産の可否に関する後半の記述は正しい。"},{"l":8,"m":"連産品の計算","sb":"","r":"(Ｈ31Ⅰ⑤-ウ)","q":"等級別総合原価計算において，必要がある場合には，等級品の一種又は数種の価額を副産物に準じて計算し，これを一期間の総合原価から控除した額をもって他の等級品の価額とすることができる。","a":false,"c":"「基準」29","e":"等級品は連産品や副産物のような結合生産物ではなく，個別生産が可能であるため，価値移転的原価計算の範疇で等価係数を利用した計算が求められており，価値回収的な副産物に準じた計算は認められない。正しくは「連産品の計算において，必要ある場合には，連産品の一種又は数種の価額を副産物に準じて計算し，これを一期間の総合原価から控除した額をもって他の連産品の価額とすることができる」である。"}]},{"n":5,"name":"個別原価計算","qs":[{"l":1,"m":"個別原価計算の特徴","sb":"","r":"(Ｒ４Ⅱ③-ア)","q":"製品別計算を個別原価計算と総合原価計算の２つの基本形態に区別する原理を理解するうえで重要なことは，製造される製品の同質性の程度である。つまり，個別原価計算においては，多数の製品があるときにその全てがカスタム・メイド(custommade)で異質の製品である状況が想定される。異質の製品であるがゆえに，製造費用を各単位に個別に集計する必要が生じる。","a":true,"c":"「原価計算基準」31","e":"個別原価計算は，伝統的に個別受注生産を前提とする製品別計算の形態であり，多数の製品があるときにその全てがカスタム・メイド（和製英語でいうオーダー・メイド）で異質の製品である状況が想定される。この場合，製品１単位ごとに特定製造指図書を発行し，製造費用を各単位に個別に集計する必要が生じる。"},{"l":2,"m":"個別原価計算の特徴","sb":"","r":"(Ｒ４Ⅱ③-イ)","q":"個別原価計算を英語で一般にジョブ・コスティング(jobcosting)という。ここでいうジョブとは，「別個の識別し得る製品ないしサービスを市場に提供するうえで，資源消費の対象となる仕事(task)」を意味する。例えば，船舶メーカーが受注して商業用船舶を製造するとき，その船舶の製造が１つのジョブとなる。","a":true,"c":"「原価計算基準」31","e":"個別原価計算は，特定製造指図書を原価集計単位とする指図書別原価計算であるが，特定製造指図書は，ジョブと呼ばれる仕事ごとに発行される。そのため，英語ではジョブ・コスティングと呼ばれ，ビル建設業であればビル１棟，造船業であれば船舶１隻，機械工業であれば機械１台の製造それ自体が１つのジョブ，つまりは原価集計単位となる。"},{"l":3,"m":"個別原価計算の特徴","sb":"","r":"(Ｈ31Ⅰ③-エ)","q":"個別原価計算は，建築物，船舶，航空機などの有形の製品の製造に限らず，無形の映画やアニメの制作にも適用することができる。","a":true,"c":"「基準」31","e":"個別原価計算の本質は特定指図書を原価集計単位とする「指図書別原価計算」という点にあり，映画やアニメといった無形のソフトウェアの制作にも適用することができる。"},{"l":4,"m":"個別原価計算の特徴","sb":"","r":"(Ｈ19①-オ)","q":"個別原価計算は，建築物，ソフトウェア，船舶などに適用され，特別仕様の製造用機械には適用されない。","a":false,"c":"「基準」31","e":"特別仕様の製造用機械を受注生産ないし自家生産する場合には，特定製造指図書を発行し，個別原価計算を適用する。"},{"l":5,"m":"個別原価計算の特徴","sb":"","r":"(Ｒ２Ⅰ③-ア他複数)","q":"受注に基づき同一年度内に同じ製品を複数製造している場合，個別原価計算を適用することができる。","a":true,"c":"「基準」31","e":"同じ製品を複数製造している場合でも，ロット別に指図書を発行し，指図書別に原価を集計すれば，それは個別原価計算の適用であり，それ自体が可能であることは言うまでもない。"},{"l":6,"m":"個別原価計算の特徴","sb":"","r":"(Ｒ４Ⅱ③-ウ)","q":"個別原価計算を採用する製造活動には，例えば，種類や規格を異にする製品の受注に基づく個別生産や，土木設備工事や建築工事などの請負契約工事は含まれるが，仕様・数量を指定する受注に基づく同一規格製品のロット別生産は含まれない。","a":false,"c":"「基準」31","e":"個別原価計算の採用は，必ずしも個別受注生産に限定されない。つまり，仕様・数量を指定する受注に基づく同一規格製品をロット別に生産する場合でも，ロット別に製造指図書を発行し，個別原価計算を採用する(ロット別個別原価計算)。"},{"l":7,"m":"個別原価計算の特徴","sb":"","r":"(Ｒ３③-イ他複数)","q":"個別原価計算は，種類を異にする製品を連続的に生産する生産形態に適用される。個別原価計算にあっては，特定製造指図書について直接費および間接費を集計し，製品原価は，これを当該指図書に含まれる製品の生産完了時に算定する。","a":false,"c":"「基準」31","e":"連続生産が適合するのは総合原価計算であり，個別原価計算ではない。正しくは「種類を異にする製品を個別的に生産する生産形態に適用する」である。"},{"l":8,"m":"個別原価計算の特徴","sb":"","r":"(Ｈ18③-イ)","q":"個別原価計算は種類を異にする製品を個別的に生産する生産形態に適用すべき方法であり，同種製品を反復連続的に生産する生産形態には適用することができない。","a":false,"c":"「基準」21，31","e":"同種製品を反復連続的に生産する生産形態には単純総合原価計計算を適用すべきであるが，毎月の需要予測に基づき，月次製造指図書を発行するなどすれば，個別原価計算を適用できないわけではない。"},{"l":9,"m":"個別原価計算の特徴","sb":"","r":"(Ｈ28Ⅱ③-ア他複数)","q":"経営の目的とする製品の生産に際してのみでなく，自家用の建物，機械，工具等の製作又は修繕，試験研究，試作，仕損品の補修，仕損による代品の製作等に際しても，これを特定指図書を発行して行なう場合は，個別原価計算の方法によってその原価を算定する。","a":true,"c":"「基準」31","e":"経営の目的とする（会社の本来の販売目的としている）製品の生産に際してのみでなく，自家用の建物，機械，工具等の製作又は修繕，試験研究，試作，仕損品の補修，仕損による代品の製作等に際しても，これを特定指図書を発行して行う場合は，個別原価計算の方法によってその原価を算定する。"},{"l":10,"m":"個別原価計算の特徴","sb":"","r":"(Ｒ２Ⅰ③-エ他複数)","q":"自家用の建物，機械，工具等の製作又は修繕は，経営の目的とする製品の生産ではないため，特定指図書発行の対象とならず，個別原価計算の方法によって原価を算定しない。","a":false,"c":"「基準」31","e":"自家用の建物，機械，工具等の製作又は修繕も特定指図書発行の対象となり，個別原価計算の方法によってその原価を算定する。"},{"l":11,"m":"個別原価計算の特徴","sb":"","r":"(Ｈ25Ⅱ①-ア)","q":"個別原価計算にあっては，特定製造指図書について個別的に直接費および間接費を集計し，製品原価は，これを当該指図書に含まれる製品の引渡完了時に算定する。","a":false,"c":"「基準」31","e":"個別原価計算は受注生産を前提とし，製品の完成と引渡のタイミングはほぼ同じといえるが，引渡完了時に完成品原価を計上するわけではない。正しくは「製品原価は，これを当該指図書に含まれる製品の生産完了時に算定する」である。"},{"l":1,"m":"直接費の賦課","sb":"","r":"(Ｒ５Ⅱ③-ア改他複数)","q":"我が国の「原価計算基準」に照らせば，個別原価計算における直接費は，発生のつど又は定期に整理分類して，これを当該指図書に賦課する。","a":true,"c":"「基準」32","e":"直接費は各指図書に直接跡付けることが可能であるため，これを関連する指図書に賦課する。原価元帳(原価計算表)への記入は，発生の都度行う場合と，定期的に整理分類して行う場合とがある。"},{"l":2,"m":"直接費の賦課","sb":"","r":"(Ｈ28Ⅱ③-イ他複数)","q":"個別原価計算における直接費は，発生のつど又は随時に整理分類して，これを当該指図書に配賦する。","a":false,"c":"「基準」32","e":"正しくは「発生のつど又は定期に整理分類して，これを当該指図書に賦課する」である。"},{"l":3,"m":"直接費の賦課","sb":"","r":"(Ｒ５Ⅰ③-イ改)","q":"直接材料費は，当該指図書に関する実際消費量に，その消費価格を乗じて計算する。また，直接労務費は，当該指図書に関する実際の作業時間又は作業量に，その賃率を乗じて計算する。さらに，直接経費は，原則として当該指図書に関する実際発生額をもって計算する。","a":true,"c":"「基準」32","e":"直接費は原価財の指図書別消費量を経済合理的に測定できる製造原価要素であるため，直接材料費は指図書別の実際消費量，直接労務費は指図書別の実際作業時間に基づき，それぞれ消費価格又は消費賃率を乗じることで計算する。また，直接経費は，予定額をもって計算することもできるが，当該指図書に関する実際発生額をもって計算するのが原則である。"},{"l":4,"m":"直接費の賦課","sb":"","r":"(Ｒ５Ⅰ③-イ改他複数)","q":"自家生産材料の消費価格は，実際原価又は予定価格等をもって計算する。","a":true,"c":"「基準」32","e":"直接材料費の計算において，自家生産材料(自製部品)の消費価格については，実際の原価計算結果に基づく単位原価をもって計算することもできれば，予定価格等をもって計算することもできる。"},{"l":5,"m":"直接費の賦課","sb":"","r":"(Ｒ４Ⅱ③-エ他複数)","q":"我が国の「原価計算基準」に照らせば，個別原価計算における直接費は原則として当該指図書に関する予定発生額をもって賦課し，間接費は原則として予定配賦率をもって各指図書に配賦する。","a":false,"c":"「基準」11⑶，12⑴，32，33⑵","e":"個別原価計算における直接費は，原則として，当該指図書に関する実際発生額をもって賦課する。"},{"l":6,"m":"直接費の賦課","sb":"","r":"(Ｈ23Ⅱ①-ウ)","q":"直接経費は，原則として当該指図書に関する実際発生額をもって計算する。","a":true,"c":"「基準」32⑶","e":"直接経費の計算においても予定価格又は予定額による計算は認められるが，原則的には実際発生額をもって計算する。"},{"l":1,"m":"間接費の配賦","sb":"","r":"(Ｈ31Ⅰ③-ウ他複数)","q":"個別原価計算では正確な製品原価を計算し，原価管理を効果的に実施するために，原則として，直接費を部門毎に把握し，これを適切な配賦基準により各製品の指図書に配賦する。","a":false,"c":"「基準」18⑴，33⑴","e":"個別原価計算では，正確な製品原価を計算し，原価管理を効果的に実施するために，原則として，間接費を部門毎に把握し，これを適切な配賦基準により各製品の指図書に配賦する。"},{"l":2,"m":"間接費の配賦","sb":"","r":"(Ｈ27Ⅱ④-エ他複数)","q":"個別原価計算における間接費は，原則として部門間接費として各指図書に配賦する。間接費は，原則として予定配賦率をもって各指図書に配賦する。","a":true,"c":"「基準」33⑴⑵","e":"個別原価計算における間接費は，原則として部門別計算を実施し，部門間接費として各指図書に配賦することが求められている。また，間接費の計算に実際配賦率を用いれば，製品原価の計算が遅延するだけでなく，実際操業度の増減の影響を受けて配賦率が大きく変動し，製品原価の比較可能性が阻害されるという問題がある。そこで，原則として予定配賦率をもって各指図書に配賦することが求められている。"},{"l":3,"m":"間接費の配賦","sb":"","r":"(Ｈ19①-ア)","q":"個別原価計算では，原価の正確性を確保するために，製造間接費に関しては部門別計算を必ず行う必要がある。","a":false,"c":"「基準」７，33⑴","e":"個別原価計算における間接費は，原則として部門間接費として各指図書に配賦するが，小規模経営においては，部門別計算を省略した単純個別原価計算の適用が認められる。"},{"l":4,"m":"間接費の配賦","sb":"","r":"(Ｈ31Ⅱ③-ア)","q":"製造間接費の総括配賦法とは，工場全体について単一の配賦率を求めて配賦計算を行う方法である。小規模企業では総括配賦法を採用することが認められているが，企業が一定の規模を超えれば，部門別配賦法を採用しなければならない。","a":false,"c":"「基準」７，33⑴","e":"総括配賦法と部門別配賦法は，費用対効果を勘案して企業が任意で選択するものであり，部門別配賦法を採用すべきとする企業規模に関する基準はない。"},{"l":5,"m":"間接費の配賦","sb":"","r":"(Ｈ29Ⅱ③-イ)","q":"製造間接費の実際発生額に基づき製品別に配賦を行うと，製品の実際単位原価が操業度の変動によって著しく変化する。不況時には，一定額発生する固定製造間接費を少量の製品で負担するため，製品の実際単位原価が高くなり，逆に，好況時には，固定製造間接費を多数の製品で負担するため，製品の実際単位原価が低くなる。このため実際発生額に基づく製造間接費の製品別配賦は，好況時と不況時で利益が大きく変動する原因となりうる。","a":true,"c":"","e":"固定製造間接費に焦点を当て，実際配賦の欠陥を説明した文章である。コストベースの価格決定を
